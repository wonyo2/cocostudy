<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Étude｜数学ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --rose:#e8a0ae; --rose-d:#d2788b; --plum:#a9a0c9; --plum-d:#8e83b6;
 --sage:#9ec9b8; --gold:#e0b877; --clay:#dfa38d;
 --ink:#463f4a; --ink2:#6b6472; --ink3:#9a93a2;
 --line:#ece7ee; --line2:#f6f2f7; --card:#fffcfd;
 --bg1:#f7eef1; --bg2:#f0ecf6; --bg3:#eaf3f0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
 background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%);
 background-attachment:fixed;min-height:100vh;padding:12px;display:flex;justify-content:center;
 align-items:flex-start;color:var(--ink);-webkit-font-smoothing:antialiased}
.container{background:var(--card);border-radius:20px;box-shadow:0 16px 44px rgba(140,120,150,.16);
 width:100%;max-width:540px;min-height:calc(100vh - 24px);display:flex;flex-direction:column;
 position:relative;overflow:hidden}

/* ---- ヘッダー ---- */
.header{background:linear-gradient(140deg,#eaaab6 0%,#b9a8d4 58%,#a5bfd0 100%);
 color:#fff;padding:18px 18px 17px;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;right:-46px;top:-56px;width:150px;height:150px;
 background:radial-gradient(circle,rgba(255,255,255,.26),transparent 68%);border-radius:50%;pointer-events:none}
.header.hot{animation:glow .9s ease}
@keyframes glow{50%{box-shadow:inset 0 0 60px rgba(255,240,200,.7)}}
.title{text-align:center;position:relative;z-index:2;margin-bottom:13px;pointer-events:none}
.title b{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;letter-spacing:.1em;
 font-style:italic;display:block;line-height:1.1;text-shadow:0 2px 8px rgba(150,90,120,.22)}
.title small{font-family:'Jost',sans-serif;font-size:9px;font-weight:500;letter-spacing:.34em;
 opacity:.82;display:block;margin-top:5px}
.rank{text-align:center;font-size:11.5px;letter-spacing:.06em;margin-bottom:11px;opacity:.94;
 position:relative;z-index:2;pointer-events:none}
.hud{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;position:relative;z-index:2;pointer-events:none}
.chip{background:rgba(255,255,255,.24);padding:5px 13px;border-radius:16px;font-size:12px;
 letter-spacing:.03em;border:1px solid rgba(255,255,255,.4);font-family:'Jost',sans-serif;font-weight:500}
.chip i{font-style:normal;opacity:.85;margin-right:4px;font-size:10.5px}
.pwrap{margin-top:12px;position:relative;z-index:2;pointer-events:none}
.plabel{display:flex;justify-content:space-between;font-size:10px;margin-bottom:5px;opacity:.88;letter-spacing:.05em}
.pbar{height:6px;background:rgba(255,255,255,.28);border-radius:4px;overflow:hidden}
.pfill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#fff5dc,var(--gold),var(--clay));
 transition:width .7s cubic-bezier(.2,.9,.3,1)}
.icon-btn{position:absolute;top:16px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);
 color:#fff;cursor:pointer;border-radius:11px;font-family:inherit;z-index:20;transition:.2s;line-height:1}
.icon-btn:hover{background:rgba(255,255,255,.4)}
.home{left:16px;font-size:11px;padding:7px 11px;letter-spacing:.04em}
.bk{right:16px;font-size:15px;padding:6px 10px}

/* ---- 本体 ---- */
.main{padding:20px 17px 24px;flex:1;display:flex;flex-direction:column}
.screen{display:none}.screen.show{display:block;animation:fade .34s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sec{font-family:'Jost',sans-serif;font-size:10px;font-weight:500;color:var(--ink3);
 letter-spacing:.2em;margin:0 0 9px 2px;text-transform:uppercase}
.sec:not(:first-child){margin-top:20px}

.gtabs{display:flex;gap:7px}
.gtab{flex:1;padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:12px;
 font-family:inherit;font-size:13px;color:var(--ink2);cursor:pointer;transition:.22s;letter-spacing:.04em}
.gtab.active{background:linear-gradient(135deg,var(--rose),var(--plum));color:#fff;border-color:transparent;
 box-shadow:0 4px 12px rgba(190,150,200,.3)}

.lvsel{display:flex;gap:8px}
.lvbtn{flex:1;padding:11px 6px;border:1px solid var(--line);background:#fff;border-radius:13px;
 font-family:inherit;cursor:pointer;transition:.22s;text-align:center;color:var(--ink)}
.lvbtn b{display:block;font-size:13px;font-weight:500;letter-spacing:.05em}
.lvbtn span{display:block;font-size:9.5px;color:var(--ink3);margin-top:3px;letter-spacing:.02em}
.lvbtn.on{border-color:transparent;color:#fff}
.lvbtn.on span{color:rgba(255,255,255,.86)}
.lvbtn[data-d="1"].on{background:linear-gradient(135deg,#a8cfc2,#8fc3ce);box-shadow:0 4px 12px rgba(150,200,195,.32)}
.lvbtn[data-d="2"].on{background:linear-gradient(135deg,#e2b083,var(--clay));box-shadow:0 4px 12px rgba(220,165,140,.32)}

.rnd{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;cursor:pointer;
 font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;transition:.22s;letter-spacing:.04em}
.rnd:hover{border-color:var(--plum);background:#faf8fc}
.rnd i{font-style:normal;color:var(--plum-d);margin-right:6px}

.modes{display:flex;gap:7px;margin-bottom:13px}
.mode{flex:1;padding:9px 4px;border:1px solid var(--line);background:#fff;border-radius:11px;
 font-family:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.22s;letter-spacing:.05em}
.mode.on{background:var(--ink);color:#fff;border-color:transparent}
.tdesc{font-size:10px;color:var(--ink3);margin-top:4px;line-height:1.5}
.tlist{display:flex;flex-direction:column;gap:7px}
.tbtn{padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;
 text-align:left;transition:.2s;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:inherit}
.tbtn:hover{border-color:var(--rose);background:#fffbfc;transform:translateX(3px)}
.tname{font-size:13.5px;color:var(--ink);letter-spacing:.03em}
.tmeta{font-size:10px;color:var(--ink3);margin-top:4px;font-family:'Jost',sans-serif}
.tright{text-align:right;flex-shrink:0}
.tpct{font-family:'Jost',sans-serif;font-size:12px;color:var(--ink3)}
.mini{width:54px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.minif{height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));width:0}
.mark{font-size:11px;margin-right:5px;opacity:.9}

/* ---- 問題 ---- */
.timecard{background:linear-gradient(140deg,#f6eef2,#eeeaf6);border:1px solid var(--line);
 border-radius:16px;padding:14px 16px;margin-bottom:18px;position:relative;overflow:hidden}
.timecard::after{content:'';position:absolute;right:-24px;top:-30px;width:90px;height:90px;
 background:radial-gradient(circle,rgba(255,255,255,.75),transparent 70%);border-radius:50%}
.tlabel{font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.22em;color:var(--ink3);margin-bottom:5px}
.tbig{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;font-style:italic;
 line-height:1.05;color:var(--ink);position:relative;z-index:2}
.tbig em{font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-style:normal;
 margin:0 2px 0 1px;color:var(--ink2)}
.tsub{font-size:10.5px;color:var(--ink3);margin-top:7px;display:flex;justify-content:space-between;
 position:relative;z-index:2}
.tbar{height:4px;background:#fff;border-radius:3px;overflow:hidden;margin-top:6px;position:relative;z-index:2}
.tfill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--sage),var(--gold),var(--clay));
 transition:width .8s cubic-bezier(.2,.9,.3,1)}
.subbtns{display:flex;gap:8px;margin-bottom:16px}
.subbtn{flex:1;padding:11px 6px;border:1px solid var(--line);background:#fff;border-radius:13px;
 font-family:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.22s;letter-spacing:.04em}
.subbtn:hover{border-color:var(--plum);background:#faf8fc}
.subbtn b{display:block;font-family:'Jost',sans-serif;font-size:15px;color:var(--ink);font-weight:500;margin-bottom:2px}

/* 一覧画面 */
.bbar{display:flex;gap:6px;margin-bottom:11px}
.bchip{flex:1;padding:8px 4px;border:1px solid var(--line);background:#fff;border-radius:10px;
 font-family:inherit;font-size:11.5px;color:var(--ink2);cursor:pointer;transition:.2s;letter-spacing:.03em}
.bchip.on{background:var(--ink);color:#fff;border-color:transparent}
.brow{display:flex;gap:7px;margin-bottom:11px}
.bsel,.bsearch{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
 font-family:inherit;font-size:12.5px;color:var(--ink);background:#fff;min-width:0}
.bsel:focus,.bsearch:focus{outline:none;border-color:var(--plum)}
.bcount{font-family:'Jost',sans-serif;font-size:11px;color:var(--ink3);margin-bottom:10px;letter-spacing:.08em}
.blist{display:flex;flex-direction:column;gap:7px}
.bitem{border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden;transition:.2s}
.bitem:hover{border-color:var(--rose)}
.bhead{padding:12px 14px;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.bno{font-family:'Jost',sans-serif;font-size:10.5px;color:var(--ink3);flex-shrink:0;margin-top:2px;min-width:26px}
.bmain{flex:1;min-width:0}
.bq{font-size:13.5px;line-height:1.65;color:var(--ink)}
.bq .proof{display:none}
.btags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.btag{padding:2px 7px;border-radius:7px;font-size:9.5px;background:var(--line2);color:var(--ink2)}
.btag.e{background:#e8f3ef;color:#5b9483}.btag.b{background:#f9ede6;color:#b87b5c}
.btag.s{background:#fdf0f0;color:#c07a7a}
.bstar{flex-shrink:0;font-size:14px;color:var(--gold);cursor:pointer;padding:0 2px;background:none;border:none}
.bdet{display:none;padding:0 14px 14px;border-top:1px dashed var(--line)}
.bitem.open .bdet{display:block;animation:fade .25s ease}
.bitem.open .bq .proof{display:block}
.bfig{text-align:center;margin:12px 0}
.bfig svg{max-width:210px;height:auto}
.bch{display:flex;gap:8px;align-items:flex-start;padding:6px 9px;border-radius:8px;font-size:12.5px;margin-top:5px;line-height:1.5}
.bch.ok{background:#f0f8f5;color:#3f7a68}
.bch .bl{font-family:'Jost',sans-serif;font-size:10.5px;color:var(--ink3);flex-shrink:0;margin-top:1px}
.bch.ok .bl{color:#5b9483}
.bex{background:#faf9fb;border-radius:9px;padding:10px 12px;margin-top:11px;font-size:12.5px;
 line-height:1.9;color:var(--ink2)}
.bex-h{font-family:'Jost',sans-serif;font-size:9px;color:var(--ink3);letter-spacing:.18em;margin-bottom:5px}
.bempty{text-align:center;padding:40px 12px;color:var(--ink3);font-size:13px;line-height:1.9}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;
 padding-bottom:11px;border-bottom:1px solid var(--line)}
.qnum{font-family:'Jost',sans-serif;font-size:12px;color:var(--ink3);letter-spacing:.08em}
.tags{display:flex;gap:5px;align-items:center}
.tag{padding:3px 9px;border-radius:9px;font-size:10px;letter-spacing:.04em}
.tag.topic{background:var(--line2);color:var(--ink2)}
.tag.cnt{background:#eef1f8;color:#67748c}
.tag.cnt.first{background:#eef7f2;color:#4e8f78}
.btag.n{background:#eef1f8;color:#67748c}
.btag.n0{background:#f6f4f8;color:var(--ink3)}
.fbnote{font-size:11.5px;color:var(--ink3);margin-top:6px}
.tag.tf{background:#f7f0e4;color:#a8823f}
.tag.easy{background:#e8f3ef;color:#5b9483}
.tag.basic{background:#f9ede6;color:#b87b5c}
.qtext{font-size:16.5px;line-height:1.85;margin-bottom:16px}
.figwrap{text-align:center;margin-bottom:16px}
.fig{display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fdfcfe}
.fig svg{max-width:100%;height:auto;display:block}
.proof{background:#faf8fc;border:1px solid #ece5f2;border-left:3px solid var(--plum);border-radius:11px;
 padding:13px 15px;margin-top:12px;font-size:13.5px;line-height:2.1}
.blank{background:#f5e6c8;color:#8a6520;padding:1px 10px;border-radius:5px;display:inline-block;
 min-width:24px;text-align:center;font-size:13px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;
 transition:.16s;font-size:14.5px;line-height:1.6;display:flex;gap:11px;align-items:flex-start;
 font-family:inherit;text-align:left;color:var(--ink);width:100%}
.choice:hover:not(.locked){border-color:var(--rose);background:#fffbfc}
.choice.sel{border-color:var(--plum);background:#f8f5fc}
.choice.locked{cursor:default}
.choice.ok{border-color:var(--sage);background:#f0f8f5}
.choice.ng{border-color:#e8b5b5;background:#fdf4f4}
.clab{width:22px;height:22px;flex-shrink:0;border-radius:50%;background:var(--line2);color:var(--ink3);
 font-family:'Jost',sans-serif;font-size:11.5px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.choice.sel .clab{background:var(--plum);color:#fff}
.choice.ok .clab{background:var(--sage);color:#fff}
.choice.ng .clab{background:#dda5a5;color:#fff}
.btns{display:flex;gap:8px;margin-top:17px}
.btn{padding:13px 18px;border:none;border-radius:13px;cursor:pointer;font-size:13.5px;transition:.22s;
 flex:1;font-family:inherit;letter-spacing:.06em}
.btn-p{background:linear-gradient(135deg,var(--rose),var(--plum));color:#fff;box-shadow:0 5px 14px rgba(200,160,200,.3)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(200,160,200,.4)}
.btn-s{background:#f7f4f8;color:var(--ink2)}
.btn-s:hover{background:#f0ecf2}
.btn-line{background:#06c755;color:#fff;box-shadow:0 5px 14px rgba(6,199,85,.32)}
.btn-line:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(6,199,85,.42)}
.reportbox{width:100%;height:150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
 font-family:'Jost',monospace,sans-serif;font-size:12.5px;line-height:1.7;color:var(--ink);
 background:#faf9fb;resize:none;white-space:pre-wrap}
.container.chuuni .reportbox{background:#150c2b;border-color:var(--line);color:var(--ink)}

.fb{display:none;padding:15px;border-radius:14px;margin-top:16px}
.fb.show{display:block;animation:pop .38s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fb.ok{background:#f3faf7;border:1px solid #cfe8de}
.fb.ng{background:#fdf6f4;border:1px solid #f0d8d2}
.fbtitle{margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px;
 font-size:14px;letter-spacing:.05em}
.fb.ok .fbtitle{color:#4e9180}.fb.ng .fbtitle{color:#c0847a}
.pts{background:linear-gradient(135deg,var(--gold),var(--clay));color:#fff;padding:3px 10px;border-radius:9px;
 font-size:11px;white-space:nowrap;font-family:'Jost',sans-serif;letter-spacing:.04em}
.fbmsg{font-size:13.5px;line-height:1.8;color:var(--ink)}
.ansline{font-size:12.5px;color:var(--ink3);margin-top:5px}
.ansline b{color:#4e9180}
.exp{background:#fff;padding:13px 14px;border-radius:11px;margin-top:12px;font-size:13px;
 line-height:2;color:var(--ink2);border:1px solid var(--line)}
.exp-h{font-family:'Jost',sans-serif;font-size:9.5px;color:var(--ink3);margin-bottom:6px;letter-spacing:.2em}
.tm{background:#faf1dd;padding:1px 6px;border-radius:4px;color:#8a6520}

/* ---- 結果 ---- */
.done{text-align:center;padding:8px 0}
.dico{font-size:46px;margin-bottom:8px;animation:up .6s ease}
@keyframes up{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.stars{font-size:19px;letter-spacing:7px;margin-bottom:13px;color:var(--gold)}
.dtitle{font-size:18px;margin-bottom:7px;letter-spacing:.05em}
.dsub{font-size:12.5px;color:var(--ink3);margin-bottom:19px;line-height:1.7}
.rescard{background:linear-gradient(140deg,#eaaab6,#b9a8d4);color:#fff;padding:18px;border-radius:16px;
 margin-bottom:16px;box-shadow:0 8px 22px rgba(190,150,190,.28)}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12.5px;
 border-bottom:1px solid rgba(255,255,255,.22);letter-spacing:.04em}
.rrow:last-child{border:none}
.rrow strong{font-family:'Jost',sans-serif;font-size:17px;font-weight:500}

/* ---- レベルアップ ---- */
.lvpop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);background:#fff;
 padding:28px 40px;border-radius:20px;text-align:center;box-shadow:0 22px 60px rgba(150,120,160,.4);
 z-index:1000;opacity:0;pointer-events:none;transition:.4s cubic-bezier(.2,1.3,.4,1);border:1px solid var(--line)}
.lvpop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.lvpop h2{font-family:'Jost',sans-serif;font-size:10px;color:var(--ink3);letter-spacing:.32em;margin-bottom:6px}
.lvnum{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:600;line-height:1;font-style:italic;
 background:linear-gradient(135deg,var(--rose-d),var(--plum-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.lvrank{font-size:13px;margin-top:8px;color:var(--ink2);letter-spacing:.06em}

/* ---- ダイアログ ---- */
.ov{position:fixed;inset:0;background:rgba(70,60,75,.34);backdrop-filter:blur(3px);z-index:1100;
 display:none;align-items:center;justify-content:center;padding:24px}
.ov.show{display:flex;animation:fade .22s ease}
.dlg{background:#fff;border-radius:18px;padding:22px 22px 18px;max-width:340px;width:100%;
 box-shadow:0 20px 50px rgba(120,100,130,.3);animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
.dlg-h{font-family:'Jost',sans-serif;font-size:9.5px;letter-spacing:.24em;color:var(--ink3);margin-bottom:9px}
.dlg-b{font-size:14px;line-height:1.9;color:var(--ink);margin-bottom:18px}
.dlg-btns{display:flex;gap:8px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:900}
.flash{position:fixed;inset:0;pointer-events:none;z-index:890;opacity:0;
 background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,245,250,0) 70%)}
.flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* ================= 覚醒モード（厨二病スキン） ================= */
.modesel{display:flex;gap:8px}
.modebtn{flex:1;padding:11px 6px;border:1px solid var(--line);background:#fff;border-radius:13px;
 font-family:inherit;cursor:pointer;transition:.22s;text-align:center;color:var(--ink)}
.modebtn b{display:block;font-size:13px;font-weight:500;letter-spacing:.05em}
.modebtn span{display:block;font-size:9.5px;color:var(--ink3);margin-top:3px}
.modebtn.on{border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(150,120,200,.32)}
.modebtn.on span{color:rgba(255,255,255,.85)}
.modebtn[data-c="0"].on{background:linear-gradient(135deg,#c9a9d6,#9fb8d6)}
.modebtn[data-c="1"].on{background:linear-gradient(135deg,#ff2b6d,#7b2ff7);box-shadow:0 0 18px rgba(255,43,109,.55),0 4px 14px rgba(123,47,247,.5)}

.container.chuuni{--rose:#ff2b6d;--rose-d:#ff2b6d;--plum:#7b2ff7;--plum-d:#9d5cff;
 --sage:#00ffb0;--gold:#ffcc00;--clay:#ff5400;
 --ink:#eae6ff;--ink2:#b7a8e8;--ink3:#8577b8;
 --line:#3a2a66;--line2:#241a49;--card:#0e0820;

<script>
/* ===== 図形生成モジュール =====
   グラフは数式から座標を計算して描くので、線と点が必ず一致する */
const FIG=(()=>{
 const W=260,H=260,O=130,U=26; // 原点(130,130)、1目盛26px
 const px=x=>O+x*U, py=y=>O-y*U;
 function frame(xmin,xmax,ymin,ymax){
  let g='';
  for(let i=Math.ceil(xmin);i<=Math.floor(xmax);i++){if(i===0)continue;g+=`<path d="M${px(i)} ${py(ymax)}V${py(ymin)}"/>`;}
  for(let i=Math.ceil(ymin);i<=Math.floor(ymax);i++){if(i===0)continue;g+=`<path d="M${px(xmin)} ${py(i)}H${px(xmax)}"/>`;}
  return `<g stroke="#e3e6ee" stroke-width="1">${g}</g>`
   +`<path d="M${px(xmin)-8} ${py(0)}H${px(xmax)+8}M${px(0)} ${py(ymax)-8}V${py(ymin)+8}" stroke="#666" stroke-width="1.6"/>`
   +`<text x="${px(xmax)+2}" y="${py(0)+16}" font-size="12" fill="#666">x</text>`
   +`<text x="${px(0)+6}" y="${py(ymax)-10}" font-size="12" fill="#666">y</text>`
   +`<text x="${px(0)-14}" y="${py(0)+16}" font-size="12" fill="#666">O</text>`
   +`<text x="${px(1)-4}" y="${py(0)+16}" font-size="11" fill="#999">1</text>`
   +`<text x="${px(0)-16}" y="${py(1)+4}" font-size="11" fill="#999">1</text>`;
 }
 const wrap=inner=>`<svg viewBox="0 0 ${W} ${H}" width="255" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
 const R=4.6; // 表示範囲

 // 直線 y=ax+b
 function line(a,b,opts={}){
  const xs=[],pts=[];
  for(const x of [-R,R]){const y=a*x+b; pts.push([x,y]);}
  // 範囲外を切り取る
  let seg=clip(a,b);
  if(!seg)return wrap(frame(-R,R,-R,R));
  let s=frame(-R,R,-R,R);
  s+=`<path d="M${px(seg[0][0])} ${py(seg[0][1])}L${px(seg[1][0])} ${py(seg[1][1])}" stroke="${opts.col||'#5b6ee8'}" stroke-width="3" fill="none"/>`;
  (opts.dots||[]).forEach(([x,y,lab])=>{
   s+=`<circle cx="${px(x)}" cy="${py(y)}" r="5" fill="#f87171"/>`;
   if(lab)s+=`<text x="${px(x)+9}" y="${py(y)-7}" font-size="12" fill="#f87171" font-weight="bold">${lab}</text>`;});
  if(opts.label)s+=`<text x="${px(R)-52}" y="${py(a*(R-0.4)+b)-8}" font-size="12" fill="${opts.col||'#5b6ee8'}" font-weight="bold">${opts.label}</text>`;
  return wrap(s);
 }
 function clip(a,b){
  const ps=[];
  for(const x of [-R,R]){const y=a*x+b; if(y>=-R&&y<=R)ps.push([x,y]);}
  if(a!==0)for(const y of [-R,R]){const x=(y-b)/a; if(x>-R&&x<R)ps.push([x,y]);}
  if(ps.length<2)return null;
  return [ps[0],ps[ps.length-1]];
 }
 // 2直線
 function lines(l1,l2,mark){
  let s=frame(-R,R,-R,R);
  [[l1,'#5b6ee8'],[l2,'#8b4fc4']].forEach(([L,c])=>{
   const seg=clip(L[0],L[1]);
   if(seg)s+=`<path d="M${px(seg[0][0])} ${py(seg[0][1])}L${px(seg[1][0])} ${py(seg[1][1])}" stroke="${c}" stroke-width="2.6"/>`;});
  if(mark){const x=(l2[1]-l1[1])/(l1[0]-l2[0]),y=l1[0]*x+l1[1];
   s+=`<circle cx="${px(x)}" cy="${py(y)}" r="6" fill="#f87171"/><text x="${px(x)+9}" y="${py(y)-8}" font-size="12" fill="#f87171" font-weight="bold">交点</text>`;}
  return wrap(s);
 }
 // 放物線 y=ax^2
 function para(a,opts={}){
  let d='',first=true;
  for(let i=-R*10;i<=R*10;i++){const x=i/10,y=a*x*x; if(y<-R-0.2||y>R+0.2)continue;
   d+=(first?'M':'L')+px(x).toFixed(1)+' '+py(y).toFixed(1);first=false;}
  let s=frame(-R,R,-R,R);
  s+=`<path d="${d}" stroke="${opts.col||'#5b6ee8'}" stroke-width="3" fill="none"/>`;
  s+=`<circle cx="${px(0)}" cy="${py(0)}" r="4.5" fill="#f87171"/>`;
  (opts.dots||[]).forEach(([x,lab])=>{const y=a*x*x;
   s+=`<circle cx="${px(x)}" cy="${py(y)}" r="5" fill="#fbbf24"/>`;
   if(lab)s+=`<text x="${px(x)+8}" y="${py(y)-6}" font-size="12" fill="#b45309" font-weight="bold">${lab}</text>`;});
  if(opts.label)s+=`<text x="${px(-R)+6}" y="${py(R)+14}" font-size="13" fill="${opts.col||'#5b6ee8'}" font-weight="bold">${opts.label}</text>`;
  return wrap(s);
 }
 // 双曲線 y=a/x
 function hyp(a,opts={}){
  let s=frame(-R,R,-R,R),d1='',d2='',f1=true,f2=true;
  for(let i=1;i<=R*20;i++){const x=i/20,y=a/x; if(Math.abs(y)>R)continue;
   d1+=(f1?'M':'L')+px(x).toFixed(1)+' '+py(y).toFixed(1);f1=false;}
  for(let i=1;i<=R*20;i++){const x=-i/20,y=a/x; if(Math.abs(y)>R)continue;
   d2+=(f2?'M':'L')+px(x).toFixed(1)+' '+py(y).toFixed(1);f2=false;}
  s+=`<path d="${d1}" stroke="#5b6ee8" stroke-width="3" fill="none"/><path d="${d2}" stroke="#5b6ee8" stroke-width="3" fill="none"/>`;
  (opts.dots||[]).forEach(([x,lab])=>{const y=a/x;
   s+=`<circle cx="${px(x)}" cy="${py(y)}" r="5" fill="#f87171"/>`;
   if(lab)s+=`<text x="${px(x)+8}" y="${py(y)-7}" font-size="12" fill="#f87171" font-weight="bold">${lab}</text>`;});
  if(opts.label)s+=`<text x="${px(1)+18}" y="${py(R)+16}" font-size="13" fill="#5b6ee8" font-weight="bold">${opts.label}</text>`;
  return wrap(s);
 }
 // 点をプロット
 function pts(list){
  let s=frame(-R,R,-R,R);
  list.forEach(([x,y,lab,c])=>{s+=`<circle cx="${px(x)}" cy="${py(y)}" r="6" fill="${c||'#f87171'}"/>`;
   if(lab)s+=`<text x="${px(x)+9}" y="${py(y)-8}" font-size="12" fill="${c||'#f87171'}" font-weight="bold">${lab}</text>`;});
  return wrap(s);
 }
 // 象限ラベル入り
 function quad(list){
  let s=frame(-R,R,-R,R);
  s+=`<text x="${px(2.4)}" y="${py(2.6)}" font-size="12" fill="#bbb">第1象限</text>`
   +`<text x="${px(-4.1)}" y="${py(2.6)}" font-size="12" fill="#bbb">第2象限</text>`
   +`<text x="${px(-4.1)}" y="${py(-2.4)}" font-size="12" fill="#bbb">第3象限</text>`
   +`<text x="${px(2.4)}" y="${py(-2.4)}" font-size="12" fill="#bbb">第4象限</text>`;
  list.forEach(([x,y,lab])=>{s+=`<circle cx="${px(x)}" cy="${py(y)}" r="6" fill="#f87171"/>`
   +`<text x="${px(x)+9}" y="${py(y)-8}" font-size="12" fill="#f87171" font-weight="bold">${lab}</text>`;});
  return wrap(s);
 }
 return {line,lines,para,hyp,pts,quad};
})();
/* ===== 作図モジュール =====
   角度や寸法から頂点座標を計算するので、図と問題文の数値が必ず一致する */
const GEO=(()=>{
 const rad=d=>d*Math.PI/180;
 const wrap=(w,h,inner,vw)=>`<svg viewBox="0 0 ${w} ${h}" width="${vw||Math.min(w,258)}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
 const C={line:'#5b6ee8',fill:'#eef1ff',red:'#e0484d',ylw:'#d97706',grn:'#15803d',pur:'#8b4fc4',gray:'#94a3b8'};

 // 角の弧（頂点V、2方向P1,P2、半径r）
 function arc(V,P1,P2,r,col,lab){
  const a1=Math.atan2(P1[1]-V[1],P1[0]-V[0]), a2=Math.atan2(P2[1]-V[1],P2[0]-V[0]);
  let d=a2-a1; while(d<=-Math.PI)d+=2*Math.PI; while(d>Math.PI)d-=2*Math.PI;
  const sweep=d>0?1:0;
  const s=[V[0]+r*Math.cos(a1),V[1]+r*Math.sin(a1)], e=[V[0]+r*Math.cos(a2),V[1]+r*Math.sin(a2)];
  let out=`<path d="M${s[0].toFixed(1)} ${s[1].toFixed(1)}A${r} ${r} 0 0 ${sweep} ${e[0].toFixed(1)} ${e[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="2"/>`;
  if(lab){const am=a1+d/2, R=r+15;
   out+=`<text x="${(V[0]+R*Math.cos(am)).toFixed(1)}" y="${(V[1]+R*Math.sin(am)+5).toFixed(1)}" font-size="14" fill="${col}" font-weight="bold" text-anchor="middle">${lab}</text>`;}
  return out;
 }
 // 直角記号
 function rt(V,P1,P2,s=13,col=C.line){
  const u1=nrm(V,P1), u2=nrm(V,P2);
  const a=[V[0]+u1[0]*s,V[1]+u1[1]*s], b=[V[0]+u1[0]*s+u2[0]*s,V[1]+u1[1]*s+u2[1]*s], c=[V[0]+u2[0]*s,V[1]+u2[1]*s];
  return `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}L${c[0].toFixed(1)} ${c[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
 }
 function nrm(A,B){const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);return [dx/L,dy/L];}
 // 辺の等しい印
 function tick(A,B,n=1,col=C.red){
  const m=[(A[0]+B[0])/2,(A[1]+B[1])/2], u=nrm(A,B), p=[-u[1],u[0]];
  let o='';
  for(let i=0;i<n;i++){const off=(i-(n-1)/2)*5, c=[m[0]+u[0]*off,m[1]+u[1]*off];
   o+=`<path d="M${(c[0]-p[0]*6).toFixed(1)} ${(c[1]-p[1]*6).toFixed(1)}L${(c[0]+p[0]*6).toFixed(1)} ${(c[1]+p[1]*6).toFixed(1)}" stroke="${col}" stroke-width="2.4"/>`;}
  return o;
 }
 const lbl=(p,t,col='#333',dx=0,dy=0,sz=14)=>`<text x="${(p[0]+dx).toFixed(1)}" y="${(p[1]+dy).toFixed(1)}" font-size="${sz}" fill="${col}" font-weight="600" text-anchor="middle">${t}</text>`;

  const W=270,H=190, A=[45,155], B=[225,155];
  // 頂点C: Aから角A、Bから角B(180-)の直線の交点
  const tA=Math.tan(rad(angA)), tB=Math.tan(rad(angB));
  const cx=(B[0]*tB+A[0]*tA)/(tA+tB), cy=A[1]-(cx-A[0])*tA;
  const Cp=[cx,cy];

  const L=opt.labels||{};
  s+=arc(A,B,Cp,26,C.red,L.a!==undefined?L.a:angA+'°');
  s+=arc(B,Cp,A,26,C.red,L.b!==undefined?L.b:angB+'°');
  s+=arc(Cp,A,B,24,C.red,L.c!==undefined?L.c:(180-angA-angB)+'°');
  if(opt.vertex){s+=lbl(A,'A','#333',-14,6)+lbl(B,'B','#333',14,6)+lbl(Cp,'C','#333',0,-12);}
  if(opt.ext){ // 外角
   const E=[B[0]+55,B[1]];
   s+=`<path d="M${B[0]} ${B[1]}H${E[0]}" stroke="${C.line}" stroke-width="2.5"/>`;

  return wrap(W,H,s);

{i:'a10',g:'1年',t:'正の数と負の数',q:'0 - (-3) = ?',c:['3','-3','0','-6'],a:0,h:'負の数をひくと増えます。',e:'-(-3)は+3になるので0+3=3。「借金を取り消すと財産が増える」とイメージすると分かりやすいです。'},
{i:'a11',g:'1年',t:'正の数と負の数',q:'8 ÷ (-2) = ?',c:['-4','4','-16','-6'],a:0,h:'異符号のわり算です。',e:'異符号のわり算なので答えは負。8÷2=4に-をつけて-4です。'},
{i:'a12',g:'1年',t:'正の数と負の数',q:'(-6) × (-2) ÷ 3 = ?',c:['4','-4','12','-12'],a:0,h:'左から順に計算します。',e:'かけ算とわり算は同じ強さなので左から計算します。(-6)×(-2)=12（同符号で正）、12÷3=4です。'},
{i:'a13',g:'1年',t:'正の数と負の数',q:'(-4) + 6 - 5 = ?',c:['-3','7','-15','5'],a:0,h:'正と負に分けてまとめます。',e:'正の<span class="tm">項</span>は6、負の項は-4と-5で-9。6-9=-3です。'},
{i:'a14',g:'1年',t:'正の数と負の数',q:'(-1/2) × 4 = ?',c:['-2','2','-8','-1/8'],a:0,h:'分数×整数を先に計算します。',e:'1/2×4=2。異符号なので答えは負で-2です。分数でも符号のルールはまったく同じです。'},
{i:'a15',g:'1年',t:'正の数と負の数',q:'(-3)² = ?',c:['9','-9','-6','6'],a:0,h:'(-3)×(-3)です。',e:'指数の2は「2回かける」という意味。(-3)×(-3)は同符号なので正で9です。-3²（かっこなし）だと-9になるので、かっこの有無に注意しましょう。'},
{i:'a16',g:'1年',t:'正の数と負の数',q:'-3² = ?',c:['-9','9','-6','6'],a:0,h:'かっこがない点に注目。',e:'かっこがない-3²は「3²にマイナスをつけたもの」と読みます。3²=9なので-9。(-3)²=9とは答えがちがうので、この2つは必ず区別しましょう。'},
{i:'a17',g:'1年',t:'正の数と負の数',q:'|-8| + |3| = ?',c:['11','5','-5','-11'],a:0,h:'先に絶対値を外します。',e:'<span class="tm">絶対値</span>を先に計算して｜-8｜=8、｜3｜=3。8+3=11です。絶対値は必ず0以上になります。'},
{i:'a18',g:'1年',t:'正の数と負の数',q:'(-12) ÷ (-3) = ?',c:['4','-4','9','-9'],a:0,h:'同符号のわり算です。',e:'同符号のわり算は正になります。12÷3=4です。'},
{i:'a19',g:'1年',t:'正の数と負の数',q:'5 + (-2) - (-3) = ?',c:['6','0','4','-6'],a:0,h:'符号を整理してから計算します。',e:'5-2+3=6です。まず「+(-2)は-2」「-(-3)は+3」と書き直すのがコツです。'},
{i:'a20',g:'1年',t:'正の数と負の数',q:'(-2) × (-3) × (-2) = ?',c:['-12','12','-7','7'],a:0,h:'負の数が何個あるか数えます。',e:'かけ算では負の数の個数が奇数なら答えは負、偶数なら正になります。ここは3個（奇数）なので負。2×3×2=12より-12です。'},
{i:'a21',g:'1年',t:'正の数と負の数',q:'10 ÷ (-5) × 2 = ?',c:['-4','4','-1','1'],a:0,h:'左から順に計算します。',e:'10÷(-5)=-2、-2×2=-4です。かけ算・わり算は左から順に処理します。'},
{i:'a22',g:'1年',t:'正の数と負の数',q:'(-1)⁴ = ?',c:['1','-1','4','-4'],a:0,h:'負の数を4回かけます。',e:'指数が4（偶数）なので答えは正で1です。(-1)は何回かけても絶対値は1のままです。'},
{i:'a23',g:'1年',t:'正の数と負の数',q:'|-7| - |-3| = ?',c:['4','10','-4','-10'],a:0,h:'それぞれ絶対値を外してから引きます。',e:'｜-7｜=7、｜-3｜=3なので7-3=4です。'},
{i:'a24',g:'1年',t:'正の数と負の数',q:'3 × (-2)² = ?',c:['12','-12','36','-36'],a:0,h:'累乗を先に計算します。',e:'計算の順序は「累乗 → かけ算わり算 → たし算ひき算」。(-2)²=4を先に出して、3×4=12です。'},
{i:'a25',g:'1年',t:'正の数と負の数',q:'(-15) ÷ 5 + 2 = ?',c:['-1','1','-5','7'],a:0,h:'わり算が先です。',e:'かけ算・わり算はたし算・ひき算より先。(-15)÷5=-3、-3+2=-1です。'},
{i:'a26',g:'1年',t:'正の数と負の数',q:'6 - (-4) = ?',c:['10','-10','2','-2'],a:0,h:'-(-4)は+4です。',e:'6+4=10です。マイナスが2つ重なるとプラスになります。'},
{i:'a27',g:'1年',t:'正の数と負の数',q:'(-4) × 0 = ?',c:['0','-4','4','-1'],a:0,h:'0をかけるとどうなりますか。',e:'どんな数に0をかけても0です。逆に、0でわることはできない（定義されない）という点もあわせて覚えておきましょう。'},
{i:'a28',g:'1年',t:'正の数と負の数',q:'-3, 0, -5, 2 を小さい順に並べると？',c:['-5, -3, 0, 2','-3, -5, 0, 2','0, 2, -3, -5','2, 0, -3, -5'],a:0,h:'数直線では左にあるほど小さい数です。',e:'負の数は絶対値が大きいほど小さくなります。-5は-3より左にあるので-5＜-3。数直線を思い浮かべると-5, -3, 0, 2の順です。'},
{i:'a29',g:'1年',t:'正の数と負の数',q:'-2と-6ではどちらが大きい？',c:['-2','-6','等しい','比べられない'],a:0,h:'0に近い方が大きい数です。',e:'負の数どうしでは<span class="tm">絶対値</span>が小さいほど大きくなります。-2の方が0に近いので-2＞-6です。'},
{i:'a30',g:'1年',t:'正の数と負の数',q:'2 - 5 + 8 - 3 = ?',c:['2','-2','18','-18'],a:0,h:'正と負に分けてまとめます。',e:'正の項は2+8=10、負の項は-5-3=-8。10-8=2です。'},
{i:'a31',g:'1年',t:'正の数と負の数',q:'(-24) ÷ (-6) ÷ 2 = ?',c:['2','-2','8','-8'],a:0,h:'左から順に処理します。',e:'(-24)÷(-6)=4（同符号で正）、4÷2=2です。'},
{i:'a32',g:'1年',t:'正の数と負の数',q:'-5 の逆数は？',c:['-1/5','5','1/5','-5'],a:0,h:'かけて1になる数が逆数です。',e:'<span class="tm">逆数</span>とは、その数にかけると1になる数のこと。-5×(-1/5)=1なので、-5の逆数は-1/5です。符号はそのまま残ります。'},
{i:'a33',g:'1年',t:'正の数と負の数',q:'12を素因数分解すると？',c:['2² × 3','2 × 6','3 × 4','2 × 3²'],a:0,h:'素数だけのかけ算に分解します。',e:'<span class="tm">素因数分解</span>とは、その数を<span class="tm">素数</span>（1とその数自身しか約数を持たない数。2,3,5,7…）だけのかけ算で表すことです。12=2×2×3なので2²×3と書きます。'},
{i:'a34',g:'1年',t:'正の数と負の数',q:'-2 + (-3) × 4 = ?',c:['-14','-20','10','14'],a:0,h:'かけ算が先です。',e:'(-3)×4=-12を先に計算し、-2+(-12)=-14です。左から順ではなく、かけ算を優先する点に注意しましょう。'},
{i:'a35',g:'1年',t:'正の数と負の数',q:'(-3) × (-3) × (-3) × (-3) = ?',c:['81','-81','12','-12'],a:0,h:'負の数が何個ありますか。',e:'負の数が4個（偶数個）なので答えは正。3×3×3×3=81で81です。'},

// ===== 中1 文字と式 (40) =====
{i:'b1',g:'1年',t:'文字と式',q:'a = 2 のとき、3a + 1 = ?',c:['7','5','9','31'],a:0,h:'aのところに2を入れます。',e:'文字に数を入れることを<span class="tm">代入</span>といいます。3a は 3×a のことなので、3×2+1=7です。'},
{i:'b2',g:'1年',t:'文字と式',q:'2a + 3a = ?',c:['5a','6a','5a²','23a'],a:0,h:'同じ文字どうしはまとめられます。',e:'文字の部分が同じ項を<span class="tm">同類項</span>といい、<span class="tm">係数</span>（文字の前の数）どうしをたしてまとめます。(2+3)a=5aです。'},
{i:'b3',g:'1年',t:'文字と式',q:'4b - b = ?',c:['3b','4','5b','3'],a:0,h:'bは1bと考えます。',e:'bの係数は1です。4b-1b=(4-1)b=3b。文字が消えるわけではない点に注意しましょう。'},
{i:'b4',g:'1年',t:'文字と式',q:'2x + 5 + 3x + 1 を簡単にすると？',c:['5x + 6','5x + 5','8x + 1','11x'],a:0,h:'文字の項と数の項を別々にまとめます。',e:'<span class="tm">同類項</span>どうしだけがまとめられます。文字の項は2x+3x=5x、数の項は5+1=6。xと数はまとめられないので5x+6が答えです。'},
{i:'b5',g:'1年',t:'文字と式',q:'6a ÷ 2 = ?',c:['3a','12a','4a','3'],a:0,h:'係数だけをわります。',e:'6a÷2は係数の6だけを2でわって3a。文字はそのまま残ります。'},
{i:'b6',g:'1年',t:'文字と式',q:'x = 3, y = 2 のとき、2x + 3y = ?',c:['12','10','13','36'],a:0,h:'それぞれ代入します。',e:'2×3+3×2=6+6=12です。文字が2つあっても<span class="tm">代入</span>のやり方は同じです。'},
{i:'b7',g:'1年',t:'文字と式',q:'a × 5 の正しい書き方は？',c:['5a','a5','5×a','a・5'],a:0,h:'数を前に書くのが決まりです。',e:'文字式では×を省略し、<span class="tm">係数</span>（数）を文字の前に書きます。よって5aです。'},
{i:'b8',g:'1年',t:'文字と式',q:'a ÷ 3 を分数で書くと？',c:['a/3','3/a','3a','a-3'],a:0,h:'わり算は分数で表します。',e:'文字式ではわり算の記号÷を使わず分数の形で書きます。a÷3=a/3です。'},
{i:'b9',g:'1年',t:'文字と式',q:'2a + b - a + 3b を簡単にすると？',c:['a + 4b','3a + 4b','a + 2b','ab + 4'],a:0,h:'aどうし、bどうしをまとめます。',e:'aの項は2a-a=a、bの項はb+3b=4b。aとbは<span class="tm">同類項</span>ではないのでまとめられず、a+4bが答えです。'},
{i:'b10',g:'1年',t:'文字と式',q:'x = -2 のとき、3x + 5 = ?',c:['-1','11','1','-11'],a:0,h:'負の数を代入します。',e:'3×(-2)+5=-6+5=-1です。負の数を代入するときはかっこをつけて書くとミスが減ります。'},
{i:'b11',g:'1年',t:'文字と式',q:'(-2a) × 3 = ?',c:['-6a','6a','-2a³','-5a'],a:0,h:'係数どうしをかけます。',e:'(-2)×3=-6なので-6aです。'},
{i:'b12',g:'1年',t:'文字と式',q:'8x ÷ (-2) = ?',c:['-4x','4x','-16x','-6x'],a:0,h:'係数を異符号でわります。',e:'8÷(-2)=-4なので-4xです。'},
{i:'b13',g:'1年',t:'文字と式',q:'5x - 3y - 2x + y を簡単にすると？',c:['3x - 2y','3x + 2y','7x - 2y','x'],a:0,h:'xの項とyの項に分けます。',e:'xの項は5x-2x=3x、yの項は-3y+y=-2y。答えは3x-2yです。'},
{i:'b14',g:'1年',t:'文字と式',q:'a = 4 のとき、a² - 2a = ?',c:['8','0','12','4'],a:0,h:'a²は a×a です。',e:'4²=16、2×4=8なので16-8=8です。<span class="tm">累乗</span>を先に計算します。'},
{i:'b15',g:'1年',t:'文字と式',q:'2(x + 3) を展開すると？',c:['2x + 6','2x + 3','x + 6','2x + 5'],a:0,h:'かっこの中の全部にかけます。',e:'かっこの外の数をかっこの中のすべての項にかけることを<span class="tm">分配法則</span>といいます。2×x+2×3=2x+6です。3にかけ忘れるミスが多いので注意。'},
{i:'b16',g:'1年',t:'文字と式',q:'3(2a - 1) を展開すると？',c:['6a - 3','6a - 1','5a - 3','6a + 3'],a:0,h:'分配法則を使います。',e:'3×2a=6a、3×(-1)=-3なので6a-3です。'},
{i:'b17',g:'1年',t:'文字と式',q:'(x + 2) + (3x - 1) を簡単にすると？',c:['4x + 1','4x + 3','4x - 1','3x + 1'],a:0,h:'かっこを外してまとめます。',e:'+のかっこはそのまま外せます。x+2+3x-1=4x+1です。'},
{i:'b18',g:'1年',t:'文字と式',q:'(2a - 3) - (a + 1) を簡単にすると？',c:['a - 4','a - 2','3a - 4','a + 2'],a:0,h:'-のかっこは中の符号が全部変わります。',e:'かっこの前が-のときは、中のすべての項の符号を反対にして外します。2a-3-a-1=a-4です。+1が-1になる点がポイント。'},
{i:'b19',g:'1年',t:'文字と式',q:'(-2)(a - 3) を展開すると？',c:['-2a + 6','-2a - 6','2a + 6','-2a + 3'],a:0,h:'負の数を分配します。',e:'(-2)×a=-2a、(-2)×(-3)=+6なので-2a+6。後ろの符号が+に変わることに注意しましょう。'},
{i:'b20',g:'1年',t:'文字と式',q:'a = 2, b = 3 のとき、3a - 2b = ?',c:['0','12','-12','6'],a:0,h:'それぞれ代入します。',e:'3×2-2×3=6-6=0です。'},
{i:'b21',g:'1年',t:'文字と式',q:'x = -1 のとき、x² + 2x + 1 = ?',c:['0','4','2','-2'],a:0,h:'(-1)²は1です。',e:'(-1)²=1、2×(-1)=-2なので1-2+1=0です。'},
{i:'b22',g:'1年',t:'文字と式',q:'5a - 2a + a = ?',c:['4a','6a','3a','8a'],a:0,h:'係数をすべてまとめます。',e:'(5-2+1)a=4aです。最後のaの係数が1であることを忘れないようにしましょう。'},
{i:'b23',g:'1年',t:'文字と式',q:'2(3x - 2) - (x - 4) = ?',c:['5x','5x - 8','7x - 8','5x + 8'],a:0,h:'展開してからまとめます。',e:'6x-4-x+4=5x。-(x-4)は-x+4になります。数の項が消えて5xだけが残ります。'},
{i:'b24',g:'1年',t:'文字と式',q:'a × b × 2 の正しい書き方は？',c:['2ab','ab2','2×ab','a2b'],a:0,h:'数を先、文字はアルファベット順。',e:'文字式は「数 → 文字（ふつうアルファベット順）」の順に書くのが決まりです。よって2abです。'},
{i:'b25',g:'1年',t:'文字と式',q:'3(2x + 1) - (x - 2) = ?',c:['5x + 5','5x + 1','7x + 5','5x - 1'],a:0,h:'2か所とも展開します。',e:'6x+3-x+2=5x+5です。'},
{i:'b26',g:'1年',t:'文字と式',q:'1個 x 円のパンを3個買ったときの代金は？',c:['3x 円','x/3 円','x + 3 円','3 + x 円'],a:0,h:'代金 = 単価 × 個数',e:'1個x円を3個なのでx×3=3x円です。文章を文字式に直す力は方程式の文章題でも必ず使います。'},
{i:'b27',g:'1年',t:'文字と式',q:'時速 a km で 3 時間進んだときの道のりは？',c:['3a km','a/3 km','a + 3 km','3/a km'],a:0,h:'道のり = 速さ × 時間',e:'速さ×時間=道のりなのでa×3=3a kmです。この3つの関係（道のり・速さ・時間）は必ず覚えましょう。'},
{i:'b28',g:'1年',t:'文字と式',q:'x 円の品物を 20% 引きで買ったときの代金は？',c:['0.8x 円','0.2x 円','x - 20 円','1.2x 円'],a:0,h:'20%引きは全体の80%を払います。',e:'20%引きは「もとの値段の80%を払う」という意味。80%=0.8なので0.8x円です。'},
{i:'b29',g:'1年',t:'文字と式',q:'2x + 3 の項は？',c:['2x と 3','2 と x と 3','2x のみ','x と 3'],a:0,h:'+で区切られたかたまりが項です。',e:'<span class="tm">項</span>とは、式を+で区切ったときの1つ1つのかたまりです。2x+3の項は2xと3の2つ。2xの<span class="tm">係数</span>は2です。'},
{i:'b30',g:'1年',t:'文字と式',q:'-x + 4 の x の係数は？',c:['-1','1','4','-4'],a:0,h:'-x は -1×x のことです。',e:'-xは-1×xを省略した形なので、<span class="tm">係数</span>は-1です。符号も係数の一部だと考えます。'},
{i:'b31',g:'1年',t:'文字と式',q:'(6x + 9) ÷ 3 = ?',c:['2x + 3','2x + 9','6x + 3','2x'],a:0,h:'両方の項をわります。',e:'6x÷3=2x、9÷3=3なので2x+3。片方だけわるミスが多いので、すべての項をわることを意識しましょう。'},
{i:'b32',g:'1年',t:'文字と式',q:'x/2 + x/3 = ?',c:['5x/6','2x/5','x/5','5x/5'],a:0,h:'分母を6にそろえます。',e:'<span class="tm">通分</span>して3x/6+2x/6=5x/6です。分母をそろえてから分子どうしをたします。'},
{i:'b33',g:'1年',t:'文字と式',q:'a = -3 のとき、-2a = ?',c:['6','-6','-5','5'],a:0,h:'負×負は正です。',e:'-2×(-3)=6です。'},
{i:'b34',g:'1年',t:'文字と式',q:'縦 a cm、横 b cm の長方形の周の長さは？',f:['rectLabeled',['a','b']],c:['2(a + b) cm','ab cm','a + b cm','2ab cm'],a:0,h:'周は4辺の合計です。',e:'縦2本と横2本の合計なのでa+a+b+b=2a+2b=2(a+b)cmです。面積のab cm²とまちがえないようにしましょう。'},
{i:'b35',g:'1年',t:'文字と式',q:'5x - (2x - 7) = ?',c:['3x + 7','3x - 7','7x - 7','3x'],a:0,h:'-のかっこの外し方に注意。',e:'5x-2x+7=3x+7です。-7が+7に変わります。'},
{i:'b36',g:'1年',t:'文字と式',q:'12a ÷ 4 - 2a = ?',c:['a','3a','5a','-a'],a:0,h:'わり算が先です。',e:'12a÷4=3a、3a-2a=a（係数1）です。'},
{i:'b37',g:'1年',t:'文字と式',q:'a = 1/3 のとき、6a = ?',c:['2','6','18','1/2'],a:0,h:'6×(1/3)を計算します。',e:'6×1/3=6/3=2です。分数の代入も同じ手順です。'},

{i:'P39',g:'2年',t:'連立方程式',q:'「昨年の生徒数は男女合わせて500人。今年は男子が5%増え女子が3%減り、全体で4人増えた」増減の式は？',c:['0.05x - 0.03y = 4','0.05x + 0.03y = 4','1.05x + 0.97y = 4','x + y = 4'],a:0,h:'増えた分と減った分の差が4です。',e:'男子は+0.05x人、女子は-0.03y人。合計の変化が+4なので0.05x-0.03y=4。もう1本はx+y=500です。<span class="tm">増減だけ</span>を式にするのがコツです。'},
{i:'P40',g:'2年',t:'連立方程式',q:'「A地点からB地点まで、上り坂を時速3km、下り坂を時速5kmで歩き2時間かかった」上り坂の道のりをx、下り坂をyとすると時間の式は？',c:['x/3 + y/5 = 2','3x + 5y = 2','x/3 = y/5','3x/5 = 2'],a:0,h:'それぞれの時間をたします。',e:'x/3+y/5=2です。道のりの合計がわかっていれば、それがもう1本の式になります。'},

{i:'Q2',g:'2年',t:'三角形と四角形',q:'証明の（ア）に入るのは？<div class="proof">△ABCと△DEFにおいて<br>AB＝DE …①<br>∠B＝∠E …②<br>∠C＝∠F …③<br>①②③より <span class="blank">ア</span> がそれぞれ等しいので<br>△ABC≡△DEF</div>',c:['1辺とその両端の角','2辺とその間の角','3辺','2角'],a:0,h:'辺BCの両端の角はどれですか。',e:'辺ABの両端の角∠Aと∠Bではなく、ここでは辺ABと∠B・∠Cが与えられています。∠A＝∠Dも導けるため「<span class="tm">1辺とその両端の角</span>」の条件が使えます。'},
{i:'Q3',g:'2年',t:'三角形と四角形',q:'証明の（ア）に入る根拠は？<div class="proof">二等辺三角形ABC（AB＝AC）で、頂角の二等分線とBCの交点をMとする<br>△ABMと△ACMにおいて<br>仮定より AB＝AC …①<br>仮定より ∠BAM＝∠CAM …②<br><span class="blank">ア</span> より AM＝AM …③</div>',f:['isosceles',[{note:'AB＝AC'}]],c:['共通な辺だから','平行だから','対頂角だから','仮定より'],a:0,h:'AMは両方の三角形に含まれます。',e:'AMは2つの三角形が<span class="tm">共通に持つ辺</span>なので「共通」と書きます。証明で非常によく使う根拠です。'},

{i:'Q6',g:'2年',t:'三角形と四角形',q:'証明の（ア）に入る合同条件は？<div class="proof">平行四辺形ABCDで対辺が等しいことを証明する<br>△ABCと△CDAにおいて<br>AB∥DCの錯角より ∠BAC＝∠DCA …①<br>AD∥BCの錯角より ∠ACB＝∠CAD …②<br>AC＝CA（共通）…③<br>①②③より <span class="blank">ア</span> がそれぞれ等しいので<br>△ABC≡△CDA<br>よって AB＝CD、BC＝DA</div>',c:['1辺とその両端の角','2辺とその間の角','3辺','斜辺と1つの鋭角'],a:0,h:'①③②の並びを見ます。',e:'辺ACの両端の角が①②なので「<span class="tm">1辺とその両端の角</span>」です。これで平行四辺形の対辺が等しいことが証明できます。'},

{i:'Q17',g:'2年',t:'三角形と四角形',q:'証明の（ア）に入る語句は？<div class="proof">△ABC≡△DEF が示せたとき<br><span class="blank">ア</span> は等しいので<br>AC＝DF、∠B＝∠E</div>',c:['合同な図形の対応する辺と角','面積','周の長さ','対角線'],a:0,h:'合同から何が言えますか。',e:'<span class="tm">合同な図形の対応する辺と角</span>はすべて等しくなります。これが合同を示す目的そのものです。'},
{i:'Q18',g:'2年',t:'三角形と四角形',q:'合同を示したあと、結論として辺の長さが等しいことを述べる順序は？',c:['合同を示す→対応する辺が等しい→結論','結論→合同を示す','対応を先に書く','順序は自由'],a:0,h:'根拠から結論へ進みます。',e:'合同を示してから「合同な図形の対応する辺は等しい」を根拠に結論を述べます。<span class="tm">根拠→結論</span>の順を守ります。'},
{i:'Q19',g:'2年',t:'三角形と四角形',q:'証明の（ア）に入るのは？<div class="proof">正三角形ABCで、辺BC上に点D、辺CA上に点EをBD＝CEとなるようにとる<br>△ABDと△BCEにおいて<br>正三角形だから AB＝BC …①<br>仮定より BD＝CE …②<br>正三角形の角だから ∠ABD＝<span class="blank">ア</span>＝60° …③</div>',c:['∠BCE','∠BAD','∠ADB','∠AEB'],a:0,h:'△BCEの中で対応する角です。',e:'∠BCEです。正三角形の内角はすべて60°なので等しいといえます。①②③より2辺とその間の角が等しく合同が示せます。'},
{i:'Q20',g:'2年',t:'三角形と四角形',q:'証明を書くときにしてはいけないことは？',c:['図の見た目だけで等しいと決めること','仮定を書くこと','合同条件を明示すること','共通の辺を使うこと'],a:0,h:'根拠が必要です。',e:'見た目は根拠になりません。<span class="tm">定義・仮定・定理</span>のいずれかを根拠として示す必要があります。'},

{i:'Q21',g:'3年',t:'二次方程式',q:'「縦が横より4cm長い長方形の面積が45cm²」何をxとおく？',f:['rectLabeled',['x+4','x']],c:['横の長さ','面積','周の長さ','対角線'],a:0,h:'基準になる方を文字にします。',e:'横をxとすると縦はx+4。面積の式x(x+4)=45が立てられます。<span class="tm">短い方を基準</span>にすると式が作りやすくなります。'},
{i:'Q22',g:'3年',t:'二次方程式',q:'「縦が横より4cm長い長方形の面積が45cm²」横をxとすると方程式はx(x+4)=45。これを整理した形は？',f:['rectLabeled',['x+4','x']],c:['x² + 4x - 45 = 0','x² + 4x + 45 = 0','x² - 4x - 45 = 0','x² = 45'],a:0,h:'右辺を0にします。',e:'x²+4x=45より x²+4x-45=0。(x+9)(x-5)=0よりx=5, -9。長さは正なのでx=5cmです。'},
{i:'Q23',g:'3年',t:'二次方程式',q:'「縦が横より4cm長い長方形の面積が45cm²」を解くと、横の長さxはx=5とx=-9が得られた。x=-9を答えにしない理由は？',f:['rectLabeled',['x+4','x']],c:['長さは正でなければならないから','計算が違うから','式が違うから','2つ解があるから'],a:0,h:'解の吟味です。',e:'長さに負の値はありえないため除きます。この確認が<span class="tm">解の吟味</span>です。'},
{i:'Q24',g:'3年',t:'二次方程式',q:'「連続する2つの正の整数の積が72」小さい方をxとすると式は？',c:['x(x + 1) = 72','x(x + 2) = 72','x + (x+1) = 72','2x = 72'],a:0,h:'連続する整数は1違いです。',e:'x(x+1)=72よりx²+x-72=0、(x+9)(x-8)=0。正の整数なのでx=8です。'},
{i:'Q25',g:'3年',t:'二次方程式',q:'「幅1mの道を畑につけたとき、残りの面積が…」という問題で有効な考え方は？',c:['道を端に寄せて考える','道を無視する','面積を2倍する','周の長さで考える'],a:0,h:'図を動かしても面積は変わりません。',e:'道を端に寄せると残りが1つの長方形にまとまり、式が簡単になります。<span class="tm">図の等積変形</span>を使う典型的な工夫です。'},
{i:'Q26',g:'3年',t:'二次方程式',q:'「縦10m横15mの畑に幅xmの道をつけ、残りが126m²」残りの部分の式は？',f:['rectLabeled',['18m','12m']],c:['(10 - x)(15 - x) = 126','10 × 15 - x = 126','(10 + x)(15 + x) = 126','10x + 15x = 126'],a:0,h:'道を端に寄せると縦横がそれぞれ縮みます。',e:'(10-x)(15-x)=126です。展開してx²-25x+24=0、(x-1)(x-24)=0よりx=1m（24は畑より大きく不適）です。'},
{i:'Q27',g:'3年',t:'二次方程式',q:'解き方の空欄に入るのは？<div class="proof">「ある正の数xを2乗した数は、もとの数の3倍より10大きい」<br>式にすると x² ＝ <span class="blank">ア</span><br>整理して x² - 3x - 10 = 0<br>(x-5)(x+2)=0 より x = 5</div>（ア）は？',c:['3x + 10','3x - 10','10x + 3','3(x + 10)'],a:0,h:'「3倍より10大きい」を式にします。',e:'3x+10です。「〜より…大きい」は<span class="tm">たし算</span>で表します。'},

{i:'Q29',g:'3年',t:'相似な図形',q:'「木の高さを影の長さから求める」とき、使う考え方は？',f:['similarPair',[]],c:['三角形の相似','三平方の定理','円周角の定理','合同条件'],a:0,h:'太陽光は平行です。',e:'木と影の三角形、棒と影の三角形が<span class="tm">相似</span>になるので、比の式で高さが求められます。'},
{i:'P58',g:'3年',t:'相似な図形',q:'「棒1.2mの影が1.5m、木の影が10m」木の高さxを求める比例式は？',f:['similarPair',[]],c:['1.2 : 1.5 = x : 10','1.2 : 10 = x : 1.5','1.5 : 1.2 = x : 10','x : 1.2 = 1.5 : 10'],a:0,h:'（高さ）：（影）でそろえます。',e:'1.2:1.5=x:10より1.5x=12、x=8m。<span class="tm">対応する辺どうし</span>を同じ順に並べるのが比例式の作り方です。'},
{i:'Q30',g:'3年',t:'相似な図形',q:'相似な2つの図形で、面積が分かっているとき辺の比を求めるには？',c:['面積比の平方根をとる','面積比をそのまま使う','面積比を2倍する','面積比を3乗する'],a:0,h:'面積比は相似比の2乗です。',e:'面積比が9:16なら、辺の比（相似比）はその<span class="tm">平方根</span>で3:4です。'},

{i:'Q32',g:'3年',t:'三平方の定理',q:'「円の弦の長さを求める」とき、作るとよい直角三角形は？',f:['chord',[5,3]],c:['半径・中心から弦への垂線・弦の半分','直径と弦','2本の弦','接線と半径'],a:0,h:'中心から弦に垂線を引きます。',e:'中心から弦への垂線は弦を<span class="tm">2等分</span>するので、半径を斜辺とする直角三角形ができます。'},

{i:'Q41',g:'3年',t:'式の展開と因数分解',q:'「連続する2つの奇数の積に1を加えると4の倍数になる」を証明するとき、2つの奇数の表し方は？',c:['2n-1 と 2n+1','n と n+1','2n と 2n+2','n と n+2'],a:0,h:'奇数は2n±1で表します。',e:'2n-1と2n+1とおくと積は4n²-1、1を加えて4n²=4×n²となり<span class="tm">4の倍数</span>と示せます。'},

{i:'Q43',g:'3年',t:'平方根',q:'「面積が50cm²の正方形の1辺」を求めるときの式と答えは？',c:['x² = 50、x = 5√2','x = 50/2 = 25','x² = 50、x = ±5√2','2x = 50'],a:0,h:'長さは正の値だけです。',e:'x²=50よりx=±√50=±5√2ですが、長さは正なので<span class="tm">5√2 cm</span>だけが答えです。'},
{i:'Q44',g:'3年',t:'二次方程式',q:'「1辺xcmの正方形の各辺を2cmずつ長くしたら面積が49cm²」の式は？',c:['(x + 2)² = 49','x² + 2 = 49','x² + 4 = 49','2x² = 49'],a:0,h:'各辺がx+2になります。',e:'(x+2)²=49よりx+2=±7。長さなのでx+2=7、x=5cmです。'},

{i:'R2',g:'2年',t:'三角形と四角形',q:'（ア）に入る合同条件は？<div class="proof">二等辺三角形ABC（AB＝AC）で、底辺BCの中点をMとする<br>△ABMと△ACMにおいて<br>AB＝AC …①<br>BM＝CM（Mは中点）…②<br>AM＝AM（共通）…③<br>①②③より <span class="blank">ア</span> がそれぞれ等しいので<br>△ABM≡△ACM<br>よって ∠BAM＝∠CAM</div>',f:['isosceles',[{note:'AB＝AC、Mは中点'}]],c:['3辺','2辺とその間の角','1辺とその両端の角','2角'],a:0,h:'①②③はすべて辺の条件です。',e:'与えられた3つがすべて辺なので「<span class="tm">3辺がそれぞれ等しい</span>」を使います。この結果、頂点から中点に引いた線は頂角を2等分すると分かります。'},
{i:'R3',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">二等辺三角形の底角が等しいことの証明<br>△ABC（AB＝AC）で∠Aの二等分線とBCの交点をDとする<br>△ABDと△ACDにおいて<br>AB＝AC（仮定）…①<br>∠BAD＝∠CAD（仮定）…②<br>AD＝AD（<span class="blank">ア</span>）…③<br>2辺とその間の角がそれぞれ等しいので △ABD≡△ACD<br>よって ∠B＝∠C</div>',f:['isosceles',[{note:'AB＝AC'}]],c:['共通','平行','対頂角','錯角'],a:0,h:'ADは両方の三角形にあります。',e:'ADは2つの三角形が共有する辺なので「<span class="tm">共通</span>」と書きます。証明で最もよく使う根拠の1つです。'},
{i:'R4',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">△ABCで∠B＝∠Cならば二等辺三角形であることの証明<br>∠Aの二等分線とBCの交点をDとする<br>△ABDと△ACDにおいて<br>∠B＝∠C（仮定）…①<br>∠BAD＝∠CAD（仮定）…②<br>①②と三角形の内角の和より ∠ADB＝<span class="blank">ア</span> …③<br>AD＝AD（共通）…④</div>',c:['∠ADC','∠BAD','∠B','∠BAC'],a:0,h:'残った角どうしを比べます。',e:'2組の角が等しければ残りの角も等しくなるので∠ADB＝∠ADCです。①③④より1辺とその両端の角が等しく合同が示せます。'},
{i:'R5',g:'2年',t:'三角形と四角形',q:'（ア）に入る結論は？<div class="proof">正三角形ABCの辺BC、CA上にBD＝CEとなる点D、Eをとる<br>△ABDと△BCEにおいて<br>正三角形だから AB＝BC …①<br>仮定より BD＝CE …②<br>正三角形の内角だから ∠ABD＝∠BCE＝60° …③<br>①②③より2辺とその間の角がそれぞれ等しいので<br><span class="blank">ア</span></div>',c:['△ABD≡△BCE','△ABD≡△BEC','△ABD∽△BCE','△ABC≡△BCE'],a:0,h:'対応する頂点の順に書きます。',e:'AとB、BとC、DとEが対応するので△ABD≡△BCEです。<span class="tm">対応する順序</span>で書くのが決まりです。'},

// ===== 証明の穴埋め: 平行四辺形 =====
{i:'R6',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">平行四辺形ABCDで対辺が等しいことの証明<br>対角線ACを引く<br>△ABCと△CDAにおいて<br>AB∥DCより錯角が等しいので ∠BAC＝∠DCA …①<br>AD∥BCより錯角が等しいので ∠<span class="blank">ア</span>＝∠CAD …②<br>AC＝CA（共通）…③</div>',f:['parallelogram',[{diag:true}]],c:['ACB','ABC','BCA の逆','DAC'],a:0,h:'AD∥BCで、ACが横切ってできる錯角です。',e:'AD∥BCに直線ACが交わるので∠ACB＝∠CADが錯角として等しくなります。①②③より1辺とその両端の角が等しく合同です。'},
{i:'R7',g:'2年',t:'三角形と四角形',q:'（ア）に入る結論は？<div class="proof">平行四辺形ABCDの対角線ACを引くと、△ABC≡△CDA が証明できる<br>合同な図形の対応する辺は等しいので<br><span class="blank">ア</span></div>',f:['parallelogram',[{diag:true}]],c:['AB＝CD、BC＝DA','AB＝BC','AC＝BD','∠A＝∠B'],a:0,h:'対応する辺を書き出します。',e:'AB＝CD、BC＝DAが示せます。これが「平行四辺形の<span class="tm">対辺は等しい</span>」という定理の証明です。'},
{i:'R8',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">平行四辺形ABCDの対角線の交点をOとする<br>△AOBと△CODにおいて<br>対辺は等しいので AB＝CD …①<br>AB∥DCの錯角より ∠OAB＝∠OCD …②<br>AB∥DCの錯角より ∠OBA＝∠ODC …③<br>①②③より <span class="blank">ア</span> がそれぞれ等しいので △AOB≡△COD</div>',f:['parallelogram',[{diag:true}]],c:['1辺とその両端の角','2辺とその間の角','3辺','2角'],a:0,h:'①が辺、②③がその両端の角です。',e:'辺ABの両端の角が②③なので「<span class="tm">1辺とその両端の角</span>」です。この結果AO＝CO、BO＝DOとなり、対角線が中点で交わることが示せます。'},
{i:'R9',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">四角形ABCDで、2組の対辺がそれぞれ等しいとき平行四辺形であることの証明<br>対角線ACを引く<br>△ABCと△CDAにおいて<br>仮定より AB＝CD …①<br>仮定より BC＝DA …②<br>AC＝CA（共通）…③<br>①②③より <span class="blank">ア</span> がそれぞれ等しいので合同</div>',c:['3辺','2辺とその間の角','1辺と両端の角','2角'],a:0,h:'3つとも辺の条件です。',e:'すべて辺なので「<span class="tm">3辺</span>」を使います。合同から錯角が等しくなり、2組の対辺が平行だと示せます。'},
{i:'R10',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">四角形ABCDで対角線がたがいの中点Oで交わるとき<br>△AOBと△CODにおいて<br>仮定より AO＝CO …①<br>仮定より BO＝DO …②<br><span class="blank">ア</span> は等しいので ∠AOB＝∠COD …③<br>①②③より2辺とその間の角が等しいので合同</div>',f:['parallelogram',[{diag:true}]],c:['対頂角','錯角','同位角','外角'],a:0,h:'2直線の交点でできる向かい合う角です。',e:'∠AOBと∠CODは<span class="tm">対頂角</span>なので等しくなります。合同から錯角が等しくなり平行四辺形と分かります。'},
{i:'R11',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">平行四辺形ABCDで、1つの角が直角ならば長方形であることの証明<br>∠A＝90°とする<br>平行四辺形の対角は等しいので ∠C＝<span class="blank">ア</span><br>となり合う角の和は180°なので ∠B＝∠D＝90°<br>よって4つの角がすべて90°で長方形</div>',f:['rectDiag',[]],c:['90°','180°','45°','60°'],a:0,h:'対角どうしは等しくなります。',e:'∠A＝∠C＝90°です。平行四辺形の<span class="tm">対角は等しい</span>という性質を使います。'},

// ===== 証明の穴埋め: 直角三角形 =====
{i:'R12',g:'2年',t:'三角形と四角形',q:'（ア）に入る合同条件は？<div class="proof">△ABCと△DEFにおいて<br>∠C＝∠F＝90° …①<br>AB＝DE …②<br>∠A＝∠D …③<br>①②③より <span class="blank">ア</span> がそれぞれ等しいので<br>△ABC≡△DEF</div>',f:['rightTri',[4,3,{lc:'斜辺'}]],c:['直角三角形の斜辺と1つの鋭角','3辺','2辺とその間の角','1辺と両端の角'],a:0,h:'ABは直角の向かい側の辺です。',e:'ABとDEは<span class="tm">斜辺</span>。直角三角形では「斜辺と1つの鋭角」が等しければ合同といえます。'},
{i:'R13',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">∠XOYの二等分線上の点Pから、辺OX、OYに垂線PA、PBを引く<br>△OAPと△OBPにおいて<br>∠OAP＝∠OBP＝90° …①<br>OP＝OP（共通）…②<br>仮定より ∠AOP＝∠BOP …③<br>①②③より直角三角形の斜辺と1つの鋭角が等しいので合同<br>よって <span class="blank">ア</span></div>',c:['PA＝PB','OA＝OP','PA＝OP','∠APO＝90°'],a:0,h:'角の二等分線の性質です。',e:'PA＝PBが示せます。これが「<span class="tm">角の二等分線</span>上の点は2辺から等しい距離にある」という性質の証明です。'},

// ===== 証明の穴埋め: 中3 相似 =====
{i:'R14',g:'3年',t:'相似な図形',q:'（ア）に入るのは？<div class="proof">△ABCで、辺AB上に点D、辺AC上に点EをDE∥BCとなるようにとる<br>△ADEと△ABCにおいて<br>∠Aは<span class="blank">ア</span> …①<br>DE∥BCの同位角より ∠ADE＝∠ABC …②<br>①②より2組の角がそれぞれ等しいので △ADE∽△ABC</div>',f:['midline',[]],c:['共通','対頂角','錯角','直角'],a:0,h:'∠Aは両方の三角形に含まれます。',e:'∠Aは2つの三角形が<span class="tm">共通</span>に持つ角です。相似の証明では「共通な角」がよく使われます。'},
{i:'R15',g:'3年',t:'相似な図形',q:'（ア）に入る相似条件は？<div class="proof">△ABCの辺AB上に点D、辺AC上に点EをDE∥BCとなるようにとる<br>△ADEと△ABCにおいて<br>∠Aは共通 …①<br>DE∥BCの同位角より ∠ADE＝∠ABC …②<br>①②より <span class="blank">ア</span> がそれぞれ等しいので<br>△ADE∽△ABC<br>よって AD:AB＝AE:AC＝DE:BC</div>',f:['midline',[]],c:['2組の角','3組の辺の比','2組の辺の比とその間の角','3辺'],a:0,h:'角の条件が2つ示されています。',e:'「<span class="tm">2組の角がそれぞれ等しい</span>」は相似条件の1つです。三角形は2角が決まれば形が決まるので相似といえます。'},
{i:'R16',g:'3年',t:'相似な図形',q:'（ア）に入るのは？<div class="proof">直角三角形ABC（∠A＝90°）で、Aから斜辺BCに垂線ADを引く<br>△ABDと△CBAにおいて<br>∠ADB＝∠CAB＝90° …①<br>∠Bは共通 …②<br>①②より2組の角がそれぞれ等しいので <span class="blank">ア</span></div>',f:['rightTri',[5,3,{lc:'斜辺'}]],c:['△ABD∽△CBA','△ABD≡△CBA','△ABD∽△ACD','△ABD∽△ABC'],a:0,h:'対応する頂点の順に並べます。',e:'AとC、BとB、DとAが対応するので△ABD∽△CBAです。この相似から AB²＝BD×BC が導けます。'},
{i:'R17',g:'3年',t:'相似な図形',q:'（ア）に入るのは？<div class="proof">△ABCと△DEFで<br>AB:DE＝2:3 …①<br>BC:EF＝2:3 …②<br>∠B＝∠E …③<br>①②③より <span class="blank">ア</span> ので △ABC∽△DEF</div>',c:['2組の辺の比とその間の角がそれぞれ等しい','2組の角が等しい','3辺が等しい','3組の辺の比が等しい'],a:0,h:'∠Bは①②の辺にはさまれています。',e:'∠Bは辺ABとBCの<span class="tm">間の角</span>なので「2組の辺の比とその間の角がそれぞれ等しい」を使います。'},
{i:'R18',g:'3年',t:'相似な図形',q:'（ア）に入る式は？<div class="proof">△ADE∽△ABC で相似比が 2:5<br>AD＝4cm のとき AB は？<br>4 : AB ＝ <span class="blank">ア</span><br>2×AB＝20 より AB＝10cm</div>',c:['2 : 5','5 : 2','4 : 5','2 : 4'],a:0,h:'相似比の順序に注意します。',e:'ADとABが対応し相似比が2:5なので4:AB＝2:5。<span class="tm">対応する順</span>に並べるのがポイントです。'},

// ===== 証明の穴埋め: 中3 円 =====
{i:'R19',g:'3年',t:'円の性質',q:'（ア）に入るのは？<div class="proof">円Oの2つの弦AB、CDが点Pで交わる<br>△APCと△DPBにおいて<br>ADの弧に対する円周角は等しいので ∠ACP＝∠DBP …①<br><span class="blank">ア</span> は等しいので ∠APC＝∠DPB …②<br>①②より2組の角がそれぞれ等しいので △APC∽△DPB</div>',f:['inscribed',[]],c:['対頂角','錯角','同位角','中心角'],a:0,h:'2本の弦が交わってできる角です。',e:'∠APCと∠DPBは<span class="tm">対頂角</span>なので等しくなります。この相似から PA×PB＝PC×PD が導けます（方べきの定理）。'},
{i:'R20',g:'3年',t:'円の性質',q:'（ア）に入る根拠は？<div class="proof">円Oで、弧BCに対する円周角を考える<br>点A、Dが同じ側の円周上にあるとき<br>∠BAC＝∠BDC となる<br>根拠：<span class="blank">ア</span></div>',c:['円周角の定理','三平方の定理','中点連結定理','対頂角'],a:0,h:'同じ弧を見込む角の性質です。',e:'<span class="tm">円周角の定理</span>により、同じ弧に対する円周角は円周上のどこから見ても等しくなります。'},
{i:'R21',g:'3年',t:'円の性質',q:'（ア）に入るのは？<div class="proof">ABを直径とする円周上に点Pをとる<br>∠APBは直径ABに対する円周角<br>中心角は<span class="blank">ア</span>なので<br>∠APB＝180°÷2＝90°</div>',f:['thales',[]],c:['180°','90°','360°','45°'],a:0,h:'直径がつくる中心角です。',e:'直径は一直線なので中心角は180°。円周角はその半分の90°になります。'},
{i:'R22',g:'3年',t:'円の性質',q:'（ア）に入るのは？<div class="proof">円に内接する四角形ABCDで<br>弧BCDに対する中心角と弧BADに対する中心角の和は360°<br>それぞれの円周角は∠Aと∠Cだから<br>∠A＋∠C＝360°÷2＝<span class="blank">ア</span></div>',c:['180°','90°','360°','120°'],a:0,h:'中心角の合計の半分です。',e:'180°です。これが「円に内接する四角形の<span class="tm">対角の和は180°</span>」という定理の理由です。'},

// ===== 証明の穴埋め: 中3 三平方 =====
{i:'R23',g:'3年',t:'三平方の定理',q:'（ア）に入る式は？<div class="proof">直角三角形ABC（∠C＝90°）で AC＝3、BC＝4<br>三平方の定理より<br><span class="blank">ア</span><br>AB²＝9＋16＝25<br>AB＝5</div>',f:['rightTri',[4,3,{la:'4',lb:'3',lc:'?'}]],c:['AC² + BC² = AB²','AC² - BC² = AB²','AB² + AC² = BC²','AC × BC = AB'],a:0,h:'斜辺はどれですか。',e:'∠Cが直角なので斜辺はAB。直角をはさむ2辺の2乗の和が斜辺の2乗になります。'},
{i:'R24',g:'3年',t:'三平方の定理',q:'（ア）に入るのは？<div class="proof">1辺aの正方形の対角線の長さを求める<br>対角線で分けると直角二等辺三角形ができる<br>対角線をdとすると<br>a² + a² = d²<br>d² = <span class="blank">ア</span><br>d = √2 a</div>',f:['squareDiag',['a']],c:['2a²','a²','4a²','a⁴'],a:0,h:'a²が2つ分です。',e:'2a²です。よってd＝√(2a²)＝√2 a。正方形の対角線は1辺の√2倍になります。'},
{i:'R25',g:'3年',t:'三平方の定理',q:'（ア）に入るのは？<div class="proof">1辺aの正三角形の高さhを求める<br>頂点から底辺に垂線を引くと底辺は2等分される<br>できた直角三角形で<br><span class="blank">ア</span> + h² = a²<br>h² = a² - a²/4 = 3a²/4<br>h = (√3/2)a</div>',f:['triHeight',['a']],c:['(a/2)²','a²','(2a)²','h²'],a:0,h:'底辺の半分の長さです。',e:'底辺の半分はa/2なので(a/2)²＝a²/4です。正三角形の高さは1辺の(√3)/2倍になります。'},
{i:'R26',g:'3年',t:'三平方の定理',q:'（ア）に入るのは？<div class="proof">半径rの円で、中心Oから弦ABに垂線OHを引く<br>OHの長さをdとすると、Hは<span class="blank">ア</span><br>△OAHで三平方の定理より<br>AH² = r² - d²<br>弦AB = 2AH = 2√(r² - d²)</div>',f:['chord',[5,3]],c:['ABの中点','ABの端','円の中心','接点'],a:0,h:'中心からの垂線の性質です。',e:'中心から弦に引いた垂線は弦を<span class="tm">2等分</span>するので、HはABの中点です。だからAB＝2AHになります。'},
{i:'R27',g:'3年',t:'三平方の定理',q:'（ア）に入るのは？<div class="proof">縦a、横b、高さcの直方体の対角線を求める<br>まず底面の対角線をlとすると l² = a² + b²<br>次に対角線dは、lとcを直角にはさむので<br>d² = l² + c² = <span class="blank">ア</span></div>',f:['boxDiag',['a','b','c']],c:['a² + b² + c²','a² + b²','(a + b + c)²','abc'],a:0,h:'l²を代入します。',e:'a²+b²+c²です。三平方の定理を<span class="tm">2回</span>使うのがポイントです。'},

// ===== 証明の穴埋め: 文字式による証明 =====
{i:'R28',g:'2年',t:'式の計算',q:'（ア）に入るのは？<div class="proof">連続する3つの整数の和が3の倍数であることの証明<br>連続する3つの整数を n-1, n, n+1 とすると<br>和は (n-1) + n + (n+1) ＝ <span class="blank">ア</span><br>nは整数だから3nは3の倍数<br>よって連続する3つの整数の和は3の倍数である</div>',c:['3n','3n + 1','n³','3n - 1'],a:0,h:'±1が打ち消し合います。',e:'3nになります。3×（整数）の形になったことが「<span class="tm">3の倍数</span>」の根拠です。'},
{i:'R29',g:'2年',t:'式の計算',q:'（ア）に入るのは？<div class="proof">2つの奇数の和が偶数であることの証明<br>2つの奇数を 2m+1, 2n+1（m, nは整数）とすると<br>和は (2m+1)+(2n+1) ＝ 2m+2n+2<br>＝ <span class="blank">ア</span><br>m+n+1は整数だから、和は2の倍数すなわち偶数</div>',c:['2(m + n + 1)','2mn + 2','2m + 2n','4(m + n)'],a:0,h:'2でくくります。',e:'2(m+n+1)です。2×（整数）の形にすることで<span class="tm">偶数</span>だと示せます。'},
{i:'R30',g:'2年',t:'式の計算',q:'（ア）に入るのは？<div class="proof">2けたの整数と、その十の位と一の位を入れかえた数の和が11の倍数であることの証明<br>十の位をa、一の位をbとすると<br>もとの数は 10a + b、入れかえた数は <span class="blank">ア</span><br>和は 11a + 11b ＝ 11(a + b)<br>よって11の倍数である</div>',c:['10b + a','10a + b','ab','a + b'],a:0,h:'位の重みが入れかわります。',e:'10b+aです。位ごとに<span class="tm">10倍の重み</span>をつけて表すのがポイントです。'},
{i:'R31',g:'2年',t:'式の計算',q:'（ア）に入るのは？<div class="proof">連続する2つの奇数の和が4の倍数であることの証明<br>連続する2つの奇数を 2n-1, 2n+1 とすると<br>和は (2n-1)+(2n+1) ＝ 4n<br>nは整数だから <span class="blank">ア</span><br>よって4の倍数である</div>',c:['4nは4の倍数','4nは偶数','nは4の倍数','4nは奇数'],a:0,h:'4×整数の形です。',e:'4×（整数）なので4の倍数です。証明では「なぜその形が倍数といえるか」を書く必要があります。'},
{i:'R32',g:'3年',t:'式の展開と因数分解',q:'（ア）に入るのは？<div class="proof">連続する2つの整数の2乗の差が奇数であることの証明<br>連続する2つの整数を n, n+1 とすると<br>(n+1)² - n² ＝ n² + 2n + 1 - n²<br>＝ <span class="blank">ア</span><br>これは奇数を表す形である</div>',c:['2n + 1','2n','n + 1','2n²'],a:0,h:'展開して整理します。',e:'2n+1になります。この形は<span class="tm">奇数</span>を表すので証明が完成します。'},

// ===== 証明の穴埋め: 書き方そのもの =====
{i:'R33',g:'2年',t:'三角形と四角形',q:'証明で「①②③より」の後に書くべきものは？',c:['使った合同条件','図の説明','計算過程','結論の理由づけなし'],a:0,h:'なぜ合同といえるかを示します。',e:'どの<span class="tm">合同条件</span>を使ったかを明記します。根拠を示すことが証明の中心です。'},
{i:'R34',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">△ABC≡△DEF を示したあと<br><span class="blank">ア</span> は等しいので<br>BC＝EF</div>',c:['合同な図形の対応する辺','面積','周の長さ','対角線'],a:0,h:'合同から何が言えますか。',e:'「<span class="tm">合同な図形の対応する辺</span>」が等しいことを根拠に、辺の長さの結論を述べます。'},
{i:'R35',g:'2年',t:'三角形と四角形',q:'証明で根拠として使えないものは？',c:['図を見た印象','仮定','定義','証明済みの定理'],a:0,h:'見た目は証拠になりません。',e:'図の見た目は根拠になりません。使えるのは<span class="tm">仮定・定義・定理</span>だけです。'},
{i:'R36',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">AB∥CD、AD∥BC のとき四角形ABCDが平行四辺形である<br>理由：<span class="blank">ア</span>を満たすから</div>',c:['2組の対辺がそれぞれ平行という定義','対角線が等しい','4辺が等しい','1つの角が90°'],a:0,h:'平行四辺形の定義です。',e:'平行四辺形の<span class="tm">定義</span>そのものを満たしています。定義に当てはまれば証明は不要です。'},

{i:'R37',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">平行四辺形ABCDの辺AB、CD上にAE＝CFとなる点E、Fをとる<br>△AEDと△CFBにおいて<br>仮定より AE＝CF …①<br>平行四辺形の対辺は等しいので AD＝<span class="blank">ア</span> …②<br>平行四辺形の対角は等しいので ∠A＝∠C …③</div>',f:['parallelogram',[{marks:true}]],c:['CB','AB','DC','BD'],a:0,h:'ADの対辺はどれですか。',e:'ADの対辺はCB（＝BC）です。①②③より2辺とその間の角が等しく合同が示せます。'},
{i:'R38',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">△ABCの辺AB、ACの中点をそれぞれM、Nとする<br>△AMNと△ABCにおいて<br>AM:AB＝<span class="blank">ア</span>、AN:AC＝1:2<br>∠Aは共通<br>2組の辺の比とその間の角が等しいので △AMN∽△ABC</div>',f:['midline',[]],c:['1:2','2:1','1:1','1:3'],a:0,h:'Mは中点です。',e:'AM:AB＝1:2です。相似比1:2からMN:BC＝1:2、つまり<span class="tm">中点連結定理</span>が導けます。'},
{i:'R39',g:'3年',t:'相似な図形',q:'（ア）に入るのは？<div class="proof">△ABCで DE∥BC のとき<br>△ADE∽△ABC より<br>AD:AB＝AE:AC<br>AD＝3、DB＝6、AE＝4 のとき<br>3:<span class="blank">ア</span>＝4:AC<br>AC＝12</div>',f:['midline',[]],c:['9','6','3','12'],a:0,h:'ABはADとDBの合計です。',e:'AB＝AD+DB＝3+6＝9です。ADとABを混同しないよう注意します。'},
{i:'R40',g:'3年',t:'円の性質',q:'（ア）に入るのは？<div class="proof">円外の点Pから円に2本の接線を引き、接点をA、Bとする<br>△OAPと△OBPにおいて<br>接線と半径は垂直だから ∠OAP＝∠OBP＝90° …①<br>半径だから OA＝OB …②<br>OP＝OP（共通）…③<br>直角三角形の斜辺と他の1辺が等しいので合同<br>よって <span class="blank">ア</span></div>',f:['tangent',[]],c:['PA＝PB','OA＝OP','PA＝OA','∠AOP＝90°'],a:0,h:'接線の長さの性質です。',e:'PA＝PBが示せます。円外の点から引いた2本の<span class="tm">接線の長さは等しい</span>という性質の証明です。'},
{i:'R41',g:'2年',t:'三角形と四角形',q:'（ア）に入るのは？<div class="proof">AB∥DCの台形ABCDで、対角線の交点をOとする<br>△OABと△OCDにおいて<br>AB∥DCの錯角より ∠OAB＝∠OCD …①<br>AB∥DCの錯角より ∠OBA＝∠ODC …②<br>①②より <span class="blank">ア</span> ので △OAB∽△OCD</div>',f:['trapezoid',[]],c:['2組の角がそれぞれ等しい','3辺の比が等しい','2辺とその間の角が等しい','対頂角が等しい'],a:0,h:'角の条件が2つあります。',e:'「<span class="tm">2組の角がそれぞれ等しい</span>」という相似条件です。'},
{i:'R42',g:'3年',t:'相似な図形',q:'（ア）に入るのは？<div class="proof">△ABCと△DEFが相似で相似比が3:4<br>△ABCの面積が18cm²のとき<br>面積比は 3²:4² ＝ <span class="blank">ア</span><br>18 × (16/9) ＝ 32cm²</div>',c:['9:16','3:4','27:64','6:8'],a:0,h:'面積比は相似比の2乗です。',e:'9:16です。<span class="tm">面積比は相似比の2乗</span>、体積比は3乗になります。'},
{i:'R43',g:'2年',t:'図形の性質と合同',q:'（ア）に入るのは？<div class="proof">三角形の外角の性質の証明<br>△ABCの辺BCをCの方に延長した点をDとする<br>∠A＋∠B＋∠C＝180°（内角の和）…①<br>∠ACB＋∠ACD＝<span class="blank">ア</span>（一直線）…②<br>①②より ∠ACD＝∠A＋∠B</div>',f:['triFromAngles',[55,65,{ext:true,extLabel:'外角'}]],c:['180°','90°','360°','∠A'],a:0,h:'一直線がつくる角です。',e:'180°です。①②を比べることで、外角がとなり合わない2つの内角の和に等しいと示せます。'},
{i:'R44',g:'2年',t:'図形の性質と合同',q:'（ア）に入るのは？<div class="proof">多角形の外角の和が360°であることの説明<br>n角形の内角の和は 180(n-2)<br>内角と外角の和は1つの頂点で180°だから、全部で 180n<br>外角の和 ＝ 180n - <span class="blank">ア</span> ＝ 360°</div>',c:['180(n-2)','180n','360','180'],a:0,h:'全体から内角の和を引きます。',e:'180n-180(n-2)＝360°です。nが消えるので、<span class="tm">角の数に関係なく360°</span>になります。'},
{i:'R45',g:'3年',t:'三平方の定理',q:'（ア）に入るのは？<div class="proof">3辺が5, 12, 13の三角形が直角三角形か調べる<br>最も長い辺は13<br>5² + 12² ＝ 25 + 144 ＝ 169<br>13² ＝ 169<br>よって <span class="blank">ア</span> が成り立つので直角三角形である</div>',f:['pythagoras',['5','12','13']],c:['三平方の定理の逆','三平方の定理','相似条件','合同条件'],a:0,h:'定理を逆向きに使っています。',e:'a²+b²＝c²が成り立てば直角三角形といえます。これを<span class="tm">三平方の定理の逆</span>といいます。'}
);

{i:'T1',g:'1年',t:'一次方程式',q:'（ア）に入るのは？<div class="proof">1個150円のケーキを何個か買い、200円の箱に入れたら1250円だった<br>買った個数をx個とすると<br>ケーキ代は <span class="blank">ア</span> 円<br>150x + 200 = 1250<br>150x = 1050　x = 7</div>',c:['150x','150 + x','1250 - x','150/x'],a:0,h:'代金 = 単価 × 個数',e:'150×x＝150x円です。文章を文字式に直す段階が、方程式を立てる第一歩になります。'},
{i:'T2',g:'1年',t:'一次方程式',q:'（ア）に入るのは？<div class="proof">妹の年齢をx歳とすると、姉は妹より5歳年上<br>姉の年齢は <span class="blank">ア</span> 歳<br>2人の年齢の和が27歳だから<br>x + (x + 5) = 27　2x = 22　x = 11</div>',c:['x + 5','x - 5','5x','27 - 5'],a:0,h:'「年上」は足します。',e:'x+5歳です。姉は11+5＝16歳になります。'},
{i:'T3',g:'1年',t:'一次方程式',q:'（ア）に入る式は？<div class="proof">あめを1人に4個ずつ配ると9個余り、6個ずつ配ると5個足りない<br>子どもの人数をx人とすると<br>あめの総数は 4x + 9 とも <span class="blank">ア</span> とも表せる<br>4x + 9 = 6x - 5　2x = 14　x = 7</div>',c:['6x - 5','6x + 5','6x','5x - 6'],a:0,h:'「足りない」は引きます。',e:'6x-5個です。<span class="tm">同じ量を2通りで表して等号で結ぶ</span>のがこのタイプの解き方です。'},
{i:'T4',g:'1年',t:'一次方程式',q:'（ア）に入るのは？<div class="proof">家から公園までの道のりをx mとする<br>行きは分速60mで歩き、帰りは分速90mで走った<br>行きにかかる時間は <span class="blank">ア</span> 分<br>帰りは x/90 分<br>合計25分だから x/60 + x/90 = 25</div>',c:['x/60','60x','60/x','x - 60'],a:0,h:'時間 = 道のり ÷ 速さ',e:'x÷60＝x/60分です。両辺に180をかけて3x+2x＝4500、x＝900mになります。'},
{i:'T5',g:'1年',t:'一次方程式',q:'（ア）に入るのは？<div class="proof">定価x円の服を30%引きで買ったら2100円だった<br>30%引きは定価の <span class="blank">ア</span> を払うことなので<br>0.7x = 2100　x = 3000</div>',c:['70%','30%','130%','7%'],a:0,h:'引いた後の割合を考えます。',e:'100-30＝70%です。「〜%引き」は<span class="tm">残りの割合</span>を払うと考えます。'},
{i:'T6',g:'1年',t:'一次方程式',q:'（ア）に入るのは？<div class="proof">姉は分速80mで家を出発、その6分後に妹が分速200mで追いかけた<br>妹が出発してからx分後に追いつくとすると<br>姉が進んだ道のりは <span class="blank">ア</span> m<br>妹が進んだ道のりは 200x m<br>追いつくとき等しいので 80(x+6) = 200x</div>',c:['80(x + 6)','80x','80x + 6','80x - 6'],a:0,h:'姉は妹より6分長く歩いています。',e:'姉はx+6分間歩いているので80(x+6)mです。120x＝480よりx＝4分後に追いつきます。'},
{i:'T7',g:'1年',t:'一次方程式',q:'（ア）に入るのは？<div class="proof">120円のジュースと80円のお茶を合わせて10本買い、代金は1000円<br>ジュースをx本とすると、お茶は <span class="blank">ア</span> 本<br>120x + 80(10 - x) = 1000<br>40x = 200　x = 5</div>',c:['10 - x','x - 10','10x','1000 - x'],a:0,h:'合計が10本です。',e:'10-x本です。合計が決まっているときは「<span class="tm">全体−x</span>」で表すのが定石です。'},
{i:'T8',g:'1年',t:'一次方程式',q:'（ア）に入るのは？<div class="proof">長さ72cmのリボンを2本に切り、長い方が短い方の3倍になるようにする<br>短い方をx cmとすると長い方は 3x cm<br><span class="blank">ア</span> = 72<br>4x = 72　x = 18</div>',c:['x + 3x','x × 3x','3x - x','x + 3'],a:0,h:'2本の合計が全体です。',e:'x+3x＝72です。短い方18cm、長い方54cmになります。'},
{i:'T9',g:'1年',t:'一次方程式',q:'（ア）に入るのは？<div class="proof">連続する3つの整数の和が72<br>真ん中の数をxとすると3つの数は x-1, x, x+1<br>和は <span class="blank">ア</span> = 72<br>x = 24　よって3数は23, 24, 25</div>',c:['3x','3x + 1','x³','3x - 1'],a:0,h:'±1が打ち消し合います。',e:'(x-1)+x+(x+1)＝3xです。<span class="tm">真ん中をxとおく</span>と式が最も簡単になります。'},
{i:'T10',g:'1年',t:'一次方程式',q:'（ア）に入るのは？<div class="proof">縦が横より4cm長い長方形の周の長さが36cm<br>横をx cmとすると縦は (x+4) cm<br>周の長さは <span class="blank">ア</span> = 36<br>4x + 8 = 36　x = 7</div>',f:['rectLabeled',['x+4','x']],c:['2{x + (x+4)}','x(x + 4)','x + (x + 4)','4x + 4'],a:0,h:'周は（縦＋横）×2です。',e:'2{x+(x+4)}＝36です。面積の式x(x+4)と混同しないよう注意します。'},

// ===== 文章題の穴埋め: 中2 連立方程式 =====
{i:'T11',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">大人x人、子どもy人が入場し、合計18人<br>入場料は大人800円、子ども400円で合計10400円<br>人数の式：x + y = 18<br>代金の式：<span class="blank">ア</span> = 10400</div>',c:['800x + 400y','800 + 400','800x × 400y','400x + 800y'],a:0,h:'それぞれの代金を足します。',e:'800x+400y＝10400です。<span class="tm">人数と代金</span>という2つの観点で式を立てます。'},
{i:'T12',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">大人x人、子どもy人が入場し、合計18人。入場料は大人800円、子ども400円で合計10400円<br>x + y = 18 …①<br>800x + 400y = 10400 …②<br>②÷400 より 2x + y = 26 …③<br>③ - ① より <span class="blank">ア</span><br>x = 8、y = 10</div>',c:['x = 8','y = 8','3x = 26','x = 26'],a:0,h:'③から①を引くとyが消えます。',e:'(2x+y)-(x+y)＝26-18よりx＝8です。<span class="tm">係数をそろえてから引く</span>のが加減法です。'},
{i:'T13',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">2けたの整数がある。各位の数の和は12<br>十の位をx、一の位をyとすると<br>もとの数は 10x + y、入れかえた数は <span class="blank">ア</span><br>入れかえると18大きくなるので 10y + x = (10x + y) + 18</div>',c:['10y + x','10x + y','xy','x + y'],a:0,h:'位の重みが入れかわります。',e:'10y+xです。整理すると9y-9x＝18よりy-x＝2。x+y＝12と連立してx＝5, y＝7、もとの数は57です。'},
{i:'T14',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">5%の食塩水x gと12%の食塩水y gを混ぜて8%の食塩水を350g作る<br>食塩水の重さ：x + y = 350<br>食塩の重さ：0.05x + 0.12y = <span class="blank">ア</span></div>',c:['0.08 × 350','0.08','350','8'],a:0,h:'できあがりの食塩の量です。',e:'0.08×350＝28gです。<span class="tm">食塩水の重さ</span>と<span class="tm">食塩の重さ</span>の2つで式を立てます。'},
{i:'T15',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">A地点からB地点まで、上り坂を時速3km、下り坂を時速5kmで歩いた<br>道のりは合計19km、時間は合計5時間<br>上りをx km、下りをy kmとすると<br>道のり：x + y = 19<br>時間：<span class="blank">ア</span> = 5</div>',c:['x/3 + y/5','3x + 5y','x/5 + y/3','(x + y)/8'],a:0,h:'時間 = 道のり ÷ 速さ',e:'x/3+y/5＝5です。両辺に15をかけて5x+3y＝75として解きます。'},
{i:'T16',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">昨年の入部者は男女合わせて120人<br>今年は男子が10%増え、女子が5%減り、全体で3人増えた<br>昨年の男子をx人、女子をy人とすると<br>x + y = 120<br>増減の式：<span class="blank">ア</span> = 3</div>',c:['0.1x - 0.05y','0.1x + 0.05y','1.1x + 0.95y','0.1x - 0.05y + 120'],a:0,h:'増えた分と減った分の差です。',e:'0.1x-0.05y＝3です。<span class="tm">増減分だけ</span>を式にすると簡単になります。'},
{i:'T17',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">ペン3本とノート2冊で880円、ペン1本とノート4冊で960円<br>ペン1本x円、ノート1冊y円とすると<br>3x + 2y = 880 …①<br>x + 4y = 960 …②<br>②×3 より <span class="blank">ア</span> …③<br>③-① より 10y = 2000　y = 200</div>',c:['3x + 12y = 2880','3x + 4y = 2880','x + 12y = 960','3x + 12y = 960'],a:0,h:'②の全体を3倍します。',e:'3x+12y＝2880です。xの係数をそろえてから引くことでxを消去できます。'},
{i:'T18',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">2つの数があり、和は40、差は8<br>大きい方をx、小さい方をyとすると<br>x + y = 40<br>x - y = 8<br>2式をたすと <span class="blank">ア</span><br>x = 24、y = 16</div>',c:['2x = 48','2y = 48','x = 48','2x = 32'],a:0,h:'yが消えます。',e:'2x＝48です。和と差が与えられたときは<span class="tm">たし引き</span>ですぐ解けます。'},
{i:'T19',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">周の長さが40cmの長方形がある。縦は横より4cm短い<br>縦をx cm、横をy cmとすると<br>周の式：<span class="blank">ア</span> = 40<br>関係の式：x = y - 4</div>',f:['rectLabeled',['x','y']],c:['2(x + y)','x + y','xy','4(x + y)'],a:0,h:'周は（縦＋横）×2です。',e:'2(x+y)＝40です。x+y＝20とx＝y-4を解いてy＝12, x＝8になります。'},
{i:'T20',g:'2年',t:'連立方程式',q:'（ア）に入るのは？<div class="proof">列車が長さ400mの鉄橋を渡り始めてから渡り終わるまで25秒<br>列車の長さをx m、秒速をy mとすると<br>進んだ距離は <span class="blank">ア</span> m<br>よって 400 + x = 25y</div>',c:['400 + x','400 - x','400','x'],a:0,h:'先頭が渡り終わるまでに列車の長さも進みます。',e:'橋の長さ＋列車の長さ＝400+x mです。通過算では<span class="tm">列車自身の長さ</span>を足すのがポイントです。'},

{i:'T21',g:'2年',t:'一次関数',q:'（ア）に入るのは？<div class="proof">水そうに15Lの水が入っており、毎分4Lずつ入れる<br>x分後の水量をy Lとすると<br>傾きは <span class="blank">ア</span>、切片は15<br>式は y = 4x + 15</div>',c:['4','15','x','y'],a:0,h:'1分あたりの変化量です。',e:'毎分4L増えるので<span class="tm">傾き</span>は4です。はじめの量15Lが<span class="tm">切片</span>になります。'},
{i:'T22',g:'2年',t:'一次関数',q:'（ア）に入るのは？<div class="proof">長さ30cmのろうそくが毎分0.6cmずつ短くなる<br>x分後の長さをy cmとすると<br>y = <span class="blank">ア</span><br>燃え尽きるのは y = 0 のときだから<br>0 = -0.6x + 30　x = 50分後</div>',c:['-0.6x + 30','0.6x + 30','-0.6x - 30','30x - 0.6'],a:0,h:'減るので傾きは負です。',e:'y＝-0.6x+30です。減少する量は<span class="tm">傾きが負</span>になります。'},
{i:'T23',g:'2年',t:'一次関数',q:'（ア）に入るのは？<div class="proof">Aプランは基本料1000円＋1回200円<br>Bプランは基本料2200円＋1回100円<br>x回利用したときの料金を式にすると<br>A：y = 200x + 1000<br>B：y = <span class="blank">ア</span><br>同じになるのは 200x+1000 = 100x+2200 より x = 12回</div>',c:['100x + 2200','2200x + 100','100x - 2200','2200x'],a:0,h:'基本料が切片です。',e:'y＝100x+2200です。2式が等しくなる点が<span class="tm">損得の分かれ目</span>になります。'},
{i:'T24',g:'2年',t:'一次関数',q:'（ア）に入るのは？<div class="proof">家から2400m離れた駅へ分速80mで歩く<br>x分後の駅までの残りの距離をy mとすると<br>y = -80x + 2400<br>駅に着くのは <span class="blank">ア</span> のときだから<br>0 = -80x + 2400　x = 30分後</div>',c:['y = 0','x = 0','y = 2400','x = 2400'],a:0,h:'残りが0になる瞬間です。',e:'y＝0とします。これは<span class="tm">グラフとx軸の交点</span>を求めることに対応します。'},
{i:'T25',g:'2年',t:'一次関数',q:'（ア）に入るのは？<div class="proof">2点 (2, 5), (6, 17) を通る直線の式を求める<br>傾き＝(17-5)÷(6-2)＝<span class="blank">ア</span><br>y = 3x + b に (2, 5) を代入して 5 = 6 + b　b = -1<br>式は y = 3x - 1</div>',c:['3','12','4','1/3'],a:0,h:'yの増加量÷xの増加量',e:'12÷4＝3です。2点から傾きを求め、片方を代入して切片を出す流れです。'},

// ===== 文章題の穴埋め: 中3 二次方程式 =====
{i:'T26',g:'3年',t:'二次方程式',q:'（ア）に入るのは？<div class="proof">縦が横より3cm長い長方形の面積が54cm²<br>横をx cmとすると縦は (x+3) cm<br>面積の式は <span class="blank">ア</span> = 54<br>x² + 3x - 54 = 0　(x+9)(x-6) = 0<br>長さは正なので x = 6</div>',f:['rectLabeled',['x+3','x']],c:['x(x + 3)','2(x + x + 3)','x + (x + 3)','x² + 3'],a:0,h:'面積は縦×横です。',e:'x(x+3)＝54です。周の式2(x+x+3)と混同しないよう注意します。'},
{i:'T27',g:'3年',t:'二次方程式',q:'（ア）に入るのは？<div class="proof">連続する2つの正の整数の積が110<br>小さい方をxとすると大きい方は x+1<br>x(x + 1) = 110<br>x² + x - 110 = 0　(x + 11)(x - 10) = 0<br>x = 10, -11 だが <span class="blank">ア</span> ので x = 10</div>',c:['正の整数でなければならない','積が正だから','xが大きいから','どちらでもよい'],a:0,h:'解の吟味です。',e:'問題の条件が「正の整数」なので-11は不適です。この確認を<span class="tm">解の吟味</span>といいます。'},
{i:'T28',g:'3年',t:'二次方程式',q:'（ア）に入るのは？<div class="proof">縦12m、横18mの畑に、同じ幅x mの道を縦横に1本ずつつける<br>道を端に寄せて考えると、残りの畑は縦(12-x)m、横(18-x)mの長方形<br>残りの面積が180m²だから<br><span class="blank">ア</span> = 180<br>x² - 30x + 36 = 0 …（解いて x = 6ではなく適する値を求める）</div>',f:['rectLabeled',['18m','12m']],c:['(12 - x)(18 - x)','12 × 18 - x','(12 + x)(18 + x)','12x + 18x'],a:0,h:'道を端に寄せると残りが1つの長方形になります。',e:'(12-x)(18-x)＝180です。<span class="tm">道を端に寄せる</span>と式が簡単になります。'},
{i:'T29',g:'3年',t:'二次方程式',q:'（ア）に入るのは？<div class="proof">ある正の数を2乗した数は、その数の5倍より24大きい<br>その数をxとすると<br>x² = <span class="blank">ア</span><br>x² - 5x - 24 = 0　(x - 8)(x + 3) = 0<br>正の数なので x = 8</div>',c:['5x + 24','5x - 24','24x + 5','5(x + 24)'],a:0,h:'「5倍より24大きい」を式にします。',e:'5x+24です。「〜より…大きい」は<span class="tm">たし算</span>で表します。'},
{i:'T30',g:'3年',t:'二次方程式',q:'（ア）に入るのは？<div class="proof">1辺x cmの正方形の縦を2cm伸ばし、横を3cm伸ばすと面積が72cm²になった<br>(x + 2)(x + 3) = 72<br>x² + 5x + 6 = 72<br><span class="blank">ア</span> = 0<br>(x + 11)(x - 6) = 0　x = 6</div>',f:['squareArea',['x cm']],c:['x² + 5x - 66','x² + 5x + 66','x² + 5x - 72','x² - 5x - 66'],a:0,h:'右辺を0に移項します。',e:'x²+5x+6-72＝x²+5x-66です。<span class="tm">右辺を0にする</span>のが二次方程式を解く第一歩です。'},

// ===== 文章題の穴埋め: 中3 図形の応用 =====
{i:'T31',g:'3年',t:'相似な図形',q:'（ア）に入るのは？<div class="proof">高さ1.5mの棒の影が2m、同じ時刻に木の影が14m<br>太陽光は平行なので2つの三角形は相似<br>木の高さをxとすると<br>1.5 : 2 = <span class="blank">ア</span><br>2x = 21　x = 10.5m</div>',f:['similarPair',[]],c:['x : 14','14 : x','x : 2','1.5 : x'],a:0,h:'（高さ）：（影）の順にそろえます。',e:'x:14です。<span class="tm">対応する順序</span>をそろえて比例式を作ります。'},
{i:'T32',g:'3年',t:'三平方の定理',q:'（ア）に入るのは？<div class="proof">底面が1辺6cmの正方形、他の辺が5cmの正四角錐の高さを求める<br>底面の対角線は 6√2 cm、その半分は 3√2 cm<br>頂点・底面の中心・底面の頂点で直角三角形ができるので<br>h² + <span class="blank">ア</span> = 5²<br>h² = 25 - 18 = 7　h = √7 cm</div>',f:['pyramid',[]],c:['(3√2)²','(6√2)²','6²','3²'],a:0,h:'底面の対角線の半分が1辺になります。',e:'(3√2)²＝18です。立体の問題は<span class="tm">直角三角形を取り出す</span>のが基本です。'},
{i:'T33',g:'3年',t:'三平方の定理',q:'（ア）に入るのは？<div class="proof">2点A(1, 3)、B(5, 6)の距離を求める<br>x座標の差は 5-1 = 4、y座標の差は 6-3 = 3<br>AB² = <span class="blank">ア</span> = 25<br>AB = 5</div>',c:['4² + 3²','4² - 3²','4 + 3','(4 × 3)²'],a:0,h:'差を2辺とする直角三角形です。',e:'4²+3²＝25です。座標平面上の距離は<span class="tm">三平方の定理</span>で求めます。'},
{i:'T34',g:'3年',t:'円の性質',q:'（ア）に入るのは？<div class="proof">半径5cmの円で、中心から3cmの距離にある弦の長さを求める<br>中心から弦への垂線は弦を2等分する<br>弦の半分をxとすると<br>3² + x² = <span class="blank">ア</span><br>x² = 16　x = 4　弦の長さは 8cm</div>',f:['chord',[5,3]],c:['5²','3²','8²','4²'],a:0,h:'半径が斜辺になります。',e:'5²＝25です。<span class="tm">半径が斜辺</span>である点を取りちがえないようにします。'},
{i:'T35',g:'1年',t:'平面図形',q:'（ア）に入るのは？<div class="proof">半径8cm、中心角45°のおうぎ形の面積を求める<br>円全体の面積は π×8² = 64π cm²<br>中心角の割合は <span class="blank">ア</span><br>面積は 64π × (1/8) = 8π cm²</div>',f:['sector',[45]],c:['45/360 = 1/8','45/180','360/45','45/100'],a:0,h:'円全体は360°です。',e:'45/360＝1/8です。おうぎ形は<span class="tm">円全体に割合をかける</span>と考えます。'},
{i:'T36',g:'1年',t:'空間図形',q:'（ア）に入るのは？<div class="proof">底面の半径3cm、高さ8cmの円錐の体積を求める<br>底面積は π×3² = 9π cm²<br>体積は 9π × 8 ÷ <span class="blank">ア</span> = 24π cm³</div>',f:['cone',[]],c:['3','2','1','6'],a:0,h:'錐は柱の何分の1ですか。',e:'3です。<span class="tm">錐の体積は柱の1/3</span>なので÷3を忘れないようにします。'},
{i:'T37',g:'1年',t:'空間図形',q:'（ア）に入るのは？<div class="proof">底面の半径2cm、高さ7cmの円柱の側面積を求める<br>側面を展開すると長方形になる<br>横の長さは底面の円周と等しく <span class="blank">ア</span> cm<br>側面積は 4π × 7 = 28π cm²</div>',f:['cylNet',[]],c:['4π','2π','4','7'],a:0,h:'円周は2πrです。',e:'2π×2＝4πです。側面の長方形の横は<span class="tm">底面の円周</span>と等しくなります。'},

{i:'T38',g:'1年',t:'データの活用',q:'（ア）に入るのは？<div class="proof">度数の合計が50、ある階級の度数が12<br>相対度数 = その階級の度数 ÷ <span class="blank">ア</span><br>= 12 ÷ 50 = 0.24</div>',f:['table',[[['階級A','12'],['階級B','18'],['階級C','20']]]],c:['度数の合計','階級の幅','階級値','最大の度数'],a:0,h:'全体に対する割合です。',e:'度数の合計でわります。<span class="tm">相対度数</span>は全体を1としたときの割合です。'},
{i:'T39',g:'1年',t:'データの活用',q:'（ア）に入るのは？<div class="proof">8個のデータ 3, 5, 6, 8, 9, 11, 12, 15 の中央値を求める<br>データは偶数個なので <span class="blank">ア</span> をとる<br>4番目は8、5番目は9<br>中央値 = (8 + 9) ÷ 2 = 8.5</div>',f:['dots',[[3,5,6,8,9,11,12,15]]],c:['まん中2つの平均','まん中の左の値','最大と最小の平均','最も多い値'],a:0,h:'まん中が2つあります。',e:'まん中2つの平均です。偶数個のときの<span class="tm">中央値</span>は実際のデータにない値になることもあります。'},
{i:'T40',g:'2年',t:'データの分布',q:'（ア）に入るのは？<div class="proof">7個のデータ 2, 5, 7, 9, 12, 15, 18 の四分位範囲を求める<br>中央値(Q2)は4番目の 9<br>Q1は前半 2, 5, 7 の中央値で 5<br>Q3は後半 12, 15, 18 の中央値で 15<br>四分位範囲 = <span class="blank">ア</span> = 10</div>',f:['box',[[{v:[2,5,9,15,18]}],{min:0,max:20,ticks:4}]],c:['15 - 5','18 - 2','15 - 9','9 - 5'],a:0,h:'Q3 - Q1 です。',e:'Q3-Q1＝15-5＝10です。<span class="tm">四分位範囲</span>はまん中50%が収まる幅を表します。'},
{i:'T41',g:'3年',t:'標本調査',q:'（ア）に入るのは？<div class="proof">袋の中の玉600個から40個取り出したら、赤玉が14個だった<br>標本での赤玉の割合は 14 ÷ 40 = 0.35<br>母集団の赤玉はおよそ <span class="blank">ア</span> = 210個</div>',c:['600 × 0.35','600 ÷ 0.35','600 - 0.35','40 × 0.35'],a:0,h:'全体に割合をかけます。',e:'600×0.35＝210個です。標本での割合を<span class="tm">母集団全体</span >にあてはめて推測します。'},
{i:'T42',g:'3年',t:'標本調査',q:'（ア）に入るのは？<div class="proof">池の魚に印をつけて300匹放流<br>後日150匹捕獲したら印付きが6匹<br>標本での印の割合は 6 ÷ 150 = 0.04<br>池全体の魚は <span class="blank">ア</span> = 7500匹と推測できる</div>',c:['300 ÷ 0.04','300 × 0.04','150 ÷ 0.04','300 × 150'],a:0,h:'印300匹が4%にあたります。',e:'300÷0.04＝7500匹です。「印の数÷割合＝全体」と考えます。'},

{i:'T44',g:'1年',t:'文字と式',q:'（ア）に入るのは？<div class="proof">x km の道のりを時速4kmで歩いたときにかかる時間<br>時間 = 道のり ÷ 速さ だから<br>時間は <span class="blank">ア</span> 時間</div>',c:['x/4','4x','4/x','x - 4'],a:0,h:'わり算は分数で表します。',e:'x÷4＝x/4時間です。文字式では÷を使わず<span class="tm">分数</span>で書きます。'},
{i:'T45',g:'2年',t:'式の計算',q:'（ア）に入るのは？<div class="proof">2けたの整数の十の位をa、一の位をbとする<br>この整数は <span class="blank">ア</span> と表せる<br>例えば a=4, b=7 なら 10×4+7 = 47</div>',c:['10a + b','ab','a + b','100a + b'],a:0,h:'十の位は10倍の重みです。',e:'10a+bです。abと書くとa×bの意味になってしまいます。'},
{i:'T46',g:'2年',t:'一次関数',q:'（ア）に入るのは？<div class="proof">妹が家を出発し、分速50mで歩く<br>10分後に姉が分速150mの自転車で追いかける<br>姉が出発してからx分後、妹の進んだ距離は <span class="blank">ア</span> m<br>姉は150x m<br>追いつくとき 50(x+10) = 150x　x = 5分後</div>',c:['50(x + 10)','50x','50x + 10','150x - 10'],a:0,h:'妹は姉より10分長く歩いています。',e:'50(x+10)mです。<span class="tm">出発時刻の差</span>を時間に足すのがポイントです。'},
{i:'T47',g:'3年',t:'平方根',q:'（ア）に入るのは？<div class="proof">面積が32cm²の正方形の1辺の長さを求める<br>1辺をx cmとすると x² = 32<br>x = ±√32 だが長さは正なので<br>x = √32 = <span class="blank">ア</span> cm</div>',c:['4√2','2√8','16√2','8√2'],a:0,h:'32 = 16 × 2 です。',e:'√16×√2＝4√2です。<span class="tm">根号の中はできるだけ小さく</span>します。'},
{i:'T48',g:'3年',t:'関数 y=ax²',q:'（ア）に入るのは？<div class="proof">物体の落下距離yは時間xの2乗に比例する<br>y = ax² とおく<br>3秒で45m落ちるので 45 = a × <span class="blank">ア</span><br>9a = 45　a = 5　式は y = 5x²</div>',c:['3²','3','2×3','3³'],a:0,h:'xを2乗して代入します。',e:'3²＝9です。「2乗に比例する」は<span class="tm">y=ax²</span>の形になります。'},
{i:'T49',g:'2年',t:'確率',q:'（ア）に入るのは？<div class="proof">2枚のコインを投げて少なくとも1枚が表になる確率<br>すべての場合は 4通り<br>「1枚も表が出ない」のは裏裏の1通り<br>求める確率 = 1 - <span class="blank">ア</span> = 3/4</div>',c:['1/4','3/4','1/2','1'],a:0,h:'反対の場合の確率です。',e:'1/4を引きます。「少なくとも」は<span class="tm">余事象</span>を使うと速く求められます。'},
{i:'T50',g:'2年',t:'確率',q:'（ア）に入るのは？<div class="proof">大小2つのさいころを投げて目の和が6になる確率<br>すべての場合は 6×6 = 36通り<br>和が6になるのは (1,5)(2,4)(3,3)(4,2)(5,1) の <span class="blank">ア</span> 通り<br>確率は 5/36</div>',c:['5','6','4','3'],a:0,h:'組を数え上げます。',e:'5通りです。2つのさいころは<span class="tm">区別して</span>数えるので(1,5)と(5,1)は別の場合です。'}

const TYPES=[
 ['proof','証明の穴埋め','合同・相似・円などの証明を完成させる'],
 ['fill','解き方の穴埋め','文章題や公式の解法をたどる'],
 ['word','文章題・立式','何をxとおくか、どう式にするか'],
 ['fig','図・グラフの読み取り','図から角度や式を読み取る'],
 ['term','用語・定義','ことばの意味を確認する'],
 ['tf','正誤判定','よくある思いこみを見直す'],
 ['calc','計算','式を正確に処理する']
];
function judgeType(q){
 const t=q.q;
 if(/class="proof"/.test(t))
  return /△|証明|仮定より|合同|∽|≡|の性質の|定理/.test(t)?'proof':'fill';
 if(/【用語】/.test(t))return 'term';
 if(/【正誤】/.test(t))return 'tf';
 if(/買|配|歳|km|分後|時速|分速|食塩|濃度|割引|定価|おつり|代金|生徒|クラス|池の|袋の|工場|水そう|ろうそく|タクシー|影|道のり|往復|追いか|余り|足りない|人ずつ|何人|何個|何本|何冊|何分|とおく|xとする|方針|最初に|求めるには|手順/.test(t))return 'word';
 if(q.f)return 'fig';
 return 'calc';
}

function calcScore(t){
 let s=0;
 if(/\(/.test(t))s++;
 if(/[²³⁴]|\^/.test(t))s++;
 if(/√/.test(t))s++;
 if(/\//.test(t)&&!/y\s*=\s*\d+\/x/.test(t))s++;
 if((t.match(/[+\-×÷]/g)||[]).length>=2)s++;
 if(/両辺|移項|通分|分母|代入して/.test(t))s++;
 if(/[xy].*[xy].*=/.test(t))s++;
 return s;
}
function judgeLevel(q){
 const t=q.q,ml=maxLen(q);
 switch(q.ty){
  case 'proof':  return ml<=7?1:2;                       // 根拠の語句を選ぶだけなら基礎
  case 'fill':   return ml<=6?1:2;                       // 数や短い式を入れるだけなら基礎
  case 'word':   return /とおく|とおくとよい|何をx|方針|最初に|求めるには|手順|順番|考え方/.test(t)?1:2;
  case 'term':   return ml<=22?1:2;
  case 'tf':     return /相似比|面積比|体積比|変化の割合|余事象|判別式|重解|逆は|定理|条件|なるための|証明|独立|次数|累乗|符号|平方根|因数分解|移項|等式の性質/.test(t)?2:1;
  case 'fig':    return (/変域|変化の割合|四分位|累積|相対度数|階級値|証明|求めるには|体積|面積|長さ|の式は|通る|交点|相似|中心角|外角/.test(t)||calcScore(t)>=2)?2:1;
  default:       return calcScore(t)>=2?2:1;
 }
}
QD.forEach(q=>{q.ty=judgeType(q);q.d=judgeLevel(q);});

const cv=document.getElementById('fx'),cx=cv.getContext('2d');
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;

const COL=['#e8a0ae','#b9a8d4','#e0b877','#9ec9b8','#dfa38d','#a5bfd0','#f3dce4'];
let ps=[],running=false;
class P{constructor(x,y,tier){
 const sp=[5,8,11,15][tier];
 const a=Math.random()*Math.PI*2,v=Math.random()*sp+2;
 this.x=x;this.y=y;this.vx=Math.cos(a)*v;this.vy=Math.sin(a)*v-3;
 this.g=tier>=3?.22:.3;this.life=1;this.dec=tier>=2?.011:.016;
 this.size=[3,4,5,6][tier]+Math.random()*2.5;
 this.col=COL[(Math.random()*COL.length)|0];this.rot=Math.random()*6.3;this.vr=(Math.random()-.5)*.28;
 this.shape=tier>=2&&Math.random()<.45?'star':'rect';}
 up(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.vx*=.99;this.life-=this.dec;this.rot+=this.vr;}
 dr(){cx.save();cx.globalAlpha=Math.max(this.life,0)*.9;cx.translate(this.x,this.y);cx.rotate(this.rot);
  cx.fillStyle=this.col;const s=this.size;
  if(this.shape==='star'){cx.beginPath();
   for(let i=0;i<4;i++){const a=i*1.5708;cx.lineTo(Math.cos(a)*s,Math.sin(a)*s);
    const b=a+.785;cx.lineTo(Math.cos(b)*s*.3,Math.sin(b)*s*.3);}cx.closePath();cx.fill();}
  else cx.fillRect(-s/2,-s/2,s,s*.6);
  cx.restore();}}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);ps=ps.filter(p=>p.life>0);
 ps.forEach(p=>{p.up();p.dr();});
 if(ps.length)requestAnimationFrame(loop);else running=false;}
function burst(){
 const tier=S.lv>=16?3:S.lv>=8?2:S.lv>=4?1:0;
 const b=document.getElementById('app').getBoundingClientRect();
 const n=[14,28,48,80][tier];
 for(let i=0;i<n;i++)ps.push(new P(b.left+b.width/2,b.top+b.height*.42,tier));
 if(tier>=1)for(let i=0;i<n/2;i++){ps.push(new P(b.left+20,b.top+b.height*.75,tier));ps.push(new P(b.right-20,b.top+b.height*.75,tier));}
 if(tier>=2){const f=document.getElementById('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}
 if(tier>=3){const h=document.getElementById('hdr');h.classList.add('hot');setTimeout(()=>h.classList.remove('hot'),850);
  const a=document.getElementById('app');a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),420);}
 if(!running){running=true;requestAnimationFrame(loop);}}

const SET=10;
/* 出題順の優先度: 0=まちがえた 1=未出題 2=正解済み */
function prio(q){
 if(S.ng.includes(q.i))return 0;
 if(att(q.i).n===0)return 1;
 return 2;
}
function pickSet(arr,n){
 const g=[[],[],[]];
 arr.forEach(q=>g[prio(q)].push(q));
 g.forEach(a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}});
 return [...g[0],...g[1],...g[2]].slice(0,n||SET);
}
function shuffleChoices(q){
 const p=q.c.map((t,i)=>({t,ok:i===q.a}));
 for(let i=p.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[p[i],p[j]]=[p[j],p[i]];}
 return {c:p.map(x=>x.t),a:p.findIndex(x=>x.ok)};}

let curSource=[];
function start(qs,key,label){
 curSource=qs;
 const set=pickSet(qs);
 list=set.map(q=>{const s=shuffleChoices(q);return Object.assign({},q,{c:s.c,a:s.a});});
 curKey=key;curLabel=label;idx=0;ses={ok:0,ng:0};wrongRun=0;show('quiz');render();tick.on=true;}

function buildFig(q){
 if(q.s)return q.s;
 if(!q.f)return null;
 const [n,a]=q.f;const fn=FIG[n]||GEO[n]||STA[n];
 if(!fn)return null;
 try{return fn.apply(null,a||[]);}catch(e){return null;}}
