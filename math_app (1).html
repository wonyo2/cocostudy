function grade(){
 const q=list[idx],ok=sel===q.a;locked=true;
 [...document.getElementById('choices').children].forEach((e,i)=>{
  e.classList.add('locked');e.classList.remove('sel');
  if(i===q.a)e.classList.add('ok');else if(i===sel)e.classList.add('ng');});
 const fb=document.getElementById('fb');fb.classList.add('show',ok?'ok':'ng');
 const pt=document.getElementById('fbp');
 if(ok){
  ses.ok++;S.streak++;wrongRun=0;if(S.streak>S.best)S.best=S.streak;
  {const p=S.ng.indexOf(q.i);if(p>=0)S.ng.splice(p,1);}
  {const r=att(q.i);S.rec[q.i]={n:r.n+1,o:r.o+1};S.ans++;}
  let gain=q.d===2?15:10,extra='';
  if(S.streak%10===0){gain+=50;extra=' +50 bonus';}
  else if(S.streak%5===0){gain+=20;extra=' +20 bonus';}
  S.pt+=gain;
  document.getElementById('fbt').textContent=S.chuu?'撃破':'正解';
  pt.textContent=`+${gain} ${S.chuu?'魔力':'pt'}${extra}`;pt.style.display='inline-block';
  const cm=curMsg();
  let m=pick(cm.ok),tech=null;
  if(S.streak>=10&&S.streak%10===0){m=pick(cm.s10);tech=S.chuu?CTECH.s10:null;}
  else if(S.streak>=5&&S.streak%5===0){m=pick(cm.s5);tech=S.chuu?CTECH.s5:null;}
  else if(S.streak===3){m=pick(cm.s3);tech=S.chuu?CTECH.s3:null;}
  const r0=att(q.i);
  let note='';
  if(r0.n===1)note='はじめての挑戦で正解';
  else if(r0.o===1)note=r0.n+'回目でようやく正解';
  else note=r0.n+'回目の挑戦・正解'+r0.o+'回目';
  document.getElementById('fbm').innerHTML=m+'<div class="fbnote">'+note+'</div>';
  sfx('ok');burst();
  if(tech)kanjiFlash(tech);
  if(S.pt>=S.lv*PER)setTimeout(levelUp,520);
 }else{
  ses.ng++;S.streak=0;wrongRun++;
  if(!S.ng.includes(q.i)){S.ng.push(q.i);if(S.ng.length>400)S.ng.shift();}
  {const r=att(q.i);S.rec[q.i]={n:r.n+1,o:r.o};S.ans++;}
  document.getElementById('fbt').textContent=S.chuu?'……不覚':'不正解';
  pt.style.display='none';
  const cm=curMsg();
  const m=wrongRun>=3?pick(cm.ngRun):pick(cm.ng);
  const r1=att(q.i);
  const note1=r1.n===1?'はじめての挑戦':r1.n+'回目の挑戦（正解'+r1.o+'回）';
  document.getElementById('fbm').innerHTML=`${m}<div class="ansline">正解 — <b>${String.fromCharCode(65+q.a)}. ${q.c[q.a]}</b></div><div class="fbnote">${note1}</div>`;
  sfx('ng');
 }

 document.getElementById('preBtns').style.display='none';
 document.getElementById('postBtns').style.display='flex';
 document.getElementById('nextBtn').textContent=(idx===list.length-1)?'結果を見る':'次へ';
 hud();save();}

function levelUp(){
 S.lv++;sfx('lv');
 const p=document.getElementById('lvpop');
 document.getElementById('lvn').textContent=S.lv;
 document.getElementById('lvr').textContent=rank(S.lv);
 document.querySelector('#lvpop h2').textContent=S.chuu?'覚醒 -AWAKEN-':'LEVEL UP';
 p.classList.add('show');
 for(let k=0;k<3;k++)setTimeout(burst,k*230);
 if(S.chuu)setTimeout(()=>kanjiFlash(CTECH.lv),150);
 setTimeout(()=>p.classList.remove('show'),2200);
 hud();save();}

function hud(){
 document.getElementById('lv').textContent=S.lv;
 document.getElementById('tp').textContent=S.pt;
 document.getElementById('st').textContent=S.streak;
 document.getElementById('rankName').textContent=rank(S.lv);
 const base=(S.lv-1)*PER,need=S.lv*PER;
 const pc=Math.max(0,Math.min(100,Math.round((S.pt-base)/(need-base)*100)));
 document.getElementById('pf').style.width=pc+'%';
 document.getElementById('pp').textContent=pc+'%';}

function saveBest(){if(curKey&&ses.ok>(S.done[curKey]||0)){S.done[curKey]=ses.ok;save();}}
function goHome(){tick.on=false;list=[];idx=0;ses={ok:0,ng:0};wrongRun=0;renderMenu();show('menu');window.scrollTo(0,0);}

document.getElementById('nextBtn').onclick=()=>{if(idx<list.length-1){idx++;render();window.scrollTo(0,0);}else finish();};
document.getElementById('quitBtn').onclick=()=>finish();
document.getElementById('backBtn').onclick=goHome;
document.getElementById('retryBtn').onclick=()=>{start(curSource.length?curSource:list,curKey,curLabel);};
document.getElementById('homeBtn').onclick=()=>{
 if(ses.ok+ses.ng===0){goHome();return;}
 dialog('CONFIRM','ホームに戻ります。<br>ここまでの記録は保存されます。',
  [{label:'続ける'},{label:'ホームへ',primary:true,fn:()=>{saveBest();goHome();}}]);};
document.getElementById('hintBtn').onclick=()=>{
 dialog('HINT',list[idx].h,[{label:'閉じる',primary:true}]);};
document.getElementById('bkBtn').onclick=()=>{const id=list[idx].i,p=S.bk.indexOf(id);
 if(p>=0)S.bk.splice(p,1);else S.bk.push(id);
 document.getElementById('bkBtn').textContent=S.bk.includes(id)?'★':'☆';save();};

function finish(){
 tick.on=false;
 const total=ses.ok+ses.ng,rate=total?Math.round(ses.ok/total*100):0;
 saveBest();
 const star=rate>=90?3:rate>=70?2:rate>=40?1:0;
 document.getElementById('rStars').textContent='✦'.repeat(star)+'✧'.repeat(3-star);
 const set=rate>=90?['✦','ほぼ完璧です','この単元は仕上がっています。次に進んで大丈夫です']
  :rate>=70?['◈','よくできました','あと少しで満点。間違えた問題だけ見直しましょう']
  :rate>=40?['◇','いいペースです','解説を読み直せば、次はもっと伸びます']
  :['◌','ここからです','くり返すほど確実に身につく範囲です'];
 document.getElementById('rIco').textContent=set[0];
 document.getElementById('rTitle').textContent=set[1];
 document.getElementById('rSub').textContent=set[2];
 document.getElementById('rCard').innerHTML=`
  <div class="rrow"><span>${curLabel}</span><span>${S.diff===1?'基礎':'標準'}</span></div>
  <div class="rrow"><span>正解数</span><strong>${ses.ok} / ${total}</strong></div>
  <div class="rrow"><span>正答率</span><strong>${rate}%</strong></div>
  <div class="rrow"><span>最高連続</span><strong>${S.best}</strong></div>
  <div class="rrow"><span>ランク</span><span style="font-size:13px">Lv.${S.lv}　${rank(S.lv)}</span></div>
  <div class="rrow"><span>通算学習時間</span><strong style="font-size:15px">${fmtTime(S.time).replace(/<em>/g,'').replace(/<\/em>/g,'')}</strong></div>`;
 lastResult={label:curLabel,diff:S.diff,ok:ses.ok,total,rate,best:S.best,lv:S.lv,rk:rank(S.lv),time:S.time,ans:S.ans};
 if(rate>=70){setTimeout(burst,220);if(rate>=90)setTimeout(burst,560);}
 show('result');window.scrollTo(0,0);}

/* ================= 保護者へLINE共有 ================= */
let lastResult=null;
function fmtTimePlain(sec){
 const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
 return h+'時間'+String(m).padStart(2,'0')+'分';
}
function pad2(n){return String(n).padStart(2,'0');}
function buildReport(){
 const r=lastResult;if(!r)return'';
 const d=new Date();
 const dateStr=d.getFullYear()+'/'+pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
 return [
  '📘 数学アプリ 学習レポート',
  dateStr,
  '',
  '単元：'+r.label+'（'+(r.diff===1?'基礎':'標準')+'）',
  '今回の正解：'+r.ok+' / '+r.total+'問（正答率 '+r.rate+'%）',
  '今回の最高連続正解：'+r.best,
  '',
  '【通算】',
  'レベル：Lv.'+r.lv+'　'+r.rk,
  '総解答数：'+r.ans+'問',
  '総学習時間：'+fmtTimePlain(r.time)
 ].join('\n');
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function shareResult(){
 const text=buildReport();
 if(navigator.share){
  try{await navigator.share({text});return;}
  catch(e){if(e&&e.name==='AbortError')return;}
 }
 try{
  const url='https://line.me/R/msg/text/?'+encodeURIComponent(text);
  window.open(url,'_blank');
 }catch(e){
  dialog('LINE','この端末では自動で開けませんでした。<br>「結果をコピー」から文章をコピーし、LINEのトークに貼り付けて送ってください。',[{label:'閉じる',primary:true}]);
 }
}
function copyResult(){
 const text=buildReport();
 const showBox=()=>dialog('コピー用テキスト','下の文章を選択してコピーし、LINEのトークに貼り付けてください。<br><br><textarea class="reportbox" readonly onclick="this.select()">'+escapeHtml(text)+'</textarea>',[{label:'閉じる',primary:true}]);
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(()=>{
   dialog('コピー完了','結果をコピーしました。<br>LINEのトーク画面に貼り付けて送信してください。',[{label:'閉じる',primary:true}]);
  }).catch(showBox);
 }else{showBox();}
}
document.getElementById('lineBtn').onclick=shareResult;
document.getElementById('copyBtn').onclick=copyResult;

/* ================= 学習時間 ================= */
const MILE=[[0.5,'まず30分'],[1,'1時間'],[3,'3時間'],[5,'5時間'],[10,'10時間'],[20,'20時間'],
 [30,'30時間'],[50,'50時間'],[75,'75時間'],[100,'100時間']];
const tick={on:false,n:0};
setInterval(()=>{
 if(!tick.on)return;
 if(!document.getElementById('quiz').classList.contains('show'))return;
 S.time++;tick.n++;
 if(tick.n%20===0)save();
},1000);
function fmtTime(sec){
 const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
 return h+'<em>時間</em>'+String(m).padStart(2,'0')+'<em>分</em>';
}
function renderTime(){
 const hrs=S.time/3600;
 document.getElementById('tBig').innerHTML=fmtTime(S.time);
 document.getElementById('tCnt').textContent=S.ans+'問 解答';
 let prev=0,goal=MILE[MILE.length-1];
 for(const m of MILE){if(hrs<m[0]){goal=m;break;}prev=m[0];}
 const span=goal[0]-prev,pct=Math.max(0,Math.min(100,Math.round((hrs-prev)/span*100)));
 const rest=Math.max(0,goal[0]*3600-S.time);
 const rh=Math.floor(rest/3600),rm=Math.ceil(rest%3600/60);
 document.getElementById('tNext').textContent=
  hrs>=100?'100時間達成':'次は'+goal[1]+'　あと'+(rh?rh+'時間':'')+rm+'分';
 document.getElementById('tFill').style.width=pct+'%';
}

/* ================= 問題一覧 ================= */
let bFilter='all',bUnit='',bQuery='';
const byId={};QD.forEach(q=>byId[q.i]=q);

function browseSource(){
 if(bFilter==='bk')return S.bk.map(i=>byId[i]).filter(Boolean);
 if(bFilter==='ng')return S.ng.map(i=>byId[i]).filter(Boolean);
 return QD.filter(q=>q.g===curGrade&&q.d===S.diff);
}
function browseList(){
 let a=browseSource();
 if(bUnit)a=a.filter(q=>q.t===bUnit);
 if(bQuery){
  const k=bQuery.toLowerCase();
  a=a.filter(q=>(q.q+q.e+q.c.join('')).replace(/<[^>]+>/g,'').toLowerCase().includes(k));
 }
 return a;
}
function fillUnitSelect(){
 const sel=document.getElementById('bUnit');
 const units=[...new Set(browseSource().map(q=>q.t))]
  .sort((a,b)=>{const ia=TOPIC_ORDER.indexOf(a),ib=TOPIC_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
 const keep=bUnit;
 sel.innerHTML='<option value="">すべての単元</option>'+units.map(u=>`<option value="${u}">${u}</option>`).join('');
 if(units.includes(keep))sel.value=keep;else{bUnit='';sel.value='';}
}
function renderBrowse(){
 const wrap=document.getElementById('blist');wrap.innerHTML='';
 const a=browseList();
 document.getElementById('bCount').textContent=
  (bFilter==='bk'?'★ 保存した問題':bFilter==='ng'?'まちがえた問題':'中'+curGrade+'・'+(S.diff===1?'基礎':'標準'))+' — '+a.length+' 件';
 document.getElementById('bStart').style.display=a.length>=1?'block':'none';
 if(!a.length){
  wrap.innerHTML='<div class="bempty">'+(bFilter==='bk'
   ?'まだ保存された問題はありません。<br>問題画面の ☆ を押すとここに集まります。'
   :bFilter==='ng'?'まちがえた問題はまだありません。<br>解き進めるとここに記録されます。'
   :'条件に合う問題が見つかりません。')+'</div>';
  return;
 }
 a.forEach((q,n)=>{
  const it=document.createElement('div');it.className='bitem';
  const tyName=(TYPES.find(t=>t[0]===q.ty)||[,''])[1];
  const body=q.q.replace('【正誤】','').replace('【用語】','');
  it.innerHTML=`<div class="bhead">
    <span class="bno">${String(n+1).padStart(3,'0')}</span>
    <span class="bmain"><span class="bq">${body}</span>
     <span class="btags"><span class="btag ${q.d===1?'e':'b'}">${q.d===1?'基礎':'標準'}</span>
     <span class="btag">${q.t}</span><span class="btag">${tyName}</span>
     ${(()=>{const r=att(q.i);return r.n===0?'<span class="btag n0">未挑戦</span>'
      :`<span class="btag n">${r.n}回 ・ 正解${r.o}</span>`;})()}
     ${S.ng.includes(q.i)?'<span class="btag s">要復習</span>':''}</span></span>
    <button class="bstar">${S.bk.includes(q.i)?'★':'☆'}</button></div>
   <div class="bdet">
    ${q.f||q.s?`<div class="bfig">${buildFig(q)||''}</div>`:''}
    ${q.c.map((c,i)=>`<div class="bch ${i===q.a?'ok':''}"><span class="bl">${String.fromCharCode(65+i)}</span><span>${c}${i===q.a?'　←正解':''}</span></div>`).join('')}
    <div class="bex"><div class="bex-h">EXPLANATION</div>${q.e}</div>
    <div class="bex"><div class="bex-h">HINT</div>${q.h}</div>
   </div>`;
  it.querySelector('.bhead').onclick=e=>{
   if(e.target.classList.contains('bstar'))return;
   it.classList.toggle('open');};
  it.querySelector('.bstar').onclick=e=>{
   e.stopPropagation();
   const p=S.bk.indexOf(q.i);
   if(p>=0)S.bk.splice(p,1);else S.bk.push(q.i);
   e.target.textContent=S.bk.includes(q.i)?'★':'☆';save();
   if(bFilter==='bk')renderBrowse();};
  wrap.appendChild(it);});
}
function openBrowse(f){
 bFilter=f;bQuery='';document.getElementById('bSearch').value='';
 document.querySelectorAll('.bchip').forEach(c=>c.classList.toggle('on',c.dataset.f===f));
 fillUnitSelect();renderBrowse();show('browse');window.scrollTo(0,0);}

document.getElementById('listBtn').onclick=()=>openBrowse('all');
document.getElementById('bkBtn2').onclick=()=>openBrowse('bk');
document.getElementById('ngBtn').onclick=()=>openBrowse('ng');
document.querySelectorAll('.bchip').forEach(c=>c.onclick=()=>openBrowse(c.dataset.f));
document.getElementById('bUnit').onchange=e=>{bUnit=e.target.value;renderBrowse();};
document.getElementById('bSearch').oninput=e=>{bQuery=e.target.value.trim();renderBrowse();};
document.getElementById('bStart').onclick=()=>{
 const a=browseList();if(!a.length)return;
 initAudio();
 const label=bFilter==='bk'?'★ 保存した問題':bFilter==='ng'?'まちがえた問題':(bUnit||'中'+curGrade);
 start(a,null,label);};

/* ================= 起動 ================= */
load();
document.querySelectorAll('.lvbtn').forEach(b=>b.classList.toggle('on',+b.dataset.d===S.diff));
applyMode();hud();renderTime();renderMenu();show('menu');
</script>
