  {id:"phy466", cat:"物理", sub:"力の働き", q:"図の動滑車を1個使っておもりを持ち上げるとき、引く力の大きさと、引く糸の長さの関係として正しいものはどれか。", choices:["力は半分ですむが、引く糸の長さは2倍になる","力も糸の長さも半分になる","力は2倍必要だが、糸の長さは半分になる","力も糸の長さも変わらない"], diff:"標準", a:0, e:"【図の読み取り】動滑車を使うと、おもりの重さを2本の糸で支える形になっているのが図から分かります。／【考え方】動滑車1個を使うと、おもりの重さを2本の糸で分担して支えるため、必要な力は半分になります。ただし、おもりを1m持ち上げるには糸を2m引く必要があり、糸を引く距離は2倍になります。", img:"<svg viewBox='0 0 160 170' xmlns='http://www.w3.org/2000/svg'><line x1='40' y1='10' x2='40' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='120' y1='30' x2='40' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='40' y1='30' x2='40' y2='90' stroke='#E8709F' stroke-width='2'/><circle cx='75' cy='105' r='15' fill='none' stroke='#4A3B47' stroke-width='3'/><path d='M 60 105 A 15 15 0 0 1 75 90' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='40' y1='90' x2='60' y2='105' stroke='#E8709F' stroke-width='2'/><line x1='90' y1='105' x2='120' y2='30' stroke='#E8709F' stroke-width='2'/><line x1='120' y1='30' x2='140' y2='60' stroke='#A88BD4' stroke-width='2'/><text x='145' y='65' font-size='10' fill='#4A3B47'>引く力</text><line x1='75' y1='120' x2='75' y2='140' stroke='#7FC8A9' stroke-width='2'/><rect x='65' y='140' width='20' height='20' fill='#7FC8A9'/><text x='75' y='168' font-size='10' text-anchor='middle' fill='#4A3B47'>おもり</text></svg>"},
  {id:"phy467", cat:"物理", sub:"電流と回路", q:"図のように電流計（A）を回路につなぐ方法として、正しいつなぎ方はどれか。", choices:["電球に対して直列につなぐ","電球に対して並列につなぐ","電源に直接つなぐ","つなぎ方はどこでもよい"], diff:"基礎", a:0, e:"【図の読み取り】電流計が電球と1本道でつながれている（直列つなぎ）ようすが描かれています。／【なぜ直列？】電流計は回路を流れる電流の量を測る道具です。電流計自体の中を電流が通らないと正しく測れないため、電流の通り道に割りこむように直列につなぎます。", img:"<svg viewBox='0 0 260 130' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='30' x2='30' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='100' x2='230' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='230' y1='100' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='30' x2='80' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='140' y1='30' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><circle cx='110' cy='30' r='30' fill='none' stroke='#E8709F' stroke-width='2'/><text x='110' y='35' font-size='16' text-anchor='middle' fill='#E8709F'>A</text><rect x='95' y='75' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='103' y='108' font-size='10' text-anchor='middle' fill='#4A3B47'>電球</text><line x1='30' y1='60' x2='30' y2='70' stroke='#4A3B47' stroke-width='4'/><text x='45' y='68' font-size='10' fill='#4A3B47'>電池</text></svg>"},
  {id:"phy468", cat:"物理", sub:"電流と回路", q:"図のように電流計を誤って電源に直接つないでしまうとどうなる危険性があるか。", choices:["大きな電流が流れすぎて電流計が壊れることがある","電流計が自動的に電圧計に変わる","回路の電圧が急に下がる","特に危険性はない"], diff:"標準", a:0, e:"【図の読み取り】電流計は電気抵抗が非常に小さく作られています。／【考え方】電流計を電球などを通さずに電源に直接つないでしまうと、抵抗がほとんどない状態になり、非常に大きな電流が流れてしまいます。これにより電流計の針が振り切れたり、電流計そのものが壊れてしまったりする危険があるため、正しいつなぎ方を守ることが大切です。", img:"<svg viewBox='0 0 260 130' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='30' x2='30' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='100' x2='230' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='230' y1='100' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='30' x2='80' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='140' y1='30' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><circle cx='110' cy='30' r='30' fill='none' stroke='#E8709F' stroke-width='2'/><text x='110' y='35' font-size='16' text-anchor='middle' fill='#E8709F'>A</text><rect x='95' y='75' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='103' y='108' font-size='10' text-anchor='middle' fill='#4A3B47'>電球</text><line x1='30' y1='60' x2='30' y2='70' stroke='#4A3B47' stroke-width='4'/><text x='45' y='68' font-size='10' fill='#4A3B47'>電池</text></svg>"},
  {id:"phy469", cat:"物理", sub:"電流と回路", q:"図の回路で、電流計を電球と並列につないでしまった場合、正しい測定ができない理由として正しいものはどれか。", choices:["電流計は抵抗が非常に小さく、大きな電流が流れすぎてしまうから","並列につなぐと電圧しか測れなくなるから","並列につなぐと電流が逆向きに流れるから","並列につなぐと回路が切れてしまうから"], diff:"標準", a:0, e:"【図の読み取り】この図では電流計は電球に対して直列に正しくつながれています。／【誤った場合の問題点】もし電流計を並列につないでしまうと、抵抗の非常に小さい電流計の方に大量の電流が集中して流れ込み、正しい測定ができないばかりか電流計が破損する危険があります。電流計は必ず直列、電圧計は並列という基本をおさえておきましょう。", img:"<svg viewBox='0 0 260 130' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='30' x2='30' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='100' x2='230' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='230' y1='100' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='30' x2='80' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='140' y1='30' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><circle cx='110' cy='30' r='30' fill='none' stroke='#E8709F' stroke-width='2'/><text x='110' y='35' font-size='16' text-anchor='middle' fill='#E8709F'>A</text><rect x='95' y='75' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='103' y='108' font-size='10' text-anchor='middle' fill='#4A3B47'>電球</text><line x1='30' y1='60' x2='30' y2='70' stroke='#4A3B47' stroke-width='4'/><text x='45' y='68' font-size='10' fill='#4A3B47'>電池</text></svg>"},
  {id:"phy470", cat:"物理", sub:"力の働き", q:"図は机の上に置かれた物体にはたらく力を表している。この物体が静止しているのはなぜか。", choices:["重力と垂直抗力がつり合っているから","重力だけがはたらいているから","垂直抗力だけがはたらいているから","力は何もはたらいていないから"], diff:"基礎", a:0, e:"【図の読み取り】物体には下向きの重力（下の矢印）と、上向きの垂直抗力（上の矢印）の2つの力がはたらいているようすが描かれています。／【考え方】この2つの力は大きさが等しく、向きが反対で、同一直線上にあるため、たがいに打ち消し合ってつり合っています。力がつり合っているため、物体は静止したままでいられます。", img:"<svg viewBox='0 0 220 140' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='90' width='160' height='10' fill='#D6C4A8'/><rect x='90' y='60' width='40' height='30' fill='#7FC8A9'/><text x='110' y='80' font-size='10' text-anchor='middle' fill='#fff'>物体</text><line x1='110' y1='90' x2='110' y2='130' stroke='#E8709F' stroke-width='2'/><polygon points='110,130 104,118 116,118' fill='#E8709F'/><text x='110' y='138' font-size='10' text-anchor='middle' fill='#4A3B47'>重力</text><line x1='110' y1='60' x2='110' y2='20' stroke='#A88BD4' stroke-width='2'/><polygon points='110,20 104,32 116,32' fill='#A88BD4'/><text x='140' y='30' font-size='10' fill='#4A3B47'>垂直抗力</text></svg>"},
  {id:"phy471", cat:"物理", sub:"力の働き", q:"図のように、物体を支える机を取り除くと、物体はどうなるか。", choices:["重力だけがはたらき、下に落ちる","そのまま同じ位置に静止し続ける","垂直抗力だけがはたらき、上に浮く","何も変化しない"], diff:"標準", a:0, e:"【図の読み取り】机がある間は、重力と垂直抗力がつり合って物体は静止しています。／【考え方】机を取り除くと、上向きの垂直抗力がなくなり、下向きの重力だけが物体にはたらくようになります。力のつり合いがくずれるため、物体は重力にしたがって下に落下し始めます。", img:"<svg viewBox='0 0 220 140' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='90' width='160' height='10' fill='#D6C4A8'/><rect x='90' y='60' width='40' height='30' fill='#7FC8A9'/><text x='110' y='80' font-size='10' text-anchor='middle' fill='#fff'>物体</text><line x1='110' y1='90' x2='110' y2='130' stroke='#E8709F' stroke-width='2'/><polygon points='110,130 104,118 116,118' fill='#E8709F'/><text x='110' y='138' font-size='10' text-anchor='middle' fill='#4A3B47'>重力</text><line x1='110' y1='60' x2='110' y2='20' stroke='#A88BD4' stroke-width='2'/><polygon points='110,20 104,32 116,32' fill='#A88BD4'/><text x='140' y='30' font-size='10' fill='#4A3B47'>垂直抗力</text></svg>"},
  {id:"phy472", cat:"物理", sub:"光と音", q:"図のような波で、山から次の山までの長さaを何というか。", choices:["波長","振幅","振動数","周期"], diff:"基礎", a:0, e:"【図の読み取り】図の横向きの矢印で示された、山から次の山までの長さが波長です。／【ことばの意味】「波長」＝波の1つの山から次の山まで（または谷から次の谷まで）の長さ。音や光など、あらゆる波に共通して使われる用語です。", img:"<svg viewBox='0 0 240 100' xmlns='http://www.w3.org/2000/svg'><line x1='10' y1='50' x2='230' y2='50' stroke='#ccc' stroke-width='1'/><path d='M 10 50 Q 35 10 60 50 T 110 50 T 160 50 T 210 50' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='60' y1='50' x2='60' y2='10' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='110' y1='50' x2='110' y2='10' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='60' y1='15' x2='110' y2='15' stroke='#A88BD4' stroke-width='1.5'/><text x='85' y='12' font-size='10' text-anchor='middle' fill='#4A3B47'>波長</text><line x1='35' y1='50' x2='35' y2='10' stroke='#7FC8A9' stroke-width='1.5'/><text x='20' y='30' font-size='10' fill='#4A3B47'>振幅</text></svg>"},
  {id:"phy473", cat:"物理", sub:"光と音", q:"図のような波で、ふれはばの大きさ（山の高さ）bを何というか。", choices:["振幅","波長","振動数","周期"], diff:"基礎", a:0, e:"【図の読み取り】図の縦向きの矢印で示された、波の中心から山の頂点までの高さが振幅です。／【ことばの意味】「振幅」＝波のふれはばの大きさ。音の場合、振幅が大きいほど音は大きくなります（音の高さとは別の要素）。波長と振幅は、どちらも波の性質を表す基本的な用語として区別して覚えておきましょう。", img:"<svg viewBox='0 0 240 100' xmlns='http://www.w3.org/2000/svg'><line x1='10' y1='50' x2='230' y2='50' stroke='#ccc' stroke-width='1'/><path d='M 10 50 Q 35 10 60 50 T 110 50 T 160 50 T 210 50' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='60' y1='50' x2='60' y2='10' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='110' y1='50' x2='110' y2='10' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='60' y1='15' x2='110' y2='15' stroke='#A88BD4' stroke-width='1.5'/><text x='85' y='12' font-size='10' text-anchor='middle' fill='#4A3B47'>波長</text><line x1='35' y1='50' x2='35' y2='10' stroke='#7FC8A9' stroke-width='1.5'/><text x='20' y='30' font-size='10' fill='#4A3B47'>振幅</text></svg>"},
  {id:"phy474", cat:"物理", sub:"力の働き", q:"ばねに力を加えていないとき、ばねの長さを何というか。", choices:["自然の長さ（もとの長さ）","最大の長さ","最小の長さ","伸びた長さ"], diff:"基礎", a:0, e:"【ことばの意味】「自然の長さ」＝ばねに何も力を加えていないときの、もとの長さ。／【伸びとの関係】ばねの伸び＝力を加えたときの長さ－自然の長さ、という計算で求めます。フックの法則の実験では、この自然の長さを基準にして、加えた力とばねの伸びの関係を調べます。"},
  {id:"phy475", cat:"物理", sub:"力の働き", q:"物体の重さをニュートン(N)で表すとき、質量100gの物体の重さはおよそ何Nか（重力加速度を10とする）。", choices:["1N","10N","100N","0.1N"], diff:"標準", a:0, e:"【考え方】質量100g＝0.1kg。重さ（N）＝質量（kg）×10とすると、0.1×10＝1N。／【覚え方】質量100gの物体（りんご1個くらいの重さ）にはたらく重力は、およそ1Nと覚えておくと、他の計算問題にも応用しやすくなります。"},
  {id:"phy476", cat:"物理", sub:"電流と回路", q:"回路の中で、電流の流れをさまたげるはたらきをするものを何というか。", choices:["抵抗","電圧","電力","電流"], diff:"基礎", a:0, e:"【ことばの意味】「抵抗」＝電流の流れにくさを表す量。単位はΩ（オーム）。／【関係式】オームの法則：電圧＝電流×抵抗という関係があります。抵抗が大きいほど、同じ電圧でも流れる電流は小さくなります。電熱線などが抵抗の役割を果たす代表的な部品です。"},
  {id:"phy477", cat:"物理", sub:"電流と回路", q:"電熱線に電流を流すと熱が発生する。この現象を利用した家庭用の器具はどれか。", choices:["電気ポット","懐中電灯のレンズ","方位磁針","虫めがね"], diff:"基礎", a:0, e:"【考え方】電熱線に電流を流すと、電気抵抗のはたらきによって電気エネルギーの一部が熱エネルギーに変わります。電気ポットやアイロン、トースターなどは、この発熱を利用してお湯をわかしたり食品を温めたりする器具です。"},
  {id:"phy478", cat:"物理", sub:"磁界と電流", q:"棒磁石のまわりにできる、磁力がはたらく空間を何というか。", choices:["磁界","電界","重力場","気圏"], diff:"基礎", a:0, e:"【ことばの意味】「磁界」＝磁石の力（磁力）がはたらいている空間。／【見える化する方法】磁石のまわりに鉄粉をまくと、鉄粉が磁界の向きにそって模様をえがきます。方位磁針を置くと、その場所の磁界の向きに合わせてN極が向きを変えることでも、磁界の存在を確かめることができます。"},
  {id:"phy479", cat:"物理", sub:"磁界と電流", q:"棒磁石のまわりの磁界の向きは、どこからどこへ向かうと決められているか。", choices:["N極からS極へ向かう向き","S極からN極へ向かう向き","磁界に向きはない","磁石の中心から外側だけに向かう"], diff:"標準", a:0, e:"【ことばの意味】磁界には向きがあり、磁石の外側では、N極から出てS極に入る向きと決められています。／【方位磁針での確認】方位磁針を磁石のまわりに置くと、N極が指す向きが、その場所での磁界の向きを示します。この向きをたどっていくと、磁石のN極から出てS極に入る曲線になります。"},
  {id:"phy480", cat:"物理", sub:"光と音", q:"光が空気中を進む速さは、およそどれくらいか。", choices:["秒速約30万km","秒速約30万m","秒速約3km","秒速約300km"], diff:"標準", a:0, e:"【考え方】光の速さは非常に速く、空気中（ほぼ真空中と同じ）では秒速約30万km（正確には秒速約29万9792km）です。／【身近な比較】地球を1秒間に7周半できるほどの速さです。音の速さ（秒速約340m）と比べると、桁違いに速いことが分かります。"},
  {id:"phy481", cat:"物理", sub:"光と音", q:"太陽の光が七色に分かれて見える虹は、何という現象によって起こるか。", choices:["光の分散","光の反射のみ","音の反射","光の吸収"], diff:"標準", a:0, e:"【考え方】空気中の水滴がプリズムのような役割をし、太陽の光（いろいろな色の光が混ざった白色光）を、色ごとに屈折させて分けます。これを光の分散といいます。雨上がりに虹が見えるのは、空気中に残った水滴によってこの分散が起こるためです。"},
  {id:"phy482", cat:"物理", sub:"運動とエネルギー", q:"物体が一定の速さで一直線上を動く運動を、時間と移動距離のグラフに表すと、どのような形になるか。", choices:["原点を通る直線","曲線","水平な直線","縦の直線"], diff:"標準", a:0, e:"【考え方】等速直線運動では、時間に比例して移動距離が増えていきます。このような比例の関係をグラフに表すと、原点（0,0）を通る右上がりの直線になります。直線のかたむき（傾き）が大きいほど、速さが速いことを表します。"},
  {id:"phy483", cat:"物理", sub:"運動とエネルギー", q:"物体を高い位置で静かに手をはなすと、真下に落下していく。この運動を何というか。", choices:["自由落下","等速直線運動","円運動","往復運動"], diff:"基礎", a:0, e:"【ことばの意味】「自由落下」＝物体が重力だけを受けて真下に落ちていく運動。／【特徴】自由落下では、時間がたつにつれてどんどん速さが増していきます（加速していきます）。空気抵抗を考えなければ、物体の質量に関係なく、同じ高さから同時に落とすと同じ速さで落下します。"},
  {id:"phy484", cat:"物理", sub:"力の働き", q:"物体の運動の状態を変える原因になるものは何か。", choices:["力","色","におい","温度のみ"], diff:"基礎", a:0, e:"【考え方】物体の速さや向きが変わる（運動の状態が変わる）ためには、その物体に力がはたらく必要があります。力がはたらかなければ、静止している物体は静止し続け、動いている物体は等速直線運動を続けます（慣性の法則）。"},
  {id:"phy485", cat:"物理", sub:"電流と回路", q:"家庭のコンセントから得られる電流のように、向きが周期的に入れかわる電流を何というか。", choices:["交流","直流","静電流","定常電流"], diff:"基礎", a:0, e:"【ことばの意味】「交流」＝電流の向きが周期的に入れかわる電流。家庭のコンセントの電気がこれにあたります。／【直流との違い】乾電池のように、電流の向きがいつも同じ電流を直流といいます。交流は変圧器で電圧を変えやすいため、発電所から家庭までの送電に広く利用されています。"},
  {id:"phy486", cat:"物理", sub:"エネルギーの利用", q:"電気をたくわえておき、必要なときに電気として取り出せる装置を何というか。", choices:["電池（蓄電池をふくむ）","変圧器","発電機","抵抗器"], diff:"基礎", a:0, e:"【ことばの意味】「電池」＝化学エネルギーなどを利用して、電気エネルギーをたくわえたり生み出したりする装置。／【種類】使い切りの一次電池（乾電池など）と、くり返し充電して使える二次電池（蓄電池、スマートフォンのバッテリーなど）があります。"},
  {id:"phy487", cat:"物理", sub:"力の働き", q:"物体の運動には力がおよぼす影響がある。力がはたらいていないとき、静止している物体はどうなるか。", choices:["静止したままである","少しずつ動き出す","急に速く動き出す","色が変化する"], diff:"基礎", a:0, e:"【ことばの意味】「慣性の法則」＝物体は外から力を受けなければ、今の運動の状態を続けようとする性質。静止している物体に力がはたらかなければ、その物体はそのまま静止し続けます。この性質を慣性といいます。"},
  {id:"phy488", cat:"物理", sub:"熱の伝わり方", q:"氷がとけて水になるときのように、物質が状態を変えるときに周囲から吸収する熱を何というか。", choices:["融解熱（潜熱の一種）","放射熱","比熱","伝導熱"], diff:"標準", a:0, e:"【ことばの意味】「融解熱」＝固体が液体にとけるときに吸収する熱。物質の温度は変えず、状態を変えるためだけに使われる熱です。／【身近な利用】保冷剤に氷を使うと周囲を冷やせるのは、氷がとけるときに周囲から熱を吸収するためです。"},
  {id:"phy489", cat:"物理", sub:"光と音", q:"音が伝わるために必要なものは何か。", choices:["空気や水などの物質（媒質）","光","真空","電気"], diff:"基礎", a:0, e:"【考え方】音は物質の振動が波として伝わる現象です。空気・水・金属など、何らかの物質（媒質）がないと音は伝わりません。宇宙空間のような真空中では、音を伝える物質がないため、音はまったく聞こえません。"},
  {id:"phy490", cat:"物理", sub:"光と音", q:"糸電話で声が伝わるとき、音はどのようにして相手に届いているか。", choices:["糸の振動が伝わって、相手側の紙コップを振動させている","電気信号として伝わっている","光として伝わっている","声がそのまま空を飛んでいく"], diff:"基礎", a:0, e:"【考え方】話した声の振動が紙コップに伝わり、そこから糸を振動として伝わっていきます。相手側の紙コップがその振動を受け取って再び空気を振動させ、耳に音として届きます。糸がたるんでいると振動がうまく伝わらず、聞こえにくくなります。"},
  {id:"phy491", cat:"物理", sub:"力の働き", q:"物体の重さをはかるとき、月面上ではかった場合と地球上ではかった場合で、値が異なるのはなぜか。", choices:["月と地球で重力の大きさが異なるから","月には重さという概念がないから","月では物体の質量が変化するから","はかる道具が壊れやすいから"], diff:"標準", a:0, e:"【考え方】月の重力は地球の約1/6です。ばねばかりなどで測定する「重さ」は重力の大きさに応じて変わるため、同じ物体でも月面上では地球上よりずっと小さい値を示します。ただし物体そのものの量である「質量」は、場所が変わっても変化しません。"},
  {id:"phy492", cat:"物理", sub:"運動とエネルギー", q:"転がしたボールが、やがて摩擦によって止まる。このときボールの運動エネルギーはどうなるか。", choices:["摩擦によって熱エネルギーなどに変わっていく","エネルギーがそのまま消えてなくなる","エネルギーが2倍に増える","運動エネルギーはそのまま保たれる"], diff:"標準", a:0, e:"【考え方】ボールが転がるときの運動エネルギーは、床との摩擦によって少しずつ熱エネルギーに変わっていきます。エネルギーが消えてなくなるのではなく、別の形（熱）に変わることで、見かけ上はエネルギーが減っていくように見えます。"},
  {id:"phy493", cat:"物理", sub:"力の働き", q:"物体の質量をはかるのに適した道具はどれか。", choices:["上皿てんびん","ストップウォッチ","メスシリンダー","温度計"], diff:"基礎", a:0, e:"【ことばの意味】「上皿てんびん」＝分銅とのつり合いを利用して、物体の質量を正確にはかる道具。／【他の道具との違い】ストップウォッチは時間、メスシリンダーは体積、温度計は温度をはかる道具で、それぞれ目的が異なります。質量をはかりたいときは上皿てんびんを使うのが基本です。"},
  {id:"phy494", cat:"物理", sub:"電流と回路", q:"乾電池の＋極と－極を導線で直接つなぐと危険とされる理由は何か。", choices:["非常に大きな電流が流れて発熱するから","電池の色が変わってしまうから","導線が伸びてしまうから","電池がすぐに軽くなるから"], diff:"標準", a:0, e:"【考え方】電球などの抵抗を通さずに、電池の＋極と－極を導線だけで直接つなぐと、抵抗がほとんどない状態になり、非常に大きな電流が一気に流れます（ショート、短絡）。これにより発熱し、やけどや発火につながる危険があるため、絶対に行ってはいけない操作とされています。"},
  {id:"phy495", cat:"物理", sub:"力の働き", q:"てこを利用した道具として、くぎぬきの他に当てはまるものはどれか。", choices:["せんぬき（栓抜き）","懐中電灯","方位磁針","虫めがね"], diff:"基礎", a:0, e:"【考え方】せんぬきは、支点・力点・作用点を利用して、びんのふたを小さな力で開けられるようにした、てこを利用した道具の代表例です。はさみやペンチなども、てこの原理を応用した身近な道具として知られています。"},
  {id:"phy496", cat:"物理", sub:"熱の伝わり方", q:"熱いスープを冷ますとき、息をふきかけると早く冷める。この理由として正しいものはどれか。", choices:["風によって水分の蒸発が進み、気化熱でさらに冷えるから","息の中の酸素がスープを冷やすから","息をふきかけると温度計の目盛りが下がるから","風がスープの色を変えるから"], diff:"標準", a:0, e:"【考え方】水（スープの水分）が蒸発するときには、周囲から熱をうばう性質（気化熱）があります。息をふきかけると、表面の水蒸気が吹き飛ばされて新しい空気にふれやすくなり、蒸発が進みやすくなります。その結果、気化熱によってより早く冷めるようになります。"},
  {id:"phy497", cat:"物理", sub:"力の働き", q:"物体にはたらく力の大きさが2倍になり、力がはたらく面積が変わらないとき、圧力はどうなるか。", choices:["2倍になる","半分になる","変わらない","4倍になる"], diff:"標準", a:0, e:"【考え方】圧力＝力の大きさ÷面積という関係があります。面積が変わらないまま力が2倍になると、圧力もそれに比例して2倍になります。同じ面積により大きな力がかかるほど、その面が受ける圧力は大きくなるという基本的な関係です。"},
  {id:"phy498", cat:"物理", sub:"光と音", q:"光が届かない暗い場所で物が見えないのはなぜか。", choices:["物に当たって反射する光がないから","物体の色が消えてしまうから","目のはたらきが止まってしまうから","音がないと目は使えないから"], diff:"基礎", a:0, e:"【考え方】物が見えるのは、光源からの光が物に当たって反射し、その反射した光が目に届くためです。真っ暗な場所には反射させる光そのものがないため、物があっても目に光が届かず、見ることができません。"},
  {id:"phy499", cat:"物理", sub:"光と音", q:"凹面鏡に平行な光を当てると、光はどうなるか。", choices:["1点（焦点）に集まる","1点から広がる","そのまま反射せず通り抜ける","色ごとに分かれて進む"], diff:"標準", a:0, e:"【ことばの意味】「凹面鏡」＝内側にへこんだ形の鏡。／【はたらき】凹面鏡に平行な光を当てると、反射した光が1点（焦点）に集まります。凸レンズと似たはたらきをもち、太陽光を集めて発火させる実験や、望遠鏡の反射鏡などに利用されています。"},
  {id:"phy500", cat:"物理", sub:"光と音", q:"凸面鏡に平行な光を当てると、反射した光はどうなるか。", choices:["1点から出たように広がる","1点に集まる","色ごとに分かれる","反射せずに吸収される"], diff:"標準", a:0, e:"【ことばの意味】「凸面鏡」＝外側にふくらんだ形の鏡。／【はたらき】凸面鏡に平行な光を当てると、反射した光は広がっていきます（発散する）。広い範囲を映せるため、カーブミラーや自動車のサイドミラーに利用されています。"},
  {id:"phy501", cat:"物理", sub:"力の働き", q:"物体にはたらく力を矢印で表すとき、矢印の長さは何を表すか。", choices:["力の大きさ","力がはたらく時間","物体の質量","物体の速さ"], diff:"基礎", a:0, e:"【考え方】力を図に表すとき、矢印の向きは力の向き、矢印の長さは力の大きさ、矢印の根もとは力がはたらく点（作用点）を表します。同じ物体に2本の矢印がかかれているとき、長い方が大きな力を表しています。"},
  {id:"phy502", cat:"物理", sub:"電流と回路", q:"電熱線に流れる電流を大きくすると、発生する熱の量（発熱量）はどうなるか。", choices:["大きくなる","小さくなる","変わらない","0になる"], diff:"基礎", a:0, e:"【考え方】電熱線に流れる電流が大きいほど、発生する熱の量（発熱量）は大きくなります。電気ケトルなどで強い加熱をしたいときに、より大きな電流を流す設計にするのはこのためです。"},
  {id:"phy503", cat:"物理", sub:"電流と回路", q:"同じ電熱線に電流を流す時間を2倍にすると、発熱量はどうなるか（電流の大きさは変えない場合）。", choices:["2倍になる","半分になる","変わらない","4倍になる"], diff:"標準", a:0, e:"【考え方】発熱量は、電流を流す時間に比例して増えていきます。同じ電流でも、流す時間を2倍にすれば、発生する熱の量も2倍になります。電気ポットでお湯をわかす時間が長いほど、より多くの熱が発生するのはこのためです。"},
  {id:"phy504", cat:"物理", sub:"力の働き", q:"物体にはたらく力が0のとき、静止していた物体はどうなるか。", choices:["静止し続ける","一定の速さで動き出す","急に速く動き出す","色が変化する"], diff:"基礎", a:0, e:"【ことばの意味】「慣性の法則」＝力がはたらかなければ、物体は今の運動の状態を続けようとする性質。静止している物体に力がはたらかなければ、そのまま静止し続けます。"},
  {id:"phy505", cat:"物理", sub:"力の働き", q:"動いている物体に力がはたらかないとき、その物体はどのような運動を続けるか。", choices:["等速直線運動を続ける","だんだん速くなる","だんだん遅くなる","急に止まる"], diff:"基礎", a:0, e:"【考え方】慣性の法則により、力がはたらかない物体は、動いている場合は同じ速さ・同じ向きのまま進み続けます（等速直線運動）。摩擦や空気抵抗がある実際の場面では、これらの力によってやがて減速します。"},
  {id:"phy506", cat:"物理", sub:"光と音", q:"音の高さは、音源の振動の何によって決まるか。", choices:["振動数（1秒間に振動する回数）","振幅（ふれはばの大きさ）","音の伝わる速さ","音源の色"], diff:"基礎", a:0, e:"【ことばの意味】「振動数」＝1秒間に振動する回数。単位はHz（ヘルツ）。／【関係】振動数が多いほど音は高く聞こえ、少ないほど低く聞こえます。音の大きさを決めるのは振幅で、高さとは別の要素です。"},
  {id:"phy507", cat:"物理", sub:"光と音", q:"弦の長さを短くすると、出る音の高さはどうなるか。", choices:["高くなる","低くなる","変わらない","聞こえなくなる"], diff:"基礎", a:0, e:"【考え方】弦は短くするほど振動数が多くなり、高い音が出ます。ギターで指をおさえて弦の長さを変えることで、さまざまな高さの音を出せるのはこの原理によるものです。"},
  {id:"phy508", cat:"物理", sub:"熱の伝わり方", q:"金属のスプーンを熱いお茶に入れると、持ち手側もやがて熱くなる。この現象を何というか。", choices:["伝導","対流","放射","蒸発"], diff:"基礎", a:0, e:"【ことばの意味】「伝導」＝物質の中を熱が伝わっていく現象。金属は熱を伝えやすい性質（熱伝導率が高い）があるため、熱いお茶につかった部分から持ち手まで、熱がすばやく伝わっていきます。"},
  {id:"phy509", cat:"物理", sub:"エネルギーの利用", q:"電気自動車が走るときに利用しているエネルギーは主に何か。", choices:["バッテリーにたくわえられた電気エネルギー","ガソリンの化学エネルギーのみ","太陽光エネルギーのみ","風のエネルギーのみ"], diff:"基礎", a:0, e:"【考え方】電気自動車は、バッテリー（蓄電池）にたくわえた電気エネルギーを使ってモーターを回し、走行します。ガソリン車が燃料を燃やして走るのとは異なるエネルギー源を利用しています。"},
  {id:"phy510", cat:"物理", sub:"力の働き", q:"物体を糸でつるして静止させたとき、糸が切れないのは、糸のどのような性質によるか。", choices:["糸が物体を支えるのに十分な力に耐えられる強さをもつため","糸には力がまったくはたらいていないため","物体の重さが0になるため","糸が伸びて力を消してしまうため"], diff:"標準", a:0, e:"【考え方】糸には物体の重さと同じ大きさの張力（引く力）がはたらいています。糸がその力に耐えられるだけの強さをもっていれば切れずに物体を支え続けられます。耐えられる強さを超える重さがかかると、糸は切れてしまいます。"},
  {id:"phy511", cat:"物理", sub:"電流と回路", q:"電球が切れる（フィラメントが切れる）と、その電球を含む回路はどうなるか。", choices:["直列部分では回路全体に電流が流れなくなる","回路には影響がない","電球のかわりに電池が発熱する","電圧が2倍になる"], diff:"標準", a:0, e:"【考え方】電球が切れると、その部分で導線がつながらない状態（断線）になります。直列回路の一部が断線すると、回路全体が1本道でつながっていないため、電流がまったく流れなくなります。並列回路では他の枝には影響しません。"},
  {id:"phy512", cat:"物理", sub:"力の働き", q:"物体が水に浮くか沈むかを決める、物体と水の密度の関係として正しいものはどれか。", choices:["物体の密度が水の密度より小さければ浮く","物体の密度が水の密度より小さければ沈む","物体の密度は浮き沈みに関係しない","物体の重さだけで浮き沈みが決まる"], diff:"標準", a:0, e:"【考え方】物体の密度が水の密度（約1g/cm³）より小さければ水に浮き、大きければ沈みます。同じ重さの物体でも、体積が大きく密度が小さければ浮きやすくなります。船が浮くのは、船全体の平均密度を水より小さくする工夫がされているためです。"},
  {id:"phy513", cat:"物理", sub:"運動とエネルギー", q:"高い所から低い所へ物体が移動するとき、位置エネルギーはどうなるか。", choices:["減少する","増加する","変わらない","2倍になる"], diff:"基礎", a:0, e:"【考え方】位置エネルギーは高さに比例して大きくなります。高い所から低い所へ移動すると高さが減るため、位置エネルギーも減少します。摩擦がなければ、減った分は運動エネルギーに変わります。"},
  {id:"phy514", cat:"物理", sub:"運動とエネルギー", q:"低い所から高い所へ物体を持ち上げるとき、位置エネルギーはどうなるか。", choices:["増加する","減少する","変わらない","0になる"], diff:"基礎", a:0, e:"【考え方】位置エネルギーは高さに比例して大きくなります。物体を高い位置に持ち上げると、その分だけ位置エネルギーが増加します。持ち上げるのに必要な仕事の分だけ、エネルギーが物体にたくわえられると考えられます。"},
  {id:"phy515", cat:"物理", sub:"光と音", q:"音は真空中を伝わるか。", choices:["伝わらない","そのまま伝わる","むしろ速く伝わる","色が変わって伝わる"], diff:"基礎", a:0, e:"【考え方】音は物質（空気・水・固体など）の振動が伝わる現象です。真空中には振動を伝える物質がまったくないため、音はまったく伝わりません。宇宙空間で音が聞こえないのはこのためです。"},
  {id:"phy516", cat:"物理", sub:"力の働き", q:"物体の質量と重さについて、月面上で成り立つ関係として正しいものはどれか。", choices:["質量は地球上と同じだが、重さは地球上より小さくなる","質量も重さも地球上と全く同じになる","質量は地球上より小さくなるが、重さは同じになる","質量も重さも0になる"], diff:"標準", a:0, e:"【考え方】質量は物体そのものの量なので、場所が変わっても変化しません。しかし重さは重力の大きさに応じて変わるため、月の重力（地球の約1/6）のもとでは、同じ物体でも重さは地球上よりずっと小さくなります。"},
  {id:"phy517", cat:"物理", sub:"電流と回路", q:"回路に流れる電流を大きくするために、電池を並列につなぐことの効果として正しいものはどれか。", choices:["電池が長持ちしやすくなるが、電圧は変わらない","電圧が2倍になる","電流が必ず2倍になる","電池が早く切れるようになる"], diff:"標準", a:0, e:"【考え方】同じ種類の電池を並列につなぐと、電圧は1個のときと変わりませんが、電池全体の電気をたくわえる量が増えるため、長い時間使い続けられるようになります（長持ちする）。電圧を上げたい場合は直列つなぎが必要です。"},
  {id:"phy518", cat:"物理", sub:"力の働き", q:"斜面の角度を急にすると、物体が斜面を滑り落ちようとする力（重力の斜面方向の分力）はどうなるか。", choices:["大きくなる","小さくなる","変わらない","0になる"], diff:"標準", a:0, e:"【考え方】斜面の角度が急になるほど、重力のうち斜面に沿った方向にはたらく分力が大きくなります。滑り台の傾斜が急なほど勢いよく滑るのは、この分力が大きくなるためです。"},
  {id:"phy519", cat:"物理", sub:"熱の伝わり方", q:"魔法びんが保温・保冷に優れている理由として、伝導・対流・放射のうちどれを防ぐ工夫が関係するか。", choices:["伝導・対流・放射のすべてを防ぐ工夫がされている","伝導のみを防いでいる","対流のみを防いでいる","放射のみを防いでいる"], diff:"標準", a:0, e:"【考え方】魔法びんは、真空の層で伝導と対流を防ぎ、内側の鏡面（銀色の壁）で放射（熱の電磁波としての伝わり）を防ぐという、3つの熱の伝わり方すべてに対する工夫がされています。これによって高い保温・保冷性能を実現しています。"},
  {id:"phy520", cat:"物理", sub:"力の働き", q:"力の単位ニュートン(N)について、質量1kgの物体にはたらく重力の大きさはおよそ何Nか（重力加速度を10とする）。", choices:["10N","1N","100N","0.1N"], diff:"標準", a:0, e:"【計算】重さ（N）＝質量（kg）×10（概算）。質量1kgなら、1×10＝10N。1kgの物体（500mLのペットボトル2本分くらい）にはたらく重力は、およそ10Nと覚えておくと便利です。"},
  {id:"phy521", cat:"物理", sub:"エネルギーの利用", q:"エネルギー資源のうち、太陽光・風力・水力のように、くり返し利用できるエネルギーを何というか。", choices:["再生可能エネルギー","化石エネルギー","限定エネルギー","放射エネルギーのみ"], diff:"基礎", a:0, e:"【ことばの意味】「再生可能エネルギー」＝太陽光・風力・水力・地熱など、自然の力を利用してくり返し得られるエネルギー。石油や石炭のような化石燃料は、使うと減っていき、再生には非常に長い年月がかかるため区別されます。"},
  {id:"phy522", cat:"物理", sub:"力の働き", q:"石油や石炭のように、使うとなくなっていき、再生には非常に長い時間がかかる燃料を何というか。", choices:["化石燃料","再生可能燃料","永久燃料","循環燃料"], diff:"基礎", a:0, e:"【ことばの意味】「化石燃料」＝大昔の生物の遺骸が長い年月をかけて変化してできた燃料。石油・石炭・天然ガスなどが代表例です。限りある資源であり、使いすぎると枯渇（なくなる）心配があるとされています。"},
  {id:"phy523", cat:"物理", sub:"光と音", q:"救急車のサイレンの音が、近づくときと遠ざかるときで高さが違って聞こえる現象を何というか。", choices:["ドップラー効果","反射","分散","屈折"], diff:"標準", a:0, e:"【ことばの意味】「ドップラー効果」＝音源が動くことで、聞こえる音の高さが変化して感じられる現象。音源が近づくと音は高く、遠ざかると低く聞こえます。救急車のサイレンで体験できる身近な現象です。"},
  {id:"che401", cat:"化学", sub:"気体の性質", q:"図のように、水を満たした集気びんに気体を導いて集める方法を何というか。", choices:["水上置換法","上方置換法","下方置換法","ろ過"], diff:"基礎", a:0, e:"【図の読み取り】水の入った水そうの中で、気体が発生管から集気びんに集まり、水を押し出しているようすが描かれています。この方法を水上置換法といいます。／【向いている気体】水にとけにくい気体（酸素、水素、窒素など）を集めるのに適しています。気体が空気とまざりにくく、比較的純粋な気体を集めやすいという利点があります。", img:"<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg'><rect x='10' y='90' width='220' height='60' fill='#D6EAF5' opacity='0.5'/><rect x='10' y='90' width='220' height='60' fill='none' stroke='#4A3B47' stroke-width='1.5'/><path d='M 40 30 L 30 100 L 90 100 L 80 30 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='35' y1='40' x2='85' y2='40' stroke='#4A3B47' stroke-width='1.5'/><circle cx='55' cy='70' r='3' fill='#E8709F'/><circle cx='65' cy='60' r='3' fill='#E8709F'/><circle cx='60' cy='80' r='3' fill='#E8709F'/><rect x='140' y='60' width='60' height='60' fill='none' stroke='#4A3B47' stroke-width='2'/><path d='M 145 90 Q 170 70 195 90' stroke='#4A3B47' stroke-width='1.5' fill='none'/><circle cx='165' cy='75' r='3' fill='#E8709F'/><circle cx='180' cy='78' r='3' fill='#E8709F'/><text x='170' y='140' font-size='10' text-anchor='middle' fill='#4A3B47'>集気びん</text><text x='55' y='20' font-size='10' text-anchor='middle' fill='#4A3B47'>試験管</text></svg>"},
  {id:"che402", cat:"化学", sub:"気体の性質", q:"図の水上置換法が、水にとけやすい気体の採取にあまり向いていない理由として正しいものはどれか。", choices:["気体が水にとけてしまい、うまく集まらないから","水そうが重くなりすぎるから","気体の色が変わってしまうから","集気びんが割れやすくなるから"], diff:"標準", a:0, e:"【図の読み取り】発生した気体は、水そうの中の水を通ってから集気びんに入っていきます。／【考え方】アンモニアのように水に非常にとけやすい気体だと、水を通る間にどんどんとけてしまい、集気びんまで十分な量の気体が届かなくなってしまいます。そのため水上置換法は、水にとけにくい気体に向いた集め方です。", img:"<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg'><rect x='10' y='90' width='220' height='60' fill='#D6EAF5' opacity='0.5'/><rect x='10' y='90' width='220' height='60' fill='none' stroke='#4A3B47' stroke-width='1.5'/><path d='M 40 30 L 30 100 L 90 100 L 80 30 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='35' y1='40' x2='85' y2='40' stroke='#4A3B47' stroke-width='1.5'/><circle cx='55' cy='70' r='3' fill='#E8709F'/><circle cx='65' cy='60' r='3' fill='#E8709F'/><circle cx='60' cy='80' r='3' fill='#E8709F'/><rect x='140' y='60' width='60' height='60' fill='none' stroke='#4A3B47' stroke-width='2'/><path d='M 145 90 Q 170 70 195 90' stroke='#4A3B47' stroke-width='1.5' fill='none'/><circle cx='165' cy='75' r='3' fill='#E8709F'/><circle cx='180' cy='78' r='3' fill='#E8709F'/><text x='170' y='140' font-size='10' text-anchor='middle' fill='#4A3B47'>集気びん</text><text x='55' y='20' font-size='10' text-anchor='middle' fill='#4A3B47'>試験管</text></svg>"},
  {id:"che403", cat:"化学", sub:"気体の性質", q:"図のような水上置換法で集めた気体に火のついた線香を近づけると、線香が炎を上げて激しく燃えた。この気体として最も考えられるものはどれか。", choices:["酸素","二酸化炭素","窒素","塩素"], diff:"標準", a:0, e:"【図の読み取り】水上置換法で気体が集められているようすです。／【考え方】火のついた線香が炎を上げて激しく燃えるのは、ものが燃えるのを助けるはたらき（助燃性）をもつ酸素の性質です。酸素は水にとけにくいため水上置換法で集めるのに適した気体でもあります。", img:"<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg'><rect x='10' y='90' width='220' height='60' fill='#D6EAF5' opacity='0.5'/><rect x='10' y='90' width='220' height='60' fill='none' stroke='#4A3B47' stroke-width='1.5'/><path d='M 40 30 L 30 100 L 90 100 L 80 30 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='35' y1='40' x2='85' y2='40' stroke='#4A3B47' stroke-width='1.5'/><circle cx='55' cy='70' r='3' fill='#E8709F'/><circle cx='65' cy='60' r='3' fill='#E8709F'/><circle cx='60' cy='80' r='3' fill='#E8709F'/><rect x='140' y='60' width='60' height='60' fill='none' stroke='#4A3B47' stroke-width='2'/><path d='M 145 90 Q 170 70 195 90' stroke='#4A3B47' stroke-width='1.5' fill='none'/><circle cx='165' cy='75' r='3' fill='#E8709F'/><circle cx='180' cy='78' r='3' fill='#E8709F'/><text x='170' y='140' font-size='10' text-anchor='middle' fill='#4A3B47'>集気びん</text><text x='55' y='20' font-size='10' text-anchor='middle' fill='#4A3B47'>試験管</text></svg>"},
  {id:"che404", cat:"化学", sub:"気体の性質", q:"図のように、集気びんの口を下に向けて気体を集める方法を何というか。", choices:["上方置換法","下方置換法","水上置換法","蒸留"], diff:"基礎", a:0, e:"【図の読み取り】発生した気体が、口を下に向けた集気びんの中に、下から上へたまっていくようすが描かれています。この方法を上方置換法といいます。／【向いている気体】空気より軽く、水に非常にとけやすい気体（アンモニアなど）を集めるのに向いています。軽い気体が上にたまっていく性質を利用しています。", img:"<svg viewBox='0 0 200 160' xmlns='http://www.w3.org/2000/svg'><path d='M 60 30 L 50 100 L 110 100 L 100 30 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='55' y1='40' x2='105' y2='40' stroke='#4A3B47' stroke-width='1.5'/><path d='M 130 130 L 140 60 L 190 60 L 180 130 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><circle cx='155' cy='90' r='3' fill='#A88BD4'/><circle cx='165' cy='75' r='3' fill='#A88BD4'/><circle cx='160' cy='105' r='3' fill='#A88BD4'/><text x='80' y='20' font-size='10' text-anchor='middle' fill='#4A3B47'>加熱</text><text x='155' y='148' font-size='10' text-anchor='middle' fill='#4A3B47'>集気びん(口が下)</text><line x1='108' y1='65' x2='130' y2='100' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/></svg>"},
  {id:"che405", cat:"化学", sub:"気体の性質", q:"図の上方置換法が向いている気体の性質として正しいものはどれか。", choices:["空気より軽く、水にとけやすい","空気より重く、水にとけにくい","空気と同じ重さで、水にとけにくい","色がついていて、におうもの"], diff:"標準", a:0, e:"【図の読み取り】集気びんの口を下に向け、気体が容器の上部にたまっていくようすが描かれています。／【考え方】この集め方は、気体が空気より軽いために上にたまっていく性質と、水にとけやすいため水上置換法が使えないという2つの条件がそろったときに選ばれます。代表的な気体はアンモニアです。", img:"<svg viewBox='0 0 200 160' xmlns='http://www.w3.org/2000/svg'><path d='M 60 30 L 50 100 L 110 100 L 100 30 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='55' y1='40' x2='105' y2='40' stroke='#4A3B47' stroke-width='1.5'/><path d='M 130 130 L 140 60 L 190 60 L 180 130 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><circle cx='155' cy='90' r='3' fill='#A88BD4'/><circle cx='165' cy='75' r='3' fill='#A88BD4'/><circle cx='160' cy='105' r='3' fill='#A88BD4'/><text x='80' y='20' font-size='10' text-anchor='middle' fill='#4A3B47'>加熱</text><text x='155' y='148' font-size='10' text-anchor='middle' fill='#4A3B47'>集気びん(口が下)</text><line x1='108' y1='65' x2='130' y2='100' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/></svg>"},
  {id:"che406", cat:"化学", sub:"気体の性質", q:"図のような方法で集めるのに最も適した気体はどれか。", choices:["アンモニア","酸素","二酸化炭素","水素"], diff:"標準", a:0, e:"【図の読み取り】口を下向きにした集気びんに、気体が上からたまっていく上方置換法のようすです。／【考え方】アンモニアは空気より軽く、水に非常にとけやすいという性質をもつため、水上置換法は使えず、この上方置換法で集められます。酸素・水素は水にとけにくいため水上置換法、二酸化炭素は空気より重いため下方置換法が向いています。", img:"<svg viewBox='0 0 200 160' xmlns='http://www.w3.org/2000/svg'><path d='M 60 30 L 50 100 L 110 100 L 100 30 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='55' y1='40' x2='105' y2='40' stroke='#4A3B47' stroke-width='1.5'/><path d='M 130 130 L 140 60 L 190 60 L 180 130 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><circle cx='155' cy='90' r='3' fill='#A88BD4'/><circle cx='165' cy='75' r='3' fill='#A88BD4'/><circle cx='160' cy='105' r='3' fill='#A88BD4'/><text x='80' y='20' font-size='10' text-anchor='middle' fill='#4A3B47'>加熱</text><text x='155' y='148' font-size='10' text-anchor='middle' fill='#4A3B47'>集気びん(口が下)</text><line x1='108' y1='65' x2='130' y2='100' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/></svg>"},
  {id:"che407", cat:"化学", sub:"気体の性質", q:"図のように、集気びんの口を上に向けて気体を集める方法を何というか。", choices:["下方置換法","上方置換法","水上置換法","分留"], diff:"基礎", a:0, e:"【図の読み取り】発生した気体が、口を上に向けた集気びんの下の方からたまっていくようすが描かれています。この方法を下方置換法といいます。／【向いている気体】空気より重く、水にとけやすい気体を集めるのに向いています。重い気体が下にたまっていく性質を利用した集め方です。", img:"<svg viewBox='0 0 200 160' xmlns='http://www.w3.org/2000/svg'><path d='M 60 30 L 50 100 L 110 100 L 100 30 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='55' y1='40' x2='105' y2='40' stroke='#4A3B47' stroke-width='1.5'/><path d='M 140 60 L 130 130 L 180 130 L 190 60 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><circle cx='155' cy='100' r='3' fill='#F0A63C'/><circle cx='165' cy='115' r='3' fill='#F0A63C'/><circle cx='160' cy='85' r='3' fill='#F0A63C'/><text x='80' y='20' font-size='10' text-anchor='middle' fill='#4A3B47'>加熱</text><text x='160' y='148' font-size='10' text-anchor='middle' fill='#4A3B47'>集気びん(口が上)</text><line x1='108' y1='65' x2='140' y2='100' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/></svg>"},
  {id:"che408", cat:"化学", sub:"気体の性質", q:"図の下方置換法で集めるのに適した気体の性質として正しいものはどれか。", choices:["空気より重く、水にとけやすい","空気より軽く、水にとけにくい","色もにおいもまったくない","燃えやすい性質をもつ"], diff:"標準", a:0, e:"【図の読み取り】集気びんの口を上に向け、気体が容器の下部にたまっていくようすが描かれています。／【考え方】この集め方が選ばれるのは、気体が空気より重いために下にたまっていく性質と、水にとけやすいため水上置換法が使えないという2つの条件が組み合わさったときです。塩化水素などがこの方法で集められます。", img:"<svg viewBox='0 0 200 160' xmlns='http://www.w3.org/2000/svg'><path d='M 60 30 L 50 100 L 110 100 L 100 30 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='55' y1='40' x2='105' y2='40' stroke='#4A3B47' stroke-width='1.5'/><path d='M 140 60 L 130 130 L 180 130 L 190 60 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><circle cx='155' cy='100' r='3' fill='#F0A63C'/><circle cx='165' cy='115' r='3' fill='#F0A63C'/><circle cx='160' cy='85' r='3' fill='#F0A63C'/><text x='80' y='20' font-size='10' text-anchor='middle' fill='#4A3B47'>加熱</text><text x='160' y='148' font-size='10' text-anchor='middle' fill='#4A3B47'>集気びん(口が上)</text><line x1='108' y1='65' x2='140' y2='100' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/></svg>"},
  {id:"che409", cat:"化学", sub:"気体の性質", q:"水にとけにくい気体を集める場合、下方置換法よりも水上置換法が選ばれることが多い理由として正しいものはどれか。", choices:["空気が混ざりにくく、比較的純粋な気体を集められるから","下方置換法では気体がまったく集まらないから","水上置換法の方が装置が単純だから","水上置換法は色のついた気体専用だから"], diff:"標準", a:0, e:"【図の読み取り】下方置換法では容器の中にもとからあった空気が完全には押し出されず、気体に少し混ざってしまうことがあります。／【考え方】水上置換法では、あらかじめ水で満たしておいた容器に気体を送り込むため、空気が混ざりにくく、比較的純粋な気体を集めやすいという利点があります。この理由から、水にとけにくい気体は水上置換法が優先して選ばれます。", img:"<svg viewBox='0 0 200 160' xmlns='http://www.w3.org/2000/svg'><path d='M 60 30 L 50 100 L 110 100 L 100 30 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='55' y1='40' x2='105' y2='40' stroke='#4A3B47' stroke-width='1.5'/><path d='M 140 60 L 130 130 L 180 130 L 190 60 Z' fill='none' stroke='#4A3B47' stroke-width='2'/><circle cx='155' cy='100' r='3' fill='#F0A63C'/><circle cx='165' cy='115' r='3' fill='#F0A63C'/><circle cx='160' cy='85' r='3' fill='#F0A63C'/><text x='80' y='20' font-size='10' text-anchor='middle' fill='#4A3B47'>加熱</text><text x='160' y='148' font-size='10' text-anchor='middle' fill='#4A3B47'>集気びん(口が上)</text><line x1='108' y1='65' x2='140' y2='100' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/></svg>"},
  {id:"che410", cat:"化学", sub:"化学変化と質量", q:"図のように、口を少し下げて試験管を加熱する。このようにする理由として正しいものはどれか。", choices:["発生した液体が加熱部分に流れて試験管が割れるのを防ぐため","気体をより多く発生させるため","炎の温度を高くするため","試験管の色を変えないため"], diff:"標準", a:0, e:"【図の読み取り】試験管の口が加熱部分より少し下がるように傾けて固定されているようすが描かれています。／【考え方】固体を加熱すると、発生した水分（水蒸気）が試験管の口の方で冷えて水滴になることがあります。口を下げておくことで、この水滴が加熱部分に流れ落ちて、急激な温度変化で試験管が割れてしまうのを防ぐことができます。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><line x1='60' y1='40' x2='30' y2='90' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='90' x2='36' y2='96' stroke='#4A3B47' stroke-width='2'/><line x1='55' y1='45' x2='65' y2='55' stroke='#4A3B47' stroke-width='1'/><text x='55' y='30' font-size='9' text-anchor='middle' fill='#4A3B47'>試験管</text><polygon points='40,120 60,150 110,150 100,110' fill='#F0A63C' opacity='0.7'/><line x1='30' y1='90' x2='30' y2='150' stroke='#4A3B47' stroke-width='1.5'/><line x1='30' y1='150' x2='140' y2='150' stroke='#4A3B47' stroke-width='1.5'/><text x='75' y='140' font-size='9' text-anchor='middle' fill='#fff'>炎</text><path d='M 60 60 Q 100 40 140 60' stroke='#4A3B47' stroke-width='1.5' fill='none' stroke-dasharray='3,3'/><text x='150' y='60' font-size='9' fill='#4A3B47'>気体</text></svg>"},
  {id:"che411", cat:"化学", sub:"化学変化と質量", q:"図のように固体を加熱して気体を発生させる実験を行うとき、加熱をやめる前に必ず行うべき操作はどれか。", choices:["発生した気体を集めていた管を水そうから取り出す","試験管をすぐに水で急に冷やす","火を消してから空気調節ねじを閉める","気体が発生している間にふたをする"], diff:"標準", a:0, e:"【図の読み取り】発生した気体を導くための管が、水を張った水そうの中まで伸びているようすが描かれています。／【考え方】加熱をやめると試験管内の気圧が下がり、水そうの水が逆流して試験管に吸いこまれてしまうことがあります。これを防ぐため、火を消す前に、気体を集めていた管を水そうから取り出しておく必要があります。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><line x1='60' y1='40' x2='30' y2='90' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='90' x2='36' y2='96' stroke='#4A3B47' stroke-width='2'/><line x1='55' y1='45' x2='65' y2='55' stroke='#4A3B47' stroke-width='1'/><text x='55' y='30' font-size='9' text-anchor='middle' fill='#4A3B47'>試験管</text><polygon points='40,120 60,150 110,150 100,110' fill='#F0A63C' opacity='0.7'/><line x1='30' y1='90' x2='30' y2='150' stroke='#4A3B47' stroke-width='1.5'/><line x1='30' y1='150' x2='140' y2='150' stroke='#4A3B47' stroke-width='1.5'/><text x='75' y='140' font-size='9' text-anchor='middle' fill='#fff'>炎</text><path d='M 60 60 Q 100 40 140 60' stroke='#4A3B47' stroke-width='1.5' fill='none' stroke-dasharray='3,3'/><text x='150' y='60' font-size='9' fill='#4A3B47'>気体</text></svg>"},
  {id:"che412", cat:"化学", sub:"化学変化と質量", q:"図のような装置で炭酸水素ナトリウムを加熱すると発生する気体を、石灰水に通すとどうなるか。", choices:["石灰水が白くにごる","石灰水が青色に変化する","石灰水がすぐに沸騰する","石灰水にはまったく変化が見られない"], diff:"基礎", a:0, e:"【図の読み取り】試験管内の固体（炭酸水素ナトリウム）を加熱し、発生した気体を管で導き出しているようすです。／【考え方】炭酸水素ナトリウムを加熱すると、炭酸ナトリウム・水・二酸化炭素の3つに分解されます。発生した二酸化炭素を石灰水に通すと、炭酸カルシウムという白い物質ができ、石灰水が白くにごります。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><line x1='60' y1='40' x2='30' y2='90' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='90' x2='36' y2='96' stroke='#4A3B47' stroke-width='2'/><line x1='55' y1='45' x2='65' y2='55' stroke='#4A3B47' stroke-width='1'/><text x='55' y='30' font-size='9' text-anchor='middle' fill='#4A3B47'>試験管</text><polygon points='40,120 60,150 110,150 100,110' fill='#F0A63C' opacity='0.7'/><line x1='30' y1='90' x2='30' y2='150' stroke='#4A3B47' stroke-width='1.5'/><line x1='30' y1='150' x2='140' y2='150' stroke='#4A3B47' stroke-width='1.5'/><text x='75' y='140' font-size='9' text-anchor='middle' fill='#fff'>炎</text><path d='M 60 60 Q 100 40 140 60' stroke='#4A3B47' stroke-width='1.5' fill='none' stroke-dasharray='3,3'/><text x='150' y='60' font-size='9' fill='#4A3B47'>気体</text></svg>"},
  {id:"che413", cat:"化学", sub:"水溶液とイオン", q:"図は水の電気分解の装置を表している。陰極側にたまる気体は何か。", choices:["水素","酸素","窒素","二酸化炭素"], diff:"基礎", a:0, e:"【図の読み取り】電源につながれた2本の電極が水溶液の中に入っていて、それぞれの電極付近に気体の泡が発生しているようすが描かれています。／【考え方】水を電気分解すると、陰極（マイナス側）から水素が、陽極（プラス側）から酸素が発生します。発生する体積の比は水素:酸素＝2:1になります。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='60' width='160' height='80' fill='#D6EAF5' opacity='0.5' stroke='#4A3B47' stroke-width='1.5'/><line x1='80' y1='30' x2='80' y2='120' stroke='#4A3B47' stroke-width='3'/><line x1='140' y1='30' x2='140' y2='120' stroke='#4A3B47' stroke-width='3'/><circle cx='75' cy='70' r='2' fill='#7FC8A9'/><circle cx='83' cy='85' r='2' fill='#7FC8A9'/><circle cx='77' cy='100' r='2' fill='#7FC8A9'/><circle cx='135' cy='75' r='2' fill='#F0A63C'/><circle cx='143' cy='90' r='2' fill='#F0A63C'/><line x1='80' y1='15' x2='140' y2='15' stroke='#4A3B47' stroke-width='2'/><line x1='80' y1='15' x2='80' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='140' y1='15' x2='140' y2='30' stroke='#4A3B47' stroke-width='2'/><text x='80' y='10' font-size='9' text-anchor='middle' fill='#4A3B47'>電源</text><text x='80' y='150' font-size='9' text-anchor='middle' fill='#4A3B47'>陰極</text><text x='140' y='150' font-size='9' text-anchor='middle' fill='#4A3B47'>陽極</text></svg>"},
  {id:"che414", cat:"化学", sub:"水溶液とイオン", q:"図の水の電気分解で、陽極と陰極から発生する気体の体積の比として正しいものはどれか。", choices:["陰極(水素):陽極(酸素)＝2:1","陰極(水素):陽極(酸素)＝1:2","陰極(水素):陽極(酸素)＝1:1","陰極(水素):陽極(酸素)＝3:1"], diff:"標準", a:0, e:"【図の読み取り】左右の電極からそれぞれ気体の泡が発生しているようすが描かれています。図では陰極側（左）の方が泡が多く見えます。／【考え方】水の化学式H₂Oには水素原子2個と酸素原子1個がふくまれているため、電気分解で発生する気体の体積比も水素:酸素＝2:1になります。陰極側から発生する水素の方が多いことを覚えておきましょう。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='60' width='160' height='80' fill='#D6EAF5' opacity='0.5' stroke='#4A3B47' stroke-width='1.5'/><line x1='80' y1='30' x2='80' y2='120' stroke='#4A3B47' stroke-width='3'/><line x1='140' y1='30' x2='140' y2='120' stroke='#4A3B47' stroke-width='3'/><circle cx='75' cy='70' r='2' fill='#7FC8A9'/><circle cx='83' cy='85' r='2' fill='#7FC8A9'/><circle cx='77' cy='100' r='2' fill='#7FC8A9'/><circle cx='135' cy='75' r='2' fill='#F0A63C'/><circle cx='143' cy='90' r='2' fill='#F0A63C'/><line x1='80' y1='15' x2='140' y2='15' stroke='#4A3B47' stroke-width='2'/><line x1='80' y1='15' x2='80' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='140' y1='15' x2='140' y2='30' stroke='#4A3B47' stroke-width='2'/><text x='80' y='10' font-size='9' text-anchor='middle' fill='#4A3B47'>電源</text><text x='80' y='150' font-size='9' text-anchor='middle' fill='#4A3B47'>陰極</text><text x='140' y='150' font-size='9' text-anchor='middle' fill='#4A3B47'>陽極</text></svg>"},
  {id:"che415", cat:"化学", sub:"水溶液とイオン", q:"図のような電気分解の装置を使うために、水に少量の水酸化ナトリウムなどを加える理由として正しいものはどれか。", choices:["電流を流れやすくするため","水の色を変えるため","気体の発生を止めるため","水を凍りにくくするため"], diff:"標準", a:0, e:"【図の読み取り】電源から電極を通して電流が水溶液に流れているようすが描かれています。／【考え方】純粋な水はイオンがほとんどなく、電流をほとんど通しません。水酸化ナトリウムなどの電解質を少量とかすことで、水溶液中にイオンが増え、電流が流れやすくなり、電気分解がスムーズに進むようになります。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='60' width='160' height='80' fill='#D6EAF5' opacity='0.5' stroke='#4A3B47' stroke-width='1.5'/><line x1='80' y1='30' x2='80' y2='120' stroke='#4A3B47' stroke-width='3'/><line x1='140' y1='30' x2='140' y2='120' stroke='#4A3B47' stroke-width='3'/><circle cx='75' cy='70' r='2' fill='#7FC8A9'/><circle cx='83' cy='85' r='2' fill='#7FC8A9'/><circle cx='77' cy='100' r='2' fill='#7FC8A9'/><circle cx='135' cy='75' r='2' fill='#F0A63C'/><circle cx='143' cy='90' r='2' fill='#F0A63C'/><line x1='80' y1='15' x2='140' y2='15' stroke='#4A3B47' stroke-width='2'/><line x1='80' y1='15' x2='80' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='140' y1='15' x2='140' y2='30' stroke='#4A3B47' stroke-width='2'/><text x='80' y='10' font-size='9' text-anchor='middle' fill='#4A3B47'>電源</text><text x='80' y='150' font-size='9' text-anchor='middle' fill='#4A3B47'>陰極</text><text x='140' y='150' font-size='9' text-anchor='middle' fill='#4A3B47'>陽極</text></svg>"},
  {id:"che416", cat:"化学", sub:"物質のすがた", q:"図のような装置で、液体を加熱して出てきた蒸気を冷やし、再び液体として集める操作を何というか。", choices:["蒸留","ろ過","中和","電気分解"], diff:"基礎", a:0, e:"【図の読み取り】フラスコで液体を加熱し、発生した蒸気が管を通って冷やされ、別のビーカーに液体として集まっているようすが描かれています。この操作を蒸留といいます。／【利用例】沸点の違いを利用して混合物を分離する方法で、海水から真水を得たり、アルコール飲料を作ったりするのに利用されています。", img:"<svg viewBox='0 0 260 160' xmlns='http://www.w3.org/2000/svg'><path d='M 40 60 L 30 110 L 90 110 L 80 60 Z' fill='#D6EAF5' opacity='0.5' stroke='#4A3B47' stroke-width='2'/><line x1='60' y1='40' x2='60' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='60' y1='40' x2='160' y2='40' stroke='#4A3B47' stroke-width='2'/><rect x='150' y='30' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='1.5'/><text x='158' y='22' font-size='8' text-anchor='middle' fill='#4A3B47'>温度計</text><path d='M 160 40 L 230 60 L 230 90' stroke='#4A3B47' stroke-width='6' fill='none' opacity='0.3'/><path d='M 160 40 L 230 60 L 230 90' stroke='#4A3B47' stroke-width='1.5' fill='none'/><rect x='210' y='90' width='40' height='40' fill='none' stroke='#4A3B47' stroke-width='1.5'/><text x='230' y='145' font-size='9' text-anchor='middle' fill='#4A3B47'>ビーカー</text><text x='55' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>フラスコ</text></svg>"},
  {id:"che417", cat:"化学", sub:"物質のすがた", q:"図の蒸留装置で、温度計の球部（先端）を枝分かれした管の近くに合わせる理由として正しいものはどれか。", choices:["出ていく蒸気の温度を正確にはかるため","フラスコ内の液体の温度をはかるため","装置の全体の重さを量るため","加熱している炎の温度をはかるため"], diff:"標準", a:0, e:"【図の読み取り】温度計がフラスコの枝分かれした管の近くに設置されているようすが描かれています。／【考え方】蒸留では、どの温度で蒸気が出てきているかを知ることが大切です。温度計の球部を枝管の近くに合わせることで、これから出ていこうとする蒸気の温度を正確に測定でき、沸点の違いを利用した分離がしやすくなります。", img:"<svg viewBox='0 0 260 160' xmlns='http://www.w3.org/2000/svg'><path d='M 40 60 L 30 110 L 90 110 L 80 60 Z' fill='#D6EAF5' opacity='0.5' stroke='#4A3B47' stroke-width='2'/><line x1='60' y1='40' x2='60' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='60' y1='40' x2='160' y2='40' stroke='#4A3B47' stroke-width='2'/><rect x='150' y='30' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='1.5'/><text x='158' y='22' font-size='8' text-anchor='middle' fill='#4A3B47'>温度計</text><path d='M 160 40 L 230 60 L 230 90' stroke='#4A3B47' stroke-width='6' fill='none' opacity='0.3'/><path d='M 160 40 L 230 60 L 230 90' stroke='#4A3B47' stroke-width='1.5' fill='none'/><rect x='210' y='90' width='40' height='40' fill='none' stroke='#4A3B47' stroke-width='1.5'/><text x='230' y='145' font-size='9' text-anchor='middle' fill='#4A3B47'>ビーカー</text><text x='55' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>フラスコ</text></svg>"},
  {id:"che418", cat:"化学", sub:"物質のすがた", q:"図は氷を加熱したときの温度変化のグラフである。グラフの平らな部分アでは何が起こっているか。", choices:["氷がとけて水に変わっている（固体と液体が混ざっている）","温度が急激に上昇している","水がすべて蒸発してしまっている","何も変化は起こっていない"], diff:"標準", a:0, e:"【図の読み取り】グラフの温度が0℃のあたりで平らになっている部分（ア）に注目します。／【考え方】この平らな部分では、加えた熱が氷を水に変えるために使われており、温度そのものは上がりません。固体（氷）と液体（水）が同時に存在している状態です。すべての氷がとけ終わると、再び温度が上昇し始めます。", img:"<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='140' x2='30' y2='20' stroke='#4A3B47' stroke-width='1.5'/><line x1='30' y1='140' x2='220' y2='140' stroke='#4A3B47' stroke-width='1.5'/><text x='10' y='30' font-size='9' fill='#4A3B47'>温度</text><text x='190' y='155' font-size='9' fill='#4A3B47'>時間</text><path d='M 30 130 L 60 100 L 110 100 L 140 60 L 190 60 L 210 40' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='30' y1='100' x2='220' y2='100' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='30' y1='60' x2='220' y2='60' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><text x='5' y='103' font-size='8' fill='#4A3B47'>0℃</text><text x='5' y='63' font-size='8' fill='#4A3B47'>100℃</text></svg>"},
  {id:"che419", cat:"化学", sub:"物質のすがた", q:"図のグラフで、100℃付近で温度が再び一定になっている部分は、何が起こっていることを表しているか。", choices:["水がふっとうして水蒸気に変わっている","氷がとけ始めている","温度計が壊れている","水がすべて蒸発し終わっている"], diff:"標準", a:0, e:"【図の読み取り】グラフの後半、100℃付近で再び平らになっている部分に注目します。／【考え方】ここでは水がふっとうして水蒸気に変わる変化（沸騰）が起こっています。加えた熱が状態変化のために使われるため、水がすべて水蒸気になるまで温度は100℃のまま一定に保たれます。", img:"<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='140' x2='30' y2='20' stroke='#4A3B47' stroke-width='1.5'/><line x1='30' y1='140' x2='220' y2='140' stroke='#4A3B47' stroke-width='1.5'/><text x='10' y='30' font-size='9' fill='#4A3B47'>温度</text><text x='190' y='155' font-size='9' fill='#4A3B47'>時間</text><path d='M 30 130 L 60 100 L 110 100 L 140 60 L 190 60 L 210 40' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='30' y1='100' x2='220' y2='100' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='30' y1='60' x2='220' y2='60' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><text x='5' y='103' font-size='8' fill='#4A3B47'>0℃</text><text x='5' y='63' font-size='8' fill='#4A3B47'>100℃</text></svg>"},
  {id:"che420", cat:"化学", sub:"物質のすがた", q:"図のようなグラフの形（温度が一定になる区間がはっきり現れる）が見られるのは、どのような物質を加熱したときか。", choices:["純粋な物質（純物質）","不純物を多くふくむ混合物","気体のみでできた物質","色のついた物質のみ"], diff:"標準", a:0, e:"【図の読み取り】グラフには、はっきりと温度が一定になる区間（融点・沸点）が現れています。／【考え方】純粋な物質（純物質）は決まった融点・沸点をもち、状態変化の間、温度はぴたりと一定に保たれます。混合物の場合は成分によって融点・沸点が異なるため、このようなはっきりとした平らな区間が現れにくいという違いがあります。", img:"<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='140' x2='30' y2='20' stroke='#4A3B47' stroke-width='1.5'/><line x1='30' y1='140' x2='220' y2='140' stroke='#4A3B47' stroke-width='1.5'/><text x='10' y='30' font-size='9' fill='#4A3B47'>温度</text><text x='190' y='155' font-size='9' fill='#4A3B47'>時間</text><path d='M 30 130 L 60 100 L 110 100 L 140 60 L 190 60 L 210 40' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='30' y1='100' x2='220' y2='100' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='30' y1='60' x2='220' y2='60' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><text x='5' y='103' font-size='8' fill='#4A3B47'>0℃</text><text x='5' y='63' font-size='8' fill='#4A3B47'>100℃</text></svg>"},
  {id:"che421", cat:"化学", sub:"酸・アルカリと中和", q:"図のように、酸性の水溶液に赤色リトマス紙と青色リトマス紙をひたすと、それぞれどうなるか。", choices:["赤色リトマス紙は変化せず、青色リトマス紙が赤色に変化する","赤色リトマス紙が青色に変化し、青色リトマス紙は変化しない","どちらのリトマス紙も変化しない","どちらのリトマス紙も色が消えてしまう"], diff:"基礎", a:0, e:"【図の読み取り】水溶液に赤色と青色、2種類のリトマス紙がひたされているようすが描かれています。／【考え方】酸性の水溶液は、青色リトマス紙を赤色に変化させますが、もともと赤色のリトマス紙にはとくに変化が見られません。「酸性で青→赤」と覚えておくとよいでしょう。", img:"<svg viewBox='0 0 220 140' xmlns='http://www.w3.org/2000/svg'><rect x='60' y='60' width='100' height='60' fill='#D6EAF5' opacity='0.4' stroke='#4A3B47' stroke-width='1.5'/><rect x='90' y='20' width='6' height='60' fill='#E8709F'/><rect x='120' y='20' width='6' height='60' fill='#6BA8DB'/><text x='93' y='15' font-size='9' text-anchor='middle' fill='#4A3B47'>赤色</text><text x='123' y='15' font-size='9' text-anchor='middle' fill='#4A3B47'>青色</text><text x='110' y='135' font-size='10' text-anchor='middle' fill='#4A3B47'>水溶液</text></svg>"},
  {id:"che422", cat:"化学", sub:"酸・アルカリと中和", q:"図のように、アルカリ性の水溶液にリトマス紙をひたすとどうなるか。", choices:["赤色リトマス紙が青色に変化する","青色リトマス紙が赤色に変化する","どちらのリトマス紙も変化しない","両方のリトマス紙が同時に変化する"], diff:"基礎", a:0, e:"【図の読み取り】水溶液に2色のリトマス紙をひたして色の変化を観察しているようすです。／【考え方】アルカリ性の水溶液は、赤色リトマス紙を青色に変化させますが、もともと青色のリトマス紙は変化しません。「アルカリ性で赤→青」とセットで覚えておくと、酸性のときとの区別がしやすくなります。", img:"<svg viewBox='0 0 220 140' xmlns='http://www.w3.org/2000/svg'><rect x='60' y='60' width='100' height='60' fill='#D6EAF5' opacity='0.4' stroke='#4A3B47' stroke-width='1.5'/><rect x='90' y='20' width='6' height='60' fill='#E8709F'/><rect x='120' y='20' width='6' height='60' fill='#6BA8DB'/><text x='93' y='15' font-size='9' text-anchor='middle' fill='#4A3B47'>赤色</text><text x='123' y='15' font-size='9' text-anchor='middle' fill='#4A3B47'>青色</text><text x='110' y='135' font-size='10' text-anchor='middle' fill='#4A3B47'>水溶液</text></svg>"},
  {id:"che423", cat:"化学", sub:"酸・アルカリと中和", q:"図のように、中性の水溶液にリトマス紙をひたした場合の結果として正しいものはどれか。", choices:["どちらのリトマス紙も色が変化しない","両方とも赤色に変わる","両方とも青色に変わる","一瞬で色が消えてしまう"], diff:"基礎", a:0, e:"【図の読み取り】中性の水溶液にリトマス紙をひたしているようすが描かれています。／【考え方】中性の水溶液（食塩水や純水など）では、赤色リトマス紙も青色リトマス紙も、どちらも色の変化が見られません。リトマス紙の色が変わらないことこそが、その水溶液が中性であることを示す手がかりになります。", img:"<svg viewBox='0 0 220 140' xmlns='http://www.w3.org/2000/svg'><rect x='60' y='60' width='100' height='60' fill='#D6EAF5' opacity='0.4' stroke='#4A3B47' stroke-width='1.5'/><rect x='90' y='20' width='6' height='60' fill='#E8709F'/><rect x='120' y='20' width='6' height='60' fill='#6BA8DB'/><text x='93' y='15' font-size='9' text-anchor='middle' fill='#4A3B47'>赤色</text><text x='123' y='15' font-size='9' text-anchor='middle' fill='#4A3B47'>青色</text><text x='110' y='135' font-size='10' text-anchor='middle' fill='#4A3B47'>水溶液</text></svg>"},
  {id:"che424", cat:"化学", sub:"水溶液とイオン", q:"図のように、ある水溶液どうしを混ぜると白い沈殿ができた。この沈殿として考えられる代表的な物質はどれか。", choices:["塩化銀や炭酸カルシウムなど、水にとけにくい物質","気体がそのまま固まったもの","塩酸そのものが固体になったもの","電気を通さない金属の粒"], diff:"標準", a:0, e:"【図の読み取り】試験管の底に、白い粉のようなものがたまっているようすが描かれています。／【考え方】水にとけやすいイオンどうしが結びついて、水にとけにくい物質ができると、沈殿として底にたまります。塩化銀（AgCl）や炭酸カルシウム（CaCO₃）などが、白い沈殿ができる代表的な反応としてよく知られています。", img:"<svg viewBox='0 0 180 160' xmlns='http://www.w3.org/2000/svg'><path d='M 60 30 L 50 130 L 110 130 L 100 30 Z' fill='#D6EAF5' opacity='0.3' stroke='#4A3B47' stroke-width='2'/><ellipse cx='80' cy='120' rx='25' ry='8' fill='#fff' stroke='#4A3B47' stroke-width='1'/><circle cx='70' cy='115' r='2' fill='#B0A8B8'/><circle cx='90' cy='118' r='2' fill='#B0A8B8'/><circle cx='80' cy='122' r='2' fill='#B0A8B8'/><text x='80' y='20' font-size='9' text-anchor='middle' fill='#4A3B47'>試験管</text><text x='80' y='150' font-size='9' text-anchor='middle' fill='#4A3B47'>白い沈殿</text></svg>"},
  {id:"che425", cat:"化学", sub:"水溶液とイオン", q:"図のような沈殿ができる反応を観察することは、理科の実験においてどのような手がかりになるか。", choices:["特定のイオンがその水溶液にふくまれていることを確かめる手がかりになる","水溶液の温度を測る手がかりになる","水溶液の色を決める手がかりになる","加熱時間を決める手がかりになる"], diff:"標準", a:0, e:"【図の読み取り】試験管の中に白い沈殿ができているようすが観察されています。／【考え方】特定のイオンどうしが出会うと、決まった色や性質の沈殿ができるという性質を利用して、その水溶液にどんなイオンがふくまれているかを調べることができます。これを「イオンの検出」といい、化学の基本的な分析方法の一つです。", img:"<svg viewBox='0 0 180 160' xmlns='http://www.w3.org/2000/svg'><path d='M 60 30 L 50 130 L 110 130 L 100 30 Z' fill='#D6EAF5' opacity='0.3' stroke='#4A3B47' stroke-width='2'/><ellipse cx='80' cy='120' rx='25' ry='8' fill='#fff' stroke='#4A3B47' stroke-width='1'/><circle cx='70' cy='115' r='2' fill='#B0A8B8'/><circle cx='90' cy='118' r='2' fill='#B0A8B8'/><circle cx='80' cy='122' r='2' fill='#B0A8B8'/><text x='80' y='20' font-size='9' text-anchor='middle' fill='#4A3B47'>試験管</text><text x='80' y='150' font-size='9' text-anchor='middle' fill='#4A3B47'>白い沈殿</text></svg>"},
  {id:"che426", cat:"化学", sub:"気体の性質", q:"図は気体の集め方を選ぶときの考え方を表している。水にとけにくい気体を集めるときに、最も優先して選ばれる方法はどれか。", choices:["水上置換法","上方置換法","下方置換法","ろ過"], diff:"基礎", a:0, e:"【図の読み取り】気体の性質（水へのとけやすさ）によって、集め方が使い分けられているようすが表されています。／【考え方】水にとけにくい気体（酸素・水素・窒素など）は、まず水上置換法で集めるのが基本です。空気が混ざりにくく比較的純粋な気体が得られるという利点があるためです。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='30' width='60' height='80' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='60' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>水にとけにくい</text><text x='60' y='20' font-size='9' text-anchor='middle' fill='#4A3B47'>水上置換</text><rect x='150' y='30' width='60' height='80' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='180' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>水にとけやすい</text><text x='180' y='20' font-size='9' text-anchor='middle' fill='#4A3B47'>上方/下方置換</text><path d='M 40 90 Q 60 70 80 90' stroke='#6BA8DB' stroke-width='1.5' fill='none'/><path d='M 160 90 Q 180 60 200 90' stroke='#F0A63C' stroke-width='1.5' fill='none'/></svg>"},

  {id:"bio360", cat:"生物", sub:"細胞", q:"図は植物の細胞のつくりを表している。丸く色づいた部分アは何を表しているか。", choices:["核","細胞壁","葉緑体","液胞"], diff:"基礎", a:0, e:"【図の読み取り】細胞の中央あたりにある、丸い形をした部分アに注目します。この部分が核です。／【核のはたらき】核は細胞の中でDNA（遺伝情報）をふくむ、細胞のはたらきをコントロールする重要な部分です。酢酸カーミン液や酢酸オルセイン液で赤く染まる性質があり、顕微鏡での観察がしやすくなります。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='20' width='160' height='140' fill='none' stroke='#4A3B47' stroke-width='2'/><rect x='38' y='28' width='144' height='124' fill='#E4F7EE' opacity='0.4' stroke='#7FC8A9' stroke-width='1.5'/><circle cx='90' cy='90' r='25' fill='#F5D7E3' stroke='#E8709F' stroke-width='1.5'/><text x='90' y='94' font-size='10' text-anchor='middle' fill='#4A3B47'>核</text><ellipse cx='150' cy='60' rx='14' ry='9' fill='#7FC8A9'/><ellipse cx='155' cy='120' rx='14' ry='9' fill='#7FC8A9'/><ellipse cx='60' cy='130' rx='14' ry='9' fill='#7FC8A9'/><rect x='95' y='105' width='75' height='40' fill='#D6EAF5' opacity='0.5' stroke='#6BA8DB' stroke-width='1'/><text x='30' y='15' font-size='9' fill='#4A3B47'>細胞壁</text><text x='170' y='150' font-size='9' fill='#4A3B47'>液胞</text></svg>"},
  {id:"bio361", cat:"生物", sub:"細胞", q:"図の植物細胞に見られる、緑色のつぶで光合成を行う部分を何というか。", choices:["葉緑体","核","細胞壁","液胞"], diff:"基礎", a:0, e:"【図の読み取り】細胞の中に複数見られる、緑色の楕円形のつぶが葉緑体です。／【葉緑体のはたらき】葉緑体は光を受けて光合成を行い、二酸化炭素と水からデンプンなどの養分をつくり出す部分です。植物の細胞に特徴的な構造で、動物の細胞には見られません。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='20' width='160' height='140' fill='none' stroke='#4A3B47' stroke-width='2'/><rect x='38' y='28' width='144' height='124' fill='#E4F7EE' opacity='0.4' stroke='#7FC8A9' stroke-width='1.5'/><circle cx='90' cy='90' r='25' fill='#F5D7E3' stroke='#E8709F' stroke-width='1.5'/><text x='90' y='94' font-size='10' text-anchor='middle' fill='#4A3B47'>核</text><ellipse cx='150' cy='60' rx='14' ry='9' fill='#7FC8A9'/><ellipse cx='155' cy='120' rx='14' ry='9' fill='#7FC8A9'/><ellipse cx='60' cy='130' rx='14' ry='9' fill='#7FC8A9'/><rect x='95' y='105' width='75' height='40' fill='#D6EAF5' opacity='0.5' stroke='#6BA8DB' stroke-width='1'/><text x='30' y='15' font-size='9' fill='#4A3B47'>細胞壁</text><text x='170' y='150' font-size='9' fill='#4A3B47'>液胞</text></svg>"},
  {id:"bio362", cat:"生物", sub:"細胞", q:"図の植物細胞の一番外側を囲んでいる、かたいしきりの部分を何というか。", choices:["細胞壁","細胞膜","液胞","葉緑体"], diff:"基礎", a:0, e:"【図の読み取り】細胞全体を四角く囲んでいる、外側のかたい線の部分が細胞壁です。／【細胞壁のはたらき】細胞壁は植物の細胞に特有のつくりで、細胞の形を保ち、植物のからだをしっかりと支えるはたらきがあります。動物の細胞にはこの細胞壁はありません。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='20' width='160' height='140' fill='none' stroke='#4A3B47' stroke-width='2'/><rect x='38' y='28' width='144' height='124' fill='#E4F7EE' opacity='0.4' stroke='#7FC8A9' stroke-width='1.5'/><circle cx='90' cy='90' r='25' fill='#F5D7E3' stroke='#E8709F' stroke-width='1.5'/><text x='90' y='94' font-size='10' text-anchor='middle' fill='#4A3B47'>核</text><ellipse cx='150' cy='60' rx='14' ry='9' fill='#7FC8A9'/><ellipse cx='155' cy='120' rx='14' ry='9' fill='#7FC8A9'/><ellipse cx='60' cy='130' rx='14' ry='9' fill='#7FC8A9'/><rect x='95' y='105' width='75' height='40' fill='#D6EAF5' opacity='0.5' stroke='#6BA8DB' stroke-width='1'/><text x='30' y='15' font-size='9' fill='#4A3B47'>細胞壁</text><text x='170' y='150' font-size='9' fill='#4A3B47'>液胞</text></svg>"},
  {id:"bio363", cat:"生物", sub:"細胞", q:"図の植物細胞で見られる、水分などをたくわえる袋のような部分を何というか。", choices:["液胞","核","葉緑体","細胞壁"], diff:"基礎", a:0, e:"【図の読み取り】細胞の一部にある、水色でうすく描かれた袋状の部分が液胞です。／【液胞のはたらき】液胞には細胞液という液体がたまっており、水分や色素、養分などをたくわえています。成長した植物の細胞ほど大きく発達する傾向があり、細胞の張り（膨圧）を保つはたらきもあります。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='20' width='160' height='140' fill='none' stroke='#4A3B47' stroke-width='2'/><rect x='38' y='28' width='144' height='124' fill='#E4F7EE' opacity='0.4' stroke='#7FC8A9' stroke-width='1.5'/><circle cx='90' cy='90' r='25' fill='#F5D7E3' stroke='#E8709F' stroke-width='1.5'/><text x='90' y='94' font-size='10' text-anchor='middle' fill='#4A3B47'>核</text><ellipse cx='150' cy='60' rx='14' ry='9' fill='#7FC8A9'/><ellipse cx='155' cy='120' rx='14' ry='9' fill='#7FC8A9'/><ellipse cx='60' cy='130' rx='14' ry='9' fill='#7FC8A9'/><rect x='95' y='105' width='75' height='40' fill='#D6EAF5' opacity='0.5' stroke='#6BA8DB' stroke-width='1'/><text x='30' y='15' font-size='9' fill='#4A3B47'>細胞壁</text><text x='170' y='150' font-size='9' fill='#4A3B47'>液胞</text></svg>"},
  {id:"bio364", cat:"生物", sub:"細胞", q:"図は動物の細胞のつくりを表している。中央の丸い部分アを何というか。", choices:["核","細胞壁","葉緑体","液胞"], diff:"基礎", a:0, e:"【図の読み取り】細胞の中心にある丸い部分アが核です。動物の細胞にも植物の細胞と同じように核があります。／【共通点】核は植物・動物どちらの細胞にも見られる共通のつくりで、DNA（遺伝情報）をふくんでいます。細胞のはたらきをコントロールする重要な役割をもっています。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><ellipse cx='110' cy='90' rx='90' ry='75' fill='#FFF0F6' opacity='0.5' stroke='#4A3B47' stroke-width='2'/><circle cx='100' cy='90' r='28' fill='#F5D7E3' stroke='#E8709F' stroke-width='1.5'/><text x='100' y='95' font-size='10' text-anchor='middle' fill='#4A3B47'>核</text><text x='110' y='20' font-size='9' text-anchor='middle' fill='#4A3B47'>細胞膜</text></svg>"},
  {id:"bio365", cat:"生物", sub:"細胞", q:"図の動物細胞には、植物細胞に見られる構造のうち、見られないものがある。それはどれか。", choices:["細胞壁と葉緑体","核","細胞膜","細胞そのもの"], diff:"標準", a:0, e:"【図の読み取り】動物の細胞には、核と、それを囲む細胞膜が見られますが、植物細胞にあったような四角いかたいしきり（細胞壁）や、緑色のつぶ（葉緑体）は見られません。／【まとめ】植物細胞に特徴的な細胞壁・葉緑体・発達した液胞は、動物細胞には基本的に見られません。核は両方の細胞に共通するつくりです。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><ellipse cx='110' cy='90' rx='90' ry='75' fill='#FFF0F6' opacity='0.5' stroke='#4A3B47' stroke-width='2'/><circle cx='100' cy='90' r='28' fill='#F5D7E3' stroke='#E8709F' stroke-width='1.5'/><text x='100' y='95' font-size='10' text-anchor='middle' fill='#4A3B47'>核</text><text x='110' y='20' font-size='9' text-anchor='middle' fill='#4A3B47'>細胞膜</text></svg>"},
  {id:"bio366", cat:"生物", sub:"植物のはたらき", q:"図は葉の断面を表している。葉の表側に見られる、細胞がすき間なくきれいに並んだ組織アを何というか。", choices:["柵状組織","海綿状組織","表皮","気孔"], diff:"標準", a:0, e:"【図の読み取り】葉の断面の上側（表側）に、たてに並んだ細長い細胞の列アが描かれています。この組織を柵状組織といいます。／【柵状組織のはたらき】柵状組織には葉緑体が多くふくまれており、光が強く当たる葉の表側で、効率よく光合成を行うはたらきをしています。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='20' y='20' width='200' height='10' fill='#7FC8A9' opacity='0.6'/><text x='230' y='28' font-size='8' fill='#4A3B47'>表皮</text><g><rect x='25' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='45' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='65' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='85' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='105' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/></g><text x='230' y='55' font-size='8' fill='#4A3B47'>柵状組織</text><circle cx='150' cy='85' r='6' fill='#B9E3C6'/><circle cx='170' cy='90' r='6' fill='#B9E3C6'/><circle cx='130' cy='95' r='6' fill='#B9E3C6'/><circle cx='190' cy='80' r='6' fill='#B9E3C6'/><text x='230' y='90' font-size='8' fill='#4A3B47'>海綿状組織</text><rect x='20' y='110' width='200' height='10' fill='#7FC8A9' opacity='0.6'/><ellipse cx='60' cy='120' rx='8' ry='4' fill='none' stroke='#4A3B47' stroke-width='1'/><text x='230' y='118' font-size='8' fill='#4A3B47'>裏側</text><text x='60' y='135' font-size='8' text-anchor='middle' fill='#4A3B47'>気孔</text></svg>"},
  {id:"bio367", cat:"生物", sub:"植物のはたらき", q:"図の葉の断面で、細胞と細胞の間にすき間が多く見られる、裏側寄りの組織イを何というか。", choices:["海綿状組織","柵状組織","表皮","維管束"], diff:"標準", a:0, e:"【図の読み取り】葉の断面の下側（裏側寄り）に、丸い細胞がすき間をあけて並んでいる部分イが描かれています。この組織を海綿状組織といいます。／【海綿状組織のはたらき】海綿状組織のすき間は、気孔から取り入れた二酸化炭素や酸素などの気体が、葉の内部を移動するための通り道としてはたらいています。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='20' y='20' width='200' height='10' fill='#7FC8A9' opacity='0.6'/><text x='230' y='28' font-size='8' fill='#4A3B47'>表皮</text><g><rect x='25' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='45' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='65' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='85' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='105' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/></g><text x='230' y='55' font-size='8' fill='#4A3B47'>柵状組織</text><circle cx='150' cy='85' r='6' fill='#B9E3C6'/><circle cx='170' cy='90' r='6' fill='#B9E3C6'/><circle cx='130' cy='95' r='6' fill='#B9E3C6'/><circle cx='190' cy='80' r='6' fill='#B9E3C6'/><text x='230' y='90' font-size='8' fill='#4A3B47'>海綿状組織</text><rect x='20' y='110' width='200' height='10' fill='#7FC8A9' opacity='0.6'/><ellipse cx='60' cy='120' rx='8' ry='4' fill='none' stroke='#4A3B47' stroke-width='1'/><text x='230' y='118' font-size='8' fill='#4A3B47'>裏側</text><text x='60' y='135' font-size='8' text-anchor='middle' fill='#4A3B47'>気孔</text></svg>"},
  {id:"bio368", cat:"生物", sub:"植物のはたらき", q:"図の葉の裏側に見られる、小さな穴のような部分ウを何というか。", choices:["気孔","柵状組織","葉緑体","道管"], diff:"基礎", a:0, e:"【図の読み取り】葉の裏側の表皮に見られる、小さな穴のような部分ウが気孔です。／【気孔のはたらき】気孔は2つの孔辺細胞に囲まれた小さな穴で、水蒸気や二酸化炭素、酸素などの気体の出入り口としてはたらいています。多くの植物で、気孔は葉の裏側に多く見られます。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='20' y='20' width='200' height='10' fill='#7FC8A9' opacity='0.6'/><text x='230' y='28' font-size='8' fill='#4A3B47'>表皮</text><g><rect x='25' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='45' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='65' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='85' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/><rect x='105' y='35' width='16' height='35' fill='#4A9B6E' opacity='0.7'/></g><text x='230' y='55' font-size='8' fill='#4A3B47'>柵状組織</text><circle cx='150' cy='85' r='6' fill='#B9E3C6'/><circle cx='170' cy='90' r='6' fill='#B9E3C6'/><circle cx='130' cy='95' r='6' fill='#B9E3C6'/><circle cx='190' cy='80' r='6' fill='#B9E3C6'/><text x='230' y='90' font-size='8' fill='#4A3B47'>海綿状組織</text><rect x='20' y='110' width='200' height='10' fill='#7FC8A9' opacity='0.6'/><ellipse cx='60' cy='120' rx='8' ry='4' fill='none' stroke='#4A3B47' stroke-width='1'/><text x='230' y='118' font-size='8' fill='#4A3B47'>裏側</text><text x='60' y='135' font-size='8' text-anchor='middle' fill='#4A3B47'>気孔</text></svg>"},
  {id:"bio369", cat:"生物", sub:"植物のつくり", q:"図は花のつくりを表している。おしべの先にある、花粉が入っている部分アを何というか。", choices:["やく","柱頭","子房","がく"], diff:"標準", a:0, e:"【図の読み取り】おしべの先端にある、丸くふくらんだ部分アに注目します。この部分をやくといいます。／【やくのはたらき】やくの中には花粉がぎっしりと入っています。花が開くとやくが開いて花粉が外に出て、虫や風によって運ばれ、めしべの柱頭につく（受粉する）ことで受精につながります。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><ellipse cx='60' cy='60' rx='30' ry='16' fill='#F5C4D8' transform='rotate(-20 60 60)'/><ellipse cx='160' cy='60' rx='30' ry='16' fill='#F5C4D8' transform='rotate(20 160 60)'/><ellipse cx='110' cy='30' rx='16' ry='30' fill='#F5C4D8'/><text x='40' y='25' font-size='9' fill='#4A3B47'>花弁</text><rect x='104' y='70' width='12' height='40' fill='#7FC8A9'/><text x='130' y='90' font-size='9' fill='#4A3B47'>子房</text><line x1='95' y1='60' x2='95' y2='90' stroke='#F0A63C' stroke-width='2'/><circle cx='95' cy='58' r='4' fill='#F0A63C'/><line x1='125' y1='60' x2='125' y2='90' stroke='#F0A63C' stroke-width='2'/><circle cx='125' cy='58' r='4' fill='#F0A63C'/><text x='60' y='100' font-size='9' fill='#4A3B47'>おしべ</text><line x1='110' y1='45' x2='110' y2='95' stroke='#A88BD4' stroke-width='2'/><circle cx='110' cy='42' r='5' fill='#A88BD4'/><text x='160' y='45' font-size='9' fill='#4A3B47'>めしべ</text></svg>"},
  {id:"bio370", cat:"生物", sub:"植物のつくり", q:"図の花のつくりで、めしべの根もとにある、ふくらんだ部分イを何というか。", choices:["子房","やく","がく","花弁"], diff:"基礎", a:0, e:"【図の読み取り】めしべの下の方にある、ふくらんだ部分イが子房です。／【子房のはたらき】子房の中には胚珠が入っています。受粉・受精が起こると、胚珠は種子に、子房全体は果実へと変化していきます。リンゴやモモなどの果実は、この子房が育ったものです。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><ellipse cx='60' cy='60' rx='30' ry='16' fill='#F5C4D8' transform='rotate(-20 60 60)'/><ellipse cx='160' cy='60' rx='30' ry='16' fill='#F5C4D8' transform='rotate(20 160 60)'/><ellipse cx='110' cy='30' rx='16' ry='30' fill='#F5C4D8'/><text x='40' y='25' font-size='9' fill='#4A3B47'>花弁</text><rect x='104' y='70' width='12' height='40' fill='#7FC8A9'/><text x='130' y='90' font-size='9' fill='#4A3B47'>子房</text><line x1='95' y1='60' x2='95' y2='90' stroke='#F0A63C' stroke-width='2'/><circle cx='95' cy='58' r='4' fill='#F0A63C'/><line x1='125' y1='60' x2='125' y2='90' stroke='#F0A63C' stroke-width='2'/><circle cx='125' cy='58' r='4' fill='#F0A63C'/><text x='60' y='100' font-size='9' fill='#4A3B47'>おしべ</text><line x1='110' y1='45' x2='110' y2='95' stroke='#A88BD4' stroke-width='2'/><circle cx='110' cy='42' r='5' fill='#A88BD4'/><text x='160' y='45' font-size='9' fill='#4A3B47'>めしべ</text></svg>"},
  {id:"bio371", cat:"生物", sub:"植物のつくり", q:"図の花のうち、色があざやかで昆虫を引き寄せる役割をもつ部分ウを何というか。", choices:["花弁（花びら）","がく","子房","やく"], diff:"基礎", a:0, e:"【図の読み取り】花の外側に大きく広がっている、色のついた部分ウが花弁（花びら）です。／【花弁のはたらき】花弁は多くの場合あざやかな色をしており、蜜のありかを示す目印にもなって、虫媒花では昆虫を引き寄せる役割を果たしています。花粉を運んでもらうための工夫の一つです。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><ellipse cx='60' cy='60' rx='30' ry='16' fill='#F5C4D8' transform='rotate(-20 60 60)'/><ellipse cx='160' cy='60' rx='30' ry='16' fill='#F5C4D8' transform='rotate(20 160 60)'/><ellipse cx='110' cy='30' rx='16' ry='30' fill='#F5C4D8'/><text x='40' y='25' font-size='9' fill='#4A3B47'>花弁</text><rect x='104' y='70' width='12' height='40' fill='#7FC8A9'/><text x='130' y='90' font-size='9' fill='#4A3B47'>子房</text><line x1='95' y1='60' x2='95' y2='90' stroke='#F0A63C' stroke-width='2'/><circle cx='95' cy='58' r='4' fill='#F0A63C'/><line x1='125' y1='60' x2='125' y2='90' stroke='#F0A63C' stroke-width='2'/><circle cx='125' cy='58' r='4' fill='#F0A63C'/><text x='60' y='100' font-size='9' fill='#4A3B47'>おしべ</text><line x1='110' y1='45' x2='110' y2='95' stroke='#A88BD4' stroke-width='2'/><circle cx='110' cy='42' r='5' fill='#A88BD4'/><text x='160' y='45' font-size='9' fill='#4A3B47'>めしべ</text></svg>"},
  {id:"bio372", cat:"生物", sub:"植物のつくり", q:"図の花で、受粉・受精が起こったあと、種子になる部分はどれか。", choices:["子房の中にある胚珠","花弁全体","おしべのやくの部分","がく全体"], diff:"標準", a:0, e:"【図の読み取り】子房の中に見えている小さな粒（胚珠）に注目します。／【受精後の変化】受粉した花粉から花粉管が伸び、精細胞が胚珠の中の卵細胞と受精すると、胚珠は種子へと成長していきます。同時に、胚珠を包んでいた子房全体は果実に成長します。", img:"<svg viewBox='0 0 220 180' xmlns='http://www.w3.org/2000/svg'><ellipse cx='60' cy='60' rx='30' ry='16' fill='#F5C4D8' transform='rotate(-20 60 60)'/><ellipse cx='160' cy='60' rx='30' ry='16' fill='#F5C4D8' transform='rotate(20 160 60)'/><ellipse cx='110' cy='30' rx='16' ry='30' fill='#F5C4D8'/><text x='40' y='25' font-size='9' fill='#4A3B47'>花弁</text><rect x='104' y='70' width='12' height='40' fill='#7FC8A9'/><text x='130' y='90' font-size='9' fill='#4A3B47'>子房</text><line x1='95' y1='60' x2='95' y2='90' stroke='#F0A63C' stroke-width='2'/><circle cx='95' cy='58' r='4' fill='#F0A63C'/><line x1='125' y1='60' x2='125' y2='90' stroke='#F0A63C' stroke-width='2'/><circle cx='125' cy='58' r='4' fill='#F0A63C'/><text x='60' y='100' font-size='9' fill='#4A3B47'>おしべ</text><line x1='110' y1='45' x2='110' y2='95' stroke='#A88BD4' stroke-width='2'/><circle cx='110' cy='42' r='5' fill='#A88BD4'/><text x='160' y='45' font-size='9' fill='#4A3B47'>めしべ</text></svg>"},
  {id:"bio373", cat:"生物", sub:"植物のつくり", q:"図の左側のような、太い根から細い根が枝分かれして出ているつくりを何というか。", choices:["主根と側根","ひげ根","気根","仮根"], diff:"基礎", a:0, e:"【図の読み取り】図の左側には、1本の太い根（主根）から細い根（側根）がいくつも枝分かれして出ているようすが描かれています。これを主根と側根といいます。／【見られる植物】アブラナやタンポポなどの双子葉類の植物で見られる根のつくりです。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><line x1='60' y1='20' x2='60' y2='100' stroke='#4A3B47' stroke-width='3'/><line x1='60' y1='40' x2='40' y2='70' stroke='#4A3B47' stroke-width='1.5'/><line x1='60' y1='55' x2='80' y2='85' stroke='#4A3B47' stroke-width='1.5'/><line x1='60' y1='70' x2='35' y2='95' stroke='#4A3B47' stroke-width='1.5'/><line x1='60' y1='85' x2='85' y2='110' stroke='#4A3B47' stroke-width='1.5'/><text x='60' y='115' font-size='9' text-anchor='middle' fill='#4A3B47'>主根と側根</text><g><line x1='170' y1='20' x2='150' y2='90' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='165' y2='95' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='175' y2='90' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='185' y2='95' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='195' y2='85' stroke='#4A3B47' stroke-width='1.5'/></g><text x='170' y='115' font-size='9' text-anchor='middle' fill='#4A3B47'>ひげ根</text></svg>"},
  {id:"bio374", cat:"生物", sub:"植物のつくり", q:"図の右側のような、同じくらいの太さの根がたくさん根もとから出ているつくりを何というか。", choices:["ひげ根","主根と側根","仮根","支柱根"], diff:"基礎", a:0, e:"【図の読み取り】図の右側には、同じくらいの太さの根が、根もとから一斉にたくさん出ているようすが描かれています。これをひげ根といいます。／【見られる植物】イネやトウモロコシなどの単子葉類の植物で見られる根のつくりです。主根と側根のつくりとの違いを見た目で区別できるようにしておきましょう。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><line x1='60' y1='20' x2='60' y2='100' stroke='#4A3B47' stroke-width='3'/><line x1='60' y1='40' x2='40' y2='70' stroke='#4A3B47' stroke-width='1.5'/><line x1='60' y1='55' x2='80' y2='85' stroke='#4A3B47' stroke-width='1.5'/><line x1='60' y1='70' x2='35' y2='95' stroke='#4A3B47' stroke-width='1.5'/><line x1='60' y1='85' x2='85' y2='110' stroke='#4A3B47' stroke-width='1.5'/><text x='60' y='115' font-size='9' text-anchor='middle' fill='#4A3B47'>主根と側根</text><g><line x1='170' y1='20' x2='150' y2='90' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='165' y2='95' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='175' y2='90' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='185' y2='95' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='195' y2='85' stroke='#4A3B47' stroke-width='1.5'/></g><text x='170' y='115' font-size='9' text-anchor='middle' fill='#4A3B47'>ひげ根</text></svg>"},
  {id:"bio375", cat:"生物", sub:"植物のつくり", q:"図のように根のつくりが「主根・側根」か「ひげ根」かによって分類できる植物のグループの組み合わせとして正しいものはどれか。", choices:["主根・側根は双子葉類、ひげ根は単子葉類に多く見られる","主根・側根は単子葉類、ひげ根は双子葉類に多く見られる","どちらも同じグループの植物にのみ見られる","根のつくりと植物のグループは無関係である"], diff:"標準", a:0, e:"【図の読み取り】図には2種類の異なる根のつくりが並べて描かれています。／【分類との関係】主根・側根のつくりは双子葉類（アブラナ、タンポポなど）に、ひげ根のつくりは単子葉類（イネ、トウモロコシなど）に多く見られます。葉脈（網状脈・平行脈）や子葉の数ともあわせて、植物の分類の手がかりになります。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><line x1='60' y1='20' x2='60' y2='100' stroke='#4A3B47' stroke-width='3'/><line x1='60' y1='40' x2='40' y2='70' stroke='#4A3B47' stroke-width='1.5'/><line x1='60' y1='55' x2='80' y2='85' stroke='#4A3B47' stroke-width='1.5'/><line x1='60' y1='70' x2='35' y2='95' stroke='#4A3B47' stroke-width='1.5'/><line x1='60' y1='85' x2='85' y2='110' stroke='#4A3B47' stroke-width='1.5'/><text x='60' y='115' font-size='9' text-anchor='middle' fill='#4A3B47'>主根と側根</text><g><line x1='170' y1='20' x2='150' y2='90' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='165' y2='95' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='175' y2='90' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='185' y2='95' stroke='#4A3B47' stroke-width='1.5'/><line x1='170' y1='20' x2='195' y2='85' stroke='#4A3B47' stroke-width='1.5'/></g><text x='170' y='115' font-size='9' text-anchor='middle' fill='#4A3B47'>ひげ根</text></svg>"},
  {id:"bio376", cat:"生物", sub:"生物とかんきょう", q:"図は生態系における食物連鎖の関係をピラミッドで表したものである。最も下の段にある生産者にあたる生物はどれか。", choices:["植物","肉食動物","草食動物","分解者"], diff:"基礎", a:0, e:"【図の読み取り】ピラミッドの一番下の段（面積が最も広い段）が生産者です。／【生産者のはたらき】生産者は光合成によって自分で養分をつくり出せる生物で、植物や藻類がこれにあたります。食物連鎖の出発点であり、他のすべての生物のエネルギー源のもとになっています。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><polygon points='110,20 140,60 80,60' fill='#E8709F' opacity='0.7'/><text x='110' y='45' font-size='9' text-anchor='middle' fill='#fff'>三次消費者</text><polygon points='80,60 140,60 165,100 55,100' fill='#F0A63C' opacity='0.7'/><text x='110' y='85' font-size='9' text-anchor='middle' fill='#fff'>二次消費者</text><polygon points='55,100 165,100 190,140 30,140' fill='#7FC8A9' opacity='0.7'/><text x='110' y='125' font-size='9' text-anchor='middle' fill='#fff'>一次消費者</text><polygon points='30,140 190,140 210,170 10,170' fill='#6BA8DB' opacity='0.7'/><text x='110' y='160' font-size='9' text-anchor='middle' fill='#fff'>生産者(植物)</text></svg>"},
  {id:"bio377", cat:"生物", sub:"生物とかんきょう", q:"図のピラミッドで、段が上に行くほど、その段にふくまれる生物の数やエネルギーの量はどうなる傾向があるか。", choices:["少なくなっていく傾向がある","多くなっていく傾向がある","変化しない","一定の周期で増減をくり返す"], diff:"標準", a:0, e:"【図の読み取り】ピラミッドは上に行くほど段の面積（横はば）が小さくなっていく形をしています。／【考え方】食べる・食べられるの関係が1段階進むごとに、得られるエネルギーの多くが呼吸などで失われてしまうため、上の段の生物ほど、個体数やエネルギー量は少なくなっていく傾向があります。この形が「エネルギーのピラミッド」と呼ばれるゆえんです。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><polygon points='110,20 140,60 80,60' fill='#E8709F' opacity='0.7'/><text x='110' y='45' font-size='9' text-anchor='middle' fill='#fff'>三次消費者</text><polygon points='80,60 140,60 165,100 55,100' fill='#F0A63C' opacity='0.7'/><text x='110' y='85' font-size='9' text-anchor='middle' fill='#fff'>二次消費者</text><polygon points='55,100 165,100 190,140 30,140' fill='#7FC8A9' opacity='0.7'/><text x='110' y='125' font-size='9' text-anchor='middle' fill='#fff'>一次消費者</text><polygon points='30,140 190,140 210,170 10,170' fill='#6BA8DB' opacity='0.7'/><text x='110' y='160' font-size='9' text-anchor='middle' fill='#fff'>生産者(植物)</text></svg>"},
  {id:"bio378", cat:"生物", sub:"生物とかんきょう", q:"図のピラミッドで、ある段の生物が急激に増えすぎた場合、生態系全体にどのような影響が考えられるか。", choices:["食物連鎖のバランスがくずれ、他の段の生物数にも影響が出ることがある","他の段には一切影響が出ない","ピラミッド全体の形が完全になくなる","生産者だけが必ず増え続ける"], diff:"標準", a:0, e:"【図の読み取り】ピラミッドの各段は食べる・食べられるの関係でたがいにつながっています。／【考え方】ある段の生物が急に増えすぎると、その生物に食べられる下の段の生物が減りすぎたり、逆にそれを食べる上の段の生物が増えすぎたりして、食物連鎖全体のバランスがくずれることがあります。外来種の侵入などがこのような影響を引き起こす例として知られています。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><polygon points='110,20 140,60 80,60' fill='#E8709F' opacity='0.7'/><text x='110' y='45' font-size='9' text-anchor='middle' fill='#fff'>三次消費者</text><polygon points='80,60 140,60 165,100 55,100' fill='#F0A63C' opacity='0.7'/><text x='110' y='85' font-size='9' text-anchor='middle' fill='#fff'>二次消費者</text><polygon points='55,100 165,100 190,140 30,140' fill='#7FC8A9' opacity='0.7'/><text x='110' y='125' font-size='9' text-anchor='middle' fill='#fff'>一次消費者</text><polygon points='30,140 190,140 210,170 10,170' fill='#6BA8DB' opacity='0.7'/><text x='110' y='160' font-size='9' text-anchor='middle' fill='#fff'>生産者(植物)</text></svg>"},
  {id:"bio379", cat:"生物", sub:"動物のからだ", q:"図は目のつくりを表している。光を屈折させて像を結ばせる、レンズのようなはたらきをする部分アを何というか。", choices:["水晶体","網膜","ひとみ","視神経"], diff:"基礎", a:0, e:"【図の読み取り】目の中ほどにある、丸くふくらんだ透明な部分アが水晶体です。／【水晶体のはたらき】水晶体は凸レンズのようなはたらきをしており、外からの光を屈折させて、目の奥にある網膜に像を結ばせます。まわりの筋肉によって厚みが変わり、遠くや近くのものにピントを合わせています。", img:"<svg viewBox='0 0 220 120' xmlns='http://www.w3.org/2000/svg'><ellipse cx='110' cy='60' rx='90' ry='50' fill='none' stroke='#4A3B47' stroke-width='2'/><circle cx='170' cy='60' r='16' fill='#D6EAF5' stroke='#6BA8DB' stroke-width='1.5'/><text x='170' y='90' font-size='9' text-anchor='middle' fill='#4A3B47'>水晶体</text><path d='M 25 20 A 90 50 0 0 0 25 100' stroke='#E8709F' stroke-width='4' fill='none'/><text x='15' y='60' font-size='9' fill='#4A3B47'>網膜</text><line x1='55' y1='60' x2='40' y2='60' stroke='#4A3B47' stroke-width='1'/><text x='60' y='45' font-size='8' fill='#4A3B47'>ひとみ</text></svg>"},
  {id:"bio380", cat:"生物", sub:"動物のからだ", q:"図の目のつくりで、像が実際に映し出される、目の奥の部分イを何というか。", choices:["網膜","水晶体","ひとみ","角膜"], diff:"基礎", a:0, e:"【図の読み取り】目の奥のカーブした部分イが網膜です。／【網膜のはたらき】網膜には光を感じ取る細胞が多数並んでおり、水晶体で屈折した光がここに像として映し出されます。網膜が受け取った刺激は、視神経を通って脳に伝えられ、そこではじめて「見えた」と認識されます。", img:"<svg viewBox='0 0 220 120' xmlns='http://www.w3.org/2000/svg'><ellipse cx='110' cy='60' rx='90' ry='50' fill='none' stroke='#4A3B47' stroke-width='2'/><circle cx='170' cy='60' r='16' fill='#D6EAF5' stroke='#6BA8DB' stroke-width='1.5'/><text x='170' y='90' font-size='9' text-anchor='middle' fill='#4A3B47'>水晶体</text><path d='M 25 20 A 90 50 0 0 0 25 100' stroke='#E8709F' stroke-width='4' fill='none'/><text x='15' y='60' font-size='9' fill='#4A3B47'>網膜</text><line x1='55' y1='60' x2='40' y2='60' stroke='#4A3B47' stroke-width='1'/><text x='60' y='45' font-size='8' fill='#4A3B47'>ひとみ</text></svg>"},
  {id:"bio381", cat:"生物", sub:"動物のからだ", q:"図の目で、光の量に応じて大きさが変化し、目に入る光の量を調節している部分はどれか。", choices:["ひとみ（瞳孔）","水晶体","網膜","視神経"], diff:"標準", a:0, e:"【図の読み取り】目の中央にある、光を通す小さな穴の部分がひとみ（瞳孔）です。／【ひとみのはたらき】明るい場所ではひとみが小さくなって入る光の量を減らし、暗い場所ではひとみが大きく広がって、少ない光を効率よく取り入れようとします。この調節によって、さまざまな明るさの環境で物を見ることができます。", img:"<svg viewBox='0 0 220 120' xmlns='http://www.w3.org/2000/svg'><ellipse cx='110' cy='60' rx='90' ry='50' fill='none' stroke='#4A3B47' stroke-width='2'/><circle cx='170' cy='60' r='16' fill='#D6EAF5' stroke='#6BA8DB' stroke-width='1.5'/><text x='170' y='90' font-size='9' text-anchor='middle' fill='#4A3B47'>水晶体</text><path d='M 25 20 A 90 50 0 0 0 25 100' stroke='#E8709F' stroke-width='4' fill='none'/><text x='15' y='60' font-size='9' fill='#4A3B47'>網膜</text><line x1='55' y1='60' x2='40' y2='60' stroke='#4A3B47' stroke-width='1'/><text x='60' y='45' font-size='8' fill='#4A3B47'>ひとみ</text></svg>"},
  {id:"bio382", cat:"生物", sub:"動物のからだ", q:"図はヒトの消化器官を表している。食べ物が口から入って最初に通る、細長い管アを何というか。", choices:["食道","小腸","大腸","胃"], diff:"基礎", a:0, e:"【図の読み取り】口から胃までをつなぐ細長い管アが食道です。／【食道のはたらき】食道は口で細かくかまれた食べ物を胃へと送るための通り道で、消化酵素は出しません。食べ物は食道の筋肉の動きによって、胃の方向へ送られていきます。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><circle cx='40' cy='25' r='12' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='40' y='15' font-size='8' text-anchor='middle' fill='#4A3B47'>口</text><line x1='40' y1='37' x2='60' y2='70' stroke='#4A3B47' stroke-width='3'/><text x='75' y='55' font-size='8' fill='#4A3B47'>食道</text><ellipse cx='80' cy='90' rx='25' ry='20' fill='#F5D7E3' stroke='#4A3B47' stroke-width='2'/><text x='80' y='95' font-size='8' text-anchor='middle' fill='#4A3B47'>胃</text><path d='M 90 105 Q 130 120 130 90 Q 130 60 160 80 Q 180 95 150 120 Q 120 140 90 130' stroke='#4A3B47' stroke-width='3' fill='none'/><text x='140' y='60' font-size='8' fill='#4A3B47'>小腸</text><path d='M 90 130 Q 60 150 190 145 Q 200 100 170 80' stroke='#F0A63C' stroke-width='4' fill='none'/><text x='190' y='120' font-size='8' fill='#4A3B47'>大腸</text></svg>"},
  {id:"bio383", cat:"生物", sub:"動物のからだ", q:"図の消化器官のうち、強い酸を出して食べ物を消化し、殺菌のはたらきもしている袋状の部分イを何というか。", choices:["胃","小腸","食道","大腸"], diff:"基礎", a:0, e:"【図の読み取り】食道の下にある、大きくふくらんだ袋状の部分イが胃です。／【胃のはたらき】胃液（強い酸性の塩酸とペプシンをふくむ）が出て、主にタンパク質を消化するとともに、食べ物についた細菌を殺菌するはたらきもあります。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><circle cx='40' cy='25' r='12' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='40' y='15' font-size='8' text-anchor='middle' fill='#4A3B47'>口</text><line x1='40' y1='37' x2='60' y2='70' stroke='#4A3B47' stroke-width='3'/><text x='75' y='55' font-size='8' fill='#4A3B47'>食道</text><ellipse cx='80' cy='90' rx='25' ry='20' fill='#F5D7E3' stroke='#4A3B47' stroke-width='2'/><text x='80' y='95' font-size='8' text-anchor='middle' fill='#4A3B47'>胃</text><path d='M 90 105 Q 130 120 130 90 Q 130 60 160 80 Q 180 95 150 120 Q 120 140 90 130' stroke='#4A3B47' stroke-width='3' fill='none'/><text x='140' y='60' font-size='8' fill='#4A3B47'>小腸</text><path d='M 90 130 Q 60 150 190 145 Q 200 100 170 80' stroke='#F0A63C' stroke-width='4' fill='none'/><text x='190' y='120' font-size='8' fill='#4A3B47'>大腸</text></svg>"},
