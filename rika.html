  {id:"trivia10", cat:"雑学", sub:"環境", q:"地球温暖化の主要な原因は何か。", choices:["太陽放射増加","火山活動","温室効果ガスの増加","大気成分の自然変化"], diff:"基礎", a:2, e:"【解説】地球温暖化は主にCO₂などの温室効果ガスの人為的排出が原因とされている。【まちがえやすい点】ほかの選択肢（太陽放射増加／火山活動）とのちがいをおさえておこう。"},
  {id:"trivia12", cat:"雑学", sub:"物質", q:"最も硬い天然鉱物は何か。", choices:["水晶","ルビー","ダイヤモンド","サファイア"], diff:"基礎", a:2, e:"【解説】ダイヤモンドは天然鉱物の中で最も硬く、モース硬度は10。【まちがえやすい点】ほかの選択肢（水晶／ルビー）とのちがいをおさえておこう。"},
  {id:"trivia14", cat:"雑学", sub:"物質", q:"砂糖の主成分は何か。", choices:["ブドウ糖","果糖","ショ糖","乳糖"], diff:"基礎", a:2, e:"【解説】砂糖の主成分はショ糖(スクロース)。グルコースとフルクトースのエステル。【まちがえやすい点】ほかの選択肢（ブドウ糖／果糖）とのちがいをおさえておこう。"},
  {id:"trivia16", cat:"雑学", sub:"医学", q:"人間の筋肉は何個あるか。", choices:["100個","250個","400個","600個"], diff:"基礎", a:3, e:"【解説】人間の体には約600個の骨格筋があります。【まちがえやすい点】ほかの選択肢（100個／250個）とのちがいをおさえておこう。"},
  {id:"trivia18", cat:"雑学", sub:"医学", q:"人間の平均寿命が最も長い国はどこか。", choices:["アメリカ","日本","オーストラリア","スイス"], diff:"基礎", a:1, e:"【解説】日本は男女平均寿命が世界で最も長い国の一つです。【まちがえやすい点】ほかの選択肢（アメリカ／オーストラリア）とのちがいをおさえておこう。"},
  {id:"trivia20", cat:"雑学", sub:"化学", q:"酸素の化学記号は何か。", choices:["O","Og","Os","O2"], diff:"基礎", a:0, e:"【解説】酸素の化学記号はO。分子としてはO₂で存在。【まちがえやすい点】ほかの選択肢（Og／Os）とのちがいをおさえておこう。"},
  {id:"trivia22", cat:"雑学", sub:"物理", q:"音の速さは秒速約何mか(空気中)。", choices:["34m","170m","340m","3400m"], diff:"基礎", a:2, e:"【解説】空気中の音速は秒速約340m(温度により変化)。【まちがえやすい点】ほかの選択肢（34m／170m）とのちがいをおさえておこう。"},
  {id:"trivia24", cat:"雑学", sub:"天文学", q:"月が地球の周りを公転する周期は約何日か。", choices:["15日","29日","100日","365日"], diff:"基礎", a:1, e:"【ことばの意味】「公転」＝地球が1年かけて太陽のまわりを回ること【解説】月の公転周期は約29.5日（朔望月）。新月から新月までの期間。【まちがえやすい点】ほかの選択肢（15日／100日）とのちがいをおさえておこう。"},
  {id:"trivia28", cat:"雑学", sub:"物質", q:"二酸化炭素の分子式は何か。", choices:["CO","CO2","C2O","C2O4"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】二酸化炭素の分子式はCO₂。炭素原子1個と酸素原子2個で構成。【まちがえやすい点】ほかの選択肢（CO／C2O）とのちがいをおさえておこう。"},
  {id:"trivia30", cat:"雑学", sub:"技術", q:"人工知能の英語表記は何か。", choices:["AN","AI","IA","AT"], diff:"基礎", a:1, e:"【解説】人工知能はArtificial Intelligence（AI）の略。【まちがえやすい点】ほかの選択肢（AN／IA）とのちがいをおさえておこう。"},
  {id:"trivia32", cat:"雑学", sub:"物理", q:"ブラックホールの周辺では何が起こるか。", choices:["光が屈折する","光すら逃げられない","物質が輝く","温度が低下する"], diff:"基礎", a:1, e:"【解説】ブラックホールの事象の地平線内では、光の速度でさえ脱出できない。【まちがえやすい点】ほかの選択肢（光が屈折する／物質が輝く）とのちがいをおさえておこう。"},
  {id:"trivia34", cat:"雑学", sub:"生物", q:"進化の最大の証拠は何か。", choices:["形態の類似性","化石記録","遺伝子の類似性","生態の類似性"], diff:"基礎", a:2, e:"【ことばの意味】「遺伝子」＝生物の特徴を決める情報。染色体の中にある／「DNA」＝遺伝子の本体となる物質【解説】遺伝子の類似性が進化の最強の証拠。DNA分析で進化関係が明確化。【まちがえやすい点】ほかの選択肢（形態の類似性／化石記録）とのちがいをおさえておこう。"},
  {id:"trivia36", cat:"雑学", sub:"地球", q:"地球で最も高い山は何か。", choices:["キリマンジャロ","K2","エベレスト","マッキンレー"], diff:"基礎", a:2, e:"【解説】エベレストは地球で最も高い山で、高さは約8,849m。【まちがえやすい点】ほかの選択肢（キリマンジャロ／K2）とのちがいをおさえておこう。"},
  {id:"trivia38", cat:"雑学", sub:"生態", q:"食物連鎖で最も多くのエネルギーを持つのはどの段階か。", choices:["肉食動物","草食動物","生産者（植物）","分解者"], diff:"基礎", a:2, e:"【ことばの意味】「生産者」＝光合成で自分の養分をつくる生物（植物など）／「食物連鎖」＝「食べる・食べられる」の一直線のつながり【解説】生産者（植物）が最もエネルギーを持ち、上位の段階ほど減少する。【まちがえやすい点】ほかの選択肢（肉食動物／草食動物）とのちがいをおさえておこう。"},
  {id:"trivia40", cat:"雑学", sub:"化学", q:"プラスチックの多くは何から作られるか。", choices:["動物の骨","石油","鉱物","植物繊維"], diff:"基礎", a:1, e:"【解説】多くのプラスチックは石油の副産物から合成される。【まちがえやすい点】ほかの選択肢（動物の骨／鉱物）とのちがいをおさえておこう。"},
  {id:"trivia42", cat:"雑学", sub:"技術", q:"パソコンの最初のマイクロプロセッサはいつ開発されたか。", choices:["1950年","1960年","1970年代","1980年代"], diff:"基礎", a:2, e:"【解説】インテルの4004は1971年に開発された最初の商用マイクロプロセッサ。【まちがえやすい点】ほかの選択肢（1950年／1960年）とのちがいをおさえておこう。"},
  {id:"trivia44", cat:"雑学", sub:"医学", q:"デジタルDNA配列化技術により何が可能になったか。", choices:["病気の治療","人間の複製","遺伝子の完全解析","永遠の生命"], diff:"基礎", a:2, e:"【ことばの意味】「遺伝子」＝生物の特徴を決める情報。染色体の中にある／「DNA」＝遺伝子の本体となる物質【解説】DNAシーケンシング技術により個人の遺伝子完全解析が可能。【まちがえやすい点】ほかの選択肢（病気の治療／人間の複製）とのちがいをおさえておこう。"},
  {id:"trivia48", cat:"雑学", sub:"化学", q:"ノーベル化学賞を複数回受賞した唯一の女性は誰か。", choices:["ランスーム","キュリー","メイトナー","フランクリン"], diff:"基礎", a:1, e:"【ことばの意味】「放射」＝光や赤外線として熱が伝わること。真空でも伝わる【解説】マリー・キュリーは放射能と放射性元素の発見で複数回ノーベル賞受賞。【まちがえやすい点】ほかの選択肢（ランスーム／メイトナー）とのちがいをおさえておこう。"},
  {id:"bio243", cat:"生物", sub:"放射進化", q:"放射進化についての説明として正しいものはどれか。", choices:["共通祖先から複数の種が多様な環境に適応して分化する過程","放射進化は長い時間をかけて起こるとされている","放射進化には地理的隔離が不要と考えられている","放射進化はニッチ分化を伴わないと考えられている"], diff:"基礎", a:0, e:"【ことばの意味】「放射」＝光や赤外線として熱が伝わること。真空でも伝わる【解説】放射進化(adaptive radiation)：ガラパゴスフィンチ(くちばし多様化),キルギス湖シクリド。急速。【誤答説明】急速も可(選択肢2)。隔離が促進(選択肢3)。ニッチ分化が本質(選択肢4)。進化の顕著な例。【まちがえやすい点】ほかの選択肢（放射進化は長い時間をかけて起こる／放射進化には地理的隔離が不要）とのちがいをおさえておこう。"},
  {id:"ear235", cat:"地学", sub:"活断層", q:"活断層についての説明として正しいものはどれか。", choices:["新生代以降にくり返し運動しており、今後も地震を起こす可能性がある断層である","活断層はつねに大地震を引き起こす","活断層は過去の地震の痕跡ではない","活断層は地層から直接観測できない"], diff:"基礎", a:0, e:"【ことばの意味】「活断層」＝比較的新しい時代（数十万年前以降）にくり返しずれ動いており、今後もずれ動いて地震を起こす可能性があると考えられている断層。／【調査方法】地層を掘り下げて調べるトレンチ調査などによって、過去にずれた跡（痕跡）を地層から直接観察することができます。／【まちがえやすい点】活断層があっても必ず大地震が起こるとは限らず、いつ起こるかを正確に予測することは難しいとされています。"},
  {id:"ear237", cat:"地学", sub:"沈み込み帯", q:"沈み込み帯についての説明として正しいものはどれか。", choices:["海洋プレートが大陸プレートの下に沈み込む地域","沈み込み帯では常に安定","沈み込み帯には火山活動がない","沈み込み帯で浅い地震が多く発生する"], diff:"基礎", a:0, e:"沈み込み帯(subduction zone)：相対速度5-10cm/年。ペルー海溝-アンデス山脈の例。【誤答説明】最活動的(選択肢2)。火山弧形成(選択肢3)。深いWadati-Benioff帯多(選択肢4)。環太平洋火山帯の主体。"},
  {id:"trivia54", cat:"雑学", sub:"環境", q:"泥炭地（ピートランド）が気候変動対策として注目されている理由はどれか。", choices:["大量の炭素をたくわえているから","太陽の光を強く反射するから","水をすばやく蒸発させるから","風の力をやわらげるから"], diff:"標準", a:0, e:"【泥炭地とは】湿地で植物が完全に分解されずに積み重なった土地のこと。水につかっているため、微生物による分解が進みにくいのです。／【なぜ大切？】分解されなかった植物には炭素がふくまれたまま閉じこめられています。泥炭地は世界の陸地のわずか数％なのに、森林全体に匹敵するほどの炭素をたくわえているといわれます。／【こわれると】乾燥させたり火事が起きたりすると、たくわえられていた炭素が二酸化炭素として一気に大気へ放出されます。だから泥炭地を守ることが温暖化対策になります。"},
  {id:"phy223", cat:"物理", sub:"電流と回路", q:"直列回路で電球2個をつないだとき、一方の電球を取り外すともう一方はどうなるか。", choices:["変わらず点灯し続ける","消える","より明るく点灯する","点滅し始める"], diff:"標準", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「直列」＝電気の通り道が1本道のつなぎ方【解説】直列回路では電流が一本道のため、一方が切れると回路が途切れて全体の電流が流れなくなり、もう一方も消える。並列回路と混同しやすいので注意。【まちがえやすい点】ほかの選択肢（変わらず点灯し続ける／より明るく点灯する）とのちがいをおさえておこう。"},
  {id:"phy224", cat:"物理", sub:"電流と回路", q:"家庭の電気器具を並列につなぐ利点として最も適切なものはどれか。", choices:["全体の抵抗が増えて安全になる","各器具に同じ電圧がかかり、独立して使用できる","電流が分散されて各器具が省エネになる","回路全体の電力消費が減る"], diff:"標準", a:1, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「並列」＝電気の通り道が枝分かれしているつなぎ方【解説】並列回路では各器具に電源と同じ電圧がかかる。そのため定格電圧で動作でき、一方をオフにしても他は動く。家庭の配線が並列なのはこの理由による。【まちがえやすい点】ほかの選択肢（全体の抵抗が増えて安全になる／電流が分散されて各器具が省エネになる）とのちがいをおさえておこう。"},
  {id:"phy225", cat:"物理", sub:"電流と回路", q:"電熱線に流れる電流を2倍にすると、発熱量（同じ時間）はどう変化するか。", choices:["2倍になる","4倍になる","0.5倍になる","変わらない"], diff:"基礎", a:1, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】ジュールの法則より発熱量Q=I²Rtで電流の2乗に比例する。電流が2倍になるとQは2²=4倍になる。「2倍」は電圧を2倍にした場合の変化と混同しやすい。【まちがえやすい点】ほかの選択肢（2倍になる／0.5倍になる）とのちがいをおさえておこう。"},
  {id:"phy226", cat:"物理", sub:"電流と回路", q:"電圧計を使うときの正しい接続方法はどれか。", choices:["測定したい部分に直列につなぐ","測定したい部分に並列につなぐ","回路のどこにつないでも同じ値が得られる","電源に直接つないで使用する"], diff:"標準", a:1, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】電圧計は測定したい区間に並列に接続する。電流計（直列接続）と混同しやすい。電圧計の内部抵抗は非常に大きく、並列につないでも回路への影響が小さい。【まちがえやすい点】ほかの選択肢（測定したい部分に直列につなぐ／回路のどこにつないでも同じ値が得られる）とのちがいをおさえておこう。"},
  {id:"phy227", cat:"物理", sub:"磁界と電流", q:"コイルに流れる電流を大きくすると、そのコイルがつくる磁界の強さはどうなるか。", choices:["弱くなる","変わらない","強くなる","交互に変化する"], diff:"基礎", a:2, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「磁界」＝磁石の力がはたらいている空間【解説】電流が大きいほど磁界は強くなる。また、コイルの巻き数を増やすことでも磁界は強くなる。この原理が電磁石の基本であり、エレベーターや鉄道など多くの機器に利用されている。【まちがえやすい点】ほかの選択肢（弱くなる／変わらない）とのちがいをおさえておこう。"},
  {id:"phy228", cat:"物理", sub:"磁界と電流", q:"磁石のN極とN極を近づけると力はどのようにはたらくか。", choices:["引き合う力がはたらく","反発する力がはたらく","力はほとんどはたらかない","最初は引き合い、接触すると反発する"], diff:"基礎", a:1, e:"【解説】同じ極どうしは反発し（斥力）、異なる極どうし（N極とS極）は引き合う（引力）。この性質は電荷間の力（同符号は斥力、異符号は引力）と対比して覚えるとよい。【まちがえやすい点】ほかの選択肢（引き合う力がはたらく／力はほとんどはたらかない）とのちがいをおさえておこう。"},
  {id:"phy229", cat:"物理", sub:"運動とエネルギー", q:"なめらかな斜面を物体が下るとき、物体のエネルギーはどのように変化するか。", choices:["位置エネルギーが増加し、運動エネルギーが減少する","位置エネルギーが減少し、運動エネルギーが増加する","位置エネルギーと運動エネルギーがともに増加する","どちらのエネルギーも変化しない"], diff:"標準", a:1, e:"【ことばの意味】「位置エネルギー」＝高い所にある物体がもつエネルギー／「運動エネルギー」＝動いている物体がもつエネルギー【解説】摩擦がない場合、力学的エネルギー保存の法則により、高さが下がって位置エネルギーが減少した分、速さが増して運動エネルギーが増加する。総和（力学的エネルギー）は一定に保たれる。【まちがえやすい点】ほかの選択肢（位置エネルギーが増加し、運動エネルギーが減少…／位置エネルギーと運動エネルギーがともに増加す…）とのちがいをおさえておこう。"},
  {id:"phy230", cat:"物理", sub:"運動とエネルギー", q:"水平な床の上で物体を一定の速さで押し続けているとき、手が物体にした仕事と摩擦力がした仕事の大きさの関係はどれか。", choices:["手のした仕事の方が大きい","摩擦力のした仕事の方が大きい","手のした仕事と摩擦力のした仕事の大きさは等しい","物体が動いていれば仕事の大きさは比較できない"], diff:"標準", a:2, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）【解説】一定速度（加速なし）で動く場合、手の力と摩擦力はつり合っており大きさは等しい。移動距離も同じなので仕事の大きさは等しくなる。【まちがえやすい点】ほかの選択肢（手のした仕事の方が大きい／摩擦力のした仕事の方が大きい）とのちがいをおさえておこう。"},
  {id:"phy231", cat:"物理", sub:"仕事とエネルギー", q:"同じ高さに同じ物体を運ぶとき、ゆっくり運んだ場合と速く運んだ場合を比べると、仕事の大きさはどうなるか。", choices:["ゆっくりの方が仕事が小さい","速い方が仕事が大きい","どちらも仕事の大きさは同じ","速度によって仕事の大きさは変わる"], diff:"標準", a:2, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）／「仕事率」＝1秒あたりにする仕事の量。単位はW【解説】仕事の大きさW=Fhは力と移動距離（高さ）によって決まり、速度には関係しない。ただし単位時間あたりの仕事（仕事率）は速いほど大きくなる。仕事と仕事率の違いに注意。【まちがえやすい点】ほかの選択肢（ゆっくりの方が仕事が小さい／速い方が仕事が大きい）とのちがいをおさえておこう。"},
  {id:"phy232", cat:"物理", sub:"光と音", q:"水中から空気中へ光が進むとき、入射角と屈折角の関係はどれか。", choices:["屈折角は入射角より小さくなる","屈折角は入射角より大きくなる","屈折角と入射角は等しくなる","光は屈折せずそのまま直進する"], diff:"標準", a:1, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること／「反射」＝光や音が物にぶつかってはね返ること【解説】光は光速の遅い媒質（水）から速い媒質（空気）へ進むとき、境界面から遠ざかる方向（法線から離れる）に曲がる。そのため屈折角＞入射角となる。入射角が大きくなりすぎると全反射が起きる。【まちがえやすい点】ほかの選択肢（屈折角は入射角より小さくなる／屈折角と入射角は等しくなる）とのちがいをおさえておこう。"},
  {id:"phy233", cat:"物理", sub:"光と音", q:"凸レンズで物体を焦点の内側（レンズと焦点の間）に置いたとき、スクリーンにはどのような像ができるか。", choices:["倒立の実像がスクリーンにできる","正立の実像がスクリーンにできる","スクリーンに像はできない","どこにおいても像はできない"], diff:"標準", a:2, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること／「焦点」＝レンズを通った平行な光が1点に集まる場所【解説】物体が焦点の内側にある場合、屈折した光は集まらず発散する。実像はできず、レンズを通して見ると物体と同じ向きに拡大された虚像（正立虚像）に見える。これが虫眼鏡の原理。【まちがえやすい点】ほかの選択肢（倒立の実像がスクリーンにできる／正立の実像がスクリーンにできる）とのちがいをおさえておこう。"},
  {id:"phy234", cat:"物理", sub:"光と音", q:"弦の振動で高い音を出すにはどのような方法が有効か。", choices:["弦を長くする","弦をゆるめる","弦を短く強く張る","弦を太くする"], diff:"基礎", a:2, e:"【ことばの意味】「振動数」＝1秒間に何回ふるえるかを表す数。多いほど高い音【解説】弦の振動数は、短いほど・強く張るほど・細いほど高くなる。振動数が高いほど高音。弦を長くする・ゆるめる・太くすると振動数が下がり低音になる。ギターのチューニングや押さえる位置がこの原理を利用している。【まちがえやすい点】ほかの選択肢（弦を長くする／弦をゆるめる）とのちがいをおさえておこう。"},
  {id:"phy235", cat:"物理", sub:"光と音", q:"音の反射を利用して海底の深さを測る装置で、発信から受信まで0.4秒かかり水中の音速を1500m/sとすると、海底までの深さはどれくらいか。", choices:["600m","300m","150m","60m"], diff:"基礎", a:1, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること【解説】音が往復するので片道の時間は0.4÷2＝0.2秒。深さ＝1500×0.2＝300m。往復を忘れて0.4秒で計算すると600mと誤ってしまう。これがよくある計算ミスのパターン。【まちがえやすい点】ほかの選択肢（600m／150m）とのちがいをおさえておこう。"},
  {id:"phy236", cat:"物理", sub:"浮力と水圧", q:"水中に沈んだ物体にはたらく浮力の大きさはどのように求めるか。", choices:["物体の質量と重力加速度の積","物体が押しのけた水の重さ","物体の体積と物体の密度の積","水の深さと水圧の積"], diff:"標準", a:1, e:"【ことばの意味】「浮力」＝液体や気体の中で物体を上向きに押す力／「水圧」＝水が物体を押す力。深いほど大きい【解説】アルキメデスの原理により、浮力＝押しのけた流体の重さ。物体の密度や質量とは直接関係なく、水中にある体積で決まる。同じ体積なら、深さが変わっても浮力は変わらない（水圧は深さで変わるが合力は同じ）。【まちがえやすい点】ほかの選択肢（物体の質量と重力加速度の積／物体の体積と物体の密度の積）とのちがいをおさえておこう。"},
  {id:"phy237", cat:"物理", sub:"エネルギーの利用", q:"発電所で発生した電力を高電圧で送電する主な理由はどれか。", choices:["高電圧の方が発電効率が上がるから","高電圧にすると電流を小さくでき","高電圧の方が変圧器の効率が良くなるから","高電圧の方が電線を細くできるから"], diff:"基礎", a:1, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】送電線での電力損失はP=I²R（Rは抵抗）に比例する。同じ電力を送る場合、電圧を高くすれば電流Iを小さくでき、損失I²Rが大幅に減る。変圧器で電圧を上げ下げできる交流が送電に使われる理由でもある。【まちがえやすい点】ほかの選択肢（高電圧の方が発電効率が上がるから／高電圧の方が変圧器の効率が良くなるから）とのちがいをおさえておこう。"},
  {id:"phy238", cat:"物理", sub:"エネルギーの利用", q:"原子力発電でエネルギーが変換される順序として正しいものはどれか。", choices:["核エネルギー→電気エネルギー→熱エネルギー→運動エネルギー","核エネルギー→熱エネルギー→運動エネルギー→電気エネルギー","核エネルギー→運動エネルギー→熱エネルギー→電気エネルギー","核エネルギー→化学エネルギー→熱エネルギー→電気エネルギー"], diff:"基礎", a:1, e:"【ことばの意味】「運動エネルギー」＝動いている物体がもつエネルギー【解説】核分裂で発生した熱で水を沸騰させ（熱エネルギー）、蒸気でタービンを回し（運動エネルギー）、発電機で電気をつくる（電気エネルギー）。火力発電も燃料の化学エネルギーが熱→運動→電気と変換される点は同じ。【まちがえやすい点】ほかの選択肢（核エネルギー→電気エネルギー→熱エネルギー→…／核エネルギー→運動エネルギー→熱エネルギー→…）とのちがいをおさえておこう。"},
  {id:"phy239", cat:"物理", sub:"力の働き", q:"ばね定数20N/mのばねを30cm伸ばすのに必要な力は何Nか。", choices:["0.6N","6N","60N","600N"], diff:"標準", a:1, e:"【解説】フックの法則F=kxより、F=20N/m×0.30m=6N。単位に注意。30cmを0.30mに換算する必要がある。30cmのままでは計算できない点を見落としやすい。【まちがえやすい点】ほかの選択肢（0.6N／60N）とのちがいをおさえておこう。"},
  {id:"phy240", cat:"物理", sub:"力の働き", q:"質量500gの物体にはたらく重力の大きさはおよそ何Nか（重力加速度を10m/s²とする）。", choices:["0.5N","5N","50N","500N"], diff:"標準", a:1, e:"【ことばの意味】「重力」＝地球が物体を引っぱる力／「質量」＝物体そのものの量（場所が変わっても変わらない）【解説】重力F=mg=0.5kg×10m/s²=5N。質量（kg）を重力（N）に変換するには「×10」すればよい（ただし概算）。500gをkgに換算（÷1000）するのを忘れると間違える。【まちがえやすい点】ほかの選択肢（0.5N／50N）とのちがいをおさえておこう。"},
  {id:"phy241", cat:"物理", sub:"熱の伝わり方", q:"真空中でも熱が伝わる現象はどれか。", choices:["伝導","対流","放射（輻射）","蒸発"], diff:"基礎", a:2, e:"【ことばの意味】「伝導」＝物を伝わって熱が移動すること／「対流」＝あたたまった液体や気体が動いて熱を運ぶこと【解説】放射（輻射）は電磁波によって熱が伝わる現象で、媒質がない真空中でも伝わる。太陽の熱が宇宙空間を越えて地球に届くのが代表例。伝導と対流は物質を通じて伝わるため真空中では起きない。【まちがえやすい点】ほかの選択肢（伝導／対流）とのちがいをおさえておこう。"},
  {id:"phy242", cat:"物理", sub:"電流と回路", q:"抵抗10Ωと20Ωを並列につないだときの合成抵抗はおよそ何Ωか。", choices:["30Ω","15Ω","約6.7Ω","5Ω"], diff:"標準", a:2, e:"【ことばの意味】「抵抗」＝電流の流れにくさ（単位Ω）／「直列」＝電気の通り道が1本道のつなぎ方【解説】並列の合成抵抗は1/R=1/10+1/20=3/20より、R=20/3≒6.7Ω。直列の場合は単純に足すだけだが、並列では各抵抗の逆数を足してから逆数をとる。また並列接続では合成抵抗は各抵抗より小さくなる点も重要。【まちがえやすい点】ほかの選択肢（30Ω／15Ω）とのちがいをおさえておこう。"},
  {id:"phy243", cat:"物理", sub:"電流と回路", q:"家庭に供給される交流100Vで1000Wのドライヤーを使うとき、流れる電流はおよそ何Aか。", choices:["1A","10A","100A","0.1A"], diff:"標準", a:1, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】電力P＝電圧V×電流I より、I＝P/V＝1000/100＝10A。家庭のブレーカーが20Aであれば、このドライヤー1台で半分の容量を使うことになる。消費電力・電圧・電流の関係を日常生活と結びつけて理解しよう。【まちがえやすい点】ほかの選択肢（1A／100A）とのちがいをおさえておこう。"},
  {id:"phy244", cat:"物理", sub:"磁界と電流", q:"発電機のコイルを速く回転させると、発生する電圧はどう変化するか。", choices:["電圧は小さくなる","電圧は変わらない","電圧は大きくなる","電圧は交流から直流に変わる"], diff:"基礎", a:2, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電力」＝1秒あたりに使う電気エネルギーの量（単位W）【解説】電磁誘導では、コイルを速く回すほど磁束の変化が速くなり、誘導起電力（電圧）が大きくなる。また巻き数を増やしたり、磁石を強くしたりしても電圧が上がる。これが発電機の基本原理。【まちがえやすい点】ほかの選択肢（電圧は小さくなる／電圧は変わらない）とのちがいをおさえておこう。"},
  {id:"phy245", cat:"物理", sub:"仕事とエネルギー", q:"同じ物体を同じ高さの机の上に運ぶとき、まっすぐ持ち上げた場合とスロープを使った場合で、必要な仕事の大きさはどうなるか（摩擦なし）。", choices:["スロープを使う方が仕事が小さい","まっすぐ持ち上げる方が仕事が小さい","どちらも必要な仕事の大きさは等しい","スロープの角度によって異なる"], diff:"標準", a:2, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）【解説】仕事の原理より、道具を使っても使わなくても、同じ高さに同じ物体を持ち上げる仕事は等しい（W＝mgh）。スロープを使うと力は小さくて済むが、動かす距離が長くなるため仕事の大きさは同じになる。【まちがえやすい点】ほかの選択肢（スロープを使う方が仕事が小さい／まっすぐ持ち上げる方が仕事が小さい）とのちがいをおさえておこう。"},
  {id:"phy246", cat:"物理", sub:"電流と回路", q:"電力量1kWhとはどのような量か。", choices:["1kWの電力を1分間使ったときのエネルギー","1kWの電力を1時間使ったときのエネルギー","1Wの電力を1秒間使ったときのエネルギー","1000Wの電力を1日使ったときのエネルギー"], diff:"標準", a:1, e:"【ことばの意味】「電力」＝1秒あたりに使う電気エネルギーの量（単位W）／「電力量」＝使った電気エネルギーの合計（電力×時間）【解説】1kWh＝1000W×3600s＝3.6×10⁶J。家庭の電気料金はkWhで計算される。電力×時間という計算は日常生活と直結しているので理解が重要。【まちがえやすい点】ほかの選択肢（1kWの電力を1分間使ったときのエネルギー／1Wの電力を1秒間使ったときのエネルギー）とのちがいをおさえておこう。"},
  {id:"phy247", cat:"物理", sub:"力の働き", q:"空気抵抗を無視できる場合、異なる質量の物体を同じ高さから同時に落とすとどうなるか。", choices:["質量が大きい方が速く落ちる","質量が小さい方が速く落ちる","どちらも同じ速さで落ちる","素材によって落ちる速さが変わる"], diff:"基礎", a:2, e:"【ことばの意味】「抵抗」＝電流の流れにくさ（単位Ω）／「浮力」＝液体や気体の中で物体を上向きに押す力【解説】空気抵抗を無視すると、重力加速度はすべての物体で同じ（約9.8m/s²）なので質量や材質に関わらず同じ速さで落ちる。ガリレオが実験で示した有名な事実。水中の場合は浮力の影響で異なる。【まちがえやすい点】ほかの選択肢（質量が大きい方が速く落ちる／質量が小さい方が速く落ちる）とのちがいをおさえておこう。"},
  {id:"phy248", cat:"物理", sub:"エネルギーの利用", q:"エネルギーの変換効率について正しい説明はどれか。", choices:["エネルギーの総量は変換のたびに増加する","変換ごとにエネルギーの一部は熱などとして散逸し利用効率が下がる","電気エネルギーを熱に変える変換の効率は理論上0%に近い","あらゆるエネルギー変換で効率が100%になる場合がある"], diff:"基礎", a:1, e:"【解説】エネルギーの総量は保存されるが、変換のたびに熱などの「使いにくいエネルギー」に変わっていく。電熱器や電球のように電気→熱への変換は高効率だが、熱→電気は低効率。効率100%の変換は現実には存在しない。【まちがえやすい点】ほかの選択肢（エネルギーの総量は変換のたびに増加する／電気エネルギーを熱に変える変換の効率は理論上…）とのちがいをおさえておこう。"},
  {id:"phy249", cat:"物理", sub:"力の働き", q:"てこを使って20Nの石を持ち上げるとき、力点に加える力を5Nにするには、支点から力点の距離を支点から作用点の距離の何倍にすればよいか。", choices:["2倍","4倍","5倍","10倍"], diff:"標準", a:1, e:"【ことばの意味】「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）／「仕事」＝力×動かした距離。単位はJ（ジュール）【解説】てこの原理：力×力点の距離＝重さ×作用点の距離。5×d=20×l より d=4l。力点を作用点の4倍の距離にする。なお道具を使っても仕事の量は変わらない（仕事の原理）ので、力が小さい分だけ動かす距離が長くなる。【まちがえやすい点】ほかの選択肢（2倍／5倍）とのちがいをおさえておこう。"},
  {id:"phy250", cat:"物理", sub:"運動とエネルギー", q:"水平方向に投げ出した物体（水平投射）の運動の説明として正しいものはどれか。", choices:["水平方向も鉛直方向も加速度がある","水平方向は等速直線運動","水平方向は減速し、鉛直方向は加速する","どちらの方向も等速直線運動になる"], diff:"基礎", a:1, e:"【ことばの意味】「抵抗」＝電流の流れにくさ（単位Ω）／「重力」＝地球が物体を引っぱる力【解説】空気抵抗を無視すると、水平方向には力がはたらかないので等速直線運動、鉛直方向には重力のみがはたらき自由落下と同じ加速度運動になる。2方向の運動を独立して考えるのが重要なポイント。【まちがえやすい点】ほかの選択肢（水平方向も鉛直方向も加速度がある／水平方向は減速し、鉛直方向は加速する）とのちがいをおさえておこう。"},
  {id:"che179", cat:"化学", sub:"物質のすがた", q:"砂糖水を蒸発皿で強く加熱したとき、残った物質について正しいものはどれか。", choices:["元の砂糖がそのまま残る","炭や焦げた物質が残り、砂糖には戻らない","水だけが蒸発し砂糖が結晶として残る","何も残らず完全に気体になる"], diff:"標準", a:1, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）／「分解」＝1つの物質が2つ以上の物質に分かれること【解説】砂糖（有機物）を強く加熱すると熱分解・炭化が起こり炭（炭素）として残る。溶媒（水）だけを蒸発させたい場合は緩やかに加熱する必要がある。食塩水の場合は蒸発させると食塩が結晶として残る点と対比して理解しよう。【まちがえやすい点】ほかの選択肢（元の砂糖がそのまま残る／水だけが蒸発し砂糖が結晶として残る）とのちがいをおさえておこう。"},
  {id:"che180", cat:"化学", sub:"物質のすがた", q:"物質をろ過で分離できるのはどのような混合物か。", choices:["液体どうしの混合物","溶質が完全に溶けた水溶液","液体に溶けていない固体が混ざった混合物","気体の混合物"], diff:"基礎", a:2, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）／「再結晶」＝温度を下げて結晶を取り出すこと【解説】ろ過は液体に溶けない固体（泥など）を分離する方法。完全に溶けた溶液（砂糖水・食塩水）はろ過では分離できない。それらを分離するには蒸発・再結晶・蒸留を使う。【まちがえやすい点】ほかの選択肢（液体どうしの混合物／溶質が完全に溶けた水溶液）とのちがいをおさえておこう。"},
  {id:"che181", cat:"化学", sub:"化学変化と質量", q:"炭酸水素ナトリウムを加熱すると、どのような物質ができるか。", choices:["炭酸ナトリウムと水と二酸化炭素","水素と酸素","塩素と水","酸素だけ"], diff:"標準", a:0, e:"【何が起きる？】炭酸水素ナトリウム（重そう）を加熱すると、3つの物質に分かれます。これを熱分解といいます。／【できるもの】①炭酸ナトリウム（試験管に残る白い固体）②水（試験管の口のあたりにつく液体）③二酸化炭素（気体として出ていく）。／【確かめ方】出てきた気体を石灰水に通すと白くにごる→二酸化炭素。試験管の口についた液体を塩化コバルト紙につけると青→赤に変わる→水。／【身近な例】ホットケーキがふくらむのは、重そうが加熱されて二酸化炭素を出すためです。"},
  {id:"che182", cat:"化学", sub:"化学変化と質量", q:"銅0.8gを完全に酸化させると酸化銅が1.0gできた。このとき結合した酸素は何gか。", choices:["1.0g","0.8g","0.2g","0.4g"], diff:"標準", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「酸化」＝物質が酸素と結びつくこと【解説】質量保存の法則より、結合した酸素＝1.0−0.8＝0.2g。銅と酸素は質量比4:1で結合する（銅0.8g：酸素0.2g＝4:1）。この比率は問題によく出るので確認しておこう。【まちがえやすい点】ほかの選択肢（1.0g／0.8g）とのちがいをおさえておこう。"},
  {id:"che183", cat:"化学", sub:"化学変化と質量", q:"鉄と硫黄の混合物を加熱して生じた硫化鉄は、鉄の単体とはたらきが異なる。その理由として最も適切なものはどれか。", choices:["鉄と硫黄が単に混ざり合っているから","化学変化によって新しい性質をもつ物質が生成した","硫黄が鉄の性質を隠しているから","温度が下がって鉄の性質が変化したから"], diff:"標準", a:1, e:"鉄と硫黄を加熱すると化学変化が起き、もとの物質とはまったく異なる性質の硫化鉄（FeS）が生成する。混合物は各成分の性質を保つが、化合物は新しい性質をもつ。磁石に引きつけられるか・塩酸を加えるとどうなるかで鉄とFeSを区別できる。"},
  {id:"che184", cat:"化学", sub:"酸・アルカリと中和", q:"塩酸に水酸化ナトリウム水溶液を加えていくとき、pHの変化について正しいものはどれか。", choices:["pHは最初から7に近く、変化は小さい","pHは7より大きい値から始まり、加えるにつれて小さくなる","pHは7より小さい値から始まり、中和点で7になり","pHは加えた量に関係なく一定になる"], diff:"標準", a:2, e:"塩酸は酸性（pH＜7）から始まり、NaOHを加えると徐々に中和されpHが上昇し、中和点でpH＝7になる。さらに加えると過剰のOH⁻でアルカリ性（pH＞7）になる。BTB溶液の色変化（黄→緑→青）と組み合わせて理解しよう。"},
  {id:"che185", cat:"化学", sub:"酸・アルカリと中和", q:"中和反応について正しいものはどれか。", choices:["中和が起きると溶液は中性になる","酸とアルカリが反応して塩と水ができる反応である","中和には熱の発生をともなわない","中和反応が起きると気体が発生する"], diff:"基礎", a:1, e:"中和とは酸のH⁺とアルカリのOH⁻が結合して水になり、塩（えん）が生成する反応。完全中和しても中性（pH7）にならないことがある（塩の種類による）。また中和熱は発生する。気体発生は酸と炭酸塩などの反応であって中和とは別。"},
  {id:"che186", cat:"化学", sub:"水溶液とイオン", q:"塩化ナトリウム水溶液に電流を流したとき、陽極と陰極でそれぞれ発生する物質の組み合わせとして正しいものはどれか。", choices:["陽極：水素、陰極：塩素","陽極：塩素、陰極：水素","陽極：酸素、陰極：ナトリウム","陽極：ナトリウム、陰極：塩素"], diff:"標準", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】塩化ナトリウム水溶液の電気分解では、陽極でCl⁻が酸化されてCl₂（塩素）、陰極でH⁺が還元されてH₂（水素）が発生する。純水の電気分解（陽極O₂、陰極H₂）と混同しないこと。【まちがえやすい点】ほかの選択肢（陽極：水素、陰極：塩素／陽極：酸素、陰極：ナトリウム）とのちがいをおさえておこう。"},
  {id:"che187", cat:"化学", sub:"水溶液とイオン", q:"電解質と非電解質を見分ける実験として適切なものはどれか。", choices:["水溶液の色を調べる","水溶液に電流が流れるかどうか調べる","水溶液を蒸発させて固体の残り方を調べる","水溶液を冷却して結晶が出るかどうか調べる"], diff:"基礎", a:1, e:"【ことばの意味】「電解質」＝水にとかすと電気を通す物質／「非電解質」＝水にとかしても電気を通さない物質【解説】電解質はイオンに電離するため水溶液が電気を通す。非電解質（砂糖・エタノールなど）はイオンに電離しないため電気を通さない。この違いは電球や豆電球を使った簡単な回路実験で確認できる。【まちがえやすい点】ほかの選択肢（水溶液の色を調べる／水溶液を蒸発させて固体の残り方を調べる）とのちがいをおさえておこう。"},
  {id:"che188", cat:"化学", sub:"化学反応式", q:"マグネシウムが酸素と結びつく反応の化学反応式として正しいものはどれか。", choices:["Mg＋O₂→MgO₂","2Mg＋O₂→2MgO","Mg₂＋O→Mg₂O","Mg＋O→MgO"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと【解説】マグネシウムの燃焼：2Mg＋O₂→2MgO。原子の種類と数が左右で等しい（係数を使ってバランスをとる）ことが重要。MgOは白色の酸化マグネシウムで、マグネシウムが白く激しく燃える反応として有名。【まちがえやすい点】ほかの選択肢（Mg＋O₂→MgO₂／Mg₂＋O→Mg₂O）とのちがいをおさえておこう。"},
  {id:"che189", cat:"化学", sub:"身近な化学変化", q:"食品の「酸化防止剤」が利用する化学的なはたらきとして最も適切なものはどれか。", choices:["食品を乾燥させて細菌の繁殖を防ぐ","食品の酸化（劣化）を遅らせる","食品中の水分と反応して保湿する","食品の色素を安定させて変色を防ぐ"], diff:"標準", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「還元」＝物質が酸素をうばわれること【解説】酸化防止剤（ビタミンCなど）は自身が酸化されやすい性質をもち、食品の成分が酸化する前に先に反応する（還元剤としてはたらく）。お菓子の袋に封入された脱酸素剤（鉄の酸化を利用）との違いも押さえよう。【まちがえやすい点】ほかの選択肢（食品を乾燥させて細菌の繁殖を防ぐ／食品中の水分と反応して保湿する）とのちがいをおさえておこう。"},
  {id:"che190", cat:"化学", sub:"物質のすがた", q:"ろうそくが燃えるとき起きている現象の説明として正しいものはどれか。", choices:["固体のろうが直接燃えている","ろうが熱で液体になり","ろうの酸化は起きていない","ろうの成分は変化せず熱だけが発生する"], diff:"基礎", a:1, e:"【ことばの意味】「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと／「状態変化」＝固体・液体・気体と姿が変わること。物質は変わらない【解説】ろうは固体→液体→気体（蒸気）と状態変化し、気体になったものが空気中の酸素と反応して燃える。固体が直接燃えているのではない点が重要。燃焼生成物はCO₂とH₂Oで、これを確かめる実験も頻出。【まちがえやすい点】ほかの選択肢（固体のろうが直接燃えている／ろうの酸化は起きていない）とのちがいをおさえておこう。"},
  {id:"che191", cat:"化学", sub:"気体の性質", q:"二酸化炭素を石灰水に通すと白くにごる反応の生成物として正しいものはどれか。", choices:["炭酸水","炭酸カルシウム","水酸化カルシウム","塩化カルシウム"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】CO₂＋Ca(OH)₂→CaCO₃↓＋H₂O。生成した炭酸カルシウム（CaCO₃）が水に溶けにくい白色沈殿として現れる。さらにCO₂を過剰に通すと炭酸水素カルシウムとなり再び溶けてにごりが消える。【まちがえやすい点】ほかの選択肢（炭酸水／水酸化カルシウム）とのちがいをおさえておこう。"},
  {id:"che192", cat:"化学", sub:"化学変化と質量", q:"質量保存の法則が成り立つ理由として最も適切なものはどれか。", choices:["化学変化では物質の温度が変わらないから","化学変化の前後で原子の種類と数が変わらないから","化学変化では新しい元素が生成するから","化学変化では物質の密度が保存されるから"], diff:"標準", a:1, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「化学変化」＝物質そのものが別の物質に変わること【解説】化学変化では原子の結びつき方が変わるだけで、原子の種類と数は変化しない。原子の質量は変わらないので、物質全体の質量も変化しない。これが質量保存の法則の本質的な理由。【まちがえやすい点】ほかの選択肢（化学変化では物質の温度が変わらないから／化学変化では新しい元素が生成するから）とのちがいをおさえておこう。"},
  {id:"che193", cat:"化学", sub:"物質のすがた", q:"沸点の異なる液体の混合物を分離する方法として最も適切なものはどれか。", choices:["ろ過","蒸留","再結晶","クロマトグラフィー"], diff:"標準", a:1, e:"【ことばの意味】「沸点」＝液体がふっとうして気体になる温度／「蒸留」＝沸点の違いを利用して液体を分ける方法【解説】蒸留は混合液を加熱し、沸点の低い成分から順に気体として取り出し冷却・液化することで分離する。石油の精製（ナフサ・灯油・重油などに分離）や、アルコール飲料の製造などに利用されている。【まちがえやすい点】ほかの選択肢（ろ過／再結晶）とのちがいをおさえておこう。"},
  {id:"che194", cat:"化学", sub:"酸化と還元", q:"酸化銅と炭素を混ぜて加熱したとき起きる反応について正しいものはどれか。", choices:["炭素が酸化され、酸化銅は変化しない","酸化銅が還元されて銅が生じ","どちらも酸化される","どちらも還元される"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「還元」＝物質が酸素をうばわれること【解説】2CuO＋C→2Cu＋CO₂。酸化銅（CuO）は酸素を奪われて銅に戻る（還元）。炭素は酸素と結びついてCO₂になる（酸化）。酸化と還元は同時に起きる（酸化還元反応）。炭素が還元剤としてはたらく例として重要。【まちがえやすい点】ほかの選択肢（炭素が酸化され、酸化銅は変化しない／どちらも酸化される）とのちがいをおさえておこう。"},
  {id:"che195", cat:"化学", sub:"水溶液とイオン", q:"亜鉛板と銅板を希硫酸に入れて導線でつなぐと電流が流れる。このとき電子はどの向きに流れるか。", choices:["銅から亜鉛へ（導線を通じて）","亜鉛から銅へ（導線を通じて）","電子は流れず、イオンのみが移動する","亜鉛と銅の両方から同時に流れ出す"], diff:"基礎", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの【解説】イオン化傾向：亜鉛＞銅 なので、亜鉛が溶け出してZn→Zn²⁺＋2e⁻と電子を放出。電子は亜鉛（負極）から銅（正極）へ導線を通じて流れる。電流の向きは電子の流れと逆（銅→亜鉛）になる点も注意。【まちがえやすい点】ほかの選択肢（銅から亜鉛へ（導線を通じて）／電子は流れず、イオンのみが移動する）とのちがいをおさえておこう。"},
  {id:"che196", cat:"化学", sub:"化学変化と質量", q:"マグネシウムを空気中で燃焼させたとき、生成した酸化マグネシウムの質量が元のマグネシウムより大きくなる。その理由として正しいものはどれか。", choices:["マグネシウムが膨張するから","空気中の酸素がマグネシウムと結合したから","熱によって質量が増えるから","燃焼によって新しい元素が生まれるから"], diff:"標準", a:1, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「酸化」＝物質が酸素と結びつくこと【解説】空気中のO₂がMgと結合してMgOになるため、酸素分が加わった質量が生成物の質量になる。2Mg(48g)＋O₂(32g)→2MgO(80g)。「燃やすと軽くなる」（有機物の燃焼とは逆）という点で混同しやすい。【まちがえやすい点】ほかの選択肢（マグネシウムが膨張するから／熱によって質量が増えるから）とのちがいをおさえておこう。"},
  {id:"che197", cat:"化学", sub:"気体の性質", q:"アンモニアの噴水実験で、フラスコ内に水が急激に入る理由はどれか。", choices:["アンモニアが水に溶けにくく、水を押し込む力が生まれるから","アンモニアが水に非常に溶けやすく、フラスコ内の気圧が下がるから","アンモニアが空気より重く、水を押し上げるから","水が蒸発してアンモニアと混合するから"], diff:"基礎", a:1, e:"【解説】アンモニアは水に非常に溶けやすい（700倍以上）。フラスコ内のNH₃が水に溶けて気体が急減するため気圧が大気圧より低くなり、外部から水が勢いよく入る。この噴水実験は気体の水溶性の確認に使われる。【まちがえやすい点】ほかの選択肢（アンモニアが水に溶けにくく、水を押し込む力が…／アンモニアが空気より重く、水を押し上げるから）とのちがいをおさえておこう。"},
  {id:"che198", cat:"化学", sub:"物質のすがた", q:"融点と沸点について正しいものはどれか。", choices:["融点は気体が液体になる温度である","純粋な物質の融点・沸点は物質によって決まっており","混合物も純物質と同じく一定の融点をもつ","融点と沸点は同じ温度になることがある"], diff:"基礎", a:1, e:"【ことばの意味】「状態変化」＝固体・液体・気体と姿が変わること。物質は変わらない／「融点」＝固体がとけて液体になる温度【解説】融点・沸点は物質固有の値（物性値）で、物質の同定に利用できる。混合物では融点・沸点が純物質と異なり、一定温度での状態変化ではなくなる（状態変化が幅をもつ）。これを利用して物質の純度を確認できる。【まちがえやすい点】ほかの選択肢（融点は気体が液体になる温度である／混合物も純物質と同じく一定の融点をもつ）とのちがいをおさえておこう。"},
  {id:"che199", cat:"化学", sub:"化学変化と質量", q:"水素と酸素が体積比2:1で反応して水ができる。水素4Lと酸素4Lを混ぜて反応させると残る気体は何Lか。", choices:["水素が2L残る","酸素が2L残る","どちらも残らない","水素と酸素が1Lずつ残る"], diff:"基礎", a:1, e:"【解説】2H₂＋O₂→2H₂Oより、H₂:O₂＝2:1で反応する。H₂が4Lなら必要なO₂は2L。O₂は4Lあるので2L余る。残るのは酸素2L。問題を解く際は「どちらが過剰か」を必ず確認する。【まちがえやすい点】ほかの選択肢（水素が2L残る／どちらも残らない）とのちがいをおさえておこう。"},
  {id:"che200", cat:"化学", sub:"酸・アルカリと中和", q:"リトマス紙の変色について正しいものはどれか。", choices:["酸性の溶液は青色リトマスを赤に変え、赤色リトマスは変化しない","アルカリ性の溶液は赤色リトマスを青に変え、青色リトマスは変化しない","酸性もアルカリ性も両方のリトマスの色を変える","中性の溶液は赤色リトマスを青に変える"], diff:"基礎", a:0, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「アルカリ性」＝pHが7より大きい性質。赤リトマスを青にする【解説】酸性→青いリトマスが赤に変わる（赤いリトマスは変化しない）。アルカリ性→赤いリトマスが青に変わる（青いリトマスは変化しない）。中性ではどちらも変化しない。覚え方：「酸で青→赤」「アルカリで赤→青」。【まちがえやすい点】ほかの選択肢（アルカリ性の溶液は赤色リトマスを青に変え、青…／酸性もアルカリ性も両方のリトマスの色を変える）とのちがいをおさえておこう。"},
  {id:"che201", cat:"化学", sub:"物質のすがた", q:"水100gに食塩40gを溶かした水溶液の質量パーセント濃度はおよそ何%か。", choices:["40%","28.6%","20%","66.7%"], diff:"標準", a:1, e:"質量パーセント濃度＝溶質/(溶質＋溶媒)×100＝40/(40＋100)×100＝28.6%。「溶媒100gに対して40g溶かす」のと「100gの水溶液に40g溶けている」の区別が重要。前者は28.6%、後者は40%になり混同しやすい。"},
  {id:"che202", cat:"化学", sub:"気体の性質", q:"水素の性質として正しいものはどれか。", choices:["水に非常に溶けやすく、水上置換では集められない","空気より密度が大きく、下方置換で集める","無色・無臭で、空気より非常に軽い","燃焼すると二酸化炭素と水ができる"], diff:"基礎", a:2, e:"【ことばの意味】「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと【解説】水素は最も軽い気体（空気の約1/14）で無色・無臭・可燃性。水には溶けにくいので水上置換で集められる。燃焼すると水ができる（2H₂＋O₂→2H₂O）。CO₂を生成するのは有機物の燃焼。【まちがえやすい点】ほかの選択肢（水に非常に溶けやすく、水上置換では集められな…／空気より密度が大きく、下方置換で集める）とのちがいをおさえておこう。"},
  {id:"che203", cat:"化学", sub:"水溶液とイオン", q:"水溶液に電気を通す物質（電解質）として正しいものはどれか。", choices:["砂糖（スクロース）","エタノール","塩化ナトリウム","グルコース"], diff:"基礎", a:2, e:"【ことばの意味】「電解質」＝水にとかすと電気を通す物質／「非電解質」＝水にとかしても電気を通さない物質【解説】塩化ナトリウムは水中でNa⁺とCl⁻に電離するため電解質。砂糖・エタノール・グルコースはイオンに電離しない非電解質。「有機物は非電解質が多い」という傾向はあるが例外もある（酢酸など）ため、原理の理解が重要。【まちがえやすい点】ほかの選択肢（砂糖（スクロース）／エタノール）とのちがいをおさえておこう。"},
  {id:"che204", cat:"化学", sub:"化学変化と質量", q:"密閉容器で炭酸水素ナトリウムを加熱した場合と、開放容器で加熱した場合で、反応前後の質量の変化はどう異なるか。", choices:["密閉容器では質量が変化しないが、開放容器では発生した気体が逃げて質量が減る","密閉・開放ともに質量は変化しない","密閉では質量が増えるが、開放では変化しない","密閉・開放ともに質量は減少する"], diff:"標準", a:0, e:"【ことばの意味】「質量保存の法則」＝化学変化の前と後で、全体の重さは変わらないという法則。／【なぜ差が出る？】密閉容器では、発生した気体（二酸化炭素など）も容器の中に閉じこめられたままなので、全体の質量は変化しません。開放容器では発生した気体が空気中に逃げてしまうため、測定される質量が見かけ上減ってしまいます。／【まちがえやすい点】質量保存の法則自体はどちらの場合も成り立っています。「逃げた気体の分だけ軽く見える」という点に注意しましょう。"},
  {id:"che205", cat:"化学", sub:"物質のすがた", q:"物質を加熱しても温度が一定のまま変化しない場合、何が起きているか。", choices:["物質の内部エネルギーが増えていない","物質の状態変化（融解や沸騰）が起きている","熱が加わっていない","化学変化が起きている"], diff:"基礎", a:1, e:"【ことばの意味】「状態変化」＝固体・液体・気体と姿が変わること。物質は変わらない【解説】純粋な物質が融解・沸騰している間は、加えた熱エネルギーが状態変化のためのエネルギーとして使われるため温度が一定になる。温度-時間グラフの「平坦な部分」がこれにあたる。混合物では温度が下がらず変化する。【まちがえやすい点】ほかの選択肢（物質の内部エネルギーが増えていない／熱が加わっていない）とのちがいをおさえておこう。"},
  {id:"che206", cat:"化学", sub:"化学変化と質量", q:"炭酸カルシウムと塩酸を反応させたときに発生する気体として正しいものはどれか。", choices:["水素","二酸化炭素","酸素","アンモニア"], diff:"基礎", a:1, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】CaCO₃＋2HCl→CaCl₂＋H₂O＋CO₂。石灰石（貝殻・大理石も同成分）に塩酸を加えるとCO₂が発生する。この反応は地形（鍾乳洞の形成）とも関連する。金属と塩酸でH₂が発生する反応と混同しないこと。【まちがえやすい点】ほかの選択肢（水素／酸素）とのちがいをおさえておこう。"},
  {id:"che207", cat:"化学", sub:"酸化と還元", q:"鉄が空気中でさびる現象について正しいものはどれか。", choices:["鉄が水素と反応してさびになる","鉄が酸素と反応してさびになる","さびは鉄の密度が変化した状態である","さびは化学変化ではなく物理変化である"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと【解説】鉄のさびは酸化鉄（Fe₂O₃・水和物）で、鉄が空気中の酸素（と水分）と反応して生じる。酸化反応（ゆっくりとした燃焼と同種）。水分があると腐食が促進される。アルミニウムも酸化するが、表面の酸化膜が保護層になる点が異なる。【まちがえやすい点】ほかの選択肢（鉄が水素と反応してさびになる／さびは鉄の密度が変化した状態である）とのちがいをおさえておこう。"},
  {id:"che208", cat:"化学", sub:"身近な化学変化", q:"携帯カイロが発熱する仕組みとして正しいものはどれか。", choices:["炭素の燃焼によって熱を発生させている","鉄粉が酸化（さびる）することで熱を発生させている","塩化カルシウムが水を吸収して発熱している","電気エネルギーを熱に変換している"], diff:"標準", a:1, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）／「酸化」＝物質が酸素と結びつくこと【解説】鉄粉の酸化反応（4Fe＋3O₂→2Fe₂O₃）は発熱反応。食塩水・活性炭・おがくずなどが触媒・吸水材として機能し、反応速度を調節している。発熱反応（カイロ・燃焼）と吸熱反応（冷却パック・光合成）の対比も重要。【まちがえやすい点】ほかの選択肢（炭素の燃焼によって熱を発生させている／塩化カルシウムが水を吸収して発熱している）とのちがいをおさえておこう。"},
  {id:"che209", cat:"化学", sub:"化学変化と質量", q:"マグネシウム3gと酸素2gが完全に反応すると何gの酸化マグネシウムが生成するか。", choices:["1g","3g","5g","6g"], diff:"基礎", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「酸化」＝物質が酸素と結びつくこと【解説】2Mg（48g）＋O₂（32g）→2MgO（80g）より、Mg:O₂＝3:2の質量比で反応する。Mg3gに対しO₂は2g反応するので、3＋2＝5gのMgOができる。まず反応比を確認してから計算する。【まちがえやすい点】ほかの選択肢（1g／3g）とのちがいをおさえておこう。"},
  {id:"che210", cat:"化学", sub:"物質のすがた", q:"水の電気分解で発生する水素と酸素の体積比として正しいものはどれか。", choices:["水素:酸素＝1:1","水素:酸素＝2:1","水素:酸素＝1:2","水素:酸素＝3:1"], diff:"基礎", a:1, e:"2H₂O→2H₂＋O₂。水素2mol・酸素1molが生じるので体積比H₂:O₂＝2:1。陰極側に水素（2倍量）、陽極側に酸素（1倍量）が発生する。電圧が低いと反応が起きにくく、水に少量のNaOHや希硫酸を加えて実験する。"},
  {id:"che212", cat:"化学", sub:"気体の性質", q:"酸素の収集方法として水上置換が適している主な理由はどれか。", choices:["酸素は水よりも密度が大きいから","酸素は水に溶けにくく、純粋に集めやすい","酸素は空気より非常に軽いから","酸素は水と化合しやすいから"], diff:"基礎", a:1, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】水上置換は水に溶けにくい気体を純粋に集める方法。酸素は水にほとんど溶けないので水上置換に適している。塩素など水に溶けやすい気体には使えない。CO₂は水に少し溶けるが、実験上は水上置換も使われることがある。【まちがえやすい点】ほかの選択肢（酸素は水よりも密度が大きいから／酸素は空気より非常に軽いから）とのちがいをおさえておこう。"},
  {id:"che213", cat:"化学", sub:"酸化と還元", q:"木炭（炭素）が酸化銅を還元できる理由として最も適切なものはどれか。", choices:["炭素は酸化銅より融点が高いから","炭素は酸化銅よりも酸素と結びつきやすいから","炭素は金属元素だから","炭素は加熱すると別の元素に変わるから"], diff:"標準", a:1, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「酸化」＝物質が酸素と結びつくこと【解説】炭素は高温で酸素と強く結びつくため、酸化銅から酸素を奪い取ることができる。イオン化傾向と似た概念で、「酸素との結びつきやすさ」の序列がある。炭素以外にも水素や一酸化炭素などが還元剤として使われる。【まちがえやすい点】ほかの選択肢（炭素は酸化銅より融点が高いから／炭素は金属元素だから）とのちがいをおさえておこう。"},
  {id:"che214", cat:"化学", sub:"化学変化と質量", q:"発熱反応と吸熱反応の説明として正しいものはどれか。", choices:["発熱反応では反応後の物質の温度が周囲より低くなる","吸熱反応では反応中に熱を放出すると考えられている","発熱反応では反応中に周囲の温度が上がり、吸熱反応では下がる","吸熱反応では反応物のエネルギーが生成物より低い"], diff:"基礎", a:2, e:"【ことばの意味】「中和」＝酸とアルカリが反応して塩と水ができること／「酸化」＝物質が酸素と結びつくこと【解説】発熱反応（燃焼・中和・酸化など）は熱を放出し周囲温度が上がる。吸熱反応（光合成・水の電気分解・一部の溶解など）は熱を吸収し周囲温度が下がる。冷却パックは硝酸アンモニウムの溶解（吸熱）を利用。【まちがえやすい点】ほかの選択肢（発熱反応では反応後の物質の温度が周囲より低く…／吸熱反応では反応中に熱を放出する）とのちがいをおさえておこう。"},
  {id:"bio252", cat:"生物", sub:"細胞", q:"植物細胞と動物細胞に共通して見られる構造はどれか。", choices:["細胞壁","葉緑体","発達した液胞","核"], diff:"基礎", a:3, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「細胞壁」＝植物の細胞の外側にある、かたい仕切り【解説】核（遺伝情報を含むDNAが存在）は植物・動物両方の細胞にある。細胞壁・葉緑体・発達した液胞は植物細胞に特徴的。ただし液胞は動物細胞にも小さく存在する場合があり、「発達した大きな液胞」が植物特有と覚えるのが正確。【まちがえやすい点】ほかの選択肢（細胞壁／葉緑体）とのちがいをおさえておこう。"},
  {id:"bio253", cat:"生物", sub:"細胞", q:"顕微鏡でピントを合わせる際、安全な操作順序はどれか。", choices:["接眼レンズを外して直接見ながら対物レンズを近づける","横から見ながら対物レンズとプレパラートを近づけてから","最初から高倍率レンズを使ってすばやくピントを合わせる","プレパラートを強く押さえながら対物レンズを近づける"], diff:"基礎", a:1, e:"【解説】最初にレンズとプレパラートを近づけてから（横から目視で確認）、接眼レンズを覗きながら遠ざける方向でピントを合わせる。近づける方向でピントを合わせるとプレパラートを割ったりレンズを破損する危険がある。【まちがえやすい点】ほかの選択肢（接眼レンズを外して直接見ながら対物レンズを近…／最初から高倍率レンズを使ってすばやくピントを…）とのちがいをおさえておこう。"},
  {id:"bio254", cat:"生物", sub:"植物のはたらき", q:"光合成が行われているかどうかを確かめる実験として最も適切なものはどれか。", choices:["葉をヨウ素液で染めて色の変化を観察する","葉を石灰水に入れて白濁するか確かめる","葉を水に浸して気泡が出るか確かめる","葉の色が緑色かどうか確かめる"], diff:"標準", a:0, e:"光合成によってデンプンが生成しているか確かめるには、葉を熱湯・エタノールで脱色後ヨウ素液で染める。デンプンがあれば青紫色になる（ヨウ素デンプン反応）。石灰水はCO₂の確認、気泡（O₂）も光合成の証拠だが、「光合成の産物（デンプン）を確かめる」には選択肢1が最も適している。"},
  {id:"bio255", cat:"生物", sub:"植物のはたらき", q:"蒸散について正しいものはどれか。", choices:["根から取り込んだ水は、蒸散によってほぼすべて蒸発する","蒸散は気孔が開いているときだけでなく、葉の表面からも少量起きる","蒸散が盛んになると根からの水の吸収速度が下がる","蒸散は光合成とは無関係な現象と考えられている"], diff:"基礎", a:1, e:"蒸散は主に気孔から起きるが、葉の表面（クチクラ層）からも少量起きる。根からの水の吸収は蒸散が盛んになると増加する（蒸散が吸水の「引っ張る力」になる）。光合成と同様、気孔を通じてCO₂交換も行われるため両者は関連している。"},
  {id:"bio256", cat:"生物", sub:"植物のはたらき", q:"植物が夜間に行う気体交換について正しいものはどれか。", choices:["光合成と呼吸を同時に行い、O₂を放出しCO₂を吸収する","光合成を行わず、呼吸のみ行うためO₂を吸収しCO₂を放出する","呼吸も光合成も行わず、気体交換は起きない","光がなくても光合成を行うため、O₂の放出は続く"], diff:"基礎", a:1, e:"光合成は光エネルギーが必要なため夜間はできない。植物も動物と同様に24時間呼吸を行い、O₂を消費してCO₂を放出する。昼間は光合成量＞呼吸量となるため見かけ上O₂が放出されているように見えるが、実際は両方同時に起きている。"},
  {id:"bio257", cat:"生物", sub:"動物のからだ", q:"だ液に含まれる消化酵素の名前と、消化する物質の組み合わせとして正しいものはどれか。", choices:["ペプシン：タンパク質を消化する","アミラーゼ：デンプンを消化する","リパーゼ：タンパク質を消化する","胆汁：脂肪を化学的に消化する"], diff:"基礎", a:1, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること【解説】だ液にはアミラーゼが含まれ、デンプンをマルトース（麦芽糖）に分解する。ペプシンは胃液中のタンパク質分解酵素。リパーゼは脂肪分解酵素。胆汁は消化酵素を含まず脂肪を乳化する（物理的消化）。【まちがえやすい点】ほかの選択肢（ペプシン：タンパク質を消化する／リパーゼ：タンパク質を消化する）とのちがいをおさえておこう。"},
  {id:"bio258", cat:"生物", sub:"動物のからだ", q:"血液の成分のうち、酸素を運ぶ役割をもつものはどれか。", choices:["白血球","血小板","赤血球","血しょう"], diff:"基礎", a:2, e:"赤血球にはヘモグロビンが含まれ、酸素と結合して全身に運ぶ。白血球は免疫（病原体の除去）、血小板は止血（血液凝固）、血しょうは栄養素・CO₂・老廃物の運搬を担う。ヘモグロビンは酸素濃度が高い肺で結合し、低い組織で解離する。"},
  {id:"bio259", cat:"生物", sub:"動物のからだ", q:"肺での気体交換（外呼吸）について正しいものはどれか。", choices:["肺胞で血液からO₂が放出されCO₂が取り込まれる","肺胞の周囲の毛細血管でO₂が血液に取り込まれCO₂が放出される","肺での気体交換はO₂のみを対象としている","気体交換は気管支の内壁で行われるとされている"], diff:"基礎", a:1, e:"【ことばの意味】「呼吸」＝酸素を使って養分を分解し、エネルギーを取り出すこと【解説】肺胞は薄い壁と豊富な毛細血管をもち、拡散によってO₂が血液に溶け込み（取り込み）、CO₂が血液から肺胞内に出る（放出）。選択肢1はO₂とCO₂の方向が逆。気体交換が行われるのは気管支ではなく肺胞。【まちがえやすい点】ほかの選択肢（肺胞で血液からO₂が放出されCO₂が取り込ま…／肺での気体交換はO₂のみを対象としている）とのちがいをおさえておこう。"},
  {id:"bio260", cat:"生物", sub:"動物のからだ", q:"ヒトの心臓について正しいものはどれか。", choices:["心臓は左心房・左心室・右心房・右心室の4つに区切られている","心臓には筋肉がなく、弾性のある壁でできている","心臓は脳からの命令がなければ収縮できない","体循環と肺循環を担う2つの心臓が別々に存在する"], diff:"基礎", a:0, e:"【ことばの意味】「伝導」＝物を伝わって熱が移動すること【解説】ヒトの心臓は4つの部屋（右心房・右心室・左心房・左心室）に分かれており、右心は肺循環（心臓→肺→心臓）、左心は体循環（心臓→全身→心臓）を担う。心臓の壁は心筋でできており、刺激伝導系により自律的に収縮する。【まちがえやすい点】ほかの選択肢（心臓には筋肉がなく、弾性のある壁でできている／心臓は脳からの命令がなければ収縮できない）とのちがいをおさえておこう。"},
  {id:"bio261", cat:"生物", sub:"動物のからだ", q:"腎臓のはたらきとして正しいものはどれか。", choices:["血液をろ過して尿素などの老廃物を尿として排出し、必要な物質は再吸収する","血液中の糖をすべて除去して尿に排出する","腎臓で作られた尿は直接体外に排出される","腎臓は消化に関わる臓器である"], diff:"基礎", a:0, e:"【腎臓のはたらき】腎臓の中にある糸球体という部分で血液がろ過され、原尿がつくられます。その後、尿細管という管を通る間に、体に必要な水・グルコース（糖）・無機塩類などが再び血液に吸収されます（再吸収）。残った尿素などの不要な物質が尿として排出されます。／【まちがえやすい点】糖は通常すべて再吸収されるため、健康な人の尿にはほとんど含まれません。尿はいったん膀胱にためられてから排出されます。"},
  {id:"bio262", cat:"生物", sub:"動物のからだ", q:"神経系の「反射」について正しいものはどれか。", choices:["反射は大脳が命令を出してから筋肉が動く反応である","大脳での意識的な判断より速く起きる","反射はあらゆる刺激に対して同じ速さで起きる","反射は学習によって変化することがない"], diff:"基礎", a:1, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること【解説】反射は刺激→感覚神経→脊髄（または脳幹）→運動神経→筋肉という経路で大脳を介さずに起きる。そのため応答が非常に速い。熱いものに触れたときに手を引っ込める、ひざをたたくとはねあがるなどが例。【まちがえやすい点】ほかの選択肢（反射は大脳が命令を出してから筋肉が動く反応で…／反射はあらゆる刺激に対して同じ速さで起きる）とのちがいをおさえておこう。"},
  {id:"bio263", cat:"生物", sub:"生殖と遺伝", q:"有性生殖と無性生殖の違いとして正しいものはどれか。", choices:["有性生殖では親とほぼ同じ遺伝子をもつ子ができる","無性生殖では2個体が関わり、遺伝子の組み合わせが多様になる","有性生殖では卵や精子などの生殖細胞が関わり、遺伝的多様性が生まれる","無性生殖はほとんどの生物に共通してみられる"], diff:"標準", a:2, e:"有性生殖では受精によって両親から半分ずつ染色体を受け継ぎ、遺伝子の組み合わせが多様になる。無性生殖（分裂・出芽・栄養生殖など）では親と全く同じ遺伝子をもつ子ができる（クローン）。農業では無性生殖（さし木など）で品質の均一化に活用される。"},
  {id:"bio264", cat:"生物", sub:"生殖と遺伝", q:"減数分裂について正しいものはどれか。", choices:["体細胞分裂と同様に、染色体数が変化しない","卵や精子などの生殖細胞を作る際に起き","体細胞にのみ起き、生殖には関わらない","分裂後の細胞が2個できる"], diff:"基礎", a:1, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「受精」＝精細胞と卵細胞が合体すること【解説】減数分裂は生殖細胞形成時に起き、染色体数が体細胞の半数になる（ヒトは46本→23本）。受精によって元の染色体数（46本）に戻る。体細胞分裂（染色体数が変わらない）と混同しやすいので注意。減数分裂では4個の細胞が生じる。【まちがえやすい点】ほかの選択肢（体細胞分裂と同様に、染色体数が変化しない／体細胞にのみ起き、生殖には関わらない）とのちがいをおさえておこう。"},
  {id:"bio265", cat:"生物", sub:"生殖と遺伝", q:"エンドウの種子の形（丸・しわ）で丸が優性（顕性）・しわが劣性（潜性）のとき、Aaの遺伝子型をもつ個体の表現型はどれか。", choices:["しわ","丸","丸としわが混在する","どちらでもない中間の形になる"], diff:"標準", a:1, e:"【ことばの意味】「遺伝子」＝生物の特徴を決める情報。染色体の中にある／「顕性」＝親のどちらかから受けつぐと現れやすい形質（旧：優性）【解説】優性・劣性（顕性・潜性）の法則により、Aaのように優性遺伝子（A）が一つでもあれば優性の形質（丸）が現れる。劣性形質（しわ）が現れるのは劣性遺伝子のみの組み合わせ（aa）のときだけ。【まちがえやすい点】ほかの選択肢（しわ／丸としわが混在する）とのちがいをおさえておこう。"},
  {id:"bio266", cat:"生物", sub:"生殖と遺伝", q:"AaとAaの親から生まれる子の遺伝子型と表現型の比として正しいものはどれか（A:優性、a:劣性）。", choices:["遺伝子型AA:Aa:aa＝1:2:1、表現型は優性:劣性＝3:1","遺伝子型AA:aa＝1:1、表現型は優性:劣性＝1:1","遺伝子型は全てAa、表現型は全て優性","遺伝子型AA:Aa:aa＝1:1:1、表現型は優性:劣性＝2:1"], diff:"基礎", a:0, e:"Aa×Aaの交配では、AA:Aa:aa＝1:2:1の割合で生まれる。表現型は優性（AA・Aa）:劣性（aa）＝3:1。F₂で1/4がしわ（aa）というメンデルの実験結果がこれに対応する。確認にはパネット方陣（遺伝子の組み合わせ表）を使うとよい。"},
  {id:"bio267", cat:"生物", sub:"生物とかんきょう", q:"食物連鎖における「生産者」とはどのような生物か。", choices:["他の生物を捕食して有機物を取り込む生物","光合成などによって無機物から有機物を作り出す生物","有機物を無機物に分解する生物","他の動物に寄生して栄養を得る生物"], diff:"基礎", a:1, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること／「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】生産者は光合成を行う植物・藻類などで、太陽エネルギーを使ってCO₂とH₂Oから有機物を生成する。消費者は他の生物を食べて有機物を取り込む。分解者（菌類・細菌）は有機物を無機物に分解する。【まちがえやすい点】ほかの選択肢（他の生物を捕食して有機物を取り込む生物／有機物を無機物に分解する生物）とのちがいをおさえておこう。"},
  {id:"bio268", cat:"生物", sub:"生物とかんきょう", q:"自然界において分解者のはたらきとして正しいものはどれか。", choices:["動物の死がいやふんなどの有機物を無機物に分解する","植物が光合成で作った有機物を蓄える","太陽エネルギーを有機物に変換する","水や二酸化炭素を有機物に変換する"], diff:"基礎", a:0, e:"【ことばの意味】「分解者」＝土の中の細菌やカビ（菌類）など、生物の死がいやふんを二酸化炭素・水・無機塩類などの無機物に分解する生物。／【なぜ大切？】分解者がいないと死がいや落ち葉が積もり続けてしまいます。分解者が無機物にもどすことで、その養分をふたたび植物が使えるようになり、物質が生態系の中を循環していきます。／【まちがえやすい点】有機物を無機物にするのが分解者で、逆に無機物から有機物をつくるのは生産者（植物）のはたらきです。"},
  {id:"bio269", cat:"生物", sub:"植物のつくり", q:"双子葉植物と単子葉植物の根のつくりのちがいとして正しいものはどれか。", choices:["双子葉植物は太い主根から細い側根が出て、単子葉植物は細いひげ根が多数出る","双子葉植物はひげ根、単子葉植物は主根と側根をもつ","どちらも同じように主根と側根をもつ","どちらも同じようにひげ根をもつ"], diff:"基礎", a:0, e:"【ことばの意味】「主根」＝中心になる太い根。「側根」＝主根から枝分かれして出る細い根。「ひげ根」＝同じくらいの太さの根が根もとからたくさん出るつくり。／【双子葉植物】アブラナ・タンポポなど。1本の太い主根から側根がたくさん枝分かれして出ます。／【単子葉植物】イネ・トウモロコシなど。主根がなく、同じくらいの太さのひげ根がたくさん出ます。／【あわせて覚えよう】葉脈も双子葉類は網目状（網状脈）、単子葉類は平行（平行脈）というちがいがあります。"},
  {id:"bio270", cat:"生物", sub:"植物のつくり", q:"植物の維管束について正しいものはどれか。", choices:["道管は根で吸収した水や養分を葉へ運び、師管は葉でつくった栄養分を運ぶ","道管は葉でつくられた有機物を根へ運ぶ","師管は根で吸収した水や無機塩類を葉へ運ぶ","道管と師管が何を運ぶかは植物の種類によって入れかわる"], diff:"基礎", a:0, e:"【ことばの意味】「道管」＝根から吸収した水や、水にとけた養分を運ぶ管。「師管」＝葉で光合成によってつくられた栄養分（デンプンなど）を運ぶ管。両方合わせて「維管束」といいます。／【運ぶ向き】道管は根→茎→葉へ水を運びます。師管は葉でつくった栄養分を、必要な場所（根や実など）へ運びます。／【覚え方】「どうかん」の「みず」、「しかん」の「しよう分（栄養分）」と語呂で覚えると混同しにくくなります。道管と師管の役割はどの植物でも共通しています。"},
  {id:"bio272", cat:"生物", sub:"生物の進化", q:"自然選択（自然淘汰）についての説明として正しいものはどれか。", choices:["環境に合わせて個体が意識的に形質を変える","たまたま生き残った少数の個体が子孫を残す（遺伝的浮動）","環境に適した変異をもつ個体が生き残りやすく、その形質が次世代に伝わる","生物が自らの意思で有利な変異を選択する"], diff:"基礎", a:2, e:"【解説】ダーウィンの自然選択：個体間には遺伝的な変異があり、環境に適した形質をもつ個体ほど生存・繁殖しやすく、その形質が集団中に広まる。意識的・意図的な変化ではない。ラマルクの「用不用説」とは異なる考え方。【まちがえやすい点】ほかの選択肢（環境に合わせて個体が意識的に形質を変える／たまたま生き残った少数の個体が子孫を残す（遺…）とのちがいをおさえておこう。"},
  {id:"bio273", cat:"生物", sub:"植物のつくり", q:"花の各部分が受精後にどのように変化するか。正しいものはどれか。", choices:["子房が果実になり、胚珠が種子になる","胚珠が果実になり、子房が種子になる","花弁が種子になり、花粉管が果実になる","がく片が果実になり、おしべが種子になる"], diff:"基礎", a:0, e:"【ことばの意味】「子房」＝めしべの根もとのふくらんだ部分。「胚珠」＝子房の中にある、種子のもとになる部分。／【受精後の変化】受精すると、胚珠は成長して種子になり、それを包んでいた子房は成長して果実になります。／【身近な例】リンゴやモモの実（果実）の中に種があるのは、まさにこの「子房→果実」「胚珠→種子」の関係を表しています。／【まちがえやすい点】花弁（花びら）やがく片、おしべは受精後にしおれて落ちてしまい、果実や種子にはなりません。"},
  {id:"bio274", cat:"生物", sub:"植物のつくり", q:"葉の気孔の開閉を直接調節する細胞はどれか。", choices:["葉肉細胞","表皮細胞","孔辺細胞","維管束細胞"], diff:"基礎", a:2, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】気孔は2つの孔辺細胞に囲まれている。孔辺細胞は光・CO₂濃度・水分量に反応して膨らんだり縮んだりすることで気孔の開閉を調節する。気孔を通じてCO₂や水蒸気が出入りし、蒸散・光合成・呼吸に関わる。【まちがえやすい点】ほかの選択肢（葉肉細胞／表皮細胞）とのちがいをおさえておこう。"},
  {id:"bio275", cat:"生物", sub:"生態系", q:"捕食-被食関係（食物連鎖）による個体数の変動について正しいものはどれか。", choices:["生産者が減ると消費者が増加してバランスを保つ","捕食者が増えると被食者が減り、食料が減った捕食者も減る","生態系のバランスは一度崩れると元に戻らない","食物連鎖の個体数バランスは常に完全な安定を保っている"], diff:"標準", a:1, e:"【ことばの意味】「食物連鎖」＝「食べる・食べられる」の一直線のつながり【解説】捕食-被食関係では個体数が周期的に増減しながら均衡を保つ（周期的変動）。例：シカが増える→草が減る→シカが減る→草が回復→シカが増える…。外来種の侵入や乱獲など大きな攪乱が起きると回復困難になる場合がある。【まちがえやすい点】ほかの選択肢（生産者が減ると消費者が増加してバランスを保つ／生態系のバランスは一度崩れると元に戻らない）とのちがいをおさえておこう。"},
  {id:"bio276", cat:"生物", sub:"動物のからだ", q:"血糖値が上昇したとき、すい臓から分泌されるホルモンはどれか。", choices:["グルカゴン","アドレナリン","インスリン","チロキシン"], diff:"標準", a:2, e:"インスリンはすい臓のランゲルハンス島（β細胞）から分泌され、細胞へのグルコース取り込みを促進し血糖値を下げる。グルカゴン（α細胞）は血糖値が低いとき分泌されグリコーゲンを分解して血糖値を上げる。インスリンが機能しないと糖尿病になる。"},
  {id:"bio277", cat:"生物", sub:"動物のからだ", q:"ヒトの消化管を食物が通る順番として正しいものはどれか。", choices:["口→食道→小腸→胃→大腸→肛門","口→食道→胃→小腸→大腸→肛門","口→胃→食道→小腸→大腸→肛門","口→食道→胃→大腸→小腸→肛門"], diff:"基礎", a:1, e:"【解説】消化管の順：口→食道→胃→十二指腸→小腸→大腸→肛門。消化の主な場所は小腸（化学的消化・吸収）。胃では主にタンパク質の消化と殺菌が行われる。大腸では水分の再吸収が主。栄養素の吸収は小腸の柔毛（絨毛）で行われる。【まちがえやすい点】ほかの選択肢（口→食道→小腸→胃→大腸→肛門／口→胃→食道→小腸→大腸→肛門）とのちがいをおさえておこう。"},
  {id:"ear246", cat:"地学", sub:"天体の動き", q:"太陽が東から昇り西に沈むように見えるのは、何が原因か。", choices:["地球が西から東へ自転しているから","地球が東から西へ自転しているから","太陽が地球のまわりを1日1回まわっているから","地球が太陽のまわりを1日1回公転しているから"], diff:"基礎", a:0, e:"【ことばの意味】「自転」＝地球が自分自身でコマのように回ること（1日に1回転）。「公転」＝地球が太陽のまわりを回ること（1年に1周）。／【なぜ東から西に見える？】地球は西から東の向きに自転しています。回っている乗り物の中から外を見ると、景色は逆向きに流れていきますね。同じように、地上から空を見ると太陽や星は逆向き（東→西）に動いて見えます。これを日周運動といいます。／【まちがえやすい点】太陽が地球のまわりを回っているのではありません（昔はそう考えられていました＝天動説）。また地球の公転は1年に1周なので、1日の動きの説明にはなりません。"},
  {id:"ear247", cat:"地学", sub:"天体の動き", q:"日本において、太陽の南中高度が最も高くなる日はいつか。", choices:["春分の日","冬至","夏至","秋分の日"], diff:"基礎", a:2, e:"【ことばの意味】「南中高度」＝太陽が真南に来たときの、地平線からの角度【解説】夏至は太陽が最も北寄り（北回帰線上）に位置するため、北半球では南中高度が最も高くなり昼が最も長い。冬至は逆に南中高度が最も低く昼が最も短い。春分・秋分は昼夜ほぼ等しく、南中高度は夏至と冬至の中間。【まちがえやすい点】ほかの選択肢（春分の日／冬至）とのちがいをおさえておこう。"},
  {id:"ear248", cat:"地学", sub:"天体の動き", q:"月が満ち欠けをする理由として正しいものはどれか。", choices:["月が自転しているためという地形と考えられている","月の公転によって地球から見える月の昼側の面積が変化する","地球の影が月に当たる割合が変化するから","月が地球に近づいたり遠ざかったりするから"], diff:"標準", a:1, e:"【ことばの意味】「公転」＝地球が1年かけて太陽のまわりを回ること【解説】月は太陽に照らされた半面（昼側）が光って見える。月が地球のまわりを公転することで、地球から見える昼側の面積が変化するため満ち欠けが起きる。月食は地球の影に月が入る現象で、満ち欠けとは別の現象。【まちがえやすい点】ほかの選択肢（月が自転しているため／地球の影が月に当たる割合が変化するから）とのちがいをおさえておこう。"},
  {id:"ear249", cat:"地学", sub:"天体の動き", q:"日食が起きる条件として正しいものはどれか。", choices:["満月のときに地球の影に月が入る","新月のときに月が太陽と地球の間に入り","半月のときに太陽と月が直角になる","月が太陽の反対側に位置するとき"], diff:"基礎", a:1, e:"【解説】日食は新月のとき（太陽・月・地球がこの順に並ぶとき）に起きる。月の影が地球に当たる部分では太陽が隠れて見える。月食は満月のとき（太陽・地球・月の順）に地球の影に月が入る現象。【まちがえやすい点】ほかの選択肢（満月のときに地球の影に月が入る／半月のときに太陽と月が直角になる）とのちがいをおさえておこう。"},
  {id:"ear250", cat:"地学", sub:"地層と岩石", q:"示準化石の条件として適切なものはどれか。", choices:["長い期間にわたって生存し、現在も生きている生物の化石","短い期間だけ生存し、広い地域に分布した生物の化石","特定の深さでのみ生息し、現在は絶滅した生物の化石","珍しい形をしており、同定が容易な生物の化石"], diff:"基礎", a:1, e:"示準化石は地質時代（年代）を決定する手がかり。条件は①短期間（特定の時代）に生存、②広い地域に分布、③個体数が多く化石が見つかりやすい。例：三葉虫（古生代）・アンモナイト（中生代）・ビカリア（新生代）。一方示相化石は当時の環境（水温・深さ）を示す。"},
  {id:"ear251", cat:"地学", sub:"地層と岩石", q:"礫岩・砂岩・泥岩について正しいものはどれか。", choices:["粒の大きさは礫が最も大きく、砂、泥の順に小さくなる","礫岩は最も粒が小さく、深い海底に堆積する","砂岩は熱や圧力を受けて変成した岩石である","泥岩は火山の噴火によって形成される"], diff:"基礎", a:0, e:"【ことばの意味】「堆積岩」＝土砂や生物の死がいが積もって固まった岩石。／【粒の大きさ】れき（2mm以上）＞砂（0.06〜2mm）＞泥（0.06mm未満）の順に小さくなります。／【運ばれ方】粒が小さいほど軽く、水の流れの中で遠くまで運ばれるため、河口の近くにれき、少し沖に砂、いちばん遠い沖の深い場所に泥が積もる傾向があります。／【まちがえやすい点】砂岩や泥岩は堆積してできた岩石で、熱や圧力で変化したものではありません（それは変成岩）。"},
  {id:"ear252", cat:"地学", sub:"地層と岩石", q:"花こう岩と玄武岩の違いについて正しいものはどれか。", choices:["花こう岩は結晶が大きく白っぽい深成岩で、玄武岩は結晶が小さく黒っぽい火山岩である","花こう岩はマグマが地表近くで急に冷えてできた火山岩である","玄武岩はマグマが地下深くでゆっくり冷えてできた深成岩である","花こう岩と玄武岩はどちらも堆積岩である"], diff:"標準", a:0, e:"【ことばの意味】「深成岩」＝マグマが地下の深いところでゆっくり冷えてできた岩石。ゆっくり冷えるので大きな結晶が育ちます。「火山岩」＝マグマが地表近くで急に冷えてできた岩石。急に冷えるので結晶が育つ間がなく細かくなります。／【花こう岩】深成岩の代表。白っぽく、大きな結晶（石英・長石・黒雲母）が見えます。／【玄武岩】火山岩の代表。黒っぽく、結晶は細かいです。／【まちがえやすい点】どちらも火成岩（マグマからできた岩石）で、堆積岩（土砂が積もってできた岩石）ではありません。"},
  {id:"ear253", cat:"地学", sub:"火山と地震", q:"マグマの粘りけと火山の形・噴火の様式の関係として正しいものはどれか。", choices:["粘りけが大きいと溶岩が流れやすく、なだらかな山になる","粘りけが小さいと爆発的な噴火になりやすく、急峻な山になる","粘りけが大きいと溶岩が流れにくく、爆発的な噴火になりやすい","粘りけと火山の形には関係がないと考えられている"], diff:"標準", a:2, e:"【解説】マグマの粘りけが大きい（SiO₂含量が多い）ほど、溶岩が流れにくく火山ガスが抜けにくいため爆発的な噴火になりやすく、急峻な山ができやすい。粘りけが小さいと溶岩が流れ広がってなだらかな楯状火山になる。【まちがえやすい点】ほかの選択肢（粘りけが大きいと溶岩が流れやすく、なだらかな…／粘りけが小さいと爆発的な噴火になりやすく、急…）とのちがいをおさえておこう。"},
  {id:"ear254", cat:"地学", sub:"火山と地震", q:"P波とS波の違いについて正しいものはどれか。", choices:["P波は横波で伝わる速度が遅く、S波は縦波で速い","P波は縦波で速く液体中も伝わり、S波は横波で遅く液体中は伝わらない","P波とS波は同じ速度で伝わるとされている","S波が先に到着して初期微動を起こし、P波が主要動を引き起こす"], diff:"基礎", a:1, e:"P波（Primary wave）：縦波・速い（約7km/s）・固体と液体を伝わる→初期微動を引き起こす。S波（Secondary wave）：横波・遅い（約4km/s）・固体のみ伝わる→主要動（大きな揺れ）を引き起こす。初期微動継続時間（P波とS波の到着時間差）から震源距離を求められる。"},
  {id:"ear255", cat:"地学", sub:"火山と地震", q:"初期微動継続時間について正しいものはどれか。", choices:["震源に近いほど初期微動継続時間は長くなる","震源から遠いほど初期微動継続時間は長くなる","初期微動継続時間と震源距離は無関係","初期微動継続時間から震源の深さのみがわかる"], diff:"基礎", a:1, e:"【ことばの意味】「震源」＝地下で地震が発生した場所／「P波」＝最初に来る速い波。小さくカタカタ揺れる（初期微動）【解説】初期微動継続時間＝P波到着〜S波到着の時間差。P波とS波の速度差があるため、震源から遠いほど両者の到着時間の差が大きくなり、初期微動継続時間が長くなる。この時間を複数の地点で測定することで震源を特定できる。【まちがえやすい点】ほかの選択肢（震源に近いほど初期微動継続時間は長くなる／初期微動継続時間と震源距離は無関係）とのちがいをおさえておこう。"},
  {id:"ear256", cat:"地学", sub:"天気", q:"寒冷前線が通過した後の天気の変化として正しいものはどれか。", choices:["気温が上昇し、穏やかな雨が長時間続く","気温が下がり、一時的に強い雨が降り","気温・天気ともに変化しない","暖かく湿った南風が吹き始める"], diff:"基礎", a:1, e:"【ことばの意味】「前線」＝性質のちがう空気のかたまりがぶつかる境目／「寒冷前線」＝冷たい空気が暖かい空気の下にもぐりこむ前線。短時間の強い雨【解説】寒冷前線は寒気が暖気の下に潜り込み急激に押し上げるため、積乱雲が発生して短時間の激しい雨（にわか雨・雷雨）をもたらす。通過後は寒気が入り込んで気温が下がり、北西の風が吹きやすい。温暖前線は穏やかな長雨。【まちがえやすい点】ほかの選択肢（気温が上昇し、穏やかな雨が長時間続く／気温・天気ともに変化しない）とのちがいをおさえておこう。"},
  {id:"ear257", cat:"地学", sub:"天気", q:"温暖前線と寒冷前線の雲の種類と雨の違いとして正しいものはどれか。", choices:["温暖前線：積乱雲が発達して激しい雨、寒冷前線：層状の雲で穏やかな雨","温暖前線：層状の雲で穏やかな長雨、寒冷前線：積乱雲が発達して激しい雨","どちらも積乱雲が発達して激しい雨を降らせる","どちらも層状の雲で穏やかな長雨を降らせる"], diff:"標準", a:1, e:"【ことばの意味】「前線」＝性質のちがう空気のかたまりがぶつかる境目／「寒冷前線」＝冷たい空気が暖かい空気の下にもぐりこむ前線。短時間の強い雨【解説】温暖前線：暖気がゆるやかに上昇→層雲（乱層雲など）→広い範囲で穏やかな雨が長時間続く。寒冷前線：冷気が暖気を急激に押し上げる→積乱雲（入道雲）→狭い範囲で短時間の激しい雨・雷雨。前線の種類と雨の特徴をセットで覚えよう。【まちがえやすい点】ほかの選択肢（温暖前線：積乱雲が発達して激しい雨、寒冷前線…／どちらも積乱雲が発達して激しい雨を降らせる）とのちがいをおさえておこう。"},
  {id:"ear258", cat:"地学", sub:"天気", q:"日本の冬の天気の特徴として正しいものはどれか。", choices:["太平洋側は雪が多く、日本海側は晴れが続く","大陸から冷たく乾いた北西の季節風が吹き","南高北低の気圧配置になる","台風が頻繁に発生して上陸する"], diff:"基礎", a:1, e:"【ことばの意味】「季節風」＝季節によって決まった向きに吹く風【解説】冬型気圧配置（西高東低）：シベリア気団からの冷たい北西の季節風が日本海を渡る際に水分を含み、山地で上昇して日本海側に大雪をもたらす。太平洋側には乾燥した風が吹いて晴れが続く。夏は南東の季節風が太平洋側に雨をもたらす。【まちがえやすい点】ほかの選択肢（太平洋側は雪が多く、日本海側は晴れが続く／南高北低の気圧配置になる）とのちがいをおさえておこう。"},
  {id:"ear259", cat:"地学", sub:"天気", q:"雲が発生するしくみとして正しいものはどれか。", choices:["上空の水分が地表近くに下がって冷えるときに雲ができる","空気が上昇して気圧が下がり","雲は海面から直接蒸発した水蒸気が集まって形成される","水蒸気が太陽光に照らされて白く見える状態が雲である"], diff:"標準", a:1, e:"【ことばの意味】「露点」＝空気中の水蒸気が水てきに変わり始める温度／「前線」＝性質のちがう空気のかたまりがぶつかる境目【解説】空気が上昇すると周囲の気圧が下がり、空気は膨張して温度が下がる（断熱冷却）。温度が露点以下になると水蒸気が水滴や氷晶に変化して雲が生じる。山を越えるときや前線での上昇気流も同様の仕組みで雲を作る。【まちがえやすい点】ほかの選択肢（上空の水分が地表近くに下がって冷えるときに雲…／雲は海面から直接蒸発した水蒸気が集まって形成…）とのちがいをおさえておこう。"},
  {id:"ear260", cat:"地学", sub:"地球と宇宙", q:"惑星が恒星と異なる点として正しいものはどれか。", choices:["惑星は自ら光を発し、恒星は光を発しない","惑星は自ら光を発せず","惑星は恒星より大きく、重力も強い","惑星は常に同じ位置に見え、恒星は動く"], diff:"基礎", a:1, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること／「恒星」＝太陽のように自分で光る星【解説】恒星（太陽・夜空の星）は核融合反応で自ら光を放つ。惑星は自ら光を発せず、太陽光を反射して輝く。また惑星は星座の星（恒星）の間を移動して見える（これが「惑星」の語源）。【まちがえやすい点】ほかの選択肢（惑星は自ら光を発し、恒星は光を発しない／惑星は恒星より大きく、重力も強い）とのちがいをおさえておこう。"},
  {id:"ear261", cat:"地学", sub:"地球と宇宙", q:"金星が「明けの明星」「宵の明星」として見られる理由として正しいものはどれか。", choices:["金星は夜中に南中するため、明け方や夕方に高く昇る","金星は地球の内側を公転しているため、太陽から大きく離れた位置には見えない","金星は月と同じように地球のまわりを公転しているから","金星の公転速度が非常に速く、一日に何度も見える方向が変わる"], diff:"標準", a:1, e:"【ことばの意味】「公転」＝地球が1年かけて太陽のまわりを回ること／「惑星」＝太陽のまわりを回り、太陽の光を反射して光る星【解説】金星は地球より内側（内惑星）を公転するため、太陽から大きく離れた位置には見えない。このため真夜中には見えず、日の出前（東の空）か日の入り後（西の空）の限られた時間のみ見える。これが「明けの明星・宵の明星」の理由。【まちがえやすい点】ほかの選択肢（金星は夜中に南中するため、明け方や夕方に高く…／金星は月と同じように地球のまわりを公転してい…）とのちがいをおさえておこう。"},
  {id:"ear262", cat:"地学", sub:"大気と海洋", q:"フェーン現象についての説明として正しいものはどれか。", choices:["山を越えた後の空気が風下側で高温・乾燥になる現象","山の風上側で気温が上昇する現象","海から湿った風が吹いて山の風下側に雨をもたらす現象","山の上空だけで気温が上昇する現象"], diff:"基礎", a:0, e:"【解説】フェーン現象：湿った空気が山を越えるとき、風上側で雨を降らせながら上昇（100m上がるごとに約0.5℃低下）し、風下側では乾いた空気として下降（100m下がるごとに約1℃上昇）するため、もとの気温より高温・乾燥になる。【まちがえやすい点】ほかの選択肢（山の風上側で気温が上昇する現象／海から湿った風が吹いて山の風下側に雨をもたら…）とのちがいをおさえておこう。"},
  {id:"ear263", cat:"地学", sub:"地球と宇宙", q:"月の表面にクレーターが多く見られる理由として正しいものはどれか。", choices:["月では火山活動が活発で、噴火口が多数形成されたから","月には大気がほとんどないため隕石が燃え尽きずに衝突し、侵食も少ないから","月の表面の岩石が雨風によって侵食されてできたから","月には水があり、水による侵食でクレーターが形成されたから"], diff:"標準", a:1, e:"【解説】地球では大気中で隕石がほぼ燃え尽き（流れ星）、残っても雨風による侵食で地形が変化する。月には大気がほとんどなく、隕石がそのまま衝突してクレーターを作り、侵食もないためクレーターが長く保存される。【まちがえやすい点】ほかの選択肢（月では火山活動が活発で、噴火口が多数形成され…／月の表面の岩石が雨風によって侵食されてできた…）とのちがいをおさえておこう。"},
  {id:"ear264", cat:"地学", sub:"大気と海洋", q:"海風と陸風が生じる原因として正しいものはどれか。", choices:["海の水が陸より温まりにくいため、昼間は陸から海へ風が吹く","昼間は陸上の気温が高くなり海から陸へ風が吹く","海と陸の温度差は夜間の方が大きく、夜は海から陸へ風が吹く","海風と陸風は偏西風の影響でのみ生じる"], diff:"標準", a:1, e:"【解説】陸は海より温まりやすく冷めやすい（比熱が小さい）。昼：陸が高温→上昇気流→海から陸へ海風が吹く。夜：陸が冷える→海の方が相対的に暖かく上昇→陸から海へ陸風が吹く。大気の局地循環の好例。【まちがえやすい点】ほかの選択肢（海の水が陸より温まりにくいため、昼間は陸から…／海と陸の温度差は夜間の方が大きく、夜は海から…）とのちがいをおさえておこう。"},
  {id:"ear265", cat:"地学", sub:"天体の動き", q:"北極星が動かないように見える理由として正しいものはどれか。", choices:["北極星は地球から非常に近い距離にあるから","北極星が地球の自転軸の延長方向（天の北極）付近に位置する","北極星は他の星より圧倒的に明るいから","北極星は地球の公転に合わせて動いているから"], diff:"標準", a:1, e:"【ことばの意味】「自転」＝地球が1日に1回、自分で回ること／「日周運動」＝1日のうちに天体が東から西へ動いて見えること【解説】地球の自転軸の北側の延長線上（天の北極）近くに北極星（ポラリス）があるため、地球がどの向きに自転しても北極星の方向はほとんど変わらない。他の星は天の北極を中心に円を描くように動いて見える（日周運動）。【まちがえやすい点】ほかの選択肢（北極星は地球から非常に近い距離にあるから／北極星は他の星より圧倒的に明るいから）とのちがいをおさえておこう。"},
  {id:"trivia56", cat:"雑学", sub:"生物", q:"ヒトの体内で最も大きい臓器は何か。", choices:["肝臓","心臓","肺","皮膚"], diff:"基礎", a:3, e:"【解説】皮膚は体表全体を覆う最大の臓器で、成人では約1.6〜2m²・重量約3〜4kg。体温調節・感覚受容・病原体からの保護などの役割がある。内臓の中では肝臓が最大（約1〜1.5kg）だが、皮膚全体を合わせると肝臓を上回る。【まちがえやすい点】ほかの選択肢（肝臓／心臓）とのちがいをおさえておこう。"},
  {id:"trivia57", cat:"雑学", sub:"天文学", q:"太陽系の中で最も大きな惑星はどれか。", choices:["土星","天王星","木星","海王星"], diff:"基礎", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「惑星」＝太陽のまわりを回り、太陽の光を反射して光る星【解説】木星は太陽系最大の惑星で、直径は地球の約11倍・質量は地球の約318倍。大赤斑は地球が数個入る巨大な嵐で、数百年にわたって観測されている。【まちがえやすい点】ほかの選択肢（土星／天王星）とのちがいをおさえておこう。"},
  {id:"trivia58", cat:"雑学", sub:"化学", q:"鉄が塩水でさびやすい理由として最も適切なものはどれか。", choices:["塩水が鉄を直接溶かすから","塩分（イオン）が水の電気伝導性を高め","塩水は酸性が強く鉄を溶かすから","塩水中では酸素量が増えるから"], diff:"標準", a:1, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】塩水はイオンを多く含み電気を通しやすいため、鉄の腐食（酸化）反応が速く進む。海辺や冬の道路（融雪剤）で鉄がさびやすいのはこの原理。【まちがえやすい点】ほかの選択肢（塩水が鉄を直接溶かすから／塩水は酸性が強く鉄を溶かすから）とのちがいをおさえておこう。"},
  {id:"trivia59", cat:"雑学", sub:"物理", q:"冷蔵庫の中が冷える仕組みとして最も適切なものはどれか。", choices:["冷媒という物質が蒸発するときに周囲の熱をうばい、庫内を冷やしている","電気エネルギーで冷気を直接作り出す","冷蔵庫の壁が熱を吸収して外に排出する","電気で氷を作り、その冷気で冷やす"], diff:"標準", a:0, e:"【ことばの意味】「冷媒」＝冷蔵庫やエアコンの中で、熱を運ぶ役割をする物質。／【冷えるしくみ】冷媒は液体から気体に蒸発するとき、周囲から熱をうばう性質があります。この性質を利用して庫内の熱をうばうことで冷やしています。その後、冷媒は外で圧縮されて液体にもどるときに熱を放出します（冷蔵庫の背面が温かいのはこのため）。／【まちがえやすい点】氷をつくって冷やしているわけではなく、状態変化にともなう熱の出入りを利用しています。"},
  {id:"trivia60", cat:"雑学", sub:"地球", q:"虹が弧状に見える理由として正しいものはどれか。", choices:["雨粒が弧状に並んでいるからと考えられている","太陽光が球形の雨粒に入射・屈折・反射して出てくるとき","空気中に虹色の光が広がるからと考えられている","雨粒が光を吸収することで色が現れるから"], diff:"標準", a:1, e:"雨粒（球形）に太陽光が入射すると屈折・内部反射・再屈折して出てくる。この際、色（波長）によって屈折角が異なり、観測者からは約42°の角度に赤、約40°の角度に紫が見える。観測者が中心となる円弧として見えるため虹は円弧状になる。"},
  {id:"trivia61", cat:"雑学", sub:"物理", q:"電子レンジで食品が温まる仕組みとして正しいものはどれか。", choices:["電気ヒーターと同じで熱線が食品を外から温める","マイクロ波が水分子を振動させ、その摩擦熱で食品が内部から温まる","紫外線が食品の化学結合を変化させて熱を発生させる","電流を食品に流して抵抗による発熱で温める"], diff:"標準", a:1, e:"電子レンジは2.45GHzのマイクロ波を照射する。水分子は極性をもつため、電場の振動に合わせて回転・振動し、その摩擦で熱が発生する。水分を多く含む食品ほど加熱されやすく、陶器・ガラスはほとんど温まらない理由もこの原理による。"},
  {id:"trivia62", cat:"雑学", sub:"生物", q:"血液が赤く見える理由として正しいものはどれか。", choices:["血液中の鉄イオンが酸化されて赤くなるから","赤血球のヘモグロビンが酸素と結合すると鮮赤色になる","血液中に赤い色素が溶けているから","白血球が赤く染まるからと考えられている"], diff:"標準", a:1, e:"【解説】ヘモグロビン（Hb）は鉄（Fe²⁺）を含むタンパク質。O₂と結合したオキシヘモグロビンは鮮やかな赤色（動脈血）で、O₂を放出したデオキシヘモグロビンは暗赤色（静脈血）。タコ・イカの血（ヘモシアニン：銅含有）は青い。【まちがえやすい点】ほかの選択肢（血液中の鉄イオンが酸化されて赤くなるから／血液中に赤い色素が溶けているから）とのちがいをおさえておこう。"},
  {id:"trivia63", cat:"雑学", sub:"化学", q:"炭酸飲料を振ると泡が出やすくなる理由として正しいものはどれか。", choices:["振ることで新しいCO₂が生成されるから","振ることで溶けていたCO₂が気体に戻りやすくなるから","振ることで飲料が化学変化を起こすから","振ることで飲料の温度が下がり飽和度が下がるから"], diff:"標準", a:1, e:"【ことばの意味】「圧力」＝面積あたりにかかる力（力÷面積）／「溶解度」＝決まった量の水にとける最大の量【解説】CO₂は圧力をかけると水に多く溶ける（ヘンリーの法則）。振ることで溶けていたCO₂が不安定になり、核生成点から気化しやすくなる。蓋を開けると圧力が下がるためさらに溶解度が下がり泡が出る。【まちがえやすい点】ほかの選択肢（振ることで新しいCO₂が生成されるから／振ることで飲料が化学変化を起こすから）とのちがいをおさえておこう。"},
  {id:"trivia66", cat:"雑学", sub:"環境", q:"砂漠が乾燥している主な理由の一つとして正しいものはどれか。", choices:["砂漠は地球の内部熱が特に高い場所だから","亜熱帯高圧帯では下降気流が卓越して雲が発生しにくく、雨が少ない","砂漠は植物が少ないため植物が水を吸収してしまうから","砂漠では太陽が常に真上から照らすから"], diff:"基礎", a:1, e:"亜熱帯（緯度20〜30°付近）は大気の大循環で下降気流が卓越する高圧帯が位置する。下降気流は断熱圧縮で温度上昇し、相対湿度が下がるため雲が発生しにくく、降雨量が少なくなる。サハラ・アラビア・オーストラリア砂漠はこの緯度帯にある。"},
  {id:"trivia67", cat:"雑学", sub:"科学史", q:"ガリレオ・ガリレイが「それでも地球は動く」と言ったとされる背景として正しいものはどれか。", choices:["地動説（地球が太陽のまわりを回る）を主張して宗教裁判にかけられたことによる","地球の自転を発見して公表したところ、科学界から批判されたから","天動説を否定した最初の科学者として裁かれたから","地動説の論文のタイトルとして使われた言葉だから"], diff:"基礎", a:0, e:"【解説】ガリレオは望遠鏡による天体観測から地動説を支持したが、当時のカトリック教会の宗教裁判で地動説を否定させられた。その後「それでも地球は動く」という言葉を残したとされる（実際には伝説的表現の可能性あり）。【まちがえやすい点】ほかの選択肢（地球の自転を発見して公表したところ、科学界か…／天動説を否定した最初の科学者として裁かれたか…）とのちがいをおさえておこう。"},
  {id:"trivia68", cat:"雑学", sub:"物理", q:"救急車のサイレンがドップラー効果によって変化する様子として正しいものはどれか。", choices:["救急車が近づくときサイレンが高く聞こえ、遠ざかるときは低く聞こえる","救急車が遠ざかるとき音量が大きくなるとされている","音源が止まっていれば観測者が動いてもドップラー効果は起きない","ドップラー効果は光では起きないと考えられている"], diff:"基礎", a:0, e:"ドップラー効果：音源が近づくと音波が圧縮されて振動数が増え高く聞こえ、遠ざかると振動数が減り低く聞こえる。光でも起きる（銀河の赤方偏移）が、日常生活では速度が遅すぎて体験しにくい。観測者が動いた場合でもドップラー効果は起きる。"},
  {id:"trivia69", cat:"雑学", sub:"環境", q:"二酸化炭素（CO₂）が温暖化に関わる理由として正しいものはどれか。", choices:["地球が出す赤外線（熱）を吸収して、宇宙へ逃げる熱を減らすはたらきがあるから","CO₂は酸素より重く、地球の大気を圧迫するから","CO₂は太陽光を吸収して地球を温めるから","CO₂はオゾン層を破壊して紫外線が増えるから"], diff:"標準", a:0, e:"【温室効果のしくみ】太陽からの光（可視光）は大気をほぼそのまま通り抜けて地表に届きます。地表はその熱を赤外線として宇宙に向けて放出しますが、大気中のCO₂や水蒸気がこの赤外線を吸収し、一部を地表にもどしてしまいます。これを温室効果といいます。／【なぜ問題？】CO₂が増えるほどこの効果が強まり、地球全体の気温が上がりやすくなります。／【まちがえやすい点】オゾン層破壊の主な原因はフロンであり、CO₂とは別の問題です。"},
  {id:"trivia70", cat:"雑学", sub:"生物", q:"植物が秋に葉を赤くする（紅葉する）主な理由として正しいものはどれか。", choices:["葉の中の緑色の色素（クロロフィル）が分解され、もともとあった赤い色素が目立つようになるから","気温が下がると葉に赤い色素が新しくつくられるから","紅葉は葉が枯れる前に出す特別な化学物質の色であるから","冷たい空気に直接ふれることで葉の細胞が赤く変色するから"], diff:"標準", a:0, e:"【なぜ紅葉する？】秋になり気温が下がって日照時間が短くなると、葉の付け根に「離層」という仕切りができて、葉から栄養が送られなくなります。すると緑色の色素クロロフィルが分解されて消えていき、もともと葉の中にあった別の色素（アントシアニンなど）の色が目立つようになります。／【色ごとのちがい】カエデの赤色はアントシアニンという新しくつくられる色素、イチョウの黄色はカロテノイドという最初からある色素が目立つことで生まれます。"},
  {id:"phy251", cat:"物理", sub:"力の働き", q:"バネを直列につないだ場合と並列につないだ場合で、同じ力を加えたときの伸びの違いとして正しいものはどれか。", choices:["直列の方が伸びが小さい","直列の方が伸びが大きい","どちらも伸びは同じ","並列の方が伸びが大きい"], diff:"標準", a:1, e:"【ことばの意味】「直列」＝電気の通り道が1本道のつなぎ方／「並列」＝電気の通り道が枝分かれしているつなぎ方【解説】直列接続ではそれぞれのバネが同じ力を受けて伸びるため、合計の伸びは2倍になる。並列接続では力が分散されてそれぞれのバネが受ける力が半分になり、伸びは半分になる。バネの直列は「やわらかく」、並列は「かたく」なる。【まちがえやすい点】ほかの選択肢（直列の方が伸びが小さい／どちらも伸びは同じ）とのちがいをおさえておこう。"},
  {id:"phy252", cat:"物理", sub:"電流と回路", q:"豆電球と鉄線（発熱体）を直列につないだ回路で、鉄線を短くすると豆電球の明るさはどう変わるか。", choices:["明るくなる","暗くなる","変わらない","点滅する"], diff:"基礎", a:0, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】鉄線を短くすると抵抗が小さくなり、回路全体の抵抗が減少する。オームの法則より電圧が一定なら電流が増え、豆電球を流れる電流も増えるので明るくなる。【まちがえやすい点】ほかの選択肢（暗くなる／変わらない）とのちがいをおさえておこう。"},
  {id:"phy253", cat:"物理", sub:"磁界と電流", q:"電磁石の極を逆にする方法として正しいものはどれか。", choices:["巻き数を増やす","電流を大きくする","電流の向きを逆にする","鉄心を外す"], diff:"基礎", a:2, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「磁界」＝磁石の力がはたらいている空間【解説】電磁石の極は電流の向きで決まる（右ねじの法則）。電流の向きを逆にすると磁界の向きも逆になりN極とS極が入れ替わる。巻き数や電流の大きさは磁界の強さを変えるが極の向きは変わらない。【まちがえやすい点】ほかの選択肢（巻き数を増やす／電流を大きくする）とのちがいをおさえておこう。"},
  {id:"phy254", cat:"物理", sub:"光と音", q:"光が空気から水へ進むとき、速さはどうなるか。", choices:["速くなる","遅くなる","変わらない","止まる"], diff:"標準", a:1, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること【解説】光の速さは媒質によって異なり、密度が大きい媒質ほど遅くなる。空気中の光速は約3×10⁸m/sだが、水中では約2.25×10⁸m/sと遅くなる。この速さの違いが屈折の原因である。【まちがえやすい点】ほかの選択肢（速くなる／変わらない）とのちがいをおさえておこう。"},
  {id:"phy255", cat:"物理", sub:"光と音", q:"凹レンズを通過した光の進み方として正しいものはどれか。", choices:["平行な光を一点に集める","平行な光を発散させる","光を反射させる","光の色を変える"], diff:"基礎", a:1, e:"【ことばの意味】「虚像」＝実際には光が集まっていないのに見える像。スクリーンには映らない【解説】凹レンズは中央部が薄く端が厚い形状で、平行に入射した光を発散させる。凸レンズが光を収束させるのと対照的。凹レンズでできる像は常に虚像で、物体より小さく正立している。眼鏡の近視用レンズに使われる。【まちがえやすい点】ほかの選択肢（平行な光を一点に集める／光を反射させる）とのちがいをおさえておこう。"},
  {id:"phy256", cat:"物理", sub:"力の働き", q:"力のつり合いの状態にある物体はどのような運動をしているか。", choices:["加速しながら動いている","静止しているか等速直線運動をしている","減速しながら動いている","円運動をしている"], diff:"基礎", a:1, e:"【ことばの意味】「慣性」＝物体が今の運動の状態を続けようとする性質／「合力」＝複数の力を1つにまとめた力【解説】ニュートンの第1法則（慣性の法則）により、力がつり合っている（合力ゼロ）物体は静止状態か等速直線運動を続ける。加速・減速・向きの変化には必ず合力（不つり合いの力）が必要。【まちがえやすい点】ほかの選択肢（加速しながら動いている／減速しながら動いている）とのちがいをおさえておこう。"},
  {id:"phy258", cat:"物理", sub:"熱の伝わり方", q:"金属は木材よりも冷たく感じる理由として正しいものはどれか。", choices:["金属の温度は木材より低いから","金属は熱伝導率が高いため手の熱を素早く奪う","金属は木材より密度が大きいから","金属は水分を多く含んでいるから"], diff:"標準", a:1, e:"【ことばの意味】「伝導」＝物を伝わって熱が移動すること【解説】室温では金属も木材も同じ温度だが、金属は熱伝導率が高いため手（体温約37℃）から熱を素早く奪う。そのため冷たく感じる。逆に電気毛布などで加熱された金属は木材より熱く感じる。感覚と実際の温度は異なることがある。【まちがえやすい点】ほかの選択肢（金属の温度は木材より低いから／金属は木材より密度が大きいから）とのちがいをおさえておこう。"},
  {id:"phy259", cat:"物理", sub:"運動とエネルギー", q:"摩擦のある水平面で物体を滑らせると、やがて止まる。このとき運動エネルギーはどこへ行くか。", choices:["位置エネルギーに変換される","音エネルギーのみに変換される","主に熱エネルギーに変換される","エネルギーは消滅する"], diff:"基礎", a:2, e:"摩擦によって運動エネルギーは主に熱エネルギー（摩擦熱）に変換される。わずかに音エネルギーも生じる。エネルギーは消滅しない（エネルギー保存の法則）。一度熱に変換されたエネルギーは元の運動エネルギーには戻りにくい（エネルギーの質の低下）。"},
  {id:"phy260", cat:"物理", sub:"エネルギーの利用", q:"火力発電と水力発電で共通しているエネルギー変換の過程はどれか。", choices:["化学エネルギー→熱エネルギーの変換","運動エネルギー→電気エネルギーの変換","位置エネルギー→運動エネルギーの変換","熱エネルギー→運動エネルギーの変換"], diff:"基礎", a:1, e:"【ことばの意味】「運動エネルギー」＝動いている物体がもつエネルギー【解説】火力発電：化学→熱→運動（蒸気タービン）→電気。水力発電：位置→運動（水流）→電気。両方ともタービン（発電機）を回して運動エネルギーを電気エネルギーに変換する過程が共通している。【まちがえやすい点】ほかの選択肢（化学エネルギー→熱エネルギーの変換／位置エネルギー→運動エネルギーの変換）とのちがいをおさえておこう。"},
  {id:"phy261", cat:"物理", sub:"力の働き", q:"水圧の性質として正しいものはどれか。", choices:["水圧は水面に垂直な方向にのみはたらく","水圧は深さが増すほど大きくなり","水圧は物体の形によって変わる","水圧は水の量が多いほど大きくなる"], diff:"基礎", a:1, e:"【ことばの意味】「水圧」＝水が物体を押す力。深いほど大きい【解説】水圧は液体の深さ（ρgh）に比例して増加し、上下左右あらゆる方向に等しくはたらく（パスカルの原理）。深い海では水圧が非常に大きくなるため、深海探査機は特殊な構造が必要。水の量（体積）ではなく深さで決まる。【まちがえやすい点】ほかの選択肢（水圧は水面に垂直な方向にのみはたらく／水圧は物体の形によって変わる）とのちがいをおさえておこう。"},
  {id:"phy262", cat:"物理", sub:"光と音", q:"潜望鏡（ペリスコープ）が使う光の性質はどれか。", choices:["光の屈折","光の全反射","光の反射","光の散乱"], diff:"基礎", a:2, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること／「全反射」＝光がまったく外に出ずに、すべてはね返ること【解説】潜望鏡は2枚の平面鏡（または全反射プリズム）を45°に傾けて配置し、光の反射を利用して上方の像を下方から観察できる。平面鏡での反射では入射角＝反射角（反射の法則）が成立する。【まちがえやすい点】ほかの選択肢（光の屈折／光の全反射）とのちがいをおさえておこう。"},
  {id:"phy263", cat:"物理", sub:"電流と回路", q:"消費電力100Wの電球を1日10時間、30日間使用したときの電力量はいくらか。", choices:["30kWh","3kWh","300kWh","0.3kWh"], diff:"標準", a:0, e:"【ことばの意味】「電力」＝1秒あたりに使う電気エネルギーの量（単位W）／「電力量」＝使った電気エネルギーの合計（電力×時間）【解説】電力量＝電力×時間＝100W×10h×30日＝30000Wh＝30kWh。電力料金は1kWhあたり約25〜30円程度なので、30kWh×約27円＝約810円になる計算。日常生活での電力量計算として重要。【まちがえやすい点】ほかの選択肢（3kWh／300kWh）とのちがいをおさえておこう。"},
  {id:"phy264", cat:"物理", sub:"運動とエネルギー", q:"質量2kgの物体が高さ5mにある。この物体の位置エネルギーはおよそ何Jか（g=10m/s²）。", choices:["10J","100J","1000J","10000J"], diff:"標準", a:1, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「位置エネルギー」＝高い所にある物体がもつエネルギー【解説】位置エネルギーE=mgh＝2kg×10m/s²×5m＝100J。単位はジュール（J）。高さが2倍になれば位置エネルギーも2倍、質量が2倍でも同様。これが斜面やてこの問題の基本になる。【まちがえやすい点】ほかの選択肢（10J／1000J）とのちがいをおさえておこう。"},
  {id:"phy265", cat:"物理", sub:"磁界と電流", q:"コイルに棒磁石を近づけたとき発生する誘導電流の大きさを増やす方法として正しいものはどれか。", choices:["磁石をゆっくり動かす","コイルの巻き数を減らす","より強い磁石を使い、速く動かす","コイルを固定して磁石だけを固定する"], diff:"基礎", a:2, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】電磁誘導で発生する誘導起電力（電圧）は①磁界の変化が速いほど、②磁界が強いほど、③コイルの巻き数が多いほど大きくなる。磁石が静止していると磁界が変化しないため電流は生じない。【まちがえやすい点】ほかの選択肢（磁石をゆっくり動かす／コイルの巻き数を減らす）とのちがいをおさえておこう。"},
  {id:"phy266", cat:"物理", sub:"仕事とエネルギー", q:"仕事率（電力）の単位はどれか。", choices:["J（ジュール）","N（ニュートン）","W（ワット）","Pa（パスカル）"], diff:"基礎", a:2, e:"【ことばの意味】「電力」＝1秒あたりに使う電気エネルギーの量（単位W）／「圧力」＝面積あたりにかかる力（力÷面積）【解説】仕事率（単位時間あたりの仕事量）の単位はW（ワット）。1W＝1J/s。電力もW（ワット）で表し、同じ単位を使う。Jはエネルギー・仕事の単位、Nは力の単位、Paは圧力の単位。【まちがえやすい点】ほかの選択肢（J（ジュール）／N（ニュートン））とのちがいをおさえておこう。"},
  {id:"phy267", cat:"物理", sub:"力の働き", q:"水中の物体にはたらく浮力と重力の大小関係によって何が決まるか。", choices:["物体の温度","物体が浮くか沈むか","物体の形","物体の色"], diff:"基礎", a:1, e:"【ことばの意味】「浮力」＝液体や気体の中で物体を上向きに押す力／「重力」＝地球が物体を引っぱる力【解説】浮力＞重力なら物体は浮き上がり、浮力＜重力なら沈む、浮力＝重力なら水中でその位置に留まる（中性浮力）。浮力は物体が押しのけた水の重さに等しいため、密度が水より小さいものは浮き、大きいものは沈む。【まちがえやすい点】ほかの選択肢（物体の温度／物体の形）とのちがいをおさえておこう。"},
  {id:"phy268", cat:"物理", sub:"電流と回路", q:"電気抵抗の単位と、抵抗が大きいほど電流はどうなるかを正しく述べているものはどれか。", choices:["単位はA（アンペア）、抵抗が大きいほど電流は大きい","単位はΩ（オーム）、抵抗が大きいほど電流は小さい","単位はV（ボルト）、抵抗が大きいほど電流は大きい","単位はΩ（オーム）、抵抗と電流は無関係"], diff:"基礎", a:1, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】抵抗の単位はΩ（オーム）。オームの法則I=V/Rより、電圧が一定のとき抵抗が大きくなるほど電流は小さくなる（反比例）。導線の材質・断面積・長さで抵抗値が変わり、長いほど・細いほど・電気の通りにくい材質ほど抵抗が大きい。【まちがえやすい点】ほかの選択肢（単位はA（アンペア）、抵抗が大きいほど電流は…／単位はV（ボルト）、抵抗が大きいほど電流は大…）とのちがいをおさえておこう。"},
  {id:"phy269", cat:"物理", sub:"運動とエネルギー", q:"振り子の周期（1往復にかかる時間）を長くするにはどうすればよいか。", choices:["おもりを重くする","振り幅を大きくする","糸の長さを長くする","糸を細くする"], diff:"基礎", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）【解説】振り子の周期T=2π√(l/g)で、振り子の長さlの平方根に比例する。おもりの質量・振り幅（小さい場合）は周期に影響しない（ガリレオの発見）。時計やメトロノームはこの原理を利用している。【まちがえやすい点】ほかの選択肢（おもりを重くする／振り幅を大きくする）とのちがいをおさえておこう。"},
  {id:"phy270", cat:"物理", sub:"エネルギーの利用", q:"太陽光発電で電気が生まれる際のエネルギー変換として正しいものはどれか。", choices:["熱エネルギー→電気エネルギー","光エネルギー→電気エネルギー","運動エネルギー→電気エネルギー","化学エネルギー→電気エネルギー"], diff:"基礎", a:1, e:"【ことばの意味】「運動エネルギー」＝動いている物体がもつエネルギー【解説】太陽光発電は太陽電池（光電池）が光エネルギーを直接電気エネルギーに変換する。これは光電効果（光子が電子を弾き出す現象）を利用している。火力・水力・風力は運動エネルギー（タービン回転）を介して電気を生む点で異なる。【まちがえやすい点】ほかの選択肢（熱エネルギー→電気エネルギー／運動エネルギー→電気エネルギー）とのちがいをおさえておこう。"},
  {id:"che215", cat:"化学", sub:"水溶液とイオン", q:"イオンについての説明として正しいものはどれか。", choices:["イオンは電気を帯びていない粒子と考えられている","陽イオンは電子を得た粒子で、陰イオンは電子を失った粒子","陽イオンは電子を失った粒子で、陰イオンは電子を得た粒子","イオンは原子が分裂してできるとされている"], diff:"基礎", a:2, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「陽イオン」＝電子を失って＋の電気を帯びたイオン【解説】原子が電子を失うと正の電荷を帯びた陽イオンに、電子を得ると負の電荷を帯びた陰イオンになる。例：Na→Na⁺＋e⁻（陽イオン化）、Cl＋e⁻→Cl⁻（陰イオン化）。イオン化は化学結合や電気分解の基本概念。【まちがえやすい点】ほかの選択肢（イオンは電気を帯びていない粒子／陽イオンは電子を得た粒子で、陰イオンは電子を…）とのちがいをおさえておこう。"},
  {id:"che217", cat:"化学", sub:"気体の性質", q:"塩素の性質として正しいものはどれか。", choices:["無色無臭で、空気より軽い","黄緑色で刺激臭があり","水に溶けにくく、水上置換で集める","燃焼すると二酸化炭素を発生する"], diff:"基礎", a:1, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】塩素（Cl₂）は黄緑色・刺激臭・有毒な気体。水に溶けてHCl（塩酸）とHClO（次亜塩素酸）を生成し、強い漂白・殺菌作用をもつ。水に溶けやすいため水上置換は不適。下方置換（空気より重い）か上方置換で集める。【まちがえやすい点】ほかの選択肢（無色無臭で、空気より軽い／水に溶けにくく、水上置換で集める）とのちがいをおさえておこう。"},
  {id:"che218", cat:"化学", sub:"物質のすがた", q:"物質の溶解度について正しいものはどれか。", choices:["溶解度は温度が上がるとほとんどの物質で増加する","固体の溶解度は一般に温度が高いほど大きく","溶解度は圧力の変化で変わらない","水100gに溶ける最大量を体積で表した値"], diff:"基礎", a:1, e:"【ことばの意味】「圧力」＝面積あたりにかかる力（力÷面積）／「溶解度」＝決まった量の水にとける最大の量【解説】固体の溶解度は多くの場合温度が高いほど大きくなる（例外：硫酸カルシウムなど）。気体は温度が高いほど溶解度が小さくなり（ヘンリーの法則に関連）、圧力が高いほど大きくなる。炭酸飲料が温まると泡が出るのはこのため。【まちがえやすい点】ほかの選択肢（溶解度は温度が上がると全ての物質で増加する／溶解度は圧力の変化で変わらない）とのちがいをおさえておこう。"},
  {id:"che219", cat:"化学", sub:"化学変化と質量", q:"以下の化学変化のうち、化合（2種類以上の物質が結びついて1種類の物質ができる反応）はどれか。", choices:["酸化銅と炭素を加熱すると銅と二酸化炭素ができる","炭酸水素ナトリウムを加熱すると炭酸ナトリウムと水と二酸化炭素ができる","鉄と硫黄を加熱すると硫化鉄ができる","水を電気分解すると水素と酸素ができる"], diff:"基礎", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「還元」＝物質が酸素をうばわれること【解説】化合：2種類以上の物質→1種類の新物質。Fe＋S→FeS。選択肢1は酸化還元（2種の生成）、選択肢2は熱分解（3種の生成）、選択肢4は電気分解（2種の生成）。化合の逆反応が分解。【まちがえやすい点】ほかの選択肢（酸化銅と炭素を加熱すると銅と二酸化炭素ができ…／炭酸水素ナトリウムを加熱すると炭酸ナトリウム…）とのちがいをおさえておこう。"},
  {id:"che220", cat:"化学", sub:"酸・アルカリと中和", q:"水酸化ナトリウム水溶液の性質として正しいものはどれか。", choices:["赤色リトマスを青に変え、BTB溶液を黄色にする","青色リトマスを赤に変え、酸性を示す","赤色リトマスを青に変え、BTB溶液を青にする","リトマス紙の色を変えず、中性を示す"], diff:"基礎", a:2, e:"NaOHは強塩基（強アルカリ）でpH＞7。赤色リトマスを青に変え（アルカリ性の指標）、BTB溶液は青色になる（酸性→黄、中性→緑、アルカリ性→青）。NaOH水溶液は皮膚を溶かす危険があり、「石鹸水の親戚」と覚えると性質が理解しやすい。"},
  {id:"che221", cat:"化学", sub:"化学反応式", q:"水の分解の化学反応式として正しいものはどれか。", choices:["H₂O→H₂＋O","2H₂O→2H₂＋O₂","H₂O→H₂O₂","H₂O₂→H₂O＋O"], diff:"基礎", a:1, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること【解説】水の電気分解：2H₂O→2H₂＋O₂。原子の数が左辺と右辺で等しくなるよう係数をつける（H:4=4、O:2=2）。係数なしのH₂O→H₂＋Oは原子数が合わない誤りで、酸素Oは自然界ではO₂として存在する。【まちがえやすい点】ほかの選択肢（H₂O→H₂＋O／H₂O→H₂O₂）とのちがいをおさえておこう。"},
  {id:"che222", cat:"化学", sub:"身近な化学変化", q:"植物が光合成で有機物をつくる反応と、ロウソクが燃える反応の関係として正しいものはどれか。", choices:["光合成は無機物から有機物をつくりエネルギーを蓄え、燃焼は有機物を分解してエネルギーを取り出す、たがいに逆向きの反応である","どちらも化学変化で、使う物質と生成物がすべて同じである","どちらも酸素を使わずに進む反応である","どちらも光エネルギーがないと進まない反応である"], diff:"標準", a:0, e:"【光合成】CO₂＋H₂O＋光エネルギー→デンプンなどの有機物＋O₂。無機物から有機物をつくり、エネルギーを蓄える反応です。／【燃焼】有機物＋O₂→CO₂＋H₂O＋熱・光。有機物を分解して、蓄えられていたエネルギーを取り出す反応です。／【関係】使う物質と生成物が入れかわった、ちょうど逆向きの反応になっています。地球上の炭素は、光合成で有機物に取りこまれ、燃焼や呼吸で二酸化炭素にもどる、というサイクルをくり返しています。"},
  {id:"che223", cat:"化学", sub:"水溶液とイオン", q:"硝酸銀（AgNO₃）水溶液に塩酸を加えると白い沈殿ができる。この沈殿の化学式はどれか。", choices:["AgCl","AgNO₃","NaCl","HNO₃"], diff:"基礎", a:0, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】Ag⁺＋Cl⁻→AgCl↓（白色沈殿）。塩化銀AgClは水に溶けにくく白色沈殿を作る。この反応は塩化物イオンCl⁻の検出（定性分析）に利用される。硝酸銀水溶液は感光性があり、皮膚につくと黒く変色する（銀の還元）。【まちがえやすい点】ほかの選択肢（AgNO₃／NaCl）とのちがいをおさえておこう。"},
  {id:"che224", cat:"化学", sub:"物質のすがた", q:"砂糖と食塩を見た目だけで区別しにくいとき、判別する方法として最も適切なものはどれか。", choices:["水に溶かして電気を通すかどうか調べる","どちらも電解質なので判別できない","どちらも非電解質なので判別できない","密度を測定して比較する"], diff:"標準", a:0, e:"食塩（NaCl）はイオン結晶で電解質→水溶液が電気を通す。砂糖（スクロース）は共有結合の分子結晶で非電解質→電気を通さない。この電導性の違いで容易に区別できる。密度も異なるが精密な測定が必要であり、電気を通すかの方が簡便。"},
  {id:"che225", cat:"化学", sub:"化学変化と質量", q:"塩酸と石灰石（炭酸カルシウム）を密閉容器で反応させた場合と開放容器で反応させた場合、反応後の質量はどう異なるか。", choices:["密閉容器では質量が減り、開放容器では変わらない","密閉容器では質量が変わらず","どちらの場合も反応後の質量は増加する","どちらの場合も反応後の質量は変化しない"], diff:"基礎", a:1, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】質量保存の法則は孤立した系で成立する。密閉容器では発生したCO₂が逃げないため全体の質量は変わらない。開放容器ではCO₂が大気に逃げるため、測定される質量は減少する。【まちがえやすい点】ほかの選択肢（密閉容器では質量が減り、開放容器では変わらな…／どちらの場合も反応後の質量は増加する）とのちがいをおさえておこう。"},
  {id:"che226", cat:"化学", sub:"酸化と還元", q:"次の変化のうち、酸化に当たるものはどれか。", choices:["酸化銅（CuO）が加熱されて銅（Cu）になる","鉄（Fe）が空気中でさびて酸化鉄になる","水（H₂O）が電気分解されて水素になる","水素（H₂）が酸化銅から酸素を奪う"], diff:"基礎", a:1, e:"酸化とは「酸素を得ること（または電子を失うこと）」。鉄がさびる（Fe→Fe₂O₃）は鉄が酸素と結合するので酸化。選択肢1・3は酸素を失う（還元）。選択肢4は水素が酸化されながら酸化銅を還元するので、H₂は酸化、CuOは還元される。"},
  {id:"che227", cat:"化学", sub:"気体の性質", q:"二酸化炭素の収集方法として最も適切なものはどれか（収集目的）。", choices:["水上置換（水に溶けにくいから）","上方置換（空気より軽いから）","下方置換（空気より重く、水に少し溶けるから）","下方置換（空気より軽く、水に溶けやすいから）"], diff:"標準", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】CO₂は空気より重い（分子量44＞空気平均29）ので下方置換が適している。水に少し溶けるため水上置換だと純度が下がるが、実験上は使われることもある。NH₃は空気より軽く水溶性が高いので上方置換。【まちがえやすい点】ほかの選択肢（水上置換（水に溶けにくいから）／上方置換（空気より軽いから））とのちがいをおさえておこう。"},
  {id:"che228", cat:"化学", sub:"物質のすがた", q:"次のうち純粋な物質（純物質）はどれか。", choices:["空気","海水","塩酸","蒸留水（純水）"], diff:"基礎", a:3, e:"純物質は1種類の物質のみからなるもの。蒸留水（H₂O）は純物質。空気はN₂・O₂・Ar・CO₂などの混合物。海水はNaCl・MgCl₂などが溶けた混合物。塩酸はHClと水H₂Oの混合物。純物質は融点・沸点が一定という特徴をもつ。"},
  {id:"che229", cat:"化学", sub:"水溶液とイオン", q:"中性の水溶液の性質として正しいものはどれか。", choices:["pH＝7で、H⁺の濃度とOH⁻の濃度が等しい","pH＝7で電気を通さない","pH＞7で電気を通す","ほとんどの中性溶液はNaClを含む"], diff:"基礎", a:0, e:"【ことばの意味】「伝導」＝物を伝わって熱が移動すること／「電解質」＝水にとかすと電気を通す物質【解説】中性溶液（pH7）では[H⁺]=[OH⁻]が成立する。純水も中性だが、電解質が溶けていなければほとんど電気を通さない。食塩水（NaCl水溶液）はほぼ中性だが電解質なので電気をよく通す。中性と電気伝導性は独立した性質。【まちがえやすい点】ほかの選択肢（pH＝7で電気を通さない／pH＞7で電気を通す）とのちがいをおさえておこう。"},
  {id:"che230", cat:"化学", sub:"化学変化と質量", q:"鉄と酸素が反応するとき、鉄3.5gに結合する酸素の質量として正しいものはどれか（鉄と酸素は質量比7:3で反応）。", choices:["1.0g","1.5g","2.1g","3.0g"], diff:"標準", a:1, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「酸化」＝物質が酸素と結びつくこと【解説】鉄:酸素=7:3の比より、鉄3.5gに対して酸素＝3.5×(3/7)＝1.5g。生成する酸化鉄は3.5＋1.5＝5.0g。質量比（定比例の法則）を使う問題では、まず比を確認してから計算することが重要。【まちがえやすい点】ほかの選択肢（1.0g／2.1g）とのちがいをおさえておこう。"},
  {id:"che231", cat:"化学", sub:"身近な化学変化", q:"アルミニウム缶が鉄缶よりさびにくい理由として正しいものはどれか。", choices:["アルミニウムは酸素と反応しないと考えられている","アルミニウムが酸素と反応してできる酸化アルミニウムの薄い膜が表面を覆い","アルミニウムは水分と反応しないからと考えられている","アルミニウムは鉄より電気を通しにくいからと考えられている"], diff:"標準", a:1, e:"アルミニウムは鉄より酸化されやすい（イオン化傾向が大きい）が、表面にできる酸化アルミニウム（Al₂O₃）の薄い緻密な被膜が内部への酸素・水分の侵入を防ぐ（不動態化）。この性質を「耐食性」といい、建材・飛行機など幅広く利用される。"},
  {id:"che232", cat:"化学", sub:"酸・アルカリと中和", q:"酢（酢酸CH₃COOH）が酸性を示す理由として正しいものはどれか。", choices:["酢酸は固体の状態で電離しているとされている","水に溶かすと一部がH⁺とCH₃COO⁻に電離してH⁺を放出する","酢酸は塩基と反応しないからと考えられている","酢酸は常に完全に電離してH⁺を大量に放出するから"], diff:"標準", a:1, e:"酢酸は弱酸で、水中でH⁺とCH₃COO⁻に部分的に電離する（電離度が小さい）。塩酸HClのような強酸は完全に電離するが、酢酸は一部のみ。どちらもH⁺を生成するから酸性を示すが、同じ濃度でも酢酸の方がpHが高い（H⁺濃度が低い）。"},
  {id:"che233", cat:"化学", sub:"物質のすがた", q:"再結晶によって物質を精製できる理由として正しいものはどれか。", choices:["再結晶はほとんどの不純物を除去できるから","物質の溶解度の温度による変化の差を利用して","不純物は温度によらず溶解度が変化しないから","再結晶では溶媒が化学変化を起こして不純物と反応するから"], diff:"標準", a:1, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）／「溶解度」＝決まった量の水にとける最大の量【解説】溶解度が温度によって大きく変化する物質（硝酸カリウムなど）は熱水に溶かして冷却すると結晶として析出し、溶解度の変化が小さい不純物（食塩など）は溶液中に残る。この溶解度の差を利用して精製する。【まちがえやすい点】ほかの選択肢（再結晶は全ての不純物を除去できるから／不純物は温度によらず溶解度が変化しないから）とのちがいをおさえておこう。"},
  {id:"che234", cat:"化学", sub:"化学反応式", q:"水素と酸素から水ができる反応の化学反応式として正しいものはどれか。", choices:["H₂＋O₂→H₂O","2H₂＋O₂→2H₂O","H₂＋O→H₂O","2H₂＋2O₂→2H₂O"], diff:"基礎", a:1, e:"2H₂＋O₂→2H₂O。原子の数：左辺H4・O2、右辺H4・O2で一致。係数なし（選択肢1）はH2・O2→H2・O1で酸素数が不一致。係数2（選択肢4）は右辺O4で不一致。化学反応式のバランスは原子の種類と数が両辺で等しくなるよう確認する。"},
  {id:"che235", cat:"化学", sub:"気体の性質", q:"窒素（N₂）の性質として正しいものはどれか。", choices:["反応性が高く、他の元素と結合しやすい","無色無臭で、空気の約78%を占め、化学的に不活性","水に非常に溶けやすい","強い酸化剤として働く"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】窒素は無色・無臭・無味。空気の約78%を占め、常温では反応性が低い（不活性）。高温・高圧下や放電条件では酸素・水素と反応する（例：工業的なアンモニア合成・ハーバーボッシュ法）。食品の酸化防止にも窒素充填が使われる。【まちがえやすい点】ほかの選択肢（反応性が高く、他の元素と結合しやすい／水に非常に溶けやすい）とのちがいをおさえておこう。"},
  {id:"bio278", cat:"生物", sub:"植物のつくり", q:"花粉が雌しべの柱頭につくことを何というか。", choices:["受精","受粉","生殖","花粉形成"], diff:"基礎", a:1, e:"受粉：花粉が柱頭につくこと。受粉後、花粉管が伸びて精細胞が胚珠の卵細胞と合体するのが受精。受粉→受精→種子形成という順序が重要。自花受粉（同株）と他花受粉（別株）があり、虫媒花・風媒花など花の作りと受粉方法が対応している。"},
  {id:"bio279", cat:"生物", sub:"動物のからだ", q:"骨格筋の収縮（筋肉が縮む）について正しいものはどれか。", choices:["筋肉は引っ張ることと押すことの両方ができる","関節を動かすには対になった筋肉（拮抗筋）が必要","骨格筋は自律神経によって無意識に調節される","骨格筋は心臓のように自ら収縮する"], diff:"基礎", a:1, e:"【解説】骨格筋は収縮（縮む）のみで、伸ばす力は出せない。そのため上腕二頭筋（屈筋）と上腕三頭筋（伸筋）のように対になって働く（拮抗筋）。一方が縮むとき他方が伸びる。心臓の心筋は不随意筋、骨格筋は随意筋（意識的に動かせる）。【まちがえやすい点】ほかの選択肢（筋肉は引っ張ることと押すことの両方ができる／骨格筋は自律神経によって無意識に調節される）とのちがいをおさえておこう。"},
  {id:"bio282", cat:"生物", sub:"生物とかんきょう", q:"外来種（外来生物）が問題になる理由として正しいものはどれか。", choices:["もとの生息地にいた天敵や寄生虫が移入先にはいないため、急に数が増えすぎることがある","外来種は在来種より身体が小さいから","外来種は食物連鎖に参加しないから","外来種はつねに農業被害をもたらすから"], diff:"標準", a:0, e:"【ことばの意味】「外来種」＝もともとその地域にいなかったのに、人間の活動によって他の地域から運びこまれた生物。／【なぜ増えすぎる？】もとの生息地には天敵や競争相手、寄生虫がいて数が抑えられていましたが、移入先にはそれらがいないため、急激に数が増えることがあります。／【在来種への影響】食料や生息場所をうばったり、在来種を食べたりすることで、もといた生物（在来種）を絶滅に追いこんでしまう例もあります。"},
  {id:"bio284", cat:"生物", sub:"細胞", q:"細胞分裂のとき最初に見られる変化として正しいものはどれか。", choices:["細胞膜が厚くなる","細胞質が分かれる","核の中に染色体が現れる","細胞壁が分解される"], diff:"基礎", a:2, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「染色体」＝細胞の核の中にある、遺伝情報をもつひも状のもの【解説】体細胞分裂では①染色体が凝集して現れる②中央に並ぶ③両端に引き寄せられる④細胞質が分かれる⑤2個の細胞になる、という順序で進む。染色体はふだんは糸状のクロマチンで核の中に存在し、分裂期に凝集して見えるようになる。【まちがえやすい点】ほかの選択肢（細胞膜が厚くなる／細胞質が分かれる）とのちがいをおさえておこう。"},
  {id:"bio285", cat:"生物", sub:"動物のからだ", q:"ヒトの体液（血液・組織液・リンパ液）の循環について正しいものはどれか。", choices:["血しょうの一部が毛細血管から染み出して組織液になり","リンパ液は直接動脈に流れ込む","組織液は細胞の外に出ることがない","血液と組織液は全く異なる成分からなる"], diff:"基礎", a:0, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】血しょう（液体成分）の一部が毛細血管から染み出して組織液（細胞間液）になり、細胞への物質供給・老廃物回収を行う。組織液の一部はリンパ管に吸収されてリンパ液（白血球を含む）となり、最終的に静脈に合流する。【まちがえやすい点】ほかの選択肢（リンパ液は直接動脈に流れ込む／組織液は細胞の外に出ることがない）とのちがいをおさえておこう。"},
  {id:"bio286", cat:"生物", sub:"生物の観察", q:"プレパラートをつくるとき、カバーガラスを斜めから置く理由として正しいものはどれか。", choices:["標本を広く観察するため","気泡（空気の泡）が入りにくくなる","染色液を素早く吸収するため","倍率を上げるため"], diff:"標準", a:1, e:"【解説】カバーガラスを斜め（約45°）にして片端から置くことで空気が逃げやすくなり、気泡（観察の邪魔になる丸い泡）が入りにくくなる。気泡が入ると観察しにくくなるため、この操作は基本的な実験技術として重要。【まちがえやすい点】ほかの選択肢（標本を広く観察するため／染色液を素早く吸収するため）とのちがいをおさえておこう。"},
  {id:"bio288", cat:"生物", sub:"動物のからだ", q:"感覚器官と受容する刺激の組み合わせとして正しいものはどれか。", choices:["耳：光の刺激を受容する","目：音の振動を受容する","皮膚：温度・圧力・痛みを受容する","鼻：音の振動を受容する"], diff:"基礎", a:2, e:"【ことばの意味】「圧力」＝面積あたりにかかる力（力÷面積）【解説】皮膚には温覚・冷覚・触覚・圧覚・痛覚の受容器が分布する。目（光）・耳（音）・鼻（においの化学物質）・舌（味の化学物質）・皮膚（温度・圧力・痛み）というように、各感覚器官は特定の刺激の種類（適刺激）に対応している。【まちがえやすい点】ほかの選択肢（耳：光の刺激を受容する／目：音の振動を受容する）とのちがいをおさえておこう。"},
  {id:"bio289", cat:"生物", sub:"生物とかんきょう", q:"地球温暖化が生態系に与える影響として考えられることとして正しいものはどれか。", choices:["気温上昇によってほとんどの生物の個体数が増加する","生物の分布域の変化、春の訪れ時期のずれ","温暖化は植物の光合成を低下させるため生態系全体が縮小する","深海の生態系には影響が及ばない"], diff:"標準", a:1, e:"温暖化による生態系への影響：①分布域の変化（熱帯性の種が高緯度に移動）②季節のずれ（花咲き・渡り鳥の時期変化）③サンゴ礁の白化（高水温でサンゴが共生藻を失う）④氷河・海氷の減少（北極グマなど氷依存種に影響）など多岐にわたる。"},
  {id:"bio290", cat:"生物", sub:"植物のつくり", q:"裸子植物と被子植物の種子の違いについて正しいものはどれか。", choices:["裸子植物は胚珠がむき出しで、被子植物は子房の中に胚珠が包まれている","裸子植物は子房の中に胚珠が包まれ、被子植物は胚珠がむき出しである","どちらも同じつくりで種子ができる","裸子植物は果実を作り、被子植物は種子だけを作る"], diff:"基礎", a:0, e:"【ことばの意味】「胚珠」＝受精すると種子になる部分。「子房」＝受精すると果実になる部分。／【裸子植物】マツ・イチョウ・スギなど。胚珠がむき出しになっていて、子房がありません。だから果実はできず、種子だけができます。／【被子植物】アブラナ・サクラなど、ほとんどの花をさかせる植物。子房が胚珠を包んでいます。受精後、胚珠は種子に、子房は果実になります。／【まちがえやすい点】「被子」は「子（胚珠）が被（おお）われている」という意味です。ことばの意味から覚えると区別しやすくなります。"},
  {id:"bio291", cat:"生物", sub:"細胞", q:"オオカナダモの葉を光学顕微鏡で観察すると見えるものはどれか。", choices:["核・細胞壁・葉緑体","電子・陽子・中性子","タンパク質の立体構造","分子の振動"], diff:"基礎", a:0, e:"【ことばの意味】「光学顕微鏡」＝光を利用して物を大きく見る道具（学校で使う顕微鏡）。倍率はおよそ40〜600倍程度です。／【見えるもの】オオカナダモの葉の細胞では、核（丸いつぶ）・細胞壁（周りのしきり）・葉緑体（緑色のつぶで光合成を行う）がはっきり観察できます。とくに葉緑体は細胞の中を流れるように動く様子（原形質流動）も見えることがあります。／【見えないもの】原子や分子、タンパク質の細かい構造などは非常に小さく、光学顕微鏡では見えません。もっと強力な電子顕微鏡が必要です。"},
  {id:"bio292", cat:"生物", sub:"動物のからだ", q:"ヒトのアミラーゼ（だ液中の消化酵素）が最もよくはたらく温度として正しいものはどれか。", choices:["10℃前後","37℃前後（体温付近）","60℃前後","100℃前後"], diff:"基礎", a:1, e:"酵素は最適温度（至適温度）があり、体内の酵素の多くは体温付近（37℃前後）で最もよくはたらく。高温（60℃以上）になるとタンパク質が変性して失活する。低温では反応速度が低下するが変性しないため、冷蔵すれば活性が戻る場合がある。"},
  {id:"bio293", cat:"生物", sub:"生物の観察", q:"顕微鏡観察で倍率を高くしたとき、視野の明るさはどう変化するか。", choices:["明るくなる","変わらない","暗くなる","点滅する"], diff:"標準", a:2, e:"倍率を高くすると視野が狭くなり、同じ量の光が狭い範囲に集まるわけではなく、実際には視野が暗くなる。高倍率では絞りを開いたり光源を明るくしたりして調節する必要がある。また高倍率ほど焦点深度が浅くなり、ピントが合いにくくなる。"},
  {id:"bio294", cat:"生物", sub:"生態系", q:"窒素循環において、土中の細菌が担う役割として正しいものはどれか。", choices:["大気中の窒素を固定して植物が利用できる形にする","窒素を直接光合成に使う","窒素を大気中に全て放出して循環を止める","窒素は細菌とは無関係に循環する"], diff:"基礎", a:0, e:"窒素循環における細菌の役割：①窒素固定菌（根粒菌など）：N₂→NH₃（アンモニア）→植物が利用できる形に。②硝化菌：NH₃→NO₃⁻（硝酸塩）。③分解者：有機物中の窒素→NH₃に。④脱窒菌：NO₃⁻→N₂（大気に戻す）。細菌なしには窒素循環が成立しない。"},
  {id:"bio295", cat:"生物", sub:"生物の進化", q:"化石が進化の証拠になる理由として正しいものはどれか。", choices:["化石から生物の遺伝子配列が直接わかるから","生物が時代とともに変化してきた（進化した）様子がわかる","化石は現在の生物とほぼ同じ形をしているから","化石は特定の環境でのみ形成されるため環境の変化を示さない"], diff:"標準", a:1, e:"【解説】古い地層の化石には現在と異なる生物が多く、年代が新しくなるにつれて現在の生物に近い形の化石が現れる。これが生物が時代とともに変化（進化）してきた証拠となる。始祖鳥（鳥と爬虫類の中間形態）などの移行化石が特に重要な証拠。【まちがえやすい点】ほかの選択肢（化石から生物の遺伝子配列が直接わかるから／化石は現在の生物と全く同じ形をしているから）とのちがいをおさえておこう。"},
  {id:"ear266", cat:"地学", sub:"地層と岩石", q:"地層の傾きや断層から分かることとして正しいものはどれか。", choices:["地層の傾きから堆積した時の水温がわかる","断層や褶曲は地殻変動によって生じたことがわかる","地層が傾いていても地殻変動とは無関係","断層は地震とは無関係に形成される"], diff:"基礎", a:1, e:"【解説】水平に堆積した地層が傾いたり波打ったり（褶曲）するのは、地殻変動（大地に横からの力がはたらく）によるもの。断層（地層のずれ）は地震の原因にも結果にもなる。地層の観察から大地の変動の歴史を読み取ることができる（地史学）。【まちがえやすい点】ほかの選択肢（地層の傾きから堆積した時の水温がわかる／地層が傾いていても地殻変動とは無関係）とのちがいをおさえておこう。"},
  {id:"ear267", cat:"地学", sub:"火山と地震", q:"震度とマグニチュードの違いとして正しいものはどれか。", choices:["震度は地震のエネルギーの大きさ、マグニチュードは揺れの強さ","マグニチュードは地震のエネルギーの大きさ（規模）","震度とマグニチュードは同じ意味","マグニチュードが大きいほど震源が浅いことを示す"], diff:"標準", a:1, e:"【ことばの意味】「震源」＝地下で地震が発生した場所／「マグニチュード」＝地震そのものの規模（エネルギーの大きさ）【解説】マグニチュード（M）：地震のエネルギー規模を表す（1増えるとエネルギー約32倍）。震度：ある地点での揺れの強さ（0〜7、震度5と6は「強・弱」で10段階）。同じMの地震でも震源からの距離・地盤によって震度は異なる。【まちがえやすい点】ほかの選択肢（震度は地震のエネルギーの大きさ、マグニチュー…／震度とマグニチュードは同じ意味）とのちがいをおさえておこう。"},
  {id:"ear268", cat:"地学", sub:"天気", q:"高気圧と低気圧の上昇気流・下降気流の関係として正しいものはどれか。", choices:["高気圧では上昇気流が発生して雲ができやすい","低気圧では下降気流が発生して晴れやすい","高気圧では下降気流が発生して晴れやすく","高気圧と低気圧は気流の向きに関係しない"], diff:"標準", a:2, e:"【ことばの意味】「湿度」＝空気がどれくらい水蒸気をふくんでいるかの割合／「高気圧」＝まわりより気圧が高い所。下降気流で晴れやすい【解説】高気圧：周囲から風が吹き込みにくい→中心で下降気流→断熱圧縮で温度上昇→相対湿度低下→雲が消えやすい→晴天。低気圧：中心に風が集まる→上昇気流→断熱膨張で冷却→水蒸気が凝結→雲が発生→雨になりやすい。【まちがえやすい点】ほかの選択肢（高気圧では上昇気流が発生して雲ができやすい／低気圧では下降気流が発生して晴れやすい）とのちがいをおさえておこう。"},
  {id:"ear269", cat:"地学", sub:"天体の動き", q:"地球が太陽のまわりを公転することで生じる現象はどれか。", choices:["昼と夜の変化","季節の変化と星座の年周変化","月の満ち欠け","潮の満ち引き"], diff:"基礎", a:1, e:"公転（1年周期）によって生じる現象：①季節変化（地軸の傾きと公転の組み合わせ）②星座の年周変化（見える星座が季節によって変わる）。自転（1日周期）：昼と夜の変化・日周変化。月の満ち欠けは月の公転。潮の満ち引きは月と太陽の引力。"},
  {id:"ear270", cat:"地学", sub:"地球と宇宙", q:"月面上では地球上よりも物体が軽く感じられる理由として正しいものはどれか。", choices:["月には空気がなく浮力が大きいから","月の質量が地球より小さいため重力が弱く","月が回転しているから","月の表面温度が地球より低いから"], diff:"標準", a:1, e:"重力は天体の質量と距離によって決まる。月の質量は地球の約1/81で半径も小さいが、総合的に月面での重力は地球の約1/6になる。60kgの人が月面では約10kgの重さで感じられる。質量（物質の量）は変わらず、重力（重さ）のみが変化する。"},
  {id:"ear271", cat:"地学", sub:"地層と岩石", q:"生物の遺骸などが岩石になるための条件として正しいものはどれか。", choices:["生物の遺骸が地表に露出し続けることで化石化する","遺骸が堆積物に素早く埋まり","化石は温度が高い環境でのみ形成される","ほとんどの生物の遺骸は化石になれる"], diff:"基礎", a:1, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること【解説】化石の形成には①生物が死後すぐに堆積物に埋まる（分解・散逸を防ぐ）②長い時間をかけて岩石化（鉱化）する条件が必要。地表では風化・分解が進んで化石になりにくい。硬い殻・骨・歯は軟体部より化石化しやすい。【まちがえやすい点】ほかの選択肢（生物の遺骸が地表に露出し続けることで化石化す…／化石は温度が高い環境でのみ形成される）とのちがいをおさえておこう。"},
  {id:"ear272", cat:"地学", sub:"天気", q:"日本に上陸する台風が秋（9〜10月）に多い理由として正しいものはどれか。", choices:["秋は日本付近の気温が台風の発生に最適だから","夏に発生した台風が転向点を回って日本に近づき","秋には海面水温が最も高く、台風が最も多く発生するから","秋は台風の進路を変える高気圧が消えるから"], diff:"標準", a:1, e:"【ことばの意味】「高気圧」＝まわりより気圧が高い所。下降気流で晴れやすい【解説】台風は夏から秋にかけて発生のピーク（海面水温が高い時期）。夏の太平洋高気圧が大きいと台風は南や東を回るが、秋に高気圧が後退すると台風が転向点を越えて偏西風に乗り、日本列島方向（北東方向）へ進みやすくなる。【まちがえやすい点】ほかの選択肢（秋は日本付近の気温が台風の発生に最適だから／秋には海面水温が最も高く、台風が最も多く発生…）とのちがいをおさえておこう。"},
  {id:"ear273", cat:"地学", sub:"地球と宇宙", q:"星（恒星）の色が異なる理由として正しいものはどれか。", choices:["星の大きさによって色が決まる","星の表面温度によって色が決まり","星の距離によって色が決まる","星の年齢によって同じ色になる"], diff:"標準", a:1, e:"恒星の色は表面温度に依存する。高温（3万K以上）→青白い星、中温（6000K程度）→黄色（太陽）、低温（3000K程度）→赤い星。オリオン座のベテルギウスが赤い（低温）のに対し、リゲルが青白い（高温）のはこの違いによる。"},
  {id:"ear274", cat:"地学", sub:"天体の動き", q:"月が常に同じ面を地球に向けている理由として正しいものはどれか。", choices:["月は自転していないからと考えられている","月の自転周期と地球のまわりを公転する周期がほぼ等しい","地球の重力によって月の自転が止まったから","月の裏側は暗くて観察できないからと考えられている"], diff:"標準", a:1, e:"月の自転周期≒公転周期（ともに約27.3日）のため、地球から見ると常に同じ面だけが見える（同期自転・潮汐固定）。これは地球の潮汐力で月の自転が長い時間をかけてゆっくりになった結果。月の裏側は地球からは見えないが、宇宙探査機で撮影されている。"},
  {id:"ear275", cat:"地学", sub:"火山と地震", q:"日本が地震・火山活動が多い地域である理由として正しいものはどれか。", choices:["日本は地球の中心に近い位置にあるから","日本付近では複数のプレートが境界を接しており","日本の地殻は特別な岩石でできているから","日本は赤道に近く気温が高いため地殻が活動しやすいから"], diff:"標準", a:1, e:"日本列島はユーラシアプレート・北米プレート・太平洋プレート・フィリピン海プレートの4枚のプレートが接する地域。海洋プレートが大陸プレートの下に沈み込む（沈み込み帯）と、地震・火山活動が活発になる。環太平洋火山帯（火の輪）に位置する。"},
  {id:"ear276", cat:"地学", sub:"大気と海洋", q:"季節風（モンスーン）が生じる原因として正しいものはどれか。", choices:["太陽の位置が季節によって変化するから","季節ごとに気圧配置が変わって風向きが変わる","地球の自転速度が季節によって変化するから","月の引力が季節によって強弱するから"], diff:"基礎", a:1, e:"【ことばの意味】「高気圧」＝まわりより気圧が高い所。下降気流で晴れやすい／「低気圧」＝まわりより気圧が低い所。上昇気流で雨が降りやすい【解説】夏：大陸が海洋より暑く（比熱小）低気圧になる→海から大陸へ湿った風（夏の南東モンスーン→太平洋から湿気→梅雨・台風）。冬：大陸が冷えて高気圧→大陸から海へ乾いた冷たい風（冬の北西モンスーン→日本海側に雪）。【まちがえやすい点】ほかの選択肢（太陽の位置が季節によって変化するから／地球の自転速度が季節によって変化するから）とのちがいをおさえておこう。"},
  {id:"ear277", cat:"地学", sub:"天体の動き", q:"日本（北緯35°付近）での冬至の太陽の南中高度として最も近いものはどれか。", choices:["約55°","約78°","約31°","約12°"], diff:"基礎", a:2, e:"南中高度＝90°－緯度±黄道傾斜角（23.4°）。冬至：90°－35°－23.4°＝31.6°≒31°。夏至：90°－35°＋23.4°＝78.4°≒78°。春分・秋分：90°－35°＝55°。緯度が高いほど（北ほど）冬の南中高度は低くなり、日照時間も短くなる。"},
  {id:"trivia71", cat:"雑学", sub:"化学", q:"アルカリ電池とマンガン電池の違いとして正しいものはどれか。", choices:["アルカリ電池は充電できるが、マンガン電池はできない","アルカリ電池は電解液に水酸化カリウムを使い、大電流が取り出せる","マンガン電池の方が容量が大きく、長持ちする","どちらもほぼ同じ仕組みで動くと考えられている"], diff:"標準", a:1, e:"アルカリ電池はKOH（アルカリ性）の電解液を使い、内部抵抗が低いため大電流を継続して取り出しやすい。マンガン電池は塩化亜鉛（弱酸性）を使い、休ませると回復するという特性がある（間欠的使用に向く）。どちらも一次電池（充電不可）。"},
  {id:"trivia72", cat:"雑学", sub:"生物", q:"花の色は何によって決まるか。", choices:["花の細胞の大きさ","花弁に含まれる色素","花が受け取る光の量","花の水分量"], diff:"基礎", a:1, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】花の色はアントシアニン（赤・紫・青）・カロテノイド（橙・黄）・フラボノイド（黄・白）などの色素による。アントシアニンはpHによって色が変わり（酸性で赤、塩基性で青）、アジサイの色の変化は土壌のpHと関係している。【まちがえやすい点】ほかの選択肢（花の細胞の大きさ／花が受け取る光の量）とのちがいをおさえておこう。"},
  {id:"trivia73", cat:"雑学", sub:"物理", q:"「1気圧」はどのくらいの圧力か。", choices:["約1000Pa","約10万Pa","約100Pa","約1000万Pa"], diff:"基礎", a:1, e:"1気圧（標準大気圧）＝101325Pa≒100kPa≒1013hPa。天気予報で使うhPa（ヘクトパスカル）で表すと約1013hPa。これは高さ約76cmの水銀柱の圧力に相当する（760mmHg）。高度が1000m上がると気圧は約100hPa下がる。"},
  {id:"trivia74", cat:"雑学", sub:"地球", q:"地球の表面積のうち海洋が占める割合はおよそどれくらいか。", choices:["約50%","約71%","約30%","約90%"], diff:"標準", a:1, e:"【ことばの意味】「惑星」＝太陽のまわりを回り、太陽の光を反射して光る星【解説】地球の表面積の約71%が海洋（海）で、約29%が陸地。海洋の平均深さは約3800m、陸地の平均高度は約840m。海の総体積は陸地の体積をはるかに上回る。地球が「水の惑星」と呼ばれる所以。【まちがえやすい点】ほかの選択肢（約50%／約30%）とのちがいをおさえておこう。"},
  {id:"trivia75", cat:"雑学", sub:"化学", q:"石鹸がよごれを落とせる仕組みとして正しいものはどれか。", choices:["石鹸の強い酸性がよごれを分解すると考えられている","石鹸分子は水になじむ部分（親水基）と油になじむ部分（疏水基）をもち","石鹸は高温の水としか反応しないと考えられている","石鹸は細菌を直接殺菌すると考えられている"], diff:"標準", a:1, e:"石鹸（脂肪酸ナトリウム）は界面活性剤の一種。疏水基（親油性）が油性よごれに取り付き、親水基が水になじむことでミセル（油を水に分散させた状態）を形成する。よごれが水で流されやすくなる。石鹸は弱アルカリ性だが、強酸性ではない。"},,
  {id:"phy401", cat:"物理", sub:"力の働き", q:"物体を持ち上げるのに必要な力の大きさは、何によって決まるか。", choices:["物体の重さ（質量）","物体の色","物体を持ち上げる速さ","持ち上げる人の身長"], diff:"基礎", a:0, e:"【考え方】物体をまっすぐ持ち上げるのに必要な力は、その物体にはたらく重力の大きさと同じです。重力の大きさは物体の質量によって決まるため、重い物体ほど持ち上げるのに大きな力が必要になります。／【まちがえやすい点】物体の色や持ち上げる速さは、必要な力の大きさには直接関係ありません。持ち上げる人の力の強さによって「楽にできるか大変か」は変わりますが、必要な力そのものは変わりません。"},
  {id:"phy402", cat:"物理", sub:"光と音", q:"物体が光を出さずに見えるのはなぜか。", choices:["物体に当たった光がはね返って目に届くから","物体が自分でわずかに光を出しているから","目が物体に向かって光を出しているから","空気中の音が目に伝わるから"], diff:"基礎", a:0, e:"【考え方】太陽や電球のように自分で光を出す物体を光源といいます。光源以外の物体（机やノートなど）は自分では光を出しませんが、光源からの光がその物体に当たってはね返り（反射し）、その反射した光が目に届くことで見えています。／【暗い部屋では】光源がない真っ暗な部屋では、物に光が当たらないため反射する光もなく、物が見えなくなります。"},
  {id:"phy403", cat:"物理", sub:"力の働き", q:"重さ40Nの物体を10Nの力で持ち上げようとしても持ち上がらなかった。この理由として正しいものはどれか。", choices:["加えた力が重力より小さいから","加えた力の向きが間違っているから","物体の色が影響しているから","気温が低いから"], diff:"基礎", a:0, e:"【考え方】物体を持ち上げるには、物体にはたらく重力（この場合40N）と同じか、それより大きい力を上向きに加える必要があります。10Nの力では重力の40Nに届かないため、物体を持ち上げることができません。／【まちがえやすい点】力の向き自体は正しく上向きに加えているという前提であれば、単純に力の大きさが足りないことが原因です。"},
  {id:"phy404", cat:"物理", sub:"電流と回路", q:"豆電球と乾電池を導線でつなぎ、豆電球が光る回路を作った。導線の一部を切ると豆電球はどうなるか。", choices:["消える","そのまま光り続ける","逆に明るくなる","色が変わる"], diff:"基礎", a:0, e:"【考え方】電流が流れるためには、電池から出発して豆電球を通り、再び電池にもどる、輪のようにつながった回路（閉じた回路）が必要です。導線の一部を切ってしまうと、この輪が途切れて電流が流れなくなるため、豆電球は消えます。／【身近な例】スイッチを切るのも、この「回路をわざと切る」操作にあたります。"},
  {id:"phy405", cat:"物理", sub:"力の働き", q:"力の大きさや向きを、矢印を使って表す図を何というか。", choices:["力の矢印（力の図示）","分子模型図","回路図","記録テープ"], diff:"基礎", a:0, e:"【ことばの意味】力は目に見えないため、矢印を使って図に表すことがよくあります。矢印の向きは力の向き、矢印の長さは力の大きさ、矢印の根もとは力がはたらく点（作用点）を表します。／【読み取り方】同じ物体に矢印が2本かかれているとき、矢印が長いほど大きな力がはたらいていることを示しています。理科の問題でよく登場する、力を目で見えるようにするための表し方です。"},
  {id:"phy406", cat:"物理", sub:"熱の伝わり方", q:"金属製のスプーンと木製のスプーンを同じ温度のお湯に入れたとき、持ち手が先に熱くなるのはどちらか。", choices:["金属製のスプーン","木製のスプーン","どちらも同時に熱くなる","どちらも熱くならない"], diff:"基礎", a:0, e:"【ことばの意味】「熱伝導」＝物質の中を熱が伝わっていく現象。金属は熱を伝えやすい性質（熱伝導率が高い）をもっています。／【なぜ金属が先に熱くなる？】金属は熱をよく伝えるため、お湯につかった部分の熱が持ち手まですばやく伝わります。木は熱を伝えにくい性質（断熱性が高い）があるため、持ち手まで熱が伝わるのに時間がかかります。調理器具の持ち手に木やプラスチックが使われるのはこのためです。"},
  {id:"phy407", cat:"物理", sub:"力の働き", q:"2本の同じばねを直列につなぎ、その端に同じおもりをつるした。1本だけのときと比べて、全体の伸びはどうなるか。", choices:["2本つないだ方が伸びは大きくなる","2本つないだ方が伸びは小さくなる","伸びは変わらない","ばねはまったく伸びなくなる"], diff:"標準", a:0, e:"【考え方】同じばねを直列（縦に一列）につなぐと、それぞれのばねに同じ大きさの力（おもりの重さ）がかかり、それぞれが同じだけ伸びます。2本分の伸びが合計されるため、1本のときよりも全体の伸びは大きくなります。／【並列の場合】逆に2本を並列（横に並べる）につないでおもりを支えると、1本あたりが受け持つ力が半分になるため、伸びは1本のときより小さくなります。"},
  {id:"phy408", cat:"物理", sub:"運動とエネルギー", q:"止まっていた物体に一定の力を加え続けると、物体の速さはどうなるか。", choices:["だんだん速くなっていく","一定の速さのまま動く","だんだん遅くなっていく","力を加えても動かない"], diff:"基礎", a:0, e:"【考え方】止まっている物体に一定の力を加え続けると、物体は加速していきます（速さがだんだん増していきます）。力がはたらき続ける限り、物体の速さは増加し続けます。／【身近な例】自転車をこぎ続けると、こぎ始めよりもだんだん速くなっていくのはこの現象の一例です。摩擦や空気抵抗がなければ、力を加え続けるほど速さは増え続けます。"},
  {id:"phy409", cat:"物理", sub:"力の働き", q:"物体にはたらく2つの力が反対向きで大きさが等しいとき、これらの力の関係を何というか。", choices:["力がつり合っている","力が合成されている","力が分解されている","力が消滅している"], diff:"基礎", a:0, e:"【ことばの意味】「力のつり合い」＝2つ以上の力の効果が打ち消し合い、全体としての効果が0になっている状態。／【条件】力がつり合うためには、①大きさが等しい②向きが反対③同一直線上にはたらく、という3つの条件が必要です。／【身近な例】綱引きで両チームの力が同じ大きさで引き合っているとき、綱は動かず静止したままになります。これがつり合いの状態です。"},
  {id:"phy410", cat:"物理", sub:"電流と回路", q:"電流が流れる道すじが1本しかなく、枝分かれしていない回路を何というか。", choices:["直列回路","並列回路","開放回路","短絡回路"], diff:"基礎", a:0, e:"【ことばの意味】「直列回路」＝電流の通り道が枝分かれせず、1本道になっている回路。電球や電池がひとつながりに順番につながれています。／【特徴】直列回路では、回路のどこをはかっても電流の大きさは同じです。また、電球を1つ増やすたびに電気抵抗が増え、回路全体を流れる電流は小さくなります。豆電球を1個切ると、回路全体の電流が止まってしまうのも直列回路の特徴です。"},
  {id:"phy411", cat:"物理", sub:"電流と回路", q:"電流が流れる道すじが枝分かれしている回路を何というか。", choices:["並列回路","直列回路","短絡回路","開放回路"], diff:"基礎", a:0, e:"【ことばの意味】「並列回路」＝電流の通り道が途中で枝分かれしている回路。／【特徴】並列回路では、それぞれの枝分かれした部分に電源と同じ電圧がかかります。また、1つの電球を外したり切れたりしても、他の枝の電球には電流が流れ続けるという特徴があります。家庭の配線の多くは並列回路になっており、1つの電化製品を止めても他の製品が使えるのはこのためです。"},
