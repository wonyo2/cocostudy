  {id:"phy395", cat:"物理", sub:"電流と回路", q:"乾電池を2個直列につなぐと、1個のときと比べて回路全体の電圧はどうなるか。", choices:["2倍になる","半分になる","変わらない","0になる"], diff:"基礎", a:0, e:"【ことばの意味】「直列つなぎ」＝電池を+極と-極が交互になるように一列につなぐ方法。／【電圧の変化】乾電池を直列に2個つなぐと、それぞれの電圧が足し合わされるため、全体の電圧は2倍になります。1.5Vの乾電池2個を直列につなぐと、合計3Vの電圧が得られます。／【並列つなぎとの違い】電池を並列につないだ場合は、電圧は1個のときと同じままで変わりませんが、電池が長持ちしやすくなるという特徴があります。"},
  {id:"phy396", cat:"物理", sub:"力の働き", q:"物体を水の中に沈めたとき、物体を上向きに押す力を何というか。", choices:["浮力","重力","水圧","摩擦力"], diff:"基礎", a:0, e:"【ことばの意味】「浮力」＝液体や気体の中にある物体を上向きに押す力。／【なぜ生まれる？】水中の物体には、上面よりも下面の方が水圧が大きくはたらきます（水圧は深いほど大きいため）。この上下の水圧の差が、上向きの力として現れたものが浮力です。／【浮くか沈むか】浮力が重力より大きければ物体は浮き上がり、浮力が重力より小さければ物体は沈みます。木は水に浮き、鉄は水に沈むのは、この浮力と重力の大小関係によるものです。"},
  {id:"phy397", cat:"物理", sub:"力の働き", q:"物体が水に浮くかどうかは、主に何によって決まるか。", choices:["物体の密度と水の密度の大小関係","物体の色","物体の温度","物体の形の美しさ"], diff:"基礎", a:0, e:"【ことばの意味】「密度」＝物体の単位体積あたりの質量。水の密度は約1g/cm³です。／【浮くか沈むかの目安】物体の密度が水より小さければ水に浮き、水より大きければ水に沈みます。木材は密度が水より小さいため浮き、鉄は密度が水より大きいため沈みます。／【鉄でも浮く理由】鉄でできた船が水に浮くのは、船全体の形を工夫することで、船が押しのける水の量（浮力）を大きくし、全体としての「みかけの密度」を水より小さくしているためです。"},
  {id:"phy398", cat:"物理", sub:"運動とエネルギー", q:"ジェットコースターが高い所から下るとき、速さが増していく理由として正しいものはどれか。", choices:["位置エネルギーが運動エネルギーに変わるから","エンジンの力で加速しているから","風の力を受けて加速しているから","レールが電気を帯びているから"], diff:"基礎", a:0, e:"【ことばの意味】ジェットコースターは最初に高い位置まで引き上げられ、大きな位置エネルギーをたくわえます。／【なぜ加速する？】下り坂を進むにつれて高さが低くなるため、位置エネルギーが減っていきます。摩擦や空気抵抗を考えなければ、その減った分がそのまま運動エネルギーに変わるため、速さがどんどん増していきます。／【まちがえやすい点】ジェットコースターにはエンジンがついておらず、最初に引き上げるとき以外は自力の動力を使わずに動いています。"},
  {id:"phy399", cat:"物理", sub:"エネルギーの利用", q:"エネルギーが移り変わるとき、エネルギーの総量についてあてはまるものはどれか。", choices:["変換の前後で総量は保たれる","変換のたびに総量は必ず増える","変換のたびに総量は必ず減る","変換すると別のものに置き換わり量は関係なくなる"], diff:"基礎", a:0, e:"【ことばの意味】「エネルギー保存の法則」＝エネルギーはいろいろな形に移り変わるが、その総量は変わらないという法則。／【具体例】電気エネルギーが光エネルギーと熱エネルギーに変わるとき、光になった分と熱になった分を足し合わせると、もとの電気エネルギーと同じ量になります。／【身近な感覚】電球が「熱くなる」のは、電気エネルギーの一部が光ではなく熱として出ていくためで、エネルギーが消えたわけではなく、形が変わっただけなのです。"},
  {id:"phy400", cat:"物理", sub:"光と音", q:"目に見える光（可視光）のうち、最も波長が長い色はどれか。", choices:["赤","青","紫","緑"], diff:"標準", a:0, e:"【ことばの意味】「波長」＝波の1つの山から次の山までの長さ。目に見える光（可視光）は、赤から紫まで色によって波長が異なります。／【波長の順番】波長が長い順に、赤・橙・黄・緑・青・藍・紫と並んでいます。赤が最も波長が長く、紫が最も波長が短い色です。／【身近な関連】プリズムで光を分けると、屈折の仕方の違いから波長順に色が並んで見えます。赤外線（赤の外側）や紫外線（紫の外側）という言葉も、この並び方に由来しています。"},
  {id:"phy311", cat:"物理", sub:"光と音", q:"光が水中から空気中へ進むとき、入射角45°では屈折して進んだ。入射角をさらに大きくするとどうなるか。", choices:["屈折角がさらに大きくなる","屈折角が小さくなる","ある角度を超えると全反射が起き","光は吸収されて消える"], diff:"標準", a:2, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること／「反射」＝光や音が物にぶつかってはね返ること【解説】水（密度大）→空気（密度小）では屈折角が入射角より大きい。入射角を大きくすると屈折角が90°に近づき、それを超えると全反射（光が完全に反射され空気中に出ない）が起きる。光ファイバーはこの全反射を利用している。【まちがえやすい点】ほかの選択肢（屈折角がさらに大きくなる／屈折角が小さくなる）とのちがいをおさえておこう。"},
  {id:"phy312", cat:"物理", sub:"電流と回路", q:"電圧6V、抵抗3Ωの直列回路に、さらに3Ωの抵抗を直列に加えた。電流はどう変化するか。", choices:["2Aから1Aに減る","1Aから2Aに増える","変わらない","6Aになる"], diff:"基礎", a:0, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】最初：I＝V/R＝6/3＝2A。抵抗追加後：合成抵抗3＋3＝6Ω、I＝6/6＝1A。直列に抵抗を加えると合成抵抗が大きくなり電流が減る。電圧が変わらない（電源は固定）ことに注意。【まちがえやすい点】ほかの選択肢（1Aから2Aに増える／変わらない）とのちがいをおさえておこう。"},
  {id:"phy313", cat:"物理", sub:"力の働き", q:"同じ力の大きさで、接触面積を半分にすると圧力はどうなるか。", choices:["半分になる","変わらない","2倍になる","4倍になる"], diff:"基礎", a:2, e:"圧力P＝F/A。力Fが同じで面積Aが半分になると、P＝F÷(A/2)＝2F/Aとなり圧力は2倍になる。スキーの板が広いと雪に沈みにくいのはAを大きくして圧力を下げているため。画鋲の先が細いのは面積を小さくして圧力を上げるため。"},
  {id:"phy314", cat:"物理", sub:"磁界と電流", q:"直線電流の周りにできる磁界の形として正しいものはどれか。", choices:["電流と平行な直線状","電流を中心とした同心円状","電流に垂直な直線状","放射状（電流から外側へ広がる）"], diff:"基礎", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「磁界」＝磁石の力がはたらいている空間【解説】直線電流の周りには電流を中心とした同心円状の磁界ができる。右ねじの法則：電流の向きに右ねじを進めると、ねじの回転方向が磁界の向きになる。コイルに電流を流すと磁界の形が変わり、棒磁石と似た磁界ができる。【まちがえやすい点】ほかの選択肢（電流と平行な直線状／電流に垂直な直線状）とのちがいをおさえておこう。"},
  {id:"phy315", cat:"物理", sub:"仕事とエネルギー", q:"摩擦のある水平面で、10Nの力で物体を5m引いた。摩擦力が3Nのとき、物体の得た運動エネルギーはいくらか。", choices:["50J","35J","15J","65J"], diff:"標準", a:1, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）／「運動エネルギー」＝動いている物体がもつエネルギー【解説】手がした仕事＝10N×5m＝50J。摩擦力がした仕事（熱になった分）＝3N×5m＝15J。物体の運動エネルギーの増加＝50－15＝35J。力のした仕事から摩擦による損失を引いたものが運動エネルギーとして蓄えられる。【まちがえやすい点】ほかの選択肢（50J／15J）とのちがいをおさえておこう。"},
  {id:"phy316", cat:"物理", sub:"光と音", q:"音叉を鳴らして水面に近づけると水面が振動した。これは音の何という性質によるか。", choices:["音の反射","音の屈折","音の波としての性質","音の吸収"], diff:"基礎", a:2, e:"【解説】音は空気（媒質）の振動が波として伝わる。音叉の振動→空気を振動→水面も振動。このように音は媒質の振動を伝える波（機械波）である。真空中では音叉が振動しても音は伝わらない（媒質がないため）。【まちがえやすい点】ほかの選択肢（音の反射／音の屈折）とのちがいをおさえておこう。"},
  {id:"phy317", cat:"物理", sub:"運動とエネルギー", q:"ボールを真上に投げ上げた。最高点でのボールの運動エネルギーはいくらか（空気抵抗なし）。", choices:["投げた瞬間と同じ","投げた瞬間の2倍","ゼロ","投げた瞬間の半分"], diff:"標準", a:2, e:"【ことばの意味】「抵抗」＝電流の流れにくさ（単位Ω）／「位置エネルギー」＝高い所にある物体がもつエネルギー【解説】最高点では速さがゼロになる（一瞬止まる）ため、運動エネルギー＝½mv²＝0。この瞬間に投げた瞬間の運動エネルギーがすべて位置エネルギーに変換されている（力学的エネルギー保存）。【まちがえやすい点】ほかの選択肢（投げた瞬間と同じ／投げた瞬間の2倍）とのちがいをおさえておこう。"},
  {id:"phy318", cat:"物理", sub:"電流と回路", q:"電力20Wの電球を5時間使用した。発生した熱量はいくらか。", choices:["4J","100J","360000J","20J"], diff:"標準", a:2, e:"電力量W＝電力×時間＝20W×(5×3600s)＝20×18000＝360000J。1時間＝3600秒に変換するのがポイント。電力量の単位はJ（ジュール）またはWh（ワット時）で表し、1Wh＝3600J。電力量がすべて熱になる（電熱線・電球など）。"},
  {id:"phy319", cat:"物理", sub:"力の働き", q:"2つの力がつり合っているとき、その2力の合力はいくらか。", choices:["2力の和","2力の差","ゼロ","どちらか大きい方と等しい"], diff:"標準", a:2, e:"【ことばの意味】「慣性」＝物体が今の運動の状態を続けようとする性質／「合力」＝複数の力を1つにまとめた力【解説】2力がつり合う条件：①大きさが等しい②向きが反対③同一直線上にある。このとき合力はゼロになり、物体は静止または等速直線運動を続ける（慣性の法則）。合力がゼロ＝力がつり合っている、という関係を確認しよう。【まちがえやすい点】ほかの選択肢（2力の和／2力の差）とのちがいをおさえておこう。"},
  {id:"phy320", cat:"物理", sub:"エネルギーの利用", q:"地熱発電のしくみとして正しいものはどれか。", choices:["太陽光で地面を温めてタービンを回す","地下の熱で蒸気を作りタービンを回す","地下水を燃料として燃やす","大気の熱を直接電気に変換する"], diff:"標準", a:1, e:"地熱発電：地下深部のマグマの熱で地下水が加熱され蒸気になる。その蒸気でタービンを回して発電する。火山が多い日本は地熱資源が豊富。再生可能エネルギーで天候に左右されない安定した電源だが、国立公園内に多く開発が制限されていた。"},
  {id:"phy321", cat:"物理", sub:"光と音", q:"凸レンズで焦点距離と同じ距離に物体を置いたとき、像はどうなるか。", choices:["焦点の反対側に実像ができる","レンズの手前に虚像ができる","像はできない（平行光線になる）","物体の2倍の大きさの像ができる"], diff:"標準", a:2, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること／「焦点」＝レンズを通った平行な光が1点に集まる場所【解説】物体を焦点に置くと、屈折した光が平行光線になって進むため収束せず、実像も虚像もできない。懐中電灯などで平行光線を作るときに利用する（光源を焦点に置く）。焦点距離より内側→虚像、外側→実像という対比で整理しよう。【まちがえやすい点】ほかの選択肢（焦点の反対側に実像ができる／レンズの手前に虚像ができる）とのちがいをおさえておこう。"},
  {id:"phy322", cat:"物理", sub:"電流と回路", q:"家庭のコンセントの電気（交流100V）を使うとき、プラグを抜いた後も電気が流れ続けることはないのはなぜか。", choices:["交流は自動的に止まるから","回路が途切れるため電流が流れない","電圧がゼロになるから","抵抗が無限大になるから"], diff:"標準", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）【解説】電気回路は電源・導線・電気器具が輪のようにつながった閉じた回路で電流が流れる。プラグを抜くと回路が途切れ（開放回路）、電流は流れない。スイッチも同じ原理で、回路を切ったり繋いだりして電流を制御する。【まちがえやすい点】ほかの選択肢（交流は自動的に止まるから／電圧がゼロになるから）とのちがいをおさえておこう。"},
  {id:"phy323", cat:"物理", sub:"力の働き", q:"水中で物体を持つと軽く感じる理由として正しいものはどれか。", choices:["水が物体を冷やすから","水中では重力が小さくなるから","浮力が上向きにはたらき","物体の質量が減るから"], diff:"標準", a:2, e:"【ことばの意味】「浮力」＝液体や気体の中で物体を上向きに押す力／「重力」＝地球が物体を引っぱる力【解説】水中の物体には重力（下向き）と浮力（上向き）が同時にはたらく。手で支える力＝重力－浮力となり、空気中より小さくなる。浮力＝押しのけた水の重さ（アルキメデスの原理）。密度が水より大きい物体は沈んでも浮力がはたらき続ける。【まちがえやすい点】ほかの選択肢（水が物体を冷やすから／水中では重力が小さくなるから）とのちがいをおさえておこう。"},
  {id:"phy324", cat:"物理", sub:"磁界と電流", q:"電磁石に使う鉄心の役割として正しいものはどれか。", choices:["電流を流しやすくする","磁界を強める","コイルを固定する","熱を逃がす"], diff:"基礎", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「磁界」＝磁石の力がはたらいている空間【解説】鉄心（軟鉄）は磁化されやすく、コイルの磁界をはるかに強める役割をもつ。軟鉄は電流を止めると磁気を失いやすい（残留磁気が少ない）ため、電磁石の鉄心に適している。硬鋼は残留磁気が大きいので永久磁石に使われる。【まちがえやすい点】ほかの選択肢（電流を流しやすくする／コイルを固定する）とのちがいをおさえておこう。"},
  {id:"phy325", cat:"物理", sub:"熱の伝わり方", q:"魔法瓶（真空断熱容器）が保温・保冷できる理由として正しいものはどれか。", choices:["内部に特殊な化学物質が入っているから","二重壁の間を真空にして伝導・対流を防ぎ","電気で温度を制御しているから","内壁の素材が熱を全く通さないから"], diff:"標準", a:1, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること／「伝導」＝物を伝わって熱が移動すること【解説】熱の3つの伝わり方：①伝導（固体）②対流（液体・気体）③放射（電磁波）。真空にすることで①②を遮断し、内壁を鏡面（銀メッキ）にすることで③を反射して遮断する。3つの伝熱をすべて防ぐ構造が魔法瓶の保温・保冷の原理。【まちがえやすい点】ほかの選択肢（内部に特殊な化学物質が入っているから／電気で温度を制御しているから）とのちがいをおさえておこう。"},
  {id:"phy326", cat:"物理", sub:"仕事とエネルギー", q:"エネルギーが変換されるとき、変換できないエネルギーは何に変わる場合が多いか。", choices:["位置エネルギー","光エネルギー","熱エネルギー","化学エネルギー"], diff:"標準", a:2, e:"エネルギー変換では必ず一部が熱として失われる（散逸する）。例：電球では電気の約90%が熱になり光は10%。摩擦では運動エネルギーが熱に。熱は温度の低い物体に自然に広がり、元に戻すことが難しいエネルギーの形。この性質がエネルギー変換の効率を100%以下にする。"},
  {id:"phy327", cat:"物理", sub:"電流と回路", q:"電熱線の抵抗と発熱量の関係について正しいものはどれか（電流が同じ場合）。", choices:["抵抗が大きいほど発熱量が少ない","抵抗が大きいほど発熱量が多い","抵抗の大きさと発熱量は無関係","抵抗が2倍になると発熱量は4倍になる"], diff:"基礎", a:1, e:"Q＝I²Rt。電流Iが同じなら発熱量Qは抵抗Rに比例する。直列回路では同じ電流が流れるため、抵抗の大きい電熱線の方が多く発熱する。なお並列回路では同じ電圧がかかるため、抵抗の小さい方が電流が多く流れて多く発熱する（逆になる）。"},
  {id:"phy328", cat:"物理", sub:"運動とエネルギー", q:"斜面をボールが転がり下りるとき（摩擦なし）、速さが最大になるのはどの位置か。", choices:["斜面の中間地点","斜面の頂上","斜面の底（一番低い位置）","斜面の途中の任意の場所"], diff:"基礎", a:2, e:"力学的エネルギー保存の法則より、位置が低いほど位置エネルギーが運動エネルギーに変換されて速さが増す。最も低い位置（底）で位置エネルギーが最小・運動エネルギーが最大（速さ最大）。摩擦があると熱エネルギーに一部変換されて速さは遅くなる。"},
  {id:"phy329", cat:"物理", sub:"光と音", q:"糸電話で音が伝わるのはなぜか。", choices:["糸が空気を振動させるから","声の振動が糸を伝わって相手の紙コップを振動させる","糸が電気信号を送るから","糸の長さに関係なく同じ速さで伝わるから"], diff:"標準", a:1, e:"声→紙コップの振動→糸の振動（固体中を伝わる）→相手の紙コップ振動→耳に空気振動として届く。固体は液体・気体よりも音が速く伝わる（密度が高く弾性が大きい）。糸がたるむと振動が伝わりにくくなるため、ピンと張った状態が必要。"},
  {id:"phy330", cat:"物理", sub:"力の働き", q:"重さ10Nの物体をてこで持ち上げるとき、支点から作用点まで20cm、支点から力点まで80cmの場合、力点に加える力はいくらか。", choices:["10N","2.5N","40N","5N"], diff:"標準", a:1, e:"てこの原理：力×力点距離＝重さ×作用点距離。F×80＝10×20。F＝200÷80＝2.5N。力点を支点から遠くするほど小さな力で持ち上げられる。ただし力点を大きく動かす必要があり、仕事の総量は変わらない（仕事の原理）。"},
  {id:"phy331", cat:"物理", sub:"電流と回路", q:"豆電球2個を並列につなぐと、直列のときと比べて全体の明るさはどうなるか。", choices:["暗くなる","変わらない","明るくなる","片方が消える"], diff:"基礎", a:2, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電力」＝1秒あたりに使う電気エネルギーの量（単位W）【解説】並列回路では各電球に電源と同じ電圧がかかる（直列では電圧が分割される）。各電球は1個のときと同じ明るさで点灯し、2個合わせると全体の消費電力は2倍になる（明るくなる）。一方で電源（電池）の消耗は速くなる。【まちがえやすい点】ほかの選択肢（暗くなる／変わらない）とのちがいをおさえておこう。"},
  {id:"phy333", cat:"物理", sub:"仕事とエネルギー", q:"物体を速く持ち上げた場合と遅く持ち上げた場合（同じ高さ・同じ重さ）で、仕事率（パワー）はどちらが大きいか。", choices:["遅い方が大きい","同じ","速い方が大きい","重さによって変わる"], diff:"基礎", a:2, e:"【ことばの意味】「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）／「仕事」＝力×動かした距離。単位はJ（ジュール）【解説】仕事率P＝仕事W÷時間t。同じ仕事Wを短時間tで行うほど仕事率は大きい。速く持ち上げると時間が短くなるため仕事率が大きくなる。仕事（Wh・J）と仕事率（W）は別の量で、同じ仕事でも速さによって仕事率が変わる。【まちがえやすい点】ほかの選択肢（遅い方が大きい／同じ）とのちがいをおさえておこう。"},
  {id:"phy334", cat:"物理", sub:"光と音", q:"凸レンズで物体を焦点より少し外側に置いたとき、できる実像の性質として正しいものはどれか。", choices:["物体より小さく正立の実像","物体より大きく倒立の実像","物体と同じ大きさで正立の実像","実像はできない"], diff:"標準", a:1, e:"物体を焦点距離のすぐ外側（焦点より少し遠い位置）に置くと、レンズの反対側に物体より大きく・上下左右が逆（倒立）の実像ができる。物体を焦点距離の2倍の位置に置くと等倍の実像。さらに遠ざけると小さい実像になる。一眼レフカメラはこの原理。"},
  {id:"phy335", cat:"物理", sub:"力の働き", q:"水深2mでの水圧はおよそいくらか（水1cm³＝1g、重力加速度10m/s²とする）。", choices:["200Pa","2000Pa","20000Pa","200000Pa"], diff:"標準", a:2, e:"水圧P＝ρgh＝1000kg/m³×10m/s²×2m＝20000Pa。水深1mで約10000Pa（約0.1気圧）増加する。潜水は水圧との闘いで、10m潜るごとに1気圧増加する。この計算は中学で扱うが、単位換算を丁寧に行うことが大切。"},
  {id:"phy336", cat:"物理", sub:"エネルギーの利用", q:"電気自動車（EV）が通常のガソリン車より環境負荷が小さいとされる主な理由はどれか。", choices:["走行中にCO₂を排出しない","電気自動車は製造時にCO₂を排出しない","電気自動車は電力を使わない","電気自動車はリサイクルが不要"], diff:"基礎", a:0, e:"電気自動車は走行中にCO₂や排気ガスを出さない（ただし電気の発電方法によっては間接的にCO₂が排出される）。再生可能エネルギー由来の電力を使えば全体のCO₂排出量を大幅に削減できる。エネルギー変換効率もガソリン車より高い。"},
  {id:"phy337", cat:"物理", sub:"光と音", q:"鏡に向かって歩み寄ると、自分の像はどう見えるか。", choices:["像が遠ざかっていくように見える","像の大きさは変わらない","像が近づいてくるように見える","像が消えてしまう"], diff:"基礎", a:2, e:"【解説】平面鏡では、鏡からの距離と等しい位置（鏡の裏側）に像ができる。鏡に近づくと像も近づく（鏡との距離が縮まるため）。また像の大きさ（見かけ上）は距離が縮まるほど大きく見える。像は左右が逆になる（正立・等倍）。【まちがえやすい点】ほかの選択肢（像が遠ざかっていくように見える／像の大きさは変わらない）とのちがいをおさえておこう。"},
  {id:"phy338", cat:"物理", sub:"電流と回路", q:"日本の家庭用コンセントの電圧と周波数として正しいものはどれか。", choices:["220V・60Hz（全国統一）","100V・50Hzまたは60Hz","100V・60Hz（全国統一）","200V・50Hz（全国統一）"], diff:"基礎", a:1, e:"日本の家庭用電源：電圧は100V（ほぼ全国統一）。周波数は東日本50Hz・西日本60Hz（富士川・糸魚川付近が境界）。この違いは明治期に東西で異なるメーカーの発電機を輸入したため。家電の多くは両方対応しているが、対応していない機器は動作不良になる。"},
  {id:"phy339", cat:"物理", sub:"力の働き", q:"一直線上にない2つの力を1つにまとめるとき、どのように求めるか。", choices:["2力を2辺とする平行四辺形の対角線を引く","2力の大きさをそのまま足し算する","2力の大きさの差を計算する","2力の大きさの平均を計算する"], diff:"標準", a:0, e:"【ことばの意味】「合力」＝いくつかの力を、同じはたらきをする1つの力にまとめたもの。／【求め方】2つの力を矢印（ベクトル）で表し、それを2つの辺とする平行四辺形を作図します。その対角線が合力の大きさと向きを表します。／【向きがそろっている場合】2力が同じ向きなら、単純に足し算でOK。反対向きなら引き算になります。／【なぜ足し算ではダメ？】斜めに交わる力は、向きがちがうぶんだけ打ち消し合う部分があるため、単純な足し算より小さくなります。だから作図で求める必要があります。"},
  {id:"phy340", cat:"物理", sub:"熱の伝わり方", q:"冬に窓ガラスの内側が結露（水滴がつく）する理由として正しいものはどれか。", choices:["窓ガラスが水分を外から吸収するから","室内の暖かい空気がガラス面で冷やされ","窓ガラスが化学反応を起こして水を生成するから","外の冷気が窓を通り抜けて水になるから"], diff:"標準", a:1, e:"【ことばの意味】「露点」＝空気中の水蒸気が水てきに変わり始める温度【解説】暖かい室内の空気には多くの水蒸気が含まれる。冷たいガラス面に触れた空気が冷やされ、露点以下になると水蒸気が凝結して水滴（結露）になる。断熱ガラス（複層ガラス）はガラス表面温度を上げることで結露を防ぐ。【まちがえやすい点】ほかの選択肢（窓ガラスが水分を外から吸収するから／窓ガラスが化学反応を起こして水を生成するから）とのちがいをおさえておこう。"},
  {id:"che278", cat:"化学", sub:"物質のすがた", q:"食塩水・砂糖水・デンプン水溶液のうち、ろ紙を通過しないものはどれか。", choices:["食塩水","砂糖水","デンプン水溶液","すべて通過する"], diff:"基礎", a:2, e:"デンプンの粒子はろ紙の穴より大きい場合があり、通過しにくい（コロイド粒子程度の大きさ）。食塩のNa⁺・Cl⁻や砂糖分子は非常に小さくろ紙を通過する。ろ過は溶液（完全に溶けた物質）と固体の分離には使えない。デンプン水溶液がヨウ素液で青紫色になることも確認できる。"},
  {id:"che279", cat:"化学", sub:"気体の性質", q:"気体の集め方のうち「上方置換」に適した気体の特徴はどれか。", choices:["空気より重く水に溶けやすい","空気より軽く水に溶けやすい","水に溶けにくい","空気より重く水に溶けにくい"], diff:"基礎", a:1, e:"【解説】上方置換：空気より軽い（密度が小さい）気体を集める方法。容器を上に向けて、気体が上に集まる性質を利用する。水に溶けやすいと水上置換が使えないため上方置換を選ぶ。アンモニア（空気より軽く水に非常に溶けやすい）が代表例。【まちがえやすい点】ほかの選択肢（空気より重く水に溶けやすい／水に溶けにくい）とのちがいをおさえておこう。"},
  {id:"che280", cat:"化学", sub:"化学変化と質量", q:"スチールウール（細い鉄）を空気中で燃焼させると重くなる。その理由として正しいものはどれか。", choices:["スチールウールが水分を吸収したからと考えられている","酸化鉄がスチールウールの内部に生成されるから","空気中の酸素がスチールウールと結びついて酸化鉄になるから","燃焼で炭素が付着するからと考えられている"], diff:"標準", a:2, e:"鉄＋酸素→酸化鉄（Fe₃O₄など）。空気中の酸素（O₂）が鉄と結合するため、生成した酸化鉄の質量は元の鉄より重くなる（酸素の質量が加わる）。有機物（木・紙）の燃焼は逆にCO₂や水蒸気が出て軽くなるように見える点と対比して覚えよう。"},
  {id:"che281", cat:"化学", sub:"酸・アルカリと中和", q:"胃酸（塩酸）が出すぎて胃が痛いとき、制酸剤（胃薬）に含まれる成分のはたらきとして正しいものはどれか。", choices:["胃酸と同じ酸性物質が中和する","アルカリ性の成分が胃酸を中和する","塩基性成分が胃酸を蒸発させる","胃酸の生成を物理的に止める"], diff:"標準", a:1, e:"【ことばの意味】「中和」＝酸とアルカリが反応して塩と水ができること／「酸性」＝pHが7より小さい性質。青リトマスを赤にする【解説】胃酸（塩酸・HCl）が多すぎると胃壁が刺激される。制酸剤はNaHCO₃（重曹）やAl(OH)₃などのアルカリ性成分を含み、胃酸と中和反応を起こしてpHを上げる（酸性を弱める）。中和反応の身近な応用例。【まちがえやすい点】ほかの選択肢（胃酸と同じ酸性物質が中和する／塩基性成分が胃酸を蒸発させる）とのちがいをおさえておこう。"},
  {id:"che282", cat:"化学", sub:"水溶液とイオン", q:"硫酸と水酸化バリウムの中和反応で生成する塩はどれか。", choices:["塩化バリウム","炭酸バリウム","硫酸バリウム","水酸化バリウム"], diff:"基礎", a:2, e:"H₂SO₄＋Ba(OH)₂→BaSO₄↓（白色沈殿）＋2H₂O。硫酸バリウムは水に非常に溶けにくいため白色沈殿として生成する。この反応は完全に中和すると溶液中にイオンがほとんどなくなり、電気をほとんど通さなくなる点でユニーク。X線造影剤としても使われる。"},
  {id:"che283", cat:"化学", sub:"化学変化と質量", q:"気体の体積が温度によって変化する理由として正しいものはどれか。", choices:["温度が上がると気体の質量が増えるから","温度が上がると気体分子の運動が激しくなり","温度と体積は無関係","気体は温度が上がると液体になるから"], diff:"標準", a:1, e:"気体分子は常に運動している（熱運動）。温度が高くなると分子の運動が激しくなり、互いの衝突が強くなって体積が膨張する。温度を下げると分子運動が穏やかになり体積は縮む（シャルルの法則の概念）。中学では「温度が高い→体積が大きい」という定性的理解で十分。"},
  {id:"che284", cat:"化学", sub:"酸化と還元", q:"有機物（木・紙・プラスチックなど）が燃えると、主にどんな物質が生成するか。", choices:["鉄と水","二酸化炭素と水","酸素と水素","灰と酸素"], diff:"基礎", a:1, e:"有機物の完全燃焼：炭素C→CO₂、水素H→H₂O。例：メタンCH₄＋2O₂→CO₂＋2H₂O。プラスチック（炭化水素が主）・木（セルロース）・紙も同様。燃焼後にCO₂と水が生成することを石灰水（CO₂検出）と塩化コバルト紙（H₂O検出）で確かめる実験が基本。"},
  {id:"che285", cat:"化学", sub:"物質のすがた", q:"水溶液から溶質を取り出す方法として、温度を下げて結晶化させる方法に最も適した物質はどれか。", choices:["食塩（NaCl）：温度による溶解度変化が小さい","砂糖：水に非常に溶けやすいと考えられている","硝酸カリウム（KNO₃）：温度による溶解度変化が大きい","酸化銅：水にほとんど溶けないと考えられている"], diff:"基礎", a:2, e:"再結晶は温度による溶解度変化の差を利用する。硝酸カリウムは20℃で約32g/100g水、60℃で約110g/100g水と温度変化が大きい。高温で飽和させ冷やすと大量に結晶が析出する。食塩は温度変化が小さいため蒸発乾固が適している。"},
  {id:"che287", cat:"化学", sub:"化学変化と質量", q:"銅と亜鉛の合金（真鍮）は、それぞれの純金属とどう違うか。", choices:["合金はもとの金属の化学式で表される","合金は混合物であり","合金は2種類の元素に完全に分離できる","合金は化合物である"], diff:"基礎", a:1, e:"合金は2種類以上の金属（まれに非金属を含む）を溶かして混合したもの（固体の混合物）。成分元素の中間的・または新しい性質を示す。例：真鍮（Cu＋Zn）は銅より硬く加工しやすい。ステンレス（Fe＋Cr＋Ni）はさびにくい。純金属よりも優れた性質を出すために作られる。"},
  {id:"che288", cat:"化学", sub:"酸・アルカリと中和", q:"酸性雨が大理石（炭酸カルシウム）でできた建物や石像を溶かす反応として正しいものはどれか。", choices:["大理石が熱によってとけただけである","酸性雨に含まれる酸が炭酸カルシウムと反応して溶かす","大理石が空気中の酸素で酸化される","大理石が水にゆっくり自然にとけただけである"], diff:"基礎", a:1, e:"CaCO₃＋H₂SO₄→CaSO₄＋H₂O＋CO₂。酸性雨の酸（H₂SO₄・HNO₃など）が大理石（CaCO₃）と反応して溶かす。石灰石でできたギリシャのパルテノン神殿やヨーロッパの大聖堂の腐食が問題になっている。塩酸を石灰石にかける実験と同じ原理。"},
  {id:"che289", cat:"化学", sub:"気体の性質", q:"水素の発生方法として実験室でよく使われるものはどれか。", choices:["水を電気分解する","亜鉛（または鉄）に希塩酸を加える","過酸化水素水に酸化マンガンを加える","石灰石に塩酸を加える"], diff:"基礎", a:1, e:"Zn＋H₂SO₄→ZnSO₄＋H₂。亜鉛・鉄・アルミニウムなど（水素よりイオン化傾向が大きい金属）＋希酸→水素発生。水の電気分解でも水素は発生するが手間がかかる。過酸化水素＋MnO₂→O₂（酸素）。石灰石＋塩酸→CO₂（二酸化炭素）との区別も重要。"},
  {id:"che290", cat:"化学", sub:"物質のすがた", q:"食塩（NaCl）が水に溶けるとき、何が起きているか。", choices:["NaClが化学変化して別の物質になる","NaClの結晶がNa⁺とCl⁻に電離して水中に均一に散らばる","NaClが水分子と化合してNa₂O₂やHClになる","NaClの固体が液体に状態変化する"], diff:"標準", a:1, e:"食塩の溶解（電離）：NaCl→Na⁺＋Cl⁻。イオン結晶が水に溶けると正負イオンに分かれて水分子に囲まれ均一に分散する（電離）。これは化学変化ではなく物理変化（溶解）＋電離（イオン化）。溶かした食塩は蒸発させれば再び取り出せる。"},
  {id:"che291", cat:"化学", sub:"化学変化と質量", q:"化学変化を利用した「冷却パック」は、何が起きて冷たくなるか。", choices:["反応によって熱が発生し、その後急速に冷える","硝酸アンモニウムなどが水に溶けることで周囲から熱を奪う","電気を使って冷やすと考えられている","化学変化で氷が生成されるとされている"], diff:"基礎", a:1, e:"冷却パックの吸熱反応：硝酸アンモニウム（NH₄NO₃）が水に溶けるとき周囲から熱を吸収する（吸熱溶解）。周囲の温度が下がるため冷却に使える。逆のカイロは鉄の酸化（発熱反応）を利用。「発熱反応：周囲温度↑、吸熱反応：周囲温度↓」を区別しよう。"},
  {id:"che292", cat:"化学", sub:"水溶液とイオン", q:"電気分解と電池（化学電池）を見分けるポイントとして正しいものはどれか。", choices:["電気分解は電気を発生させ、電池は電気を消費する","電池は化学エネルギーを電気に変え（発電）","どちらも電気を発生させる","どちらも電気を消費する"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「還元」＝物質が酸素をうばわれること【解説】電池（ガルバニ電池）：自発的な酸化還元反応→電気エネルギー発生。電気分解：外部電源の電気エネルギー→非自発的な化学変化。充電中の電池は電気分解と同じ（電気→化学エネルギー蓄積）、放電中は電池として発電。【まちがえやすい点】ほかの選択肢（電気分解は電気を発生させ、電池は電気を消費す…／どちらも電気を発生させる）とのちがいをおさえておこう。"},
  {id:"che293", cat:"化学", sub:"身近な化学変化", q:"コンクリートが固まる仕組みとして正しいものはどれか。", choices:["水が蒸発してセメントが乾くだけと考えられている","セメントが水と化学反応して硬い固体（水和物）になる","砂と砂利が固まるだけの変化と考えられている","コンクリートは高温で焼いて固める"], diff:"標準", a:1, e:"セメントの水和反応：セメントの成分（ケイ酸カルシウムなど）が水と反応して結晶質の水和物を生成し、強固な構造になる。これは物理的な乾燥ではなく化学変化。硬化後は水に濡らしても溶けない。水和反応は発熱を伴い、大型構造物では温度管理が重要。"},
  {id:"che294", cat:"化学", sub:"酸化と還元", q:"銅板と亜鉛板を電解質水溶液に入れると電池になる。どちらが正極（＋極）になるか。", choices:["亜鉛板が正極","銅板が正極","どちらが正極かは液体の種類による","正極はない"], diff:"基礎", a:1, e:"イオン化傾向：亜鉛（Zn）＞銅（Cu）。イオン化傾向が大きい亜鉛が溶けだして電子を放出（負極・酸化）→電子が導線を流れる→銅板（正極）でH⁺が還元されてH₂発生。電位が高い方（電子を受け取る方）が正極。イオン化傾向の小さい金属が正極になる。"},
  {id:"che295", cat:"化学", sub:"物質のすがた", q:"食酢（酢酸水溶液）のにおいが蒸発とともに弱まる理由として正しいものはどれか。", choices:["酢酸が化学変化して無臭になるからと考えられている","揮発性の酢酸分子が空気中に飛び出すことで濃度が下がりにおいが弱まる","においは湿度によって変化するからと考えられている","酢酸が水に変わるからによる反応と考えられている"], diff:"標準", a:1, e:"酢酸（CH₃COOH）は揮発性（沸点118℃）があり、常温でも蒸発して空気中に出て行く。濃度が下がるとにおい分子（酢酸）の量が減り、においが弱まる。揮発性の高い物質（エタノール・ガソリンなど）も同様に蒸発する。蒸発は物理変化（化学変化ではない）。"},
  {id:"che296", cat:"化学", sub:"化学変化と質量", q:"紙を燃やすと灰しか残らないが、完全燃焼した場合に生成する物質の組み合わせとして正しいものはどれか。", choices:["水素と窒素","二酸化炭素と水","酸素と炭素","水と塩素"], diff:"標準", a:1, e:"紙（セルロース）の完全燃焼：セルロース（炭水化物CxHyOz）＋O₂→CO₂＋H₂O。目に見える灰は紙に含まれていたカルシウム・カリウムなどの無機塩類が残ったもの。CO₂は気体として逃げ、H₂Oは水蒸気として逃げるため、灰は軽くなる。"},
  {id:"che298", cat:"化学", sub:"水溶液とイオン", q:"塩酸（HCl水溶液）が電気を通す理由として正しいものはどれか。", choices:["水が電気を通すから","塩酸にはH⁺とCl⁻が含まれ","HClが金属と同じ性質をもつから","電気を通すのは濃い塩酸だけ"], diff:"標準", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「電離」＝物質が水にとけてイオンに分かれること【解説】HCl→H⁺＋Cl⁻（ほぼ完全に電離）。H⁺は陰極へ、Cl⁻は陽極へ移動することで電荷が運ばれ電流が流れる。薄い塩酸でも電離しているため電気を通す。純水は電離がほとんどないため電気を通しにくい（イオンが極少）。【まちがえやすい点】ほかの選択肢（水が電気を通すから／HClが金属と同じ性質をもつから）とのちがいをおさえておこう。"},
  {id:"che299", cat:"化学", sub:"化学変化と質量", q:"化学反応式の「→」（矢印）の意味として正しいものはどれか。", choices:["反応物と生成物が同じ量だけあることを示す","反応が左向きにも進むことを示すと考えられている","左辺の物質が化学変化して右辺の物質になることを示す","物質が移動することを示すと考えられている"], diff:"基礎", a:2, e:"化学反応式の→（一方向の矢印）は「反応物が化学変化して生成物になる」ことを示す。⇌（可逆矢印）は反応が正逆両方向に進むことを示す（中学では主に→を使用）。矢印の左右で原子の種類と数が等しくなるよう係数を合わせる（原子の保存）。"},
  {id:"che300", cat:"化学", sub:"身近な化学変化", q:"銀を使った写真フィルムが光に当たると像ができるのは、どのような変化によるか。", choices:["銀の化合物が光を受けて銀に変化する","フィルムの表面が光の熱でとける","フィルムの色素が光で色を変える","フィルムが空気中の酸素と結びつく"], diff:"標準", a:0, e:"【しくみ】フィルムには銀をふくむ化合物がぬられています。光が当たった部分だけ、その化合物が変化して銀のつぶになります。光がたくさん当たった部分ほど多くの銀ができるので、明暗の像ができます。／【現像とは】この変化を薬品で強めて、目に見える像にする作業のことです。そのあと、光が当たらなかった部分の化合物を洗い流して（定着）、像を固定します。／【身近な例】直射日光に当たった写真が変色するのも、同じように銀の化合物が光で変化するためです。"},
  {id:"bio326", cat:"生物", sub:"植物のつくり", q:"植物のつるが支柱に巻き付くのは、どのような反応によるものか。", choices:["支柱に触れた刺激に反応して曲がる接触屈性（傾触性）によるもの","光の方向に向かって曲がる光屈性によるもの","重力に逆らって曲がる重力屈性によるもの","水の方向に向かって曲がる水屈性によるもの"], diff:"標準", a:0, e:"【ことばの意味】「屈性（くっせい）」＝植物が刺激を受けて、決まった方向に曲がって成長する性質。接触屈性（傾触性）は、物に触れた刺激に反応する屈性です。／【なぜ巻き付く？】つるが支柱に触れると、触れた側の成長がおそくなり、反対側の成長が速くなります。そのため、つるは支柱に巻き付くように曲がっていきます。アサガオやキュウリのつるがこの性質をもちます。／【他の屈性】光屈性＝茎が光の方に曲がる。重力屈性＝根が重力の方向（下）に曲がる。それぞれ反応する刺激がちがいます。"},
  {id:"bio327", cat:"生物", sub:"動物のからだ", q:"ヒトの体で、骨と骨がつながって曲げのばしができる部分を何というか。", choices:["関節","けん","軟骨","じん帯"], diff:"基礎", a:0, e:"【ことばの意味】「関節」＝骨と骨がつながっていて、曲げたりのばしたりできる部分。ひじ・ひざ・肩などがそうです。／【まわりのつくり】「けん（腱）」＝筋肉と骨をつなぐじょうぶなひも。「じん帯」＝骨と骨をつなぎ、関節がはずれないようにおさえるひも。「軟骨」＝関節の骨の先にあるやわらかい組織で、クッションの役目をします。／【筋肉の動き方】筋肉は縮むことしかできず、のばす力は出せません。そのため関節をはさんで2つの筋肉が対になっていて、一方が縮むともう一方がゆるむしくみで曲げのばしをしています（うでの内側と外側の筋肉など）。"},
  {id:"bio328", cat:"生物", sub:"細胞", q:"染色体について正しいものはどれか。", choices:["染色体はタンパク質だけでできている","染色体はDNAとタンパク質（ヒストン）でできており","ヒトの染色体は全部で46本（23対）ある","染色体は細胞質の中に自由に浮かんでいる"], diff:"基礎", a:1, e:"染色体＝DNA＋タンパク質（ヒストン）。DNAが巻き付いて圧縮された構造。ヒトの体細胞は46本（23対）の染色体をもつ。通常は核の中で細い糸状（クロマチン）だが、細胞分裂時に凝縮して光学顕微鏡で観察できる形（染色体）になる。"},
  {id:"bio329", cat:"生物", sub:"生物とかんきょう", q:"植物の光合成が地球の酸素の量を保つのに役立っている理由として正しいものはどれか。", choices:["植物が光合成でCO₂とH₂Oから養分をつくるときに酸素を放出するから","光合成で窒素が酸素に変わるから","動物が呼吸をしないから酸素が減らないから","酸素は地球の内部から常に供給されているから"], diff:"標準", a:0, e:"【光合成のしくみ】植物は光のエネルギーを使って、二酸化炭素（CO₂）と水（H₂O）から養分（デンプン）をつくります。このとき酸素（O₂）が余分な物質として放出されます。／【酸素のバランス】動物や植物自身は呼吸で酸素を吸って二酸化炭素を出します。植物の光合成による酸素の放出と、生物全体の呼吸による酸素の消費がつり合うことで、大気中の酸素の割合（約21%）がほぼ一定に保たれています。／【まちがえやすい点】窒素が酸素に変わるわけではありません。窒素と酸素は別の元素です。"},
  {id:"bio330", cat:"生物", sub:"生殖と遺伝", q:"有性生殖で生まれる子は親と少しずつ違う。このことは生物の集団にとってどんな利点があるか。", choices:["環境が変わっても生き残る個体がいる可能性が高くなる","集団の全員が同じ性質になるので育てやすくなる","子が親よりつねに丈夫になるとされている","子の数がつねに増えるとされている"], diff:"標準", a:0, e:"【ことばの意味】「有性生殖」＝オスとメスがかかわり、卵と精子が受精して子ができるふえ方。／【なぜバラバラだといいの？】親から半分ずつ遺伝子を受けつぐので、子は一人ひとり少しずつ性質が違います。もし新しい病気が流行っても、たまたまその病気に強い性質をもった個体がいれば生き残れます。集団が全滅しにくくなるのです。／【無性生殖だと】親と全く同じ遺伝子（クローン）なので、一つの病気に弱いと全員がやられてしまう危険があります。／【まちがえやすい点】「必ず丈夫になる」わけではありません。あくまで「色々な個体がいる」ことが利点です。"},
  {id:"bio331", cat:"生物", sub:"動物のからだ", q:"ヒトの感覚神経と運動神経の違いとして正しいものはどれか。", choices:["感覚神経は命令を伝え、運動神経は情報を脳に伝える","感覚神経は感覚器官から中枢（脳・脊髄）へ信号を伝え","どちらも同じはたらきをすると考えられている","感覚神経は自律神経系に含まれるとされている"], diff:"標準", a:1, e:"感覚神経：末梢（皮膚・目・耳など）→中枢（脳・脊髄）へ情報伝達（求心性）。運動神経：中枢→筋肉・腺へ命令伝達（遠心性）。刺激→感覚神経→脊髄・脳→運動神経→筋肉という経路で意識的な運動が起こる。反射では脊髄（または脳幹）を介して速く反応する。"},
  {id:"bio332", cat:"生物", sub:"植物のつくり", q:"種子が発芽するために必要な条件として正しいものはどれか。", choices:["光・水・酸素の3条件がすべて必要","水・適切な温度・酸素（空気）の3条件が必要","光だけあれば発芽する","温度のみが必要"], diff:"基礎", a:1, e:"種子の発芽に必要な3条件：①水（種子の酵素活性化）②適切な温度（酵素の最適温度付近）③空気（酸素：呼吸に必要）。光は多くの植物の発芽に必要ではない（暗所でも発芽する）。成長には光合成に光が必要だが、発芽には貯蔵栄養（胚乳・子葉）を使うため光は不要。"},
  {id:"bio333", cat:"生物", sub:"生態系", q:"干潟（河口の浅い泥地）が生態系として重要な理由として正しいものはどれか。", choices:["干潟は生物がいない砂漠のような場所","干潟は多くの生物の産卵・育成場所であり","干潟は農業に利用できないため価値がない","干潟は埋め立てても生態系への影響はない"], diff:"標準", a:1, e:"干潟：河川から海への移行域。底泥にはゴカイ・カニ・貝など多様な生物が生息し、魚・鳥の餌場・産卵地。底泥の微生物が有機物を分解して水を浄化する（自然の浄水機能）。絶滅危惧種のカブトガニやシギ・チドリ類の重要生息地。開発で多くが失われた。"},
  {id:"bio334", cat:"生物", sub:"動物の分類", q:"無脊椎動物のうち、外骨格（体の外側に硬い骨格）をもつグループはどれか。", choices:["軟体動物（タコ・イカ・貝）","節足動物（昆虫・エビ・カニ）","棘皮動物（ウニ・ヒトデ）","環形動物（ミミズ）"], diff:"基礎", a:1, e:"節足動物（昆虫類・甲殻類・クモ類など）は外骨格（キチン質など）をもち体を保護する。成長に伴い脱皮が必要。軟体動物は貝殻（CaCO₃）をもつものもあるが外骨格とは異なる。棘皮動物は体表に棘（石灰質）をもつ。環形動物（ミミズ）は外骨格をもたない。"},
  {id:"bio335", cat:"生物", sub:"植物のはたらき", q:"落ち葉が分解されて土にかえる（腐食になる）過程に最も関係している生物はどれか。", choices:["植物の根","大型の肉食動物","土中の細菌・菌類（分解者）","空気中の酸素のみ"], diff:"基礎", a:2, e:"落ち葉などの有機物（枯れ葉・死がい）は分解者（腐生細菌・カビなどの菌類）によって無機物（CO₂・水・無機塩類）に分解される。これにより物質が循環し植物の栄養になる。ミミズなど土壌動物も落ち葉を細かくする役割を担う。分解者なしには物質循環が止まる。"},
  {id:"bio336", cat:"生物", sub:"生物の観察", q:"ヒトの血液を顕微鏡で観察すると、最も多く見られる細胞はどれか。", choices:["白血球","血小板","赤血球","リンパ球"], diff:"基礎", a:2, e:"ヒトの血液1mm³に含まれる細胞数：赤血球約500万個（最多・核なし・円盤状・ヘモグロビン含む）、白血球約7000個（核あり・免疫担当・様々な種類）、血小板約25万個（核なし・止血）。赤血球が圧倒的に多く、顕微鏡ではほとんど赤血球が見える。"},
  {id:"bio337", cat:"生物", sub:"生殖と遺伝", q:"ジャガイモのいもでふやす（栄養生殖）ことと、タネ（種子）でふやすことの違いとして正しいものはどれか。", choices:["どちらも同じ遺伝子の個体ができる","いも（栄養生殖）は親と同じ遺伝子の個体","種子の方が常に優良な個体ができる","いもからはふやせない"], diff:"標準", a:1, e:"栄養生殖（無性生殖）：親の体の一部から増えるため、子は親と全く同じ遺伝子をもつ（クローン）。品質が均一になる農業に有利。種子（有性生殖）：受粉・受精で両親の遺伝子が組み合わさり、遺伝的に多様な個体ができる。新品種育成に利用。"},
  {id:"bio338", cat:"生物", sub:"動物のからだ", q:"ヒトが食べたご飯（デンプン）が最終的に体のエネルギーとして使われる過程の順番として正しいものはどれか。", choices:["デンプン→ブドウ糖→血液で全身→細胞で酸化分解（呼吸）→エネルギー","デンプン→直接全身へ→エネルギーと考えられている","デンプン→胃で吸収→エネルギーと考えられている","デンプン→タンパク質→エネルギーと考えられている"], diff:"基礎", a:0, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること／「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】デンプン消化：口（アミラーゼ）・小腸（消化酵素）→ブドウ糖（グルコース）に分解→小腸の柔毛から吸収→血液で全身→細胞の呼吸（グルコース＋O₂→CO₂＋H₂O＋エネルギー）。このエネルギーが筋肉・臓器の活動に使われる。【まちがえやすい点】ほかの選択肢（デンプン→直接全身へ→エネルギー／デンプン→胃で吸収→エネルギー）とのちがいをおさえておこう。"},
  {id:"bio339", cat:"生物", sub:"生物とかんきょう", q:"ある地域に侵入した外来種が在来種を脅かす具体的なしくみとして正しいものはどれか。", choices:["外来種は在来種より体が大きいからつねに勝てる","外来種が在来種の食料を食べ尽くしたり","外来種と在来種は競争しない","外来種はすぐに絶滅するので長期的な影響はない"], diff:"標準", a:1, e:"外来種による在来種への影響：①食料・生息地の競争（外来種が天敵なく大繁殖）②捕食（在来種を食べる：マングース→ヤンバルクイナ）③遺伝的汚染（交雑で在来種の遺伝子が薄れる）。オオクチバス・ウシガエル・アライグマなどが問題。一度定着すると駆除が難しい。"},
  {id:"bio340", cat:"生物", sub:"細胞", q:"生物の体が多くの細胞でできているとき（多細胞生物）のそれぞれの細胞の遺伝情報（DNA）について正しいものはどれか。", choices:["体の部位によってDNAの情報が異なる","体のどの細胞も基本的に同じDNA情報をもつ","血液細胞だけ異なるDNAをもつ","DNAは細胞分裂のたびに新しく作られる"], diff:"基礎", a:1, e:"受精卵の1個の細胞が細胞分裂を繰り返す際、DNAが複製されて娘細胞に正確に受け継がれる。そのため体のどの細胞も（生殖細胞以外）基本的に同じDNA情報をもつ。部位によって使われる遺伝子（発現している遺伝子）が異なるため、形・機能が違う細胞ができる。"},
  {id:"bio341", cat:"生物", sub:"動物の分類", q:"は虫類（ヘビ・トカゲ・カメなど）の特徴として正しいものはどれか。", choices:["体温が周囲の温度によって変わる変温動物で、一生肺で呼吸する","一生を水中で過ごす","幼生は水中でえら呼吸をする","体温を一定に保つ恒温動物である"], diff:"基礎", a:0, e:"【は虫類の特徴】①変温動物（周りの気温によって体温が変わる）②一生を通じて肺で呼吸する③体がかわいたうろこや甲羅でおおわれている④陸上にからのある卵（殻つき卵）を産む。／【両生類とのちがい】両生類は幼生のとき水中でえらや皮膚で呼吸し、成体になると肺と皮膚で呼吸します。は虫類ははじめから肺呼吸で、水中で卵を産む必要がありません。だから完全に陸上で生活できる最初のグループとされています。"},
  {id:"bio342", cat:"生物", sub:"生物の観察", q:"双眼実体顕微鏡の特徴として正しいものはどれか。", choices:["高倍率（数百倍以上）で細胞内を観察できる","倍率は低め（数十倍）だが立体的に観察でき","スライドガラスがつねに必要","水中の生物は観察できない"], diff:"基礎", a:1, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】双眼実体顕微鏡：倍率10〜40倍程度と低いが、両目で立体的に見える。プレパラート不要で直接標本（生きた生物・立体的な物体）を観察できる。光学顕微鏡（300〜1000倍）は細胞内の観察に向く。目的によって使い分けが必要。【まちがえやすい点】ほかの選択肢（高倍率（数百倍以上）で細胞内を観察できる／スライドガラスが必ず必要）とのちがいをおさえておこう。"},
  {id:"bio343", cat:"生物", sub:"植物のつくり", q:"受粉のあと、花粉から花粉管が伸びる目的として正しいものはどれか。", choices:["花粉管の中を精細胞が移動し、胚珠の中の卵細胞と受精するため","花粉管は植物の水分補給のために伸びる","花粉管は花弁を支えるために伸びる","花粉管は光合成をするために伸びる"], diff:"標準", a:0, e:"【ことばの意味】「受粉」＝花粉がめしべの先（柱頭）につくこと。「受精」＝精細胞と卵細胞が合体すること。「花粉管」＝花粉から伸びる細い管。／【花粉管のはたらき】受粉したあと、花粉から花粉管が柱頭から胚珠に向かって伸びていきます。花粉管の中を精細胞が移動し、胚珠の中にある卵細胞にたどり着いて受精します。／【なぜこの仕組みが大事？】水の中を泳いで受精する必要がなくなるため、種子植物は乾いた陸上でも受精・繁殖できるようになりました。これが植物が陸上で栄えた理由の一つです。"},
  {id:"bio344", cat:"生物", sub:"動物のからだ", q:"消化と吸収について正しいものはどれか。", choices:["消化は食物を小さな分子に分解する過程で、栄養素の吸収は主に小腸で行われる","消化は大腸で行われ、吸収は小腸で行われる","ほとんどの栄養素は胃で吸収される","消化酵素は熱しても活性を失わない"], diff:"基礎", a:0, e:"【消化と吸収】「消化」は、食物中の大きな分子（デンプン・タンパク質・脂肪）を、消化酵素のはたらきで小さな分子（ブドウ糖・アミノ酸・脂肪酸）に分解する過程です。「吸収」は、その小さくなった栄養分を体の中に取りこむことで、主に小腸の内側にある柔毛（じゅうもう）というひだで行われます。大腸は主に水分を吸収する場所です。／【まちがえやすい点】消化酵素はタンパク質でできているため、高温にすると立体構造がくずれてはたらきを失います（失活）。"},
  {id:"bio345", cat:"生物", sub:"生物とかんきょう", q:"ミツバチが花から花へ花粉を運ぶことで、植物にとってどんな利益があるか。", choices:["受粉の機会が増え、種子をつくりやすくなる","花を食べられてしまい不利になる","花の色素をうばわれるだけである","植物には利益も不利益もない"], diff:"基礎", a:0, e:"【ことばの意味】「送粉者（そうふんしゃ）」＝花粉を運んでくれる生き物。ミツバチやチョウなどの昆虫が代表例。／【花と虫の助け合い】花はミツバチに蜜（エネルギー源）や花粉（タンパク質源）を提供します。ミツバチは体に花粉をつけたまま別の花へ移動するので、その花に花粉が運ばれて受粉が起こります。／【植物の利益】自分では動けない植物にとって、虫に花粉を運んでもらうことで、他の株と受粉でき、種子をつくる機会が増えます。このような助け合いを相利共生（そうりきょうせい）といいます。"},
  {id:"bio346", cat:"生物", sub:"細胞", q:"デンプンにヨウ素液をかけると青紫色になる反応（ヨウ素デンプン反応）が、光合成の確認に使われる理由として正しいものはどれか。", choices:["光合成でデンプンがつくられ、ヨウ素液はデンプンとだけ特別に反応して色が変わるから","ヨウ素液はどんな有機物とも青紫色になるから","ヨウ素液は葉にふくまれる水分と反応して色が変わるから","青紫色はもともと葉がもつ色である"], diff:"標準", a:0, e:"【ことばの意味】「ヨウ素デンプン反応」＝ヨウ素液がデンプンに出会うと青紫色に変わる特別な反応。デンプン以外の物質（糖・タンパク質など）とは反応しません。／【光合成の確認への利用】植物が光合成をすると、つくられた養分はデンプンとして葉にたくわえられます。葉をヨウ素液につけて青紫色になれば「光合成でデンプンがつくられた証拠」になり、色が変わらなければ「光合成が行われなかった」とわかります。日光を当てた葉と当てない葉を比べる実験でよく使われます。"},
  {id:"bio348", cat:"生物", sub:"生態系", q:"生物の個体数が一定の範囲内で変動しながら安定している状態を何というか。", choices:["個体群の絶滅","生態系のバランス","生物の増殖の法則","遺伝的浮動"], diff:"基礎", a:1, e:"生態系のバランス：捕食・被食の関係などにより、各生物の個体数は周期的に増減しながら長期的には一定範囲に保たれる。これを「動的平衡」または「生態系のバランス」という。外来種侵入・大規模な環境破壊などが起きると、このバランスが崩れて回復困難になることがある。"},
  {id:"bio349", cat:"生物", sub:"植物のはたらき", q:"植物の受粉のしかたには「虫媒花」と「風媒花」がある。風媒花の特徴として正しいものはどれか。", choices:["花びらが目立たず、花粉が軽くて量が多い","花が大きくて鮮やかで、蜜を出す","花粉がねばり気をもち、昆虫の体につきやすい","夜に咲いてコウモリに花粉を運ばせる"], diff:"標準", a:0, e:"【ことばの意味】「虫媒花（ちゅうばいか）」＝昆虫に花粉を運んでもらう花。「風媒花（ふうばいか）」＝風によって花粉が運ばれる花。／【風媒花の特徴】イネ・トウモロコシ・スギなど。虫を引きつける必要がないので、花びらが小さく地味で、蜜も出しません。その代わり、風で遠くまで飛ばせるように花粉が軽くて乾いており、受粉の確率を上げるため大量につくられます。スギ花粉症の原因になるのもこのためです。／【虫媒花】サクラ・アブラナなど。花が大きく鮮やかで蜜を出し、花粉にはねばり気があります。"},
  {id:"bio350", cat:"生物", sub:"生物の観察", q:"生物の分類の基本単位は何か。また、最も近い関係にある分類群はどれか。", choices:["個体が基本単位で、同じ地域に住む集団が最も近い","種が基本単位で、同じ種は互いに交配して子孫を残せる","属（genus）が基本単位と考えられている","科（family）が基本単位と考えられている"], diff:"基礎", a:1, e:"生物分類の階層：種→属→科→目→綱→門→界（→ドメイン）。最小単位は「種（種類）」で、同じ種は通常互いに交配して繁殖能力のある子孫を残せる（生殖的に隔離されていない）。例：イヌ（Canis lupus familiaris）とオオカミ（Canis lupus）は近縁でも別種。"},
  {id:"bio351", cat:"生物", sub:"動物のからだ", q:"体内で尿素が作られる臓器はどこか。", choices:["腎臓","肝臓","小腸","すい臓"], diff:"基礎", a:1, e:"タンパク質の代謝産物アンモニア（NH₃）は毒性が強い。肝臓でアンモニアが尿素（CO(NH₂)₂）に変換される（尿素回路）。尿素は血液で腎臓へ運ばれ、糸球体でろ過されて尿として排出される。腎臓は尿素の「排出」を担い、肝臓は「生成」を担う点を区別しよう。"},
  {id:"bio354", cat:"生物", sub:"動物のからだ", q:"ヒトの皮膚が体の防衛にどのように役立つか、正しいものはどれか。", choices:["皮膚は物理的なバリアとして病原体の侵入を防ぐが、免疫とは関係しない","皮膚は物理的なバリアとして機能し、また皮脂・汗（弱酸性）が細菌の繁殖を抑える","皮膚は呼吸器として酸素を取り込むと考えられている","皮膚はほとんどの細菌を殺菌すると考えられている"], diff:"基礎", a:1, e:"皮膚の防衛機能：①物理的バリア（角質層が病原体の侵入を遮断）②化学的防衛（皮脂・汗で弱酸性環境を作り細菌繁殖を抑える）③常在菌（有用菌が病原菌を抑制）。これらは自然免疫（非特異的防衛）の一部。傷口から病原体が侵入すると、白血球（食作用）や抗体（特異的免疫）が働く。"},
  {id:"bio355", cat:"生物", sub:"生物とかんきょう", q:"絶滅危惧種を守るために国際的に行われる取り組みとして正しいものはどれか。", choices:["絶滅危惧種の肉を食べることを奨励する","ワシントン条約により絶滅危惧種の国際的な商業取引を規制している","絶滅危惧種は自然に増えるから特に保護は不要","絶滅危惧種の保護は各国が全く独自に行う"], diff:"基礎", a:1, e:"ワシントン条約（CITES：絶滅のおそれのある野生動植物の種の国際取引に関する条約）：象牙・ジャコウ・サイの角などの取引を規制。国内では種の保存法で捕獲・販売を規制。動物園での繁殖プログラム（種保存）・生息地保護（自然保護区・国立公園）なども行われる。"},
  {id:"ear308", cat:"地学", sub:"天体の動き", q:"南半球では北半球と季節が逆になる理由として正しいものはどれか。", choices:["南半球は北半球より太陽に近いから","北半球が太陽に近い（夏）とき","南半球では太陽が西から昇るから","南半球の重力が異なるから"], diff:"標準", a:1, e:"地球の地軸は公転面に対して23.4°傾いている。北半球が太陽の方向に傾く（夏至頃）→北半球夏・南半球冬。南半球が太陽の方向に傾く（冬至頃）→北半球冬・南半球夏。12月の北半球が冬のとき、オーストラリアは夏（クリスマスは夏）になる。"},
  {id:"ear309", cat:"地学", sub:"火山と地震", q:"火山灰が地層中に見られると何が分かるか。", choices:["その地層が海底に堆積したこと","過去にその地域で火山噴火があったこと","恐竜が生存していた時代であること","その地域に人間が住んでいたこと"], diff:"基礎", a:1, e:"火山灰層（テフラ）は特定の噴火で同時に広範囲に降り積もる（時間的等時面）。離れた地点の地層でも同じ火山灰層を見つけると「同じ時期に堆積した」と判断できる（鍵層・広域テフラ）。また火山灰の組成分析で火山の特定もできる。地質調査の重要な指標。"},
  {id:"ear310", cat:"地学", sub:"地層と岩石", q:"川が海に流れこむ河口付近に、運ばれてきた土砂が積もってできる平らな地形を何というか。", choices:["三角州","扇状地","カルデラ","リアス海岸"], diff:"基礎", a:0, e:"【ことばの意味】「三角州（さんかくす）」＝川が海や湖に流れこむ河口付近に、運ばれてきた砂やどろが積もってできた、低くて平らな土地。デルタともいいます。／【なぜできる？】海に近づくと川の流れがゆるやかになります。すると水が運んできた土砂を運びきれなくなり、その場に積もっていきます。／【まぎらわしい地形】扇状地＝山から平地に出るところに、れきや砂が扇形に積もった地形。カルデラ＝火山の噴火でできた大きなくぼ地。リアス海岸＝沈んだ谷に海水が入りこんでできた、出入りの複雑な海岸。"},
  {id:"ear311", cat:"地学", sub:"天体の動き", q:"地球の自転と公転の周期について正しいものはどれか。", choices:["自転周期は1年、公転周期は1日","自転周期は約24時間（1日）","どちらも同じ1年","自転周期は1か月、公転周期は1年"], diff:"基礎", a:1, e:"自転：地球が地軸を中心に1回転する運動。周期約24時間（正確には23時間56分）→昼と夜の変化。公転：地球が太陽のまわりを1周する運動。周期約365.25日（1年）→季節の変化・星座の年周変化。月の公転周期は約27.3日（恒星月）・約29.5日（朔望月）。"},
  {id:"ear312", cat:"地学", sub:"天気", q:"春や秋の日本では、天気が数日おきに変わりやすい理由として正しいものはどれか。", choices:["春秋は台風が多いからという地形と考えられている","偏西風の影響で高気圧と低気圧が交互に西から東へ通過する","春秋は月の引力が強くなるからと考えられている","春秋は太陽光が強いからのはたらきと考えられている"], diff:"標準", a:1, e:"春・秋の天気パターン：偏西風（上空の強い西風）にのって移動性高気圧と低気圧が交互に西から東へ通過する。高気圧のとき晴れ、低気圧のとき雨となり、数日おきに天気が変わりやすい。夏は太平洋高気圧が張り出して天気が安定し、冬は西高東低の気圧配置が続く。"},
  {id:"ear313", cat:"地学", sub:"地球と宇宙", q:"星が1等星・2等星などと分けられているのは、何をもとにしているか。", choices:["地球から見たときの明るさ","星そのものの大きさ","星の表面の色あい","星の表面の温度"], diff:"基礎", a:0, e:"【等級とは】地球から見たときの星の明るさを、1等星・2等星…と数字で表したものです。数字が小さいほど明るく見えます。1等星は6等星のちょうど100倍明るいと決められています。／【見かけの明るさ】これは「星そのものの明るさ」と「地球からの距離」の両方で決まります。とても明るい星でも、遠ければ暗く見えます。／【色は別の話】星の色は表面温度で決まります（高温＝青白い、低温＝赤い）。明るさとは別の性質です。／【肉眼の限界】だいたい6等星までが肉眼で見える明るさです。"},
  {id:"ear314", cat:"地学", sub:"火山と地震", q:"震源の真上の地表の点（震央）付近では、震源が浅いほど揺れはどうなる傾向があるか。", choices:["震源が浅いほど揺れが小さいと考えられている","震源が浅いほど震央付近の揺れが大きくなる傾向がある","震源の深さは揺れの強さに無関係と考えられている","震源が深いほど揺れが大きいと考えられている"], diff:"基礎", a:1, e:"【ことばの意味】「震源」＝地下で地震が発生した場所／「震央」＝震源の真上にあたる地表の地点【解説】震源が浅いと震央付近には地震エネルギーが集中的に届くため、揺れが大きくなりやすい。逆に震源が深いと広い範囲が揺れるが各地点での揺れは小さくなりやすい。ただし地盤の違い（軟弱地盤は揺れが大きい）も大きく影響する。【まちがえやすい点】ほかの選択肢（震源が浅いほど揺れが小さい／震源の深さは揺れの強さに無関係）とのちがいをおさえておこう。"},
  {id:"ear315", cat:"地学", sub:"地層と岩石", q:"海岸の波によって岩石が侵食され、切り立った崖（海食崖）や平らな岩盤（波食台）が形成される。この侵食の主な原因はどれか。", choices:["雨水が岩石を溶かすから","波の力（波力）が岩石を削り取るから","気温変化で岩石が膨張収縮するから","動物が岩石を掘るから"], diff:"基礎", a:1, e:"海食地形：波が海岸の岩石に繰り返し打ち付けることで岩石が削られる（海食）。波の力・砂粒の研磨・岩石の割れ目への水の楔効果などが働く。海食崖（海の崖）・波食台（平らな岩盤）・海食洞（洞窟）などが形成される。日本各地の断崖・岬の景観に関係する。"},
  {id:"ear316", cat:"地学", sub:"天体の動き", q:"月食（月が地球の影に入る現象）が起きるのはどのような月相のときか。", choices:["新月のとき","満月のとき","半月（上弦・下弦）のとき","いつでも起きる"], diff:"基礎", a:1, e:"月食の条件：太陽・地球・月がほぼ一直線に並ぶとき（太陽→地球→月の順）。これは満月のときのみ起きる（月が地球の反対側にある）。満月のたびに月食が起きないのは、月の公転軌道が地球の公転軌道に対して約5°傾いているため（通常は地球の影の上や下を通る）。"},
  {id:"ear317", cat:"地学", sub:"天気", q:"冬に日本の太平洋側が乾燥した晴天になりやすい理由として正しいものはどれか。", choices:["太平洋側は海に面しているため水分が多いからと考えられている","日本海側で雪を降らせた後の乾燥した北西の季節風が山を越えて太平洋側に吹き降りる","冬は太平洋高気圧が太平洋側を覆うからと考えられている","冬の太陽光が強く水分を蒸発させるからと考えられている"], diff:"標準", a:1, e:"冬の季節風（北西の風）は日本海で水分を吸収→山脈（脊梁山脈）に当たって上昇・雲を作って日本海側に雪を降らせる→山を越えた後は乾燥した冷たい風（フェーン現象に類似）→太平洋側は晴天・乾燥・空っ風。関東平野の「からっ風」・静岡の「空っ風」が典型。"},
  {id:"ear319", cat:"地学", sub:"地層と岩石", q:"地表の岩石が風・水・温度変化などで細かく砕かれる現象を何というか。", choices:["侵食","堆積","風化","変成"], diff:"基礎", a:2, e:"風化：地表の岩石が長期間にわたって物理的（温度変化による膨張収縮・氷の膨張）・化学的（雨水・酸素・CO₂との反応）・生物的（根の成長・微生物）作用で細かく砕かれる過程。風化産物が水・風で運搬（侵食・運搬）されて低地に堆積（堆積）する。土壌の形成にも関わる。"},
  {id:"ear320", cat:"地学", sub:"天気", q:"ゲリラ豪雨（局地的大雨）が発生するしくみとして正しいものはどれか。", choices:["夏の蒸し暑い日に強い上昇気流が発生し、積乱雲が急速に発達して短時間に激しい雨をもたらす","台風が日本海に入ったとき","冬の寒冷前線が通過するとき","低気圧が遠くにあるとき"], diff:"標準", a:0, e:"【発生のしくみ】夏、地面が強く熱せられると、あたたかくしめった空気が急激に上昇します。これが積乱雲（入道雲）を数十分という短い時間で急速に発達させ、せまい範囲に短時間で猛烈な雨（1時間に50〜100mm以上）をもたらします。／【都市部で起こりやすい理由】アスファルトなどで地面が高温になりやすい都市部（ヒートアイランド現象）では、特に発生しやすいとされています。予測が難しく、急な洪水や浸水の原因になります。"},
  {id:"ear321", cat:"地学", sub:"火山と地震", q:"日本の太平洋側の沖に海溝が並んでいる理由として正しいものはどれか。", choices:["海底に山が多いからという地形と考えられている","海洋プレートが大陸プレートの下に沈み込む場所に海溝ができる","海流が深く掘り削るからによる現象と考えられている","地球の自転で海水が集まるからと考えられている"], diff:"標準", a:1, e:"海溝：海洋プレートが大陸プレートの下に沈み込む沈み込み帯で、地球最深部（マリアナ海溝11000m超）を形成する。日本列島の東沖には太平洋プレート・フィリピン海プレートが沈み込む日本海溝・伊豆－小笠原海溝などがある。この沈み込みが日本の地震・火山の原因。"},
  {id:"ear322", cat:"地学", sub:"天体の動き", q:"日本で南の空を見上げたとき、星は時間がたつとどちら向きに動いて見えるか。", choices:["左（東）から右（西）へ動く","右（西）から左（東）へ動く","上から下へまっすぐ落ちる","その場から動かない"], diff:"基礎", a:0, e:"【ことばの意味】「日周運動」＝地球が1日1回転（自転）しているために、星や太陽が動いて見えること。／【向きの考え方】南を向いて立つと、左手側が東、右手側が西になります。星は東から昇って西に沈むので、南の空では左から右へ動いて見えます。／【なぜ？】星が動いているのではなく、地球が西から東へ回っているため、地上からは天体が逆向き（東→西）に動いて見えます。／【まちがえやすい点】「右から左」は北半球では逆向きです。北の空だけは北極星を中心にぐるっと回るように見えるので、南の空とは見え方が違います。"},
  {id:"ear323", cat:"地学", sub:"地層と岩石", q:"化石燃料（石炭・石油）と現在の大気中CO₂の関係について正しいものはどれか。", choices:["化石燃料は燃やしてもCO₂を出さない","化石燃料は古代生物の炭素を含み","化石燃料は無限に存在する","CO₂は大気中にもともと存在しないガス"], diff:"基礎", a:1, e:"化石燃料の炭素は数億年前に大気からCO₂として固定された炭素。燃焼するとCO₂として再び大気に放出される。産業革命以降の大量燃焼でCO₂濃度が急増（産業革命前約280ppm→現在約420ppm）し、温暖化の主要原因となっている。再生可能エネルギーへの転換が課題。"},
  {id:"ear324", cat:"地学", sub:"天気", q:"霧と雲はどのように違うか。", choices:["霧は水滴、雲は氷晶でできている","霧は地表付近で発生し人が中に入れる状態","霧は海上にしか発生しない","霧は夏にしか発生しない"], diff:"基礎", a:1, e:"霧と雲はともに、空気が冷えて水蒸気が水滴・氷晶に変化したもの（凝結・凝固）で本質は同じ。違いは発生場所：雲は上空で発生した水滴・氷晶の集まり。霧は地表付近（高度の低い）で発生し、視程1km未満のもの。秋〜冬の朝に放射冷却で地表面が冷えて発生しやすい（放射霧）。"},
  {id:"ear326", cat:"地学", sub:"天気", q:"天気予報で「降水確率70%」とはどういう意味か。", choices:["雨量が70mmであること","その地域で雨が降る時間が全体の70%であること","同じような気象条件のとき","70%の地域で雨が降ること"], diff:"標準", a:2, e:"降水確率：同じような気象条件が過去に100回あったとき、そのうち何回1mm以上の降水があったかという統計的確率。70%は「10回に7回の割合で雨が降る」という意味。降水量（mm）ではない。0.5mm未満の降水（雨）は「雨あり」に含まれない。"},
  {id:"ear327", cat:"地学", sub:"地震", q:"地震の揺れが大きい場所と小さい場所で何が異なるか（距離以外の要因）。", choices:["岩盤（固い地盤）では揺れが大きく、軟弱地盤では小さい","軟弱地盤（沖積層・埋立地など）では揺れが増幅されて大きくなりやすい","地盤の種類は揺れに影響しないと考えられている","砂地では揺れが全くないと考えられている"], diff:"標準", a:1, e:"地盤の影響：固い岩盤（N値大）では地震波が速く伝わり揺れが小さい。軟弱な地盤（砂・粘土・埋立地）では地震波の速さが遅くなり、波が「溜まって」揺れが増幅される（表面波増幅）。埋立地・沖積低地・河川沿いは特に揺れが大きくなりやすい。"},
  {id:"ear328", cat:"地学", sub:"地層と岩石", q:"地層累重の法則とはどのような法則か。", choices:["地層は常に水平に堆積する","地層は下にある層ほど古く","地層の厚さは均一である","地層は常に化石を含む"], diff:"基礎", a:1, e:"地層累重の法則（スタノの法則）：堆積物は古いものが先に積もり（下）、新しいものが後から積もる（上）ため、地層は基本的に下が古く上が新しい。ただし地殻変動で逆転した場合は例外。この法則を使って地層の新旧を判断し、生物の進化・地史を明らかにする。"},
  {id:"ear329", cat:"地学", sub:"天体の動き", q:"地球から見て、太陽や星は1時間におよそ何度、東から西へ動くように見えるか。", choices:["約1°","約15°","約30°","約90°"], diff:"標準", a:1, e:"【考え方】地球は24時間で1回転（360°）します。1時間あたりに直すと 360°÷24時間＝15° です。／【つまり】太陽も星も、1時間で約15°ずつ東から西へ動いて見えます。／【使い方】星が30°動いていたら、30÷15＝2時間たったとわかります。／【まちがえやすい点】「約1°」は1日あたり星座がずれる角度（年周運動）です。1時間の日周運動（15°）と混同しないようにしましょう。"},
  {id:"ear330", cat:"地学", sub:"天気", q:"オホーツク海高気圧が発達すると、日本の梅雨や夏の天気にどのような影響を与えるか。", choices:["高温多湿の夏をもたらす","冷たく湿った北東風（やませ）が吹き","太平洋側に強い日照りをもたらす","台風を直接引き寄せる"], diff:"標準", a:1, e:"オホーツク海高気圧：春〜夏に発達する冷たく湿った高気圧。この影響で北東から「やませ」（冷たく湿った風）が東北・北海道に吹き込み、冷夏・冷害をもたらすことがある。また太平洋高気圧とオホーツク海高気圧の間に梅雨前線が停滞し、梅雨が長引く場合も。"},
  {id:"ear332", cat:"地学", sub:"天気", q:"冬の北西季節風が日本海を渡るとき、水分を多く含むようになる理由として正しいものはどれか。", choices:["海面から大量の水が蒸発して風に取り込まれる","北西風が雲を連れてくるから","日本海は浅いため水分が多いから","風が早いため水分を集めやすいから"], diff:"標準", a:0, e:"【ことばの意味】「季節風」＝季節によって決まった向きに吹く風【解説】冬のシベリアからの冷たく乾いた北西風が、比較的水温の高い日本海（暖流「対馬海流」が流れる）を渡る際に海面から大量の水蒸気が蒸発・供給される。水分を含んだ風が山脈にぶつかって上昇→冷却→雲→日本海側に大雪をもたらす。【まちがえやすい点】ほかの選択肢（北西風が雲を連れてくるから／日本海は浅いため水分が多いから）とのちがいをおさえておこう。"},
  {id:"ear334", cat:"地学", sub:"天気", q:"湿度が高い日（蒸し暑い日）に汗が蒸発しにくい理由として正しいものはどれか。", choices:["高温だと汗の成分が変わるから","汗（液体）が蒸発できる余地が少ない","高湿度では皮膚の毛穴が閉じるから","汗の量が少なくなるから"], diff:"標準", a:1, e:"蒸発（気化）は液体の表面から分子が気体に変わる現象。空気中の水蒸気量が多い（相対湿度が高い）ほど、これ以上水蒸気を取り込む余地が少なく、汗が蒸発しにくい。蒸発で熱（気化熱）が奪われるため、汗が蒸発しないと体温が下がらず暑く感じる。"},
  {id:"ear335", cat:"地学", sub:"地層と岩石", q:"礫・砂・泥が川で運搬されるとき、上流から下流に向かって粒の形はどのように変化するか。", choices:["下流に行くほど角張った粒になる","上流は角張った大きな礫","粒の形は場所によって変化しない","下流では全て砂になる"], diff:"標準", a:1, e:"上流の礫は角張っている（侵食直後）。流れに運ばれるうちに他の岩石・岩盤に当たって角が削れ、下流ほど丸みを帯びた（円礫）小さい粒子になる（磨耗）。また粒が小さいほど遠くまで運ばれるため、下流ほど細粒（砂→泥）になる傾向がある。"},
  {id:"ear336", cat:"地学", sub:"天気", q:"アメダス（AMeDAS）とはどのような観測システムか。", choices:["人工衛星から地球の気象を観測するシステムと考えられている","日本全国に設置した地上観測点で降水量・気温・風向・風速などを自動観測するシステム","気象レーダーで降雨分布を観測するシステムと考えられている","海中の温度・塩分を観測するシステムと考えられている"], diff:"基礎", a:1, e:"AMeDAS（Automated Meteorological Data Acquisition System：地域気象観測システム）：約1300か所の無人観測点で降水量・気温・風向・風速・日照時間などを自動計測・送信する。気象予報・防災情報の基礎データに使われる。気象衛星ひまわりとは別のシステム。"},
  {id:"ear337", cat:"地学", sub:"地球と宇宙", q:"月の満ち欠けで「新月→上弦の月→満月→下弦の月→新月」の1サイクルにかかる期間はおよそどれくらいか。", choices:["約7日","約15日による現象","約30日（朔望月）","約365日"], diff:"標準", a:2, e:"朔望月（月の満ち欠けの周期）は約29.5日（約30日）。月が地球を公転する恒星月（約27.3日）より長いのは、地球も太陽のまわりを公転しているため、月が元の位置に戻っても太陽との位置関係が変わってしまい、満ち欠けのサイクルにずれが生じるから。旧暦（太陰暦）はこの朔望月を基準にした暦。"},
  {id:"che277", cat:"化学", sub:"物質のすがた", q:"黒色のフェルトペンのインクをろ紙に点をつけ、水にひたすと色が分かれて見えた。この実験からわかることとして正しいものはどれか。", choices:["黒インクは1種類の色素だけでできている","黒インクは複数の色素が混合されており","ろ紙が色素を作り出している","水の色が変化しただけで色素は分離していない"], diff:"基礎", a:1, e:"この実験（ペーパークロマトグラフィー）では、黒インクが複数の色素（青・赤・黄など）の混合物であることがわかる。色素によって水への溶けやすさが異なるため、水がろ紙をのぼる速さが違い、色素が分離して見える。混合物の分離の学習で扱う実験。"},
  {id:"phy301", cat:"物理", sub:"電流と回路", q:"50Ωの抵抗と100Ωの抵抗を直列につないだとき、合成抵抗は何Ωか。", choices:["50Ω","100Ω","150Ω","約33Ω"], diff:"標準", a:2, e:"【ことばの意味】「抵抗」＝電流の流れにくさ（単位Ω）／「直列」＝電気の通り道が1本道のつなぎ方【解説】直列接続の合成抵抗は各抵抗の和なので、50＋100＝150Ω。並列接続の場合は1/R=1/50+1/100=3/100より約33Ωになる。直列は抵抗が増え、並列は減るという違いをしっかり区別しよう。【まちがえやすい点】ほかの選択肢（50Ω／100Ω）とのちがいをおさえておこう。"},
  {id:"phy302", cat:"物理", sub:"磁界と電流", q:"コイルに磁石を近づけたり遠ざけたりすると電流が発生する。この現象を何というか。", choices:["静電誘導","電磁誘導","磁気共鳴","核融合"], diff:"基礎", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「電磁誘導」＝磁石を動かすとコイルに電流が生まれる現象【解説】電磁誘導：磁界の変化によってコイルに電流（誘導電流）が生じる現象。ファラデーが発見。発電機・変圧器の基本原理。コイルを動かさずに磁石を動かしても、磁石を止めてコイルを動かしても電流が発生する。【まちがえやすい点】ほかの選択肢（静電誘導／磁気共鳴）とのちがいをおさえておこう。"},
  {id:"phy303", cat:"物理", sub:"運動とエネルギー", q:"速さ4m/sで動く質量2kgの物体の運動エネルギーはいくらか。", choices:["8J","16J","32J","4J"], diff:"標準", a:1, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「運動エネルギー」＝動いている物体がもつエネルギー【解説】運動エネルギーEk=½mv²＝½×2×4²＝½×2×16＝16J。速さを2倍にすると4倍になる（2乗に比例）ため、速さの変化が運動エネルギーに与える影響が質量より大きい。【まちがえやすい点】ほかの選択肢（8J／32J）とのちがいをおさえておこう。"},
  {id:"phy304", cat:"物理", sub:"力の働き", q:"地球上で60kgの人が月面に行くと、体重（重力）はどうなるか（月の重力は地球の約1/6）。", choices:["60kgになる","約10kgになる","0kgになる","約360kgになる"], diff:"基礎", a:1, e:"【ことばの意味】「重力」＝地球が物体を引っぱる力／「質量」＝物体そのものの量（場所が変わっても変わらない）【解説】月の重力は地球の約1/6なので、体重（重力の大きさ）は60×1/6＝10kgに相当する力になる。ただし質量（物質の量）は変わらず60kgのまま。「質量は変わらないが重さは変わる」という区別が重要。【まちがえやすい点】ほかの選択肢（60kgになる／0kgになる）とのちがいをおさえておこう。"},
  {id:"phy305", cat:"物理", sub:"光と音", q:"光が水中からガラスに入るとき、屈折の向きはどうなるか。", choices:["境界面に近づく向きに曲がる","境界面から遠ざかる向きに曲がる","曲がらずに直進する","全反射する"], diff:"標準", a:0, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること【解説】光は密度の小さい媒質から大きい媒質へ進むとき、法線に近づく方向（境界面から遠ざかる向き）に曲がる。ガラスは水より密度が大きいため、水→ガラスで境界面に近づく向きに屈折する。空気→ガラスでも同様。【まちがえやすい点】ほかの選択肢（境界面から遠ざかる向きに曲がる／曲がらずに直進する）とのちがいをおさえておこう。"},
  {id:"phy306", cat:"物理", sub:"熱の伝わり方", q:"やかんでお湯を沸かすとき、底から上へと熱水が循環して全体が温まる現象は熱の伝わり方のうちどれか。", choices:["伝導","対流","放射","蒸発"], diff:"標準", a:1, e:"【ことばの意味】「伝導」＝物を伝わって熱が移動すること／「対流」＝あたたまった液体や気体が動いて熱を運ぶこと【解説】対流：液体や気体が移動することで熱が伝わる現象。お湯が沸くとき底の熱い水が上がり、冷たい水が下がって循環する。暖房機器の暖かい空気が上に上がるのも対流。伝導（固体）・放射（電磁波）と区別しよう。【まちがえやすい点】ほかの選択肢（伝導／放射）とのちがいをおさえておこう。"},
  {id:"phy307", cat:"物理", sub:"仕事とエネルギー", q:"質量3kgの物体を4mの高さから落とした。地面に達したときの運動エネルギーはおよそいくらか（g=10m/s²、空気抵抗無視）。", choices:["30J","120J","12J","1200J"], diff:"標準", a:1, e:"【ことばの意味】「抵抗」＝電流の流れにくさ（単位Ω）／「質量」＝物体そのものの量（場所が変わっても変わらない）【解説】力学的エネルギー保存の法則より、位置エネルギーがすべて運動エネルギーに変換される。Ek＝mgh＝3×10×4＝120J。この関係から着地速度も計算できる（½mv²＝120より、v＝√80≈8.9m/s）。【まちがえやすい点】ほかの選択肢（30J／12J）とのちがいをおさえておこう。"},
  {id:"phy308", cat:"物理", sub:"電流と回路", q:"電球の明るさを変えるための「調光器（ディマー）」は主に何を変化させているか。", choices:["電球の抵抗","電源の周波数","電球に加わる電圧または電流","電球の温度"], diff:"基礎", a:2, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】調光器は電球に加わる電圧（または電流）を変化させて明るさを調節する。電圧が高いほど電流が多く流れ、明るくなる（P=VI）。LED対応の調光器は特殊な回路が必要なものもある。【まちがえやすい点】ほかの選択肢（電球の抵抗／電源の周波数）とのちがいをおさえておこう。"},
  {id:"phy309", cat:"物理", sub:"力の働き", q:"30Nの力と40Nの力が直角に合わさるとき、合力の大きさはいくらか。", choices:["70N","50N","10N","35N"], diff:"標準", a:1, e:"【ことばの意味】「合力」＝複数の力を1つにまとめた力【解説】直角に交わる2力の合力は三平方の定理（ピタゴラスの定理）で求める。合力＝√(30²＋40²)＝√(900＋1600)＝√2500＝50N。3:4:5の三角形の比を使うと暗算できる（30:40:合力＝3:4:5×10）。【まちがえやすい点】ほかの選択肢（70N／10N）とのちがいをおさえておこう。"},
  {id:"phy310", cat:"物理", sub:"エネルギーの利用", q:"バイオマス発電はどのようなエネルギーを利用するか。", choices:["太陽光エネルギー","動植物由来の有機物が持つ化学エネルギー","地熱エネルギー","潮の満ち引きのエネルギー"], diff:"基礎", a:1, e:"バイオマス発電は木材・農業廃棄物・食品廃棄物などの生物由来の有機物を燃焼・発酵させてエネルギーを取り出す。燃やした際に排出するCO₂は植物が光合成で吸収したものなので、理論上カーボンニュートラルとされる。再生可能エネルギーの一種。"},
  {id:"che266", cat:"化学", sub:"物質のすがた", q:"原子の構造として正しいものはどれか。", choices:["原子は核と電子から成り","原子は電子のみから成る","原子の核には陽子のみが含まれる","原子は分裂しない最小単位である"], diff:"基礎", a:0, e:"【ことばの意味】「中性」＝pHが7の性質。リトマス紙の色が変わらない／「化学変化」＝物質そのものが別の物質に変わること【解説】原子＝原子核（陽子＋中性子）＋電子。陽子数＝原子番号（元素の種類を決める）。中性子数が異なるものが同位体。電子は核の周りを運動し、化学結合に関わる。中学では「原子は化学変化では分割されない」というレベルで学ぶ。【まちがえやすい点】ほかの選択肢（原子は電子のみから成る／原子の核には陽子のみが含まれる）とのちがいをおさえておこう。"},
  {id:"che267", cat:"化学", sub:"化学変化と質量", q:"木炭が燃えると軽くなる（灰が残る）が、質量保存の法則に矛盾しないのはなぜか。", choices:["燃焼で質量が消滅するから","残った灰は軽くなるが全体では保存される","木炭の質量は燃焼前後で変わらないから","燃焼は化学変化ではないから"], diff:"標準", a:1, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと【解説】有機物の燃焼：有機物＋O₂→CO₂＋H₂O＋熱。CO₂と水蒸気が気体として逃げるため、残る灰（主に無機物）は元の木炭より軽い。密閉容器で燃焼させれば全体の質量は変わらないことで質量保存を確認できる。【まちがえやすい点】ほかの選択肢（燃焼で質量が消滅するから／木炭の質量は燃焼前後で変わらないから）とのちがいをおさえておこう。"},
  {id:"che268", cat:"化学", sub:"酸・アルカリと中和", q:"アルカリ性の水溶液を示す指示薬の変色として正しいものはどれか。", choices:["フェノールフタレイン液が無色のまま","BTB溶液が黄色になる","フェノールフタレイン液が赤色になる","リトマス紙（青）が赤色になる"], diff:"基礎", a:2, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「アルカリ性」＝pHが7より大きい性質。赤リトマスを青にする【解説】フェノールフタレイン液はアルカリ性で赤（赤紫）色、酸性・中性では無色。BTB溶液はアルカリ性で青色、中性で緑色、酸性で黄色。赤リトマスが青→アルカリ性、青リトマスが赤→酸性。指示薬の色と液性のセットを確認しよう。【まちがえやすい点】ほかの選択肢（フェノールフタレイン液が無色のまま／BTB溶液が黄色になる）とのちがいをおさえておこう。"},
  {id:"che269", cat:"化学", sub:"水溶液とイオン", q:"電解質水溶液が電気を通す理由として正しいものはどれか。", choices:["水が電気を通すから","溶けている電解質がイオンに電離して","水溶液には気泡が多く含まれるから","電解質が金属になるから"], diff:"標準", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「電解質」＝水にとかすと電気を通す物質【解説】電解質（塩化ナトリウム・塩酸・水酸化ナトリウムなど）は水中でイオンに電離する。正イオンが陰極へ、負イオンが陽極へ移動することで電荷が運ばれ電流が流れる。純水にはイオンがほとんどなく電気を通しにくい。【まちがえやすい点】ほかの選択肢（水が電気を通すから／水溶液には気泡が多く含まれるから）とのちがいをおさえておこう。"},
  {id:"che270", cat:"化学", sub:"化学変化と質量", q:"銅と酸素が4:1の質量比で反応する。銅2.4gを完全に酸化させるとき、酸化銅は何gできるか。", choices:["2.4g","2.5g","3.0g","4.8g"], diff:"標準", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「酸化」＝物質が酸素と結びつくこと【解説】銅:酸素＝4:1より、銅2.4gに結合する酸素＝2.4÷4＝0.6g。酸化銅＝2.4＋0.6＝3.0g。別の確認：銅:酸化銅＝4:5なので、2.4×5/4＝3.0g。比の法則を使う際は「何が基準か」を明確に。【まちがえやすい点】ほかの選択肢（2.4g／2.5g）とのちがいをおさえておこう。"},
  {id:"che271", cat:"化学", sub:"気体の性質", q:"酸素の性質として正しいものはどれか。", choices:["無色無臭で、空気より軽い","物が燃えるのを助けるはたらき（助燃性）がある","酸素自体が燃えやすい気体である","水に非常に溶けやすい"], diff:"基礎", a:1, e:"酸素（O₂）の性質：無色・無臭・助燃性（ものが燃えるのを助ける）・空気より少し重い（分子量32＞空気29）・水に溶けにくい。酸素自体は燃えない（支然性）。水上置換または下方置換で捕集。二酸化マンガンと過酸化水素水の反応で実験室生成。"},
  {id:"che272", cat:"化学", sub:"酸化と還元", q:"鉄と塩酸が反応したとき発生する気体と、生成する塩の組み合わせとして正しいものはどれか。", choices:["酸素と塩化鉄","水素と塩化鉄","二酸化炭素と塩化鉄","水素と硫化鉄"], diff:"基礎", a:1, e:"Fe＋2HCl→FeCl₂（塩化鉄）＋H₂。鉄は水素よりイオン化傾向が大きいので塩酸に溶ける（Feがイオンになりやすい）。発生した水素は水上置換で集め、マッチの炎を近づけると「ポン」と音を立てて燃える。亜鉛・マグネシウムでも同様の反応が起きる。"},
  {id:"che273", cat:"化学", sub:"物質のすがた", q:"蒸留と蒸発の違いとして正しいものはどれか。", choices:["蒸留は固体を気体にする操作、蒸発は液体を気体にする操作","蒸発は液体から水分のみを蒸発させ、蒸留は液体混合物を沸点差で分離・回収する操作","蒸留では蒸気を冷やして液体として回収するが、蒸発では回収しない","どちらも同じ操作で区別がない"], diff:"標準", a:2, e:"【ことばの意味】「沸点」＝液体がふっとうして気体になる温度／「蒸留」＝沸点の違いを利用して液体を分ける方法【解説】蒸発：液体から気体への変化（蒸気は回収しない）。蒸留：加熱して発生した蒸気を冷却管で液体に戻して回収し、沸点差で成分を分離する操作。海水から純水を得たり、アルコールを精製したりするのに使う。【まちがえやすい点】ほかの選択肢（蒸留は固体を気体にする操作、蒸発は液体を気体…／蒸発は液体から水分のみを蒸発させ、蒸留は液体…）とのちがいをおさえておこう。"},
  {id:"che274", cat:"化学", sub:"身近な化学変化", q:"ものが不完全燃焼したときに発生し、少量でも人体に危険なのはどれか。", choices:["一酸化炭素","二酸化炭素","酸素","窒素"], diff:"標準", a:0, e:"【ことばの意味】「不完全燃焼」＝酸素が足りない状態で燃えること。／【何ができる？】酸素が十分にあれば炭素は二酸化炭素（CO₂）になりますが、足りないと一酸化炭素（CO）ができます。／【なぜ危険？】一酸化炭素は色もにおいもないので気づきにくく、血液中で酸素を運ぶはたらきをじゃまします。そのため少量でも中毒を起こし、命にかかわります。／【予防】ストーブやガス器具を使うときは、こまめに換気することが大切です。／【二酸化炭素との違い】二酸化炭素も濃すぎれば危険ですが、一酸化炭素はごく少量で害があります。"},
  {id:"che275", cat:"化学", sub:"水溶液とイオン", q:"水溶液中で電離しているナトリウムイオン（Na⁺）の性質として正しいものはどれか。", choices:["ナトリウムの金属としての性質（水と激しく反応する）を保っている","Na⁺は陽イオンで、陰極に引き寄せられる","Na⁺は電気を持たない","Na⁺は水に溶けにくい"], diff:"基礎", a:1, e:"Na⁺はナトリウム原子が電子1個を失ってできた陽イオンで、電気分解の際に陰極（マイナス極）に引き寄せられる。Na⁺は金属ナトリウムとは全く異なる性質をもつ（水と激しく反応しない）。これが「化合物は成分元素と異なる性質」の具体例。"},
  {id:"che276", cat:"化学", sub:"化学変化と質量", q:"石灰石に塩酸を加えて発生するCO₂の量は何によって決まるか。", choices:["石灰石の大きさ（粒の形）","石灰石の種類（産地）","反応する石灰石と塩酸の量","実験する気温だけで決まる"], diff:"基礎", a:2, e:"化学反応で生成する物質の量は、反応物の量（物質量の比）によって決まる（定比例の法則）。石灰石または塩酸のどちらかが先に使い切られると反応が止まる（過不足の考え方）。粒の大きさは反応速度に影響するが、最終的な生成量は変えない。"},
  {id:"bio316", cat:"生物", sub:"生殖と遺伝", q:"メンデルがエンドウを実験に用いた理由として最も適切なものはどれか。", choices:["エンドウが最も大きな植物だから","エンドウは互いに対立する形質がはっきりしており","エンドウの遺伝子が最も単純だから","エンドウは種子が多く実験材料を集めやすいから"], diff:"標準", a:1, e:"【ことばの意味】「受粉」＝花粉がめしべの先（柱頭）につくこと【解説】メンデルがエンドウを選んだ理由：①丸/しわ、高/低茎など対立形質が明確。②自家受粉（閉鎖花）で純系が得やすい。③一世代が短い（1年）。④種子・さや等の観察しやすい形質がある。これらの条件が遺伝の法則発見を可能にした。【まちがえやすい点】ほかの選択肢（エンドウが最も大きな植物だから／エンドウの遺伝子が最も単純だから）とのちがいをおさえておこう。"},
  {id:"bio317", cat:"生物", sub:"植物のつくり", q:"コケ植物の特徴として正しいものはどれか。", choices:["維管束をもたず、根・茎・葉の区別がはっきりしていない","維管束をもち、根・茎・葉の区別がはっきりしている","種子をつくってなかまをふやし、花をさかせる","維管束をもち、種子で子孫をふやしていく"], diff:"基礎", a:0, e:"【ことばの意味】「維管束」＝水や養分の通り道が集まった管の束。「仮根」＝コケ植物にある、体を地面に固定するための根に似たつくり（水を吸う力は弱い）。／【コケ植物の特徴】スギゴケ・ゼニゴケなど。維管束をもたないため、根・茎・葉のはっきりした区別がありません。仮根で体を支え、体全体で水を吸収します。胞子でなかまをふやします。湿った場所を好みます。／【他の植物と比べると】シダ植物は維管束をもち根・茎・葉の区別があります（胞子でふえる）。種子植物は維管束をもち種子でふえます。"},
  {id:"bio318", cat:"生物", sub:"動物の分類", q:"魚類・両生類・爬虫類・鳥類・哺乳類の5グループで、体外受精を行うグループとして正しいものはどれか。", choices:["鳥類と哺乳類","魚類と両生類","爬虫類と哺乳類","ほとんどの脊椎動物"], diff:"基礎", a:1, e:"体外受精（卵と精子が体外で受精）：魚類・両生類。体内受精（体内で受精）：爬虫類・鳥類・哺乳類。両生類は水中で産卵・体外受精（カエルの卵）。哺乳類は胎生（体内で発育）が多い。この区別は脊椎動物の進化と水への依存度と関連する。"},
  {id:"bio319", cat:"生物", sub:"細胞", q:"多細胞生物における細胞・組織・器官・個体の関係として正しいものはどれか。", choices:["細胞→器官→組織→個体の順に大きくなる","細胞が集まって組織、組織が集まって器官","組織と器官は同じ意味","個体を分割すると細胞になる"], diff:"標準", a:1, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】多細胞生物の構成：細胞（最小単位）→組織（同じ種類の細胞の集まり）→器官（複数の組織が集まって特定の機能）→個体（複数の器官が集まった全体）。例：筋細胞→筋組織→心臓（器官）→ヒト（個体）。【まちがえやすい点】ほかの選択肢（細胞→器官→組織→個体の順に大きくなる／組織と器官は同じ意味）とのちがいをおさえておこう。"},
  {id:"bio320", cat:"生物", sub:"生物とかんきょう", q:"食物連鎖と食物網の違いとして正しいものはどれか。", choices:["食物連鎖は一本の直線的な関係で、食物網は複数の食物連鎖が網の目のように複雑につながったものである","食物連鎖は複数の生物が網のように複雑につながった関係である","食物網の方が生物の種類が少ない","どちらも全く同じ意味の言葉である"], diff:"標準", a:0, e:"【ことばの意味】「食物連鎖」＝「草→バッタ→カエル→ヘビ」のような、食う・食われるの一本の直線的なつながり。「食物網」＝実際の自然界では1種の生物が複数の食物を食べたり、複数の敵に食べられたりするため、いくつもの食物連鎖が組み合わさって網の目のように複雑になったもの。／【まちがえやすい点】食物網は食物連鎖より生物の種類も関係も多く、より現実に近い姿を表しています。同じ意味の言葉ではありません。"},
  {id:"bio321", cat:"生物", sub:"動物のからだ", q:"胃液の成分とはたらきとして正しいものはどれか。", choices:["アミラーゼを含み、デンプンを分解する","塩酸（胃酸）とペプシンを含み","胆汁を含み、脂肪を乳化する","ステアプシンを含み、脂肪を分解する"], diff:"基礎", a:1, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）／「分解」＝1つの物質が2つ以上の物質に分かれること【解説】胃液：塩酸（pH約1〜2の強酸）で殺菌＋ペプシン（タンパク質をポリペプチドに分解）。アミラーゼはだ液（デンプン消化）。胆汁は肝臓が作り胆のうに蓄え（消化酵素含まず、脂肪の乳化）。ステアプシンはすい臓のリパーゼの旧称。【まちがえやすい点】ほかの選択肢（アミラーゼを含み、デンプンを分解する／胆汁を含み、脂肪を乳化する）とのちがいをおさえておこう。"},
  {id:"bio322", cat:"生物", sub:"植物のはたらき", q:"光合成の速さに影響する要因として正しいものはどれか。", choices:["光の強さ・温度・二酸化炭素の濃度など、複数の要因が関わっている","光の強さだけが影響する","温度だけが影響する","どの要因も光合成の速さには関係しない"], diff:"標準", a:0, e:"【光合成に必要なもの】光・水・二酸化炭素の3つが必要です。／【速さを決める要因】光の強さ・気温（酵素のはたらきやすさに関係）・二酸化炭素の濃度など、いくつもの条件が組み合わさって光合成の速さが決まります。／【制限要因の考え方】このうち、最も不足している条件が全体の速さを決めます。例えば光が十分でも二酸化炭素が少なければ、それ以上光合成は速くなりません。夏の畑でビニールハウスにCO₂を送るのはこのためです。"},
  {id:"bio323", cat:"生物", sub:"細胞", q:"植物細胞の中にある「液胞」のはたらきとして正しいものはどれか。", choices:["細胞液をたくわえて、細胞の張り（膨圧）を保つ","光合成を行う","細胞分裂を行う","タンパク質を合成する"], diff:"基礎", a:0, e:"【ことばの意味】「液胞」＝植物の細胞に見られる、水分などをたくわえる袋。中には「細胞液」という液体が入っていて、糖・色素・有機酸などがとけています。／【はたらき】液胞に水が入って大きくふくらむと、細胞が内側からピンと張った状態（膨圧）になり、植物のからだをしっかり支えます。水が不足すると液胞が縮み、植物がしおれます。／【他の選択肢】光合成は葉緑体、細胞分裂は核（染色体）、タンパク質の合成はリボソームが行います。液胞は成長した植物細胞で特に大きく発達しています。"},
  {id:"bio324", cat:"生物", sub:"生態系", q:"ある地域の生態系で草食動物が大量に増えた場合、時間がたつとどのようになると考えられるか。", choices:["植物（生産者）が食べられすぎて減少し、やがて草食動物も食料不足で減少していく","草食動物はそのまま増え続ける","肉食動物がすぐに姿を消す","植物がどんどん増えていく"], diff:"基礎", a:0, e:"【生態系のバランス】草食動物が増える→植物（えさ）が食べられすぎて減る→草食動物の食料が足りなくなる→草食動物も減る→植物が回復する→また草食動物が増える、というように、個体数は増えたり減ったりをくり返しながら、長い目で見るとバランスが保たれます。／【まちがえやすい点】草食動物が増えすぎても、えさである植物が無限にあるわけではないので、いつまでも増え続けることはできません。"},
  {id:"bio325", cat:"生物", sub:"動物のからだ", q:"ヒトの排出のしくみとして正しいものはどれか。", choices:["尿は腎臓でつくられ、輸尿管・膀胱・尿道を通って体外に出される","尿は膀胱でつくられる","汗と尿の主な成分は全く同じである","排出物にはいらなくなった物質しかふくまれない"], diff:"基礎", a:0, e:"【排出の道すじ】腎臓（尿をつくる）→輸尿管（尿の通り道）→膀胱（尿をためる）→尿道（体外に出る）。／【腎臓のはたらき】血液を細かい血管（糸球体）でろ過して原尿をつくり、尿細管で必要な物質（水・ブドウ糖など）を再吸収します。残った不要な物質（尿素など）が尿として排出されます。／【まちがえやすい点】尿をつくるのは腎臓で、膀胱はためておくだけの場所です。汗は主に水分と塩分でできており、尿ほど尿素をふくみません。"},
  {id:"ear296", cat:"地学", sub:"火山と地震", q:"火山の噴火が近づいたときに観測されることが多いのはどれか。", choices:["火山付近での小さな地震が増える","その地域の日照時間が長くなる","まわりの気圧が急に高くなる","その地域の降水量が急に増える"], diff:"標準", a:0, e:"【なぜ地震が増える？】地下のマグマが上昇してくると、まわりの岩石を押しのけたり割ったりします。そのときに小さな地震（火山性地震）がたくさん起こります。／【ほかの前ぶれ】山がふくらむ（地面のわずかな変形）、火山ガスの量が増える、山の温度が上がる、といった変化も観測されます。／【観測のしくみ】気象庁は地震計・GPS・カメラなどで常時監視し、危険がある場合は噴火警戒レベルを発表します。／【まちがえやすい点】日照時間・気圧・降水量は天気に関する要素で、噴火の前ぶれではありません。"},
  {id:"ear297", cat:"地学", sub:"天体の動き", q:"東京（北緯約35°）で、夏至の日の太陽の南中高度に最も近いものはどれか。", choices:["約31°","約55°","約78°","約90°"], diff:"標準", a:2, e:"【ことばの意味】「南中高度」＝太陽が真南に来たとき、地平線から測った角度のこと。／【計算のしかた】夏至の南中高度＝90°−（その土地の緯度）＋23.4°。東京なら 90−35＋23.4＝78.4°、約78°です。／【他の日は】春分・秋分は 90−35＝55°、冬至は 90−35−23.4＝約31°。／【23.4°って何？】地球の地軸が公転面に対して23.4°傾いていることによる数字です。この傾きが季節をつくります。／【まちがえやすい点】約55°は春分・秋分、約31°は冬至の値です。"},
  {id:"ear299", cat:"地学", sub:"天気", q:"梅雨（つゆ）が発生する主な原因として正しいものはどれか。", choices:["太陽活動が弱まるからという地形と考えられている","オホーツク海高気圧と太平洋高気圧の間に停滞前線ができる","大陸から冷たい空気が流れ込むからと考えられている","偏西風が日本列島の真上を通るからと考えられている"], diff:"基礎", a:1, e:"梅雨前線：冷たく湿ったオホーツク海気団と、暖かく湿った太平洋気団がほぼ等しい勢力でぶつかり合うため境界が停滞する。この停滞前線（梅雨前線）が日本付近に長期間停滞して曇り・雨の日が続く。梅雨明け後は太平洋高気圧が優勢になる。"},
  {id:"ear300", cat:"地学", sub:"地球と宇宙", q:"「地球型惑星」と「木星型惑星」の主な違いとして正しいものはどれか。", choices:["地球型惑星は気体でできており、木星型惑星は岩石でできている","地球型惑星は岩石・金属でできており小さく密度が高い","どちらも同じ組成でできている","木星型惑星は水星や金星のことを指す"], diff:"標準", a:1, e:"地球型惑星（水星・金星・地球・火星）：岩石・鉄主体・小型・高密度。木星型惑星（木星・土星・天王星・海王星）：水素・ヘリウムなどのガス主体（天王星・海王星は水などの氷主体）・大型・低密度。この分類は太陽系の形成過程と関連する。"},
  {id:"ear301", cat:"地学", sub:"天気", q:"積乱雲（入道雲）が発達するのはどのような気象条件のときか。", choices:["上空に暖かい空気が広がる安定した大気のとき","地面が強く温められ上昇気流が起きる不安定な大気のとき","大陸からの冷たい風が吹くときと考えられている","高気圧が中心にあるときと考えられている"], diff:"基礎", a:1, e:"【解説】積乱雲の発生：地面が強く加熱→暖かい湿った空気が急激に上昇→断熱冷却で水蒸気が凝結→潜熱放出でさらに上昇→高さ10km以上の巨大な雲に発達。夏の午後の雷雨・夕立・竜巻・ひょうをもたらす。台風の雨もこの雲による。【まちがえやすい点】ほかの選択肢（上空に暖かい空気が広がる安定した大気のとき／大陸からの冷たい風が吹くとき）とのちがいをおさえておこう。"},
  {id:"ear302", cat:"地学", sub:"地層と岩石", q:"石炭や石油が化石燃料と呼ばれる理由として正しいものはどれか。", choices:["化石のように固くなった燃料だからと考えられている","古代の生物の遺骸が長い年月をかけて変化して生成した燃料だ","化石が多く含まれているからと考えられている","掘り出す際に化石が見つかるからと考えられている"], diff:"標準", a:1, e:"化石燃料：石炭（古代の陸上植物が変質）・石油（海洋の微生物・プランクトンの遺骸が変質）・天然ガス（主にメタン）。形成に何億年もかかり、一度使うと再生できない（非再生可能エネルギー）。燃焼でCO₂を放出し温暖化の原因になる。"},
  {id:"ear303", cat:"地学", sub:"火山と地震", q:"火山の恵みとして正しいものはどれか。", choices:["火山は害しかもたらさないと考えられている","温泉・地熱エネルギー・肥沃な土壌・観光資源などの恩恵がある","火山地帯の土壌は農業に向かないと考えられている","温泉は火山とは無関係と考えられている"], diff:"基礎", a:1, e:"火山の恵み：①温泉（地下水が加熱）②地熱発電（地下の熱でタービン回転）③肥沃な土壌（ミネラル豊富な火山灰土）④観光資源（富士山・阿蘇など）⑤建材（火山岩石・軽石）。火山は危険もあるが、日本の生活・文化に深く関わる恵みでもある。"},
  {id:"ear304", cat:"地学", sub:"天体の動き", q:"月の出る時刻が毎日およそ50分ずつ遅くなるのはなぜか。", choices:["月の自転の速さが毎日変わるからと考えられている","地球が自転してその位置に追いつくのに余分な時間がかかる","地球の自転の速さが毎日変わるからと考えられている","太陽の引力で月の軌道が毎日変わるから"], diff:"標準", a:1, e:"【前提】地球は1日1回自転しています。もし月が止まっていれば、月の出る時刻は毎日同じになるはずです。／【実際は】月も地球のまわりを回っている（公転している）ので、1日たつと月は少し先の位置に移動しています。／【結果】地球が自転してその「ずれた月の位置」に追いつくまで、余分に約50分かかります。だから月の出は毎日約50分ずつ遅くなります。／【まちがえやすい点】自転や公転の「速さが変わる」わけではありません。速さは一定で、位置関係のずれが原因です。"},
  {id:"ear305", cat:"地学", sub:"天気", q:"大気中の水蒸気量が同じとき、気温が下がると相対湿度はどうなるか。", choices:["下がる","変わらない","上がる","急に0になる"], diff:"標準", a:2, e:"相対湿度＝現在の水蒸気量÷飽和水蒸気量×100。気温が下がると飽和水蒸気量が減少するので、同じ水蒸気量でも相対湿度が上がる。夜間に気温が下がると湿度が上がり、露点以下になると露や霧が生じる。朝露は夜間の冷却による湿度上昇・凝結が原因。"},
  {id:"ear306", cat:"地学", sub:"地球と宇宙", q:"はっきりとした大きな輪（リング）をもつことで知られている惑星はどれか。", choices:["土星","火星","水星","地球"], diff:"基礎", a:0, e:"【土星の輪】土星は太陽系の中でもっともはっきりした大きな輪をもつ惑星です。望遠鏡でも観察でき、その姿は太陽系で最も有名な光景のひとつです。／【輪の正体】無数の氷や岩のかけらが土星のまわりを回っているものです。幅は数万kmもありますが、厚さはとても薄く、真横から見るとほとんど見えなくなります。／【ほかの惑星は？】木星・天王星・海王星にも輪はありますが、とても薄くて暗いため、地球からはほとんど見えません。／【まちがえやすい点】火星・水星・地球のような岩石でできた惑星には輪がありません。"},
  {id:"ear307", cat:"地学", sub:"天気", q:"冬の日本付近で偏西風が南に蛇行すると、日本ではどのような天気になりやすいか。", choices:["南風が吹いて暖冬になりやすい","偏西風の南側に寒気が流れ込みやすくなり","偏西風は天気に影響しない","梅雨前線が形成されやすくなる"], diff:"標準", a:1, e:"【解説】偏西風は通常日本の北を吹くが、南に蛇行（ロスビー波）すると日本上空に寒気が流れ込みやすくなる。偏西風が大きく波打つと「ブロッキング現象」が起きて同じ気圧配置が続き、大寒波・大雪や逆に暖冬が長期間続くことがある。【まちがえやすい点】ほかの選択肢（南風が吹いて暖冬になりやすい／偏西風は天気に影響しない）とのちがいをおさえておこう。"},
  {id:"phy271", cat:"物理", sub:"力の働き", q:"重さ60Nの物体を水中に入れたら、はかりの示す値が45Nになった。この物体にはたらく浮力は何Nか。", choices:["15N","45N","60N","105N"], diff:"標準", a:0, e:"【ことばの意味】「浮力」＝液体や気体の中で物体を上向きに押す力／「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）【解説】浮力＝空気中の重さ－水中の重さ＝60N－45N＝15N。アルキメデスの原理より浮力は物体が押しのけた水の重さに等しい。この計算方法はよく出題されるので、「空気中の重さ－液体中の重さ＝浮力」と覚えておこう。【まちがえやすい点】ほかの選択肢（45N／60N）とのちがいをおさえておこう。"},
  {id:"phy272", cat:"物理", sub:"電流と回路", q:"電熱線Aと電熱線B（Bの抵抗はAの2倍）を直列につないだ回路では、発熱量の比A:Bはどうなるか。", choices:["1:1","2:1","1:2","4:1"], diff:"基礎", a:2, e:"直列回路では全抵抗に同じ電流Iが流れる。発熱量Q=I²Rt より、時間tが同じなら発熱量は抵抗Rに比例する。BはAの2倍の抵抗なので発熱量比A:B=1:2。電圧比も同様に1:2。並列回路では逆に抵抗が大きい方が発熱量が小さくなる点と対比しよう。"},
  {id:"phy273", cat:"物理", sub:"磁界と電流", q:"右手を使って電流の向きとコイルの磁極の向きを判断する方法として正しいものはどれか。", choices:["右手の親指を電流の向きに合わせると、4本の指が磁界の向きを示す","右手の4本の指を電流の向きに合わせてコイルを握ると、親指の向きがN極になる","右手の人差し指を電流の向きに合わせると、中指が磁界の向きを示す","右手のひらを電流の向きに向けると、指先がN極になる"], diff:"基礎", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「磁界」＝磁石の力がはたらいている空間【解説】右ねじ（右手）の法則：コイルに電流が流れる向きに右手の4本指を曲げると、親指の向きがN極。この覚え方でコイルの磁極を判断できる。直線電流の場合は「右手の親指を電流の向きに向けると、4本指が磁界の向きを示す」。【まちがえやすい点】ほかの選択肢（右手の親指を電流の向きに合わせると、4本の指…／右手の人差し指を電流の向きに合わせると、中指…）とのちがいをおさえておこう。"},
  {id:"phy274", cat:"物理", sub:"光と音", q:"全反射が起きる条件として正しいものはどれか。", choices:["光が密度の小さい媒質から密度の大きい媒質に進むとき","光が密度の大きい媒質から密度の小さい媒質に進み","光が同じ媒質を進むとき","入射角が0°のとき"], diff:"基礎", a:1, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること／「全反射」＝光がまったく外に出ずに、すべてはね返ること【解説】全反射：光が密度の大きい媒質（水・ガラス）から密度の小さい媒質（空気）へ進む際、入射角が臨界角以上になると光が境界面で完全に反射される現象。光ファイバー・ダイヤモンドの輝き・蜃気楼など多くの現象に関係する。【まちがえやすい点】ほかの選択肢（光が密度の小さい媒質から密度の大きい媒質に進…／光が同じ媒質を進むとき）とのちがいをおさえておこう。"},
  {id:"phy275", cat:"物理", sub:"仕事とエネルギー", q:"動滑車を1個使って物体を引き上げると、引く力の大きさは物体の重さの何分の1になるか。", choices:["1/4","1/2","2倍","3倍"], diff:"基礎", a:1, e:"【ことばの意味】「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）／「仕事」＝力×動かした距離。単位はJ（ジュール）【解説】動滑車1個を使うと必要な力は1/2になる。ただし引くロープの長さは物体の移動距離の2倍になる。仕事の原理より「力×距離」は変わらない。動滑車を2個使うと1/4になるが、ロープは4倍の長さを引く必要がある。【まちがえやすい点】ほかの選択肢（1/4／2倍）とのちがいをおさえておこう。"},
  {id:"phy276", cat:"物理", sub:"電流と回路", q:"家庭のコンセントから取れる電力の最大値が2000Wのとき、電圧100Vでは最大何Aまで使えるか。", choices:["200A","20A","2A","0.5A"], diff:"標準", a:1, e:"電力P=VI より、I=P/V=2000/100=20A。家庭のブレーカーが20Aというのはこのことで、20Aを超えると安全のために回路が遮断される。1000Wのドライヤーと1200Wの電子レンジを同時に使うと2200W＞2000Wとなり、ブレーカーが落ちる可能性がある。"},
  {id:"phy277", cat:"物理", sub:"運動とエネルギー", q:"慣性の法則について正しいものはどれか。", choices:["力がはたらいている物体は静止し続ける","外から力がはたらかない限り","力がはたらかないと物体はつねに止まる","慣性は質量が小さいほど大きい"], diff:"基礎", a:1, e:"慣性の法則（ニュートンの第1法則）：合力がゼロの状態では、物体は現在の運動状態を保とうとする。電車が急ブレーキをかけると乗客が前に倒れるのは、乗客の体が等速で進もうとする慣性のため。慣性は質量に比例し、質量が大きいほど状態を変えにくい。"},
  {id:"phy278", cat:"物理", sub:"力の働き", q:"2力の合力を求めるとき、平行四辺形の法則を使う場合の手順として正しいものはどれか。", choices:["2つの力ベクトルを足し合わせて長さを比較する","2つの力を2辺とする平行四辺形を描き、その対角線が合力を表す","2つの力の大きさを掛け合わせて合力の大きさを求める","2つの力の方向の中間の方向に合力が向く"], diff:"標準", a:1, e:"【ことばの意味】「合力」＝複数の力を1つにまとめた力【解説】合力を求める平行四辺形の法則：2つの力をベクトル矢印で表し、それを2辺とする平行四辺形を作図する。その対角線が合力の大きさと向きを示す。2力が同じ向きなら単純に和、反対向きなら差になる。斜めの場合はこの作図法が必要。【まちがえやすい点】ほかの選択肢（2つの力ベクトルを足し合わせて長さを比較する／2つの力の大きさを掛け合わせて合力の大きさを…）とのちがいをおさえておこう。"},
  {id:"phy279", cat:"物理", sub:"光と音", q:"虹が七色に見えるのは光のどのような性質によるか。", choices:["反射","干渉","分散（波長によって屈折率が異なる）","偏光"], diff:"基礎", a:2, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること【解説】白色光（太陽光）はさまざまな波長の光の集合。ガラスや水は波長によって屈折率が異なる（分散）ため、白色光がプリズムや雨粒に入ると波長ごとに異なる角度で屈折し、七色に分かれて見える。赤が最も屈折が小さく、紫が最も大きい。【まちがえやすい点】ほかの選択肢（反射／干渉）とのちがいをおさえておこう。"},
  {id:"phy280", cat:"物理", sub:"電流と回路", q:"電気エネルギーが変換される例として、電動機（モーター）で正しいものはどれか。", choices:["電気エネルギー→熱エネルギー","電気エネルギー→光エネルギー","電気エネルギー→運動エネルギー","化学エネルギー→電気エネルギー"], diff:"基礎", a:2, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「電磁誘導」＝磁石を動かすとコイルに電流が生まれる現象【解説】電動機は電気エネルギーを運動エネルギー（回転運動）に変換する装置。電磁誘導の逆（電流が磁界から力を受ける）を利用する。電灯は電気→光、電熱器は電気→熱、発電機は運動→電気。これらエネルギー変換の方向を整理して覚えよう。【まちがえやすい点】ほかの選択肢（電気エネルギー→熱エネルギー／電気エネルギー→光エネルギー）とのちがいをおさえておこう。"},
  {id:"phy281", cat:"物理", sub:"熱の伝わり方", q:"金属のスプーンをお湯に入れると持ち手まで熱くなる。これは熱の伝わり方のうちどれか。", choices:["対流","放射","伝導","蒸発"], diff:"基礎", a:2, e:"伝導（熱伝導）：物質を通じて熱が高温部から低温部へ伝わる現象。金属は熱伝導率が高いため素早く伝わる。木やプラスチックは熱伝導率が低い（断熱材として利用）。対流は流体（液体・気体）が移動して熱を運ぶ、放射は電磁波で熱が伝わる現象。"},
  {id:"phy282", cat:"物理", sub:"仕事とエネルギー", q:"質量5kgの物体を2mの高さに持ち上げたときの仕事はいくらか（g=10m/s²）。", choices:["10J","25J","100J","1000J"], diff:"標準", a:2, e:"仕事W=Fh=mgh=5kg×10m/s²×2m=100J。持ち上げるために必要な力は重力に等しいF=mg=50N。これを高さh=2m移動させるのでW=50N×2m=100J。重力（N）×高さ（m）＝仕事（J）＝位置エネルギーの増加量。"},
  {id:"phy283", cat:"物理", sub:"運動とエネルギー", q:"運動エネルギーの大きさは何によって決まるか。", choices:["質量のみで決まる","速さのみで決まる","質量と速さの2乗の積の半分で決まる","力と時間の積で決まる"], diff:"基礎", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「運動エネルギー」＝動いている物体がもつエネルギー【解説】運動エネルギーEk=½mv²。速さを2倍にすると4倍（2の2乗）、質量を2倍にすると2倍になる。速さの影響が大きいため、高速走行の危険性はこの式で理解できる（速さ2倍でエネルギー4倍＝衝突の威力4倍）。【まちがえやすい点】ほかの選択肢（質量のみで決まる／速さのみで決まる）とのちがいをおさえておこう。"},
  {id:"phy285", cat:"物理", sub:"力の働き", q:"圧力の単位として正しいものはどれか。", choices:["N（ニュートン）","J（ジュール）","Pa（パスカル）","W（ワット）"], diff:"基礎", a:2, e:"圧力P=F/A（力÷面積）なので単位はN/m²、これを1Pa（パスカル）という。天気予報で使うhPa（ヘクトパスカル）は100Paのこと。タイヤの空気圧は約200kPa（200000Pa）程度。Nは力、Jはエネルギー、Wは仕事率の単位。"},
  {id:"phy286", cat:"物理", sub:"光と音", q:"ギターの弦を強くはじいたとき（振幅を大きくした）、音はどのように変化するか。", choices:["音が高くなる","音が低くなる","音が大きくなる","音の速さが速くなる"], diff:"基礎", a:2, e:"【ことばの意味】「振動数」＝1秒間に何回ふるえるかを表す数。多いほど高い音／「振幅」＝ふるえの大きさ。大きいほど大きな音【解説】振幅（揺れの大きさ）が大きいほど音の大きさ（音量）が増す。音の高低（音の高さ）は振動数（周波数）で決まり、振幅とは無関係。弦を強くはじくと振幅が大きくなって大きな音になるが、ピッチ（高さ）は変わらない。【まちがえやすい点】ほかの選択肢（音が高くなる／音が低くなる）とのちがいをおさえておこう。"},
  {id:"phy288", cat:"物理", sub:"運動とエネルギー", q:"なめらかな斜面の上から静かに手放した物体が、斜面の下端に達したときの速さを求めるのに必要な情報はどれか。", choices:["物体の質量と斜面の角度","斜面の長さと物体の質量","斜面の高さ","物体の材質と斜面の長さ"], diff:"標準", a:2, e:"力学的エネルギー保存の法則より、mgh=½mv²（mは消去できる）なので、v=√(2gh)。必要なのは高さhのみ（重力加速度gは既知）。質量・斜面の角度・長さは不要。ただし摩擦があると熱になる分だけ速さが減るため、「なめらかな斜面」という条件が重要。"},
  {id:"phy290", cat:"物理", sub:"仕事とエネルギー", q:"力の単位ニュートン（N）の定義として正しいものはどれか。", choices:["1kgの物体に1m/sの速さを与える力","1kgの物体に1m/s²の加速度を与える力","1mの距離を動かすのに必要な力","1Jのエネルギーを生み出す力"], diff:"基礎", a:1, e:"ニュートン（N）の定義：1N＝1kgの物体に1m/s²の加速度を生じさせる力（F=ma より）。地球上で1kgの物体にはたらく重力は約9.8N（≒10N）。重力加速度g≒9.8m/s²なので1kg×9.8m/s²=9.8N。"},
  {id:"phy291", cat:"物理", sub:"光と音", q:"光の三原色と色の混合について正しいものはどれか。", choices:["光の三原色は赤・黄・青で、混ぜると黒になる","光の三原色は赤・緑・青（RGB）で、すべて混ぜると白になる","光の三原色は赤・オレンジ・緑で、混ぜると茶色になる","光の三原色は絵の具の三原色と同じと考えられている"], diff:"基礎", a:1, e:"光の三原色：赤（R）・緑（G）・青（B）。3色を混ぜると白色光になる（加法混色）。テレビ・スマホの画面はこの原理。絵の具の三原色（シアン・マゼンタ・黄）は減法混色で混ぜると黒に近くなる。光と絵の具では混色の原理が逆になる点が重要。"},
  {id:"phy294", cat:"物理", sub:"エネルギーの利用", q:"省エネルギーの観点からLED電球が白熱電球より優れている主な理由として正しいものはどれか。", choices:["LED電球は電気エネルギーをより多く光に変換でき、むだになる熱が少ない","LED電球の方が明るいから","LED電球の方が製造コストが低いから","LED電球は交流電源では使用できないから"], diff:"標準", a:0, e:"【白熱電球】電気エネルギーの約5%しか光に変換されず、残りの約95%は熱として失われてしまいます。／【LED電球】半導体のはたらきを利用して電気を直接光に変えるため、約30〜50%というずっと高い効率で光に変換できます。／【結果】同じ明るさを得るのに必要な電気の量（消費電力）がLEDの方がずっと少なくてすみ、電気代の節約にもつながります。"},
  {id:"phy298", cat:"物理", sub:"仕事とエネルギー", q:"ジェットコースターがスタート地点より低い位置で速さが増す理由として正しいものはどれか。", choices:["エンジンが推進力を与えるから","位置エネルギーが運動エネルギーに変換される","空気の流れで加速するからによる現象","摩擦力が前向きにはたらくから"], diff:"標準", a:1, e:"ジェットコースターは最初に高い位置まで引き上げてもらうことで位置エネルギーを蓄える。下降するにつれて位置エネルギーが運動エネルギーに変換されて加速する。摩擦や空気抵抗がなければ力学的エネルギーは保存され、同じ高さでは同じ速さになる。"},
  {id:"phy299", cat:"物理", sub:"力の働き", q:"空気中でパラシュートを使って降下する人の終端速度（一定速度で降下する状態）について正しいものはどれか。", choices:["終端速度は重力だけで決まる","重力と空気抵抗が釣り合ったとき","終端速度は空気抵抗がなくなったとき生じる","パラシュートがなくても同じ終端速度になる"], diff:"標準", a:1, e:"落下速度が増すと空気抵抗も大きくなる。やがて空気抵抗＝重力となり、合力ゼロになって加速が止まり終端速度に達する。パラシュートは受圧面積を増やして空気抵抗を大きくし、終端速度を人体が安全に耐えられる速度（約5〜7m/s）まで下げる。"},
  {id:"che236", cat:"化学", sub:"水溶液とイオン", q:"硫酸（H₂SO₄）が強酸である理由として正しいものはどれか。", choices:["硫黄を含んでいるから","水溶液中でほぼ完全に電離してH⁺を多く生じる","強い刺激臭があるから","密度が水より大きいから"], diff:"標準", a:1, e:"強酸（塩酸HCl、硫酸H₂SO₄、硝酸HNO₃など）は水に溶かすとほぼ完全に電離してH⁺を放出する。弱酸（酢酸CH₃COOH、炭酸H₂CO₃など）は一部しか電離しない。強酸かどうかは電離度（電離した割合）で決まり、匂いや密度とは無関係。"},
  {id:"che237", cat:"化学", sub:"物質のすがた", q:"昇華について正しいものはどれか。", choices:["液体が固体に変化すること","固体が液体を経ずに直接気体になること","気体が直接固体になること","液体が気体になることによる反応"], diff:"基礎", a:1, e:"昇華：固体→気体への直接変化（液体を経ない）。例：ドライアイス（CO₂）・ナフタレン（防虫剤）・ヨウ素（加熱すると紫煙）。逆に気体→固体への変化も昇華という（または凝華ともいう）。昇華を利用した精製法（昇華法）でヨウ素の精製ができる。"},
  {id:"che238", cat:"化学", sub:"化学変化と質量", q:"化学反応で発生した気体を水上置換で集めるとき、最初に出てくる気体を捨てる理由はどれか。", choices:["気体が水に溶けているからと考えられている","最初に出てくるのは三角フラスコ内に残っていた空気だから","気体の密度が変化するからと考えられている","反応が完全でないうちの気体は不純物が多いから"], diff:"標準", a:1, e:"実験装置内には最初から空気が残っている。反応で気体が発生し始めると、まず装置内の空気が押し出されてくる。この空気が混入すると純粋な気体が集まらないため、最初に出てくる気体（空気）は水槽内に捨て、気体の泡が安定して出始めてから集気瓶に集める。"},
  {id:"che239", cat:"化学", sub:"酸・アルカリと中和", q:"食酢（酢酸水溶液）に重曹（炭酸水素ナトリウム）を加えると泡が発生する。この泡の正体はどれか。", choices:["水素","酸素","二酸化炭素","水蒸気"], diff:"基礎", a:2, e:"CH₃COOH＋NaHCO₃→CH₃COONa＋H₂O＋CO₂。酸（酢酸）と炭酸水素塩が反応すると塩と水と二酸化炭素が発生する。この反応を利用したものがベーキングパウダー（重曹）で、加熱でも同様にCO₂が発生してパンやケーキが膨らむ。"},
  {id:"che240", cat:"化学", sub:"物質のすがた", q:"物質の密度について正しいものはどれか。", choices:["密度は物質の量が多いほど大きくなる","密度は単位体積あたりの質量で物質に固有の値","密度は物体の形によって変わる","ほとんどの固体の密度は液体より大きい"], diff:"基礎", a:1, e:"密度ρ=m/V（質量÷体積）は物質の種類と状態（温度・圧力）で決まり、物体の量や形には関係しない。水の密度は約1g/cm³で、これより密度が小さい物質（氷・木・油など）は水に浮き、大きい物質（鉄・銅など）は沈む。氷は水より密度が小さい（水は4℃で最大密度）。"},
  {id:"che241", cat:"化学", sub:"酸化と還元", q:"水素が酸化銅（CuO）を還元する反応において、水素は何の役割を果たすか。", choices:["酸化剤として酸化銅を酸化する","還元剤として酸化銅から酸素を奪い","触媒として反応を促進する","生成物として銅と水ができる"], diff:"基礎", a:1, e:"CuO＋H₂→Cu＋H₂O。水素（H₂）は酸素を奪って水になる（H₂が酸化される）ため還元剤。酸化銅は酸素を失って銅になる（CuOが還元される）。還元剤は「他の物質を還元し、自身は酸化される物質」という定義を確認しよう。"},
  {id:"che242", cat:"化学", sub:"化学反応式", q:"炭素Cが不完全燃焼したとき生じる気体として正しいものはどれか。", choices:["二酸化炭素（CO₂）","一酸化炭素（CO）","酸素（O₂）","水素（H₂）"], diff:"基礎", a:1, e:"酸素が十分な完全燃焼：C＋O₂→CO₂。酸素が不足した不完全燃焼：2C＋O₂→2CO。一酸化炭素（CO）は無色・無臭の有毒気体でヘモグロビンと強く結合し、酸素を運べなくする（一酸化炭素中毒）。石油ストーブの不完全燃焼や自動車排気ガスに含まれる。"},
  {id:"che243", cat:"化学", sub:"水溶液とイオン", q:"電離式「NaCl→Na⁺＋Cl⁻」について正しいものはどれか。", choices:["NaClが熱分解してできる反応","NaClが水中でイオンに分かれる電離の反応","NaClが酸と反応する中和反応","NaClが電気分解される反応"], diff:"基礎", a:1, e:"電離：電解質が水に溶けてイオンに分かれること。NaClは水中でNa⁺とCl⁻に電離する。電離は溶解の際に自発的に起こる現象で、電気分解（外部電源が必要）とは異なる。電離したイオンが電荷を運ぶため、NaCl水溶液は電気を通す。"},
  {id:"che244", cat:"化学", sub:"気体の性質", q:"実験室で酸素を発生させるとき、よく使われる方法はどれか。", choices:["うすい過酸化水素水に二酸化マンガンを加える","うすい塩酸に亜鉛を加えてあたためる","うすい塩酸に石灰石を加えて反応させる","食塩水に電流を流して電気分解する"], diff:"標準", a:0, e:"【酸素の発生】うすい過酸化水素水（オキシドール）に二酸化マンガンを加えると、酸素が発生します。／【二酸化マンガンの役割】二酸化マンガンは「触媒」です。反応を速めるはたらきをしますが、自分自身は反応の前後で変化しません。だから何度でも使えます。／【他の選択肢で発生する気体】塩酸＋亜鉛→水素。塩酸＋石灰石→二酸化炭素。食塩水の電気分解→陽極で塩素、陰極で水素。どの気体が出るかをセットで覚えましょう。／【酸素の確かめ方】火のついた線香を近づけると、炎を上げて激しく燃えます。"},
  {id:"che245", cat:"化学", sub:"身近な化学変化", q:"食品の「防腐剤」として使われるソルビン酸の主な役割として正しいものはどれか。", choices:["食品を固める","食品中の微生物の増殖を抑える","食品の色を鮮やかにする","食品の甘味を増す"], diff:"基礎", a:1, e:"ソルビン酸（ソルビン酸カリウム）は保存料（防腐剤）で、食品中のカビ・酵母・細菌の増殖を抑制する。食品の腐敗は微生物による有機物の分解が原因。食塩・砂糖・乾燥（水分活性低下）・pH調整（酸性）なども同様の目的で使われる古来からの保存法。"},
  {id:"che247", cat:"化学", sub:"化学変化と質量", q:"一定量の水（溶媒）に溶かせる溶質の最大量（溶解度）を超えて溶質を加えた状態を何というか。", choices:["希薄溶液","飽和溶液","過飽和溶液","懸濁液"], diff:"基礎", a:1, e:"飽和溶液：一定温度・一定量の溶媒に溶質が最大限溶けた状態。それ以上溶質を加えても溶けずに底に沈む。これよりも低い濃度は不飽和溶液。過飽和溶液は特殊な条件（急冷など）で飽和量以上の溶質が溶けている不安定な状態（少し刺激すると一気に結晶化）。"},
  {id:"che248", cat:"化学", sub:"酸・アルカリと中和", q:"塩（えん）の例として正しいものはどれか。", choices:["食塩（NaCl）だけでなく、硫酸ナトリウムや炭酸カルシウムなども塩のなかまである","食塩（NaCl）のみが塩である","塩は中和反応以外では生成しない","塩はすべて水に溶ける"], diff:"基礎", a:0, e:"【ことばの意味】「塩（えん）」＝酸の水素イオンとアルカリの水酸化物イオン以外の部分が結びついてできる物質の総称。中和反応でできる、食塩だけを指す言葉ではありません。／【いろいろな塩】塩酸＋水酸化ナトリウム→塩化ナトリウム（食塩）。硫酸＋水酸化ナトリウム→硫酸ナトリウム。石灰石の主成分である炭酸カルシウムも塩の一種です。／【まちがえやすい点】塩には水に溶けにくいものもあります（例：硫酸バリウム）。中和以外の反応でできる塩もあります。"},
  {id:"che249", cat:"化学", sub:"化学反応式", q:"化学反応式の係数（例：2H₂O）が意味することとして正しいものはどれか。", choices:["物質のグラム数","分子の個数の比","反応する体積の比","反応時間の比"], diff:"基礎", a:1, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「酸化」＝物質が酸素と結びつくこと【解説】化学反応式の係数は分子・原子・イオンの個数の比（モル比）を表す。例：2H₂O₂→2H₂O＋O₂では「過酸化水素2個が分解すると水2個と酸素1個ができる」ことを示す。気体の場合は体積比にも対応する（同温・同圧のとき）。【まちがえやすい点】ほかの選択肢（物質のグラム数／反応する体積の比）とのちがいをおさえておこう。"},
  {id:"che250", cat:"化学", sub:"水溶液とイオン", q:"塩化銅（CuCl₂）水溶液を電気分解したとき、陽極と陰極でそれぞれ何が発生・析出するか。", choices:["陽極：水素、陰極：銅","陽極：塩素、陰極：銅","陽極：酸素、陰極：水素","陽極：銅、陰極：塩素"], diff:"標準", a:1, e:"CuCl₂→Cu²⁺＋2Cl⁻。陽極（酸化）：Cl⁻が酸化されてCl₂発生。陰極（還元）：Cu²⁺が還元されてCuが析出（銅メッキ）。塩化銅水溶液の電気分解は塩化ナトリウム水溶液と一部似ているが、陰極で金属銅が析出する点が異なる。"},
  {id:"che251", cat:"化学", sub:"物質のすがた", q:"物質の三態（固体・液体・気体）と粒子の状態の関係として正しいものはどれか。", choices:["固体では粒子が自由に動き回っている","液体では粒子間の距離が気体と同じ","固体では粒子が規則正しく並んで振動しており","気体では粒子間に引力がはたらかない"], diff:"標準", a:2, e:"固体：粒子が規則正しく配列（結晶格子）し、その場で振動。液体：粒子間の距離は固体と近いが配列が乱れ、流動できる。気体：粒子間距離が非常に大きく（固液の約1000倍）自由に動き回る。気体粒子間にも引力はわずかにはたらく（理想気体では無視する）。"},
  {id:"che253", cat:"化学", sub:"身近な化学変化", q:"天然ガスの主成分として正しいものはどれか。", choices:["プロパン（C₃H₈）","エタン（C₂H₆）","メタン（CH₄）","ブタン（C₄H₁₀）"], diff:"基礎", a:2, e:"天然ガスの主成分はメタン（CH₄）で約90%以上を占める。プロパンやブタンはプロパンガス（LPG）の主成分。いずれも炭化水素で燃焼するとCO₂とH₂Oを生じる。メタンは最も単純な有機化合物で、地球温暖化への影響（温室効果）もCO₂の約25倍といわれる。"},
  {id:"che255", cat:"化学", sub:"物質のすがた", q:"硬水と軟水の違いとして正しいものはどれか。", choices:["硬水は塩酸を含み、軟水は硫酸を含む","硬水はカルシウムイオン・マグネシウムイオンが多く含まれ","硬水は密度が高く、軟水は低いと考えられている","硬水は酸性で、軟水はアルカリ性と考えられている","硬水は飲料に向かず、軟水は工業用にのみ使われる"], diff:"標準", a:1, e:"硬水：Ca²⁺・Mg²⁺が多い（ヨーロッパの水道水に多い）。石鹸の泡立ちが悪く、スケール（カルシウム沈殿）が生じやすい。軟水：Ca²⁺・Mg²⁺が少ない（日本の水道水の多く）。石鹸が泡立ちやすく、だしが出やすいため日本料理に向く。"},
  {id:"che256", cat:"化学", sub:"気体の性質", q:"酸性雨の原因となる主な物質として正しいものはどれか。", choices:["二酸化炭素と窒素","二酸化硫黄と窒素酸化物","酸素とオゾン","塩素と水素"], diff:"基礎", a:1, e:"酸性雨は主に二酸化硫黄（SO₂：化石燃料燃焼）・窒素酸化物（NOₓ：自動車排気）が大気中で水と反応して硫酸・硝酸になり、雨を酸性化する現象（pH5.6以下）。森林破壊・湖沼の生態系破壊・石造建築の腐食などの被害をもたらす。CO₂も弱酸性雨の原因となるが、主因はSO₂・NOₓ。"},
  {id:"che257", cat:"化学", sub:"水溶液とイオン", q:"pHについての説明として正しいものはどれか。", choices:["pHが大きいほど酸性が強い","pHは0から14の範囲にのみ存在する","pHが7より小さいと酸性","強酸と強アルカリではつねにpHが0と14になる"], diff:"基礎", a:2, e:"pH＝－log[H⁺]。pH7が中性（純水）、7未満は酸性（H⁺濃度が多い）、7超はアルカリ性（OH⁻濃度が多い）。pHは0未満や14超の値も存在し得る。1NのHClはpH≈0、1NのNaOHはpH≈14だが、これより濃ければ範囲外になる。"},
  {id:"che258", cat:"化学", sub:"化学変化と質量", q:"化学変化と物理変化の違いとして正しいものはどれか。", choices:["物理変化では色が変わらず、化学変化では色が変わる","化学変化では物質の性質が変わり新しい物質ができる","加熱すれば化学変化、冷却すれば物理変化になる","物理変化は可逆で、化学変化は不可逆である"], diff:"標準", a:1, e:"化学変化（化学反応）：原子の組み合わせが変わり、もとの物質とは異なる物質が生成する（燃焼・電気分解・酸化など）。物理変化：物質の種類（性質）は変わらず、形・状態・大きさが変わる（状態変化・溶解・切断など）。溶解は物理変化だが、水に溶けた後イオン化する場合は一部化学変化の要素も含む。"},
  {id:"che259", cat:"化学", sub:"身近な化学変化", q:"入浴剤（バブルタイプ）が泡を発生させる仕組みとして正しいものはどれか。", choices:["炭酸水素ナトリウムと有機酸が水中で反応してCO₂を発生させる","水素と酸素が反応して泡になるとされている","入浴剤が電気分解を起こすの変化と考えられている","空気が閉じ込められていたものが出てくる"], diff:"標準", a:0, e:"NaHCO₃（重曹）＋クエン酸→クエン酸ナトリウム＋H₂O＋CO₂。水中で酸（クエン酸）と塩基（重曹）が反応してCO₂が発生する。この炭酸ガスが血管を拡張させて血行促進効果があるとされる。ベーキングパウダー・サイダーと同じ原理。"},
  {id:"che260", cat:"化学", sub:"化学変化と質量", q:"鉄の酸化と燃焼（燃焼は激しい酸化）について正しいものはどれか。", choices:["鉄がさびるのはゆっくり進む酸化で、スチールウールが燃えるのは酸素中ではげしく進む酸化である","鉄がさびるのは燃焼と同じ速さの酸化反応である","どちらも生成する物質は全くちがう","さびと燃焼では熱が発生するかどうかが異なる"], diff:"基礎", a:0, e:"【共通点】どちらも「鉄＋酸素→酸化鉄」という同じ種類の反応です。／【ちがいは速さ】さびは非常にゆっくり進む酸化（緩慢酸化）で、目立った熱や光は出ません。スチールウール（細い鉄）を燃やす燃焼は、酸素の中で一気に激しく進む酸化で、強い光と熱を出します。／【まちがえやすい点】さびでもわずかに熱は発生していますが、ゆっくりすぎて感じられません。「熱の有無」ではなく「速さ」のちがいが本質です。"},
  {id:"che261", cat:"化学", sub:"気体の性質", q:"アンモニアの性質として正しいものはどれか。", choices:["無色無臭で水に溶けにくい","黄緑色の有毒気体","無色で鼻をさす刺激臭があり","空気より重く下方置換で集める"], diff:"基礎", a:2, e:"アンモニア（NH₃）：無色・刺激臭・有毒。水に非常に溶けやすい（噴水実験）。水溶液はアルカリ性（NH₃＋H₂O⇌NH₄⁺＋OH⁻）。空気より軽い（分子量17＜空気平均29）ので上方置換で集める。肥料製造（ハーバーボッシュ法）に重要な工業原料。"},
  {id:"che263", cat:"化学", sub:"水溶液とイオン", q:"電池と電気分解のちがいとして正しいものはどれか。", choices:["電池は化学変化から電気をとり出し、電気分解は電気を使って化学変化を起こす","電池は電気を使って化学変化を起こし、電気分解は化学変化から電気をとり出す","電池も電気分解も、どちらも電気をつくり出すはたらきをしている","電池も電気分解も、どちらも電気を使うだけではたらきは同じである"], diff:"標準", a:0, e:"【電池】亜鉛と銅など2種類の金属を電解質の水溶液に入れると、金属がとける化学変化が起こり、その結果として電気が流れます。つまり「化学変化→電気」の向きです。／【電気分解】水溶液に外から電流を流すことで、水を水素と酸素に分けたり、塩化銅を銅と塩素に分けたりできます。つまり「電気→化学変化」の向きです。／【覚え方】電池は電気を「つくる」、電気分解は電気を「使う」。ちょうど逆向きの関係になっています。／【身近な例】充電式の電池は、使うとき（放電）は電池、充電するときは電気分解と同じしくみではたらいています。"},
  {id:"che265", cat:"化学", sub:"酸・アルカリと中和", q:"農業で土壌が酸性になったとき、石灰（水酸化カルシウムや炭酸カルシウム）を加える理由として正しいものはどれか。", choices:["土壌に栄養分（カルシウム）を補給するため","酸性土壌を中和してpHを植物の生育に適した値に調整する","土壌を柔らかくして耕しやすくするため","土壌の水分を減らすためによる反応"], diff:"標準", a:1, e:"多くの農作物は中性〜弱酸性（pH6〜7付近）の土壌を好む。酸性雨や肥料の影響で土壌が酸性化すると生育不良になる。石灰はアルカリ性物質なので酸性土壌に加えると中和が起き、pHが適正範囲に調整される。これを「土壌改良（石灰処理）」という。"},
  {id:"bio296", cat:"生物", sub:"植物のつくり", q:"種子植物のうち、胚乳をもつ種子（有胚乳種子）の例として正しいものはどれか。", choices:["アサガオとカキ","イネとトウモロコシ","アサガオとインゲンマメ","ホウレンソウとアブラナ"], diff:"基礎", a:1, e:"【解説】有胚乳種子：イネ・トウモロコシ・コムギ・カキなど（主に単子葉植物の多くと一部の双子葉植物）。胚乳に栄養（デンプン・タンパク質・脂肪）を蓄える。無胚乳種子：インゲンマメ・エンドウ・アサガオなど。子葉に栄養を蓄える。【まちがえやすい点】ほかの選択肢（アサガオとカキ／アサガオとインゲンマメ）とのちがいをおさえておこう。"},
  {id:"bio297", cat:"生物", sub:"動物のからだ", q:"ヒトの体液のうち、リンパ液（リンパ管内の液体）の役割として正しいものはどれか。", choices:["酸素を全身に運ぶ","免疫細胞（リンパ球）を運び","血液に含まれるため独立した役割はない","骨を形成する成分を供給する"], diff:"基礎", a:1, e:"【解説】リンパ液はリンパ管内を流れ、白血球（特にリンパ球）を含む免疫の担い手。組織液がリンパ管に取り込まれてリンパ液になる。脂肪の吸収（小腸の乳び管から）にも関わる。リンパ節では免疫反応が行われ、感染時に腫れる（リンパ節炎）。【まちがえやすい点】ほかの選択肢（酸素を全身に運ぶ／血液に含まれるため独立した役割はない）とのちがいをおさえておこう。"},
  {id:"bio298", cat:"生物", sub:"植物のはたらき", q:"葉の断面を見ると、表側に「柵状組織」、裏側に「海綿状組織」がある。表側に柵状組織がある理由として正しいものはどれか。", choices:["表側は日光が強く当たるので、葉緑体が多い柵状組織が効率よく光合成できるから","柵状組織は水分をためる役目があるから","裏側に気孔が多いから、表側には柵状組織しか置けないから","柵状組織は二酸化炭素を多く吸うため表側にあるから"], diff:"標準", a:0, e:"【ことばの意味】「柵状組織」＝葉緑体をたくさんもつ細胞がすき間なくきれいに並んだ組織。「海綿状組織」＝細胞と細胞の間にすき間が多く、気体の通り道になっている組織。／【なぜ表側が柵状組織？】葉の表側には太陽の光がいちばん強く当たります。そこに葉緑体の多い柵状組織を集めておくことで、光合成を効率よく行うことができます。／【裏側の役割】海綿状組織のすき間を通って、気孔から取り入れたCO₂やO₂が細胞全体に行きわたります。／【気孔の位置】多くの植物では気孔は葉の裏側に多く見られます。"},
  {id:"bio299", cat:"生物", sub:"細胞", q:"体細胞分裂では、分裂前（間期）に何が起きているか。", choices:["染色体の数が減少すると考えられている","細胞が収縮して小さくなるとされている","DNAが複製されて染色体の量が2倍になる準備がなされる","核が消えて細胞質が分裂の準備をする"], diff:"基礎", a:2, e:"体細胞分裂の間期（分裂の準備段階）：DNAが複製されて遺伝情報が2セット作られる。その後分裂期に入り、複製されたDNA（染色体）が2つの娘細胞に均等に分配される。DNA複製が先に行われることで、娘細胞に正確な遺伝情報が伝わる。"},
  {id:"bio300", cat:"生物", sub:"生物とかんきょう", q:"里山の生態系が人間にとって重要な理由として正しいものはどれか。", choices:["里山は都市開発に利用するための土地","里山は生物多様性が高く","里山は絶滅した生物が生息する場所","里山の管理は生態系に悪影響を与える"], diff:"標準", a:1, e:"里山：農村周辺の二次的な自然環境（雑木林・水田・ため池など）。人間が適度に管理することで多様な環境が生まれ、生物多様性が保たれる（かやぶき・炭焼き・稲作との共生）。生態系サービス（食料・木材・水の調節・文化的価値）が高いが、管理放棄や開発で消失している。"},
  {id:"bio301", cat:"生物", sub:"生殖と遺伝", q:"顕性（優性）の遺伝子Aと潜性（劣性）の遺伝子aについて、AAとaaの交配から生まれるF1の表現型はどれか。", choices:["すべて潜性形質（aa）","表現型は顕性:潜性=1:1","すべて顕性形質（Aa）","表現型は顕性:潜性=3:1"], diff:"基礎", a:2, e:"AA×aa→すべてAaになる。Aaは顕性遺伝子Aを1つもつため顕性形質が現れる。このF1（Aa）同士を交配するとF2でAA:Aa:aa=1:2:1（表現型比3:1）になる。純系（AA・aa）の交配では必ずF1全員が同じ遺伝子型（Aa）になる点がポイント。"},
  {id:"bio302", cat:"生物", sub:"動物のからだ", q:"ヒトの体温が一定に保たれる仕組みとして正しいものはどれか。", choices:["体温は環境温度と同じになるよう調節される","脳（視床下部）が体温の変化を感知して","体温調節は腎臓が担っている","体温は食事の量だけで決まる"], diff:"標準", a:1, e:"【解説】体温調節の中枢は視床下部。暑いとき：血管拡張（放熱増加）・発汗（蒸発冷却）。寒いとき：血管収縮（放熱減少）・ふるえ（筋肉収縮で熱産生）。このように複数の調節機構が協調して体温を約37℃に維持する（恒温動物の特徴）。【まちがえやすい点】ほかの選択肢（体温は環境温度と同じになるよう調節される／体温調節は腎臓が担っている）とのちがいをおさえておこう。"},
  {id:"bio303", cat:"生物", sub:"植物のつくり", q:"双子葉植物の茎の中で、道管と師管はどのように並んでいるか。", choices:["維管束が輪のように並び、その中で内側に道管、外側に師管がある","維管束が輪のように並び、その中で内側に師管、外側に道管がある","維管束はばらばらに散らばっている","茎には維管束が存在しない"], diff:"標準", a:0, e:"【ことばの意味】「維管束」＝水や養分が通る管が集まった束。「道管」＝根から吸った水や養分を運ぶ管。「師管」＝葉でつくった栄養分を運ぶ管。／【双子葉植物の茎】アブラナやヒマワリなど。維管束がリング状（輪）にきれいに並びます。それぞれの維管束の中では、内側（中心寄り）に道管、外側に師管があります。／【単子葉植物との違い】イネやトウモロコシなど単子葉植物の茎では、維管束がばらばらに散らばっています。／【覚え方】「道管は内側、師管は外側」とセットで覚えましょう。"},
  {id:"bio304", cat:"生物", sub:"生物とかんきょう", q:"生態系における炭素の循環について正しいものはどれか。", choices:["炭素は生産者のみを通じて循環する","光合成でCO₂が有機物に固定され","炭素循環は海洋では起きない","大気中のCO₂は変化しない"], diff:"基礎", a:1, e:"【ことばの意味】「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと／「分解」＝1つの物質が2つ以上の物質に分かれること【解説】炭素循環：大気CO₂→植物の光合成→有機物→消費者が食べる→呼吸でCO₂→大気。分解者（細菌・菌類）が有機物を分解してCO₂に。化石燃料の燃焼は地下の炭素を大気に放出するため、循環のバランスを崩して温暖化の原因となる。【まちがえやすい点】ほかの選択肢（炭素は生産者のみを通じて循環する／炭素循環は海洋では起きない）とのちがいをおさえておこう。"},
  {id:"bio305", cat:"生物", sub:"動物のからだ", q:"視覚について正しいものはどれか。", choices:["目の網膜にある視細胞が光を受容し、視神経で脳に信号を送る","目のレンズ（水晶体）が光を電気信号に変換する","視神経は耳につながっているとされている","角膜は光の強さを調節すると考えられている"], diff:"基礎", a:0, e:"目の構造：光→角膜・水晶体（屈折）→網膜に像を結ぶ→錐体（色覚・明るい場所）・杆体（明暗・暗い場所）が光を感知→視神経→大脳。水晶体の厚さは毛様筋で調節（遠近調節）。瞳孔は光の強さに応じて大きさが変わり、光量を調節する。"},
  {id:"bio306", cat:"生物", sub:"生殖と遺伝", q:"植物のさし木（挿し木）が無性生殖の例である理由として正しいものはどれか。", choices:["親の体の一部から新しい個体をつくるため、親と同じ遺伝子をもつ子ができるから","さし木では花が咲かないから","さし木では種子を使うから","さし木では受粉が必要だから"], diff:"基礎", a:0, e:"【ことばの意味】「無性生殖」＝オスとメスが関わらず、体の一部から新しい個体をふやすふえ方。「有性生殖」＝卵と精子（花粉）が受精してふえるふえ方。／【さし木のしくみ】植物の枝や茎の一部を切って土にさすと、そこから根が生え、もとの植物と全く同じ遺伝子をもつ新しい株が育ちます。これは体の一部（細胞）をそのまま増やしているので無性生殖にあたります。／【種子でふやすのは】花粉と卵細胞が受精してできる種子は有性生殖です。両親の遺伝子が半分ずつ混ざるため、親とは少しちがう個体ができます。"},
  {id:"bio307", cat:"生物", sub:"細胞", q:"タマネギの根の先端を使って体細胞分裂を観察する実験で、うすい塩酸に入れる（解離させる）目的として正しいものはどれか。", choices:["細胞どうしをくっつけている部分をやわらかくして、1つ1つの細胞に分けやすくするため","染色体を青く染めるため","細胞を固定して動かなくするため","染色体の数を増やすため"], diff:"標準", a:0, e:"【ことばの意味】「解離」＝細胞どうしがくっついている部分をゆるめて、細胞を1つ1つバラバラにしやすくすること。／【なぜ塩酸？】細胞と細胞は「細胞壁」というかたい部分でつながっています。うすい塩酸を60℃くらいに温めて根の先に作用させると、細胞壁どうしの結びつきがゆるみ、あとで押しつぶしたときに1層に広げやすくなります。／【染色の役目】解離のあと、酢酸オルセインや酢酸カーミンという染色液を使うと、核の中の染色体が赤く染まって見やすくなります。塩酸には染色の効果はありません。"},
  {id:"bio308", cat:"生物", sub:"動物のからだ", q:"ヒトのすい臓のはたらきとして正しいものはどれか。", choices:["消化酵素をふくむすい液を出し、血糖値を調節するホルモンも出している","胆汁を作って胆のうに蓄える","尿素を作って血液に放出する","消化酵素をふくまない消化液を分泌する"], diff:"標準", a:0, e:"【すい臓の2つのはたらき】①すい液の分泌…デンプンを分解するアミラーゼ、脂肪を分解するリパーゼ、タンパク質を分解するトリプシンなどをふくむすい液を十二指腸に送り出します。②ホルモンの分泌…血糖値を下げるインスリン、血糖値を上げるグルカゴンを血液中に直接出しています。／【まちがえやすい点】胆汁をつくるのは肝臓で、胆のうはそれをためておくだけです。尿素をつくるのも肝臓のはたらきです。"},
  {id:"bio309", cat:"生物", sub:"生物の観察", q:"顕微鏡の倍率を15倍の接眼レンズと40倍の対物レンズで使ったとき、総合倍率はいくらか。", choices:["55倍","600倍","150倍","40倍"], diff:"標準", a:1, e:"【解説】総合倍率＝接眼レンズの倍率×対物レンズの倍率＝15×40＝600倍。倍率が高いほど小さな構造を観察できるが、視野が狭くなり暗くなる。最初に低倍率で全体を観察してから高倍率に切り替えるのが正しい手順。【まちがえやすい点】ほかの選択肢（55倍／150倍）とのちがいをおさえておこう。"},
  {id:"bio310", cat:"生物", sub:"生態系", q:"生物多様性の保全が重要な理由として正しいものはどれか。", choices:["多様な生物がいると天敵が増えて農業に不利だから","生物多様性は食料・医薬品・材料の供給源であり","生物多様性は観光資源としてのみ価値がある","生物種が多いほど気候変動が悪化するから"], diff:"標準", a:1, e:"生物多様性の価値：①直接的価値：食料（作物・魚介）・医薬品（ペニシリン・タキソール）・木材・繊維。②間接的価値：生態系サービス（水の浄化・気候調節・土壌形成・授粉）。③多様な生態系は外乱（病気・環境変化）に対して回復力が高い。"},
  {id:"bio311", cat:"生物", sub:"植物のはたらき", q:"植物が夜（暗いところ）にいるとき、行っている気体のやりとりとして正しいものはどれか。", choices:["呼吸だけを行い、酸素を吸って二酸化炭素を出す","光合成だけを行い、二酸化炭素を吸って酸素を出す","光合成と呼吸を同じ速さで行う","気体のやりとりは全く行わない"], diff:"基礎", a:0, e:"【ことばの意味】「光合成」＝光を使って二酸化炭素と水から養分（デンプン）をつくるはたらき。光が必要。「呼吸」＝酸素を使って養分からエネルギーを取り出すはたらき。昼も夜も行われる。／【夜はどうなる？】光合成には光が必要なので、暗い夜は光合成ができません。しかし呼吸は生きている間ずっと続いているので、夜は呼吸だけが行われ、酸素を吸って二酸化炭素を出します。／【昼はどうなる？】昼は光合成も呼吸も同時に行われますが、光合成の方が量が多いため、見かけ上は酸素を出しているように見えます。"},
  {id:"bio312", cat:"生物", sub:"動物のからだ", q:"ヒトの免疫について正しいものはどれか。", choices:["皮膚・粘膜による物理的な防御と、特定の異物に反応してつくられる抗体による防御の両方がある","免疫は白血球のみが担っている","免疫反応は一度起きると二度と同じ抗原には反応しない","ワクチンは実際の病原体と同じ危険性をもつ"], diff:"標準", a:0, e:"【2つの防御】①皮膚や粘膜が病原体の侵入をふせぐ物理的な防御（自然免疫）。②体内に入った特定の病原体（抗原）に対して、白血球の一種であるリンパ球が抗体をつくって攻撃する防御（獲得免疫）。／【免疫記憶】一度かかった病気に対する抗体のつくり方を体が覚えておくため、同じ病原体が再び入ってきたときに、より速く強く反応できるようになります。／【ワクチン】弱めたり無毒化したりした病原体を使って、あらかじめこの免疫記憶をつくらせる予防法です。"},
  {id:"bio313", cat:"生物", sub:"植物のつくり", q:"葉が緑色に見える理由として正しいものはどれか。", choices:["葉緑体の中のクロロフィルが赤色と青色の光をよく吸収し、緑色の光を吸収せず反射するから","クロロフィルが緑色の光だけを吸収するから","クロロフィルが光合成で緑色の物質をつくるから","葉に水分が多いために緑色に見えるから"], diff:"標準", a:0, e:"【ことばの意味】「クロロフィル」＝葉緑体の中にある、光合成に必要な緑色の色素。／【なぜ緑に見える？】太陽の光にはいろいろな色（波長）の光が混ざっています。クロロフィルは主に赤色の光と青色の光をよく吸収して光合成に使い、緑色の光はあまり吸収せずに反射・透過させます。反射された緑の光が目に届くので、葉は緑色に見えるのです。／【豆知識】秋になるとクロロフィルが分解されて、もともとあった別の色素（黄色や赤色）が目立つようになります。これが紅葉です。"},
  {id:"bio314", cat:"生物", sub:"生殖と遺伝", q:"性染色体について正しいものはどれか。", choices:["男性のみが性染色体をもつ","ヒトでは女性はXX、男性はXYの性染色体をもち","Y染色体はX染色体とほぼ同じ大きさ・形","性染色体は生殖に関係のない遺伝子も含まない"], diff:"基礎", a:1, e:"ヒトの性染色体：女性XX、男性XY。卵はすべてX染色体のみをもつ。精子はX（女の子になる）かY（男の子になる）をもつ。受精の結果、XX→女性、XY→男性が生まれる。Y染色体はX染色体より小さく、Y染色体上の遺伝子が男性の発生を決定する。"},
  {id:"bio315", cat:"生物", sub:"生物とかんきょう", q:"大気中の二酸化炭素の増加が直接影響を与える生態系の変化として正しいものはどれか。", choices:["海水にとけこむCO₂が増えて海が酸性化し、貝やサンゴなどの殻や骨格がつくられにくくなる","ほとんどの植物の光合成速度が低下する","ほとんどの動物が直接CO₂に害される","海洋の塩分濃度が増加する"], diff:"標準", a:0, e:"【海洋酸性化のしくみ】大気中のCO₂が増えると、海水にとけこむCO₂の量も増えます。海水中でCO₂は炭酸になり、海のpHを少しずつ下げます（酸性に近づける）。／【生物への影響】pHが下がると、サンゴや貝、ウニなどが殻や骨格をつくる材料（炭酸カルシウム）がとけやすくなり、うまく育たなくなることがあります。サンゴ礁が失われると、そこにすむ多くの魚や生物のすみかも失われてしまいます。"},
  {id:"ear278", cat:"地学", sub:"地層と岩石", q:"不整合面（不整合）について正しいものはどれか。", choices:["地層が水平に堆積したことを示す","地層の堆積が中断され","火山が噴火した証拠","岩石が変成作用を受けた面"], diff:"基礎", a:1, e:"不整合：地層の堆積が一定期間途絶えた（隆起→侵食→沈降→再堆積）ことを示す境界面。不整合面の上下で地層の傾きが異なること（角度不整合）や、上位地層が不整合面で侵食面に接すること（平行不整合）で識別できる。長い時間的空白（地史の欠落）を示す。"},
  {id:"ear279", cat:"地学", sub:"火山と地震", q:"溶岩の色と温度の関係について正しいものはどれか。", choices:["温度が高いほど黒っぽくなる","溶岩の温度が高いほど赤やオレンジ色に輝き","溶岩の色はSiO₂含量のみで決まる","溶岩の色は温度と無関係"], diff:"基礎", a:1, e:"【ことばの意味】「放射」＝光や赤外線として熱が伝わること。真空でも伝わる【解説】高温の溶岩（900℃以上）は明るいオレンジ〜赤色に輝く（黒体放射）。冷却されると表面が固まり黒色になる（玄武岩質溶岩など）。溶岩の色は温度（熱放射）と成分（SiO₂含量による色の違い）の両方で決まる。【まちがえやすい点】ほかの選択肢（温度が高いほど黒っぽくなる／溶岩の色はSiO₂含量のみで決まる）とのちがいをおさえておこう。"},
  {id:"ear280", cat:"地学", sub:"天体の動き", q:"夏の代表的な星座さそり座が、日本では冬に見えない理由として正しいものはどれか。", choices:["冬は地球から見てさそり座が太陽と同じ方向になり、夜空に見えなくなるから","冬にさそり座が地球に近づくから","冬はさそり座が地平線の下に隠れるから","さそり座は南半球でしか見えないから"], diff:"標準", a:0, e:"【ことばの意味】「公転」＝地球が1年かけて太陽のまわりを回ること。／【なぜ見えなくなる？】夏、地球から見てさそり座は太陽と反対の方向にあるため、夜（太陽の光が届かない側）にはっきり見えます。地球が公転して冬になると、さそり座は太陽と同じ方向になってしまい、太陽の明るさにまぎれて見えなくなります。／【まちがえやすい点】星座の星（恒星）は地球から非常に遠いため、地球の公転くらいの動きで近づいたり遠ざかったりして見えなくなることはありません。"},
  {id:"ear281", cat:"地学", sub:"天気", q:"気象衛星から見た低気圧（日本付近）の雲の渦巻く方向はどれか。", choices:["時計回り（右回り）","反時計回り（左回り）","渦巻かず放射状に広がる","上下に積み重なるだけで渦はない"], diff:"基礎", a:1, e:"北半球の低気圧では、コリオリの力（地球自転の影響）により風が中心に向かって反時計回りに吹き込む。気象衛星の画像でも低気圧の雲は反時計回りの渦を示す。南半球では逆に時計回りになる。台風（熱帯低気圧）も北半球では反時計回り。"},
  {id:"ear282", cat:"地学", sub:"地層と岩石", q:"変成岩が形成される条件として正しいものはどれか。", choices:["岩石が風雨にさらされることで変成すると考えられている","岩石が地下深部や火成活動の熱・圧力によって鉱物組成・組織が変化する","変成岩は堆積物から直接できるとされている","変成岩はマグマが固まってできるとされている"], diff:"基礎", a:1, e:"【ことばの意味】「再結晶」＝温度を下げて結晶を取り出すこと／「プレート」＝地球の表面をおおう、いくつかに分かれた岩の板【解説】変成岩の形成：①広域変成（プレート衝突帯の高温高圧環境）：片岩・片麻岩など。②接触変成（マグマの熱により周囲の岩石が変成）：ホルンフェルス・大理石など。石灰岩（堆積岩）がマグマの熱で再結晶すると大理石（変成岩）になる。【まちがえやすい点】ほかの選択肢（岩石が風雨にさらされることで変成する／変成岩は堆積物から直接できる）とのちがいをおさえておこう。"},
  {id:"ear283", cat:"地学", sub:"天体の動き", q:"金星が地球から欠けて（三日月のように細く）見えるのはどんなときか。", choices:["金星が地球から最も遠いとき","金星が地球に近いとき","金星が地球のちょうど反対側にあるとき","金星が地球と同じ速さで回っているとき"], diff:"標準", a:1, e:"【前提】金星は自分では光らず、太陽の光を反射して光って見えます。太陽に照らされている側（昼の側）だけが明るく見えます。／【地球に近いとき】金星は地球と太陽の間の側に来ています。このとき金星の昼の側は太陽の方（＝地球と反対の方）を向いているので、地球からは細い三日月のようにしか見えません。ただし距離が近いので見かけの大きさは大きくなります。／【地球から遠いとき】太陽の向こう側にあり、昼の側がこちらを向くので丸く見えますが、遠いので小さく見えます。／【まちがえやすい点】「大きく見える＝丸く見える」ではありません。金星は近いほど大きく、そして細く見えます。"},
  {id:"ear284", cat:"地学", sub:"火山と地震", q:"地震の「震源」と「震央」の違いとして正しいものはどれか。", choices:["震源は地表の点、震央は地下の点","震源は地震が発生した地下の点","震源と震央は同じ点","震央は最も揺れが激しかった地点"], diff:"標準", a:1, e:"【ことばの意味】「震源」＝地下で地震が発生した場所／「震央」＝震源の真上にあたる地表の地点【解説】震源：地震が発生した地下の点（岩盤が断層運動を起こした場所）。震央：震源の真上の地表の点。震央から近いほど一般的に揺れが大きい（例外あり）。震源の深さが深いほど広い範囲が揺れるが、各地点での揺れは小さくなる傾向がある。【まちがえやすい点】ほかの選択肢（震源は地表の点、震央は地下の点／震源と震央は同じ点）とのちがいをおさえておこう。"},
  {id:"ear285", cat:"地学", sub:"天気", q:"空気を冷やしていったとき、ふくまれていた水蒸気が水てきに変わりはじめる温度を何というか。", choices:["露点","沸点","融点","飽和点"], diff:"基礎", a:0, e:"【ことばの意味】「露点（ろてん）」＝空気を冷やしていって、水蒸気が水てきに変わりはじめる温度。／【なぜ変わる？】空気がふくめる水蒸気の量には限界があり、温度が低いほどその限界は小さくなります。冷やしていくと「もうこれ以上ふくめない」状態になり、あふれた水蒸気が水てきになります。／【身近な例】冷たいコップの表面に水てきがつく、冬の窓が結露する、朝つゆがおりる、これらはすべて空気が露点以下に冷やされたためです。／【他の選択肢】沸点＝液体がふっとうする温度。融点＝固体がとける温度。"},
  {id:"ear286", cat:"地学", sub:"地球と宇宙", q:"太陽の黒点について正しいものはどれか。", choices:["黒点は太陽の表面温度が高い部分","黒点は強い磁場の影響でガスの対流が妨げられ","黒点の数は常に一定","黒点は太陽の大気（コロナ）にある"], diff:"標準", a:1, e:"太陽の黒点：強い磁場によって周囲より温度が低い（約3500〜4500K、光球は約5800K）部分。温度が低いため暗く見える（黒く見えるが実際は非常に明るい）。約11年の周期で数が増減する（太陽活動周期）。黒点が多い時期は太陽活動が活発。"},
  {id:"ear287", cat:"地学", sub:"天体の動き", q:"地球の公転によって、同じ時刻に見える星座が1か月で約何度西にずれて見えるか。", choices:["約1°","約15°","約30°","約45°"], diff:"基礎", a:2, e:"地球は1年（365日）で360°公転するので、1か月（約30日）で360°÷12≈30°西にずれて見える。「1か月で30°、1日で約1°」の年周変化。これを南の空で見ると、1か月で星が約30°西に移動する。季節によって見える星座が変わる原因。"},
  {id:"ear290", cat:"地学", sub:"天気", q:"台風の目の中心付近では風と天気はどのようになっているか。", choices:["最も強い風と激しい雨がある","比較的穏やかで青空が見えることがある","台風の目は存在せず全体が均一","台風の目ではつねに嵐が続く"], diff:"基礎", a:1, e:"台風の目（台風中心）は渦の中心で下降気流が生じており、比較的穏やかで晴れ間が見えることがある。目の壁雲（アイウォール）が最も激しい雨・風をもたらす。目が通過すると一時的に穏やかになり、その後再び激しくなる（目の後ろの壁雲が来る）ため油断は禁物。"},
