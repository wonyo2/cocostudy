  {id:"phy412", cat:"物理", sub:"光と音", q:"月が光って見えるのはなぜか。", choices:["太陽の光を反射しているから","月自体が光を出しているから","地球の光を反射しているから","星の光が集まっているから"], diff:"基礎", a:0, e:"【考え方】月は太陽のように自分で光を出す天体（恒星）ではありません。月が明るく見えるのは、太陽の光が月の表面に当たり、それが反射して地球まで届いているためです。／【満ち欠けとの関係】月が地球のまわりを回ることで、太陽に照らされている部分（明るく見える部分）の見え方が変わり、満月や三日月などの満ち欠けが起こります。"},
  {id:"phy413", cat:"物理", sub:"熱の伝わり方", q:"熱いお茶を入れたカップの取っ手にプラスチックが使われている理由として正しいものはどれか。", choices:["プラスチックは熱を伝えにくいから","プラスチックは金属より軽いから","プラスチックは水をはじくから","プラスチックは安く作れるから"], diff:"基礎", a:0, e:"【ことばの意味】「断熱性」＝熱を伝えにくい性質。プラスチックは金属と比べて熱を伝えにくい（断熱性が高い）性質をもっています。／【なぜ使われる？】熱いお茶が入っているカップ本体は熱くなりますが、取っ手にプラスチックのような熱を伝えにくい材料を使うことで、持つときにやけどをしにくくする工夫がされています。なべの持ち手や電気ポットの取っ手にも同じ工夫が見られます。"},
  {id:"phy414", cat:"物理", sub:"力の働き", q:"同じ質量の物体を、地球上と月面上でそれぞればねばかりではかったとき、示す値について正しいものはどれか。", choices:["地球上の方が大きい値を示す","月面上の方が大きい値を示す","どちらでも同じ値を示す","ばねばかりでは月面上でははかれない"], diff:"標準", a:0, e:"【考え方】ばねばかりは物体にはたらく重力（重さ）をはかる道具です。月の重力は地球の約1/6しかないため、同じ物体でも月面上でばねばかりを使うと、地球上ではかったときよりずっと小さい値を示します。／【質量との違い】上皿てんびんではかる「質量」は場所によって変わりませんが、ばねばかりではかる「重さ」は重力の大きさに応じて変わる点に注意しましょう。"},
  {id:"phy415", cat:"物理", sub:"運動とエネルギー", q:"ボールを真上に投げ上げたとき、最高点に達した瞬間のボールの速さはどうなっているか。", choices:["0になる（一瞬止まる）","投げたときと同じ速さ","投げたときより速くなっている","一定の速さで動き続けている"], diff:"標準", a:0, e:"【考え方】ボールを真上に投げると、重力によってだんだん速さが遅くなっていきます。上に上がる勢いがなくなった瞬間が最高点で、このとき一瞬だけ速さが0になります。その後、重力によって今度は下向きに加速しながら落下していきます。／【まちがえやすい点】最高点で完全に静止しているように見えますが、実際にはその一瞬の後、すぐに下向きの運動が始まります。"},
  {id:"phy416", cat:"物理", sub:"力の働き", q:"物体をおす力と、物体が机をおし返す力の関係のように、たがいにおよぼし合う2つの力の関係を何というか。", choices:["作用・反作用の関係","力のつり合いの関係","浮力と重力の関係","慣性の関係"], diff:"標準", a:0, e:"【ことばの意味】「作用・反作用」＝2つの物体がたがいにおよぼし合う、同じ大きさで逆向きの力の関係。／【つり合いとの違い】力のつり合いは「同じ1つの物体」にはたらく2力の関係ですが、作用・反作用は「別々の2つの物体」にそれぞれはたらく力の関係です。手で机をおすと、手も机から同じ大きさの力でおし返されるのを感じるのはこの作用・反作用の現象です。"},
  {id:"phy417", cat:"物理", sub:"電流と回路", q:"電球が明るく光っているとき、その電球で電気エネルギーは主に何エネルギーに変わっているか。", choices:["光エネルギーと熱エネルギー","運動エネルギーのみ","化学エネルギーのみ","位置エネルギーのみ"], diff:"基礎", a:0, e:"【考え方】電球に電流が流れると、電気エネルギーの一部が光エネルギーに変わって明るく光ります。同時に、電気エネルギーの一部は熱エネルギーにも変わっており、電球にさわると温かい（あるいは熱い）と感じるのはこのためです。／【豆知識】白熱電球は電気エネルギーのほとんどが熱に変わってしまい、光になる割合が少ないのに対し、LED電球は光に変わる割合が高く、効率のよい照明として広まっています。"},
  {id:"phy418", cat:"物理", sub:"力の働き", q:"物体を支える台をだんだん傾けていくと、物体が斜面を滑り始める。この動き出す原因となる力はどれか。", choices:["重力の斜面に沿った分力","浮力","垂直抗力","摩擦力のみ"], diff:"標準", a:0, e:"【考え方】物体にはたらく重力は、斜面に沿った方向の分力と、斜面に垂直な方向の分力に分けて考えることができます。台を傾けるほど、斜面に沿った方向の分力（物体を滑らせようとする力）が大きくなり、これが摩擦力に打ち勝つと物体が動き出します。／【まちがえやすい点】重力そのものは常に真下にはたらいていますが、斜面上での「動かす力」は、その重力を分解した一部分にあたります。"},
  {id:"phy419", cat:"物理", sub:"光と音", q:"救急車が近づいてくるときと遠ざかっていくときで、サイレンの聞こえ方について一般的に知られていることはどれか。", choices:["近づくときは高く、遠ざかるときは低く聞こえやすい","近づくときも遠ざかるときも同じ高さに聞こえる","近づくときは低く、遠ざかるときは高く聞こえやすい","音の高さは距離に関係なく常に一定である"], diff:"標準", a:0, e:"【ことばの意味】音源が動くことで音の高さが変化して聞こえる現象をドップラー効果といいます。／【なぜ変わる？】音源が近づいてくるとき、音の波が押し縮められるようになり振動数が多くなるため、音は高く聞こえます。逆に遠ざかるときは波が引き伸ばされるようになり、音は低く聞こえます。救急車のサイレンの音の変化として体験したことがある人も多い、身近な音の現象です。"},
  {id:"phy420", cat:"物理", sub:"力の働き", q:"密閉した容器に入った水に加えた圧力は、容器の中でどのように伝わるか。", choices:["あらゆる場所に同じ大きさで伝わる","圧力を加えた場所にしか伝わらない","下の方にだけ強く伝わる","上の方にだけ強く伝わる"], diff:"標準", a:0, e:"【ことばの意味】「パスカルの原理」＝閉じ込めた液体の一部に加えた圧力は、液体のすべての部分に同じ大きさで伝わるという原理。／【身近な利用】この原理は油圧ブレーキや油圧ジャッキなど、小さな力を大きな力に変える装置に利用されています。細い部分に小さな力を加えると、太い部分では面積が大きい分だけ大きな力として伝わる仕組みです。"},
  {id:"phy421", cat:"物理", sub:"熱の伝わり方", q:"熱いフライパンから出た熱で、少し離れた手のひらが温かく感じることがある。この熱の伝わり方を何というか。", choices:["放射（輻射）","伝導","対流","浮力"], diff:"標準", a:0, e:"【ことばの意味】「放射（輻射）」＝物体が出す赤外線などの電磁波によって、熱が離れた場所まで直接伝わる現象。／【伝導・対流との違い】伝導は固体を伝わる熱、対流は液体や気体が動いて運ぶ熱ですが、放射は物質を介さず空間を通して熱が伝わります。真空中でも伝わることが特徴です。太陽の熱が宇宙空間を越えて地球に届くのも放射によるものです。ストーブの前に立つと温かく感じるのもこの現象です。"},
  {id:"phy422", cat:"物理", sub:"エネルギーの利用", q:"手回し発電機のハンドルを回すと、豆電球が光る。このときのエネルギーの移り変わりとして正しいものはどれか。", choices:["運動エネルギーが電気エネルギーに変わる","化学エネルギーが電気エネルギーに変わる","光エネルギーが電気エネルギーに変わる","熱エネルギーが電気エネルギーに変わる"], diff:"基礎", a:0, e:"【考え方】手回し発電機は、手でハンドルを回す運動（運動エネルギー）を利用して、中のコイルと磁石が電磁誘導という現象を起こし、電気エネルギーを発生させています。発生した電気エネルギーが豆電球に流れることで、さらに光エネルギーに変わって光ります。／【発電の基本】多くの発電方法は、何らかの運動エネルギーで発電機を回すことで電気を作り出しています。"},
  {id:"phy423", cat:"物理", sub:"力の働き", q:"てこを使って重い荷物を持ち上げるとき、力点を支点から遠ざけると、力点を動かす距離はどうなるか。", choices:["大きくなる","小さくなる","変わらない","0になる"], diff:"標準", a:0, e:"【てこの原理】力点を支点から遠ざけると、必要な力は小さくなりますが、その代わりに力点を動かす距離は大きくなります。／【なぜ？】てこの「仕事の原理」により、力を小さくした分だけ動かす距離が長くなり、全体としての仕事の量（力×距離）は変わりません。長いてこを使うと軽い力ですむ代わりに、力点を大きく動かす必要がある、というトレードオフの関係があります。"},
  {id:"phy424", cat:"物理", sub:"運動とエネルギー", q:"摩擦のある机の上で物体をすべらせると、やがて物体は止まる。このとき失われた運動エネルギーは主に何に変わったか。", choices:["熱エネルギー","位置エネルギー","電気エネルギー","化学エネルギー"], diff:"基礎", a:0, e:"【考え方】物体が摩擦のある面をすべると、摩擦によって運動エネルギーの一部が熱エネルギーに変わっていきます。物体の速さがだんだん遅くなり、やがて止まるのは、運動エネルギーが摩擦によって熱として失われていくためです。／【身近な体験】手をこすり合わせると温かくなるのも、運動エネルギーが摩擦によって熱エネルギーに変わる身近な例です。"},
  {id:"phy425", cat:"物理", sub:"力の働き", q:"物体の重さをはかるのに用いる、ばねの伸びを利用した道具を何というか。", choices:["ばねばかり","上皿てんびん","メスシリンダー","温度計"], diff:"基礎", a:0, e:"【ことばの意味】「ばねばかり」＝ばねの伸びが加えた力（重さ）に比例するという性質（フックの法則）を利用して、物体の重さをはかる道具。／【使い方】物体をフックにつるすと、ばねが物体の重さに応じて伸び、その伸びに対応する目盛りを読むことで重さが分かります。上皿てんびんは分銅とのつり合いで「質量」をはかる道具である点が異なります。"},
  {id:"phy426", cat:"物理", sub:"力の働き", q:"液体や気体の中にある物体に、あらゆる方向から力がはたらく。この性質を利用した現象はどれか。", choices:["水中の物体にはたらく浮力","磁石が鉄を引きつける力","静電気による力","摩擦力"], diff:"標準", a:0, e:"【考え方】水などの液体や、空気などの気体の中にある物体には、あらゆる方向から圧力がはたらいています。この圧力の差（下面の方が上面より水圧が大きい）によって生まれる上向きの力が浮力です。／【他の選択肢】磁力・静電気力・摩擦力は、いずれも液体や気体の圧力とは異なる原理ではたらく力であり、浮力の原理とは区別されます。"},
  {id:"phy427", cat:"物理", sub:"電流と回路", q:"回路に電流が流れているとき、電流のもとになっている電気の流れをつくり出しているものはどれか。", choices:["電源（電池など）","抵抗（電熱線）","導線","スイッチ"], diff:"基礎", a:0, e:"【考え方】電池などの電源は、化学エネルギーなどを利用して回路に電流を流す力（電圧）を生み出すはたらきをします。電源がなければ、導線をつないでも回路に電流は流れません。／【他の部品の役割】導線は電流の通り道、抵抗（電熱線）は電流の流れにくさを調整する部品、スイッチは回路をつないだり切ったりする部品で、いずれも電流そのものを生み出す役割はありません。"},
  {id:"phy428", cat:"物理", sub:"光と音", q:"うすいガラス板を通して物を見ると、物の位置が少しずれて見えることがある。この現象に関係する光の性質はどれか。", choices:["屈折","反射","分散","直進"], diff:"標準", a:0, e:"【考え方】光がガラスの中に入るとき、空気とガラスでは光の速さが異なるため、境界で光の進む向きが折れ曲がります（屈折）。ガラス板を通った光は、入るときと出るときの2回屈折するため、実際の物の位置とは少しずれた位置にあるように見えることがあります。／【身近な例】厚いガラスのコップ越しに見た物が、少し形や位置が変わって見えるのもこの屈折現象によるものです。"},
  {id:"phy429", cat:"物理", sub:"力の働き", q:"物体を糸でつるして静止させたとき、糸が物体を引く力と、物体にはたらく重力の関係として正しいものはどれか。", choices:["大きさが等しく向きが反対でつり合っている","糸の力の方が重力より大きい","重力の方が糸の力より大きい","2つの力は関係し合っていない"], diff:"標準", a:0, e:"【考え方】糸でつるされた物体が静止しているのは、下向きの重力と、上向きに糸が引く力（張力）が、大きさが等しく向きが反対でつり合っているためです。／【まちがえやすい点】もし2つの力の大きさが異なれば、物体は静止できずに動き出してしまいます。静止しているという事実そのものが、力がつり合っていることの証拠になります。"},
  {id:"phy430", cat:"物理", sub:"熱の伝わり方", q:"氷水を入れたコップの外側に水滴がつく現象は、何と関係が深いか。", choices:["空気中の水蒸気が冷やされて水になる現象","コップの中の水がしみ出してくる現象","氷が化学変化を起こす現象","コップが空気中の酸素と反応する現象"], diff:"標準", a:0, e:"【ことばの意味】「結露」＝空気中の水蒸気が冷やされて水滴に変わる現象。／【なぜ起きる？】冷たいコップの表面に触れた空気は温度が下がり、その空気がふくみきれなくなった水蒸気が水滴となって表面につきます。氷水の冷たさによって周囲の空気が冷やされることが原因で、コップの中の水がしみ出しているわけではありません。梅雨時の窓ガラスの結露も同じ原理です。"},
  {id:"phy431", cat:"物理", sub:"運動とエネルギー", q:"振り子が最も低い位置を通過するとき、振り子がもつエネルギーについて正しいものはどれか。", choices:["運動エネルギーが最大になる","位置エネルギーが最大になる","運動エネルギーも位置エネルギーも0になる","エネルギーはすべて失われている"], diff:"標準", a:0, e:"【考え方】振り子は最も高い位置（振れ始めや振れ終わりの位置）で速さが0になり、位置エネルギーが最大・運動エネルギーが0になります。逆に最も低い位置（真下）を通るときは、高さが最も低いため位置エネルギーが最小になり、その分速さが最大になって運動エネルギーが最大になります。／【エネルギーの移り変わり】摩擦や空気抵抗がなければ、位置エネルギーと運動エネルギーは互いに移り変わりながら、合計は一定に保たれます。"},
  {id:"phy432", cat:"物理", sub:"力の働き", q:"物体の重さが2倍になると、同じ面積で受ける圧力はどうなるか。", choices:["2倍になる","半分になる","変わらない","4倍になる"], diff:"標準", a:0, e:"【考え方】圧力＝力の大きさ÷面積という関係が成り立ちます。面積が変わらないまま、力（この場合は物体の重さ）が2倍になると、圧力もそれに比例して2倍になります。／【身近な例】同じ大きさの箱でも、中身が重いほど、床にかかる圧力（重さを支える1点あたりの負担）は大きくなります。力と圧力が比例の関係にあることを表す基本的な考え方です。"},
  {id:"phy433", cat:"物理", sub:"電流と回路", q:"電気製品を使うときに気をつける「ショート（短絡）」とは、どのような状態を指すか。", choices:["抵抗がほとんどない部分に大きな電流が流れてしまう状態","電流がまったく流れなくなる状態","電圧が少しずつ下がっていく状態","電池が完全に使い切られた状態"], diff:"標準", a:0, e:"【ことばの意味】「ショート（短絡）」＝電気抵抗がほとんどない部分（導線どうしが直接ふれ合うなど）を通って、非常に大きな電流が一気に流れてしまう状態。／【危険性】ショートが起こると、大量の電流によって発熱し、発火や機器の故障の原因になることがあります。家庭のブレーカーは、この危険な大電流を感知して自動的に電気を止める安全装置としてはたらいています。"},
  {id:"phy434", cat:"物理", sub:"力の働き", q:"風船に空気を入れてふくらませると、風船の中の空気の圧力はどうなるか。", choices:["ふくらませる前より高くなる","ふくらませる前より低くなる","変化しない","0になる"], diff:"標準", a:0, e:"【考え方】風船に空気を入れると、内部の空気の量が増え、限られた体積の中に押し込められた空気の圧力が高くなります。風船がふくらんだ状態を保っているのは、内側の高い圧力が外側の大気圧やゴムの張力とつり合っているためです。／【身近な体験】ふくらませた風船の口を離すと勢いよく空気が飛び出すのは、内部の圧力が外部よりも高いことを示す現象です。"},
  {id:"phy435", cat:"物理", sub:"光と音", q:"ヘリウムガスを吸って声を出すと、声の高さが変わって聞こえることが知られている。これは音の何が変化するためか。", choices:["振動数（音の高さを決める要素）","音の速さそのものの変化のみ","声帯の色","音の反射角"], diff:"標準", a:0, e:"【考え方】声帯の振動によって出た音は、のどや口の中の空気を通るときにその音の伝わり方が変化します。ヘリウムガスは空気より軽く、音がより速く伝わる性質があるため、共鳴の仕方が変わって声の振動数が変化したように聞こえ、声が高く聞こえる効果が生まれます。／【まちがえやすい点】声帯そのものの振動が変わるわけではなく、周囲の気体の違いによる音の伝わり方の変化が主な原因です。"},
  {id:"phy436", cat:"物理", sub:"力の働き", q:"2つのばねばかりで同じ物体を左右から引っぱり、静止させた。このとき、それぞれのばねばかりが示す値の関係として正しいものはどれか（力の向きが正反対の場合）。", choices:["2つの値は等しくなる","片方が必ず2倍の値になる","値の関係は物体によって毎回異なる","一方は必ず0になる"], diff:"標準", a:0, e:"【考え方】物体が静止しているということは、その物体にはたらく力がつり合っているということです。左右から引く2つの力が正反対の向きで物体を静止させているなら、その2つの力の大きさは等しくなければなりません。／【まちがえやすい点】力のつり合いの基本条件（大きさが等しい・向きが反対・同一直線上）を思い出せば、2つのばねばかりが同じ値を示すことが自然に理解できます。"},
  {id:"phy437", cat:"物理", sub:"熱の伝わり方", q:"保冷剤を入れたクーラーボックスの内側を発泡スチロールで作る理由として正しいものはどれか。", choices:["発泡スチロールは熱を伝えにくいから","発泡スチロールは軽くて丈夫だから","発泡スチロールは水をよく吸うから","発泡スチロールは電気を通すから"], diff:"基礎", a:0, e:"【ことばの意味】発泡スチロールは、内部にたくさんの小さな空気の粒（気泡）をふくんだ構造をしており、熱を伝えにくい（断熱性が高い）性質をもっています。／【なぜクーラーボックスに？】熱を伝えにくいことで、外の暖かい空気の熱が中に伝わりにくく、また中の冷たさが外に逃げにくくなるため、保冷剤の効果を長く保つことができます。魔法びんの構造にも似た断熱の工夫が使われています。"},
  {id:"phy438", cat:"物理", sub:"運動とエネルギー", q:"自転車のブレーキをかけると、タイヤと地面の摩擦によって自転車は止まる。このときの運動エネルギーは主に何に変わるか。", choices:["熱エネルギー","位置エネルギー","化学エネルギー","電気エネルギー"], diff:"基礎", a:0, e:"【考え方】自転車が走っているときにもっている運動エネルギーは、ブレーキをかけることでタイヤと地面（またはブレーキとホイール）の間の摩擦によって熱エネルギーに変わっていきます。ブレーキをかけ続けたあとにブレーキ部分が熱くなっているのは、この摩擦熱によるものです。／【エネルギー保存】運動エネルギーが消えてなくなるのではなく、熱エネルギーという別の形に変わっているだけです。"},
  {id:"phy439", cat:"物理", sub:"力の働き", q:"密度が同じ2つの物体があり、一方が他方より体積が大きい場合、質量の大小関係として正しいものはどれか。", choices:["体積が大きい方が質量も大きい","体積が大きい方が質量は小さい","体積に関係なく質量は同じ","密度が同じなら質量は0になる"], diff:"標準", a:0, e:"【ことばの意味】「密度」＝単位体積あたりの質量。密度＝質量÷体積という関係があります。／【考え方】密度が同じ物体どうしでは、体積が大きいほど、その分だけ質量も大きくなります（質量＝密度×体積という関係が成り立つため）。同じ材質（同じ密度）でできた大きな石と小さな石を比べると、大きな石の方が重い（質量が大きい）のはこのためです。"},
  {id:"phy440", cat:"物理", sub:"電流と回路", q:"電気抵抗が大きい電熱線と小さい電熱線を比べたとき、同じ電圧をかけた場合に多くの熱を発生させやすいのはどちらか。", choices:["抵抗が小さい電熱線","抵抗が大きい電熱線","抵抗の大きさは発熱量に関係しない","どちらも同じ発熱量になる"], diff:"標準", a:0, e:"【考え方】オームの法則より、同じ電圧をかけた場合、抵抗が小さいほど流れる電流は大きくなります（電流＝電圧÷抵抗）。発熱量は電流の大きさに強く影響されるため、抵抗が小さい電熱線の方が多くの電流が流れ、結果として発熱量も大きくなりやすいという関係があります。／【身近な応用】電気ケトルなど短時間で発熱させたい器具には、抵抗が小さめの電熱線が使われることがあります。"},
  {id:"phy441", cat:"物理", sub:"力の働き", q:"高いところから物を落とすとき、空気抵抗を考えなければ、物体の速さはどうなっていくか。", choices:["落下するにつれてだんだん速くなる","一定の速さで落下する","落下するにつれてだんだん遅くなる","途中で速さが0になる"], diff:"基礎", a:0, e:"【考え方】物体が自由落下するとき、重力によって物体は加速し続けます。空気抵抗を考えなければ、落下する時間が長くなるほど、物体の速さはどんどん増していきます。／【身近な体験】高い場所からボールを落とすと、地面に近づくほど速く落ちているように見えるのは、この加速の性質によるものです。実際には空気抵抗の影響も受けますが、理科の基本としてはこの加速の考え方を押さえておくことが大切です。"},
  {id:"phy442", cat:"物理", sub:"光と音", q:"暗い部屋でも、目が慣れてくると少しずつ物が見えるようになることがある。これに関係する目のはたらきとして正しいものはどれか。", choices:["ひとみ（瞳孔）が広がって多くの光を取り入れるようになる","目が自ら光を出すようになる","目のレンズの色が変化する","音を光に変換するようになる"], diff:"標準", a:0, e:"【考え方】暗い場所では、目の瞳孔（ひとみ）が広がり、できるだけ多くの光を目の中に取り入れようとします。この調節によって、少ない光でも物が見えやすくなります。明るい場所では逆に瞳孔が小さくなり、まぶしくなりすぎないよう光の量を調節しています。／【まちがえやすい点】目自体が光を出しているわけではなく、あくまで周囲のわずかな光を効率よく取り入れる調節のはたらきです。"},
  {id:"phy443", cat:"物理", sub:"エネルギーの利用", q:"扇風機のモーターが回転するとき、電気エネルギーは主に何エネルギーに変わっているか。", choices:["運動エネルギー","化学エネルギー","位置エネルギー","核エネルギー"], diff:"基礎", a:0, e:"【考え方】扇風機のモーターは、電流が磁界から力を受ける現象を利用して、電気エネルギーを羽根の回転運動、つまり運動エネルギーに変換しています。羽根が回転することで風が起こり、涼しさを感じられます。／【身近な関連】洗濯機やドライヤーのファン、電車のモーターなど、電気エネルギーを運動エネルギーに変える仕組みは、身の回りの多くの機械で利用されています。"},
  {id:"phy444", cat:"物理", sub:"力の働き", q:"同じ強さの磁石2個を、N極どうしを向かい合わせて近づけるとどうなるか。", choices:["反発し合って離れようとする","引き合ってくっつこうとする","何の力もはたらかない","磁力が消えてしまう"], diff:"基礎", a:0, e:"【ことばの意味】磁石には必ずN極とS極があり、同じ極どうし（N極とN極、S極とS極）は反発し合い、異なる極どうし（N極とS極）は引き合うという性質があります。／【確かめ方】2つの磁石のN極どうしを近づけると、たがいに押し返し合う力（反発力）を手で感じることができます。逆にN極とS極を近づけると、引き寄せ合う力（引力）を感じます。この性質は方位磁針の動きにも関係しています。"},,
  {id:"trivia76", cat:"雑学", sub:"人体", q:"心臓が1日に打つ(拍動する)回数はおよそどれくらいか。", choices:["約10万回","約1万回","約100万回","約1000回"], diff:"基礎", a:0, e:"【考え方】心臓は1分間に60〜80回ほど拍動しています。1時間では約4000回、1日（24時間）では約10万回にもなります。／【すごさを実感】1年ではおよそ3650万回、80年生きるとすると一生で約30億回も休まず動き続けている計算になります。心臓は生まれてから一度も休むことなく働き続ける、驚異的なポンプといえます。"},
  {id:"trivia77", cat:"雑学", sub:"人体", q:"ヒトの体の中で最も硬い部分はどこか。", choices:["歯（エナメル質）","つめ","骨（大腿骨）","かかとの皮膚"], diff:"基礎", a:0, e:"【ことばの意味】「エナメル質」＝歯の表面をおおう、体の中で最も硬い組織。／【なぜ硬い？】エナメル質はリン酸カルシウムなどのミネラルを豊富にふくんでおり、かたい食べ物をかみくだく歯にとって必要な硬さを実現しています。骨も硬い組織ですが、エナメル質の硬さにはおよびません。ただしエナメル質は一度こわれると再生しないため、大切にケアする必要があります。"},
  {id:"trivia78", cat:"雑学", sub:"人体", q:"くしゃみをするときの空気の速さは、およそどれくらいといわれているか。", choices:["時速150kmをこえることがある","時速5km程度","時速1000kmをこえる","ほとんど速さが出ない"], diff:"標準", a:0, e:"【驚きの数字】くしゃみで飛び出す空気やしぶきの速さは、条件によっては新幹線並みの時速150kmをこえるという報告もあります。とても速い勢いで飛び出しているのです。／【なぜ速い？】くしゃみは、鼻やのどの粘膜への刺激を、体が一気に強い息で吹き飛ばして取り除こうとする反射的な反応です。マスクや袖で口元をおおう「せきエチケット」が大切な理由もここにあります。"},
  {id:"trivia79", cat:"雑学", sub:"人体", q:"ヒトの体温を一定に保つはたらきの中心になっている脳の部分はどこか。", choices:["視床下部","小脳","大脳皮質","延髄のみ"], diff:"標準", a:0, e:"【ことばの意味】「視床下部」＝脳の中で、体温・食欲・睡眠などを自動的に調節する中心となる部分。／【体温調節のしくみ】暑いときは血管を広げて熱を逃がしたり汗をかいたりし、寒いときは血管を縮めたりふるえで熱を作ったりします。これらの指令を出しているのが視床下部です。ヒトが暑い日も寒い日も体温をほぼ一定（約36〜37℃）に保てるのは、このはたらきのおかげです。"},
  {id:"trivia80", cat:"雑学", sub:"人体", q:"人間の体の中で、最も多くの数がある細胞に近いものはどれか。", choices:["赤血球","神経細胞","筋肉の細胞","骨の細胞"], diff:"標準", a:0, e:"【ことばの意味】血液の成分の中でも赤血球は特に数が多く、体全体でおよそ20兆〜25兆個にものぼるといわれています。／【なぜこんなに多い？】赤血球は酸素を全身の細胞に届ける役割をもち、体のすみずみまで酸素を行きわたらせるためには非常に多くの数が必要です。赤血球は寿命がおよそ120日で、絶えず骨の中でつくられ、古いものと入れかわっています。"},
  {id:"trivia81", cat:"雑学", sub:"人体", q:"つめや髪の毛が伸び続けるのはなぜか。", choices:["根もとの細胞が分裂して新しい細胞を作り出しているから","つめや髪自体が生きていて呼吸しているから","体温によって自然にのびていくから","水分を吸収してふくらんでいくから"], diff:"標準", a:0, e:"【ことばの意味】つめや髪の毛の根もとには、細胞分裂がさかんに行われる部分があります。新しい細胞が次々と作られ、古い細胞を押し出すようにして、つめや髪がのびていきます。／【まちがえやすい点】実は目に見えているつめや髪の毛自体はすでに死んだ細胞（かたいタンパク質）でできており、痛みを感じません。切っても痛くないのはこのためです。"},
  {id:"trivia82", cat:"雑学", sub:"人体", q:"満腹感を感じるまでに、食べ始めてからおよそどれくらいの時間がかかるといわれているか。", choices:["約20分","約2分","約2時間","即座に感じる"], diff:"標準", a:0, e:"【ことばの意味】脳の中で「満腹感」を伝える信号が出るまでには、食べ始めてから20分ほどの時間差があるといわれています。／【早食いに注意】早食いをすると、実際に必要な量を超えて食べてしまってから満腹感を感じてしまうことがあります。よくかんでゆっくり食べることで、この時間差の影響を減らし、食べ過ぎを防ぎやすくなると考えられています。"},
  {id:"trivia83", cat:"雑学", sub:"人体", q:"人間のからだの中で、最も小さい骨がある場所はどこか。", choices:["耳（耳小骨）","手の指先","足のかかと","鼻"], diff:"標準", a:0, e:"【ことばの意味】「耳小骨（じしょうこつ）」＝耳の奥にある、音を伝えるための3つの小さな骨（つち骨・きぬた骨・あぶみ骨）。中でもあぶみ骨は人体で最も小さい骨として知られています。／【はたらき】これらの小さな骨は、鼓膜の振動を耳の奥（内耳）に伝えるはたらきをしており、音を聞くために欠かせない重要な役割を果たしています。"},
  {id:"trivia84", cat:"雑学", sub:"人体", q:"げっぷ（おくび）が出る主な原因として正しいものはどれか。", choices:["胃の中にたまった空気が口から出てくる","肺の中の空気が逆流してくる","消化された食べ物のガスだけが出てくる","心臓の動きによって空気が押し出される"], diff:"基礎", a:0, e:"【考え方】食事のときに食べ物と一緒に飲みこんだ空気や、炭酸飲料にふくまれる気体は、胃の中にたまっていきます。この空気が食道を通って口から出てくる現象がげっぷです。／【炭酸飲料との関係】炭酸飲料を飲むとげっぷが出やすいのは、飲料の中の二酸化炭素が胃の中で気体として出てきて、たまった空気が増えるためです。"},
  {id:"trivia85", cat:"雑学", sub:"人体", q:"人が笑うと分泌されやすくなり、幸せな気分に関わるとされるホルモンとして知られているものはどれか。", choices:["エンドルフィン","インスリン","アドレナリンのみ","メラトニンのみ"], diff:"標準", a:0, e:"【ことばの意味】「エンドルフィン」＝脳内で分泌され、幸福感や痛みをやわらげる効果があるとされる物質。「脳内麻薬」と呼ばれることもあります。／【笑いとの関係】笑うことでエンドルフィンの分泌がうながされ、ストレスがやわらいだり、免疫のはたらきが高まったりする効果があると考えられています。「笑いは健康によい」という言い伝えには、こうした体のしくみが関係しているようです。"},
  {id:"trivia86", cat:"雑学", sub:"人体", q:"指紋には、人によって違うという以外に、どのような特徴があるか。", choices:["一生を通じてほとんど変化しない","毎年少しずつ形が変わっていく","年齢とともに完全に消えてしまう","体温によって模様が変化する"], diff:"標準", a:0, e:"【考え方】指紋は生まれる前（胎児の間）にでき、その後は皮膚の表面が傷つかない限り、一生を通じてほぼ同じ模様を保ち続けます。この「一人ひとり違う」「一生変わらない」という2つの特徴を利用して、指紋認証や捜査などに指紋が使われています。／【指紋の役割】指紋の細かい凹凸は、物をつかむときに滑りにくくするはたらきもあると考えられています。"},
  {id:"trivia87", cat:"雑学", sub:"人体", q:"人間が一度に息を止めていられる時間には限りがある。その主な理由として正しいものはどれか。", choices:["血液中の二酸化炭素が増えて、脳が呼吸をうながす信号を出すから","肺の中の酸素がすべてなくなってしまうから","心臓が止まってしまうから","筋肉の力が完全になくなるから"], diff:"標準", a:0, e:"【考え方】息を止めていると、体の中で二酸化炭素がどんどんたまっていきます。脳は血液中の二酸化炭素の濃度を感じ取り、一定以上になると「呼吸をしなさい」という強い信号を出すため、苦しくなって息を止めていられなくなります。／【まちがえやすい点】苦しさの直接の原因は「酸素が足りない」ことよりも、実は「二酸化炭素が増えすぎる」ことにあると考えられています。"},
  {id:"trivia88", cat:"雑学", sub:"人体", q:"あくびが出る理由について、有力な説として考えられているものはどれか。", choices:["脳を冷やして目を覚まさせるはたらきがあるという説","体温を上げるためという説","消化を助けるためという説","声を出す練習のためという説"], diff:"標準", a:0, e:"【考え方】あくびをすると大きく息を吸いこみ、脳への血流や空気の流れが変化します。この動きによって脳の温度を下げ、集中力を回復させるはたらきがあるのではないかという説が有力とされています。／【豆知識】あくびが「うつる」現象もよく知られていますが、そのくわしい理由は完全には解明されておらず、今も研究が続けられているテーマの一つです。"},
  {id:"trivia89", cat:"雑学", sub:"人体", q:"耳あかには、どのようなはたらきがあると考えられているか。", choices:["耳の中を保護し、ほこりや虫の侵入を防ぐはたらき","音を大きく聞こえるようにするはたらき","体温を調節するはたらき","味を感じ取るはたらき"], diff:"基礎", a:0, e:"【考え方】耳あかは、耳の中の皮脂やあかが混ざってできるもので、耳の内部を乾燥や刺激から守ったり、細かいほこりや小さな虫が奥まで入りこむのを防いだりする役割があると考えられています。／【まちがえやすい点】単なる「よごれ」ではなく、体を守るための分泌物の一種であるという点をおさえておきましょう。"},
  {id:"trivia90", cat:"雑学", sub:"人体", q:"人間の皮膚は、体全体でおよそ何年ほどですべて新しい細胞に入れかわるといわれているか。", choices:["約1か月","約1日","約10年","一生変わらない"], diff:"標準", a:0, e:"【ことばの意味】「ターンオーバー」＝皮膚の細胞が生まれてから、はがれ落ちるまでの周期のこと。皮膚の一番外側（表皮）は、およそ1か月ほどの周期で新しい細胞に入れかわっているといわれています。／【身近な現象】お風呂やタオルでこすったときに出る白いあかは、この入れかわりではがれ落ちた古い皮膚の細胞です。年齢とともにこの周期は長くなる傾向があるとされています。"},
  {id:"trivia91", cat:"雑学", sub:"人体", q:"骨折した骨がくっついて元にもどっていく力を何と呼ぶことが多いか。", choices:["自然治癒力（骨の再生能力）","筋肉の記憶力","血液の凝固力のみ","皮膚の再生力"], diff:"基礎", a:0, e:"【ことばの意味】「自然治癒力」＝体が本来もっている、けがや病気を自分で治そうとする力。骨は折れても、周囲の細胞がはたらいて新しい骨の組織を作り、時間をかけてもとの形に近い状態に治っていきます。／【身近な話】ギプスで折れた部分を固定するのは、骨がくっつくまでの間、動かないように支えて、正しい形で治りやすくするための工夫です。"},
  {id:"trivia92", cat:"雑学", sub:"人体", q:"空腹のときに「グー」と鳴るお腹の音の正体として正しいものはどれか。", choices:["胃や腸が動いて、中の空気や液体が移動する音","心臓の音が反響して聞こえている音","肺が空気を送り出す音","筋肉がけいれんする音"], diff:"基礎", a:0, e:"【考え方】胃や腸は、食べ物がなくても消化管をきれいにするために一定の間隔で動き続けています。この動き（ぜん動運動）によって、中に残っている空気や消化液が移動するときに音が出ることがあり、これが「お腹が鳴る」正体です。／【空腹時に鳴りやすい理由】食べ物が少ないと空気の割合が増え、音がひびきやすくなるため、空腹時に特に聞こえやすくなると考えられています。"},
  {id:"trivia93", cat:"雑学", sub:"人体", q:"ヒトの目のまばたきは、1分間におよそ何回くらい行われているか。", choices:["約15〜20回","約1〜2回","約100回以上","まばたきはほとんどしない"], diff:"標準", a:0, e:"【考え方】ヒトは意識しなくても、1分間に平均15〜20回ほどまばたきをしています。これは目の表面を涙でうるおし、乾燥やほこりから守るための無意識の反応です。／【身近な変化】パソコンやスマートフォンの画面に集中していると、まばたきの回数が減ってしまい、目の乾燥（ドライアイ）につながることがあるといわれています。適度に休憩をとることが目の健康には大切です。"},
  {id:"trivia94", cat:"雑学", sub:"人体", q:"人間の体温が高くなりすぎたとき、汗をかくことにはどのような効果があるか。", choices:["汗が蒸発するときに体の熱をうばい、体を冷やす効果","体の水分を増やして体温を上げる効果","汗そのものが熱を発生させる効果","体温には影響しない"], diff:"基礎", a:0, e:"【考え方】水が蒸発するときには周囲から熱をうばう性質（気化熱）があります。汗が皮膚の表面で蒸発するときに、この気化熱によって体表の熱がうばわれ、体温が下がる効果が生まれます。／【身近な体験】運動をして汗をかいた後、風にあたるとひんやり感じるのは、汗が蒸発して体の熱をうばっているためです。この汗による体温調節は、暑い環境で体を守る重要なしくみです。"},
  {id:"trivia95", cat:"雑学", sub:"人体", q:"「利き手」がある理由について、脳のはたらきと関連づけて考えられていることはどれか。", choices:["左右の脳のどちらが体の動きをより強く支配しているかに関係すると考えられている","利き手は生まれた後の練習だけで完全に決まる","利き手には脳はまったく関係していない","利き手は年齢とともに毎年入れかわる"], diff:"標準", a:0, e:"【考え方】人間の脳は左右に分かれており、右手を主に動かす神経は左脳から、左手を動かす神経は右脳から出ています。利き手がどちらになるかには、この左右の脳の発達のかたよりが関係していると考えられていますが、完全なしくみはまだ研究が続けられているテーマです。／【豆知識】世界の人口のうち、右利きの人がおよそ9割を占めるといわれています。"},
  {id:"trivia96", cat:"雑学", sub:"毒キノコと食べ物", q:"日本で食中毒の原因になるキノコとして特に有名な、テングタケ科のキノコはどれか。", choices:["ベニテングタケ","シイタケ","エノキタケ","マイタケ"], diff:"基礎", a:0, e:"【ことばの意味】「ベニテングタケ」＝赤い傘に白いぶつぶつの模様がある、絵本などにもよく登場する見た目が特徴的なキノコ。毒成分をふくんでおり、食べると幻覚や嘔吐などの症状を引き起こすことが知られています。／【安全の基本】野山で見つけたキノコを、自己判断で食べるのは大変危険です。食用と確認されたもの以外は絶対に口にしないという注意が必要です。"},
  {id:"trivia97", cat:"雑学", sub:"毒キノコと食べ物", q:"食用のキノコに似ていて誤食（まちがえて食べること）による食中毒が多いとされる毒キノコはどれか。", choices:["ツキヨタケ","シメジ","マツタケ","なめこ"], diff:"標準", a:0, e:"【ことばの意味】「ツキヨタケ」＝食用のヒラタケやシイタケに似た見た目をしており、日本の食中毒事故の中でも特に発生件数が多いとされる毒キノコ。／【なぜ間違えやすい？】色や形が食用キノコとよく似ているため、キノコ狩りの経験者でも見分けを誤ることがあります。食用かどうか自信がないキノコは、絶対に採って食べないようにすることが大切な安全ルールです。"},
  {id:"trivia98", cat:"雑学", sub:"毒キノコと食べ物", q:"毒キノコの多くにふくまれ、肝臓などに重い障害を引き起こすことがある成分の総称として使われる言葉はどれか。", choices:["キノコ毒素（トキシン）","ビタミン","デンプン","食物繊維"], diff:"標準", a:0, e:"【ことばの意味】「キノコ毒素（トキシン）」＝キノコにふくまれる、人体に有害な作用をおよぼす化学物質の総称。種類によって胃腸の症状を起こすもの、幻覚を起こすもの、肝臓や腎臓に重い障害を与えるものなどさまざまです。／【安全の基本】加熱すれば安全になると思われがちですが、毒キノコの成分の多くは加熱しても毒性が消えないため、見分けがつかないキノコは口にしないことが最も確実な予防法です。"},
  {id:"trivia99", cat:"雑学", sub:"毒キノコと食べ物", q:"「柄を裂くと縦にさけるキノコは食べられる」といった民間の言い伝えについて、専門家がどう考えているか。", choices:["科学的な根拠がなく、あてにできないとされている","すべてのキノコに当てはまる確実な見分け方とされている","国が公式に認めた安全な見分け方とされている","色が変わるかどうかより信頼できるとされている"], diff:"標準", a:0, e:"【考え方】「柄がまっすぐさけるものは食べられる」「虫が食べているものは安全」といった言い伝えは、実際には科学的な裏づけがなく、毒キノコにも当てはまってしまう例外が多いことが分かっています。／【正しい心がまえ】キノコの安全な判別には専門的な知識が必要です。自己判断や言い伝えに頼らず、詳しい専門家に確認してもらうことが、食中毒を防ぐ最も確実な方法です。"},
  {id:"trivia100", cat:"雑学", sub:"毒キノコと食べ物", q:"じゃがいもの芽や、緑色になった皮の部分にふくまれる、食べると中毒を起こすことがある天然の毒はどれか。", choices:["ソラニン","ビタミンC","でんぷん","カロテン"], diff:"標準", a:0, e:"【ことばの意味】「ソラニン」＝じゃがいもの芽や、日光に当たって緑色になった皮の部分に多くふくまれる天然の毒成分。／【症状】ソラニンを多く含む部分を食べると、吐き気や腹痛、頭痛などの症状が出ることがあります。／【安全な食べ方】じゃがいもを調理するときは、芽をしっかり取り除き、緑色になった皮の部分は厚めにむいて取り除くことが、食中毒を防ぐ基本的な工夫として知られています。"},
  {id:"trivia101", cat:"雑学", sub:"毒キノコと食べ物", q:"生の状態で食べると中毒を起こすことがあるため、必ず十分に加熱してから食べる必要がある豆はどれか。", choices:["インゲン豆","炒った落花生","蒸した枝豆","ゆでたそら豆"], diff:"標準", a:0, e:"【考え方】インゲン豆（特に赤インゲン）には、レクチンという成分が多くふくまれており、生や加熱不足の状態で食べると、吐き気や腹痛などの中毒症状を起こすことが知られています。／【安全な食べ方】インゲン豆を使った料理（豆料理やカレーなど）を作るときは、十分な時間をかけてしっかり加熱することで、レクチンの毒性を弱めることができます。手作り料理での注意点として知られています。"},
  {id:"trivia102", cat:"雑学", sub:"毒キノコと食べ物", q:"フグの体の中で、特に強い毒（テトロドトキシン）が多くふくまれていることが知られている部分はどれか。", choices:["卵巣や肝臓など","筋肉（身の部分）のみ","うろこのみ","目のみ"], diff:"基礎", a:0, e:"【ことばの意味】「テトロドトキシン」＝フグがもつ非常に強い天然の毒成分で、特に卵巣や肝臓に多くふくまれています。／【なぜ専門の免許が必要？】フグを安全に食べるためには、毒のある部分を確実に取り除く専門的な技術が必要なため、日本ではフグを調理して提供するのに専門の資格（ふぐ調理師免許など）が必要とされています。自分でさばいたフグを食べるのは大変危険です。"},
  {id:"trivia103", cat:"雑学", sub:"毒キノコと食べ物", q:"梅干しなどに使われる梅の実の、青くて熟していない生の状態にふくまれる、食べ過ぎに注意が必要な成分はどれか。", choices:["アミグダリン（を含む成分）","ビタミンC","クエン酸のみ","食物繊維のみ"], diff:"標準", a:0, e:"【ことばの意味】青い未熟な梅の実の種の部分などには、アミグダリンという成分がふくまれており、体内で分解されると有害な物質を生じることが知られています。／【安全性】梅干しや梅酒などに加工される過程で、この成分の多くは分解・除去されるため、通常の加工品を食べる分には心配ありません。ただし生の青梅をそのまま大量に食べることは避けるべきとされています。"},
  {id:"trivia104", cat:"雑学", sub:"毒キノコと食べ物", q:"はちみつを1歳未満の赤ちゃんに与えてはいけないとされる理由として正しいものはどれか。", choices:["乳児ボツリヌス症を起こす可能性があるから","はちみつは赤ちゃんには甘すぎるから","はちみつはアレルギーを必ず起こすから","はちみつには栄養がまったくないから"], diff:"標準", a:0, e:"【ことばの意味】「乳児ボツリヌス症」＝はちみつにごくまれにふくまれることがあるボツリヌス菌の芽胞が、腸の発達が未熟な赤ちゃんの体内で増えてしまい、重い症状を引き起こす病気。／【なぜ大人は平気？】大人や1歳を過ぎた子どもは腸内の環境が発達しているため、ボツリヌス菌の芽胞を口にしても通常は問題になりません。1歳未満の赤ちゃんにはちみつを与えないことが、育児の基本的な注意点として広く知られています。"},
  {id:"trivia105", cat:"雑学", sub:"毒キノコと食べ物", q:"貝類（アサリなど）が、特定のプランクトンを食べることで体内にためこみ、食中毒の原因になることがある毒を何と呼ぶか。", choices:["貝毒","デンプン毒","タンパク質毒","繊維毒"], diff:"標準", a:0, e:"【ことばの意味】「貝毒」＝有毒なプランクトンを貝が食べることで、貝の体内に蓄積される毒の総称。貝自身はこの毒の影響をあまり受けませんが、それを食べた人間には中毒症状が出ることがあります。／【安全対策】貝毒の発生が心配される時期や海域では、行政による検査が行われ、基準値をこえた場合は貝の採取や出荷が制限されるしくみが整えられています。"},
  {id:"trivia106", cat:"雑学", sub:"毒キノコと食べ物", q:"賞味期限と消費期限の違いについて正しいものはどれか。", choices:["消費期限は安全に食べられる期限、賞味期限はおいしく食べられる目安の期限","賞味期限も消費期限も、実は表している内容がまったく同じ言葉である","消費期限の方が賞味期限よりも長い期間を示すことになっている言葉である","期限が過ぎてしまっても、品質にはまったく関係がないとされている"], diff:"基礎", a:0, e:"【ことばの意味】「消費期限」＝傷みやすい食品につけられる、安全に食べられる期限。過ぎたら食べない方がよいとされます。「賞味期限」＝比較的日持ちする食品につけられる、おいしく食べられる目安の期限で、多少過ぎてもすぐに危険というわけではありません。／【まちがえやすい点】どちらも保存方法（冷蔵・常温など）が正しく守られていることが前提の期限である点に注意しましょう。"},
  {id:"trivia107", cat:"雑学", sub:"毒キノコと食べ物", q:"カビが生えた食品の一部を取り除けば、残りの部分は安全に食べられるといえるか。", choices:["カビの根が見えない部分にも広がっていることが多く、安全とは言い切れない","カビの生えた部分だけ取り除けば、必ず安全に食べられるようになる","カビは加熱してしまえば、すべての種類が無害になってしまう","カビが生えた食品は、においをかぐだけで安全かどうか正確に判断できる"], diff:"標準", a:0, e:"【考え方】食品に生えたカビは、見た目以上に内部まで菌糸を広げていることが多く、カビの生えた部分だけを取り除いても、目に見えない部分に有害な成分（かび毒）が広がっている可能性があります。／【安全な考え方】カビが生えた食品は、もったいなくても全体を廃棄することがすすめられています。加熱してもすべてのかび毒が分解されるわけではない点も注意が必要です。"},
  {id:"trivia108", cat:"雑学", sub:"毒キノコと食べ物", q:"きのこ狩りで見つけたキノコを安全に食べられるかどうか判断するために、最も確実な方法はどれか。", choices:["きのこに詳しい専門家に見てもらい確認してもらう","色やにおいが好みかどうかで自分で判断する","インターネットの画像だけで見比べて判断する","動物が食べていたかどうかで判断する"], diff:"基礎", a:0, e:"【考え方】毒キノコと食用キノコは、見た目がとてもよく似ている場合が多く、素人の判断では見分けがつかないことがよくあります。動物が食べているから安全とは限らず、動物と人間では毒への強さが異なる場合もあります。／【最も確実な方法】保健所や専門の鑑定機関、きのこに詳しい専門家に実物を見てもらい確認してもらうことが、確実に安全を確かめる方法として推奨されています。"},
  {id:"trivia109", cat:"雑学", sub:"毒キノコと食べ物", q:"ナスやトマトと同じ「ナス科」の植物で、青い未熟な実に毒があることが知られている野菜はどれか。", choices:["じゃがいも","きゅうり","にんじん","だいこん"], diff:"標準", a:0, e:"【ことばの意味】じゃがいもはナス科の植物で、トマトやナスと同じ仲間に分類されます。じゃがいもの芽や緑色になった皮には、ソラニンという毒成分がふくまれることが知られています。／【身近な注意点】家庭菜園でじゃがいもを育てる場合、実についた緑色の部分や、地上に出て光合成をしてしまった小さな未熟なじゃがいもには特に注意が必要とされています。"},
  {id:"trivia110", cat:"雑学", sub:"毒キノコと食べ物", q:"食中毒を防ぐために、肉や魚を調理するときに特に気をつけるべきこととして正しいものはどれか。", choices:["中心部までしっかり加熱すること","色が変わればどんな加熱でも十分である","冷蔵庫に入れておけば加熱は不要である","調味料を多めに使えば加熱は不要である"], diff:"基礎", a:0, e:"【考え方】肉や魚には、食中毒の原因になる細菌がついていることがあります。これらの細菌の多くは熱に弱いため、中心部までしっかり加熱することで、安全に食べられるようになります。表面の色が変わっていても、内部が生焼けの状態では細菌が残っている可能性があります。／【身近な工夫】バーベキューなどで肉を焼くときに、切り分けて中まで火が通っているか確認するのは、この食中毒予防の考え方にもとづいています。"},
  {id:"trivia111", cat:"雑学", sub:"毒キノコと食べ物", q:"多くの毒キノコに共通する見た目の特徴として、確実に見分けられる方法といえるものはどれか。", choices:["見た目だけで確実に見分けられる万能な方法は存在しない","傘の色が地味なものは必ず食用である","柄が太いキノコは必ず毒キノコである","傘にぶつぶつがあるものは必ず毒キノコである"], diff:"標準", a:0, e:"【考え方】「色が派手だから毒」「地味だから安全」というような単純なルールは、実際の毒キノコと食用キノコには当てはまらない例外がたくさんあります。地味な色をした猛毒のキノコや、派手な色でも食用のキノコが存在するため、見た目だけで確実に見分けられる万能な方法はないとされています。／【安全な結論】結局のところ、専門家の確認なしに野生のキノコを食べないことが、最も確実な安全対策です。"},
  {id:"trivia112", cat:"雑学", sub:"毒キノコと食べ物", q:"アジやサバなどの魚に多くふくまれ、時間がたつと分解されて、じんましんなどのアレルギーに似た症状を起こすことがある成分はどれか。", choices:["ヒスタミン","ビタミンD","カルシウム","でんぷん"], diff:"標準", a:0, e:"【ことばの意味】「ヒスタミン」＝アジやサバなど、特定の種類の魚にもともとふくまれる成分（ヒスチジン）が、時間の経過とともに細菌のはたらきで変化してできる物質。／【症状】ヒスタミンが多くたまった魚を食べると、顔が赤くなったりじんましんが出たりする、アレルギーとよく似た食中毒の症状が出ることがあります。これはヒスタミン食中毒と呼ばれ、新鮮な魚を選び、早めに冷蔵保存することが予防につながるとされています。"},
  {id:"trivia113", cat:"雑学", sub:"毒キノコと食べ物", q:"生の鶏肉にふれた後、そのまま手を洗わずに他の食品にさわると危険とされる理由として正しいものはどれか。", choices:["生の鶏肉には食中毒の原因となる細菌がついていることが多いから","鶏肉の色が他の食品につくと見た目が悪くなるから","鶏肉には特別な化学物質が含まれているから","鶏肉のにおいが他の食品に移るだけの問題だから"], diff:"基礎", a:0, e:"【考え方】生の鶏肉には、カンピロバクターなどの食中毒の原因となる細菌がついていることが比較的多いことが知られています。生肉にふれた手や調理器具を介して、他の食品（サラダなど、加熱しないで食べるもの）に細菌が移ってしまうことを「二次汚染」といいます。／【予防のポイント】生の肉を扱った後は手や調理器具をよく洗う、まな板を肉用と野菜用で分けるといった工夫が、この二次汚染を防ぐために大切です。"},
  {id:"trivia114", cat:"雑学", sub:"毒キノコと食べ物", q:"缶詰やびん詰めの食品が、まれに食中毒（ボツリヌス菌）の原因になることがあるのはどのような場合か。", choices:["酸素がない密閉状態で、殺菌が不十分な場合","開封してすぐに食べた場合","冷蔵庫で保存していた場合","短時間で調理した場合"], diff:"標準", a:0, e:"【ことばの意味】「ボツリヌス菌」＝酸素のない環境でよく増える性質をもつ細菌で、強い毒素を作ることがある。密閉された缶詰やびん詰めなど、酸素の少ない環境が生じやすい保存食品で、殺菌が不十分だった場合にまれに問題になることがあります。／【安全対策】市販の缶詰・びん詰めは厳しい殺菌基準のもとで作られているため通常は安全ですが、変な膨張やにおいがある製品は口にしないことが大切な注意点です。"},
  {id:"trivia115", cat:"雑学", sub:"毒キノコと食べ物", q:"銀杏（ぎんなん）を食べ過ぎると中毒を起こすことがあるといわれる理由として正しいものはどれか。", choices:["銀杏にふくまれる成分がビタミンB6のはたらきをさまたげることがあるから","銀杏は消化されずに、そのまま体を通過していくだけの食べ物だから","銀杏には塩分だけが非常に多くふくまれている食べ物だから","銀杏はかならず生の状態で食べる必要がある食べ物だから"], diff:"標準", a:0, e:"【考え方】銀杏には、体内でビタミンB6のはたらきをじゃましてしまう成分がふくまれていることが知られています。特に体の小さい子どもが一度に多く食べると、けいれんなどの中毒症状を起こすことがあるため注意が必要とされています。／【安全な食べ方】大人でも食べ過ぎには注意が必要で、特に小さな子どもには量を控えめにするなどの配慮が大切だといわれています。"},
  {id:"che313", cat:"化学", sub:"物質のすがた", q:"金属をみがくと特有の光沢が出る性質を何というか。", choices:["金属光沢","反射性","伝導性","展性"], diff:"基礎", a:0, e:"【ことばの意味】「金属光沢」＝金属をみがいたときに見られる、特有のかがやき。金属に共通して見られる性質の一つです。／【他の金属の性質】金属には他にも、電気や熱をよく通す性質（伝導性）、たたくとうすく広がる性質（展性）、引っぱると細くのびる性質（延性）などがあります。これらの性質はまとめて金属の共通の性質として覚えておくとよいでしょう。"},
  {id:"che314", cat:"化学", sub:"物質のすがた", q:"金属をたたくとうすく広がる性質を何というか。", choices:["展性","延性","弾性","光沢"], diff:"基礎", a:0, e:"【ことばの意味】「展性」＝金属をたたくとうすく広がる性質。金や銀、アルミニウムなどの金属に見られる性質です。／【身近な利用】金箔（きんぱく）が非常にうすく広げられているのは、金がもつ展性の高さを利用したものです。アルミホイルも、この展性を利用してうすいシート状に加工されています。／【延性との違い】延性は引っぱると細くのびる性質で、展性（たたいて広がる）とは加える力の向きが異なります。"},
  {id:"che315", cat:"化学", sub:"物質のすがた", q:"金属を引っぱると細くのびる性質を何というか。", choices:["延性","展性","弾性","光沢"], diff:"基礎", a:0, e:"【ことばの意味】「延性」＝金属を引っぱると、切れずに細くのびる性質。銅や金などの金属に見られます。／【身近な利用】電線に銅が使われているのは、銅が電気を通しやすいことに加え、延性が高く細い線に加工しやすいためです。金は特に延性が高く、非常に細い線に加工できることが知られています。／【展性との違い】展性はたたいて広げる性質、延性は引っぱってのばす性質で、力の加え方が異なります。"},
  {id:"che316", cat:"化学", sub:"物質のすがた", q:"金属に共通する性質として当てはまらないものはどれか。", choices:["水にとけやすい","電気をよく通す","熱をよく伝える","特有の光沢がある"], diff:"基礎", a:0, e:"【金属の共通の性質】金属には、電気伝導性（電気を通しやすい）、熱伝導性（熱を伝えやすい）、金属光沢（特有のかがやき）、展性・延性（広がる・のびる）などの共通の性質があります。／【水への溶けやすさ】金属が水にとけやすいという性質は、金属に共通する性質ではありません。多くの金属は水に溶けません（例外的にナトリウムなど水と激しく反応するものもありますが、一般的な性質ではありません）。"},
  {id:"che317", cat:"化学", sub:"物質のすがた", q:"金属以外の物質を何というか。", choices:["非金属","合金","化合物","混合物"], diff:"基礎", a:0, e:"【ことばの意味】「非金属」＝金属としての性質（金属光沢・電気伝導性など）をもたない物質。炭素、硫黄、酸素などが非金属の例です。／【物質の大きな分類】物質は大きく金属と非金属に分けて考えることができます。金属は電気をよく通し特有の光沢をもちますが、非金属の多くは電気を通しにくく、金属のような光沢をもたないという違いがあります。"},
  {id:"che318", cat:"化学", sub:"物質のすがた", q:"物質が液体から固体に変わる状態変化を何というか。", choices:["凝固","融解","蒸発","昇華"], diff:"基礎", a:0, e:"【ことばの意味】「凝固」＝液体が固体に変わる状態変化。水が氷になる変化がその例です。／【対になる変化】固体が液体になる変化は「融解」といい、凝固とは逆の変化です。凝固が起こる温度（凝固点）は、一般に融解が起こる温度（融点）と同じ値になります。水の凝固点は0℃で、融点も0℃です。／【他の選択肢】蒸発は液体が気体になる変化、昇華は固体が直接気体になる変化で、それぞれ異なる状態変化です。"},
  {id:"che319", cat:"化学", sub:"物質のすがた", q:"物質が固体から液体に変わる状態変化を何というか。", choices:["融解","凝固","蒸発","凝縮"], diff:"基礎", a:0, e:"【ことばの意味】「融解」＝固体が液体に変わる状態変化。氷がとけて水になる変化がその例です。／【融解が起こる温度】固体が融解し始める温度を融点といいます。純粋な物質では、融解している間、温度は融点で一定に保たれます。氷がとけている間、温度計は0℃を示し続けます。／【対になる変化】液体が固体に変わる変化は「凝固」といい、融解とは逆の変化です。"},
  {id:"che320", cat:"化学", sub:"物質のすがた", q:"物質が気体から液体に変わる状態変化を何というか。", choices:["凝縮（液化）","蒸発","昇華","融解"], diff:"基礎", a:0, e:"【ことばの意味】「凝縮（液化）」＝気体が液体に変わる状態変化。水蒸気が冷やされて水滴になる変化がその例です。／【身近な例】冷たい飲み物が入ったコップの表面に水滴がつくのは、空気中の水蒸気が冷やされて凝縮する現象です。お風呂場の鏡がくもるのも、湯気（水蒸気）が鏡の冷たい表面で凝縮して水滴になるためです。／【対になる変化】液体が気体になる変化は「蒸発」で、凝縮とは逆の変化です。"},
  {id:"che321", cat:"化学", sub:"物質のすがた", q:"液体の表面から気体に変わっていく現象を何というか。", choices:["蒸発","沸騰","昇華","凝固"], diff:"基礎", a:0, e:"【ことばの意味】「蒸発」＝液体の表面から気体（水蒸気など）に変わっていく現象。沸点に達していなくても、常温でも少しずつ起こります。／【身近な例】洗濯物が乾くのは、水が蒸発して水蒸気となって空気中に出ていくためです。コップに入れた水を置いておくと、少しずつ量が減っていくのも蒸発によるものです。／【沸騰との違い】沸騰は液体の内部からも気体に変わる現象で、決まった沸点でだけ起こります。蒸発は表面だけで、温度に関係なく常に起こります。"},
  {id:"che322", cat:"化学", sub:"物質のすがた", q:"液体が内部からも気体に変わっていく激しい現象を何というか。", choices:["沸騰","蒸発","昇華","凝縮"], diff:"基礎", a:0, e:"【ことばの意味】「沸騰」＝液体が決まった温度（沸点）に達すると、表面だけでなく内部からも泡となって気体に変わっていく激しい現象。／【沸点】水の沸点は1気圧のもとでは100℃です。ふっとうしている間、水の温度は100℃で一定に保たれます。加熱を続けても、水がすべて水蒸気に変わるまで温度はそれ以上上がりません。／【蒸発との違い】蒸発は表面からのみ、どんな温度でも起こりますが、沸騰は液体全体から、沸点でのみ起こる現象です。"},
  {id:"che323", cat:"化学", sub:"物質のすがた", q:"ドライアイスを空気中に置いておくと、液体にならずに直接気体になる。この状態変化を何というか。", choices:["昇華","融解","蒸発","凝固"], diff:"基礎", a:0, e:"【ことばの意味】「昇華」＝固体が液体を経ずに直接気体に変わる状態変化（またはその逆）。ドライアイス（固体の二酸化炭素）は常温・常圧では液体にならず、直接気体の二酸化炭素に変わります。／【他の昇華の例】ナフタレン（防虫剤の一種）や、冬場に洗濯物が凍ったまま乾いていく現象（氷が直接水蒸気になる）も昇華の例として知られています。／【身近な目印】ドライアイスから出る白い煙のようなものは、実は冷やされた空気中の水蒸気（湯気）です。"},
  {id:"che324", cat:"化学", sub:"物質のすがた", q:"状態変化が起こっても変わらないものはどれか。", choices:["物質の質量","物質の体積","物質の状態","物質の温度"], diff:"標準", a:0, e:"【考え方】状態変化（固体・液体・気体の変化）が起きても、物質を構成する粒子の種類や数そのものは変わりません。そのため、状態変化の前後で物質の質量は変わらないという特徴があります。／【変わるもの】一方、体積は状態によって大きく変わることがあります（水が氷になると体積は増える、水が水蒸気になると体積は大きく増えるなど）。状態や、状態変化の最中の温度（融点・沸点で一定）も変化に応じて変わります。"},
  {id:"che325", cat:"化学", sub:"物質のすがた", q:"水が氷になるとき、体積はどうなるか。", choices:["体積が増える","体積が減る","体積は変わらない","体積が半分になる"], diff:"標準", a:0, e:"【考え方】水は他の多くの物質と異なり、こおって氷になると体積が増えるという特徊な性質をもっています。氷が水に浮くのは、体積が増えることで密度が水より小さくなるためです。／【身近な例】冬に水道管が凍って破裂することがあるのは、凍った水（氷）が体積を増やして管を押し広げてしまうためです。ペットボトルに水を満タンにして凍らせると、ボトルが変形することがあるのも同じ理由です。"},
  {id:"che326", cat:"化学", sub:"物質のすがた", q:"物質を加熱して気体にすると、体積は一般的にどうなるか。", choices:["液体や固体のときよりも大きく増える","液体や固体のときより小さくなる","体積はまったく変化しない","質量が0になる"], diff:"標準", a:0, e:"【考え方】液体や固体では粒子どうしが密に集まっていますが、気体になると粒子どうしの間隔が非常に広くなります。そのため、同じ物質でも気体になると、液体や固体のときに比べて体積が非常に大きく増加します。／【身近な例】少量の水を熱して水蒸気にすると、目に見えないほど体積が大きく広がります。やかんから出る白い湯気は、実は水蒸気が空気中の水滴に戻ったもので、目に見えない水蒸気自体はさらに大きな体積を占めています。"},
  {id:"che327", cat:"化学", sub:"物質のすがた", q:"混合物から、ろ紙などを使って液体に溶けていない固体を分ける方法を何というか。", choices:["ろ過","蒸留","再結晶","中和"], diff:"基礎", a:0, e:"【ことばの意味】「ろ過」＝液体にとけていない固体を、ろ紙などを使って分ける操作。／【操作の基本】ろ過を行うときは、ろうとにろ紙をセットし、液体をガラス棒を伝わらせて注ぐのが基本操作です。ろ紙の穴より小さいもの（水にとけた物質）は通り抜け、ろ紙の穴より大きい固体はろ紙の上に残ります。／【身近な例】お茶を入れるときの茶こしや、コーヒーを入れるときのフィルターも、ろ過と同じような役割をしています。"},
  {id:"che328", cat:"化学", sub:"物質のすがた", q:"食塩水を加熱して水を蒸発させ、食塩の結晶を取り出す操作を何というか。", choices:["蒸発（蒸発乾固）","ろ過","中和","電気分解"], diff:"基礎", a:0, e:"【ことばの意味】「蒸発（蒸発乾固）」＝溶液を加熱して溶媒（水など）を蒸発させ、とけていた物質を固体として取り出す操作。／【身近な例】海水を天日で乾燥させて塩を作る「塩田」も、この蒸発の原理を利用したものです。太陽の熱で水分だけが蒸発し、とけていた塩分が結晶として残ります。／【他の選択肢】ろ過はとけていない固体を分ける操作、中和は酸とアルカリを反応させる操作で、蒸発とは異なる操作です。"},
  {id:"che329", cat:"化学", sub:"物質のすがた", q:"液体を加熱して発生した気体を冷やし、再び液体として集める操作を何というか。", choices:["蒸留","ろ過","中和","電気分解"], diff:"基礎", a:0, e:"【ことばの意味】「蒸留」＝液体を加熱して発生した蒸気を冷やし、再び液体として取り出す操作。沸点の違いを利用して、混ざり合った液体を分離することができます。／【身近な利用】海水を蒸留すると、塩分をふくまない真水を得ることができます。石油の精製やアルコール飲料の製造にも、この蒸留の技術が利用されています。／【混合物の分離】沸点の異なる物質が混ざった液体では、沸点の低い成分から先に気体になって出てきます。"},
  {id:"che330", cat:"化学", sub:"気体の性質", q:"ものが燃えるのを助けるはたらき（助燃性）をもつ気体はどれか。", choices:["酸素","二酸化炭素","窒素","水素"], diff:"基礎", a:0, e:"【ことばの意味】「助燃性」＝物が燃えるのを助けるはたらき。酸素にはこの助燃性があります。／【確かめ方】酸素を集めた集気びんに、火のついた線香を入れると、線香が炎を上げて激しく燃えます。これは酸素の助燃性を確かめる代表的な実験です。／【まちがえやすい点】酸素自身が燃える（燃焼する）わけではなく、他の物質が燃えるのを助けるはたらきをする点に注意しましょう。窒素や二酸化炭素にはこの助燃性はありません。"},
  {id:"che331", cat:"化学", sub:"気体の性質", q:"空気中で体積の割合が最も多い気体はどれか。", choices:["窒素","酸素","二酸化炭素","アルゴン"], diff:"基礎", a:0, e:"【空気の組成】空気は主に窒素と酸素からできています。体積の割合では、窒素が約78%、酸素が約21%を占め、残りのわずかな部分に二酸化炭素やアルゴンなどが含まれています。／【まちがえやすい点】呼吸で意識するのは酸素ですが、空気中で最も多い気体は窒素です。窒素は化学的に安定していて反応しにくく、風船やお菓子の袋の中の充填ガスとして利用されることもあります。"},
  {id:"che332", cat:"化学", sub:"気体の性質", q:"石灰水に通すと白くにごらせる気体はどれか。", choices:["二酸化炭素","酸素","水素","窒素"], diff:"基礎", a:0, e:"【ことばの意味】「石灰水」＝水酸化カルシウムがとけた水溶液で、二酸化炭素の検出に使われる。／【なぜ白くにごる？】二酸化炭素を石灰水に通すと、水にとけにくい炭酸カルシウムという白い物質ができるため、石灰水が白くにごって見えます。／【身近な確認方法】呼吸で吐き出した息を石灰水に吹き込むと白くにごることから、呼気に二酸化炭素が含まれていることを確かめられます。ろうそくが燃えたあとの気体でも同様の反応が見られます。"},
  {id:"che333", cat:"化学", sub:"気体の性質", q:"水にとけると酸性を示す気体はどれか。", choices:["二酸化炭素","水素","窒素","ヘリウム"], diff:"標準", a:0, e:"【考え方】二酸化炭素は水に少しとけ、炭酸という弱い酸性の物質になります。そのため二酸化炭素がとけた水溶液（炭酸水）は弱い酸性を示します。／【身近な例】炭酸飲料が少し酸っぱい味に感じられるのは、とけている二酸化炭素による酸性の性質のためです。BTB溶液に二酸化炭素をふきこむと、緑色から黄色に変化することでも、酸性を示すことが確認できます。"},
  {id:"che334", cat:"化学", sub:"気体の性質", q:"マッチの火を近づけるとポンと音を立てて燃える気体はどれか。", choices:["水素","二酸化炭素","酸素","窒素"], diff:"基礎", a:0, e:"【考え方】水素は非常に燃えやすい気体で、火を近づけると空気中の酸素と激しく反応し、ポンという音とともに燃えます。この反応で水（水蒸気）が生成します。／【集め方】水素は水にとけにくく、空気より非常に軽いため、水上置換法で集めるのが適しています。／【身近な利用】水素は燃料電池自動車の燃料としても利用されており、燃焼しても二酸化炭素を出さないクリーンなエネルギー源として注目されています。"},
  {id:"che335", cat:"化学", sub:"気体の性質", q:"鼻をさすような刺激臭があり、水に非常によくとける気体はどれか。", choices:["アンモニア","酸素","窒素","水素"], diff:"基礎", a:0, e:"【ことばの意味】「アンモニア」＝鼻をさすような強い刺激臭をもつ気体で、水に非常によくとける性質があります。／【水溶液の性質】アンモニアが水にとけた水溶液（アンモニア水）はアルカリ性を示します。赤色リトマス紙を青色に変える性質があります。／【集め方】アンモニアは空気より軽く、水に非常にとけやすいため、水上置換ではなく上方置換で集める必要があります。噴水実験でも知られる、水への溶けやすさが特徴的な気体です。"},
  {id:"che336", cat:"化学", sub:"気体の性質", q:"気体を集めるとき、水に溶けにくい気体を集めるのに適した方法はどれか。", choices:["水上置換法","上方置換法","下方置換法","ろ過"], diff:"基礎", a:0, e:"【ことばの意味】「水上置換法」＝水の入った容器の中に気体を導き、水を押し出しながら気体を集める方法。／【なぜ水に溶けにくい気体に向く？】気体が水に少しでもとけやすいと、水中を通る間にとけて集めにくくなってしまいます。水にほとんどとけない酸素や水素、窒素などは、この水上置換法で純粋に集めることができます。／【利点】気体が空気とまざりにくく、比較的純粋な気体を集めやすい点も水上置換法の利点です。"},
  {id:"che337", cat:"化学", sub:"気体の性質", q:"空気より軽く、水に非常にとけやすい気体を集めるのに適した方法はどれか。", choices:["上方置換法","水上置換法","下方置換法","蒸留"], diff:"基礎", a:0, e:"【ことばの意味】「上方置換法」＝容器の口を下向きにして、気体を容器の上の方から満たしていく集め方。／【なぜこの方法？】アンモニアのように空気より軽く、水に非常にとけやすい気体は、水上置換法（水にとけてしまう）や下方置換法（軽いため上に逃げてしまう）には向きません。空気より軽い性質を利用し、容器の上部にたまるように集める上方置換法が適しています。"},
  {id:"che338", cat:"化学", sub:"気体の性質", q:"空気より重く、水に溶けやすい気体を集めるのに適した方法はどれか。", choices:["下方置換法","上方置換法","水上置換法","再結晶"], diff:"基礎", a:0, e:"【ことばの意味】「下方置換法」＝容器の口を上向きにして、気体を容器の下の方からたまるように集める方法。／【なぜこの方法？】空気より重い気体は自然に下にたまろうとする性質があります。また水に溶けやすい気体は水上置換法が使えないため、この性質を利用して容器の下から気体をためていく下方置換法が使われます。塩化水素などがこの方法で集められる気体の例です。"},
  {id:"che339", cat:"化学", sub:"酸・アルカリと中和", q:"酸性の水溶液に共通してふくまれているイオンはどれか。", choices:["水素イオン（H⁺）","水酸化物イオン（OH⁻）","ナトリウムイオン（Na⁺）","塩化物イオン（Cl⁻）"], diff:"基礎", a:0, e:"【ことばの意味】酸性の水溶液は、水にとけたときに水素イオン（H⁺）を生じる性質をもっています。この水素イオンの存在が、酸性の性質（すっぱい味、金属をとかすなど）のもとになっています。／【アルカリ性との対比】一方、アルカリ性の水溶液は水酸化物イオン（OH⁻）を生じます。酸性・アルカリ性はそれぞれ異なる種類のイオンによって特徴づけられていることを覚えておきましょう。"},
  {id:"che340", cat:"化学", sub:"酸・アルカリと中和", q:"アルカリ性の水溶液に共通してふくまれているイオンはどれか。", choices:["水酸化物イオン（OH⁻）","水素イオン（H⁺）","炭酸イオン","硫酸イオン"], diff:"基礎", a:0, e:"【ことばの意味】アルカリ性の水溶液は、水にとけたときに水酸化物イオン（OH⁻）を生じる性質をもっています。この水酸化物イオンの存在が、アルカリ性の性質（苦み、ぬるぬるした感触、赤色リトマスを青に変えるなど）のもとになっています。／【酸性との対比】酸性の水溶液は水素イオン（H⁺）を生じます。中和反応は、この水素イオンと水酸化物イオンが結びついて水ができる反応と理解すると分かりやすくなります。"},
  {id:"che341", cat:"化学", sub:"酸・アルカリと中和", q:"塩酸の水溶液の中に含まれる代表的な物質を表す化学式はどれか。", choices:["HCl","NaOH","H₂O","NaCl"], diff:"基礎", a:0, e:"【ことばの意味】「塩酸」＝塩化水素（HCl）という気体が水にとけた水溶液。強い酸性を示します。／【性質】塩酸は鉄や亜鉛などの金属をとかして水素を発生させる性質があります。胃液にも塩酸が含まれており、食べ物の消化や殺菌に役立っています。／【他の選択肢】NaOHは水酸化ナトリウム（アルカリ性）、H₂Oは水、NaClは食塩（塩化ナトリウム）の化学式で、それぞれ塩酸とは異なる物質です。"},
  {id:"che342", cat:"化学", sub:"酸・アルカリと中和", q:"水酸化ナトリウムの化学式はどれか。", choices:["NaOH","HCl","H₂SO₄","NaCl"], diff:"基礎", a:0, e:"【ことばの意味】「水酸化ナトリウム」＝白色の固体で、水にとけると強いアルカリ性を示す物質。化学式はNaOHです。／【性質】水酸化ナトリウムの水溶液は皮膚をとかすほど強いアルカリ性をもち、取りあつかいには注意が必要です。せっけんの原料などにも利用されています。／【他の選択肢】HClは塩酸（酸性）、H₂SO₄は硫酸（酸性）、NaClは食塩で、いずれも水酸化ナトリウムとは異なる物質です。"},
  {id:"che343", cat:"化学", sub:"酸・アルカリと中和", q:"BTB溶液が中性の水溶液に加えられたとき、何色になるか。", choices:["緑色","黄色","青色","無色"], diff:"基礎", a:0, e:"【ことばの意味】「BTB溶液」＝水溶液の性質（酸性・中性・アルカリ性）によって色が変わる指示薬。中性のときは緑色を示します。／【色の対応】酸性のとき黄色、中性のとき緑色、アルカリ性のとき青色に変化します。「酸っぱい黄色、あお（アルカリ）はブルー」のように色と性質を結びつけて覚える人も多いです。／【身近な利用】プールの水質検査などでも、似た原理の試薬が使われることがあります。"},
  {id:"che344", cat:"化学", sub:"酸・アルカリと中和", q:"うすい塩酸に亜鉛を入れると発生する気体はどれか。", choices:["水素","酸素","二酸化炭素","窒素"], diff:"基礎", a:0, e:"【考え方】亜鉛や鉄、マグネシウムなどの金属は、うすい塩酸に入れると反応し、金属がとけながら水素が発生します。この反応は、金属が水素よりもイオンになりやすい性質をもつために起こります。／【確かめ方】発生した気体を試験管に集め、マッチの火を近づけると、ポンと音を立てて燃えることから、その気体が水素であることを確認できます。中学理科でよく行われる実験の一つです。"},
  {id:"che345", cat:"化学", sub:"酸・アルカリと中和", q:"酸性の水溶液とアルカリ性の水溶液を混ぜ合わせたときに起こる反応を何というか。", choices:["中和","分解","電気分解","燃焼"], diff:"基礎", a:0, e:"【ことばの意味】「中和」＝酸とアルカリが反応して、たがいの性質を打ち消し合う反応。反応によって塩（えん）と水ができます。／【身近な例】酸性の胃液が多く出すぎたときに、アルカリ性の胃薬を飲んで中和させることで、胃の不快感をやわらげることができます。虫さされの薬にも、この中和の考え方が使われているものがあります。"},
  {id:"che346", cat:"化学", sub:"酸・アルカリと中和", q:"中和反応によって酸のイオンとアルカリのイオンが結びついてできる物質を何というか。", choices:["塩（えん）","気体","結晶水","分子"], diff:"基礎", a:0, e:"【ことばの意味】「塩（えん）」＝中和反応によって、酸のもつイオンとアルカリのもつイオン（水素イオンと水酸化物イオン以外の部分）が結びついてできる物質。／【代表的な塩】塩酸と水酸化ナトリウム水溶液を中和させると、塩化ナトリウム（食塩）という塩ができます。塩にはさまざまな種類があり、食塩だけを指す言葉ではないことに注意しましょう。"},
  {id:"che347", cat:"化学", sub:"化学変化と質量", q:"物質が酸素と結びつく化学変化を何というか。", choices:["酸化","還元","中和","蒸発"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつく化学変化。鉄がさびる現象や、物が燃える現象（燃焼）も酸化の一種です。／【身近な例】切ったリンゴの表面が茶色くなるのも、リンゴにふくまれる成分が空気中の酸素と結びつく酸化反応の一例です。金属が空気中でさびていくのも、ゆっくりとした酸化の現象です。"},
  {id:"che348", cat:"化学", sub:"化学変化と質量", q:"酸化物から酸素がうばわれる化学変化を何というか。", choices:["還元","酸化","中和","蒸発"], diff:"基礎", a:0, e:"【ことばの意味】「還元」＝酸化物（酸素と結びついた物質）が酸素をうばわれて、もとの物質にもどる化学変化。／【身近な例】酸化銅に炭素（木炭など）を混ぜて加熱すると、酸化銅は酸素をうばわれて銅にもどります（還元）。同時に、炭素はその酸素と結びついて二酸化炭素になります（酸化）。このように、還元と酸化は同時に起こることが多い反応です。"},
  {id:"che349", cat:"化学", sub:"化学変化と質量", q:"物質が激しく熱と光を出しながら酸素と結びつく反応を何というか。", choices:["燃焼","中和","電気分解","蒸留"], diff:"基礎", a:0, e:"【ことばの意味】「燃焼」＝物質が酸素と激しく結びつき、熱や光を出す反応。酸化反応のうち、特に激しいものを指します。／【燃焼に必要なもの】燃焼が起こるためには、①燃える物質（可燃物）②酸素③発火点以上の温度、という3つの条件がそろう必要があります。このうち1つでも欠けると燃焼は起こりません。この原理は消火の方法を考えるときにも役立ちます。"},
  {id:"che350", cat:"化学", sub:"化学変化と質量", q:"物質が燃え始める最低の温度を何というか。", choices:["発火点","融点","沸点","凝固点"], diff:"基礎", a:0, e:"【ことばの意味】「発火点」＝物質が自然に燃え始める最低の温度。物質によって発火点の値は異なります。／【消火との関係】燃焼が起きるためには、燃える物質・酸素・発火点以上の温度の3条件が必要です。水をかけて消火するのは、温度を下げて発火点より低くすることで燃焼を止めるはたらきがあるためです。／【他の選択肢】融点は固体がとける温度、沸点は液体がふっとうする温度で、それぞれ発火点とは異なる意味をもつ用語です。"},
  {id:"che351", cat:"化学", sub:"化学変化と質量", q:"化学変化の前後で、関係する物質全体の質量について正しいものはどれか。", choices:["変化の前後で質量は変わらない","化学変化が起こると質量は必ず増える","化学変化が起こると質量は必ず減る","化学変化のたびに質量は0になる"], diff:"基礎", a:0, e:"【ことばの意味】「質量保存の法則」＝化学変化の前後で、反応に関係するすべての物質の質量の合計は変わらないという法則。／【なぜ変わらない？】化学変化では原子の組み合わせ方が変わるだけで、原子そのものが増えたり消えたりすることはありません。そのため、密閉した容器の中で反応させれば、反応の前後で全体の質量は変わりません。／【見かけ上の変化】開放された容器で反応させると、発生した気体が逃げるなどして質量が変化して見えることがあります。"},
  {id:"che352", cat:"化学", sub:"化学変化と質量", q:"1種類の物質が2種類以上の物質に分かれる化学変化を何というか。", choices:["分解","化合","中和","還元"], diff:"基礎", a:0, e:"【ことばの意味】「分解」＝1種類の物質が化学変化によって2種類以上の別の物質に分かれること。／【身近な例】炭酸水素ナトリウム（重そう）を加熱すると、炭酸ナトリウム・水・二酸化炭素の3つの物質に分解されます。水を電気分解すると、水素と酸素の2つの物質に分解されます。／【化合との関係】分解の逆にあたる化学変化、つまり2種類以上の物質が結びついて1種類の物質になる変化を「化合」といいます。"},
  {id:"che353", cat:"化学", sub:"化学変化と質量", q:"2種類以上の物質が結びついて、もとの物質とは性質の異なる1種類の物質ができる化学変化を何というか。", choices:["化合","分解","蒸発","昇華"], diff:"基礎", a:0, e:"【ことばの意味】「化合」＝2種類以上の物質が結びついて、まったく新しい性質をもつ1種類の物質ができる化学変化。／【身近な例】鉄と硫黄を混ぜて加熱すると、鉄でも硫黄でもない硫化鉄という新しい物質ができます。これは鉄と硫黄が化合した例です。マグネシウムが酸素と化合すると酸化マグネシウムができるのも同様の例です。"},
  {id:"che354", cat:"化学", sub:"化学変化と質量", q:"化学変化によってできた物質は、もとの物質と比べてどうか。", choices:["性質が異なる、まったく別の物質になっている","もとの物質とまったく同じ性質をもつ","色だけが変わり、他の性質は変わらない","質量だけが変化し、他は変化しない"], diff:"基礎", a:0, e:"【ことばの意味】化学変化（化学反応）が起こると、もとの物質とは異なる、新しい性質をもつ物質が生まれます。／【身近な例】鉄はさびると、赤茶色でもろい酸化鉄という、鉄とは全く性質の異なる物質に変わります。もとの鉄がもっていた磁石にくっつく性質やかたさなどは、さびた部分では失われています。化学変化の大きな特徴は、性質がまったく異なる新しい物質が生まれる点にあります。"},
  {id:"che355", cat:"化学", sub:"化学変化と質量", q:"水を電気分解すると、陰極と陽極からそれぞれどんな気体が発生するか。", choices:["陰極から水素、陽極から酸素","陰極から酸素、陽極から水素","両極から同じ気体（水素）だけ発生する","両極から同じ気体（酸素）だけ発生する"], diff:"標準", a:0, e:"【考え方】水を電気分解すると、水（H₂O）は水素（H₂）と酸素（O₂）に分解されます。陰極（マイナス側）からは水素が、陽極（プラス側）からは酸素が発生します。／【発生量の比】発生する体積の比は、水素:酸素＝2:1になります。これは水の化学式H₂Oにふくまれる水素原子と酸素原子の数の比に対応しています。電気分解の実験では、この体積比の違いが観察のポイントになります。"},
  {id:"che356", cat:"化学", sub:"物質のすがた", q:"2種類以上の物質が混ざり合ったものを何というか。", choices:["混合物","純物質（純粋な物質）","化合物","単体"], diff:"基礎", a:0, e:"【ことばの意味】「混合物」＝2種類以上の物質が、化学変化を起こさずに混ざり合ったもの。空気や海水、食塩水などがその例です。／【純物質との違い】1種類の物質だけでできているものを純物質（純粋な物質）といいます。混合物は成分ごとに一定の融点・沸点をもたず、物理的な方法（ろ過、蒸留など）で成分を分けることができます。"},
  {id:"che357", cat:"化学", sub:"物質のすがた", q:"1種類の元素だけからできている物質を何というか。", choices:["単体","化合物","混合物","分子"], diff:"基礎", a:0, e:"【ことばの意味】「単体」＝1種類の元素だけからできている物質。酸素（O₂）、水素（H₂）、鉄（Fe）などがその例です。／【化合物との違い】2種類以上の元素からできている物質は「化合物」といいます。水（H₂O）は水素と酸素という2種類の元素からできているため化合物ですが、酸素だけ、水素だけの物質は単体になります。単体と化合物を合わせて「純物質」と呼びます。"},
  {id:"che358", cat:"化学", sub:"物質のすがた", q:"2種類以上の元素からできている物質を何というか。", choices:["化合物","単体","混合物","原子"], diff:"基礎", a:0, e:"【ことばの意味】「化合物」＝2種類以上の元素が化学的に結びついてできている物質。水（H₂O）は水素と酸素からなる化合物、二酸化炭素（CO₂）は炭素と酸素からなる化合物です。／【単体との違い】1種類の元素だけからできている物質は「単体」といいます。化合物は化学変化（分解など）によって、単体などの別の物質に分けることができます。"},
  {id:"che359", cat:"化学", sub:"物質のすがた", q:"物質を構成する最小の粒子で、それ以上分けることができないものを何というか。", choices:["原子","分子","イオン","元素"], diff:"基礎", a:0, e:"【ことばの意味】「原子」＝物質を構成する最小の粒子で、化学変化によってそれ以上分けることができないもの。／【原子の特徴】原子は種類によって大きさや質量が異なりますが、化学変化の前後で原子そのものが新しく生まれたり、消えてなくなったりすることはありません。この考え方が、質量保存の法則の理由にもなっています。／【分子との違い】いくつかの原子が結びついてできた粒子を分子といい、原子とは区別されます。"},
  {id:"che360", cat:"化学", sub:"物質のすがた", q:"いくつかの原子が結びついてできた、物質の性質を示す最小の粒子を何というか。", choices:["分子","原子","イオン","元素"], diff:"基礎", a:0, e:"【ことばの意味】「分子」＝いくつかの原子が結びついてできた粒子で、その物質のもつ性質を示す最小の単位。／【例】水分子（H₂O）は水素原子2個と酸素原子1個からできています。酸素分子（O₂）は酸素原子2個からできています。物質によっては、分子を作らずに多数の原子が規則正しく並んでできているもの（金属など）もあります。"},
  {id:"che361", cat:"化学", sub:"物質のすがた", q:"化学変化を表すときに、原子の記号や数を使って表した式を何というか。", choices:["化学反応式","分子式","構造式","イオン式"], diff:"基礎", a:0, e:"【ことばの意味】「化学反応式」＝化学変化の様子を、化学式（元素記号など）と矢印を使って表した式。／【表す内容】反応する前の物質（左辺）と、反応してできた物質（右辺）を矢印でつなぎ、原子の種類と数が両辺で等しくなるように係数を調整して書き表します。例えば水の生成は「2H₂＋O₂→2H₂O」のように表されます。化学変化の内容を簡潔に、正確に伝えるための共通の表し方です。"},
  {id:"che362", cat:"化学", sub:"物質のすがた", q:"元素を原子番号の順に並べ、性質の似た元素が同じ列に並ぶように整理した表を何というか。", choices:["周期表","元素表","分類表","反応表"], diff:"基礎", a:0, e:"【ことばの意味】「周期表」＝元素を原子番号の順に並べ、化学的な性質が似た元素が同じ列（族）にまとまるように整理した表。／【なぜ役立つ？】周期表を見ることで、似た性質をもつ元素のグループ（金属、非金属など）を一目で把握することができます。理科の教科書や資料集に必ず載っている、化学の基本となる表の一つです。"},
  {id:"che363", cat:"化学", sub:"水溶液とイオン", q:"物質が水にとけて、均一に広がっている液体を何というか。", choices:["水溶液","懸濁液","乳濁液","結晶"], diff:"基礎", a:0, e:"【ことばの意味】「水溶液」＝物質（溶質）が水（溶媒）にとけて、透明で均一に広がっている液体。食塩水や砂糖水などがその例です。／【均一であることの意味】水溶液は、どの部分をとっても濃さが同じで、時間がたってもとけた物質が下に沈んだり分離したりしません。この「均一である」という点が水溶液の大きな特徴です。／【溶質と溶媒】とけている物質を溶質、とかしている液体を溶媒といいます。"},
  {id:"che364", cat:"化学", sub:"水溶液とイオン", q:"水溶液にとけている物質のことを何というか。", choices:["溶質","溶媒","結晶","沈殿"], diff:"基礎", a:0, e:"【ことばの意味】「溶質」＝水溶液にとけている物質のこと。食塩水の場合、とけている食塩が溶質にあたります。／【対になる用語】物質をとかしている液体（食塩水の場合は水）を「溶媒」といいます。溶質と溶媒を合わせたものが「溶液」で、溶媒が水の場合は特に「水溶液」と呼ばれます。この3つの用語の関係を正しく整理しておくことが大切です。"},
  {id:"che365", cat:"化学", sub:"水溶液とイオン", q:"物質をとかしている液体のことを何というか。", choices:["溶媒","溶質","溶液","沈殿"], diff:"基礎", a:0, e:"【ことばの意味】「溶媒」＝物質をとかしている液体のこと。食塩水では、食塩をとかしている水が溶媒にあたります。／【身近な例】水以外にもエタノールなどが溶媒として使われることがあります（マニキュアの除光液など）。溶媒が水である溶液を特に「水溶液」と呼び、理科ではこの水溶液を扱う場面が多くあります。"},
  {id:"che366", cat:"化学", sub:"水溶液とイオン", q:"溶質の質量を溶液全体の質量で割り、100をかけて求める濃度を何というか。", choices:["質量パーセント濃度","体積パーセント濃度","モル濃度","飽和濃度"], diff:"基礎", a:0, e:"【ことばの意味】「質量パーセント濃度」＝溶液全体の質量に対して、とけている溶質の質量がどれくらいの割合を占めるかをパーセントで表したもの。／【計算式】質量パーセント濃度（%）＝溶質の質量÷溶液全体の質量×100で求めます。例えば水90gに食塩10gをとかすと、溶液全体は100gになり、濃度は10÷100×100＝10%となります。分母が「溶媒」ではなく「溶液全体」である点に注意しましょう。"},
  {id:"che367", cat:"化学", sub:"水溶液とイオン", q:"一定量の水にとける物質の量には限界があり、それ以上とけなくなった状態の水溶液を何というか。", choices:["飽和水溶液","希薄水溶液","中性水溶液","不飽和水溶液"], diff:"基礎", a:0, e:"【ことばの意味】「飽和水溶液」＝一定の温度で、溶質がそれ以上とけることができなくなった状態の水溶液。／【溶解度との関係】ある温度で100gの水にとける物質の最大量を「溶解度」といいます。溶解度と同じ量だけ物質がとけている状態が飽和水溶液です。これ以上物質を加えても、とけきれずに底に固体が残るようになります。"},
  {id:"che368", cat:"化学", sub:"水溶液とイオン", q:"一定の量の水にとける物質の最大の量のことを何というか。", choices:["溶解度","飽和度","濃度","純度"], diff:"基礎", a:0, e:"【ことばの意味】「溶解度」＝一定の温度で、一定量（一般に水100g）にとける物質の最大の質量。物質の種類や温度によって値が異なります。／【温度との関係】多くの固体の物質は、温度が高いほど溶解度が大きくなる（よくとけるようになる）傾向があります。この温度による溶解度の差を利用して、溶液を冷やすことで結晶を取り出す再結晶という方法が使われます。"},
  {id:"che369", cat:"化学", sub:"水溶液とイオン", q:"物質を熱水にとかし、冷やすことで再び結晶として取り出す方法を何というか。", choices:["再結晶","蒸留","ろ過","中和"], diff:"基礎", a:0, e:"【ことばの意味】「再結晶」＝物質を高温の水に多くとかし、冷やすことで溶解度の差を利用して結晶として取り出す方法。／【原理】多くの物質は温度が高いほど溶解度が大きいため、高温でたくさんとかした後に冷やすと、とけきれなくなった分が結晶として出てきます。この方法を使うと、とけている不純物を残したまま、目的の物質だけをきれいな結晶として取り出すことができます。"},
  {id:"che370", cat:"化学", sub:"水溶液とイオン", q:"水にとけて電流を通す物質を何というか。", choices:["電解質","非電解質","不純物","結晶"], diff:"基礎", a:0, e:"【ことばの意味】「電解質」＝水にとけると電流を通す性質をもつ物質。食塩（塩化ナトリウム）や塩酸などが電解質の例です。／【なぜ電流を通す？】電解質は水にとけると、陽イオンと陰イオンに分かれます（電離）。このイオンが水溶液中を移動することで、電流が流れるようになります。／【非電解質との違い】砂糖やエタノールのように、水にとけても電流を通さない物質は「非電解質」と呼ばれ、区別されます。"},
  {id:"che371", cat:"化学", sub:"水溶液とイオン", q:"水にとけても電流を通さない物質を何というか。", choices:["非電解質","電解質","導体","不導体（絶縁体）"], diff:"基礎", a:0, e:"【ことばの意味】「非電解質」＝水にとけても電流を通さない物質。砂糖（スクロース）やエタノールなどがその例です。／【なぜ電流を通さない？】非電解質は水にとけても、イオンに分かれることなく、分子のままの状態でとけています。イオンが存在しないため、電流を流すための電荷の移動が起こらず、電流を通しません。／【電解質との違い】塩化ナトリウムなどの電解質は水中でイオンに分かれる点が、非電解質との大きな違いです。"},
  {id:"che372", cat:"化学", sub:"水溶液とイオン", q:"電解質が水にとけて、陽イオンと陰イオンに分かれることを何というか。", choices:["電離","電気分解","中和","蒸発"], diff:"基礎", a:0, e:"【ことばの意味】「電離」＝電解質が水にとけたときに、自然に陽イオンと陰イオンに分かれること。／【例】塩化ナトリウム（NaCl）は水にとけると、ナトリウムイオン（Na⁺）と塩化物イオン（Cl⁻）に電離します。この電離が起こることで、水溶液中に自由に動けるイオンが生じ、電流を通すようになります。／【電気分解との違い】電離は水にとかしただけで自然に起こる現象で、外部から電気を流す電気分解とは別の現象です。"},
  {id:"che373", cat:"化学", sub:"水溶液とイオン", q:"原子が電子を失って、プラスの電気を帯びた粒子になったものを何というか。", choices:["陽イオン","陰イオン","中性子","分子"], diff:"基礎", a:0, e:"【ことばの意味】「陽イオン」＝原子が電子を失うことで、プラスの電気を帯びるようになった粒子。／【例】ナトリウム原子（Na）が電子を1個失うと、ナトリウムイオン（Na⁺）という陽イオンになります。イオンの表し方では、電気を帯びた分だけ元素記号の右上に＋やーの記号がつけられます。／【陰イオンとの違い】反対に電子を受け取ってマイナスの電気を帯びた粒子は「陰イオン」と呼ばれ、区別されます。"},
  {id:"che374", cat:"化学", sub:"水溶液とイオン", q:"原子が電子を受け取って、マイナスの電気を帯びた粒子になったものを何というか。", choices:["陰イオン","陽イオン","中性子","原子核"], diff:"基礎", a:0, e:"【ことばの意味】「陰イオン」＝原子が電子を受け取ることで、マイナスの電気を帯びるようになった粒子。／【例】塩素原子（Cl）が電子を1個受け取ると、塩化物イオン（Cl⁻）という陰イオンになります。イオンの記号では、右上に電気の種類と数を書いて表します。／【陽イオンとの違い】電子を失ってプラスの電気を帯びた粒子は「陽イオン」で、陰イオンとは逆の性質をもちます。"},
  {id:"che375", cat:"化学", sub:"酸化と還元", q:"鉄がさびて酸化鉄になる変化は、酸化と還元のどちらにあたるか。", choices:["酸化","還元","中和","分解"], diff:"基礎", a:0, e:"【考え方】鉄がさびる現象は、鉄が空気中の酸素と結びついて酸化鉄になる変化です。これは物質が酸素と結びつく変化にあたるため、「酸化」に分類されます。／【身近な酸化の例】鉄のさびの他にも、金属が空気中で変色していく現象や、ものが燃える現象（燃焼）も酸化の一種です。ゆっくり進む酸化（さび）と、激しく進む酸化（燃焼）があることを覚えておきましょう。"},
  {id:"che376", cat:"化学", sub:"酸化と還元", q:"酸化銅と炭素の粉末を混ぜて加熱すると、銅と二酸化炭素ができる。このとき炭素に起きている変化はどれか。", choices:["酸化","還元","中和","蒸発"], diff:"標準", a:0, e:"【考え方】この反応では、酸化銅が酸素をうばわれて銅になります（酸化銅が還元される）。同時に、炭素はその酸素を受け取って二酸化炭素になります。炭素が酸素と結びつくこの変化は「酸化」にあたります。／【まちがえやすい点】1つの反応の中で、ある物質は還元され、別の物質は酸化されるということが同時に起こります。反応全体を見て、それぞれの物質にどんな変化が起きているかを分けて考えることが大切です。"},
  {id:"che377", cat:"化学", sub:"身近な化学変化", q:"食品が酸化されることで、味やにおいが悪くなることを何というか。", choices:["酸化（食品の劣化）","中和","電気分解","蒸留"], diff:"基礎", a:0, e:"【考え方】油をふくむ食品などが空気中の酸素と反応する（酸化される）と、風味が落ちたり、いやなにおいが発生したりすることがあります。この現象は食品の劣化の一因として知られています。／【対策】食品を密閉して空気（酸素）にふれないようにしたり、酸化防止剤を加えたりすることで、この酸化による劣化を防ぐ工夫がされています。お菓子の袋に入っている脱酸素剤も、この対策の一つです。"},
  {id:"che378", cat:"化学", sub:"身近な化学変化", q:"鉄くぎが空気中の湿った場所に置かれると、表面に赤茶色のものができる。これは何という変化によるものか。", choices:["酸化（さび）","中和","蒸発","昇華"], diff:"基礎", a:0, e:"【考え方】鉄が空気中の酸素（と水分）と結びつくと、赤茶色のさび（酸化鉄）ができます。これは酸化という化学変化の一例です。／【条件】さびは酸素と水分の両方があるとできやすくなります。乾燥した場所ではさびにくく、湿った場所ではさびやすくなる傾向があります。この性質を利用して、金属をさびから守るために油や塗料でおおう工夫がされています。"},
  {id:"che379", cat:"化学", sub:"物質のすがた", q:"密度が水よりも小さい固体を水に入れるとどうなるか。", choices:["水に浮く","水に沈む","水と同じ高さで静止する","水にとけて消える"], diff:"基礎", a:0, e:"【ことばの意味】「密度」＝物質の単位体積あたりの質量。水の密度は約1g/cm³です。／【浮くか沈むか】物体の密度が水より小さい場合、その物体は水に浮きます。逆に密度が水より大きい場合は水に沈みます。木材（密度が水より小さい）は水に浮き、鉄（密度が水より大きい）は水に沈むのは、この密度の大小関係によるものです。"},
  {id:"che380", cat:"化学", sub:"物質のすがた", q:"物質の質量を、その物質の体積で割って求める量を何というか。", choices:["密度","濃度","質量パーセント","溶解度"], diff:"基礎", a:0, e:"【ことばの意味】「密度」＝物質の単位体積あたりの質量。密度＝質量÷体積という式で求められます。単位はg/cm³などで表されます。／【物質を見分ける手がかり】密度は物質ごとに決まった値をもつため、同じ体積の物体でも材質が違えば質量（重さ）が異なります。この性質を利用して、見た目が似ている物質でも、密度を調べることで区別できることがあります。"},
  {id:"che381", cat:"化学", sub:"物質のすがた", q:"液体の体積を正確にはかるための、目盛りのついたガラス器具を何というか。", choices:["メスシリンダー","ビーカー","試験管","フラスコ"], diff:"基礎", a:0, e:"【ことばの意味】「メスシリンダー」＝液体の体積を正確にはかるための、目盛りのついた円筒形のガラス器具。／【正しい読み方】メスシリンダーで液体の体積を読むときは、液面の中央のくぼんだ部分（メニスカス）を、目の高さを液面に合わせて水平に見て目盛りを読み取ります。／【他の器具との違い】ビーカーや試験管にも目盛りがついていることがありますが、正確さではメスシリンダーの方がすぐれており、体積を正確にはかりたいときに使われます。"},
  {id:"che382", cat:"化学", sub:"物質のすがた", q:"物質を加熱するときに使う、実験用の炎を出す器具はどれか。", choices:["ガスバーナー","メスシリンダー","上皿てんびん","顕微鏡"], diff:"基礎", a:0, e:"【ことばの意味】「ガスバーナー」＝ガスを燃料にして炎を出し、物質を加熱するための実験器具。／【正しい使い方】ガスバーナーは、元栓・コック・ガス調節ねじ・空気調節ねじの順に開き、炎の大きさや色を調整して使います。青色の安定した炎になるように空気の量を調整することが、正しく使うポイントです。理科の実験で加熱操作を行うときに欠かせない基本器具です。"},
  {id:"che383", cat:"化学", sub:"物質のすがた", q:"物質を燃やしたあとに残る、燃えずに残った灰などの部分を観察すると分かることはどれか。", choices:["物質が有機物か無機物かの手がかりになる","物質の色が必ず分かる","物質の質量が必ず増えたことが分かる","物質のにおいが変化しないことが分かる"], diff:"標準", a:0, e:"【考え方】有機物（炭素をふくむ物質）を燃やすと、炭になったり、二酸化炭素や水が発生したりします。一方、無機物（炭素をふくまない物質、金属など）を燃やしても、そのような炭化は起こりにくいという違いがあります。燃やしたときの様子（黒くこげるか、灰が残るかなど）は、その物質が有機物か無機物かを見分ける手がかりの一つになります。"},
  {id:"che384", cat:"化学", sub:"物質のすがた", q:"炭素をふくみ、燃やすと二酸化炭素を発生する物質のグループを何というか。", choices:["有機物","無機物","金属","気体"], diff:"基礎", a:0, e:"【ことばの意味】「有機物」＝炭素をふくむ物質のグループ。砂糖、デンプン、ろう、プラスチックなどが代表例です。／【燃やすとどうなる？】有機物を燃やすと、炭素が酸素と結びついて二酸化炭素が発生し、多くの場合は水も発生します。石灰水に通すと白くにごることで、二酸化炭素の発生を確認できます。／【無機物との違い】炭素をふくまない物質（金属や食塩など）は「無機物」と呼ばれ、有機物とは区別されます。"},
  {id:"che385", cat:"化学", sub:"物質のすがた", q:"有機物以外の物質のグループを何というか。", choices:["無機物","金属のみ","気体のみ","液体のみ"], diff:"基礎", a:0, e:"【ことばの意味】「無機物」＝炭素をふくまない物質のグループ（一部の例外を除く）。食塩、水、鉄、ガラスなどが代表例です。／【まちがえやすい点】無機物は「金属」だけを指す言葉ではありません。水や食塩のように金属ではない物質も無機物にふくまれます。／【有機物との違い】炭素をふくむ物質（砂糖やデンプンなど）は有機物と呼ばれ、燃やすと二酸化炭素が発生する点で無機物と区別されます。"},
  {id:"che386", cat:"化学", sub:"物質のすがた", q:"ものが燃えるために必要な条件として当てはまらないものはどれか。", choices:["低い湿度であること","燃える物質があること","酸素があること","発火点以上の温度であること"], diff:"基礎", a:0, e:"【燃焼の3条件】物が燃えるためには、①燃える物質（可燃物）があること②酸素があること③発火点以上の温度であること、の3つがすべて必要です。／【湿度について】湿度の高さそのものは、燃焼が起こるかどうかを決める直接の条件にはふくまれません（湿った木は燃えにくくなることはありますが、燃焼の3条件そのものとは異なります）。／【消火の考え方】この3条件のどれか1つでも取り除けば、火を消すことができます。"},
  {id:"che387", cat:"化学", sub:"化学変化と質量", q:"銅の粉末を空気中で加熱すると、酸化銅ができて質量が増える。この理由として正しいものはどれか。", choices:["空気中の酸素が銅と結びついたから","銅が水分を吸収したから","銅が別の元素に変わったから","加熱で銅の体積が増えたから"], diff:"標準", a:0, e:"【考え方】銅を空気中で加熱すると、銅（Cu）が空気中の酸素（O₂）と結びついて酸化銅（CuO）ができます。もとの銅の質量に、結びついた酸素の質量が加わるため、加熱後の物質の質量はもとの銅より増加します。／【質量保存の法則との関係】これは質量保存の法則に反しているのではなく、反応に関わった酸素の分だけ質量が増えたと考えれば、法則と矛盾しません。密閉容器で反応の前後（銅＋酸素の合計と酸化銅）を比べれば、質量は変わりません。"},
  {id:"che388", cat:"化学", sub:"化学変化と質量", q:"一定量の銅を加熱するとき、結びつく酸素の質量には限界がある。この理由として最も適切なものはどれか。", choices:["銅の質量に対して反応する酸素の質量の割合は一定だから","酸素はいくらでも無限に結びつくから","銅は加熱すると質量が減っていくから","酸素は加熱すると発生しなくなるから"], diff:"標準", a:0, e:"【考え方】銅と酸素は、決まった質量の比（例えば銅:酸素＝4:1）で結びつきます。これを定比例の法則といいます。銅の質量が決まれば、それと結びつく酸素の質量もおのずと決まり、それ以上の酸素とは結びつきません。／【身近な理解】銅をどれだけ長く加熱しても、結びつく酸素の量には上限があり、酸化銅としての質量もそれ以上は増えなくなります。"},
  {id:"che389", cat:"化学", sub:"物質のすがた", q:"物質が固体・液体・気体と姿を変えることを何というか。", choices:["状態変化","化学変化","中和反応","酸化反応"], diff:"基礎", a:0, e:"【ことばの意味】「状態変化」＝温度によって、物質が固体・液体・気体と姿を変える変化。物質そのものの種類は変わりません。／【化学変化との違い】状態変化では、水が氷になっても水が別の物質に変わるわけではなく、あくまで「水」のままです。一方、化学変化（燃焼や酸化など）では、まったく別の性質をもつ新しい物質が生まれます。この2つの違いを区別することが理科の基本の一つです。"},
  {id:"che390", cat:"化学", sub:"物質のすがた", q:"純粋な物質（純物質）は、状態変化のとき温度がどうなる特徴があるか。", choices:["融解や沸騰の間、温度が一定に保たれる","融解や沸騰の間も温度が上がり続ける","融解や沸騰は起こらない","温度に関係なく常に一定の状態を保つ"], diff:"標準", a:0, e:"【考え方】純粋な物質は、決まった融点・沸点をもち、状態変化が起きている間（とけている間、ふっとうしている間）は、加えた熱が状態変化のために使われるため、温度は一定に保たれます。／【混合物との違い】混合物（食塩水など）では、成分によって融点・沸点が異なるため、状態変化の間も温度が変化し続けるという違いがあります。この温度変化のグラフの形を見ることで、純物質か混合物かを判断することができます。"},
  {id:"che391", cat:"化学", sub:"気体の性質", q:"石灰石にうすい塩酸を加えると発生する気体はどれか。", choices:["二酸化炭素","水素","酸素","アンモニア"], diff:"基礎", a:0, e:"【考え方】石灰石の主成分は炭酸カルシウムです。炭酸カルシウムにうすい塩酸を加えると反応が起こり、二酸化炭素が発生します。この気体を石灰水に通すと、白くにごることで二酸化炭素であることを確認できます。／【身近な例】この反応は、鍾乳洞ができる仕組みや、貝殻に塩酸をかけたときに泡が出る現象とも関係しています。"},
  {id:"che392", cat:"化学", sub:"気体の性質", q:"過酸化水素水に二酸化マンガンを加えると発生する気体はどれか。", choices:["酸素","水素","二酸化炭素","塩素"], diff:"基礎", a:0, e:"【考え方】過酸化水素水（オキシドール）に二酸化マンガンを加えると、過酸化水素が分解されて酸素が発生します。このとき、二酸化マンガンは反応を速めるはたらき（触媒）をするだけで、それ自体は反応の前後で変化しません。／【確かめ方】発生した気体に火のついた線香を近づけると、線香が炎を上げて激しく燃えることから、酸素であることを確認できます。実験室で酸素を発生させる代表的な方法の一つです。"},
  {id:"che393", cat:"化学", sub:"気体の性質", q:"二酸化マンガンのように、反応を助けるが自身は反応の前後で変化しない物質を何というか。", choices:["触媒","溶媒","溶質","結晶"], diff:"基礎", a:0, e:"【ことばの意味】「触媒」＝化学反応の速さを変えるが、反応の前後でそれ自身は変化しない物質。／【はたらき】触媒は反応を速める（あるいは特定の条件下では遅らせる）はたらきをしますが、反応が終わった後も同じ量・同じ性質のまま残ります。そのため繰り返し使うことができます。過酸化水素水に加える二酸化マンガンはこの触媒の代表的な例です。"},
  {id:"che394", cat:"化学", sub:"水溶液とイオン", q:"塩化銅水溶液を電気分解すると、陰極に何が付着するか。", choices:["銅","塩素","水素","酸素"], diff:"標準", a:0, e:"【考え方】塩化銅水溶液（CuCl₂）を電気分解すると、陰極（マイナス側）には銅（Cu）が付着し、陽極（プラス側）からは塩素（Cl₂）が発生します。銅イオン（Cu²⁺）は陰極で電子を受け取り、銅の金属として付着します。／【確かめ方】陰極についた赤色の物質を取り出して調べると、銅特有の色や性質をもつことが確認できます。塩素が発生する陽極付近では、特有の刺激臭を感じることがあります。"},
  {id:"che395", cat:"化学", sub:"化学変化と質量", q:"化学変化の前後で、原子の組み合わせは変わるが、変わらないものはどれか。", choices:["原子の種類と数","物質の色","物質の状態（固体・液体・気体）","物質のにおい"], diff:"標準", a:0, e:"【考え方】化学変化が起きるとき、原子どうしの組み合わせ方（結びつき方）は変わりますが、反応に関わる原子の種類とその数そのものは変化しません。これが質量保存の法則が成り立つ理由です。／【変わるもの】一方、化学変化によって新しい物質ができるため、色・におい・状態などの性質は大きく変わることがあります。「原子は変わらないが、性質は変わる」という点をおさえておきましょう。"},
  {id:"che396", cat:"化学", sub:"物質のすがた", q:"ある物質の温度をだんだん高くしていくとき、固体・液体・気体の順に変化していく理由として正しいものはどれか。", choices:["粒子の運動が温度が高いほど激しくなるから","物質の質量が温度によって変わるから","物質の色が温度によって変わるから","粒子の種類が温度によって変わるから"], diff:"標準", a:0, e:"【考え方】物質を構成する粒子は、温度が高いほど激しく運動するようになります。固体では粒子はほとんど動かず規則正しく並んでいますが、温度が上がると粒子の運動が激しくなり、やがて自由に動き回れる液体、さらに粒子どうしがバラバラに飛び回る気体へと状態が変わっていきます。／【まちがえやすい点】質量や粒子の種類そのものは、状態変化によって変わることはありません。"},
  {id:"che397", cat:"化学", sub:"物質のすがた", q:"氷・水・水蒸気は、同じ水という物質のちがう状態である。これらに共通するものはどれか。", choices:["粒子（分子）の種類","粒子の運動の激しさ","体積の大きさ","物質の状態（固体か液体か気体か）"], diff:"標準", a:0, e:"【考え方】氷・水・水蒸気は、状態（固体・液体・気体）は異なりますが、どれも同じ水分子（H₂O）からできています。物質を構成する粒子の種類そのものは、状態変化によって変わることはありません。／【状態によって変わるもの】一方、粒子の運動の激しさ、粒子どうしの間隔（それによって決まる体積）、そして物質の状態そのものは、温度によって変化します。粒子の種類は変わらないが、粒子の並び方や動き方が変わる、という点が状態変化の本質です。"},
  {id:"che398", cat:"化学", sub:"化学変化と質量", q:"炭酸水素ナトリウム（重そう）を加熱すると発生する気体を石灰水に通すとどうなるか。", choices:["石灰水が白くにごる","石灰水の色が青くなる","石灰水がすぐに沸騰する","石灰水は変化しない"], diff:"基礎", a:0, e:"【考え方】炭酸水素ナトリウムを加熱すると、炭酸ナトリウム・水・二酸化炭素の3つに分解されます（熱分解）。発生した二酸化炭素を石灰水に通すと、炭酸カルシウムという白い物質ができるため、石灰水が白くにごります。／【この実験のポイント】発生した気体が二酸化炭素であることを確かめるのに、石灰水を使った反応は理科の実験でとてもよく使われる、基本的な確認方法です。"},
  {id:"che399", cat:"化学", sub:"化学変化と質量", q:"炭酸水素ナトリウムを加熱したときにできる白い固体を、水にとかしてフェノールフタレイン液を加えるとどうなるか。", choices:["赤色（赤紫色）になる","黄色になる","無色のままである","青色になる"], diff:"標準", a:0, e:"【考え方】炭酸水素ナトリウムを加熱すると、炭酸ナトリウムという白い固体ができます。炭酸ナトリウムの水溶液はアルカリ性を示すため、フェノールフタレイン液を加えると赤色（赤紫色）に変化します。／【もとの物質との比較】もとの炭酸水素ナトリウムの水溶液も弱いアルカリ性を示しますが、加熱後にできる炭酸ナトリウムの水溶液の方がより強いアルカリ性を示すという違いがあります。"},
  {id:"che400", cat:"化学", sub:"物質のすがた", q:"液体の体積をはかるとき、目の位置をどのようにして目盛りを読むのが正しいか。", choices:["液面と同じ高さに目を置いて水平に見る","液面より高い位置から見下ろす","液面より低い位置から見上げる","目盛りの位置はどこから見ても同じ"], diff:"基礎", a:0, e:"【正しい読み方】メスシリンダーなどで液体の体積をはかるときは、目の高さを液面と同じ高さにそろえ、水平な方向から目盛りを読み取ります。液面の中央がへこんでいる場合は、そのへこみの底の位置を基準にして読みます。／【なぜ大切？】目の位置が液面より高かったり低かったりすると、実際とは異なる目盛りを読んでしまう（視差という誤差が生じる）ため、正確な測定のためにはこの読み方の基本を守ることが大切です。"},
  {id:"phy445", cat:"物理", sub:"電流と回路", q:"図のように電球Aと電球Bを1本の道でつないだ回路がある。この回路の名前として正しいものはどれか。", choices:["直列回路","並列回路","開放回路","短絡回路"], diff:"基礎", a:0, e:"【図の読み取り】電池から出た導線が、電球A、電球Bの順に1本道でつながり、また電池にもどっています。このように電流の通り道が枝分かれしていない回路を直列回路といいます。／【特徴】直列回路では、電流の通り道が1本しかないため、回路のどこをはかっても電流の大きさは同じになります。", img:"<svg viewBox='0 0 260 130' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='260' height='130' fill='none'/><line x1='30' y1='30' x2='30' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='100' x2='230' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='230' y1='100' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='30' x2='95' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='165' y1='30' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><rect x='95' y='20' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='111' y1='20' x2='95' y2='40' stroke='#4A3B47' stroke-width='1.5'/><text x='103' y='55' font-size='11' text-anchor='middle' fill='#4A3B47'>電球A</text><rect x='134' y='20' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='150' y1='20' x2='134' y2='40' stroke='#4A3B47' stroke-width='1.5'/><text x='142' y='55' font-size='11' text-anchor='middle' fill='#4A3B47'>電球B</text><line x1='30' y1='60' x2='30' y2='70' stroke='#4A3B47' stroke-width='4'/><line x1='24' y1='70' x2='36' y2='70' stroke='#4A3B47' stroke-width='2'/><line x1='24' y1='55' x2='36' y2='55' stroke='#4A3B47' stroke-width='2'/><text x='45' y='68' font-size='11' fill='#4A3B47'>電池</text></svg>"},
  {id:"phy446", cat:"物理", sub:"電流と回路", q:"図の直列回路で、電球Aを外して回路を切ると、電球Bはどうなるか。", choices:["消える","そのまま光り続ける","かえって明るくなる","色が変わる"], diff:"基礎", a:0, e:"【図の読み取り】この回路は電流の通り道が1本しかない直列回路です。／【考え方】電球Aを外すと、その部分で回路が途切れてしまい、電流の通り道全体がつながらなくなります。そのため電球Bにも電流が流れなくなり、電球Bも消えてしまいます。並列回路とはこの点が大きく異なります。", img:"<svg viewBox='0 0 260 130' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='260' height='130' fill='none'/><line x1='30' y1='30' x2='30' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='100' x2='230' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='230' y1='100' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='30' x2='95' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='165' y1='30' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><rect x='95' y='20' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='111' y1='20' x2='95' y2='40' stroke='#4A3B47' stroke-width='1.5'/><text x='103' y='55' font-size='11' text-anchor='middle' fill='#4A3B47'>電球A</text><rect x='134' y='20' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='150' y1='20' x2='134' y2='40' stroke='#4A3B47' stroke-width='1.5'/><text x='142' y='55' font-size='11' text-anchor='middle' fill='#4A3B47'>電球B</text><line x1='30' y1='60' x2='30' y2='70' stroke='#4A3B47' stroke-width='4'/><line x1='24' y1='70' x2='36' y2='70' stroke='#4A3B47' stroke-width='2'/><line x1='24' y1='55' x2='36' y2='55' stroke='#4A3B47' stroke-width='2'/><text x='45' y='68' font-size='11' fill='#4A3B47'>電池</text></svg>"},
  {id:"phy447", cat:"物理", sub:"電流と回路", q:"図の直列回路に、電球をもう1個増やしてつなぐと、回路全体の電気抵抗はどうなるか。", choices:["大きくなる","小さくなる","変わらない","0になる"], diff:"標準", a:0, e:"【図の読み取り】電球（抵抗）が1本道に並んでいる直列回路です。／【考え方】直列回路では、電気抵抗はつなげた電球の数だけ足し算されていきます。電球を1個増やすと、回路全体の抵抗はその分だけ大きくなり、流れる電流は逆に小さくなって、それぞれの電球は少し暗くなります。", img:"<svg viewBox='0 0 260 130' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='260' height='130' fill='none'/><line x1='30' y1='30' x2='30' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='100' x2='230' y2='100' stroke='#4A3B47' stroke-width='2'/><line x1='230' y1='100' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='30' x2='95' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='165' y1='30' x2='230' y2='30' stroke='#4A3B47' stroke-width='2'/><rect x='95' y='20' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='111' y1='20' x2='95' y2='40' stroke='#4A3B47' stroke-width='1.5'/><text x='103' y='55' font-size='11' text-anchor='middle' fill='#4A3B47'>電球A</text><rect x='134' y='20' width='16' height='20' fill='none' stroke='#4A3B47' stroke-width='2'/><line x1='150' y1='20' x2='134' y2='40' stroke='#4A3B47' stroke-width='1.5'/><text x='142' y='55' font-size='11' text-anchor='middle' fill='#4A3B47'>電球B</text><line x1='30' y1='60' x2='30' y2='70' stroke='#4A3B47' stroke-width='4'/><line x1='24' y1='70' x2='36' y2='70' stroke='#4A3B47' stroke-width='2'/><line x1='24' y1='55' x2='36' y2='55' stroke='#4A3B47' stroke-width='2'/><text x='45' y='68' font-size='11' fill='#4A3B47'>電池</text></svg>"},
  {id:"phy448", cat:"物理", sub:"電流と回路", q:"図のように電球Aと電球Bを2つの道に分かれるようにつないだ回路がある。この回路の名前として正しいものはどれか。", choices:["並列回路","直列回路","開放回路","抵抗回路"], diff:"基礎", a:0, e:"【図の読み取り】電流の通り道が、電球Aと電球Bのところで2つに枝分かれしています。このようにとちゅうで道が枝分かれしている回路を並列回路といいます。／【特徴】並列回路では、それぞれの枝分かれした部分に電源と同じ大きさの電圧がかかるという特徴があります。", img:"<svg viewBox='0 0 260 150' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='40' x2='30' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='230' y1='40' x2='230' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='120' x2='230' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='60' x2='30' y2='50' stroke='#4A3B47' stroke-width='4'/><line x1='24' y1='60' x2='36' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='24' y1='45' x2='36' y2='45' stroke='#4A3B47' stroke-width='2'/><text x='45' y='58' font-size='11' fill='#4A3B47'>電池</text><line x1='30' y1='40' x2='230' y2='40' stroke='#4A3B47' stroke-width='2'/><line x1='100' y1='40' x2='100' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='100' y1='90' x2='100' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='160' y1='40' x2='160' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='160' y1='90' x2='160' y2='120' stroke='#4A3B47' stroke-width='2'/><rect x='92' y='60' width='16' height='30' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='100' y='108' font-size='11' text-anchor='middle' fill='#4A3B47'>電球A</text><rect x='152' y='60' width='16' height='30' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='160' y='108' font-size='11' text-anchor='middle' fill='#4A3B47'>電球B</text></svg>"},
  {id:"phy449", cat:"物理", sub:"電流と回路", q:"図の並列回路で、電球Aを外して枝の1本を切ると、電球Bはどうなるか。", choices:["そのまま光り続ける","消える","少し暗くなる","電池が壊れる"], diff:"基礎", a:0, e:"【図の読み取り】電球AとBが別々の道（枝）に分かれてつながっている並列回路です。／【考え方】並列回路では、それぞれの枝が独立した道になっているため、片方の枝（電球A側）を切っても、もう片方の枝（電球B側）には影響がなく、電球Bはそのまま光り続けます。直列回路との大きなちがいです。", img:"<svg viewBox='0 0 260 150' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='40' x2='30' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='230' y1='40' x2='230' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='120' x2='230' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='60' x2='30' y2='50' stroke='#4A3B47' stroke-width='4'/><line x1='24' y1='60' x2='36' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='24' y1='45' x2='36' y2='45' stroke='#4A3B47' stroke-width='2'/><text x='45' y='58' font-size='11' fill='#4A3B47'>電池</text><line x1='30' y1='40' x2='230' y2='40' stroke='#4A3B47' stroke-width='2'/><line x1='100' y1='40' x2='100' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='100' y1='90' x2='100' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='160' y1='40' x2='160' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='160' y1='90' x2='160' y2='120' stroke='#4A3B47' stroke-width='2'/><rect x='92' y='60' width='16' height='30' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='100' y='108' font-size='11' text-anchor='middle' fill='#4A3B47'>電球A</text><rect x='152' y='60' width='16' height='30' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='160' y='108' font-size='11' text-anchor='middle' fill='#4A3B47'>電球B</text></svg>"},
  {id:"phy450", cat:"物理", sub:"電流と回路", q:"図の並列回路で、電球Aと電球Bにかかる電圧の大きさの関係として正しいものはどれか。", choices:["どちらも電源と同じ大きさの電圧がかかる","電球Aの方が大きい電圧がかかる","電球Bの方が大きい電圧がかかる","電圧は2つに分かれて半分ずつになる"], diff:"標準", a:0, e:"【図の読み取り】電球Aと電球Bが、それぞれ独立した枝として電源につながっている並列回路です。／【考え方】並列回路の大きな特徴は、枝分かれしたそれぞれの部分に、電源と同じ大きさの電圧がかかることです。直列回路のように電圧が分割されることはありません。", img:"<svg viewBox='0 0 260 150' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='40' x2='30' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='230' y1='40' x2='230' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='120' x2='230' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='30' y1='60' x2='30' y2='50' stroke='#4A3B47' stroke-width='4'/><line x1='24' y1='60' x2='36' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='24' y1='45' x2='36' y2='45' stroke='#4A3B47' stroke-width='2'/><text x='45' y='58' font-size='11' fill='#4A3B47'>電池</text><line x1='30' y1='40' x2='230' y2='40' stroke='#4A3B47' stroke-width='2'/><line x1='100' y1='40' x2='100' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='100' y1='90' x2='100' y2='120' stroke='#4A3B47' stroke-width='2'/><line x1='160' y1='40' x2='160' y2='60' stroke='#4A3B47' stroke-width='2'/><line x1='160' y1='90' x2='160' y2='120' stroke='#4A3B47' stroke-width='2'/><rect x='92' y='60' width='16' height='30' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='100' y='108' font-size='11' text-anchor='middle' fill='#4A3B47'>電球A</text><rect x='152' y='60' width='16' height='30' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='160' y='108' font-size='11' text-anchor='middle' fill='#4A3B47'>電球B</text></svg>"},
  {id:"phy451", cat:"物理", sub:"力の働き", q:"図のてこで、力を加えている点Xを何というか。", choices:["力点","支点","作用点","中心点"], diff:"基礎", a:0, e:"【図の読み取り】図の左側で棒に力を加えている点が力点です。中央の三角形の部分（支える点）が支点、右側でおもりを持ち上げる点が作用点です。／【ことばの意味】「力点」＝力を加える点。「支点」＝てこを支える固定点。「作用点」＝実際に物を動かす点。この3つの用語をセットで覚えておきましょう。", img:"<svg viewBox='0 0 260 130' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='70' x2='240' y2='70' stroke='#4A3B47' stroke-width='4'/><polygon points='130,95 115,120 145,120' fill='#B87FD4'/><text x='130' y='115' font-size='10' text-anchor='middle' fill='#fff'>支点</text><line x1='60' y1='55' x2='60' y2='70' stroke='#E8709F' stroke-width='2'/><polygon points='60,40 54,55 66,55' fill='#E8709F'/><text x='60' y='32' font-size='11' text-anchor='middle' fill='#4A3B47'>力点</text><circle cx='190' cy='60' r='10' fill='#7FC8A9'/><line x1='190' y1='70' x2='190' y2='60' stroke='#7FC8A9' stroke-width='2'/><text x='190' y='45' font-size='11' text-anchor='middle' fill='#4A3B47'>作用点</text><text x='190' y='95' font-size='10' text-anchor='middle' fill='#4A3B47'>(おもり)</text></svg>"},
  {id:"phy452", cat:"物理", sub:"力の働き", q:"図のてこで、支点から力点までの距離を、今より長くすると、必要な力の大きさはどうなるか。", choices:["小さくなる","大きくなる","変わらない","0になる"], diff:"標準", a:0, e:"【図の読み取り】支点（三角形）から力点（矢印の位置）までの距離が、てこの「うでの長さ」にあたります。／【てこの原理】支点から力点までの距離を長くするほど、同じ重さの物を持ち上げるのに必要な力は小さくてすみます。長い棒を使うと軽い力で重いものを動かせるのはこの原理によるものです。", img:"<svg viewBox='0 0 260 130' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='70' x2='240' y2='70' stroke='#4A3B47' stroke-width='4'/><polygon points='130,95 115,120 145,120' fill='#B87FD4'/><text x='130' y='115' font-size='10' text-anchor='middle' fill='#fff'>支点</text><line x1='60' y1='55' x2='60' y2='70' stroke='#E8709F' stroke-width='2'/><polygon points='60,40 54,55 66,55' fill='#E8709F'/><text x='60' y='32' font-size='11' text-anchor='middle' fill='#4A3B47'>力点</text><circle cx='190' cy='60' r='10' fill='#7FC8A9'/><line x1='190' y1='70' x2='190' y2='60' stroke='#7FC8A9' stroke-width='2'/><text x='190' y='45' font-size='11' text-anchor='middle' fill='#4A3B47'>作用点</text><text x='190' y='95' font-size='10' text-anchor='middle' fill='#4A3B47'>(おもり)</text></svg>"},
  {id:"phy453", cat:"物理", sub:"力の働き", q:"図のてこで、力点を動かす距離を長くすると、その代わりに何が起こるか。", choices:["必要な力が小さくなる","作用点が消える","支点が動く","重さが軽くなる"], diff:"標準", a:0, e:"【図の読み取り】力点で棒を大きく動かすほど、作用点（おもり側）はより小さな力で持ち上がるようになります。／【仕事の原理】てこを使っても、「力の大きさ×動かす距離」で表される仕事の量は変わりません。力点を大きく動かす（距離を長くする）ことで、その分小さな力ですむようになるという、トレードオフの関係があります。", img:"<svg viewBox='0 0 260 130' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='70' x2='240' y2='70' stroke='#4A3B47' stroke-width='4'/><polygon points='130,95 115,120 145,120' fill='#B87FD4'/><text x='130' y='115' font-size='10' text-anchor='middle' fill='#fff'>支点</text><line x1='60' y1='55' x2='60' y2='70' stroke='#E8709F' stroke-width='2'/><polygon points='60,40 54,55 66,55' fill='#E8709F'/><text x='60' y='32' font-size='11' text-anchor='middle' fill='#4A3B47'>力点</text><circle cx='190' cy='60' r='10' fill='#7FC8A9'/><line x1='190' y1='70' x2='190' y2='60' stroke='#7FC8A9' stroke-width='2'/><text x='190' y='45' font-size='11' text-anchor='middle' fill='#4A3B47'>作用点</text><text x='190' y='95' font-size='10' text-anchor='middle' fill='#4A3B47'>(おもり)</text></svg>"},
  {id:"phy454", cat:"物理", sub:"光と音", q:"図は光が空気中から水中へ進むようすを表している。この現象を何というか。", choices:["屈折","反射","分散","直進"], diff:"基礎", a:0, e:"【図の読み取り】光が空気（上側）から水（下側）へ進むとき、境界面でカクッと折れ曲がっているのが分かります。これが屈折です。／【ことばの意味】「屈折」＝光が異なる物質の境界で、進む速さが変わることによって進路が曲がる現象。水中のストローが折れて見えるのも、この屈折によるものです。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><rect x='10' y='80' width='200' height='70' fill='#D6EAF5' opacity='0.5'/><line x1='10' y1='80' x2='210' y2='80' stroke='#4A3B47' stroke-width='1.5'/><text x='15' y='20' font-size='11' fill='#4A3B47'>空気</text><text x='15' y='150' font-size='11' fill='#4A3B47'>水</text><line x1='110' y1='80' x2='110' y2='20' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/><line x1='110' y1='80' x2='110' y2='150' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/><line x1='60' y1='20' x2='110' y2='80' stroke='#E8709F' stroke-width='2'/><line x1='110' y1='80' x2='150' y2='150' stroke='#E8709F' stroke-width='2'/><polygon points='150,150 138,140 145,132' fill='#E8709F'/></svg>"},
  {id:"phy455", cat:"物理", sub:"光と音", q:"図のように、光が空気中から水中に進むとき、屈折角と入射角の関係として正しいものはどれか。", choices:["屈折角は入射角より小さくなる","屈折角は入射角より大きくなる","屈折角と入射角は等しい","屈折は起こらない"], diff:"標準", a:0, e:"【図の読み取り】図の点線（垂直な線）を基準にして、空気中の光の角度（入射角）と、水中に入った後の光の角度（屈折角）を比べます。／【考え方】光が空気（速い）から水（遅い）へ進むとき、光は点線に近づく方向に曲がります。そのため、屈折角は入射角より小さくなります。逆に水から空気に進むときは、屈折角の方が大きくなります。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><rect x='10' y='80' width='200' height='70' fill='#D6EAF5' opacity='0.5'/><line x1='10' y1='80' x2='210' y2='80' stroke='#4A3B47' stroke-width='1.5'/><text x='15' y='20' font-size='11' fill='#4A3B47'>空気</text><text x='15' y='150' font-size='11' fill='#4A3B47'>水</text><line x1='110' y1='80' x2='110' y2='20' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/><line x1='110' y1='80' x2='110' y2='150' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/><line x1='60' y1='20' x2='110' y2='80' stroke='#E8709F' stroke-width='2'/><line x1='110' y1='80' x2='150' y2='150' stroke='#E8709F' stroke-width='2'/><polygon points='150,150 138,140 145,132' fill='#E8709F'/></svg>"},
  {id:"phy456", cat:"物理", sub:"光と音", q:"図のような光の屈折が原因で起こる身近な現象はどれか。", choices:["水中に入れたストローが折れて見える","声が山びことなって返ってくる","虫めがねで物を大きく見る","鏡に自分の姿が映る"], diff:"基礎", a:0, e:"【図の読み取り】光が空気と水の境界で折れ曲がるようすが描かれています。／【身近な例】コップの水に入れたストローが、水面のところで折れ曲がって見えるのは、ストローからの光が水中と空気中を通るときに屈折し、実際とは異なる位置から来たように見えるためです。山びこは音の反射、鏡の像は光の反射による現象です。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><rect x='10' y='80' width='200' height='70' fill='#D6EAF5' opacity='0.5'/><line x1='10' y1='80' x2='210' y2='80' stroke='#4A3B47' stroke-width='1.5'/><text x='15' y='20' font-size='11' fill='#4A3B47'>空気</text><text x='15' y='150' font-size='11' fill='#4A3B47'>水</text><line x1='110' y1='80' x2='110' y2='20' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/><line x1='110' y1='80' x2='110' y2='150' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/><line x1='60' y1='20' x2='110' y2='80' stroke='#E8709F' stroke-width='2'/><line x1='110' y1='80' x2='150' y2='150' stroke='#E8709F' stroke-width='2'/><polygon points='150,150 138,140 145,132' fill='#E8709F'/></svg>"},
  {id:"phy457", cat:"物理", sub:"光と音", q:"図で、光が鏡に当たってはね返るとき、入射角と反射角の関係として正しいものはどれか。", choices:["入射角と反射角は等しい","入射角の方が必ず大きい","反射角の方が必ず大きい","入射角と反射角は無関係である"], diff:"基礎", a:0, e:"【図の読み取り】鏡の面に垂直な点線を基準にして、入ってくる光の角度（入射角）とはね返る光の角度（反射角）が描かれています。／【反射の法則】光が鏡などの面で反射するとき、入射角と反射角はつねに等しくなります。これを反射の法則といい、鏡で自分の姿が正しく見える理由にもなっています。", img:"<svg viewBox='0 0 220 140' xmlns='http://www.w3.org/2000/svg'><line x1='10' y1='110' x2='210' y2='110' stroke='#4A3B47' stroke-width='3'/><text x='90' y='128' font-size='11' fill='#4A3B47'>鏡</text><line x1='110' y1='110' x2='110' y2='20' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/><line x1='60' y1='30' x2='110' y2='110' stroke='#E8709F' stroke-width='2'/><line x1='110' y1='110' x2='160' y2='30' stroke='#A88BD4' stroke-width='2'/><polygon points='160,30 150,42 158,46' fill='#A88BD4'/><text x='75' y='55' font-size='10' fill='#4A3B47'>入射角</text><text x='135' y='55' font-size='10' fill='#4A3B47'>反射角</text></svg>"},
  {id:"phy458", cat:"物理", sub:"光と音", q:"図のように光が鏡ではね返る現象を何というか。", choices:["光の反射","光の屈折","光の分散","光の直進"], diff:"基礎", a:0, e:"【図の読み取り】光が鏡の面に当たって、別の方向へはね返っているようすが描かれています。これを光の反射といいます。／【身近な例】鏡に自分の顔が映るのは、顔から出た光が鏡で反射して目に届くためです。水面に景色が映って見えるのも、同じ光の反射による現象です。", img:"<svg viewBox='0 0 220 140' xmlns='http://www.w3.org/2000/svg'><line x1='10' y1='110' x2='210' y2='110' stroke='#4A3B47' stroke-width='3'/><text x='90' y='128' font-size='11' fill='#4A3B47'>鏡</text><line x1='110' y1='110' x2='110' y2='20' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/><line x1='60' y1='30' x2='110' y2='110' stroke='#E8709F' stroke-width='2'/><line x1='110' y1='110' x2='160' y2='30' stroke='#A88BD4' stroke-width='2'/><polygon points='160,30 150,42 158,46' fill='#A88BD4'/><text x='75' y='55' font-size='10' fill='#4A3B47'>入射角</text><text x='135' y='55' font-size='10' fill='#4A3B47'>反射角</text></svg>"},
  {id:"phy459", cat:"物理", sub:"光と音", q:"図のように凸レンズに平行な光を当てたとき、光が1点に集まる点Fを何というか。", choices:["焦点","支点","反射点","中心点"], diff:"基礎", a:0, e:"【図の読み取り】凸レンズに入った平行な光（水色の線）が、レンズを通った後に1点に集まっています。この集まる点が焦点です。／【ことばの意味】「焦点」＝凸レンズを通った平行光線が集まる1点。レンズの中心から焦点までの距離を焦点距離といいます。虫めがねで紙を焦がす実験は、この焦点に光を集める性質を利用したものです。", img:"<svg viewBox='0 0 240 130' xmlns='http://www.w3.org/2000/svg'><ellipse cx='120' cy='65' rx='14' ry='50' fill='#D6EAF5' opacity='0.4' stroke='#4A3B47' stroke-width='1.5'/><line x1='120' y1='10' x2='120' y2='120' stroke='#999' stroke-width='1' stroke-dasharray='2,3'/><line x1='20' y1='45' x2='106' y2='45' stroke='#E8709F' stroke-width='2'/><line x1='134' y1='45' x2='190' y2='65' stroke='#E8709F' stroke-width='2'/><line x1='20' y1='85' x2='106' y2='85' stroke='#A88BD4' stroke-width='2'/><line x1='134' y1='85' x2='190' y2='65' stroke='#A88BD4' stroke-width='2'/><circle cx='190' cy='65' r='3' fill='#7FC8A9'/><text x='190' y='90' font-size='10' text-anchor='middle' fill='#4A3B47'>焦点</text></svg>"},
  {id:"phy460", cat:"物理", sub:"光と音", q:"図の凸レンズについて、レンズの中央部分の厚みとして正しいものはどれか。", choices:["周辺部より厚い","周辺部より薄い","周辺部と同じ厚さ","厚みはない"], diff:"基礎", a:0, e:"【図の読み取り】図のレンズの形を見ると、中央がふくらんだ形をしていることが分かります。／【凸レンズの特徴】凸レンズは中央部分が周辺部よりも厚くなっている形のレンズです。この形によって、レンズを通った光が屈折して1点（焦点）に集まる性質が生まれます。虫めがねに使われているのがこの凸レンズです。", img:"<svg viewBox='0 0 240 130' xmlns='http://www.w3.org/2000/svg'><ellipse cx='120' cy='65' rx='14' ry='50' fill='#D6EAF5' opacity='0.4' stroke='#4A3B47' stroke-width='1.5'/><line x1='120' y1='10' x2='120' y2='120' stroke='#999' stroke-width='1' stroke-dasharray='2,3'/><line x1='20' y1='45' x2='106' y2='45' stroke='#E8709F' stroke-width='2'/><line x1='134' y1='45' x2='190' y2='65' stroke='#E8709F' stroke-width='2'/><line x1='20' y1='85' x2='106' y2='85' stroke='#A88BD4' stroke-width='2'/><line x1='134' y1='85' x2='190' y2='65' stroke='#A88BD4' stroke-width='2'/><circle cx='190' cy='65' r='3' fill='#7FC8A9'/><text x='190' y='90' font-size='10' text-anchor='middle' fill='#4A3B47'>焦点</text></svg>"},
  {id:"phy461", cat:"物理", sub:"光と音", q:"図のように、凸レンズを使って太陽の光を集めると、焦点の位置ではどのようなことが起こりやすいか。", choices:["光が集中して熱や明るさが強くなる","光が完全に消えてしまう","光の色が変わってしまう","何も変化は起こらない"], diff:"基礎", a:0, e:"【図の読み取り】平行な光がレンズを通って1点（焦点）に集まっているようすが描かれています。／【考え方】太陽の光を凸レンズに当てると、広い範囲に広がっていた光のエネルギーが焦点の1点に集中します。そのため、焦点の位置に紙などを置くと、熱や明るさが集中して高温になり、焦げたり燃えたりすることがあります。", img:"<svg viewBox='0 0 240 130' xmlns='http://www.w3.org/2000/svg'><ellipse cx='120' cy='65' rx='14' ry='50' fill='#D6EAF5' opacity='0.4' stroke='#4A3B47' stroke-width='1.5'/><line x1='120' y1='10' x2='120' y2='120' stroke='#999' stroke-width='1' stroke-dasharray='2,3'/><line x1='20' y1='45' x2='106' y2='45' stroke='#E8709F' stroke-width='2'/><line x1='134' y1='45' x2='190' y2='65' stroke='#E8709F' stroke-width='2'/><line x1='20' y1='85' x2='106' y2='85' stroke='#A88BD4' stroke-width='2'/><line x1='134' y1='85' x2='190' y2='65' stroke='#A88BD4' stroke-width='2'/><circle cx='190' cy='65' r='3' fill='#7FC8A9'/><text x='190' y='90' font-size='10' text-anchor='middle' fill='#4A3B47'>焦点</text></svg>"},
  {id:"phy462", cat:"物理", sub:"力の働き", q:"図のように天井に固定された滑車を使っておもりを持ち上げる装置を何というか。", choices:["定滑車","動滑車","てこ","輪軸"], diff:"基礎", a:0, e:"【図の読み取り】滑車が天井に固定されていて、位置が動かないようすが描かれています。このように位置が固定された滑車を定滑車といいます。／【特徴】定滑車を使うと、力の向きを変えることはできますが、必要な力の大きさそのものは変わりません（おもりと同じ大きさの力が必要）。物を上から引っぱるかわりに下向きに引くことができ、作業がしやすくなります。", img:"<svg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'><line x1='80' y1='10' x2='80' y2='30' stroke='#4A3B47' stroke-width='2'/><circle cx='80' cy='45' r='15' fill='none' stroke='#4A3B47' stroke-width='3'/><path d='M 65 45 A 15 15 0 0 0 80 60' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='65' y1='45' x2='65' y2='120' stroke='#E8709F' stroke-width='2'/><rect x='55' y='120' width='20' height='20' fill='#7FC8A9'/><text x='65' y='150' font-size='10' text-anchor='middle' fill='#4A3B47'>おもり</text><line x1='95' y1='45' x2='120' y2='90' stroke='#A88BD4' stroke-width='2'/><text x='125' y='95' font-size='10' fill='#4A3B47'>引く力</text><text x='80' y='25' font-size='9' text-anchor='middle' fill='#4A3B47'>天井</text></svg>"},
  {id:"phy463", cat:"物理", sub:"力の働き", q:"図の定滑車を使っておもりを持ち上げるとき、引く力の大きさはどうなるか。", choices:["おもりの重さと同じ大きさの力が必要","おもりの重さの半分の力ですむ","おもりの重さの2倍の力が必要","力はまったく必要ない"], diff:"標準", a:0, e:"【図の読み取り】天井に固定された定滑車に糸をかけ、下向きに引いておもりを持ち上げるようすです。／【考え方】定滑車は力の向きを変えるだけで、力の大きさを小さくするはたらきはありません。そのため、おもりを持ち上げるには、おもりの重さと同じ大きさの力を加える必要があります。", img:"<svg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'><line x1='80' y1='10' x2='80' y2='30' stroke='#4A3B47' stroke-width='2'/><circle cx='80' cy='45' r='15' fill='none' stroke='#4A3B47' stroke-width='3'/><path d='M 65 45 A 15 15 0 0 0 80 60' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='65' y1='45' x2='65' y2='120' stroke='#E8709F' stroke-width='2'/><rect x='55' y='120' width='20' height='20' fill='#7FC8A9'/><text x='65' y='150' font-size='10' text-anchor='middle' fill='#4A3B47'>おもり</text><line x1='95' y1='45' x2='120' y2='90' stroke='#A88BD4' stroke-width='2'/><text x='125' y='95' font-size='10' fill='#4A3B47'>引く力</text><text x='80' y='25' font-size='9' text-anchor='middle' fill='#4A3B47'>天井</text></svg>"},
  {id:"phy464", cat:"物理", sub:"力の働き", q:"図の定滑車を使う利点として最も適切なものはどれか。", choices:["力の向きを変えられる","力の大きさを半分にできる","おもりの重さを軽くできる","摩擦をなくすことができる"], diff:"標準", a:0, e:"【図の読み取り】糸が滑車を通ることで、下向きに引く力が、おもりを上向きに持ち上げる力に変わっているようすが描かれています。／【定滑車の利点】定滑車は力の大きさは変えられませんが、力の向きを変えることができます。上から引き上げにくい場所でも、下向きに引くだけで物を持ち上げられるようになる点が便利です。", img:"<svg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'><line x1='80' y1='10' x2='80' y2='30' stroke='#4A3B47' stroke-width='2'/><circle cx='80' cy='45' r='15' fill='none' stroke='#4A3B47' stroke-width='3'/><path d='M 65 45 A 15 15 0 0 0 80 60' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='65' y1='45' x2='65' y2='120' stroke='#E8709F' stroke-width='2'/><rect x='55' y='120' width='20' height='20' fill='#7FC8A9'/><text x='65' y='150' font-size='10' text-anchor='middle' fill='#4A3B47'>おもり</text><line x1='95' y1='45' x2='120' y2='90' stroke='#A88BD4' stroke-width='2'/><text x='125' y='95' font-size='10' fill='#4A3B47'>引く力</text><text x='80' y='25' font-size='9' text-anchor='middle' fill='#4A3B47'>天井</text></svg>"},
  {id:"phy465", cat:"物理", sub:"力の働き", q:"図のように、おもりと一緒に動く滑車を何というか。", choices:["動滑車","定滑車","てこ","輪軸"], diff:"基礎", a:0, e:"【図の読み取り】滑車がおもりと一緒に上下に動くようすが描かれています。このようにおもりと一緒に動く滑車を動滑車といいます。／【特徴】動滑車を使うと、おもりを持ち上げるのに必要な力を小さくすることができます。ただし、その代わりに引く糸の長さは長くする必要があります。", img:"<svg viewBox='0 0 160 170' xmlns='http://www.w3.org/2000/svg'><line x1='40' y1='10' x2='40' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='120' y1='30' x2='40' y2='30' stroke='#4A3B47' stroke-width='2'/><line x1='40' y1='30' x2='40' y2='90' stroke='#E8709F' stroke-width='2'/><circle cx='75' cy='105' r='15' fill='none' stroke='#4A3B47' stroke-width='3'/><path d='M 60 105 A 15 15 0 0 1 75 90' stroke='#E8709F' stroke-width='2' fill='none'/><line x1='40' y1='90' x2='60' y2='105' stroke='#E8709F' stroke-width='2'/><line x1='90' y1='105' x2='120' y2='30' stroke='#E8709F' stroke-width='2'/><line x1='120' y1='30' x2='140' y2='60' stroke='#A88BD4' stroke-width='2'/><text x='145' y='65' font-size='10' fill='#4A3B47'>引く力</text><line x1='75' y1='120' x2='75' y2='140' stroke='#7FC8A9' stroke-width='2'/><rect x='65' y='140' width='20' height='20' fill='#7FC8A9'/><text x='75' y='168' font-size='10' text-anchor='middle' fill='#4A3B47'>おもり</text></svg>"},
