  {id:"ear291", cat:"地学", sub:"地球と宇宙", q:"流れ星（流星）が光って見えるのはなぜか。", choices:["宇宙の小さな粒が大気とこすれて高温になるから","遠くの恒星が地球に落ちてきているから","惑星が爆発して破片が飛んでいるから","月のかけらが地球に向かってくるから"], diff:"標準", a:0, e:"【流れ星の正体】宇宙空間をただよう、砂つぶくらいの小さな岩や塵（ちり）です。／【なぜ光る？】これが地球の大気に高速で飛びこむと、まわりの空気とはげしくこすれて高温になり、光を出しながら燃え尽きます。この光が流れ星として見えます。／【燃えつきる高さ】地上から80〜120kmくらいの上空です。／【燃え残ったら】まれに燃え尽きずに地面まで落ちてくることがあり、それを隕石（いんせき）といいます。／【流星群】地球が彗星の通り道を横切るときは、たくさんの流れ星が見られます。"},
  {id:"ear293", cat:"地学", sub:"天体の動き", q:"月が地球の周りを公転する向きと地球が太陽の周りを公転する向きの関係として正しいものはどれか。", choices:["月と地球は反対向きに公転している","月も地球も同じ向きに公転している","月の公転方向は不規則に変わる","月は公転せず地球の周りを静止している"], diff:"標準", a:1, e:"【ことばの意味】「自転」＝地球が1日に1回、自分で回ること／「公転」＝地球が1年かけて太陽のまわりを回ること【解説】地球・月・太陽系のほぼ全ての天体は、北極側から見て反時計回りに自転・公転している（太陽系の原始円盤の回転方向を引き継ぐ）。例外は金星（自転が逆）や一部の衛星。月の公転と地球の自転・公転がすべて同方向であることが重要。【まちがえやすい点】ほかの選択肢（月と地球は反対向きに公転している／月の公転方向は不規則に変わる）とのちがいをおさえておこう。"},
  {id:"ear294", cat:"地学", sub:"地層と岩石", q:"礫・砂・泥が混在する川の下流側に行くほど、堆積物はどのように変化する傾向があるか。", choices:["上流から下流に行くほど礫（大きな粒）が増える","上流に礫が多く、下流に行くほど細粒の砂・泥が多くなる","川のどこでも堆積物の粒径は同じ","下流では流れが速いため全て侵食される"], diff:"基礎", a:1, e:"【解説】上流：流れが速く大きな礫を運べる（急流）。下流：流れが遅くなり大きな粒子は途中で沈積し、細かい砂・泥が残って運ばれる（緩流）。河口・三角州では最も細かい泥・シルトが堆積する。この粒径変化を「堆積物の分級」という。【まちがえやすい点】ほかの選択肢（上流から下流に行くほど礫（大きな粒）が増える／川のどこでも堆積物の粒径は同じ）とのちがいをおさえておこう。"},
  {id:"ear295", cat:"地学", sub:"天気", q:"飽和水蒸気量と湿度の関係について正しいものはどれか。", choices:["気温が下がると飽和水蒸気量が増える","気温が高いほど飽和水蒸気量が大きくなり","飽和水蒸気量は気温によらず一定","相対湿度は水蒸気の絶対量を示す"], diff:"基礎", a:1, e:"飽和水蒸気量（1m³の空気に含める水蒸気の最大量）は気温が高いほど大きい。相対湿度（%）＝現在の水蒸気量÷飽和水蒸気量×100。気温が下がると飽和水蒸気量が減り、含まれていた水蒸気が過剰になって凝結（雲・霧・露の形成）する。"},
  {id:"che308", cat:"化学", sub:"酸・アルカリと中和", q:"うすい塩酸に水酸化ナトリウム水溶液を少しずつ加えていくと、BTB溶液の色はどう変化するか。", choices:["黄色→緑色→青色","青色→緑色→黄色","黄色のまま変わらない","赤色→無色"], diff:"標準", a:0, e:"【ことばの意味】「BTB溶液」＝水溶液が酸性・中性・アルカリ性のどれかを色で教えてくれる薬品。酸性で黄色、中性で緑色、アルカリ性で青色になります。／【何が起きている？】はじめは塩酸なので酸性＝黄色。水酸化ナトリウム水溶液（アルカリ性）を加えていくと、酸性の性質がだんだん打ち消されて中性（緑色）になります。さらに加えるとアルカリ性が強くなって青色になります。／【中和とは】酸とアルカリが打ち消し合って、塩と水ができる反応のことです。"},
  {id:"che309", cat:"化学", sub:"水溶液とイオン", q:"金属を薄い塩酸に入れたとき、水素が発生する金属はどれか。", choices:["マグネシウム","金","銀","銅"], diff:"基礎", a:0, e:"【何が起きる？】マグネシウム・亜鉛・鉄などを塩酸に入れると、金属がとけて水素のあわが出ます。／【なぜ？】これらの金属は水素よりも「イオンになりやすい」性質をもつため、金属が先にとけ出して、代わりに水素が気体として出てきます。／【出ない金属】銅・銀・金は水素よりイオンになりにくいので、塩酸に入れても水素は出ません（とけません）。だから銅は10円玉、金や銀は装飾品として長持ちするのです。／【水素の確かめ方】集めた気体にマッチの火を近づけると、ポンと音を立てて燃えます。"},
  {id:"che310", cat:"化学", sub:"気体の性質", q:"二酸化炭素の性質として正しいものはどれか。", choices:["石灰水に通すと白くにごる","燃えて熱と光を出す","空気より軽く、上方置換で集める","水に入れるとアルカリ性を示す"], diff:"基礎", a:0, e:"【ことばの意味】「石灰水」＝水酸化カルシウムがとけた水溶液。二酸化炭素があるかどうかを調べる薬品です。／【なぜ白くにごる？】二酸化炭素が石灰水と反応して、水にとけにくい炭酸カルシウム（白い粉）ができるためです。／【他の性質】空気より重い（だから下方置換で集める）。水に少しとけて炭酸水になり、弱い酸性を示す。自分は燃えないし、ものを燃やすはたらきもない（だから消火器に使われる）。／【まちがえやすい点】アルカリ性ではなく酸性です。"},
  {id:"che311", cat:"化学", sub:"化学変化と質量", q:"密閉した容器の中で化学変化を起こしたとき、反応の前と後で全体の質量はどうなるか。", choices:["変わらない","増える","減る","反応の種類によって増えたり減ったりする"], diff:"基礎", a:0, e:"【ことばの意味】「質量保存の法則」＝化学変化の前と後で、物質全体の質量は変わらないという法則。／【なぜ変わらない？】化学変化では原子の「組み合わせ方」が変わるだけで、原子そのものが消えたり新しく生まれたりはしません。原子の数と種類が同じなら、全体の重さも同じです。／【気をつけること】ふたを開けた容器だと、発生した気体が空気中に逃げてしまうので、見かけ上は軽くなります。だから実験では密閉容器を使って確かめます。"},
  {id:"che312", cat:"化学", sub:"物質のすがた", q:"水を加熱して沸騰させているとき、温度計の示す値はどうなるか。", choices:["100℃付近で一定","加熱し続けるかぎり上がり続ける","だんだん下がっていく","激しく上下する"], diff:"標準", a:0, e:"【何が起きている？】水は100℃でふっとうし、液体から気体（水蒸気）に変わります。／【なぜ温度が上がらない？】加えた熱が「温度を上げること」ではなく「水を水蒸気に変えること」に使われるからです。だから水が全部蒸発するまで温度は100℃のままです。／【氷のときも同じ】氷がとけている間も0℃のまま変わりません。／【混合物だと】食塩水など混じり物があると、温度が一定にならずじわじわ上がります。この性質で純粋な物質かどうかを見分けられます。"},
  {id:"phy341", cat:"物理", sub:"電流と回路", q:"電流計は回路にどのようにつなぐか。", choices:["調べたい部分に直列につなぐ","調べたい部分に並列につなぐ","電源に直接つなぐ","どこにつないでもよい"], diff:"基礎", a:0, e:"【ことばの意味】「直列」＝1本道になるようにつなぐこと。「並列」＝枝分かれするようにつなぐこと。／【なぜ直列？】電流計は「そこを流れる電流の量」を測る道具です。電流が電流計の中を通らないと測れないので、電流の通り道に割りこむように直列でつなぎます。／【電圧計は逆】電圧計は「2点間の電圧の差」を測るので、調べたい部分と並列につなぎます。／【注意】電流計を電源に直接つなぐと大きな電流が流れて壊れます。"},
  {id:"phy342", cat:"物理", sub:"磁界と電流", q:"モーターが回るのはどのようなしくみによるか。", choices:["磁界の中のコイルに電流を流すと、コイルが磁界から力を受けて動くから","コイルを動かすと電流が発生するから","電流が熱に変わるから","静電気が発生するから"], diff:"基礎", a:0, e:"【モーターのしくみ】磁石（磁界）の中にコイルを置いて電流を流すと、コイルは磁界から力を受けて動きます。この力の向きが半回転ごとに切りかわるようにくふうすることで、コイルが回転し続けます。これがモーターの原理です。／【発電機との違い】反対に、磁石の中でコイルを動かすと電流が生まれます（電磁誘導）。これは発電機のしくみです。／【覚え方】モーターは「電気→動き」、発電機は「動き→電気」と、逆向きの関係になっています。"},
  {id:"phy343", cat:"物理", sub:"光と音", q:"音の大きさは何によって決まるか。", choices:["振動のはば（振幅）の大きさ","1秒間の振動の回数","音が伝わる速さ","音が伝わる物質の種類"], diff:"基礎", a:0, e:"【ことばの意味】「振幅」＝ものがふるえるときの、ふれはばの大きさ。「振動数」＝1秒間に何回ふるえるかの数。／【音の大きさ】振幅が大きいほど大きな音になります。太鼓を強くたたくと大きな音がするのは、振幅が大きくなるからです。／【音の高さ】振動数が多いほど高い音になります。弦を短くしたり強く張ったりすると高い音が出ます。／【まちがえやすい点】「大きい音＝高い音」ではありません。大きさは振幅、高さは振動数と、別のもので決まります。"},
  {id:"phy344", cat:"物理", sub:"エネルギーの利用", q:"水力発電では、どのようにエネルギーが移り変わっているか。", choices:["高い所の水がもつ位置エネルギー→水の運動エネルギー→電気エネルギー","電気エネルギー→運動エネルギー→熱エネルギー","化学エネルギー→熱エネルギー→電気エネルギー","光エネルギー→電気エネルギーと考えられている"], diff:"標準", a:0, e:"【水力発電のしくみ】ダムで高い所にためた水は「位置エネルギー」をもっています。水を落とすとその位置エネルギーが「運動エネルギー」に変わり、勢いよく流れてタービン（水車）を回します。タービンにつながった発電機が回ることで「電気エネルギー」がつくられます。／【他の発電と比べると】火力発電は「化学エネルギー→熱→運動→電気」、太陽光発電は「光→電気」と直接変換します。／【利点】燃料がいらず、二酸化炭素をほとんど出しません。"},
  {id:"bio356", cat:"生物", sub:"生殖と遺伝", q:"生殖細胞（卵や精子）がつくられるときの細胞分裂の特徴として正しいものはどれか。", choices:["染色体の数がもとの細胞の半分になる","染色体の数がもとの細胞の2倍になる","染色体の数は変わらない","染色体がなくなる"], diff:"標準", a:0, e:"【ことばの意味】「減数分裂」＝卵や精子をつくるときに行われる、特別な細胞分裂。／【なぜ半分になる？】受精のとき卵と精子が合体します。もし両方が普通の染色体数をもっていたら、子の染色体は2倍になってしまいます。あらかじめ半分にしておくことで、受精後にちょうどもとの数に戻るのです。／【ヒトの場合】体の細胞は46本。卵と精子は23本ずつ。受精すると23＋23＝46本で元通りになります。／【体細胞分裂との違い】体をつくる細胞がふえるときは染色体の数は変わりません。"},
  {id:"bio357", cat:"生物", sub:"生物の進化", q:"生物が長い年月をかけて世代を重ねる中で、少しずつ姿や性質を変えてきたことを何というか。", choices:["進化","変態","成長","遺伝"], diff:"基礎", a:0, e:"【ことばの意味】「進化」＝長い年月（何万年〜何億年）をかけて、世代を重ねながら生物の姿や性質が変化していくこと。／【証拠になるもの】①化石…古い地層と新しい地層で出てくる生物がちがう。②体のつくりの共通点…ヒトの腕・鳥のつばさ・クジラのひれは、骨の並び方がよく似ている（共通の祖先から変化した証拠）。／【他の選択肢】変態＝おたまじゃくしがカエルになるような、一生の中での姿の変化。成長＝個体が大きくなること。遺伝＝親の特徴が子に伝わること。／【ポイント】進化は「一個体」ではなく「集団が世代を重ねる中で」起こります。"},
  {id:"bio358", cat:"生物", sub:"動物のからだ", q:"だ液をデンプンのりに加えて体温くらいに温めると、デンプンはどうなるか。", choices:["分解されて麦芽糖などに変わる","そのまま変化しない","デンプンの量が増える","タンパク質に変わる"], diff:"標準", a:0, e:"【ことばの意味】「消化酵素」＝食べ物を体に吸収できる小さな形に分解するはたらきをもつ物質。だ液には「アミラーゼ」という消化酵素が入っています。／【何が起きる？】アミラーゼがデンプンを麦芽糖（ばくがとう）という甘い糖に分解します。ごはんをよくかむと甘くなるのはこのためです。／【確かめ方】ヨウ素液（デンプンがあると青紫色）とベネジクト液（糖があると加熱で赤褐色）を使います。だ液を加えた方はヨウ素液で色が変わらず、ベネジクト液で赤褐色になります。／【温度が大事】酵素は体温くらい（約40℃）が一番よくはたらきます。"},
  {id:"bio359", cat:"生物", sub:"生物とかんきょう", q:"自然界で、生物の死がいやふんを無機物に分解するはたらきをする生物を何というか。", choices:["分解者","生産者","消費者","捕食者"], diff:"基礎", a:0, e:"【ことばの意味】「分解者」＝土の中の細菌やカビ（菌類）など、生物の死がいやふんを二酸化炭素・水・無機物に分解する生物。／【3つの役割】①生産者…光合成で自分の養分をつくる（植物）。②消費者…他の生物を食べて養分を得る（動物）。③分解者…死がいなどを分解して土にかえす（細菌・菌類）。／【なぜ大切？】分解者がいないと死がいや落ち葉が積もり続けてしまいます。分解者が無機物にもどすことで、植物がふたたびその養分を使えるようになり、物質が循環します。"},
  {id:"ear338", cat:"地学", sub:"火山と地震", q:"地震のゆれを伝える2つの波のうち、先に到着して小さなゆれを起こすのはどちらか。", choices:["P波","S波","表面波","津波"], diff:"基礎", a:0, e:"【2つの波】地震が起こると2種類の波が同時に発生します。／【P波】速い波（秒速約7km）。先に到着して、小さくカタカタというゆれ（初期微動）を起こします。／【S波】遅い波（秒速約4km）。あとから到着して、大きくユサユサというゆれ（主要動）を起こします。／【初期微動継続時間】P波が来てからS波が来るまでの時間のこと。震源から遠いほどこの時間は長くなるので、震源までの距離を計算できます。／【緊急地震速報】速いP波を先に検知して、遅いS波が来る前に知らせるしくみです。"},
  {id:"ear339", cat:"地学", sub:"天気", q:"空気にふくまれる水蒸気が水てきに変わりはじめる温度を何というか。", choices:["露点","融点","沸点","発火点"], diff:"基礎", a:0, e:"【ことばの意味】「露点（ろてん）」＝空気を冷やしていったとき、ふくみきれなくなった水蒸気が水てきに変わりはじめる温度。／【なぜ変わる？】空気がふくめる水蒸気の量には限界があり、その限界は温度が低いほど小さくなります。冷やしていくと、いずれ「もうふくめない」状態になり、あふれた分が水てきになります。／【身近な例】冷たい飲み物を入れたコップの表面に水てきがつくのは、まわりの空気が冷やされて露点以下になったから。朝つゆや霧、まどの結露も同じしくみです。／【他の選択肢】融点＝固体がとける温度。沸点＝液体がふっとうする温度。"},
  {id:"ear340", cat:"地学", sub:"天体の動き", q:"日本で、太陽が真南に来たときの高さ（南中高度）が1年で最も低くなるのはいつか。", choices:["冬至","夏至","春分","秋分"], diff:"基礎", a:0, e:"【ことばの意味】「南中高度」＝太陽が真南に来たとき、地平線から測った角度。／【なぜ季節で変わる？】地球の地軸が23.4°かたむいたまま太陽のまわりを回っているためです。北半球が太陽の方にかたむいている時期（夏至）は高く、反対にかたむいている時期（冬至）は低くなります。／【冬至の特徴】南中高度が最も低く、昼の長さも最も短い日です。だから冬は寒くなります。／【計算式】南中高度＝90°−緯度＋23.4°（夏至）／90°−緯度−23.4°（冬至）／90°−緯度（春分・秋分）。"},
  {id:"ear341", cat:"地学", sub:"地層と岩石", q:"れき・砂・どろが海に運ばれるとき、河口から最も遠くまで運ばれて積もるのはどれか。", choices:["どろ","砂","れき","3つとも同じ場所に積もる"], diff:"標準", a:0, e:"【つぶの大きさ】れき（2mm以上）＞砂（0.06〜2mm）＞どろ（0.06mm未満）の順に小さくなります。／【なぜ遠くまで運ばれる？】つぶが小さくて軽いものほど、水の流れの中でしずみにくく、遠くまで運ばれます。だから河口近くにはれき、少し沖に砂、いちばん遠い沖にどろが積もります。／【地層からわかること】地層のつぶの大きさを調べると、その地層ができたとき海が深かったか浅かったか（岸から近いか遠いか）を推測できます。／【まちがえやすい点】重いれきの方が遠くまで運ばれると思いがちですが、逆です。"},
  {id:"ear342", cat:"地学", sub:"天気", q:"寒冷前線が通過するとき、天気はどのように変化することが多いか。", choices:["短い時間に強い雨が降り、通過後は気温が下がる","長い時間おだやかな雨が降り、通過後は気温が上がる","晴れが続き、気温は変わらない","雪だけが長く降り続く"], diff:"標準", a:0, e:"【ことばの意味】「寒冷前線」＝冷たい空気が暖かい空気の下にもぐりこみながら進む前線。／【なぜ強い雨？】冷たい空気が暖かい空気を急激に押し上げるため、たてに大きく発達した雲（積乱雲）ができます。積乱雲はせまい範囲に短時間で激しい雨を降らせます。かみなりをともなうこともあります。／【通過後】冷たい空気におおわれるので気温が下がり、風向きも北寄りに変わります。／【温暖前線と比べると】温暖前線は暖かい空気がゆるやかにはい上がるので、横に広がる雲（乱層雲）ができ、広い範囲に弱い雨が長く降ります。"}
];

const ELEM_QUESTIONS = [
  {id:"ephy1", cat:"物理", sub:"てこ", q:"てこを使うとき、支点から力点までのきょりを長くすると、ものを持ち上げるのに必要な力はどうなるか。", choices:["大きくなる","小さくなる","変わらない","0になる"], diff:"標準", a:1, e:"【解説】支点から力点までのきょりを長くするほど、同じ物を持ち上げるのに必要な力は小さくなる。【まちがえやすい点】ほかの選択肢（大きくなる／変わらない）とのちがいをおさえておこう。"},
  {id:"ephy3", cat:"物理", sub:"ふりこ", q:"ふりこが1往復する時間を主に変えるものは何か。", choices:["おもりの重さ","ふれはば","糸の長さ","糸の色"], diff:"基礎", a:2, e:"【ことばの意味】「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）【解説】ふりこの1往復にかかる時間(周期)は糸の長さによって変わり、おもりの重さやふれはばにはほとんど関係しない。【まちがえやすい点】ほかの選択肢（おもりの重さ／ふれはば）とのちがいをおさえておこう。"},
  {id:"ephy5", cat:"物理", sub:"電気のはたらき", q:"同じ電池と豆電球を2個直列につなぐと、1個のときと比べて豆電球の明るさはどうなるか。", choices:["明るくなる","暗くなる","変わらない","消える"], diff:"基礎", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「抵抗」＝電流の流れにくさ（単位Ω）【解説】豆電球を直列に増やすと回路全体の抵抗が増えて流れる電流が小さくなるため、1個あたりの明るさは暗くなる。【まちがえやすい点】ほかの選択肢（明るくなる／変わらない）とのちがいをおさえておこう。"},
  {id:"ephy7", cat:"物理", sub:"空気と力", q:"空気でっぽうで玉が飛び出すのは、空気のどのような性質を利用しているか。", choices:["空気は圧縮すると体積が減り","空気は重いという性質","空気は色がないという性質","空気は温度で色が変わる性質"], diff:"基礎", a:0, e:"【解説】閉じ込めた空気を圧縮すると体積が小さくなり、元に戻ろうとする力で玉を押し出す。【まちがえやすい点】ほかの選択肢（空気は重いという性質／空気は色がないという性質）とのちがいをおさえておこう。"},
  {id:"ephy9", cat:"物理", sub:"ものの重さ", q:"物の重さを正しくはかる器具はどれか。", choices:["上皿てんびん","虫めがね","けんび鏡","方位磁針"], diff:"基礎", a:0, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）【解説】上皿てんびんは、分銅と比べることで物の質量(重さ)を正確にはかる器具である。【まちがえやすい点】ほかの選択肢（虫めがね／けんび鏡）とのちがいをおさえておこう。"},
  {id:"ephy11", cat:"物理", sub:"光と音", q:"大きい音と小さい音のちがいに関係するものは何か。", choices:["音の高さ","音の大きさ(振動の振れ幅)","音の速さ","音色（ねいろ）"], diff:"基礎", a:1, e:"【解説】音の大小は、ものがふるえる振れ幅(振動の大きさ)に関係している。【まちがえやすい点】ほかの選択肢（音の高さ／音の速さ）とのちがいをおさえておこう。"},
  {id:"ephy13", cat:"物理", sub:"光の性質", q:"虫めがねで太陽の光を集めると、集まった部分の温度はどうなるか。", choices:["高くなる","低くなる","変わらない","0度になる"], diff:"基礎", a:0, e:"【解説】虫めがね(凸レンズ)は光を一点に集めることができ、集まった部分の温度が高くなる。【まちがえやすい点】ほかの選択肢（低くなる／変わらない）とのちがいをおさえておこう。"},
  {id:"ephy15", cat:"物理", sub:"磁石の性質", q:"磁石につく金属として正しいものはどれか。", choices:["鉄","アルミニウム","銅","金"], diff:"基礎", a:0, e:"【解説】鉄は磁石につく代表的な金属だが、アルミニウムや銅、金は磁石にはつかない。【まちがえやすい点】ほかの選択肢（アルミニウム／銅）とのちがいをおさえておこう。"},
  {id:"ephy17", cat:"物理", sub:"ものの性質", q:"温度によって体積が変わる性質を利用した道具はどれか。", choices:["温度計","方位磁針","虫めがね","けんび鏡"], diff:"基礎", a:0, e:"【解説】液体温度計は、温度によって中の液体の体積が変わる性質を利用して温度をはかる道具である。【まちがえやすい点】ほかの選択肢（方位磁針／虫めがね）とのちがいをおさえておこう。"},

  {id:"eche1", cat:"化学", sub:"ものの溶け方", q:"食塩水から食塩の結晶だけを取り出すのに適した方法はどれか。", choices:["ろ過","蒸発","磁石で集める","水でうすめる"], diff:"基礎", a:1, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】食塩は水に溶けているのでろ過では取り出せず、水を蒸発させることで食塩の結晶を取り出せる。【まちがえやすい点】ほかの選択肢（ろ過／磁石で集める）とのちがいをおさえておこう。"},
  {id:"eche3", cat:"化学", sub:"燃焼", q:"ろうそくが燃え続けるために必要な気体は何か。", choices:["二酸化炭素","酸素","窒素","水素"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】ものが燃えるには酸素が必要であり、酸素が使われて二酸化炭素と水ができる。【まちがえやすい点】ほかの選択肢（二酸化炭素／窒素）とのちがいをおさえておこう。"},
  {id:"eche5", cat:"化学", sub:"水溶液の性質", q:"青色リトマス紙を赤色に変える水溶液はどのような性質を持つか。", choices:["酸性","中性","アルカリ性","どれでもない"], diff:"基礎", a:0, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「アルカリ性」＝pHが7より大きい性質。赤リトマスを青にする【解説】酸性の水溶液は青色リトマス紙を赤色に変え、アルカリ性の水溶液は赤色リトマス紙を青色に変える。【まちがえやすい点】ほかの選択肢（中性／アルカリ性）とのちがいをおさえておこう。"},
  {id:"eche7", cat:"化学", sub:"気体の性質", q:"水に溶けにくい気体を集めるのに適した方法はどれか。", choices:["水上置換法","上方置換法","下方置換法","ろ過"], diff:"基礎", a:0, e:"【解説】水に溶けにくい気体は、水と置き換えて集める水上置換法で集めることができる。【まちがえやすい点】ほかの選択肢（上方置換法／下方置換法）とのちがいをおさえておこう。"},
  {id:"eche9", cat:"化学", sub:"空気の性質", q:"空気は主に何と何からできているか(体積の割合が多い順)。", choices:["ちっ素と酸素","酸素とちっ素","二酸化炭素と酸素","酸素と水素"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】空気の体積の約78%がちっ素、約21%が酸素で、残りに二酸化炭素などが含まれる。【まちがえやすい点】ほかの選択肢（酸素とちっ素／二酸化炭素と酸素）とのちがいをおさえておこう。"},
  {id:"eche11", cat:"化学", sub:"物質の状態", q:"氷・水・水蒸気は、同じ物質のどのようなちがいか。", choices:["状態のちがい","種類のちがう物質","温度によって別の物質に変わる","重さがちがう別の物質"], diff:"基礎", a:0, e:"【解説】氷・水・水蒸気は同じ水という物質が、温度によって固体・液体・気体と状態を変えたものである。【まちがえやすい点】ほかの選択肢（種類のちがう物質／温度によって別の物質に変わる）とのちがいをおさえておこう。"},
  {id:"eche13", cat:"化学", sub:"ものの溶け方", q:"水よう液のこさは、場所によってちがうか。", choices:["どこも同じこさである","上の方がこい","下の方がこい","時間がたつと変わる"], diff:"基礎", a:0, e:"【解説】水よう液は溶けた物質が液全体に均一に広がるため、こさはどこも同じになる。【まちがえやすい点】ほかの選択肢（上の方がこい／下の方がこい）とのちがいをおさえておこう。"},
  {id:"eche15", cat:"化学", sub:"気体の性質", q:"二酸化炭素を石灰水に通すとどうなるか。", choices:["白く濁る","青色になる","赤色になる","透明のままである"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】二酸化炭素を石灰水に通すと、水に溶けにくい炭酸カルシウムができて白く濁る。【まちがえやすい点】ほかの選択肢（青色になる／赤色になる）とのちがいをおさえておこう。"},
  {id:"eche17", cat:"化学", sub:"水溶液の性質", q:"強い酸性やアルカリ性の水よう液を扱うときに正しい行動はどれか。", choices:["保護めがねをつけ、直接手でふれない","においを確かめるため直接深く吸いこむ","皮ふについても問題ない","口に入れて味を確認する"], diff:"基礎", a:0, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「アルカリ性」＝pHが7より大きい性質。赤リトマスを青にする【解説】強い酸性やアルカリ性の水よう液は皮ふや目を傷めるおそれがあるため、安全めがねを着用し直接ふれないようにする。【まちがえやすい点】ほかの選択肢（においを確かめるため直接深く吸いこむ／皮ふについても問題ない）とのちがいをおさえておこう。"},

  {id:"ebio1", cat:"生物", sub:"植物の発芽と成長", q:"種子が発芽するために必要な条件として正しい組み合わせはどれか。", choices:["水・空気・適当な温度","水・肥料・光","空気・肥料・適当な温度","光・水・肥料"], diff:"基礎", a:0, e:"【解説】種子の発芽には水、空気、適当な温度の3つの条件がそろうことが必要である。【まちがえやすい点】ほかの選択肢（水・肥料・光／空気・肥料・適当な温度）とのちがいをおさえておこう。"},
  {id:"ebio3", cat:"生物", sub:"人の体のつくり", q:"食べ物が通る順番として正しいものはどれか。", choices:["口→胃→食道→小腸","口→食道→胃→小腸","口→小腸→胃→食道","口→胃→小腸→食道"], diff:"基礎", a:1, e:"【解説】食べ物は口から食道を通って胃に入り、その後小腸、大腸へと送られて消化・吸収される。【まちがえやすい点】ほかの選択肢（口→胃→食道→小腸／口→小腸→胃→食道）とのちがいをおさえておこう。"},
  {id:"ebio5", cat:"生物", sub:"季節と生物", q:"気温が下がる冬になると、ツバメなどの渡り鳥がとる行動として正しいものはどれか。", choices:["冬眠する","暖かい地域へ移動する","卵の姿で冬を越す","落ち葉の下にかくれる"], diff:"基礎", a:1, e:"【解説】ツバメなどの渡り鳥は、冬になるとえさが豊富な暖かい地域へ移動する習性がある。【まちがえやすい点】ほかの選択肢（冬眠する／卵の姿で冬を越す）とのちがいをおさえておこう。"},
  {id:"ebio7", cat:"生物", sub:"動物のからだ", q:"メダカのおすとめすを見分けるときに主に注目するひれはどれか。", choices:["背びれと尻びれ","胸びれ","腹びれ","尾びれだけ"], diff:"基礎", a:0, e:"【解説】メダカはおすとめすで背びれの切れこみや尻びれの形がちがい、これらを見て見分けることができる。【まちがえやすい点】ほかの選択肢（胸びれ／腹びれ）とのちがいをおさえておこう。"},
  {id:"ebio9", cat:"生物", sub:"植物のつくり", q:"植物の茎の中を通って、根から吸い上げた水が運ばれる管を何というか。", choices:["道管","師管","気孔","葉脈"], diff:"基礎", a:0, e:"【ことばの意味】「道管」＝根から吸った水を運ぶ管／「師管」＝葉でつくった養分を運ぶ管【解説】道管は根から吸収した水や養分を茎や葉に運ぶ管で、師管は葉でつくられた栄養分を運ぶ。【まちがえやすい点】ほかの選択肢（師管／気孔）とのちがいをおさえておこう。"},
  {id:"ebio11", cat:"生物", sub:"こん虫の育ち方", q:"こん虫が卵→幼虫→さなぎ→せい虫と育つ育ち方を何というか。", choices:["完全変態","不完全変態","変態しない","幼形成熟"], diff:"基礎", a:0, e:"【解説】チョウやカブトムシのように、卵→幼虫→さなぎ→せい虫と育つ育ち方を完全変態という。【まちがえやすい点】ほかの選択肢（不完全変態／変態しない）とのちがいをおさえておこう。"},
  {id:"ebio13", cat:"生物", sub:"動物のからだ", q:"メダカのめすが産んだ卵は、うまれてからどこにくっついていることが多いか。", choices:["水草","石の下","砂の中","水面に浮く泡"], diff:"基礎", a:0, e:"【解説】メダカのめすが産んだ卵は、水草にくっついていることが多く、そこで成長していく。【まちがえやすい点】ほかの選択肢（石の下／砂の中）とのちがいをおさえておこう。"},
  {id:"ebio15", cat:"生物", sub:"花のつくり", q:"花がさいたあと受粉すると、めしべのもとの部分(子房)は何になるか。", choices:["果実","根","茎","葉"], diff:"基礎", a:0, e:"【ことばの意味】「受粉」＝花粉がめしべの先（柱頭）につくこと／「胚珠」＝受精後に種子になる部分【解説】受粉が行われると、めしべのもとにある子房が成長して果実になり、中の胚珠は種子になる。【まちがえやすい点】ほかの選択肢（根／茎）とのちがいをおさえておこう。"},
  {id:"ebio17", cat:"生物", sub:"昆虫のからだ", q:"モンシロチョウの幼虫が主に食べる植物はどれか。", choices:["キャベツなどのアブラナ科の植物","イネ","サクラ","どんぐりのなる木"], diff:"基礎", a:0, e:"【ことばの意味】「幼虫」＝卵からかえったばかりの、成虫になる前のすがた。モンシロチョウの幼虫は「アオムシ」とよばれます。／【なぜキャベツ？】モンシロチョウのメスは、幼虫のえさになるアブラナ科の植物（キャベツ・アブラナ・ダイコンなど）を選んでたまごを産みます。幼虫はその葉を食べて育ちます。／【他の選択肢】イネはイナゴなど、サクラはケムシの一種など、それぞれ食べる虫が決まっています。／【豆知識】このように「決まった植物しか食べない」性質を食草（しょくそう）といいます。"},

  {id:"eear1", cat:"地学", sub:"流れる水のはたらき", q:"川の流れが速い上流でよく見られる、川底や川岸をけずるはたらきを何というか。", choices:["侵食","運搬","堆積","風化"], diff:"基礎", a:0, e:"【解説】流れが速い上流では、水が川底や川岸をけずる侵食のはたらきが大きくなる。【まちがえやすい点】ほかの選択肢（運搬／堆積）とのちがいをおさえておこう。"},
  {id:"eear3", cat:"地学", sub:"太陽の動きと影", q:"晴れた日の正午ごろ、太陽が最も高くなるとき、地面にできる影の長さはどうなるか。", choices:["最も長くなる","最も短くなる","変わらない","影ができない"], diff:"標準", a:1, e:"【解説】太陽の高度が最も高くなる正午ごろ、影の長さは1日の中で最も短くなる。【まちがえやすい点】ほかの選択肢（最も長くなる／変わらない）とのちがいをおさえておこう。"},
  {id:"eear5", cat:"地学", sub:"天気の変化", q:"空全体を10としたとき、雲の量が0~8のとき、天気は何とするか(小学校の学習範囲)。", choices:["晴れ","くもり","雨","台風"], diff:"標準", a:0, e:"【解説】空全体を10としたとき雲の量が0~8のときを「晴れ」、9~10のときを「くもり」とする。【まちがえやすい点】ほかの選択肢（くもり／雨）とのちがいをおさえておこう。"},
  {id:"eear7", cat:"地学", sub:"星と星座", q:"夏の大三角をつくる星の組み合わせとして正しいものはどれか。", choices:["べガ・デネブ・アルタイル","シリウス・ベテルギウス・プロキオン","北極星・北斗七星・カシオペヤ","火星・木星・土星"], diff:"基礎", a:0, e:"【解説】夏の夜空に見られること座のべガ、はくちょう座のデネブ、わし座のアルタイルを結んだ三角形を夏の大三角という。【まちがえやすい点】ほかの選択肢（シリウス・ベテルギウス・プロキオン／北極星・北斗七星・カシオペヤ）とのちがいをおさえておこう。"},
  {id:"eear9", cat:"地学", sub:"大地のつくり", q:"火山灰などが降り積もってできた堆積岩を何というか。", choices:["凝灰岩","石灰岩","れき岩","泥岩"], diff:"基礎", a:0, e:"【ことばの意味】「堆積岩」＝土砂や生物の死がいが積もって固まった岩石【解説】火山から噴出した火山灰などが堆積して固まった岩石を凝灰岩という。【まちがえやすい点】ほかの選択肢（石灰岩／れき岩）とのちがいをおさえておこう。"},
  {id:"eear11", cat:"地学", sub:"太陽の動きと影", q:"太陽は東・南・西のうち、どの方角で最も高くなるか。", choices:["南","東","西","北"], diff:"基礎", a:0, e:"【解説】太陽は東からのぼり、正午ごろ真南で最も高くなり、西にしずむ。【まちがえやすい点】ほかの選択肢（東／西）とのちがいをおさえておこう。"},
  {id:"eear13", cat:"地学", sub:"水のすがた", q:"雨がふったあと、地面にできた水たまりの水はどうなっていくか。", choices:["蒸発して水蒸気になる","そのまま増え続ける","氷になる","色が変わる"], diff:"基礎", a:0, e:"【解説】水たまりの水は、太陽の熱などによって蒸発し、目に見えない水蒸気となって空気中に出ていく。【まちがえやすい点】ほかの選択肢（そのまま増え続ける／氷になる）とのちがいをおさえておこう。"},
  {id:"eear15", cat:"地学", sub:"地球と宇宙", q:"夜空の星をよく見ると、星ごとにどんなちがいがあるか。", choices:["明るさにも色にもちがいがある","明るさだけがちがい、色はすべて同じ","色だけがちがい、明るさはすべて同じ","明るさも色もほぼ同じ"], diff:"基礎", a:0, e:"【観察してみると】夜空の星をよく見ると、とても明るい星と暗い星があります。さらに、よく見ると青白い星・黄色っぽい星・赤っぽい星があることに気づきます。／【明るさのちがい】星の明るさは1等星・2等星…と分けられます。数字が小さいほど明るい星です。明るさは「星そのものの明るさ」と「地球からの距離」で決まります。／【色のちがい】星の色は表面の温度で決まります。温度が高いと青白く、低いと赤っぽく見えます。／【身近な例】オリオン座のベテルギウスは赤っぽく、リゲルは青白く見えます。"},
  {id:"eear17", cat:"地学", sub:"地震", q:"大きな地震が起きたときに気をつけるべきこととして正しいものはどれか。", choices:["まず自分の身の安全を守る","急いで海に近づく","エレベーターに乗って避難する","窓の近くでじっとする"], diff:"基礎", a:0, e:"【解説】地震が起きたときは、机の下にかくれるなどしてまず自分の身の安全を守ることが大切である。【まちがえやすい点】ほかの選択肢（急いで海に近づく／エレベーターに乗って避難する）とのちがいをおさえておこう。"}
];

  {id:"triv3", q:"ハチミツが腐りにくい主な理由は何か。", choices:["水分が少なく糖分が多いため","強い酸で殺菌されているため","常に発酵し続けているため","空気に触れないため"], a:0, e:"ハチミツは水分が少なく糖度がとても高いため、微生物が繁殖しにくく腐りにくい。"},

  {id:"triv17", q:"重そう(重曹)とお酢を混ぜると発生する気体は何か。", choices:["酸素","水素","二酸化炭素","アンモニア"], a:2, e:"重そう(炭酸水素ナトリウム)と酢に含まれる酸が反応すると、二酸化炭素の泡が発生する。"},

  {id:"triv21", q:"人間の胃の中は、実はどのくらいの強さの酸でできているか。", choices:["レモン汁くらいの弱い酸","トイレ用洗剤にも匹敵するほどの強い酸","水とほぼ同じ中性","アルカリ性"], a:1, e:"胃液にふくまれる塩酸は非常に強い酸性で、金属さえも溶かすほどの強さをもつとされる。"},
  {id:"triv23", q:"打ち上げ花火の色は、主に何によって変わるか。", choices:["火薬を燃やす速さ","混ぜる金属の種類","打ち上げる高さ","風の強さ"], a:1, e:"花火の色は、火薬にまぜる金属の種類によって炎の色が変わる炎色反応を利用してつくり分けられている。"},
  {id:"triv25", q:"人間のからだの中で、最も速く再生する部分の一つはどこか。", choices:["腸の内側の粘膜","脳の神経細胞","目の水晶体","かかとの骨"], a:0, e:"腸の内側をおおう粘膜の細胞は数日程度で入れかわるといわれ、体内でも特に新陳代謝が速い部分の一つである。"},
  {id:"triv27", q:"シロクマの毛の色は白く見えるが、実際の毛そのものの色は何色か。", choices:["白色","透明(色がない)","黒色","青色"], a:1, e:"シロクマの毛は実は透明で、光の反射のしかたによって白く見えている。皮ふの色は黒色である。"},
  {id:"triv29", q:"チーターが全力疾走できる時間はどのくらいか。", choices:["数秒〜30秒ほどの短い時間","数分間ずっと全力で走れる","1時間以上休まず走れる","一日中同じ速さで走れる"], a:0, e:"チーターは瞬間的にとても速く走れるが、体温が急激に上がるため全力疾走できるのは数十秒程度と短い。"},
  {id:"triv31", q:"ミツバチが「8の字ダンス」をする主な理由は何か。", choices:["仲間にえさの場所を伝えるため","敵をおどすため","巣の温度を下げるため","求愛のため"], a:0, e:"ミツバチは8の字を描くようなダンスの動きによって、えさ場までの方向やおよその距離を仲間に伝えていると考えられている。"},
  {id:"triv33", q:"人間の体内時計に最も強く影響をあたえるとされているものは何か。", choices:["音","太陽の光","気圧","味覚"], a:1, e:"太陽の光を浴びることは、体内時計をリセットして睡眠や覚醒のリズムを整えるのに強く影響すると考えられている。"},

/* ---------------- units (a question can belong to more than one unit) ---------------- */
function unitsOf(q){
  const base = q.sub.replace(/\(計算\)\s*$/, "").trim();
  const units = [base];
  if(q.sub.includes("(計算)")) units.push("計算問題");
  return units;
}
function unitsInCategory(cat, lvl){
  const counts = {};
  QUESTIONS.filter(q => q.cat === cat && (lvl === "all" || q.lvl === lvl)).forEach(q=>{
    unitsOf(q).forEach(u => { counts[u] = (counts[u]||0) + 1; });
  });
  return counts;
}
function unitAccuracy(cat, unit){
  let asked=0, correct=0;
  QUESTIONS.filter(q => q.cat === cat && unitsOf(q).includes(unit)).forEach(q=>{
    const st = data.qstats[q.id];
    if(st){ asked += st.asked; correct += st.correct; }
  });
  return asked > 0 ? Math.round(correct/asked*100) : null;
}

];
function titleForLevel(level){
  const found = LEVEL_TITLES.find(t => level >= t.min && level <= t.max);
  return found ? found.title : "理科見習い";
}
function levelInfo(xp){
  xp = xp || 0;
  let level = 1;
  let remaining = xp;
  let need = 60;
  while(remaining >= need){
    remaining -= need;
    level++;
    need = 60 + (level-1) * 25;
  }
  return { level, xpIntoLevel: remaining, xpForNext: need, xpTotal: xp, title: titleForLevel(level) };
}
function addXp(amount){

function checkNewBadges(){
  const st = overallStats();

  BADGES.forEach(b=>{

  return fresh;

/* ---------------- persistent data (window.storage → localStorage → memory) ---------------- */
const DEFAULT_META = {bestStreak:0, currentStreak:0, xp:0, badges:[], playDates:[], chuni:false};
let data = { history: [], qstats: {}, bookmarks: [], meta: Object.assign({}, DEFAULT_META) };
let storageMode = "checking"; // "claude" | "local" | "memory"

function hasClaudeStorage(){
  return typeof window.storage !== "undefined" && window.storage
    && typeof window.storage.get === "function"
    && typeof window.storage.set === "function";
}
function hasLocalStorage(){
  try{
    const k = "__test_ls__";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    return true;
  }catch(e){
    return false;
  }
}
async function loadData(){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        data = Object.assign({history:[],qstats:{},bookmarks:[]}, parsed, {meta: Object.assign({}, DEFAULT_META, parsed.meta)});
      }
      storageMode = "claude";
      return;
    }catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){
    try{
      const raw = localStorage.getItem(LOCAL_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        data = Object.assign({history:[],qstats:{},bookmarks:[]}, parsed, {meta: Object.assign({}, DEFAULT_META, parsed.meta)});
      }
      storageMode = "local";
      return;
    }catch(e){ /* fall through */ }
  }
  storageMode = "memory";
}
async function saveData(){
  if(storageMode === "claude"){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
      return;
    }catch(e){
      console.error("Claude storageへの保存に失敗しました。localStorageに切り替えます。", e);
      storageMode = hasLocalStorage() ? "local" : "memory";
    }
  }
  if(storageMode === "local"){
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
      return;
    }catch(e){
      console.error("localStorageへの保存に失敗しました。", e);
      storageMode = "memory";
    }
  }
}
function qstat(id){
  if(!data.qstats[id]) data.qstats[id] = {asked:0, correct:0, wrong:0};
  return data.qstats[id];
}

/* ---------------- helpers ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmtDate(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function pickIds(pool, n){
  return shuffle(pool).slice(0, Math.min(n, pool.length));
}
function levelPool(){
  let pool = QUESTIONS;
  if(levelFilter !== "all") pool = pool.filter(q => q.lvl === levelFilter);
  if(diffFilter !== "all") pool = pool.filter(q => (q.diff || "基礎") === diffFilter);
  return pool.map(q=>q.id);
}

}
function prepareCurrentQuestion(s){
  const id = s.queue[s.pos];
  const item = QMAP[id];
  const order = shuffle(item.choices.map((_,i)=>i));
  s.currentOrder = order;
  s.currentCorrectPos = order.indexOf(item.a);
}

  if(ids.length === 0) return;

  view = "quiz";
  render();
}

const app = document.getElementById('app');

function render(){
  try{
    if(view === "home") return renderHome();

    if(view === "chooseCategoryUnit") return renderChooseCategoryUnit();
    if(view === "chooseUnit") return renderChooseUnit();
    if(view === "quiz") return renderQuiz();
    if(view === "trivia") return renderTrivia();
    if(view === "clear") return renderClear();

    if(view === "listCategories") return renderListCategories();

    view = "home";

  }catch(err){
    console.error("render()でエラーが発生しました:", err);
    renderCrashRecovery(err);
  }

// 画面の描画中に予期せぬエラーが起きたときのための、絶対に壊れない復旧画面。
// innerHTMLの文字列生成に一切頼らず、DOM APIで直接ボタンを作るため、
// テンプレート文字列の破損やデータ異常の影響を受けない。
function renderCrashRecovery(err){
  try{
    app.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.style.padding = "40px 20px";
    wrap.style.textAlign = "center";

    const title = document.createElement("div");
    title.textContent = "画面の表示中に問題が起きました";
    title.style.fontWeight = "700";
    title.style.fontSize = "1.05rem";
    title.style.marginBottom = "10px";
    wrap.appendChild(title);

    const desc = document.createElement("div");
    desc.textContent = "下のボタンからホームに戻ってやり直せます。学習の記録は保存されています。";
    desc.style.fontSize = ".85rem";
    desc.style.opacity = "0.8";
    desc.style.marginBottom = "20px";
    wrap.appendChild(desc);

    const btn = document.createElement("button");
    btn.textContent = "ホームに戻る";
    btn.style.padding = "12px 28px";
    btn.style.borderRadius = "12px";
    btn.style.border = "none";
    btn.style.background = "linear-gradient(135deg,#E8709F,#D45C8C)";
    btn.style.color = "#fff";
    btn.style.fontWeight = "700";
    btn.style.fontSize = "1rem";
    btn.style.cursor = "pointer";
    // addEventListenerで直接バインドするため、innerHTML経由のonclick文字列が
    // 何らかの理由で壊れていても、このボタンだけは必ず機能する。
    btn.addEventListener("click", function(){
      try{
        view = "home"; session = null; triviaState = null; pendingView = null;
        render();
      }catch(e2){
        // 万一render()自体が壊れていても、最低限リロードで復旧できるようにする
        location.reload();
      }
    });
    wrap.appendChild(btn);
    app.appendChild(wrap);
  }catch(fatalErr){
    // ここまで来たら本当に致命的。リロードを促す。
    app.innerHTML = '<div style="padding:40px;text-align:center">問題が発生しました。画面を再読み込みしてください。</div>';
  }
}

function goHome(){
  try{
    if((view === "quiz" || view === "trivia") && session){
      // 重要：window.confirm()はサンドボックス化された表示環境（iframeなど）では
      // 正しく動作せず、常にキャンセル扱いになってしまうことがある。
      // そのためネイティブダイアログには一切頼らず、自前のDOM製モーダルで確認する。
      showConfirmModal(
        "クイズを中断してホームに戻りますか？\n（このセットの記録は保存されません）",
        function(){ forceGoHome(); }
      );
      return;
    }

// window.confirm()の代わりに使う、自前のDOM製確認モーダル。
// ネイティブダイアログに依存しないため、どんな表示環境でも確実に動作する。
let __confirmModalEl = null;
function showConfirmModal(message, onConfirm){
  closeConfirmModal(); // 二重表示防止

  const overlay = document.createElement("div");
  overlay.className = "confirm-modal-overlay";

  const box = document.createElement("div");
  box.className = "confirm-modal-box";

  const msg = document.createElement("div");
  msg.className = "confirm-modal-msg";
  msg.textContent = message;
  box.appendChild(msg);

  const row = document.createElement("div");
  row.className = "confirm-modal-row";

  const cancelBtn = document.createElement("button");
  cancelBtn.className = "confirm-modal-btn cancel";
  cancelBtn.textContent = "続ける";
  cancelBtn.addEventListener("click", closeConfirmModal);

  const okBtn = document.createElement("button");
  okBtn.className = "confirm-modal-btn ok";
  okBtn.textContent = "ホームに戻る";
  okBtn.addEventListener("click", function(){
    closeConfirmModal();
    try{ onConfirm(); }catch(e){ console.error(e); forceGoHome(); }
  });

  row.appendChild(cancelBtn);
  row.appendChild(okBtn);
  box.appendChild(row);
  overlay.appendChild(box);

  // オーバーレイの背景をタップしたら「続ける」扱いで閉じる
  overlay.addEventListener("click", function(ev){
    if(ev.target === overlay) closeConfirmModal();
  });

  document.body.appendChild(overlay);
  __confirmModalEl = overlay;
}
function closeConfirmModal(){
  if(__confirmModalEl){
    __confirmModalEl.remove();
    __confirmModalEl = null;
  }
}

// すでにホーム画面に追加されて「アプリのように」起動しているかどうかを判定する。

// すでにアプリ化されているので、案内バナーは出さない。
function isRunningStandalone(){
  try{
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if(window.navigator && window.navigator.standalone) return true;
  }catch(e){ /* 判定できない場合は非スタンドアロン扱い */ }
  return false;
}

function cheerWrong(){
  const msgs = ['🌱 惜しい！解説を読んで覚えよう','📖 まちがえた問題こそチャンス','💡 大丈夫、次はできるよ','🍀 ここを覚えれば一歩前進','🌷 焦らなくて大丈夫、確認しよう'];
  return msgs[Math.floor(Math.random()*msgs.length)];
}
function renderQuiz(){
  const s = session;
  const id = s.queue[s.pos];
  const item = QMAP[id];
  const meta = CAT_META[item.cat];
  const isBookmarked = data.bookmarks.includes(id);

  const tube = s.setIds.map(qid=>{
    let cls = 'seg';
    const st = s.statusMap[qid];
    if(st === 'correct_first') cls += ' correct';
    else if(st === 'mastered_retry') cls += ' retry';
    else if(st === 'needs_retry') cls += ' wrong';
    if(qid === id) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  const choicesHtml = s.currentOrder.map((origIdx, dispIdx)=>{
    let cls = 'choice';
    let disabled = '';
    if(s.answered){
      disabled = 'disabled';
      if(dispIdx === s.currentCorrectPos) cls += ' correct';
      else if(dispIdx === s.selectedChoice) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" ${disabled} onclick="handleChoice(${dispIdx})">
      <span class="num">${dispIdx+1}</span><span>${item.choices[origIdx]}</span>
    </button>`;
  }).join('');

  let feedback = '';
  if(s.answered){
    const correct = s.selectedChoice === s.currentCorrectPos;
    let btnLabel;
    if(s.pos+1 < s.queue.length) btnLabel = '次の問題へ →';
    else if(s.nextQueue.length > 0) btnLabel = `もう一度チャレンジ（${s.nextQueue.length}問）→`;
    else btnLabel = '結果を見る →';

    feedback = `
      <div class="feedback">
        <div class="result ${correct ? 'ok':'ng'}">${correct ? cheerCorrect() : cheerWrong()}</div>
        <div class="explain">${item.e}</div>
        ${(!correct) ? '<div class="retry-note">💪 この問題はあとでもう一度出題されるよ。今のうちに解説をじっくり読んでおこう！</div>' : ''}
      </div>
      <button class="btn solid" onclick="nextQuestion()">${btnLabel}</button>
    `;
  }

  app.innerHTML = `
    ${headerHtml(`${s.mode} ・ ラウンド${s.round}`)}
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn ghost small" onclick="goHome()">← ホームに戻る</button>
    </div>
    <div class="tube">${tube}</div>
    <div class="card">
      <div class="qhead">
        <div>
          <span class="badge ${meta.cls}">${item.cat} ・ ${item.sub}</span>
          <span class="badge lvl">${item.lvl}</span>
          <span class="diff-badge ${item.diff || '基礎'}">${item.diff || '基礎'}</span>
          ${s.round > 1 ? '<span class="badge round">やり直し</span>' : ''}
        </div>
        <button class="star-btn ${isBookmarked ? 'on':''}" onclick="toggleBookmark('${id}')">★</button>
      </div>
      <p class="question">${item.q}</p>
      ${item.img ? `<div class="q-diagram">${item.img}</div>` : ''}
      <div class="choices">${choicesHtml}</div>
      ${feedback}
    </div>
  `;
}

function toggleBookmark(id){
  const i = data.bookmarks.indexOf(id);
  if(i >= 0) data.bookmarks.splice(i,1);
  else data.bookmarks.push(id);
  saveData();
  render();
}

function handleChoice(dispIdx){
  const s = session;
  if(s.answered) return;
  s.answered = true;
  s.selectedChoice = dispIdx;
  const id = s.queue[s.pos];
  const item = QMAP[id];
  const isCorrect = dispIdx === s.currentCorrectPos;
  const firstAttempt = !s.attempts[id];
  s.attempts[id] = (s.attempts[id]||0) + 1;
  s.totalAnswered++;

  if(isCorrect){
    s.statusMap[id] = firstAttempt ? 'correct_first' : 'mastered_retry';
  }else{
    s.statusMap[id] = 'needs_retry';
    s.nextQueue.push(id);
    s.mistakesTotal++;
  }

  const st = qstat(id);
  st.asked++;
  if(isCorrect) st.correct++; else st.wrong++;

  recordPlayDate();
  const levelBefore = levelInfo(data.meta.xp || 0).level;
  let earnedXp = 0;
  let streakJustHit = 0;

  if(firstAttempt){
    if(isCorrect){
      data.meta.currentStreak++;
      if(data.meta.currentStreak > data.meta.bestStreak) data.meta.bestStreak = data.meta.currentStreak;
      earnedXp = 10;
      addXp(earnedXp);
      if(STREAK_MILESTONES.includes(data.meta.currentStreak)){
        streakJustHit = data.meta.currentStreak;
        const bonus = streakBonusXp(streakJustHit);
        addXp(bonus);
        earnedXp += bonus;
      }
    }else{
      data.meta.currentStreak = 0;
      earnedXp = 1;
      addXp(earnedXp);
    }
  }else if(isCorrect){
    earnedXp = 4;
    addXp(earnedXp);
  }

  const levelAfter = levelInfo(data.meta.xp || 0).level;
  const newBadges = checkNewBadges();
  saveData();

  // 正解・不正解の効果音と画面演出。レベルが上がるほど派手になる。
  const lvl = levelAfter;
  try{
    if(isCorrect){
      playCorrectSound(lvl);
      playCorrectVisual(lvl);
      if(earnedXp > 0) showFloatingXp(earnedXp);
    }else{
      playWrongSound(lvl);
      playWrongVisual(lvl);
    }
    if(streakJustHit > 0){
      showStreakBonus(streakJustHit, streakBonusXp(streakJustHit));
    }
    if(levelAfter > levelBefore){
      celebrateLevelUp(levelAfter, titleForLevel(levelAfter));
    }
    newBadges.forEach(b => celebrateBadge(b));
  }catch(fxErr){
    console.error("演出でエラーが発生しました（学習は継続できます）:", fxErr);
  }

  render();
}

function nextQuestion(){
  const s = session;
  s.answered = false;
  s.selectedChoice = null;

  if(s.pos + 1 < s.queue.length){
    s.pos++;
    prepareCurrentQuestion(s);
    view = "quiz";
  }else if(s.nextQueue.length > 0){
    s.round++;
    s.queue = shuffle(s.nextQueue);
    s.nextQueue = [];
    s.pos = 0;
    prepareCurrentQuestion(s);
    view = "quiz";
  }else{
    finishSessionCore();
    view = "clear";
  }

  maybeInsertTrivia();
  render();
}

function maybeInsertTrivia(){
  const s = session;
  if(!s) return;
  if(s.totalAnswered > 0 && s.totalAnswered % TRIVIA_EVERY === 0 && s.lastTriviaAt !== s.totalAnswered){
    s.lastTriviaAt = s.totalAnswered;
    const t = pickTrivia(s.lastTriviaId);
    s.lastTriviaId = t.id;
    const order = shuffle(t.choices.map((_,i)=>i));
    triviaState = { q: t, answered:false, selected:null, order, correctPos: order.indexOf(t.a) };
    pendingView = view;
    view = "trivia";
  }
}

function finishSessionCore(){
  const s = session;
  const firstTryCorrect = s.setIds.filter(id => s.statusMap[id] === 'correct_first').length;

  const catBreak = {};
  s.setIds.forEach(id=>{
    const c = QMAP[id].cat;
    if(!catBreak[c]) catBreak[c] = {total:0, correct:0};
    catBreak[c].total++;
    if(s.statusMap[id] === 'correct_first') catBreak[c].correct++;
  });

  const beforeInfo = levelInfo(s.xpStart || 0);
  const afterInfo = levelInfo(data.meta.xp || 0);

  data.history.unshift({
    date: new Date().toISOString(), mode: s.mode, total: s.setIds.length,
    firstTryCorrect, rounds: s.round, mistakes: s.mistakesTotal, catBreak,
    xpGained: (data.meta.xp || 0) - (s.xpStart || 0),
    leveledUp: afterInfo.level > beforeInfo.level,
    newLevel: afterInfo.level, newTitle: afterInfo.title
  });
  if(data.history.length > 50) data.history.length = 50;

  saveData();
}

function renderHistory(){
  const s = overallStats();

  const bars = CATS.map(c=>{
    const ids = QUESTIONS.filter(q=>q.cat===c).map(q=>q.id);
    let asked=0, correct=0;
    ids.forEach(id=>{ const st = data.qstats[id]; if(st){asked+=st.asked; correct+=st.correct;} });
    const pct = asked>0 ? Math.round(correct/asked*100) : null;
    return `
      <div class="barrow">
        <div class="label">${c}</div>
        <div class="track"><div class="fill" style="width:${pct||0}%; background:${CAT_META[c].color};"></div></div>
        <div class="pct">${pct===null?'—':pct+'%'}</div>
      </div>
    `;
  }).join('');

  const withData = CATS.filter(c=>{
    const ids = QUESTIONS.filter(q=>q.cat===c).map(q=>q.id);
    return ids.some(id => data.qstats[id] && data.qstats[id].asked > 0);
  });
  let minPct = 101;
  const pctOf = {};
  withData.forEach(c=>{
    const ids = QUESTIONS.filter(q=>q.cat===c).map(q=>q.id);
    let asked=0, correct=0;
    ids.forEach(id=>{ const st = data.qstats[id]; if(st){asked+=st.asked; correct+=st.correct;} });
    pctOf[c] = asked>0 ? correct/asked*100 : 0;
    if(pctOf[c] < minPct) minPct = pctOf[c];
  });
  const weakCats = withData.filter(c => pctOf[c] === minPct && minPct < 100);

  let adviceBody;
  if(withData.length === 0){
    adviceBody = `<p>まだ十分なデータがありません。まずは学習セットに挑戦してみましょう。</p>`;
  }else if(weakCats.length === 0){
    adviceBody = `<p>すべての分野でバランス良く得点できています。応用問題やグラフ・実験考察問題にも挑戦してみましょう。</p>`;
  }else{
    adviceBody = weakCats.map(c => `<p><strong>${c}分野</strong>：${ADVICE[c]}</p>`).join('');
  }

  const historyRows = data.history.length === 0
    ? `<div class="empty-note">まだ学習記録がありません。ホームからセットに挑戦してみましょう。</div>`
    : data.history.slice(0,15).map(h=>{
        const pct = Math.round(h.firstTryCorrect / h.total * 100);
        return `
          <div class="history-row">
            <div class="hr-top">
              <div class="hr-date">${fmtDate(h.date)}</div>
              <div class="hr-score">${h.firstTryCorrect}/${h.total}（${pct}%）</div>
            </div>
            <div class="hr-mode">${h.mode} ・ ラウンド${h.rounds} ・ 間違い${h.mistakes}回</div>
          </div>
        `;
      }).join('');

  // unit-level aggregation across all categories, for a finer-grained weak-spot view
  const unitAgg = {}; // key: "cat|unit" -> {cat, unit, asked, correct}
  QUESTIONS.forEach(q=>{
    const st = data.qstats[q.id];
    if(!st || st.asked === 0) return;
    unitsOf(q).forEach(u=>{
      const key = q.cat + "|" + u;
      if(!unitAgg[key]) unitAgg[key] = {cat:q.cat, unit:u, asked:0, correct:0};
      unitAgg[key].asked += st.asked;
      unitAgg[key].correct += st.correct;
    });
  });
  const unitList = Object.values(unitAgg)
    .filter(u => u.asked >= 3) // ignore units with too little data to be meaningful
    .map(u => Object.assign({}, u, {pct: Math.round(u.correct/u.asked*100)}))
    .sort((a,b) => a.pct - b.pct)
    .slice(0, 5);
  const unitRows = unitList.length === 0
    ? `<div class="empty-note">単元別の弱点分析には、もう少しデータが必要です。</div>`
    : unitList.map(u => `
        <div class="barrow">
          <div class="label" style="font-size:.8rem;">${u.unit}</div>
          <div class="track"><div class="fill" style="width:${u.pct}%; background:${CAT_META[u.cat].color};"></div></div>
          <div class="pct">${u.pct}%</div>
        </div>
      `).join('');

  app.innerHTML = `
    ${headerHtml()}
    ${storageBanner()}
    ${levelCardHtml()}
    <div class="stat-strip">
      <div class="stat-box"><div class="num">${s.sessions}</div><div class="lab">学習セット数</div></div>
      <div class="stat-box"><div class="num">${s.asked}</div><div class="lab">通算解答数</div></div>
      <div class="stat-box"><div class="num">${s.acc===null?'—':s.acc+'%'}</div><div class="lab">通算正答率</div></div>
      <div class="stat-box"><div class="num">${data.meta.bestStreak}</div><div class="lab">最高連続記録</div></div>
    </div>

    <div class="section-title">分野別 通算正答率</div>
    <div class="card">${bars}
      <div class="advice">
        <h3>苦手分野アドバイス</h3>
        ${adviceBody}
      </div>
    </div>

    <div class="section-title">単元別に見た苦手ベスト5</div>
    <div class="card">${unitRows}</div>

    <div class="section-title">学習履歴（新しい順）</div>
    ${historyRows}

    <div class="btn-row" style="margin-top:18px;">
      <button class="btn ghost" style="flex:1" onclick="goHome()">← ホームに戻る</button>
      <button class="btn danger" style="flex:1" onclick="confirmReset()">履歴をリセット</button>
    </div>

/* ==================== 効果音・画面演出（レベルに応じて派手になる） ====================
   ・音声ファイルは使わずWeb Audio APIでその場で音を合成するため、読み込み待ちがなく
     ネットワーク不要で動作する。
   ・演出はレベル帯を3段階（Lv1-4 / 5-9 / 10以上）に分け、上がるほど音の重なりや
     画面エフェクトの要素数・派手さが増える。
*/
let __audioCtx = null;
function getAudioCtx(){
  if(!__audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    __audioCtx = new AC();
  }
  if(__audioCtx.state === "suspended"){ __audioCtx.resume(); }
  return __audioCtx;
}

// 1音を鳴らす基本関数。freq:周波数, start:開始時刻(秒), dur:長さ(秒)
function playTone(ctx, freq, start, dur, opts){
  opts = opts || {};
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = opts.type || "sine";
  osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
  if(opts.slideTo){
    osc.frequency.exponentialRampToValueAtTime(opts.slideTo, ctx.currentTime + start + dur);
  }
  const vol = opts.volume != null ? opts.volume : 0.18;
  gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
  gain.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + start + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + dur + 0.05);
}

function fxTier(level){
  if(level >= 10) return 3;
  if(level >= 5) return 2;
  return 1;
}

// ---- 正解音：レベルが上がるほど和音が豪華になる ----
function playCorrectSound(level){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const tier = fxTier(level);
  if(tier === 1){
    // シンプルな2音の「ピンポン」
    playTone(ctx, 880, 0,    0.14, {type:"sine", volume:0.16});
    playTone(ctx, 1318.5, 0.09, 0.16, {type:"sine", volume:0.14});
  }else if(tier === 2){
    // 明るい3和音のアルペジオ
    playTone(ctx, 659.25, 0,    0.13, {type:"triangle", volume:0.15});
    playTone(ctx, 830.61, 0.07, 0.13, {type:"triangle", volume:0.15});
    playTone(ctx, 987.77, 0.14, 0.18, {type:"triangle", volume:0.16});
    playTone(ctx, 1318.5, 0.21, 0.22, {type:"sine", volume:0.12});
  }else{
    // ファンファーレ風の重ねた和音＋キラキラ
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach((f,i)=> playTone(ctx, f, i*0.06, 0.24, {type:"triangle", volume:0.14}));
    for(let i=0;i<6;i++){
      playTone(ctx, 1500 + Math.random()*1500, 0.3 + i*0.05, 0.12, {type:"sine", volume:0.06});
    }
  }
}

// ---- 不正解音：レベルが上がっても不快になりすぎないよう抑えめに、質感だけ変える ----
function playWrongSound(level){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const tier = fxTier(level);
  if(tier === 1){
    playTone(ctx, 220, 0, 0.22, {type:"sine", volume:0.13, slideTo:160});
  }else if(tier === 2){
    playTone(ctx, 246.94, 0,    0.18, {type:"triangle", volume:0.12, slideTo:180});
    playTone(ctx, 196.00, 0.10, 0.20, {type:"triangle", volume:0.10, slideTo:150});
  }else{
    playTone(ctx, 293.66, 0,    0.16, {type:"sawtooth", volume:0.08, slideTo:220});
    playTone(ctx, 246.94, 0.08, 0.16, {type:"sawtooth", volume:0.08, slideTo:180});
    playTone(ctx, 196.00, 0.16, 0.22, {type:"sine", volume:0.10, slideTo:140});
  }
}

// ---- 正解時の画面演出：レベルが上がるほど紙吹雪の数・種類が増える ----
function playCorrectVisual(level){
  const tier = fxTier(level);
  flashScreen("rgba(111,207,151,0.16)");
  const counts = {1:10, 2:22, 3:40};
  const emojis = {
    1: ["✨"],
    2: ["✨","🌸","💮"],
    3: ["✨","🌸","💮","🎀","⭐","💖"],
  };
  spawnConfetti(counts[tier], emojis[tier]);
  if(tier >= 3) shakeScreen(2, 120);
}

// ---- 不正解時の画面演出：軽いシェイクのみ。レベルが上がっても威圧的にしない ----
function playWrongVisual(level){
  const tier = fxTier(level);
  flashScreen("rgba(240,132,122,0.14)");
  shakeScreen(tier === 1 ? 3 : tier === 2 ? 5 : 6, 260);
}

// 画面全体を一瞬色フラッシュさせる
function flashScreen(color){
  const el = document.createElement("div");
  el.className = "fx-flash";
  el.style.background = color;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity = "0"; });
  setTimeout(()=> el.remove(), 400);
}

// 画面を軽く揺らす
function shakeScreen(intensity, duration){
  const el = document.getElementById("app");
  if(!el) return;
  el.classList.remove("fx-shake");
  el.style.setProperty("--fx-shake-power", intensity + "px");
  void el.offsetWidth; // reflow to restart animation
  el.classList.add("fx-shake");
  setTimeout(()=> el.classList.remove("fx-shake"), duration);
}

// 紙吹雪／絵文字パーティクルを画面上部からふらせる
function spawnConfetti(count, emojiList){
  const layer = document.createElement("div");
  layer.className = "fx-confetti-layer";
  document.body.appendChild(layer);
  for(let i=0;i<count;i++){
    const piece = document.createElement("div");
    piece.className = "fx-confetti-piece";
    piece.textContent = emojiList[Math.floor(Math.random()*emojiList.length)];
    const startX = Math.random()*100;
    const drift = (Math.random()-0.5)*140;
    const delay = Math.random()*0.25;
    const dur = 0.9 + Math.random()*0.7;
    const size = 14 + Math.random()*14;
    const rotate = (Math.random()-0.5)*720;
    piece.style.left = startX + "vw";
    piece.style.fontSize = size + "px";
    piece.style.animationDuration = dur + "s";
    piece.style.animationDelay = delay + "s";
    piece.style.setProperty("--fx-drift", drift + "px");
    piece.style.setProperty("--fx-rotate", rotate + "deg");
    layer.appendChild(piece);
  }
  setTimeout(()=> layer.remove(), 2200);
}

/* ---------------- boot ---------------- */

// アプリ内のどこで予期しないエラーが起きても、ユーザーが必ずホームに戻れるようにする
// グローバルなセーフティネット。render()やイベントハンドラの外で起きたエラーも拾う。
window.addEventListener("error", function(ev){
  console.error("グローバルエラーを検知:", ev.error || ev.message);
  try{ renderCrashRecovery(ev.error); }catch(e){ /* 何もできない場合は無視 */ }
});
window.addEventListener("unhandledrejection", function(ev){
  console.error("未処理のPromiseエラーを検知:", ev.reason);
  try{ renderCrashRecovery(ev.reason); }catch(e){ /* 何もできない場合は無視 */ }
});

// 常時表示の非常用「ホームに戻る」ボタン。
// innerHTMLの再描画とは完全に独立したDOM要素として一度だけ生成し、
// 通常時は透明・無反応で見えないが、tapするとどんな状態からでもホームに戻れる。
// 通常のヘッダーのホームボタンが機能している限りは表に出てこない。
function installEmergencyHomeButton(){
  const btn = document.createElement("button");
  btn.textContent = "⌂";
  btn.setAttribute("aria-label", "緊急ホームボタン");
  btn.style.position = "fixed";
  btn.style.top = "10px";
  btn.style.right = "10px";
  btn.style.width = "36px";
  btn.style.height = "36px";
  btn.style.borderRadius = "50%";
  btn.style.border = "1px solid rgba(232,112,159,0.35)";
  btn.style.background = "rgba(255,255,255,0.85)";
  btn.style.color = "#E8709F";
  btn.style.fontSize = "16px";
  btn.style.cursor = "pointer";
  btn.style.zIndex = "999999";
  btn.style.boxShadow = "0 2px 8px rgba(214,164,190,0.3)";
  btn.addEventListener("click", function(){
    try{
      view = "home"; session = null; triviaState = null; pendingView = null;
      render();
    }catch(e){
      location.reload();
    }
  });
  document.body.appendChild(btn);
}

(async function boot(){
  try{
    installEmergencyHomeButton();
    await loadData();
    render();
  }catch(err){
    console.error("起動時にエラーが発生しました:", err);
    try{ renderCrashRecovery(err); }catch(e){ location.reload(); }
  }
})();
</script>
