<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF5F8;
    --bg-grad: linear-gradient(160deg, #FFF5F8 0%, #FFEEF5 45%, #F5F0FF 100%);
    --panel: #FFFFFF;
    --panel-2: #FFF9FB;
    --chalk: #4A3B47;
    --chalk-dim: #8B7580;
    --line: rgba(214,164,190,0.28);
    --accent: #E8709F;
    --accent-soft: #FFD9E6;
    --accent-2: #A88BD4;

    --c-phys: #6BA8DB;
    --c-chem: #F0A63C;
    --c-bio:  #6DC08A;
    --c-earth:#D4956B;
    --c-trivia:#B87FD4;

    --ok: #4FC08D;
    --ng: #F0847A;
    --star: #F5C842;

    --diff-basic: #7FC8A9;
    --diff-std: #E8A0C0;

    --shadow-sm: 0 2px 8px rgba(214,164,190,0.18);
    --shadow-md: 0 4px 16px rgba(214,164,190,0.22);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-grad);
    background-attachment: fixed;
    color:var(--chalk);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px 60px;
  }
  body::before{
    content:'';
    position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:
      radial-gradient(circle at 12% 8%, rgba(232,112,159,0.07), transparent 32%),
      radial-gradient(circle at 88% 18%, rgba(168,139,212,0.07), transparent 30%),
      radial-gradient(circle at 50% 92%, rgba(255,214,230,0.10), transparent 40%);
  }
  .app{ width:100%; max-width:640px; position:relative; z-index:1; }

  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    padding:14px 18px;
    background:linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,245,250,0.85));
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    border:1px solid var(--line);
  }
  .brand h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:1.5rem;
    margin:0;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .brand h1 small{
    display:block;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:400;
    font-size:.72rem;
    color:var(--chalk-dim);
    margin-top:4px;
    letter-spacing:.15em;
  }
  .brand .counter{
    font-family:'Space Mono', monospace;
    font-size:.85rem;
    color:var(--chalk-dim);
    white-space:nowrap;
    text-align:right;
  }

  .banner{
    font-size:.78rem; color:var(--star); border:1px solid var(--star);
    background:rgba(232,196,104,0.08); border-radius:5px; padding:10px 12px; margin-bottom:18px;
  }
  .banner.trivia-banner{
    color:var(--c-trivia); border-color:var(--c-trivia); background:rgba(197,143,217,0.10);
  }

  .level-toggle{ display:flex; gap:8px; margin-bottom:20px; }
  .level-toggle button{
    flex:1; font-family:'Zen Kaku Gothic New', sans-serif; font-size:.8rem;
    padding:9px 6px; border-radius:100px; border:1px solid var(--line);
    background:transparent; color:var(--chalk-dim); cursor:pointer;
  }
  .level-toggle button.active{ border-color:var(--chalk); color:var(--chalk); background:rgba(243,239,227,0.08); }

  .tube{ display:flex; gap:3px; margin-bottom:24px; }
  .tube .seg{
    flex:1; height:10px; border-radius:2px;
    background:rgba(243,239,227,0.10);
    border:1px solid rgba(243,239,227,0.14);
  }
  .tube .seg.correct{ background:var(--ok); border-color:var(--ok); }
  .tube .seg.retry{ background:var(--star); border-color:var(--star); }
  .tube .seg.wrong{ background:var(--ng); border-color:var(--ng); }
  .tube .seg.current{ border-color:var(--chalk); }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:26px 24px;
    position:relative;
    box-shadow:0 18px 40px -20px rgba(0,0,0,0.55);
  }
  .card.trivia-card{ border-color:var(--c-trivia); }
  .badge{
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-size:.7rem;
    letter-spacing:.08em;
    padding:4px 10px;
    border-radius:100px;
    margin-bottom:14px;
    margin-right:6px;
    border:1px solid;
  }
  .badge.phys{ color:var(--c-phys); border-color:var(--c-phys); background:rgba(127,179,213,0.10);}
  .badge.chem{ color:var(--c-chem); border-color:var(--c-chem); background:rgba(232,163,61,0.10);}
  .badge.bio { color:var(--c-bio);  border-color:var(--c-bio);  background:rgba(143,191,138,0.10);}
  .badge.earth{color:var(--c-earth);border-color:var(--c-earth);background:rgba(201,155,108,0.10);}
  .badge.trivia{color:var(--c-trivia);border-color:var(--c-trivia);background:rgba(197,143,217,0.10);}
  .badge.round{ color:var(--star); border-color:var(--star); background:rgba(232,196,104,0.10); }
  .badge.lvl{ color:var(--chalk-dim); border-color:var(--line); background:transparent; }

  .qhead{ display:flex; justify-content:space-between; align-items:flex-start; }
  .star-btn{
    background:none; border:none; cursor:pointer;
    font-size:1.3rem; line-height:1; padding:0 2px;
    color:rgba(243,239,227,0.28);
  }
  .star-btn.on{ color:var(--star); }

  .question{
    font-family:'Shippori Mincho', serif;
    font-size:1.18rem;
    line-height:1.7;
    margin:0 0 22px;
  }

  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{
    text-align:left;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--chalk);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:.98rem;
    padding:13px 16px;
    border-radius:5px;
    cursor:pointer;
    display:flex; gap:12px; align-items:flex-start;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice:hover:not(:disabled){ border-color:var(--chalk-dim); }
  .choice .num{ font-family:'Space Mono', monospace; color:var(--chalk-dim); flex-shrink:0; }
  .choice:disabled{ cursor:default; }
  .choice.correct{ background:rgba(111,207,151,0.14); border-color:var(--ok); }
  .choice.wrong{ background:rgba(226,131,107,0.14); border-color:var(--ng); }
  .choice.dim{ opacity:.5; }

  .feedback{ margin-top:20px; padding-top:18px; border-top:1px dashed var(--line); }
  .feedback .result{ font-family:'Shippori Mincho', serif; font-weight:700; font-size:1.05rem; margin-bottom:8px; }
  .feedback .result.ok{ color:var(--ok); }
  .feedback .result.ng{ color:var(--ng); }
  .feedback .explain{ font-size:.92rem; line-height:1.75; color:var(--chalk-dim); }
  .feedback .retry-note{ font-size:.82rem; color:var(--star); margin-top:8px; }

  .btn{
    margin-top:20px; width:100%;
    background:transparent; border:1px solid var(--chalk); color:var(--chalk);
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:.95rem;
    padding:13px; border-radius:5px; cursor:pointer; transition:background .15s ease;
  }
  .btn:hover{ background:rgba(243,239,227,0.10); }
  .btn.solid{ background:var(--chalk); color:var(--bg); border:none; }
  .btn.solid:hover{ opacity:.9; }
  .btn.trivia-solid{ background:var(--c-trivia); color:#241429; border:none; }
  .btn.ghost{ border-color:var(--line); color:var(--chalk-dim); }
  .btn.danger{ border-color:var(--ng); color:var(--ng); }
  .btn[disabled]{ opacity:.35; cursor:not-allowed; }

  .menu-stack{ display:flex; flex-direction:column; gap:12px; }
  .menu-item{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:18px 20px; cursor:pointer; text-align:left;
    display:flex; justify-content:space-between; align-items:center; gap:14px;
  }
  .menu-item:hover:not(.disabled){ border-color:var(--chalk-dim); }
  .menu-item.disabled{ opacity:.4; cursor:not-allowed; }
  .menu-item .mi-title{ font-family:'Shippori Mincho', serif; font-size:1.05rem; margin-bottom:4px; }
  .menu-item .mi-sub{ font-size:.8rem; color:var(--chalk-dim); }
  .menu-item .mi-arrow{ font-family:'Space Mono', monospace; color:var(--chalk-dim); font-size:1.1rem; flex-shrink:0; }

  .stat-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
  .stat-box{ background:var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:12px 8px; text-align:center; }
  .stat-box .num{ font-family:'Space Mono', monospace; font-size:1.15rem; }
  .stat-box .lab{ font-size:.68rem; color:var(--chalk-dim); margin-top:3px; }

  .section-title{ font-family:'Shippori Mincho', serif; font-size:1rem; margin:26px 0 12px; color:var(--chalk-dim); }

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cat-btn{ border-radius:6px; padding:16px 14px; cursor:pointer; text-align:left; border:1px solid; background:var(--panel-2); }
  .cat-btn .cn{ font-family:'Shippori Mincho', serif; font-size:1rem; margin-bottom:4px; }
  .cat-btn .cp{ font-family:'Space Mono', monospace; font-size:.78rem; color:var(--chalk-dim); }

  .summary h2{ font-family:'Shippori Mincho', serif; font-size:1.35rem; margin:0 0 4px; }
  .summary .score{ font-family:'Space Mono', monospace; font-size:2.6rem; margin:6px 0 4px; }
  .summary .score span{ font-size:1.1rem; color:var(--chalk-dim); }
  .summary .score-note{ color:var(--chalk-dim); font-size:.88rem; margin-bottom:22px; }

  .mini-stats{ display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
  .mini-stats .pill{ font-family:'Space Mono', monospace; font-size:.78rem; border:1px solid var(--line); border-radius:100px; padding:6px 12px; color:var(--chalk-dim); }

  .barrow{ display:grid; grid-template-columns:70px 1fr 56px; align-items:center; gap:12px; margin-bottom:12px; font-size:.88rem; }
  .barrow .label{ color:var(--chalk-dim); }
  .barrow .track{ height:14px; background:rgba(243,239,227,0.08); border-radius:3px; overflow:hidden; }
  .barrow .fill{ height:100%; border-radius:3px; transition:width .5s ease; }
  .barrow .pct{ font-family:'Space Mono', monospace; text-align:right; color:var(--chalk-dim); }

  .advice{ margin-top:22px; padding:20px; background:var(--panel-2); border-left:3px solid var(--chalk); border-radius:4px; }
  .advice h3{ font-family:'Shippori Mincho', serif; font-size:1.02rem; margin:0 0 10px; }
  .advice p{ font-size:.9rem; line-height:1.8; color:var(--chalk-dim); margin:0 0 10px; }
  .advice p:last-child{ margin-bottom:0; }

  .history-row{ border:1px solid var(--line); border-radius:5px; padding:13px 16px; margin-bottom:10px; }
  .history-row .hr-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .history-row .hr-date{ font-family:'Space Mono', monospace; font-size:.78rem; color:var(--chalk-dim); }
  .history-row .hr-mode{ font-size:.78rem; color:var(--chalk-dim); }
  .history-row .hr-score{ font-family:'Space Mono', monospace; font-weight:700; }
  .empty-note{ color:var(--chalk-dim); font-size:.85rem; padding:14px 0; }

  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ margin-top:0; }

  .list-item{
    border:1px solid var(--line); border-radius:6px; margin-bottom:10px; overflow:hidden;
    background:var(--panel);
  }
  .list-item .list-head{
    padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .list-item .list-q{ font-size:.92rem; line-height:1.6; }
  .list-item .list-arrow{ font-family:'Space Mono', monospace; color:var(--chalk-dim); flex-shrink:0; }
  .list-item .list-body{ padding:0 16px 16px; border-top:1px dashed var(--line); }
  .list-item .list-choice{
    padding:8px 12px; margin-top:8px; border-radius:5px; font-size:.88rem;
    background:var(--panel-2); border:1px solid var(--line);
  }
  .list-item .list-choice.correct{ border-color:var(--ok); background:rgba(111,207,151,0.12); }
  .list-item .list-explain{ margin-top:10px; font-size:.86rem; color:var(--chalk-dim); line-height:1.7; }

  .level-card{
    background:linear-gradient(135deg, rgba(232,196,104,0.14), rgba(127,179,213,0.08));
    border:1px solid var(--star); border-radius:8px; padding:18px 20px; margin-bottom:20px;
  }
  .level-card .lc-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .level-card .lc-level{ font-family:'Space Mono', monospace; font-size:1.3rem; color:var(--star); }
  .level-card .lc-title{ font-family:'Shippori Mincho', serif; font-size:1.15rem; }
  .level-card .lc-xp{ font-family:'Space Mono', monospace; font-size:.75rem; color:var(--chalk-dim); text-align:right; }
  .level-card .lc-track{ height:10px; border-radius:5px; background:rgba(243,239,227,0.10); overflow:hidden; }
  .level-card .lc-fill{ height:100%; border-radius:5px; background:var(--star); transition:width .5s ease; }

  .levelup-banner{
    margin:18px 0; padding:16px; text-align:center; border-radius:6px;
    background:linear-gradient(135deg, rgba(232,196,104,0.22), rgba(197,143,217,0.16));
    border:1px solid var(--star); font-family:'Shippori Mincho', serif; font-size:1.05rem; font-weight:700;
  }

  .unit-grid{ display:flex; flex-direction:column; gap:10px; }
  .unit-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:14px 16px; cursor:pointer;
  }
  .unit-item:hover{ border-color:var(--chalk-dim); }
  .unit-item .un-name{ font-family:'Shippori Mincho', serif; font-size:.98rem; }
  .unit-item .un-meta{ font-family:'Space Mono', monospace; font-size:.75rem; color:var(--chalk-dim); }

  @media (max-width:420px){
    .card{ padding:20px 16px; }
    .question{ font-size:1.05rem; }
    .stat-strip{ grid-template-columns:repeat(2,1fr); }
    .cat-grid{ grid-template-columns:1fr; }
  }

  /* ========== 難易度トグル ========== */
  .diff-toggle{
    background:linear-gradient(135deg,#FFFFFF,#FFF9FC);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 14px;
    margin-bottom:16px;
    box-shadow:var(--shadow-sm);
  }
  .dt-label{
    font-family:'Shippori Mincho',serif;
    font-size:.9rem; font-weight:700;
    color:var(--accent);
    margin-bottom:10px; letter-spacing:.06em;
  }
  .dt-label::before{ content:'🎀 '; }
  .dt-btns{ display:flex; gap:8px; }
  .dt-btns button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:12px 6px 10px;
    border:2px solid var(--line);
    border-radius:14px;
    background:#fff;
    color:var(--chalk-dim);
    cursor:pointer;
    font-family:inherit;
    transition:all .22s cubic-bezier(.34,1.56,.64,1);
  }
  .dt-btns button:hover{ transform:translateY(-2px); box-shadow:var(--shadow-sm); }
  .dt-ic{ font-size:1.25rem; line-height:1; }
  .dt-t{ font-size:.9rem; font-weight:700; }
  .dt-n{ font-size:.68rem; opacity:.7; }
  .dt-btns button.active{
    color:#fff; border-color:transparent;
    box-shadow:var(--shadow-md); transform:translateY(-2px);
  }
  .dt-btns button.active.dt-all{ background:linear-gradient(135deg,#E8709F,#A88BD4); }
  .dt-btns button.active.dt-基礎{ background:linear-gradient(135deg,#7FC8A9,#5FB894); }
  .dt-btns button.active.dt-標準{ background:linear-gradient(135deg,#E8A0C0,#DE7FA8); }
  .dt-hint{
    margin-top:10px; font-size:.78rem; color:var(--chalk-dim);
    text-align:center; padding:7px 10px;
    background:var(--accent-soft); border-radius:10px;
  }

  /* ========== 難易度バッジ ========== */
  .diff-badge{
    display:inline-block; font-size:.7rem; font-weight:700;
    padding:3px 9px; border-radius:999px; margin-left:6px;
    color:#fff; letter-spacing:.04em;
  }
  .diff-badge.基礎{ background:var(--diff-basic); }
  .diff-badge.標準{ background:var(--diff-std); }

  /* ========== 解説の読みやすさ強化 ========== */
  .explain{
    line-height:1.95 !important;
    font-size:.94rem !important;
  }
  .explain strong{ color:var(--accent); font-weight:700; }
  .exp-section{
    margin-top:12px; padding:11px 13px;
    background:rgba(255,245,250,0.75);
    border-left:3px solid var(--accent);
    border-radius:0 10px 10px 0;
  }
  .exp-section-title{
    font-size:.8rem; font-weight:700; color:var(--accent);
    margin-bottom:5px; letter-spacing:.04em;
  }

  /* ========== 全体の丸み・やわらかさ ========== */
  .panel, .card, .stat-box, .level-card{
    border-radius:var(--radius);
  }
  .choice{ border-radius:14px; }
  .level-card{
    background:linear-gradient(135deg,#FFF0F6,#F3EDFF) !important;
    border:1px solid var(--line) !important;
    box-shadow:var(--shadow-sm);
  }
  .lc-fill{ background:linear-gradient(90deg,#E8709F,#A88BD4) !important; }
  .lc-level{ color:var(--accent) !important; }
  .stat-box{
    background:#fff !important;
    border:1px solid var(--line) !important;
    box-shadow:var(--shadow-sm);
  }
  .stat-box .num{ color:var(--accent) !important; }

  /* ========== 選択肢ボタン ========== */
  .choice{
    background:#fff !important;
    border:2px solid var(--line) !important;
    transition:all .2s cubic-bezier(.34,1.56,.64,1) !important;
  }
  .choice:hover:not(.disabled){
    border-color:var(--accent) !important;
    background:var(--accent-soft) !important;
    transform:translateX(3px);
  }
  .choice.correct{
    background:linear-gradient(135deg,#E4F7EE,#D2F0E2) !important;
    border-color:var(--ok) !important;
  }
  .choice.wrong{
    background:linear-gradient(135deg,#FFEDE9,#FFDDD6) !important;
    border-color:var(--ng) !important;
  }

  /* ========== ボタン ========== */
  .btn, button.primary{
    transition:all .2s cubic-bezier(.34,1.56,.64,1);
  }
  .btn:hover, button.primary:hover{ transform:translateY(-2px); }
  .btn.primary, button.primary{
    background:linear-gradient(135deg,#E8709F,#D45C8C) !important;
    color:#fff !important; border:none !important;
    box-shadow:var(--shadow-sm);
  }

  /* ========== 見出し ========== */
  .brand h1{
    background:linear-gradient(135deg,#E8709F,#A88BD4);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .brand h1 small{
    -webkit-text-fill-color:var(--chalk-dim);
    color:var(--chalk-dim);
  }

  /* ========== 応援メッセージ ========== */
  .cheer{
    margin:14px 0; padding:13px 16px;
    background:linear-gradient(135deg,#FFF0F6,#F5EDFF);
    border:1px dashed var(--accent);
    border-radius:var(--radius);
    font-size:.88rem; text-align:center; color:var(--chalk);
  }
  .cheer strong{ color:var(--accent); }


  /* ========== 正解・不正解の演出（効果音とセットで使用） ========== */
  .fx-flash{
    position:fixed; inset:0; z-index:99998; pointer-events:none;
    opacity:1; transition:opacity .35s ease-out;
  }
  @keyframes fx-shake-kf{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(calc(var(--fx-shake-power,3px) * -1)); }
    40%{ transform:translateX(var(--fx-shake-power,3px)); }
    60%{ transform:translateX(calc(var(--fx-shake-power,3px) * -0.6)); }
    80%{ transform:translateX(calc(var(--fx-shake-power,3px) * 0.6)); }
  }
  .fx-shake{ animation: fx-shake-kf .32s ease-in-out; }

  .fx-confetti-layer{
    position:fixed; inset:0; z-index:99997; pointer-events:none; overflow:hidden;
  }
  .fx-confetti-piece{
    position:absolute; top:-40px;
    animation-name: fx-confetti-fall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }
  @keyframes fx-confetti-fall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--fx-drift,0px), 90vh) rotate(var(--fx-rotate,360deg)); opacity:0; }
  }


  /* ========== 自前の確認モーダル（window.confirm()を使わないため） ========== */
  .confirm-modal-overlay{
    position:fixed; inset:0; z-index:999998;
    background:rgba(74,59,71,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    animation: cm-fade-in .18s ease-out;
  }
  @keyframes cm-fade-in{ from{ opacity:0; } to{ opacity:1; } }
  .confirm-modal-box{
    background:#fff; border-radius:18px; padding:24px 22px;
    max-width:340px; width:100%;
    box-shadow:0 10px 40px rgba(74,59,71,0.35);
    animation: cm-pop-in .22s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes cm-pop-in{ from{ transform:scale(.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .confirm-modal-msg{
    font-size:.92rem; line-height:1.7; color:var(--chalk);
    white-space:pre-line; margin-bottom:18px; text-align:center;
  }
  .confirm-modal-row{ display:flex; gap:10px; }
  .confirm-modal-btn{
    flex:1; padding:12px 8px; border-radius:12px; border:none;
    font-family:inherit; font-weight:700; font-size:.88rem; cursor:pointer;
  }
  .confirm-modal-btn.cancel{
    background:#F2ECEF; color:var(--chalk-dim);
  }
  .confirm-modal-btn.ok{
    background:linear-gradient(135deg,#E8709F,#D45C8C); color:#fff;
  }


  /* ========== 問題の図（実験装置・しくみの図解） ========== */
  .q-diagram{
    display:flex; justify-content:center; align-items:center;
    background:linear-gradient(135deg,#FFFBFD,#FBF6FF);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 10px;
    margin:12px 0 16px;
  }
  .q-diagram svg{
    max-width:100%; height:auto; display:block;
  }


  /* ========== レベルカード：実績への導線 ========== */
  .level-card{ cursor:pointer; transition:transform .15s ease; }
  .level-card:hover{ transform:translateY(-1px); }
  .lc-badge-link{
    margin-top:8px; font-size:.78rem; color:var(--accent);
    font-weight:700; text-align:right;
  }

  /* ========== 実績（バッジ）グリッド ========== */
  .badge-grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;
  }
  .badge-card{
    background:#fff; border:2px solid var(--line); border-radius:14px;
    padding:14px 10px; text-align:center;
  }
  .badge-card.earned{
    border-color:var(--star);
    background:linear-gradient(135deg,#FFFBEF,#FFF9E8);
    box-shadow:var(--shadow-sm);
  }
  .badge-card.locked{ opacity:.55; }
  .badge-icon{ font-size:2rem; margin-bottom:4px; }
  .badge-name{ font-size:.82rem; font-weight:700; color:var(--chalk); margin-bottom:3px; }
  .badge-desc{ font-size:.7rem; color:var(--chalk-dim); line-height:1.4; }

  /* ========== レベルアップ／バッジ獲得の演出オーバーレイ ========== */
  .celebration-overlay{
    position:fixed; inset:0; z-index:999996;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    opacity:0; transition:opacity .3s ease;
  }
  .celebration-overlay.show{ opacity:1; }
  .celebration-box{
    background:linear-gradient(135deg,#fff,#FFF6FA);
    border-radius:24px; padding:28px 36px; text-align:center;
    box-shadow:0 12px 50px rgba(74,59,71,0.35);
    animation: cel-pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes cel-pop{ from{ transform:scale(.6) rotate(-4deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }
  .cel-burst{ font-size:2rem; margin-bottom:2px; }
  .cel-label{
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:1.1rem;
    background:linear-gradient(135deg,#E8709F,#A88BD4);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    letter-spacing:.08em; margin-bottom:6px;
  }
  .cel-level{ font-size:2.2rem; font-weight:800; color:var(--accent); }
  .cel-title{ font-size:1rem; color:var(--chalk); margin-top:2px; }
  .cel-badge-icon{ font-size:3rem; margin-bottom:6px; }
  .cel-badge-name{ font-size:1.15rem; font-weight:800; color:var(--chalk); margin-top:2px; }
  .cel-badge-desc{ font-size:.8rem; color:var(--chalk-dim); margin-top:4px; }

  /* ========== 連続正解ボーナスのトースト通知 ========== */
  .streak-toast{
    position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-20px);
    z-index:999995;
    background:linear-gradient(135deg,#F0A63C,#E8709F);
    color:#fff; font-weight:700; font-size:.9rem;
    padding:10px 18px; border-radius:999px;
    box-shadow:0 6px 20px rgba(232,112,159,0.4);
    opacity:0; transition:all .3s cubic-bezier(.34,1.56,.64,1);
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .streak-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .streak-toast-xp{
    background:rgba(255,255,255,0.25); padding:2px 8px; border-radius:999px; font-size:.78rem;
  }

  /* ========== +XP 浮遊テキスト ========== */
  .floating-xp{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:999994;
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:1.5rem;
    color:var(--accent);
    text-shadow:0 2px 8px rgba(255,255,255,0.8);
    pointer-events:none;
    animation: xp-float 1.1s ease-out forwards;
  }
  @keyframes xp-float{
    0%{ opacity:0; transform:translate(-50%,-40%) scale(.7); }
    15%{ opacity:1; transform:translate(-50%,-55%) scale(1.15); }
    30%{ transform:translate(-50%,-60%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-110%) scale(1); }
  }


  /* ========== 厨二病モード：切り替えボタン ========== */
  .chuni-toggle-row{ text-align:center; margin-top:6px; }
  .chuni-toggle-btn{
    background:transparent; border:1px dashed rgba(120,90,160,0.4);
    color:var(--chalk-dim); font-size:.72rem; padding:5px 12px;
    border-radius:999px; cursor:pointer; font-family:inherit;
    transition:all .2s ease;
  }
  .chuni-toggle-btn:hover{ border-color:#5B3E8F; color:#5B3E8F; }
  .chuni-toggle-btn.on{
    background:linear-gradient(135deg,#2A1A40,#42245E);
    color:#D9C2FF; border:1px solid #6B4FA0;
    box-shadow:0 0 12px rgba(107,79,160,0.5);
  }

  /* ========== 厨二病モード：レベルカード/実績カードの暗黒アレンジ ========== */
  .level-card.chuni-card, .card.chuni-card{
    background:linear-gradient(135deg,#241531,#1A1024) !important;
    border:1px solid #4A3268 !important;
  }
  .level-card.chuni-card .lc-level, .card.chuni-card .lc-level{ color:#C89EFF !important; }
  .level-card.chuni-card .lc-title, .card.chuni-card .lc-title{ color:#B8A0D8 !important; }
  .level-card.chuni-card .lc-track{ background:rgba(107,79,160,0.2) !important; }
  .level-card.chuni-card .lc-fill{ background:linear-gradient(90deg,#6B4FA0,#C89EFF) !important; }
  .level-card.chuni-card .lc-badge-link{ color:#C89EFF !important; }
  .badge-card.chuni.earned{
    background:linear-gradient(135deg,#241531,#33204A) !important;
    border-color:#8F6FD4 !important;
    box-shadow:0 0 14px rgba(143,111,212,0.35) !important;
  }
  .badge-card.chuni.earned .badge-name{ color:#D9C2FF !important; }
  .badge-card.chuni.earned .badge-desc{ color:#A896C4 !important; }

  /* ========== 厨二病モード：レベルアップ／バッジ演出（暗黒バージョン） ========== */
  .celebration-box.chuni{
    background:radial-gradient(circle at 50% 40%, #2A1A40 0%, #0D0616 75%) !important;
    border:1px solid #6B4FA0;
    box-shadow:0 0 60px rgba(107,79,160,0.6), 0 12px 50px rgba(0,0,0,0.6) !important;
    position:relative; overflow:hidden;
    color:#D9C2FF;
  }
  .chuni-circle{
    position:absolute; top:50%; left:50%; width:220px; height:220px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(200,158,255,0.35);
    border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(200,158,255,0.08) 0deg 8deg, transparent 8deg 20deg);
    animation: chuni-spin 6s linear infinite;
    pointer-events:none;
  }
  .chuni-circle.small{ width:140px; height:140px; }
  @keyframes chuni-spin{ from{ transform:translate(-50%,-50%) rotate(0deg); } to{ transform:translate(-50%,-50%) rotate(360deg); } }
  .chuni-burst{
    font-size:2rem; filter:drop-shadow(0 0 10px #C89EFF);
    animation: chuni-flicker 1.2s ease-in-out infinite;
  }
  @keyframes chuni-flicker{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
  .chuni-label{
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:1.15rem;
    color:#E8D9FF !important; -webkit-text-fill-color:#E8D9FF !important;
    background:none !important;
    text-shadow:0 0 12px #8F6FD4, 0 0 24px #6B4FA0;
    letter-spacing:.12em; position:relative; z-index:1;
  }
  .chuni-level{
    font-size:2.4rem; font-weight:900; color:#C89EFF;
    text-shadow:0 0 16px #8F6FD4; position:relative; z-index:1;
  }
  .chuni-title{
    font-size:.95rem; color:#B8A0D8; margin-top:4px;
    position:relative; z-index:1;
  }
  .chuni-line{
    margin-top:10px; font-size:.8rem; color:#9A82C0;
    font-style:italic; position:relative; z-index:1;
    border-top:1px dashed rgba(200,158,255,0.25); padding-top:8px;
  }

  /* ========== 厨二病モード：連続正解トースト ========== */
  .streak-toast.chuni{
    background:linear-gradient(135deg,#2A1A40,#4A2E6E) !important;
    color:#E8D9FF !important;
    box-shadow:0 0 18px rgba(143,111,212,0.6) !important;
    border:1px solid #8F6FD4;
  }
  .streak-toast.chuni .streak-toast-xp{
    background:rgba(200,158,255,0.2) !important;
  }

  /* ========== 厨二病モード：稲妻パーティクル ========== */
  .chuni-bolt{ filter:drop-shadow(0 0 6px #C89EFF); }


  /* ========== ホーム画面への追加を促すバナー ========== */
  .install-banner{
    display:flex; align-items:flex-start; gap:10px;
    background:linear-gradient(135deg,#FFF0F6,#F0EBFF);
    border:1px dashed var(--accent);
    border-radius:var(--radius);
    padding:12px 14px; margin-bottom:16px;
  }
  .install-banner-text{ flex:1; font-size:.82rem; line-height:1.6; color:var(--chalk); }
  .install-banner-sub{ font-size:.72rem; color:var(--chalk-dim); margin-top:3px; }

<script>
/* ==================== 中学レベルの問題 ==================== */
const JHS_QUESTIONS = [
  {id:"phy1", cat:"物理", sub:"光と音", q:"光が異なる物質の境界面で進路が曲がる現象を何というか。", choices:["反射","屈折","全反射","分散"], diff:"基礎", a:1, e:"【屈折とは】光は「空気」「水」「ガラス」など、通る物質が変わると進む速さが変わります。速さが変わるとき、境界面で光の進む向きがカクッと曲がります。これが屈折です。／【他の選択肢】反射＝光がはね返ること（鏡）。全反射＝屈折の一種で、光がまったく外に出ずに全部はね返る特別な場合。分散＝白い光が虹のように色ごとに分かれること。／【身近な例】コップの水にストローを入れると折れて見えるのは屈折のせいです。"},
  {id:"phy3", cat:"物理", sub:"力の働き", q:"ばねに加える力の大きさとばねの伸びの関係を表す法則は何か。", choices:["作用・反作用の法則","フックの法則","慣性の法則","パスカルの原理"], diff:"基礎", a:1, e:"【フックの法則とは】ばねを引っぱると伸びます。「2倍の力で引けば2倍伸びる」「3倍の力なら3倍伸びる」という、力と伸びがきれいな比例関係になる法則です。／【他の選択肢】作用・反作用の法則＝押したら押し返される（壁を押すと手も押される）。慣性の法則＝動いているものは動き続けようとする。パスカルの原理＝閉じ込めた液体に力を加えると全体に同じ圧力が伝わる。"},
  {id:"phy5", cat:"物理", sub:"電流と回路", q:"電熱線を並列につなぐと、回路全体の抵抗はどうなるか。", choices:["大きくなる","小さくなる","変わらない","0になる"], diff:"基礎", a:1, e:"【並列つなぎとは】電気の通り道（道路）が2本以上に分かれているつなぎ方です。／【なぜ抵抗が小さくなる？】道路が1本より2本ある方が車は流れやすいですよね。同じように、電流の通り道が増えると電気は流れやすくなります。流れやすい＝抵抗が小さい、ということです。／【逆に直列は】道が1本しかないので抵抗は足し算になり大きくなります。"},
  {id:"phy7", cat:"物理", sub:"運動とエネルギー", q:"一定の速さで一直線上を進む運動を何というか。", choices:["等速直線運動","自由落下運動","等加速度運動","円運動"], diff:"基礎", a:0, e:"【等速直線運動とは】「等速」＝速さが変わらない、「直線」＝まっすぐ進む。つまり同じ速さでまっすぐ進み続ける運動のことです。／【他の選択肢】自由落下＝重力だけで落ちる運動（だんだん速くなる）。等加速度運動＝速さが一定の割合で増える（or減る）運動。円運動＝円を描いて回る運動（向きが変わり続ける）。／【ポイント】速さも向きも変わらないのが等速直線運動です。"},
  {id:"phy9", cat:"物理", sub:"仕事とエネルギー", q:"動滑車を1つ使って荷物を持ち上げると、必要な力の大きさはどうなるか。", choices:["半分になる","2倍になる","変わらない","0になる"], diff:"基礎", a:0, e:"【動滑車とは】ロープと一緒に動く滑車のことです。荷物と一緒に上がったり下がったりします。／【なぜ力が半分？】荷物の重さを2本のロープで支える形になるので、1本あたりが支える力は半分になります。／【ただし】力が半分になる代わりに、ロープを引く長さは2倍必要です。荷物を1m上げるには2m引かないといけません。／【仕事の原理】道具を使っても「力×距離」（仕事）は変わりません。楽になるのは力だけです。"},
  {id:"phy11", cat:"物理", sub:"仕事とエネルギー", q:"斜面を使って荷物を持ち上げるとき、まっすぐ持ち上げる場合と比べて必要な力の大きさと移動距離はどうなるか。", choices:["力は小さく、距離は長くなる","力は大きく、距離は短くなる","力も距離も変わらない","力は小さく、距離も短くなる"], diff:"標準", a:0, e:"【斜面を使う意味】重い荷物をまっすぐ持ち上げるのは大変ですが、ゆるやかな坂を使うと軽い力で押し上げられます。／【なぜ力が小さくなる？】荷物の重さのうち、坂に沿った方向の分だけを支えればよくなるからです。坂がゆるいほど必要な力は小さくなります。／【ただし】距離は長くなります。1m上げるのに坂だと3m進む必要がある、といった具合です。／【仕事の原理】力が小さくなった分だけ距離が長くなるので、「力×距離」（仕事）は変わりません。"},
  {id:"phy13", cat:"物理", sub:"光と音", q:"凸レンズを通った平行光線が集まる点を何というか。", choices:["焦点","虚像","主光軸","像点"], diff:"基礎", a:0, e:"【焦点とは】凸レンズ（真ん中がふくらんだ虫めがねのようなレンズ）に、まっすぐな光（平行光線）を当てると、光は屈折して1点に集まります。この集まる点が焦点です。／【他の選択肢】虚像＝実際には光が集まっていないのに、そこにあるように見える像（鏡に映った自分など）。主光軸＝レンズの中心を通る、レンズに垂直な線。／【身近な例】虫めがねで太陽の光を1点に集めて紙を焦がすとき、その点が焦点です。"},
  {id:"phy15", cat:"物理", sub:"力の働き", q:"同じ力でも、力がはたらく面積が小さいほど圧力はどうなるか。", choices:["大きくなる","小さくなる","変わらない","0になる"], diff:"基礎", a:0, e:"【圧力とは】「どのくらいギュッと押されているか」を表す量です。式は【圧力＝力÷面積】。／【なぜ面積が小さいと大きくなる？】同じ力でも、力がかかる面積が小さいほど、1か所あたりにかかる負担が大きくなるからです。割り算の分母が小さくなれば答えは大きくなりますね。／【身近な例】画びょうの先はとがっている（面積が小さい）から刺さる。逆にスキー板は広い（面積が大きい）から雪に沈まない。"},
  {id:"phy17", cat:"物理", sub:"電流と回路", q:"モーターが回転するしくみに最も関係する現象は何か。", choices:["電磁誘導","電流が磁界から受ける力","静電気","熱伝導"], diff:"標準", a:1, e:"【モーターのしくみ】磁石（磁界）の中にコイルを置き、電流を流すと、コイルは磁界から力を受けて動きます。この力を利用して回し続けるのがモーターです。／【他の選択肢との違い】電磁誘導＝逆に「コイルを動かすと電気が生まれる」現象で、これは発電機のしくみです。静電気＝下じきをこすると髪が立つあの現象。熱伝導＝熱が物を伝わって移動すること。／【覚え方】モーターは「電気→動き」、発電機は「動き→電気」。"},
  {id:"phy19", cat:"物理", sub:"電流と回路", q:"交流と直流のちがいとして正しいものはどれか。", choices:["交流は電流の向きが周期的に変わる","直流は電圧が周期的に変わる","交流は電池からしか得られない","直流はコンセントの電流である"], diff:"基礎", a:0, e:"【直流と交流の違い】直流＝電流がいつも同じ向きに流れる（乾電池）。交流＝電流の向きが1秒間に何十回も入れ替わる（家庭のコンセント）。／【なぜ交流を使う？】交流は変圧器を使って電圧を簡単に上げ下げできるため、発電所から家庭まで送るのに便利だからです。／【日本の交流】東日本は1秒間に50回、西日本は60回向きが入れ替わります（50Hz・60Hz）。"},
  {id:"phy21", cat:"物理", sub:"光と音", q:"音が空気中を伝わる速さはおよそどれくらいか。", choices:["秒速約340m","秒速約3400m","秒速約34m","秒速約34万km"], diff:"標準", a:0, e:"【音の速さ】空気中では1秒間に約340m進みます。／【光と比べると】光は1秒で約30万km（地球7周半）。音は光よりずっと遅いのです。／【身近な例】雷が光ってから「ゴロゴロ」と音が聞こえるまで時間差があるのはこのため。光ってから3秒後に音が聞こえたら、雷までの距離は340×3＝約1020m（約1km）と計算できます。"},
  {id:"phy23", cat:"物理", sub:"浮力と水圧", q:"水中の物体にはたらく上向きの力を何というか。", choices:["浮力","張力","圧力","抗力"], diff:"基礎", a:0, e:"【浮力とは】水などの液体の中にある物体を、上向きに押し上げる力のことです。／【なぜ生まれる？】水の中では深いほど水圧が大きくなります。物体の下面には上向きの強い水圧、上面には下向きの弱い水圧がかかるため、差し引きすると上向きの力が残ります。これが浮力です。／【大きさ】その物体が押しのけた水の重さと同じ大きさになります（アルキメデスの原理）。"},
  {id:"phy25", cat:"物理", sub:"浮力と水圧", q:"水中に沈むほど水圧はどうなるか。", choices:["大きくなる","小さくなる","変わらない","0になる"], diff:"基礎", a:0, e:"【水圧とは】水が物体を押す力のことです。／【なぜ深いほど大きい？】水の中のある点には、その上にある水すべての重さがのしかかります。深く潜るほど「上にある水の量」が増えるので、押される力（水圧）も大きくなります。／【身近な例】プールで深く潜ると耳がキーンとするのは水圧が大きくなったから。深海探査機が頑丈に作られているのも同じ理由です。"},
  {id:"phy27", cat:"物理", sub:"力の働き", q:"1つの力を、同じはたらきをする複数の力に分けることを何というか。", choices:["合成","分解","相殺","中和"], diff:"基礎", a:1, e:"【力の分解とは】1つの力を、同じはたらきをする2つ以上の力に分けて考えることです。／【なぜ分ける？】斜め方向の力は考えにくいので、「横向きの力」と「縦向きの力」に分けると計算しやすくなります。／【逆の操作】複数の力を1つにまとめることを「力の合成」といい、まとめた力を「合力」といいます。／【身近な例】斜面上の物体にはたらく重力を、斜面に沿う方向と垂直な方向に分けて考えます。"},
  {id:"phy29", cat:"物理", sub:"電流と回路", q:"電流によって発生する熱を何というか。", choices:["電力量","熱量(ジュール熱)","仕事率","抵抗"], diff:"基礎", a:1, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「電力」＝1秒あたりに使う電気エネルギーの量（単位W）【解説】電流が流れることで発生する熱を熱量(ジュール熱)といい、電力と時間の積で求められる。【まちがえやすい点】ほかの選択肢（電力量／仕事率）とのちがいをおさえておこう。"},
  {id:"phy31", cat:"物理", sub:"光と音", q:"光が空気中からガラスの中へ進むとき、光の速さはどうなるか。", choices:["速くなる","遅くなる","変わらない","0になる"], diff:"標準", a:1, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること【解説】光は空気中よりもガラスや水の中の方が伝わる速さが遅くなり、これが屈折の原因となる。【まちがえやすい点】ほかの選択肢（速くなる／変わらない）とのちがいをおさえておこう。"},
  {id:"phy33", cat:"物理", sub:"光と音", q:"音の大きさを決めるものは何か。", choices:["振動数","振幅","波長","音速"], diff:"基礎", a:1, e:"【ことばの意味】「振幅」＝ふるえの大きさ。大きいほど大きな音【解説】音の大きさ(強さ)は振動の振れ幅である振幅によって決まり、振幅が大きいほど大きい音になる。【まちがえやすい点】ほかの選択肢（振動数／波長）とのちがいをおさえておこう。"},
  {id:"phy35", cat:"物理", sub:"熱の伝わり方", q:"熱が物体の中を次々に伝わっていく現象を何というか。", choices:["伝導","対流","放射","蒸発"], diff:"基礎", a:0, e:"【ことばの意味】「伝導」＝物を伝わって熱が移動すること【解説】物体の高温部分から低温部分へ、粒子の運動が次々と伝わることで熱が伝わる現象を伝導という。【まちがえやすい点】ほかの選択肢（対流／放射）とのちがいをおさえておこう。"},
  {id:"phy37", cat:"物理", sub:"力の働き", q:"机の上の物体にはたらく重力の反作用にあたる力はどれか。", choices:["物体が地球を引く力","机が物体を押す力(垂直抗力)","物体にはたらく摩擦力","机にはたらく重力"], diff:"基礎", a:0, e:"【ことばの意味】「重力」＝地球が物体を引っぱる力【解説】作用・反作用の関係は同じ2つの物体間で対になる力であり、地球が物体を引く重力の反作用は、物体が地球を引く力である。【まちがえやすい点】ほかの選択肢（机が物体を押す力(垂直抗力)／物体にはたらく摩擦力）とのちがいをおさえておこう。"},
  {id:"phy39", cat:"物理", sub:"電流と回路", q:"静電気が起こる主な原因は何か。", choices:["異なる物質どうしをこすり合わせて電子が移動する","物質が燃えるときに発生する","物質が冷えるときに発生する","物質が電流を通すときに発生する"], diff:"基礎", a:0, e:"【解説】異なる物質をこすり合わせると、一方から他方へ電子が移動し、物体が電気を帯びる静電気が発生する。【まちがえやすい点】ほかの選択肢（物質が燃えるため／物質が冷えるため）とのちがいをおさえておこう。"},
  {id:"phy41", cat:"物理", sub:"エネルギーの利用", q:"水の落下する力を利用して発電する方法を何というか。", choices:["火力発電","水力発電","原子力発電","太陽光発電"], diff:"基礎", a:1, e:"【解説】水力発電は高い場所からの水の落下エネルギーを利用してタービンを回し発電する方法である。【まちがえやすい点】ほかの選択肢（火力発電／原子力発電）とのちがいをおさえておこう。"},
  {id:"phy43", cat:"物理", sub:"光と音", q:"凸レンズで、物体を焦点の外側に置いたとき、反対側のスクリーンにうつる像を何というか。", choices:["実像","虚像","正立像","鏡像"], diff:"基礎", a:0, e:"【ことばの意味】「焦点」＝レンズを通った平行な光が1点に集まる場所／「実像」＝実際に光が集まってできる像。スクリーンに映せる【解説】物体を焦点の外側に置くと、凸レンズの反対側に実際に光が集まってできる上下左右が逆の実像がスクリーンにうつる。【まちがえやすい点】ほかの選択肢（虚像／正立像）とのちがいをおさえておこう。"},
  {id:"phy45", cat:"物理", sub:"電流と回路(計算)", q:"6Vの電圧を2Ωの抵抗に加えたとき、流れる電流は何Aか。", choices:["2A","3A","4A","12A"], diff:"標準", a:1, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】オームの法則より、電流=電圧÷抵抗=6÷2=3Aである。【まちがえやすい点】ほかの選択肢（2A／4A）とのちがいをおさえておこう。"},
  {id:"phy47", cat:"物理", sub:"電流と回路(計算)", q:"100Vの電圧で2Aの電流が流れる電気ストーブの消費電力は何Wか。", choices:["50W","100W","200W","400W"], diff:"基礎", a:2, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】電力=電圧×電流=100×2=200Wである。【まちがえやすい点】ほかの選択肢（50W／100W）とのちがいをおさえておこう。"},
  {id:"phy49", cat:"物理", sub:"力の働き(計算)", q:"10Nの力を2m²の面に加えたときの圧力は何Paか。", choices:["2Pa","5Pa","20Pa","50Pa"], diff:"標準", a:1, e:"【ことばの意味】「圧力」＝面積あたりにかかる力（力÷面積）【解説】圧力=力÷面積=10÷2=5Paである。【まちがえやすい点】ほかの選択肢（2Pa／20Pa）とのちがいをおさえておこう。"},
  {id:"phy51", cat:"物理", sub:"てこ(計算)", q:"支点から左に30cmのところに2Nのおもりをつるした。支点から右に20cmのところにつるしてつり合わせるには何Nのおもりが必要か。", choices:["1N","2N","3N","4N"], diff:"基礎", a:2, e:"【解説】力のモーメントがつり合うので、2N×30cm=x×20cmより、x=3Nである。【まちがえやすい点】ほかの選択肢（1N／2N）とのちがいをおさえておこう。"},
  {id:"phy53", cat:"物理", sub:"電流と回路(計算)", q:"3Vの電池を2個直列につなぐと、全体の電圧は何Vになるか。", choices:["1.5V","3V","6V","9V"], diff:"基礎", a:2, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「直列」＝電気の通り道が1本道のつなぎ方【解説】電池を直列につなぐと、電圧はそれぞれの電池の電圧の合計になるため、3V×2=6Vである。【まちがえやすい点】ほかの選択肢（1.5V／3V）とのちがいをおさえておこう。"},
  {id:"phy55", cat:"物理", sub:"電流と回路(計算)", q:"2Ωの抵抗を2個並列につないだときの合成抵抗は何Ωか。", choices:["0.5Ω","1Ω","2Ω","4Ω"], diff:"標準", a:1, e:"【ことばの意味】「抵抗」＝電流の流れにくさ（単位Ω）／「並列」＝電気の通り道が枝分かれしているつなぎ方【解説】並列につないだ抵抗の合成抵抗は各抵抗より小さくなり、この場合は1Ωになる。【まちがえやすい点】ほかの選択肢（0.5Ω／2Ω）とのちがいをおさえておこう。"},
  {id:"phy57", cat:"物理", sub:"電流と回路(計算)", q:"100Wの電球を2時間使ったときの電力量は何Whか。", choices:["50Wh","100Wh","200Wh","400Wh"], diff:"標準", a:2, e:"【ことばの意味】「電力」＝1秒あたりに使う電気エネルギーの量（単位W）／「電力量」＝使った電気エネルギーの合計（電力×時間）【解説】電力量=電力×時間=100W×2時間=200Whである。【まちがえやすい点】ほかの選択肢（50Wh／100Wh）とのちがいをおさえておこう。"},
  {id:"phy59", cat:"物理", sub:"光と音", q:"光の反射についての説明として誤っているものはどれか。", choices:["入射角と反射角は等しい","光は鏡以外の物体でも反射する","反射角は常に入射角の2倍になる","乱反射でも光の反射の法則は成り立っている"], diff:"基礎", a:2, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること【解説】反射角は入射角と等しくなり、2倍になるわけではない。【まちがえやすい点】ほかの選択肢（入射角と反射角は等しい／光は鏡以外の物体でも反射する）とのちがいをおさえておこう。"},
  {id:"phy61", cat:"物理", sub:"電流と回路", q:"電磁石についての説明として誤っているものはどれか。", choices:["電流の向きを変えると極が入れかわる","コイルの巻き数を増やすと磁力が強くなる","電流を流していなくても常に磁力をもつ","鉄しんを入れると磁力が強くなる"], diff:"基礎", a:2, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）【解説】電磁石は電流を流しているときだけ磁力をもち、電流を止めると磁力は失われる。【まちがえやすい点】ほかの選択肢（電流の向きを変えると極が入れかわる／コイルの巻き数を増やすと磁力が強くなる）とのちがいをおさえておこう。"},
  {id:"phy63", cat:"物理", sub:"力の働き", q:"力のつり合いについての説明として誤っているものはどれか。", choices:["つり合う2力は大きさが等しい","つり合う2力は向きが反対である","つり合う2力は一直線上になくてもよい","物体が静止しているとき、はたらく力はつり合っている"], diff:"標準", a:2, e:"【解説】2力がつり合うためには、大きさが等しく、向きが反対で、さらに一直線上にはたらく必要がある。【まちがえやすい点】ほかの選択肢（つり合う2力は大きさが等しい／つり合う2力は向きが反対である）とのちがいをおさえておこう。"},
  {id:"phy65", cat:"物理", sub:"電流と回路", q:"直流と交流についての説明として誤っているものはどれか。", choices:["乾電池は直流を流す","家庭用コンセントの電流は交流である","交流は電流の大きさも向きも一定である","交流は発電所から家庭まで送る際に広く使われている"], diff:"基礎", a:2, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）【解説】交流は電流の向きと大きさが周期的に変化する電流であり、一定ではない。【まちがえやすい点】ほかの選択肢（乾電池は直流を流す／家庭用コンセントの電流は交流である）とのちがいをおさえておこう。"},
  {id:"phy67", cat:"物理", sub:"力の働き", q:"ばねについての説明として誤っているものはどれか。", choices:["ばねの伸びは加えた力に比例する","同じ力を加えても、ばねの種類によって伸びは異なることがある","ばねの伸びは、ばねの種類に関係なく常に同じ量だけ伸びる","フックの法則が成り立つ範囲でばねは元に戻る"], diff:"基礎", a:2, e:"【解説】ばねの伸びは加える力の大きさに比例するが、ばねの種類(ばね定数)によって伸び方は異なるため、「常に同じ量」という記述は誤り。【まちがえやすい点】ほかの選択肢（ばねの伸びは加えた力に比例する／同じ力を加えても、ばねの種類によって伸びは異…）とのちがいをおさえておこう。"},
  {id:"phy69", cat:"物理", sub:"仕事とエネルギー(計算)", q:"2Nの力で物体を1m持ち上げたときの仕事は何Jか。", choices:["1J","2J","3J","4J"], diff:"標準", a:1, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）【解説】仕事=力×距離=2×1=2Jである。【まちがえやすい点】ほかの選択肢（1J／3J）とのちがいをおさえておこう。"},
  {id:"phy71", cat:"物理", sub:"電流と回路(計算)", q:"12Vの電源に4Ωの抵抗をつないだとき流れる電流は何Aか。", choices:["2A","3A","4A","6A"], diff:"標準", a:1, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】電流=電圧÷抵抗=12÷4=3Aである。【まちがえやすい点】ほかの選択肢（2A／4A）とのちがいをおさえておこう。"},
  {id:"phy73", cat:"物理", sub:"力の働き(計算)", q:"質量100gの物体にはたらく重力の大きさをおよそ1Nとすると、500gの物体にはたらく重力の大きさはおよそ何Nか。", choices:["1N","2N","5N","10N"], diff:"標準", a:2, e:"【ことばの意味】「重力」＝地球が物体を引っぱる力／「質量」＝物体そのものの量（場所が変わっても変わらない）【解説】質量100gあたりおよそ1Nの重力がはたらくため、500gではおよそ5Nになる。【まちがえやすい点】ほかの選択肢（1N／2N）とのちがいをおさえておこう。"},
  {id:"phy75", cat:"物理", sub:"運動とエネルギー", q:"力学的エネルギーについての説明として誤っているものはどれか。", choices:["位置エネルギーと運動エネルギーの和を力学的エネルギーという","摩擦がなければ力学的エネルギーは保存される","物体が高い位置にあるほど位置エネルギーは小さい","物体の速さが速いほど運動エネルギーは大きい"], diff:"基礎", a:2, e:"【ことばの意味】「位置エネルギー」＝高い所にある物体がもつエネルギー／「力学的エネルギー」＝位置エネルギーと運動エネルギーの合計【解説】物体の位置が高いほど位置エネルギーは大きくなるため、「小さい」という記述は誤り。【まちがえやすい点】ほかの選択肢（位置エネルギーと運動エネルギーの和を力学的エ…／摩擦がなければ力学的エネルギーは保存される）とのちがいをおさえておこう。"},
  {id:"phy77", cat:"物理", sub:"光と音", q:"音の伝わり方についての説明として誤っているものはどれか。", choices:["音は物体の振動によって生じる","音は空気中を波として伝わる","音は真空中でも伝わる","音は固体・液体・気体のいずれの中でも伝わることができる"], diff:"基礎", a:2, e:"【解説】音は空気などの物質があってはじめて伝わる波であり、物質のない真空中では音は伝わらない。【まちがえやすい点】ほかの選択肢（音は物体の振動によって生じる／音は空気中を波として伝わる）とのちがいをおさえておこう。"},
  {id:"phy79", cat:"物理", sub:"電流と回路", q:"直列回路と並列回路についての説明として誤っているものはどれか。", choices:["直列回路では合成抵抗はそれぞれの抵抗の和になる","並列回路では合成抵抗はそれぞれの抵抗より小さくなる","直列回路に豆電球を追加すると、回路全体はより明るくなる","並列回路に豆電球を追加しても、他の豆電球の明るさはほとんど変わらない"], diff:"基礎", a:2, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「抵抗」＝電流の流れにくさ（単位Ω）【解説】直列回路に豆電球を追加すると回路全体の抵抗が増え、電流が小さくなるためそれぞれの豆電球はむしろ暗くなる。【まちがえやすい点】ほかの選択肢（直列回路では合成抵抗はそれぞれの抵抗の和にな…／並列回路では合成抵抗はそれぞれの抵抗より小さ…）とのちがいをおさえておこう。"},
  {id:"phy81", cat:"物理", sub:"運動とエネルギー", q:"慣性についての説明として誤っているものはどれか。", choices:["静止している物体は、力を加えられない限り静止し続けようとする","運動している物体は、力を加えられない限り等速直線運動を続けようとする","質量が大きい物体ほど慣性は小さい","電車が急停止すると、乗っている人は前のめりになる"], diff:"基礎", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「慣性」＝物体が今の運動の状態を続けようとする性質【解説】質量が大きい物体ほど運動状態を変えにくく、慣性は大きくなるため、「小さい」という記述は誤り。【まちがえやすい点】ほかの選択肢（静止している物体は、力を加えられない限り静止…／運動している物体は、力を加えられない限り等速…）とのちがいをおさえておこう。"},
  {id:"phy83", cat:"物理", sub:"電流と回路", q:"電力量と熱量についての説明として誤っているものはどれか。", choices:["電力量は電力と時間の積で求められる","電熱線から発生する熱量は電力と時間に関係する","電力量の単位にはジュール(J)を使うことができる","電力量は電流の大きさだけで決まり、電圧は関係しない"], diff:"標準", a:3, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】電力量は電力(電圧×電流)と時間の積で決まるため、電圧も関係する。【まちがえやすい点】ほかの選択肢（電力量は電力と時間の積で求められる／電熱線から発生する熱量は電力と時間に関係する）とのちがいをおさえておこう。"},
  {id:"phy85", cat:"物理", sub:"力の働き", q:"大気圧についての説明として正しいものはどれか。", choices:["大気圧は上空へ行くほど大きくなる","大気圧は上空へ行くほど小さくなる","大気圧はどの高さでも同じである","大気圧は液体の中でしかはたらかない"], diff:"基礎", a:1, e:"【解説】大気圧は上空に行くほど、上にある空気の量が少なくなるため小さくなる。【まちがえやすい点】ほかの選択肢（大気圧は上空へ行くほど大きくなる／大気圧はどの高さでも同じである）とのちがいをおさえておこう。"},
  {id:"phy87", cat:"物理", sub:"力の働き", q:"弾性力についての説明として正しいものはどれか。", choices:["弾性力は変形した物体がもとに戻ろうとする力である","弾性力はほとんどの物体で同じ大きさになる","弾性力は変形量に関係なく一定である","弾性力は液体にしかはたらかない"], diff:"基礎", a:0, e:"【解説】弾性力は変形した物体がもとの形に戻ろうとするときにはたらく力である。【まちがえやすい点】ほかの選択肢（弾性力はすべての物体で同じ大きさになる／弾性力は変形量に関係なく一定である）とのちがいをおさえておこう。"},
  {id:"phy89", cat:"物理", sub:"光と音", q:"波の性質についての説明として正しいものはどれか。", choices:["波長とは、波の1つの山から次の山までの距離のことである","波長とは、波が1秒間に進む距離のことである","振幅が大きくなると、それにともなって波長も長くなる","波はエネルギーを運ばず、形だけが移動する現象である"], diff:"基礎", a:0, e:"【解説】波長は波の山から次の山まで(または谷から次の谷まで)の距離を表す。【まちがえやすい点】ほかの選択肢（振幅が大きいほど波長も必ず長くなる／周期が短いほど振動数も小さくなる）とのちがいをおさえておこう。"},
  {id:"phy91", cat:"物理", sub:"エネルギーの利用", q:"エネルギーの変換についての説明として正しいものはどれか。", choices:["エネルギーが変換されるとき、その一部が熱として失われることが多い","エネルギーの変換では常に100%効率よく変換される","光エネルギーは電気エネルギーに変換できない","化学エネルギーは電気エネルギーに変換できない"], diff:"標準", a:0, e:"【解説】エネルギーを変換する際には、目的以外の熱エネルギーなどとして一部が失われることが多い。【まちがえやすい点】ほかの選択肢（エネルギーの変換では常に100%効率よく変換…／光エネルギーは電気エネルギーに変換できない）とのちがいをおさえておこう。"},
  {id:"phy93", cat:"物理", sub:"電流と回路", q:"電流計と電圧計についての説明として正しいものはどれか。", choices:["電流計は測定したい部分に直列につなぐ","電圧計は測定したい部分に直列につなぐ","電流計は測定したい部分に並列につなぐ","電圧計と電流計はどちらも同じようにつなげばよい"], diff:"基礎", a:0, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】電流計は回路に流れる電流を測定するため、測定したい部分に直列に接続する。【まちがえやすい点】ほかの選択肢（電圧計は測定したい部分に直列につなぐ／電流計は測定したい部分に並列につなぐ）とのちがいをおさえておこう。"},
  {id:"phy95", cat:"物理", sub:"光と音", q:"光の分散についての説明として正しいものはどれか。", choices:["白色光をプリズムに通すと、色によって屈折の仕方が異なるため分かれて見える","白色光をプリズムに通しても、色ごとの屈折は同じなので分かれない","光の分散は音でも同じように起こり、音の高さが分かれて聞こえる","光の分散は屈折ではなく、反射だけによって起こる現象である"], diff:"基礎", a:0, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること【解説】白色光には色々な色の光が混ざっており、屈折の仕方が色によって異なるためプリズムを通すと分かれて見える。【まちがえやすい点】ほかの選択肢（光の分散はすべての光で同じように起こり、色は…／光の分散は音の現象である）とのちがいをおさえておこう。"},
  {id:"phy97", cat:"物理", sub:"光と音", q:"凸レンズによる虚像についての説明として正しいものはどれか。", choices:["物体を焦点の内側に置くと、実物より大きな虚像が見える","虚像はスクリーンにうつすことができる","虚像はつねに物体より小さく見える","虚像は焦点の外側に物体を置いたときにできる"], diff:"基礎", a:0, e:"【ことばの意味】「焦点」＝レンズを通った平行な光が1点に集まる場所／「虚像」＝実際には光が集まっていないのに見える像。スクリーンには映らない【解説】物体を焦点の内側に置くと、凸レンズを通して実物より大きな虚像が見える(虫めがねのはたらき)。【まちがえやすい点】ほかの選択肢（虚像はスクリーンにうつすことができる／虚像は必ず物体より小さく見える）とのちがいをおさえておこう。"},
  {id:"phy99", cat:"物理", sub:"仕事とエネルギー", q:"仕事率についての説明として正しいものはどれか。", choices:["仕事率は単位時間あたりにする仕事の量を表す","仕事率は仕事の量だけで決まり、時間には関係しない","仕事率の単位はジュール(J)である","仕事率が大きいほど、同じ仕事をするのにより長い時間がかかる"], diff:"基礎", a:0, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）／「仕事率」＝1秒あたりにする仕事の量。単位はW【解説】仕事率は単位時間あたりにする仕事の大きさを表す量である。【まちがえやすい点】ほかの選択肢（仕事率は仕事の量だけで決まり、時間には関係し…／仕事率の単位はジュール(J)である）とのちがいをおさえておこう。"},
  {id:"phy101", cat:"物理", sub:"電流と回路", q:"電磁波についての説明として正しいものはどれか。", choices:["光や電波は電磁波の一種である","電磁波は音の一種である","電磁波はつねに物質を通してのみ伝わる","電磁波にはX線や赤外線はふくまれない"], diff:"基礎", a:0, e:"【解説】光・電波・赤外線・X線などはすべて電磁波の一種である。【まちがえやすい点】ほかの選択肢（電磁波は音の一種である／電磁波は必ず物質を通してのみ伝わる）とのちがいをおさえておこう。"},
  {id:"phy103", cat:"物理", sub:"光と音", q:"音の反射(エコー)についての説明として正しいものはどれか。", choices:["音は壁などに当たって反射することがある","音は反射せず、つねにまっすぐ進み続ける","音の反射は光の反射とは全く別の法則にしたがう","音は空気中でしか反射しない"], diff:"基礎", a:0, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること【解説】音も光と同じように、壁などの物体に当たって反射することがある。【まちがえやすい点】ほかの選択肢（音は反射せず、必ずまっすぐ進み続ける／音の反射は光の反射とは全く別の法則にしたがう）とのちがいをおさえておこう。"},
  {id:"phy105", cat:"物理", sub:"電流と回路", q:"電気分解と電池のちがいについての説明として正しいものはどれか。", choices:["電池は化学変化によって電気を取り出す装置である","電気分解は電気エネルギーを使わずに物質を分解する","電池と電気分解はほぼ同じしくみである","電気分解では電気エネルギーは発生しない"], diff:"標準", a:0, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること／「化学変化」＝物質そのものが別の物質に変わること【解説】電池は物質のもつ化学エネルギーを化学変化によって電気エネルギーに変える装置である。【まちがえやすい点】ほかの選択肢（電気分解は電気エネルギーを使わずに物質を分解…／電池と電気分解はまったく同じしくみである）とのちがいをおさえておこう。"},
  {id:"phy107", cat:"物理", sub:"エネルギーの利用", q:"太陽光発電についての説明として正しいものはどれか。", choices:["太陽光発電は光エネルギーを直接電気エネルギーに変換する","太陽光発電は化学エネルギーを利用する発電方法である","太陽光発電ではつねに大量の燃料が必要である","太陽光発電はタービンを回して発電する"], diff:"基礎", a:0, e:"【解説】太陽光発電は太陽電池を使い、光エネルギーを直接電気エネルギーに変換するしくみである。【まちがえやすい点】ほかの選択肢（太陽光発電は化学エネルギーを利用する発電方法…／太陽光発電では必ず大量の燃料が必要である）とのちがいをおさえておこう。"},
  {id:"phy109", cat:"物理", sub:"電流と回路", q:"電流のする仕事(電力量)についての説明として正しいものはどれか。", choices:["電力量は消費した電気エネルギーの総量を表す","電力量は時間に関係なく一定である","電力量は電圧だけで決まる","電力量の単位に秒(s)を使うことはできない"], diff:"基礎", a:0, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「電力」＝1秒あたりに使う電気エネルギーの量（単位W）【解説】電力量は消費した電気エネルギーの総量を表す量である。【まちがえやすい点】ほかの選択肢（電力量は時間に関係なく一定である／電力量は電圧だけで決まる）とのちがいをおさえておこう。"},
  {id:"phy111", cat:"物理", sub:"光と音", q:"音の高さと振動数の関係についての説明として正しいものはどれか。", choices:["振動数が多いほど高い音になる","振動数が多いほど低い音になる","振動数は音の大きさに関係する","振動数は音色だけに関係する"], diff:"基礎", a:0, e:"【ことばの意味】「振動数」＝1秒間に何回ふるえるかを表す数。多いほど高い音【解説】音の高さは振動数によって決まり、振動数が多いほど高い音になる。【まちがえやすい点】ほかの選択肢（振動数が多いほど低い音になる／振動数は音の大きさに関係する）とのちがいをおさえておこう。"},
  {id:"phy113", cat:"物理", sub:"力の働き", q:"力のつり合いと運動についての説明として正しいものはどれか。", choices:["物体にはたらく力がつり合っていれば","力がつり合っていれば物体はつねに静止する","力がつり合っていなくても物体の速さは変わらない","力のつり合いは運動にはほとんど関係しない"], diff:"基礎", a:0, e:"【解説】力がつり合っている物体は、静止し続けるか等速直線運動を続ける。【まちがえやすい点】ほかの選択肢（力がつり合っていれば物体は必ず静止する／力がつり合っていなくても物体の速さは変わらな…）とのちがいをおさえておこう。"},
  {id:"phy115", cat:"物理", sub:"浮力と水圧", q:"浮力の実験についての説明として正しいものはどれか。", choices:["空気中とばねばかりで水中の値をはかり、その差から浮力の大きさを求められる","浮力は空気中でのばねばかりの値とほぼ同じである","浮力の実験には水以外の液体は使えない","浮力はばねばかりでは測定できない"], diff:"標準", a:0, e:"【ことばの意味】「浮力」＝液体や気体の中で物体を上向きに押す力。／【実験のしかた】物体をばねばかりにつるし、まず空気中での重さを読み取ります。次に物体を水の中に沈めて、もう一度ばねばかりの値を読み取ります。この2つの値の差が浮力の大きさになります（空気中の値−水中の値＝浮力）。／【まちがえやすい点】水中の値は空気中より必ず小さくなります。浮力は水以外の液体（食塩水など）でも測定できます。"},
  {id:"phy117", cat:"物理", sub:"電流と回路", q:"電流のはたらきについての説明として正しいものはどれか。", choices:["電流には熱を発生させるはたらきがある","電流には光を発生させるはたらきはない","電流には磁界をつくるはたらきはない","電流には化学変化を起こすはたらきはない"], diff:"基礎", a:0, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）【解説】電流には発熱作用・発光作用・磁気作用・化学作用など、さまざまなはたらきがある。【まちがえやすい点】ほかの選択肢（電流には光を発生させるはたらきはない／電流には磁界をつくるはたらきはない）とのちがいをおさえておこう。"},
  {id:"phy119", cat:"物理", sub:"電流と回路", q:"電池のしくみについての説明として正しいものはどれか。", choices:["電池では、イオンになりやすい金属からイオンになりにくい金属へ電子が導線を通って移動する","電池では、イオンになりにくい金属からイオンになりやすい金属へ電子が移動する","電池の中では電子だけが動き、水溶液の中のイオンは一切移動しない","電池は2種類の金属の組み合わせにかかわらず、いつも同じ電圧が得られる"], diff:"標準", a:0, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの【解説】電池ではイオン化傾向の異なる金属間で電子が移動することで電流が流れるしくみになっている。【まちがえやすい点】ほかの選択肢（電池ではイオンの移動は一切起こらない／電池はどんな2種類の金属を使っても同じ電圧が…）とのちがいをおさえておこう。"},
  {id:"phy121", cat:"物理", sub:"運動とエネルギー", q:"力学的エネルギー保存の法則についての説明として正しいものはどれか。", choices:["摩擦や空気抵抗がなければ、力学的エネルギーの総和は一定に保たれる","摩擦や空気抵抗があっても、力学的エネルギーの総和は一定に保たれる","力学的エネルギーは時間がたつにつれて少しずつ増加していく","力学的エネルギーとは、位置エネルギーだけを指す言葉である"], diff:"基礎", a:0, e:"【ことばの意味】「抵抗」＝電流の流れにくさ（単位Ω）／「位置エネルギー」＝高い所にある物体がもつエネルギー【解説】摩擦や空気抵抗がない場合、位置エネルギーと運動エネルギーの和である力学的エネルギーは一定に保たれる。【まちがえやすい点】ほかの選択肢（摩擦があってもなくても、力学的エネルギーは必…／力学的エネルギーは常に増加し続ける）とのちがいをおさえておこう。"},
  {id:"phy123", cat:"物理", sub:"熱の伝わり方", q:"熱の対流についての説明として正しいものはどれか。", choices:["あたためられた水や空気は上に移動しやすい","あたためられた水や空気は下に移動しやすい","対流は固体の中でしか起こらない","対流は真空中でも起こる"], diff:"基礎", a:0, e:"【ことばの意味】「対流」＝あたたまった液体や気体が動いて熱を運ぶこと【解説】あたためられた水や空気は密度が小さくなり、上へ移動しやすくなる。【まちがえやすい点】ほかの選択肢（あたためられた水や空気は下に移動しやすい／対流は固体の中でしか起こらない）とのちがいをおさえておこう。"},
  {id:"phy125", cat:"物理", sub:"てこ", q:"てこの利用についての説明として正しいものはどれか。", choices:["はさみやペンチはてこの原理を利用した道具である","てこの原理を利用した道具は存在しない","てこの原理では支点の位置は常に真ん中に固定される","てこの原理を使うと仕事の量そのものを減らすことができる"], diff:"基礎", a:0, e:"【解説】はさみやペンチ、くぎぬきなど、身の回りにはてこの原理を利用した道具が多くある。【まちがえやすい点】ほかの選択肢（てこの原理を利用した道具は存在しない／てこの原理では支点の位置は常に真ん中に固定さ…）とのちがいをおさえておこう。"},
  {id:"phy127", cat:"物理", sub:"電流と回路", q:"電気用図記号についての説明として正しいものはどれか。", choices:["電気用図記号を使うと回路を簡単に表すことができる","電気用図記号は国によってほぼ同じ意味をもたない","電気用図記号には電池や抵抗を表す記号はない","電気用図記号を使うと回路の理解がかえって難しくなる"], diff:"基礎", a:0, e:"【解説】電気用図記号を使うことで、実物を描かなくても回路の構成を簡単に表すことができる。【まちがえやすい点】ほかの選択肢（電気用図記号は国によって全く同じ意味をもたな…／電気用図記号には電池や抵抗を表す記号はない）とのちがいをおさえておこう。"},
  {id:"phy129", cat:"物理", sub:"電流と回路", q:"電流計の使い方についての説明として誤っているものはどれか。", choices:["電流計は最も大きい測定範囲(レンジ)から使い始めるとよい","電流計を並列につなぐと大きな電流が流れて壊れることがある","電流計は必ず回路に並列につなぐ","電流計の-端子は電源の-極側につなぐ"], diff:"基礎", a:2, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「直列」＝電気の通り道が1本道のつなぎ方【解説】電流計は回路に流れる電流をはかるため、必ず直列につなぐ必要がある。「並列につなぐ」という記述は誤り。【まちがえやすい点】ほかの選択肢（電流計は最も大きい測定範囲(レンジ)から使い…／電流計を並列につなぐと大きな電流が流れて壊れ…）とのちがいをおさえておこう。"},
  {id:"phy131", cat:"物理", sub:"光と音", q:"音の共鳴・共振についての説明として誤っているものはどれか。", choices:["同じ振動数をもつ物体どうしは共鳴しやすい","共鳴は音だけでなく振動一般に見られる現象である","共鳴は全く異なる振動数の物体の間で最も強く起こる","ブランコを一定のタイミングでおすと大きく揺れるのも共振の一例である"], diff:"基礎", a:2, e:"【ことばの意味】「振動数」＝1秒間に何回ふるえるかを表す数。多いほど高い音【解説】共鳴・共振は振動数が近い(特に同じ)物体の間で強く起こる現象であり、「全く異なる振動数」で最も強く起こるという記述は誤り。【まちがえやすい点】ほかの選択肢（同じ振動数をもつ物体どうしは共鳴しやすい／共鳴は音だけでなく振動一般に見られる現象であ…）とのちがいをおさえておこう。"},
  {id:"phy133", cat:"物理", sub:"光と音", q:"光の三原色についての説明として誤っているものはどれか。", choices:["光の三原色は赤・緑・青である","光の三原色を重ねると白色に近づく","光の三原色は絵の具の三原色と全く同じ性質をもつ","テレビやスマートフォンの画面は光の三原色を利用して色を表現している"], diff:"基礎", a:2, e:"【解説】光の三原色(加法混色)と絵の具などの三原色(減法混色)は性質が異なり、混ぜたときの結果も異なる。【まちがえやすい点】ほかの選択肢（光の三原色は赤・緑・青である／光の三原色を重ねると白色に近づく）とのちがいをおさえておこう。"},
  {id:"phy135", cat:"物理", sub:"仕事とエネルギー", q:"仕事の原理についての説明として正しいものはどれか。", choices:["動滑車や斜面などの道具を使っても、同じ高さまで持ち上げる仕事の大きさは変わらない","道具を使うと仕事の大きさはつねに半分になる","道具を使うと仕事の大きさはつねに2倍になる","仕事の原理は動滑車にしか当てはまらない"], diff:"基礎", a:0, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）。／【仕事の原理】動滑車を使うと力は半分ですみますが、引くロープの長さは2倍必要になります。斜面を使うと力は小さくてすみますが、動く距離は長くなります。どちらも「力×距離」を計算すると、道具を使わずまっすぐ持ち上げたときと同じ値になります。／【まちがえやすい点】道具は「力を減らす代わりに距離を増やす」ものであり、仕事そのものを減らす魔法の道具ではありません。"},
  {id:"phy137", cat:"物理", sub:"光と音", q:"糸電話についての説明として正しいものはどれか。", choices:["糸電話は糸の振動を利用して音を伝えている","糸電話では音は空気中だけを伝わっている","糸をたるませても音の伝わり方は変わらない","糸電話に糸は必要ない"], diff:"基礎", a:0, e:"【解説】糸電話は声の振動が糸を伝わることで、離れた場所まで音を伝えるしくみになっている。【まちがえやすい点】ほかの選択肢（糸電話では音は空気中だけを伝わっている／糸をたるませても音の伝わり方は変わらない）とのちがいをおさえておこう。"},
  {id:"phy139", cat:"物理", sub:"力の働き", q:"ばねの直列つなぎと並列つなぎについての説明として正しいものはどれか。", choices:["同じばねを並列につなぐと、同じ力に対する伸びは1本のときより小さくなる","同じばねを直列につなぐと、同じ力に対する伸びは1本のときより小さくなる","ばねのつなぎ方を変えても伸び方はほとんど変わらない","ばねを複数使うとつねにフックの法則が成り立たなくなる"], diff:"基礎", a:0, e:"【ことばの意味】「直列」＝電気の通り道が1本道のつなぎ方／「並列」＝電気の通り道が枝分かれしているつなぎ方【解説】同じばねを並列につなぐと、1本あたりが支える力が小さくなるため、全体の伸びは1本のときより小さくなる。【まちがえやすい点】ほかの選択肢（同じばねを直列につなぐと、同じ力に対する伸び…／ばねのつなぎ方を変えても伸び方は全く変わらな…）とのちがいをおさえておこう。"},
  {id:"phy141", cat:"物理", sub:"エネルギーの利用", q:"化石燃料についての説明として正しいものはどれか。", choices:["石炭・石油・天然ガスは化石燃料の代表例である","化石燃料は燃やしても二酸化炭素を発生しない","化石燃料は無限にある資源である","化石燃料には水力エネルギーがふくまれる"], diff:"基礎", a:0, e:"【解説】石炭・石油・天然ガスは大昔の生物の死がいが変化してできた化石燃料の代表例である。【まちがえやすい点】ほかの選択肢（化石燃料は燃やしても二酸化炭素を発生しない／化石燃料は無限にある資源である）とのちがいをおさえておこう。"},
  {id:"phy143", cat:"物理", sub:"力の働き", q:"重心についての説明として正しいものはどれか。", choices:["重心とは物体の重さがつり合う1つの点とみなせる点である","重心とは、どんな物体でも必ず形の中心にくる点のことである","重心とは、物体の色や表面の模様によって決まる点である","重心の位置は、物体がたおれるかどうかとは関係のないものである"], diff:"基礎", a:0, e:"【ことばの意味】「重力」＝地球が物体を引っぱる力【解説】重心は、物体全体にはたらく重力が1点にはたらくとみなせる点である。【まちがえやすい点】ほかの選択肢（重心はすべての物体で中心にある／重心は物体の色によって決まる）とのちがいをおさえておこう。"},
  {id:"phy145", cat:"物理", sub:"光と音", q:"音の速さの測定についての説明として正しいものはどれか。", choices:["音が発生してから届くまでの時間と距離から、音の速さを求めることができる","音の速さは光の速さとほぼ同じ方法で測定しなければならない","音の速さは実験でしか求めることができず、計算では求められない","音の速さの測定には温度はほとんど関係がない"], diff:"標準", a:0, e:"【解説】音が発生してから届くまでの時間と距離がわかれば、速さ=距離÷時間の関係から音の速さを求めることができる。【まちがえやすい点】ほかの選択肢（音の速さは光の速さと全く同じ方法で測定しなけ…／音の速さは実験でしか求めることができず、計算…）とのちがいをおさえておこう。"},
  {id:"phy147", cat:"物理", sub:"力の働き", q:"力と運動の変化についての説明として正しいものはどれか。", choices:["力がはたらく向きと物体の運動の向きが同じとき","力がはたらいても物体の速さはけっして変化しない","力の大きさは物体の運動には全く影響しない","力がはたらく向きは運動には関係ない"], diff:"標準", a:0, e:"【解説】運動の向きと同じ向きに力がはたらくと、物体の速さは増加することが多い。【まちがえやすい点】ほかの選択肢（力がはたらいても物体の速さは絶対に変化しない／力の大きさは物体の運動には全く影響しない）とのちがいをおさえておこう。"},
  {id:"phy149", cat:"物理", sub:"光と音", q:"光の速さについての説明として正しいものはどれか。", choices:["光の速さは音の速さよりはるかに速い","光の速さは音の速さより遅い","光の速さと音の速さはほぼ同じである","光には速さという概念は存在しない"], diff:"基礎", a:0, e:"【解説】光の速さ(秒速約30万km)は、音の速さ(秒速約340m)よりはるかに速い。【まちがえやすい点】ほかの選択肢（光の速さは音の速さより遅い／光の速さと音の速さは全く同じである）とのちがいをおさえておこう。"},
  {id:"phy151", cat:"物理", sub:"力の働き", q:"力の合成と分解についての説明として正しいものはどれか。", choices:["2つの力を1つの力に置きかえることを力の合成という","1つの力を2つ以上の力に置きかえることを力の合成という","力の合成や分解では力の大きさは全く変化しない場合しかない","力の合成と分解は同じ意味の言葉である"], diff:"基礎", a:0, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること【解説】複数の力を、同じはたらきをする1つの力に置きかえることを力の合成という。【まちがえやすい点】ほかの選択肢（1つの力を2つ以上の力に置きかえることを力の…／力の合成や分解では力の大きさは全く変化しない…）とのちがいをおさえておこう。"},
  {id:"phy153", cat:"物理", sub:"てこ", q:"てこの利用の応用についての説明として正しいものはどれか。", choices:["支点・力点・作用点の位置関係によって、てこの利用のしかたが変わる","てこにはどんな道具にもほぼ同じ支点の位置がある","てこの原理は道具にしか応用できず、人体にはほとんど関係がない","くぎぬきは支点が最も端にある道具である"], diff:"基礎", a:0, e:"【解説】支点・力点・作用点の位置関係のちがいによって、てこの利用のしかたやはたらきが変わる。【まちがえやすい点】ほかの選択肢（てこにはどんな道具にも全く同じ支点の位置があ…／てこの原理は道具にしか応用できず、人体には全…）とのちがいをおさえておこう。"},
  {id:"phy155", cat:"物理", sub:"電流と回路", q:"電流計・電圧計の目盛りの読み方についての説明として正しいものはどれか。", choices:["針がふれた位置を、正面から目盛りを読み取ることが大切である","針がふれた位置を、斜めの角度から読み取るほうが正確になる","目盛りは目分量でよく、どこから読んでも結果は変わらない","電流計と電圧計は、いつも同じ−端子を使わなければならない"], diff:"基礎", a:0, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】針のふれた位置を正面から読み取ることで、目盛りを正確に読むことができる。【まちがえやすい点】ほかの選択肢（目盛りは斜めから読んでも正確に読み取れる／目盛りの読み方に決まりはない）とのちがいをおさえておこう。"},
  {id:"phy157", cat:"物理", sub:"力の働き", q:"力と圧力の違いについての説明として正しいものはどれか。", choices:["力の単位はニュートン(N)","力と圧力はほぼ同じ量であり、単位も同じである","圧力は力の向きだけを表す量である","力は面積に関係する量であり、圧力は関係しない"], diff:"基礎", a:0, e:"【ことばの意味】「圧力」＝面積あたりにかかる力（力÷面積）【解説】力の単位はニュートン(N)、圧力の単位はパスカル(Pa)であり、両者は異なる単位で表される量である。【まちがえやすい点】ほかの選択肢（力と圧力は全く同じ量であり、単位も同じである／圧力は力の向きだけを表す量である）とのちがいをおさえておこう。"},
  {id:"phy159", cat:"物理", sub:"光と音", q:"光の反射と鏡についての説明として正しいものはどれか。", choices:["平面鏡にうつる像は、実際の物体と左右が逆に見えることが多い","平面鏡にうつる像はつねに物体より大きく見える","鏡にうつる像は光を発しなくてもスクリーンにうつすことができる","鏡にうつる像はつねに物体と同じ場所に見える"], diff:"基礎", a:0, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること【解説】平面鏡にうつる像は、実際の物体と比べて左右が反転して見えることが多い。【まちがえやすい点】ほかの選択肢（平面鏡にうつる像は必ず物体より大きく見える／鏡にうつる像は光を発しなくてもスクリーンにう…）とのちがいをおさえておこう。"},
  {id:"phy161", cat:"物理", sub:"電流と回路", q:"電流のはたらきを利用した道具についての説明として正しいものはどれか。", choices:["電磁石を利用したモーターは身の回りの多くの製品に使われている","電流には磁石をつくるはたらきは全くない","電熱線を利用した道具には発熱のはたらきはほとんど利用されていない","電流を光に変える道具は存在しない"], diff:"基礎", a:0, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）【解説】電磁石を利用したモーターは、家電製品など身の回りの多くの製品に使われている。【まちがえやすい点】ほかの選択肢（電流には磁石をつくるはたらきは全くない／電熱線を利用した道具には発熱のはたらきは全く…）とのちがいをおさえておこう。"},
  {id:"phy163", cat:"物理", sub:"電流と回路", q:"電流と磁界を利用したモーターの回転の向きについての説明として正しいものはどれか。", choices:["電流の向きや磁界の向きを変えると、モーターの回転の向きが変わることがある","電流や磁界の向きを変えても、モーターの回転の向きは変わらない","モーターは電流を流さなくても、磁石の力だけで回転し続ける","モーターの回転の向きは製造時に決まり、あとから変えられない"], diff:"基礎", a:0, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「磁界」＝磁石の力がはたらいている空間【解説】電流の向きや磁界の向きを変えると、モーターにはたらく力の向きが変わり、回転の向きが変わることがある。【まちがえやすい点】ほかの選択肢（モーターの回転の向きは電流や磁界の向きには全…／モーターは電流を流さなくても回転し続ける）とのちがいをおさえておこう。"},
  {id:"phy165", cat:"物理", sub:"力の働き", q:"力と物体の変形についての説明として正しいものはどれか。", choices:["物体に力を加えると、形が変わったり運動のようすが変わったりすることがある","力を加えても物体の形はけっして変わらない","力を加えても物体はけっして変形しない","力の大きさは物体の変形にはほとんど関係しない"], diff:"基礎", a:0, e:"【ことばの意味】「力」＝物体の形を変えたり、動き方を変えたりするはたらきをするもの。／【力のはたらき】物体に力を加えると、①物体の形が変わる（ばねがのびる、粘土がへこむ）②物体の動く速さや向きが変わる、という2つの効果が起こることがあります。／【まちがえやすい点】「けっして変わらない」「けっして変形しない」という言い切りは、実際にはほとんどの物体に当てはまりません。力の大きさが変形の大きさに深く関係します（フックの法則など）。"},
  {id:"phy167", cat:"物理", sub:"電流と回路", q:"電力と電流・電圧の関係についてのグラフの読み取りとして正しいものはどれか。", choices:["電圧と電流のグラフの傾きから抵抗の大きさを求めることができる","電圧と電流のグラフの傾きは、抵抗ではなく電力量を直接表している","電圧と電流の関係をグラフにすると、いつも曲線になる","グラフからは電流の値だけがわかり、抵抗の大きさは求められない"], diff:"標準", a:0, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】オームの法則が成り立つとき、電圧と電流のグラフは直線になり、その傾きの逆数などから抵抗を求めることができる。【まちがえやすい点】ほかの選択肢（グラフの傾きは電力量を直接表す／電圧と電流のグラフは常に曲線になる）とのちがいをおさえておこう。"},
  {id:"phy169", cat:"物理", sub:"電流と回路", q:"磁石の性質の利用についての説明として正しいものはどれか。", choices:["方位磁針は地球の磁界を利用して方角を知る道具である","磁石にはN極とS極のどちらか一方しか存在しない","磁石はほとんどの金属を強く引きつける","磁石の性質は温度にほとんど関係しない"], diff:"基礎", a:0, e:"【ことばの意味】「磁界」＝磁石の力がはたらいている空間【解説】方位磁針は地球がもつ磁界を利用して、N極が北を指すようにできている道具である。【まちがえやすい点】ほかの選択肢（磁石にはN極とS極のどちらか一方しか存在しな…／磁石はすべての金属を強く引きつける）とのちがいをおさえておこう。"},
  {id:"phy171", cat:"物理", sub:"運動とエネルギー", q:"力のはたらく物体の運動についての説明として正しいものはどれか。", choices:["一定の力がはたらき続けると、物体の速さが変化し続けることがある","力がはたらくと物体はつねに同じ速さで動き続ける","力がはたらいても物体の運動には全く影響がない","力の向きは物体の運動の向きにはほとんど関係がない"], diff:"標準", a:0, e:"【解説】一定の力がはたらき続けると、物体の速さがしだいに変化し続けることがある(加速度運動)。【まちがえやすい点】ほかの選択肢（力がはたらくと物体は必ず同じ速さで動き続ける／力がはたらいても物体の運動には全く影響がない）とのちがいをおさえておこう。"},
  {id:"phy173", cat:"物理", sub:"光と音", q:"光と影についての説明として正しいものはどれか。", choices:["光源が近いほど、できる影は大きくなることが多い","影の大きさは光源との距離にほとんど関係しない","光がなくても影はできる","影は光が完全に通り抜けた場所にできる"], diff:"基礎", a:0, e:"【解説】光源が物体に近いほど、光の広がり方の影響でできる影が大きくなることが多い。【まちがえやすい点】ほかの選択肢（影の大きさは光源との距離に全く関係しない／光がなくても影はできる）とのちがいをおさえておこう。"},
  {id:"phy175", cat:"物理", sub:"熱の伝わり方", q:"熱と温度の変化についての説明として正しいものはどれか。", choices:["同じ熱量を加えても、質量が大きい物体ほど温度の上がり方は小さくなることが多い","熱量を加えても物体の温度はけっして変化しない","温度は熱量とほぼ同じ意味の量である","熱量の単位には度（℃）が使われる"], diff:"基礎", a:0, e:"【ことばの意味】「熱量」＝物体が受けとったり出したりする熱の量。単位はJ（ジュール）。「温度」＝物体のあたたかさ・冷たさの度合い。単位は℃。／【関係】同じ量の熱を加えても、質量が大きい（重い）物体ほど、その熱が全体に分散するため温度の上がり方は小さくなります。バケツ1杯の水とコップ1杯の水を同じ火で温めても、コップの水の方が早く熱くなるのはこのためです。／【まちがえやすい点】熱量と温度は別の量で、単位も違います（熱量：J、温度：℃）。"},
  {id:"phy177", cat:"物理", sub:"仕事とエネルギー", q:"力と仕事の関係についての説明として正しいものはどれか。", choices:["力を加えても物体が動かなければ、その方向についての仕事は0とみなされる","力を加えれば、物体が動かなくてもつねに大きな仕事をしたことになる","仕事の大きさは力の大きさだけで決まり、移動距離には関係しない","仕事は距離だけで決まり、力の大きさには関係しない"], diff:"基礎", a:0, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）【解説】仕事は力と移動距離の積で求められるため、力を加えても物体が動かなければ仕事は0とみなされる。【まちがえやすい点】ほかの選択肢（力を加えれば、物体が動かなくても必ず大きな仕…／仕事の大きさは力の大きさだけで決まり、移動距…）とのちがいをおさえておこう。"},
  {id:"phy179", cat:"物理", sub:"仕事とエネルギー", q:"力学的な仕事とエネルギーのまとめとして正しいものはどれか。", choices:["物体がもつ位置エネルギーと運動エネルギーの和を力学的エネルギーという","仕事をするとつねにエネルギーは失われるだけで増えることはない","エネルギーと仕事は全く関係のない量である","仕事の単位とエネルギーの単位は全く異なる"], diff:"基礎", a:0, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）【解説】仕事とエネルギーは密接に関係する量で、単位もどちらもジュール(J)が使われる。【まちがえやすい点】ほかの選択肢（仕事をすると必ずエネルギーは失われるだけで増…／エネルギーと仕事は全く関係のない量である）とのちがいをおさえておこう。"},
  {id:"che1", cat:"化学", sub:"物質のすがた", q:"液体が沸騰して気体に変化する温度を何というか。", choices:["融点","沸点","凝固点","氷点"], diff:"基礎", a:1, e:"【ことばの意味】「沸点」＝液体がふっとうして気体になる温度【解説】液体が沸騰し気体になるときの温度を沸点といい、物質によって決まった値をとる。【まちがえやすい点】ほかの選択肢（融点／凝固点）とのちがいをおさえておこう。"},
  {id:"che3", cat:"化学", sub:"気体の性質", q:"石灰水を白く濁らせる気体はどれか。", choices:["酸素","水素","二酸化炭素","アンモニア"], diff:"基礎", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】二酸化炭素を石灰水に通すと、炭酸カルシウムの白い沈殿ができて白く濁る。【まちがえやすい点】ほかの選択肢（酸素／水素）とのちがいをおさえておこう。"},
  {id:"che5", cat:"化学", sub:"水溶液とイオン", q:"塩化銅水溶液を電気分解すると陰極に何が生じるか。", choices:["塩素","銅","水素","酸素"], diff:"基礎", a:1, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】陰極では銅イオンが電子を受け取り、銅の単体として付着する。【まちがえやすい点】ほかの選択肢（塩素／水素）とのちがいをおさえておこう。"},
  {id:"che7", cat:"化学", sub:"化学変化と質量", q:"化学変化の前後で物質全体の質量が変わらないことを何の法則というか。", choices:["定比例の法則","質量保存の法則","倍数比例の法則","気体反応の法則"], diff:"基礎", a:1, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「化学変化」＝物質そのものが別の物質に変わること【解説】化学変化の前後で反応に関わった物質全体の質量は変化しないという法則である。【まちがえやすい点】ほかの選択肢（定比例の法則／倍数比例の法則）とのちがいをおさえておこう。"},
  {id:"che9", cat:"化学", sub:"酸・アルカリと中和", q:"酸性の水溶液にBTB溶液を加えると何色になるか。", choices:["青色","緑色","黄色","赤色"], diff:"基礎", a:2, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「アルカリ性」＝pHが7より大きい性質。赤リトマスを青にする【解説】BTB溶液は酸性で黄色、中性で緑色、アルカリ性で青色を示す。【まちがえやすい点】ほかの選択肢（青色／緑色）とのちがいをおさえておこう。"},
  {id:"che11", cat:"化学", sub:"化学変化と質量", q:"酸化銀を加熱すると、銀と何が発生するか。", choices:["水素","酸素","二酸化炭素","窒素"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「分解」＝1つの物質が2つ以上の物質に分かれること【解説】酸化銀を加熱すると分解が起こり、銀と酸素が発生する。【まちがえやすい点】ほかの選択肢（水素／二酸化炭素）とのちがいをおさえておこう。"},
  {id:"che13", cat:"化学", sub:"物質のすがた", q:"有機物の性質として正しいものはどれか。", choices:["燃えると二酸化炭素と水を出す","つねに気体である","炭素を含まない","電気を通しやすい"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】有機物は炭素を含み、燃やすと二酸化炭素と水ができる。無機物はそれ以外の物質である。【まちがえやすい点】ほかの選択肢（必ず気体である／炭素を含まない）とのちがいをおさえておこう。"},
  {id:"che15", cat:"化学", sub:"物質のすがた", q:"液体の混合物を、沸点のちがいを利用して分ける方法を何というか。", choices:["ろ過","蒸留","再結晶","昇華"], diff:"基礎", a:1, e:"【ことばの意味】「沸点」＝液体がふっとうして気体になる温度／「蒸留」＝沸点の違いを利用して液体を分ける方法【解説】液体の混合物を加熱し、沸点のちがいを利用して分ける方法を蒸留という。【まちがえやすい点】ほかの選択肢（ろ過／再結晶）とのちがいをおさえておこう。"},
  {id:"che17", cat:"化学", sub:"化学変化と質量", q:"酸化物から酸素をうばう化学変化を何というか。", choices:["酸化","還元","中和","昇華"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「還元」＝物質が酸素をうばわれること【解説】酸化物が酸素を失う化学変化を還元といい、酸化と還元は同時に起こることが多い。【まちがえやすい点】ほかの選択肢（酸化／中和）とのちがいをおさえておこう。"},
  {id:"che19", cat:"化学", sub:"物質のすがた", q:"原子についての説明として正しいものはどれか。", choices:["それ以上分けられない物質の最小単位","分子が集まったもの","電子だけでできている粒子","つねに気体である"], diff:"基礎", a:0, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】原子は化学変化でそれ以上分けることができない、物質をつくる最小の粒子である。【まちがえやすい点】ほかの選択肢（分子が集まったもの／電子だけでできている）とのちがいをおさえておこう。"},
  {id:"che21", cat:"化学", sub:"水溶液とイオン", q:"質量パーセント濃度の求め方として正しいものはどれか。", choices:["溶質の質量÷溶液の質量×100","溶質の質量÷溶媒の質量×100","溶媒の質量÷溶液の質量×100","溶液の質量÷溶質の質量×100"], diff:"標準", a:0, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）【解説】質量パーセント濃度は、溶液全体の質量に対する溶質の質量の割合を百分率で表したものである。【まちがえやすい点】ほかの選択肢（溶質の質量÷溶媒の質量×100／溶媒の質量÷溶液の質量×100）とのちがいをおさえておこう。"},
  {id:"che23", cat:"化学", sub:"化学変化と質量", q:"化学反応式で、矢印の左右で原子の種類と数はどうなっている必要があるか。", choices:["左右で同じでなければならない","左右で異なってもよい","原子の種類だけ同じでよい","数は無視してよい"], diff:"基礎", a:0, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「質量保存の法則」＝化学変化の前と後で全体の重さは変わらないという法則【解説】化学反応式は質量保存の法則に基づき、矢印の両側で原子の種類と数が等しくなるように係数を合わせる。【まちがえやすい点】ほかの選択肢（左右で異なってもよい／原子の種類だけ同じでよい）とのちがいをおさえておこう。"},
  {id:"che25", cat:"化学", sub:"電池とイオン", q:"電池において、電子が流れ出す極を何極というか。", choices:["+極","-極","中性極","接地極"], diff:"基礎", a:1, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの【解説】電池では、イオンになりやすい金属が電子を放出する-極となり、そこから導線へ電子が流れ出す。【まちがえやすい点】ほかの選択肢（+極／中性極）とのちがいをおさえておこう。"},
  {id:"che27", cat:"化学", sub:"物質のすがた", q:"1種類の物質だけでできているものを何というか。", choices:["純粋な物質(純物質)","2種類以上の金属を混ぜ合わせた金属","液体だけでできた溶液","粒子が大きいコロイド溶液"], diff:"基礎", a:0, e:"【解説】1種類の物質だけでできているものを純粋な物質(純物質)といい、2種類以上が混ざったものを混合物という。【まちがえやすい点】ほかの選択肢（合金／溶液）とのちがいをおさえておこう。"},
  {id:"che29", cat:"化学", sub:"酸・アルカリと中和", q:"フェノールフタレイン溶液は、アルカリ性の水溶液に加えると何色になるか。", choices:["色が変わらず無色のまま","赤色(赤紫色)になる","黄色になる","青色になる"], diff:"基礎", a:1, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「アルカリ性」＝pHが7より大きい性質。赤リトマスを青にする【解説】フェノールフタレイン溶液は酸性・中性では無色だが、アルカリ性になると赤色(赤紫色)に変化する。【まちがえやすい点】ほかの選択肢（無色のまま／黄色になる）とのちがいをおさえておこう。"},
  {id:"che31", cat:"化学", sub:"気体の性質", q:"空気より軽く水に溶けやすい気体を集めるのに適した方法はどれか。", choices:["上方置換法","下方置換法","水上置換法","ろ過"], diff:"基礎", a:0, e:"【解説】空気より軽く水に溶けやすい気体は、容器の上方に集まるように集める上方置換法が適している。【まちがえやすい点】ほかの選択肢（下方置換法／水上置換法）とのちがいをおさえておこう。"},
  {id:"che33", cat:"化学", sub:"化学変化と質量", q:"酸化銀を加熱して分解する実験で、火を消す前に必ず行う操作は何か。", choices:["ガラス管を石灰水から抜く","水を加える","すぐにふたをする","試験管を氷で冷やす"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「分解」＝1つの物質が2つ以上の物質に分かれること【解説】火を消す前にガラス管を石灰水から抜いておかないと、石灰水が逆流して試験管が割れる危険がある。【まちがえやすい点】ほかの選択肢（水を加える／すぐにふたをする）とのちがいをおさえておこう。"},
  {id:"che35", cat:"化学", sub:"化学変化と質量", q:"使い捨てカイロが温かくなるのは、主に何という反応が起こっているからか。", choices:["鉄が酸化する反応","氷がとける反応","水が蒸発する反応","物が冷える反応"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】カイロの中の鉄粉が空気中の酸素と結びつく酸化反応が起こり、その際に熱が発生する。【まちがえやすい点】ほかの選択肢（氷がとける反応／水が蒸発する反応）とのちがいをおさえておこう。"},
  {id:"che37", cat:"化学", sub:"物質のすがた", q:"密度が1cm³あたり1gより小さい物体を水に入れるとどうなるか。", choices:["浮く","沈む","水と同じ高さでとまる","すべて溶ける"], diff:"基礎", a:0, e:"【解説】水の密度は1cm³あたり約1gであり、それより密度が小さい物体は水に浮く。【まちがえやすい点】ほかの選択肢（沈む／水と同じ高さでとまる）とのちがいをおさえておこう。"},
  {id:"che39", cat:"化学", sub:"物質のすがた", q:"溶解度の差を利用して、溶けきれなくなった物質を結晶として取り出す操作を何というか。", choices:["再結晶","蒸留","ろ過","中和"], diff:"基礎", a:0, e:"【ことばの意味】「溶解度」＝決まった量の水にとける最大の量／「再結晶」＝温度を下げて結晶を取り出すこと【解説】温度による溶解度のちがいを利用し、溶液を冷やすなどして結晶を取り出す操作を再結晶という。【まちがえやすい点】ほかの選択肢（蒸留／ろ過）とのちがいをおさえておこう。"},
  {id:"che41", cat:"化学", sub:"物質のすがた", q:"氷がとけている間、加熱を続けても温度はどうなるか。", choices:["一定に保たれる","上がり続ける","下がり続ける","急激に変化する"], diff:"基礎", a:0, e:"【ことばの意味】「状態変化」＝固体・液体・気体と姿が変わること。物質は変わらない【解説】状態変化をしている間は加えた熱が状態変化のために使われるため、温度は変化せず一定に保たれる。【まちがえやすい点】ほかの選択肢（上がり続ける／下がり続ける）とのちがいをおさえておこう。"},
  {id:"che43", cat:"化学", sub:"水溶液とイオン", q:"水に溶けにくい物質が反応によって生じ、底に沈む現象を何というか。", choices:["沈殿","蒸発","昇華","中和"], diff:"基礎", a:0, e:"【解説】水に溶けにくい物質が反応によって生じ、底に沈む現象を沈殿という。【まちがえやすい点】ほかの選択肢（蒸発／昇華）とのちがいをおさえておこう。"},
  {id:"che45", cat:"化学", sub:"化学式", q:"水の化学式はどれか。", choices:["H2O","CO2","O2","NaCl"], diff:"基礎", a:0, e:"【解説】水は水素原子2個と酸素原子1個からなり、化学式ではH2Oと表す。【まちがえやすい点】ほかの選択肢（CO2／O2）とのちがいをおさえておこう。"},
  {id:"che47", cat:"化学", sub:"化学式", q:"酸素の化学式はどれか。", choices:["O2","O","O3","H2O"], diff:"基礎", a:0, e:"【解説】酸素は酸素原子2個が結びついた分子で、化学式ではO2と表す。【まちがえやすい点】ほかの選択肢（O／O3）とのちがいをおさえておこう。"},
  {id:"che49", cat:"化学", sub:"化学式", q:"塩化ナトリウム(食塩)の化学式はどれか。", choices:["NaCl","NaOH","Na2O","NaHCO3"], diff:"基礎", a:0, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】塩化ナトリウムはナトリウムと塩素からなり、化学式ではNaClと表す。【まちがえやすい点】ほかの選択肢（NaOH／Na2O）とのちがいをおさえておこう。"},
  {id:"che51", cat:"化学", sub:"化学式", q:"水酸化ナトリウムの化学式はどれか。", choices:["NaOH","NaCl","Na2CO3","NaHCO3"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】水酸化ナトリウムはナトリウム・酸素・水素からなり、化学式ではNaOHと表す。【まちがえやすい点】ほかの選択肢（NaCl／Na2CO3）とのちがいをおさえておこう。"},
  {id:"che53", cat:"化学", sub:"化学式", q:"硫化鉄の化学式はどれか。", choices:["FeS","Fe2O3","FeCl2","FeS2"], diff:"基礎", a:0, e:"【解説】鉄と硫黄が1:1の割合で結びついた硫化鉄の化学式はFeSである。【まちがえやすい点】ほかの選択肢（Fe2O3／FeCl2）とのちがいをおさえておこう。"},
  {id:"che55", cat:"化学", sub:"化学式", q:"炭酸カルシウムの化学式はどれか。", choices:["CaCO3","CaO","Ca(OH)2","CaCl2"], diff:"基礎", a:0, e:"【解説】石灰石や貝がらの主成分である炭酸カルシウムの化学式はCaCO3である。【まちがえやすい点】ほかの選択肢（CaO／Ca(OH)2）とのちがいをおさえておこう。"},
  {id:"che57", cat:"化学", sub:"化学式", q:"塩化銅の化学式はどれか。", choices:["CuCl2","CuCl","CuO","CuSO4"], diff:"基礎", a:0, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】銅と塩素が1:2の割合で結びついた塩化銅の化学式はCuCl2である。【まちがえやすい点】ほかの選択肢（CuCl／CuO）とのちがいをおさえておこう。"},
  {id:"che59", cat:"化学", sub:"化学式", q:"硫酸の化学式はどれか。", choices:["H2SO4","HCl","HNO3","H2S"], diff:"基礎", a:0, e:"【解説】硫酸は水素・硫黄・酸素からなる強い酸で、化学式ではH2SO4と表す。【まちがえやすい点】ほかの選択肢（HCl／HNO3）とのちがいをおさえておこう。"},
  {id:"che61", cat:"化学", sub:"化学反応式", q:"鉄と硫黄が反応して硫化鉄ができる化学変化を表す式はどれか。", choices:["Fe+S→FeS","Fe+S2→FeS2","2Fe+S→Fe2S","Fe+2S→FeS2"], diff:"基礎", a:0, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】鉄と硫黄は1:1の割合で結びつき、Fe+S→FeSという反応式で表される。【まちがえやすい点】ほかの選択肢（Fe+S2→FeS2／2Fe+S→Fe2S）とのちがいをおさえておこう。"},
  {id:"che63", cat:"化学", sub:"水溶液の濃度(計算)", q:"90gの水に10gの食塩を溶かした食塩水の質量パーセント濃度は何%か。", choices:["5%","9%","10%","11%"], diff:"標準", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】質量パーセント濃度=10÷(90+10)×100=10%である。【まちがえやすい点】ほかの選択肢（5%／9%）とのちがいをおさえておこう。"},
  {id:"che65", cat:"化学", sub:"密度(計算)", q:"体積20cm³、質量60gの物体の密度は何g/cm³か。", choices:["1g/cm³","2g/cm³","3g/cm³","4g/cm³"], diff:"基礎", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）【解説】密度=質量÷体積=60÷20=3g/cm³である。【まちがえやすい点】ほかの選択肢（1g/cm³／2g/cm³）とのちがいをおさえておこう。"},
  {id:"che67", cat:"化学", sub:"質量保存の法則(計算)", q:"マグネシウム3gを空気中で加熱すると酸化マグネシウム5gができた。結びついた酸素は何gか。", choices:["1g","2g","3g","4g"], diff:"標準", a:1, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「酸化」＝物質が酸素と結びつくこと【解説】結びついた酸素の質量=できた酸化マグネシウムの質量-もとのマグネシウムの質量=5-3=2gである。【まちがえやすい点】ほかの選択肢（1g／3g）とのちがいをおさえておこう。"},
  {id:"che69", cat:"化学", sub:"溶解度(計算)", q:"ある物質の水100gに対する溶解度が40gである。すでに20g溶かしてあるとき、あと何gまで溶かすことができるか。", choices:["10g","20g","30g","40g"], diff:"標準", a:1, e:"【ことばの意味】「溶解度」＝決まった量の水にとける最大の量【解説】あと溶かせる量=溶解度-すでに溶けている量=40-20=20gである。【まちがえやすい点】ほかの選択肢（10g／30g）とのちがいをおさえておこう。"},
  {id:"che71", cat:"化学", sub:"酸・アルカリと中和", q:"中和についての説明として誤っているものはどれか。", choices:["酸とアルカリを混ぜると必ず完全に中和が起こる","塩酸と水酸化ナトリウム水溶液がちょうど中和すると塩化ナトリウムと水ができる","中和は酸性とアルカリ性の性質を打ち消し合う反応である","BTB溶液を使うと中和が進んだかどうかを色で確認できる"], diff:"基礎", a:0, e:"【ことばの意味】「中和」＝酸とアルカリが反応して塩と水ができること／「酸性」＝pHが7より小さい性質。青リトマスを赤にする【解説】酸とアルカリを混ぜても、量や濃度によっては完全に中和せず、酸性やアルカリ性が残ることがある。【まちがえやすい点】ほかの選択肢（塩酸と水酸化ナトリウム水溶液がちょうど中和す…／中和は酸性とアルカリ性の性質を打ち消し合う反…）とのちがいをおさえておこう。"},
  {id:"che73", cat:"化学", sub:"物質のすがた", q:"有機物と無機物についての説明として誤っているものはどれか。", choices:["有機物は炭素をふくむ物質である","食塩や金属は無機物に分類される","有機物はすべて気体である","砂糖やろうそくは有機物である"], diff:"基礎", a:2, e:"【解説】有機物には固体・液体・気体などさまざまな状態のものがあり、「すべて気体である」という記述は誤り。【まちがえやすい点】ほかの選択肢（有機物は炭素をふくむ物質である／食塩や金属は無機物に分類される）とのちがいをおさえておこう。"},
  {id:"che75", cat:"化学", sub:"水溶液とイオン", q:"電気分解についての説明として誤っているものはどれか。", choices:["水を電気分解すると水素と酸素が発生する","塩化銅水溶液を電気分解すると銅と塩素が生じる","電気分解では必ず金属だけが得られる","電気分解には電気エネルギーが必要である"], diff:"基礎", a:2, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること【解説】電気分解では気体が発生する場合もあり、必ずしも金属だけが得られるわけではない。【まちがえやすい点】ほかの選択肢（水を電気分解すると水素と酸素が発生する／塩化銅水溶液を電気分解すると銅と塩素が生じる）とのちがいをおさえておこう。"},
  {id:"che77", cat:"化学", sub:"物質のすがた", q:"状態変化についての説明として誤っているものはどれか。", choices:["状態変化が起きても物質の質量は変化しない","状態変化が起きると物質の粒子の運動のようすが変化する","状態変化によって物質の種類が別のものに変わる","状態変化中は温度が一定に保たれることが多い"], diff:"基礎", a:2, e:"【ことばの意味】「状態変化」＝固体・液体・気体と姿が変わること。物質は変わらない【解説】状態変化は同じ物質が固体・液体・気体と姿を変えるだけで、物質そのものの種類が変わるわけではない。【まちがえやすい点】ほかの選択肢（状態変化が起きても物質の質量は変化しない／状態変化が起きると物質の粒子の運動のようすが…）とのちがいをおさえておこう。"},
  {id:"che79", cat:"化学", sub:"酸・アルカリと中和", q:"酸性・中性・アルカリ性についての説明として誤っているものはどれか。", choices:["酸性の水溶液は青色リトマス紙を赤色に変える","アルカリ性の水溶液は赤色リトマス紙を青色に変える","中性の水溶液はどちらのリトマス紙の色も変えない","すべての水溶液は必ず酸性かアルカリ性のどちらかである"], diff:"基礎", a:3, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「アルカリ性」＝pHが7より大きい性質。赤リトマスを青にする【解説】水溶液には酸性・中性・アルカリ性があり、すべてが酸性かアルカリ性のどちらかというわけではない。【まちがえやすい点】ほかの選択肢（酸性の水溶液は青色リトマス紙を赤色に変える／アルカリ性の水溶液は赤色リトマス紙を青色に変…）とのちがいをおさえておこう。"},
  {id:"che81", cat:"化学", sub:"化学変化と質量", q:"化学変化と質量についての説明として誤っているものはどれか。", choices:["化学変化の前後で物質全体の質量は変わらない","気体が発生する反応を開放容器で行うと、見かけの質量が減ることがある","化学変化が起こると、必ず全体の質量は増加する","密閉容器内で反応させれば、反応の前後で全体の質量は変わらない"], diff:"基礎", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「化学変化」＝物質そのものが別の物質に変わること【解説】化学変化の前後で全体の質量は変化しない(質量保存の法則)。「必ず増加する」という記述は誤り。【まちがえやすい点】ほかの選択肢（化学変化の前後で物質全体の質量は変わらない／気体が発生する反応を開放容器で行うと、見かけ…）とのちがいをおさえておこう。"},
  {id:"che83", cat:"化学", sub:"気体の性質", q:"気体の集め方についての説明として誤っているものはどれか。", choices:["水に溶けにくい気体は水上置換法で集めることが多い","空気より軽く水に溶けやすい気体は上方置換法で集めることが多い","空気より重く水に溶けやすい気体は下方置換法で集めることが多い","どんな気体でも必ず水上置換法で集めるべきである"], diff:"基礎", a:3, e:"【解説】気体の集め方は、その気体が水に溶けやすいかどうかや空気より重いか軽いかによって使い分ける必要があり、必ず水上置換法が適しているわけではない。【まちがえやすい点】ほかの選択肢（水に溶けにくい気体は水上置換法で集めることが…／空気より軽く水に溶けやすい気体は上方置換法で…）とのちがいをおさえておこう。"},
  {id:"che85", cat:"化学", sub:"物質のすがた", q:"単体と化合物についての説明として正しいものはどれか。", choices:["単体は1種類の元素だけからできている物質である","化合物は1種類の元素だけからできている物質である","単体と化合物はどちらも2種類以上の元素からできている","単体には元素という概念は関係ない"], diff:"基礎", a:0, e:"【ことばの意味】「化合」＝2種類以上の物質が結びついて別の物質になること【解説】単体は1種類の元素だけからできている物質であり、化合物は2種類以上の元素からできている物質である。【まちがえやすい点】ほかの選択肢（化合物は1種類の元素だけからできている物質で…／単体と化合物はどちらも2種類以上の元素からで…）とのちがいをおさえておこう。"},
  {id:"che89", cat:"化学", sub:"化学変化と質量", q:"触媒についての説明として正しいものはどれか。", choices:["触媒は反応の前後で自身は変化せず、反応の速さを変える","触媒は反応後につねに別の物質に変わってしまう","触媒を使うと反応で得られる生成物の種類が変わる","触媒はほとんどの反応で同じように使うことができる"], diff:"基礎", a:0, e:"【解説】触媒は反応の前後で自身は変化せず、反応の速さを変えるはたらきをもつ物質である。【まちがえやすい点】ほかの選択肢（触媒は反応後に必ず別の物質に変わってしまう／触媒を使うと反応で得られる生成物の種類が変わ…）とのちがいをおさえておこう。"},
  {id:"che91", cat:"化学", sub:"酸・アルカリと中和", q:"pH(ピーエイチ)についての説明として正しいものはどれか。", choices:["pHの値が7より小さいほど酸性が強い","pHの値が7より大きいほど酸性が強い","pHは常に7で一定である","pHは酸性・アルカリ性とは無関係の量である"], diff:"基礎", a:0, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「アルカリ性」＝pHが7より大きい性質。赤リトマスを青にする【解説】pHは水溶液の酸性・アルカリ性の強さを表す数値で、7が中性、7より小さいほど酸性が強い。【まちがえやすい点】ほかの選択肢（pHの値が7より大きいほど酸性が強い／pHは常に7で一定である）とのちがいをおさえておこう。"},
  {id:"che93", cat:"化学", sub:"物質のすがた", q:"プラスチックについての説明として正しいものはどれか。", choices:["プラスチックは主に石油を原料としてつくられることが多い","プラスチックは主に鉄などの金属を原料としてつくられている","プラスチックは土の中に埋めるとすぐに自然に分解されてしまう","プラスチックには金属と同じく電気をよく通す性質がある"], diff:"基礎", a:0, e:"【解説】プラスチックの多くは石油を原料としてつくられる合成樹脂である。【まちがえやすい点】ほかの選択肢（プラスチックはすべて自然に分解されやすい／プラスチックには電気を通しやすいという共通の…）とのちがいをおさえておこう。"},
  {id:"che95", cat:"化学", sub:"環境と化学", q:"酸性雨についての説明として正しいものはどれか。", choices:["酸性雨は大気中の物質が雨水に溶けこんでできることがある","酸性雨はアルカリ性の雨のことである","酸性雨は建物や森林にほとんど影響をあたえない","酸性雨には二酸化炭素は関係しない"], diff:"標準", a:0, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「酸化」＝物質が酸素と結びつくこと【解説】酸性雨は大気中の硫黄酸化物やちっ素酸化物などが雨水に溶けこむことでできると考えられている。【まちがえやすい点】ほかの選択肢（酸性雨はアルカリ性の雨のことである／酸性雨は建物や森林に全く影響をあたえない）とのちがいをおさえておこう。"},
  {id:"che97", cat:"化学", sub:"気体の性質", q:"気体の性質のまとめについて正しいものはどれか。", choices:["二酸化炭素は空気より重い気体である","水素は空気より重い気体である","アンモニアは空気より重い気体である","酸素は空気より非常に軽い気体である"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】二酸化炭素は空気より重い気体で、下方置換法で集めることができる。【まちがえやすい点】ほかの選択肢（水素は空気より重い気体である／アンモニアは空気より重い気体である）とのちがいをおさえておこう。"},
  {id:"che99", cat:"化学", sub:"物質のすがた", q:"混合物の分離についてのまとめとして正しいものはどれか。", choices:["ろ過は固体と液体を分けるのに適した方法である","蒸留は固体どうしを分けるのに適した方法である","再結晶は気体どうしを分けるのに適した方法である","混合物はどんな方法でも同じように分けられる"], diff:"基礎", a:0, e:"【解説】ろ過は固体と液体の混合物を分けるのに適した方法である。【まちがえやすい点】ほかの選択肢（蒸留は固体どうしを分けるのに適した方法である／再結晶は気体どうしを分けるのに適した方法であ…）とのちがいをおさえておこう。"},
  {id:"che101", cat:"化学", sub:"気体の性質", q:"気体の集め方のまとめとして正しいものはどれか。", choices:["気体の集め方は、その気体の水への溶けやすさと空気との重さの比較で決まることが多い","気体の集め方は種類にかかわらず、すべて水上置換法に決まっている","気体の集め方を決めるとき、空気との重さのちがいは関係がない","水にとけやすい気体でも、水上置換法で純粋に集めることができる"], diff:"基礎", a:0, e:"【ことばの意味】「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）【解説】気体の集め方は、水への溶けやすさや空気との重さの比較によって使い分けられることが多い。【まちがえやすい点】ほかの選択肢（すべての気体は同じ方法で集めなければならない／気体の集め方に空気との重さの違いは関係ない）とのちがいをおさえておこう。"},
  {id:"che103", cat:"化学", sub:"水溶液とイオン", q:"イオンについての説明として誤っているものはどれか。", choices:["原子が電子を失うと陽イオンになる","原子が電子を受け取ると陰イオンになる","イオンはすべて陽イオンである","イオンには+の電気を帯びたものと-の電気を帯びたものがある"], diff:"基礎", a:2, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「陽イオン」＝電子を失って＋の電気を帯びたイオン【解説】イオンには陽イオン(+の電気)と陰イオン(-の電気)があり、「すべて陽イオン」という記述は誤り。【まちがえやすい点】ほかの選択肢（原子が電子を失うと陽イオンになる／原子が電子を受け取ると陰イオンになる）とのちがいをおさえておこう。"},
  {id:"che105", cat:"化学", sub:"水溶液とイオン", q:"電気分解の利用についての説明として誤っているものはどれか。", choices:["電気分解はめっきに利用されることがある","電気分解は金属の精錬に利用されることがある","電気分解には必ず高温の炎が必要である","電気分解には電気エネルギーが必要である"], diff:"基礎", a:2, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと【解説】電気分解は電流を流すことで進む反応であり、必ずしも炎(燃焼)を必要とするわけではない。【まちがえやすい点】ほかの選択肢（電気分解はめっきに利用されることがある／電気分解は金属の精錬に利用されることがある）とのちがいをおさえておこう。"},
  {id:"che107", cat:"化学", sub:"物質のすがた", q:"有機物の燃焼についての説明として誤っているものはどれか。", choices:["有機物を燃やすと二酸化炭素と水ができることが多い","有機物には炭素と水素がふくまれていることが多い","有機物を燃やしても二酸化炭素は絶対に発生しない","石灰水を使うと燃焼で二酸化炭素が発生したか確認できる"], diff:"基礎", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと【解説】有機物には炭素がふくまれているため、燃やすと二酸化炭素が発生することが多く、「絶対に発生しない」という記述は誤り。【まちがえやすい点】ほかの選択肢（有機物を燃やすと二酸化炭素と水ができることが…／有機物には炭素と水素がふくまれていることが多…）とのちがいをおさえておこう。"},
  {id:"che109", cat:"化学", sub:"気体の性質", q:"気体が発生する反応についての説明として誤っているものはどれか。", choices:["うすい塩酸に亜鉛を加えると水素が発生する","石灰石にうすい塩酸を加えると二酸化炭素が発生する","過酸化水素水に二酸化マンガンを加えると酸素が発生する","気体が発生する反応はすべて危険で行うべきではない"], diff:"基礎", a:3, e:"【解説】適切な安全対策のもとで行えば、気体が発生する実験の多くは学校の授業でも安全に行うことができる。【まちがえやすい点】ほかの選択肢（うすい塩酸に亜鉛を加えると水素が発生する／石灰石にうすい塩酸を加えると二酸化炭素が発生…）とのちがいをおさえておこう。"},
  {id:"che111", cat:"化学", sub:"物質のすがた", q:"金属と非金属についての説明として誤っているものはどれか。", choices:["金属には電気を通しやすいと考えられている","非金属には電気を通しにくいものが多い","すべての物質は金属か非金属のどちらかに完全に分類され","炭素やイオウは非金属の例と考えられている"], diff:"基礎", a:2, e:"【解説】実際にはケイ素のように金属と非金属の中間的な性質をもつ物質もあり、単純に二分できるわけではない。【まちがえやすい点】ほかの選択肢（金属には電気を通しやすいという性質がある／非金属には電気を通しにくいものが多い）とのちがいをおさえておこう。"},
  {id:"che113", cat:"化学", sub:"水溶液とイオン", q:"イオン化と電離についての説明として誤っているものはどれか。", choices:["電解質は水に溶けるとイオンに分かれる(電離する)","非電解質は水に溶けても電離しない","砂糖水は電離するため電流を流すことができる","塩化ナトリウムは水に溶けるとナトリウムイオンと塩化物イオンに分かれる"], diff:"基礎", a:2, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「電解質」＝水にとかすと電気を通す物質【解説】砂糖は非電解質であり、水に溶けても電離しないため、砂糖水は電流をほとんど流さない。【まちがえやすい点】ほかの選択肢（電解質は水に溶けるとイオンに分かれる(電離す…／非電解質は水に溶けても電離しない）とのちがいをおさえておこう。"},
  {id:"che115", cat:"化学", sub:"気体の性質", q:"気体の性質の利用についての説明として誤っているものはどれか。", choices:["二酸化炭素は消火器に利用されることがある","酸素はものを燃やす実験に利用されることがある","水素は現在、燃料電池自動車などに利用され始めている","アンモニアはものを燃やすはたらきが最も強い気体である"], diff:"基礎", a:3, e:"【解説】ものを燃やすはたらき(助燃性)が強いのは酸素であり、アンモニアにはそのような性質はない。【まちがえやすい点】ほかの選択肢（二酸化炭素は消火器に利用されることがある／酸素はものを燃やす実験に利用されることがある）とのちがいをおさえておこう。"},
  {id:"che117", cat:"化学", sub:"物質のすがた", q:"単体の例についての説明として誤っているものはどれか。", choices:["酸素は単体の一例である","鉄は単体の一例である","水は単体の一例である","水素は単体の一例である"], diff:"基礎", a:2, e:"【ことばの意味】「化合」＝2種類以上の物質が結びついて別の物質になること【解説】水は酸素と水素という2種類の元素からなる化合物であり、単体ではない。【まちがえやすい点】ほかの選択肢（酸素は単体の一例である／鉄は単体の一例である）とのちがいをおさえておこう。"},
  {id:"che143", cat:"化学", sub:"触媒", q:"触媒についての説明として正しいものはどれか。", choices:["反応の速さを変えるが、反応の前後で自分自身は変化しない物質である","反応の速さを変え、反応が終わると別の物質に変わってしまう物質である","反応の速さは変えないが、できる物質の種類を変えるはたらきをもつ","反応の速さをおそくするだけで、速めることはできない物質である"], diff:"基礎", a:0, e:"【解説】触媒：活性化エネルギー低下(E_a減)。平衡不変。反応速度↑。再生可能。【誤答説明】平衡不変(選択肢2)。活性化エネルギー減少(選択肢3)。速度加速(選択肢4)。工業化学の鍵。【まちがえやすい点】ほかの選択肢（触媒は反応の平衡定数を変える／触媒は反応の活性化エネルギーを上げる）とのちがいをおさえておこう。"},
  {id:"che118", cat:"化学", sub:"物質のすがた", q:"化学変化と物理変化についての説明として正しいものはどれか。", choices:["状態変化は物理変化の一例である","燃焼は物理変化の一例である","化学変化では物質の種類は変化しない","物理変化では新しい物質ができることが多い"], diff:"基礎", a:0, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること／「状態変化」＝固体・液体・気体と姿が変わること。物質は変わらない【解説】状態変化は物質そのものは変わらず姿だけが変わる物理変化の一例である。【まちがえやすい点】ほかの選択肢（燃焼は物理変化の一例である／化学変化では物質の種類は変化しない）とのちがいをおさえておこう。"},
  {id:"che120", cat:"化学", sub:"物質のすがた", q:"塩化ナトリウムの性質についての説明として正しいものはどれか。", choices:["塩化ナトリウムは水によく溶ける","塩化ナトリウムは水に全く溶けない","塩化ナトリウムの結晶(固体)は電流をよく流す","塩化ナトリウムはイオン結合を含まない物質である"], diff:"基礎", a:0, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】塩化ナトリウムはナトリウムイオンと塩化物イオンがイオン結合してできた物質で、水によく溶ける。【まちがえやすい点】ほかの選択肢（塩化ナトリウムは水に全く溶けない／塩化ナトリウムの結晶(固体)は電流をよく流す）とのちがいをおさえておこう。"},
  {id:"che122", cat:"化学", sub:"電池とイオン", q:"電池の利用についての説明として正しいものはどれか。", choices:["携帯機器には化学電池がよく利用されている","ほとんどの電池は繰り返し充電できる","電池は化学変化を利用せずに電気をつくる装置である","電池には金属を全く使わないものだけがある"], diff:"基礎", a:0, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】スマートフォンや電子機器の多くは、化学変化を利用した電池(バッテリー)で動いている。【まちがえやすい点】ほかの選択肢（すべての電池は繰り返し充電できる／電池は化学変化を利用せずに電気をつくる装置で…）とのちがいをおさえておこう。"},
  {id:"che124", cat:"化学", sub:"水溶液とイオン", q:"うすい塩酸と金属の反応についての説明として正しいものはどれか。", choices:["うすい塩酸にマグネシウムを加えると水素が発生する","うすい塩酸に銅を加えると激しく反応して気体が発生する","うすい塩酸に金を加えると激しく反応する","うすい塩酸はどんな金属とも同じように反応する"], diff:"基礎", a:0, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】マグネシウムのような反応性の高い金属はうすい塩酸と反応して水素を発生するが、銅や金のように反応しにくい金属もある。【まちがえやすい点】ほかの選択肢（うすい塩酸に銅を加えると激しく反応して気体が…／うすい塩酸に金を加えると激しく反応する）とのちがいをおさえておこう。"},
  {id:"che126", cat:"化学", sub:"気体の性質", q:"気体の重さについての説明として正しいものはどれか。", choices:["気体にも重さがある","気体には重さが全くない","気体の重さは温度に関係なく常に一定である","気体はすべて同じ重さである"], diff:"基礎", a:0, e:"【ことばの意味】「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）【解説】気体にもわずかだが重さがあり、種類によって重さ(密度)は異なる。【まちがえやすい点】ほかの選択肢（気体には重さが全くない／気体の重さは温度に関係なく常に一定である）とのちがいをおさえておこう。"},
  {id:"che128", cat:"化学", sub:"物質のすがた", q:"気体の圧縮についての説明として正しいものはどれか。", choices:["気体は液体や固体に比べて圧縮しやすい","気体は液体よりも圧縮しにくい","気体は全く圧縮できない","気体を圧縮しても体積は変わらない"], diff:"基礎", a:0, e:"【解説】気体は粒子どうしの間隔が広いため、液体や固体に比べて圧縮しやすい。【まちがえやすい点】ほかの選択肢（気体は液体よりも圧縮しにくい／気体は全く圧縮できない）とのちがいをおさえておこう。"},
  {id:"che130", cat:"化学", sub:"酸・アルカリと中和", q:"水溶液の性質のまとめとして正しいものはどれか。", choices:["酸性の水溶液には少なくとも水素イオンが多くふくまれている","アルカリ性の水溶液には水素イオンは全くふくまれない","中性の水溶液には水素イオンも水酸化物イオンも全くふくまれない","水溶液の性質は温度にほとんど関係しない"], diff:"基礎", a:0, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「酸性」＝pHが7より小さい性質。青リトマスを赤にする【解説】酸性の水溶液には水素イオンが多くふくまれており、これが酸性の性質のもとになっている。【まちがえやすい点】ほかの選択肢（アルカリ性の水溶液には水素イオンは全くふくま…／中性の水溶液には水素イオンも水酸化物イオンも…）とのちがいをおさえておこう。"},
  {id:"che132", cat:"化学", sub:"化学変化と質量", q:"化学変化の利用についての説明として正しいものはどれか。", choices:["花火は金属を燃やしたときの炎色反応を利用している","花火にはいかなる化学変化も関係していない","花火の色はすべて同じ原理で光っている","花火は電気分解だけを利用してつくられている"], diff:"標準", a:0, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】花火の色は、金属の種類によって炎の色が変わる炎色反応を利用してつくられている。【まちがえやすい点】ほかの選択肢（花火にはいかなる化学変化も関係していない／花火の色はすべて同じ原理で光っている）とのちがいをおさえておこう。"},
  {id:"che134", cat:"化学", sub:"化学変化と質量", q:"化学変化とエネルギーの利用についての説明として正しいものはどれか。", choices:["火力発電などでは、燃料を燃やして得られる熱エネルギーを利用して発電が行われている","化学変化からエネルギーを取り出すことは一切できない","化学エネルギーは電気エネルギーに変換できない","エネルギーの利用に化学変化はほとんど関係しない"], diff:"基礎", a:0, e:"【ことばの意味】「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと。「化学変化」＝物質そのものが別の物質に変わること。／【発電への利用】火力発電では、石油や石炭、天然ガスなどの燃料を燃やして得られる熱エネルギーを利用し、水を沸騰させて蒸気をつくり、その蒸気でタービンを回して発電しています。／【まちがえやすい点】化学変化は熱エネルギーだけでなく、電池のように電気エネルギーとして取り出すこともできます。"},
  {id:"che136", cat:"化学", sub:"実験器具の使い方", q:"メスシリンダーの使い方についての説明として誤っているものはどれか。", choices:["液面を真横から見て、目盛りを読む","メスシリンダーは体積を測定するための器具である","液面の中央のへこんだ部分(メニスカス)の底を基準に読むことが多い","メスシリンダーは重さを測定するための器具である"], diff:"基礎", a:3, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）／「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）【解説】メスシリンダーは液体の体積を測定するための器具であり、重さ(質量)をはかる器具ではない。【まちがえやすい点】ほかの選択肢（液面を真横から見て、目盛りを読む／メスシリンダーは体積を測定するための器具であ…）とのちがいをおさえておこう。"},
