  {id:"bio384", cat:"生物", sub:"動物のからだ", q:"図の消化器官のうち、消化された栄養分の吸収が主に行われる部分はどれか。", choices:["小腸","胃","食道","口"], diff:"基礎", a:0, e:"【図の読み取り】胃の後に続く、長く曲がりくねった管の部分が小腸です。／【小腸のはたらき】小腸の内側には柔毛（じゅうもう）という小さな突起がたくさんあり、その表面から消化された栄養分（ブドウ糖やアミノ酸など）が血液中に吸収されます。消化と吸収の中心となる、とても重要な器官です。", img:"<svg viewBox='0 0 220 160' xmlns='http://www.w3.org/2000/svg'><circle cx='40' cy='25' r='12' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='40' y='15' font-size='8' text-anchor='middle' fill='#4A3B47'>口</text><line x1='40' y1='37' x2='60' y2='70' stroke='#4A3B47' stroke-width='3'/><text x='75' y='55' font-size='8' fill='#4A3B47'>食道</text><ellipse cx='80' cy='90' rx='25' ry='20' fill='#F5D7E3' stroke='#4A3B47' stroke-width='2'/><text x='80' y='95' font-size='8' text-anchor='middle' fill='#4A3B47'>胃</text><path d='M 90 105 Q 130 120 130 90 Q 130 60 160 80 Q 180 95 150 120 Q 120 140 90 130' stroke='#4A3B47' stroke-width='3' fill='none'/><text x='140' y='60' font-size='8' fill='#4A3B47'>小腸</text><path d='M 90 130 Q 60 150 190 145 Q 200 100 170 80' stroke='#F0A63C' stroke-width='4' fill='none'/><text x='190' y='120' font-size='8' fill='#4A3B47'>大腸</text></svg>"},
  {id:"bio385", cat:"生物", sub:"植物のはたらき", q:"植物の葉が緑色に見えるのは、葉の細胞にある何という色素のはたらきによるか。", choices:["クロロフィル(葉緑素)","ヘモグロビン","メラニン","カロテン"], diff:"基礎", a:0, e:"【ことばの意味】「クロロフィル（葉緑素）」＝葉緑体にふくまれる緑色の色素で、光合成に必要な光を吸収するはたらきをもつ。／【身近な関連】秋になるとこの色素が分解され、もともとあった別の色素（黄色や赤色）が目立つようになることで、紅葉が起こります。"},
  {id:"bio386", cat:"生物", sub:"動物のからだ", q:"ヒトが呼吸をするとき、主に使う筋肉や器官として正しいものはどれか。", choices:["肺と横隔膜などのはたらきによって空気を出し入れする","胃だけを使って空気を取り入れる","心臓の動きだけで呼吸をしている","筋肉は呼吸には関係しない"], diff:"基礎", a:0, e:"【考え方】呼吸のとき、横隔膜や肋骨まわりの筋肉が動くことで胸の中の体積が変化し、空気が肺に出入りします。肺自体には筋肉がないため、周囲の筋肉のはたらきによって呼吸運動が行われています。"},
  {id:"bio387", cat:"生物", sub:"植物のつくり", q:"種子植物が、種子をつくる前に必要とする受粉について正しい説明はどれか。", choices:["花粉がめしべの柱頭につくことを受粉という","種子が土の中にうまることを受粉という","葉が開くことを受粉という","根が地中に伸びることを受粉という"], diff:"基礎", a:0, e:"【ことばの意味】「受粉」＝花粉がめしべの先（柱頭）につくこと。受粉のあと花粉管が伸び、精細胞が胚珠内の卵細胞と受精することで、種子ができる準備が整います。虫や風によって花粉が運ばれることで受粉が起こります。"},
  {id:"bio388", cat:"生物", sub:"動物のからだ", q:"ヒトの体内で、血液を全身に送り出すポンプの役割をしている器官はどれか。", choices:["心臓","肺","腎臓","肝臓"], diff:"基礎", a:0, e:"【考え方】心臓は筋肉でできた器官で、規則的に収縮・拡張をくり返すことで、血液を全身に送り出すポンプのはたらきをしています。心臓が止まってしまうと、血液が全身に送られなくなり、酸素や養分が届かなくなってしまいます。"},
  {id:"bio389", cat:"生物", sub:"生物とかんきょう", q:"森林が「地球の肺」と呼ばれることがある理由として最も適切なものはどれか。", choices:["光合成によって二酸化炭素を吸収し酸素を放出しているから","森林の形が肺の形に似ているから","森林からは常に暖かい空気が出ているから","森林には動物の肺と同じ成分がふくまれているから"], diff:"標準", a:0, e:"【考え方】森林の樹木は光合成を行い、大量の二酸化炭素を吸収して酸素を放出しています。この大規模な気体交換のはたらきが、まるで地球全体の呼吸を助けているように見えることから、「地球の肺」と呼ばれることがあります。"},
  {id:"bio390", cat:"生物", sub:"生殖と遺伝", q:"生物が親から子へと形質を伝えるもとになる情報を何というか。", choices:["遺伝子","細胞質","核膜","液胞"], diff:"基礎", a:0, e:"【ことばの意味】「遺伝子」＝生物のからだの特徴（形質）を決めるもとになる情報。染色体の中のDNAにふくまれています。親の遺伝子が子に伝わることで、親に似た特徴が子にも現れることがあります。"},
  {id:"bio391", cat:"生物", sub:"植物のはたらき", q:"植物の根から吸収された水は、主にどこを通って葉まで運ばれるか。", choices:["道管","師管","気孔","葉緑体"], diff:"基礎", a:0, e:"【ことばの意味】「道管」＝根で吸収した水や、水にとけた養分を運ぶ管。根から茎、そして葉へと水を運ぶ役割をしています。師管は葉でつくられた栄養分を運ぶ管で、道管とは運ぶものが異なります。"},
  {id:"bio392", cat:"生物", sub:"動物のからだ", q:"食べ物にふくまれるデンプンを、体が使いやすいブドウ糖に分解するはたらきをする消化酵素はどれか。", choices:["アミラーゼ","ペプシン","リパーゼ","トリプシン"], diff:"標準", a:0, e:"【ことばの意味】「アミラーゼ」＝だ液などにふくまれる消化酵素で、デンプンを麦芽糖などに分解するはたらきをもつ。／【他の酵素との違い】ペプシンとトリプシンは主にタンパク質を、リパーゼは脂肪を分解する消化酵素で、それぞれ分解する対象が異なります。"},
  {id:"bio393", cat:"生物", sub:"生物とかんきょう", q:"生態系において、生産者・消費者・分解者の3つの役割がすべてそろっていることが重要な理由として正しいものはどれか。", choices:["物質やエネルギーが循環し、生態系のバランスが保たれるから","3つがそろわないと光合成が速く進むから","3つがそろわないと動物だけが増え続けるから","分解者がいると光合成の速度が下がるから"], diff:"標準", a:0, e:"【考え方】生産者（植物）が養分をつくり、消費者（動物）がそれを食べ、分解者（細菌・菌類）が死がいなどを無機物に分解して土にかえします。この3つの役割がそろうことで、物質が循環し、生態系全体のバランスが保たれます。"},
  {id:"bio394", cat:"生物", sub:"植物のつくり", q:"種子の中にある、成長すると根・茎・葉になる部分を何というか。", choices:["胚","胚乳","子房","がく"], diff:"標準", a:0, e:"【ことばの意味】「胚」＝種子の中にある、将来根・茎・葉に育っていく小さな植物体のもと。受精後、胚珠の中に作られます。発芽するとこの胚が成長し、新しい植物のからだになっていきます。"},
  {id:"bio395", cat:"生物", sub:"動物のからだ", q:"運動をするとき、体を動かすために縮んだりゆるんだりする器官はどれか。", choices:["筋肉","骨","皮膚","脂肪"], diff:"基礎", a:0, e:"【考え方】筋肉は縮む（収縮する）ことで、それにつながった骨を動かすはたらきをしています。骨自体は動く力を生み出せないため、筋肉が骨を引っぱることで、体を曲げたりのばしたりする運動が可能になります。"},
  {id:"bio396", cat:"生物", sub:"生物の観察", q:"顕微鏡でプレパラートを観察するとき、最初にどの倍率から観察を始めるのが基本か。", choices:["低い倍率から始める","高い倍率から始める","倍率はどこから始めても同じ","接眼レンズを外してから始める"], diff:"基礎", a:0, e:"【考え方】顕微鏡の観察は、まず低い倍率で広い範囲を見て、観察したい部分を視野の中央に移動させてから、倍率を上げて細かく観察するのが基本の手順です。最初から高倍率にすると視野がせまく、観察したいものを見つけにくくなります。"},
  {id:"bio397", cat:"生物", sub:"植物のはたらき", q:"植物の葉から水が水蒸気となって出ていく現象を何というか。", choices:["蒸散","光合成","呼吸","受粉"], diff:"基礎", a:0, e:"【ことばの意味】「蒸散」＝植物の体（主に葉）から水が水蒸気となって出ていく現象。主に気孔から行われます。蒸散が盛んになると、根からの水の吸収も盛んになるという関係があります。"},
  {id:"bio398", cat:"生物", sub:"生殖と遺伝", q:"生物が生殖によって新しい個体（子）を作ることを何というか。", choices:["生殖","進化","代謝","分解"], diff:"基礎", a:0, e:"【ことばの意味】「生殖」＝生物が自分と同じ種類の新しい個体（子）を作ること。有性生殖（受精をともなう）と無性生殖（体の一部からふえる）の2種類があります。生物が世代を重ねて命をつないでいくための重要なはたらきです。"},
  {id:"bio399", cat:"生物", sub:"動物のからだ", q:"目・耳・鼻・舌・皮膚のように、外界からの刺激を受け取る器官をまとめて何というか。", choices:["感覚器官","運動器官","消化器官","循環器官"], diff:"基礎", a:0, e:"【ことばの意味】「感覚器官」＝光・音・におい・味・温度などの外界からの刺激を受け取る器官のまとめての呼び方。目は光、耳は音、鼻はにおい、舌は味、皮膚は圧力や温度などの刺激を受け取ります。"},
  {id:"bio400", cat:"生物", sub:"生物とかんきょう", q:"森林の落ち葉が土にかえっていく過程に関わる生物として最も適切なものはどれか。", choices:["土の中の菌類や細菌などの分解者","太陽の光だけ","雨水だけ","空気中の酸素だけ"], diff:"基礎", a:0, e:"【考え方】落ち葉などの有機物は、土の中の菌類（カビなど）や細菌のはたらきによって分解され、無機物（水や二酸化炭素、無機塩類など）にかえっていきます。これらの生物を分解者といい、物質を土にもどす重要な役割を担っています。"},
  {id:"bio401", cat:"生物", sub:"植物のつくり", q:"茎の中を通り、水や養分・栄養分の通り道になっている管をまとめて何というか。", choices:["維管束","気孔","柵状組織","液胞"], diff:"基礎", a:0, e:"【ことばの意味】「維管束」＝道管と師管が集まってできた、水や養分の通り道。植物の根・茎・葉を通ってつながっており、根から吸収した水や、葉でつくられた栄養分を植物のからだ全体に運ぶはたらきをしています。"},
  {id:"bio402", cat:"生物", sub:"動物のからだ", q:"血液の成分のうち、出血したときに血液を固める役割をもつものはどれか。", choices:["血小板","赤血球","白血球","血しょう"], diff:"標準", a:0, e:"【ことばの意味】「血小板」＝血液成分の一つで、出血したときに集まって血液を固め、傷口をふさぐはたらきをする。赤血球は酸素の運搬、白血球は病原体の排除、血しょうは栄養分や老廃物の運搬という別のはたらきをそれぞれ担っています。"},
  {id:"bio403", cat:"生物", sub:"生物とかんきょう", q:"ある地域の生物の種類や数の多さを表す言葉として、最も適切なものはどれか。", choices:["生物多様性","食物連鎖","光合成量","蒸散量"], diff:"基礎", a:0, e:"【ことばの意味】「生物多様性」＝ある地域における生物の種類の豊富さや、それぞれの生物がもつ個性（遺伝的な多様性）の豊かさを表す言葉。生態系が安定して機能するためには、この生物多様性が保たれていることが重要だと考えられています。"},
  {id:"bio404", cat:"生物", sub:"植物のはたらき", q:"植物が光合成を行うために必要なものの組み合わせとして正しいものはどれか。", choices:["光・水・二酸化炭素","光・酸素・窒素","水・酸素だけ","二酸化炭素だけ"], diff:"基礎", a:0, e:"【考え方】光合成は、光のエネルギーを使って、二酸化炭素と水からデンプンなどの養分をつくり出す反応です。このとき酸素が生成物として放出されます。光・水・二酸化炭素の3つがそろわないと、光合成は十分に行われません。"},
  {id:"bio405", cat:"生物", sub:"動物のからだ", q:"だ液・胃液・すい液などをまとめて何というか。", choices:["消化液","血液","リンパ液","汗"], diff:"基礎", a:0, e:"【ことばの意味】「消化液」＝食べ物を分解するために体から出される液体をまとめての呼び方。それぞれの消化液には決まった消化酵素がふくまれており、デンプン・タンパク質・脂肪などを、体が吸収しやすい小さな分子に分解するはたらきをしています。"},
  {id:"bio406", cat:"生物", sub:"生殖と遺伝", q:"親の体の一部から新しい個体ができ、受精をともなわないふえ方を何というか。", choices:["無性生殖","有性生殖","受粉","分解"], diff:"基礎", a:0, e:"【ことばの意味】「無性生殖」＝受精を行わずに、親の体の一部から直接子ができるふえ方。ジャガイモのいもでふえる栄養生殖などがこれにあたります。子は親と同じ遺伝子をもつため、性質が均一になりやすいという特徴があります。"},
  {id:"bio407", cat:"生物", sub:"植物のつくり", q:"花びら（花弁）・がく・おしべ・めしべのうち、受粉後に果実になる部分をふくむものはどれか。", choices:["めしべ（子房の部分）","花びら","がく","おしべ"], diff:"標準", a:0, e:"【考え方】めしべの根もとには子房があり、その中に胚珠が入っています。受粉・受精のあと、子房は成長して果実になり、胚珠は種子になります。花びら・がく・おしべは、受粉後にしおれて落ちてしまい、果実にはなりません。"},
  {id:"bio408", cat:"生物", sub:"生物とかんきょう", q:"環境保全の取り組みとして、身近にできることの例として適切なものはどれか。", choices:["ごみを減らし、資源を大切に使う","使い終わった電池をどこにでも捨てる","水を出しっぱなしにして使う","木を無計画に切りたおす"], diff:"基礎", a:0, e:"【考え方】限りある資源を大切に使い、ごみを減らすことは、環境への負荷を減らす身近な取り組みの一つです。使用済みの電池を正しく分別・回収に出すことも、環境を守るために大切な行動として広く呼びかけられています。"},
  {id:"bio409", cat:"生物", sub:"動物のからだ", q:"体温が高くなりすぎたときに汗をかくのは、体のどのようなはたらきによるものか。", choices:["体温を一定に保とうとするはたらき","体重を減らそうとするはたらき","水分をためこもうとするはたらき","筋肉を増やそうとするはたらき"], diff:"基礎", a:0, e:"【考え方】ヒトの体には、体温を一定の範囲に保とうとするはたらきがあります。体温が上がりすぎると、汗をかいてその蒸発によって体を冷やそうとします。このような体温調節のはたらきは、脳の視床下部が中心になって行っています。"},
  {id:"bio410", cat:"生物", sub:"植物のはたらき", q:"植物の葉に日光が当たると、光合成でデンプンがつくられる。このデンプンは、まず葉のどこにたくわえられるか。", choices:["葉緑体","液胞","細胞壁","気孔"], diff:"標準", a:0, e:"【考え方】光合成は葉緑体の中で行われ、つくられたデンプンはまず葉緑体の中に一時的にたくわえられます。夜になると、このデンプンは糖に変えられて師管を通り、植物のからだ全体に運ばれていきます。"},
  {id:"bio411", cat:"生物", sub:"動物のからだ", q:"ヒトが物を食べたとき、最初に消化が始まる場所はどこか。", choices:["口（だ液によるデンプンの消化）","胃","小腸","大腸"], diff:"基礎", a:0, e:"【考え方】食べ物は口の中でかみくだかれると同時に、だ液にふくまれるアミラーゼという消化酵素によってデンプンの分解が始まります。消化は口から始まり、食道・胃・小腸・大腸へと続いていきます。"},
  {id:"bio412", cat:"生物", sub:"生殖と遺伝", q:"エンドウの種子の丸としわのように、同時に現れない対になった形質を何というか。", choices:["対立形質","優性形質のみ","潜性形質のみ","中間形質"], diff:"標準", a:0, e:"【ことばの意味】「対立形質」＝丸い種子としわの種子のように、同時には現れない、対になった形質。メンデルはエンドウの対立形質（種子の形・色、草たけなど）を観察し、遺伝の規則性を発見しました。"},
  {id:"bio413", cat:"生物", sub:"植物のつくり", q:"種子植物の中で、胚珠がむき出しになっている（子房がない）なかまを何というか。", choices:["裸子植物","被子植物","単子葉類","双子葉類"], diff:"基礎", a:0, e:"【ことばの意味】「裸子植物」＝子房がなく、胚珠がむき出しになっている植物のなかま。マツ・スギ・イチョウなどが代表例です。受精後、胚珠は種子になりますが、子房がないため果実はできません。"},
  {id:"bio414", cat:"生物", sub:"植物のつくり", q:"胚珠が子房の中に包まれている種子植物のなかまを何というか。", choices:["被子植物","裸子植物","コケ植物","シダ植物"], diff:"基礎", a:0, e:"【ことばの意味】「被子植物」＝胚珠が子房の中に包まれている種子植物のなかま。アブラナ・サクラ・イネなど、身近な多くの植物がこれにあたります。受精後、胚珠は種子に、子房は果実になります。"},
  {id:"bio415", cat:"生物", sub:"動物の分類", q:"背骨をもつ動物のなかまをまとめて何というか。", choices:["脊椎動物","無脊椎動物","軟体動物","節足動物"], diff:"基礎", a:0, e:"【ことばの意味】「脊椎動物」＝背骨（脊椎）をもつ動物のなかま。魚類・両生類・は虫類・鳥類・哺乳類の5つのグループに分けられます。背骨は体を支え、その中を通る神経（脊髄）を保護するはたらきがあります。"},
  {id:"bio416", cat:"生物", sub:"動物の分類", q:"背骨をもたない動物のなかまをまとめて何というか。", choices:["無脊椎動物","脊椎動物","哺乳類","は虫類"], diff:"基礎", a:0, e:"【ことばの意味】「無脊椎動物」＝背骨をもたない動物のなかま。昆虫やエビなどの節足動物、貝やタコなどの軟体動物、ミミズなどの環形動物など、動物のなかまの大部分を占める、種類の豊富なグループです。"},
  {id:"bio417", cat:"生物", sub:"動物のからだ", q:"ヒトの心臓が血液を送り出すとき、規則正しくくり返す動きを何というか。", choices:["拍動","呼吸","蒸散","消化"], diff:"基礎", a:0, e:"【ことばの意味】「拍動」＝心臓が規則正しく収縮と拡張をくり返す動き。この拍動によって血液が全身に送り出されます。安静時のヒトの拍動数はおよそ1分間に60〜80回程度です。"},
  {id:"bio418", cat:"生物", sub:"生物とかんきょう", q:"生態系の中で、光合成を行い有機物をつくり出す生物を何というか。", choices:["生産者","消費者","分解者","中間者"], diff:"基礎", a:0, e:"【ことばの意味】「生産者」＝光合成によって無機物から有機物をつくり出す生物。植物や藻類がこれにあたります。生態系における食物連鎖の出発点であり、他の生物のエネルギー源のもとをつくり出す重要な役割をもっています。"},
  {id:"bio419", cat:"生物", sub:"生物とかんきょう", q:"生態系の中で、他の生物を食べて養分を得る生物を何というか。", choices:["消費者","生産者","分解者","独立栄養生物"], diff:"基礎", a:0, e:"【ことばの意味】「消費者」＝生産者や他の消費者を食べることで養分を得る生物。草食動物や肉食動物などがこれにあたります。生産者がつくった有機物を、食物連鎖を通じて利用しています。"},
  {id:"bio420", cat:"生物", sub:"植物のはたらき", q:"植物の葉の裏側に多く見られる、気体の出入り口となる部分を何というか。", choices:["気孔","柵状組織","道管","師管"], diff:"基礎", a:0, e:"【ことばの意味】「気孔」＝葉の表皮にある小さな穴で、2つの孔辺細胞に囲まれている。水蒸気・二酸化炭素・酸素などの気体が出入りする場所で、多くの植物では葉の裏側に多く分布しています。"},
  {id:"bio421", cat:"生物", sub:"動物のからだ", q:"ヒトの体内で、有害なアンモニアを無害な尿素につくりかえる器官はどこか。", choices:["肝臓","腎臓","胃","小腸"], diff:"標準", a:0, e:"【考え方】タンパク質が分解されるとアンモニアが生じますが、これは有害な物質です。肝臓ではアンモニアを比較的無害な尿素につくりかえるはたらきがあります。できた尿素は血液で腎臓に運ばれ、尿として排出されます。"},
  {id:"bio422", cat:"生物", sub:"生殖と遺伝", q:"生物のからだをつくる細胞の中にある、遺伝情報をふくむ構造を何というか。", choices:["染色体","細胞壁","液胞","葉緑体"], diff:"基礎", a:0, e:"【ことばの意味】「染色体」＝細胞の核の中にある、DNA（遺伝情報を伝える物質）とタンパク質からなる構造。細胞分裂のときに凝縮して見えるようになり、酢酸カーミン液などで赤く染まる性質があります。"},
  {id:"bio423", cat:"生物", sub:"植物のつくり", q:"種子が発芽するときに、はじめに使われる栄養分はどこにたくわえられているものが多いか。", choices:["子葉や胚乳","花弁","がく","おしべ"], diff:"標準", a:0, e:"【考え方】種子が発芽するとき、成長のための栄養分は子葉（無胚乳種子の場合）や胚乳（有胚乳種子の場合）にたくわえられたものが使われます。発芽後、葉が開いて光合成ができるようになるまでの間、これらの栄養分が使われます。"},
  {id:"bio424", cat:"生物", sub:"動物のからだ", q:"ヒトのからだで、酸素と栄養分を全身に届け、二酸化炭素や不要な物質を運び去るはたらきをする器官系を何というか。", choices:["循環器系（血液循環のしくみ）","消化器系","呼吸器系のみ","感覚器系"], diff:"基礎", a:0, e:"【ことばの意味】「循環器系」＝心臓・血管・血液からなる、物質を全身に運ぶしくみ。心臓のポンプのはたらきで血液が全身をめぐり、酸素・栄養分を届け、二酸化炭素・老廃物を回収して運びます。"},
  {id:"bio425", cat:"生物", sub:"生物とかんきょう", q:"生態系のバランスが保たれた状態から、人間の活動によって大きく崩れることがある。この原因として当てはまるものはどれか。", choices:["外来種の持ちこみや森林の伐採などの人間活動","太陽の光が強くなること","雨が定期的に降ること","季節が変化すること"], diff:"標準", a:0, e:"【考え方】外来種の持ちこみ、森林の伐採、環境汚染などの人間活動は、もともと保たれていた生態系のバランスを崩す原因になることがあります。一方、太陽光の強さや季節の変化、規則的な降雨は、生態系がふだんから適応している自然な要素です。"},
  {id:"bio426", cat:"生物", sub:"植物のつくり", q:"双子葉類の茎の維管束の並び方として正しいものはどれか。", choices:["輪の形に並んでいる","ばらばらに散らばっている","中心に1本だけある","茎の外側にしかない"], diff:"標準", a:0, e:"【考え方】双子葉類（アブラナなど）の茎では、維管束が輪の形にきれいに並んでいます。単子葉類（イネなど）の茎では、維管束が茎の断面にばらばらに散らばっているという違いがあります。"},
  {id:"bio427", cat:"生物", sub:"植物のつくり", q:"単子葉類の茎の維管束の並び方として正しいものはどれか。", choices:["ばらばらに散らばっている","輪の形にきれいに並んでいる","中心に1本だけある","存在しない"], diff:"標準", a:0, e:"【考え方】単子葉類（イネ、トウモロコシなど）の茎では、維管束が茎の断面にばらばらに散らばって分布しています。双子葉類の茎で維管束が輪の形に並ぶのとは対照的なつくりです。"},
  {id:"bio428", cat:"生物", sub:"動物のからだ", q:"ヒトの神経系のうち、脳と脊髄をまとめて何というか。", choices:["中枢神経","末しょう神経","運動神経のみ","感覚神経のみ"], diff:"基礎", a:0, e:"【ことばの意味】「中枢神経」＝脳と脊髄をまとめた呼び方で、体からの情報を受け取り、判断し、命令を出す中心的な役割をもつ。中枢神経から枝分かれして全身に広がる神経を末しょう神経といいます。"},
  {id:"bio429", cat:"生物", sub:"生殖と遺伝", q:"ある形質について、対になる遺伝子の両方が同じ場合（AAやaaなど）を何というか。", choices:["純系（ホモ接合）","雑種（ヘテロ接合）","中間形質","突然変異"], diff:"標準", a:0, e:"【ことばの意味】「純系」＝対になる遺伝子が同じ組み合わせ（AAまたはaa）になっている個体。自家受粉をくり返しても、同じ形質の子孫が生まれ続けます。メンデルの実験では、この純系どうしをかけ合わせることから始めています。"},
  {id:"bio430", cat:"生物", sub:"生物とかんきょう", q:"落ち葉や動物の死がいなどの有機物を、無機物に分解する生物をまとめて何というか。", choices:["分解者","生産者","消費者","中間消費者"], diff:"基礎", a:0, e:"【ことばの意味】「分解者」＝土の中の菌類（カビなど）や細菌のように、生物の死がいやふんなどの有機物を無機物に分解するはたらきをもつ生物。分解者のはたらきによって、物質が生態系の中を循環していきます。"},
  {id:"bio431", cat:"生物", sub:"動物のからだ", q:"目に入った光の刺激は、どこを通って脳に伝えられるか。", choices:["視神経","聴神経","運動神経","消化管"], diff:"基礎", a:0, e:"【考え方】目の網膜が受け取った光の刺激は、視神経を通って脳に伝えられ、そこで「見えた」と認識されます。耳が受け取った音の刺激は聴神経を通って脳に伝えられ、それぞれの感覚器官に対応した神経経路があります。"},
  {id:"bio432", cat:"生物", sub:"植物のはたらき", q:"植物が光の当たる方向に茎を曲げて成長する性質を何というか。", choices:["光屈性","重力屈性","水屈性","接触屈性"], diff:"標準", a:0, e:"【ことばの意味】「光屈性」＝植物が光の当たる方向に向かって曲がって成長する性質。窓際に置いた植物が、光の差す方向に茎を伸ばしていくのはこの性質によるものです。オーキシンという植物ホルモンが関係していると考えられています。"},
  {id:"bio433", cat:"生物", sub:"生物とかんきょう", q:"外来種が在来種の生存をおびやかす理由として、最も基本的な説明はどれか。", choices:["もとの生息地とは異なり、天敵や競争相手がいないために増えすぎることがあるから","外来種は必ず在来種より体が大きいから","外来種は病気を運ばないから安全だから","外来種はすべて絶滅危惧種だから"], diff:"標準", a:0, e:"【考え方】外来種は、もとの生息地では天敵や競争相手によって数が抑えられていましたが、新しい環境にはそれらがいないため、急激に数が増えてしまうことがあります。その結果、食料や生息場所をめぐって在来種と競合し、在来種の生存に影響をおよぼすことがあります。"},
  {id:"bio434", cat:"生物", sub:"動物のからだ", q:"運動するときに、対になる2つの筋肉が交互に縮んだりゆるんだりすることを何というか。", choices:["拮抗筋のはたらき","消化のはたらき","蒸散のはたらき","光合成のはたらき"], diff:"標準", a:0, e:"【ことばの意味】「拮抗筋」＝関節をはさんで反対側に位置し、一方が縮むと他方がゆるむという関係にある、対になった筋肉。うでを曲げるときは内側の筋肉が縮んで外側がゆるみ、伸ばすときはその逆になります。"},
  {id:"ear343", cat:"地学", sub:"地層と岩石", q:"図は地層の重なりを表している。地層累重の法則にもとづくと、最も古い層はどれか。", choices:["D（一番下の層）","A（一番上の層）","B（上から2番目の層）","どの層も同じ古さ"], diff:"基礎", a:0, e:"【図の読み取り】上からA・B・C・Dの順に地層が積み重なっているようすが描かれています。／【地層累重の法則】地層は基本的に下にある層ほど古く、上にある層ほど新しく積もったものです（地殻変動で逆転していない場合）。したがって、図の中で一番下にあるD層が最も古い層になります。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='20' y='20' width='200' height='20' fill='#D6C4A8'/><rect x='20' y='40' width='200' height='25' fill='#B89968'/><rect x='20' y='65' width='200' height='18' fill='#D6C4A8'/><rect x='20' y='83' width='200' height='30' fill='#8B7355'/><text x='225' y='33' font-size='8' fill='#4A3B47'>A</text><text x='225' y='55' font-size='8' fill='#4A3B47'>B</text><text x='225' y='77' font-size='8' fill='#4A3B47'>C</text><text x='225' y='100' font-size='8' fill='#4A3B47'>D</text><line x1='20' y1='20' x2='20' y2='113' stroke='#4A3B47' stroke-width='1.5'/><line x1='220' y1='20' x2='220' y2='113' stroke='#4A3B47' stroke-width='1.5'/></svg>"},
  {id:"ear344", cat:"地学", sub:"地層と岩石", q:"図のA〜Dの地層のうち、最も新しく堆積した層はどれか。", choices:["A（一番上の層）","D（一番下の層）","C","B"], diff:"基礎", a:0, e:"【図の読み取り】上からA・B・C・Dの順に積み重なっている地層が描かれています。／【考え方】地層累重の法則により、一番上にある層が最も新しく積もった層になります。図ではA層が一番上にあるため、A層が最も新しい層と判断できます。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='20' y='20' width='200' height='20' fill='#D6C4A8'/><rect x='20' y='40' width='200' height='25' fill='#B89968'/><rect x='20' y='65' width='200' height='18' fill='#D6C4A8'/><rect x='20' y='83' width='200' height='30' fill='#8B7355'/><text x='225' y='33' font-size='8' fill='#4A3B47'>A</text><text x='225' y='55' font-size='8' fill='#4A3B47'>B</text><text x='225' y='77' font-size='8' fill='#4A3B47'>C</text><text x='225' y='100' font-size='8' fill='#4A3B47'>D</text><line x1='20' y1='20' x2='20' y2='113' stroke='#4A3B47' stroke-width='1.5'/><line x1='220' y1='20' x2='220' y2='113' stroke='#4A3B47' stroke-width='1.5'/></svg>"},
  {id:"ear345", cat:"地学", sub:"地層と岩石", q:"図のような地層の重なりを観察するとき、それぞれの層の色やつぶの大きさが異なる理由として最も適切なものはどれか。", choices:["堆積した時代や環境が層ごとに異なっていたため","地層はすべて同時に一度にできたため","地層の色は太陽の光でしか変化しないため","地層のつぶの大きさに規則性はまったくないため"], diff:"標準", a:0, e:"【図の読み取り】A〜Dの各層で色や厚みが異なって描かれています。／【考え方】地層は長い年月をかけて、少しずつ異なる時代・環境で堆積したものが積み重なってできています。そのため、堆積した当時の環境（水の深さ、流れの強さなど）のちがいによって、層ごとに色やつぶの大きさが異なることがよくあります。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='20' y='20' width='200' height='20' fill='#D6C4A8'/><rect x='20' y='40' width='200' height='25' fill='#B89968'/><rect x='20' y='65' width='200' height='18' fill='#D6C4A8'/><rect x='20' y='83' width='200' height='30' fill='#8B7355'/><text x='225' y='33' font-size='8' fill='#4A3B47'>A</text><text x='225' y='55' font-size='8' fill='#4A3B47'>B</text><text x='225' y='77' font-size='8' fill='#4A3B47'>C</text><text x='225' y='100' font-size='8' fill='#4A3B47'>D</text><line x1='20' y1='20' x2='20' y2='113' stroke='#4A3B47' stroke-width='1.5'/><line x1='220' y1='20' x2='220' y2='113' stroke='#4A3B47' stroke-width='1.5'/></svg>"},
  {id:"ear346", cat:"地学", sub:"地震", q:"図のように地層がずれているつくりを何というか。", choices:["断層","褶曲","不整合","風化"], diff:"基礎", a:0, e:"【図の読み取り】もともと1つにつながっていた地層が、中央の線を境にして上下にずれているようすが描かれています。このようなずれを断層といいます。／【できる理由】断層は地震のときなどに、地下の岩盤に大きな力が加わり、破壊されてずれることでできます。断層の存在は、その場所で過去に地殻変動があったことを示す手がかりになります。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='20' y='20' width='90' height='20' fill='#D6C4A8'/><rect x='20' y='40' width='90' height='25' fill='#B89968'/><rect x='20' y='65' width='90' height='18' fill='#D6C4A8'/><rect x='130' y='40' width='90' height='20' fill='#D6C4A8'/><rect x='130' y='60' width='90' height='25' fill='#B89968'/><rect x='130' y='85' width='90' height='18' fill='#D6C4A8'/><line x1='110' y1='15' x2='135' y2='108' stroke='#4A3B47' stroke-width='2.5'/><text x='60' y='15' font-size='9' text-anchor='middle' fill='#4A3B47'>ずれる前と同じ層</text></svg>"},
  {id:"ear347", cat:"地学", sub:"地震", q:"図のような断層ができる直接の原因として最も適切なものはどれか。", choices:["地下の岩盤に大きな力が加わり、破壊されてずれ動くこと","地層がゆっくり風化してけずられること","地層の色が時間とともに変化すること","地層に水がしみこんでとけること"], diff:"標準", a:0, e:"【図の読み取り】地層が一直線のずれによって上下に食い違っているようすが描かれています。／【考え方】断層は、地下の岩盤に引っぱる力や押す力などの大きな力が加わり、岩盤が破壊されてずれ動くことで生じます。多くの場合、このずれが起こるときに地震が発生します。活断層は今後もずれ動く可能性がある断層のことです。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='20' y='20' width='90' height='20' fill='#D6C4A8'/><rect x='20' y='40' width='90' height='25' fill='#B89968'/><rect x='20' y='65' width='90' height='18' fill='#D6C4A8'/><rect x='130' y='40' width='90' height='20' fill='#D6C4A8'/><rect x='130' y='60' width='90' height='25' fill='#B89968'/><rect x='130' y='85' width='90' height='18' fill='#D6C4A8'/><line x1='110' y1='15' x2='135' y2='108' stroke='#4A3B47' stroke-width='2.5'/><text x='60' y='15' font-size='9' text-anchor='middle' fill='#4A3B47'>ずれる前と同じ層</text></svg>"},
  {id:"ear348", cat:"地学", sub:"地震", q:"図は地震のゆれが伝わるようすを表している。震源から先に到達する、速い波アを何というか。", choices:["P波","S波","表面波","音波"], diff:"基礎", a:0, e:"【図の読み取り】震源から発生した2つの波のうち、先に速く届く波アがP波です。／【P波の特徴】P波は速く伝わる波で、小さくカタカタというゆれ（初期微動）を引き起こします。地震が起きたときに最初に感じる小さなゆれは、このP波によるものです。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='120' x2='220' y2='120' stroke='#4A3B47' stroke-width='1.5'/><text x='215' y='135' font-size='9' fill='#4A3B47'>時間</text><circle cx='40' cy='120' r='4' fill='#4A3B47'/><text x='30' y='105' font-size='8' fill='#4A3B47'>震源で発生</text><path d='M 40 60 L 100 60' stroke='#6BA8DB' stroke-width='2'/><polygon points='100,60 90,55 90,65' fill='#6BA8DB'/><text x='55' y='50' font-size='9' fill='#6BA8DB'>P波(速い)</text><path d='M 40 90 L 150 90' stroke='#E8709F' stroke-width='2'/><polygon points='150,90 140,85 140,95' fill='#E8709F'/><text x='70' y='105' font-size='9' fill='#E8709F'>S波(遅い)</text><line x1='100' y1='60' x2='100' y2='120' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='150' y1='90' x2='150' y2='120' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><text x='115' y='130' font-size='8' fill='#4A3B47'>初期微動継続時間</text></svg>"},
  {id:"ear349", cat:"地学", sub:"地震", q:"図で、P波より遅れて届く波イを何というか。また、この波が届くと何が起こるか。", choices:["S波が届き、大きなゆれ（主要動）が始まる","S波が届くが、ゆれはまったく起こらない","P波が2回届く","音が完全に消える"], diff:"基礎", a:0, e:"【図の読み取り】P波よりも遅れて届く波イがS波です。／【S波の特徴】S波はP波より遅く伝わりますが、届くと大きくユサユサというゆれ（主要動）が始まります。地震の被害の多くは、このS波による大きなゆれによって引き起こされます。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='120' x2='220' y2='120' stroke='#4A3B47' stroke-width='1.5'/><text x='215' y='135' font-size='9' fill='#4A3B47'>時間</text><circle cx='40' cy='120' r='4' fill='#4A3B47'/><text x='30' y='105' font-size='8' fill='#4A3B47'>震源で発生</text><path d='M 40 60 L 100 60' stroke='#6BA8DB' stroke-width='2'/><polygon points='100,60 90,55 90,65' fill='#6BA8DB'/><text x='55' y='50' font-size='9' fill='#6BA8DB'>P波(速い)</text><path d='M 40 90 L 150 90' stroke='#E8709F' stroke-width='2'/><polygon points='150,90 140,85 140,95' fill='#E8709F'/><text x='70' y='105' font-size='9' fill='#E8709F'>S波(遅い)</text><line x1='100' y1='60' x2='100' y2='120' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='150' y1='90' x2='150' y2='120' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><text x='115' y='130' font-size='8' fill='#4A3B47'>初期微動継続時間</text></svg>"},
  {id:"ear350", cat:"地学", sub:"地震", q:"図のP波とS波が届く時間の差（初期微動継続時間）と、震源からの距離の関係として正しいものはどれか。", choices:["震源から遠いほど、初期微動継続時間は長くなる","震源から遠いほど、初期微動継続時間は短くなる","初期微動継続時間は震源からの距離に関係しない","初期微動継続時間はどこでも同じ長さになる"], diff:"標準", a:0, e:"【図の読み取り】P波とS波の到着時刻の差（初期微動継続時間）が図の下部に示されています。／【考え方】P波とS波は速さが異なるため、震源から遠くなるほど、その到着時刻の差（初期微動継続時間）は大きくなっていきます。この関係を利用して、初期微動継続時間から震源までのおよその距離を求めることができます。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><line x1='30' y1='120' x2='220' y2='120' stroke='#4A3B47' stroke-width='1.5'/><text x='215' y='135' font-size='9' fill='#4A3B47'>時間</text><circle cx='40' cy='120' r='4' fill='#4A3B47'/><text x='30' y='105' font-size='8' fill='#4A3B47'>震源で発生</text><path d='M 40 60 L 100 60' stroke='#6BA8DB' stroke-width='2'/><polygon points='100,60 90,55 90,65' fill='#6BA8DB'/><text x='55' y='50' font-size='9' fill='#6BA8DB'>P波(速い)</text><path d='M 40 90 L 150 90' stroke='#E8709F' stroke-width='2'/><polygon points='150,90 140,85 140,95' fill='#E8709F'/><text x='70' y='105' font-size='9' fill='#E8709F'>S波(遅い)</text><line x1='100' y1='60' x2='100' y2='120' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><line x1='150' y1='90' x2='150' y2='120' stroke='#999' stroke-width='1' stroke-dasharray='2,2'/><text x='115' y='130' font-size='8' fill='#4A3B47'>初期微動継続時間</text></svg>"},
  {id:"ear351", cat:"地学", sub:"天体の動き", q:"図は月が地球のまわりを回るようすを表している。月がエの位置にあるとき、地球から見た月の形はどうなるか。", choices:["満月（すべて光って見える）","新月（まったく見えない）","半月","三日月"], diff:"標準", a:0, e:"【図の読み取り】太陽の光は左から届いており、地球から見てエの位置にある月は、太陽の光を受けた面がちょうど地球の方を向いています。／【考え方】太陽・地球・月の順に一直線に近く並ぶとき、月の光っている面がすべて地球側を向くため、満月として見えます。図のエの位置がこの満月の位置にあたります。", img:"<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg'><circle cx='120' cy='90' r='6' fill='#F0A63C'/><text x='120' y='75' font-size='8' text-anchor='middle' fill='#4A3B47'>地球</text><circle cx='120' cy='30' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='120' y='15' font-size='8' text-anchor='middle' fill='#4A3B47'>ア</text><circle cx='170' cy='60' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='185' y='55' font-size='8' fill='#4A3B47'>イ</text><circle cx='170' cy='120' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='185' y='135' font-size='8' fill='#4A3B47'>ウ</text><circle cx='120' cy='150' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='120' y='145' font-size='8' text-anchor='middle' fill='#fff'>エ</text><circle cx='70' cy='120' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><circle cx='70' cy='60' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><line x1='10' y1='90' x2='60' y2='90' stroke='#F0A63C' stroke-width='2'/><text x='15' y='105' font-size='8' fill='#4A3B47'>太陽の光</text></svg>"},
  {id:"ear352", cat:"地学", sub:"天体の動き", q:"図で、月がアの位置にあるとき、地球から見た月はどのように見えるか。", choices:["ほとんど見えない（新月に近い）","満月として見える","半月として見える","三日月として見える"], diff:"標準", a:0, e:"【図の読み取り】アの位置は、太陽・月・地球の順に近い形で並んでいます。太陽の光が当たっている面は、地球とは反対側を向いています。／【考え方】月の光っている面が地球から見えない位置にあるとき、月はほとんど見えなくなります。これが新月に近い状態です。図のアの位置はこの新月に近い状態を表しています。", img:"<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg'><circle cx='120' cy='90' r='6' fill='#F0A63C'/><text x='120' y='75' font-size='8' text-anchor='middle' fill='#4A3B47'>地球</text><circle cx='120' cy='30' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='120' y='15' font-size='8' text-anchor='middle' fill='#4A3B47'>ア</text><circle cx='170' cy='60' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='185' y='55' font-size='8' fill='#4A3B47'>イ</text><circle cx='170' cy='120' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='185' y='135' font-size='8' fill='#4A3B47'>ウ</text><circle cx='120' cy='150' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='120' y='145' font-size='8' text-anchor='middle' fill='#fff'>エ</text><circle cx='70' cy='120' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><circle cx='70' cy='60' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><line x1='10' y1='90' x2='60' y2='90' stroke='#F0A63C' stroke-width='2'/><text x='15' y='105' font-size='8' fill='#4A3B47'>太陽の光</text></svg>"},
  {id:"ear353", cat:"地学", sub:"天体の動き", q:"図のように月が地球のまわりを回ることで、月の見え方が変化していく現象を何というか。", choices:["満ち欠け","日食","月食","公転周期"], diff:"基礎", a:0, e:"【図の読み取り】月がいろいろな位置（ア〜エ）を通ることで、太陽の光の当たり方（地球から見える光る部分の面積）が変わっていくようすが描かれています。／【考え方】この、月の見える形が変化していく現象を満ち欠けといいます。新月→三日月→半月→満月→半月→新月という周期をおよそ29.5日でくり返します。", img:"<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg'><circle cx='120' cy='90' r='6' fill='#F0A63C'/><text x='120' y='75' font-size='8' text-anchor='middle' fill='#4A3B47'>地球</text><circle cx='120' cy='30' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='120' y='15' font-size='8' text-anchor='middle' fill='#4A3B47'>ア</text><circle cx='170' cy='60' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='185' y='55' font-size='8' fill='#4A3B47'>イ</text><circle cx='170' cy='120' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='185' y='135' font-size='8' fill='#4A3B47'>ウ</text><circle cx='120' cy='150' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><text x='120' y='145' font-size='8' text-anchor='middle' fill='#fff'>エ</text><circle cx='70' cy='120' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><circle cx='70' cy='60' r='12' fill='#D6D2E8' stroke='#4A3B47' stroke-width='1'/><line x1='10' y1='90' x2='60' y2='90' stroke='#F0A63C' stroke-width='2'/><text x='15' y='105' font-size='8' fill='#4A3B47'>太陽の光</text></svg>"},
  {id:"ear354", cat:"地学", sub:"天気", q:"図で、寒気が暖気の下にもぐりこむように進んでいる前線アを何というか。", choices:["寒冷前線","温暖前線","停滞前線","閉塞前線"], diff:"基礎", a:0, e:"【図の読み取り】左側で、寒気が暖気の下に急にもぐりこんでいるようすが描かれています。これが寒冷前線です。／【寒冷前線の特徴】寒気が暖気を急激に押し上げるため、たてに大きく発達した積乱雲ができやすく、せまい範囲に短時間の激しい雨をもたらすことが多いです。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='100' x2='220' y2='100' stroke='#999' stroke-width='1'/><path d='M 60 100 Q 90 60 60 20' stroke='#6BA8DB' stroke-width='2' fill='none'/><polygon points='60,20 50,30 65,32' fill='#6BA8DB'/><text x='40' y='55' font-size='8' fill='#4A3B47'>寒気</text><path d='M 160 100 Q 130 70 160 20' stroke='#E8709F' stroke-width='2' fill='none'/><polygon points='160,20 148,25 155,35' fill='#E8709F'/><text x='170' y='55' font-size='8' fill='#4A3B47'>暖気</text><text x='60' y='115' font-size='8' text-anchor='middle' fill='#4A3B47'>寒冷前線</text><text x='160' y='115' font-size='8' text-anchor='middle' fill='#4A3B47'>温暖前線</text></svg>"},
  {id:"ear355", cat:"地学", sub:"天気", q:"図で、暖気が寒気の上にゆるやかにはい上がっている前線イを何というか。", choices:["温暖前線","寒冷前線","停滞前線","偏西風"], diff:"基礎", a:0, e:"【図の読み取り】右側で、暖気が寒気の上にゆるやかにはい上がっているようすが描かれています。これが温暖前線です。／【温暖前線の特徴】暖気がゆるやかに上昇するため、横に広がった層状の雲ができやすく、広い範囲に長時間おだやかな雨を降らせることが多いです。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='100' x2='220' y2='100' stroke='#999' stroke-width='1'/><path d='M 60 100 Q 90 60 60 20' stroke='#6BA8DB' stroke-width='2' fill='none'/><polygon points='60,20 50,30 65,32' fill='#6BA8DB'/><text x='40' y='55' font-size='8' fill='#4A3B47'>寒気</text><path d='M 160 100 Q 130 70 160 20' stroke='#E8709F' stroke-width='2' fill='none'/><polygon points='160,20 148,25 155,35' fill='#E8709F'/><text x='170' y='55' font-size='8' fill='#4A3B47'>暖気</text><text x='60' y='115' font-size='8' text-anchor='middle' fill='#4A3B47'>寒冷前線</text><text x='160' y='115' font-size='8' text-anchor='middle' fill='#4A3B47'>温暖前線</text></svg>"},
  {id:"ear356", cat:"地学", sub:"天気", q:"図の2つの前線のうち、通過後に気温が急に下がり、北よりの風が強く吹きやすいのはどちらか。", choices:["寒冷前線が通過した後","温暖前線が通過した後","どちらの前線も気温には影響しない","前線の種類と気温変化は無関係である"], diff:"標準", a:0, e:"【図の読み取り】寒冷前線（左）は寒気が急速に進んでくるようすが描かれています。／【考え方】寒冷前線が通過すると、その後は冷たい寒気におおわれるため、気温が急激に下がり、風向きも北よりに変わりやすくなります。温暖前線の通過後は逆に気温が上がる傾向があります。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='100' x2='220' y2='100' stroke='#999' stroke-width='1'/><path d='M 60 100 Q 90 60 60 20' stroke='#6BA8DB' stroke-width='2' fill='none'/><polygon points='60,20 50,30 65,32' fill='#6BA8DB'/><text x='40' y='55' font-size='8' fill='#4A3B47'>寒気</text><path d='M 160 100 Q 130 70 160 20' stroke='#E8709F' stroke-width='2' fill='none'/><polygon points='160,20 148,25 155,35' fill='#E8709F'/><text x='170' y='55' font-size='8' fill='#4A3B47'>暖気</text><text x='60' y='115' font-size='8' text-anchor='middle' fill='#4A3B47'>寒冷前線</text><text x='160' y='115' font-size='8' text-anchor='middle' fill='#4A3B47'>温暖前線</text></svg>"},
  {id:"ear357", cat:"地学", sub:"火山と火成岩", q:"図の左側のような、傾斜が急な形の火山ができる原因として正しいものはどれか。", choices:["マグマのねばりけが強いこと","マグマのねばりけが弱いこと","マグマの温度が非常に低いこと","火山の噴火が一度も起きていないこと"], diff:"標準", a:0, e:"【図の読み取り】図の左側には、傾斜が急でとがった形の火山が描かれています。／【考え方】マグマのねばりけが強い（二酸化ケイ素を多くふくむ）と、溶岩が流れにくく、火口付近に盛り上がるように固まりやすいため、傾斜が急でとがった形の火山になりやすいという関係があります。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><polygon points='60,110 90,30 120,110' fill='#B89968' opacity='0.7'/><text x='90' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>ねばりけが強い</text><polygon points='150,110 180,80 210,110' fill='#8B7355' opacity='0.7'/><text x='180' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>ねばりけが弱い</text></svg>"},
  {id:"ear358", cat:"地学", sub:"火山と火成岩", q:"図の右側のような、傾斜がゆるやかな形の火山ができる理由として正しいものはどれか。", choices:["マグマのねばりけが弱く、溶岩が遠くまで流れ広がりやすいから","マグマのねばりけが強く、遠くまで流れないから","この火山ではマグマがまったく噴き出していないから","この火山だけ特別に高い山になっているから"], diff:"標準", a:0, e:"【図の読み取り】図の右側には、傾斜がゆるやかな形の火山が描かれています。／【考え方】マグマのねばりけが弱い（さらさらしている）と、噴き出した溶岛が遠くまで流れ広がりやすく、傾斜のゆるやかな、なだらかな形の火山になります。ハワイの火山などがこのタイプの代表例です。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><polygon points='60,110 90,30 120,110' fill='#B89968' opacity='0.7'/><text x='90' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>ねばりけが強い</text><polygon points='150,110 180,80 210,110' fill='#8B7355' opacity='0.7'/><text x='180' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>ねばりけが弱い</text></svg>"},
  {id:"ear359", cat:"地学", sub:"火山と火成岩", q:"図のように、火山の形がマグマのねばりけによって異なることから分かることとして正しいものはどれか。", choices:["火山の形を観察すると、その火山のマグマの性質を推測する手がかりになる","火山の形とマグマの性質にはまったく関係がない","すべての火山は必ず同じ形になる","火山の形は噴火のたびにランダムに変わる"], diff:"標準", a:0, e:"【図の読み取り】マグマのねばりけの強弱によって、できあがる火山の形（傾斜の急・緩）が異なることが示されています。／【考え方】このように、火山の外側の形を観察するだけでも、その火山を作ったマグマがどのような性質（ねばりけの強さ）をもっていたかを推測する手がかりになります。火山学における基本的な考え方の一つです。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><polygon points='60,110 90,30 120,110' fill='#B89968' opacity='0.7'/><text x='90' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>ねばりけが強い</text><polygon points='150,110 180,80 210,110' fill='#8B7355' opacity='0.7'/><text x='180' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>ねばりけが弱い</text></svg>"},
  {id:"ear360", cat:"地学", sub:"地震", q:"図のように、地震が発生した地下の場所アを何というか。", choices:["震源","震央","断層","マグマだまり"], diff:"基礎", a:0, e:"【図の読み取り】図の地下深くに描かれた点アが震源です。／【ことばの意味】「震源」＝地震が発生した地下の場所そのもの。地下の岩盤が破壊されてずれ動いた場所を指します。震源の深さは地震ごとに異なり、浅いものも深いものもあります。", img:"<svg viewBox='0 0 220 140' xmlns='http://www.w3.org/2000/svg'><rect x='10' y='10' width='200' height='10' fill='#7FC8A9'/><text x='30' y='8' font-size='8' fill='#4A3B47'>震央</text><circle cx='40' cy='15' r='4' fill='#E8709F'/><rect x='10' y='20' width='200' height='100' fill='#D6C4A8' opacity='0.5'/><circle cx='120' cy='90' r='6' fill='#F0A63C'/><text x='140' y='95' font-size='8' fill='#4A3B47'>震源</text><line x1='120' y1='90' x2='120' y2='15' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/></svg>"},
  {id:"ear361", cat:"地学", sub:"地震", q:"図で、震源イの真上にあたる地表の地点ウを何というか。", choices:["震央","震源","断層","火口"], diff:"基礎", a:0, e:"【図の読み取り】震源の真上にある、地表の地点ウが震央です。／【ことばの意味】「震央」＝震源の真上にあたる地表の点。一般的に震央に近いほど地震のゆれは大きくなる傾向がありますが、地盤の性質によって例外もあります。震源と震央のちがいをしっかり区別しておきましょう。", img:"<svg viewBox='0 0 220 140' xmlns='http://www.w3.org/2000/svg'><rect x='10' y='10' width='200' height='10' fill='#7FC8A9'/><text x='30' y='8' font-size='8' fill='#4A3B47'>震央</text><circle cx='40' cy='15' r='4' fill='#E8709F'/><rect x='10' y='20' width='200' height='100' fill='#D6C4A8' opacity='0.5'/><circle cx='120' cy='90' r='6' fill='#F0A63C'/><text x='140' y='95' font-size='8' fill='#4A3B47'>震源</text><line x1='120' y1='90' x2='120' y2='15' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/></svg>"},
  {id:"ear362", cat:"地学", sub:"天体の動き", q:"地球が自ら回転する運動を何というか。", choices:["自転","公転","反射","対流"], diff:"基礎", a:0, e:"【ことばの意味】「自転」＝地球が地軸を中心にして、自分自身でコマのように回転する運動。1回転するのにおよそ24時間かかります。この自転によって、昼と夜が入れかわる日周運動が起こります。"},
  {id:"ear363", cat:"地学", sub:"天体の動き", q:"地球が太陽のまわりを1年かけて回る運動を何というか。", choices:["公転","自転","反射","蒸発"], diff:"基礎", a:0, e:"【ことばの意味】「公転」＝地球が太陽のまわりを1年（約365日）かけて1周する運動。この公転と地軸の傾きが組み合わさることで、季節の変化が生まれます。星座の見える位置が季節によって変わる年周運動も、この公転が原因です。"},
  {id:"ear364", cat:"地学", sub:"天気", q:"空にうかんでいる、小さな水滴や氷の粒が集まってできたものを何というか。", choices:["雲","霧","雨","雪"], diff:"基礎", a:0, e:"【ことばの意味】「雲」＝空気中の水蒸気が冷やされて、小さな水滴や氷の粒になり、それが空高くに集まったもの。上昇した空気が冷やされることで水蒸気が凝結し、雲ができます。雲の中の水滴が大きく成長すると、雨として地上に降ってきます。"},
  {id:"ear365", cat:"地学", sub:"天気", q:"雲から水滴が大きくなって地上に落ちてくる現象を何というか。", choices:["雨","露","霜","霧"], diff:"基礎", a:0, e:"【考え方】雲の中の小さな水滴が、たがいにくっつき合うなどして大きく成長し、重力にたえられなくなると、雨として地上に落ちてきます。気温が低いと、水滴が氷の結晶として成長し、雪として降ることもあります。"},
  {id:"ear366", cat:"地学", sub:"火山と火成岩", q:"地下にある、岩石がとけてどろどろになったものを何というか。", choices:["マグマ","溶岩","火山灰","軽石"], diff:"基礎", a:0, e:"【ことばの意味】「マグマ」＝地下深くにある、岩石が高温でとけてどろどろになった物質。マグマが地表に噴き出したものを溶岩といいます。マグマと溶岩は、地下にあるか地表に出たかというちがいで区別されます。"},
  {id:"ear367", cat:"地学", sub:"火山と火成岩", q:"マグマが地表に噴き出したものを何というか。", choices:["溶岩","マグマだまり","火成岩全般","堆積岩"], diff:"基礎", a:0, e:"【ことばの意味】「溶岩」＝マグマが火口から地表に噴き出したもの。地表に出て冷えて固まると、火山岩（火成岩の一種）になります。マグマが地下にとどまっている状態と、地表に出た溶岩の状態を区別して覚えておきましょう。"},
  {id:"ear368", cat:"地学", sub:"地震", q:"地震のゆれの強さを、その場所ごとに表す言葉を何というか。", choices:["震度","マグニチュード","震源の深さ","初期微動継続時間"], diff:"基礎", a:0, e:"【ことばの意味】「震度」＝ある地点での地震のゆれの強さを表す言葉。日本では震度0から震度7までの階級（震度5と6はさらに強・弱に分かれる）で表されます。震源からの距離や地盤の性質によって、同じ地震でも場所によって震度が異なります。"},
  {id:"ear369", cat:"地学", sub:"地震", q:"地震そのものの規模（エネルギーの大きさ）を表す言葉を何というか。", choices:["マグニチュード","震度","初期微動継続時間","液状化"], diff:"基礎", a:0, e:"【ことばの意味】「マグニチュード」＝地震そのものの規模（エネルギーの大きさ）を表す数値。1つの地震につき1つの値が決まります。マグニチュードが1大きくなると、地震のエネルギーは約32倍になるといわれています。震度とは異なる指標であることに注意しましょう。"},
  {id:"ear370", cat:"地学", sub:"地層と岩石", q:"川の流れによって運ばれた土砂が、海や湖の底に積もってできる岩石を何というか。", choices:["堆積岩","火成岩","変成岩","鉱物"], diff:"基礎", a:0, e:"【ことばの意味】「堆積岩」＝土砂や生物の死がいなどが、長い年月をかけて積み重なり、圧力によって固まってできた岩石。れき岩・砂岩・泥岩・石灰岩などが代表的な堆積岩です。層になって重なることが多く、地層を観察する手がかりになります。"},
  {id:"ear371", cat:"地学", sub:"天体の動き", q:"太陽が真南にきたときの高さを何というか。", choices:["南中高度","北極点","天頂","水平線"], diff:"基礎", a:0, e:"【ことばの意味】「南中高度」＝太陽（または星）が真南にきたときの、地平線から測った角度。季節によって南中高度は変化し、夏至の日に最も高く、冬至の日に最も低くなります。この変化が、季節ごとの昼の長さや気温にも関係しています。"},
  {id:"ear372", cat:"地学", sub:"天気", q:"気温や湿度、気圧などをまとめて観測し、天気の変化を予測する仕事を何というか。", choices:["気象観測（天気予報）","地質調査","天体観測","水質調査"], diff:"基礎", a:0, e:"【考え方】気象観測では、気温・湿度・気圧・風向・風速・降水量などのデータを集め、雲のようすや過去のデータとあわせて分析することで、これからの天気の変化を予測します。気象衛星やアメダスなどの観測機器が、この気象観測に役立てられています。"},
  {id:"ear373", cat:"地学", sub:"天気", q:"空気1m³にふくむことができる水蒸気の最大量を何というか。", choices:["飽和水蒸気量","湿度","露点","気圧"], diff:"標準", a:0, e:"【ことばの意味】「飽和水蒸気量」＝空気1m³がふくむことができる水蒸気の最大量。気温が高いほど大きくなります。この飽和水蒸気量に対して、実際にどれくらいの水蒸気をふくんでいるかの割合を、湿度（%）で表します。"},
  {id:"ear374", cat:"地学", sub:"地球と宇宙", q:"太陽・地球・月のうち、自分で光を出している天体はどれか。", choices:["太陽","地球","月","どれも自分で光を出さない"], diff:"基礎", a:0, e:"【考え方】太陽は自分で光を出す恒星です。一方、地球や月は自分では光を出さず、太陽の光を反射することで明るく見えています。月が満ち欠けして見えるのも、太陽の光が当たっている部分が地球からどう見えるかによって変化するためです。"},
  {id:"ear375", cat:"地学", sub:"地球と宇宙", q:"太陽のまわりを回る、地球をふくむ8つの天体をまとめて何というか。", choices:["惑星","恒星","衛星","彗星"], diff:"基礎", a:0, e:"【ことばの意味】「惑星」＝太陽のまわりを回る、比較的大きな天体。水星・金星・地球・火星・木星・土星・天王星・海王星の8つが太陽系の惑星として分類されています。自分で光を出さず、太陽の光を反射して見えます。"},
  {id:"ear376", cat:"地学", sub:"地球と宇宙", q:"地球のまわりを回る、地球にとっての衛星にあたる天体はどれか。", choices:["月","太陽","火星","金星"], diff:"基礎", a:0, e:"【ことばの意味】「衛星」＝惑星のまわりを回る天体。地球にとって、月がこの衛星にあたります。月は地球のまわりをおよそ1か月かけて1周（公転）しており、この動きが月の満ち欠けや、月の出・月の入りの時刻の変化に関係しています。"},
  {id:"ear377", cat:"地学", sub:"火山と火成岩", q:"マグマが冷えて固まってできた岩石を何というか。", choices:["火成岩","堆積岩","変成岩","鉱物のみ"], diff:"基礎", a:0, e:"【ことばの意味】「火成岩」＝マグマが冷えて固まってできた岩石。地下でゆっくり冷えてできた深成岩（花こう岩など）と、地表近くで急に冷えてできた火山岩（玄武岩など）の2種類に分けられます。堆積岩（土砂が固まった岩石）とは、できかたが根本的に異なります。"},
  {id:"ear378", cat:"地学", sub:"天気", q:"風がふく理由として最も適切なものはどれか。", choices:["気圧の高いところから低いところへ空気が移動するから","気温が変化しても風はふかない","風は太陽が動くことで直接生じる","風は地球が止まっているとふかない"], diff:"標準", a:0, e:"【考え方】空気は気圧の高いところから低いところへ移動しようとする性質があります。この空気の移動が風として感じられます。気圧の差が大きいほど、強い風が吹きやすくなります。天気図の等圧線が混み合っている場所ほど、強い風が予想されます。"},
  {id:"ear379", cat:"地学", sub:"地層と岩石", q:"地層の中に見られる、大昔の生物の体や生活のあとが残ったものを何というか。", choices:["化石","鉱物","マグマ","溶岩"], diff:"基礎", a:0, e:"【ことばの意味】「化石」＝大昔の生物の体（骨や貝がらなど）や、生活のあと（足あとなど）が、地層の中に長い年月をかけて保存されたもの。地層ができた時代や当時の環境を知る、貴重な手がかりになります。"},
  {id:"ear380", cat:"地学", sub:"地震", q:"地震が起こる直接の原因として、最も基本的な考え方はどれか。", choices:["地下の岩盤に力が加わり、破壊されてずれ動くこと","太陽の熱によって地面が急にふくらむこと","月の引力が地面を直接引っぱること","風によって地面がけずられること"], diff:"基礎", a:0, e:"【考え方】地下の岩盤には、プレートの動きなどによって常に力が加わっています。この力がある限界をこえると、岩盤が急に破壊されてずれ動き、そのときに発生する振動が地震として地表に伝わります。断層はこのずれの跡として地層に残ります。"},
  {id:"ear381", cat:"地学", sub:"天体の動き", q:"1日のうちで、太陽や星が東からのぼり西にしずむように見える動きを何というか。", choices:["日周運動","年周運動","公転","満ち欠け"], diff:"基礎", a:0, e:"【ことばの意味】「日周運動」＝1日のうちに、太陽や星が東から西へ動いて見える見かけの運動。地球が西から東へ自転しているために、地上から見ると天体が逆向き（東から西）に動いているように見えます。"},
  {id:"ear382", cat:"地学", sub:"天体の動き", q:"季節によって、真夜中に見える星座の位置が少しずつ変わっていく動きを何というか。", choices:["年周運動","日周運動","自転","満ち欠け"], diff:"標準", a:0, e:"【ことばの意味】「年周運動」＝地球が太陽のまわりを1年かけて公転することで、季節ごとに見える星座の位置がわずかにずれていく見かけの動き。1か月でおよそ30°ずつ星座の位置がずれて見えます。この動きによって、季節の代表的な星座（夏の大三角、冬の星座など）が入れかわります。"},
  {id:"ear383", cat:"地学", sub:"天気", q:"気圧が周囲より高い場所を何というか。", choices:["高気圧","低気圧","前線","台風の目のみ"], diff:"基礎", a:0, e:"【ことばの意味】「高気圧」＝周囲より気圧が高い場所。高気圧の中心付近では下降気流が生じやすく、雲ができにくいため、晴れることが多いという特徴があります。天気図で高気圧の位置が分かると、晴れやすい地域の予測に役立ちます。"},
  {id:"ear384", cat:"地学", sub:"天気", q:"気圧が周囲より低い場所を何というか。", choices:["低気圧","高気圧","前線のみ","陸風"], diff:"基礎", a:0, e:"【ことばの意味】「低気圧」＝周囲より気圧が低い場所。低気圧の中心付近では上昇気流が生じやすく、雲ができやすいため、くもりや雨になることが多いという特徴があります。台風も強い低気圧の一種として分類されます。"},
  {id:"ear385", cat:"地学", sub:"地球と宇宙", q:"夜空に見える、みずから光を出す天体を何というか。", choices:["恒星","惑星","衛星","彗星のみ"], diff:"基礎", a:0, e:"【ことばの意味】「恒星」＝太陽のように、みずから光を出す天体。夜空にたくさん見える星の多くは、この恒星にあたります。惑星は自分で光を出さず、恒星（太陽）の光を反射することで光って見えている点が異なります。"},
  {id:"ear386", cat:"地学", sub:"地層と岩石", q:"地層をつくる粒の大きさによって、れき岩・砂岩・泥岩に分類される。この分類の基準になるのは何か。", choices:["粒の大きさ","粒の色","粒のかたさ","粒のできた年代"], diff:"標準", a:0, e:"【考え方】堆積岩は、堆積した粒の大きさによって、れき岩（粒が最も大きい）・砂岩（中くらい）・泥岩（最も小さい）に分類されます。この粒の大きさのちがいは、堆積した場所（河口に近いか遠いか）によって変わることが多く、当時の環境を推測する手がかりにもなります。"},
  {id:"ear387", cat:"地学", sub:"天気", q:"空気中の水蒸気が冷やされて水滴に変わり始める温度を何というか。", choices:["露点","沸点","融点","発火点"], diff:"基礎", a:0, e:"【ことばの意味】「露点」＝空気を冷やしていったとき、ふくみきれなくなった水蒸気が水滴に変わり始める温度。朝、草の葉に露がつくのは、夜間に気温が下がって露点以下になり、空気中の水蒸気が水滴になるためです。"},
  {id:"ear388", cat:"地学", sub:"天体の動き", q:"太陽や星が1日のうちに東からのぼり西にしずむように見える理由は何か。", choices:["地球が自転しているから","太陽や星がそれぞれ動いているから","地球の公転によるものだから","月の引力によるものだから"], diff:"基礎", a:0, e:"【考え方】地球が西から東へ自転しているため、地上から見ると、太陽や星が逆向き（東から西）に動いているように見えます。これを日周運動といい、実際に動いているのは地球自身です。"},
  {id:"ear389", cat:"地学", sub:"地層と岩石", q:"地層の中の粒が、下から上に向かって次第に細かくなっている場合、何が推測できるか。", choices:["堆積した当時、水の流れが次第に穏やかになっていったこと","地層がまったく動いていないこと","気温が急に上昇したこと","生物がまったく生息していなかったこと"], diff:"標準", a:0, e:"【考え方】粒の大きさは水の流れの強さと関係しています。流れが強いときは大きな粒（れき）が、弱いときは細かい粒（泥）が堆積しやすいため、粒が上に向かって細かくなる地層からは、堆積時に水の流れが次第に穏やかになっていったことが推測できます。"},
  {id:"ear390", cat:"地学", sub:"火山と火成岩", q:"火山の噴火にともなって発生する、細かい岩石の粒が空中に飛び散ったものを何というか。", choices:["火山灰","マグマ","溶岩","軽石のみ"], diff:"基礎", a:0, e:"【ことばの意味】「火山灰」＝火山の噴火にともなって噴き出される、非常に細かい岩石の粒。広い範囲に降り積もることがあり、同じ時期に堆積した地層を見分ける手がかり（鍵層）としても利用されます。"},
  {id:"ear391", cat:"地学", sub:"地震", q:"地震のゆれが伝わる速さが異なる2種類の波（P波・S波）のうち、あとから伝わる大きなゆれを引き起こす波はどちらか。", choices:["S波","P波","どちらも同時に伝わる","どちらのゆれも同じ大きさ"], diff:"標準", a:0, e:"【考え方】P波は速く伝わり、小さなゆれ（初期微動）を引き起こします。S波はP波よりも遅れて伝わりますが、大きなゆれ（主要動）を引き起こします。地震の被害の多くは、このS波による大きなゆれによるものです。"},
  {id:"ear392", cat:"地学", sub:"天気", q:"日本付近の天気が西から東へ変わっていくことが多い理由として最も適切なものはどれか。", choices:["日本の上空を吹く偏西風の影響を受けているから","太陽が西から昇るから","地球の自転が西向きだから","海流がすべて西から東へ流れているから"], diff:"標準", a:0, e:"【ことばの意味】「偏西風」＝日本をふくむ中緯度帯の上空を、西から東へ向かって吹く強い風。この偏西風の影響を受けて、高気圧や低気圧、それにともなう天気も西から東へ移動していくことが多くなります。"},
  {id:"ear393", cat:"地学", sub:"地球と宇宙", q:"太陽の表面に見られる、周囲より温度が低いために黒く見える部分を何というか。", choices:["黒点","クレーター","プロミネンス","コロナ"], diff:"標準", a:0, e:"【ことばの意味】「黒点」＝太陽の表面（光球）に見られる、周囲より温度が低いために暗く見える部分。強い磁場のはたらきによって生じると考えられています。黒点の観察から、太陽が自転していることも確認できます。"},
  {id:"ear394", cat:"地学", sub:"地層と岩石", q:"サンゴの化石が地層から見つかった場合、その地層が堆積した当時の環境として推測できることは何か。", choices:["暖かく浅い海であったこと","寒冷な陸上であったこと","高い山の上であったこと","深い森林であったこと"], diff:"標準", a:0, e:"【ことばの意味】「示相化石」＝地層ができた当時の環境を推測する手がかりになる化石。サンゴは現在、暖かく浅い海に生息しているため、サンゴの化石が見つかった地層は、堆積当時も同じような環境（暖かく浅い海）であったと推測できます。"},
  {id:"ear395", cat:"地学", sub:"天気", q:"高気圧の中心付近でよく見られる空気の動きとして正しいものはどれか。", choices:["下降気流が生じ、晴れやすい","上昇気流が生じ、雲ができやすい","空気はまったく動かない","真横にのみ移動する"], diff:"標準", a:0, e:"【考え方】高気圧の中心付近では、周囲に向かって風が吹き出すため、その分を補うように上空から空気が下りてくる下降気流が生じます。下降気流は雲をできにくくするため、高気圧におおわれると晴れやすくなります。"},
  {id:"ear396", cat:"地学", sub:"天体の動き", q:"季節によって真夜中に見える星座が変わっていくのは、地球のどのような運動が原因か。", choices:["公転","自転","歳差運動のみ","潮の満ち引き"], diff:"標準", a:0, e:"【考え方】地球が太陽のまわりを1年かけて公転することで、地球から見て太陽と反対方向にある星座（つまり真夜中によく見える星座）が、季節によって少しずつ変わっていきます。これを星の年周運動といいます。"},
  {id:"ear397", cat:"地学", sub:"火山と火成岩", q:"火山岩と深成岩のうち、地下深くでゆっくり冷えて固まったものはどちらか。", choices:["深成岩","火山岩","どちらも同じでき方","どちらも堆積岩の一種"], diff:"基礎", a:0, e:"【ことばの意味】「深成岩」＝マグマが地下深くでゆっくり冷えて固まった火成岩。ゆっくり冷えるため、大きな結晶が成長し、等粒状組織というつくりになります。花こう岩が代表例です。"},
  {id:"ear398", cat:"地学", sub:"火山と火成岩", q:"火山岩と深成岩のうち、地表近くで急に冷えて固まったものはどちらか。", choices:["火山岩","深成岩","どちらも同じでき方","どちらも堆積岩の一種"], diff:"基礎", a:0, e:"【ことばの意味】「火山岩」＝マグマが地表近くで急に冷えて固まった火成岩。急に冷えるため、大きな結晶が育つ時間がなく、細かい結晶やガラス質の部分をふくむ斑状組織というつくりになります。玄武岩が代表例です。"},
  {id:"ear399", cat:"地学", sub:"地震", q:"地震が発生した地下の場所そのものを何というか。", choices:["震源","震央","断層のみ","火口"], diff:"基礎", a:0, e:"【ことばの意味】「震源」＝地震が発生した地下の場所そのもの。震源の真上にあたる地表の地点を震央といいます。震源の深さは地震ごとに異なり、浅い地震ほど震央付近で強いゆれになりやすい傾向があります。"},
  {id:"ear400", cat:"地学", sub:"天気", q:"温暖前線が通過したあとの天気の変化として、一般的に見られやすいものはどれか。", choices:["気温が上がり、南寄りの風に変わることが多い","気温が急激に下がり、雷をともなう激しい雨になる","天気にはまったく変化が見られない","急に雪が降り始める"], diff:"標準", a:0, e:"【考え方】温暖前線が通過すると、暖かい気団におおわれるようになるため、気温が上がり、風向きも南寄りに変わることが多くなります。寒冷前線通過後の急激な気温低下とは対照的な変化です。"},
  {id:"ear401", cat:"地学", sub:"地球と宇宙", q:"月の見かけの形が毎日少しずつ変わっていく現象を何というか。", choices:["満ち欠け","日食","黒点の移動","自転"], diff:"基礎", a:0, e:"【考え方】月が地球のまわりを公転することで、太陽に照らされて光っている部分の見え方が変化し、新月・三日月・半月・満月というように見かけの形が変わっていきます。これを月の満ち欠けといい、周期はおよそ29.5日です。"},
  {id:"ear402", cat:"地学", sub:"地層と岩石", q:"堆積岩のうち、生物の死がい（貝殻やサンゴなど）が堆積してできる、炭酸カルシウムを多くふくむ岩石はどれか。", choices:["石灰岩","れき岩","泥岩","チャート"], diff:"標準", a:0, e:"【ことばの意味】「石灰岩」＝サンゴや貝殻など、炭酸カルシウムをふくむ生物の死がいが堆積してできた堆積岩。うすい塩酸をかけると二酸化炭素の泡を出しながら溶けるという性質があり、この反応で石灰岩を見分けることができます。"},
  {id:"ear403", cat:"地学", sub:"天気", q:"日本の夏の天気の特徴として、正しいものはどれか。", choices:["太平洋高気圧におおわれ、蒸し暑い晴天が続きやすい","冬型の気圧配置が続き、日本海側で大雪になる","1年でもっとも気温が低くなる季節である","偏西風が最も強くなる季節である"], diff:"標準", a:0, e:"【考え方】夏になると太平洋高気圧が発達し、日本列島をおおうことが多くなります。あたたかく湿った空気におおわれるため、蒸し暑い晴天が続きやすくなります。冬型の気圧配置は冬の特徴です。"},
  {id:"ear404", cat:"地学", sub:"火山と火成岩", q:"マグマにふくまれる二酸化ケイ素の割合が多いほど、マグマのねばりけはどうなる傾向があるか。", choices:["強くなる（ねばりけが大きくなる）","弱くなる（ねばりけが小さくなる）","変化しない","色だけが変わる"], diff:"標準", a:0, e:"【考え方】マグマにふくまれる二酸化ケイ素（SiO₂）の割合が多いほど、マグマのねばりけは強くなる傾向があります。ねばりけの強いマグマは爆発的な噴火を起こしやすく、急な形の火山をつくりやすいという特徴があります。"},
  {id:"ear405", cat:"地学", sub:"地球と宇宙", q:"太陽系の惑星のうち、地球のすぐ内側を公転している惑星はどれか。", choices:["金星","火星","木星","土星"], diff:"基礎", a:0, e:"【考え方】太陽に近い順に、水星・金星・地球・火星・木星・土星・天王星・海王星と並んでいます。地球のすぐ内側（太陽に近い側）を公転しているのは金星です。金星は「明けの明星」「宵の明星」として観察されることでも知られています。"},
  {id:"ear406", cat:"地学", sub:"天気", q:"風向・風力・天気を、決まった記号で地図上に表したものを何というか。", choices:["天気図","地形図","星座早見","震度分布図"], diff:"基礎", a:0, e:"【ことばの意味】「天気図」＝各地点の気圧・風向・風力・天気などを、決まった記号を使って地図上に表したもの。高気圧・低気圧・前線の位置が示され、これをもとに天気の変化を予測することができます。"},
  {id:"ear407", cat:"地学", sub:"地震", q:"津波が発生しやすいとされる地震の特徴として正しいものはどれか。", choices:["震源が海底にあり、海底の地形が大きく変化するような地震","震源が必ず陸地の内部にある地震","マグニチュードに関係なくすべての地震","震度が1以下の弱い地震のみ"], diff:"標準", a:0, e:"【考え方】津波は、海底で地震が発生し、海底の地形が大きく上下に変化することで、その上にある海水全体が動かされて発生します。震源が海底にあり、規模の大きい地震ほど津波が発生しやすいとされています。"},
  {id:"ear408", cat:"地学", sub:"天体の動き", q:"地球の地軸が公転面に対して傾いていることが原因で生じる現象は何か。", choices:["季節の変化","月の満ち欠け","日食","地震"], diff:"標準", a:0, e:"【考え方】地球の地軸は公転面に対して約23.4度傾いています。この傾きのまま地球が太陽のまわりを公転するため、太陽の光が当たる角度が季節によって変化し、気温の変化（季節）が生まれます。"},
  {id:"ear409", cat:"地学", sub:"地層と岩石", q:"地層の中に見られる化石のうち、地層ができた時代（年代）を特定する手がかりになる化石を何というか。", choices:["示準化石","示相化石","生痕化石のみ","鍵化石のみ"], diff:"標準", a:0, e:"【ことばの意味】「示準化石」＝地層ができた時代（年代）を決定する手がかりになる化石。短い期間に広い範囲で栄えた生物の化石が適しており、三葉虫（古生代）、アンモナイト（中生代）、ビカリア（新生代）などが代表例です。"},
  {id:"ear410", cat:"地学", sub:"天気", q:"雲量（空全体にしめる雲の割合）が少ないときの天気として正しいものはどれか。", choices:["晴れ","くもり","雨","雪"], diff:"基礎", a:0, e:"【考え方】天気は空全体を10としたときの雲の量（雲量）で判断されます。雲量が0〜1で快晴、2〜8で晴れ、9〜10でくもりとされています（気象庁の基準の一例）。雲量が少ないほど晴れの天気になります。"},
  {id:"ear411", cat:"地学", sub:"地球と宇宙", q:"地球から見て、恒星である太陽の特徴として正しいものはどれか。", choices:["みずから光を出している","地球の光を反射して光っている","月の光を反射して光っている","惑星の一種である"], diff:"基礎", a:0, e:"【ことばの意味】「恒星」＝みずから光を出している天体。太陽は代表的な恒星の一つで、中心部での核融合反応によって光と熱を出し続けています。惑星（地球や金星など）は自分では光を出さず、太陽の光を反射して見えている点が異なります。"},
  {id:"che427", cat:"化学", sub:"気体の性質", q:"図のように、水にとけやすい気体を集める場合、次に考えるべきことは何か。", choices:["空気より重いか軽いかによって上方置換か下方置換かを選ぶ","必ず水上置換法を使う","気体の色によって集め方を決める","集め方に決まりはなく自由に選んでよい"], diff:"標準", a:0, e:"【図の読み取り】水にとけやすい気体には水上置換法が使えないため、別の方法を考える必要があることが示されています。／【考え方】水にとけやすい気体は、空気より軽ければ上方置換法（アンモニアなど）、空気より重ければ下方置換法（塩化水素など）というように、空気との重さの比較によって集め方を選び分けます。", img:"<svg viewBox='0 0 240 140' xmlns='http://www.w3.org/2000/svg'><rect x='30' y='30' width='60' height='80' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='60' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>水にとけにくい</text><text x='60' y='20' font-size='9' text-anchor='middle' fill='#4A3B47'>水上置換</text><rect x='150' y='30' width='60' height='80' fill='none' stroke='#4A3B47' stroke-width='2'/><text x='180' y='125' font-size='9' text-anchor='middle' fill='#4A3B47'>水にとけやすい</text><text x='180' y='20' font-size='9' text-anchor='middle' fill='#4A3B47'>上方/下方置換</text><path d='M 40 90 Q 60 70 80 90' stroke='#6BA8DB' stroke-width='1.5' fill='none'/><path d='M 160 90 Q 180 60 200 90' stroke='#F0A63C' stroke-width='1.5' fill='none'/></svg>"},
  {id:"che428", cat:"化学", sub:"物質のすがた", q:"物質が水にとける現象のように、見た目は変化するが物質そのものは変わらない変化を何というか。", choices:["物理変化","化学変化","中和","酸化"], diff:"基礎", a:0, e:"【ことばの意味】「物理変化」＝物質そのものの性質は変わらず、形や状態だけが変わる変化。溶解（水にとかす）や状態変化（氷がとける、水が蒸発するなど）がこれにあたります。／【化学変化との違い】化学変化では、まったく別の性質をもつ新しい物質が生まれます。この2つの違いを区別することが理科の基本です。"},
  {id:"che429", cat:"化学", sub:"物質のすがた", q:"氷がとけて水になる変化と、鉄がさびる変化のうち、化学変化にあたるのはどちらか。", choices:["鉄がさびる変化","氷がとけて水になる変化","どちらも化学変化ではない","どちらも同じ種類の変化である"], diff:"基礎", a:0, e:"【考え方】氷がとけて水になる変化は、水という物質そのものは変わらない状態変化（物理変化）です。一方、鉄がさびる変化は、鉄が酸素と結びついて酸化鉄という、鉄とはまったく異なる性質をもつ新しい物質に変わる化学変化です。"},
  {id:"che430", cat:"化学", sub:"気体の性質", q:"燃焼にはものを燃やす酸素が必要である。酸素の割合が多い空気の中でろうそくを燃やすと、燃え方はどうなるか。", choices:["ふつうの空気中よりも激しく燃える","燃え方はまったく変わらない","すぐに火が消えてしまう","炎の色だけが変わる"], diff:"標準", a:0, e:"【考え方】燃焼には酸素が必要で、酸素の濃度が高いほど、ものはより激しく燃える性質があります。酸素を集めた集気びんの中に火のついた線香を入れると、激しく炎を上げて燃えるのはこのためです。"},
  {id:"che431", cat:"化学", sub:"物質のすがた", q:"氷・水・水蒸気は、状態は異なるが、同じ何という物質からできているか。", choices:["水（H₂O）","二酸化炭素","酸素","水素"], diff:"基礎", a:0, e:"【考え方】氷（固体）・水（液体）・水蒸気（気体）は、姿は異なりますが、すべて同じ水（H₂O）という物質でできています。状態変化では物質そのものの種類は変わらず、粒子の運動のようすや並び方だけが変化します。"},
  {id:"che432", cat:"化学", sub:"化学変化と質量", q:"物質が別の物質に変化するとき、質量が変わらないのはなぜか。", choices:["反応の前後で原子の種類と数が変わらないから","反応の前後で原子が増えるから","反応の前後で原子が消えるから","化学変化では質量ははかれないから"], diff:"標準", a:0, e:"【ことばの意味】「質量保存の法則」＝化学変化の前後で全体の質量は変わらないという法則。／【理由】化学変化は原子の組み合わせ方が変わるだけで、原子そのものが新しく生まれたり消えたりすることはありません。原子の種類と数が変わらないため、全体の質量も変わりません。"},
  {id:"che433", cat:"化学", sub:"酸・アルカリと中和", q:"酸性の水溶液に共通する性質として正しいものはどれか。", choices:["すっぱい味がするものが多い","すべて赤色をしている","すべて強いにおいがする","電気をまったく通さない"], diff:"基礎", a:0, e:"【考え方】酸性の水溶液には、すっぱい味がするものが多いという性質があります（食酢やレモン汁など）。ただし色やにおいは物質によってさまざまで、酸性であることと直接結びついているわけではありません。多くの酸性水溶液は電解質であり、電気を通します。"},
  {id:"che434", cat:"化学", sub:"酸・アルカリと中和", q:"アルカリ性の水溶液に共通する性質として正しいものはどれか。", choices:["手にふれるとぬるぬるした感触があるものが多い","すべてが強い酸性の性質をもつ","すべて無色透明である","電気をまったく通さない"], diff:"基礎", a:0, e:"【考え方】アルカリ性の水溶液（せっけん水など）には、手にふれるとぬるぬるした感触があるものが多いという特徴があります。これはアルカリ性の物質が皮膚の油分と反応するためと考えられています。多くのアルカリ性水溶液も電解質であり、電気を通します。"},
  {id:"che435", cat:"化学", sub:"物質のすがた", q:"食塩(塩化ナトリウム)を水に少量とかしたとき、水溶液の透明さはどうなるか。", choices:["とかす前と同じように透明である","白くにごる","黄色くにごる","黒く変色する"], diff:"基礎", a:0, e:"【考え方】水溶液は、溶質（この場合は食塩）が水の中に均一に、目に見えないほど細かく分かれてとけている状態です。とけた後も透明さは保たれ、にごったり色が変わったりすることはありません。これが「とけている」状態の大きな特徴です。"},
  {id:"che436", cat:"化学", sub:"気体の性質", q:"空気中でものが燃えたあと、酸素の割合はどうなるか。", choices:["燃える前より少なくなる","燃える前より多くなる","まったく変化しない","酸素がすべてなくなる"], diff:"標準", a:0, e:"【考え方】ものが燃える（燃焼する）ときには、酸素が使われて二酸化炭素などができます。密閉した容器の中でろうそくなどを燃やすと、容器内の酸素の割合が少しずつ減っていき、酸素が少なくなると火は自然に消えてしまいます。"},
  {id:"che437", cat:"化学", sub:"物質のすがた", q:"食塩水を冷凍庫で凍らせたとき、味の濃さについて一般的に言われていることはどれか。", choices:["部分によって濃さにかたよりが生じることがある","全体が完全に均一な濃さのまま凍る","水と塩が完全に分離して混ざらなくなる","味がまったくなくなる"], diff:"標準", a:0, e:"【考え方】水溶液を凍らせるとき、純粋な水の部分から先に凍りやすく、とけていた物質（塩分など）はあとまで凍りにくいという性質があります。そのため、凍らせ方によって部分ごとの濃さにかたよりが生じることがあります。海水を凍らせて真水を得る技術にもこの性質が利用されることがあります。"},
  {id:"che438", cat:"化学", sub:"化学変化と質量", q:"ものを燃やしたときにできる灰の質量が、もとの木の質量より軽くなる理由として正しいものはどれか。", choices:["燃焼で二酸化炭素や水蒸気となって空気中に出ていく成分があるから","燃やすと質量保存の法則が成り立たなくなるから","灰は必ずもとの木より重い元素でできているから","木の質量は燃やす前から軽く見えていただけだから"], diff:"標準", a:0, e:"【考え方】木（有機物）を燃やすと、木にふくまれる炭素や水素が空気中の酸素と結びついて、二酸化炭素や水蒸気になり空気中に出ていきます。残った灰には、この出ていった成分がふくまれていないため、もとの木より軽くなります。密閉容器で燃やせば全体の質量は変わりません。"},
  {id:"che439", cat:"化学", sub:"気体の性質", q:"風船にヘリウムを入れてふくらませると、風船が浮き上がる。この理由として正しいものはどれか。", choices:["ヘリウムが空気より軽い（密度が小さい）気体だから","ヘリウムには特別な浮く力があるから","ヘリウムは風船と化学反応を起こすから","ヘリウムは電気を帯びているから"], diff:"基礎", a:0, e:"【考え方】ヘリウムは空気よりも密度が小さい（軽い）気体です。密度の小さい気体で満たされた風船は、まわりの空気より軽くなるため、空気中で浮力を受けて浮き上がります。風船で運動会などに使われるのはこの性質のためです。"},
  {id:"che440", cat:"化学", sub:"物質のすがた", q:"物質を加熱したときに、質量に変化がなく、姿だけが固体→液体→気体と変わっていく変化を何と呼ぶか。", choices:["状態変化","化学変化","中和反応","酸化反応"], diff:"基礎", a:0, e:"【ことばの意味】「状態変化」＝温度によって物質が固体・液体・気体とすがたを変える変化。物質そのものの種類（化学式で表される性質）は変わりません。加熱・冷却による状態変化では、質量そのものは変化しません。"},
  {id:"che441", cat:"化学", sub:"酸・アルカリと中和", q:"炭酸飲料が弱い酸性を示す理由として正しいものはどれか。", choices:["とけている二酸化炭素が水と反応して炭酸になるから","飲料の色が酸性を示しているから","飲料に金属がとけているから","冷たい温度そのものが酸性を作るから"], diff:"標準", a:0, e:"【考え方】炭酸飲料には二酸化炭素がとけています。二酸化炭素は水にとけると一部が炭酸という弱い酸性の物質に変わります。このため、炭酸飲料は弱い酸性を示し、BTB溶液を加えると黄色っぽい色に変化することが確かめられます。"},
  {id:"che442", cat:"化学", sub:"化学変化と質量", q:"鉄粉と硫黄の粉末を混ぜて加熱すると、鉄でも硫黄でもない硫化鉄という物質ができる。この変化を何というか。", choices:["化合","分解","中和","蒸発"], diff:"基礎", a:0, e:"【ことばの意味】「化合」＝2種類以上の物質が結びついて、まったく新しい性質をもつ1種類の物質になる化学変化。／【この反応の特徴】できた硫化鉄は、磁石にほとんど引きつけられなくなったり、塩酸を加えると鉄とは違うにおいのする気体が出たりと、もとの鉄・硫黄とは異なる性質を示します。"},
  {id:"che443", cat:"化学", sub:"物質のすがた", q:"混合物である空気から、成分ごとに分けることができるのはなぜか。", choices:["空気中の各気体の沸点がそれぞれ異なるから","空気は分けることができないから","空気はすべて同じ性質をもつから","空気には成分が1種類しかないから"], diff:"標準", a:0, e:"【考え方】空気は窒素・酸素・アルゴンなどが混ざった混合物です。それぞれの気体は沸点（液体から気体に変わる温度）が異なるため、空気を非常に低い温度に冷やして液体にしたあと、少しずつ温度を上げていくと、沸点の低いものから順に気体として分離できます。"},
  {id:"che444", cat:"化学", sub:"気体の性質", q:"密閉した容器の中でろうそくを燃やし続けると、やがて自然に火が消える。この理由として正しいものはどれか。", choices:["容器内の酸素が少なくなり、燃焼を続けられなくなるから","容器内の二酸化炭素がすべてなくなるから","ろうそくが冷えて燃えられなくなるから","容器が熱で変形してしまうから"], diff:"標準", a:0, e:"【考え方】燃焼には酸素が必要です。密閉した容器の中で燃やし続けると、容器内の酸素がどんどん使われて少なくなっていき、燃焼を続けるのに十分な酸素がなくなると、火は自然に消えてしまいます。"},
  {id:"che445", cat:"化学", sub:"物質のすがた", q:"ものが水に「とけている」状態について正しい説明はどれか。", choices:["とけた物質が、水の中で目に見えないほど細かく均一に広がっている状態","とけた物質が、水の底に沈んで見えている状態","とけた物質が、化学変化して別の物質に変わった状態","とけた物質が水と混ざらずに浮いている状態"], diff:"基礎", a:0, e:"【ことばの意味】「とける（溶解）」＝物質が水などの液体の中で、目に見えないくらい細かい粒子になって、均一に広がっている状態になること。時間がたっても物質が下に沈んだり分離したりしません。この点が、単に混ざっているだけの状態（にごり）とは異なります。"},
  {id:"che446", cat:"化学", sub:"酸・アルカリと中和", q:"うすい塩酸とうすい水酸化ナトリウム水溶液をちょうど中和させると、できる水溶液の性質として正しいものはどれか。", choices:["ほぼ中性になることが多い","強い酸性のままである","強いアルカリ性のままである","水溶液ではなくなる"], diff:"標準", a:0, e:"【考え方】塩酸（酸）と水酸化ナトリウム水溶液（アルカリ）をちょうどよい量で混ぜ合わせると、酸とアルカリの性質がたがいに打ち消し合い、できる水溶液（食塩水）はほぼ中性になります。ただし塩の種類によっては、中和後も完全な中性にならない場合もあります。"},
  {id:"che447", cat:"化学", sub:"化学変化と質量", q:"物質を加熱すると質量が増えることがある。この理由として最も適切なものはどれか。", choices:["空気中の酸素が物質と結びついたから","加熱によって物質の原子が増えたから","加熱で物質の体積だけが増えたから","加熱で新しい水分子が生まれたから"], diff:"標準", a:0, e:"【考え方】金属などを空気中で加熱すると、空気中の酸素と結びついて酸化物ができます。もとの物質の質量に、結びついた酸素の質量が加わるため、加熱後の物質の質量は増加します。原子が新たに生まれたわけではなく、酸素という別の物質が加わったことが理由です。"},
  {id:"che448", cat:"化学", sub:"物質のすがた", q:"金属を加工して細くのばした針金には、金属のどのような性質が利用されているか。", choices:["延性（引っぱると細くのびる性質）","展性（たたくと広がる性質）","電気を通さない性質","水にとける性質"], diff:"基礎", a:0, e:"【ことばの意味】「延性」＝金属を引っぱると、切れずに細くのびる性質。針金や電線などは、この延性を利用して金属を細長く加工したものです。展性（たたいて広げる性質）とは、力の加え方が異なる点に注意しましょう。"},
  {id:"che449", cat:"化学", sub:"気体の性質", q:"空気を構成する気体のうち、化学的に安定していて他の物質と反応しにくい気体はどれか。", choices:["窒素","酸素","二酸化炭素","水素"], diff:"標準", a:0, e:"【考え方】窒素は空気の約78%を占める気体ですが、化学的に非常に安定しており、常温では他の物質とほとんど反応しません。この性質を利用して、お菓子の袋の中に窒素を充填し、食品の酸化（品質の劣化）を防ぐ工夫がされることがあります。"},
  {id:"che450", cat:"化学", sub:"物質のすがた", q:"液体を冷やしていくと、ある温度でこおり始める。この温度を何というか。", choices:["凝固点","沸点","融点","発火点"], diff:"基礎", a:0, e:"【ことばの意味】「凝固点」＝液体が冷やされて固体に変わり始める温度。水の凝固点は0℃です。／【融点との関係】同じ物質では、凝固点と融点（固体がとけ始める温度）はふつう同じ値になります。水の場合、こおる温度もとける温度も0℃です。"},
  {id:"che451", cat:"化学", sub:"化学変化と質量", q:"うすい塩酸に炭酸カルシウム(石灰石)を加えたときに発生する気体を集めて、火のついた線香を入れるとどうなるか。", choices:["線香の火が消える","線香がさらに激しく燃える","線香の色が変わる","何も変化は起こらない"], diff:"標準", a:0, e:"【考え方】この反応で発生する気体は二酸化炭素です。二酸化炭素にはものを燃やすはたらき（助燃性）がないため、火のついた線香を入れると、燃焼に必要な酸素が不足し、線香の火は消えてしまいます。酸素（助燃性がある）とのちがいを問う代表的な実験です。"},
  {id:"che452", cat:"化学", sub:"物質のすがた", q:"物質の融点や沸点は、その物質の量（質量）によって変化するか。", choices:["物質の量が変わっても、融点や沸点は変わらない","物質の量が多いほど融点や沸点は高くなる","物質の量が多いほど融点や沸点は低くなる","物質の量によって融点や沸点はランダムに変わる"], diff:"標準", a:0, e:"【考え方】融点や沸点は、その物質固有の値であり、物質の量（質量）には関係しません。少量の水でも大量の水でも、凍り始める温度は同じ0℃、ふっとうし始める温度は同じ100℃です。この性質を利用して、物質を区別する手がかりにすることができます。"},
  {id:"che453", cat:"化学", sub:"物質のすがた", q:"物質のようすを固体・液体・気体の3つに分けたものを何というか。", choices:["物質の三態","三原色","三態変化のみ","状態の三種"], diff:"基礎", a:0, e:"【ことばの意味】「物質の三態」＝物質がとりうる固体・液体・気体という3つの状態のこと。温度によって、同じ物質でもこれらの状態を行き来します（状態変化）。水は氷（固体）・水（液体）・水蒸気（気体）という三態の代表例です。"},
  {id:"che454", cat:"化学", sub:"気体の性質", q:"水素が燃焼すると、何が生成されるか。", choices:["水（水蒸気）","二酸化炭素","酸素","窒素酸化物"], diff:"基礎", a:0, e:"【反応式】2H₂＋O₂→2H₂O。水素が空気中の酸素と結びついて燃えると、水（燃焼直後は水蒸気）が生成します。水素は燃焼しても二酸化炭素を出さないため、クリーンな燃料として注目されています。"},
  {id:"che455", cat:"化学", sub:"酸・アルカリと中和", q:"塩酸に水酸化ナトリウム水溶液を少しずつ加えていくと、水溶液中のイオンの数はどう変化していくか。", choices:["酸のイオンとアルカリのイオンが結びつき、水になる分だけイオンの数が減っていく","イオンの数は加える前後でまったく変化しない","イオンの数はどんどん増え続ける","イオンはすべて瞬時に消滅する"], diff:"標準", a:0, e:"【考え方】塩酸のH⁺と水酸化ナトリウムのOH⁻が結びついて水（H₂O）になります。H⁺とOH⁻は電気を帯びたイオンですが、水になると電気を帯びていない分子になるため、中和が進むにつれて水溶液中のイオンの数は減っていきます。"},
  {id:"che456", cat:"化学", sub:"化学変化と質量", q:"化学変化の前後で、原子の組み合わせ方以外に変わらないものは何か。", choices:["原子の種類と数","物質の色","物質のにおい","物質の状態"], diff:"標準", a:0, e:"【考え方】化学変化では原子の結びつき方（組み合わせ）が変わりますが、もとになる原子の種類と数そのものは変わりません。これが質量保存の法則が成り立つ根拠です。一方、色・におい・状態などの性質は、新しい物質ができることで大きく変化することがあります。"},
  {id:"che457", cat:"化学", sub:"物質のすがた", q:"物質が水に溶けている水溶液に共通する性質として正しいものはどれか。", choices:["時間がたっても均一で透明さが保たれる","時間がたつと必ず沈殿ができる","水溶液はすべて同じ色になる","水溶液はすべて電気を通す"], diff:"標準", a:0, e:"【考え方】水溶液は、とけた物質が水の中に均一に、目に見えないほど細かく分かれて存在している状態です。時間がたっても物質が沈んだり分離したりせず、透明さが保たれます（色がついていても透き通っています）。ただし電解質・非電解質によって電気を通すかどうかは異なります。"},
  {id:"che458", cat:"化学", sub:"気体の性質", q:"石灰石に塩酸を加えると気体が発生する。この反応で使われる石灰石の主成分は何か。", choices:["炭酸カルシウム","塩化ナトリウム","水酸化ナトリウム","硫酸バリウム"], diff:"標準", a:0, e:"【ことばの意味】石灰石（貝殻や大理石も同じ成分）の主成分は炭酸カルシウム（CaCO₃）です。塩酸を加えると、CaCO₃＋2HCl→CaCl₂＋H₂O＋CO₂という反応が起き、二酸化炭素が発生します。"},
  {id:"che459", cat:"化学", sub:"化学変化と質量", q:"鉄と硫黄の粉末を混ぜて加熱する前と加熱した後で、それぞれ塩酸を加えたときに発生する気体のにおいの違いから分かることは何か。", choices:["加熱前後で全く別の性質をもつ物質に変化したこと","鉄と硫黄は加熱しても変化しないこと","塩酸の性質が変わったこと","気体の発生には関係がないこと"], diff:"標準", a:0, e:"【考え方】加熱前の鉄粉に塩酸を加えると、においのない水素が発生します。加熱後にできた硫化鉄に塩酸を加えると、卵の腐ったようなにおいのする硫化水素が発生します。このにおいの違いから、加熱によって鉄とはまったく別の性質をもつ新しい物質（硫化鉄）ができたことが確かめられます。"},
  {id:"che460", cat:"化学", sub:"水溶液とイオン", q:"塩化ナトリウム(NaCl)が水にとけて電離するときの反応として正しいものはどれか。", choices:["NaCl→Na⁺＋Cl⁻","NaCl→Na⁻＋Cl⁺","NaCl→Na＋Cl（電離しない）","NaCl→N＋a＋Cl"], diff:"標準", a:0, e:"【考え方】塩化ナトリウムは水にとけると、ナトリウムイオン（Na⁺、陽イオン）と塩化物イオン（Cl⁻、陰イオン）に電離します。ナトリウムは電子を1個失って＋の電気を帯び、塩素は電子を1個受け取って－の電気を帯びます。"},
  {id:"che461", cat:"化学", sub:"物質のすがた", q:"金属のイオンへのなりやすさ（イオン化傾向）が異なる2種類の金属を電解質の水溶液に入れると起こる現象は何か。", choices:["電池と同じしくみで電流を発生させることができる","必ず爆発が起こる","金属がすべて気体になる","色が完全に消える"], diff:"標準", a:0, e:"【考え方】イオン化傾向の異なる2種類の金属（例：亜鉛と銅）を電解質の水溶液に入れると、金属がとける反応と電子の移動が起こり、電池と同じ原理で電流を取り出すことができます。ボルタ電池やダニエル電池はこの原理を利用しています。"},
  {id:"che462", cat:"化学", sub:"気体の性質", q:"燃焼によって発生した二酸化炭素の割合が高い密閉空間に入ると危険とされる理由として正しいものはどれか。", choices:["酸素の割合が相対的に少なくなり、呼吸に必要な酸素が不足するおそれがあるから","二酸化炭素自体が非常に高温だから","二酸化炭素にはすべての物質を溶かす性質があるから","二酸化炭素は爆発性が高いから"], diff:"標準", a:0, e:"【考え方】密閉された空間で燃焼が続くと、酸素が使われて減り、二酸化炭素の割合が増えていきます。酸素の割合が少なくなりすぎると、呼吸に必要な酸素が不足し、健康に影響が出るおそれがあります。換気の悪い場所での火の使用に注意が必要とされる理由の一つです。"},
  {id:"che463", cat:"化学", sub:"酸・アルカリと中和", q:"うすい水酸化ナトリウム水溶液に、うすい塩酸を少しずつ加えていったときのpHの変化として正しいものはどれか。", choices:["7より大きい値から始まり、しだいに7に近づき、さらに加えると7より小さくなる","7より小さい値から始まり、しだいに大きくなる","常にpH7のまま変化しない","加えるとすぐにpH0になる"], diff:"標準", a:0, e:"【考え方】水酸化ナトリウム水溶液はアルカリ性（pH＞7）から始まります。塩酸（酸性）を加えていくと中和が進み、pHは徐々に7に近づき、さらに塩酸を加え続けると酸性（pH＜7）に変化していきます。"},
  {id:"che464", cat:"化学", sub:"化学変化と質量", q:"物質Aと物質Bが反応して物質Cができるとき、Aの質量とBの質量の間にはどのような関係があることが多いか。", choices:["一定の質量の比で過不足なく反応する","質量には全く関係がなく、どんな量でも反応する","Aの質量が常にBの質量よりも大きくなる","質量の関係は反応のたびに毎回変わる"], diff:"標準", a:0, e:"【ことばの意味】「定比例の法則」＝ある化合物を構成する成分の質量の比は、常に一定であるという法則。銅と酸素が反応して酸化銅になるときも、決まった質量の比（例：銅:酸素＝4:1）で過不足なく反応します。"},
  {id:"che465", cat:"化学", sub:"物質のすがた", q:"物質を加熱して沸点に達すると、加え続けた熱はどのように使われるか。", choices:["液体を気体に変えるために使われ、温度は上がらない","すべて温度上昇のために使われる","半分は温度上昇、半分は状態変化に使われる","熱はまったく物質に伝わらなくなる"], diff:"標準", a:0, e:"【考え方】沸点に達すると、それ以上加えた熱は物質の温度を上げることには使われず、液体を気体に変える（状態変化させる）ために使われます。そのため、沸騰している間は温度が一定に保たれます。"},
  {id:"che466", cat:"化学", sub:"気体の性質", q:"実験室で二酸化炭素を発生させる方法として最も一般的なものはどれか。", choices:["石灰石にうすい塩酸を加える","水を加熱する","食塩を加熱する","鉄を燃やす"], diff:"基礎", a:0, e:"【反応】石灰石（炭酸カルシウム）にうすい塩酸を加えると、CaCO₃＋2HCl→CaCl₂＋H₂O＋CO₂という反応が起こり、二酸化炭素が発生します。実験室で手軽に二酸化炭素を得る、代表的な方法として知られています。"},
  {id:"che467", cat:"化学", sub:"水溶液とイオン", q:"うすい塩酸に亜鉛板と銅板を入れて導線でつなぐと、電流が流れる。この電流はどちらの金属からどちらへ向かって電子が移動することで生じるか。", choices:["亜鉛から銅へ電子が移動する","銅から亜鉛へ電子が移動する","電子の移動はなく、イオンだけが動く","どちらの金属からも電子は出ない"], diff:"標準", a:0, e:"【考え方】亜鉛は銅よりイオン化傾向が大きいため、亜鉛原子が電子を失ってイオンになりやすい性質があります（Zn→Zn²⁺＋2e⁻）。放出された電子は導線を通って亜鉛から銅へ移動し、この電子の流れが電流のもとになります。"},
  {id:"che468", cat:"化学", sub:"化学変化と質量", q:"ある金属を加熱して酸化物にすると質量が増加した。このとき増加した質量は主に何によるものか。", choices:["結びついた酸素の質量","金属が新しい元素に変わった質量","加熱による熱そのものの質量","水分を吸収した質量のみ"], diff:"標準", a:0, e:"【考え方】金属が空気中で加熱されると、空気中の酸素と結びついて酸化物になります。もとの金属の質量に、結びついた酸素の質量が加わるため、全体の質量が増加します。熱そのものには質量がないため、質量の増加分は結びついた酸素の量に対応します。"},
  {id:"che469", cat:"化学", sub:"物質のすがた", q:"ろ過を行うとき、ろうとの先のとがった部分をビーカーの内側の壁につける理由として正しいものはどれか。", choices:["液体が飛び散らず、静かに流れ落ちるようにするため","ろ過の速度を遅くするため","ろ紙が破れるのを防ぐため","液体の色を変えないため"], diff:"標準", a:0, e:"【考え方】ろうとの先をビーカーの内側の壁につけておくと、ろ過された液体が壁を伝って静かに流れ落ちるため、飛び散りを防ぎ、実験を安全かつスムーズに行うことができます。ろ過の基本操作の一つとして覚えておきましょう。"},
  {id:"che470", cat:"化学", sub:"酸・アルカリと中和", q:"食酢に重そう（炭酸水素ナトリウム）を加えたときに見られる現象として正しいものはどれか。", choices:["気体（二酸化炭素）が発生して泡立つ","水溶液の色が青色に変わる","即座に固体の結晶ができる","何の変化も起こらない"], diff:"基礎", a:0, e:"【反応】食酢（酢酸をふくむ）と重そう（炭酸水素ナトリウム）が反応すると、酢酸ナトリウム・水・二酸化炭素ができます。発生した二酸化炭素が気泡となって出てくるため、泡立つようすが観察できます。自由研究の実験としてもよく取り上げられる反応です。"},
  {id:"che471", cat:"化学", sub:"物質のすがた", q:"ものが水にとけるとき、とける速さに関係すると考えられる要因として当てはまらないものはどれか。", choices:["物質の色","水の温度","かき混ぜるかどうか","物質を細かくくだくかどうか"], diff:"標準", a:0, e:"【考え方】水の温度が高いほど、物質を細かくするほど、またかき混ぜるほど、一般にとける速さは速くなります。一方、物質そのものの色は、とける速さには直接関係しません。とける「量（溶解度）」と「速さ」を混同しないよう注意しましょう。"},
  {id:"che472", cat:"化学", sub:"気体の性質", q:"密閉した容器の中で、ろうそくの火が燃え続けられなくなる主な理由は何か。", choices:["容器内の酸素が使われて少なくなるから","容器内の二酸化炭素が完全になくなるから","容器の温度が下がりすぎるから","ろうそくのろうが尽きるから（酸素とは無関係に）"], diff:"基礎", a:0, e:"【考え方】燃焼には酸素が必要です。密閉容器内で燃え続けると酸素がどんどん消費されて少なくなり、燃焼を続けるのに十分な酸素がなくなると、火は自然に消えてしまいます。ろうそく自体がまだ残っていても、酸素が不足すれば燃え続けられません。"},
  {id:"che473", cat:"化学", sub:"化学変化と質量", q:"化学反応式を書くとき、矢印の左右で原子の種類と数を合わせる理由は何か。", choices:["質量保存の法則を反応式の上でも表すため","矢印を見やすくするため","係数を大きく見せるため","化学式の見た目をそろえるため"], diff:"標準", a:0, e:"【考え方】化学変化では原子が新しく生まれたり消えたりしないため、反応の前後で原子の種類と数は変わりません（質量保存の法則）。この事実を化学反応式の上でも正しく表すために、矢印の左右で原子の種類と数が一致するよう係数を調整します。"},
  {id:"che474", cat:"化学", sub:"物質のすがた", q:"ものを加熱して赤くなるまで熱したときに出る光について、正しい説明はどれか。", choices:["物質が高温になることで光を出す現象がみられることがある","加熱すると必ず化学変化が起こって発光する","加熱による発光は音の一種である","加熱しても物質は決して光を出さない"], diff:"標準", a:0, e:"【考え方】鉄などの金属を高温に熱すると、赤く光って見えることがあります。これは物質が高温になることで光を放出する現象（熱放射）の一種で、必ずしも化学変化をともなうものではありません。溶鉱炉で赤くなった鉄などがこの例です。"},
  {id:"che475", cat:"化学", sub:"酸・アルカリと中和", q:"うすい塩酸と亜鉛が反応して水素が発生する実験で、亜鉛の量を増やすと発生する水素の量はどうなるか（塩酸が十分にある場合）。", choices:["亜鉛の量に応じて水素の発生量も増える","水素の発生量は亜鉛の量に関係なく一定である","亜鉛を増やすと水素の発生が止まる","水素ではなく酸素が発生するようになる"], diff:"標準", a:0, e:"【考え方】塩酸が十分にある条件では、反応する亜鉛の量が多いほど、発生する水素の量も比例して増えていきます。ただし塩酸の量が不足すると、それ以上亜鉛を増やしても水素の発生量はそれ以上増えなくなります（塩酸がすべて反応に使われてしまうため）。"},
  {id:"che476", cat:"化学", sub:"物質のすがた", q:"ものを燃やしたときにできる灰について、有機物と無機物では燃え方にどのような違いがあるか。", choices:["有機物は燃えて炭や気体になりやすいが、多くの無機物は燃えにくい","有機物も無機物もまったく同じように燃える","無機物の方が有機物より激しく燃える","どちらも燃やすと必ず爆発する"], diff:"標準", a:0, e:"【考え方】有機物（炭素をふくむ物質）は燃えると炭化したり、二酸化炭素や水を発生させたりします。一方、金属や食塩などの多くの無機物は、そもそも燃えにくい（可燃性でない）ものが多く、有機物と無機物を見分ける手がかりの一つになります。"},
  {id:"che477", cat:"化学", sub:"気体の性質", q:"窒素にはどのような性質があるか。", choices:["化学的に安定していて、常温では他の物質と反応しにくい","非常に燃えやすい気体である","水に非常によくとける気体である","強い刺激臭をもつ気体である"], diff:"基礎", a:0, e:"【考え方】窒素は空気の約78%を占める気体で、常温では化学的に安定しており、ほとんど他の物質と反応しません。この性質を利用して、お菓子の袋の中を窒素で満たし、食品の酸化を防ぐ工夫がされることがあります。"},
  {id:"phy345", cat:"物理", sub:"光と音", q:"光がまっすぐ進む性質を何というか。", choices:["光の直進","光の屈折","光の反射","光の分散"], diff:"基礎", a:0, e:"【ことばの意味】「直進」＝まっすぐ進むこと。光は空気中など同じ物質の中を進むとき、まっすぐに進みます。これを光の直進といいます。／【身近な例】太陽の光がすき間から差しこむとき、光の道すじがまっすぐな線に見えるのはこのため。木もれ日や、雲の切れ間から差す光もこの直進の性質による現象です。／【他の選択肢】屈折は物質の境界で進路が曲がること、反射ははね返ること、分散は色ごとに分かれること。それぞれ別の現象です。"},
  {id:"phy346", cat:"物理", sub:"光と音", q:"鏡に光が当たってはね返る現象を何というか。", choices:["光の屈折","光の反射","光の直進","光の分散"], diff:"基礎", a:1, e:"【ことばの意味】「反射」＝物にぶつかってはね返ること。光が鏡やなめらかな面に当たると、はね返って別の方向へ進みます。これを光の反射といいます。／【反射の法則】入射角（入ってくる角度）と反射角（はね返る角度）は等しくなります。鏡で自分の姿が見えるのは、顔から出た光が鏡で反射して目に届くためです。／【他の選択肢】屈折は物質の境界で進路が曲がること、直進はまっすぐ進むこと、分散は色ごとに分かれることです。"},
  {id:"phy347", cat:"物理", sub:"光と音", q:"凸レンズの中央部分の厚さについて正しいものはどれか。", choices:["中央が周辺部より厚い","中央が周辺部より薄い","中央も周辺部も同じ厚さである","凸レンズには厚みがない"], diff:"基礎", a:0, e:"【ことばの意味】「凸レンズ」＝中央がふくらんだ形のレンズ。虫めがねに使われている。／【形の特徴】凸レンズは中央部分が周辺部よりも厚くなっています。この形のおかげで、レンズを通った光が1点（焦点）に集まる性質があります。／【対になるもの】反対に中央が周辺より薄いレンズを凹レンズといい、光を広げる（発散させる）はたらきがあります。眼鏡でも遠視用は凸レンズ、近視用は凹レンズが使われます。"},
  {id:"phy348", cat:"物理", sub:"光と音", q:"音を出しているものが振動を止めると、音はどうなるか。", choices:["音も止まる","音はさらに大きくなる","音の高さが変わる","音は止まらず鳴り続ける"], diff:"基礎", a:0, e:"【ことばの意味】「振動」＝物が細かくふるえ動くこと。音は物が振動することで発生します。／【なぜ止まる？】太鼓や弦などが振動することで空気が振動し、その振動が波として耳に届くことで音として聞こえます。振動が止まれば、それ以上音は発生しないため、音も止まります。／【確かめる方法】音を出している音さに手でそっと触れると、振動が止まり音も止まることが確認できます。"},
  {id:"phy349", cat:"物理", sub:"力の働き", q:"力の大きさを表す単位はどれか。", choices:["N（ニュートン）","J（ジュール）","W（ワット）","Pa（パスカル）"], diff:"基礎", a:0, e:"【ことばの意味】「力の大きさ」＝物を押したり引いたりする強さのこと。力の単位はN（ニュートン）で表します。／【身近な感覚】100gの物体にはたらく重力はおよそ1Nです。500mLのペットボトル1本を持ち上げるのに必要な力がおよそ5N程度と考えると、感覚的につかみやすくなります。／【他の単位】Jはエネルギーや仕事の単位、Wは仕事率（電力）の単位、Paは圧力の単位です。それぞれ表すものが異なります。"},
  {id:"phy350", cat:"物理", sub:"力の働き", q:"ばねに加える力を大きくすると、ばねの伸びはどうなるか（フックの法則の範囲内で）。", choices:["伸びも大きくなる","伸びは変わらない","伸びは小さくなる","ばねは伸びずに縮む"], diff:"基礎", a:0, e:"【ことばの意味】「フックの法則」＝ばねの伸びが加えた力の大きさに比例するという法則。／【関係性】力を2倍にすると伸びも2倍に、力を3倍にすると伸びも3倍になります。このように、力と伸びは比例の関係にあります。／【身近な道具】ばねばかりはこの性質を利用して、ばねの伸びから力の大きさ（重さ）を測る道具です。目盛りが等間隔に並んでいるのは、力と伸びが比例しているためです。"},
  {id:"phy351", cat:"物理", sub:"力の働き", q:"物体にはたらく重力の向きはどの方向か。", choices:["地球の中心に向かう向き","地球の中心から遠ざかる向き","水平方向","つねに東の方向"], diff:"基礎", a:0, e:"【ことばの意味】「重力」＝地球が物体を引っぱる力。／【向き】重力はつねに地球の中心に向かう方向にはたらきます。私たちが普段「下向き」と感じている方向が、実は地球の中心へ向かう方向です。／【身近な現象】物を落とすと下に落ちるのは、重力が地球の中心方向にはたらいているためです。地球のどこにいても、その場所での「下」が地球の中心方向になります。"},
  {id:"phy352", cat:"物理", sub:"力の働き", q:"上皿てんびんで物体の質量をはかるとき、分銅は何を基準に選ぶか。", choices:["重い分銅から順に使っていく","軽い分銅から順に使っていく","色の順番で使っていく","分銅はどれを使っても同じ"], diff:"基礎", a:0, e:"【ことばの意味】「上皿てんびん」＝左右の皿につり合いをとることで質量をはかる道具。／【分銅の使い方】まず重い分銅から順にのせていき、つり合いが崩れたら次に軽い分銅に取り替えるという操作をくり返し、少しずつ正確な質量に近づけていきます。／【なぜこの順番？】いきなり軽い分銅から始めると、何度も出し入れする回数が増えて時間がかかってしまいます。重い分銅から試すことで、効率よく測定できます。"},
  {id:"phy353", cat:"物理", sub:"力の働き", q:"物体の質量と重さについて正しいものはどれか。", choices:["質量は場所によって変わらないが、重さは場所によって変わる","質量も重さも場所によって変わらない","質量は場所によって変わるが、重さは変わらない","質量も重さも場所によって変わる"], diff:"基礎", a:0, e:"【ことばの意味】「質量」＝物体そのものの量。「重さ」＝物体にはたらく重力の大きさ。／【なぜ違う？】質量はどこへ行っても変わらない量ですが、重さは重力の大きさによって変わります。月では重力が地球の約1/6なので、同じ物体でも月での重さは地球での重さの約1/6になります。／【単位のちがい】質量はkgやgで、重さ（力）はNで表します。日常生活では「重さ＝質量」のように使うことが多いですが、理科では区別します。"},
  {id:"phy354", cat:"物理", sub:"電流と回路", q:"回路図で電池を表す記号として正しいものはどれか。", choices:["長い線と短い線を組み合わせた記号","波形の線を丸で囲んだ記号","ジグザグの線の記号","二重の丸の記号"], diff:"基礎", a:0, e:"【ことばの意味】「回路図」＝電気の回路を記号で表した図。／【電池の記号】電池は長い線（＋極）と短い線（－極）を組み合わせた記号で表します。長い線の方が電圧が高い側（＋極）を示します。複数の電池をつなぐと、この記号がいくつか並んで描かれます。／【他の記号】ジグザグの線は電熱線（抵抗）、丸に×は電球（豆電球）を表す記号として使われることが多いです。回路図は実際の配線を簡単に表すために使われます。"},
  {id:"phy355", cat:"物理", sub:"電流と回路", q:"電流の単位はどれか。", choices:["A（アンペア）","V（ボルト）","Ω（オーム）","W（ワット）"], diff:"基礎", a:0, e:"【ことばの意味】「電流」＝電気の流れる量のこと。電流の単位はA（アンペア）で表します。／【他の単位との関係】電圧の単位はV（ボルト）、抵抗の単位はΩ（オーム）、電力の単位はW（ワット）です。それぞれ異なる量を表しており、オームの法則（V＝IR）でこれらの関係が結びついています。／【身近な例】家庭用のブレーカーは「20A」のように電流の大きさで容量が決まっており、電流の単位を意識する身近な場面のひとつです。"},
  {id:"phy356", cat:"物理", sub:"電流と回路", q:"電圧の単位はどれか。", choices:["V（ボルト）","A（アンペア）","Ω（オーム）","J（ジュール）"], diff:"基礎", a:0, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ。電圧の単位はV（ボルト）で表します。／【身近な例】乾電池は1.5V、家庭のコンセントは100Vというように、電圧の値は機器や電源によって決まっています。電圧が高いほど、電流を押し流す力が強くなります。／【他の単位】電流はA（アンペア）、抵抗はΩ（オーム）、エネルギーはJ（ジュール）で表され、それぞれ異なる量を示す単位です。"},
  {id:"phy357", cat:"物理", sub:"電流と回路", q:"直列回路の各点を流れる電流の大きさについて正しいものはどれか。", choices:["回路のどこでも電流の大きさは同じである","電源に近いほど電流は大きくなる","電源から遠いほど電流は大きくなる","電流は回路の途中で少しずつ減っていく"], diff:"基礎", a:0, e:"【ことばの意味】「直列回路」＝電流の通り道が1本道になっている回路。／【電流の性質】直列回路では、電流の通り道が1本しかないため、回路のどの点をはかっても電流の大きさは同じになります。電球や抵抗を通っても、電流の量そのものは減りません。／【まちがえやすい点】電球を通ると電流が「使われて減る」と考えてしまいがちですが、実際には電流はどこでも同じ大きさのまま流れ続けます。減るのはエネルギー（電圧）の方です。"},
  {id:"phy358", cat:"物理", sub:"電流と回路", q:"並列回路で、各枝分かれした部分にかかる電圧について正しいものはどれか。", choices:["電源の電圧と同じ電圧がそれぞれにかかる","電源の電圧を等分した電圧がかかる","枝分かれの数が多いほど電圧は大きくなる","電圧はかからない"], diff:"基礎", a:0, e:"【ことばの意味】「並列回路」＝電流の通り道が枝分かれしている回路。／【電圧の性質】並列回路では、それぞれの枝分かれした部分に電源と同じ大きさの電圧がかかります。これは直列回路（電圧が分割される）とは異なる大きな特徴です。／【身近な利用】家庭の配線は並列回路になっているため、どのコンセントを使っても100Vの電圧を得られ、1つの電化製品のスイッチを切っても他の電化製品には影響がありません。"},
  {id:"phy359", cat:"物理", sub:"電流と回路", q:"電熱線に電流を流すと発熱する。この現象を利用した身近な道具はどれか。", choices:["電気ストーブ","懐中電灯のレンズ","扇風機の羽根","冷蔵庫の断熱材"], diff:"基礎", a:0, e:"【ことばの意味】「電熱線」＝電流を流すと熱を発生する導線。ニクロム線などが使われる。／【発熱のしくみ】電流が電熱線を流れるとき、電気抵抗によって電気エネルギーの一部が熱エネルギーに変わります。この性質を利用したものが電気ストーブやトースター、ドライヤーなどです。／【他の選択肢】懐中電灯のレンズは光を集める道具、扇風機の羽根は空気を送る道具、断熱材は熱を伝えにくくする材料で、電熱線とは関係がありません。"},
  {id:"phy360", cat:"物理", sub:"磁界と電流", q:"磁石には何極と何極があるか。", choices:["N極とS極","A極とB極","正極と負極","陽極と陰極"], diff:"基礎", a:0, e:"【ことばの意味】磁石には必ず2つの極があり、N極（北を指す極）とS極（南を指す極）と呼ばれます。／【極の性質】同じ極どうし（N極とN極、S極とS極）は反発し合い、異なる極どうし（N極とS極）は引き合います。方位磁針のN極が北を指すのは、地球自体が大きな磁石になっていて、北極付近にS極に近い性質があるためです。／【他の選択肢】正極・負極や陽極・陰極は電池や電気分解で使われる用語で、磁石の極とは異なります。"},
  {id:"phy361", cat:"物理", sub:"磁界と電流", q:"方位磁針のN極が指す向きは何によって決まるか。", choices:["磁界の向き","風の向き","太陽の位置","気温の変化"], diff:"基礎", a:0, e:"【ことばの意味】「磁界」＝磁石の力がはたらいている空間。方位磁針のN極は、その場所の磁界の向きに沿って向きを変えます。／【地球も磁石】地球全体が大きな磁石のようになっており、地球のまわりには磁界が広がっています。方位磁針を置くとN極がほぼ北を指すのは、地球の磁界の影響を受けているためです。／【身近な実験】磁石のまわりに鉄粉を置くと、磁界の向きに沿って模様ができ、磁界の存在を目で確かめることができます。"},
  {id:"phy362", cat:"物理", sub:"力の働き", q:"てこにおいて、力を加える点を何というか。", choices:["力点","支点","作用点","中心点"], diff:"基礎", a:0, e:"【ことばの意味】てこには3つの重要な点があります。「力点」＝力を加える点。「支点」＝てこを支える固定された点。「作用点」＝力がはたらいて物を動かす点。／【身近な例】くぎぬきを使うとき、手で握って力を加える部分が力点、道具が支えられている部分が支点、くぎに当たる部分が作用点にあたります。／【まちがえやすい点】支点は動かない固定点、力点は人が力を加える点、作用点は実際に仕事をする点、と役割で区別しましょう。"},
  {id:"phy363", cat:"物理", sub:"力の働き", q:"てこで、支点から力点までの距離を長くすると、必要な力はどうなるか。", choices:["小さくなる","大きくなる","変わらない","力点の位置には関係しない"], diff:"基礎", a:0, e:"【てこの原理】力×支点から力点までの距離＝重さ×支点から作用点までの距離、という関係が成り立ちます。／【なぜ小さくなる？】支点から力点までの距離を長くすると、同じ重さの物を持ち上げるのに必要な力は小さくてすむようになります。長い棒を使って重い石を動かす場面を思い浮かべると分かりやすいでしょう。／【身近な道具】くぎぬきや栓抜きなど、てこの原理を利用した道具の多くは、この性質を利用して小さな力で大きな仕事ができるように作られています。"},
  {id:"phy364", cat:"物理", sub:"力の働き", q:"滑車を使わずに、床にある重い物体をまっすぐ持ち上げるとき、必要な力の大きさはどれくらいか。", choices:["物体の重さと同じ大きさの力が必要","物体の重さの半分の力で足りる","物体の重さの2倍の力が必要","力はまったく必要ない"], diff:"基礎", a:0, e:"【考え方】道具を使わずに物体をまっすぐ持ち上げる場合、物体にはたらく重力と同じ大きさの力を上向きに加える必要があります。／【動滑車を使うと】動滑車を使うと必要な力は半分程度になりますが、その分ロープを引く距離は長くなります。道具なしでは、力を小さくする工夫がないため、重さと同じ大きさの力が必要になります。／【身近な感覚】重い荷物を素手で持ち上げるとき、その重さをそのまま感じるのはこのためです。"},
  {id:"phy365", cat:"物理", sub:"熱の伝わり方", q:"氷がとけて水になるとき、温度はどうなるか。", choices:["とけている間は0℃で一定","とけている間もどんどん下がる","とけている間はどんどん上がる","とけると同時に急に高温になる"], diff:"基礎", a:0, e:"【ことばの意味】「融点」＝固体がとけて液体になる温度。氷（水）の融点は0℃。／【なぜ一定？】氷がとけている間、加えた熱は氷を水に変えるためだけに使われ、温度を上げるためには使われません。そのため、とけ終わるまで温度は0℃のまま一定を保ちます。とけ終わった後、さらに熱を加えると水の温度が上がり始めます。／【身近な例】コップの中の氷水は、氷がとけきるまで温度がほぼ0℃のままであることが多く、これはこの性質による現象です。"},
  {id:"phy366", cat:"物理", sub:"熱の伝わり方", q:"水がふっとうしているとき、温度はどうなるか。", choices:["ふっとうしている間は100℃で一定","ふっとうしている間もどんどん上がる","ふっとうしている間はどんどん下がる","ふっとうすると急に200℃をこえる"], diff:"基礎", a:0, e:"【ことばの意味】「沸点」＝液体がふっとうして気体になる温度。水の沸点は100℃（1気圧のとき）。／【なぜ一定？】水がふっとうしている間、加えた熱は水を水蒸気に変えるために使われ、温度を上げることには使われません。そのため、水がすべて蒸発するまで温度は100℃のまま変わりません。／【身近な例】やかんでお湯をわかすとき、沸騰し始めるとしばらく100℃のままグツグツと沸き続けるのはこの性質によるものです。"},
  {id:"phy367", cat:"物理", sub:"熱の伝わり方", q:"金属の棒の一端を熱すると、やがて反対側の端も熱くなる。この熱の伝わり方を何というか。", choices:["伝導","対流","放射","蒸発"], diff:"基礎", a:0, e:"【ことばの意味】「伝導」＝物を伝わって熱が移動すること。金属などの固体の中で、熱い部分から冷たい部分へ熱が伝わっていく現象です。／【なぜ伝わる？】熱い部分の粒子が激しく振動し、隣の粒子にその振動を伝えていくことで、熱が順々に伝わっていきます。金属は熱を伝えやすい（熱伝導率が高い）性質があります。／【他の選択肢】対流は液体や気体が動いて熱を運ぶこと、放射は電磁波で熱が伝わること、蒸発は液体が気体になることで、それぞれ異なる現象です。"},
  {id:"phy368", cat:"物理", sub:"運動とエネルギー", q:"物体が同じ速さで同じ向きにまっすぐ進む運動を何というか。", choices:["等速直線運動","自由落下運動","円運動","往復運動"], diff:"基礎", a:0, e:"【ことばの意味】「等速」＝速さが変わらないこと。「直線」＝まっすぐ進むこと。この2つを合わせて、速さも向きも変わらずにまっすぐ進む運動を等速直線運動といいます。／【記録タイマーでの確認】記録タイマーで等速直線運動を記録すると、打点の間隔がすべて同じになります。間隔が広がっていく場合は速さが増している（加速している）ことを示します。／【身近な例】エスカレーターの動く歩道や、一定速度で走る電車などがこれに近い運動です。"},
  {id:"phy369", cat:"物理", sub:"運動とエネルギー", q:"高いところにある物体がもつエネルギーを何というか。", choices:["位置エネルギー","運動エネルギー","熱エネルギー","化学エネルギー"], diff:"基礎", a:0, e:"【ことばの意味】「位置エネルギー」＝高い位置にあることによって物体がもつエネルギー。／【なぜエネルギーをもつ？】高いところにある物体は、落下することで運動エネルギーに変わる能力（潜在的な力）をもっています。この「これから仕事をする能力」が位置エネルギーです。／【大きさを決めるもの】位置エネルギーは物体の高さが高いほど、また質量が大きいほど大きくなります。ダムにためた水がもつエネルギーは、この位置エネルギーを利用した水力発電に使われています。"},
  {id:"phy370", cat:"物理", sub:"運動とエネルギー", q:"動いている物体がもつエネルギーを何というか。", choices:["運動エネルギー","位置エネルギー","弾性エネルギー","電気エネルギー"], diff:"基礎", a:0, e:"【ことばの意味】「運動エネルギー」＝物体が動いていることによってもつエネルギー。／【大きさを決めるもの】運動エネルギーは物体の速さが速いほど、また質量が大きいほど大きくなります。特に速さの影響が大きく、速さが2倍になるとエネルギーは4倍になります。／【身近な例】走っている自動車がもつエネルギーや、投げたボールがもつエネルギーは運動エネルギーの例です。ぶつかったときの衝撃の大きさに関係しています。"},
  {id:"phy371", cat:"物理", sub:"運動とエネルギー", q:"摩擦のない斜面をボールが下るとき、位置エネルギーが減った分はどうなるか。", choices:["運動エネルギーに変わる","すべて熱として空気中に逃げる","エネルギーとして消滅する","音エネルギーだけに変わる"], diff:"基礎", a:0, e:"【ことばの意味】「力学的エネルギー保存の法則」＝摩擦がない場合、位置エネルギーと運動エネルギーの合計（力学的エネルギー）は一定に保たれるという法則。／【何が起きている？】ボールが斜面を下ると高さが低くなるので位置エネルギーは減りますが、その分速さが増して運動エネルギーが増えます。位置エネルギーが減った分が、そのまま運動エネルギーの増加分になります。／【摩擦があると】摩擦があると、一部のエネルギーが熱として失われるため、この関係は成り立たなくなります。"},
  {id:"phy372", cat:"物理", sub:"仕事とエネルギー", q:"物体に力を加えて、力の向きに物体を動かしたとき、その力がした仕事を求める式はどれか。", choices:["仕事＝力の大きさ×動いた距離","仕事＝力の大きさ＋動いた距離","仕事＝力の大きさ÷動いた距離","仕事＝力の大きさ×時間"], diff:"基礎", a:0, e:"【ことばの意味】「仕事」＝力を加えて物体を動かしたときの、力のはたらきの大きさ。単位はJ（ジュール）。／【計算式】仕事＝力の大きさ（N）×力の向きに動いた距離（m）で求められます。ただし、力を加えても物体が動かない場合（壁を押し続けるなど）は、仕事は0とみなされます。／【身近な例】10Nの力で2m物体を動かすと、仕事は10×2＝20Jになります。この式は物理の計算問題で頻出です。"},
  {id:"phy373", cat:"物理", sub:"仕事とエネルギー", q:"重い荷物を持ったまま、その場から一歩も動かずに立っているとき、荷物に対してした仕事はどれくらいか。", choices:["0（仕事をしていない）","荷物の重さと同じ大きさ","時間に比例して増え続ける","持ち上げた高さに比例する"], diff:"標準", a:0, e:"【ことばの意味】理科でいう「仕事」は、力を加えて物体を実際に動かしたときだけ発生します。／【なぜ0？】荷物を持ったまま静止している場合、力は加えていますが、荷物は動いていません（力の向きに移動距離が0）。そのため、理科的な意味での仕事は0ということになります。／【日常語との違い】日常生活では「疲れる＝仕事をした」と感じますが、理科の「仕事」は移動距離がなければ、どんなに疲れても仕事量は0として扱われる点に注意しましょう。"},
  {id:"phy374", cat:"物理", sub:"力の働き", q:"面に垂直に力がはたらくとき、その力の大きさを力がはたらく面積で割った値を何というか。", choices:["圧力","重力","浮力","抵抗"], diff:"基礎", a:0, e:"【ことばの意味】「圧力」＝面を垂直に押す力の大きさを、その面積で割った値。単位はPa（パスカル）。／【計算式】圧力＝力の大きさ（N）÷力がはたらく面積（m²）で求められます。同じ力でも、面積が小さいほど圧力は大きくなります。／【身近な例】画びょうの先が細くとがっているのは、小さな面積に力を集中させて圧力を大きくし、刺さりやすくするための工夫です。スキー板が広いのは逆に圧力を小さくして雪に沈みにくくするためです。"},
  {id:"phy375", cat:"物理", sub:"力の働き", q:"大気による圧力を何というか。", choices:["大気圧","水圧","浮力","重力"], diff:"基礎", a:0, e:"【ことばの意味】「大気圧」＝空気（大気）の重さによって生じる圧力。／【身近な現象】私たちは大気の底で生活しているため、常に大気圧を受けていますが、体の内側からも同じくらいの圧力で押し返しているため、ふだんは気づきません。高い山に登ると大気圧が下がり、お菓子の袋がふくらんだり、耳がキーンとしたりするのは大気圧の変化によるものです。／【他の選択肢】水圧は水による圧力、浮力は上向きの力、重力は地球が物体を引く力で、それぞれ別のものです。"},
  {id:"phy376", cat:"物理", sub:"力の働き", q:"水中の物体には、あらゆる方向から水の力がはたらく。この力を何というか。", choices:["水圧","気圧","浮力","重力"], diff:"基礎", a:0, e:"【ことばの意味】「水圧」＝水による圧力。水中にある物体には、あらゆる方向から水圧がはたらきます。／【深さとの関係】水圧は水面からの深さが深いほど大きくなります。海の深いところでは非常に大きな水圧がかかるため、深海探査機には特別なつくりが必要です。／【浮力との違い】水圧は物体の各面にはたらく力そのものですが、浮力はその水圧の差によって生まれる「上向きの合力」を指します。両者は関連していますが、意味するものが異なります。"},
  {id:"phy377", cat:"物理", sub:"光と音", q:"光が空気中からガラスの中に入るとき、進む速さはどうなるか。", choices:["遅くなる","速くなる","変わらない","一瞬止まる"], diff:"基礎", a:0, e:"【ことばの意味】光の速さは進む物質によって異なります。空気中よりガラスの中の方が、光の速さは遅くなります。／【屈折との関係】光の速さが変わることが、光が境界面で折れ曲がる（屈折する）原因になっています。密度が大きい物質ほど、一般的に光の速さは遅くなる傾向があります。／【身近な例】水中のストローが折れて見えるのも、空気中と水中で光の速さが違うために起こる屈折現象です。"},
  {id:"phy378", cat:"物理", sub:"光と音", q:"太陽の光をプリズムに通すと、何色かに分かれて見える。この現象を何というか。", choices:["光の分散","光の反射","光の直進","光の吸収"], diff:"基礎", a:0, e:"【ことばの意味】「分散」＝1つのものがいくつかに分かれること。太陽の光（白色光）には、いろいろな色の光が混ざっています。／【なぜ分かれる？】プリズムに光が入ると、色（波長）によって屈折する角度が少しずつ異なるため、赤・橙・黄・緑・青・藍・紫の順に分かれて見えます。これを光の分散といいます。／【身近な例】雨上がりに見える虹も、空気中の水滴がプリズムと同じような役割をして太陽光を分散させることで生まれる現象です。"},
  {id:"phy379", cat:"物理", sub:"光と音", q:"音が物にぶつかってはね返る現象を何というか。", choices:["音の反射","音の屈折","音の分散","音の直進"], diff:"基礎", a:0, e:"【ことばの意味】「反射」＝はね返ること。音も光と同じように、かたい面にぶつかるとはね返る性質があります。これを音の反射といいます。／【身近な例】山や建物の壁に向かって大声を出すと、少し遅れて自分の声が返ってくる「やまびこ（こだま）」は、音が反射して戻ってくる現象です。トンネルの中で声が反響するのも同じ原理です。／【利用例】この性質を利用して、海底までの深さを音の反射で測る装置（音響測深機）などが実用化されています。"},
  {id:"phy380", cat:"物理", sub:"光と音", q:"弦楽器で、弦を強く張るほど音の高さはどうなるか。", choices:["高くなる","低くなる","変わらない","聞こえなくなる"], diff:"基礎", a:0, e:"【ことばの意味】弦の振動数（1秒間にふるえる回数）が多いほど、音は高くなります。／【張りと音の高さ】弦を強く張るほど、振動数が多くなり、音は高くなります。逆にゆるめると振動数が減り、低い音になります。／【他の要素】弦の長さを短くしたり、弦を細くしたりすることでも、同じように音は高くなります。ギターやバイオリンの弦を調律するとき、ねじを回して張りを調節するのはこの性質を利用しています。"},
  {id:"phy381", cat:"物理", sub:"電流と回路", q:"回路に流れる電流を測定する器具は何か。", choices:["電流計","電圧計","温度計","湿度計"], diff:"基礎", a:0, e:"【ことばの意味】「電流計」＝回路を流れる電流の大きさを測定する器具。単位はA（アンペア）で表示されます。／【使い方】電流計は、電流を測りたい部分に対して直列につなぎます。電流計自体の抵抗が非常に小さいため、直列につないでも回路全体への影響がほとんどありません。／【注意点】電流計を電源に直接つないだり、並列につないだりすると、大きな電流が流れすぎて針が振り切れたり、電流計が壊れたりする危険があるため注意が必要です。"},
  {id:"phy382", cat:"物理", sub:"電流と回路", q:"回路の2点間の電圧を測定する器具は何か。", choices:["電圧計","電流計","湿度計","質量計"], diff:"基礎", a:0, e:"【ことばの意味】「電圧計」＝回路の2点間の電圧を測定する器具。単位はV（ボルト）で表示されます。／【使い方】電圧計は、電圧を測りたい部分に対して並列につなぎます。電圧計自体の抵抗が非常に大きいため、並列につないでも回路を流れる電流にほとんど影響を与えません。／【電流計との違い】電流計は直列、電圧計は並列につなぐという点が、両者の使い方の大きな違いです。混同しないように注意しましょう。"},
  {id:"phy383", cat:"物理", sub:"電流と回路", q:"電気を通しやすい物質を何というか。", choices:["導体","絶縁体","半導体","不導体"], diff:"基礎", a:0, e:"【ことばの意味】「導体」＝電気を通しやすい物質。銅・鉄・アルミニウムなどの金属が代表的な導体です。／【身近な利用】電気コードの内部の線には銅などの導体が使われ、電気を効率よく伝えます。／【対になる言葉】電気をほとんど通さない物質は「絶縁体（不導体）」といい、ゴムやガラス、プラスチックなどが代表例です。電気コードの外側の被覆にゴムやビニールが使われているのは、感電を防ぐために絶縁体で導体を包んでいるためです。"},
  {id:"phy384", cat:"物理", sub:"電流と回路", q:"電気をほとんど通さない物質を何というか。", choices:["絶縁体","導体","半導体","電解質"], diff:"基礎", a:0, e:"【ことばの意味】「絶縁体」＝電気をほとんど通さない物質。ゴム・ガラス・プラスチック・木などが代表的な絶縁体です。／【なぜ必要？】電気コードの外側がゴムやビニールでおおわれているのは、内部の銅線（導体）に人が直接ふれて感電するのを防ぐためです。コンセントのカバーなども絶縁体でできています。／【対になる言葉】電気をよく通す物質は「導体」といい、金属類が代表例です。導体と絶縁体を組み合わせることで、安全に電気を利用できるようにしています。"},
  {id:"phy385", cat:"物理", sub:"磁界と電流", q:"コイルの中に鉄しんを入れて電流を流す装置を何というか。", choices:["電磁石","永久磁石","方位磁針","蓄電池"], diff:"基礎", a:0, e:"【ことばの意味】「電磁石」＝コイルに鉄しんを入れて電流を流すことで磁力を発生させる装置。／【永久磁石との違い】永久磁石は常に磁力をもち続けますが、電磁石は電流を流している間だけ磁力が生じ、電流を止めると磁力がほとんどなくなります。この性質を利用して、磁力のオン・オフを切りかえることができます。／【身近な利用】モーター、スピーカー、電磁石クレーンなど、電磁石は多くの機器に利用されている重要な技術です。"},
  {id:"phy386", cat:"物理", sub:"熱の伝わり方", q:"部屋を暖房であたためたとき、あたたかい空気はどの方向に動きやすいか。", choices:["上に動きやすい","下に動きやすい","動かずその場にとどまる","真横にしか動かない"], diff:"基礎", a:0, e:"【ことばの意味】「対流」＝あたたまった液体や気体が動いて熱を運ぶ現象。／【なぜ上に動く？】空気はあたためられると膨張して軽くなるため、上へ動きやすくなります。逆に冷たい空気は重くなって下に動きます。この動きによって、部屋全体に熱が運ばれていきます。／【身近な工夫】エアコンの暖房は上向き、冷房は下向きに風を送ると効率よく部屋全体を快適な温度にできるのは、この対流の性質を利用しているためです。"},
  {id:"phy387", cat:"物理", sub:"エネルギーの利用", q:"太陽電池（ソーラーパネル）は何エネルギーを電気エネルギーに変えているか。", choices:["光エネルギー","熱エネルギー","運動エネルギー","化学エネルギー"], diff:"基礎", a:0, e:"【ことばの意味】「太陽電池」＝太陽の光エネルギーを直接電気エネルギーに変換する装置。／【しくみ】太陽電池の中の特別な半導体に光が当たると、電子が動き出して電流が発生します。火力発電のようにタービンを回す仕組みとは異なり、光から直接電気を作り出す点が特徴です。／【利用例】屋根の上のソーラーパネルや電卓の太陽電池など、身近なところで広く利用されています。燃料を使わず二酸化炭素をほとんど出さない発電方法として注目されています。"},
  {id:"phy388", cat:"物理", sub:"エネルギーの利用", q:"風力発電は何エネルギーを利用して電気を起こしているか。", choices:["風の運動エネルギー","太陽の光エネルギー","地下の熱エネルギー","水の位置エネルギー"], diff:"基礎", a:0, e:"【ことばの意味】「風力発電」＝風の力で羽根（プロペラ）を回転させ、その回転を利用して発電機を回す発電方法。／【エネルギーの移り変わり】風がもつ運動エネルギーが、羽根を回す運動エネルギーに変わり、それが発電機で電気エネルギーに変換されます。／【特徴】燃料を使わず二酸化炭素を出さない再生可能エネルギーの一種ですが、風が弱い日や強すぎる日には発電量が変化しやすいという特徴もあります。"},
  {id:"phy389", cat:"物理", sub:"エネルギーの利用", q:"火力発電で電気を起こすために、最初に燃料を燃やして得るエネルギーは何か。", choices:["熱エネルギー","光エネルギー","位置エネルギー","磁気エネルギー"], diff:"基礎", a:0, e:"【火力発電のしくみ】石油や石炭、天然ガスなどの燃料を燃やすと、まず熱エネルギーが発生します。この熱で水を沸騰させて高温・高圧の蒸気をつくり、その蒸気の力でタービンを回転させます（運動エネルギー）。タービンにつながった発電機が回ることで、最終的に電気エネルギーが得られます。／【エネルギーの移り変わり】化学エネルギー（燃料）→熱エネルギー→運動エネルギー→電気エネルギー、という順番でエネルギーが移り変わっていきます。"},
  {id:"phy390", cat:"物理", sub:"力の働き", q:"物体が静止しているとき、その物体にはたらく力の関係として正しいものはどれか。", choices:["力がつり合っている","どの物体にも力ははたらいていない","1つの力だけがはたらいている","力の向きがすべて同じである"], diff:"標準", a:0, e:"【ことばの意味】「つり合う」＝2つ以上の力の効果が打ち消し合って、全体としての効果が0になること。／【静止している理由】机の上に置かれた物体には重力が下向きにはたらいていますが、机からの上向きの力（垂直抗力）も同時にはたらいており、この2つの力がつり合っているため、物体は静止したままでいられます。／【まちがえやすい点】「力がはたらいていないから静止している」のではなく、「力はたらいているがつり合っているから静止している」という点に注意しましょう。"},
  {id:"phy391", cat:"物理", sub:"運動とエネルギー", q:"記録タイマーで一定時間ごとに打点された記録テープの間隔が、だんだん広くなっているとき、物体の運動はどうなっているか。", choices:["速さがだんだん速くなっている","速さがだんだん遅くなっている","一定の速さで動いている","動いていない（静止している）"], diff:"標準", a:0, e:"【ことばの意味】「記録タイマー」＝一定の時間間隔で紙テープに点を打つことで、物体の運動を記録する道具。／【読み取り方】打点の間隔は、その時間内に物体が動いた距離を表します。間隔がだんだん広くなっているということは、同じ時間内に進む距離が増えている、つまり速さがだんだん速くなっている（加速している）ことを示しています。／【逆の場合】間隔が一定であれば等速直線運動、間隔がだんだん狭くなっていれば減速していることを表します。"},
  {id:"phy392", cat:"物理", sub:"力の働き", q:"作用・反作用の法則について正しいものはどれか。", choices:["物体Aが物体Bに力を加えると、物体BもAに同じ大きさで逆向きの力を返す","力を加えた側だけが力を受け、加えられた側は力を受けない","2つの物体が力をおよぼし合うことはない","作用と反作用は必ず同じ向きにはたらく"], diff:"標準", a:0, e:"【ことばの意味】「作用・反作用の法則」＝物体Aが物体Bに力（作用）をおよぼすと、同時に物体BもAに対して同じ大きさで逆向きの力（反作用）をおよぼすという法則。／【身近な例】壁を手で押すと、壁からも同じ大きさの力で手が押し返されるのを感じます。ボートの上で岸を押すとボートが後ろに動くのも、この作用・反作用の法則によるものです。／【まちがえやすい点】2力のつり合いとは違い、作用と反作用は「別々の物体」にはたらく点に注意しましょう。"},
  {id:"phy393", cat:"物理", sub:"光と音", q:"凸レンズを虫めがねとして使い、太陽の光を集めて紙を焦がすとき、光が集まる点を何というか。", choices:["焦点","作用点","支点","中心点"], diff:"基礎", a:0, e:"【ことばの意味】「焦点」＝凸レンズに平行に入った光が屈折して集まる1点のこと。／【身近な体験】虫めがねで太陽の光を集めて紙を焦がす実験では、レンズと紙の距離をちょうど焦点距離に合わせたときに、光が最も小さな点に集まり、熱が集中して紙が焦げやすくなります。／【焦点距離】レンズの中心から焦点までの距離を焦点距離といい、レンズの厚みやカーブの大きさによって値が異なります。厚みが大きいレンズほど焦点距離は短くなる傾向があります。"},
  {id:"phy394", cat:"物理", sub:"力の働き", q:"物体の質量をはかる道具として正しいものはどれか。", choices:["上皿てんびん","ばねばかり","温度計","ストップウォッチ"], diff:"基礎", a:0, e:"【ことばの意味】「上皿てんびん」＝左右の皿につり合いをとることで、物体の質量を正確にはかる道具。／【ばねばかりとの違い】ばねばかりは、ばねの伸びを利用して「重さ（力）」をはかる道具で、場所によって重力が変わると示す値も変わります。一方、上皿てんびんは分銅とのつり合いで質量そのものをはかるため、月に持って行っても正しい質量を示します。／【正しい使い方】上皿てんびんは水平な台の上に置き、指針が目盛りの中央で静止することを確認して使います。"},
