  {id:"che138", cat:"化学", sub:"物質のすがた", q:"蒸留の身近な利用についての説明として誤っているものはどれか。", choices:["蒸留は海水から真水を得る方法の一つとして利用されることがある","石油の精製にも蒸留に似た方法が利用されている","蒸留は固体と固体を分離するのに最も適した方法である","蒸留では沸点のちがいを利用して物質を分ける"], diff:"基礎", a:2, e:"【ことばの意味】「沸点」＝液体がふっとうして気体になる温度／「蒸留」＝沸点の違いを利用して液体を分ける方法【解説】蒸留は液体の混合物を沸点のちがいで分ける方法であり、固体どうしの分離には適していない。【まちがえやすい点】ほかの選択肢（蒸留は海水から真水を得る方法の一つとして利用…／石油の精製にも蒸留に似た方法が利用されている）とのちがいをおさえておこう。"},
  {id:"che140", cat:"化学", sub:"金属の性質", q:"金属の製錬についての説明として誤っているものはどれか。", choices:["鉄は鉄鉱石を還元することで得られることが多い","金属の製錬には多くの場合エネルギーが必要である","金属はすべて自然界に単体のまま豊富に存在している","アルミニウムの製錬には多くの電気エネルギーが使われることが知られている"], diff:"基礎", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「還元」＝物質が酸素をうばわれること【解説】多くの金属は自然界では酸化物などの化合物として存在しており、そこから還元して単体を取り出す必要がある。【まちがえやすい点】ほかの選択肢（鉄は鉄鉱石を還元することで得られることが多い／金属の製錬には多くの場合エネルギーが必要であ…）とのちがいをおさえておこう。"},
  {id:"che142", cat:"化学", sub:"環境と化学", q:"水の浄化についての説明として誤っているものはどれか。", choices:["浄水場では水をろ過するなどして飲み水をつくっている","水道水は消毒のための処理が行われていることが多い","水はどんな状態でも処理せずにそのまま安全に飲める","川や湖の水には浄化される前は不純物がふくまれていることがある"], diff:"基礎", a:2, e:"【解説】自然の水には目に見えない微生物や不純物がふくまれていることがあり、飲み水として安全に使うには適切な処理が必要である。【まちがえやすい点】ほかの選択肢（浄水場では水をろ過するなどして飲み水をつくっ…／水道水は消毒のための処理が行われていることが…）とのちがいをおさえておこう。"},
  {id:"che144", cat:"化学", sub:"環境と化学", q:"環境中の化学物質についての説明として誤っているものはどれか。", choices:["一部の化学物質は環境や健康に影響をあたえることがあるとされている","化学物質の管理や規制についての取り組みが行われている","すべての化学物質は環境に全く影響をあたえない","リサイクルや廃棄物の適切な処理は環境保全につながる"], diff:"標準", a:2, e:"【解説】化学物質の中には環境や健康に影響をあたえるものがあると考えられており、「全く影響をあたえない」という記述は誤り。【まちがえやすい点】ほかの選択肢（一部の化学物質は環境や健康に影響をあたえるこ…／化学物質の管理や規制についての取り組みが行わ…）とのちがいをおさえておこう。"},
  {id:"che146", cat:"化学", sub:"気体の性質", q:"気体の発生とその利用についての説明として誤っているものはどれか。", choices:["酸素は医療現場などで利用されることがある","二酸化炭素は炭酸飲料などに利用されることがある","気体はすべて危険なため人々の生活には全く利用されていない","水素は次世代のエネルギー源として研究が進められている"], diff:"基礎", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】酸素・二酸化炭素・水素など、多くの気体が実際に人々の生活のさまざまな場面で利用されている。【まちがえやすい点】ほかの選択肢（酸素は医療現場などで利用されることがある／二酸化炭素は炭酸飲料などに利用されることがあ…）とのちがいをおさえておこう。"},
  {id:"che148", cat:"化学", sub:"酸・アルカリと中和", q:"うすい水酸化ナトリウム水溶液の性質についての説明として誤っているものはどれか。", choices:["うすい水酸化ナトリウム水溶液はアルカリ性を示す","うすい水酸化ナトリウム水溶液は赤色リトマス紙を青色に変える","うすい水酸化ナトリウム水溶液は酸性の水溶液である","うすい水酸化ナトリウム水溶液には水酸化物イオンが多くふくまれる"], diff:"基礎", a:2, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「アルカリ性」＝pHが7より大きい性質。赤リトマスを青にする【解説】水酸化ナトリウム水溶液はアルカリ性の水溶液であり、酸性ではない。【まちがえやすい点】ほかの選択肢（うすい水酸化ナトリウム水溶液はアルカリ性を示…／うすい水酸化ナトリウム水溶液は赤色リトマス紙…）とのちがいをおさえておこう。"},
  {id:"che150", cat:"化学", sub:"身近な化学変化", q:"燃焼の3条件についての説明として誤っているものはどれか。", choices:["燃焼には燃える物質、酸素、発火点以上の温度の3つがそろう必要があるとされる","このうち1つでも欠けると燃焼は続かないことが多い","燃焼の3条件のうち、酸素は必要ない","消火はこの3条件のいずれかを取り除くことで行われることが多い"], diff:"基礎", a:2, e:"【ことばの意味】「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと【解説】燃焼が続くためには酸素が必要であり、酸素を断つことは消火の基本的な方法の一つである。【まちがえやすい点】ほかの選択肢（燃焼には燃える物質、酸素、発火点以上の温度の…／このうち1つでも欠けると燃焼は続かないことが…）とのちがいをおさえておこう。"},
  {id:"che152", cat:"化学", sub:"質量保存の法則(計算)", q:"気体の発生量と質量の関係についての説明として誤っているものはどれか。", choices:["反応する物質の量を増やすと、発生する気体の量も増えることが多い","発生した気体の質量は、開放容器では見かけの質量減少として観察されることがある","発生する気体の量は反応する物質の量に全く関係しない","質量保存の法則は気体が発生する反応にも成り立つ"], diff:"基礎", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）【解説】発生する気体の量は、反応する物質の量に関係して変化することが多く、「全く関係しない」という記述は誤り。【まちがえやすい点】ほかの選択肢（反応する物質の量を増やすと、発生する気体の量…／発生した気体の質量は、開放容器では見かけの質…）とのちがいをおさえておこう。"},
  {id:"che154", cat:"化学", sub:"物質のすがた", q:"石灰石の利用についての説明として誤っているものはどれか。", choices:["石灰石はセメントの原料として利用されることがある","石灰石は主に炭酸カルシウムからできている","石灰石は金属の一種である","石灰石にうすい塩酸をかけると二酸化炭素が発生する"], diff:"基礎", a:2, e:"【解説】石灰石は炭酸カルシウムを主成分とする岩石であり、金属ではない。【まちがえやすい点】ほかの選択肢（石灰石はセメントの原料として利用されることが…／石灰石は主に炭酸カルシウムからできている）とのちがいをおさえておこう。"},
  {id:"che158", cat:"化学", sub:"水溶液の濃度(計算)", q:"質量パーセント濃度の意味についての説明として誤っているものはどれか。", choices:["質量パーセント濃度は溶液全体に対する溶質の質量の割合を表す","質量パーセント濃度が高いほど、濃い水溶液であることが多い","質量パーセント濃度は体積の割合だけを表す量である","質量パーセント濃度は百分率(%)で表される"], diff:"基礎", a:2, e:"【ことばの意味】「質量」＝物体そのものの量（場所が変わっても変わらない）【解説】質量パーセント濃度は質量の割合を表す量であり、体積の割合を表す量ではない。【まちがえやすい点】ほかの選択肢（質量パーセント濃度は溶液全体に対する溶質の質…／質量パーセント濃度が高いほど、濃い水溶液であ…）とのちがいをおさえておこう。"},
  {id:"che160", cat:"化学", sub:"気体の性質", q:"空気中の成分についての説明として誤っているものはどれか。", choices:["空気の主な成分はちっ素と酸素である","空気には少量の二酸化炭素もふくまれている","空気の成分の割合は場所や時間によって全く変化しない","空気にはアルゴンなどの気体もわずかにふくまれている"], diff:"基礎", a:2, e:"【ことばの意味】「呼吸」＝酸素を使って養分を分解し、エネルギーを取り出すこと【解説】空気の成分の割合は場所や状況(例えば呼吸が盛んな場所など)によって多少変化することがある。【まちがえやすい点】ほかの選択肢（空気の主な成分はちっ素と酸素である／空気には少量の二酸化炭素もふくまれている）とのちがいをおさえておこう。"},
  {id:"che162", cat:"化学", sub:"気体の性質", q:"気体の発生実験における捕集方法の選び方についての説明として誤っているものはどれか。", choices:["発生する気体の水への溶けやすさを考えて集め方を選ぶことが多い","発生する気体の空気に対する重さも集め方を選ぶ手がかりになる","どの気体も同じ集め方をすれば必ずうまく集められる","気体の性質を知ることは実験の安全にもつながる"], diff:"基礎", a:2, e:"【ことばの意味】「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）【解説】気体の性質(水への溶けやすさ・空気との重さの比較)によって適した集め方が異なるため、「どの気体も同じ集め方」という記述は誤り。【まちがえやすい点】ほかの選択肢（発生する気体の水への溶けやすさを考えて集め方…／発生する気体の空気に対する重さも集め方を選ぶ…）とのちがいをおさえておこう。"},
  {id:"che164", cat:"化学", sub:"環境と化学", q:"化学変化と環境への配慮についての説明として誤っているものはどれか。", choices:["実験で出た廃液は決められた方法で処理することが大切である","有害な気体が発生する実験は換気に注意して行う","実験で出たものはすべてそのまま排水口に流してよい","環境への配慮は化学の学習においても大切な視点の一つである"], diff:"基礎", a:2, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】実験で出た廃液や薬品には、そのまま排水口に流すと環境に影響をあたえるものがあり、決められた方法で処理する必要がある。【まちがえやすい点】ほかの選択肢（実験で出た廃液は決められた方法で処理すること…／有害な気体が発生する実験は換気に注意して行う）とのちがいをおさえておこう。"},
  {id:"che166", cat:"化学", sub:"気体の性質", q:"うすい過酸化水素水と二酸化マンガンの反応についての説明として誤っているものはどれか。", choices:["この反応では酸素が発生すると考えられている","二酸化マンガンはこの反応で触媒としてはたらいていると考えられている","二酸化マンガンはこの反応で反応後に別の物質に変化してなくなってしまう","発生した気体は火のついた線香を近づけると激しく燃えることで確認できる"], diff:"基礎", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】二酸化マンガンは触媒としてはたらき、反応の前後で自身は変化せずに残る。【まちがえやすい点】ほかの選択肢（この反応では酸素が発生する／二酸化マンガンはこの反応で触媒としてはたらい…）とのちがいをおさえておこう。"},
  {id:"che168", cat:"化学", sub:"質量保存の法則(計算)", q:"化学変化の量的関係のグラフについての説明として誤っているものはどれか。", choices:["反応する物質の質量と生成する物質の質量には比例の関係が見られることが多い","グラフから、過不足なく反応する量の関係を読み取れることがある","化学変化の量的関係のグラフは常に原点を通らない","グラフの傾きから反応の割合を読み取れることがある"], diff:"基礎", a:2, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】多くの場合、反応する物質の量が0のとき生成する物質の量も0になるため、グラフは原点を通ることが多い。【まちがえやすい点】ほかの選択肢（反応する物質の質量と生成する物質の質量には比…／グラフから、過不足なく反応する量の関係を読み…）とのちがいをおさえておこう。"},
  {id:"che170", cat:"化学", sub:"化学変化と質量", q:"化学変化とエネルギーの利用のまとめとして誤っているものはどれか。", choices:["燃料電池は化学変化を利用して電気エネルギーを取り出す装置である","火力発電は燃料の燃焼で得た熱を利用して発電する","化学変化からエネルギーを取り出す技術は現在では全く使われていない","使い捨てカイロは化学変化(酸化)による発熱を利用している"], diff:"基礎", a:2, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】燃料電池や火力発電など、化学変化からエネルギーを取り出す技術は現在も広く利用されている。【まちがえやすい点】ほかの選択肢（燃料電池は化学変化を利用して電気エネルギーを…／火力発電は燃料の燃焼で得た熱を利用して発電す…）とのちがいをおさえておこう。"},
  {id:"che172", cat:"化学", sub:"化学変化と質量", q:"酸化銀の分解実験についての説明として誤っているものはどれか。", choices:["酸化銀を加熱すると銀と酸素に分解される","この実験で生じた白色っぽい固体は銀であると考えられる","発生した気体は二酸化炭素であることを石灰水で確認する","分解後の物質の質量の合計は、もとの酸化銀の質量と等しくなる"], diff:"基礎", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「分解」＝1つの物質が2つ以上の物質に分かれること【解説】酸化銀の分解で発生する気体は酸素であり、二酸化炭素ではない。酸素は火のついた線香が激しく燃えることで確認できる。【まちがえやすい点】ほかの選択肢（酸化銀を加熱すると銀と酸素に分解される／この実験で生じた白色っぽい固体は銀であると考…）とのちがいをおさえておこう。"},
  {id:"che174", cat:"化学", sub:"化学反応式", q:"化学変化における物質のゆくえについての説明として誤っているものはどれか。", choices:["反応の前後で原子の組み合わせが変わることで新しい物質ができる","反応の前後で原子そのものは新しくつくられたり消えたりしない","化学変化によって原子の種類が別の原子に変わることがある","化学変化のようすはモデル図や化学反応式で表すことができる"], diff:"基礎", a:2, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】化学変化では原子の組み合わせが変わるだけで、原子そのものが別の種類の原子に変わることはない。【まちがえやすい点】ほかの選択肢（反応の前後で原子の組み合わせが変わることで新…／反応の前後で原子そのものは新しくつくられたり…）とのちがいをおさえておこう。"},
  {id:"che176", cat:"化学", sub:"実験器具の使い方", q:"化学変化の実験計画についての説明として誤っているものはどれか。", choices:["実験の前に、どのような結果が予想されるか考えておくとよい","対照実験を設けることで、結果の原因をより正確に確かめることができる","実験計画を立てずにいきなり実験を始めた方が正確な結果が得られる","実験の手順や安全上の注意点を事前に確認しておくことが大切である"], diff:"基礎", a:2, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】事前に実験計画を立て、予想や手順、注意点を確認しておくことで、より安全で正確な実験を行うことができる。【まちがえやすい点】ほかの選択肢（実験の前に、どのような結果が予想されるか考え…／対照実験を設けることで、結果の原因をより正確…）とのちがいをおさえておこう。"},
  {id:"che178", cat:"化学", sub:"環境と化学", q:"化学変化の利用と安全のバランスについての説明として誤っているものはどれか。", choices:["化学変化は工業製品や医薬品づくりなど、さまざまな場面で利用されている","化学物質を扱う際には正しい知識と注意が必要とされている","化学変化の利用にはリスクは全く存在しない","安全な利用のためのルールや基準が定められている場合がある"], diff:"基礎", a:2, e:"【ことばの意味】「化学変化」＝物質そのものが別の物質に変わること【解説】化学変化の利用には有用な面がある一方で、取り扱いを誤ると危険が生じることもあり、「リスクは全く存在しない」という記述は誤り。【まちがえやすい点】ほかの選択肢（化学変化は工業製品や医薬品づくりなど、さまざ…／化学物質を扱う際には正しい知識と注意が必要と…）とのちがいをおさえておこう。"},

  {id:"bio1", cat:"生物", sub:"植物のつくり", q:"植物が光を利用して二酸化炭素と水からデンプンなどを作るはたらきを何というか。", choices:["呼吸","光合成","蒸散","発酵"], diff:"基礎", a:1, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「葉緑体」＝植物の細胞にある、光合成をする緑色の粒【解説】植物が葉緑体で光エネルギーを使い、二酸化炭素と水からデンプンと酸素を作るはたらきを光合成という。【まちがえやすい点】ほかの選択肢（呼吸／蒸散）とのちがいをおさえておこう。"},
  {id:"bio3", cat:"生物", sub:"動物の分類", q:"背骨を持つ動物のなかまを何というか。", choices:["無脊椎動物","脊椎動物","軟体動物","節足動物"], diff:"基礎", a:1, e:"【解説】背骨(脊椎)を持つ動物を脊椎動物といい、魚類・両生類・は虫類・鳥類・哺乳類に分けられる。【まちがえやすい点】ほかの選択肢（無脊椎動物／軟体動物）とのちがいをおさえておこう。"},
  {id:"bio5", cat:"生物", sub:"生殖と遺伝", q:"受精卵が細胞分裂を繰り返して個体になるまでの過程を何というか。", choices:["分化","発生","変態","減数分裂"], diff:"基礎", a:1, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「受精」＝精細胞と卵細胞が合体すること【解説】受精卵が細胞分裂を重ねて胚を経て個体になっていく過程を発生という。【まちがえやすい点】ほかの選択肢（分化／変態）とのちがいをおさえておこう。"},
  {id:"bio7", cat:"生物", sub:"ヒトのからだ", q:"食物中のデンプンを最初に分解する消化酵素を含む消化液はどれか。", choices:["胃液","だ液","胆汁","すい液"], diff:"基礎", a:1, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること【解説】だ液に含まれるアミラーゼという消化酵素がデンプンを麦芽糖などに分解する。【まちがえやすい点】ほかの選択肢（胃液／胆汁）とのちがいをおさえておこう。"},
  {id:"bio9", cat:"生物", sub:"生態系と食物連鎖", q:"生態系において、生産者を食べる動物を何というか。", choices:["生産者","消費者","分解者","非生物的環境"], diff:"基礎", a:1, e:"【ことばの意味】「生産者」＝光合成で自分の養分をつくる生物（植物など）／「消費者」＝ほかの生物を食べて養分を得る生物（動物）【解説】植物などの生産者がつくった有機物を直接・間接に食べる動物を消費者という。【まちがえやすい点】ほかの選択肢（生産者／分解者）とのちがいをおさえておこう。"},
  {id:"bio11", cat:"生物", sub:"植物のつくり", q:"葉の裏に多く見られる、気体の出入り口となるつくりを何というか。", choices:["道管","師管","気孔","葉緑体"], diff:"基礎", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「気孔」＝葉にある小さな穴。気体の出入り口【解説】気孔は主に葉の裏に多く分布し、酸素・二酸化炭素・水蒸気の出入り口となる。【まちがえやすい点】ほかの選択肢（道管／師管）とのちがいをおさえておこう。"},
  {id:"bio13", cat:"生物", sub:"生物の観察", q:"顕微鏡で観察を始めるとき、最初に使う対物レンズの倍率はどれにするべきか。", choices:["最も低い倍率","最も高い倍率","中くらいの倍率","どれでもよい"], diff:"標準", a:0, e:"【解説】顕微鏡ではまず低倍率で視野を広くとらえてから、必要に応じて高倍率に切りかえて観察する。【まちがえやすい点】ほかの選択肢（最も高い倍率／中くらいの倍率）とのちがいをおさえておこう。"},
  {id:"bio15", cat:"生物", sub:"細胞のつくり", q:"植物の細胞に見られ、動物の細胞には見られないつくりはどれか。", choices:["細胞壁","核","細胞膜","細胞質"], diff:"基礎", a:0, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「細胞壁」＝植物の細胞の外側にある、かたい仕切り【解説】植物の細胞には細胞壁・葉緑体・液胞があり、これらは動物の細胞には見られない特徴である。【まちがえやすい点】ほかの選択肢（核／細胞膜）とのちがいをおさえておこう。"},
  {id:"bio17", cat:"生物", sub:"細胞のつくり", q:"呼吸のはたらきを主に行う細胞内のつくりは何か。", choices:["ミトコンドリア","葉緑体","核","細胞壁"], diff:"基礎", a:0, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること／「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】ミトコンドリアは酸素を使って栄養分を分解し、エネルギーを取り出す呼吸のはたらきを行う。【まちがえやすい点】ほかの選択肢（葉緑体／核）とのちがいをおさえておこう。"},
  {id:"bio19", cat:"生物", sub:"進化", q:"生物が長い年月をかけて環境に適応しながら世代を重ねて変化してきたことを何というか。", choices:["進化","発生","変態","遺伝"], diff:"基礎", a:0, e:"【解説】生物が長い年月をかけて、環境に適応しながら世代を重ねて変化してきたことを進化という。【まちがえやすい点】ほかの選択肢（発生／変態）とのちがいをおさえておこう。"},
  {id:"bio21", cat:"生物", sub:"ヒトのからだ", q:"心臓から肺以外の全身に血液が送られ、再び心臓にもどる循環を何というか。", choices:["体循環","肺循環","門脈循環","リンパ循環"], diff:"基礎", a:0, e:"【解説】心臓から全身に送られた血液が再び心臓にもどる経路を体循環といい、肺を通る経路は肺循環という。【まちがえやすい点】ほかの選択肢（肺循環／門脈循環）とのちがいをおさえておこう。"},
  {id:"bio23", cat:"生物", sub:"動物の分類", q:"両生類が一生を通じて行う呼吸の変化として正しいものはどれか。", choices:["幼生はえら呼吸、成体は肺(と皮ふ)呼吸","一生えら呼吸のまま変わらない","一生肺呼吸のまま変わらない","幼生は肺呼吸、成体はえら呼吸"], diff:"基礎", a:0, e:"【ことばの意味】「呼吸」＝酸素を使って養分を分解し、エネルギーを取り出すこと【解説】両生類は幼生期にえら呼吸をするが、成体になると肺(と皮ふ)で呼吸するようになる。【まちがえやすい点】ほかの選択肢（一生えら呼吸のまま／一生肺呼吸のまま）とのちがいをおさえておこう。"},
  {id:"bio25", cat:"生物", sub:"動物の分類", q:"周囲の温度に関係なく体温をほぼ一定に保つ恒温動物のグループはどれか。", choices:["鳥類と哺乳類","魚類と両生類","は虫類と魚類","ほとんどの脊椎動物"], diff:"基礎", a:0, e:"【解説】鳥類と哺乳類は周囲の温度に関係なく体温をほぼ一定に保つ恒温動物であり、それ以外は外界の温度によって体温が変わる変温動物である。【まちがえやすい点】ほかの選択肢（魚類と両生類／は虫類と魚類）とのちがいをおさえておこう。"},
  {id:"bio27", cat:"生物", sub:"植物のはたらき", q:"光合成の実験で、実験前に植物を一晩暗いところに置くのはなぜか。", choices:["葉の中のデンプンをなくしておくため","葉の温度を下げておくため","葉から水分をぬいておくため","葉についた害虫を落とすため"], diff:"標準", a:0, e:"【なぜ暗くする？】光合成でつくられたデンプンが葉に残っていると、実験でデンプンが見つかったとき「今回の実験でできたもの」なのか「前からあったもの」なのか区別できません。／【一晩暗所に置くと】光合成ができないので、葉にたまっていたデンプンは呼吸や成長に使われたり、ほかの部分に運ばれたりしてなくなります。／【そのあと】光を当てた葉と当てなかった葉を比べ、ヨウ素液で調べます。光を当てた葉だけ青紫色になれば「光合成には光が必要」と確かめられます。／【対照実験】このように、調べたい条件だけを変えて比べる方法を対照実験といいます。"},
  {id:"bio29", cat:"生物", sub:"細胞", q:"細胞が分裂する準備の段階で、染色体はどうなるか。", choices:["同じものがもう1組つくられて2倍になる","数が半分に減る","こわれて消えてなくなる","形も数も変わらない"], diff:"標準", a:0, e:"【ことばの意味】「染色体」＝細胞の核の中にある、遺伝情報をもつひも状のもの。ふだんは細くて見えませんが、分裂のときに太く短くなって見えるようになります。／【なぜ2倍にする？】分裂すると細胞は2つに分かれます。両方の細胞に同じ遺伝情報を渡すため、あらかじめ染色体をコピーして2組つくっておくのです。／【そのあと】2組になった染色体が細胞の中央に並び、それぞれ両端に引き分けられます。最後に細胞質が分かれて2つの細胞になります。／【結果】できた2つの細胞は、もとの細胞と同じ数・同じ内容の染色体をもちます。"},
  {id:"bio33", cat:"生物", sub:"生態系と食物連鎖", q:"人間の活動によって本来の生息地から他の地域に持ちこまれ、定着した生物を何というか。", choices:["外来種","在来種","絶滅危惧種","固有種"], diff:"基礎", a:0, e:"【解説】人間の活動によって本来生息していなかった地域に持ちこまれ、定着した生物を外来種という。【まちがえやすい点】ほかの選択肢（在来種／絶滅危惧種）とのちがいをおさえておこう。"},
  {id:"bio35", cat:"生物", sub:"ヒトのからだ", q:"熱いものに触れて思わず手を引っこめるような、意識とは関係なく起こる反応を何というか。", choices:["反射","随意運動","記憶","学習"], diff:"基礎", a:0, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること【解説】熱いものに触れて思わず手を引っこめるなど、意識とは関係なく起こる反応を反射という。【まちがえやすい点】ほかの選択肢（随意運動／記憶）とのちがいをおさえておこう。"},
  {id:"bio37", cat:"生物", sub:"ヒトのからだ", q:"目や耳のように、外界からの刺激を受け取る器官を何というか。", choices:["感覚器官","運動器官","消化器官","循環器官"], diff:"基礎", a:0, e:"【解説】目・耳・鼻・舌・皮ふなど、外界からの刺激を受け取る器官を感覚器官という。【まちがえやすい点】ほかの選択肢（運動器官／消化器官）とのちがいをおさえておこう。"},
  {id:"bio39", cat:"生物", sub:"ヒトのからだ", q:"有害なアンモニアを比較的無害な尿素に変えるはたらきをもつ器官はどれか。", choices:["肝臓","じん臓","すい臓","小腸"], diff:"基礎", a:0, e:"【解説】肝臓は、体内でできた有害なアンモニアを比較的害の少ない尿素につくり変えるはたらきをもつ。【まちがえやすい点】ほかの選択肢（じん臓／すい臓）とのちがいをおさえておこう。"},
  {id:"bio41", cat:"生物", sub:"ヒトのからだ", q:"体内に侵入した細菌やウイルスを認識し排除するはたらきを何というか。", choices:["免疫","消化","循環","排出"], diff:"基礎", a:0, e:"【解説】体内に侵入した病原体を認識し排除するはたらきを免疫という。【まちがえやすい点】ほかの選択肢（消化／循環）とのちがいをおさえておこう。"},
  {id:"bio43", cat:"生物", sub:"ヒトのからだ", q:"筋肉が骨についている部分の丈夫なつくりを何というか。", choices:["腱","関節","靭帯","軟骨"], diff:"基礎", a:0, e:"【解説】筋肉の両端は腱という丈夫な組織で骨についており、筋肉が縮むことで骨を動かす。【まちがえやすい点】ほかの選択肢（関節／靭帯）とのちがいをおさえておこう。"},
  {id:"bio45", cat:"生物", sub:"植物のつくり", q:"光合成についての説明として正しいものはどれか。", choices:["光合成は主に葉の葉緑体で行われる","光合成は根でさかんに行われる","光合成には二酸化炭素は必要ない","光合成は暗い場所でよく進む"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】光合成は主に葉の細胞にある葉緑体で行われ、光・水・二酸化炭素を使ってデンプンと酸素をつくる。【まちがえやすい点】ほかの選択肢（光合成は根でさかんに行われる／光合成には二酸化炭素は必要ない）とのちがいをおさえておこう。"},
  {id:"bio47", cat:"生物", sub:"ヒトのからだ", q:"消化についての説明として正しいものはどれか。", choices:["消化酵素はどんな温度でも同じように働く","だ液にはデンプンを分解する消化酵素がふくまれる","消化は口の中だけで完了する","消化された養分は胃だけで吸収される"], diff:"基礎", a:1, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること【解説】だ液にはアミラーゼという消化酵素がふくまれ、デンプンを麦芽糖などに分解するはたらきをもつ。【まちがえやすい点】ほかの選択肢（消化酵素はどんな温度でも同じように働く／消化は口の中だけで完了する）とのちがいをおさえておこう。"},
  {id:"bio49", cat:"生物", sub:"細胞のつくり", q:"細胞についての説明として正しいものはどれか。", choices:["ほとんどの生物の細胞には細胞壁がある","動物の細胞には葉緑体がない","植物の細胞には核がない","細胞はすべて同じ大きさである"], diff:"基礎", a:1, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「葉緑体」＝植物の細胞にある、光合成をする緑色の粒【解説】葉緑体は植物の細胞に見られるつくりで、動物の細胞には葉緑体は見られない。【まちがえやすい点】ほかの選択肢（すべての生物の細胞には細胞壁がある／植物の細胞には核がない）とのちがいをおさえておこう。"},
  {id:"bio51", cat:"生物", sub:"生態系と食物連鎖", q:"生態系についての説明として正しいものはどれか。", choices:["生産者は主に植物であり、光合成によって有機物をつくる","消費者は主に植物であり、光合成によって有機物をつくっている","分解者は植物のなかまで、光合成をして養分をつくり出している","生態系は生産者と消費者だけででき、分解者はふくまれていない"], diff:"基礎", a:0, e:"【ことばの意味】「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること／「生産者」＝光合成で自分の養分をつくる生物（植物など）【解説】生産者は光合成によって無機物から有機物をつくり出す植物などの生物である。【まちがえやすい点】ほかの選択肢（消費者は光合成を行い自分で栄養分をつくる／分解者は必ず植物である）とのちがいをおさえておこう。"},
  {id:"bio53", cat:"生物", sub:"植物のつくり", q:"植物のつくりについての説明として正しいものはどれか。", choices:["道管は葉でつくられた栄養分を運ぶ","師管は根から吸収した水を運ぶ","気孔は主に葉の裏に多く見られる","双子葉類には維管束が存在しない"], diff:"基礎", a:2, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「気孔」＝葉にある小さな穴。気体の出入り口【解説】気孔は主に葉の裏に多く分布し、酸素・二酸化炭素・水蒸気の出入り口となる。【まちがえやすい点】ほかの選択肢（道管は葉でつくられた栄養分を運ぶ／師管は根から吸収した水を運ぶ）とのちがいをおさえておこう。"},
  {id:"bio55", cat:"生物", sub:"細胞分裂(計算)", q:"体細胞分裂によって1個の細胞が分裂を2回くり返すと、細胞の数は何個になるか。", choices:["2個","3個","4個","8個"], diff:"基礎", a:2, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「体細胞分裂」＝からだをつくる細胞がふえるときの分裂。染色体の数は変わらない【解説】体細胞分裂を1回行うごとに細胞数は2倍になるので、2回では2×2=4個になる。【まちがえやすい点】ほかの選択肢（2個／3個）とのちがいをおさえておこう。"},
  {id:"bio57", cat:"生物", sub:"生殖と遺伝(計算)", q:"優性(顕性)の遺伝子をA、劣性(潜性)の遺伝子をaとしたとき、Aaどうしをかけ合わせてできる子の遺伝子の組み合わせの比として正しいものはどれか。", choices:["AA:Aa:aa=1:2:1","AA:Aa:aa=1:1:1","AA:Aa:aa=3:1:0","AA:Aa:aa=1:0:1"], diff:"標準", a:0, e:"【ことばの意味】「遺伝子」＝生物の特徴を決める情報。染色体の中にある／「顕性」＝親のどちらかから受けつぐと現れやすい形質（旧：優性）【解説】Aaどうしをかけ合わせると、子の遺伝子の組み合わせはAA:Aa:aa=1:2:1の比になる。【まちがえやすい点】ほかの選択肢（AA:Aa:aa=1:1:1／AA:Aa:aa=3:1:0）とのちがいをおさえておこう。"},
  {id:"bio59", cat:"生物", sub:"ヒトのからだ(計算)", q:"心臓が1分間に60回拍動するとき、10秒間ではおよそ何回拍動するか。", choices:["5回","10回","15回","20回"], diff:"標準", a:1, e:"【解説】60回÷6(60秒÷10秒)=10回なので、10秒間ではおよそ10回拍動する。【まちがえやすい点】ほかの選択肢（5回／15回）とのちがいをおさえておこう。"},
  {id:"bio61", cat:"生物", sub:"植物のつくり", q:"光合成の対照実験についての説明として正しいものはどれか。", choices:["実験には対照実験は必要ない","光合成に光が必要かを確かめられる","対照実験では条件をすべて変える","対照実験を行うと結果があいまいになる"], diff:"基礎", a:1, e:"【ことばの意味】「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】光を当てた部分と当てない部分を比較する対照実験によって、光合成に光が必要かどうかを確かめることができる。【まちがえやすい点】ほかの選択肢（実験には対照実験は必要ない／対照実験では条件をすべて変える）とのちがいをおさえておこう。"},
  {id:"bio63", cat:"生物", sub:"生殖と遺伝", q:"減数分裂についての説明として正しいものはどれか。", choices:["減数分裂によって染色体数はもとの2倍になる","減数分裂によって染色体数はもとの半分になる","減数分裂は体細胞でも生殖細胞でも同じように起こる","減数分裂は体をつくる細胞をふやすために行われる"], diff:"基礎", a:1, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「染色体」＝細胞の核の中にある、遺伝情報をもつひも状のもの【解説】生殖細胞がつくられるときに行われる減数分裂によって、染色体数はもとの半分になる。【まちがえやすい点】ほかの選択肢（減数分裂によって染色体数はもとの2倍になる／減数分裂は体細胞でも生殖細胞でも同じように起…）とのちがいをおさえておこう。"},
  {id:"bio65", cat:"生物", sub:"ヒトのからだ", q:"免疫についての説明として正しいものはどれか。", choices:["免疫は体内に侵入した病原体を排除するしくみである","免疫があると病気にはけっしてかからない","免疫は骨だけがもつはたらきである","免疫は消化を助けるはたらきである"], diff:"標準", a:0, e:"【解説】免疫は体内に侵入した細菌やウイルスなどの病原体を認識し、排除するしくみである。【まちがえやすい点】ほかの選択肢（免疫があると病気には絶対にかからない／免疫は骨だけがもつはたらきである）とのちがいをおさえておこう。"},
  {id:"bio67", cat:"生物", sub:"ヒトのからだ", q:"反射についての説明として正しいものはどれか。", choices:["反射は脳が判断してから起こる反応である","反射は意識とは関係なく","反射はほとんどの動物には見られない","反射はつねに時間をかけて起こる"], diff:"基礎", a:1, e:"【ことばの意味】「反射」＝光や音が物にぶつかってはね返ること【解説】反射は脳での判断を経ず、意識とは関係なく刺激に対してすばやく起こる反応である。【まちがえやすい点】ほかの選択肢（反射は脳が判断してから起こる反応である／反射はすべての動物には見られない）とのちがいをおさえておこう。"},
  {id:"bio69", cat:"生物", sub:"進化", q:"生物の進化についての説明として正しいものはどれか。", choices:["進化は一世代の間に大きく起こる","進化は長い年月をかけて、世代を重ねる中で起こる","進化はほとんどの生物でほぼ同じ速さで起こる","進化には環境は関係しない"], diff:"基礎", a:1, e:"【解説】進化は一世代で起こる変化ではなく、長い年月をかけて世代を重ねる中で少しずつ起こる変化である。【まちがえやすい点】ほかの選択肢（進化は一世代の間に大きく起こる／進化はすべての生物で全く同じ速さで起こる）とのちがいをおさえておこう。"},
  {id:"bio71", cat:"生物", sub:"生態系と食物連鎖", q:"発酵についての説明として正しいものはどれか。", choices:["発酵は微生物のはたらきによって起こる","発酵はすべて人体に有害な変化である","発酵はつねに高温でしか起こらない","発酵と腐敗はほぼ同じ現象である"], diff:"基礎", a:0, e:"【解説】発酵は微生物のはたらきによって、人にとって有用な物質に変化する現象である。【まちがえやすい点】ほかの選択肢（発酵はすべて人体に有害な変化である／発酵は必ず高温でしか起こらない）とのちがいをおさえておこう。"},
  {id:"bio73", cat:"生物", sub:"動物の分類", q:"節足動物についての説明として正しいものはどれか。", choices:["節足動物にはこん虫類や甲殻類がふくまれる","節足動物には骨格が全くない","節足動物はすべて水中でしか生活できない","節足動物のからだはつねに1つの部分だけでできている"], diff:"基礎", a:0, e:"【解説】節足動物にはこん虫類・甲殻類・クモ類などがふくまれ、外骨格をもつ。【まちがえやすい点】ほかの選択肢（節足動物には骨格が全くない／節足動物はすべて水中でしか生活できない）とのちがいをおさえておこう。"},
  {id:"bio75", cat:"生物", sub:"植物のつくり", q:"花のつくりについての説明として正しいものはどれか。", choices:["おしべの先には花粉が入ったやくがある","めしべの先(柱頭)では花粉はつくられない","がくは花粉をつくる部分である","花びらは種子をつくる部分である"], diff:"基礎", a:0, e:"【解説】おしべの先にはやくがあり、その中で花粉がつくられる。【まちがえやすい点】ほかの選択肢（めしべの先(柱頭)では花粉はつくられない／がくは花粉をつくる部分である）とのちがいをおさえておこう。"},
  {id:"bio77", cat:"生物", sub:"生殖と遺伝", q:"生殖についての説明として正しいものはどれか。", choices:["有性生殖では両親の遺伝子を受けついだ子ができる","無性生殖ではつねに両親が必要である","有性生殖では子は親とほぼ同じ遺伝子をもつ","無性生殖では受精が必要である"], diff:"基礎", a:0, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位／「受精」＝精細胞と卵細胞が合体すること【解説】有性生殖では両親それぞれの生殖細胞が受精することで、両方の遺伝子を受けついだ子ができる。【まちがえやすい点】ほかの選択肢（無性生殖では必ず両親が必要である／有性生殖では子は親と全く同じ遺伝子をもつ）とのちがいをおさえておこう。"},
  {id:"bio79", cat:"生物", sub:"生態系と食物連鎖", q:"生物どうしのつながりについての説明として正しいものはどれか。", choices:["食物連鎖は一直線のつながりだけでなく","食物連鎖はすべて一直線のつながりだけで表される","生態系では消費者が最も数が多い","生態系には分解者は必要ない"], diff:"基礎", a:0, e:"【ことばの意味】「食物網」＝食べる・食べられるの関係が網の目のように複雑につながったもの【解説】実際の生物どうしのつながりは一直線ではなく、複数の生物が複雑にからみ合う食物網として表される。【まちがえやすい点】ほかの選択肢（食物連鎖はすべて一直線のつながりだけで表され…／生態系では消費者が最も数が多い）とのちがいをおさえておこう。"},
  {id:"bio81", cat:"生物", sub:"ヒトのからだ", q:"血液の成分についての説明として正しいものはどれか。", choices:["赤血球は酸素を運ぶはたらきをもつ","白血球は酸素を運ぶはたらきをもつ","血小板は体に侵入した細菌を食べるはたらきをもつ","血しょうは酸素を運ぶ主な成分である"], diff:"基礎", a:0, e:"【解説】赤血球にふくまれるヘモグロビンが酸素と結びつき、全身に酸素を運ぶはたらきをもつ。【まちがえやすい点】ほかの選択肢（白血球は酸素を運ぶはたらきをもつ／血小板は体に侵入した細菌を食べるはたらきをも…）とのちがいをおさえておこう。"},
  {id:"bio83", cat:"生物", sub:"生態系と食物連鎖", q:"生態系のバランスについての説明として正しいものはどれか。", choices:["生態系では生産者・消費者・分解者のつながりによって物質が循環している","生態系のバランスは一度くずれても瞬時に元に戻る","生態系には分解者がいなくても物質は循環する","生態系のバランスは人間の活動とは無関係である"], diff:"基礎", a:0, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること／「生産者」＝光合成で自分の養分をつくる生物（植物など）【解説】生態系では生産者・消費者・分解者のつながりを通じて炭素などの物質が循環している。【まちがえやすい点】ほかの選択肢（生態系のバランスは一度くずれても瞬時に元に戻…／生態系には分解者がいなくても物質は循環する）とのちがいをおさえておこう。"},
  {id:"bio85", cat:"生物", sub:"生物の観察", q:"生物の分類についての説明として正しいものはどれか。", choices:["生物は形やつくり","生物の分類は見た目の色だけで決められる","同じ種の生物はけっして同じ大きさに育つ","生物の分類に共通する基準は存在しない"], diff:"基礎", a:0, e:"【解説】生物は形やつくり、生活のしかたなどの特徴をもとに分類される。【まちがえやすい点】ほかの選択肢（生物の分類は見た目の色だけで決められる／同じ種の生物は絶対に同じ大きさに育つ）とのちがいをおさえておこう。"},
  {id:"bio87", cat:"生物", sub:"ヒトのからだ", q:"酵素についての説明として正しいものはどれか。", choices:["だ液にふくまれる消化酵素は決まった温度でよくはたらく","酵素はどんな温度でも同じようにはたらく","酵素は消化にはほとんど関係しない","酵素はすべて同じはたらきをもつ"], diff:"基礎", a:0, e:"【解説】消化酵素にはよくはたらく決まった温度があり、体温付近で最もはたらきやすいことが多い。【まちがえやすい点】ほかの選択肢（酵素はどんな温度でも同じようにはたらく／酵素は消化には全く関係しない）とのちがいをおさえておこう。"},
  {id:"bio89", cat:"生物", sub:"ヒトのからだ", q:"ホルモンについての説明として正しいものはどれか。", choices:["ホルモンは血液によって全身に運ばれ","ホルモンは神経のように電気信号として伝わる","ホルモンはすべて同じはたらきをもつ","ホルモンは骨だけから分泌される"], diff:"基礎", a:0, e:"【解説】ホルモンは特定の器官(内分泌腺)から分泌され、血液によって運ばれて特定の器官のはたらきを調節する。【まちがえやすい点】ほかの選択肢（ホルモンは神経のように電気信号として伝わる／ホルモンはすべて同じはたらきをもつ）とのちがいをおさえておこう。"},
  {id:"bio91", cat:"生物", sub:"生態系と食物連鎖", q:"絶滅危惧種についての説明として正しいものはどれか。", choices:["絶滅危惧種は数が減少し、絶滅のおそれがある生物である","絶滅危惧種はどんどん数が増えている生物のことである","絶滅危惧種の保護には環境の保全は関係ない","絶滅危惧種は一度指定されると二度と変更されない"], diff:"基礎", a:0, e:"【解説】絶滅危惧種は生息数が減少し、将来絶滅するおそれがあると考えられている生物である。【まちがえやすい点】ほかの選択肢（絶滅危惧種はどんどん数が増えている生物のこと…／絶滅危惧種の保護には環境の保全は関係ない）とのちがいをおさえておこう。"},
  {id:"bio93", cat:"生物", sub:"植物のつくり", q:"植物の光屈性についての説明として正しいものはどれか。", choices:["植物の茎は光の方向に向かって曲がって成長することがある","植物はどの方向から光が当たってもほとんど反応しない","光屈性は根にだけ見られる性質である","光屈性は動物にしか見られない性質である"], diff:"基礎", a:0, e:"【解説】植物の茎には光の方向に向かって曲がって成長する性質(光屈性)が見られることがある。【まちがえやすい点】ほかの選択肢（植物はどの方向から光が当たっても全く反応しな…／光屈性は根にだけ見られる性質である）とのちがいをおさえておこう。"},
  {id:"bio95", cat:"生物", sub:"季節と生物", q:"冬眠についての説明として正しいものはどれか。", choices:["冬眠は寒さや食物の少ない冬を乗り切るための行動の一つである","冬眠中の動物は体温が上がり、activity が活発になる状態である","冬眠は気温に関係なく、どの動物も毎年かならず行う行動である","冬眠は魚類だけに見られ、ほ乳類や両生類には見られない行動である"], diff:"基礎", a:0, e:"【解説】冬眠は、寒さや食物不足が厳しい冬を乗り切るための一部の動物に見られる行動である。【まちがえやすい点】ほかの選択肢（冬眠中の動物は活動が活発になる／すべての動物は冬になると冬眠する）とのちがいをおさえておこう。"},
  {id:"bio97", cat:"生物", sub:"生物の観察", q:"細菌とウイルスについての説明として正しいものはどれか。", choices:["細菌は細胞をもつ生物であり","細菌とウイルスはほぼ同じ構造をもつ","ウイルスは細菌よりつねに大きい","細菌はすべて人に害をあたえる"], diff:"基礎", a:0, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】細菌は細胞をもつ生物であるのに対し、ウイルスは細胞をもたず、他の生物の細胞を利用して増える。【まちがえやすい点】ほかの選択肢（細菌とウイルスはまったく同じ構造をもつ／ウイルスは細菌より必ず大きい）とのちがいをおさえておこう。"},
  {id:"bio99", cat:"生物", sub:"生殖と遺伝", q:"カエルの発生についての説明として正しいものはどれか。", choices:["カエルは卵→おたまじゃくし(幼生)→成体という順に育つ","カエルは卵から直接成体の姿でうまれる","カエルの発生には水はほとんど関係がない","カエルの幼生ははじめから肺だけで呼吸する"], diff:"基礎", a:0, e:"【解説】カエルは卵からおたまじゃくし(幼生)としてかえり、変態を経て成体になる。【まちがえやすい点】ほかの選択肢（カエルは卵から直接成体の姿でうまれる／カエルの発生には水は全く関係ない）とのちがいをおさえておこう。"},
  {id:"bio101", cat:"生物", sub:"ヒトのからだ", q:"生物の呼吸とエネルギーについての説明として正しいものはどれか。", choices:["呼吸によって栄養分から生活に必要なエネルギーが取り出される","呼吸はエネルギーを消費するだけでエネルギーを取り出すことはない","呼吸は光合成とほぼ同じ反応である","呼吸には酸素は必要ない"], diff:"基礎", a:0, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること／「呼吸」＝酸素を使って養分を分解し、エネルギーを取り出すこと【解説】呼吸は酸素を使って栄養分を分解し、生活に必要なエネルギーを取り出すはたらきである。【まちがえやすい点】ほかの選択肢（呼吸はエネルギーを消費するだけでエネルギーを…／呼吸は光合成と全く同じ反応である）とのちがいをおさえておこう。"},
  {id:"bio103", cat:"生物", sub:"生態系と食物連鎖", q:"生態系の物質循環についての説明として正しいものはどれか。", choices:["炭素は光合成や呼吸を通じて生物と大気の間を循環している","物質は一度生物に取りこまれると二度と外に出ない","生態系では物質の循環は起こらない","分解者は物質の循環には関係しない"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】炭素は光合成や呼吸などのはたらきを通じて、生物と大気(二酸化炭素)の間を循環している。【まちがえやすい点】ほかの選択肢（物質は一度生物に取りこまれると二度と外に出な…／生態系では物質の循環は起こらない）とのちがいをおさえておこう。"},
  {id:"bio105", cat:"生物", sub:"生殖と遺伝", q:"生殖細胞についての説明として正しいものはどれか。", choices:["生殖細胞には卵や精子がふくまれる","生殖細胞は体細胞とほぼ同じ染色体数をもつ","生殖細胞は体をつくるためだけに使われる","生殖細胞はほとんどの生物でほぼ同じ大きさである"], diff:"基礎", a:0, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】卵や精子は生殖のためにつくられる生殖細胞である。【まちがえやすい点】ほかの選択肢（生殖細胞は体細胞と全く同じ染色体数をもつ／生殖細胞は体をつくるためだけに使われる）とのちがいをおさえておこう。"},
  {id:"bio107", cat:"生物", sub:"生物の観察", q:"生物の体のつくりの共通点についての説明として正しいものはどれか。", choices:["多くの生物のからだは細胞からできている","ほとんどの生物は同じ形の細胞をもつ","細胞にはすべて同じはたらきしかない","単細胞生物は細胞をもたない"], diff:"基礎", a:0, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】多くの生物のからだは、生物のからだの基本単位である細胞からできている。【まちがえやすい点】ほかの選択肢（すべての生物は同じ形の細胞をもつ／細胞にはすべて同じはたらきしかない）とのちがいをおさえておこう。"},
  {id:"bio109", cat:"生物", sub:"ヒトのからだ", q:"体のつくりと働きの関係についての説明として正しいものはどれか。", choices:["特定のはたらきをもつ細胞が集まって組織をつくり、組織が集まって器官ができる","特定のはたらきをもつ器官が集まって組織をつくり、組織が細胞をつくる","器官と組織は同じものを指す言葉で、区別する必要はとくにない","多細胞生物のからだは、1つの器官だけでできあがっている"], diff:"基礎", a:0, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】多細胞生物のからだは、細胞が集まった組織、さらに組織が集まった器官という構造になっている。【まちがえやすい点】ほかの選択肢（器官と組織は全く同じ意味の言葉である／器官には特定のはたらきは全くない）とのちがいをおさえておこう。"},
  {id:"bio111", cat:"生物", sub:"生態系と食物連鎖", q:"生態系のエネルギーの流れについての説明として正しいものはどれか。", choices:["生態系におけるエネルギーのもとは主に太陽の光エネルギーである","生態系のエネルギーは物質のように循環してもとに戻る","エネルギーは消費者から生産者へ一方的に流れる","エネルギーの流れには光合成は関係しない"], diff:"基礎", a:0, e:"【ことばの意味】「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】生態系におけるエネルギーのもとは、光合成によって取りこまれる太陽の光エネルギーである。【まちがえやすい点】ほかの選択肢（生態系のエネルギーは物質のように循環してもと…／エネルギーは消費者から生産者へ一方的に流れる）とのちがいをおさえておこう。"},
  {id:"bio113", cat:"生物", sub:"動物のからだ", q:"動物の擬態についての説明として正しいものはどれか。", choices:["擬態とは、まわりの環境や他の生物に姿を似せて身を守ったり獲物に近づいたりする性質である","擬態とは、危険がせまったときに体の色をすばやく変えて相手をおどろかせる性質である","擬態は体の色だけに関わる現象で、形やもようは擬態には関係していない","擬態はどの動物にも共通して見られる性質で、例外となる動物はいない"], diff:"基礎", a:0, e:"【解説】擬態は他の生物や周囲の環境に姿を似せることで、身を守ったり獲物に近づいたりする性質である。【まちがえやすい点】ほかの選択肢（擬態はすべての動物に共通する特徴で、例外はな…／擬態は色にのみ関係し、形には全く関係しない）とのちがいをおさえておこう。"},
  {id:"bio115", cat:"生物", sub:"ヒトのからだ", q:"血液の循環経路についての説明として正しいものはどれか。", choices:["肺循環では血液が心臓と肺の間を循環する","体循環では血液が心臓と肺の間だけを循環する","肺循環と体循環はほぼ同じ経路をたどる","血液の循環に心臓は関係しない"], diff:"基礎", a:0, e:"【解説】肺循環は心臓と肺の間を血液が循環する経路で、ガス交換のために血液が肺に送られる。【まちがえやすい点】ほかの選択肢（体循環では血液が心臓と肺の間だけを循環する／肺循環と体循環はまったく同じ経路をたどる）とのちがいをおさえておこう。"},
  {id:"bio117", cat:"生物", sub:"ヒトのからだ", q:"骨格系についての説明として正しいものはどれか。", choices:["骨格には体を支えたり内臓を保護したりするはたらきがある","骨格には内臓を守るはたらきだけがあり、体を支える役割はない","骨格はどの動物でも同じつくりをしていて、種類による差はない","骨格は体を支えるだけで、筋肉の運動にはまったく関わらない"], diff:"基礎", a:0, e:"【解説】骨格は体を支える、内臓を保護する、筋肉と共同して体を動かすなどのはたらきをもつ。【まちがえやすい点】ほかの選択肢（骨格はすべての動物で全く同じつくりをしている／骨格には体を支えるはたらきはない）とのちがいをおさえておこう。"},
  {id:"bio119", cat:"生物", sub:"動物のからだ", q:"動物の子育てについての説明として正しいものはどれか。", choices:["哺乳類の多くは子をある程度育ててから独立させる","ほとんどの動物は卵を産みっぱなしにして育てない","子育てをする動物は存在しない","子育ての有無は種の生存にはほとんど関係しない"], diff:"基礎", a:0, e:"【解説】哺乳類の多くは子をある程度の期間育て、成長してから独立させることが多い。【まちがえやすい点】ほかの選択肢（すべての動物は卵を産みっぱなしにして育てない／子育てをする動物は存在しない）とのちがいをおさえておこう。"},
  {id:"bio121", cat:"生物", sub:"ヒトのからだ", q:"ヒトの目のつくりについての説明として正しいものはどれか。", choices:["網膜には光を受け取る細胞がある","レンズ(水晶体)は音を受け取る部分である","ひとみの大きさは光の量に関係なく常に一定である","目には光を屈折させるはたらきは全くない"], diff:"基礎", a:0, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】目の奥にある網膜には光の刺激を受け取る細胞があり、そこで受け取った情報が脳に伝えられる。【まちがえやすい点】ほかの選択肢（レンズ(水晶体)は音を受け取る部分である／ひとみの大きさは光の量に関係なく常に一定であ…）とのちがいをおさえておこう。"},
  {id:"bio123", cat:"生物", sub:"生態系と食物連鎖", q:"生物の生活場所についての説明として正しいものはどれか。", choices:["同じ地域でも、生物によって主に活動する時間帯（昼か夜か）が異なることがある","同じ地域に住む生物は、すべて同じ時間帯にそろって活動している","生物の生活場所は、種類が異なっていてもほとんど同じ環境になる","夜に活動する生物は存在せず、どの生物も昼にだけ活動している"], diff:"基礎", a:0, e:"【解説】生物には昼行性・夜行性など、活動する時間帯が異なるものがいる。【まちがえやすい点】ほかの選択肢（すべての生物は昼間だけ活動する／生物の生活場所は種類に関係なく全く同じである）とのちがいをおさえておこう。"},
  {id:"bio125", cat:"生物", sub:"ヒトのからだ", q:"生物の防衛反応についての説明として正しいものはどれか。", choices:["白血球には体内に侵入した異物を取りこんで排除するはたらきをもつものがある","白血球は酸素を運ぶことが主なはたらきで、異物の排除には関わらない","皮ふは細菌の侵入を防ぐはたらきをもたず、体内へ自由に通してしまう","体を守るはたらきは骨だけが担っていて、血液は関わっていない"], diff:"基礎", a:0, e:"【解説】白血球には体内に侵入した細菌などの異物を取りこんで排除するはたらきをもつものがある。【まちがえやすい点】ほかの選択肢（白血球には免疫のはたらきは全くない／皮ふは細菌の侵入を防ぐはたらきを全くもたない）とのちがいをおさえておこう。"},
  {id:"bio127", cat:"生物", sub:"植物のつくり", q:"植物の水の通り道についての説明として正しいものはどれか。", choices:["根から吸収された水は主に道管を通って植物全体に運ばれる","根から吸収された水は師管を通って運ばれる","水はすべて気孔からのみ植物内に入る","水の通り道は植物の種類に関係なくほぼ同じである"], diff:"基礎", a:0, e:"【ことばの意味】「道管」＝根から吸った水を運ぶ管【解説】根から吸収された水は、主に道管を通って茎や葉など植物全体に運ばれる。【まちがえやすい点】ほかの選択肢（根から吸収された水は師管を通って運ばれる／水はすべて気孔からのみ植物内に入る）とのちがいをおさえておこう。"},
  {id:"bio129", cat:"生物", sub:"生態系と食物連鎖", q:"生物の防除・保護についての説明として正しいものはどれか。", choices:["外来種の駆除は在来種を守るための対策の一つとして行われることがある","外来種はどれも貴重な生物なので、日本でも手厚く保護されている","生物多様性が失われる原因に、人間の活動はほとんど関わっていない","絶滅のおそれがある生物に対する保護の活動は行われていない"], diff:"基礎", a:0, e:"【解説】外来種の駆除は、在来種や生態系を守るための対策の一つとして行われることがある。【まちがえやすい点】ほかの選択肢（外来種はすべて保護すべき対象である／生物多様性の保護には人間の活動は全く関係しな…）とのちがいをおさえておこう。"},
  {id:"bio131", cat:"生物", sub:"植物のつくり", q:"植物の分類についての説明として正しいものはどれか。", choices:["種子をつくる植物と、種子をつくらない植物（シダ植物やコケ植物）がある","植物はどれも種子をつくってなかまをふやす方法をとっている","種子でふえる植物には、花をさかせないものは一つも存在しない","コケ植物には根・茎・葉のはっきりした区別があるものが多い"], diff:"基礎", a:0, e:"【解説】植物には種子でふえる種子植物と、胞子でふえるシダ植物やコケ植物などがある。【まちがえやすい点】ほかの選択肢（すべての植物は種子をつくる／種子植物には花をさかせないものは存在しない）とのちがいをおさえておこう。"},
  {id:"bio133", cat:"生物", sub:"生物の観察", q:"生物の観察記録についての説明として正しいものはどれか。", choices:["スケッチには気づいたことや大きさなどの情報もあわせて記録するとよい","スケッチは見たものと全く関係なく自由に描いてよい","観察記録には日時や場所を記録する必要はない","観察記録は記憶だけをたよりに後で書けばよい"], diff:"基礎", a:0, e:"【解説】観察記録には、スケッチとあわせて気づいたことや大きさ、日時・場所などの情報を記録しておくと役立つ。【まちがえやすい点】ほかの選択肢（スケッチは見たものと全く関係なく自由に描いて…／観察記録には日時や場所を記録する必要はない）とのちがいをおさえておこう。"},
  {id:"bio135", cat:"生物", sub:"ヒトのからだ", q:"ヒトの心臓のつくりについての説明として正しいものはどれか。", choices:["ヒトの心臓は2つの心房と2つの心室からなる","ヒトの心臓は1つの部屋だけでできている","ヒトの心臓には心房も心室も存在しない","ヒトの心臓のつくりは魚類とほぼ同じである"], diff:"基礎", a:0, e:"【解説】ヒトの心臓は右心房・右心室・左心房・左心室という2つの心房と2つの心室からなる。【まちがえやすい点】ほかの選択肢（ヒトの心臓は1つの部屋だけでできている／ヒトの心臓には心房も心室も存在しない）とのちがいをおさえておこう。"},
  {id:"bio137", cat:"生物", sub:"生物の観察", q:"生物の分類の考え方についての説明として正しいものはどれか。", choices:["生物はからだのつくりや生活のしかたなど、共通する特徴をもとにいくつかのなかまに分類されている","生物の分類には共通性はほとんど関係がない","ほとんどの生物は1つのなかまにまとめられる","生物の分類方法は時代によってほとんど変わらない"], diff:"基礎", a:0, e:"【ことばの意味】「分類」＝共通する特徴に注目して、生物をいくつかのグループ（なかま）に分けること。／【分類の考え方】背骨があるかないか、卵生か胎生か、光合成をするかしないかなど、からだのつくりや生活のしかたの共通点・相違点をもとに、脊椎動物・無脊椎動物、種子植物・胞子植物などのなかまに分けられます。／【まちがえやすい点】分類の方法は新しい発見（DNA分析など）によって、これからも見直されていくことがあります。"},
  {id:"bio139", cat:"生物", sub:"ヒトのからだ", q:"生活習慣と健康についての説明として正しいものはどれか。", choices:["バランスのよい食事や適度な運動は健康の維持に役立つと考えられている","食事や運動などの生活習慣は、健康の状態にはあまり関わっていない","睡眠は疲れをとるだけのもので、健康の維持とは関係が薄いとされる","運動不足の状態が続いても、体の健康にはほとんど影響が出ない"], diff:"標準", a:0, e:"【解説】バランスのよい食事・適度な運動・十分な睡眠などの生活習慣は、健康の維持に役立つと考えられている。【まちがえやすい点】ほかの選択肢（生活習慣は健康には全く関係しない／睡眠は健康には関係のない要素である）とのちがいをおさえておこう。"},
  {id:"bio141", cat:"生物", sub:"植物のつくり", q:"植物ホルモンについての説明として正しいものはどれか。", choices:["植物にも成長などを調節するはたらきをもつ物質があると考えられている","植物にはホルモンのようなはたらきをもつ物質はほとんど存在しない","植物ホルモンは動物のホルモンとほぼ同じ物質である","植物の成長には物質の調節はほとんど関係がない"], diff:"基礎", a:0, e:"【解説】植物にも成長や発芽などを調節するはたらきをもつ、植物ホルモンとよばれる物質があると考えられている。【まちがえやすい点】ほかの選択肢（植物にはホルモンのようなはたらきをもつ物質は…／植物ホルモンは動物のホルモンと全く同じ物質で…）とのちがいをおさえておこう。"},
  {id:"bio143", cat:"生物", sub:"動物のからだ", q:"生物のからだの対称性についての説明として正しいものはどれか。", choices:["ヒトを含む多くの動物のからだは左右対称に近い形をしている","どの生物のからだも、完全な左右対称の形でつくられている","からだの対称性は、生物の生活のしかたとは関係のない特徴である","左右対称の形をした生物は、実際には一つも存在していない"], diff:"基礎", a:0, e:"【解説】ヒトをふくむ多くの動物のからだは、左右対称に近い形をしている。【まちがえやすい点】ほかの選択肢（すべての生物のからだは左右対称である／対称性は生物のからだのつくりには全く関係のな…）とのちがいをおさえておこう。"},
  {id:"bio145", cat:"生物", sub:"ヒトのからだ", q:"動物の心臓の拍動についての説明として正しいものはどれか。", choices:["心臓の拍動によって血液が全身に送られる","心臓の拍動は血液の流れとはほとんど関係がない","心臓は一生の間、一度も休まずほぼ同じ速さで拍動し続ける","心臓の拍動数は運動しても変化しない"], diff:"基礎", a:0, e:"【解説】心臓が規則的に拍動することで、血液が全身に送り出されている。【まちがえやすい点】ほかの選択肢（心臓の拍動は血液の流れとは全く関係ない／心臓は一生の間、一度も休まず全く同じ速さで拍…）とのちがいをおさえておこう。"},
  {id:"bio147", cat:"生物", sub:"生態系と食物連鎖", q:"生物のエネルギー源についての説明として正しいものはどれか。", choices:["多くの生物は、食物や光合成によって得た有機物をエネルギー源として利用している","どの生物も太陽の光エネルギーをそのまま直接使って活動している","生物は食物をとらなくても、エネルギーなしで生きることができる","動物も植物と同じように、光合成で自分のエネルギー源をつくる"], diff:"基礎", a:0, e:"【ことばの意味】「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】多くの生物は、食物として取り入れたり光合成でつくったりした有機物をエネルギー源として利用している。【まちがえやすい点】ほかの選択肢（すべての生物は光エネルギーを直接利用してエネ…／生物にはエネルギー源は全く必要ない）とのちがいをおさえておこう。"},
  {id:"bio149", cat:"生物", sub:"植物のつくり", q:"植物の成長に必要な条件についての説明として正しいものはどれか。", choices:["植物の成長には光・水・適当な温度・栄養分などが関係することが多い","植物の成長には光は条件によらず必要とされていない","植物の成長に水は条件が変わっても影響を受けない","植物はどんな環境でもほぼ同じように育つと考えられている"], diff:"基礎", a:0, e:"【解説】植物の成長には光・水・適当な温度・栄養分などの条件が関係することが多い。【まちがえやすい点】ほかの選択肢（植物の成長には光は全く必要ない／植物の成長に水は全く関係ない）とのちがいをおさえておこう。"},
  {id:"bio151", cat:"生物", sub:"ヒトのからだ", q:"生物のからだを守るしくみについての説明として正しいものはどれか。", choices:["皮ふは体内への異物の侵入を防ぐはたらきの一つをもつと考えられている","皮ふには体を守るはたらきは条件が変わっても生じない","免疫のしくみは皮ふのはたらきとは全く関係がない","生物のからだを守るしくみは1種類しか存在しない"], diff:"標準", a:0, e:"【解説】皮ふには、体内への異物の侵入を防ぐバリアとしてのはたらきがあると考えられている。【まちがえやすい点】ほかの選択肢（皮ふには体を守るはたらきは全くない／免疫のしくみは皮ふのはたらきとは全く関係がな…）とのちがいをおさえておこう。"},
  {id:"bio153", cat:"生物", sub:"生態系と食物連鎖", q:"生物の集団についての説明として正しいものはどれか。", choices:["同じ場所に生活する同じ種の生物の集まりを個体群ということがある","個体群という考え方は生物学には存在しない","個体群はすべて異なる種類の生物だけで構成されている","個体群の考え方は植物には適用されない"], diff:"基礎", a:0, e:"【解説】同じ場所に生活する同じ種の生物の集まりを個体群という。【まちがえやすい点】ほかの選択肢（個体群という考え方は生物学には存在しない／個体群はすべて異なる種類の生物だけで構成され…）とのちがいをおさえておこう。"},
  {id:"bio155", cat:"生物", sub:"生物の観察", q:"生物の系統（なかまの関係）についての説明として正しいものはどれか。", choices:["共通する特徴の多い生物どうしは、進化の上で比較的近い関係にあると考えられることが多い","生物の系統関係はでたらめで規則性はほとんどない","見た目が似ていればつねに近い系統に分類される","系統関係を調べる方法はほとんど存在しない"], diff:"基礎", a:0, e:"【ことばの意味】「系統」＝生物が進化してきた道すじや、なかま関係のつながり。／【考え方】共通の祖先から進化してきた生物どうしは、からだのつくりや遺伝子に共通点が多く残っています。この共通点の多さから、どの生物とどの生物が近い関係にあるかを推定できます。／【まちがえやすい点】見た目が似ていても、必ずしも近い系統とはかぎりません（例：クジラの体形はサメと似ていますが、系統的には遠い関係です＝収れん）。"},
  {id:"bio157", cat:"生物", sub:"植物のつくり", q:"光合成に必要な条件を調べる実験についての説明として正しいものはどれか。", choices:["葉に日光を当てる部分と当てない部分をつくって比較する実験が行われることがある","この実験には葉を使うことはできないと考えられている","実験の結果は光の有無にほとんど関係しないと考えられている","この実験にヨウ素液は全く使われないと考えられている"], diff:"基礎", a:0, e:"【ことばの意味】「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】葉の一部に日光を当てず、当てた部分と比較することで、光合成に光が必要であることを確かめる実験が行われる。【まちがえやすい点】ほかの選択肢（この実験には葉を使うことはできない／実験の結果は光の有無に全く関係しない）とのちがいをおさえておこう。"},
  {id:"bio159", cat:"生物", sub:"生態系と食物連鎖", q:"生物と非生物的環境の関わりについての説明として正しいものはどれか。", choices:["気温・光・水などの非生物的環境は生物の生活に影響をあたえる","非生物的環境は生物にはほとんど影響をあたえない","生物は非生物的環境から完全に独立して生活している","非生物的環境という考え方は存在しない"], diff:"標準", a:0, e:"【解説】気温・光・水などの非生物的環境は、生物の生活のようすに大きな影響をあたえている。【まちがえやすい点】ほかの選択肢（非生物的環境は生物には全く影響をあたえない／生物は非生物的環境から完全に独立して生活して…）とのちがいをおさえておこう。"},
  {id:"bio161", cat:"生物", sub:"動物の分類", q:"生物のからだのつくりと機能の関係についての説明として正しいものはどれか。", choices:["鳥の翼は飛ぶことに適したつくりをしていると考えられている","生物のからだのつくりは機能とは全く関係なく決まっている","魚のひれは飛ぶために進化したと考えられている","からだのつくりと生活のしかたには全く関連性がない"], diff:"基礎", a:0, e:"【解説】鳥の翼は空を飛ぶことに適したつくりに進化してきたと考えられている。【まちがえやすい点】ほかの選択肢（生物のからだのつくりは機能とは全く関係なく決…／魚のひれは飛ぶために進化したと考えられている）とのちがいをおさえておこう。"},
  {id:"bio163", cat:"生物", sub:"生物の観察", q:"生物の観察と実験の記録についての説明として正しいものはどれか。", choices:["観察や実験の結果は、条件とともに正確に記録しておくことが大切である","記録は必要なく、頭の中で覚えておけばよい","記録には結果だけを書き、方法や条件は書かなくてよい","記録はあいまいであればあるほどよい"], diff:"基礎", a:0, e:"【なぜ記録が大切？】観察や実験は同じ日にもう一度できるとは限りません。後で見返して考察したり、他の人に伝えたりするために、日時・天気・方法・条件・結果を正確に記録しておくことが大切です。／【何を書くか】結果だけでなく、「どんな条件で」「どんな方法で」行ったかも書いておくと、なぜその結果になったのかを考えるときに役立ちます。／【まちがえやすい点】記憶だけにたよると、時間がたつと忘れたり間違えたりしてしまいます。"},
  {id:"bio165", cat:"生物", sub:"生殖と遺伝", q:"生物の休眠についての説明として正しいものはどれか。", choices:["種子には発芽に適さない時期に休眠する性質をもつものがある","種子はすべて休眠せず、条件がそろえばいつでも発芽する","休眠という現象は動物にしか見られない","種子の休眠は生存には全く関係のない性質である"], diff:"基礎", a:0, e:"【解説】種子には、発芽に適さない時期をやり過ごすために休眠する性質をもつものがある。【まちがえやすい点】ほかの選択肢（種子はすべて休眠せず、条件がそろえばいつでも…／休眠という現象は動物にしか見られない）とのちがいをおさえておこう。"},
  {id:"bio167", cat:"生物", sub:"ヒトのからだ", q:"ヒトの体内の水分についての説明として正しいものはどれか。", choices:["ヒトのからだの多くは水分でできていると考えられている","ヒトのからだには水分は全くふくまれていない","体内の水分量は健康にはほとんど関係しない","汗や尿として水分が失われることはない"], diff:"基礎", a:0, e:"【解説】ヒトのからだの多くは水分でできていると考えられており、水分は生命維持に重要な役割をもつ。【まちがえやすい点】ほかの選択肢（ヒトのからだには水分は全くふくまれていない／体内の水分量は健康には全く関係しない）とのちがいをおさえておこう。"},
  {id:"bio169", cat:"生物", sub:"動物の分類", q:"生物の呼吸に関わる器官の多様性についての説明として正しいものはどれか。", choices:["生物の種類によって、呼吸に使う器官のつくりは異なることが多い","ほとんどの生物はほぼ同じ呼吸器官をもつ","呼吸器官のちがいは生物の分類にはほとんど関係しない","植物には呼吸に関わる器官やしくみはほとんど存在しない"], diff:"標準", a:0, e:"【ことばの意味】「呼吸」＝酸素を使って養分を分解し、エネルギーを取り出すこと【解説】魚類はえら、昆虫は気門など、生物の種類によって呼吸に使う器官のつくりは異なることが多い。【まちがえやすい点】ほかの選択肢（すべての生物は全く同じ呼吸器官をもつ／呼吸器官のちがいは生物の分類には全く関係しな…）とのちがいをおさえておこう。"},
  {id:"bio171", cat:"生物", sub:"植物のつくり", q:"植物の茎の断面のつくりについての説明として正しいものはどれか。", choices:["茎の断面には水や養分の通り道である維管束が見られることが多い","茎には維管束はほとんど存在しないと考えられている","茎の断面のつくりは植物の種類によらずほぼ同じである","茎には水を運ぶはたらきは条件が変わっても生じない"], diff:"基礎", a:0, e:"【ことばの意味】「道管」＝根から吸った水を運ぶ管／「師管」＝葉でつくった養分を運ぶ管【解説】茎の断面には、水や養分の通り道である維管束(道管・師管)が見られることが多い。【まちがえやすい点】ほかの選択肢（茎には維管束は全く存在しない／茎の断面のつくりは植物の種類によらず全く同じ…）とのちがいをおさえておこう。"},
  {id:"bio173", cat:"生物", sub:"生態系と食物連鎖", q:"生物の生活場所の広がりについての説明として正しいものはどれか。", choices:["生物は陸上・水中・土の中などさまざまな場所で生活している","ほとんどの生物は陸上でしか生活できない","生物の生活場所はすべて同じ環境である","水中には生物は全く生活していない"], diff:"基礎", a:0, e:"【解説】生物は陸上・水中・土の中など、さまざまな環境に適応して生活している。【まちがえやすい点】ほかの選択肢（すべての生物は陸上でしか生活できない／生物の生活場所はすべて同じ環境である）とのちがいをおさえておこう。"},
  {id:"bio175", cat:"生物", sub:"ヒトのからだ", q:"生物のからだの水分調節についての説明として正しいものはどれか。", choices:["汗や尿として水分を排出することで、体内の水分量が調節されることがある","体内の水分量は調節されず、常に一定の量が保たれるしくみは存在しない","水分の摂取と排出は健康にはほとんど関係しない","植物には水分調節のしくみはほとんど存在しない"], diff:"標準", a:0, e:"【解説】ヒトは汗や尿として水分を排出したり、のどのかわきを感じて水分を摂取したりすることで体内の水分量を調節している。【まちがえやすい点】ほかの選択肢（体内の水分量は調節されず、常に一定の量が保た…／水分の摂取と排出は健康には全く関係しない）とのちがいをおさえておこう。"},
  {id:"bio177", cat:"生物", sub:"生態系と食物連鎖", q:"生態系における人間の役割についての説明として正しいものはどれか。", choices:["人間の活動は生態系にさまざまな影響をあたえることがある","人間は生態系には全く属していないと考えられている","人間の活動は生態系にはほとんど影響をあたえない","人間と生態系には何の関係もないと考えられている"], diff:"標準", a:0, e:"【解説】人間も生態系の一員であり、その活動は生態系にさまざまな影響をあたえることがある。【まちがえやすい点】ほかの選択肢（人間は生態系には全く属していない／人間の活動は生態系には全く影響をあたえない）とのちがいをおさえておこう。"},
  {id:"bio179", cat:"生物", sub:"生物の観察", q:"生物分野のまとめとして正しいものはどれか。", choices:["生物は多様でありながら、細胞をもつなど共通する特徴も見られる","生物の学習は暗記だけで完結し、しくみの理解は必要ない","生物と環境は全く独立していて関係がない","生物のからだのつくりとはたらきには全く関連性がない"], diff:"標準", a:0, e:"【ことばの意味】「細胞」＝生物のからだをつくる、いちばん小さな単位【解説】生物には種による多様性がある一方、細胞をもつことなど多くの生物に共通する特徴も見られる。【まちがえやすい点】ほかの選択肢（生物の学習は暗記だけで完結し、しくみの理解は…／生物と環境は全く独立していて関係がない）とのちがいをおさえておこう。"},
  {id:"ear1", cat:"地学", sub:"地震", q:"地震のゆれの大きさを表す尺度を何というか。", choices:["マグニチュード","震度","初期微動継続時間","P波"], diff:"基礎", a:1, e:"【ことばの意味】「マグニチュード」＝地震そのものの規模（エネルギーの大きさ）／「震度」＝その場所での揺れの強さ【解説】震度はある地点でのゆれの大きさを表し、マグニチュードは地震そのものの規模を表す。【まちがえやすい点】ほかの選択肢（マグニチュード／初期微動継続時間）とのちがいをおさえておこう。"},
  {id:"ear3", cat:"地学", sub:"火山と火成岩", q:"マグマが地表または地表近くで急に冷えて固まった岩石を何というか。", choices:["深成岩","火山岩","堆積岩","変成岩"], diff:"基礎", a:1, e:"【ことばの意味】「火山岩」＝マグマが地表近くで急に冷えた岩石。結晶が小さい【解説】マグマが地表付近で急速に冷え固まると、細かい結晶と大きな結晶が混ざる火山岩ができる。【まちがえやすい点】ほかの選択肢（深成岩／堆積岩）とのちがいをおさえておこう。"},
  {id:"ear5", cat:"地学", sub:"地層と堆積岩", q:"れき・砂・泥のうち、河口から最も遠くの沖合に堆積しやすいのはどれか。", choices:["れき","砂","泥","すべて同じ場所"], diff:"基礎", a:2, e:"【解説】粒が小さいものほど遠くまで運ばれやすく沈みにくいため、泥は沖合に堆積しやすい。【まちがえやすい点】ほかの選択肢（れき／砂）とのちがいをおさえておこう。"},
  {id:"ear7", cat:"地学", sub:"天気の変化", q:"上空に行くほど気圧が下がり、空気のかたまりが膨張して温度が下がる変化を何というか。", choices:["断熱膨張","断熱圧縮","飽和","凝結"], diff:"基礎", a:0, e:"【解説】上空では気圧が低くなるため空気は膨張し、その際に温度が下がる断熱膨張が起こる。【まちがえやすい点】ほかの選択肢（断熱圧縮／飽和）とのちがいをおさえておこう。"},
  {id:"ear9", cat:"地学", sub:"天体と宇宙", q:"地球が太陽のまわりを1年かけて回る運動を何というか。", choices:["自転","公転","満ち欠け","日周運動"], diff:"基礎", a:1, e:"【ことばの意味】「公転」＝地球が1年かけて太陽のまわりを回ること【解説】地球が太陽のまわりを1年周期でまわる運動を公転といい、季節の変化の原因となる。【まちがえやすい点】ほかの選択肢（自転／満ち欠け）とのちがいをおさえておこう。"},
  {id:"ear11", cat:"地学", sub:"天体と宇宙", q:"太陽・地球・月が一直線に並び、月が地球の影に入る現象を何というか。", choices:["日食","月食","新月","満月"], diff:"基礎", a:1, e:"【解説】太陽・地球・月の順に一直線に並び、月が地球の影に入って欠けて見える現象を月食という。【まちがえやすい点】ほかの選択肢（日食／新月）とのちがいをおさえておこう。"},
  {id:"ear13", cat:"地学", sub:"地層と堆積岩", q:"限られた時代に広い範囲で栄えた生物の化石で、地層の年代を知る手がかりになる化石を何というか。", choices:["示準化石","示相化石","標準生物","代表化石"], diff:"基礎", a:0, e:"【ことばの意味】「示準化石」＝地層ができた「時代」を知る手がかりになる化石【解説】示準化石は、限られた時代に広範囲で栄え絶滅した生物の化石で、地層の年代を知る手がかりになる。【まちがえやすい点】ほかの選択肢（示相化石／標準生物）とのちがいをおさえておこう。"},
  {id:"ear15", cat:"地学", sub:"地層と堆積岩", q:"地層が大きな力を受けて波打つように曲がった構造を何というか。", choices:["断層","しゅう曲","不整合","節理"], diff:"基礎", a:1, e:"【解説】地層が大きな力を受けて波打つように曲がった構造をしゅう曲という。【まちがえやすい点】ほかの選択肢（断層／不整合）とのちがいをおさえておこう。"},
  {id:"ear17", cat:"地学", sub:"天体と宇宙", q:"太陽系の惑星のうち、主に岩石でできた地球型惑星に分類されるものはどれか。", choices:["水星・金星・地球・火星","木星・土星・天王星・海王星","ほとんどの惑星","月と地球のみ"], diff:"基礎", a:0, e:"【ことばの意味】「惑星」＝太陽のまわりを回り、太陽の光を反射して光る星【解説】水星・金星・地球・火星は主に岩石でできた地球型惑星、木星以遠は主に気体やこおりでできた木星型惑星である。【まちがえやすい点】ほかの選択肢（木星・土星・天王星・海王星／すべての惑星）とのちがいをおさえておこう。"},
  {id:"ear19", cat:"地学", sub:"天体と宇宙", q:"太陽系がふくまれる、恒星の巨大な集団を何というか。", choices:["銀河系","太陽系","星団","星雲"], diff:"基礎", a:0, e:"【ことばの意味】「恒星」＝太陽のように自分で光る星【解説】太陽をふくむ恒星の大集団を銀河系といい、その中に太陽系が位置している。【まちがえやすい点】ほかの選択肢（太陽系／星団）とのちがいをおさえておこう。"},
  {id:"ear21", cat:"地学", sub:"天気の変化", q:"空気を冷やしていったときに水蒸気が凝結し始める温度を何というか。", choices:["露点","沸点","融点","氷点"], diff:"基礎", a:0, e:"【ことばの意味】「露点」＝空気中の水蒸気が水てきに変わり始める温度【解説】空気を冷やしていったときに水蒸気が凝結し始める温度を露点という。【まちがえやすい点】ほかの選択肢（沸点／融点）とのちがいをおさえておこう。"},
  {id:"ear23", cat:"地学", sub:"地震", q:"地球の表面をおおう、何枚かの厚い岩盤を何というか。", choices:["プレート","マントル","地殻","核"], diff:"基礎", a:0, e:"【ことばの意味】「プレート」＝地球の表面をおおう、いくつかに分かれた岩の板【解説】地球の表面は何枚かのかたい岩盤(プレート)におおわれており、これらがゆっくりと動くことで地震や火山活動が起こる。【まちがえやすい点】ほかの選択肢（マントル／地殻）とのちがいをおさえておこう。"},
  {id:"ear25", cat:"地学", sub:"火山と火成岩", q:"マグマが地下深くでゆっくり冷え固まり、大きな結晶がそろってできる岩石を何というか。", choices:["深成岩","火山岩","堆積岩","変成岩"], diff:"基礎", a:0, e:"【ことばの意味】「深成岩」＝マグマが地下深くでゆっくり冷えた岩石。結晶が大きい【解説】マグマが地下深くでゆっくり冷え固まると、大きな結晶がそろった深成岩ができる。【まちがえやすい点】ほかの選択肢（火山岩／堆積岩）とのちがいをおさえておこう。"},
  {id:"ear27", cat:"地学", sub:"火山と火成岩", q:"火山岩のうち、黒っぽい色をした代表的な岩石はどれか。", choices:["玄武岩","流紋岩","花こう岩","せん緑岩"], diff:"基礎", a:0, e:"【ことばの意味】「火山岩」＝マグマが地表近くで急に冷えた岩石。結晶が小さい【解説】玄武岩は有色鉱物を多くふくむ黒っぽい火山岩である。【まちがえやすい点】ほかの選択肢（流紋岩／花こう岩）とのちがいをおさえておこう。"},
  {id:"ear29", cat:"地学", sub:"天気の変化", q:"石炭や石油などのように、大昔の生物の死がいが変化してできた燃料を何というか。", choices:["化石燃料","再生可能燃料","核燃料","鉱物燃料"], diff:"基礎", a:0, e:"【解説】石炭や石油、天然ガスは大昔の生物の死がいが長い年月をかけて変化してできた化石燃料である。【まちがえやすい点】ほかの選択肢（再生可能燃料／核燃料）とのちがいをおさえておこう。"},
  {id:"ear31", cat:"地学", sub:"天気の変化", q:"夏の日本列島に影響をあたえる、あたたかく湿った気団はどれか。", choices:["小笠原気団","シベリア気団","揚子江気団","北極気団"], diff:"標準", a:0, e:"【ことばの意味】「季節風」＝季節によって決まった向きに吹く風【解説】夏には小笠原気団が発達し、あたたかく湿った南東の季節風が日本列島にふきこむ。【まちがえやすい点】ほかの選択肢（シベリア気団／揚子江気団）とのちがいをおさえておこう。"},
  {id:"ear33", cat:"地学", sub:"天体と宇宙", q:"金星が真夜中には見えず、明け方や夕方にだけ見える理由は何か。", choices:["金星が地球より内側を公転しているため","金星が地球から非常に遠いため","金星に大気がないため","金星が自ら光っていないため"], diff:"基礎", a:0, e:"【ことばの意味】「公転」＝地球が1年かけて太陽のまわりを回ること【解説】金星は地球より内側(太陽に近い側)を公転しているため、太陽から大きく離れて見えることがなく、真夜中には観測できない。【まちがえやすい点】ほかの選択肢（金星が地球から非常に遠いため／金星に大気がないため）とのちがいをおさえておこう。"},
  {id:"ear35", cat:"地学", sub:"天体と宇宙", q:"振り子の振れる面が時間とともに回転して見えることから、地球の自転を証明したとされる実験は何か。", choices:["フーコーの振り子","エラトステネスの実験","カヴェンディッシュの実験","ガリレイの落下実験"], diff:"基礎", a:0, e:"【ことばの意味】「自転」＝地球が1日に1回、自分で回ること【解説】フーコーの振り子は、振り子の振れる面が時間とともに少しずつ回転して見えることから、地球が自転していることを示す実験として知られる。【まちがえやすい点】ほかの選択肢（エラトステネスの実験／カヴェンディッシュの実験）とのちがいをおさえておこう。"},
  {id:"ear37", cat:"地学", sub:"天体と宇宙", q:"太陽が真南にきて最も高くなったときの高度を何というか。", choices:["南中高度","日周高度","公転高度","子午線高度"], diff:"基礎", a:0, e:"【ことばの意味】「南中高度」＝太陽が真南に来たときの、地平線からの角度【解説】太陽が真南にきて最も高くなったときの高度を南中高度という。【まちがえやすい点】ほかの選択肢（日周高度／公転高度）とのちがいをおさえておこう。"},
  {id:"ear39", cat:"地学", sub:"天体と宇宙", q:"星座の見える位置が季節によって変わる年周運動は、地球のどのような運動によって起こるか。", choices:["地球の公転","地球の自転","地軸の傾き","太陽の自転"], diff:"基礎", a:0, e:"【ことばの意味】「公転」＝地球が1年かけて太陽のまわりを回ること／「年周運動」＝1年のうちに星座の見える位置がずれていくこと【解説】星座の見える位置が季節によって変わる年周運動は、地球が太陽のまわりを1年かけて公転していることによって起こる。【まちがえやすい点】ほかの選択肢（地球の自転／地軸の傾き）とのちがいをおさえておこう。"},
  {id:"ear41", cat:"地学", sub:"地層と堆積岩", q:"放散虫などの死がいが堆積してでき、二酸化ケイ素を主成分とし、うすい塩酸をかけても気体が発生しない岩石は何か。", choices:["チャート","石灰岩","凝灰岩","れき岩"], diff:"基礎", a:0, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）／「酸化」＝物質が酸素と結びつくこと【解説】チャートは放散虫などの死がいが堆積してできた岩石で、二酸化ケイ素を主成分とし、うすい塩酸をかけても気体は発生しない。【まちがえやすい点】ほかの選択肢（石灰岩／凝灰岩）とのちがいをおさえておこう。"},
  {id:"ear43", cat:"地学", sub:"地層と岩石", q:"れき岩・砂岩・でい岩は、何のちがいによって分けられているか。", choices:["ふくまれるつぶの大きさ","岩石の表面の色あい","岩石のかたさのちがい","岩石のにおいのちがい"], diff:"基礎", a:0, e:"【分け方の基準】れき岩・砂岩・でい岩は、ふくまれているつぶ（粒子）の大きさで分けられます。／【大きさの目安】れき＝2mm以上、砂＝0.06〜2mm、どろ＝0.06mm未満。／【どこに積もる？】重い大きなつぶ（れき）は河口の近くに、軽い小さなつぶ（どろ）は遠くの沖まで運ばれて積もります。だから地層のつぶの大きさを調べると、その地層ができたとき岸から近かったか遠かったかがわかります。／【まちがえやすい点】色やかたさは岩石の種類を見分ける手がかりにはなりますが、この3つを分ける基準ではありません。"},
  {id:"ear45", cat:"地学", sub:"地震(計算)", q:"P波の伝わる速さを秒速6kmとし、地震発生から10秒後にP波が届いたとすると、震源からの距離はおよそ何kmか。", choices:["6km","30km","60km","120km"], diff:"標準", a:2, e:"【ことばの意味】「震源」＝地下で地震が発生した場所／「P波」＝最初に来る速い波。小さくカタカタ揺れる（初期微動）【解説】距離=速さ×時間=6km/s×10s=60kmである。【まちがえやすい点】ほかの選択肢（6km／30km）とのちがいをおさえておこう。"},
  {id:"ear47", cat:"地学", sub:"天気の変化(計算)", q:"上空では100mごとに気温がおよそ0.6℃下がるとすると、標高1000mでは地上より気温がおよそ何度低いか。", choices:["0.6℃","3℃","6℃","10℃"], diff:"標準", a:2, e:"【解説】0.6℃×(1000m÷100m)=0.6×10=6℃低くなる。【まちがえやすい点】ほかの選択肢（0.6℃／3℃）とのちがいをおさえておこう。"},
  {id:"ear49", cat:"地学", sub:"天体と宇宙", q:"月が地球のまわりを1周してもとの位置にもどる公転周期はおよそ何日か。", choices:["約7日","約27日","約100日","約365日"], diff:"標準", a:1, e:"【ことばの意味】「公転」＝地球が1年かけて太陽のまわりを回ること【解説】月が地球のまわりを1周する公転周期はおよそ27.3日である(満ち欠けの周期である約29.5日とは少し異なる)。【まちがえやすい点】ほかの選択肢（約7日／約100日）とのちがいをおさえておこう。"},
  {id:"ear51", cat:"地学", sub:"地震(計算)", q:"P波の速さを秒速7kmとすると、地震発生から5秒後にP波が届いた地点は震源からおよそ何kmか。", choices:["7km","14km","35km","70km"], diff:"標準", a:2, e:"【ことばの意味】「震源」＝地下で地震が発生した場所／「P波」＝最初に来る速い波。小さくカタカタ揺れる（初期微動）【解説】距離=速さ×時間=7km/s×5s=35kmである。【まちがえやすい点】ほかの選択肢（7km／14km）とのちがいをおさえておこう。"},
  {id:"ear53", cat:"地学", sub:"地震", q:"地震についての説明として正しいものはどれか。", choices:["P波はS波より遅く伝わるとされている","震源からの距離が遠いほど初期微動継続時間は長くなる","マグニチュードは観測地点によって値が変わる","震度はどこで測っても同じ値になる"], diff:"基礎", a:1, e:"【ことばの意味】「震源」＝地下で地震が発生した場所／「P波」＝最初に来る速い波。小さくカタカタ揺れる（初期微動）【解説】震源からの距離が遠くなるほどP波とS波の到着時刻の差(初期微動継続時間)は長くなる。【まちがえやすい点】ほかの選択肢（P波はS波より遅く伝わる／マグニチュードは観測地点によって値が変わる）とのちがいをおさえておこう。"},
  {id:"ear55", cat:"地学", sub:"地層と堆積岩", q:"地層についての説明として正しいものはどれか。", choices:["地層は下から上へ積み重なっていくことが多い","地層はつねに水平に積み重なる","地層には断層やしゅう曲はけっして見られない","地層はすべて同じ種類の岩石でできている"], diff:"基礎", a:0, e:"【解説】大きな地殻変動がない限り、地層は下から上へ順に積み重なっていく。【まちがえやすい点】ほかの選択肢（地層は必ず水平に積み重なる／地層には断層やしゅう曲は絶対に見られない）とのちがいをおさえておこう。"},
  {id:"ear57", cat:"地学", sub:"地層と堆積岩", q:"堆積岩についての説明として正しいものはどれか。", choices:["れき岩・砂岩・泥岩はつぶの大きさで分類される","石灰岩にうすい塩酸をかけても変化は起こらない","凝灰岩は生物の死がいからできる","チャートはうすい塩酸をかけると気体が発生する"], diff:"基礎", a:0, e:"【ことばの意味】「堆積岩」＝土砂や生物の死がいが積もって固まった岩石【解説】れき岩・砂岩・泥岩は、それぞれをつくるつぶの大きさによって分類されている。【まちがえやすい点】ほかの選択肢（石灰岩にうすい塩酸をかけても変化は起こらない／凝灰岩は生物の死がいからできる）とのちがいをおさえておこう。"},
  {id:"ear59", cat:"地学", sub:"天気の変化", q:"天気の変化についての説明として正しいものはどれか。", choices:["日本付近の天気は偏西風の影響で西から東へ変わることが多い","日本付近の天気は常に東から西へ変わる","天気はどの地域でもほぼ同じ周期で変化する","前線が通過しても天気は変化しない"], diff:"標準", a:0, e:"【解説】日本付近の上空には偏西風がふいており、この影響で天気が西から東へ変わることが多い。【まちがえやすい点】ほかの選択肢（日本付近の天気は常に東から西へ変わる／天気はどの地域でも全く同じ周期で変化する）とのちがいをおさえておこう。"},
  {id:"ear61", cat:"地学", sub:"天気の変化", q:"気団についての説明として正しいものはどれか。", choices:["シベリア気団は冬に発達し、冷たく乾いている","小笠原気団は冬に発達し、冷たく乾いている","気団の性質は季節に関係なく一定である","日本付近には気団は存在しない"], diff:"基礎", a:0, e:"【ことばの意味】「季節風」＝季節によって決まった向きに吹く風【解説】冬にはシベリア気団が発達し、冷たく乾いた北西の季節風が日本列島にふきこむ。【まちがえやすい点】ほかの選択肢（小笠原気団は冬に発達し、冷たく乾いている／気団の性質は季節に関係なく一定である）とのちがいをおさえておこう。"},
  {id:"ear63", cat:"地学", sub:"天体と宇宙", q:"惑星についての説明として正しいものはどれか。", choices:["地球型惑星は主に岩石でできている","木星型惑星は地球型惑星よりも密度が大きい","ほとんどの惑星は同じ大きさである","惑星は自ら光りかがやく天体である"], diff:"基礎", a:0, e:"【ことばの意味】「惑星」＝太陽のまわりを回り、太陽の光を反射して光る星【解説】水星・金星・地球・火星などの地球型惑星は主に岩石でできており、木星型惑星より密度が大きい。【まちがえやすい点】ほかの選択肢（木星型惑星は地球型惑星よりも密度が大きい／すべての惑星は同じ大きさである）とのちがいをおさえておこう。"},
  {id:"ear65", cat:"地学", sub:"地球と宇宙", q:"星座をつくっている星について正しいものはどれか。", choices:["地球からの距離はそれぞれちがい","すべて地球から同じ距離にある","すべて同じ大きさで同じ明るさである","すべて太陽のまわりを回っている"], diff:"標準", a:0, e:"【ことばの意味】「星座」＝夜空の星をいくつか結んで、動物や人の形に見立てたもの。／【実は並んでいない】星座の星は、地球から見ると近くに並んで見えますが、実際は地球からの距離がバラバラです。何十光年のものもあれば、何百光年先のものもあります。たまたま同じ方向に見えているだけなのです。／【明るさも様々】見かけの明るさは「実際の明るさ」と「地球からの距離」の両方で決まります。／【まちがえやすい点】星座の星は恒星（自分で光る星）で、太陽のまわりを回ってはいません。太陽のまわりを回るのは惑星です。"},
  {id:"ear67", cat:"地学", sub:"天気の変化", q:"湿度についての説明として正しいものはどれか。", choices:["湿度は空気中にふくまれる水蒸気の割合(飽和水蒸気量に対する割合)を表す","湿度は気温にほとんど関係しないと考えられている","湿度が高いほど空気はつねに冷たいと考えられている","湿度は常に100%で一定と考えられている"], diff:"基礎", a:0, e:"【ことばの意味】「飽和」＝これ以上とけない状態／「湿度」＝空気がどれくらい水蒸気をふくんでいるかの割合【解説】湿度は、その気温での飽和水蒸気量に対する実際の水蒸気量の割合を百分率で表したものである。【まちがえやすい点】ほかの選択肢（湿度は気温に全く関係しない／湿度が高いほど空気は必ず冷たい）とのちがいをおさえておこう。"},
  {id:"ear69", cat:"地学", sub:"天気の変化", q:"台風についての説明として正しいものはどれか。", choices:["台風は熱帯の海上で発生した熱帯低気圧が発達したものである","台風は冬の日本海側で最も多く発生する","台風の目では風雨が最も強くなるとされている","台風はすべて同じ強さで発生すると考えられている"], diff:"基礎", a:0, e:"【ことばの意味】「低気圧」＝まわりより気圧が低い所。上昇気流で雨が降りやすい【解説】台風は熱帯の海上で発生した熱帯低気圧のうち、発達して最大風速が一定以上になったものである。【まちがえやすい点】ほかの選択肢（台風は冬の日本海側で最も多く発生する／台風の目では風雨が最も強くなる）とのちがいをおさえておこう。"},
  {id:"ear71", cat:"地学", sub:"地震", q:"地球の内部構造についての説明として正しいものはどれか。", choices:["地球の内部は地殻・マントル・核という層に分かれている","地球の内部はすべて同じ物質でできている","マントルは地球の最も外側の層である","核は地球の最も外側の層と考えられている"], diff:"基礎", a:0, e:"【解説】地球の内部は、外側から地殻・マントル・核という層構造になっている。【まちがえやすい点】ほかの選択肢（地球の内部はすべて同じ物質でできている／マントルは地球の最も外側の層である）とのちがいをおさえておこう。"},
  {id:"ear73", cat:"地学", sub:"地層と堆積岩", q:"れき・砂・泥についての説明として正しいものはどれか。", choices:["つぶの大きさは、れき>砂>泥の順に小さくなる","つぶの大きさは、泥>砂>れきの順に小さくなる","れき・砂・泥のつぶの大きさはすべて同じである","つぶの大きさは色"], diff:"基礎", a:0, e:"【解説】堆積物のつぶの大きさは、れきが最も大きく、砂、泥の順に小さくなる。【まちがえやすい点】ほかの選択肢（つぶの大きさは、泥>砂>れきの順に小さくなる／れき・砂・泥のつぶの大きさはすべて同じである）とのちがいをおさえておこう。"},
  {id:"ear75", cat:"地学", sub:"天体と宇宙", q:"日食と月食についての説明として正しいものはどれか。", choices:["日食は太陽・月・地球の順に一直線に並んだときに起こる","月食は太陽・月・地球の順に一直線に並んだときに起こる","日食と月食は同じ現象と考えられている","日食も月食も毎月つねに起こるとされている"], diff:"基礎", a:0, e:"【解説】日食は太陽・月・地球の順に一直線に並び、月が太陽をかくすことで起こる。【まちがえやすい点】ほかの選択肢（月食は太陽・月・地球の順に一直線に並んだとき…／日食と月食は同じ現象である）とのちがいをおさえておこう。"},
  {id:"ear77", cat:"地学", sub:"火山と火成岩", q:"マグマの性質についての説明として正しいものはどれか。", choices:["マグマのねばりけは、ふくまれる成分によって異なる","マグマのねばりけはすべて同じである","マグマは常に地表に噴き出している","マグマには温度がほとんど関係しない"], diff:"基礎", a:0, e:"【ことばの意味】「マグマ」＝地下にある、岩石がとけてどろどろになったもの。「ねばりけ」＝マグマの流れにくさ。／【何で決まる？】マグマにふくまれる二酸化ケイ素（SiO₂）の量が多いほどねばりけが強くなります。ねばりけが強いマグマは爆発的な噴火を起こしやすく、ねばりけが弱いマグマは穏やかに流れ出やすい性質があります。／【まちがえやすい点】マグマは地下にたまっていて、つねに噴き出しているわけではありません。噴火のときだけ地表に出てきます。"},
  {id:"ear79", cat:"地学", sub:"火山と火成岩", q:"火山噴出物についての説明として正しいものはどれか。", choices:["火山灰や軽石、溶岩は火山噴出物の一例である","火山噴出物はすべて液体である","火山噴出物はつねに黒色をしている","火山噴出物は噴火のたびにほぼ同じ量になる"], diff:"基礎", a:0, e:"【解説】火山灰・軽石・溶岩・火山ガスなどは、噴火のときに噴き出される火山噴出物の例である。【まちがえやすい点】ほかの選択肢（火山噴出物はすべて液体である／火山噴出物は必ず黒色をしている）とのちがいをおさえておこう。"},
  {id:"ear81", cat:"地学", sub:"天体と宇宙", q:"太陽系の天体についての説明として正しいものはどれか。", choices:["小惑星は主に火星と木星の軌道の間に多く分布している","すい星は常に同じ位置にとどまっている天体である","衛星は恒星のまわりを公転する天体である","ほとんどの惑星には衛星がある"], diff:"基礎", a:0, e:"【ことばの意味】「惑星」＝太陽のまわりを回り、太陽の光を反射して光る星【解説】小惑星の多くは、火星と木星の軌道の間にある小惑星帯に分布している。【まちがえやすい点】ほかの選択肢（すい星は常に同じ位置にとどまっている天体であ…／衛星は恒星のまわりを公転する天体である）とのちがいをおさえておこう。"},
  {id:"ear83", cat:"地学", sub:"天気の変化", q:"天気図についての説明として正しいものはどれか。", choices:["等圧線の間隔がせまいところほど風が強く吹きやすい","等圧線の間隔は風の強さとは関係ない","天気図には気温だけが記録される","高気圧はつねに「L」の記号で表される"], diff:"基礎", a:0, e:"【解説】等圧線の間隔がせまいところほど気圧の差が大きく、風が強く吹きやすい。【まちがえやすい点】ほかの選択肢（等圧線の間隔は風の強さとは関係ない／天気図には気温だけが記録される）とのちがいをおさえておこう。"},
  {id:"ear85", cat:"地学", sub:"天気の変化", q:"雲のでき方についての説明として正しいものはどれか。", choices:["空気が上昇すると膨張して温度が下がり","雲は空気が下降することでできる","雲は水蒸気が凝結せずにできる","雲のでき方に気温はほとんど関係がない"], diff:"基礎", a:0, e:"【解説】上昇した空気は膨張して温度が下がり、水蒸気が凝結して細かい水滴や氷の粒になることで雲ができる。【まちがえやすい点】ほかの選択肢（雲は空気が下降することでできる／雲は水蒸気が凝結せずにできる）とのちがいをおさえておこう。"},
  {id:"ear87", cat:"地学", sub:"天気の変化", q:"日本の四季と天気についての説明として正しいものはどれか。", choices:["冬の日本海側では雪が多く降ることがある","夏の日本列島は乾燥した晴天が続くことが多い","つゆ(梅雨)の時期は乾燥した晴天が続くことが多い","日本には季節による天気の変化はほとんど見られない"], diff:"基礎", a:0, e:"【ことばの意味】「季節風」＝季節によって決まった向きに吹く風【解説】冬になるとシベリアからの季節風が日本海で水蒸気を含み、日本海側に多くの雪を降らせることがある。【まちがえやすい点】ほかの選択肢（夏の日本列島は乾燥した晴天が続くことが多い／つゆ(梅雨)の時期は乾燥した晴天が続くことが…）とのちがいをおさえておこう。"},
  {id:"ear89", cat:"地学", sub:"天気の変化", q:"台風の進路についての説明として正しいものはどれか。", choices:["台風は上空の風や気圧配置の影響を受けて進路が変化することがある","台風の進路は常に一定で変化しないと考えられている","台風の進路予測には全く根拠がないと考えられている","台風はつねに同じ速さで進み続けるとされている"], diff:"標準", a:0, e:"【解説】台風は上空の偏西風や周囲の気圧配置の影響を受けて進路や速さが変化することがある。【まちがえやすい点】ほかの選択肢（台風の進路は常に一定で変化しない／台風の進路予測には全く根拠がない）とのちがいをおさえておこう。"},
  {id:"ear91", cat:"地学", sub:"天体と宇宙", q:"南半球と北半球の季節についての説明として正しいものはどれか。", choices:["北半球が夏のとき、南半球は冬になることが多い","北半球と南半球はいつも同じ季節になる","南半球には季節の変化が全くない","季節は経度によってのみ決まる"], diff:"標準", a:0, e:"【解説】北半球と南半球では季節が逆になり、北半球が夏のとき南半球は冬になることが多い。【まちがえやすい点】ほかの選択肢（北半球と南半球はいつも同じ季節になる／南半球には季節の変化が全くない）とのちがいをおさえておこう。"},
  {id:"ear93", cat:"地学", sub:"天体の動き", q:"日食や月食がめったに起こらないのはなぜか。", choices:["太陽・地球・月がほぼ一直線に並ぶ機会が限られているから","太陽と月の大きさが年によって変わってしまうから","地球の自転の速さが不規則に変化してしまうから","月が地球のまわりを回る向きが毎回変わるから"], diff:"標準", a:0, e:"【日食・月食が起こる条件】日食は「太陽→月→地球」の順に、月食は「太陽→地球→月」の順に、ほぼ一直線に並んだときだけ起こります。／【なぜ毎月起きない？】日食は新月、月食は満月のときに起こるはずですが、毎月は起こりません。これは月が地球のまわりを回る道すじが、地球が太陽のまわりを回る道すじに対して約5°かたむいているためです。ふだんは月が地球の影の少し上か下を通ってしまうのです。／【まちがえやすい点】太陽や月の大きさが変わったり、自転の速さが変わったりするからではありません。"},
  {id:"ear95", cat:"地学", sub:"海洋と気候", q:"海流についての説明として正しいものはどれか。", choices:["海水は海流によって一定の向きに流れていることが多い","海水は全く動かず、常に同じ場所にとどまっている","海流は気候にはほとんど影響をあたえない","暖流と寒流という区別は存在しない"], diff:"標準", a:0, e:"【解説】海水は海流によって、地球規模である程度決まった向きに流れていることが多い。【まちがえやすい点】ほかの選択肢（海水は全く動かず、常に同じ場所にとどまってい…／海流は気候には全く影響をあたえない）とのちがいをおさえておこう。"},
  {id:"ear97", cat:"地学", sub:"地震", q:"地震の予知についての説明として正しいものはどれか。", choices:["現在の科学技術でも、地震の発生時刻や規模を正確に予知することは非常に難しいとされている","地震はいつどこで起こるか完全に予知できる","地震の予知は簡単で、誰でもすぐにできる","地震の予知には全く研究が行われていない"], diff:"基礎", a:0, e:"【現状】地震は地下深くで起こるため直接観察することができず、いつ・どこで・どのくらいの規模で起こるかを正確に予測することは、現在の科学技術でも非常に難しいとされています。／【行われている研究】地震活動の観察、地殻変動の測定、過去の地震の記録の分析などの研究は日々進められています。緊急地震速報のように、地震が起きた直後にすばやく知らせるしくみは実用化されています。／【まちがえやすい点】「予知」と「速報」はちがいます。速報は起きた地震をすぐに知らせるしくみです。"},
  {id:"ear99", cat:"地学", sub:"防災", q:"自然災害への備えについての説明として正しいものはどれか。", choices:["地域や家庭であらかじめ避難計画を立てておくことが大切である","自然災害はいつ起きても対策の必要はない","自然災害の被害は備えとは全く関係なく決まる","自然災害への備えは大人だけが考えればよい"], diff:"基礎", a:0, e:"【解説】地域や家庭であらかじめ避難計画を立てておくことは、被害を減らすために大切な備えである。【まちがえやすい点】ほかの選択肢（自然災害はいつ起きても対策の必要はない／自然災害の被害は備えとは全く関係なく決まる）とのちがいをおさえておこう。"},
  {id:"ear101", cat:"地学", sub:"資源とエネルギー", q:"再生可能エネルギーと化石燃料についての説明として正しいものはどれか。", choices:["化石燃料は使うと減っていく資源である","再生可能エネルギーはつねに化石燃料より発電コストが安い","化石燃料は無限に存在する資源である","再生可能エネルギーの利用は環境に一切良い影響をあたえない"], diff:"標準", a:0, e:"【解説】石炭や石油などの化石燃料は、使い続ければ将来的に減っていく資源である。【まちがえやすい点】ほかの選択肢（再生可能エネルギーは必ず化石燃料より発電コス…／化石燃料は無限に存在する資源である）とのちがいをおさえておこう。"},
  {id:"ear103", cat:"地学", sub:"天気の変化", q:"天気予報についての説明として正しいものはどれか。", choices:["天気予報は過去の気象データや観測結果をもとに作成される","天気予報はつねに100%的中する","天気予報には科学的根拠は全く用いられていない","天気予報は江戸時代から現在とほぼ同じ方法で行われている"], diff:"基礎", a:0, e:"【解説】天気予報は過去の気象データや現在の観測結果、コンピューターによる計算などをもとに作成される。【まちがえやすい点】ほかの選択肢（天気予報は必ず100%的中する／天気予報には科学的根拠は全く用いられていない）とのちがいをおさえておこう。"},
  {id:"ear107", cat:"地学", sub:"火山と火成岩", q:"変成岩についての説明として正しいものはどれか。", choices:["変成岩は既存の岩石が熱や圧力を受けて性質が変化してできる","変成岩はマグマが直接冷え固まってできる岩石である","変成岩は生物の死がいだけからできるとされている","変成岩は常に火成岩に分類されるとされている"], diff:"基礎", a:0, e:"【ことばの意味】「圧力」＝面積あたりにかかる力（力÷面積）【解説】変成岩は、既存の岩石が地下で熱や圧力を受けて性質が変化してできる岩石である。【まちがえやすい点】ほかの選択肢（変成岩はマグマが直接冷え固まってできる岩石で…／変成岩は生物の死がいだけからできる）とのちがいをおさえておこう。"},
  {id:"ear109", cat:"地学", sub:"防災", q:"気象災害についての説明として正しいものはどれか。", choices:["大雨によって土砂災害や洪水が起こることがある","気象災害は日本では全く起こらない","気象災害の被害は事前の備えとはほとんど関係がない","気象災害はすべて同じ原因で起こる"], diff:"基礎", a:0, e:"【解説】大雨によって土砂災害や洪水などの気象災害が起こることがある。【まちがえやすい点】ほかの選択肢（気象災害は日本では全く起こらない／気象災害の被害は事前の備えとは全く関係ない）とのちがいをおさえておこう。"},
  {id:"ear111", cat:"地学", sub:"天体と宇宙", q:"星の明るさについての説明として正しいものはどれか。", choices:["星の見かけの明るさは、実際の明るさだけでなく地球からの距離にも関係する","星の見かけの明るさは地球からの距離にほとんど関係しない","ほとんどの星は同じ明るさに見えるとされている","星の明るさは色には条件が変わっても影響を受けない"], diff:"基礎", a:0, e:"【解説】星の見かけの明るさは、星自体の実際の明るさと地球からの距離の両方によって決まる。【まちがえやすい点】ほかの選択肢（星の見かけの明るさは地球からの距離に全く関係…／すべての星は同じ明るさに見える）とのちがいをおさえておこう。"},
  {id:"ear113", cat:"地学", sub:"天体と宇宙", q:"太陽の観察方法についての説明として正しいものはどれか。", choices:["太陽を直接肉眼で見続けることは目を痛める危険があるため避けるべきである","太陽は肉眼で直接長時間観察しても全く問題ない","太陽の観察には特別な注意は必要ないと考えられている","太陽投影板は太陽を安全に観察するための道具ではない"], diff:"基礎", a:0, e:"【解説】太陽を直接肉眼で見続けると目を痛める危険があるため、太陽投影板などを使った安全な観察方法が用いられる。【まちがえやすい点】ほかの選択肢（太陽は肉眼で直接長時間観察しても全く問題ない／太陽の観察には特別な注意は必要ない）とのちがいをおさえておこう。"},
  {id:"ear115", cat:"地学", sub:"火山と火成岩", q:"火山の恵みについての説明として正しいものはどれか。", choices:["火山活動によってできた地形が観光資源として利用されることがある","火山には人間の生活に役立つ面は条件が変わっても生じない","温泉は火山活動とは全く関係がないと考えられている","火山灰は農業に全く利用されないと考えられている"], diff:"基礎", a:0, e:"【解説】火山活動によってできた地形や温泉は、観光資源として利用されることがある。【まちがえやすい点】ほかの選択肢（火山には人間の生活に役立つ面は全くない／温泉は火山活動とは全く関係がない）とのちがいをおさえておこう。"},
  {id:"ear117", cat:"地学", sub:"環境と資源", q:"地球規模の環境問題についての説明として正しいものはどれか。", choices:["大気汚染や水質汚染は環境問題の一例である","環境問題は特定の国だけに関係する問題である","環境問題の解決には国際的な協力はほとんど必要ない","環境問題は現在ではすべて解決されている"], diff:"基礎", a:0, e:"【解説】大気汚染や水質汚染などは、地球規模の環境問題の一例として挙げられる。【まちがえやすい点】ほかの選択肢（環境問題は特定の国だけに関係する問題である／環境問題の解決には国際的な協力は全く必要ない）とのちがいをおさえておこう。"},
  {id:"ear119", cat:"地学", sub:"環境と資源", q:"気候変動についての説明として正しいものはどれか。", choices:["気候変動は自然の要因と人間活動の両方が関係していると考えられている","気候変動は人間の活動とは全く関係がない","気候変動は一度も観測されたことがない現象である","気候変動の研究には科学的な観測データは使われていない"], diff:"基礎", a:0, e:"【解説】気候変動には自然の要因と人間の活動の両方が関係していると多くの研究で考えられている。【まちがえやすい点】ほかの選択肢（気候変動は人間の活動とは全く関係がない／気候変動は一度も観測されたことがない現象であ…）とのちがいをおさえておこう。"},
  {id:"ear121", cat:"地学", sub:"天気の変化", q:"大気の構造についての説明として正しいものはどれか。", choices:["大気は地表からの高さによっていくつかの層に分けられることが多い","大気の性質はどの高さでもほぼ同じと考えられている","大気には層構造は自然界には存在しないとされる","大気の層構造は天気には条件が変わっても影響を受けない"], diff:"基礎", a:0, e:"【ことばの意味】「対流」＝あたたまった液体や気体が動いて熱を運ぶこと【解説】大気は地表からの高さによって対流圏・成層圏など、いくつかの層に分けられることが多い。【まちがえやすい点】ほかの選択肢（大気の性質はどの高さでも全く同じである／大気には層構造は存在しない）とのちがいをおさえておこう。"},
  {id:"ear123", cat:"地学", sub:"天気の変化", q:"台風の発生条件についての説明として正しいものはどれか。", choices:["台風は暖かい海面からの水蒸気をエネルギー源として発達する","台風は冷たい海面でよく発達すると考えられている","台風の発生には海水温は条件が変わっても影響を受けない","台風はどの季節でも同じくらいの頻度で発生する"], diff:"基礎", a:0, e:"【解説】台風は暖かい海面から供給される水蒸気がもつ熱エネルギーを利用して発達する。【まちがえやすい点】ほかの選択肢（台風は冷たい海面でよく発達する／台風の発生には海水温は全く関係ない）とのちがいをおさえておこう。"},
  {id:"ear125", cat:"地学", sub:"地層と堆積岩", q:"火成岩と堆積岩の見分け方についての説明として正しいものはどれか。", choices:["火成岩には結晶のつくり(組織)が見られることが多い","堆積岩には結晶のつくりはけっして見られない","火成岩と堆積岩は見た目で全く区別できない","堆積岩には粒の並び方や地層のような構造はほとんど見られない"], diff:"基礎", a:0, e:"【ことばの意味】「堆積岩」＝土砂や生物の死がいが積もって固まった岩石／「火成岩」＝マグマが冷えて固まった岩石【解説】火成岩にはマグマが冷え固まってできる結晶のつくり(組織)が見られることが多い。【まちがえやすい点】ほかの選択肢（堆積岩には結晶のつくりは絶対に見られない／火成岩と堆積岩は見た目で全く区別できない）とのちがいをおさえておこう。"},
  {id:"ear127", cat:"地学", sub:"地震", q:"液状化現象についての説明として正しいものはどれか。", choices:["地震の強いゆれによって、水を多くふくむ砂の地盤が液体のようにやわらかくなる現象である","液状化現象は火山の噴火でのみ起こる現象である","液状化現象は乾燥した山地でよく起こる","液状化現象は天気とは無関係に毎日起こっている"], diff:"標準", a:0, e:"【ことばの意味】「液状化現象」＝地震の強いゆれによって、水を多くふくんだ砂の地盤が、まるで液体のようにやわらかくなってしまう現象。／【どこで起きやすい？】うめ立て地や川・海の近くの砂地など、地下水位が高く砂が多い場所で起こりやすいです。地面から水や砂がふき出したり、建物がかたむいたりする被害が出ることがあります。／【まちがえやすい点】火山の噴火とは関係なく、地震のゆれが原因で起こります。乾燥した山地では起こりにくい現象です。"},
  {id:"ear129", cat:"地学", sub:"天体と宇宙", q:"星座の見える時期についての説明として正しいものはどれか。", choices:["季節によって夜に見える星座は変化する","どの季節でもほぼ同じ星座しか見えない","星座の見える時期は地球の自転にのみ関係する","星座は1年中同じ位置に見え続ける"], diff:"基礎", a:0, e:"【ことばの意味】「公転」＝地球が1年かけて太陽のまわりを回ること【解説】地球の公転により、季節によって夜に見える星座は変化する。【まちがえやすい点】ほかの選択肢（どの季節でも全く同じ星座しか見えない／星座の見える時期は地球の自転にのみ関係する）とのちがいをおさえておこう。"},
  {id:"ear131", cat:"地学", sub:"天気の変化", q:"気象要素についての説明として正しいものはどれか。", choices:["気温・湿度・気圧・風向・風速などを気象要素という","気象要素には気温だけがふくまれる","気象要素は天気の判断には全く使われない","気象要素はすべて同じ方法で測定される"], diff:"基礎", a:0, e:"【ことばの意味】「湿度」＝空気がどれくらい水蒸気をふくんでいるかの割合【解説】気温・湿度・気圧・風向・風速などをまとめて気象要素という。【まちがえやすい点】ほかの選択肢（気象要素には気温だけがふくまれる／気象要素は天気の判断には全く使われない）とのちがいをおさえておこう。"},
  {id:"ear133", cat:"地学", sub:"環境と資源", q:"地球規模での資源とエネルギーについての説明として正しいものはどれか。", choices:["限りある資源を大切に使うことが求められている","資源は無限にあるため大切に使う必要はない","エネルギー資源の利用に環境への影響はほとんど関係しない","資源の節約は個人の生活には全く関係のない話である"], diff:"標準", a:0, e:"【解説】鉱物資源やエネルギー資源には限りがあるため、大切に使うことが求められている。【まちがえやすい点】ほかの選択肢（資源は無限にあるため大切に使う必要はない／エネルギー資源の利用に環境への影響は全く関係…）とのちがいをおさえておこう。"},
  {id:"ear135", cat:"地学", sub:"地球の姿", q:"地球の形についての説明として正しいものはどれか。", choices:["地球はほぼ球形をしていると考えられている","地球は完全な立方体をしている","地球は真っ平らな板のような形をしている","地球の形は毎日大きく変化している"], diff:"基礎", a:0, e:"【解説】地球は実際にはわずかにつぶれた球形(回転楕円体)に近い形をしていると考えられている。【まちがえやすい点】ほかの選択肢（地球は完全な立方体をしている／地球は真っ平らな板のような形をしている）とのちがいをおさえておこう。"},
  {id:"ear137", cat:"地学", sub:"地球の姿", q:"時差についての説明として正しいものはどれか。", choices:["地域ごとに時刻がずれることを時差という","時差は緯度のちがいだけで生じる","時差は地球の自転とは全く関係がない","世界中どこでもほぼ同じ時刻が使われている"], diff:"基礎", a:0, e:"【ことばの意味】「自転」＝地球が1日に1回、自分で回ること【解説】経度のちがいと地球の自転により、地域ごとに時刻がずれる現象を時差という。【まちがえやすい点】ほかの選択肢（時差は緯度のちがいだけで生じる／時差は地球の自転とは全く関係がない）とのちがいをおさえておこう。"},
  {id:"ear139", cat:"地学", sub:"地震", q:"津波についての説明として正しいものはどれか。", choices:["津波は主に海底で起こる地震などによって発生することがある","津波は風によってのみ発生する現象である","津波は海岸にはほとんど影響をあたえない","津波はすべて同じ高さでやってくる"], diff:"標準", a:0, e:"【解説】津波は主に海底で起こる地震などによる海水の急激な変動によって発生することがある。【まちがえやすい点】ほかの選択肢（津波は風によってのみ発生する現象である／津波は海岸には全く影響をあたえない）とのちがいをおさえておこう。"},
  {id:"ear141", cat:"地学", sub:"水と地形", q:"氷河についての説明として正しいものはどれか。", choices:["氷河は長い年月をかけて積もった雪が氷になり","氷河は一瞬で形成される","氷河は熱帯地域にしか存在しない","氷河は地形にはほとんど影響をあたえない"], diff:"標準", a:0, e:"【ことばの意味】「重力」＝地球が物体を引っぱる力【解説】氷河は長い年月をかけて積もった雪が氷になり、重力によってゆっくりと流れ下る氷のかたまりである。【まちがえやすい点】ほかの選択肢（氷河は一瞬で形成される／氷河は熱帯地域にしか存在しない）とのちがいをおさえておこう。"},
  {id:"ear143", cat:"地学", sub:"海洋と気候", q:"深海についての説明として正しいものはどれか。", choices:["深海には特殊な環境に適応した生物が生息していることが知られている","深海には全く生物は生息していないと考えられている","深海は光が十分に届く明るい環境と考えられている","深海の水温は常に高温と考えられている"], diff:"基礎", a:0, e:"【ことばの意味】「水圧」＝水が物体を押す力。深いほど大きい【解説】深海には水圧や暗さなど特殊な環境に適応した生物が生息していることが知られている。【まちがえやすい点】ほかの選択肢（深海には全く生物は生息していない／深海は光が十分に届く明るい環境である）とのちがいをおさえておこう。"},
  {id:"ear145", cat:"地学", sub:"天気の変化", q:"前線の記号についての説明として正しいものはどれか。", choices:["寒冷前線・温暖前線・停滞前線・閉塞前線はそれぞれ異なる記号で表されることが多い","ほとんどの前線はほぼ同じ記号で表されるとされている","前線の記号には意味は条件が変わっても生じないと考えられている","前線の記号は天気予報には使われないと考えられている"], diff:"基礎", a:0, e:"【ことばの意味】「前線」＝性質のちがう空気のかたまりがぶつかる境目【解説】前線の種類によって天気図上の記号が異なっており、種類を区別できるようになっている。【まちがえやすい点】ほかの選択肢（すべての前線は全く同じ記号で表される／前線の記号には意味は全くない）とのちがいをおさえておこう。"},
  {id:"ear147", cat:"地学", sub:"天体と宇宙", q:"太陽の南中時刻についての説明として正しいものはどれか。", choices:["太陽が真南にきたときの時刻を南中時刻という","南中時刻はどこでもほぼ同じ時刻になる","南中時刻は太陽が最も低くなる時刻を指す","南中時刻は季節に関係なく毎日ほぼ同じ時刻である"], diff:"標準", a:0, e:"【解説】太陽が真南にきて最も高くなったときの時刻を南中時刻という。【まちがえやすい点】ほかの選択肢（南中時刻はどこでも全く同じ時刻になる／南中時刻は太陽が最も低くなる時刻を指す）とのちがいをおさえておこう。"},
  {id:"ear149", cat:"地学", sub:"天気の変化", q:"気象現象のスケールについての説明として正しいものはどれか。", choices:["台風のような大規模な現象から","ほとんどの気象現象は同じ大きさで起こる","気象現象には規模というものは存在しない","竜巻は台風よりも常に大きな規模の現象である"], diff:"基礎", a:0, e:"【解説】気象現象には台風のような大規模なものから、竜巻のような比較的小規模なものまでさまざまな規模がある。【まちがえやすい点】ほかの選択肢（すべての気象現象は同じ大きさで起こる／気象現象には規模というものは存在しない）とのちがいをおさえておこう。"},
  {id:"ear151", cat:"地学", sub:"地球環境", q:"大気汚染物質についての説明として正しいものはどれか。", choices:["工場や自動車の排出ガスには大気汚染の原因となる物質がふくまれることがある","大気汚染物質は健康にはほとんど影響をあたえない","大気汚染は現在では全く問題になっていないと考えられている","大気汚染物質はすべて自然由来のものと考えられている"], diff:"標準", a:0, e:"【解説】工場や自動車の排出ガスには、大気汚染の原因となる物質がふくまれることがある。【まちがえやすい点】ほかの選択肢（大気汚染物質は健康には全く影響をあたえない／大気汚染は現在では全く問題になっていない）とのちがいをおさえておこう。"},
  {id:"ear153", cat:"地学", sub:"天気の変化", q:"気象データの活用についての説明として正しいものはどれか。", choices:["過去の気象データは将来の気象傾向を分析するのに役立てられることがある","気象データは天気予報以外には現在の生活では使われていない","気象データの記録には結果を判断する材料にならない","気象データはすべて同じ場所で同じ値になるとされている"], diff:"基礎", a:0, e:"【解説】過去の気象データは天気予報だけでなく、気候の傾向を分析する研究などにも活用されている。【まちがえやすい点】ほかの選択肢（気象データは天気予報以外には全く利用されてい…／気象データの記録には全く意味がない）とのちがいをおさえておこう。"},
  {id:"ear155", cat:"地学", sub:"天気の変化", q:"台風の名前や番号についての説明として正しいものはどれか。", choices:["台風には発生順に番号がつけられることが多い","台風には名前や番号は全くつけられない","台風の番号は毎年ほとんど変わらない","台風には天気図の記号としての名前しかない"], diff:"基礎", a:0, e:"【解説】日本では、その年に発生した台風に発生順の番号がつけられることが多い。【まちがえやすい点】ほかの選択肢（台風には名前や番号は全くつけられない／台風の番号は毎年全く変わらない）とのちがいをおさえておこう。"},
  {id:"ear157", cat:"地学", sub:"防災", q:"気象警報・注意報についての説明として正しいものはどれか。", choices:["大雨や暴風などによる危険が予想されるとき、気象庁などから警報や注意報が発表されることがある","警報や注意報は天気とはほとんど関係がない情報である","警報や注意報が出ても行動を変える必要はほとんどない","警報や注意報はすべて同じ内容である"], diff:"基礎", a:0, e:"【ことばの意味】「注意報」＝災害が起こるおそれがあるときに呼びかける情報。「警報」＝重大な災害が起こるおそれが大きいときに呼びかける、注意報より強い情報。／【いつ出される？】大雨・暴風・大雪・洪水などによって被害が予想されるときに、気象庁から発表されます。内容によって「大雨警報」「暴風注意報」など、災害の種類ごとに分かれています。／【行動】警報や注意報が出たら、テレビやスマートフォンで情報を確認し、早めの安全確保を心がけることが大切です。"},
  {id:"ear159", cat:"地学", sub:"海洋と気候", q:"気候帯についての説明として正しいものはどれか。", choices:["地球上には熱帯・温帯・寒帯などいくつかの気候帯があるとされる","地球上のどこでもほぼ同じ気候と考えられている","気候帯という考え方は自然界には存在しないとされる","気候帯は緯度には全く関係なく決まるとされている"], diff:"基礎", a:0, e:"【解説】地球上には緯度などに応じて、熱帯・温帯・寒帯などいくつかの気候帯があるとされる。【まちがえやすい点】ほかの選択肢（地球上のどこでも全く同じ気候である／気候帯という考え方は存在しない）とのちがいをおさえておこう。"},
  {id:"ear161", cat:"地学", sub:"火山と火成岩", q:"火山ガスについての説明として正しいものはどれか。", choices:["火山ガスには水蒸気や二酸化炭素などがふくまれることが多い","火山ガスには気体は全くふくまれていない","火山ガスは人体にほとんど影響をあたえない","火山ガスは火山活動とは全く関係のない気体である"], diff:"標準", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと【解説】火山ガスには水蒸気や二酸化炭素、二酸化硫黄などの気体がふくまれることが多い。【まちがえやすい点】ほかの選択肢（火山ガスには気体は全くふくまれていない／火山ガスは人体に全く影響をあたえない）とのちがいをおさえておこう。"},
  {id:"ear163", cat:"地学", sub:"地球環境", q:"環境保全のための国際的な取り組みについての説明として正しいものはどれか。", choices:["地球温暖化など地球規模の環境問題については、国どうしが協力する国際的な取り組みが行われることがある","環境問題は1つの国だけで完全に解決できる問題である","環境保全に関する国際的な取り組みはほとんど行われていない","環境問題の解決に国際協力はほとんど不要である"], diff:"基礎", a:0, e:"【ことばの意味】「地球温暖化」＝二酸化炭素などの温室効果ガスの増加によって、地球全体の気温が上がっていく現象。／【なぜ国際協力が必要？】温暖化やオゾン層破壊などの環境問題は、国境をこえて地球全体に影響をおよぼします。1つの国だけでは解決できないため、パリ協定のように、多くの国が協力して温室効果ガスの削減目標を決めるといった国際的な取り組みが行われています。／【まちがえやすい点】各国それぞれが自分の国だけの努力をしても、全体としての効果は限られてしまいます。"},
  {id:"ear165", cat:"地学", sub:"天体と宇宙", q:"天体望遠鏡の発明と天文学の発展についての説明として正しいものはどれか。", choices:["より詳しく天体を観測できるようになったと考えられている","望遠鏡が発明されても天文学の発展には全く影響がなかった","天体観測には昔から全く進歩がない","望遠鏡は天体観測には利用されていない"], diff:"標準", a:0, e:"【解説】望遠鏡の発明により、それまで見えなかった天体の詳しいようすを観測できるようになったと考えられている。【まちがえやすい点】ほかの選択肢（望遠鏡が発明されても天文学の発展には全く影響…／天体観測には昔から全く進歩がない）とのちがいをおさえておこう。"},
  {id:"ear167", cat:"地学", sub:"天体と宇宙", q:"オーロラについての説明として正しいものはどれか。", choices:["オーロラは主に高緯度地域で見られることが多い自然現象である","オーロラはどの地域でも毎日同じように見られる","オーロラは地震が原因で発生する現象である","オーロラは太陽とは全く関係のない現象である"], diff:"基礎", a:0, e:"【解説】オーロラは主に高緯度地域で見られる、太陽からの粒子と大気の反応によって光る自然現象である。【まちがえやすい点】ほかの選択肢（オーロラはどの地域でも毎日同じように見られる／オーロラは地震が原因で発生する現象である）とのちがいをおさえておこう。"},
  {id:"ear169", cat:"地学", sub:"火山と火成岩", q:"マグマの発生についての説明として正しいものはどれか。", choices:["地下深くの岩石が高温になったり","マグマは地表で冷えた岩石がそのまま存在しているものである","マグマの発生には地下の温度はほとんど関係がない","マグマはほとんどの場所で同じように発生する"], diff:"基礎", a:0, e:"【ことばの意味】「圧力」＝面積あたりにかかる力（力÷面積）【解説】地下深くの岩石が高温になったり、圧力などの条件が変わったりすることで、マグマが発生すると考えられている。【まちがえやすい点】ほかの選択肢（マグマは地表で冷えた岩石がそのまま存在してい…／マグマの発生には地下の温度は全く関係ない）とのちがいをおさえておこう。"},
  {id:"ear171", cat:"地学", sub:"地層と堆積岩", q:"地層の観察についての説明として正しいものはどれか。", choices:["露頭を観察することで、地層の重なり方や粒の大きさ・色のちがいなどを調べることができる","地層の観察にはあまり意味がない","地層はどこでもほぼ同じ厚さで重なっている","地層の観察には道具はいっさい使わない"], diff:"基礎", a:0, e:"【ことばの意味】「露頭（ろとう）」＝がけや切り通しなどで、地層が地表に直接あらわれている場所。／【観察でわかること】露頭を観察すると、地層の重なり方（下が古く上が新しい）、それぞれの層の厚さ、つぶの大きさや色のちがいなどから、その土地の過去のようすを推測できます。／【使う道具】ルーペ・クリノメーター（地層の傾きを測る道具）・スケールなどを使って観察・記録します。厚さは場所によって変化します。"},
  {id:"ear173", cat:"地学", sub:"天体と宇宙", q:"太陽系の探査についての説明として正しいものはどれか。", choices:["探査機を使って、地球以外の惑星や天体の観測が行われてきた","太陽系の探査は一度も行われたことがない","探査機は天体に関する情報を全く得ることができない","太陽系の探査にはあまり意味がない"], diff:"基礎", a:0, e:"【ことばの意味】「惑星」＝太陽のまわりを回り、太陽の光を反射して光る星【解説】これまでに探査機を使って、火星や木星などさまざまな惑星や天体の観測が行われてきた。【まちがえやすい点】ほかの選択肢（太陽系の探査は一度も行われたことがない／探査機は天体に関する情報を全く得ることができ…）とのちがいをおさえておこう。"},
  {id:"ear175", cat:"地学", sub:"地震", q:"地震の記録についての説明として正しいものはどれか。", choices:["地震計を使うと、地震の揺れの大きさや時刻を記録することができる","地震の記録には結果を判断する材料にならない","地震はどこでも全く記録されていないと考えられている","地震計は温度を測定するための道具と考えられている"], diff:"基礎", a:0, e:"【ことばの意味】「振幅」＝ふるえの大きさ。大きいほど大きな音【解説】地震計を使うことで、地震の揺れの大きさ(振幅)や発生時刻などを記録することができる。【まちがえやすい点】ほかの選択肢（地震の記録には全く意味がない／地震はどこでも全く記録されていない）とのちがいをおさえておこう。"},
  {id:"ear177", cat:"地学", sub:"防災", q:"台風や大雨に関する情報の活用についての説明として正しいものはどれか。", choices:["台風や大雨に関する気象情報を活用することで、早めの避難や備えに役立てることができる","気象情報を見ても行動を変える必要はほとんどない","台風情報は信頼できないため、参考にする必要はほとんどない","気象情報の活用は防災にはほとんど関係がない"], diff:"基礎", a:0, e:"【気象情報の役割】台風の進路予想や大雨の警報などの気象情報は、気象庁が観測データをもとに発表しています。これらの情報を早めに確認することで、避難の準備や外出の見合わせなど、命を守るための行動につなげることができます。／【まちがえやすい点】気象情報の予測には多少のずれがあることもありますが、日々の観測技術の向上によって精度は高まっています。「信頼できない」と決めつけるのは危険です。"},
  {id:"ear179", cat:"地学", sub:"地球の姿", q:"地学分野のまとめとして正しいものはどれか。", choices:["地震・火山・天気・天体などの地学的な現象には、科学的な規則性やしくみがあると考えられているものが多い","地学の現象はすべて偶然にしか説明できない","地球や天体の観測・研究にはあまり意味がない","地学の知識は日常生活にはあまり役立たない"], diff:"標準", a:0, e:"【地学の考え方】地震・火山・天気・天体など、一見予測できないように見える自然現象にも、プレートの動き・大気の流れ・天体の運動などの科学的な法則やしくみがあります。観測や研究を積み重ねることで、これらの規則性が少しずつ明らかになっています。／【日常生活との関わり】天気予報・地震への備え・季節の変化の理解など、地学の知識は防災や暮らしに直接役立ちます。"},
  {id:"phy190", cat:"物理", sub:"静電気", q:"静電気の発生原因として正しいものはどれか。", choices:["物体をこすると電子が移動する","温度が上昇する","湿度が低くなる","電気は全く流れない"], diff:"基礎", a:0, e:"【解説】物体をこすると電子が偏って移動し、静電気が発生する。【まちがえやすい点】ほかの選択肢（温度が上昇する／湿度が低くなる）とのちがいをおさえておこう。"},
  {id:"phy192", cat:"物理", sub:"オームの法則", q:"オームの法則についての説明として正しいものはどれか。", choices:["電圧は電流と抵抗の積に比例する","電流は電圧に反比例する","抵抗は電流に反比例する","電圧と電流は無関係である"], diff:"基礎", a:0, e:"【ことばの意味】「電圧」＝電流を押し流そうとする力の大きさ（単位V）／「電流」＝電気の流れの量（単位A）【解説】オームの法則: V=IR。電圧は電流と抵抗の積で表される。【まちがえやすい点】ほかの選択肢（電流は電圧に反比例する／抵抗は電流に反比例する）とのちがいをおさえておこう。"},
  {id:"phy194", cat:"物理", sub:"電磁誘導", q:"電磁誘導についての説明として正しいものはどれか。", choices:["磁場の変化によって電流が発生する","電流の変化は磁場に影響しない","磁場と電流はほとんど関係がない","誘導電流には方向がない"], diff:"標準", a:0, e:"【ことばの意味】「電流」＝電気の流れの量（単位A）／「電磁誘導」＝磁石を動かすとコイルに電流が生まれる現象【解説】磁場が変化するとコイルに電流が生じる現象を電磁誘導という。【まちがえやすい点】ほかの選択肢（電流の変化は磁場に影響しない／磁場と電流は全く関係ない）とのちがいをおさえておこう。"},
  {id:"phy196", cat:"物理", sub:"発電", q:"火力発電の仕組みについての説明として正しいものはどれか。", choices:["燃料の燃焼熱で蒸気を発生させタービンを回す","太陽光を直接電気に変える","風のエネルギーを利用する","重力ポテンシャルエネルギーを利用する"], diff:"標準", a:0, e:"【ことばの意味】「燃焼」＝物質が酸素と激しく結びついて光と熱を出すこと【解説】火力発電は燃料の燃焼による熱でお湯を沸騰させ、蒸気でタービンを回して発電する。【まちがえやすい点】ほかの選択肢（太陽光を直接電気に変える／風のエネルギーを利用する）とのちがいをおさえておこう。"},
  {id:"phy200", cat:"物理", sub:"エネルギー保存則", q:"エネルギー保存則についての説明として正しいものはどれか。", choices:["エネルギーは形を変えたり移動したりするが、その総量は変わらない","エネルギーは消滅することもある","エネルギーは無から生じることがある","異なる形態のエネルギーはたがいに変換できない"], diff:"基礎", a:0, e:"【ことばの意味】「エネルギー保存の法則」＝エネルギーはいろいろな形（運動・位置・熱・電気・光など）に変わったり、他の場所へ移動したりするが、全体の量は変わらないという法則。／【身近な例】振り子は位置エネルギーと運動エネルギーが移り変わりながら振れ続けます（摩擦がなければ総量は一定）。／【まちがえやすい点】エネルギーは何もないところから急に生まれたり、跡形もなく消えてなくなったりすることはありません。ちがう種類のエネルギーどうしも変換できます（電気→光、化学→熱など）。"},
  {id:"phy202", cat:"物理", sub:"音速", q:"音速についての説明として正しいものはどれか。", choices:["音速は媒質の種類により異なる","音速は常に秒速340mである","水中の音速は空気中と同じ","固体を通る音速は空気中より遅い"], diff:"基礎", a:0, e:"【解説】音速は媒質により異なり、気体<液体<固体の順で速くなる。【まちがえやすい点】ほかの選択肢（音速は常に秒速340mである／水中の音速は空気中と同じ）とのちがいをおさえておこう。"},
  {id:"phy204", cat:"物理", sub:"レンズ", q:"凸レンズについての説明として正しいものはどれか。", choices:["焦点距離より遠い物体からの光は実像を作る","凹レンズと反対に常に虚像を作る","ほとんどの光線を一点に集める","光を発散させる"], diff:"基礎", a:0, e:"【ことばの意味】「焦点」＝レンズを通った平行な光が1点に集まる場所／「実像」＝実際に光が集まってできる像。スクリーンに映せる【解説】凸レンズは焦点距離より遠い物体の光線を集め、焦点の反対側に実像を作る。【まちがえやすい点】ほかの選択肢（凹レンズと反対に常に虚像を作る／全ての光線を一点に集める）とのちがいをおさえておこう。"},
  {id:"phy206", cat:"物理", sub:"プリズム", q:"プリズムによる光の分散についての説明として正しいものはどれか。", choices:["異なる波長の光は異なる角度で屈折する","ほとんどの色の光は同じ角度で屈折する","プリズムは光を吸収する","分散によって新しい光が発生する"], diff:"基礎", a:0, e:"【ことばの意味】「屈折」＝光や音が別の物質に入るとき、進む向きが曲がること【解説】プリズムを通すと、波長の違いにより光は異なる角度で屈折し、分散して虹色に分かれる。【まちがえやすい点】ほかの選択肢（すべての色の光は同じ角度で屈折する／プリズムは光を吸収する）とのちがいをおさえておこう。"},
  {id:"phy210", cat:"物理", sub:"仕事とエネルギー", q:"仕事についての説明として正しいものはどれか。", choices:["仕事は力と力の方向への変位の積である","仕事は力の大きさだけで決まる","仕事と熱は無関係である","仕事をすればエネルギーが減少する"], diff:"基礎", a:0, e:"【ことばの意味】「仕事」＝力×動かした距離。単位はJ（ジュール）【解説】仕事W=F×sで表され、力と変位が同方向のときのみ仕事は正となる。【まちがえやすい点】ほかの選択肢（仕事は力の大きさだけで決まる／仕事と熱は無関係である）とのちがいをおさえておこう。"},
  {id:"phy216", cat:"物理", sub:"簡単機械", q:"滑車についての説明として正しいものはどれか。", choices:["動滑車を使うと必要な力は半分になるが、引くロープの長さは2倍になる","動滑車を使うと力に変化がない","滑車を増やすほど効率が上がる","滑車は仕事を減らす"], diff:"基礎", a:0, e:"【ことばの意味】「動滑車」＝荷物と一緒に上下に動く滑車。／【なぜ力が半分？】荷物の重さを2本のロープで支える形になるので、1本あたりの力は半分になります。／【引く距離は2倍】荷物を1m持ち上げるには、ロープを2m引く必要があります。／【仕事の原理】「力×距離」の値（仕事の大きさ）は道具を使っても変わりません。動滑車を増やしても、必要な仕事の総量自体が減るわけではなく、力と距離の配分が変わるだけです。"},
  {id:"phy218", cat:"物理", sub:"圧力", q:"圧力についての説明として正しいものはどれか。", choices:["圧力は面積あたりの力である","圧力と力は同じ意味","面積が大きいほど圧力は大きくなる","圧力は液体にのみ存在する"], diff:"基礎", a:0, e:"【ことばの意味】「圧力」＝面積あたりにかかる力（力÷面積）【解説】圧力P=F/Aで表され、同じ力でも面積が小さいほど圧力は大きくなる。【まちがえやすい点】ほかの選択肢（圧力と力は同じ意味／面積が大きいほど圧力は大きくなる）とのちがいをおさえておこう。"},
  {id:"phy220", cat:"物理", sub:"密度", q:"密度についての説明として正しいものはどれか。", choices:["密度は単位体積あたりの質量である","密度は質量だけで決まる","密度は温度に関わらず一定","水の密度は1kg/m³である"], diff:"基礎", a:0, e:"【解説】密度ρ=m/Vで表される。常温での水の密度は約1000kg/m³（1g/cm³）。【まちがえやすい点】ほかの選択肢（密度は質量だけで決まる／密度は温度に関わらず一定）とのちがいをおさえておこう。"},
  {id:"phy222", cat:"物理", sub:"気圧", q:"気圧についての説明として正しいものはどれか。", choices:["気圧は高度が高いほど小さくなる","気圧は一定不変である","気圧は天気に影響しない","海抜0mでの気圧は約101300Paである"], diff:"標準", a:0, e:"【ことばの意味】「重さ」＝物体にはたらく重力の大きさ（場所によって変わる）【解説】気圧は大気の重さによって生じ、高度が高いほど小さくなる。海面での標準気圧は約101300Pa。【まちがえやすい点】ほかの選択肢（気圧は一定不変である／気圧は天気に影響しない）とのちがいをおさえておこう。"},
  {id:"che68", cat:"化学", sub:"酸と塩基", q:"酸についての説明として正しいものはどれか。", choices:["酸は水素イオンを放出する物質である","酸は塩基と反応して中和反応を起こす","酸のpHは7より小さい","酸は金属と反応して水素ガスを発生させることがある"], diff:"基礎", a:0, e:"【ことばの意味】「イオン」＝原子が電子を失ったり受け取ったりして電気を帯びたもの／「中和」＝酸とアルカリが反応して塩と水ができること【解説】酸は水素イオン(H+)を放出する物質で、塩基と反応して塩と水を作る中和反応を起こす。【まちがえやすい点】ほかの選択肢（酸は塩基と反応して中和反応を起こす／酸のpHは7より小さい）とのちがいをおさえておこう。"},
  {id:"che70", cat:"化学", sub:"pH", q:"pHについての説明として正しいものはどれか。", choices:["pHは水素イオン濃度を示す指標である","pHが小さいほど酸性が強い","pHが大きいほど塩基性が強い","pH7は中性である"], diff:"基礎", a:0, e:"【ことばの意味】「酸性」＝pHが7より小さい性質。青リトマスを赤にする／「中性」＝pHが7の性質。リトマス紙の色が変わらない【解説】pH = -log[H+]で、pHが小さいほど酸性、大きいほど塩基性である。中性はpH7。【まちがえやすい点】ほかの選択肢（pHが小さいほど酸性が強い／pHが大きいほど塩基性が強い）とのちがいをおさえておこう。"},
  {id:"che72", cat:"化学", sub:"塩", q:"塩についての説明として正しいものはどれか。", choices:["塩は酸と塩基の中和反応で生じる化合物である","塩はつねに塩辛い味がする","塩はつねに水に溶ける","塩は中性である"], diff:"基礎", a:0, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】塩は酸と塩基の反応生成物で、必ずしも水に溶けたり塩辛い味があるわけではない。【まちがえやすい点】ほかの選択肢（塩は必ず塩辛い味がする／塩は必ず水に溶ける）とのちがいをおさえておこう。"},
  {id:"che74", cat:"化学", sub:"還元", q:"還元についての説明として正しいものはどれか。", choices:["物質が酸素を失うか","還元は酸素がなくても起こる","還元反応では物質が酸化される","還元は酸化の逆プロセスである"], diff:"基礎", a:0, e:"【ことばの意味】「酸化」＝物質が酸素と結びつくこと／「還元」＝物質が酸素をうばわれること【解説】還元：物質が酸素を失うか、電子を得る化学変化である。酸化と還元は対になる。【まちがえやすい点】ほかの選択肢（還元は酸素がなくても起こる／還元反応では物質が酸化される）とのちがいをおさえておこう。"},
  {id:"che78", cat:"化学", sub:"電気分解", q:"電気分解についての説明として正しいものはどれか。", choices:["電気エネルギーによって化合物を分解する反応である","電気分解では電気化学的なセル内で酸化還元が起こる","電気分解には電源が必要である","電気分解によって新しい物質が生成される"], diff:"基礎", a:0, e:"【ことばの意味】「化合」＝2種類以上の物質が結びついて別の物質になること／「分解」＝1つの物質が2つ以上の物質に分かれること【解説】電気分解：電源から供給される電気エネルギーで化合物が分解される反応。【まちがえやすい点】ほかの選択肢（電気分解では電気化学的なセル内で酸化還元が起…／電気分解には電源が必要である）とのちがいをおさえておこう。"},
  {id:"che80", cat:"化学", sub:"有機化合物", q:"有機化合物についての説明として正しいものはどれか。", choices:["有機化合物は炭素を含む化合物である","有機化合物は全て生物由来である","有機化合物は無機化合物より燃えにくい","有機化合物は水につねに溶ける"], diff:"基礎", a:0, e:"【ことばの意味】「化合」＝2種類以上の物質が結びついて別の物質になること【解説】有機化合物：炭素を含む化合物。自然界と人工合成の両方が存在する。【まちがえやすい点】ほかの選択肢（有機化合物は全て生物由来である／有機化合物は無機化合物より燃えにくい）とのちがいをおさえておこう。"},
  {id:"bio181", cat:"生物", sub:"細胞", q:"細胞の核のはたらきとして正しいものはどれか。", choices:["遺伝情報をもっていて","光を使って養分をつくる","細胞の形をかたく保つ","水分をためておく"], diff:"基礎", a:0, e:"【ことばの意味】「核」＝細胞の中にある丸いつぶで、生物の設計図（遺伝情報）が入っている場所。酢酸カーミン液や酢酸オルセイン液で赤く染まります。／【何が入っている？】核の中には染色体があり、その中にDNAという遺伝情報をもつ物質が入っています。この情報が「どんな体をつくるか」を決めています。／【他の選択肢】光で養分をつくるのは葉緑体。細胞の形をかたく保つのは細胞壁（植物のみ）。水分をためるのは液胞（植物で発達）。／【ポイント】核は植物の細胞にも動物の細胞にもあります。"},
  {id:"bio183", cat:"生物", sub:"葉緑体", q:"葉緑体についての説明として正しいものはどれか。", choices:["葉緑体は光合成を行う細胞小器官である","葉緑体はクロロフィルを含む","葉緑体は独自のDNAを持つ","葉緑体は二重膜に囲まれている"], diff:"基礎", a:0, e:"【ことばの意味】「葉緑体」＝植物の細胞にある、光合成をする緑色の粒／「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】葉緑体：光合成を行う。クロロフィル・独自DNA・二重膜を持つ。【まちがえやすい点】ほかの選択肢（葉緑体はクロロフィルを含む／葉緑体は独自のDNAを持つ）とのちがいをおさえておこう。"},
  {id:"bio193", cat:"生物", sub:"ダーウィンの進化論", q:"ダーウィンの進化論についての説明として正しいものはどれか。", choices:["進化は自然選択により起こると述べている","進化は個体差と環境への適応を基としている","進化は獲得形質の遺伝にはよらない","進化は長い年月をかけて起こる"], diff:"基礎", a:0, e:"【解説】ダーウィン進化論：自然選択説。個体差・環境適応により進化が起こる。【まちがえやすい点】ほかの選択肢（進化は個体差と環境への適応を基としている／進化は獲得形質の遺伝にはよらない）とのちがいをおさえておこう。"},
  {id:"bio195", cat:"生物", sub:"生態系", q:"生態系についての説明として正しいものはどれか。", choices:["生態系は生物と環境がお互いに影響しあう関係全体である","生態系は生産者・消費者・分解者から構成される","生態系ではエネルギーと物質が循環する","生態系の規模は様々と考えられている"], diff:"標準", a:0, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること／「生産者」＝光合成で自分の養分をつくる生物（植物など）【解説】生態系：生物と無機環境の相互作用。生産者・消費者・分解者で構成。【まちがえやすい点】ほかの選択肢（生態系は生産者・消費者・分解者から構成される／生態系ではエネルギーと物質が循環する）とのちがいをおさえておこう。"},
  {id:"bio197", cat:"生物", sub:"栄養段階", q:"栄養段階についての説明として正しいものはどれか。", choices:["栄養段階は食物連鎖における位置を示す","第1段階は生産者(植物)である","第2段階は一次消費者(草食動物)である","栄養段階が高いほどエネルギーが多い"], diff:"基礎", a:0, e:"【ことばの意味】「生産者」＝光合成で自分の養分をつくる生物（植物など）／「消費者」＝ほかの生物を食べて養分を得る生物（動物）【解説】栄養段階：①生産者②一次消費者③二次消費者④三次消費者。上位ほどエネルギー減少。【まちがえやすい点】ほかの選択肢（第1段階は生産者(植物)である／第2段階は一次消費者(草食動物)である）とのちがいをおさえておこう。"},
  {id:"bio199", cat:"生物", sub:"炭素循環", q:"炭素循環についての説明として正しいものはどれか。", choices:["炭素循環は大気中のCO₂が生物に利用される流れである","炭素循環は光合成と呼吸で駆動される","光合成によりCO₂が固定される","呼吸と分解によりCO₂が放出される"], diff:"基礎", a:0, e:"【ことばの意味】「分解」＝1つの物質が2つ以上の物質に分かれること／「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】炭素循環：光合成でCO₂固定→呼吸・分解でCO₂放出。CO₂濃度が大気で均衡。【まちがえやすい点】ほかの選択肢（炭素循環は光合成と呼吸で駆動される／光合成によりCO₂が固定される）とのちがいをおさえておこう。"},
  {id:"bio203", cat:"生物", sub:"絶滅危惧種", q:"絶滅危惧種についての説明として正しいものはどれか。", choices:["絶滅危惧種は絶滅の危険性が高い種である","絶滅危惧種の原因は環境破壊や乱獲である","絶滅危惧種は保護の対象である","絶滅危惧種のレッドリストが作成されている"], diff:"基礎", a:0, e:"【解説】絶滅危惧種：絶滅の危機が高い種。環境破壊・乱獲が主原因。保護が必要。【まちがえやすい点】ほかの選択肢（絶滅危惧種の原因は環境破壊や乱獲である／絶滅危惧種は保護の対象である）とのちがいをおさえておこう。"},
  {id:"bio205", cat:"生物", sub:"動物のからだ", q:"体に入ってきた病原体（細菌やウイルス）を排除するしくみを何というか。", choices:["消化","免疫","呼吸","排出"], diff:"基礎", a:1, e:"【ことばの意味】「免疫」＝体の中に入ってきた病原体などの異物を見つけて、やっつけたり追い出したりするしくみのこと。／【どうやって守る？】まず皮膚や粘膜が物理的にブロックします。それを突破されると白血球が病原体を食べたり、抗体という物質をつくって攻撃したりします。／【他の選択肢】消化＝食べ物を吸収できる形に分解すること。呼吸＝酸素を取り入れて二酸化炭素を出すこと。排出＝いらなくなったものを体の外に出すこと。／【ワクチンとの関係】ワクチンは弱めた病原体を入れて、あらかじめ免疫のしくみを準備させておく方法です。"},
  {id:"bio207", cat:"生物", sub:"ホルモン", q:"ホルモンについての説明として正しいものはどれか。", choices:["ホルモンは内分泌腺から分泌される物質である","ホルモンは体の成長・発育・代謝を調節する","ホルモンは特定の標的細胞に作用する","ホルモンの例にインスリン・テストステロンがある"], diff:"基礎", a:0, e:"【解説】ホルモン：内分泌腺が分泌する生理活性物質。成長・代謝を調節。【まちがえやすい点】ほかの選択肢（ホルモンは体の成長・発育・代謝を調節する／ホルモンは特定の標的細胞に作用する）とのちがいをおさえておこう。"},
  {id:"ear180", cat:"地学", sub:"地球の構造", q:"地球の内部構造についての説明として正しいものはどれか。", choices:["地球は地殻・マントル・核から構成される","地殻は最も厚い層である","マントルはマグマの源である","核は鉄とニッケルから成る"], diff:"基礎", a:0, e:"【ことばの意味】「対流」＝あたたまった液体や気体が動いて熱を運ぶこと【解説】地球構造：地殻（薄）→マントル（対流）→外核→内核。温度上昇。【まちがえやすい点】ほかの選択肢（地殻は最も厚い層である／マントルはマグマの源である）とのちがいをおさえておこう。"},
  {id:"ear182", cat:"地学", sub:"火山", q:"火山活動についての説明として正しいものはどれか。", choices:["火山活動は地表での火成作用である","火山活動により新しい地殻が形成される","火山活動は地震活動と関連することがある","火山帯は環太平洋火山帯などの場所に分布する"], diff:"基礎", a:0, e:"【ことばの意味】「プレート」＝地球の表面をおおう、いくつかに分かれた岩の板【解説】火山：地下のマグマが地表に噴出する現象。プレート境界に集中。【まちがえやすい点】ほかの選択肢（火山活動により新しい地殻が形成される／火山活動は地震活動と関連することがある）とのちがいをおさえておこう。"},
  {id:"ear184", cat:"地学", sub:"地震波", q:"地震波についての説明として正しいものはどれか。", choices:["P波は縦波で、速く伝わり液体中でも伝わる","S波は横波で、液体中は伝わらない","P波とS波の速度差から震源距離を求める","地震波は地球内部の構造を調査する手がかりになる"], diff:"標準", a:0, e:"【ことばの意味】「P波」＝最初に来る速い波。小さくカタカタ揺れる（初期微動）／「S波」＝あとから来る遅い波。大きくユサユサ揺れる（主要動）【解説】地震波：P波(縦波,速い,液体伝播)とS波(横波,遅い,液体不伝播)。【まちがえやすい点】ほかの選択肢（S波は横波で、液体中は伝わらない／P波とS波の速度差から震源距離を求める）とのちがいをおさえておこう。"},
  {id:"ear186", cat:"地学", sub:"地層と岩石", q:"化石とはどのようなものか。", choices:["大昔の生物の体や","岩石が長い時間をかけて丸くなったもの","火山から噴き出したマグマが固まったもの","地層の中にできた鉱物の結晶"], diff:"基礎", a:0, e:"【ことばの意味】「化石」＝大昔の生物の体（骨・貝がら・葉など）や、生活のあと（足あと・巣穴・ふんなど）が地層の中に残ったもの。／【どうやってできる？】生物が死んだあと、すぐに土砂に埋まると腐らずに残ります。その上に地層が積み重なり、長い年月をかけて岩石の中に保存されます。／【何がわかる？】その地層ができた「時代」がわかる化石を示準化石、その場所の「環境」がわかる化石を示相化石といいます。／【まちがえやすい点】丸い石や結晶は生物とは関係ないので化石ではありません。"},
  {id:"ear188", cat:"地学", sub:"大気", q:"大気の層について正しいものはどれか。", choices:["大気は対流圏・成層圏・中気圏・熱圏に分かれる","対流圏は天気が起こる場所である","成層圏はオゾン層を含むによる現象","大気密度は高度とともに減少する"], diff:"基礎", a:0, e:"【ことばの意味】「対流」＝あたたまった液体や気体が動いて熱を運ぶこと【解説】大気層：対流圏(気象)→成層圏(オゾン)→中気圏→熱圏。高度で密度減少。【まちがえやすい点】ほかの選択肢（対流圏は天気が起こる場所である／成層圏はオゾン層を含む）とのちがいをおさえておこう。"},
  {id:"ear190", cat:"地学", sub:"天気", q:"低気圧の中心付近では、空気はどのように動くか。", choices:["まわりから風がふきこみ、中心で上昇気流になる","中心から風がふき出し、中心で下降気流になる","空気はほとんど動かない","中心で空気が真横にだけ流れる"], diff:"標準", a:0, e:"【ことばの意味】「低気圧」＝まわりより気圧（空気が押す力）が低いところ。／【空気の動き】空気は気圧の高いところから低いところへ流れます。だから低気圧の中心にはまわりから風がふきこみます。集まった空気は行き場がなくなって上へ動きます（上昇気流）。／【なぜ雨が降る？】上昇した空気は上空で冷やされ、水蒸気が水てきに変わって雲ができます。だから低気圧が近づくとくもりや雨になりやすいのです。／【高気圧は逆】中心から風がふき出し、上から空気が下りてくる（下降気流）ので雲ができにくく、晴れやすくなります。"},
  {id:"ear192", cat:"地学", sub:"前線", q:"前線についての説明として正しいものはどれか。", choices:["前線は異なる気団の境界である","前線は温暖前線と寒冷前線に分類される","前線に沿って上昇気流が発生する","前線では天気が悪くなることが多い"], diff:"基礎", a:0, e:"【ことばの意味】「前線」＝性質のちがう空気のかたまりがぶつかる境目【解説】前線：異なる気団の境界。温暖・寒冷・閉塞・停滞前線あり。悪天候の原因。【まちがえやすい点】ほかの選択肢（前線は温暖前線と寒冷前線に分類される／前線に沿って上昇気流が発生する）とのちがいをおさえておこう。"},
  {id:"ear194", cat:"地学", sub:"気団", q:"気団についての説明として正しいものはどれか。", choices:["気団は広大な領域で温度・湿度が一様な空気の塊である","気団は発生源により特性が決まるとされている","気団は寒気団と暖気団に分類される","気団の性質が天気に影響すると考えられている"], diff:"標準", a:0, e:"【ことばの意味】「前線」＝性質のちがう空気のかたまりがぶつかる境目【解説】気団：広域で特性が一様な空気塊。発生源で決定。互いに衝突し前線形成。【まちがえやすい点】ほかの選択肢（気団は発生源により特性が決まる／気団は寒気団と暖気団に分類される）とのちがいをおさえておこう。"},
  {id:"ear196", cat:"地学", sub:"海流", q:"海流についての説明として正しいものはどれか。", choices:["海流は風・温度差・塩分差により駆動される","海流は暖流と寒流に分類される","海流は地球規模の水・熱の輸送に関わる","海流は気候に影響する"], diff:"標準", a:0, e:"【ことばの意味】「塩」＝酸とアルカリの中和でできる物質（食塩だけではない）【解説】海流：風・温度・塩分差駆動。暖流と寒流。気候・漁場に影響。【まちがえやすい点】ほかの選択肢（海流は暖流と寒流に分類される／海流は地球規模の水・熱の輸送に関わる）とのちがいをおさえておこう。"},
  {id:"ear198", cat:"地学", sub:"地形", q:"地形についての説明として正しいものはどれか。", choices:["地形は地殻変動と侵食・堆積の作用により形成される","地形は山脈・盆地・平野などで構成される","地形は地質と関連している","地形は人間活動により改変されることがある"], diff:"基礎", a:0, e:"【解説】地形：地殻変動と外部営力の作用で形成。地質と関連。多様な地形あり。【まちがえやすい点】ほかの選択肢（地形は山脈・盆地・平野などで構成される／地形は地質と関連している）とのちがいをおさえておこう。"},
  {id:"ear200", cat:"地学", sub:"堆積", q:"堆積についての説明として正しいものはどれか。", choices:["堆積は侵食された岩屑が堆積する作用である","堆積により堆積岩が形成される","堆積は低地や海底で特に活発である","堆積層は地層を形成する"], diff:"基礎", a:0, e:"【ことばの意味】「堆積岩」＝土砂や生物の死がいが積もって固まった岩石【解説】堆積：運搬された岩屑が静水中に沈積。堆積岩・地層形成。河口・海底など。【まちがえやすい点】ほかの選択肢（堆積により堆積岩が形成される／堆積は低地や海底で特に活発である）とのちがいをおさえておこう。"},
  {id:"ear202", cat:"地学", sub:"地層と岩石", q:"火成岩はどのようにしてできた岩石か。", choices:["マグマが冷えて固まってできた岩石","土砂が積もって押し固められてできた岩石","生物の死がいが積もってできた岩石","岩石が熱や圧力で性質を変えてできた岩石"], diff:"基礎", a:0, e:"【ことばの意味】「マグマ」＝地下にある、岩石がとけてどろどろになったもの。「火成岩」＝そのマグマが冷えて固まった岩石。／【2種類ある】地下深くでゆっくり冷えると結晶が大きく育つ→深成岩（花こう岩など）。地表近くで急に冷えると結晶が育つひまがなく細かい→火山岩（玄武岩など）。／【他の選択肢】土砂が積もって固まった岩石＝堆積岩（れき岩・砂岩・でい岩）。生物の死がいが積もった岩石も堆積岩（石灰岩・チャート）。熱や圧力で性質が変わった岩石＝変成岩（大理石など）。"},
  {id:"ear204", cat:"地学", sub:"変成岩", q:"変成岩についての説明として正しいものはどれか。", choices:["変成岩は既存の岩石が高温・高圧により変成して形成される","変成岩は接触変成と地域変成に分類される","変成岩は結晶質で新しい鉱物が発達することがある","片麻岩や片岩が変成岩の例と考えられている"], diff:"基礎", a:0, e:"【解説】変成岩：既成岩が高温・高圧で鉱物・構造変化。片麻岩・片岩など。【まちがえやすい点】ほかの選択肢（変成岩は接触変成と地域変成に分類される／変成岩は結晶質で新しい鉱物が発達することがあ…）とのちがいをおさえておこう。"},
  {id:"trivia2", cat:"雑学", sub:"科学史", q:"相対性理論を提唱した科学者は誰か。", choices:["ガリレオ・ガリレイ","ニコラウス・コペルニクス","アルベルト・アインシュタイン","イサック・ニュートン"], diff:"基礎", a:2, e:"【解説】アルベルト・アインシュタインは相対性理論を提唱し、物理学に革命をもたらした。【まちがえやすい点】ほかの選択肢（ガリレオ・ガリレイ／ニコラウス・コペルニクス）とのちがいをおさえておこう。"},
  {id:"trivia4", cat:"雑学", sub:"医学", q:"血液型は何種類あるか。", choices:["2種類","4種類","8種類","100種類以上"], diff:"基礎", a:1, e:"【解説】主なABO式では4種類（A型、B型、O型、AB型）。他にRh式などもある。【まちがえやすい点】ほかの選択肢（2種類／8種類）とのちがいをおさえておこう。"},
  {id:"trivia6", cat:"雑学", sub:"生物", q:"植物の光合成により放出されるガスは何か。", choices:["窒素","二酸化炭素","酸素","メタン"], diff:"基礎", a:2, e:"【ことばの意味】「光合成」＝植物が光を使って、二酸化炭素と水からデンプンをつくること【解説】植物の光合成により酸素が放出される。これが地球の酸素の主要な供給源。【まちがえやすい点】ほかの選択肢（窒素／二酸化炭素）とのちがいをおさえておこう。"},
  {id:"trivia8", cat:"雑学", sub:"天文学", q:"地球から太陽までの距離は何kmか。", choices:["約1000万km","約1億km","約10億km","約100億km"], diff:"基礎", a:1, e:"【解説】地球から太陽までの距離は約1億5000万km（1天文単位）。【まちがえやすい点】ほかの選択肢（約1000万km／約10億km）とのちがいをおさえておこう。"},
