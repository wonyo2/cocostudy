  {id:"nhis25", cat:"日本史", sub:"鎌倉・室町", q:"室町幕府3代将軍足利義満が明との間で行った、正式な貿易船と倭寇を区別するための証票を用いた貿易を何というか。", choices:["日宋貿易","南蛮貿易","勘合貿易","朱印船貿易"], a:2, e:"正解は「勘合貿易」です。足利義満は明との国交を開き、正式な貿易船であることを示す勘合という証票を用いて貿易を行いました。「南蛮貿易」は誤りで、これは戦国時代にポルトガル人・スペイン人と行われた貿易です。「朱印船貿易」は誤りで、これは江戸時代初期に幕府の許可を得た商人が東南アジアと行った貿易です。「日宋貿易」は誤りで、これは平安時代末期に平清盛らが行った貿易です。"},
  {id:"nhis27", cat:"日本史", sub:"鎌倉・室町", q:"1467年に始まり、京都を主な戦場として11年間続き、戦国時代のきっかけとなった戦乱を何というか。", choices:["保元の乱","治承・寿永の乱","承久の乱","応仁の乱"], a:3, e:"正解は「応仁の乱」です。1467年、室町幕府の将軍後継ぎ争いなどをめぐり応仁の乱が起こり、京都は主戦場となって荒廃し、戦国時代の幕開けとなりました。「承久の乱」は誤りで、これは鎌倉時代に起こった朝廷対幕府の争乱です。「保元の乱」は誤りで、これは平安時代末期の争乱です。「治承・寿永の乱」は誤りで、これは平安時代末期の源平の争乱(源平合戦)を指す呼び名です。"},
  {id:"nhis29", cat:"日本史", sub:"戦国・江戸", q:"1543年、種子島に流れ着いたポルトガル人によって日本に伝えられたものは何か。", choices:["鉄砲","キリスト教","羅針盤","活版印刷"], a:0, e:"正解は「鉄砲」です。1543年、種子島に漂着したポルトガル人によって鉄砲が伝えられ、その後の戦い方や築城のあり方に大きな影響を与えました。「キリスト教」は誤りで、これは1549年にフランシスコ・ザビエルによって伝えられたものです。「活版印刷」は誤りで、これはヨーロッパで発明され広まった技術ですが、種子島伝来の出来事とは異なります。「羅針盤」は誤りで、これは航海に使う道具で、中国で発明され改良されたものであり、種子島伝来の出来事ではありません。"},
  {id:"nhis31", cat:"日本史", sub:"戦国・江戸", q:"1549年、鹿児島に来航して日本に初めてキリスト教を伝えた宣教師は誰か。", choices:["ラクスマン","フランシスコ・ザビエル","ペリー","マルコ・ポーロ"], a:1, e:"正解は「フランシスコ・ザビエル」です。イエズス会の宣教師フランシスコ・ザビエルは1549年に鹿児島に上陸し、日本での布教を始めました。「マルコ・ポーロ」は誤りで、これは中世に『東方見聞録』を著したイタリアの旅行家であり、宣教師ではありません。「ペリー」は誤りで、これは江戸時代末期に来航したアメリカの提督です。「ラクスマン」は誤りで、これは江戸時代に通商を求めて根室に来航したロシア人です。"},
  {id:"nhis33", cat:"日本史", sub:"戦国・江戸", q:"織田信長が安土城下などで行った、商工業を活発にするため座(同業者組合)の特権を廃止した政策を何というか。", choices:["太閤検地","参勤交代","刀狩","楽市・楽座"], a:3, e:"正解は「楽市・楽座」です。織田信長は座の特権を廃止し、誰でも自由に商工業ができる楽市・楽座を行って城下町の発展をはかりました。「太閤検地」は誤りで、これは豊臣秀吉が行った全国の田畑の調査です。「刀狩」は誤りで、これも豊臣秀吉が行った、農民から武器を取り上げる政策です。「参勤交代」は誤りで、これは江戸幕府が大名に義務づけた制度です。"},
  {id:"nhis35", cat:"日本史", sub:"戦国・江戸", q:"豊臣秀吉が行った、田畑の広さや収穫量を調べて年貢の基準を定めた政策を何というか。", choices:["刀狩","地租改正","太閤検地","楽市・楽座"], a:2, e:"正解は「太閤検地」です。豊臣秀吉は全国の田畑を調査する太閤検地を行い、統一的な基準で年貢を徴収できるようにしました。「刀狩」は誤りで、これは同じく秀吉が行った、農民から武器を取り上げて一揆を防ぐ政策です。「楽市・楽座」は誤りで、これは織田信長が行った商業振興策です。「地租改正」は誤りで、これは明治時代に行われた税制改革です。"},
  {id:"nhis37", cat:"日本史", sub:"戦国・江戸", q:"江戸幕府が大名に、1年おきに江戸と領地を往復させ、妻子を江戸に住まわせた制度を何というか。", choices:["五人組","楽市・楽座","太閤検地","参勤交代"], a:3, e:"正解は「参勤交代」です。江戸幕府は3代将軍徳川家光の時に参勤交代を制度化し、大名に江戸と領地を1年おきに往復させることで大名の力を弱めました。「太閤検地」は誤りで、これは豊臣秀吉が行った土地調査です。「楽市・楽座」は誤りで、これは織田信長が行った商業振興策です。「五人組」は誤りで、これは江戸幕府が農民を互いに監視・連帯責任を負わせるために作らせた組織です。"},
  {id:"nhis39", cat:"日本史", sub:"戦国・江戸", q:"江戸幕府が海外との交流をオランダ・中国・朝鮮・琉球などに限定した体制を何というか。", choices:["鎖国","開国","攘夷","公武合体"], a:0, e:"正解は「鎖国」です。江戸幕府はキリスト教の禁止や貿易統制のため、海外との交流を長崎の出島などに限定するいわゆる鎖国の体制をとりました。「開国」は誤りで、これは江戸時代末期に外国との貿易・交流を認めるようになったことを指し、鎖国とは反対の言葉です。「攘夷」は誤りで、これは外国勢力を排除しようとする考え方です。「公武合体」は誤りで、これは幕末に朝廷と幕府の結びつきを強めようとした動きです。"},
  {id:"nhis41", cat:"日本史", sub:"戦国・江戸", q:"8代将軍徳川吉宗が行った、質素・倹約や新田開発、目安箱の設置などを内容とする改革を何というか。", choices:["享保の改革","天保の改革","慶安の改革","寛政の改革"], a:0, e:"正解は「享保の改革」です。徳川吉宗は財政再建のため質素・倹約をすすめ、新田開発や目安箱の設置などを行う享保の改革を行いました。「寛政の改革」は誤りで、これは老中松平定信が行った改革です。「天保の改革」は誤りで、これは老中水野忠邦が行った改革です。「慶安の改革」は誤りで、これは一般的な江戸時代の改革の呼び名としては用いられません。"},
  {id:"nhis43", cat:"日本史", sub:"戦国・江戸", q:"1854年、ペリーの要求により結ばれ、下田・函館の開港を定めた条約を何というか。", choices:["日米和親条約","下関条約","日米安全保障条約","日米修好通商条約"], a:0, e:"正解は「日米和親条約」です。1854年、ペリーの要求を受け入れて日米和親条約が結ばれ、下田・函館の2港が開かれました。「日米修好通商条約」は誤りで、これは1858年に結ばれ、貿易の開始などを定めた条約です。「日米安全保障条約」は誤りで、これは第二次世界大戦後の1951年に結ばれた条約です。「下関条約」は誤りで、これは日清戦争の講和条約です。"},
  {id:"nhis45", cat:"日本史", sub:"戦国・江戸", q:"1858年、大老井伊直弼が朝廷の許可を得ないまま結んだ、貿易の開始などを定めた条約を何というか。", choices:["日米和親条約","下関条約","ポーツマス条約","日米修好通商条約"], a:3, e:"正解は「日米修好通商条約」です。1858年、大老井伊直弼は朝廷の許可を得ないまま日米修好通商条約に調印し、自由貿易などが開始されました。「日米和親条約」は誤りで、これは1854年に結ばれ、開港のみを定めた条約です。「ポーツマス条約」は誤りで、これは日露戦争の講和条約です。「下関条約」は誤りで、これは日清戦争の講和条約です。"},
  {id:"nhis47", cat:"日本史", sub:"近代", q:"1867年、江戸幕府15代将軍徳川慶喜が政権を朝廷に返した出来事を何というか。", choices:["版籍奉還","廃藩置県","大政奉還","王政復古の大号令"], a:2, e:"正解は「大政奉還」です。1867年、徳川慶喜は政権を朝廷に返上する大政奉還を行い、江戸幕府は終わりを迎えました。「王政復古の大号令」は誤りで、これは大政奉還の直後に出された、天皇中心の新政府樹立を宣言する命令です。「版籍奉還」は誤りで、これは明治時代初期に大名が土地と人民を天皇に返上したことです。「廃藩置県」は誤りで、これも明治時代初期に藩を廃止して県を置いた改革です。"},
  {id:"nhis49", cat:"日本史", sub:"近代", q:"明治政府が1871年に藩を廃止して府県を置き、中央集権国家の基礎を固めた改革を何というか。", choices:["地租改正","廃藩置県","版籍奉還","四民平等"], a:1, e:"正解は「廃藩置県」です。1871年、明治政府は廃藩置県を行い、藩を廃止して府県を置くことで中央から役人を派遣する中央集権体制を整えました。「版籍奉還」は誤りで、これは廃藩置県より前に、大名が土地(版)と人民(籍)を天皇に返上したことです。「地租改正」は誤りで、これは土地の所有者に地価に応じた税を現金で納めさせた税制改革です。「四民平等」は誤りで、これは江戸時代の身分制度を廃止し、国民を平等な立場としたことです。"},
  {id:"nhis51", cat:"日本史", sub:"近代", q:"明治政府が土地の所有者に地価の一定割合を現金で納めさせるように改めた税制改革を何というか。", choices:["廃藩置県","学制","地租改正","版籍奉還"], a:2, e:"正解は「地租改正」です。明治政府は1873年から地租改正を行い、土地の所有者に地価の3%を現金で納めさせることで、政府の財政を安定させようとしました。「廃藩置県」は誤りで、これは藩を廃止して県を置いた行政改革です。「版籍奉還」は誤りで、これは大名が土地と人民を返上したことです。「学制」は誤りで、これは全国に小学校をつくることを定めた教育制度です。"},
  {id:"nhis53", cat:"日本史", sub:"近代", q:"1877年、明治政府に不満を持つ士族らが西郷隆盛を中心に起こした、最大規模の士族反乱を何というか。", choices:["秩父事件","佐賀の乱","戊辰戦争","西南戦争"], a:3, e:"正解は「西南戦争」です。1877年、鹿児島の士族らは西郷隆盛を中心に西南戦争を起こしましたが、政府軍に鎮圧され、これ以降の士族の反乱はおさまりました。「戊辰戦争」は誤りで、これは明治維新の直前に旧幕府側と新政府側の間で起こった戦争です。「佐賀の乱」は誤りで、これは西南戦争より前の1874年に起こった士族反乱です。「秩父事件」は誤りで、これは1884年に埼玉県で起こった農民らの蜂起です。"},
  {id:"nhis55", cat:"日本史", sub:"近代", q:"板垣退助らが中心となり、国会の開設や憲法制定などを政府に求めた運動を何というか。", choices:["大正デモクラシー","米騒動","自由民権運動","五・一五事件"], a:2, e:"正解は「自由民権運動」です。板垣退助らは民撰議院設立の建白書を提出したことをきっかけに自由民権運動を進め、国会開設や憲法制定を政府に求めました。「大正デモクラシー」は誤りで、これは大正時代に民主主義的な風潮が高まったことを指します。「五・一五事件」は誤りで、これは昭和初期の海軍青年将校によるクーデター事件です。「米騒動」は誤りで、これは大正時代に米の価格急騰をきっかけに起こった暴動です。"},
  {id:"nhis57", cat:"日本史", sub:"近代", q:"1894年、朝鮮をめぐる対立から日本と清の間で始まった戦争を何というか。", choices:["太平洋戦争","日露戦争","日清戦争","日中戦争"], a:2, e:"正解は「日清戦争」です。1894年、朝鮮の支配権をめぐる対立から日清戦争が始まり、日本が勝利して下関条約が結ばれました。「日露戦争」は誤りで、これは1904年に始まった日本とロシアの戦争です。「日中戦争」は誤りで、これは1937年に始まった日本と中国の戦争です。「太平洋戦争」は誤りで、これは1941年に始まった日本とアメリカなどとの戦争です。"},
  {id:"nhis59", cat:"日本史", sub:"近代", q:"1904年に始まった日露戦争の講和条約が結ばれた都市の名前をとった条約を何というか。", choices:["ポーツマス条約","下関条約","ベルサイユ条約","日米和親条約"], a:0, e:"正解は「ポーツマス条約」です。日露戦争はアメリカの仲介により、アメリカのポーツマスで講和条約が結ばれて終結しました。「下関条約」は誤りで、これは日清戦争の講和条約です。「ベルサイユ条約」は誤りで、これは第一次世界大戦の講和条約です。「日米和親条約」は誤りで、これは江戸時代末期にペリーとの間で結ばれた条約です。"},
  {id:"nhis61", cat:"日本史", sub:"近代", q:"1923年、東京・横浜を中心に大きな被害をもたらした大地震を何というか。", choices:["東日本大震災","関東大震災","濃尾地震","阪神・淡路大震災"], a:1, e:"正解は「関東大震災」です。1923年9月に発生した関東大震災は、東京・横浜を中心に大きな被害をもたらし、火災による被害も深刻でした。「阪神・淡路大震災」は誤りで、これは1995年に起こった地震です。「東日本大震災」は誤りで、これは2011年に起こった地震です。「濃尾地震」は誤りで、これは1891年に起こった地震です。"},
  {id:"nhis63", cat:"日本史", sub:"近代", q:"1931年、南満州鉄道の爆破事件をきっかけに日本軍が満州を占領した出来事を何というか。", choices:["満州事変","二・二六事件","盧溝橋事件","日中戦争"], a:0, e:"正解は「満州事変」です。1931年、関東軍は南満州鉄道の線路を爆破し(柳条湖事件)、これをきっかけに満州事変を起こして満州を占領しました。「日中戦争」は誤りで、これは1937年の盧溝橋事件をきっかけに始まった日本と中国の全面戦争です。「盧溝橋事件」は誤りで、これは日中戦争のきっかけとなった北京郊外での衝突事件です。「二・二六事件」は誤りで、これは1936年に起こった陸軍青年将校らによるクーデター事件です。"},
  {id:"nhis65", cat:"日本史", sub:"近代", q:"1941年12月、日本軍がハワイの真珠湾を攻撃したことをきっかけに始まった戦争を何というか。", choices:["太平洋戦争","日露戦争","日清戦争","満州事変"], a:0, e:"正解は「太平洋戦争」です。1941年12月、日本軍がハワイの真珠湾を奇襲攻撃したことをきっかけに、日本とアメリカ・イギリスなどとの太平洋戦争が始まりました。「日露戦争」は誤りで、これは1904年に始まった日本とロシアの戦争です。「日清戦争」は誤りで、これは1894年に始まった日本と清の戦争です。「満州事変」は誤りで、これは1931年に始まった、太平洋戦争より前の出来事です。"},
  {id:"nhis67", cat:"日本史", sub:"現代", q:"第二次世界大戦後、日本を占領し民主化政策を進めた連合国軍の機関を何というか。", choices:["国際連盟","ヤルタ会議","GHQ(連合国軍最高司令官総司令部)","国際連合"], a:2, e:"正解は「GHQ(連合国軍最高司令官総司令部)」です。GHQはマッカーサーを最高司令官として日本を占領し、農地改革や財閥解体などの民主化政策を指導しました。「国際連盟」は誤りで、これは第一次世界大戦後に設立された国際組織です。「国際連合」は誤りで、これは第二次世界大戦後に設立された国際組織ですが、日本を占領した機関そのものではありません。「ヤルタ会議」は誤りで、これは第二次世界大戦末期に連合国首脳が行った会談です。"},
  {id:"nhis69", cat:"日本史", sub:"現代", q:"GHQの指導のもとで行われた、地主の土地を政府が買い上げて小作人に安く売り渡した改革を何というか。", choices:["地租改正","太閤検地","農地改革","版籍奉還"], a:2, e:"正解は「農地改革」です。GHQの指導のもとで行われた農地改革により、多くの小作農が自作農となり、地主制度が大きく変化しました。「地租改正」は誤りで、これは明治時代の税制改革です。「太閤検地」は誤りで、これは豊臣秀吉が行った土地調査です。「版籍奉還」は誤りで、これは明治時代初期に大名が土地と人民を返上した出来事です。"},
  {id:"nhis71", cat:"日本史", sub:"現代", q:"1951年、日本が独立を回復するとともにアメリカなど48か国と結んだ条約を何というか。", choices:["ポツダム宣言","日米安全保障条約","日ソ共同宣言","サンフランシスコ平和条約"], a:3, e:"正解は「サンフランシスコ平和条約」です。1951年に結ばれたサンフランシスコ平和条約により、日本は独立を回復しました。「ポツダム宣言」は誤りで、これは第二次世界大戦末期に日本に降伏を求めた宣言です。「日米安全保障条約」は誤りで、これはサンフランシスコ平和条約と同じ日に結ばれた別の条約で、アメリカ軍の日本駐留などを定めたものです。「日ソ共同宣言」は誤りで、これは1956年に日本とソ連の国交回復を定めた宣言です。"},
  {id:"nhis73", cat:"日本史", sub:"現代", q:"1950年代半ばから1970年代初めにかけて、日本の経済が急速に成長した時期を何というか。", choices:["バブル経済期","高度経済成長期","戦後復興期","産業革命期"], a:1, e:"正解は「高度経済成長期」です。1950年代半ばから1970年代初めにかけて、日本経済は年平均10%前後の高い成長率を続け、高度経済成長期と呼ばれました。「バブル経済期」は誤りで、これは1980年代後半に地価や株価が異常に高騰した時期です。「戦後復興期」は誤りで、これは高度経済成長期より前の、戦争の被害からの復興を進めた時期です。「産業革命期」は誤りで、これは日本では明治時代に工業化が進んだ時期を指します。"},
  {id:"nhis75", cat:"日本史", sub:"現代", q:"1972年、佐藤栄作内閣のときにアメリカから日本に返還された地域はどこか。", choices:["沖縄","北方領土","小笠原諸島","奄美群島"], a:0, e:"正解は「沖縄」です。1972年、佐藤栄作内閣のもとでアメリカから沖縄が日本に返還されました。「小笠原諸島」は誤りで、これは沖縄よりも早い1968年に返還されています。「北方領土」は誤りで、これは現在もロシアとの間で返還交渉が続いている地域です。「奄美群島」は誤りで、これは沖縄よりも早い1953年に日本に返還されています。"},
  /* 世界史 */
  {id:"nwor01", cat:"世界史", sub:"古代・中世", q:"チグリス川・ユーフラテス川流域に発達し、くさび形文字を生み出した古代文明を何というか。", choices:["エジプト文明","メソポタミア文明","中国文明","インダス文明"], a:1, e:"正解は「メソポタミア文明」です。メソポタミア文明はチグリス川・ユーフラテス川の流域に発達し、くさび形文字や太陰暦などを生み出しました。「エジプト文明」は誤りで、これはナイル川流域に発達し、象形文字(ヒエログリフ)やピラミッドで知られる文明です。「インダス文明」は誤りで、これはインダス川流域に発達した文明です。「中国文明」は誤りで、これは黄河・長江流域に発達し、甲骨文字を生み出した文明です。"},
  {id:"nwor03", cat:"世界史", sub:"古代・中世", q:"ナイル川流域に発達し、ピラミッドや象形文字(ヒエログリフ)で知られる古代文明を何というか。", choices:["黄河文明","メソポタミア文明","インダス文明","エジプト文明"], a:3, e:"正解は「エジプト文明」です。エジプト文明はナイル川流域に発達し、王(ファラオ)の墓であるピラミッドや象形文字などの文化を生み出しました。「メソポタミア文明」は誤りで、これはチグリス・ユーフラテス川流域に発達した文明です。「インダス文明」は誤りで、これはインダス川流域に発達した文明です。「黄河文明」は誤りで、これは中国の黄河流域に発達した文明です。"},
  {id:"nwor05", cat:"世界史", sub:"古代・中世", q:"紀元前6世紀ごろ、インドで仏教を開いたとされる人物は誰か。", choices:["ムハンマド","孔子","シャカ(釈迦)","イエス"], a:2, e:"正解は「シャカ(釈迦)」です。シャカはインドで仏教を開き、その教えは後にアジア各地に広まりました。「孔子」は誤りで、これは古代中国で儒教のもとになる教えを説いた思想家です。「イエス」は誤りで、これはキリスト教のもとになった人物です。「ムハンマド」は誤りで、これはイスラム教を開いた人物です。"},
  {id:"nwor07", cat:"世界史", sub:"古代・中世", q:"パレスチナの地でイエスの教えをもとに成立し、後にローマ帝国の国教となった宗教を何というか。", choices:["イスラム教","仏教","キリスト教","ヒンドゥー教"], a:2, e:"正解は「キリスト教」です。キリスト教はイエスの教えをもとに成立し、初めは迫害を受けましたが、後にローマ帝国の国教となりました。「仏教」は誤りで、これはインドでシャカが開いた宗教です。「イスラム教」は誤りで、これは7世紀にアラビア半島でムハンマドが開いた宗教です。「ヒンドゥー教」は誤りで、これはインドで多くの人々に信仰されてきた宗教です。"},
  {id:"nwor09", cat:"世界史", sub:"古代・中世", q:"7世紀、ムハンマドがアラビア半島で開いた宗教を何というか。", choices:["ユダヤ教","キリスト教","仏教","イスラム教"], a:3, e:"正解は「イスラム教」です。7世紀初め、ムハンマドはアラビア半島でイスラム教を開き、唯一神アラーへの信仰を説きました。「キリスト教」は誤りで、これはイエスの教えをもとに成立した宗教です。「仏教」は誤りで、これはインドでシャカが開いた宗教です。「ユダヤ教」は誤りで、これはイスラム教よりも古くから存在する、ユダヤ人の民族的な宗教です。"},
  {id:"nwor11", cat:"世界史", sub:"古代・中世", q:"11世紀末から約200年間、キリスト教徒が聖地エルサレムの奪還を目指して行った遠征を何というか。", choices:["宗教改革","十字軍","百年戦争","三十年戦争"], a:1, e:"正解は「十字軍」です。11世紀末から約200年間、ローマ教皇の呼びかけにより、キリスト教徒はイスラム勢力から聖地エルサレムを奪還しようと十字軍を派遣しました。「三十年戦争」は誤りで、これは17世紀のヨーロッパで起こった宗教・政治対立による戦争です。「百年戦争」は誤りで、これは14〜15世紀にイギリスとフランスの間で行われた戦争です。「宗教改革」は誤りで、これは16世紀にカトリック教会のあり方を批判して起こった運動です。"},
  {id:"nwor13", cat:"世界史", sub:"アジア史", q:"13世紀、チンギス・ハンが築き、ユーラシア大陸の広い範囲を支配した帝国を何というか。", choices:["オスマン帝国","モンゴル帝国","ムガル帝国","ローマ帝国"], a:1, e:"正解は「モンゴル帝国」です。チンギス・ハンはモンゴル高原の諸部族を統一してモンゴル帝国を築き、その後ユーラシア大陸の広い範囲を支配下に置きました。「オスマン帝国」は誤りで、これは13世紀末に成立したトルコ系イスラム国家です。「ローマ帝国」は誤りで、これは古代地中海世界を支配した国家です。「ムガル帝国」は誤りで、これは16世紀にインドに成立したイスラム王朝です。"},
  {id:"nwor15", cat:"世界史", sub:"ヨーロッパ史", q:"ルネサンス期に『モナ・リザ』などの絵画を残したイタリアの芸術家・科学者は誰か。", choices:["コロンブス","レオナルド・ダ・ヴィンチ","マルティン・ルター","ガリレオ・ガリレイ"], a:1, e:"正解は「レオナルド・ダ・ヴィンチ」です。レオナルド・ダ・ヴィンチはルネサンス期のイタリアで活躍し、『モナ・リザ』などの絵画や科学的な研究でも知られています。「ガリレオ・ガリレイ」は誤りで、これは地動説を支持したことで知られるイタリアの科学者です。「コロンブス」は誤りで、これは大西洋を横断してアメリカ大陸に到達した航海者です。「マルティン・ルター」は誤りで、これは宗教改革を始めたドイツの人物です。"},
  {id:"nwor17", cat:"世界史", sub:"ヨーロッパ史", q:"1492年、スペインの援助を受けて大西洋を横断し、アメリカ大陸付近の島に到達した航海者は誰か。", choices:["ザビエル","マゼラン","バスコ・ダ・ガマ","コロンブス"], a:3, e:"正解は「コロンブス」です。コロンブスは1492年、スペインの支援を受けて大西洋を横断し、西インド諸島に到達しました。「マゼラン」は誤りで、これはその後、世界一周に初めて成功した船隊を率いた航海者です。「バスコ・ダ・ガマ」は誤りで、これはアフリカ南端を回ってインドに到達した航海者です。「ザビエル」は誤りで、これは日本にキリスト教を伝えた宣教師です。"},
  {id:"nwor19", cat:"世界史", sub:"ヨーロッパ史", q:"1519年に出発した船隊を率い、部下がその後世界一周を達成することになった航海者は誰か。", choices:["コロンブス","バスコ・ダ・ガマ","マゼラン","ヴァスコ・ヌニェス"], a:2, e:"正解は「マゼラン」です。マゼランは1519年に船隊を率いて出発し、彼自身は航海の途中で亡くなりましたが、部下がそのまま航海を続けて世界一周を達成しました。「コロンブス」は誤りで、これは大西洋を横断してアメリカ大陸付近に到達した航海者です。「バスコ・ダ・ガマ」は誤りで、これはインドへの航路を開いた航海者です。「ヴァスコ・ヌニェス」は誤りで、これは太平洋を発見したとされるスペインの探検家です。"},
  {id:"nwor21", cat:"世界史", sub:"ヨーロッパ史", q:"1517年、カトリック教会の免罪符販売を批判し、宗教改革のきっかけをつくったドイツの人物は誰か。", choices:["ナポレオン","マルティン・ルター","カルヴァン","ローマ教皇"], a:1, e:"正解は「マルティン・ルター」です。ルターは1517年に「九十五か条の論題」を発表してカトリック教会の免罪符販売を批判し、宗教改革のきっかけをつくりました。「カルヴァン」は誤りで、これはルターに続いてスイスで宗教改革を進めた人物です。「ローマ教皇」は誤りで、これは改革を受ける立場であったカトリック教会の最高指導者です。「ナポレオン」は誤りで、これは18世紀末〜19世紀初めのフランスの皇帝です。"},
  {id:"nwor23", cat:"世界史", sub:"ヨーロッパ史", q:"18世紀後半、イギリスで蒸気機関の実用化などをきっかけに工業の生産方法が大きく変化した出来事を何というか。", choices:["名誉革命","宗教改革","市民革命","産業革命"], a:3, e:"正解は「産業革命」です。18世紀後半のイギリスでは蒸気機関の実用化などにより機械を使った大量生産が可能になり、産業革命と呼ばれる大きな変化が起こりました。「名誉革命」は誤りで、これは17世紀にイギリスで起こった政治的な革命です。「宗教改革」は誤りで、これは16世紀のヨーロッパで起こったキリスト教会をめぐる改革運動です。「市民革命」は誤りで、これは市民が中心となって旧体制を倒した革命全般を指す言葉であり、産業革命そのものとは異なります。"},
  {id:"nwor25", cat:"世界史", sub:"ヨーロッパ史", q:"1776年に発表され、イギリスからの独立とすべての人間の平等・自由の権利をうたった文書を何というか。", choices:["マグナ・カルタ","権利章典","人権宣言","独立宣言"], a:3, e:"正解は「独立宣言」です。1776年、北アメリカの13の植民地はイギリスからの独立を宣言し、独立宣言には人間の自由・平等の権利がうたわれました。「権利章典」は誤りで、これは17世紀末にイギリスで議会の権利を定めた文書です。「人権宣言」は誤りで、これは1789年にフランス革命の中で発表された文書です。「マグナ・カルタ(大憲章)」は誤りで、これは13世紀にイギリスで国王の権力を制限した文書です。"},
  {id:"nwor27", cat:"世界史", sub:"ヨーロッパ史", q:"1789年、バスティーユ牢獄襲撃をきっかけに始まった、フランスの絶対王政を倒した革命を何というか。", choices:["名誉革命","ロシア革命","産業革命","フランス革命"], a:3, e:"正解は「フランス革命」です。1789年のバスティーユ牢獄襲撃をきっかけにフランス革命が始まり、絶対王政が倒され、人権宣言が発表されました。「名誉革命」は誤りで、これは17世紀末にイギリスで起こった革命です。「産業革命」は誤りで、これは工業の生産方法が変化した出来事であり、政治体制を倒す革命ではありません。「ロシア革命」は誤りで、これは1917年にロシアで起こった革命です。"},
  {id:"nwor29", cat:"世界史", sub:"ヨーロッパ史", q:"フランス革命の混乱の中で軍人として台頭し、1804年に国民投票を経てフランス皇帝に即位した人物は誰か。", choices:["ナポレオン","ロベスピエール","ルイ16世","ルイ14世"], a:0, e:"正解は「ナポレオン」です。ナポレオンはフランス革命後の混乱の中で軍人として台頭し、1804年に国民投票を経てフランス皇帝に即位しました。「ルイ14世」は誤りで、これはフランス革命よりも前、絶対王政の全盛期の国王です。「ルイ16世」は誤りで、これはフランス革命当時の国王で、革命の中で処刑されました。「ロベスピエール」は誤りで、これはフランス革命期に恐怖政治を行った政治家です。"},
  {id:"nwor31", cat:"世界史", sub:"ヨーロッパ史", q:"1840年、清がイギリスに敗れ、香港の割譲などを認めさせられた戦争を何というか。", choices:["アヘン戦争","日清戦争","義和団の乱","アロー戦争"], a:0, e:"正解は「アヘン戦争」です。1840年、イギリスがアヘンの密輸を清に取り締まられたことをきっかけに始まったアヘン戦争で清は敗れ、南京条約で香港を割譲しました。「アロー戦争」は誤りで、これはアヘン戦争の後、1856年に起こった、イギリス・フランスと清の間の戦争です。「日清戦争」は誤りで、これは1894年に日本と清の間で起こった戦争です。「義和団の乱」は誤りで、これは1900年に中国で起こった外国勢力排斥運動です。"},
  {id:"nwor33", cat:"世界史", sub:"ヨーロッパ史", q:"アメリカで奴隷制の存続をめぐり南部と北部が対立して起こった戦争(1861〜65年)を何というか。", choices:["朝鮮戦争","南北戦争","米西戦争","独立戦争"], a:1, e:"正解は「南北戦争」です。アメリカでは奴隷制の存続などをめぐり南部と北部が対立し、1861年から南北戦争が起こりました。この間にリンカーン大統領は奴隷解放宣言を発表しました。「独立戦争」は誤りで、これは18世紀にイギリスからの独立を求めて行われた戦争です。「米西戦争」は誤りで、これは1898年に起こったアメリカとスペインの戦争です。「朝鮮戦争」は誤りで、これは1950年に起こった戦争です。"},
  {id:"nwor35", cat:"世界史", sub:"両大戦期", q:"1914年、サラエボ事件をきっかけに始まり、多くの国を巻き込んだ大規模な戦争を何というか。", choices:["第一次世界大戦","冷戦","第二次世界大戦","日露戦争"], a:0, e:"正解は「第一次世界大戦」です。1914年、オーストリア皇太子夫妻が暗殺されたサラエボ事件をきっかけに第一次世界大戦が始まり、多くの国を巻き込む総力戦となりました。「第二次世界大戦」は誤りで、これは1939年に始まった戦争です。「日露戦争」は誤りで、これは1904年に始まった日本とロシアの戦争です。「冷戦」は誤りで、これは第二次世界大戦後の米ソの対立を指し、実際の戦火を交える戦争ではありません。"},
  {id:"nwor37", cat:"世界史", sub:"両大戦期", q:"1919年、第一次世界大戦の講和会議で結ばれ、敗戦国ドイツに厳しい条件を課した条約を何というか。", choices:["ベルサイユ条約","ポーツマス条約","下関条約","サンフランシスコ平和条約"], a:0, e:"正解は「ベルサイユ条約」です。1919年、パリ講和会議で結ばれたベルサイユ条約により、敗戦国ドイツは領土の縮小や巨額の賠償金など厳しい条件を課されました。「ポーツマス条約」は誤りで、これは日露戦争の講和条約です。「下関条約」は誤りで、これは日清戦争の講和条約です。「サンフランシスコ平和条約」は誤りで、これは第二次世界大戦後、日本の独立を認めた条約です。"},
  {id:"nwor39", cat:"世界史", sub:"両大戦期", q:"1929年、アメリカで株価が大暴落したことをきっかけに世界中に広がった深刻な不況を何というか。", choices:["バブル崩壊","オイルショック","南海泡沫事件","世界恐慌"], a:3, e:"正解は「世界恐慌」です。1929年、アメリカのニューヨーク株式市場で株価が大暴落したことをきっかけに世界恐慌が起こり、多くの国で深刻な不況となりました。「バブル崩壊」は誤りで、これは1990年代初めの日本などで地価・株価の異常な高騰が崩れた出来事です。「オイルショック」は誤りで、これは1970年代の石油価格の高騰による経済混乱です。「南海泡沫事件」は誤りで、これは18世紀イギリスで起こった株式投機の破綻事件です。"},
  {id:"nwor41", cat:"世界史", sub:"両大戦期", q:"世界恐慌に対しアメリカのローズベルト大統領が行った、公共事業などを通じて景気回復をはかった政策を何というか。", choices:["五か年計画","マーシャル・プラン","ブロック経済","ニューディール政策"], a:3, e:"正解は「ニューディール政策」です。ローズベルト大統領は公共事業をおこして雇用を生み出すニューディール政策を実施し、世界恐慌からの景気回復をはかりました。「ブロック経済」は誤りで、これはイギリスやフランスが植民地との関係を強めて他国の商品を締め出した政策です。「五か年計画」は誤りで、これはソ連が行った経済発展計画です。「マーシャル・プラン」は誤りで、これは第二次世界大戦後、アメリカがヨーロッパ復興を支援した計画です。"},
  {id:"nwor43", cat:"世界史", sub:"両大戦期", q:"世界恐慌後のドイツで、ヒトラーが率いて政権を握った政党を何というか。", choices:["ファシスト党","ナチス(国民社会主義ドイツ労働者党)","社会民主党","共産党"], a:1, e:"正解は「ナチス(国民社会主義ドイツ労働者党)」です。世界恐慌後の混乱の中、ヒトラー率いるナチスは国民の支持を集めて政権を握り、独裁体制を築きました。「共産党」は誤りで、これはナチスと対立していたドイツの政党です。「社会民主党」は誤りで、これも当時のドイツにあった別の政党です。「ファシスト党」は誤りで、これはイタリアでムッソリーニが率いた政党です。"},
  {id:"nwor45", cat:"世界史", sub:"両大戦期", q:"1939年、ドイツのポーランド侵攻をきっかけに始まった、世界規模の戦争を何というか。", choices:["第一次世界大戦","日中戦争","朝鮮戦争","第二次世界大戦"], a:3, e:"正解は「第二次世界大戦」です。1939年、ドイツがポーランドに侵攻したことをきっかけに、イギリス・フランスがドイツに宣戦し、第二次世界大戦が始まりました。「第一次世界大戦」は誤りで、これは1914年に始まった戦争です。「日中戦争」は誤りで、これは1937年に始まった日本と中国の戦争であり、第二次世界大戦とは開始のきっかけが異なります。「朝鮮戦争」は誤りで、これは1950年に始まった戦争です。"},
  {id:"nwor47", cat:"世界史", sub:"現代", q:"1945年10月、世界の平和と安全を守ることを目的として発足した国際機関を何というか。", choices:["EU","NATO","国際連合","国際連盟"], a:2, e:"正解は「国際連合」です。1945年、第二次世界大戦の反省をふまえて国際連合が発足し、世界の平和と安全の維持を目的として活動しています。「国際連盟」は誤りで、これは第一次世界大戦後の1920年に発足した国際機関です。「NATO(北大西洋条約機構)」は誤りで、これは冷戦下に結成された西側の軍事同盟です。「EU(欧州連合)」は誤りで、これは1993年に発足したヨーロッパの地域統合組織です。"},
  {id:"nwor49", cat:"世界史", sub:"現代", q:"第二次世界大戦後、アメリカを中心とする資本主義陣営とソ連を中心とする社会主義陣営の対立を何というか。", choices:["南北問題","朝鮮戦争","冷戦","キューバ危機"], a:2, e:"正解は「冷戦」です。第二次世界大戦後、アメリカを中心とする資本主義陣営とソ連を中心とする社会主義陣営は、直接の戦火を交えないまま激しく対立し、これを冷戦と呼びます。「南北問題」は誤りで、これは先進国と発展途上国の間の経済格差の問題です。「キューバ危機」は誤りで、これは冷戦下でアメリカとソ連が核戦争の危機に直面した1962年の出来事です。「朝鮮戦争」は誤りで、これは冷戦下で実際に戦火を交えた戦争の一つです。"},
  {id:"nwor51", cat:"世界史", sub:"現代", q:"1949年、毛沢東を中心とする共産党によって建国が宣言された国はどこか。", choices:["中華人民共和国","中華民国","ソビエト連邦","大韓民国"], a:0, e:"正解は「中華人民共和国」です。1949年、国共内戦に勝利した毛沢東ら共産党は中華人民共和国の建国を宣言しました。「中華民国」は誤りで、これは内戦に敗れた国民党が台湾に逃れて維持した政権です。「大韓民国」は誤りで、これは朝鮮半島南部に成立した国です。「ソビエト連邦」は誤りで、これは1922年に成立した社会主義国であり、中国とは別の国です。"},
  {id:"nwor53", cat:"世界史", sub:"現代", q:"1950年、朝鮮半島の南北統一をめぐって始まり、アメリカと中国も介入した戦争を何というか。", choices:["中東戦争","朝鮮戦争","湾岸戦争","ベトナム戦争"], a:1, e:"正解は「朝鮮戦争」です。1950年、北朝鮮が韓国に侵攻して朝鮮戦争が始まり、アメリカ中心の国連軍と中国の義勇軍も介入する大規模な戦争となりました。「ベトナム戦争」は誤りで、これはベトナムを舞台にアメリカが介入した戦争です。「湾岸戦争」は誤りで、これは1991年に起こった中東の戦争です。「中東戦争」は誤りで、これはイスラエルとアラブ諸国の間で複数回起こった戦争です。"},
  {id:"nwor55", cat:"世界史", sub:"現代", q:"1961年、東西冷戦の象徴として東ドイツによって築かれた壁を何というか。", choices:["鉄のカーテン","万里の長城","ベルリンの壁","マジノ線"], a:2, e:"正解は「ベルリンの壁」です。1961年、東ドイツは西側への人々の流出を防ぐため、東西ベルリンの境界にベルリンの壁を築きました。「万里の長城」は誤りで、これは古代中国で異民族の侵入を防ぐために築かれた城壁です。「鉄のカーテン」は誤りで、これは東西冷戦の分断を表現した言葉であり、実際の壁の固有名詞ではありません。「マジノ線」は誤りで、これは第二次世界大戦前にフランスが築いた防衛線です。"},
  {id:"nwor57", cat:"世界史", sub:"現代", q:"1989年に取り壊され、東西冷戦の終わりを象徴する出来事となったのは何か。", choices:["ソ連の解体","朝鮮戦争の休戦","ベルリンの壁の崩壊","中国の建国"], a:2, e:"正解は「ベルリンの壁の崩壊」です。1989年、東西を隔てていたベルリンの壁が取り壊され、東西冷戦の終わりを象徴する出来事となりました。「ソ連の解体」は誤りで、これはベルリンの壁崩壊よりも後の1991年に起こった出来事です。「朝鮮戦争の休戦」は誤りで、これは1953年に成立しており、時期が異なります。「中国の建国」は誤りで、これは1949年の出来事であり、冷戦終結とは直接関係しません。"},
  {id:"nwor59", cat:"世界史", sub:"現代", q:"1991年、社会主義体制の維持が困難になり解体した国はどこか。", choices:["ユーゴスラビア","中華人民共和国","東ドイツ","ソビエト連邦"], a:3, e:"正解は「ソビエト連邦」です。1991年、ソビエト連邦は経済の停滞や改革の混乱により解体し、ロシアなど複数の独立国家となりました。「中華人民共和国」は誤りで、これは現在も存続している国です。「東ドイツ」は誤りで、これはソ連解体より前の1990年に西ドイツと統一されています。「ユーゴスラビア」は誤りで、これも社会主義体制が崩れて解体した国ですが、ソ連とは別の国です。"},
  {id:"nwor61", cat:"世界史", sub:"古代・中世", q:"紀元前5世紀ごろ、アテネなどの都市国家(ポリス)で成人男性市民が直接政治に参加するしくみが発達した国はどこか。", choices:["古代ギリシャ","古代インド","古代ローマ","古代エジプト"], a:0, e:"正解は「古代ギリシャ」です。古代ギリシャのアテネなどの都市国家(ポリス)では、成人男性市民が民会に集まって話し合う直接民主政が発達しました。「古代ローマ」は誤りで、これは共和政や帝政など独自の政治のしくみを発達させた国です。「古代エジプト」は誤りで、これはファラオが強い権力を持つ王国でした。「古代インド」は誤りで、これは身分制度(カースト)などで知られる文明です。"},
  {id:"nwor63", cat:"世界史", sub:"ヨーロッパ史", q:"地中海を中心に広大な領土を支配した古代の国家で、道路網や法律の整備で知られるのはどこか。", choices:["エジプト王国","ローマ帝国","フランク王国","ビザンツ帝国"], a:1, e:"正解は「ローマ帝国」です。ローマ帝国は地中海を囲む広大な領土を支配し、道路網の整備や『ローマ法』の制定などで知られています。「エジプト王国」は誤りで、これはナイル川流域に栄えた古代文明です。「フランク王国」は誤りで、これは中世西ヨーロッパに成立したゲルマン系の王国です。「ビザンツ帝国」は誤りで、これはローマ帝国が東西に分裂した後の東側の帝国です。"},
  {id:"nwor65", cat:"世界史", sub:"アジア史", q:"7世紀、シルクロードを通じた交流が盛んで、日本が遣唐使を派遣した中国の王朝を何というか。", choices:["宋","漢","明","唐"], a:3, e:"正解は「唐」です。唐は7世紀から10世紀初めまで中国を支配した王朝で、シルクロードを通じた国際的な交流が盛んになり、日本も遣唐使を派遣しました。「漢」は誤りで、これは唐よりも前の紀元前後の時代に栄えた王朝です。「宋」は誤りで、これは唐が滅んだ後、10世紀に成立した王朝です。「明」は誤りで、これは14世紀に成立し、日本の室町時代に勘合貿易が行われた王朝です。"},
  {id:"nwor67", cat:"世界史", sub:"アジア史", q:"1911年、清を倒して中華民国が成立するきっかけとなった革命を何というか。", choices:["五・四運動","国共内戦","辛亥革命","文化大革命"], a:2, e:"正解は「辛亥革命」です。1911年に起こった辛亥革命により清朝は倒され、翌1912年に孫文を中心とする中華民国が成立しました。「五・四運動」は誤りで、これは1919年に起こった中国の反日・反帝国主義運動です。「文化大革命」は誤りで、これは1966年から中国で起こった政治運動です。「国共内戦」は誤りで、これは国民党と共産党の間で行われた内戦です。"},
  {id:"nwor69", cat:"世界史", sub:"現代", q:"1993年、マーストリヒト条約に基づいて発足した、ヨーロッパの政治・経済統合を進める組織を何というか。", choices:["国際連盟","コミンフォルム","EU(欧州連合)","NATO(北大西洋条約機構)"], a:2, e:"正解は「EU(欧州連合)」です。EUは1993年、マーストリヒト条約に基づいて発足し、ヨーロッパの国々の政治・経済統合を進めています。「NATO」は誤りで、これは冷戦下に結成された西側諸国の軍事同盟です。「国際連盟」は誤りで、これは第一次世界大戦後に発足した国際機関です。「コミンフォルム」は誤りで、これは冷戦初期にソ連を中心に結成された組織です。"},
  /* 地理 */
  {id:"ngeo01", cat:"地理", sub:"世界地理", q:"世界を六つに分けたとき、日本が属する大陸を何というか。", choices:["北アメリカ大陸","ユーラシア大陸","オーストラリア大陸","アフリカ大陸"], a:1, e:"正解は「ユーラシア大陸」です。日本はユーラシア大陸の東に位置する島国で、ユーラシア大陸はヨーロッパ州とアジア州を合わせた世界最大の大陸です。「アフリカ大陸」は誤りで、これはユーラシア大陸の南西に位置する別の大陸です。「北アメリカ大陸」は誤りで、これは太平洋を挟んで日本の東側に位置する大陸です。「オーストラリア大陸」は誤りで、これは南半球にある大陸です。"},
  {id:"ngeo03", cat:"地理", sub:"世界地理", q:"世界の三大洋のうち、日本列島の東側に広がる、世界最大の面積を持つ海洋を何というか。", choices:["地中海","太平洋","大西洋","インド洋"], a:1, e:"正解は「太平洋」です。太平洋は日本列島の東側に広がる世界最大の面積を持つ海洋です。「大西洋」は誤りで、これはヨーロッパ・アフリカと南北アメリカの間に広がる海洋です。「インド洋」は誤りで、これはアフリカ・アジア・オーストラリアに囲まれた海洋です。「地中海」は誤りで、これはヨーロッパとアフリカの間にある比較的小さな海です。"},
  {id:"ngeo05", cat:"地理", sub:"世界地理", q:"経度0度の基準となる、イギリスのグリニッジ天文台を通る線を何というか。", choices:["日付変更線","回帰線","赤道","本初子午線"], a:3, e:"正解は「本初子午線」です。本初子午線はイギリスのロンドン郊外グリニッジ天文台を通る経度0度の線で、東経・西経を分ける基準となります。「赤道」は誤りで、これは緯度0度の線であり、経度の基準ではありません。「日付変更線」は誤りで、これはほぼ経度180度に沿って設けられた、日付を調整するための線です。「回帰線」は誤りで、これは太陽が真上にくる限界の緯線(北回帰線・南回帰線)です。"},
  {id:"ngeo07", cat:"地理", sub:"世界地理", q:"緯度0度の線で、地球を北半球と南半球に分ける線を何というか。", choices:["本初子午線","北回帰線","日付変更線","赤道"], a:3, e:"正解は「赤道」です。赤道は緯度0度の線で、地球を北半球と南半球に二等分しています。「本初子午線」は誤りで、これは経度0度の線であり、東半球と西半球を分ける基準です。「日付変更線」は誤りで、これは日付を調整するための線です。「北回帰線」は誤りで、これは北緯約23.4度の緯線です。"},
  {id:"ngeo09", cat:"地理", sub:"世界地理", q:"一年を通して気温が高く、雨の多い熱帯雨林が広がる気候帯を何というか。", choices:["乾燥帯","温帯","冷帯(亜寒帯)","熱帯"], a:3, e:"正解は「熱帯」です。熱帯は赤道付近に広がる、一年を通して気温が高く降水量の多い気候帯で、熱帯雨林が発達しています。「乾燥帯」は誤りで、これは降水量が非常に少なく、砂漠やステップが広がる気候帯です。「温帯」は誤りで、これは四季の変化がはっきりしている気候帯で、日本の大部分もここに含まれます。「冷帯(亜寒帯)」は誤りで、これは冬の寒さが厳しい気候帯です。"},
  {id:"ngeo11", cat:"地理", sub:"世界地理", q:"サハラ砂漠のように、一年を通して降水量が非常に少ない気候帯を何というか。", choices:["乾燥帯","温帯","熱帯","寒帯"], a:0, e:"正解は「乾燥帯」です。乾燥帯は降水量が非常に少なく、砂漠や、丈の短い草原(ステップ)が広がる気候帯です。「熱帯」は誤りで、これは気温が高く雨も多い気候帯です。「温帯」は誤りで、これは四季の変化がある気候帯です。「寒帯」は誤りで、これは一年を通して気温が低い、北極や南極に近い地域の気候帯です。"},
  {id:"ngeo13", cat:"地理", sub:"世界地理", q:"季節によって吹く方向が変わり、東アジアや南アジアの気候に大きな影響を与える風を何というか。", choices:["貿易風","季節風(モンスーン)","やませ","偏西風"], a:1, e:"正解は「季節風(モンスーン)」です。季節風は夏と冬で吹く方向が変わる風で、東アジアや南アジアでは夏の雨や冬の乾燥に大きく影響しています。「偏西風」は誤りで、これは中緯度地域で一年を通して西から東へ吹く風です。「貿易風」は誤りで、これは低緯度地域で吹く風です。「やませ」は誤りで、これは日本の東北地方の太平洋側に夏に吹く冷たく湿った風です。"},
  {id:"ngeo15", cat:"地理", sub:"日本地理", q:"日本列島は現在いくつの都道府県に分けられているか。", choices:["50","47","45","43"], a:1, e:"正解は「47」です。日本は1都1道2府43県、合わせて47の都道府県に分けられています。「43」は誤りで、これは県の数のみを表しており、都道府県全体の数ではありません。「50」は誤りで、これはアメリカ合衆国の州の数などと混同しやすい数字です。「45」は誤りで、正しい数とは異なります。"},
  {id:"ngeo17", cat:"地理", sub:"日本地理", q:"日本アルプスとも呼ばれる、飛驒山脈・木曽山脈・赤石山脈をまとめて何というか。", choices:["日本アルプス","中国山地","奥羽山脈","九州山地"], a:0, e:"正解は「日本アルプス」です。飛驒山脈・木曽山脈・赤石山脈は標高の高い山々が連なることから、日本アルプスと呼ばれています。「奥羽山脈」は誤りで、これは東北地方を南北に走る山脈です。「中国山地」は誤りで、これは中国地方を東西に走る山地です。「九州山地」は誤りで、これは九州の中央部にある山地です。"},
  {id:"ngeo19", cat:"地理", sub:"日本地理", q:"梅雨や台風の影響を受けやすく、夏に降水量が多くなる日本の気候区分を何というか。", choices:["太平洋側の気候","瀬戸内の気候","日本海側の気候","内陸(中央高地)の気候"], a:0, e:"正解は「太平洋側の気候」です。太平洋側の気候は夏に梅雨や台風の影響を受けて降水量が多く、冬は乾燥した晴れの日が多いという特徴があります。「日本海側の気候」は誤りで、これは冬に北西の季節風の影響で雪が多く降る気候です。「内陸(中央高地)の気候」は誤りで、これは夏と冬の気温差が大きく、降水量が少ない気候です。「瀬戸内の気候」は誤りで、これは中国山地と四国山地に挟まれ、一年を通して降水量が少ない気候です。"},
  {id:"ngeo21", cat:"地理", sub:"日本地理", q:"冬に北西からの季節風の影響で雪が多く降る、新潟県など日本海側でみられる気候を何というか。", choices:["瀬戸内の気候","南西諸島の気候","日本海側の気候","太平洋側の気候"], a:2, e:"正解は「日本海側の気候」です。日本海側の気候は冬に大陸からの北西の季節風が日本海の水分を含んで雪雲となり、雪が多く降るという特徴があります。「太平洋側の気候」は誤りで、これは夏に雨が多く冬は乾燥する気候です。「瀬戸内の気候」は誤りで、これは一年を通して降水量が少ない気候です。「南西諸島の気候」は誤りで、これは一年を通して温暖な気候です。"},
  {id:"ngeo23", cat:"地理", sub:"日本地理", q:"山地から平地に川が流れ出るところに、土砂が扇形に積もってできる地形を何というか。", choices:["盆地","リアス海岸","扇状地","三角州"], a:2, e:"正解は「扇状地」です。扇状地は川が山地から平地に出るところで流れが急に緩やかになり、運んできた土砂が扇形に堆積してできる地形です。「三角州」は誤りで、これは川が海や湖に流れ込むところに土砂が堆積してできる地形です。「リアス海岸」は誤りで、これは山地が海に沈んでできた、複雑に入り組んだ海岸地形です。「盆地」は誤りで、これは周りを山に囲まれた平らな低地です。"},
  {id:"ngeo25", cat:"地理", sub:"日本地理", q:"川が海に流れ込むところに、細かい土砂が積もってできる平らな地形を何というか。", choices:["扇状地","リアス海岸","三角州","台地"], a:2, e:"正解は「三角州」です。三角州は川が海や湖に流れ込むあたりで流れが弱まり、細かい土砂が堆積してできる平らな地形で、水田などに利用されます。「扇状地」は誤りで、これは山地の出口にできる扇形の地形です。「台地」は誤りで、これは周囲より一段高い平らな地形です。「リアス海岸」は誤りで、これは山地が沈んでできた入り組んだ海岸です。"},
  {id:"ngeo27", cat:"地理", sub:"日本地理", q:"三陸海岸などにみられる、山地が海に沈み込んで複雑に入り組んだ海岸地形を何というか。", choices:["砂浜海岸","リアス海岸","干潟","フィヨルド"], a:1, e:"正解は「リアス海岸」です。リアス海岸は起伏のある山地が海に沈み込んでできた、入り江と岬が入り組んだ複雑な海岸地形で、三陸海岸などが代表例です。「砂浜海岸」は誤りで、これは砂が堆積してできた単調な海岸です。「干潟」は誤りで、これは河口や内湾に土砂が堆積してできる、潮の満ち引きで陸になったり海になったりする地形です。「フィヨルド」は誤りで、これは氷河の侵食でできた、ノルウェーなどにみられる入り江です。"},
  {id:"ngeo29", cat:"地理", sub:"日本地理", q:"都市への人口集中によって過密の問題が生じる一方、農村や山間部で人口が減少する現象を何というか。", choices:["過密","スプロール現象","ドーナツ化現象","過疎"], a:3, e:"正解は「過疎」です。都市部への人口集中に対し、農村や山間部などで人口が大きく減少し生活が困難になる現象を過疎といいます。「過密」は誤りで、これは人口が集中しすぎて交通渋滞や住宅不足などの問題が生じる状態であり、過疎とは反対の現象です。「ドーナツ化現象」は誤りで、これは都市の中心部の人口が減り、郊外の人口が増える現象です。「スプロール現象」は誤りで、これは都市が郊外に無秩序に広がっていく現象です。"},
  {id:"ngeo31", cat:"地理", sub:"日本地理", q:"促成栽培によって、他の地域よりも早い時期に野菜を出荷する農業がさかんな、高知平野や宮崎平野の農業の特徴として正しいものはどれか。", choices:["野菜の栽培をまったく行わない","一年中同じ野菜だけを育てる","ビニールハウスなどを利用して野菜の生育を早める","雪や寒さを利用して野菜の生育を遅らせる"], a:2, e:"正解は「ビニールハウスなどを利用して野菜の生育を早める」です。促成栽培は温暖な気候とビニールハウスなどを活用して野菜の生育を早め、他の産地より早い時期に出荷する農業です。「雪や寒さを利用して野菜の生育を遅らせる」は誤りで、これは高原などで行われる抑制栽培の説明です。「一年中同じ野菜だけを育てる」は誤りで、促成栽培は出荷時期を早めることが目的であり、栽培品目を固定する意味ではありません。「野菜の栽培をまったく行わない」は誤りで、これは促成栽培の説明として成り立ちません。"},
  {id:"ngeo33", cat:"地理", sub:"日本地理", q:"京浜工業地帯、中京工業地帯、阪神工業地帯などが帯状に連なる、日本の主な工業地域が集中する地帯を何というか。", choices:["フォッサマグナ","太平洋ベルト","対馬海流","日本アルプス"], a:1, e:"正解は「太平洋ベルト」です。太平洋ベルトは関東地方から九州北部にかけて工業地帯・工業地域が帯状に連なる地域で、日本の工業生産の多くを占めています。「日本アルプス」は誤りで、これは本州中央部の高い山々をまとめた呼び名です。「フォッサマグナ」は誤りで、これは本州中央部を南北に走る大きな溝状の地形です。「対馬海流」は誤りで、これは日本海を流れる暖流です。"},
  {id:"ngeo35", cat:"地理", sub:"世界地理", q:"世界で最も高い山、エベレストがある山脈を何というか。", choices:["アンデス山脈","ヒマラヤ山脈","ロッキー山脈","アルプス山脈"], a:1, e:"正解は「ヒマラヤ山脈」です。ヒマラヤ山脈はアジア南部に連なる世界最高峰の山脈で、世界一高いエベレスト(約8,849メートル)があります。「アルプス山脈」は誤りで、これはヨーロッパ中南部にある山脈です。「ロッキー山脈」は誤りで、これは北アメリカ大陸にある山脈です。「アンデス山脈」は誤りで、これは南アメリカ大陸を南北に走る山脈です。"},
  {id:"ngeo37", cat:"地理", sub:"世界地理", q:"中央アジアと東アジアを東西に結び、絹や香辛料などが運ばれた古代からの交易路を何というか。", choices:["茶馬古道","パナマ運河","スエズ運河","シルクロード(絹の道)"], a:3, e:"正解は「シルクロード(絹の道)」です。シルクロードは中国とヨーロッパを結ぶ古代からの交易路で、絹をはじめとする多くの物産や文化が行き来しました。「スエズ運河」は誤りで、これはエジプトにある人工の運河です。「パナマ運河」は誤りで、これは中央アメリカのパナマにある人工の運河です。「茶馬古道」は誤りで、これは中国南西部からチベットなどに茶や馬を運んだ交易路です。"},
  {id:"ngeo39", cat:"地理", sub:"世界地理", q:"ヨーロッパの国々が経済や政治で協力するために結成した地域統合組織を何というか。", choices:["OPEC(石油輸出国機構)","ASEAN(東南アジア諸国連合)","EU(欧州連合)","NAFTA(北米自由貿易協定)"], a:2, e:"正解は「EU(欧州連合)」です。EUはヨーロッパの国々が経済や政治などで協力するために結成した地域統合組織で、多くの加盟国が共通通貨ユーロを使用しています。「ASEAN」は誤りで、これは東南アジアの国々が結成した地域協力組織です。「NAFTA」は誤りで、これはアメリカ・カナダ・メキシコによる自由貿易協定です。「OPEC」は誤りで、これは石油の産出国が結成した組織です。"},
  {id:"ngeo41", cat:"地理", sub:"世界地理", q:"東南アジアの国々が経済や政治、安全保障などで協力するために結成した地域協力組織を何というか。", choices:["ASEAN(東南アジア諸国連合)","APEC(アジア太平洋経済協力)","OPEC(石油輸出国機構)","EU(欧州連合)"], a:0, e:"正解は「ASEAN(東南アジア諸国連合)」です。ASEANはタイやインドネシアなど東南アジアの国々が経済・政治・安全保障などで協力するために結成した組織です。「EU」は誤りで、これはヨーロッパの国々による地域統合組織です。「APEC」は誤りで、これはアジア太平洋地域の国々による経済協力の枠組みです。「OPEC」は誤りで、これは石油産出国による組織です。"},
  {id:"ngeo43", cat:"地理", sub:"世界地理", q:"地球温暖化の主な原因とされる、二酸化炭素やメタンなど、熱を地表に閉じ込める働きを持つ気体を何というか。", choices:["温室効果ガス","光化学スモッグ","オゾン層破壊物質","酸性雨"], a:0, e:"正解は「温室効果ガス」です。二酸化炭素やメタンなどの温室効果ガスは熱を地表付近に閉じ込める働きがあり、その増加が地球温暖化の主な原因とされています。「酸性雨」は誤りで、これは大気汚染物質が雨に溶け込んで降る現象です。「オゾン層破壊物質」は誤りで、これはフロンガスなどオゾン層を壊す物質を指し、地球温暖化とは別の環境問題に関わります。「光化学スモッグ」は誤りで、これは大気汚染によって発生する健康被害を伴う現象です。"},
  {id:"ngeo45", cat:"地理", sub:"世界地理", q:"太陽光・風力・地熱などのように、資源が枯渇せず繰り返し利用できるエネルギーを何というか。", choices:["原子力エネルギー","再生可能エネルギー","化石燃料","有限エネルギー"], a:1, e:"正解は「再生可能エネルギー」です。太陽光・風力・地熱・水力などは資源が枯渇せず繰り返し利用できることから、再生可能エネルギーと呼ばれます。「化石燃料」は誤りで、これは石油・石炭・天然ガスなど、埋蔵量に限りがある燃料です。「原子力エネルギー」は誤りで、これはウランなどを燃料として利用するエネルギーであり、一般に再生可能エネルギーには分類されません。「有限エネルギー」は誤りで、これは一般的な用語としては化石燃料などを指す表現であり、太陽光などの説明としては誤りです。"},
  {id:"ngeo47", cat:"地理", sub:"世界地理", q:"農業・林業・漁業のように、自然から直接資源を得る産業をまとめて何というか。", choices:["第三次産業","サービス業","第二次産業","第一次産業"], a:3, e:"正解は「第一次産業」です。農業・林業・漁業のように自然から直接資源を得る産業を第一次産業といいます。「第二次産業」は誤りで、これは工業や建設業のように、資源を加工してものをつくる産業です。「第三次産業」は誤りで、これは商業やサービス業など、ものの生産に直接関わらない産業です。「サービス業」は誤りで、これは第三次産業の一部を指す言葉です。"},
  {id:"ngeo49", cat:"地理", sub:"世界地理", q:"工業製品を生産する製造業や建設業など、資源を加工してものをつくる産業をまとめて何というか。", choices:["第一次産業","情報産業","第三次産業","第二次産業"], a:3, e:"正解は「第二次産業」です。製造業や建設業のように原材料を加工してものをつくる産業を第二次産業といいます。「第一次産業」は誤りで、これは農業・林業・漁業など自然から直接資源を得る産業です。「第三次産業」は誤りで、これは商業やサービス業など、ものの生産に直接関わらない産業です。「情報産業」は誤りで、これは一般に第三次産業に分類される産業の一つです。"},
  {id:"ngeo51", cat:"地理", sub:"世界地理", q:"地震や津波、洪水などの自然災害が発生した場合の被害の範囲や避難場所などを示した地図を何というか。", choices:["路線図","地形図","ハザードマップ","天気図"], a:2, e:"正解は「ハザードマップ」です。ハザードマップは地震・津波・洪水などの自然災害が発生した場合に予想される被害の範囲や、避難場所・避難経路などを示した地図です。「地形図」は誤りで、これは土地の高低や道路・建物などを表した一般的な地図です。「天気図」は誤りで、これは気圧配置や前線などを表した図です。「路線図」は誤りで、これは鉄道などの路線を示した図です。"},
  {id:"ngeo53", cat:"地理", sub:"世界地理", q:"地図上で、同じ高さの地点を結んだ線を何というか。", choices:["緯線","経線","海岸線","等高線"], a:3, e:"正解は「等高線」です。等高線は地形図上で同じ標高の地点を結んだ線で、間隔が狭いほど傾斜が急であることを示します。「経線」は誤りで、これは同じ経度の地点を結んだ線です。「緯線」は誤りで、これは同じ緯度の地点を結んだ線です。「海岸線」は誤りで、これは陸地と海の境界を示す線です。"},
  {id:"ngeo55", cat:"地理", sub:"世界地理", q:"発展途上国の生産者が公正な価格で取り引きできるようにする貿易のしくみを何というか。", choices:["保護貿易","自由貿易","フェアトレード","ブロック経済"], a:2, e:"正解は「フェアトレード」です。フェアトレードは発展途上国でつくられた農産物や製品を、生産者の生活が成り立つ公正な価格で取り引きするしくみです。「自由貿易」は誤りで、これは関税などの制限を設けずに自由に貿易を行うことを指す一般的な用語です。「ブロック経済」は誤りで、これは特定の国々の間でのみ経済的な結びつきを強め、他国を締め出す政策です。「保護貿易」は誤りで、これは関税などによって自国の産業を保護する貿易政策です。"},
  {id:"ngeo57", cat:"地理", sub:"世界地理", q:"2015年に国連総会で採択された、2030年までの達成を目指す17の目標からなる国際的な取り組みを何というか。", choices:["ODA(政府開発援助)","SDGs(持続可能な開発目標)","NGO(非政府組織)","NPT(核拡散防止条約)"], a:1, e:"正解は「SDGs(持続可能な開発目標)」です。SDGsは貧困の解消や環境保護など、2030年までに達成を目指す17の目標からなる国際的な取り組みです。「ODA」は誤りで、これは先進国が発展途上国に行う政府ベースの援助です。「NPT」は誤りで、これは核兵器の拡散を防ぐための条約です。「NGO」は誤りで、これは政府から独立して活動する民間の組織です。"},
  {id:"ngeo59", cat:"地理", sub:"日本地理", q:"日本の国土の面積のうち、山地が占める割合はおよそどれくらいか。", choices:["約4分の1","約4分の3","ほぼ0","約2分の1"], a:1, e:"正解は「約4分の3」です。日本の国土はおよそ4分の3が山地・丘陵地であり、平地は国土の一部にすぎません。「約4分の1」は誤りで、これはむしろ平地の割合に近い数字です。「約2分の1」は誤りで、実際の山地の割合はこれよりも大きくなっています。「ほぼ0」は誤りで、日本は世界的にみても山地の割合が高い国です。"},
  {id:"ngeo61", cat:"地理", sub:"日本地理", q:"東京・大阪・名古屋を中心とする、人口や産業が集中している三つの都市圏をまとめて何というか。", choices:["政令指定都市","三大都市圏","地方中枢都市","太平洋ベルト"], a:1, e:"正解は「三大都市圏」です。東京・大阪・名古屋を中心とする東京大都市圏・大阪大都市圏・名古屋大都市圏をまとめて三大都市圏といい、日本の人口や産業が集中しています。「太平洋ベルト」は誤りで、これは工業地帯・地域が帯状に連なる地域を指す言葉です。「政令指定都市」は誤りで、これは人口が多く一定の要件を満たした都市に与えられる指定です。「地方中枢都市」は誤りで、これは札幌・仙台・広島・福岡など各地方の中心となる都市です。"},
  {id:"ngeo63", cat:"地理", sub:"日本地理", q:"日本が多くの原油を輸入している、西アジアに位置する地域を何というか。", choices:["東南アジア","北ヨーロッパ","南アメリカ","中東(西アジア)"], a:3, e:"正解は「中東(西アジア)」です。日本は原油の多くをサウジアラビアやアラブ首長国連邦など中東(西アジア)の産油国から輸入しています。「東南アジア」は誤りで、これは日本にとって工業製品や農産物の貿易が多い地域です。「南アメリカ」は誤りで、これは鉄鉱石などの輸入で関わりが深い地域です。「北ヨーロッパ」は誤りで、これは原油の主要な輸入先ではありません。"},
  {id:"ngeo65", cat:"地理", sub:"世界地理", q:"世界で最も面積が広い国はどこか。", choices:["アメリカ合衆国","ロシア","カナダ","中国"], a:1, e:"正解は「ロシア」です。ロシアはユーラシア大陸の北部に広がる世界最大の面積を持つ国です。「カナダ」は誤りで、これは世界で2番目に面積が広い国です。「中国」は誤りで、これも面積の広い国の一つですが、ロシアには及びません。「アメリカ合衆国」は誤りで、これも面積の広い国ですが、世界最大ではありません。"},
  {id:"ngeo67", cat:"地理", sub:"世界地理", q:"世界で最も人口が多い大陸はどこか。", choices:["北アメリカ","アフリカ","アジア","ヨーロッパ"], a:2, e:"正解は「アジア」です。アジアは世界の人口の半数以上が集中する、世界で最も人口の多い大陸です。「アフリカ」は誤りで、これも人口増加が著しい大陸ですが、総人口ではアジアに及びません。「ヨーロッパ」は誤りで、これは人口の伸びが比較的緩やかな大陸です。「北アメリカ」は誤りで、これもアジアに比べると人口は少ない大陸です。"},
  {id:"ngeo69", cat:"地理", sub:"世界地理", q:"中緯度地域で一年を通してほぼ西から東へ吹く風を何というか。", choices:["貿易風","偏西風","季節風","極東風"], a:1, e:"正解は「偏西風」です。偏西風は中緯度地域を中心に一年を通してほぼ西から東へ吹く風で、ヨーロッパの気候などに大きな影響を与えています。「季節風」は誤りで、これは季節によって吹く方向が変わる風です。「貿易風」は誤りで、これは低緯度地域で吹く風です。「極東風」は誤りで、これは一般的な気候用語としては用いられません。"},
  {id:"ngeo71", cat:"地理", sub:"世界地理", q:"石油輸出国が生産量や価格について協議するために結成した組織を何というか。", choices:["WTO(世界貿易機関)","OECD(経済協力開発機構)","IMF(国際通貨基金)","OPEC(石油輸出国機構)"], a:3, e:"正解は「OPEC(石油輸出国機構)」です。OPECは主要な産油国が集まり、原油の生産量や価格について協議するために結成した組織です。「OECD」は誤りで、これは先進国を中心とした経済協力のための国際機関です。「IMF」は誤りで、これは国際的な通貨・金融の安定を目的とする機関です。「WTO」は誤りで、これは自由貿易の推進を目的とする国際機関です。"},
  {id:"ngeo73", cat:"地理", sub:"世界地理", q:"火山の噴火などによる陥没でできる、大きくくぼんだ地形を何というか。", choices:["扇状地","盆地","カルデラ","三角州"], a:2, e:"正解は「カルデラ」です。カルデラは火山の噴火にともなう陥没などによってできる大きなくぼ地で、阿蘇山などが代表例です。「扇状地」は誤りで、これは川が山地から平地に出るところにできる地形です。「三角州」は誤りで、これは川の河口付近にできる地形です。「盆地」は誤りで、これは周囲を山に囲まれた低地全般を指し、火山活動によってできるとは限りません。"},
  {id:"ngeo75", cat:"地理", sub:"世界地理", q:"世界の造山帯のうち、日本列島が含まれ、地震や火山活動が活発な造山帯を何というか。", choices:["楯状地","アルプス・ヒマラヤ造山帯","環太平洋造山帯","安定陸塊"], a:2, e:"正解は「環太平洋造山帯」です。日本列島は太平洋を取り巻くように連なる環太平洋造山帯に位置し、地震や火山活動が活発です。「アルプス・ヒマラヤ造山帯」は誤りで、これはヨーロッパから南アジアにかけて連なる別の造山帯です。「安定陸塊」は誤りで、これは地殻変動の少ない古い大陸の中心部を指します。「楯状地」は誤りで、これも安定陸塊の一種であり、日本列島とは地形の性質が異なります。"},
  /* 公民 */
  {id:"nciv01", cat:"公民", sub:"政治体制", q:"日本国憲法の三つの基本原則は、国民主権、平和主義とあと一つは何か。", choices:["基本的人権の尊重","法の下の平等","地方自治","三権分立"], a:0, e:"正解は「基本的人権の尊重」です。日本国憲法は国民主権・基本的人権の尊重・平和主義を三大原則としています。「三権分立」は誤りで、これは権力の濫用を防ぐしくみであり、三大原則そのものとは区別されます。「地方自治」は誤りで、これも憲法が定める重要な仕組みですが、三大原則には含まれません。「法の下の平等」は誤りで、これは基本的人権の一つの内容であり、三大原則そのものではありません。"},
  {id:"nciv03", cat:"公民", sub:"政治体制", q:"日本国憲法の改正を国会が発議するために必要な賛成の割合として正しいものはどれか。", choices:["衆参各議院の出席議員の過半数","衆参各議院の総議員の3分の2以上","衆議院のみの3分の2以上","内閣の全会一致"], a:1, e:"正解は「衆参各議院の総議員の3分の2以上」です。憲法改正の発議には、衆議院・参議院それぞれで総議員の3分の2以上の賛成が必要とされています。「衆参各議院の出席議員の過半数」は誤りで、これは通常の法律の議決に必要な要件です。「衆議院のみの3分の2以上」は誤りで、憲法改正には衆参両院での賛成が必要です。「内閣の全会一致」は誤りで、憲法改正は国会が発議する手続きであり、内閣の議決ではありません。"},
  {id:"nciv05", cat:"公民", sub:"政治体制", q:"憲法改正の国会での発議の後、最終的に改正を決めるために行われる手続きを何というか。", choices:["内閣の閣議決定","最高裁判所の審査","天皇の裁可","国民投票"], a:3, e:"正解は「国民投票」です。憲法改正は国会の発議の後、国民投票にかけられ、有効投票の過半数の賛成で承認されます。「内閣の閣議決定」は誤りで、憲法改正の最終的な決定は内閣ではなく国民の投票によって行われます。「最高裁判所の審査」は誤りで、これは法律が憲法に違反していないかを審査する違憲審査権の説明であり、憲法改正の手続きではありません。「天皇の裁可」は誤りで、天皇は国民が承認した憲法改正を公布する役割を持ちますが、決定するのは国民です。"},
  {id:"nciv07", cat:"公民", sub:"政治体制", q:"日本の国会において、衆議院と参議院の任期の違いとして正しいものはどれか。", choices:["両院とも4年で同じ","両院とも6年で同じ","衆議院は6年、参議院は4年","衆議院は4年、参議院は6年"], a:3, e:"正解は「衆議院は4年、参議院は6年」です。衆議院議員の任期は4年(解散があれば短くなる)、参議院議員の任期は6年で、3年ごとに半数が改選されます。「衆議院は6年、参議院は4年」は誤りで、任期の長さが逆になっています。「両院とも4年で同じ」「両院とも6年で同じ」は誤りで、衆参で任期の長さは異なります。"},
  {id:"nciv09", cat:"公民", sub:"政治体制", q:"衆議院と参議院の議決が異なる場合に、多くの場合は衆議院の議決が優先されることを何というか。", choices:["三権分立","二院制","衆議院の優越","国政調査権"], a:2, e:"正解は「衆議院の優越」です。衆議院は参議院よりも任期が短く解散もあるため国民の意思をより反映しやすいとされ、法律案の議決などで衆議院の優越が認められています。「三権分立」は誤りで、これは立法・行政・司法の権力を分ける仕組みです。「二院制」は誤りで、これは国会が衆議院と参議院の二つの議院からなる制度そのものを指す言葉です。「国政調査権」は誤りで、これは国会が国の政治について調査できる権限です。"},
  {id:"nciv11", cat:"公民", sub:"政治体制", q:"内閣総理大臣はどのようにして選ばれるか。", choices:["最高裁判所長官が任命する","国会議員の中から国会の議決で指名される","国民の直接選挙で選ばれる","天皇が任意に任命する"], a:1, e:"正解は「国会議員の中から国会の議決で指名される」です。内閣総理大臣は国会議員の中から、国会の議決によって指名され、天皇が任命します。「国民の直接選挙で選ばれる」は誤りで、日本ではアメリカの大統領のような国民の直接選挙による選出は行われていません。「天皇が任意に任命する」は誤りで、天皇は国会の指名に基づいて形式的に任命するのみです。「最高裁判所長官が任命する」は誤りで、最高裁判所長官の任命は内閣の指名に基づき天皇が行うものであり、逆の関係です。"},
  {id:"nciv13", cat:"公民", sub:"政治体制", q:"内閣が国会の信任を失ったとき、内閣が取りうる対応として憲法に定められているものはどれか。", choices:["何もせず政治を続ける","天皇に統治を委ねる","衆議院の解散か内閣総辞職","国会を廃止する"], a:2, e:"正解は「衆議院の解散か内閣総辞職」です。内閣不信任案が可決された場合、内閣は10日以内に衆議院を解散するか、総辞職しなければならないと憲法で定められています。「何もせず政治を続ける」は誤りで、これは憲法の規定に反します。「国会を廃止する」は誤りで、内閣に国会を廃止する権限はありません。「天皇に統治を委ねる」は誤りで、日本国憲法のもとで天皇は政治的な権能を持ちません。"},
  {id:"nciv15", cat:"公民", sub:"政治体制", q:"法律や政治が憲法に違反していないかを審査する権限を持つ、司法の頂点にある機関はどこか。", choices:["会計検査院","内閣","国会","最高裁判所"], a:3, e:"正解は「最高裁判所」です。最高裁判所は法律や政治が憲法に違反していないかを最終的に判断する権限(違憲審査権)を持つことから「憲法の番人」とも呼ばれます。「国会」は誤りで、これは立法権を担う機関です。「内閣」は誤りで、これは行政権を担う機関です。「会計検査院」は誤りで、これは国の収入・支出を検査する機関です。"},
  {id:"nciv17", cat:"公民", sub:"政治体制", q:"裁判を慎重に行い誤りを防ぐため、同じ事件について3回まで裁判を受けられる制度を何というか。", choices:["裁判員制度","二院制","三審制","三権分立"], a:2, e:"正解は「三審制」です。三審制は裁判の誤りを防ぎ人権を守るため、一つの事件について最大3回まで裁判を受けられる制度です。「三権分立」は誤りで、これは立法・行政・司法の権力を分けるしくみです。「二院制」は誤りで、これは国会が二つの議院からなる制度です。「裁判員制度」は誤りで、これは国民が刑事裁判に参加する制度です。"},
  {id:"nciv19", cat:"公民", sub:"政治体制", q:"国民が刑事裁判に参加し、裁判官とともに有罪・無罪や刑の重さを判断する制度を何というか。", choices:["国民審査","裁判員制度","住民投票","三審制"], a:1, e:"正解は「裁判員制度」です。裁判員制度は2009年から始まった制度で、くじで選ばれた国民が裁判員として重大な刑事裁判に参加し、裁判官とともに判断を行います。「三審制」は誤りで、これは3回まで裁判を受けられる制度です。「国民審査」は誤りで、これは最高裁判所の裁判官がふさわしいかどうかを国民が審査する制度です。「住民投票」は誤りで、これは地方自治体の重要な問題について住民が投票する制度です。"},
  {id:"nciv21", cat:"公民", sub:"政治体制", q:"地方自治において、住民が一定数の署名を集めることで条例の制定・改廃などを求めることができる権利を何というか。", choices:["直接請求権","請願権","違憲審査権","国政調査権"], a:0, e:"正解は「直接請求権」です。直接請求権は住民が一定数の署名を集めることで、条例の制定・改廃や議会の解散、首長・議員の解職などを求めることができる権利です。「国政調査権」は誤りで、これは国会が持つ調査の権限です。「違憲審査権」は誤りで、これは裁判所が持つ権限です。「請願権」は誤りで、これは国や地方に要望を伝える権利であり、直接請求権とは制度が異なります。"},
  {id:"nciv23", cat:"公民", sub:"政治体制", q:"選挙の基本原則のうち、財産や性別などに関係なく満18歳以上のすべての国民に選挙権を認める原則を何というか。", choices:["平等選挙","普通選挙","秘密選挙","直接選挙"], a:1, e:"正解は「普通選挙」です。普通選挙は財産や性別などによる制限を設けず、一定年齢に達したすべての国民に選挙権を認める原則です。「平等選挙」は誤りで、これは一人一票、一票の価値を平等にする原則です。「秘密選挙」は誤りで、これは誰に投票したかを他人に知られないようにする原則です。「直接選挙」は誤りで、これは有権者が直接候補者に投票する原則です。"},
  {id:"nciv25", cat:"公民", sub:"政治体制", q:"一つの選挙区から一人の代表を選出する選挙制度を何というか。", choices:["比例代表制","中選挙区制","小選挙区制","大選挙区制"], a:2, e:"正解は「小選挙区制」です。小選挙区制は一つの選挙区から一人の代表を選ぶ制度で、日本の衆議院議員選挙などに採用されています。「比例代表制」は誤りで、これは政党の得票数に応じて議席を配分する制度です。「大選挙区制」は誤りで、これは一つの選挙区から複数の代表を選ぶ制度です。「中選挙区制」は誤りで、これはかつて衆議院議員選挙で採用されていた、大選挙区制の一種です。"},
  {id:"nciv27", cat:"公民", sub:"政治体制", q:"政党の得票数に応じて議席を配分する選挙制度を何というか。", choices:["大選挙区制","小選挙区制","比例代表制","首長選挙"], a:2, e:"正解は「比例代表制」です。比例代表制は政党の得票数に応じて議席を配分する選挙制度で、小さな政党の意見も議席に反映されやすいという特徴があります。「小選挙区制」は誤りで、これは一つの選挙区から一人の代表を選ぶ制度です。「大選挙区制」は誤りで、これは一つの選挙区から複数の代表を選ぶ制度です。「首長選挙」は誤りで、これは地方自治体の長を選ぶ選挙であり、選挙制度の分類名ではありません。"},
  {id:"nciv29", cat:"公民", sub:"労働・法律", q:"労働者に認められている団結権・団体交渉権・団体行動権をまとめて何というか。", choices:["自由権","参政権","労働三権","社会権"], a:2, e:"正解は「労働三権」です。労働者が労働組合をつくる団結権、使用者と交渉する団体交渉権、ストライキなどを行う団体行動権をまとめて労働三権といいます。「社会権」は誤りで、これは生存権や教育を受ける権利など、より広い範囲の権利を指す言葉です。「自由権」は誤りで、これは国から不当に制限されない権利の総称です。「参政権」は誤りで、これは政治に参加する権利です。"},
  {id:"nciv31", cat:"公民", sub:"労働・法律", q:"労働条件の最低基準として、労働時間や休日などを定めた法律を何というか。", choices:["男女雇用機会均等法","労働基準法","労働組合法","労働関係調整法"], a:1, e:"正解は「労働基準法」です。労働基準法は労働時間や休日、賃金などについて労働条件の最低基準を定めた法律です。「労働組合法」は誤りで、これは労働者が労働組合をつくる権利などを保障する法律です。「労働関係調整法」は誤りで、これは労働争議の予防や解決について定めた法律です。「男女雇用機会均等法」は誤りで、これは雇用における男女の差別を禁止する法律です。"},
  {id:"nciv33", cat:"公民", sub:"労働・法律", q:"雇用の場面における性別による差別を禁止することを目的とした法律を何というか。", choices:["育児・介護休業法","男女共同参画社会基本法","男女雇用機会均等法","労働基準法"], a:2, e:"正解は「男女雇用機会均等法」です。男女雇用機会均等法は募集・採用や昇進などにおける性別を理由とした差別を禁止することを目的とした法律です。「労働基準法」は誤りで、これは労働条件全般の最低基準を定めた法律です。「男女共同参画社会基本法」は誤りで、これは社会全体で男女が共に参画することを目指す基本法です。「育児・介護休業法」は誤りで、これは育児や介護のための休業について定めた法律です。"},
  {id:"nciv35", cat:"公民", sub:"経済", q:"市場において、商品の価格は主に何と何の関係によって決まるか。", choices:["需要と供給","貯蓄と投資","輸入と輸出","税金と補助金"], a:0, e:"正解は「需要と供給」です。市場経済では、買いたい人の量(需要)と売りたい人の量(供給)の関係によって、商品の価格が決まります。「輸入と輸出」は誤りで、これは貿易における財の流れを指す言葉であり、価格決定の一般的な仕組みそのものではありません。「貯蓄と投資」は誤りで、これは家計や企業の資金の使い方に関する概念です。「税金と補助金」は誤りで、これは政府による経済への介入手段であり、市場価格を決める基本的な原理ではありません。"},
  {id:"nciv37", cat:"公民", sub:"経済", q:"少数の企業が話し合って価格や生産量を取り決め、公正な競争を妨げる行為を何というか。", choices:["規制緩和","独占禁止","フェアトレード","カルテル"], a:3, e:"正解は「カルテル」です。カルテルは少数の企業が話し合って価格や生産量などを取り決め、公正な競争を妨げる行為で、独占禁止法によって禁止されています。「フェアトレード」は誤りで、これは発展途上国の生産者を支える公正な貿易のしくみです。「独占禁止」は誤りで、これはカルテルなどを規制する政策の名称であり、行為そのものの名前ではありません。「規制緩和」は誤りで、これは政府による規制を減らす政策です。"},
  {id:"nciv39", cat:"公民", sub:"経済", q:"企業間の公正で自由な競争を守るため、カルテルなどを取り締まる法律を何というか。", choices:["独占禁止法","労働基準法","消費者基本法","製造物責任法(PL法)"], a:0, e:"正解は「独占禁止法」です。独占禁止法は企業間の公正で自由な競争を守るため、カルテルなどの不公正な取り引きを取り締まる法律です。「労働基準法」は誤りで、これは労働条件の最低基準を定めた法律です。「消費者基本法」は誤りで、これは消費者の権利を守るための基本的な法律です。「製造物責任法(PL法)」は誤りで、これは欠陥商品による被害の救済について定めた法律です。"},
  {id:"nciv41", cat:"公民", sub:"経済", q:"独占禁止法の目的にそって、企業の公正な競争を監視する行政機関を何というか。", choices:["国税庁","消費者庁","中央銀行","公正取引委員会"], a:3, e:"正解は「公正取引委員会」です。公正取引委員会は独占禁止法にもとづき、企業間の公正な競争を監視・確保する役割を持つ行政機関です。「消費者庁」は誤りで、これは消費者の利益を守るために設置された行政機関です。「国税庁」は誤りで、これは税金の徴収などを担当する行政機関です。「中央銀行」は誤りで、これは日本銀行のように通貨や金融の調整を担う機関です。"},
  {id:"nciv43", cat:"公民", sub:"経済", q:"税金を納める人と実際に負担する人が同じである税を何というか。", choices:["直接税","地方税のみ","法人税のみ","間接税"], a:0, e:"正解は「直接税」です。所得税や法人税のように、税金を納める人と実際に負担する人が同じである税を直接税といいます。「間接税」は誤りで、これは消費税のように税を納める人と実際に負担する人が異なる税です。「法人税のみ」は誤りで、直接税には所得税や相続税なども含まれ、法人税だけを指す言葉ではありません。「地方税のみ」は誤りで、直接税は国税にも地方税にも存在します。"},
  {id:"nciv45", cat:"公民", sub:"経済", q:"消費税のように、税金を納める人と実際に負担する人が異なる税を何というか。", choices:["累進税","直接税","財産税","間接税"], a:3, e:"正解は「間接税」です。消費税は商品を買った消費者が実質的に負担しますが、実際に税務署へ納めるのは事業者であるため、このような税を間接税といいます。「直接税」は誤りで、これは所得税のように納める人と負担する人が同じ税です。「累進税」は誤りで、これは所得が多いほど税率が高くなる課税方式を指す言葉です。「財産税」は誤りで、これは財産に対して課される税の総称です。"},
  {id:"nciv47", cat:"公民", sub:"経済", q:"病気やけが、老後の生活などに備えて、国民が保険料を出し合って支え合うしくみを何というか。", choices:["社会保険","公的扶助","公衆衛生","社会福祉"], a:0, e:"正解は「社会保険」です。社会保険は病気やけが、老後などに備えて国民が保険料を出し合い、必要なときに給付を受けられるようにするしくみで、医療保険や年金保険などがあります。「公的扶助」は誤りで、これは生活に困っている人に対して生活費などを支給する制度(生活保護など)です。「社会福祉」は誤りで、これは高齢者や障がいのある人などを支援するための制度です。「公衆衛生」は誤りで、これは感染症の予防など、国民の健康を守るための取り組みです。"},
  {id:"nciv49", cat:"公民", sub:"経済", q:"日本の社会保障制度を支える四つの柱は、社会保険、公的扶助、社会福祉とあと一つは何か。", choices:["国民年金","公衆衛生","医療保険","雇用保険"], a:1, e:"正解は「公衆衛生」です。日本の社会保障制度は社会保険・公的扶助・社会福祉・公衆衛生の四つの柱から成り立っています。「国民年金」は誤りで、これは社会保険の一部にあたる年金制度の名称であり、四つの柱の一つそのものではありません。「医療保険」は誤りで、これも社会保険に含まれる制度の一つです。「雇用保険」は誤りで、これも社会保険に含まれる制度の一つです。"},
  {id:"nciv51", cat:"公民", sub:"経済", q:"通貨の発行や金融政策を行う、日本の中央銀行を何というか。", choices:["日本政策金融公庫","日本銀行","証券取引所","財務省"], a:1, e:"正解は「日本銀行」です。日本銀行は日本の中央銀行として紙幣を発行し、景気や物価の安定をはかるための金融政策を行っています。「日本政策金融公庫」は誤りで、これは中小企業などへの融資を行う政府系の金融機関です。「証券取引所」は誤りで、これは株式などを売買する場です。「財務省」は誤りで、これは国の予算や税制を担当する行政機関であり、中央銀行ではありません。"},
  {id:"nciv53", cat:"公民", sub:"経済", q:"企業が株式を発行し、多くの人から資金を集めるしくみをとる会社を何というか。", choices:["独立行政法人","合同会社","株式会社","協同組合"], a:2, e:"正解は「株式会社」です。株式会社は株式を発行することで多くの人から資金を集め、事業に必要な元手(資本)を確保するしくみをとっています。「合同会社」は誤りで、これは出資者が経営にも直接関わる別の形態の会社です。「協同組合」は誤りで、これは組合員が出資し共同で事業を行う組織です。「独立行政法人」は誤りで、これは国の事業の一部を担う法人であり、株式会社とは異なる性質を持ちます。"},
  {id:"nciv55", cat:"公民", sub:"経済", q:"円の価値が外国通貨に対して高くなることを何というか。", choices:["円安","デフレーション","インフレーション","円高"], a:3, e:"正解は「円高」です。1ドル=100円から1ドル=90円になるなど、外国通貨に対して円の価値が高くなることを円高といい、輸入品を安く買える一方、輸出には不利にはたらきます。「円安」は誤りで、これは円の価値が外国通貨に対して低くなることです。「インフレーション」は誤りで、これは物価が継続的に上昇する現象です。「デフレーション」は誤りで、これは物価が継続的に下落する現象です。"},
  {id:"nciv57", cat:"公民", sub:"国際関係", q:"国際連合の中心機関で、すべての加盟国が参加し、一国一票の原則で議決を行う機関を何というか。", choices:["経済社会理事会","総会","安全保障理事会","国際司法裁判所"], a:1, e:"正解は「総会」です。総会はすべての加盟国が参加し、一国一票の原則で世界のさまざまな問題について話し合う国際連合の中心機関です。「安全保障理事会」は誤りで、これは常任理事国5か国と非常任理事国から構成される機関で、平和と安全の維持について強い権限を持ちます。「国際司法裁判所」は誤りで、これは国家間の紛争を法的に解決するための機関です。「経済社会理事会」は誤りで、これは経済・社会分野の国際協力を担当する機関です。"},
  {id:"nciv59", cat:"公民", sub:"国際関係", q:"国際連合の安全保障理事会で、常任理事国に認められている、1か国でも反対すると議決ができなくなる権限を何というか。", choices:["拒否権","違憲審査権","団体交渉権","国政調査権"], a:0, e:"正解は「拒否権」です。安全保障理事会の常任理事国(アメリカ・イギリス・フランス・ロシア・中国)は拒否権を持ち、1か国でも反対すると重要な議決を行うことができません。「違憲審査権」は誤りで、これは裁判所が持つ権限です。「国政調査権」は誤りで、これは国会が持つ権限です。「団体交渉権」は誤りで、これは労働者に認められた権利です。"},
  {id:"nciv61", cat:"公民", sub:"国際関係", q:"発展途上国に対して、先進国の政府が資金や技術の援助を行うことを何というか。", choices:["フェアトレード","NGO(非政府組織)","PKO(平和維持活動)","ODA(政府開発援助)"], a:3, e:"正解は「ODA(政府開発援助)」です。ODAは先進国の政府が発展途上国に対して資金や技術の援助を行うことで、日本も多くの国にODAを行っています。「NGO」は誤りで、これは政府から独立して活動する民間の組織です。「PKO」は誤りで、これは国連が紛争地域で行う平和維持活動です。「フェアトレード」は誤りで、これは発展途上国の生産者を支える貿易のしくみです。"},
  {id:"nciv63", cat:"公民", sub:"国際関係", q:"政府に属さず、民間の立場で国際的な援助や環境保護などの活動を行う組織を何というか。", choices:["NGO(非政府組織)","ODA(政府開発援助)","IMF(国際通貨基金)","WTO(世界貿易機関)"], a:0, e:"正解は「NGO(非政府組織)」です。NGOは政府から独立した民間の立場で、国際的な援助や環境保護などさまざまな分野で活動する組織です。「ODA」は誤りで、これは政府による発展途上国への援助です。「WTO」は誤りで、これは自由貿易を推進する国際機関です。「IMF」は誤りで、これは国際的な通貨・金融の安定を図る国際機関です。"},
  {id:"nciv65", cat:"公民", sub:"国際関係", q:"紛争が終わった地域で、国連が停戦の監視や選挙の支援などを行う活動を何というか。", choices:["PKO(平和維持活動)","NPT(核拡散防止条約)","ODA(政府開発援助)","NGO(非政府組織)"], a:0, e:"正解は「PKO(平和維持活動)」です。PKOは紛争が終わった地域などで、国連が停戦の監視や選挙の支援などを行い、平和の定着を助ける活動です。「ODA」は誤りで、これは政府による発展途上国への援助です。「NGO」は誤りで、これは民間の非政府組織です。「NPT」は誤りで、これは核兵器の拡散を防止する条約です。"},
  {id:"nciv67", cat:"公民", sub:"国際関係", q:"1997年に採択され、先進国に温室効果ガスの削減を義務づけた国際的な取り決めを何というか。", choices:["モントリオール議定書","ラムサール条約","京都議定書","パリ協定"], a:2, e:"正解は「京都議定書」です。京都議定書は1997年に京都で開かれた会議で採択され、先進国に対して温室効果ガスの削減を義務づけました。「パリ協定」は誤りで、これは2015年に採択され、先進国・途上国を問わずすべての参加国が削減目標を持つ枠組みです。「モントリオール議定書」は誤りで、これはオゾン層を破壊する物質の規制に関する取り決めです。「ラムサール条約」は誤りで、これは湿地の保全に関する条約です。"},

function insertTriviaBreaks(queue){
  const result = [];
  const usedTrivia = new Set();
  const pool = shuffle(TRIVIA.map(t=>t.id));
  let poolIdx = 0;
  for(let i=0;i<queue.length;i++){
    result.push(queue[i]);
    if((i+1) % 5 === 0 && i < queue.length - 1){

/* ==================== 正誤フィードバック(効果音+画面エフェクト) ==================== */
/* 称号のレベル(tier: 0〜7)が上がるほど、音色が豊かに・エフェクトが華やかになる */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume().catch(()=>{});
  }
  return audioCtx;
}
function playTone(freq, duration, type, delay, gainVal){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const startTime = ctx.currentTime + (delay || 0);
    gain.gain.setValueAtTime(gainVal !== undefined ? gainVal : 0.14, startTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.03);
  } catch(e){ /* 音声再生に失敗しても学習は継続できるようにする */ }
}
function playCorrectSound(tier){
  const baseFreq = 480 + tier * 24;
  const waveTypes = ['sine','sine','triangle','triangle','square','square','sawtooth','sine'];
  const type = waveTypes[tier] || 'sine';
  const noteCount = Math.min(2 + Math.floor(tier / 2), 5);
  const ratios = [1, 1.25, 1.5, 2, 2.5];
  const pattern = Math.floor(Math.random() * 3); // 同じレベル内でも3パターンをランダムに

  if(pattern === 0){
    // パターン1: 軽快な上昇アルペジオ
    for(let i=0;i<noteCount;i++){
      playTone(baseFreq * ratios[i], 0.13, type, i * 0.06, 0.13);
    }
  } else if(pattern === 1){
    // パターン2: 和音を重ねてからスパークル
    for(let i=0;i<Math.min(noteCount,3);i++){
      playTone(baseFreq * ratios[i], 0.22, type, 0, 0.09);
    }
    playTone(baseFreq * 2, 0.15, 'sine', 0.16, 0.10);
  } else {
    // パターン3: はねるようなバウンド音形
    const bounce = [0, 1, 0.5, 2];
    for(let i=0;i<Math.min(noteCount+1,4);i++){
      playTone(baseFreq * ratios[bounce[i] !== undefined ? Math.floor(bounce[i]) : 0], 0.11, type, i * 0.08, 0.12);
    }
  }
  if(tier >= 6){
    playTone(baseFreq * 3, 0.2, 'sine', 0.32, 0.10);
    playTone(baseFreq * 4, 0.15, 'sine', 0.42, 0.07);
  }
}
function playWrongSound(tier){
  const baseFreq = 220 - tier * 6;
  const waveTypes = ['square','square','sawtooth','sawtooth','triangle','triangle','sine','sine'];
  const type = waveTypes[tier] || 'square';
  const pattern = Math.floor(Math.random() * 3); // 同じレベル内でも3パターンをランダムに

  if(pattern === 0){
    // パターン1: 2音の落ち込みブザー
    playTone(baseFreq, 0.16, type, 0, 0.11);
    playTone(baseFreq * 0.75, 0.18, type, 0.11, 0.09);
  } else if(pattern === 1){
    // パターン2: 3音の下降ラン
    playTone(baseFreq * 1.2, 0.09, type, 0, 0.1);
    playTone(baseFreq, 0.09, type, 0.08, 0.1);
    playTone(baseFreq * 0.8, 0.16, type, 0.16, 0.1);
  } else {
    // パターン3: 単発の低いブザー音
    playTone(baseFreq * 0.85, 0.28, type, 0, 0.12);
  }
}

        setTimeout(() => card.classList.remove('fx-glitch'), 380);
      } else {
        card.classList.add('fx-dropshake');
        setTimeout(() => card.classList.remove('fx-dropshake'), 450);
      }
    }
  }
}
function triggerFeedback(isCorrect){

/* ==================== 問題文の読み上げ(Web Speech API) ==================== */
let cachedVoices = [];
function refreshVoices(){
  if(!('speechSynthesis' in window)) return;
  try{ cachedVoices = window.speechSynthesis.getVoices() || []; } catch(e){ cachedVoices = []; }
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickJapaneseVoice(){
  if(!cachedVoices || cachedVoices.length === 0) refreshVoices();
  if(!cachedVoices || cachedVoices.length === 0) return null;
  return cachedVoices.find(v => v.lang === 'ja-JP')
    || cachedVoices.find(v => v.lang && v.lang.toLowerCase().indexOf('ja') === 0)
    || null;
}
function showSpeechToast(msg){
  let toast = document.getElementById('speech-toast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'speech-toast';
    toast.className = 'speech-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}
function doSpeakNow(text){
  try{
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 1.0;
    utter.pitch = 1.0;
    const voice = pickJapaneseVoice();
    if(voice) utter.voice = voice;
    utter.onerror = function(){
      showSpeechToast('🔇 読み上げに失敗しました。端末のミュート設定や音量をご確認ください。');
    };
    window.speechSynthesis.speak(utter);
  } catch(e){
    showSpeechToast('🔇 この端末・ブラウザでは読み上げ機能が利用できないようです。');
  }
}
function speakText(text){
  if(!('speechSynthesis' in window)){
    showSpeechToast('🔇 お使いのブラウザは読み上げ機能に対応していません。');
    return;
  }
  // すでに話している最中の場合は一旦止めてから、少し間をおいて再生する
  // (cancel直後に即speakすると再生されないブラウザがあるための対策)
  if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
    window.speechSynthesis.cancel();
    setTimeout(() => doSpeakNow(text), 80);
  } else {
    doSpeakNow(text);
  }
}
function speakCurrentQuestion(){
  if(!session) return;
  const qid = session.queue[session.pos];
  const q = lookupQ(qid);
  if(q) speakText(q.q);
}
function toggleAutoRead(){

function stopSpeaking(){

function qstat(id){
  if(!data.qstats[id]) data.qstats[id] = {asked:0, correct:0, wrong:0};
  return data.qstats[id];
}

/* ---- helpers ---- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmtDate(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function pickIds(pool, n){
  return shuffle(pool).slice(0, Math.min(n, pool.length));
}

let selectedChoice = null;
function selectChoice(idx){
  if(session.answered) return;
  session.selectedChoice = idx;
  submitAnswer();  // 自動的に回答
}
function toggleBookmark(){
  const qid = session.queue[session.pos];
  if(isTriviaId(qid)) return;
  const q = QMAP[qid];
  const idx = data.bookmarks.indexOf(q.id);
  if(idx >= 0) data.bookmarks.splice(idx, 1);
  else data.bookmarks.push(q.id);
  saveData();
  render();
}
function submitAnswer(){
  const s = session;
  const qid = s.queue[s.pos];
  const q = lookupQ(qid);
  if(s.selectedChoice === null) return;

  s.answered = true;
  const isCorrect = s.selectedChoice === s.currentCorrectPos;
  s.statusMap[q.id] = isCorrect ? 'correct' : 'wrong';
  triggerFeedback(isCorrect);

  if(isTriviaId(qid)){
    // 雑学問題は統計・正答率には影響させず、正解時に少額ボーナスのみ
    if(isCorrect){
      data.meta.points = (data.meta.points || 0) + 3;
      s.pointsEarned = (s.pointsEarned || 0) + 3;
    }
    saveData();
    render();
    return;
  }

  const alreadyAttempted = (q.id in s.firstAttempt);
  if(!alreadyAttempted){
    s.firstAttempt[q.id] = isCorrect ? 'correct' : 'wrong';
  }
  const isRetryAttempt = alreadyAttempted;

  const stat = qstat(q.id);
  stat.asked++;
  if(isCorrect) stat.correct++;
  else stat.wrong++;

  const beforeLevel = getTitle(data.meta.points || 0);
  if(isCorrect){
    const pts = isRetryAttempt ? 5 : 10;
    data.meta.points = (data.meta.points || 0) + pts;
    s.pointsEarned = (s.pointsEarned || 0) + pts;
  }
  const afterLevel = getTitle(data.meta.points || 0);
  s.leveledUp = afterLevel.name !== beforeLevel.name;
  s.newTitle = afterLevel.name;

  saveData();
  render();
}
function nextQuestion(){
  const s = session;
  s.totalAnswered++;
  stopSpeaking();

  if(s.pos < s.queue.length - 1){
    s.pos++;
    s.answered = false;
    s.selectedChoice = null;
    prepareCurrentQuestion(s);
    render();
  } else {
    // 元のセットを解き終えた時点で、間違えた問題が残っていれば一度だけ最後に再出題する
    if(!s.retriedWrongOnce){
      const wrongIds = Object.keys(s.firstAttempt).filter(id => s.firstAttempt[id] === 'wrong');
      s.retriedWrongOnce = true;
      if(wrongIds.length > 0){
        s.firstPassLength = s.queue.length;
        s.queue = s.queue.concat(shuffle(wrongIds));
        s.isRetryRound = true;
        s.pos++;
        s.answered = false;
        s.selectedChoice = null;
        prepareCurrentQuestion(s);
        render();
        return;
      }
    }
    endSession();
  }
}
function endSession(){
  const s = session;
  const firstAttemptValues = Object.values(s.firstAttempt);
  const correct = firstAttemptValues.filter(v => v === 'correct').length;
  const total = firstAttemptValues.length;
  const h = { date: new Date().toISOString(), mode: s.mode, correct, total, accuracy: Math.round(correct/total*100) };
  data.history.push(h);
  data.meta.currentStreak = correct === total ? (data.meta.currentStreak || 0) + 1 : 0;
  data.meta.bestStreak = Math.max(data.meta.bestStreak || 0, data.meta.currentStreak);
  saveData();
  sendParentNotification(h);
  session.lastResult = h;
  view = "clear";
  render();
}

      <div class="points-earned">
        <div class="pe-num">+${s.pointsEarned || 0}<span>pt</span></div>
        <div class="pe-label">今回の獲得ポイント</div>
      </div>
      ${s.leveledUp ? `
        <div class="level-up-banner">
          <div class="lu-icon">🎉</div>
          <div class="lu-text">称号アップ！<br><strong>「${s.newTitle}」</strong>になりました</div>
        </div>
      ` : ''}
      ${data.meta.notifyEnabled && data.meta.iftttKey ? '<div class="banner" style="text-align:center">📮 保護者への通知を送信しました</div>' : ''}
      <button class="btn" onclick="shareResult()">📤 結果を共有する</button>
      <button class="btn" onclick="startSession(session.setIds, session.mode)">もう一度解く</button>
      <button class="btn solid" onclick="goHome()">ホームに戻る</button>
    </div>
  `;
}

function renderHistory(){
  const items = data.history.slice().reverse().map((h,i) => `
    <div class="history-row">
      <div class="hr-top">
        <div>
          <div class="hr-mode">${h.mode}</div>
          <div class="hr-date">${fmtDate(h.date)}</div>
        </div>
        <div class="hr-score">${h.correct}/${h.total} (${h.accuracy}%)</div>
      </div>
    </div>
  `).join('');

  const catStats = {};
  CATS.forEach(cat => {
    const ids = QUESTIONS.filter(q=>q.cat===cat).map(q=>q.id);
    let correct=0, asked=0;
    ids.forEach(id=>{ const st = data.qstats[id]; if(st){asked+=st.asked; correct+=st.correct;} });
    const acc = asked > 0 ? Math.round(correct/asked*100) : null;
    catStats[cat] = { asked, correct, acc };
  });

  const bars = CATS.map(cat => {
    const s = catStats[cat];
    const pct = s.acc || 0;
    return `<div class="barrow">
      <div class="label">${cat}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:var(--c-${getColorClass(cat)})"></div></div>
      <div class="pct">${s.acc === null ? '—' : s.acc+'%'}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    ${headerHtml()}
    <h2 style="font-family:'Noto Sans JP','Zen Kaku Gothic New',sans-serif;font-weight:700;margin:20px 0 12px">学習履歴</h2>
    <h3 style="color:var(--chalk-dim);font-size:.9rem;margin:0 0 16px">分野別成績</h3>
    ${bars}
    <h3 style="color:var(--chalk-dim);font-size:.9rem;margin:20px 0 16px">セット記録</h3>
    ${items.length === 0 ? '<div class="empty-note">記録がありません</div>' : items}
    <button class="btn ghost" onclick="goHome()">ホームに戻る</button>
  `;
}

function renderListCategories(){
  const cats = CATS.map(cat => `
    <div class="menu-item" onclick="listCategory='${cat}'; view='listQuestions'; render();">
      <div><div class="mi-title">${cat}</div></div>
      <div class="mi-arrow">→</div>
    </div>
  `).join('');

  app.innerHTML = `
    ${headerHtml()}
    <h2 style="font-family:'Noto Sans JP','Zen Kaku Gothic New',sans-serif;font-weight:700;margin:20px 0">分野を選ぶ</h2>
    <div class="menu-stack">${cats}</div>
    <button class="btn ghost" onclick="goHome()">ホームに戻る</button>
  `;
}

function renderListQuestions(){
  const questions = QUESTIONS.filter(q => q.cat === listCategory);
  const unitGroups = {};
  questions.forEach(q => {
    if(!unitGroups[q.sub]) unitGroups[q.sub] = [];
    unitGroups[q.sub].push(q);
  });

  const items = Object.entries(unitGroups).map(([unit, qs]) => {
    const isOpen = listOpenIds.has(unit);
    return `
      <div class="list-item">
        <div class="list-head" onclick="toggleOpen('${unit}')">
          <div class="list-q"><strong>${unit}</strong> (${qs.length}問)</div>
          <div class="list-arrow">${isOpen ? '▼' : '▶'}</div>
        </div>
        ${isOpen ? `<div class="list-body">${qs.map(q => {
          const st = data.qstats[q.id];
          const pct = st && st.asked > 0 ? Math.round(st.correct/st.asked*100) : null;
          return `<div style="margin-bottom:12px">
            <div style="font-size:.9rem;margin-bottom:6px">${q.q}</div>
            ${q.svg ? `<div class="q-diagram" style="margin:8px 0">${q.svg}</div>` : ''}
            <div class="list-choice correct" style="margin:0">${q.choices[q.a]}</div>
            <div style="font-size:.78rem;color:var(--chalk-dim);margin-top:4px">${pct === null ? '未出題' : st.correct+'/'+st.asked+' ('+pct+'%)'}</div>
            <div class="list-explain">${q.e}</div>
          </div>`;
        }).join('')}</div>` : ''}
      </div>
    `;
  }).join('');

  app.innerHTML = `
    ${headerHtml()}
    <h2 style="font-family:'Noto Sans JP','Zen Kaku Gothic New',sans-serif;font-weight:700;margin:20px 0">${listCategory}</h2>
    ${items}
    <button class="btn ghost" onclick="view='listCategories'; render()">分野選択に戻る</button>
    <button class="btn ghost" onclick="goHome()">ホームに戻る</button>
  `;
}

function toggleOpen(unit){
  if(listOpenIds.has(unit)) listOpenIds.delete(unit);
  else listOpenIds.add(unit);
  render();
}

/* ==================== 保護者への自動通知(IFTTT Webhooks連携) ==================== */
function renderNotifySettings(){
  const m = data.meta;
  app.innerHTML = `
    ${headerHtml()}
    <h2 style="font-family:'Noto Sans JP','Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:1.15rem;margin:20px 0 10px;color:#4A3B45">📮 保護者への通知設定</h2>
    <div class="advice" style="margin-top:0">
      <h3>🔧 使い方（最初に1回だけ設定）</h3>
      <p>無料サービス「IFTTT」を使うと、クイズを1セット終えるたびに保護者のスマホへ自動でプッシュ通知を送れます。</p>
      <p>① 保護者のスマホに無料アプリ「IFTTT」を入れ、アカウントを作成してもらう<br>
      ② IFTTTで「Webhooks」→「Notifications」を連携するアプレットを作成（"If Webhooks, then Notifications"）<br>
      ③ IFTTTの「Webhooks」設定ページで表示される、ご自身専用のWebhookキー（英数字の文字列）を確認する<br>
      ④ そのキーを下の欄に入力して保存し、「テスト送信」で通知が届くか確認する</p>
    </div>
    <div class="settings-field">
      <label class="settings-label">通知を有効にする</label>
      <button class="speak-toggle ${m.notifyEnabled ? 'on' : ''}" onclick="toggleNotifyEnabled()">${m.notifyEnabled ? 'ON' : 'OFF'}</button>
    </div>
    <div class="settings-field-col">
      <label class="settings-label">IFTTT Webhookキー</label>
      <input type="text" id="ifttt-key-input" class="settings-input" value="${(m.iftttKey||'').replace(/"/g,'&quot;')}" placeholder="例: dXXXXXXXXXXXXXXXXXXXX" />
    </div>
    <div class="settings-field-col">
      <label class="settings-label">イベント名（変更しなくてOK）</label>
      <input type="text" id="ifttt-event-input" class="settings-input" value="${(m.iftttEvent||'social_quiz_done').replace(/"/g,'&quot;')}" />
    </div>
    <button class="btn solid" onclick="saveNotifySettings()">💾 設定を保存する</button>
    <button class="btn" onclick="testNotify()">🔔 テスト送信してみる</button>
    <button class="btn ghost" onclick="goHome()">ホームに戻る</button>
  `;
}
function toggleNotifyEnabled(){
  data.meta.notifyEnabled = !data.meta.notifyEnabled;
  saveData();
  render();
}
function saveNotifySettings(){
  const keyEl = document.getElementById('ifttt-key-input');
  const evEl = document.getElementById('ifttt-event-input');
  const key = keyEl ? keyEl.value.trim() : '';
  const ev = (evEl ? evEl.value.trim() : '') || 'social_quiz_done';
  data.meta.iftttKey = key;
  data.meta.iftttEvent = ev;
  saveData();
  showSpeechToast('設定を保存しました！');
}
function buildNotifyMessage(h){
  return `📚 社会クイズ「${h.mode}」を終えました！正答率${h.accuracy}%（${h.correct}/${h.total}問）でした。`;
}
function sendParentNotification(h){
  if(!data.meta.notifyEnabled || !data.meta.iftttKey) return;
  const ev = data.meta.iftttEvent || 'social_quiz_done';
  const url = `https://maker.ifttt.com/trigger/${encodeURIComponent(ev)}/with/key/${encodeURIComponent(data.meta.iftttKey)}`;
  const msg = buildNotifyMessage(h);
  try{
    fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ value1: msg, value2: String(h.accuracy) + '%', value3: h.mode })
    }).catch(()=>{ /* 通知に失敗しても学習は問題なく続けられるようにする */ });
  } catch(e){ /* 同上 */ }
}
function testNotify(){
  const keyEl = document.getElementById('ifttt-key-input');
  const key = keyEl ? keyEl.value.trim() : (data.meta.iftttKey || '');
  if(!key){ showSpeechToast('先にWebhookキーを入力してください'); return; }
  const evEl = document.getElementById('ifttt-event-input');
  const ev = (evEl ? evEl.value.trim() : '') || data.meta.iftttEvent || 'social_quiz_done';
  const url = `https://maker.ifttt.com/trigger/${encodeURIComponent(ev)}/with/key/${encodeURIComponent(key)}`;
  fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ value1: '📚 社会クイズのテスト通知です！これが届けば設定は成功です。', value2: '100%', value3: 'テスト' })
  }).then(()=>{
    showSpeechToast('テスト通知を送信しました。保護者のスマホをご確認ください。');
  }).catch(()=>{
    showSpeechToast('送信に失敗しました。Webhookキーをご確認ください。');
  });
}
function shareResult(){
  if(!session) return;
  const h = session.lastResult || { mode: session.mode, correct: 0, total: 0, accuracy: 0 };
  const text = buildNotifyMessage(h);
  if(navigator.share){
    navigator.share({ text }).catch(()=>{});
  } else {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{
        showSpeechToast('結果をコピーしました。LINEなどに貼り付けて送れます。');
      }).catch(()=>{});
    }
  }
}

render();
</script>
</body>
</html>
