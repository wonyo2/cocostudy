  {id:"civ283", cat:"公民", sub:"経済", q:"関税などの貿易障壁をできるだけなくし、自由な貿易を行おうとする考え方を何というか。", choices:["自由貿易","保護貿易","加工貿易","計画貿易"], a:0, e:"正解は「自由貿易」です。自由貿易は関税などの貿易障壁をできるだけなくし、国境を越えた自由な取引を促進しようとする考え方です。「保護貿易」は誤りで、これは自国産業を守るため貿易に制限を課す政策であり、自由貿易とは正反対の方向性です。「加工貿易」は誤りで、これは原料輸入と製品輸出という貿易の形態を指す言葉であり、貿易政策の方向性を示す自由貿易とは異なる概念です。「計画貿易」は誤りで、これは一般的な用語として確立されておらず、誤った選択肢です。"},
  {id:"civ285", cat:"公民", sub:"国際関係", q:"特定の地域内の国々が経済的な結びつきを強めようとする動きを何というか。", choices:["地域主義","孤立主義","保護主義のみ","中立主義"], a:0, e:"正解は「地域主義」です。地域主義（リージョナリズム）はEUやASEANのように、特定の地域内の国々が経済的な結びつきを強めようとする動きです。「孤立主義」は誤りで、これは他国との関わりを避け自国内に閉じこもろうとする考え方であり、地域内の結びつきを強める地域主義とは正反対の方向性です。「保護主義のみ」は誤りで、これは自国産業を守るために貿易を制限する考え方を指し、地域内での協力を進める地域主義とは異なる概念です。「中立主義」は誤りで、これは特定の陣営に属さない立場を指す言葉であり、地域内の経済的結びつきを指す地域主義とは異なります。"},
  {id:"civ287", cat:"公民", sub:"国際関係", q:"二国間または複数国間で、関税撤廃だけでなく投資や人の移動なども含めて幅広く連携する協定を何というか。", choices:["経済連携協定（EPA）","独占禁止法","フェアトレード","モノカルチャー"], a:0, e:"正解は「経済連携協定（EPA）」です。経済連携協定（EPA）はFTA（自由貿易協定）に加え、投資や知的財産、人の移動なども含めた幅広い分野で連携する協定です。「独占禁止法」は誤りで、これは国内の企業間競争に関する法律であり、国家間の経済連携協定であるEPAとは全く異なる分野です。「フェアトレード」は誤りで、これは公正な貿易の仕組みを指す言葉であり、国家間の包括的な協定であるEPAとは異なる概念です。「モノカルチャー」は誤りで、これは特定の一次産品に依存する経済構造を指す言葉であり、EPAとは異なる概念です。"},
  {id:"civ289", cat:"公民", sub:"国際関係", q:"軍事力だけでなく、貧困や病気、環境破壊などから一人一人の生命や生活を守るという考え方を何というか。", choices:["人間の安全保障","集団安全保障","国家安全保障のみ","地域安全保障"], a:0, e:"正解は「人間の安全保障」です。人間の安全保障は、軍事的な脅威だけでなく貧困や病気、環境問題など、一人一人の生命や生活を脅かす要因から人々を守るという考え方です。「集団安全保障」は誤りで、これは複数の国が協力して安全保障を確保する国家間の仕組みを指す概念であり、個人に着目する人間の安全保障とは対象が異なります。「国家安全保障のみ」は誤りで、これは国家という単位での安全を重視する考え方であり、個人の生命・生活に着目する人間の安全保障とは視点が異なります。「地域安全保障」は誤りで、これは特定の地域における安全保障の枠組みを指す概念であり、個人に焦点を当てる人間の安全保障とは異なります。"},
  {id:"civ291", cat:"公民", sub:"国際関係", q:"自国が武力攻撃を受けていなくても、密接な関係にある他国への攻撃を自国への攻撃とみなして反撃する権利を何というか。", choices:["集団的自衛権","個別的自衛権","交戦権","国政調査権"], a:0, e:"正解は「集団的自衛権」です。集団的自衛権は、自国が直接攻撃されていなくても、密接な関係にある他国への攻撃に対して共同で防衛する権利です。「個別的自衛権」は誤りで、これは自国が直接攻撃を受けた場合に自国を防衛する権利であり、他国への攻撃に対応する集団的自衛権とは発動要件が異なります。「交戦権」は誤りで、これは戦争を行う権利を指す概念であり、日本国憲法第9条ではこれが否認されています。「国政調査権」は誤りで、これは国会が行政を調査する権限であり、防衛に関する集団的自衛権とは全く異なる分野の権限です。"},
  {id:"civ293", cat:"公民", sub:"国際関係", q:"自国が直接武力攻撃を受けた場合に、自国を防衛する権利を何というか。", choices:["個別的自衛権","集団的自衛権","交戦権","制裁権"], a:0, e:"正解は「個別的自衛権」です。個別的自衛権は、自国が直接武力攻撃を受けた場合に、自国を防衛するために行使できる権利です。「集団的自衛権」は誤りで、これは自国が直接攻撃されていなくても、密接な関係にある他国への攻撃に対して防衛行動をとる権利であり、個別的自衛権とは発動要件が異なります。「交戦権」は誤りで、これは戦争を行う権利を指す概念であり、日本国憲法では否認されています。「制裁権」は誤りで、これは一般的な自衛権の概念とは異なる言葉です。"},
  {id:"civ295", cat:"公民", sub:"経済", q:"生産、流通、消費など経済の一連のしくみにおいて、政府が経済活動に介入しすぎないようにする考え方を何というか。", choices:["自由主義経済","計画経済","統制経済","封建経済"], a:0, e:"正解は「自由主義経済」です。自由主義経済は市場メカニズムを重視し、政府が経済活動への介入をできるだけ抑える考え方にもとづく経済体制です。「計画経済」は誤りで、これは政府が生産・分配・価格を計画的に決定する経済体制であり、政府の介入を抑える自由主義経済とは正反対の考え方です。「統制経済」は誤りで、これも政府が経済活動を強く統制する体制であり、自由主義経済とは対照的です。「封建経済」は誤りで、これは中世の身分制にもとづく経済のあり方を指す言葉であり、現代の自由主義経済とは時代・性質が異なります。"},
  {id:"civ297", cat:"公民", sub:"経済", q:"国や政府が生産・分配・価格などを計画的に決定する経済体制を何というか。", choices:["計画経済","自由主義経済","市場経済のみ","混合経済のみ"], a:0, e:"正解は「計画経済」です。計画経済は国や政府が生産量や価格などを計画的に決定する経済体制で、旧ソ連などで採用されていました。「自由主義経済」は誤りで、これは市場メカニズムを重視し政府の介入を抑える経済体制であり、計画経済とは正反対の考え方です。「市場経済のみ」は誤りで、これは需要と供給によって価格が決まる経済のあり方を指し、政府が計画的に決定する計画経済とは仕組みが逆です。「混合経済のみ」は誤りで、これは市場経済と政府の介入を組み合わせた経済体制を指し、政府主導の計画経済とは異なる中間的な形態です。"},
  /* 日本史 */
  {id:"his307", cat:"日本史", sub:"平安時代", q:"摂関政治と最も似た性質を持つ、後の時代の政治形態はどれか。", choices:["鎌倉幕府の執権政治","平安時代の院政","江戸時代の幕藩体制","近代の立憲君主制"], a:0, e:"正解は「鎌倉幕府の執権政治」です。摂関政治は藤原氏が天皇の外戚として実権を握る仕組みで、将軍を補佐しつつ北条氏が実権を握った執権政治と構造的に似ています。「平安時代の院政」は誤りで、これは摂関政治とほぼ同じ平安時代に、天皇家自身（上皇）が実権を握った別の政治形態であり、摂関政治と対抗・交代する関係にあった仕組みです。「江戸時代の幕藩体制」は誤りで、これは将軍と大名が土地・人民を直接支配する体制であり、天皇の外戚が実権を握る摂関政治の構造とは異なります。「近代の立憲君主制」は誤りで、これは憲法にもとづき君主の権限が制限される近代的な政治体制であり、摂関政治の構造とは性質が異なります。"},
  {id:"his309", cat:"日本史", sub:"近代", q:"大政奉還と最も似た性質を持つ行為はどれか。", choices:["大名による版籍奉還","武士による廃刀令","農民による地租改正","西洋式の徴兵令"], a:0, e:"正解は「大名による版籍奉還」です。大政奉還が将軍から天皇へ政権を返上した行為であるのに対し、版籍奉還も大名が土地と人民を天皇に返上した点で似た性質を持ちます。「武士による廃刀令」は誤りで、これは武士が帯刀の慣習をやめることを求めた明治時代の法令であり、政権や土地の返上とは性質が異なります。「農民による地租改正」は誤りで、地租改正は税制改革であり、農民が何かを「返上」する行為ではありません。「西洋式の徴兵令」は誤りで、これは近代的な軍隊編成のための制度であり、政権や領地の返上とは全く異なる内容です。"},
  {id:"his311", cat:"日本史", sub:"現代", q:"五・一五事件と二・二六事件に共通する点として正しいものはどれか。", choices:["軍部の一部による武力での政治介入","江戸時代に起きた民衆一揆","外国勢力による日本占領行為","政党が主導した平和的改革"], a:0, e:"正解は「軍部の一部による武力での政治介入」です。両事件はいずれも軍部の一部の将校が要人を襲撃し、武力によって政治に介入しようとした事件です。「江戸時代に起きた民衆一揆」は誤りで、両事件はいずれも昭和初期（1930年代）に起こった軍部による事件であり、江戸時代の農民一揆とは時代・主体が異なります。「外国勢力による日本占領行為」は誤りで、両事件はいずれも日本国内の軍人による事件であり、外国勢力による占領行為ではありません。「政党が主導した平和的改革」は誤りで、両事件はむしろ政党政治を否定する方向の暴力的な事件であり、平和的な改革とは正反対の性質です。"},
  {id:"his313", cat:"日本史", sub:"鎌倉・室町", q:"応仁の乱と戦国時代の関係について正しく理解しているものはどれか。", choices:["乱をきっかけに戦国の争乱が始まった","乱は戦国時代の後に起こった","乱と戦国時代は無関係である","乱により戦国の争乱が終結した"], a:0, e:"正解は「乱をきっかけに戦国の争乱が始まった」です。応仁の乱により室町幕府の権威が大きく低下し、諸国で争いが続く戦国時代へと突入しました。「乱は戦国時代の後に起こった」は誤りで、事実とは正反対であり、応仁の乱（1467年）はむしろ戦国時代の「前」に起こり、そのきっかけとなった出来事です。「乱と戦国時代は無関係である」は誤りで、応仁の乱はまさに戦国時代突入の直接のきっかけとされる重要な出来事であり、無関係ではありません。「乱により戦国の争乱が終結した」は誤りで、これも事実と逆であり、応仁の乱は戦国の争乱を「終わらせた」のではなく「始めた」出来事です。"},
  {id:"his317", cat:"日本史", sub:"現代", q:"財閥解体と独占禁止法の共通の目的として正しいものはどれか。", choices:["経済の独占状態を解消すること","財閥の力をより強化すること","戦争継続の資金を集めること","地主から農地を取り上げること"], a:0, e:"正解は「経済の独占状態を解消すること」です。財閥解体も独占禁止法も、経済における独占状態を解消し、公正な競争を確保することを目的としています。「財閥の力をより強化すること」は誤りで、財閥解体はむしろ財閥の力を弱め解体することを目的としており、強化とは正反対の内容です。「戦争継続の資金を集めること」は誤りで、財閥解体・独占禁止法はいずれも戦後の経済民主化政策であり、戦争継続の資金調達とは無関係です。「地主から農地を取り上げること」は誤りで、これは農地改革の内容であり、財閥解体・独占禁止法とは対象が異なります。"},
  {id:"his319", cat:"日本史", sub:"戦国・江戸", q:"刀狩と兵農分離の関係について正しく理解しているものはどれか。", choices:["刀狩は兵農分離を進める手段の一つであった","刀狩と兵農分離は全く無関係である","刀狩により武士が農民になった","刀狩は兵農分離を妨げる政策であった"], a:0, e:"正解は「刀狩は兵農分離を進める手段の一つであった」です。刀狩は農民から武器を取り上げることで、武士と農民の身分を明確に分ける兵農分離を進める手段の一つでした。「刀狩と兵農分離は全く無関係である」は誤りで、両者は密接に関連しており、刀狩はまさに兵農分離を実現するための具体的な政策の一つです。「刀狩により武士が農民になった」は誤りで、刀狩の内容とは逆であり、農民から武器を取り上げることで武士と農民の区別を明確にする政策でした。「刀狩は兵農分離を妨げる政策であった」は誤りで、刀狩はむしろ兵農分離を「促進」する政策であり、妨げるものではありません。"},
  {id:"his321", cat:"日本史", sub:"江戸時代", q:"参勤交代の制度が結果的に江戸や街道沿いの都市に与えた影響として正しいものはどれか。", choices:["大名行列の往来で宿場町や商業が発達した","地方の人口が急激に減少し続けた","農業生産がすべて停止してしまった","街道の整備がまったく行われなかった"], a:0, e:"正解は「大名行列の往来で宿場町や商業が発達した」です。参勤交代による大名や家臣の往来は、宿場町の発展や街道沿いの商業活性化をもたらしました。「地方の人口が急激に減少し続けた」は誤りで、参勤交代は大名の江戸との往来に関する制度であり、地方人口の急減を直接もたらす制度ではありません。「農業生産がすべて停止してしまった」は誤りで、参勤交代と農業生産の停止は直接関係せず、事実にも反します。「街道の整備がまったく行われなかった」は誤りで、実際には参勤交代の実施にともない五街道など交通路の整備がむしろ進みました。"},
  {id:"his323", cat:"日本史", sub:"戦国・江戸", q:"太閤検地と刀狩の両方が果たした共通の役割として正しいものはどれか。", choices:["武士と農民の身分を明確に区別すること","貿易をすべて禁止し鎖国を進めること","キリスト教を保護し広めていくこと","仏教を国教として定めていくこと"], a:0, e:"正解は「武士と農民の身分を明確に区別すること」です。太閤検地と刀狩はともに、武士と農民の身分をはっきりと区別する兵農分離を進める政策でした。「貿易をすべて禁止し鎖国を進めること」は誤りで、太閤検地・刀狩は身分統制に関する政策であり、貿易政策や鎖国とは異なる分野です。「キリスト教を保護し広めていくこと」は誤りで、秀吉はむしろキリスト教を制限する政策もとっており、太閤検地・刀狩とは別の文脈の事柄です。「仏教を国教として定めていくこと」は誤りで、太閤検地・刀狩は宗教政策ではなく、土地調査と武器統制に関する政策です。"},
  {id:"his325", cat:"日本史", sub:"鎌倉・室町", q:"元寇の後、御恩と奉公の関係が崩れたことは幕府滅亡にどうつながったか。", choices:["御家人の不満が高まり幕府の支持が弱まった","御家人の忠誠心がさらに高まっていった","朝廷の権威が完全に失われていった","元との貿易がますます拡大していった"], a:0, e:"正解は「御家人の不満が高まり幕府の支持が弱まった」です。元寇では新たな領地を得られず十分な恩賞を与えられなかったため、御家人の不満が高まり幕府の支持基盤が弱まりました。「御家人の忠誠心がさらに高まっていった」は誤りで、事実とは正反対であり、恩賞不足への不満から御家人の幕府への信頼はむしろ低下しました。「朝廷の権威が完全に失われていった」は誤りで、御恩と奉公の関係の崩れは幕府と御家人の関係に関する事柄であり、朝廷の権威とは直接関係しません。「元との貿易がますます拡大していった」は誤りで、元寇は元との戦争であり、この後に元との貿易が拡大した事実もありません。"},
  {id:"his327", cat:"日本史", sub:"近代", q:"廃藩置県が地租改正より先に行われたことの意味として正しく理解しているものはどれか。", choices:["中央集権を先に整え税制を統一できた","税制を先に整えないと藩を廃止できなかった","両者の順序に特別な意味は存在しない","廃藩置県は地租改正の後に行われた"], a:0, e:"正解は「中央集権を先に整え税制を統一できた」です。廃藩置県によって中央集権体制を先に確立したことで、その後、全国一律の地租改正を実施することが可能になりました。「税制を先に整えないと藩を廃止できなかった」は誤りで、実際の順序はこれとは逆であり、廃藩置県（1871年）が地租改正（1873年）より先に行われました。「両者の順序に特別な意味は存在しない」は誤りで、実際には中央集権体制の確立が全国統一的な税制改革を可能にしたという重要な因果関係があります。「廃藩置県は地租改正の後に行われた」は誤りで、これは事実と逆の順序であり、廃藩置県の方が先に行われています。"},
  {id:"his329", cat:"日本史", sub:"近代", q:"自由民権運動が大日本帝国憲法の制定にどのような影響を与えたと考えられるか。", choices:["国会開設などの要求が制定を後押しした","自由民権運動は憲法制定を妨げていった","運動と憲法制定には特に関係がない","運動により憲法制定は中止となった"], a:0, e:"正解は「国会開設などの要求が制定を後押しした」です。自由民権運動による国会開設や憲法制定の要求は、政府による大日本帝国憲法制定を後押しする一因となりました。「自由民権運動は憲法制定を妨げていった」は誤りで、事実とは逆であり、自由民権運動はむしろ憲法制定を求め、これを後押しする方向に働きました。「運動と憲法制定には特に関係がない」は誤りで、両者には自由民権運動の要求が政府の憲法制定を促したという明確な因果関係があります。「運動により憲法制定は中止となった」は誤りで、実際には1889年に大日本帝国憲法は制定されており、中止された事実はありません。"},
  {id:"his331", cat:"日本史", sub:"近代", q:"日清戦争と日露戦争に共通する点として正しいものはどれか。", choices:["いずれも日本が勝利し国際的地位を高めた","いずれも日本が戦争に敗北した","いずれもヨーロッパで行われた戦争である","いずれも江戸時代に起こった戦争である"], a:0, e:"正解は「いずれも日本が勝利し国際的地位を高めた」です。日清戦争・日露戦争はともに日本が勝利し、これにより日本の国際的地位は大きく高まりました。「いずれも日本が戦争に敗北した」は誤りで、事実とは正反対であり、日本はいずれの戦争でも勝利しています。「いずれもヨーロッパで行われた戦争である」は誤りで、日清戦争は主に朝鮮半島・中国、日露戦争は満州・朝鮮半島などアジアを主戦場としており、ヨーロッパで行われたものではありません。「いずれも江戸時代に起こった戦争である」は誤りで、両戦争はいずれも明治時代（19世紀末〜20世紀初め）に起こったものであり、江戸時代の出来事ではありません。"},
  {id:"his333", cat:"日本史", sub:"近代", q:"大正デモクラシーの高まりは普通選挙法の成立とどう関係すると考えられるか。", choices:["民主主義的な風潮が法律制定を後押しした","デモクラシーは法律制定に反対する運動であった","両者の間には特に関係が存在しない","法律が先に成立しデモクラシーが起こった"], a:0, e:"正解は「民主主義的な風潮が法律制定を後押しした」です。大正デモクラシーによる民主主義的な風潮の高まりが、1925年の普通選挙法制定を後押ししました。「デモクラシーは法律制定に反対する運動であった」は誤りで、事実とは逆であり、大正デモクラシーはむしろ普通選挙の実現を求める方向に働いた風潮です。「両者の間には特に関係が存在しない」は誤りで、大正デモクラシーの高まりと普通選挙法制定の間には明確な因果関係があるとされています。「法律が先に成立しデモクラシーが起こった」は誤りで、実際には大正デモクラシーという社会的風潮が先にあり、それが普通選挙法（1925年）の制定を後押しした流れです。"},
  {id:"his335", cat:"日本史", sub:"近代", q:"世界恐慌が満州事変の背景にどのように関わっていると考えられるか。", choices:["不況からの脱却を求め大陸進出が強まった","世界恐慌は満州事変とは無関係である","世界恐慌により軍備がすべて縮小された","世界恐慌が満州事変を未然に防いだ"], a:0, e:"正解は「不況からの脱却を求め大陸進出が強まった」です。世界恐慌による深刻な不況からの脱却を求め、資源や市場を求める大陸進出の動きが強まったことが満州事変の背景の一つです。「世界恐慌は満州事変とは無関係である」は誤りで、両者には経済的な行き詰まりが大陸進出を後押ししたという関連性があるとされています。「世界恐慌により軍備がすべて縮小された」は誤りで、事実とは逆であり、日本ではむしろ大陸進出のための軍事行動（満州事変）が起こりました。「世界恐慌が満州事変を未然に防いだ」は誤りで、これも事実と逆であり、世界恐慌はむしろ満州事変が起こる一因となったと考えられています。"},
  {id:"his337", cat:"日本史", sub:"現代", q:"国家総動員法の制定は当時の日本社会にどのような変化をもたらしたか。", choices:["政府が経済や生活を強く統制するようになった","自由な経済活動がさらに活発になった","議会の権限がさらに強化されていった","地方自治がさらに発展していった"], a:0, e:"正解は「政府が経済や生活を強く統制するようになった」です。国家総動員法により、政府は議会の承認なしに労働力や物資を統制できるようになり、国民生活への統制が強まりました。「自由な経済活動がさらに活発になった」は誤りで、事実とは正反対であり、国家総動員法はむしろ経済活動への統制を強化する法律でした。「議会の権限がさらに強化されていった」は誤りで、国家総動員法はむしろ議会の承認なしに政府が統制を行えるようにするものであり、議会の権限縮小につながりました。「地方自治がさらに発展していった」は誤りで、戦時体制下ではむしろ中央集権的な統制が強まり、地方自治の発展とは逆の方向に働きました。"},
  {id:"his339", cat:"日本史", sub:"現代", q:"農地改革によって自作農が増えたことは戦後社会にどう影響したか。", choices:["地主と小作人の格差が縮小し社会が安定した","地主の力がそれまで以上に強まった","農業生産が完全に停止してしまった","都市部の人口が急激に減少していった"], a:0, e:"正解は「地主と小作人の格差が縮小し社会が安定した」です。農地改革により多くの小作農が自作農となったことで、地主と小作人の間の経済的な格差が縮小しました。「地主の力がそれまで以上に強まった」は誤りで、事実とは正反対であり、農地改革はむしろ地主の土地を小作農に分配することで地主の力を弱める改革でした。「農業生産が完全に停止してしまった」は誤りで、農地改革は土地所有のあり方を変える改革であり、農業生産の停止をもたらすものではありませんでした。「都市部の人口が急激に減少していった」は誤りで、農地改革は主に農村の土地制度に関する改革であり、都市部の人口動態と直接結びつくものではありません。"},
  {id:"his341", cat:"日本史", sub:"現代", q:"55年体制で自民党が長期政権を維持できた背景として正しい理解はどれか。", choices:["経済成長のもとで利益を広く分配できた","野党という存在がそもそも存在しなかった","選挙自体が全く行われなかった","天皇が政権を直接指名していた"], a:0, e:"正解は「経済成長のもとで利益を広く分配できた」です。高度経済成長のもとで生まれた利益を広く分配できたことが、自民党の長期政権を支える一因となりました。「野党という存在がそもそも存在しなかった」は誤りで、55年体制下でも社会党などの野党は存在しており、この選択肢は事実と異なります。「選挙自体が全く行われなかった」は誤りで、55年体制下でも定期的に国政選挙は実施されており、選挙が行われなかった事実はありません。「天皇が政権を直接指名していた」は誤りで、戦後の日本国憲法のもとで天皇は政治的権能を持たず、政権を直接指名する立場にはありません。"},
  {id:"his343", cat:"日本史", sub:"現代", q:"高度経済成長と公害問題の発生にはどのような関係があると考えられるか。", choices:["経済成長を優先し環境対策が後回しにされた","公害問題が経済成長を引き起こしていった","両者の間には特に関係が存在しない","公害対策が先に行われ経済が成長した"], a:0, e:"正解は「経済成長を優先し環境対策が後回しにされた」です。急速な経済成長が優先され、環境対策が後回しにされたことで各地で公害問題が深刻化しました。「公害問題が経済成長を引き起こしていった」は誤りで、これは因果関係が逆であり、実際には経済成長（工業化）が公害問題を引き起こしたと考えられています。「両者の間には特に関係が存在しない」は誤りで、高度経済成長と公害問題の深刻化には明確な因果関係があるとされています。「公害対策が先に行われ経済が成長した」は誤りで、実際の順序はこれとは逆であり、経済成長が先行し、公害問題が深刻化してから対策が本格化しました。"},
  {id:"his345", cat:"日本史", sub:"現代", q:"バブル経済の崩壊は日本企業の雇用のあり方にどう変化をもたらしたか。", choices:["終身雇用が見直され非正規雇用が増加した","終身雇用がそれまで以上に一般化した","雇用そのものがすべて廃止されてしまった","正社員の割合が急激に増加していった"], a:0, e:"正解は「終身雇用が見直され非正規雇用が増加した」です。バブル崩壊後の長期不況により、企業は終身雇用を見直し、非正規雇用の割合が増加していきました。「終身雇用がそれまで以上に一般化した」は誤りで、事実とは正反対であり、バブル崩壊後はむしろ終身雇用が見直される傾向が強まりました。「雇用そのものがすべて廃止されてしまった」は誤りで、雇用制度自体が廃止された事実はなく、雇用形態の変化（非正規雇用の増加）が実際に起こったことです。「正社員の割合が急激に増加していった」は誤りで、事実とは逆であり、この時期は正社員の割合がむしろ低下し非正規雇用が増加する傾向にありました。"},
  {id:"his347", cat:"日本史", sub:"近代", q:"明治政府が学制・徴兵令・地租改正をほぼ同時に進めた狙いは何か。", choices:["国民国家としての基盤を短期間で整えること","江戸幕府の政策をそのまま継続すること","地方分権をより一層推進すること","鎖国体制をこれまで通り維持すること"], a:0, e:"正解は「国民国家としての基盤を短期間で整えること」です。学制・徴兵令・地租改正はいずれも、近代国民国家としての基盤を短期間で整えるために進められた改革です。「江戸幕府の政策をそのまま継続すること」は誤りで、これらの改革はむしろ江戸時代の制度を大きく転換するものであり、政策の継続とは正反対です。「地方分権をより一層推進すること」は誤りで、これらの改革はむしろ中央集権体制を確立する方向に働いたものであり、地方分権の推進とは逆の性質です。「鎖国体制をこれまで通り維持すること」は誤りで、明治政府はむしろ開国後の国際情勢に対応するための改革を進めており、鎖国維持とは正反対の方向性です。"},
  {id:"his349", cat:"日本史", sub:"江戸時代", q:"江戸幕府が朱子学を正学とした狙いは身分制度の維持とどう関わるか。", choices:["上下の秩序を重んじる考えが身分制度を正当化した","朱子学は身分制度の否定を説く学問であった","朱子学と身分制度には特に関係が存在しない","朱子学の導入により身分制度が廃止された"], a:0, e:"正解は「上下の秩序を重んじる考えが身分制度を正当化した」です。上下の秩序や礼を重んじる朱子学の考え方は、幕府にとって身分制度を正当化する思想的な支えとなりました。「朱子学は身分制度の否定を説く学問であった」は誤りで、事実とは正反対であり、朱子学はむしろ上下の秩序を重視する学問として身分制度と親和性がありました。「朱子学と身分制度には特に関係が存在しない」は誤りで、両者には幕府が朱子学を正学として奨励した背景に身分秩序の正当化という明確な関係があります。「朱子学の導入により身分制度が廃止された」は誤りで、これも事実と逆であり、朱子学の奨励下でむしろ江戸時代の身分制度は維持・強化されました。"},
  {id:"his351", cat:"日本史", sub:"平安時代", q:"国風文化が遣唐使停止後に発展したことから読み取れることは何か。", choices:["中国の影響が弱まり独自の文化が育つ環境が整った","中国文化の影響がそれ以前より強まっていった","仏教が完全に否定されるようになっていった","国風文化は遣唐使停止以前に完成していた"], a:0, e:"正解は「中国の影響が弱まり独自の文化が育つ環境が整った」です。遣唐使が停止されたことで中国からの直接的な文化流入が減り、日本独自の国風文化が育つ環境が整いました。「中国文化の影響がそれ以前より強まっていった」は誤りで、事実とは正反対であり、遣唐使停止によって中国からの直接的な影響はむしろ弱まりました。「仏教が完全に否定されるようになっていった」は誤りで、国風文化の時代にも仏教は引き続き重要な役割を果たしており、完全に否定された事実はありません。「国風文化は遣唐使停止以前に完成していた」は誤りで、事実とは逆であり、国風文化は遣唐使停止（9世紀末）以降に発展したものです。"},
  {id:"his353", cat:"日本史", sub:"鎌倉・室町", q:"御成敗式目が武士の慣習をもとに作られたことは律令とどう異なるか。", choices:["公家ではなく武士社会の実情に合わせて作られた点","律令よりもさらに古い時代に作られた点","律令とほとんど同じ内容になっている点","天皇がすべて直接制定したという点"], a:0, e:"正解は「公家ではなく武士社会の実情に合わせて作られた点」です。律令が公家社会を前提とした法であるのに対し、御成敗式目は武士社会の慣習や実情に合わせてつくられた点が異なります。「律令よりもさらに古い時代に作られた点」は誤りで、事実とは逆であり、御成敗式目（1232年）は律令（701年の大宝律令など）よりもずっと後の時代に作られたものです。「律令とほとんど同じ内容になっている点」は誤りで、両者は対象とする社会（公家か武士か）が異なり、内容も大きく異なります。「天皇がすべて直接制定したという点」は誤りで、御成敗式目は鎌倉幕府（執権北条泰時ら）が制定したものであり、天皇が直接制定したものではありません。"},
  {id:"his355", cat:"日本史", sub:"現代", q:"GHQによる財閥解体・農地改革・教育改革に共通するねらいは何か。", choices:["日本社会の民主化を進めていくこと","日本の軍事力を強化していくこと","天皇の権限を拡大していくこと","江戸時代の制度を復活させること"], a:0, e:"正解は「日本社会の民主化を進めていくこと」です。財閥解体・農地改革・教育改革はいずれも、戦前の日本社会を改め、民主化を進めることを共通のねらいとしていました。「日本の軍事力を強化していくこと」は誤りで、これらの改革はむしろ戦後の非軍事化・民主化を進めるものであり、軍事力強化とは正反対の方向性です。「天皇の権限を拡大していくこと」は誤りで、戦後改革はむしろ天皇の政治的権能を縮小し、国民主権を確立する方向に働いたものであり、内容が逆です。「江戸時代の制度を復活させること」は誤りで、これらの改革は近代化・民主化を目指すものであり、江戸時代の制度への回帰とは全く異なる方向性です。"},
  /* 世界史 */
  {id:"wor301", cat:"世界史", sub:"ヨーロッパ史", q:"フランス革命とアメリカ独立革命に共通する思想的背景として正しいものはどれか。", choices:["啓蒙思想にもとづく自由や権利の主張","絶対王政をそのまま擁護する思想","封建制度をそのまま維持する思想","産業革命そのものを否定する思想"], a:0, e:"正解は「啓蒙思想にもとづく自由や権利の主張」です。両革命はいずれも、理性を重んじ自由や権利を主張する啓蒙思想を背景として起こりました。「絶対王政をそのまま擁護する思想」は誤りで、両革命はむしろ絶対王政を批判し打倒する方向の運動であり、擁護とは正反対です。「封建制度をそのまま維持する思想」は誤りで、両革命は封建的な身分制度を否定する方向の思想を背景としており、維持とは逆です。「産業革命そのものを否定する思想」は誤りで、両革命の思想的背景は啓蒙思想であり、産業革命の否定とは異なる文脈の内容です。"},
  {id:"wor303", cat:"世界史", sub:"ヨーロッパ史", q:"名誉革命とフランス革命の過程を比較したとき、正しい理解はどれか。", choices:["名誉革命は無血、仏革命は犠牲を伴った","両方とも無血のうちに行われた","両方とも多くの犠牲を伴った","フランス革命の方が先に起こった"], a:0, e:"正解は「名誉革命は無血、仏革命は犠牲を伴った」です。名誉革命はほぼ無血で王権交代が行われましたが、フランス革命は多くの犠牲を伴う激しい革命となりました。「両方とも無血のうちに行われた」は誤りで、フランス革命は恐怖政治や戦争を伴う激しい革命であり、無血とはいえません。「両方とも多くの犠牲を伴った」は誤りで、名誉革命はむしろ大きな戦闘を伴わない「無血」の革命として知られています。「フランス革命の方が先に起こった」は誤りで、実際には名誉革命（1688年）の方がフランス革命（1789年）より先に起こっています。"},
  {id:"wor305", cat:"世界史", sub:"ヨーロッパ史", q:"産業革命が起こったことは都市と農村の人口構成にどのような変化をもたらしたか。", choices:["工場労働を求め農村から都市へ移動した","都市の人口が農村へ移動していった","人口構成に特に変化は見られなかった","農業人口が急激に増加していった"], a:0, e:"正解は「工場労働を求め農村から都市へ移動した」です。工場での労働機会を求めて多くの人々が農村から都市へ移動し、都市への人口集中が進みました。「都市の人口が農村へ移動していった」は誤りで、実際の人口移動の方向はこれとは逆であり、農村から都市への移動が起こりました。「人口構成に特に変化は見られなかった」は誤りで、産業革命は都市化という大きな人口構成の変化をもたらしました。「農業人口が急激に増加していった」は誤りで、実際には工業化にともない農業人口の割合はむしろ低下する傾向にありました。"},
  {id:"wor307", cat:"世界史", sub:"ヨーロッパ史", q:"帝国主義時代のアフリカ分割は独立後のアフリカ諸国にどのような課題を残したか。", choices:["民族分布を無視した国境が対立を生んだ","すべての民族が均等に統一されていった","資源の枯渇によりすべてが貧困化した","独立そのものが実現しなかった"], a:0, e:"正解は「民族分布を無視した国境が対立を生んだ」です。列強が民族分布を無視して国境線を引いたため、独立後も民族間の対立が続く一因となりました。「すべての民族が均等に統一されていった」は誤りで、事実とは逆であり、人為的な国境線はむしろ民族間の分断や対立を生む要因となりました。「資源の枯渇によりすべてが貧困化した」は誤りで、アフリカの課題は資源の枯渇よりも国境線の問題や政治的対立が大きな要因とされています。「独立そのものが実現しなかった」は誤りで、実際には多くのアフリカ諸国が独立を達成しており、この選択肢は事実と異なります。"},
  {id:"wor309", cat:"世界史", sub:"両大戦期", q:"第一次世界大戦後のヴェルサイユ体制の厳しい制裁はドイツ社会にどう影響したか。", choices:["国民の不満が高まりナチス台頭を招いた","ドイツ経済がすぐに安定していった","国民の不満はまったく生じなかった","ドイツは戦争責任を免除されていった"], a:0, e:"正解は「国民の不満が高まりナチス台頭を招いた」です。多額の賠償金などによる厳しい制裁への国民の不満が高まったことが、後のナチス台頭を招く一因となりました。「ドイツ経済がすぐに安定していった」は誤りで、事実とは逆であり、ヴェルサイユ体制下のドイツ経済はインフレなどにより深刻な混乱に陥りました。「国民の不満はまったく生じなかった」は誤りで、実際には過酷な賠償金負担などへの不満が広く国民の間に生じました。「ドイツは戦争責任を免除されていった」は誤りで、ヴェルサイユ条約はむしろドイツに戦争責任を負わせ、厳しい制裁を課す内容でした。"},
  {id:"wor311", cat:"世界史", sub:"両大戦期", q:"世界恐慌に対して各国がとった政策の違いとして正しい理解はどれか。", choices:["アメリカとドイツで対応が大きく異なった","すべての国が全く同じ政策をとった","恐慌に対応した国は存在しなかった","日本だけが恐慌の影響を受けなかった"], a:0, e:"正解は「アメリカとドイツで対応が大きく異なった」です。アメリカはニューディール政策で公共事業を進め、ドイツではナチスが台頭するなど、各国の対応は大きく異なりました。「すべての国が全く同じ政策をとった」は誤りで、実際には各国が異なる対応（ニューディール政策、ブロック経済、ナチスの台頭など）をとりました。「恐慌に対応した国は存在しなかった」は誤りで、実際には多くの国が何らかの形で世界恐慌への対応策を講じています。「日本だけが恐慌の影響を受けなかった」は誤りで、日本も世界恐慌の影響を強く受け、昭和恐慌と呼ばれる深刻な不況に陥りました。"},
  {id:"wor313", cat:"世界史", sub:"現代", q:"国際連盟と国際連合の違いとして正しい理解はどれか。", choices:["連合には拒否権があり制裁力も強化された","連盟の方が強力な制裁手段を持っていた","両者に違いは特に存在しなかった","連盟の方が後に設立されていった"], a:0, e:"正解は「連合には拒否権があり制裁力も強化された」です。国際連合は常任理事国に拒否権を与え、経済制裁だけでなく軍事的措置も可能とするなど、国際連盟より強い権限を持ちます。「連盟の方が強力な制裁手段を持っていた」は誤りで、事実とは逆であり、国際連盟は有効な制裁手段に乏しく、これが第二次世界大戦を防げなかった一因とされています。「両者に違いは特に存在しなかった」は誤りで、拒否権や軍事的措置の可否など、両者には制度上の明確な違いがあります。「連盟の方が後に設立されていった」は誤りで、実際には国際連盟（1920年設立）の方が国際連合（1945年設立）より先に設立されています。"},
  {id:"wor315", cat:"世界史", sub:"現代", q:"冷戦下の東西陣営の対立はアジアの国々にどのような影響を与えたか。", choices:["東西陣営の代理戦争の舞台となり分断が生じた","アジア諸国は冷戦とまったく無関係であった","すべてのアジア諸国が統一を達成していった","冷戦によりアジアは平和を維持できていた"], a:0, e:"正解は「東西陣営の代理戦争の舞台となり分断が生じた」です。朝鮮半島やベトナムなどでは、東西陣営がそれぞれを支援する形で代理戦争が展開され、国が分断される事態が生じました。「アジア諸国は冷戦とまったく無関係であった」は誤りで、実際にはアジアは冷戦の主要な舞台の一つとなり、多大な影響を受けました。「すべてのアジア諸国が統一を達成していった」は誤りで、実際には朝鮮半島など、むしろ分断が生じた地域もあります。「冷戦によりアジアは平和を維持できていた」は誤りで、実際には冷戦下でアジアでは朝鮮戦争やベトナム戦争など深刻な紛争が起こりました。"},
  {id:"wor317", cat:"世界史", sub:"アジア史", q:"インドや東南アジア諸国の独立運動が第二次大戦後に本格化した背景として正しいものはどれか。", choices:["疲弊した宗主国の支配力が弱まったため","戦争により宗主国の支配力がより強まったため","独立運動は戦前に完全に終結していたため","独立運動は戦争と無関係に起こったため"], a:0, e:"正解は「疲弊した宗主国の支配力が弱まったため」です。第二次世界大戦で疲弊したヨーロッパ諸国の支配力が弱まったことで、各地の独立運動が本格化しました。「戦争により宗主国の支配力がより強まったため」は誤りで、事実とは逆であり、戦争によって多くの宗主国は経済的・軍事的に疲弊しました。「独立運動は戦前に完全に終結していたため」は誤りで、実際には独立運動は戦後にむしろ本格化しており、戦前に終結した事実はありません。「独立運動は戦争と無関係に起こったため」は誤りで、第二次世界大戦による宗主国の疲弊は独立運動の本格化と密接に関連しています。"},
  {id:"wor319", cat:"世界史", sub:"現代", q:"中国の改革開放政策とソ連のペレストロイカに共通する点として正しいものはどれか。", choices:["社会主義のもとで経済の立て直しを図った点","社会主義を完全に放棄していった点","両方とも失敗し体制が崩壊していった点","両方とも軍事力の増強を目的とした点"], a:0, e:"正解は「社会主義のもとで経済の立て直しを図った点」です。両政策はいずれも、社会主義体制を維持しながら停滞していた経済を立て直そうとした改革です。「社会主義を完全に放棄していった点」は誤りで、中国もソ連（当時）も社会主義の枠組み自体は維持しつつ、経済面での改革を進めました。「両方とも失敗し体制が崩壊していった点」は誤りで、中国の改革開放は経済成長に成功しており、ソ連のペレストロイカとは結果が異なります。「両方とも軍事力の増強を目的とした点」は誤りで、両政策はいずれも主に経済の立て直しを目的としたものであり、軍事力増強が主目的ではありません。"},
  {id:"wor321", cat:"世界史", sub:"現代", q:"アパルトヘイト撤廃後の南アフリカが直面した課題として理解が正しいものはどれか。", choices:["長年の格差により経済的な不平等が残った","人種による格差は即座に完全解消した","国際社会からずっと孤立し続けていった","アパルトヘイトはすぐに再導入されていった"], a:0, e:"正解は「長年の格差により経済的な不平等が残った」です。制度上の差別は撤廃されましたが、長年の格差の影響から経済的な不平等はその後も残り続けました。「人種による格差は即座に完全解消した」は誤りで、事実とは異なり、制度の撤廃後も経済的な格差は長期間にわたり残りました。「国際社会からずっと孤立し続けていった」は誤りで、アパルトヘイト撤廃後の南アフリカはむしろ国際社会への復帰を果たしています。「アパルトヘイトはすぐに再導入されていった」は誤りで、アパルトヘイトが再導入された事実はなく、撤廃後も維持されています。"},
  {id:"wor323", cat:"世界史", sub:"現代", q:"ベルリンの壁崩壊とソ連解体の関係について正しく理解しているものはどれか。", choices:["東欧革命の一環でソ連解体の前兆となった","ソ連解体の後に壁崩壊が起こっていった","両者の間には特に関係が存在しない","壁崩壊によりソ連はより強固になった"], a:0, e:"正解は「東欧革命の一環でソ連解体の前兆となった」です。1989年のベルリンの壁崩壊は東欧革命の象徴的な出来事で、その後のソ連解体（1991年）の前兆ともなりました。「ソ連解体の後に壁崩壊が起こっていった」は誤りで、実際の順序はこれとは逆であり、ベルリンの壁崩壊（1989年）の方がソ連解体（1991年）より先に起こっています。「両者の間には特に関係が存在しない」は誤りで、両者は東欧・ソ連圏における一連の民主化・体制転換の流れの中で密接に関連しています。「壁崩壊によりソ連はより強固になった」は誤りで、事実とは逆であり、ベルリンの壁崩壊はむしろソ連圏の動揺・解体につながる出来事でした。"},
  {id:"wor325", cat:"世界史", sub:"現代", q:"湾岸戦争における多国籍軍の行動は国際連合のどのような役割を示す例といえるか。", choices:["国際社会が協力する集団安全保障の一例","一国だけで紛争を解決するという役割","経済制裁のみを行うという役割","加盟国の内政に干渉しないという役割"], a:0, e:"正解は「国際社会が協力する集団安全保障の一例」です。湾岸戦争は国連決議にもとづき多国籍軍が編成された、国際社会が協力して侵略に対処する集団安全保障の代表例です。「一国だけで紛争を解決するという役割」は誤りで、湾岸戦争はまさに「多国籍軍」による対応であり、一国だけの行動ではありません。「経済制裁のみを行うという役割」は誤りで、実際には経済制裁にとどまらず、軍事的な行動も伴いました。「加盟国の内政に干渉しないという役割」は誤りで、この事例はむしろ国際社会がイラクの侵略行為に積極的に介入した例です。"},
  {id:"wor327", cat:"世界史", sub:"ヨーロッパ史", q:"三角貿易が発展したことで大西洋を挟んだ各地域にはどのような影響が生じたか。", choices:["アフリカから多くの人が奴隷として送られた","アメリカからアフリカへ移民が急増した","ヨーロッパの人口が急激に減少していった","アフリカの経済が急速に発展していった"], a:0, e:"正解は「アフリカから多くの人が奴隷として送られた」です。三角貿易により、多くのアフリカの人々が奴隷としてアメリカ大陸へ強制的に送られました。「アメリカからアフリカへ移民が急増した」は誤りで、三角貿易における人の移動の方向はこれとは逆（アフリカからアメリカへ）でした。「ヨーロッパの人口が急激に減少していった」は誤りで、三角貿易による人口移動の主な対象はアフリカからアメリカへの奴隷であり、ヨーロッパの人口減少とは直接関係しません。「アフリカの経済が急速に発展していった」は誤りで、事実とは逆であり、奴隷貿易はアフリカ社会に深刻な人的・経済的損失をもたらしたとされています。"},
  {id:"wor329", cat:"世界史", sub:"ヨーロッパ史", q:"宗教改革が印刷技術の発達と結びついたことでどのような効果が生まれたか。", choices:["改革派の主張が短期間で広い地域に伝わった","印刷技術は改革に何の影響も与えなかった","カトリック教会の権威がすぐに回復した","改革の主張は一切広まらなかった"], a:0, e:"正解は「改革派の主張が短期間で広い地域に伝わった」です。活版印刷術によりルターらの主張が大量に印刷され、短期間で広い地域に伝わり宗教改革が拡大しました。「印刷技術は改革に何の影響も与えなかった」は誤りで、実際には印刷技術こそが宗教改革の急速な拡大を可能にした重要な要因とされています。「カトリック教会の権威がすぐに回復した」は誤りで、宗教改革の拡大によりカトリック教会の権威はむしろ大きく揺らぎました。「改革の主張は一切広まらなかった」は誤りで、事実とは正反対であり、改革派の主張はヨーロッパ各地に急速に広まりました。"},
  {id:"wor331", cat:"世界史", sub:"ヨーロッパ史", q:"モンテスキューの三権分立の考え方は後の各国の政治制度にどのような影響を与えたか。", choices:["権力集中防止の仕組みとして採用された","三権分立はどの国にも採用されなかった","三権分立は絶対王政の強化に利用された","三権分立は現代では否定されている"], a:0, e:"正解は「権力集中防止の仕組みとして採用された」です。三権分立の考え方は権力の集中を防ぐ仕組みとして、多くの国の近代的な憲法に取り入れられました。「三権分立はどの国にも採用されなかった」は誤りで、事実とは異なり、日本を含む多くの近代国家の憲法に三権分立の考え方が取り入れられています。「三権分立は絶対王政の強化に利用された」は誤りで、三権分立はむしろ絶対王政（権力の集中）を批判する立場から生まれた考え方であり、正反対の内容です。「三権分立は現代では否定されている」は誤りで、現代の多くの民主主義国家において三権分立は基本原則として重視され続けています。"},
  {id:"wor333", cat:"世界史", sub:"ヨーロッパ史", q:"産業革命によって都市に工場労働者が増加したことは後の労働運動の発展にどう関わったか。", choices:["劣悪な労働環境への不満から組合運動が広がった","労働者は環境に満足し運動は起こらなかった","産業革命と労働運動には関係が存在しない","労働運動は産業革命以前に終結していた"], a:0, e:"正解は「劣悪な労働環境への不満から組合運動が広がった」です。長時間労働や低賃金など劣悪な労働環境への不満が高まり、労働者による労働組合運動が発展しました。「労働者は環境に満足し運動は起こらなかった」は誤りで、事実とは正反対であり、産業革命期の劣悪な労働環境への不満こそが労働運動発展の背景です。「産業革命と労働運動には関係が存在しない」は誤りで、両者には工場労働者の増加とその労働環境への不満という明確な因果関係があります。「労働運動は産業革命以前に終結していた」は誤りで、労働運動はむしろ産業革命の進展にともなって発展したものであり、それ以前に終結した事実はありません。"},
  {id:"wor335", cat:"世界史", sub:"両大戦期", q:"スペイン内戦にドイツ・イタリアとソ連がそれぞれ介入したことは当時の国際情勢の何を反映していたか。", choices:["ファシズムと反ファシズムの対立が広がっていた","すべての国が中立を保っていった","戦争がヨーロッパ以外でのみ起きていた","内戦は国際的に無関心であった"], a:0, e:"正解は「ファシズムと反ファシズムの対立が広がっていた」です。ドイツ・イタリアが反乱軍を、ソ連が共和国政府を支援したことは、当時広がっていたファシズムと反ファシズムの対立を反映していました。「すべての国が中立を保っていった」は誤りで、事実とは逆であり、ドイツ・イタリア・ソ連はいずれもスペイン内戦に積極的に介入しました。「戦争がヨーロッパ以外でのみ起きていた」は誤りで、スペイン内戦はヨーロッパ（スペイン）で起きた戦争であり、この選択肢は事実と矛盾します。「内戦は国際的に無関心であった」は誤りで、実際には複数の大国が介入するなど、国際的に大きな関心を集めた内戦でした。"},
  {id:"wor337", cat:"世界史", sub:"現代", q:"第二次世界大戦後、多くの植民地が独立を達成した背景として理解が正しいものはどれか。", choices:["宗主国の弱体化と民族自決の考えの広まり","植民地支配がさらに強化されていった","独立運動がすべて武力で鎮圧されていった","戦争が独立を妨げる結果となっていった"], a:0, e:"正解は「宗主国の弱体化と民族自決の考えの広まり」です。戦争で疲弊した宗主国の弱体化に加え、民族自決の考え方が広まったことが、多くの植民地の独立につながりました。「植民地支配がさらに強化されていった」は誤りで、事実とは逆であり、戦後は植民地支配がむしろ弱まり、独立が相次ぎました。「独立運動がすべて武力で鎮圧されていった」は誤りで、多くの植民地が実際に独立を達成しており、すべてが鎮圧されたわけではありません。「戦争が独立を妨げる結果となっていった」は誤りで、実際には戦争による宗主国の疲弊がむしろ独立を後押しする結果となりました。"},
  {id:"wor339", cat:"世界史", sub:"現代", q:"NATOとワルシャワ条約機構はそれぞれどのような関係にあったか。", choices:["東西冷戦下で対立する陣営の軍事同盟であった","両者は同じ陣営の同盟であった","両者に対立関係は存在しなかった","ワルシャワ条約機構が先に解体していった"], a:0, e:"正解は「東西冷戦下で対立する陣営の軍事同盟であった」です。NATOは資本主義陣営、ワルシャワ条約機構は社会主義陣営の軍事同盟として、冷戦下で互いに対立していました。「両者は同じ陣営の同盟であった」は誤りで、事実とは逆であり、両者は異なる陣営（資本主義と社会主義）の同盟です。「両者に対立関係は存在しなかった」は誤りで、両者はまさに冷戦構造の中で互いに対立する関係にありました。「ワルシャワ条約機構が先に解体していった」は誤りで、これは事実として正しい面もありますが、設問が問う「関係」の説明としては「対立する軍事同盟であった」ことが本質的な内容です。"},
  {id:"wor341", cat:"世界史", sub:"現代", q:"石油危機が先進国の経済政策にどのような変化をもたらしたか。", choices:["省エネ技術の開発や産業構造の転換が進んだ","石油の消費量がさらに増加していった","先進国の経済成長が加速していった","石油危機は経済政策に影響しなかった"], a:0, e:"正解は「省エネ技術の開発や産業構造の転換が進んだ」です。原油価格の急騰を受け、多くの先進国では省エネルギー技術の開発や、資源に頼らない産業構造への転換が進みました。「石油の消費量がさらに増加していった」は誤りで、事実とは逆であり、石油危機後は多くの国で石油消費を抑える取り組みが進みました。「先進国の経済成長が加速していった」は誤りで、石油危機はむしろ多くの先進国の経済成長を鈍化させる要因となりました。「石油危機は経済政策に影響しなかった」は誤りで、実際には省エネ化や産業構造の転換など、経済政策に大きな影響を与えました。"},
  {id:"wor343", cat:"世界史", sub:"現代", q:"EUの発足は加盟国の主権のあり方にどのような変化をもたらしたと考えられるか。", choices:["一部の権限を共同体に委ね主権が制限された","加盟国の主権はまったく変化しなかった","加盟国の主権がむしろ強化されていった","EU加盟により独立国でなくなった"], a:0, e:"正解は「一部の権限を共同体に委ね主権が制限された」です。EU加盟国は通貨政策や貿易政策など一部の権限をEUに委ねており、その分主権が一定程度制限される形になっています。「加盟国の主権はまったく変化しなかった」は誤りで、実際には通貨政策など一部の権限をEUに委ねる形で、主権のあり方に変化が生じています。「加盟国の主権がむしろ強化されていった」は誤りで、EU加盟は一部権限の委譲を伴うものであり、主権の強化とはいえません。「EU加盟により独立国でなくなった」は誤りで、EU加盟国は依然として独立国家であり、完全に主権を失ったわけではありません。"},
  {id:"wor345", cat:"世界史", sub:"現代", q:"中東で繰り返し紛争が起こる背景として理解が正しいものはどれか。", choices:["民族・宗教・資源をめぐる対立が重なっている","中東では対立が一切存在していない","中東の紛争はすべて偶然によるものである","中東は単一の民族・宗教で構成されている"], a:0, e:"正解は「民族・宗教・資源をめぐる対立が重なっている」です。中東では民族・宗教の違いに加え、石油資源をめぐる利害対立が複雑に絡み合い、紛争が繰り返されています。「中東では対立が一切存在していない」は誤りで、事実とは正反対であり、中東は歴史的に紛争が多い地域として知られています。「中東の紛争はすべて偶然によるものである」は誤りで、実際には民族・宗教・資源など構造的な要因が複雑に絡み合って紛争が生じています。「中東は単一の民族・宗教で構成されている」は誤りで、実際には中東には多様な民族・宗教が存在し、その違いが対立の一因となっています。"},
  {id:"wor347", cat:"世界史", sub:"現代", q:"国連平和維持活動（PKO）が果たす役割について正しい理解はどれか。", choices:["停戦監視や復興支援で平和の定着を図る","紛争の一方に加担して攻撃する","すべての紛争を武力で解決する","経済制裁のみを目的とする"], a:0, e:"正解は「停戦監視や復興支援で平和の定着を図る」です。PKOは中立的な立場から停戦監視や復興支援などを行い、紛争地域における平和の定着を図る活動です。「紛争の一方に加担して攻撃する」は誤りで、PKOは特定の紛争当事者に加担するのではなく、中立的な立場から活動することが原則です。「すべての紛争を武力で解決する」は誤りで、PKOの主な役割は停戦監視や復興支援であり、武力による解決を主目的とするものではありません。「経済制裁のみを目的とする」は誤りで、経済制裁はPKOとは異なる手段であり、PKOの主な活動内容とは異なります。"},
  {id:"wor349", cat:"世界史", sub:"両大戦期", q:"ニューディール政策とファシズムの台頭はいずれも世界恐慌に対するどのような共通の反応といえるか。", choices:["政府が経済に強く介入し危機に対応した点","市場に任せ政府が一切関与しなかった点","両方とも民主主義を強化していった点","両方とも戦争を回避しようとしていった点"], a:0, e:"正解は「政府が経済に強く介入し危機に対応した点」です。ニューディール政策もナチスの経済政策も、政府が経済に強く介入することで恐慌からの脱却を図ろうとした点で共通しています。「市場に任せ政府が一切関与しなかった点」は誤りで、事実とは正反対であり、両政策とも政府が積極的に経済に介入した点が特徴です。「両方とも民主主義を強化していった点」は誤りで、ナチスの政策はむしろ独裁体制の強化につながっており、民主主義の強化とは異なる方向性です。「両方とも戦争を回避しようとしていった点」は誤りで、特にナチスの政策はその後の対外拡張・戦争につながっており、戦争回避を目的としたものとはいえません。"},
  /* 地理 */
  {id:"geo299", cat:"地理", sub:"日本地理", q:"扇状地と三角州はどちらも川の堆積作用によってできるが、両者の違いとして正しいものはどれか。", choices:["扇状地は山地の出口、三角州は河口にできる","扇状地は河口、三角州は山地の出口にできる","両者はまったく同じ場所にできる","扇状地は海底にできる地形である"], a:0, e:"正解は「扇状地は山地の出口、三角州は河口にできる」です。扇状地は川が山地から平地に出る場所に、三角州は川が海や湖に流れ込む河口付近にできる点が異なります。「扇状地は河口、三角州は山地の出口にできる」は誤りで、これは両者の位置関係が逆になっており、事実と反しています。「両者はまったく同じ場所にできる」は誤りで、扇状地と三角州は川の異なる区間（上流寄りと下流の河口付近）に形成される、異なる地形です。「扇状地は海底にできる地形である」は誤りで、扇状地は陸上（山地の出口）にできる地形であり、海底にできるものではありません。"},
  {id:"geo301", cat:"地理", sub:"日本地理", q:"促成栽培と抑制栽培はどちらも出荷時期を調整する技術だが、両者の違いとして正しいものはどれか。", choices:["促成栽培は早め、抑制栽培は遅らせる","促成栽培は遅らせ、抑制栽培は早める","両者は同じ技術で違いは存在しない","促成栽培も抑制栽培も輸入野菜を扱う"], a:0, e:"正解は「促成栽培は早め、抑制栽培は遅らせる」です。促成栽培は温暖な気候などを利用して出荷を早め、抑制栽培は冷涼な気候などを利用して出荷を遅らせる栽培方法です。「促成栽培は遅らせ、抑制栽培は早める」は誤りで、これは両者の効果が逆になっており、事実と反しています。「両者は同じ技術で違いは存在しない」は誤りで、促成栽培と抑制栽培は出荷時期を調整する方向（早めるか遅らせるか）が正反対の技術です。「促成栽培も抑制栽培も輸入野菜を扱う」は誤りで、両者はいずれも国内での栽培方法に関する技術であり、輸入野菜を扱う仕組みではありません。"},
  {id:"geo303", cat:"地理", sub:"日本地理", q:"太平洋側と日本海側で降水量が多くなる季節が異なる理由として理解が正しいものはどれか。", choices:["季節風が山地にぶつかる側で雨や雪を降らせる","太平洋側と日本海側の緯度が大きく異なる","日本海側には山地が全く存在しない","太平洋側には季節風が全く吹かない"], a:0, e:"正解は「季節風が山地にぶつかる側で雨や雪を降らせる」です。夏は南東の、冬は北西の季節風が山地にぶつかることで、それぞれ太平洋側と日本海側に多くの雨や雪を降らせます。「太平洋側と日本海側の緯度が大きく異なる」は誤りで、同じ緯度帯でも太平洋側と日本海側で降水パターンが異なるのは緯度の違いではなく季節風と山地の影響によるものです。「日本海側には山地が全く存在しない」は誤りで、実際には日本列島には脊梁山脈が走っており、これが季節風をせき止める重要な役割を果たしています。「太平洋側には季節風が全く吹かない」は誤りで、太平洋側にも夏には南東からの季節風が吹き、降水をもたらしています。"},
  {id:"geo305", cat:"地理", sub:"世界地理", q:"モンスーンアジアで稲作が盛んな理由として、気候条件から正しく理解できるものはどれか。", choices:["夏の季節風により高温多雨となるため","一年中乾燥した気候が続くため","冬にのみ雨が降る気候であるため","気温が一年中低い気候であるため"], a:0, e:"正解は「夏の季節風により高温多雨となるため」です。モンスーンアジアでは夏の季節風により高温多雨となり、この気候が稲作に適しているため稲作が盛んです。「一年中乾燥した気候が続くため」は誤りで、これは稲作に必要な水を確保しにくい気候であり、稲作が盛んな地域の特徴とは正反対です。「冬にのみ雨が降る気候であるため」は誤りで、モンスーンアジアの特徴はむしろ夏に降水が集中することであり、冬に雨が降るという内容は事実と異なります。「気温が一年中低い気候であるため」は誤りで、これは稲作に不向きな気候であり、モンスーンアジアの高温多雨な特徴とは異なります。"},
  {id:"geo307", cat:"地理", sub:"世界地理", q:"地中海式農業で夏にオリーブやぶどうが栽培される理由として正しいものはどれか。", choices:["夏の乾燥に強い作物が適しているため","夏に雨が非常に多い気候であるため","冬の高温に対応するためである","一年中同じ気候が続くためである"], a:0, e:"正解は「夏の乾燥に強い作物が適しているため」です。地中海性気候は夏に高温で乾燥するため、乾燥に強いオリーブやぶどうなどの栽培に適しています。「夏に雨が非常に多い気候であるため」は誤りで、事実とは逆であり、地中海性気候は夏に「乾燥」することが特徴です。「冬の高温に対応するためである」は誤りで、地中海性気候は冬に比較的雨が多く、夏ほど高温ではないため、この選択肢は事実と合いません。「一年中同じ気候が続くためである」は誤りで、地中海性気候は夏と冬で気候（気温・降水量）が明確に異なる特徴を持ちます。"},
  {id:"geo309", cat:"地理", sub:"世界地理", q:"発展途上国でモノカルチャー経済がとられている国が資源価格の変動に弱い理由として正しいものはどれか。", choices:["特定の資源の輸出に経済が依存しているため","多様な産業がバランスよく発展しているため","資源をまったく輸出していないため","先進国と同じ経済構造を持つため"], a:0, e:"正解は「特定の資源の輸出に経済が依存しているため」です。特定の資源や農産物の輸出に経済が依存しているため、その価格が下落すると国全体の経済が大きな打撃を受けます。「多様な産業がバランスよく発展しているため」は誤りで、これはモノカルチャー経済とは正反対の状態であり、多様な産業があればむしろ資源価格変動の影響は緩和されます。「資源をまったく輸出していないため」は誤りで、モノカルチャー経済はまさに特定の資源を輸出することに依存する経済構造を指します。「先進国と同じ経済構造を持つため」は誤りで、モノカルチャー経済は一般に発展途上国に特徴的な経済構造であり、先進国の多様化した経済構造とは異なります。"},
  {id:"geo311", cat:"地理", sub:"日本地理", q:"過密と過疎はどちらも人口分布の偏りを表す言葉だが、両者の違いとして正しいものはどれか。", choices:["過密は集中しすぎ、過疎は減りすぎる状態","過密は人口減少、過疎は人口増加を指す","両者はまったく同じ現象を指している","過密と過疎はどちらも農村部だけの現象"], a:0, e:"正解は「過密は集中しすぎ、過疎は減りすぎる状態」です。過密は特定の地域に人口が集中しすぎる状態、過疎は人口が減少しすぎる状態を指し、正反対の現象です。「過密は人口減少、過疎は人口増加を指す」は誤りで、これは両者の定義が逆になっており、事実と反しています。「両者はまったく同じ現象を指している」は誤りで、過密と過疎は人口の集中と減少という正反対の現象を指す、異なる概念です。「過密と過疎はどちらも農村部だけの現象」は誤りで、過密はむしろ都市部で起こる現象であり、過疎が農村部で起こる現象です。"},
  {id:"geo313", cat:"地理", sub:"世界地理", q:"地球温暖化が進むと、海面の変化を通じて低地の島国にどのような影響が生じると考えられるか。", choices:["海面上昇により国土の水没が懸念される","海面が下降し国土が拡大していく","気温が下がり氷河が拡大していく","島国には特に影響が生じない"], a:0, e:"正解は「海面上昇により国土の水没が懸念される」です。地球温暖化による氷河の融解などで海面が上昇すると、標高の低い島国では国土の水没が懸念されます。「海面が下降し国土が拡大していく」は誤りで、事実とは逆であり、地球温暖化はむしろ海面「上昇」を招くと考えられています。「気温が下がり氷河が拡大していく」は誤りで、これは地球温暖化とは正反対の現象であり、実際には気温上昇と氷河の融解が進むとされています。「島国には特に影響が生じない」は誤りで、標高の低い島国はむしろ海面上昇の影響を最も受けやすい地域として懸念されています。"},
  {id:"geo315", cat:"地理", sub:"世界地理", q:"再生可能エネルギーの導入が進むことは化石燃料に依存する国のエネルギー政策にどう変化を促すか。", choices:["エネルギー源の多様化や輸入依存の低減","化石燃料への依存がさらに強まっていく","エネルギー政策に特に変化は生じない","再生可能エネルギーの導入が禁止される"], a:0, e:"正解は「エネルギー源の多様化や輸入依存の低減」です。再生可能エネルギーの導入により、特定の資源の輸入に頼らないエネルギー源の多様化が図られます。「化石燃料への依存がさらに強まっていく」は誤りで、事実とは逆であり、再生可能エネルギーの導入はむしろ化石燃料への依存を減らす方向に働きます。「エネルギー政策に特に変化は生じない」は誤りで、再生可能エネルギーの導入はエネルギー政策のあり方に大きな変化をもたらす取り組みです。「再生可能エネルギーの導入が禁止される」は誤りで、実際には多くの国で再生可能エネルギーの導入が積極的に推進されています。"},
  {id:"geo317", cat:"地理", sub:"世界地理", q:"世界的な人口の都市集中が進むと農村部にはどのような影響が生じやすいか。", choices:["過疎化が進み高齢化が加速していく","農村部の人口がさらに急増していく","農業生産が飛躍的に向上していく","農村部の若者の割合が増加していく"], a:0, e:"正解は「過疎化が進み高齢化が加速していく」です。若い世代が仕事を求めて都市へ移動することで、農村部では過疎化が進み高齢化が加速する傾向があります。「農村部の人口がさらに急増していく」は誤りで、事実とは逆であり、都市への人口集中が進むと農村部の人口はむしろ減少する傾向にあります。「農業生産が飛躍的に向上していく」は誤りで、過疎化が進むと働き手が減少し、農業生産にはむしろマイナスの影響が生じることが懸念されます。「農村部の若者の割合が増加していく」は誤りで、実際には若者が都市へ流出することで、農村部では高齢者の割合がむしろ高まる傾向にあります。"},
  {id:"geo319", cat:"地理", sub:"世界地理", q:"排他的経済水域が設定されていることは沿岸国の漁業や資源開発にどのような意味を持つか。", choices:["一定範囲内で自国が優先的に利用できる","他国も自由に資源を利用できる範囲が広がる","水域内では航行がすべて禁止される","排他的経済水域は領土と同じ扱いになる"], a:0, e:"正解は「一定範囲内で自国が優先的に利用できる」です。排他的経済水域内では、沿岸国が水産資源や海底資源を優先的に利用する権利を持ちます。「他国も自由に資源を利用できる範囲が広がる」は誤りで、事実とは逆であり、排他的経済水域はむしろ沿岸国が「優先的」に利用できる範囲であり、他国の自由な利用を制限する性格を持ちます。「水域内では航行がすべて禁止される」は誤りで、排他的経済水域内でも他国の船舶の航行自体は一般に認められており、禁止されているわけではありません。「排他的経済水域は領土と同じ扱いになる」は誤りで、排他的経済水域は資源利用に関する権利が及ぶ海域であり、主権が完全に及ぶ領土とは法的な扱いが異なります。"},
  {id:"geo321", cat:"地理", sub:"世界地理", q:"フェアトレードの仕組みが広まることは発展途上国の生産者にどのような影響を与えると期待されるか。", choices:["公正な対価を得られ生活の安定につながる","生産者の収入がさらに減少していく","先進国の企業だけが利益を得ていく","フェアトレードは生産者に影響しない"], a:0, e:"正解は「公正な対価を得られ生活の安定につながる」です。フェアトレードにより生産者が公正な対価を得られることで、生活の安定や継続的な生産につながることが期待されます。「生産者の収入がさらに減少していく」は誤りで、事実とは逆であり、フェアトレードはまさに生産者の収入・生活水準の向上を目指す仕組みです。「先進国の企業だけが利益を得ていく」は誤りで、フェアトレードの目的はむしろ発展途上国の生産者に公正な利益が還元されるようにすることです。「フェアトレードは生産者に影響しない」は誤りで、フェアトレードは生産者への公正な対価の支払いを通じて、その生活に直接的な影響を与える仕組みです。"},
  {id:"geo323", cat:"地理", sub:"世界地理", q:"プランテーション農業が単一の商品作物に依存することは、その地域の経済にどのようなリスクをもたらすか。", choices:["価格変動の影響を受けやすくなる","価格変動の影響をまったく受けなくなる","多様な産業が自動的に育っていく","リスクは一切生じないままである"], a:0, e:"正解は「価格変動の影響を受けやすくなる」です。単一の作物に依存すると、その作物の国際価格が下落した際に地域全体の経済が大きな打撃を受けやすくなります。「価格変動の影響をまったく受けなくなる」は誤りで、事実とは正反対であり、単一作物への依存はむしろ価格変動の影響を非常に受けやすい構造をつくります。「多様な産業が自動的に育っていく」は誤りで、単一の商品作物に依存するプランテーション農業はむしろ産業の多角化を妨げる要因ともなり得ます。「リスクは一切生じないままである」は誤りで、単一作物への依存は明確な経済的リスク（価格変動への脆弱性）を伴います。"},
  {id:"geo325", cat:"地理", sub:"日本地理", q:"少子高齢化が進む社会で労働力人口が減少すると、経済にどのような影響が生じやすいか。", choices:["経済成長率の低下や社会保障の負担増加","労働力不足はまったく問題にならない","経済成長率が急激に上昇していく","社会保障の負担が軽くなっていく"], a:0, e:"正解は「経済成長率の低下や社会保障の負担増加」です。労働力人口の減少は生産活動の低下を招きやすく、また社会保障を支える現役世代の負担も増加します。「労働力不足はまったく問題にならない」は誤りで、事実とは逆であり、労働力不足は生産活動の停滞など経済に深刻な影響を及ぼしうる問題です。「経済成長率が急激に上昇していく」は誤りで、労働力人口の減少は一般に経済成長にマイナスの影響を与えるとされ、この選択肢は事実と異なります。「社会保障の負担が軽くなっていく」は誤りで、少子高齢化にともない支える世代が減ることで、社会保障の負担はむしろ重くなる傾向にあります。"},
  {id:"geo327", cat:"地理", sub:"日本地理", q:"都市の中心部で地価が高騰すると、住民の居住地選択にどのような変化が生じやすいか。", choices:["郊外への移住が進みドーナツ化現象が起こる","都心部への人口集中がさらに進んでいく","住民の移動はまったく起こらない","地価と居住地選択には関係がない"], a:0, e:"正解は「郊外への移住が進みドーナツ化現象が起こる」です。都心部の地価が高騰すると、比較的地価の安い郊外へ移り住む人が増え、ドーナツ化現象が起こりやすくなります。「都心部への人口集中がさらに進んでいく」は誤りで、地価高騰はむしろ人々を都心部から遠ざける要因となり、都心集中とは逆の動きを促します。「住民の移動はまったく起こらない」は誤りで、実際には地価の変動は住民の居住地選択に大きな影響を与え、移動を促す要因となります。「地価と居住地選択には関係がない」は誤りで、地価は住居費用に直結するため、居住地選択に大きく影響する重要な要因です。"},
  {id:"geo329", cat:"地理", sub:"世界地理", q:"発展途上国で人口爆発が起こると、都市部にはどのような問題が生じやすいか。", choices:["スラム形成やインフラ不足の問題が生じやすい","都市の整備が自動的に進んでいく","人口爆発は都市部に影響しない","農村部の人口がさらに増加していく"], a:0, e:"正解は「スラム形成やインフラ不足の問題が生じやすい」です。急激な人口増加に都市のインフラ整備が追いつかず、スラムの形成や住宅不足などの問題が生じやすくなります。「都市の整備が自動的に進んでいく」は誤りで、実際には急激な人口増加にインフラ整備が追いつかないことが問題の本質であり、自動的に整備が進むわけではありません。「人口爆発は都市部に影響しない」は誤りで、人口爆発による都市への人口流入は都市の住宅・インフラに大きな影響を及ぼします。「農村部の人口がさらに増加していく」は誤りで、人口爆発と都市化が同時に進む場合、農村から都市への人口移動が生じることが多く、農村人口の増加とは異なる動きです。"},
  {id:"geo331", cat:"地理", sub:"世界地理", q:"先進国と発展途上国の間の経済格差である南北問題は、援助や貿易のあり方にどのような課題を投げかけているか。", choices:["公正な貿易や効果的な援助のあり方が問われる","貿易や援助とは特に関係がない","先進国だけが一方的に利益を得ればよい","発展途上国は援助を必要としていない"], a:0, e:"正解は「公正な貿易や効果的な援助のあり方が問われる」です。南北問題の解消に向けて、単なる援助だけでなく、発展途上国にとって公正な貿易の仕組みをどう構築するかが課題となっています。「貿易や援助とは特に関係がない」は誤りで、南北問題はまさに先進国と発展途上国の経済関係（貿易や援助）のあり方に関わる問題です。「先進国だけが一方的に利益を得ればよい」は誤りで、これは南北問題の是正とは逆の方向性であり、公正な関係の構築という課題認識とは相容れません。「発展途上国は援助を必要としていない」は誤りで、実際には多くの発展途上国が経済発展のために援助や公正な貿易関係を必要としています。"},
  {id:"geo333", cat:"地理", sub:"日本地理", q:"加工貿易を中心に発展してきた日本にとって、原油価格の急激な上昇はどのような影響を与えるか。", choices:["原料の輸入コストが増加し経済に影響する","原油価格は日本経済に影響しない","日本は原油をまったく必要としない","原油価格の上昇は日本に有利にのみ働く"], a:0, e:"正解は「原料の輸入コストが増加し経済に影響する」です。資源に乏しく多くを輸入に頼る日本にとって、原油価格の上昇は原料コストの増加を通じて経済全体に影響を与えます。「原油価格は日本経済に影響しない」は誤りで、事実とは正反対であり、資源を輸入に頼る日本経済は原油価格の変動から大きな影響を受けます。「日本は原油をまったく必要としない」は誤りで、日本は多くのエネルギー・原料を石油に依存しており、原油を必要としないという内容は事実と異なります。「原油価格の上昇は日本に有利にのみ働く」は誤りで、原油価格の上昇はむしろ日本にとってコスト増加という不利な影響をもたらすことが一般的です。"},
  {id:"geo335", cat:"地理", sub:"世界地理", q:"気候変動対策としての国際的な排出量取引の仕組みは企業の行動にどのような影響を与えると考えられるか。", choices:["コスト意識が高まり技術革新が促される","企業の排出削減の努力を妨げてしまう","排出量取引は企業に影響を与えない","企業は排出量を無制限に増やせるようになる"], a:0, e:"正解は「コスト意識が高まり技術革新が促される」です。排出枠を売買可能にすることで、排出削減へのコスト意識が高まり、省エネ技術などの開発が促されます。「企業の排出削減の努力を妨げてしまう」は誤りで、事実とは逆であり、排出量取引は経済的なインセンティブを通じて排出削減の努力を促す仕組みです。「排出量取引は企業に影響を与えない」は誤りで、排出量取引は企業のコスト構造に直接影響を与え、行動変容を促す仕組みです。「企業は排出量を無制限に増やせるようになる」は誤りで、排出量取引はむしろ排出量に上限（枠）を設ける仕組みであり、無制限な増加を認めるものではありません。"},
  {id:"geo337", cat:"地理", sub:"世界地理", q:"世界的な観光産業の発展は自然環境や地域社会にどのような課題をもたらすことがあるか。", choices:["環境破壊やオーバーツーリズムが生じることがある","観光産業は環境に一切影響を与えない","観光産業により環境は自動的に改善する","地域社会には常に良い影響しか生じない"], a:0, e:"正解は「環境破壊やオーバーツーリズムが生じることがある」です。観光客の急増は自然環境への負荷や地域住民の生活への影響（オーバーツーリズム）などの課題をもたらすことがあります。「観光産業は環境に一切影響を与えない」は誤りで、事実とは異なり、観光客の増加は自然環境や地域社会に様々な負荷を与えることがあります。「観光産業により環境は自動的に改善する」は誤りで、観光産業の発展が自動的に環境改善につながるわけではなく、むしろ適切な管理が必要とされています。「地域社会には常に良い影響しか生じない」は誤りで、観光産業には経済的な恩恵がある一方、オーバーツーリズムなどの負の側面も指摘されています。"},
  {id:"geo339", cat:"地理", sub:"世界地理", q:"情報通信技術産業がインドで発展した背景には、どのような要因が関わっていると考えられるか。", choices:["英語力や技術者の豊富さなど人材面の強み","インドには技術者がまったく存在しなかった","情報通信技術産業は偶然発展しただけである","インドは工業化を完全に拒否していた"], a:0, e:"正解は「英語力や技術者の豊富さなど人材面の強み」です。英語力の高さや理数系教育の充実による優秀な技術者の存在が、インドのICT産業発展の背景にあります。「インドには技術者がまったく存在しなかった」は誤りで、事実とは正反対であり、インドには優秀な技術者が豊富に存在することがICT産業発展の重要な要因です。「情報通信技術産業は偶然発展しただけである」は誤りで、実際には人材面の強みなど明確な要因があり、単なる偶然とはいえません。「インドは工業化を完全に拒否していた」は誤りで、インドはICT産業をはじめ様々な産業の発展を積極的に進めてきた国です。"},
  {id:"geo341", cat:"地理", sub:"世界地理", q:"世界の主な工業地域が沿岸部に集中する傾向は、貿易のどのような特徴と関係しているか。", choices:["船による輸送が原料輸入や製品輸出に有利","内陸部の方が輸送に有利である","工業は貿易とまったく関係がない","沿岸部は工業に適さない立地である"], a:0, e:"正解は「船による輸送が原料輸入や製品輸出に有利」です。港を利用した船による輸送は大量の原料や製品を安く運べるため、多くの工業地域が沿岸部に集中しています。「内陸部の方が輸送に有利である」は誤りで、事実とは逆であり、大量輸送においては船を利用できる沿岸部の方が一般に有利とされています。「工業は貿易とまったく関係がない」は誤りで、多くの工業は原料の輸入や製品の輸出という貿易活動と密接に結びついています。「沿岸部は工業に適さない立地である」は誤りで、事実とは正反対であり、沿岸部はむしろ多くの工業地域が集中する適した立地とされています。"},
  {id:"geo343", cat:"地理", sub:"世界地理", q:"地域経済統合（EUなど）が進むことは加盟国間の貿易にどのような変化をもたらすか。", choices:["関税などの障壁が減り貿易がより活発になる","貿易障壁がさらに高くなっていく","加盟国間の貿易がすべて禁止される","地域経済統合は貿易に影響しない"], a:0, e:"正解は「関税などの障壁が減り貿易がより活発になる」です。地域経済統合により関税などの貿易障壁が引き下げられ、加盟国間の貿易がより活発に行われるようになります。「貿易障壁がさらに高くなっていく」は誤りで、事実とは逆であり、地域経済統合はむしろ加盟国間の貿易障壁を「引き下げる」ことを目的としています。「加盟国間の貿易がすべて禁止される」は誤りで、地域経済統合の目的はむしろ貿易の活性化であり、禁止とは正反対の内容です。「地域経済統合は貿易に影響しない」は誤りで、地域経済統合は加盟国間の貿易に大きな影響（活発化）をもたらす取り組みです。"},
  {id:"geo345", cat:"地理", sub:"世界地理", q:"気候区分において、同じ緯度帯でも海流や地形の違いによって気候が異なることがあるのはなぜか。", choices:["暖流・寒流や山地の有無が気温や降水に影響する","緯度だけがすべての気候を決定する","海流は気候にまったく影響しない","地形は気候に影響を与えない"], a:0, e:"正解は「暖流・寒流や山地の有無が気温や降水に影響する」です。暖流や寒流の影響、山地の有無などによって、同じ緯度帯であっても気温や降水量に違いが生じます。「緯度だけがすべての気候を決定する」は誤りで、実際には緯度以外にも海流や地形などの要因が気候に大きく影響します。「海流は気候にまったく影響しない」は誤りで、暖流・寒流は沿岸地域の気温や降水量に大きな影響を与える重要な要因です。「地形は気候に影響を与えない」は誤りで、山地の存在は季節風をせき止めるなど、気候形成に大きな影響を及ぼします。"},
  {id:"geo347", cat:"地理", sub:"世界地理", q:"発展途上国で外国からの投資を積極的に受け入れることは、その国の産業構造にどのような変化をもたらすことが期待されるか。", choices:["工業化が進み産業構造の転換が促される","産業構造にまったく変化が生じない","投資は農業のみを対象とする","外国投資は経済発展を妨げる"], a:0, e:"正解は「工業化が進み産業構造の転換が促される」です。外国からの投資により工場建設や技術移転が進むことで、農業中心から工業中心への産業構造の転換が期待されます。「産業構造にまったく変化が生じない」は誤りで、外国投資は一般に工場建設や雇用創出を通じて産業構造に大きな変化をもたらします。「投資は農業のみを対象とする」は誤りで、外国からの投資は農業に限らず、工業やサービス業など幅広い分野を対象とすることが一般的です。「外国投資は経済発展を妨げる」は誤りで、事実とは逆であり、外国投資は多くの発展途上国にとって経済発展を後押しする重要な要因とされています。"},
  /* 公民 */
  {id:"civ299", cat:"公民", sub:"経済", q:"ある企業が競合他社と話し合って価格を統一した場合、これはどの法律に違反する可能性が高いか。", choices:["独占禁止法","労働基準法","製造物責任法","消費者契約法"], a:0, e:"正解は「独占禁止法」です。企業同士が価格を協定して市場を支配しようとする行為（カルテル）は、独占禁止法によって規制されています。「労働基準法」は誤りで、これは労働条件の最低基準を定める法律であり、企業間の価格協定とは異なる分野です。「製造物責任法」は誤りで、これは欠陥商品による消費者被害の責任を定める法律であり、価格協定とは異なります。「消費者契約法」は誤りで、これは事業者と消費者の契約に関する法律であり、企業間の価格協定を規制する法律とは対象が異なります。"},
  {id:"civ301", cat:"公民", sub:"労働・法律", q:"訪問販売で契約した消費者が、後から冷静に考え直して解約したいと考えた場合、利用できる制度は何か。", choices:["クーリング・オフ制度","三審制による再審理","国民審査による罷免","弾劾裁判による罷免"], a:0, e:"正解は「クーリング・オフ制度」です。クーリング・オフ制度により、訪問販売などで結んだ契約は一定期間内であれば無条件で解除できます。「三審制による再審理」は誤りで、これは裁判の審級制度に関する仕組みであり、消費者契約の解除とは異なる分野です。「国民審査による罷免」は誤りで、これは最高裁判所裁判官の適否を審査する制度であり、契約解除とは無関係です。「弾劾裁判による罷免」は誤りで、これは裁判官を辞めさせるかどうかを審理する制度であり、消費者の契約解除とは全く異なります。"},
  {id:"civ303", cat:"公民", sub:"政治体制", q:"ある国の内閣が国会の信任を失った場合、とりうる対応として憲法上正しいものはどれか。", choices:["衆議院を解散するか総辞職する","何も対応する必要はない","天皇に統治を委ねる","最高裁判所が内閣を選び直す"], a:0, e:"正解は「衆議院を解散するか総辞職する」です。内閣不信任決議が可決された場合、内閣は10日以内に衆議院を解散するか総辞職しなければなりません。「何も対応する必要はない」は誤りで、憲法上、内閣不信任決議が可決された場合には一定の対応が義務づけられています。「天皇に統治を委ねる」は誤りで、天皇は政治的権能を持たない象徴的存在であり、統治を委ねられる立場にはありません。「最高裁判所が内閣を選び直す」は誤りで、内閣総理大臣の指名は国会の役割であり、司法を担う最高裁判所の役割ではありません。"},
  {id:"civ305", cat:"公民", sub:"経済", q:"景気が過熱し物価が上昇し続けているとき、日本銀行がとると考えられる金融政策はどれか。", choices:["金利を引き上げ資金の流れを抑える","金利を引き下げ資金の流れを増やす","紙幣をさらに大量に発行する","税金をすべて廃止する"], a:0, e:"正解は「金利を引き上げ資金の流れを抑える」です。インフレの懸念があるときには、日本銀行は金利を引き上げて資金の流れを抑制する金融政策をとります。「金利を引き下げ資金の流れを増やす」は誤りで、これは不況のときにとられる政策であり、景気過熱時の対応とは逆の内容です。「紙幣をさらに大量に発行する」は誤りで、これは金融緩和に近い措置であり、景気の過熱を抑える目的とは逆の方向性です。「税金をすべて廃止する」は誤りで、これは財政政策に関する極端な内容であり、日本銀行が行う金融政策の手段でもありません。"},
  {id:"civ307", cat:"公民", sub:"経済", q:"不況で企業の倒産や失業が増加しているとき、政府がとると考えられる財政政策はどれか。", choices:["公共事業を増やし減税を行う","公共事業を減らし増税を行う","財政政策は景気に影響しない","税金をすべて廃止する"], a:0, e:"正解は「公共事業を増やし減税を行う」です。不況のときには公共事業を増やし減税を行うことで、需要を刺激し景気を回復させる財政政策がとられます。「公共事業を減らし増税を行う」は誤りで、これは景気が過熱しているときにとられる政策であり、不況時の対応とは逆の内容です。「財政政策は景気に影響しない」は誤りで、財政政策はまさに公共事業や税制を通じて景気に働きかける政策手段です。「税金をすべて廃止する」は誤りで、これは現実的な財政政策とはいえず、税収がなくなれば公共サービスの提供も困難になります。"},
  {id:"civ309", cat:"公民", sub:"政治体制", q:"ある工場から出た有害物質によって周辺住民の健康被害が生じた場合、これはどのような権利の侵害に関わる問題か。", choices:["環境権","参政権","財産権のみ","選挙権"], a:0, e:"正解は「環境権」です。良好な環境の中で生活する権利である環境権が、工場からの有害物質による健康被害という形で侵害される問題です。「参政権」は誤りで、これは選挙権など政治に参加する権利であり、環境被害とは異なる分野の権利です。「財産権のみ」は誤りで、財産への被害は生じうるものの、健康被害という側面は環境権の問題としてより本質的に捉えられます。「選挙権」は誤りで、これは政治参加に関する権利であり、環境汚染による健康被害とは異なる権利です。"},
  {id:"civ311", cat:"公民", sub:"政治体制", q:"選挙区によって議員一人あたりの有権者数に大きな差がある場合、これはどの原則に反すると考えられるか。", choices:["一票の価値の平等の原則","三権分立の原則","地方自治の原則","罪刑法定主義の原則"], a:0, e:"正解は「一票の価値の平等の原則」です。議員一人あたりの有権者数に大きな差があると、選挙区によって一票の価値に差が生じ、法の下の平等に反すると考えられます。「三権分立の原則」は誤りで、これは立法・行政・司法の権力分立に関する原則であり、選挙における一票の格差とは異なる問題です。「地方自治の原則」は誤りで、これは地方公共団体の自治に関する原則であり、一票の格差問題とは異なる分野です。「罪刑法定主義の原則」は誤りで、これは犯罪と刑罰を法律で定めるべきとする刑事法上の原則であり、選挙の一票の格差とは無関係です。"},
  {id:"civ313", cat:"公民", sub:"政治体制", q:"ある国の裁判所が国会の制定した法律を憲法に違反すると判断した場合、これはどのような権限の行使といえるか。", choices:["違憲審査権","国政調査権","弾劾裁判権","条約締結権"], a:0, e:"正解は「違憲審査権」です。法律や行政処分が憲法に違反していないかを審査する権限を違憲審査権といい、裁判所がこれを持っています。「国政調査権」は誤りで、これは国会が行政を調査する権限であり、裁判所が法律の違憲性を審査する権限とは主体・内容が異なります。「弾劾裁判権」は誤りで、これは国会が裁判官を辞めさせるかどうかを審理する権限であり、法律の違憲審査とは異なります。「条約締結権」は誤りで、これは内閣が持つ条約を締結する権限であり、違憲審査とは全く異なる権限です。"},
  {id:"civ315", cat:"公民", sub:"労働・法律", q:"労働者が賃金の引き上げを求めてストライキを行うことは、憲法上どの権利の行使にあたるか。", choices:["団体行動権","経営権","財産権","参政権"], a:0, e:"正解は「団体行動権」です。ストライキなど労働者が団結して行動を起こす権利を団体行動権といい、労働三権の一つとして保障されています。「経営権」は誤りで、これは企業経営者が持つ経営に関する権限であり、労働者が行使するストライキの根拠となる権利ではありません。「財産権」は誤りで、これは自己の財産を所有・処分する権利であり、労働者の団体行動とは異なる権利です。「参政権」は誤りで、これは選挙権など政治に参加する権利であり、労働条件をめぐるストライキとは異なる分野の権利です。"},
  {id:"civ317", cat:"公民", sub:"経済", q:"ある企業が海外に生産拠点を移した結果、国内工場が閉鎖され雇用が失われた場合、これは何と呼ばれる現象の一例か。", choices:["産業の空洞化","インフレーション","デフレーション","市場の独占"], a:0, e:"正解は「産業の空洞化」です。企業が生産拠点を海外に移すことで国内の雇用や技術力が失われることを、産業の空洞化といいます。「インフレーション」は誤りで、これは物価が継続的に上昇する現象を指す言葉であり、生産拠点の海外移転とは異なる経済現象です。「デフレーション」は誤りで、これは物価が継続的に下落する現象を指す言葉であり、これも産業空洞化とは異なる概念です。「市場の独占」は誤りで、これは特定の企業が市場を支配する状態を指す言葉であり、生産拠点の海外移転による雇用喪失とは異なる現象です。"},
  {id:"civ319", cat:"公民", sub:"国際関係", q:"発展途上国の生産者から公正な価格で作物を買い取り、先進国で販売する取り組みは何を目的としているか。", choices:["生産者の生活向上と公正な取引の実現","先進国企業の利益最大化のみを目指す","生産者への支援を打ち切ること","輸入品の価格を引き下げること"], a:0, e:"正解は「生産者の生活向上と公正な取引の実現」です。フェアトレードは発展途上国の生産者に公正な対価を支払うことで、その生活向上を目指す取り組みです。「先進国企業の利益最大化のみを目指す」は誤りで、これはフェアトレードの趣旨とは正反対であり、フェアトレードはむしろ生産者側の利益を重視する仕組みです。「生産者への支援を打ち切ること」は誤りで、フェアトレードはまさに生産者への継続的な支援・公正な取引を目的とした仕組みであり、支援打ち切りとは逆です。「輸入品の価格を引き下げること」は誤りで、フェアトレードはむしろ生産者に公正な（時に相場より高い）対価を支払うことを重視する仕組みです。"},
  {id:"civ321", cat:"公民", sub:"国際関係", q:"ある国で少数の常任理事国が拒否権を行使して重要な決議が成立しなかった場合、これはどの機関の特徴を示す例か。", choices:["安保理での大国の合意重視という特徴","国連総会の多数決という原則","国際司法裁判所の判決という特徴","WTOの紛争解決手続きという特徴"], a:0, e:"正解は「安保理での大国の合意重視という特徴」です。安全保障理事会では常任理事国が拒否権を持つため、大国の合意がなければ重要な決議も成立しないという特徴があります。「国連総会の多数決という原則」は誤りで、総会は多数決で決定が行われる機関であり、拒否権が存在する安全保障理事会とは仕組みが異なります。「国際司法裁判所の判決という特徴」は誤りで、これは国家間の法的紛争を裁く司法機関であり、拒否権とは異なる仕組みで運営されています。「WTOの紛争解決手続きという特徴」は誤りで、これは貿易紛争を扱う別の国際機関の手続きであり、安全保障理事会の拒否権とは異なります。"},
  {id:"civ323", cat:"公民", sub:"政治体制", q:"ある地方公共団体で住民が一定数の署名を集め、条例の制定を求めた場合、これはどの権利の行使にあたるか。", choices:["直接請求権","国政調査権","弾劾裁判権","違憲審査権"], a:0, e:"正解は「直接請求権」です。条例の制定や改廃を住民が直接請求できる権利を直接請求権といい、地方自治における住民参加の重要な仕組みです。「国政調査権」は誤りで、これは国会が行政を調査する権限であり、住民による条例制定請求とは主体・レベルが異なります。「弾劾裁判権」は誤りで、これは国会が裁判官を辞めさせるかどうかを審理する権限であり、住民による条例請求とは全く異なります。「違憲審査権」は誤りで、これは裁判所が法律などの合憲性を審査する権限であり、住民の条例制定請求権とは異なる制度です。"},
  {id:"civ325", cat:"公民", sub:"経済", q:"円の価値が対ドルで上昇（円高）した場合、日本から海外へ旅行する人にとってどのような影響が生じるか。", choices:["現地での買い物などが割安になる","現地での買い物などが割高になる","為替レートは旅行に影響しない","日本円が海外で使えなくなる"], a:0, e:"正解は「現地での買い物などが割安になる」です。円高になると同じ円で交換できる外貨の量が増えるため、海外での買い物などが割安に感じられます。「現地での買い物などが割高になる」は誤りで、これは円安の場合の影響であり、円高の場合とは逆の内容です。「為替レートは旅行に影響しない」は誤りで、実際には為替レートの変動は海外旅行での購買力に直接影響を与えます。「日本円が海外で使えなくなる」は誤りで、円高・円安は交換レートの変動であり、日本円自体が使えなくなるという内容とは異なります。"},
  {id:"civ327", cat:"公民", sub:"経済", q:"円の価値が対ドルで下落（円安）した場合、日本の輸出企業にとってどのような影響が生じやすいか。", choices:["価格競争力が高まり輸出が有利になる","海外での価格競争力が低下する","為替レートは輸出に影響しない","輸出がすべて禁止される"], a:0, e:"正解は「価格競争力が高まり輸出が有利になる」です。円安になると外貨建てでみた日本製品の価格が下がるため、輸出企業の海外での価格競争力が高まります。「海外での価格競争力が低下する」は誤りで、これは円高の場合の影響であり、円安の場合とは逆の内容です。「為替レートは輸出に影響しない」は誤りで、実際には為替レートの変動は輸出企業の価格競争力に大きな影響を与えます。「輸出がすべて禁止される」は誤りで、円安・円高は為替レートの変動であり、輸出そのものが禁止される事態とは全く異なります。"},
  {id:"civ329", cat:"公民", sub:"法律", q:"ある製品の欠陥によって消費者がけがをした場合、消費者が製造者の責任を問うために利用できる法律はどれか。", choices:["製造物責任法","労働基準法","独占禁止法","地方自治法"], a:0, e:"正解は「製造物責任法」です。製造物責任法（PL法）は、欠陥商品によって消費者が被害を受けた場合の製造者の責任を定めた法律です。「労働基準法」は誤りで、これは労働条件の最低基準を定める法律であり、製品の欠陥による消費者被害とは異なる分野です。「独占禁止法」は誤りで、これは企業間の公正な競争を確保する法律であり、製品の欠陥責任とは異なります。「地方自治法」は誤りで、これは地方自治の仕組みを定める法律であり、消費者被害の責任とは全く異なる分野です。"},
  {id:"civ331", cat:"公民", sub:"政治体制", q:"情報化が進み、個人の行動履歴などが企業に大量に収集されるようになったことは、どのような権利の重要性を高めているか。", choices:["プライバシー権","参政権(選挙権など)","財産権(所有権など)","団結権(労働組合など)"], a:0, e:"正解は「プライバシー権」です。個人情報が大量に収集・利用されるようになった現代では、私生活をみだりに公開されないプライバシー権の重要性が高まっています。「参政権(選挙権など)」は誤りで、これは政治に参加する権利であり、個人情報の収集とは異なる分野の権利です。「財産権(所有権など)」は誤りで、これは財産を所有・処分する権利であり、個人情報保護に関するプライバシー権とは異なります。「団結権(労働組合など)」は誤りで、これは労働組合を結成する権利であり、個人情報の収集とは無関係な権利です。"},
  {id:"civ333", cat:"公民", sub:"経済", q:"ある国が自国の農業を守るために輸入農産物に高い関税を課した場合、これはどのような貿易政策の例といえるか。", choices:["保護貿易","自由貿易","加工貿易","公正貿易のみ"], a:0, e:"正解は「保護貿易」です。自国の産業を守るために輸入品に高い関税を課すなどする貿易政策を、保護貿易といいます。「自由貿易」は誤りで、これは関税などの貿易障壁をできるだけなくす政策であり、高関税を課す保護貿易とは正反対の方向性です。「加工貿易」は誤りで、これは原料を輸入し製品に加工して輸出する貿易形態を指す言葉であり、貿易政策の方向性を示す保護貿易とは異なる概念です。「公正貿易のみ」は誤りで、これは一般にフェアトレードなど公正な取引条件を指す言葉であり、保護貿易とは異なる文脈の概念です。"},
  {id:"civ335", cat:"公民", sub:"経済", q:"少子高齢化が進み、年金を支える現役世代の負担が重くなっている状況は、どのような制度上の課題を示しているか。", choices:["世代間の負担バランスをどう保つかという課題","少子高齢化と社会保障は無関係な問題","年金制度はすでに完全解決された問題","高齢者給付の廃止だけで解決する問題"], a:0, e:"正解は「世代間の負担バランスをどう保つかという課題」です。少子高齢化による現役世代の負担増加は、世代間でどのように社会保障の負担と給付のバランスを保つかという課題を示しています。「少子高齢化と社会保障は無関係な問題」は誤りで、事実とは正反対であり、少子高齢化はまさに社会保障制度の持続可能性に直結する重要な問題です。「年金制度はすでに完全解決された問題」は誤りで、実際には年金制度の持続可能性は依然として重要な政策課題として議論が続いています。「高齢者給付の廃止だけで解決する問題」は誤りで、これは単純化しすぎた見方であり、実際には給付と負担のバランスをどう設計するかという複雑な課題です。"},
  {id:"civ339", cat:"公民", sub:"経済", q:"ある企業が株式を発行して投資家から直接資金を集めた場合、これはどのような資金調達方法の例か。", choices:["直接金融","間接金融","財政政策","為替介入"], a:0, e:"正解は「直接金融」です。企業が株式や社債を発行して投資家から直接資金を調達する方法を直接金融といいます。「間接金融」は誤りで、これは銀行などの金融機関を仲立ちとして資金を調達する方法であり、投資家から直接調達する直接金融とは仕組みが異なります。「財政政策」は誤りで、これは政府が税金や公共支出を通じて経済を調整する政策であり、企業の資金調達方法とは異なる概念です。「為替介入」は誤りで、これは政府や中央銀行が外国為替市場で通貨を売買することであり、企業の資金調達とは異なります。"},
  {id:"civ341", cat:"公民", sub:"経済", q:"企業が銀行から融資を受けて設備投資を行った場合、これはどのような資金調達方法の例か。", choices:["間接金融","直接金融","財政政策","為替介入"], a:0, e:"正解は「間接金融」です。銀行などの金融機関を仲立ちとして資金を調達する方法を間接金融といいます。「直接金融」は誤りで、これは株式や社債の発行により投資家から直接資金を調達する方法であり、金融機関を介する間接金融とは仕組みが異なります。「財政政策」は誤りで、これは政府による経済調整策であり、企業の資金調達方法とは異なる概念です。「為替介入」は誤りで、これは為替市場での通貨売買を指し、企業の資金調達とは異なります。"},
  {id:"civ343", cat:"公民", sub:"国際関係", q:"ある国で自衛隊が国連の要請にもとづき紛争地域での復興支援活動に参加した場合、これはどのような活動の一例か。", choices:["PKO","為替介入","団体交渉","国政調査"], a:0, e:"正解は「PKO」です。国連の枠組みのもとで紛争地域の復興支援などを行う活動をPKO（平和維持活動）といいます。「為替介入」は誤りで、これは政府や中央銀行が為替市場で通貨を売買することであり、紛争地域での活動とは全く異なる分野です。「団体交渉」は誤りで、これは労働者と使用者が労働条件について話し合うことであり、国際的な平和維持活動とは異なります。「国政調査」は誤りで、これは国会が行政を調査する権限であり、国連の枠組みでの活動であるPKOとは異なる概念です。"},
  {id:"civ345", cat:"公民", sub:"政治体制", q:"ある国の憲法改正に国民投票が必要とされていることは、どのような原則を反映していると考えられるか。", choices:["国民主権にもとづく原則","天皇主権の原則","三権分立の原則のみ","地方自治の原則のみ"], a:0, e:"正解は「国民主権にもとづく原則」です。憲法改正に国民投票を必要とすることは、国の重要な決定を国民の意思に委ねる国民主権の原則を反映しています。「天皇主権の原則」は誤りで、日本国憲法では天皇主権ではなく国民主権が採用されており、憲法改正における国民投票はこの国民主権を反映した仕組みです。「三権分立の原則のみ」は誤りで、これは立法・行政・司法の権力分立に関する原則であり、国民投票による憲法改正とは異なる原則です。「地方自治の原則のみ」は誤りで、これは地方公共団体の自治に関する原則であり、国全体の憲法改正手続きとは異なる分野です。"},
  {id:"civ347", cat:"公民", sub:"国際関係", q:"発展途上国の中でも急速に工業化を遂げた国と、依然として貧困が深刻な国との間に見られる経済格差は、何と呼ばれる問題の一例か。", choices:["南南問題","南北問題","東西問題","貿易摩擦のみ"], a:0, e:"正解は「南南問題」です。発展途上国どうしの間での経済格差の拡大は南南問題と呼ばれ、南北問題とは区別される課題です。「南北問題」は誤りで、これは先進国（北）と発展途上国（南）の間の経済格差を指す言葉であり、発展途上国間の格差を指す南南問題とは対象が異なります。「東西問題」は誤りで、これは冷戦期のイデオロギー対立を指す言葉であり、経済格差の問題とは性質が異なります。「貿易摩擦のみ」は誤りで、これは主に先進国間などで生じる貿易上の対立を指す言葉であり、発展途上国間の経済格差を指す南南問題とは異なります。"},
  /* 日本史 */
  {id:"his357", cat:"日本史", sub:"古代", q:"墾田永年私財法が出された結果、公地公民の原則にどのような変化が生じたか。", choices:["貴族や寺社が私有地を広げていった","土地は完全に国有のまま維持された","農民の税負担が全て免除された","武士が土地を独占的に管理した"], a:0, e:"正解は「貴族や寺社が私有地を広げていった」です。墾田永年私財法により新しく開墾した土地の永久私有が認められ、貴族や寺社が私有地（荘園）を広げていきました。「土地は完全に国有のまま維持された」は誤りで、事実とは正反対であり、この法令はむしろ土地の私有を認めることで公地公民の原則を崩す方向に働きました。「農民の税負担が全て免除された」は誤りで、この法令は土地の私有に関するものであり、税負担の全面免除を定めたものではありません。「武士が土地を独占的に管理した」は誤りで、この法令が出された奈良時代にはまだ武士という存在は成立しておらず、時代が合いません。"},
  {id:"his365", cat:"日本史", sub:"江戸時代", q:"江戸幕府が参勤交代を制度化したことで、大名にどのような影響が生じたか。", choices:["経済力が消耗し反乱を起こしにくくなった","経済力が強まり幕府への対抗力を得た","軍事力がさらに強化された","大名同士の同盟が促進された"], a:0, e:"正解は「経済力が消耗し反乱を起こしにくくなった」です。参勤交代の往復や江戸での生活には多額の費用がかかり、大名の経済力を消耗させて反乱を防ぐ効果がありました。「経済力が強まり幕府への対抗力を得た」は誤りで、事実とは正反対であり、参勤交代はむしろ大名の経済力を弱める効果を持ちました。「軍事力がさらに強化された」は誤りで、参勤交代は大名の財政を圧迫するものであり、軍事力強化につながるものではありませんでした。「大名同士の同盟が促進された」は誤りで、参勤交代は江戸と領国の往来に関する制度であり、大名間の同盟を直接促す仕組みではありません。"},
  {id:"his397", cat:"日本史", sub:"現代", q:"冷戦終結後、日本の国際貢献のあり方を見直すきっかけとなった出来事は何か。", choices:["湾岸戦争での資金協力にとどまった対応への批判","東京オリンピックの開催であった","バブル経済の崩壊であった","55年体制の成立であった"], a:0, e:"正解は「湾岸戦争での資金協力にとどまった対応への批判」です。湾岸戦争の際、資金協力にとどまった日本の対応は国際的に評価されず、その後のPKO協力法制定につながりました。「東京オリンピックの開催であった」は誤りで、これは1964年の出来事であり、冷戦終結後（1990年代前後）の国際貢献見直しとは時期が異なります。「バブル経済の崩壊であった」は誤りで、バブル崩壊は日本の国内経済に関する出来事であり、国際貢献のあり方の見直しの直接のきっかけとは異なります。「55年体制の成立であった」は誤りで、これは1955年の出来事であり、冷戦終結後の国際貢献見直しとは時期が大きく異なります。"},
  /* 世界史 */
  {id:"wor383", cat:"世界史", sub:"現代", q:"経済のグローバル化が進むことで、国と国との経済的な結びつきにどのような変化が生じるか。", choices:["相互依存が強まり一国の経済問題が他国に波及しやすくなる","各国の経済がそれぞれ完全に独立していく","国際的な貿易活動が完全になくなっていく","国境という概念の意味が完全になくなる"], a:0, e:"正解は「相互依存が強まり一国の経済問題が他国に波及しやすくなる」です。グローバル化により各国経済の相互依存が強まり、一国の経済危機が瞬く間に他国へ波及しやすくなっています。「各国の経済がそれぞれ完全に独立していく」は誤りで、事実とは正反対であり、グローバル化はむしろ各国経済の結びつきを強める方向に働きます。「国際的な貿易活動が完全になくなっていく」は誤りで、グローバル化はむしろ貿易の拡大を伴う現象であり、貿易の消滅とは逆の方向性です。「国境という概念の意味が完全になくなる」は誤りで、グローバル化が進んでも国境や国家という枠組み自体は依然として重要な意味を持ち続けています。"},
  /* 地理 */
  {id:"geo363", cat:"地理", sub:"世界地理", q:"再生可能エネルギーの導入が進む背景として、化石燃料と比較したときの利点は何か。", choices:["資源が枯渇せず環境への負荷が少ないこと","発電量が化石燃料よりはるかに多いことであった","天候にまったく左右されないことであった","コストが常に最も安いことであった"], a:0, e:"正解は「資源が枯渇せず環境への負荷が少ないこと」です。太陽光や風力などの再生可能エネルギーは資源が枯渇せず、二酸化炭素の排出も少ないという利点があります。「発電量が化石燃料よりはるかに多いことであった」は誤りで、発電量の多さが利点として一般的に強調されるわけではなく、この選択肢は不正確です。「天候にまったく左右されないことであった」は誤りで、実際には太陽光や風力は天候の影響を受けやすいという課題があります。「コストが常に最も安いことであった」は誤りで、コストは技術や状況により変動し、常に最安とは限りません。"},
  {id:"geo389", cat:"地理", sub:"日本地理", q:"少子高齢化が進むと、労働力人口にどのような影響が生じやすいか。", choices:["働く世代の割合が減少し労働力不足が生じやすくなる","働く世代の割合がそのまま増加し続けることであった","労働力人口にはまったく影響が生じないことであった","子どもの数が急激に増加していくことであった"], a:0, e:"正解は「働く世代の割合が減少し労働力不足が生じやすくなる」です。少子高齢化が進むと、生産年齢人口（働く世代）の割合が減少し、社会全体で労働力不足が生じやすくなります。「働く世代の割合がそのまま増加し続けることであった」は誤りで、事実とは正反対であり、少子高齢化はむしろ働く世代の割合を減少させます。「労働力人口にはまったく影響が生じないことであった」は誤りで、少子高齢化は労働力人口に大きな影響を及ぼす重要な要因です。「子どもの数が急激に増加していくことであった」は誤りで、少子化はむしろ子どもの数が減少する現象を指します。"},
  {id:"geo391", cat:"地理", sub:"世界地理", q:"発展途上国で人口爆発が起こる際、出生率と死亡率にはどのような関係が見られるか。", choices:["死亡率が先に低下し出生率が高いまま推移する","出生率が先に低下し死亡率が高いまま推移することであった","出生率と死亡率が同時に急上昇することであった","出生率と死亡率がともに低い水準を保つことであった"], a:0, e:"正解は「死亡率が先に低下し出生率が高いまま推移する」です。医療の普及などで死亡率が先に低下する一方、出生率が高いまま推移することで、急激な人口増加（人口爆発）が起こります。「出生率が先に低下し死亡率が高いまま推移することであった」は誤りで、これは実際の順序とは逆であり、人口爆発の説明としては不適切です。「出生率と死亡率が同時に急上昇することであった」は誤りで、死亡率が急上昇することは人口爆発とは逆に人口減少を招く要因です。「出生率と死亡率がともに低い水準を保つことであった」は誤りで、これは少子高齢化社会の特徴であり、人口爆発とは異なる状況です。"},
  /* 公民 */
  {id:"civ357", cat:"公民", sub:"経済", q:"ある商品の供給が需要を大きく上回るとき、価格にはどのような変化が生じやすいか。", choices:["価格は下落する傾向にある","価格は上昇する傾向にあることであった","価格はまったく変化しないことであった","価格は必ずゼロになるということであった"], a:0, e:"正解は「価格は下落する傾向にある」です。供給が需要を上回ると商品が余る状態になり、市場メカニズムを通じて価格は下落する傾向が見られます。「価格は上昇する傾向にあることであった」は誤りで、これは需要が供給を上回る場合の変化であり、内容が逆になっています。「価格はまったく変化しないことであった」は誤りで、市場経済では需給バランスの変化に応じて価格は変動するのが基本的な仕組みです。「価格は必ずゼロになるということであった」は誤りで、供給過多であっても価格が必ずゼロになるわけではありません。"},
  {id:"civ361", cat:"公民", sub:"経済", q:"日本銀行が景気の過熱を抑えるために金利を引き上げると、企業活動にはどのような影響が生じやすいか。", choices:["資金調達コストが上がり投資が抑制されやすくなる","資金調達が容易になり投資がさらに拡大することであった","景気にはまったく影響が及ばないということであった","物価が急激に下落し続けるということであった"], a:0, e:"正解は「資金調達コストが上がり投資が抑制されやすくなる」です。金利が引き上げられると企業の資金調達コストが上がり、設備投資などが抑制されやすくなります。「資金調達が容易になり投資がさらに拡大することであった」は誤りで、これは金利を引き下げた場合の効果であり、引き上げの場合とは逆です。「景気にはまったく影響が及ばないということであった」は誤りで、金利の変動は企業の投資行動を通じて景気に大きな影響を及ぼします。「物価が急激に下落し続けるということであった」は誤りで、金利引き上げが直ちに物価の急落を招くとは限らず、この選択肢は不正確です。"},
  {id:"civ373", cat:"公民", sub:"法律", q:"三審制が裁判の誤りを防ぐ仕組みとしてどのように機能するか。", choices:["同じ事件について複数回審理する機会を設けている","一度の裁判で必ず最終的な結論を出す仕組みであった","裁判官の人数を減らすための仕組みであった","裁判にかかる期間を短縮するための仕組みであった"], a:0, e:"正解は「同じ事件について複数回審理する機会を設けている」です。三審制は同じ事件について最大3回まで審理する機会を設けることで、裁判の誤りをできるだけ防ごうとする仕組みです。「一度の裁判で必ず最終的な結論を出す仕組みであった」は誤りで、これは三審制とは正反対の考え方であり、一審制に近い内容です。「裁判官の人数を減らすための仕組みであった」は誤りで、三審制の目的は審理回数の確保であり、裁判官の人数削減を目的としたものではありません。「裁判にかかる期間を短縮するための仕組みであった」は誤りで、複数回の審理を認める三審制はむしろ裁判に時間がかかる面があり、短縮とは逆の性質を持ちます。"},
  {id:"civ379", cat:"公民", sub:"経済", q:"直接金融と間接金融の違いを踏まえたとき、企業が株式を発行して行う資金調達はどちらに分類されるか。", choices:["直接金融","間接金融","財政政策","金融政策"], a:0, e:"正解は「直接金融」です。株式や社債の発行によって投資家から直接資金を調達する方法は、直接金融に分類されます。「間接金融」は誤りで、これは銀行などの金融機関を仲立ちとして資金を調達する方法であり、株式発行による直接調達とは仕組みが異なります。「財政政策」は誤りで、これは政府が税金や公共支出を通じて経済を調整する政策であり、企業の資金調達方法とは異なる概念です。「金融政策」は誤りで、これは中央銀行が金利などを通じて経済を調整する政策であり、これも企業の資金調達手段とは異なります。"},
  /* 日本史 */
  {id:"his407", cat:"日本史", sub:"古代", q:"6世紀、仏教が日本に公式に伝来したとされる経路として正しいものはどれか。", choices:["百済から朝廷に伝えられた","唐から遣唐使が持ち帰った","インドから直接伝えられた","ポルトガルの宣教師が伝えた"], a:0, e:"正解は「百済から朝廷に伝えられた」です。538年（一説に552年）、朝鮮半島の百済の王から日本の朝廷に仏像や経典が贈られたのが仏教公伝とされます。「唐から遣唐使が持ち帰った」は誤りで、遣唐使の派遣は7世紀以降であり仏教公伝より後の出来事です。「インドから直接伝えられた」は誤りで、実際には中国・朝鮮半島を経由して伝わりました。「ポルトガルの宣教師が伝えた」は誤りで、これは16世紀のキリスト教伝来（ザビエル）の話と混同した選択肢です。"},
  {id:"his409", cat:"日本史", sub:"古代", q:"645年の大化の改新で、蘇我氏を滅ぼして改革を主導した二人の中心人物の組み合わせとして正しいものはどれか。", choices:["中大兄皇子と中臣鎌足","聖徳太子と蘇我馬子","藤原道長と藤原頼通","源頼朝と源義経"], a:0, e:"正解は「中大兄皇子と中臣鎌足」です。この二人は乙巳の変で蘇我入鹿を暗殺し、大化の改新と呼ばれる一連の政治改革を進めました。「聖徳太子と蘇我馬子」は誤りで、この組み合わせは大化の改新より前の飛鳥時代初期に協力して政治を行った人物です。「藤原道長と藤原頼通」は誤りで、これは平安時代中期の摂関政治の全盛期を築いた父子です。「源頼朝と源義経」は誤りで、鎌倉幕府成立に関わった平安末期〜鎌倉初期の兄弟です。"},
  {id:"his413", cat:"日本史", sub:"鎌倉・室町", q:"1221年の承久の乱の結果、鎌倉幕府が京都に新たに設置した機関は何か。", choices:["六波羅探題","侍所","政所","問注所"], a:0, e:"正解は「六波羅探題」です。承久の乱で後鳥羽上皇に勝利した幕府は、朝廷の監視や西国武士の統率のため京都に六波羅探題を設置しました。「侍所」は誤りで、これは鎌倉に置かれた御家人の統率や軍事・警察を担う機関です。「政所」は誤りで、これは幕府の財政や一般政務を担当した機関です。「問注所」は誤りで、これは訴訟事務を扱った機関であり、いずれも京都ではなく鎌倉に置かれていました。"},
  {id:"his415", cat:"日本史", sub:"鎌倉・室町", q:"室町幕府の将軍を補佐する最高職で、有力な守護大名が交代で任じられた役職を何というか。", choices:["管領","執権","老中","関白"], a:0, e:"正解は「管領」です。管領は室町幕府で将軍を補佐する最高職で、細川・斯波・畠山の有力な守護大名家が交代で任じられました。「執権」は誤りで、これは鎌倉幕府で将軍を補佐した役職であり、北条氏が世襲しました。「老中」は誤りで、これは江戸幕府の常設の最高職です。「関白」は誤りで、これは朝廷において天皇を補佐する役職であり、幕府の職制ではありません。"},
  {id:"his417", cat:"日本史", sub:"戦国・江戸", q:"1560年、織田信長が今川義元を破り、その名を天下に知らしめた戦いを何というか。", choices:["桶狭間の戦い","長篠の戦い","関ヶ原の戦い","川中島の戦い"], a:0, e:"正解は「桶狭間の戦い」です。1560年、織田信長は奇襲によって大軍を率いる今川義元を破り、戦国大名としての名声を高めました。「長篠の戦い」は誤りで、これは1575年に信長・家康連合軍が鉄砲を活用して武田軍を破った戦いです。「関ヶ原の戦い」は誤りで、これは1600年に徳川家康が石田三成らに勝利した、江戸幕府成立につながる戦いです。「川中島の戦い」は誤りで、これは武田信玄と上杉謙信が北信濃をめぐって繰り返し戦った合戦です。"},
  {id:"his421", cat:"日本史", sub:"江戸時代", q:"1639年、ポルトガル船の来航を禁止したことで、江戸幕府の鎖国体制がほぼ完成したとされる出来事として正しいものはどれか。", choices:["ポルトガル船の来航禁止","オランダ商館の出島移転","島原・天草一揆の鎮圧","異国船打払令の発布"], a:0, e:"正解は「ポルトガル船の来航禁止」です。1639年にポルトガル船の来航が禁止されたことで、対外関係が大幅に制限される鎖国体制がほぼ完成しました。「オランダ商館の出島移転」は誤りで、これは1641年の出来事で、鎖国完成のやや後に行われた措置です。「島原・天草一揆の鎮圧」は誤りで、これは1637〜1638年の出来事で、鎖国強化のきっかけの一つですが鎖国完成そのものではありません。「異国船打払令の発布」は誤りで、これは1825年、鎖国からかなり後の時代に出された法令です。"},
  {id:"his423", cat:"日本史", sub:"江戸時代", q:"江戸時代の三大改革のうち、株仲間の解散などにより物価の引き下げを図ったが、かえって経済を混乱させたとされる改革はどれか。", choices:["天保の改革","享保の改革","寛政の改革","明治の改革"], a:0, e:"正解は「天保の改革」です。水野忠邦が主導した天保の改革では株仲間を解散させて物価引き下げを狙いましたが、かえって流通が混乱し経済が停滞しました。「享保の改革」は誤りで、これは徳川吉宗による改革で、上米の制など別の政策が中心でした。「寛政の改革」は誤りで、これは松平定信による改革で、質素倹約や旧里帰農令などが中心でした。「明治の改革」は誤りで、これは江戸時代ではなく明治時代の一連の近代化政策を指す通称であり、江戸幕府の三大改革には含まれません。"},
  {id:"his425", cat:"日本史", sub:"近代", q:"1858年、大老井伊直弼が幕府に反対する尊王攘夷派を弾圧した出来事を何というか。", choices:["安政の大獄","桜田門外の変","禁門の変","戊辰戦争"], a:0, e:"正解は「安政の大獄」です。井伊直弼は日米修好通商条約の無断締結などに反発する尊王攘夷派を厳しく弾圧し、吉田松陰らを処刑しました。「桜田門外の変」は誤りで、これは安政の大獄への反発から1860年に井伊直弼自身が暗殺された事件です。「禁門の変」は誤りで、これは1864年に長州藩が京都で幕府側と衝突した事件です。「戊辰戦争」は誤りで、これは1868〜1869年に起こった新政府軍と旧幕府軍との内戦です。"},
  {id:"his427", cat:"日本史", sub:"近代", q:"1866年、犬猿の仲であった薩摩藩と長州藩が坂本龍馬らの仲介で結んだ同盟を何というか。", choices:["薩長同盟","日英同盟","日独伊三国同盟","日ソ中立条約"], a:0, e:"正解は「薩長同盟」です。犬猿の仲だった薩摩藩と長州藩は坂本龍馬らの仲介により1866年に同盟を結び、倒幕の動きを加速させました。「日英同盟」は誤りで、これは1902年に日本とイギリスの間で結ばれた国際条約であり、藩どうしの同盟ではありません。「日独伊三国同盟」は誤りで、これは1940年に日本・ドイツ・イタリアが結んだ軍事同盟です。「日ソ中立条約」は誤りで、これは1941年に日本とソ連が結んだ条約です。"},
  {id:"his429", cat:"日本史", sub:"近代", q:"1871年に廃藩置県を断行した中心人物として、当時の明治政府で強い実権を持っていた人物は誰か。", choices:["大久保利通","勝海舟","坂本龍馬","徳川慶喜"], a:0, e:"正解は「大久保利通」です。大久保利通は明治政府の実力者として、西郷隆盛らとともに廃藩置県を断行し、中央集権体制の確立を主導しました。「勝海舟」は誤りで、彼は江戸城無血開城の交渉などで知られる旧幕臣で、明治政府の中心人物ではありません。「坂本龍馬」は誤りで、彼は薩長同盟の仲介などで活躍しましたが、廃藩置県の1871年より前の1867年に暗殺されています。「徳川慶喜」は誤りで、彼は江戸幕府最後の将軍であり、大政奉還後は明治政府の中心にはいませんでした。"},
  {id:"his431", cat:"日本史", sub:"近代", q:"1877年、明治政府に不満を持つ士族らが西郷隆盛を担いで起こした、最大かつ最後の士族反乱を何というか。", choices:["西南戦争","戊辰戦争","佐賀の乱","秩父事件"], a:0, e:"正解は「西南戦争」です。1877年、鹿児島の士族らが西郷隆盛を担いで起こした西南戦争は、士族による反乱としては最大かつ最後のものとなりました。「戊辰戦争」は誤りで、これは1868〜1869年に起こった新政府軍と旧幕府軍との内戦であり、士族反乱とは性質が異なります。「佐賀の乱」は誤りで、これは1874年に江藤新平らが起こした、西南戦争より前の士族反乱です。「秩父事件」は誤りで、これは1884年に埼玉県秩父地方の農民らが起こした事件で、士族反乱ではありません。"},
  {id:"his435", cat:"日本史", sub:"近代", q:"1911年、平塚らいてうらが「元始、女性は太陽であった」という言葉とともに創刊した雑誌は何か。", choices:["青鞜","女学雑誌","太陽","中央公論"], a:0, e:"正解は「青鞜」です。平塚らいてうらは女性の地位向上を目指し、「元始、女性は太陽であった」という言葉で知られる雑誌「青鞜」を1911年に創刊しました。「女学雑誌」は誤りで、これは明治時代に発行された別の女子教育関連の雑誌です。「太陽」は誤りで、これは博文館が発行した明治〜大正期の総合雑誌であり、青鞜とは別のものです。「中央公論」は誤りで、これは大正デモクラシー期に論壇の中心となった総合雑誌ですが、平塚らいてうの創刊誌ではありません。"},
  {id:"his437", cat:"日本史", sub:"現代", q:"1925年、普通選挙法と同時に制定され、社会主義運動などを取り締まった法律は何か。", choices:["治安維持法","国家総動員法","治安警察法","教育基本法"], a:0, e:"正解は「治安維持法」です。普通選挙法により有権者が拡大する一方、社会主義・共産主義運動の広がりを警戒した政府は、同じ1925年に治安維持法を制定して取り締まりを強化しました。「国家総動員法」は誤りで、これは1938年に日中戦争の長期化を背景に制定された法律です。「治安警察法」は誤りで、これは1900年に制定された、治安維持法よりも前の集会・結社を取り締まる法律です。「教育基本法」は誤りで、これは戦後の1947年に制定された教育に関する法律で、時期も内容も異なります。"},
  {id:"his439", cat:"日本史", sub:"現代", q:"1931年、関東軍が南満州鉄道の線路を爆破したことをきっかけに始まった、満州事変の発端となった事件を何というか。", choices:["柳条湖事件","盧溝橋事件","二・二六事件","五・一五事件"], a:0, e:"正解は「柳条湖事件」です。関東軍は柳条湖付近で自ら鉄道を爆破し、これを中国側の仕業として軍事行動を起こし、満州事変が始まりました。「盧溝橋事件」は誤りで、これは1937年に北京郊外で起こり、日中戦争の発端となった事件です。「二・二六事件」は誤りで、これは1936年に陸軍青年将校らが起こしたクーデター未遂事件です。「五・一五事件」は誤りで、これは1932年に海軍青年将校らが犬養毅首相を暗殺した事件です。"},
  {id:"his441", cat:"日本史", sub:"現代", q:"1940年、多くの政党が解散し合流して結成された、戦時体制下の国民統制組織は何か。", choices:["大政翼賛会","自由党","立憲政友会","社会党"], a:0, e:"正解は「大政翼賛会」です。1940年、戦時体制の強化のため既存の政党はほぼすべて解散して大政翼賛会に合流し、政党政治は事実上終わりを迎えました。「自由党」は誤りで、これは明治時代の板垣退助を中心とする自由民権運動期の政党や、戦後に再結成された政党の名称です。「立憲政友会」は誤りで、これは明治末から昭和初期にかけての有力な政党の一つです。「社会党」は誤りで、これは戦後に結成された政党であり、1940年時点ではまだ存在していません。"},
  {id:"his445", cat:"日本史", sub:"現代", q:"1960年、岸信介内閣のもとで改定され、激しい反対運動（安保闘争）を招いた条約は何か。", choices:["日米安全保障条約","日米和親条約","日米修好通商条約","日ソ共同宣言"], a:0, e:"正解は「日米安全保障条約」です。岸信介内閣による1960年の日米安全保障条約改定に対しては、国会周辺で激しい反対運動（60年安保闘争）が展開されました。「日米和親条約」は誤りで、これは1854年に結ばれた、日本の開国を定めた条約です。「日米修好通商条約」は誤りで、これは1858年に結ばれた不平等条約で、いずれも幕末の条約であり1960年の出来事ではありません。「日ソ共同宣言」は誤りで、これは1956年に日本とソ連の国交を回復させた宣言です。"},
  {id:"his447", cat:"日本史", sub:"現代", q:"1960年、池田勇人内閣が掲げた、10年間で国民所得を2倍にすることを目指した経済政策の通称は何か。", choices:["所得倍増計画","富国強兵","殖産興業","ニューディール政策"], a:0, e:"正解は「所得倍増計画」です。池田勇人内閣は1960年、10年間で国民所得を2倍にすることを目標に掲げ、高度経済成長を後押しする政策を推進しました。「富国強兵」は誤りで、これは明治時代の近代国家建設の基本方針です。「殖産興業」は誤りで、これも明治時代に近代産業を育成するために進められた政策です。「ニューディール政策」は誤りで、これは1930年代にアメリカのルーズベルト大統領が行った世界恐慌対策の政策であり、日本の政策ではありません。"},
  {id:"his449", cat:"日本史", sub:"現代", q:"1972年、田中角栄内閣のもとで日中共同声明が発表される以前、日本が国交を結んでいた中国の政権はどこか。", choices:["中華民国（台湾）","中華人民共和国","満州国","清"], a:0, e:"正解は「中華民国（台湾）」です。1972年の日中共同声明で中華人民共和国と国交を樹立するまで、日本は台湾の中華民国政府を中国の正式代表として国交を結んでいました。「中華人民共和国」は誤りで、これはまさに1972年の声明によって新たに国交を樹立した相手であり、それ以前の国交相手ではありません。「満州国」は誤りで、これは1932年に日本が満州に建てた傀儡国家で、1945年の敗戦とともに消滅しています。「清」は誤りで、これは1912年の辛亥革命で滅んだ王朝であり、20世紀後半には存在していません。"},
  {id:"his451", cat:"日本史", sub:"現代", q:"1980年代、日米間の貿易摩擦が特に深刻化した産業分野はどれか。", choices:["自動車産業","繊維産業","造船業","製鉄業"], a:0, e:"正解は「自動車産業」です。1980年代、日本製自動車の対米輸出が急増したことで、アメリカ国内の自動車産業が打撃を受け、深刻な貿易摩擦へと発展しました。「繊維産業」は誤りで、日米間の繊維をめぐる摩擦は1970年前後により顕著でした。「造船業」は誤りで、造船をめぐる摩擦は自動車ほど大きな社会問題とはなっていません。「製鉄業」は誤りで、鉄鋼摩擦も存在しましたが、1980年代に特に象徴的とされたのは自動車産業です。"},
  {id:"his453", cat:"日本史", sub:"現代", q:"1995年、地下鉄内で毒ガスが散布され多くの死傷者を出した、オウム真理教による事件を何というか。", choices:["地下鉄サリン事件","阪神・淡路大震災","日航機墜落事故","よど号ハイジャック事件"], a:0, e:"正解は「地下鉄サリン事件」です。1995年、宗教団体オウム真理教が東京の地下鉄内でサリンを散布し、多数の死傷者を出す事件を引き起こしました。「阪神・淡路大震災」は誤りで、これも1995年に起こりましたが自然災害（地震）であり、テロ事件とは異なります。「日航機墜落事故」は誤りで、これは1985年に起こった航空機事故です。「よど号ハイジャック事件」は誤りで、これは1970年に起こった航空機の乗っ取り事件です。"},
  {id:"his455", cat:"日本史", sub:"現代", q:"2011年、東北地方を中心に甚大な被害をもたらし、福島第一原子力発電所の事故も引き起こした災害を何というか。", choices:["東日本大震災","阪神・淡路大震災","関東大震災","伊勢湾台風"], a:0, e:"正解は「東日本大震災」です。2011年3月11日に発生した東日本大震災は巨大な津波を引き起こし、福島第一原子力発電所の事故にもつながる甚大な被害をもたらしました。「阪神・淡路大震災」は誤りで、これは1995年に兵庫県南部を震源として発生した地震です。「関東大震災」は誤りで、これは1923年に関東地方を襲った大地震です。「伊勢湾台風」は誤りで、これは1959年に発生し、東海地方に大きな被害をもたらした台風です。"},
  /* 世界史 */
  {id:"wor401", cat:"世界史", sub:"古代・中世", q:"古代メソポタミア文明で制定された、「目には目を、歯には歯を」の原則で知られる法典は何か。", choices:["ハンムラビ法典","十二表法","マグナ・カルタ","権利章典"], a:0, e:"正解は「ハンムラビ法典」です。古代バビロニアの王ハンムラビが制定したこの法典は、「目には目を、歯には歯を」という同害復讐の原則で知られています。「十二表法」は誤りで、これは古代ローマで制定された初期の成文法です。「マグナ・カルタ」は誤りで、これは1215年にイギリスで制定された、国王の権力を制限する文書です。「権利章典」は誤りで、これは1689年にイギリスの名誉革命後に制定された文書で、いずれも古代メソポタミアとは時代も地域も異なります。"},
  {id:"wor403", cat:"世界史", sub:"古代・中世", q:"5世紀ごろから始まった、フン族の圧迫を受けたゲルマン人が西ローマ帝国領内に大規模に移動した出来事を何というか。", choices:["ゲルマン人の大移動","十字軍遠征","大航海時代","バイキングの遠征"], a:0, e:"正解は「ゲルマン人の大移動」です。フン族の圧迫を受けたゲルマン人は4〜6世紀ごろ、西ローマ帝国領内へ大規模に移動し、これが西ローマ帝国滅亡の一因となりました。「十字軍遠征」は誤りで、これは11〜13世紀にヨーロッパのキリスト教徒が聖地エルサレムの奪還を目指した遠征です。「大航海時代」は誤りで、これは15〜17世紀のヨーロッパによる新航路開拓の時代です。「バイキングの遠征」は誤りで、これは8〜11世紀ごろに北欧のノルマン人が行った海洋進出です。"},
  {id:"wor405", cat:"世界史", sub:"古代・中世", q:"11世紀末から約200年間、ヨーロッパのキリスト教徒が聖地エルサレムの奪還を目指して行った一連の遠征を何というか。", choices:["十字軍","レコンキスタ","大航海時代","宗教改革"], a:0, e:"正解は「十字軍」です。1096年から約200年にわたり、ローマ教皇の呼びかけによりヨーロッパのキリスト教徒が聖地エルサレムの奪還を目指して繰り返し遠征を行いました。「レコンキスタ」は誤りで、これはイベリア半島でキリスト教徒がイスラム勢力を排除して国土を回復した運動です。「大航海時代」は誤りで、これは十字軍よりも後の15世紀以降にヨーロッパが新航路を開拓した時代です。「宗教改革」は誤りで、これは16世紀にルターらが始めたカトリック教会への改革運動であり、時代も内容も異なります。"},
  {id:"wor407", cat:"世界史", sub:"ヨーロッパ史", q:"1215年、イギリスの貴族が国王ジョンに認めさせた、国王の権力を法によって制限する文書を何というか。", choices:["マグナ・カルタ（大憲章）","権利章典","権利の請願","人権宣言"], a:0, e:"正解は「マグナ・カルタ（大憲章）」です。1215年、貴族たちは国王ジョンに対し、国王であっても法に従わなければならないことなどを定めたマグナ・カルタを認めさせました。「権利章典」は誤りで、これは1689年、名誉革命後にマグナ・カルタよりずっと後に制定された文書です。「権利の請願」は誤りで、これは1628年にイギリス議会が国王に提出した文書です。「人権宣言」は誤りで、これは1789年のフランス革命で発表された宣言であり、国も時代も異なります。"},
  {id:"wor409", cat:"世界史", sub:"ヨーロッパ史", q:"14世紀、ルネサンスの三大発明とされる技術に含まれないものはどれか。", choices:["蒸気機関","火薬","羅針盤","活版印刷術"], a:0, e:"正解は「蒸気機関」です。ルネサンス期の三大発明とされるのは火薬・羅針盤・活版印刷術であり、蒸気機関はこれらには含まれません。「火薬」は実際は三大発明の一つで、中国起源とされ戦術を大きく変えました。「羅針盤」も三大発明の一つで、大航海時代を支えました。「活版印刷術」も三大発明の一つで、グーテンベルクによる実用化が知識の普及を促しました。蒸気機関はこれよりずっと後の18世紀の産業革命期に実用化された技術です。"},
  {id:"wor411", cat:"世界史", sub:"ヨーロッパ史", q:"16世紀、ルターの宗教改革に続き、スイスのジュネーブで独自の改革を進めた人物は誰か。", choices:["カルヴァン","エラスムス","トマス・モア","マキャヴェリ"], a:0, e:"正解は「カルヴァン」です。カルヴァンはスイスのジュネーブを拠点に、予定説などを唱えて独自の宗教改革を進め、後にプロテスタントの一派であるカルヴァン派を形成しました。「エラスムス」は誤りで、彼は人文主義者としてカトリック教会の腐敗を批判しましたが、教会からの分離までは主張しませんでした。「トマス・モア」は誤りで、彼はイギリスの人文主義者・政治家で「ユートピア」の著者として知られます。「マキャヴェリ」は誤りで、彼はイタリアの政治思想家で「君主論」の著者として知られ、宗教改革者ではありません。"},
  {id:"wor413", cat:"世界史", sub:"ヨーロッパ史", q:"1618年から1648年にかけてドイツを主戦場に戦われ、ウェストファリア条約で終結した戦争を何というか。", choices:["三十年戦争","百年戦争","クリミア戦争","普仏戦争"], a:0, e:"正解は「三十年戦争」です。三十年戦争は主にドイツを舞台とした宗教戦争で、1648年のウェストファリア条約により終結しました。「百年戦争」は誤りで、これは14〜15世紀にイギリスとフランスの間で戦われた戦争です。「クリミア戦争」は誤りで、これは19世紀半ばにロシアと英仏連合軍などが戦った戦争です。「普仏戦争」は誤りで、これは19世紀後半にプロイセンとフランスが戦った戦争であり、いずれも三十年戦争とは時代が異なります。"},
  {id:"wor415", cat:"世界史", sub:"ヨーロッパ史", q:"1689年、イギリスの名誉革命後に議会が国王に認めさせた、議会の権限を明確にした文書を何というか。", choices:["権利章典","マグナ・カルタ","権利の請願","人権宣言"], a:0, e:"正解は「権利章典」です。名誉革命の翌年である1689年、議会は国王に権利章典を認めさせ、議会の同意なしに課税や法律の停止ができないことなどを定めました。「マグナ・カルタ」は誤りで、これは1215年に制定された、権利章典よりずっと前の文書です。「権利の請願」は誤りで、これは1628年に議会が国王に提出した文書で、名誉革命より前のものです。「人権宣言」は誤りで、これは1789年のフランス革命で発表された宣言であり、国が異なります。"},
  {id:"wor417", cat:"世界史", sub:"ヨーロッパ史", q:"フランス革命の中でロベスピエールらが主導し、恐怖政治を行ったことで知られる急進的な党派を何というか。", choices:["ジャコバン派","ジロンド派","王党派","保守党"], a:0, e:"正解は「ジャコバン派」です。ロベスピエールらが率いたジャコバン派は革命の急進化を進め、反対派を次々に処刑する恐怖政治を行いました。「ジロンド派」は誤りで、これはジャコバン派よりも穏健な、革命初期に主導権を握った党派です。「王党派」は誤りで、これは王政の維持を望む勢力であり、革命そのものに反対する立場です。「保守党」は誤りで、これはイギリスの政党名であり、フランス革命の党派ではありません。"},
  {id:"wor419", cat:"世界史", sub:"ヨーロッパ史", q:"1814年から1815年にかけて開かれ、ナポレオン戦争後のヨーロッパの秩序を再編しようとした国際会議を何というか。", choices:["ウィーン会議","ヴェルサイユ会議","ヤルタ会談","バンドン会議"], a:0, e:"正解は「ウィーン会議」です。ナポレオン戦争後、ヨーロッパ各国の代表がオーストリアのウィーンに集まり、フランス革命以前の秩序を基本とする保守的な国際秩序（ウィーン体制）を築こうとしました。「ヴェルサイユ会議」は誤りで、これは第一次世界大戦後の1919年に開かれたパリ講和会議の一部を指す呼び方です。「ヤルタ会談」は誤りで、これは第二次世界大戦末期の1945年に開かれた会談です。「バンドン会議」は誤りで、これは1955年にアジア・アフリカの新興独立国が開いた会議です。"},
  {id:"wor421", cat:"世界史", sub:"ヨーロッパ史", q:"1830年、フランスでシャルル10世の反動政治に反発して起こり、七月王政を成立させた革命を何というか。", choices:["七月革命","二月革命","名誉革命","フランス革命"], a:0, e:"正解は「七月革命」です。1830年、シャルル10世の反動的な政治に反発した市民が蜂起し、七月革命によりルイ・フィリップを国王とする七月王政が成立しました。「二月革命」は誤りで、これは1848年にフランスで起こった、七月王政を倒した別の革命です。「名誉革命」は誤りで、これは1688年にイギリスで起こった革命です。「フランス革命」は誤りで、これは1789年に起こったより大規模な革命であり、七月革命とは別の出来事です。"},
  {id:"wor423", cat:"世界史", sub:"ヨーロッパ史", q:"1848年、フランスで七月王政を倒し、ヨーロッパ各地に自由主義・国民主義運動を広げるきっかけとなった革命を何というか。", choices:["二月革命","七月革命","名誉革命","十月革命"], a:0, e:"正解は「二月革命」です。1848年にフランスで起こった二月革命は七月王政を倒し、その影響はヨーロッパ各地に広がり自由主義・国民主義の運動を刺激しました（諸国民の春）。「七月革命」は誤りで、これは1830年に起こった二月革命より前の革命です。「名誉革命」は誤りで、これは1688年にイギリスで起こった革命です。「十月革命」は誤りで、これは1917年にロシアで起こった社会主義革命であり、時代も内容も異なります。"},
  {id:"wor425", cat:"世界史", sub:"アジア史", q:"19世紀後半、清が西洋技術を導入して近代化を図ったものの、政治体制の改革が伴わず限界があったとされる運動を何というか。", choices:["洋務運動","変法運動","義和団事件","五・四運動"], a:0, e:"正解は「洋務運動」です。洋務運動は「中体西用」の考えのもと西洋の軍事技術などを導入しましたが、清朝の政治体制自体は変えなかったため、日清戦争の敗北などによりその限界が明らかになりました。「変法運動」は誤りで、これは洋務運動の限界を踏まえ、政治制度も含めた改革を目指した運動です。「義和団事件」は誤りで、これは外国勢力の排斥を掲げた民衆運動です。「五・四運動」は誤りで、これは1919年に起こった反帝国主義・反封建の学生運動であり、いずれも洋務運動とは性格が異なります。"},
  {id:"wor427", cat:"世界史", sub:"両大戦期", q:"1914年6月、オーストリア皇太子夫妻がセルビア人青年に暗殺され、第一次世界大戦の直接のきっかけとなった事件を何というか。", choices:["サラエボ事件","柳条湖事件","盧溝橋事件","二月革命"], a:0, e:"正解は「サラエボ事件」です。1914年6月、ボスニアのサラエボでオーストリア皇太子夫妻がセルビア人青年に暗殺されたことが、第一次世界大戦勃発の直接のきっかけとなりました。「柳条湖事件」は誤りで、これは1931年に満州事変のきっかけとなった事件で、場所も時代も異なります。「盧溝橋事件」は誤りで、これは1937年に日中戦争のきっかけとなった事件です。「二月革命」は誤りで、これは1848年（フランス）や1917年（ロシア）の政治的な革命を指し、暗殺事件ではありません。"},
  {id:"wor429", cat:"世界史", sub:"両大戦期", q:"1917年、ロシアで臨時政府を倒しソビエト政権を樹立した革命を何というか。", choices:["十月革命","二月革命","名誉革命","文化大革命"], a:0, e:"正解は「十月革命」です。1917年10月（ロシア暦）、レーニンらボリシェヴィキが臨時政府を倒し、世界初の社会主義政権であるソビエト政権を樹立しました。「二月革命」は誤りで、これは同じ1917年でも先に起こり、皇帝を退位させ臨時政府を樹立した革命です。十月革命はその臨時政府をさらに倒したものです。「名誉革命」は誤りで、これは1688年のイギリスの出来事です。「文化大革命」は誤りで、これは1960年代の中国で毛沢東が主導した政治運動です。"},
  {id:"wor431", cat:"世界史", sub:"両大戦期", q:"第一次世界大戦後のドイツで、社会権の保障などを含む当時最も先進的とされた憲法が制定された都市の名を冠して、その憲法は何と呼ばれるか。", choices:["ワイマール憲法","ヴェルサイユ条約","大西洋憲章","権利章典"], a:0, e:"正解は「ワイマール憲法」です。1919年、ドイツのワイマールで開かれた国民議会で制定されたこの憲法は、社会権の保障を含む当時最も先進的な憲法の一つとされました。「ヴェルサイユ条約」は誤りで、これは同じく1919年に結ばれましたが、第一次世界大戦の講和条約であり憲法ではありません。「大西洋憲章」は誤りで、これは1941年に米英首脳が発表した戦後構想の宣言です。「権利章典」は誤りで、これは1689年のイギリスの文書です。"},
  {id:"wor433", cat:"世界史", sub:"両大戦期", q:"1929年に始まった世界恐慌に対し、イギリスやフランスがとった、自国と植民地との間で経済圏を囲い込む政策を何というか。", choices:["ブロック経済","ニューディール政策","五か年計画","改革開放政策"], a:0, e:"正解は「ブロック経済」です。イギリスやフランスは本国と植民地を囲い込み、他国製品には高関税を課すブロック経済により恐慌を乗り切ろうとしました。「ニューディール政策」は誤りで、これはアメリカが公共事業などを通じて行った恐慌対策です。「五か年計画」は誤りで、これはソ連が実施した計画経済にもとづく経済発展計画です。「改革開放政策」は誤りで、これは1970年代末以降に中国が進めた政策であり、世界恐慌とは時代が異なります。"},
  {id:"wor435", cat:"世界史", sub:"両大戦期", q:"1941年8月、アメリカとイギリスの首脳が発表した、戦後の平和構想の原則を示す宣言を何というか。", choices:["大西洋憲章","ヤルタ協定","ポツダム宣言","カイロ宣言"], a:0, e:"正解は「大西洋憲章」です。1941年8月、アメリカのローズベルト大統領とイギリスのチャーチル首相が会談し、領土不拡大などの戦後平和構想の原則を示す大西洋憲章を発表しました。「ヤルタ協定」は誤りで、これは1945年、大戦末期に米英ソの首脳が結んだ協定です。「ポツダム宣言」は誤りで、これも1945年に日本に無条件降伏を求めて発表された宣言です。「カイロ宣言」は誤りで、これは1943年に米英中の首脳が対日処理方針について発表した宣言であり、いずれも大西洋憲章より後の出来事です。"},
  {id:"wor437", cat:"世界史", sub:"現代", q:"1950年、北朝鮮が韓国に侵攻したことをきっかけに始まり、後に中国も参戦した戦争を何というか。", choices:["朝鮮戦争","ベトナム戦争","湾岸戦争","日露戦争"], a:0, e:"正解は「朝鮮戦争」です。1950年、北朝鮮軍が韓国に侵攻したことで始まった朝鮮戦争は、国連軍（実質的にアメリカ軍中心）とともに中国の義勇軍も参戦し、1953年に休戦しました。「ベトナム戦争」は誤りで、これは東南アジアのベトナムで戦われた別の戦争です。「湾岸戦争」は誤りで、これは1991年にイラクのクウェート侵攻をきっかけに起こった戦争です。「日露戦争」は誤りで、これは1904〜1905年に日本とロシアの間で戦われた戦争であり、いずれも朝鮮戦争とは異なる出来事です。"},
  {id:"wor439", cat:"世界史", sub:"現代", q:"1955年、アメリカを中心に東南アジアでの共産主義の拡大を防ぐことを目的に結成された軍事同盟の略称は何か。", choices:["SEATO","NATO","ASEAN","OPEC"], a:0, e:"正解は「SEATO（東南アジア条約機構）」です。アメリカなどは東南アジアでの共産主義の拡大を防ぐことを目的に、1954〜1955年にSEATOを結成しました。「NATO」は誤りで、これはヨーロッパを中心とする資本主義陣営の軍事同盟です。「ASEAN」は誤りで、これは1967年に結成された、東南アジア諸国自身による地域協力機構であり、軍事同盟ではありません。「OPEC」は誤りで、これは産油国が加盟する石油輸出国機構であり、軍事同盟ではありません。"},
  {id:"wor441", cat:"世界史", sub:"現代", q:"1962年、ソ連によるミサイル基地建設をめぐり、米ソが核戦争寸前まで対立した事件を何というか。", choices:["キューバ危機","ベルリン危機","スエズ危機","朝鮮戦争"], a:0, e:"正解は「キューバ危機」です。1962年、ソ連がキューバにミサイル基地を建設しようとしたことをめぐり、アメリカとソ連は核戦争寸前まで対立しました。「ベルリン危機」は誤りで、これはベルリンをめぐる別の冷戦下の緊張状態を指します。「スエズ危機」は誤りで、これは1956年、エジプトのスエズ運河国有化をめぐる中東の危機です。「朝鮮戦争」は誤りで、これは1950年に始まった別の戦争であり、いずれもキューバ危機とは異なる出来事です。"},
  {id:"wor443", cat:"世界史", sub:"現代", q:"1989年、東西冷戦の終結を象徴する出来事として、アメリカとソ連の首脳が地中海の島で会談し冷戦終結を宣言したのは何と呼ばれるか。", choices:["マルタ会談","ヤルタ会談","ポツダム会談","ジュネーブ会談"], a:0, e:"正解は「マルタ会談」です。1989年、アメリカのブッシュ大統領とソ連のゴルバチョフ書記長は地中海のマルタ島で会談し、冷戦の終結を宣言しました。「ヤルタ会談」は誤りで、これは1945年、第二次世界大戦末期に開かれた会談であり、冷戦の始まりに関わる会談です。「ポツダム会談」は誤りで、これも1945年に開かれた会談です。「ジュネーブ会談」は誤りで、これは1954年にインドシナ問題などを協議した会議であり、いずれもマルタ会談とは異なります。"},
  {id:"wor445", cat:"世界史", sub:"現代", q:"1993年、ヨーロッパ共同体（EC）を発展させ、ヨーロッパ連合（EU）の発足を定めた条約を何というか。", choices:["マーストリヒト条約","ローマ条約","パリ条約","ヴェルサイユ条約"], a:0, e:"正解は「マーストリヒト条約」です。1993年に発効したマーストリヒト条約により、それまでのEC（ヨーロッパ共同体）はEU（ヨーロッパ連合）へと発展しました。「ローマ条約」は誤りで、これは1957年にEC（当時のEEC）の前身を設立した条約です。「パリ条約」は誤りで、これは1951年にヨーロッパ石炭鉄鋼共同体を設立した条約です。「ヴェルサイユ条約」は誤りで、これは第一次世界大戦の講和条約であり、EU設立とは無関係です。"},
  {id:"wor447", cat:"世界史", sub:"現代", q:"2001年9月11日、アメリカで発生した同時多発テロの実行組織として当時最も強く疑われた国際テロ組織は何か。", choices:["アルカイダ","IS（イスラム国）","タリバンのみ","ハマス"], a:0, e:"正解は「アルカイダ」です。2001年のアメリカ同時多発テロは、ウサマ・ビンラディンが率いる国際テロ組織アルカイダによる犯行とされています。「IS（イスラム国）」は誤りで、これはアルカイダよりも後の2010年代に台頭した別の過激派組織です。「タリバンのみ」は誤りで、タリバンはアルカイダを保護していたアフガニスタンの勢力であり、実行組織そのものではありません。「ハマス」は誤りで、これはパレスチナのガザ地区を拠点とする別の組織であり、同時多発テロとは直接関係しません。"},
  {id:"wor449", cat:"世界史", sub:"現代", q:"2015年、パリで開かれた国連気候変動枠組み条約締約国会議（COP21）で採択された、地球温暖化対策の国際的な枠組みを何というか。", choices:["パリ協定","京都議定書","ラムサール条約","バーゼル条約"], a:0, e:"正解は「パリ協定」です。2015年、パリで開かれたCOP21において、先進国・途上国を問わずすべての参加国が温室効果ガス削減に取り組むパリ協定が採択されました。「京都議定書」は誤りで、これは1997年に採択された、パリ協定より前の、先進国のみに削減義務を課した枠組みです。「ラムサール条約」は誤りで、これは湿地の保全に関する条約です。「バーゼル条約」は誤りで、これは有害廃棄物の国境を越える移動を規制する条約であり、いずれもパリ協定とは異なる条約です。"},
  /* 地理 */
  {id:"geo399", cat:"地理", sub:"日本地理", q:"川が長い年月をかけて台地をつくり、そこに階段状の地形が残されたものを何というか。", choices:["河岸段丘","扇状地","三角州","カルデラ"], a:0, e:"正解は「河岸段丘」です。河岸段丘は川の侵食・堆積の繰り返しによって形成される、階段状に連なる地形です。「扇状地」は誤りで、これは川が山地から平地に出る場所にできる扇形の堆積地形であり、階段状ではありません。「三角州」は誤りで、これは川が海や湖に流れ込む河口付近にできる平らな堆積地形です。「カルデラ」は誤りで、これは火山の噴火によってできる大きなくぼ地であり、川の作用による地形ではありません。"},
  {id:"geo401", cat:"地理", sub:"世界地理", q:"石灰岩が雨水などによって溶食され、鍾乳洞やドリーネなど特有の地形が形成されることを何というか。", choices:["カルスト地形","フィヨルド","リアス海岸","三角州"], a:0, e:"正解は「カルスト地形」です。カルスト地形は石灰岩が雨水などに溶かされてできる地形で、鍾乳洞やドリーネと呼ばれるくぼ地が特徴的に見られます。「フィヨルド」は誤りで、これは氷河が削った谷に海水が入り込んでできた、細長く入り組んだ海岸地形です。「リアス海岸」は誤りで、これは山地が海に沈み込んでできた、出入りの多い海岸地形です。「三角州」は誤りで、これは川の堆積作用でできる地形であり、石灰岩の溶食とは無関係です。"},
  {id:"geo403", cat:"地理", sub:"世界地理", q:"氷河が削ってできたU字谷に海水が入り込んでできた、両岸が切り立った細長い入り江を何というか。", choices:["フィヨルド","リアス海岸","カルスト地形","三角州"], a:0, e:"正解は「フィヨルド」です。フィヨルドは氷河が削ったU字谷に海水が入り込んでできた地形で、ノルウェーなど高緯度地域に多く見られます。「リアス海岸」は誤りで、これは氷河ではなく、山地が海に沈み込んでできる海岸地形で、日本の三陸海岸などに見られます。「カルスト地形」は誤りで、これは石灰岩の溶食によってできる地形です。「三角州」は誤りで、これは川の堆積作用による地形であり、いずれもフィヨルドとは成因が異なります。"},
  {id:"geo405", cat:"地理", sub:"世界地理", q:"サンゴの死骸などが積み重なってできる、熱帯・亜熱帯の海に見られる地形を何というか。", choices:["サンゴ礁","フィヨルド","カルスト地形","河岸段丘"], a:0, e:"正解は「サンゴ礁」です。サンゴ礁は暖かく浅い熱帯・亜熱帯の海でサンゴの死骸などが積み重なってできる地形で、沖縄などで見られます。「フィヨルド」は誤りで、これは氷河が作る高緯度地域の地形であり、暖かい海とは正反対の環境でできます。「カルスト地形」は誤りで、これは石灰岩の溶食によってできる陸上の地形です。「河岸段丘」は誤りで、これは川の作用による地形であり、いずれもサンゴ礁とは異なる成因です。"},
  {id:"geo407", cat:"地理", sub:"世界地理", q:"世界の気候を気温と降水量にもとづいて分類した、地理学で広く用いられる区分方法を何というか。", choices:["ケッペンの気候区分","プレートテクトニクス","メルカトル図法","モンスーンアジア"], a:0, e:"正解は「ケッペンの気候区分」です。ドイツの気候学者ケッペンが考案したこの区分方法は、気温と降水量をもとに世界の気候を熱帯・乾燥帯・温帯・冷帯・寒帯などに分類し、地理学で広く用いられています。「プレートテクトニクス」は誤りで、これは地球の表面を覆う岩盤の動きを説明する理論であり、気候分類ではありません。「メルカトル図法」は誤りで、これは地図の投影法の一つです。「モンスーンアジア」は誤りで、これは季節風の影響を受けるアジアの地域を指す言葉であり、気候の分類方法ではありません。"},
  {id:"geo411", cat:"地理", sub:"世界地理", q:"寒冷な地域で伝統的に行われてきた遊牧が、近年市場経済の影響でどのように変化してきているか。", choices:["定住化や商業的な牧畜への移行が進んでいる","遊牧の規模がさらに拡大し続けている","遊牧民の人口が急激に増加している","遊牧は近代化の影響を全く受けていない"], a:0, e:"正解は「定住化や商業的な牧畜への移行が進んでいる」です。市場経済の浸透や政府の政策により、伝統的な遊牧民の間でも定住化が進み、商業的な牧畜への移行が見られるようになっています。「遊牧の規模がさらに拡大し続けている」は誤りで、実際には伝統的な遊牧を続ける人々は減少傾向にあります。「遊牧民の人口が急激に増加している」は誤りで、多くの地域でむしろ遊牧民の人口比率は低下しています。「遊牧は近代化の影響を全く受けていない」は誤りで、実際には道路整備や市場経済化など近代化の影響を強く受けています。"},
  {id:"geo413", cat:"地理", sub:"世界地理", q:"ヨーロッパで発達した、穀物栽培と家畜飼育を組み合わせて行う農業を何というか。", choices:["混合農業","プランテーション農業","焼畑農業","地中海式農業"], a:0, e:"正解は「混合農業」です。混合農業は穀物や飼料作物の栽培と、豚や牛などの家畜飼育を組み合わせて行う農業形態で、ヨーロッパを中心に発達しました。「プランテーション農業」は誤りで、これは熱帯地域で単一の商品作物を大規模に栽培する農業です。「焼畑農業」は誤りで、これは熱帯地域で森林を焼いてその灰を肥料とする伝統的な農法です。「地中海式農業」は誤りで、これは地中海性気候のもとでオリーブやぶどうなどを栽培する農業であり、いずれも混合農業とは異なる特徴を持ちます。"},
  {id:"geo415", cat:"地理", sub:"世界地理", q:"デンマークやオランダなどで発達した、乳牛を飼育して乳製品を生産することを中心とした農業を何というか。", choices:["酪農","混合農業","園芸農業","企業的穀物農業"], a:0, e:"正解は「酪農」です。酪農は乳牛を飼育し、牛乳やチーズなどの乳製品を生産することを中心とした農業で、消費地に近い冷涼な地域で発達しました。「混合農業」は誤りで、これは穀物栽培と家畜飼育を組み合わせる農業であり、乳製品生産に特化していません。「園芸農業」は誤りで、これは野菜や果物、花などを集約的に栽培する農業です。「企業的穀物農業」は誤りで、これはアメリカなどで広い土地を利用して穀物を大規模栽培する農業であり、いずれも酪農とは異なります。"},
  {id:"geo417", cat:"地理", sub:"世界地理", q:"大都市の周辺で、新鮮な野菜や花などを都市向けに集約的に栽培する農業を何というか。", choices:["園芸農業","企業的穀物農業","焼畑農業","遊牧"], a:0, e:"正解は「園芸農業」です。園芸農業は大都市の消費者向けに、野菜や果物、花などを新鮮な状態で届けるため、都市周辺で集約的に行われる農業です。「企業的穀物農業」は誤りで、これはアメリカやオーストラリアなど広大な土地で小麦などを大規模に栽培する農業です。「焼畑農業」は誤りで、これは熱帯地域で行われる伝統的な農法です。「遊牧」は誤りで、これは家畜とともに移動する牧畜の形態であり、いずれも大都市向けの集約的な栽培とは異なります。"},
  {id:"geo419", cat:"地理", sub:"世界地理", q:"アメリカやオーストラリアなどで見られる、広大な土地を利用し機械化された大規模な小麦栽培を何というか。", choices:["企業的穀物農業","園芸農業","焼畑農業","地中海式農業"], a:0, e:"正解は「企業的穀物農業」です。企業的穀物農業はアメリカやオーストラリア、ロシアなどで見られる、広大な土地を大型機械で耕作し小麦などを大規模に生産する農業形態です。「園芸農業」は誤りで、これは都市向けに野菜や花を集約的に栽培する農業です。「焼畑農業」は誤りで、これは熱帯地域の伝統的な農法です。「地中海式農業」は誤りで、これは地中海性気候のもとでオリーブなどを栽培する農業であり、いずれも企業的穀物農業とは規模や方式が異なります。"},
  {id:"geo425", cat:"地理", sub:"日本地理", q:"人件費の安い海外に工場を移転する企業が増えることで、国内の雇用や技術力が失われていく現象を何というか。", choices:["産業の空洞化","過密化","モノカルチャー化","グローバル化のみ"], a:0, e:"正解は「産業の空洞化」です。産業の空洞化は、企業が人件費の安い海外に生産拠点を移すことで、国内の雇用機会や技術の蓄積が失われていく現象を指します。「過密化」は誤りで、これは人口が特定地域に過度に集中する現象であり、産業移転とは別の概念です。「モノカルチャー化」は誤りで、これは特定の一次産品に依存する経済構造を指す言葉です。「グローバル化のみ」は誤りで、グローバル化はより広い概念であり、産業の空洞化はその一側面にすぎません。"},
  {id:"geo427", cat:"地理", sub:"日本地理", q:"ある地域で長年受け継がれてきた技術や原材料をもとに発達した、その地域ならではの産業を何というか。", choices:["地場産業","企業的穀物農業","モノカルチャー経済","加工貿易"], a:0, e:"正解は「地場産業」です。地場産業は、その地域の気候風土や原材料、伝統的な技術を生かして発達してきた、地域に根ざした産業を指します。「企業的穀物農業」は誤りで、これはアメリカなどで見られる大規模な穀物栽培です。「モノカルチャー経済」は誤りで、これは発展途上国が特定の一次産品に依存する経済構造です。「加工貿易」は誤りで、これは原料を輸入し製品に加工して輸出する貿易形態であり、いずれも地場産業とは異なる概念です。"},
  {id:"geo431", cat:"地理", sub:"日本地理", q:"郊外への都市の拡大を抑え、生活に必要な機能を都市の中心部に集約させようとするまちづくりの考え方を何というか。", choices:["コンパクトシティ","スプロール化","ドーナツ化現象","モノカルチャー経済"], a:0, e:"正解は「コンパクトシティ」です。コンパクトシティは都市機能を中心部に集約することで、郊外への無秩序な拡大を抑え、効率的で持続可能なまちづくりを目指す考え方です。「スプロール化」は誤りで、これはコンパクトシティとは逆に、市街地が無秩序に郊外へ拡大していく現象です。「ドーナツ化現象」は誤りで、これは都心の人口減少と郊外の人口増加という人口移動を指す言葉です。「モノカルチャー経済」は誤りで、これは特定の一次産品に依存する経済構造であり、まちづくりの概念ではありません。"},
  {id:"geo435", cat:"地理", sub:"世界地理", q:"世界の主な宗教のうち、信者数が多いキリスト教・イスラム教・仏教は何と呼ばれるか。", choices:["三大宗教","一神教のみ","多神教のみ","民族宗教のみ"], a:0, e:"正解は「三大宗教」です。キリスト教・イスラム教・仏教は、特定の民族や地域を超えて世界中に広まっていることから、世界の三大宗教と呼ばれています。「一神教のみ」は誤りで、仏教は一般に一神教には分類されず、この三つをまとめて一神教とは呼びません。「多神教のみ」は誤りで、キリスト教とイスラム教は一神教に分類されます。「民族宗教のみ」は誤りで、三大宗教はむしろ特定の民族を超えて広まった宗教（世界宗教）とされ、民族宗教（例：ユダヤ教やヒンドゥー教）とは区別されます。"},
  {id:"geo439", cat:"地理", sub:"世界地理", q:"紛争などにより住む場所を追われた人々が一時的に生活する、国境付近などに設けられる施設を何というか。", choices:["難民キャンプ","経済特区","フェアトレード拠点","保税倉庫"], a:0, e:"正解は「難民キャンプ」です。難民キャンプは紛争や迫害を逃れた人々が一時的に生活するために、国境付近などに国際機関や支援団体によって設けられる施設です。「経済特区」は誤りで、これは外国企業の投資を呼び込むために税制などで優遇措置をとる地域です。「フェアトレード拠点」は誤りで、これは公正な貿易を推進するための仕組みに関する用語です。「保税倉庫」は誤りで、これは関税が保留された状態で輸入品を保管する倉庫であり、いずれも難民キャンプとは異なる施設です。"},
  {id:"geo441", cat:"地理", sub:"世界地理", q:"1982年に採択され、領海や排他的経済水域の範囲などを定めた国際的な条約を何というか。", choices:["国連海洋法条約","京都議定書","パリ協定","ラムサール条約"], a:0, e:"正解は「国連海洋法条約」です。国連海洋法条約は1982年に採択され、領海・排他的経済水域・公海などの海に関する国際的なルールを包括的に定めています。「京都議定書」は誤りで、これは地球温暖化対策に関する条約です。「パリ協定」は誤りで、これも気候変動に関する国際的な枠組みです。「ラムサール条約」は誤りで、これは湿地の保全に関する条約であり、いずれも海洋法とは異なる分野の条約です。"},
  {id:"geo445", cat:"地理", sub:"世界地理", q:"1971年に採択され、水鳥の生息地として国際的に重要な湿地の保全を目的とした条約を何というか。", choices:["ラムサール条約","ワシントン条約","バーゼル条約","京都議定書"], a:0, e:"正解は「ラムサール条約」です。ラムサール条約はイランのラムサールで1971年に採択され、水鳥の生息地として重要な湿地を国際的に登録し保全することを目的としています。「ワシントン条約」は誤りで、これは絶滅のおそれのある野生動植物の国際取引を規制する条約です。「バーゼル条約」は誤りで、これは有害廃棄物の国境を越える移動を規制する条約です。「京都議定書」は誤りで、これは地球温暖化対策に関する条約であり、いずれも湿地保全を直接の目的とはしていません。"},
  {id:"geo447", cat:"地理", sub:"世界地理", q:"絶滅のおそれのある野生動植物の国際取引を規制することを目的とした条約を何というか。", choices:["ワシントン条約","ラムサール条約","バーゼル条約","国連海洋法条約"], a:0, e:"正解は「ワシントン条約」です。ワシントン条約（絶滅のおそれのある野生動植物の種の国際取引に関する条約）は、象牙などの取引を規制し、野生動植物の保護を図る国際条約です。「ラムサール条約」は誤りで、これは水鳥の生息地である湿地の保全を目的とした条約です。「バーゼル条約」は誤りで、これは有害廃棄物の越境移動を規制する条約です。「国連海洋法条約」は誤りで、これは海に関する国際的なルールを定めた条約であり、いずれも野生動植物の取引規制を直接の目的とはしていません。"},
  /* 公民 */
  {id:"civ401", cat:"公民", sub:"政治体制", q:"通常の法律よりも改正の手続きが厳格に定められている憲法を何というか。", choices:["硬性憲法","軟性憲法","不文憲法","欽定憲法"], a:0, e:"正解は「硬性憲法」です。日本国憲法のように、通常の法律改正よりも厳格な手続き（国会の3分の2以上の賛成と国民投票）を必要とする憲法を硬性憲法といいます。「軟性憲法」は誤りで、これは通常の法律と同じ手続きで改正できる憲法を指し、日本国憲法はこれに該当しません。「不文憲法」は誤りで、これは成文化された単一の憲法典を持たない国（イギリスなど）の憲法のあり方を指します。「欽定憲法」は誤りで、これは君主が制定した憲法を指す分類であり、改正手続きの厳格さとは別の観点の分類です。"},
  {id:"civ403", cat:"公民", sub:"政治体制", q:"日本国憲法において天皇が行う、内閣の助言と承認にもとづく形式的・儀礼的な行為を何というか。", choices:["国事行為","統治行為","国政調査","立法行為"], a:0, e:"正解は「国事行為」です。天皇は日本国憲法のもとで政治的権能を持たず、内閣の助言と承認にもとづいて国会召集や法律の公布などの形式的・儀礼的な国事行為のみを行います。「統治行為」は誤りで、これは高度に政治的な国家行為について司法審査が及びにくいとする考え方を指す言葉であり、天皇の行為を指す用語ではありません。「国政調査」は誤りで、これは国会が行政を調査する権限（国政調査権）を指します。「立法行為」は誤りで、法律を制定するのは国会であり、天皇の権限ではありません。"},
  {id:"civ405", cat:"公民", sub:"政治体制", q:"衆議院と参議院の議決が異なった場合、法律案の議決について衆議院の議決が優先されることを何というか。", choices:["衆議院の優越","両院協議会","議員立法","国政調査権"], a:0, e:"正解は「衆議院の優越」です。衆議院は任期が短く解散もあるため国民の意思をより反映しやすいとされ、法律案の議決や予算の議決などで参議院よりも強い権限（衆議院の優越）が認められています。「両院協議会」は誤りで、これは衆参両院の意見が異なる場合に開かれる協議の場であり、優越そのものを指す言葉ではありません。「議員立法」は誤りで、これは内閣ではなく国会議員が法律案を提出することを指します。「国政調査権」は誤りで、これは国会が行政を調査する権限であり、両院の議決の優劣とは別の概念です。"},
  {id:"civ407", cat:"公民", sub:"政治体制", q:"衆議院と参議院で法律案の議決が異なった場合に、意見の調整のために開かれることがある会議を何というか。", choices:["両院協議会","国政調査","弾劾裁判","国民審査"], a:0, e:"正解は「両院協議会」です。両院協議会は衆議院と参議院の議決が異なった場合などに、両院の代表者が意見を調整するために開かれる会議です。「国政調査」は誤りで、これは国会が行政の実態を調査する権限を指します。「弾劾裁判」は誤りで、これは裁判官を辞めさせるかどうかを審理する裁判です。「国民審査」は誤りで、これは最高裁判所裁判官の適否を国民が審査する制度であり、いずれも両院の議決調整とは異なる制度です。"},
  {id:"civ409", cat:"公民", sub:"政治体制", q:"内閣が提出する法律案（閣法）に対し、国会議員が自ら提出する法律案を何というか。", choices:["議員立法","閣法","政令","条例"], a:0, e:"正解は「議員立法」です。議員立法は内閣ではなく国会議員自身が発議して提出する法律案を指し、国会が「唯一の立法機関」であることを示す一つの形です。「閣法」は誤りで、これは内閣が提出する法律案を指す言葉であり、議員立法とは対になる概念です。「政令」は誤りで、これは内閣が法律を実施するために制定する命令であり、法律そのものとは異なります。「条例」は誤りで、これは地方公共団体が議会の議決を経て制定するきまりであり、国会の法律とは別のものです。"},
  {id:"civ411", cat:"公民", sub:"政治体制", q:"選挙で獲得した議席数などにより国会内で内閣を組織する政党を何というか。", choices:["与党","野党","無所属","少数政党のみ"], a:0, e:"正解は「与党」です。与党は選挙で多数の議席を獲得するなどして内閣を組織し、政権を担当する政党（または政党の連合）を指します。「野党」は誤りで、これは政権を担当せず与党を批判・監視する立場にある政党を指し、与党とは逆の立場です。「無所属」は誤りで、これは特定の政党に属さない議員個人を指す言葉です。「少数政党のみ」は誤りで、与党は必ずしも小規模な政党とは限らず、むしろ多くの議席を得た政党であることが一般的です。"},
  {id:"civ413", cat:"公民", sub:"政治体制", q:"選挙の際に政党が示す、具体的な数値目標や達成期限を含む政権公約を何というか。", choices:["マニフェスト","ロビー活動","住民投票","国民審査"], a:0, e:"正解は「マニフェスト」です。マニフェストは選挙の際に政党が発表する政権公約のうち、具体的な数値目標や達成期限などを明記したものを指します。「ロビー活動」は誤りで、これは業界団体などが議員や政府に働きかけを行う活動を指し、政党が示す公約とは異なります。「住民投票」は誤りで、これは地域の重要な問題について住民が直接意思を示す制度です。「国民審査」は誤りで、これは最高裁判所裁判官の適否を審査する制度であり、いずれもマニフェストとは異なる概念です。"},
  {id:"civ415", cat:"公民", sub:"国際関係", q:"企業や業界団体などが、自らの利益のために議員や政府に働きかけを行う活動を何というか。", choices:["ロビー活動","マニフェスト","住民投票","国政調査権"], a:0, e:"正解は「ロビー活動」です。ロビー活動は企業や業界団体、市民団体などが自らの主張や利益を政策に反映させるため、議員や政府関係者に働きかける活動を指します。「マニフェスト」は誤りで、これは政党が発表する具体的な政権公約です。「住民投票」は誤りで、これは住民が地域の問題について直接意思を示す制度です。「国政調査権」は誤りで、これは国会が行政を調査する権限であり、いずれもロビー活動とは異なる概念です。"},
  {id:"civ417", cat:"公民", sub:"労働・法律", q:"営利を目的とせず、福祉や環境保護などの社会的な活動を行う民間団体で、法人格を取得したものを何というか。", choices:["NPO法人","株式会社","独立行政法人","地方公共団体"], a:0, e:"正解は「NPO法人」です。NPO法人（特定非営利活動法人）は営利を目的とせず、福祉や環境保護などの社会的な活動を行う民間団体のうち、法律にもとづき法人格を取得したものです。「株式会社」は誤りで、これは営利を目的として株主が出資する企業形態であり、NPOとは目的が異なります。「独立行政法人」は誤りで、これは国の行政の一部を担うために設立される法人です。「地方公共団体」は誤りで、これは都道府県や市町村など地方自治を担う公的な組織であり、民間団体ではありません。"},
  {id:"civ419", cat:"公民", sub:"経済", q:"消費者の利益を守るための行政機関として2009年に設置された、消費者行政を一元的に担う省庁を何というか。", choices:["消費者庁","公正取引委員会","労働基準監督署","国税庁"], a:0, e:"正解は「消費者庁」です。消費者庁は2009年、それまで各省庁に分かれていた消費者行政を一元的に担う機関として設置されました。「公正取引委員会」は誤りで、これは独占禁止法にもとづき企業間の公正な競争を監視する機関です。「労働基準監督署」は誤りで、これは労働基準法の遵守状況を監督する機関です。「国税庁」は誤りで、これは国税の賦課徴収を担う機関であり、いずれも消費者行政を一元的に担う機関ではありません。"},
  {id:"civ421", cat:"公民", sub:"経済", q:"独占禁止法にもとづき、企業間の公正な競争を確保するための行政機関を何というか。", choices:["公正取引委員会","消費者庁","労働委員会","国税庁"], a:0, e:"正解は「公正取引委員会」です。公正取引委員会は独占禁止法にもとづき、カルテルなど企業間の不公正な取引を監視・規制し、公正な競争を確保する行政機関です。「消費者庁」は誤りで、これは消費者行政を一元的に担う機関であり、企業間の競争政策とは目的が異なります。「労働委員会」は誤りで、これは労使間の紛争調整などを行う機関です。「国税庁」は誤りで、これは国税の徴収を担う機関であり、いずれも競争政策を主な役割としていません。"},
  {id:"civ423", cat:"公民", sub:"労働・法律", q:"労働者と使用者の間で起こる労使紛争の調整やあっせんを行う行政機関を何というか。", choices:["労働委員会","公正取引委員会","消費者庁","裁判所のみ"], a:0, e:"正解は「労働委員会」です。労働委員会は労働者と使用者の間で生じた労使紛争について、あっせんや調停などを行い、円滑な解決を図る行政機関です。「公正取引委員会」は誤りで、これは企業間の公正な競争を監視する機関であり、労使紛争とは異なる分野を扱います。「消費者庁」は誤りで、これは消費者行政を担う機関です。「裁判所のみ」は誤りで、労使紛争の解決には裁判以外にも労働委員会によるあっせんなど複数の手段が用意されています。"},
