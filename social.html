<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 社会クイズ - がんばれ受験生♪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Kosugi+Maru&family=Noto+Sans+JP:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF3F8;
    --panel: #FFFFFF;
    --panel-2: #FFF0F5;
    --chalk: #5A4A52;
    --chalk-dim: #A98CA0;
    --line: rgba(255,182,213,0.45);

    --c-japan: #FF9EB5;
    --c-world: #9AC7EB;
    --c-geo:  #A8DDB5;
    --c-civics:#FFCB8E;
    --c-trivia:#D6AFF0;

    --ok: #6FD69B;
    --ng: #FF8FA3;
    --star: #FFC94D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(255,225,240,0.9), transparent 45%),
      radial-gradient(ellipse at 100% 0%, rgba(210,230,255,0.7), transparent 50%),
      radial-gradient(ellipse at 30% 100%, rgba(220,255,235,0.6), transparent 55%),
      var(--bg);
    color:var(--chalk);
    font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .app{ width:100%; max-width:640px; }

  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    border-bottom:3px dotted var(--c-japan);
    padding-bottom:14px;
    gap:10px;
  }
  .brand-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .home-btn{
    flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:12px;
    background:#FFFFFF; border:2px solid var(--c-japan);
    color:#E0537A; font-size:1.15rem; cursor:pointer;
    box-shadow:0 4px 10px -4px rgba(255,158,181,0.5);
    transition: transform .12s ease, background .12s ease;
  }
  .home-btn:hover{ background:rgba(255,158,181,0.14); transform:translateY(-1px); }
  .home-btn:active{ transform:translateY(0) scale(.95); }
  .brand h1{
    font-family:'Mochiy Pop One', 'Zen Kaku Gothic New', sans-serif;
    font-weight:400;
    font-size:1.3rem;
    margin:0;
    letter-spacing:.02em;
    color:#E0537A;
    min-width:0;
  }
  .brand h1 small{
    display:block;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:.68rem;
    color:var(--chalk-dim);
    margin-top:4px;
    letter-spacing:.08em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand .counter{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:.85rem;
    color:var(--c-japan);
    white-space:nowrap;
    text-align:right;
    flex-shrink:0;
  }

  .banner{
    font-size:.78rem; color:#C99000; border:2px solid var(--star);
    background:rgba(255,201,77,0.14); border-radius:14px; padding:10px 12px; margin-bottom:18px;
  }

  .level-toggle{ display:flex; gap:8px; margin-bottom:20px; }
  .level-toggle button{
    flex:1; font-family:'Zen Kaku Gothic New', sans-serif; font-size:.8rem;
    padding:9px 6px; border-radius:100px; border:2px solid #D8A8BE;
    background:rgba(255,182,213,0.10); color:#8A6B7A; cursor:pointer;
  }
  .level-toggle button.active{ border-color:var(--c-japan); color:#E0537A; background:rgba(255,158,181,0.12); }

  .tube{ display:flex; gap:4px; margin-bottom:24px; }
  .tube .seg{
    flex:1; height:11px; border-radius:100px;
    background:rgba(255,182,213,0.20);
    border:2px solid rgba(255,182,213,0.30);
  }
  .tube .seg.correct{ background:var(--ok); border-color:var(--ok); }
  .tube .seg.retry{ background:var(--star); border-color:var(--star); }
  .tube .seg.wrong{ background:var(--ng); border-color:var(--ng); }
  .tube .seg.current{ border-color:var(--c-japan); transform:scaleY(1.3); }
  .tube .seg.trivia{ background:rgba(197,143,217,0.35); border-color:var(--c-trivia); }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:22px;
    padding:26px 24px;
    position:relative;
    box-shadow:0 14px 32px -14px rgba(255,158,181,0.35), 0 2px 8px rgba(255,158,181,0.15);
  }
  .badge{
    display:inline-block;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:.72rem;
    letter-spacing:.03em;
    padding:5px 12px;
    border-radius:100px;
    margin-bottom:14px;
    margin-right:6px;
    border:1px solid;
  }
  .badge.japan{ color:#E0537A; border-color:var(--c-japan); background:rgba(255,158,181,0.18);}
  .badge.world{ color:#3E86C4; border-color:var(--c-world); background:rgba(154,199,235,0.20);}
  .badge.geo { color:#399A5C;  border-color:var(--c-geo);  background:rgba(168,221,181,0.22);}
  .badge.civics{color:#D98A1F;border-color:var(--c-civics);background:rgba(255,203,142,0.22);}
  .badge.round{ color:#C99000; border-color:var(--star); background:rgba(255,201,77,0.18); }
  .badge.trivia{ color:#9B5BC9; border-color:var(--c-trivia); background:rgba(214,175,240,0.22); }
  .trivia-card{
    background: linear-gradient(135deg, rgba(214,175,240,0.18), rgba(214,175,240,0.05));
    border: 2px dashed var(--c-trivia);
  }
  .trivia-banner{
    font-size:.8rem; color:#9B5BC9; border:1px solid var(--c-trivia);
    background:rgba(214,175,240,0.16); border-radius:14px; padding:8px 12px; margin-bottom:14px; text-align:center;
  }
  .trivia-fun-fact{
    margin-top:20px; padding-top:18px; border-top:2px dashed var(--line);
  }
  .trivia-fun-fact .tf-label{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:.72rem; color:#9B5BC9; letter-spacing:.06em; margin-bottom:8px; }
  .trivia-fun-fact .tf-text{ font-size:.92rem; line-height:1.75; color:var(--chalk-dim); }
  .badge.lvl{ color:var(--chalk-dim); border-color:var(--line); background:transparent; }

  .qhead{ display:flex; justify-content:space-between; align-items:flex-start; }
  .qhead-actions{ display:flex; align-items:center; gap:6px; }
  .star-btn{
    background:none; border:none; cursor:pointer;
    font-size:1.3rem; line-height:1; padding:0 2px;
    color:rgba(255,182,213,0.55);
  }
  .star-btn.on{ color:var(--star); }
  .speak-btn{
    background:none; border:none; cursor:pointer;
    font-size:1.15rem; line-height:1; padding:2px 4px;
    color:var(--chalk-dim);
  }
  .speak-btn:active{ transform:scale(.9); }
  .speak-toggle{
    background:transparent; border:1px solid var(--line); border-radius:100px;
    color:var(--chalk-dim); font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:.68rem; padding:3px 9px; cursor:pointer;
  }
  .speak-toggle.on{ background:rgba(255,201,77,0.22); border-color:var(--star); color:#C99000; }

  .question{
    font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:1.1rem;
    line-height:1.8;
    margin:0 0 22px;
    color:#4A3B45;
  }

  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{
    text-align:left;
    background:var(--panel-2);
    border:2px solid var(--line);
    color:var(--chalk);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:.98rem;
    padding:13px 16px;
    border-radius:16px;
    cursor:pointer;
    display:flex; gap:12px; align-items:flex-start;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .choice:hover:not(:disabled){ border-color:var(--c-japan); transform:translateY(-1px); }
  .choice .num{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; color:#FFFFFF; flex-shrink:0;
    background:var(--c-japan); border-radius:50%; width:22px; height:22px;
    display:inline-flex; align-items:center; justify-content:center; font-size:.75rem;
  }
  .choice:disabled{ cursor:default; }
  .choice.correct{ background:rgba(111,214,155,0.20); border-color:var(--ok); }
  .choice.wrong{ background:rgba(255,143,163,0.20); border-color:var(--ng); }
  .choice.dim{ opacity:.5; }

  .feedback{ margin-top:20px; padding-top:18px; border-top:2px dashed var(--line); }
  .feedback .result{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-weight:700; font-size:1.05rem; margin-bottom:8px; }
  .feedback .result.ok{ color:#2FAE6B; }
  .feedback .result.ng{ color:#E85C79; }
  .feedback .explain{ font-size:.92rem; line-height:1.8; color:#7A6470; }
  .feedback .retry-note{ font-size:.82rem; color:#C99000; margin-top:8px; }

  .btn{
    margin-top:20px; width:100%;
    background:#FFFFFF; border:2px solid var(--c-japan); color:#E0537A;
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:.95rem;
    padding:13px; border-radius:100px; cursor:pointer; transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{ background:rgba(255,158,181,0.12); transform:translateY(-1px); }
  .btn:active{ transform:translateY(0) scale(.98); }
  .btn.solid{ background:linear-gradient(135deg, #FF9EB5, #FFB6C9); color:#FFFFFF; border:none; box-shadow:0 8px 20px -8px rgba(255,158,181,0.7); }
  .btn.solid:hover{ opacity:.92; }
  .btn.ghost{ border-color:#D8A8BE; color:#8A6B7A; background:rgba(255,182,213,0.10); }
  .btn.ghost:hover{ background:rgba(255,182,213,0.20); }
  .btn.danger{ border-color:var(--ng); color:var(--ng); }
  .btn[disabled]{ opacity:.35; cursor:not-allowed; }

  .menu-stack{ display:flex; flex-direction:column; gap:12px; }
  .menu-item{
    background:var(--panel); border:2px solid var(--line); border-radius:18px;
    padding:18px 20px; cursor:pointer; text-align:left;
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    box-shadow:0 4px 14px -8px rgba(255,158,181,0.25);
  }
  .menu-item:hover:not(.disabled){ border-color:var(--c-japan); transform:translateY(-2px); box-shadow:0 10px 20px -10px rgba(255,158,181,0.45); }
  .menu-item.disabled{ opacity:.4; cursor:not-allowed; }
  .menu-item .mi-title{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:1.02rem; margin-bottom:4px; color:#4A3B45; }
  .menu-item .mi-sub{ font-size:.8rem; color:var(--chalk-dim); }
  .menu-item .mi-arrow{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; color:var(--c-japan); font-size:1.1rem; flex-shrink:0; }

  .stat-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
  .stat-box{ background:var(--panel-2); border:2px solid var(--line); border-radius:16px; padding:12px 8px; text-align:center; }
  .stat-box .num{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:1.1rem; color:var(--c-japan); }
  .stat-box .lab{ font-size:.66rem; color:var(--chalk-dim); margin-top:3px; }

  .section-title{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:1rem; margin:26px 0 12px; color:#A98CA0; }

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cat-btn{ border-radius:18px; padding:16px 14px; cursor:pointer; text-align:left; border:2px solid; background:var(--panel-2); transition:transform .12s ease; }
  .cat-btn:hover{ transform:translateY(-2px); }
  .cat-btn .cn{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:1rem; margin-bottom:4px; }
  .cat-btn .cp{ font-family:'Zen Kaku Gothic New', sans-serif; font-size:.78rem; color:var(--chalk-dim); }

  .summary h2{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:1.35rem; margin:0 0 4px; color:#4A3B45; }
  .summary .score{ font-family:'Mochiy Pop One', 'Zen Kaku Gothic New', sans-serif; font-size:2.6rem; margin:6px 0 4px; color:var(--c-japan); }
  .summary .score span{ font-size:1.1rem; color:var(--chalk-dim); }
  .summary .score-note{ color:var(--chalk-dim); font-size:.88rem; margin-bottom:22px; }

  .mini-stats{ display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; justify-content:center; }
  .mini-stats .pill{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:.78rem; border:2px solid var(--line); border-radius:100px; padding:6px 14px; color:var(--chalk-dim); background:var(--panel-2); }

  .barrow{ display:grid; grid-template-columns:70px 1fr 56px; align-items:center; gap:12px; margin-bottom:12px; font-size:.88rem; }
  .barrow .label{ color:var(--chalk-dim); }
  .barrow .track{ height:14px; background:rgba(255,182,213,0.18); border-radius:100px; overflow:hidden; }
  .barrow .fill{ height:100%; border-radius:100px; transition:width .5s ease; }
  .barrow .pct{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; text-align:right; color:var(--chalk-dim); }

  .advice{ margin-top:22px; padding:20px; background:var(--panel-2); border-left:4px solid var(--c-japan); border-radius:16px; }
  .advice h3{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:1.02rem; margin:0 0 10px; }
  .advice p{ font-size:.9rem; line-height:1.8; color:var(--chalk-dim); margin:0 0 10px; }
  .advice p:last-child{ margin-bottom:0; }

  .history-row{ border:2px solid var(--line); border-radius:16px; padding:13px 16px; margin-bottom:10px; background:var(--panel); }
  .history-row .hr-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .history-row .hr-date{ font-family:'Zen Kaku Gothic New', sans-serif; font-size:.78rem; color:var(--chalk-dim); }
  .history-row .hr-mode{ font-size:.78rem; color:var(--chalk-dim); }
  .history-row .hr-score{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; color:var(--c-japan); }
  .empty-note{ color:var(--chalk-dim); font-size:.85rem; padding:14px 0; text-align:center; }

  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ margin-top:0; }

  .list-item{
    border:2px solid var(--line); border-radius:16px; margin-bottom:10px; overflow:hidden;
    background:var(--panel);
  }
  .list-item .list-head{
    padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .list-item .list-q{ font-size:.92rem; line-height:1.6; }
  .list-item .list-arrow{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; color:var(--c-japan); flex-shrink:0; }
  .list-item .list-body{ padding:0 16px 16px; border-top:2px dashed var(--line); }
  .list-item .list-choice{
    padding:8px 12px; margin-top:8px; border-radius:12px; font-size:.88rem;
    background:var(--panel-2); border:2px solid var(--line);
  }
  .list-item .list-choice.correct{ border-color:var(--ok); background:rgba(111,214,155,0.16); }
  .list-item .list-explain{ margin-top:10px; font-size:.86rem; color:var(--chalk-dim); line-height:1.7; }

  .level-card{
    background:linear-gradient(135deg, rgba(255,201,77,0.20), rgba(154,199,235,0.14));
    border:2px solid var(--star); border-radius:22px; padding:18px 20px; margin-bottom:20px;
    box-shadow:0 10px 24px -14px rgba(255,201,77,0.5);
  }
  .level-card .lc-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .level-card .lc-level{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:1.3rem; color:#C99000; }
  .level-card .lc-title{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:1.1rem; color:#4A3B45; }
  .level-card .lc-xp{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:.75rem; color:var(--chalk-dim); text-align:right; }
  .level-card .lc-track{ height:12px; border-radius:100px; background:rgba(255,255,255,0.55); overflow:hidden; }
  .level-card .lc-fill{ height:100%; border-radius:100px; background:linear-gradient(90deg, #FFC94D, #FF9EB5); transition:width .5s ease; }
  .level-card .lc-emoji{ font-size:1.4rem; margin-right:8px; }
  .level-card .lc-next{ font-size:.72rem; color:var(--chalk-dim); margin-top:6px; text-align:right; }

  .points-earned{ margin:22px 0; padding:16px; background:var(--panel-2); border:1px solid var(--star); border-radius:8px; }
  .points-earned .pe-num{ font-family:'Mochiy Pop One', 'Zen Kaku Gothic New', sans-serif; font-size:1.8rem; color:var(--star); }
  .points-earned .pe-num span{ font-size:1rem; margin-left:4px; }
  .points-earned .pe-label{ font-size:.78rem; color:var(--chalk-dim); margin-top:2px; }

  .level-up-banner{
    margin:0 0 22px; padding:18px; border-radius:8px;
    background:linear-gradient(135deg, rgba(232,196,104,0.22), rgba(127,179,213,0.12));
    border:1px solid var(--star); animation: popIn .4s ease;
  }
  .retry-round-banner{
    font-size:.8rem; color:#C99000; border:2px solid var(--star);
    background:rgba(255,201,77,0.14); border-radius:14px; padding:8px 12px; margin-bottom:14px; text-align:center;
  }
  .level-up-banner .lu-icon{ font-size:2rem; margin-bottom:6px; }
  .level-up-banner .lu-text{ font-family:'Mochiy Pop One', 'Zen Kaku Gothic New', sans-serif; font-size:1rem; line-height:1.6; }
  @keyframes popIn{ 0%{ transform:scale(0.85); opacity:0; } 100%{ transform:scale(1); opacity:1; } }

  .unit-grid{ display:flex; flex-direction:column; gap:10px; }
  .unit-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--panel-2); border:2px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .unit-item:hover{ border-color:var(--c-japan); transform:translateY(-1px); }
  .unit-item .un-name{ font-family:'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:.96rem; color:#4A3B45; }
  .unit-item .un-meta{ font-family:'Zen Kaku Gothic New', sans-serif; font-size:.75rem; color:var(--chalk-dim); }

  @media (max-width:420px){
    .card{ padding:20px 16px; }
    .question{ font-size:1.05rem; }
    .stat-strip{ grid-template-columns:repeat(2,1fr); }
    .cat-grid{ grid-template-columns:1fr; }
  }

  /* ==== 正誤フィードバックの画面エフェクト ==== */
  .fx-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    background: radial-gradient(circle at 50% 42%, var(--fx-color) 0%, transparent 62%);
    opacity:0;
  }
  .fx-overlay.fx-correct{ animation: fxFlashCorrect .6s ease-out; }
  .fx-overlay.fx-wrong{ animation: fxFlashWrong .42s ease-out; }
  @keyframes fxFlashCorrect{
    0%{ opacity:0; }
    16%{ opacity:.5; }
    100%{ opacity:0; }
  }
  @keyframes fxFlashWrong{
    0%{ opacity:0; }
    20%{ opacity:.32; }
    45%{ opacity:.12; }
    60%{ opacity:.24; }
    100%{ opacity:0; }
  }
  .fx-particle{
    position:fixed; top:38%; z-index:10000; pointer-events:none;
    animation: fxParticleRise 1s cubic-bezier(.17,.84,.44,1) forwards;
  }
  @keyframes fxParticleRise{
    0%{ transform:translate(0,0) scale(.4) rotate(0deg); opacity:0; }
    16%{ opacity:1; transform:translate(calc(var(--dx,0) * 0.3), calc(var(--rise,150px) * -0.2)) scale(1.2) rotate(40deg); }
    100%{ transform:translate(var(--dx,0), calc(var(--rise,150px) * -1)) scale(1) rotate(200deg); opacity:0; }
  }
  .fx-ring{
    position:fixed; top:50%; left:50%; z-index:9998; pointer-events:none;
    width:20px; height:20px; margin:-10px 0 0 -10px;
    border-radius:50%; border:3px solid var(--ring-color, #6FCF97);
    animation: fxRingExpand .7s ease-out forwards;
  }
  @keyframes fxRingExpand{
    0%{ width:20px; height:20px; margin:-10px 0 0 -10px; opacity:.85; border-width:5px; }
    100%{ width:var(--ring-size,260px); height:var(--ring-size,260px);
      margin: calc(var(--ring-size,260px) / -2) 0 0 calc(var(--ring-size,260px) / -2);
      opacity:0; border-width:1px; }
  }
  .fx-shake{ animation: fxShakeCard .42s ease-in-out; }
  @keyframes fxShakeCard{
    0%,100%{ transform:translateX(0) rotate(0); }
    15%{ transform:translateX(-10px) rotate(-1.5deg); }
    30%{ transform:translateX(9px) rotate(1.5deg); }
    45%{ transform:translateX(-7px) rotate(-1deg); }
    60%{ transform:translateX(7px) rotate(1deg); }
    75%{ transform:translateX(-4px) rotate(-.5deg); }
    90%{ transform:translateX(3px) rotate(.5deg); }
  }
  .fx-pop{ animation: fxPopCard .42s cubic-bezier(.34,1.56,.64,1); }
  @keyframes fxPopCard{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.045); }
    100%{ transform:scale(1); }
  }
  .fx-glitch{ animation: fxGlitchCard .38s steps(2,end); }
  @keyframes fxGlitchCard{
    0%{ transform:translateX(0); filter:hue-rotate(0deg) saturate(1); }
    20%{ transform:translateX(-5px); filter:hue-rotate(60deg) saturate(2); }
    40%{ transform:translateX(5px); filter:hue-rotate(-40deg) saturate(2.2); }
    60%{ transform:translateX(-3px); filter:hue-rotate(30deg) saturate(1.6); }
    80%{ transform:translateX(3px); filter:hue-rotate(0deg) saturate(1.2); }
    100%{ transform:translateX(0); filter:hue-rotate(0deg) saturate(1); }
  }
  .fx-dropshake{ animation: fxDropShakeCard .45s ease-out; }
  @keyframes fxDropShakeCard{
    0%{ transform:translateY(-14px); opacity:.7; }
    30%{ transform:translateY(4px); opacity:1; }
    45%{ transform:translateY(0) translateX(-6px); }
    60%{ transform:translateX(6px); }
    75%{ transform:translateX(-3px); }
    100%{ transform:translateX(0); }
  }

  .speech-toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    max-width:88vw; z-index:10001;
    background:var(--panel); border:1px solid var(--star); color:var(--chalk);
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:.82rem; line-height:1.5;
    padding:12px 16px; border-radius:8px; box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease;
  }
  .speech-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .settings-field{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; background:var(--panel); border:2px solid var(--line); border-radius:16px;
    margin-bottom:12px;
  }
  .settings-field-col{
    display:flex; flex-direction:column; gap:6px;
    padding:14px 16px; background:var(--panel); border:2px solid var(--line); border-radius:16px;
    margin-bottom:12px;
  }
  .settings-label{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:.85rem; color:#4A3B45; }
  .settings-input{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:.9rem;
    padding:10px 12px; border-radius:12px; border:2px solid var(--line);
    background:var(--panel-2); color:var(--chalk); width:100%;
  }
  .settings-input:focus{ outline:none; border-color:var(--c-japan); }

  .q-diagram{
    margin:14px 0 20px; padding:14px; background:var(--panel-2);
    border:2px solid var(--line); border-radius:16px;
    display:flex; justify-content:center; overflow-x:auto;
  }
  .q-diagram svg{ max-width:100%; height:auto; display:block; }
</style>

<script>
/* ==================== 中学レベルの問題（社会） ==================== */
const QUESTIONS = [
  /* 日本史 */
  {id:"his01", cat:"日本史", sub:"古代", q:"大化の改新が行われた時代はいつか。", choices:["飛鳥時代","奈良時代","平安時代","鎌倉時代"], a:0, e:"正解は「飛鳥時代」です。大化の改新は645年、飛鳥時代に中大兄皇子や中臣鎌足が蘇我氏を倒して始めた大規模な政治改革です。「奈良時代」は誤りで、これは710年の平城京遷都以降の時代であり、大化の改新より後です。「平安時代」は誤りで、これは794年の平安京遷都以降であり、さらに後の時代です。「鎌倉時代」は誤りで、これは12世紀末以降の武家政権の時代であり、時期が大きく異なります。"},
  {id:"his03", cat:"日本史", sub:"平安時代", q:"平清盛が活躍した時代は？", choices:["平安時代","鎌倉時代","室町時代","江戸時代"], a:0, e:"正解は「平安時代」です。平清盛は平安時代末期（12世紀）に活躍し、武士として初めて太政大臣となり、平氏の栄華をもたらしました。「鎌倉時代」は誤りで、これは平清盛の死後、源頼朝が幕府を開いた12世紀末以降の時代です。「室町時代」は誤りで、これは14世紀以降の足利氏による武家政権の時代です。「江戸時代」は誤りで、これは17世紀以降の徳川氏による時代であり、平清盛の時代とは大きくかけ離れています。"},
  {id:"his05", cat:"日本史", sub:"鎌倉・室町", q:"鎌倉幕府を開いたのは誰か。", choices:["源頼光","源頼朝","足利尊氏","織田信長"], a:1, e:"正解は「源頼朝」です。源頼朝は1185年に鎌倉幕府を開き、日本初の本格的な武家政権を樹立しました。「源頼光」は誤りで、これは平安時代中期に活躍した別の源氏の武将であり、鎌倉幕府とは無関係です。「足利尊氏」は誤りで、彼が開いたのは室町幕府であり、鎌倉幕府ではありません。「織田信長」は誤りで、彼は戦国時代の武将であり、幕府を開いたことはありません。"},
  {id:"his07", cat:"日本史", sub:"鎌倉・室町", q:"室町幕府の3代将軍で金閣寺を建立したのは？", choices:["足利尊氏","足利義満","足利義政","足利慶喜"], a:1, e:"正解は「足利義満」です。足利義満は室町幕府の3代将軍として、京都の北山に金閣寺（鹿苑寺）を建立しました。「足利尊氏」は誤りで、彼は室町幕府の初代将軍であり、金閣寺を建てたのは3代将軍の義満です。「足利義政」は誤りで、彼は8代将軍で、銀閣寺（慈照寺）を建立した人物です。「足利慶喜」は誤りで、そもそも「足利慶喜」という人物は存在せず、江戸幕府最後の将軍は「徳川慶喜」です。"},
  {id:"his09", cat:"日本史", sub:"戦国・江戸", q:"織田信長の天下統一事業を引き継いだのは誰か。", choices:["豊臣秀吉","徳川家康","明智光秀","上杉謙信"], a:0, e:"正解は「豊臣秀吉」です。豊臣秀吉（羽柴秀吉）は織田信長の家臣として仕え、信長の死後にその遺志を継いで1590年に天下統一を完成させました。「徳川家康」は誤りで、彼が天下統一を果たしたのは秀吉の死後であり、信長の直接の後継者ではありません。「明智光秀」は誤りで、彼は信長を本能寺の変で討った家臣であり、天下統一を引き継いだ人物ではありません。「上杉謙信」は誤りで、彼は信長と同時代の有力な戦国大名ですが、信長の家臣ではなく、天下統一を引き継いではいません。"},
  {id:"his11", cat:"日本史", sub:"戦国・江戸", q:"江戸幕府を開いたのはいつか。", choices:["1573年","1582年","1603年","1615年"], a:2, e:"正解は「1603年」です。徳川家康は1603年に征夷大将軍に任じられ、江戸幕府を開きました。「1573年」は誤りで、これは室町幕府が織田信長によって滅ぼされた年です。「1582年」は誤りで、これは本能寺の変が起こり織田信長が死去した年です。「1615年」は誤りで、これは大坂夏の陣で豊臣氏が滅亡した年であり、江戸幕府成立より12年後の出来事です。"},
  {id:"his13", cat:"日本史", sub:"江戸時代", q:"江戸時代の身分制度で、最上位の身分は何か。", choices:["農民","町人","武士","僧侶"], a:2, e:"正解は「武士」です。江戸時代は士農工商という身分制度があり、武士が最上位に位置づけられていました。「農民」は誤りで、農民は第二位に位置づけられ、年貢を納める重要な存在でしたが最上位ではありません。「町人」は誤りで、町人（商工業者）は身分制度の中では低い位置に置かれていました。「僧侶」は誤りで、僧侶は士農工商の身分制度の枠外に置かれた特殊な存在であり、最上位の武士とは異なります。"},
  {id:"his17", cat:"日本史", sub:"近代", q:"明治維新の政治制度改革で「五箇条の誓文」を発表したのは？", choices:["木戸孝允","大久保利通","岩倉具視","明治天皇"], a:3, e:"正解は「明治天皇」です。五箇条の誓文は明治天皇が神々に誓う形式で発表した、明治新政府の基本方針を示す文書です。「木戸孝允」は誤りで、彼は明治維新の中心人物の一人ですが、誓文を発表したのは天皇自身です。「大久保利通」は誤りで、彼も明治政府の実力者ですが、誓文の発表者ではありません。「岩倉具視」は誤りで、彼は公家出身の政治家で岩倉使節団の団長として知られますが、誓文を発表した人物ではありません。"},
  /* 世界史 */
  {id:"wor01", cat:"世界史", sub:"古代・中世", q:"ルネサンスが最初に起こった地域は？", choices:["フランス","イタリア","スペイン","ドイツ"], a:1, e:"正解は「イタリア」です。ルネサンスは14〜15世紀にイタリアで始まり、古代ギリシャ・ローマの文化を再評価する動きが広まりました。「フランス」は誤りで、ルネサンスはイタリアから伝わり、フランスで開花したのはやや後の時期です。「スペイン」は誤りで、スペインはルネサンスよりも大航海時代の中心地として知られます。「ドイツ」は誤りで、ドイツは後の宗教改革の中心地であり、ルネサンス発祥の地ではありません。"},
  {id:"wor05", cat:"世界史", sub:"ヨーロッパ史", q:"フランス革命が起こったのはいつか。", choices:["1768年","1776年","1789年","1801年"], a:2, e:"正解は「1789年」です。フランス革命は1789年、バスティーユ牢獄襲撃をきっかけに始まりました。「1768年」「1776年」は誤りで、いずれもフランス革命より前の年です。「1801年」は誤りで、これはフランス革命よりも後、ナポレオンが統領政府を率いていた時期にあたります。"},
  {id:"wor09", cat:"世界史", sub:"アジア史", q:"シルク・ロードの主な役割は？", choices:["軍事同盟","貿易路","観光ルート","宗教的巡礼路"], a:1, e:"正解は「貿易路」です。シルク・ロードは中国とヨーロッパを結び、絹などの物産を運んだ東西の貿易を仲介する主要な商業路でした。「軍事同盟」は誤りで、シルク・ロードは軍事的な同盟関係ではなく、経済的な交易ルートです。「観光ルート」は誤りで、シルク・ロードが観光目的で整備されたわけではありません。「宗教的巡礼路」は誤りで、仏教などの伝播にも利用されましたが、主な役割は貿易であり巡礼が主目的ではありません。"},
  {id:"wor11", cat:"世界史", sub:"ヨーロッパ史", q:"スエズ運河が開通したのはいつか。", choices:["1869年","1875年","1882年","1899年"], a:0, e:"正解は「1869年」です。スエズ運河は1869年、フランス人技術者レセップスの指導のもとエジプトで開通しました。「1875年」は誤りで、これはイギリスがスエズ運河会社の株式を買収した年であり、開通年ではありません。「1882年」は誤りで、これはイギリスがエジプトを事実上の保護下に置いた年です。「1899年」は誤りで、開通からかなり後の時期であり、開通年とは異なります。"},
  /* 地理 */
  {id:"geo01", cat:"地理", sub:"日本地理", q:"日本の首都は？", choices:["大阪","東京","京都","横浜"], a:1, e:"正解は「東京」です。東京は日本の首都であり、国会や中央省庁が置かれる政治・経済の中心です。「大阪」は誤りで、大阪は西日本最大の経済都市ですが首都ではありません。「京都」は誤りで、京都はかつて平安京として都が置かれましたが、現在の首都ではありません。「横浜」は誤りで、横浜は人口の多い都市ですが首都機能を持つ都市ではありません。"},
  {id:"geo03", cat:"地理", sub:"日本地理", q:"日本の最高峰は？", choices:["穂高岳","富士山","立山","白馬岳"], a:1, e:"正解は「富士山」です。富士山は標高3,776メートルで日本最高峰であり、静岡県と山梨県にまたがる活火山です。「穂高岳」は誤りで、これは標高約3,190メートルの北アルプスの山であり、富士山より低い山です。「立山」は誤りで、これも富士山より標高が低い北陸地方の山です。「白馬岳」も誤りで、これは北アルプスの山であり、いずれも富士山の標高（3,776メートル）には及びません。"},
  {id:"geo05", cat:"地理", sub:"世界地理", q:"ヨーロッパで最も人口の多い国は？", choices:["フランス","イギリス","ドイツ","イタリア"], a:2, e:"正解は「ドイツ」です。ドイツはヨーロッパの中でも特に人口が多く、欧州最大級の人口を有する国です。「フランス」「イギリス」「イタリア」はいずれも誤りで、これらもヨーロッパの主要国ですが、人口規模ではドイツに及びません。"},
  {id:"geo07", cat:"地理", sub:"世界地理", q:"アフリカで最も面積が大きい国は？", choices:["ナイジェリア","エジプト","スーダン","アルジェリア"], a:3, e:"正解は「アルジェリア」です。アルジェリアはアフリカ大陸で最も面積が大きい国です。「ナイジェリア」は誤りで、これはアフリカ最大の人口を持つ国ですが、面積ではアルジェリアに及びません。「エジプト」は誤りで、これも有名な大国ですが面積はアルジェリアより小さいです。「スーダン」は誤りで、これもアフリカの大国の一つですが、面積最大はアルジェリアです。"},
  {id:"geo09", cat:"地理", sub:"世界地理", q:"赤道はどこを通っているか。", choices:["アジアとアフリカの間","アフリカのほぼ中央部","北米と南米の間","アジアとオセアニアの間"], a:1, e:"正解は「アフリカのほぼ中央部」です。赤道はアフリカ大陸のほぼ中央を通過しており、ケニアなどの国々を横切っています。「アジアとアフリカの間」は誤りで、赤道はこの二つの大陸の境界線ではなく、アフリカ大陸内部を通っています。「北米と南米の間」は誤りで、実際には赤道は南米大陸のほぼ北部（エクアドルなど）を通過しますが、北米と南米の境界とは異なる位置です。「アジアとオセアニアの間」は誤りで、赤道はインドネシアなど東南アジアの島々も通過しますが、境界線という表現は不正確です。"},
  {id:"geo11", cat:"地理", sub:"世界地理", q:"世界最大の砂漠は？", choices:["ゴビ砂漠","カラハリ砂漠","サハラ砂漠","アラビア砂漠"], a:2, e:"正解は「サハラ砂漠」です。サハラ砂漠はアフリカ北部に広がる、世界最大の砂漠です。「ゴビ砂漠」は誤りで、これはモンゴルから中国にまたがる砂漠で、サハラよりも面積が小さいです。「カラハリ砂漠」は誤りで、これは南部アフリカの砂漠であり、サハラより規模が小さいです。「アラビア砂漠」は誤りで、これはアラビア半島に広がる砂漠で、サハラに次ぐ規模ではあるものの世界最大ではありません。"},
  {id:"geo13", cat:"地理", sub:"世界地理", q:"世界最長の川は？", choices:["アマゾン川","ナイル川","ヤンツェ川","ミシシッピ川"], a:1, e:"正解は「ナイル川」です。ナイル川は全長約6,650キロメートルで、世界最長の川とされています。「アマゾン川」は誤りで、流域面積では世界最大ですが、長さではナイル川にわずかに及ばないとされています。「ヤンツェ川（長江）」は誤りで、これはアジア最長の川ですがナイル川より短いです。「ミシシッピ川」は誤りで、これは北米最長級の川ですが、世界最長ではありません。"},
  {id:"geo15", cat:"地理", sub:"世界地理", q:"アジアで最も人口の多い国は？", choices:["インド","中国","インドネシア","日本"], a:1, e:"正解は「中国」です。中国は伝統的に世界最大級の人口を有する国とされてきました。「インド」は誤りで、近年の統計では中国を上回ったとする調査もありますが、この設問は伝統的な人口規模の観点から中国を正解としています。「インドネシア」は誤りで、人口は多いものの中国やインドには及びません。「日本」は誤りで、日本の人口はアジアの中でも中位程度であり、最大ではありません。"},
  {id:"geo17", cat:"地理", sub:"世界地理", q:"太平洋の西側に位置する地域は？", choices:["北米","ヨーロッパ","オセアニア・東アジア","南米"], a:2, e:"正解は「オセアニア・東アジア」です。太平洋の西側にはオセアニアや東アジアの国々（日本、中国、オーストラリアなど）が位置しています。「北米」は誤りで、北米は太平洋の東側に位置します。「ヨーロッパ」は誤りで、ヨーロッパは太平洋に面していません。「南米」は誤りで、南米も太平洋の東側に位置する地域です。"},
  {id:"geo19", cat:"地理", sub:"世界地理", q:"スイスの首都は？", choices:["ベルン","チューリッヒ","ジュネーブ","ローザンヌ"], a:0, e:"正解は「ベルン」です。ベルンはスイスの首都であり、連邦議会などが置かれています。「チューリッヒ」は誤りで、これはスイス最大の都市で経済の中心ですが首都ではありません。「ジュネーブ」は誤りで、国際機関が多く置かれる都市として知られますが首都ではありません。「ローザンヌ」は誤りで、国際オリンピック委員会の本部がある都市として知られますが、これも首都ではありません。"},
  /* 公民 */
  {id:"civ01", cat:"公民", sub:"政治体制", q:"日本の三権は何か。", choices:["立法権・行政権・司法権","財務権・軍事権・司法権","行政権・警察権・司法権","立法権・軍事権・外交権"], a:0, e:"正解は「立法権・行政権・司法権」です。日本の三権はこの三つであり、それぞれ国会・内閣・裁判所が担っています。「財務権・軍事権・司法権」は誤りで、財務権や軍事権という区分は日本の三権分立の枠組みには存在しません。「行政権・警察権・司法権」は誤りで、警察権は行政権に含まれる一部の機能であり、独立した「権」として並列されるものではありません。「立法権・軍事権・外交権」は誤りで、軍事権・外交権はいずれも行政権に含まれる機能であり、独立した権力の一つではありません。"},
  {id:"civ03", cat:"公民", sub:"政治体制", q:"日本の国権の最高機関と位置づけられている機関はどれか。", choices:["国会","内閣","裁判所","天皇"], a:0, e:"正解は「国会」です。日本国憲法第41条により、国会は「国権の最高機関」であり「唯一の立法機関」と位置づけられています。「内閣」は誤りで、内閣は行政権を担う機関ですが、憲法上「最高機関」とはされていません。「裁判所」は誤りで、裁判所は司法権を担いますが、同様に最高機関とはされていません。「天皇」は誤りで、天皇は日本国憲法のもとで「日本国の象徴」とされ、政治的な権能を持たず、最高機関でもありません。"},
  {id:"civ05", cat:"公民", sub:"政治体制", q:"日本の参議院議員の任期は？", choices:["2年","3年","4年","6年"], a:3, e:"正解は「6年」です。参議院議員の任期は6年で、3年ごとに半数が改選される仕組みになっています。「2年」「3年」「4年」はいずれも誤りで、特に「4年」は衆議院議員の任期と混同しやすい選択肢ですが、参議院の任期はそれより長い6年です。"},
  {id:"civ07", cat:"公民", sub:"政治体制", q:"民法で成人の定義は？", choices:["18歳以上","20歳以上","15歳以上","16歳以上"], a:0, e:"正解は「18歳以上」です。2022年4月の民法改正施行により、成人年齢が20歳から18歳に引き下げられました。「20歳以上」は誤りで、これは2022年の改正より前の旧成人年齢です。「15歳以上」「16歳以上」はいずれも誤りで、これらは成人年齢としては現行・旧規定のいずれにも該当しません。"},
  {id:"civ09", cat:"公民", sub:"経済", q:"GNPとGDPの違いは？", choices:["計算方法が異なる","GNPは国民生産、GDPは国内生産","GDPが新しい指標","GNPはヨーロッパで使用"], a:1, e:"正解は「GNPは国民生産、GDPは国内生産」です。GNP（国民総生産）は国民が生産した付加価値の合計、GDP（国内総生産）は国内で生産された付加価値の合計を指し、集計の基準（国民か国内か）が異なります。「計算方法が異なる」は誤りで、両者の違いの本質は集計基準の違いであり、計算方法そのものの違いという説明では不十分・不正確です。「GDPが新しい指標」は誤りで、新旧の関係というより集計対象の違いが本質的な差です。「GNPはヨーロッパで使用」は誤りで、GNPとGDPの使い分けは地域による違いではなく、経済指標としての定義の違いによるものです。"},
  {id:"civ11", cat:"公民", sub:"経済", q:"マルクスが主張した経済体制は？", choices:["資本主義","社会主義・共産主義","重商主義","重農主義"], a:1, e:"正解は「社会主義・共産主義」です。カール・マルクスは資本主義を批判し、生産手段の共有を主張する社会主義・共産主義の理論的基礎を築きました。「資本主義」は誤りで、これはマルクスが批判の対象とした経済体制であり、彼が主張した体制ではありません。「重商主義」は誤りで、これは近世ヨーロッパの絶対王政期に見られた経済政策であり、マルクスの時代や主張とは異なります。「重農主義」は誤りで、これは18世紀フランスの経済思想であり、マルクスの主張とは無関係です。"},
  {id:"civ13", cat:"公民", sub:"経済", q:"株式会社の経営と所有の分離とは？", choices:["会社の分割","株主と経営者が異なること","複数の会社の統合","国有化"], a:1, e:"正解は「株主と経営者が異なること」です。株式会社では出資者である株主と、実際に経営を行う経営者が分離していることが多く、これを「所有と経営の分離」といいます。「会社の分割」は誤りで、これは企業の組織再編に関する別の概念です。「複数の会社の統合」は誤りで、これは合併に関する概念であり、所有と経営の分離とは異なります。「国有化」は誤りで、これは企業を国が所有する形態を指し、株式会社における所有と経営の分離とは無関係です。"},
  {id:"civ15", cat:"公民", sub:"経済", q:"金融政策の主要な手段は？", choices:["税制改革","公債発行","公開市場操作（金利調整など）","法律制定"], a:2, e:"正解は「公開市場操作（金利調整など）」です。中央銀行の金融政策は主に国債などを売買する公開市場操作を通じて金利や通貨量を調整する形で行われます。「税制改革」は誤りで、これは財政政策に関する事柄であり、金融政策とは担当機関も手段も異なります。「公債発行」は誤りで、これも政府が行う財政政策の一環であり、中央銀行が行う金融政策の主要な手段ではありません。「法律制定」は誤りで、これは国会の役割であり、金融政策の具体的手段ではありません。"},
  {id:"civ17", cat:"公民", sub:"労働・法律", q:"労働基準法で定められた最低賃金を決めるのは？", choices:["企業","政府（労働基準監督署）","労働組合","地域ごとに異なる"], a:3, e:"正解は「地域ごとに異なる」です。最低賃金は都道府県ごと、業種ごとに異なる金額が労働局を通じて決定されます。「企業」は誤りで、最低賃金は個々の企業が自由に決められるものではなく、法律にもとづき定められます。「政府（労働基準監督署）」は誤りで、労働基準監督署は最低賃金の遵守状況を監督する機関であり、金額そのものを決定する機関ではありません。「労働組合」は誤りで、労働組合は交渉を通じて賃金に影響を与えることはありますが、最低賃金そのものを決定する権限は持ちません。"},
  {id:"civ19", cat:"公民", sub:"国際関係", q:"国連の主要機関ではないのはどれ？", choices:["総会","安全保障理事会","信託統治理事会","世界銀行"], a:3, e:"正解は「世界銀行」です。世界銀行は国連と協力関係にありますが、国連の主要機関には含まれず、独立した国際金融機関です。「総会」「安全保障理事会」「信託統治理事会」はいずれも誤りで、これらはすべて国連憲章に定められた国連の主要機関に含まれます。"},
  /* 日本史 */
  {id:"his25", cat:"日本史", sub:"古代", q:"聖徳太子の十七条憲法についての説明として正しいものはどれか。", choices:["仏教の禁止を定めた","政治や道徳の基本原則を定めた","農民の権利を保障した","天皇の絶対権を制限した"], a:1, e:"正解は「政治や道徳の基本原則を定めた」です。十七条憲法は聖徳太子が604年に定めたとされ、「和を以て貴しとなす」など役人の心構えや政治・道徳の基本原則を示したものです。「仏教の禁止を定めた」は誤りで、聖徳太子はむしろ仏教を篤く信仰し保護した人物であり、禁止とは正反対です。「農民の権利を保障した」は誤りで、十七条憲法は主に役人（豪族）に向けた訓戒であり、農民の権利を直接保障する内容ではありません。「天皇の絶対権を制限した」は誤りで、むしろ天皇を中心とした国家体制を強化する意図が込められていました。"},
  {id:"his27", cat:"日本史", sub:"古代", q:"律令制についての説明として正しいものはどれか。", choices:["アメリカから導入された","中国の制度を参考に導入された","独自に日本で開発された","キリスト教の影響を受けている"], a:1, e:"正解は「中国の制度を参考に導入された」です。律令制は中国（隋・唐）の法体系を手本として日本に導入され、大宝律令などとして整備されました。「アメリカから導入された」は誤りで、当時アメリカという国家自体存在せず、時代的に成立しません。「独自に日本で開発された」は誤りで、律令制の基本的な枠組みは中国から取り入れられたものです。「キリスト教の影響を受けている」は誤りで、律令制は仏教や儒教の影響は受けていますが、キリスト教とは無関係です。"},
  {id:"his29", cat:"日本史", sub:"平安時代", q:"平安時代の貴族政治についての説明として正しいものはどれか。", choices:["武士が権力を掌握していた","藤原氏などの貴族が権力を掌握していた","商人が支配していた","農民が自治を行っていた"], a:1, e:"正解は「藤原氏などの貴族が権力を掌握していた」です。平安時代は藤原氏が摂政・関白の地位を独占する摂関政治を行い、権力を掌握していました。「武士が権力を掌握していた」は誤りで、武士が本格的に政治の実権を握るのは平安時代末期以降（平氏政権や鎌倉幕府）のことです。「商人が支配していた」は誤りで、平安時代の商人は政治の実権を持つ立場ではありませんでした。「農民が自治を行っていた」は誤りで、農民の自治組織（惣など）が発達するのは後の室町時代のことです。"},
  {id:"his31", cat:"日本史", sub:"鎌倉・室町", q:"鎌倉幕府の特徴についての説明として正しいものはどれか。", choices:["公家が中心の政治体制","武家が支配する政治体制","僧侶が支配する政治体制","商人が支配する政治体制"], a:1, e:"正解は「武家が支配する政治体制」です。鎌倉幕府は源頼朝が開いた、武士（武家）による初の本格的な支配体制です。「公家が中心の政治体制」は誤りで、これは平安時代の摂関政治などに近い体制であり、鎌倉幕府とは逆の性質です。「僧侶が支配する政治体制」は誤りで、鎌倉幕府において僧侶が政治の中心を担った事実はありません。「商人が支配する政治体制」は誤りで、鎌倉時代の商人は経済活動の担い手ではありましたが、幕府の支配者層ではありません。"},
  {id:"his33", cat:"日本史", sub:"鎌倉・室町", q:"南北朝の争乱についての説明として正しいものはどれか。", choices:["東西に分かれた朝廷が争った","北と南の大名が争った","皇統が南北に分かれて並立した","外国との戦争であった"], a:2, e:"正解は「皇統が南北に分かれて並立した」です。南北朝時代は後醍醐天皇の南朝と、足利尊氏が擁立した北朝という二つの皇統が並立し、約60年間争いが続きました。「東西に分かれた朝廷が争った」は誤りで、実際の対立軸は東西ではなく南北（大和の吉野と京都）です。「北と南の大名が争った」は誤りで、これは天皇（皇統）どうしの対立であり、大名どうしの争いではありません。「外国との戦争であった」は誤りで、南北朝の争乱は日本国内での皇位継承をめぐる内乱です。"},
  {id:"his35", cat:"日本史", sub:"戦国・江戸", q:"豊臣秀吉が行った朝鮮出兵は別名何と呼ばれるか。", choices:["文禄・慶長の役","応仁の乱","前九年の役","西南戦争"], a:0, e:"正解は「文禄・慶長の役」です。豊臣秀吉による朝鮮出兵は文禄の役（1592年）と慶長の役（1597年）の二度にわたり行われ、秀吉の死により日本軍は撤退しました。「応仁の乱」は誤りで、これは室町時代（1467年）に起こった将軍家の後継ぎ争いなどを原因とする国内の内乱であり、朝鮮出兵とは無関係です。「前九年の役」は誤りで、これは平安時代中期に東北地方で起こった戦乱です。「西南戦争」は誤りで、これは明治時代（1877年）に西郷隆盛を担いだ士族が起こした反乱であり、いずれも安土桃山時代の朝鮮出兵とは時代が異なります。"},
  {id:"his37", cat:"日本史", sub:"戦国・江戸", q:"江戸時代の身分制度についての説明として正しいものはどれか。", choices:["士農工商は流動的に変わっていた","士農工商は身分の流動性がなかった","農民が最上位であった","町人が最上位であった"], a:1, e:"正解は「士農工商は身分の流動性がなかった」です。江戸時代の身分制度は基本的に世襲で固定され、身分間の移動はほぼ不可能でした。「士農工商は流動的に変わっていた」は誤りで、実際には身分は厳格に固定され、流動性は極めて低いものでした。「農民が最上位であった」は誤りで、身分制度の最上位は武士であり、農民は第二位に位置づけられていました。「町人が最上位であった」は誤りで、町人（商工業者）はむしろ身分制度の中では低い位置に置かれていました。"},
  {id:"his39", cat:"日本史", sub:"江戸時代", q:"参勤交代についての説明として正しいものはどれか。", choices:["大名の反乱を防ぐ制度","商人の移動を制限する制度","武士の訓練制度","僧侶の巡回制度"], a:0, e:"正解は「大名の反乱を防ぐ制度」です。参勤交代は大名に定期的な江戸出仕を義務づけることで経済力を消耗させ、反乱を防ぐ効果を持つ制度でした。「商人の移動を制限する制度」は誤りで、参勤交代は大名とその家臣団を対象とした制度であり、商人の移動制限とは異なります。「武士の訓練制度」は誤りで、参勤交代は軍事訓練を目的としたものではありません。「僧侶の巡回制度」は誤りで、参勤交代は僧侶とは無関係な、大名を対象とした制度です。"},
  {id:"his41", cat:"日本史", sub:"近代", q:"明治時代の文明開化についての説明として正しいものはどれか。", choices:["日本の伝統を完全に否定した","西洋の文化と技術を積極的に導入した","江戸時代の政策を継続した","アジア統一を目指した"], a:1, e:"正解は「西洋の文化と技術を積極的に導入した」です。文明開化は明治時代初期、西洋の文化・技術・制度を積極的に取り入れることで日本の近代化を進めようとした風潮です。「日本の伝統を完全に否定した」は誤りで、伝統文化が一部見直されたことはあっても「完全な否定」は事実と異なります。「江戸時代の政策を継続した」は誤りで、文明開化はむしろ江戸時代の鎖国的な政策からの大きな転換を意味します。「アジア統一を目指した」は誤りで、文明開化は国内の近代化に関する動きであり、アジア諸国の統一を目指すものではありません。"},
  {id:"his43", cat:"日本史", sub:"近代", q:"日露戦争の講和条約が結ばれた都市はどこか。", choices:["ワシントン","ポーツマス","パリ","ロンドン"], a:1, e:"正解は「ポーツマス」です。日露戦争は1905年、アメリカのポーツマスで講和条約（ポーツマス条約）が結ばれ終結しました。「ワシントン」は誤りで、これはアメリカの首都であり、ポーツマス会議とは別の都市です。「パリ」は誤りで、これはフランスの首都であり、日露戦争の講和条約とは無関係な都市です。「ロンドン」は誤りで、これもイギリスの首都であり、ポーツマス条約とは関係のない都市です。"},
  {id:"his45", cat:"日本史", sub:"近代", q:"関東大震災についての説明として正しいものはどれか。", choices:["第二次世界大戦中に起こった","1923年に起こった大地震である","火山噴火による災害である","人工的に引き起こされた"], a:1, e:"正解は「1923年に起こった大地震である」です。関東大震災は1923年9月1日に発生し、東京・横浜を中心に甚大な被害をもたらした地震です。「第二次世界大戦中に起こった」は誤りで、関東大震災は1923年、第二次世界大戦（1939年〜）よりずっと前の出来事です。「火山噴火による災害である」は誤りで、これは地震による災害であり、火山噴火とは原因が異なります。「人工的に引き起こされた」は誤りで、関東大震災は自然現象であるプレートの活動による地震であり、人為的に起こされたものではありません。"},
  {id:"his47", cat:"日本史", sub:"現代", q:"日本の高度経済成長についての説明として正しいものはどれか。", choices:["1950~70年代に成長が続いた","戦後すぐに急成長が起きた","経済成長は失敗に終わった","農業だけで成長が起きた"], a:0, e:"正解は「1950~70年代に成長が続いた」です。高度経済成長は1950年代半ばから1970年代前半にかけて、年平均約10%の成長率を達成した時期です。「戦後すぐに急成長が起きた」は誤りで、終戦直後の日本経済は復興段階にあり、高度経済成長が本格化するのは1950年代半ば以降です。「経済成長は失敗に終わった」は誤りで、高度経済成長は日本を世界有数の経済大国に押し上げた成功例として知られています。「農業だけで成長が起きた」は誤りで、高度経済成長を牽引したのは主に工業（重化学工業）であり、農業だけの成長ではありません。"},
  /* 世界史 */
  {id:"wor21", cat:"世界史", sub:"古代・中世", q:"古代ローマ帝国についての説明として正しいものはどれか。", choices:["アジアにのみ広がった","ヨーロッパ・アフリカ・西アジアに広がった","アメリカも領土に含まれた","海洋進出はしなかった"], a:1, e:"正解は「ヨーロッパ・アフリカ・西アジアに広がった」です。古代ローマ帝国は最盛期にヨーロッパ、北アフリカ、西アジアの広大な地域を支配下に置きました。「アジアにのみ広がった」は誤りで、ローマ帝国の中心はヨーロッパであり、アジアの一部（西アジア）にしか及んでいません。「アメリカも領土に含まれた」は誤りで、当時のヨーロッパ人はアメリカ大陸の存在を知らず、領土に含まれることはあり得ません。「海洋進出はしなかった」は誤りで、ローマは地中海を「われらの海」と呼ぶほど海上交易や海軍を活用していました。"},
  {id:"wor23", cat:"世界史", sub:"古代・中世", q:"中世ヨーロッパの封建制についての説明として正しいものはどれか。", choices:["民主的な政治体制","領主と農民の主従関係に基づく体制","国民国家による支配","商人による支配"], a:1, e:"正解は「領主と農民の主従関係に基づく体制」です。中世ヨーロッパの封建制は、領主が土地（封土）を家臣に与え、家臣がその見返りに軍事奉仕を行うという主従関係を基盤とした分権的な体制です。「民主的な政治体制」は誤りで、封建制は身分制にもとづく体制であり、民主的な選挙などの仕組みはありません。「国民国家による支配」は誤りで、国民国家の成立はもっと後の近代の出来事であり、封建制とは対照的な集権的な統治形態です。「商人による支配」は誤りで、封建制の担い手は領主（貴族）であり、商人が支配層を形成したわけではありません。"},
  {id:"wor25", cat:"世界史", sub:"ヨーロッパ史", q:"産業革命が最初に起こった国はどこか。", choices:["フランス","イギリス","ドイツ","アメリカ"], a:1, e:"正解は「イギリス」です。産業革命は18世紀後半、イギリスの綿工業から始まりました。「フランス」は誤りで、フランスでは産業革命よりも先にフランス革命（市民革命）が起こり、産業革命自体はイギリスより遅れて進行しました。「ドイツ」は誤りで、ドイツの産業革命はイギリスよりもさらに遅く、19世紀に本格化しました。「アメリカ」は誤りで、アメリカの産業革命も19世紀に進展したものであり、最初に始まった国はイギリスです。"},
  {id:"wor27", cat:"世界史", sub:"ヨーロッパ史", q:"ウィーン会議が開かれるきっかけとなった出来事は何か。", choices:["フランス革命の勃発","ナポレオン戦争の終結","第一次世界大戦の終結","産業革命の開始"], a:1, e:"正解は「ナポレオン戦争の終結」です。ウィーン会議は1814〜1815年、ナポレオン戦争終結後のヨーロッパの秩序回復を目指して開かれました。「フランス革命の勃発」は誤りで、これはウィーン会議よりずっと前（1789年）の出来事であり、会議のきっかけではなく遠因にあたります。「第一次世界大戦の終結」は誤りで、これは20世紀の出来事であり、ウィーン会議（19世紀初頭）とは時代が大きく異なります。「産業革命の開始」は誤りで、産業革命はイギリスで18世紀後半から進行していた経済的な変化であり、ウィーン会議の直接のきっかけではありません。"},
  {id:"wor29", cat:"世界史", sub:"ヨーロッパ史", q:"19世紀のイタリア統一運動を指導した人物は誰か。", choices:["ナポレオン","ビスマルク","ガリバルディ","ワシントン"], a:2, e:"正解は「ガリバルディ」です。ガリバルディは19世紀後半、義勇軍「千人隊」を率いてイタリア統一運動に貢献した軍事指導者です。「ナポレオン」は誤りで、彼は19世紀初頭にフランス皇帝として活躍した人物であり、イタリア統一運動（19世紀後半）とは時代が異なります。「ビスマルク」は誤りで、彼はプロイセンを中心にドイツ統一を主導した政治家であり、イタリアではなくドイツの統一に関わった人物です。「ワシントン」は誤りで、彼はアメリカ独立戦争を指導しアメリカ初代大統領となった人物であり、イタリアとは無関係です。"},
  {id:"wor31", cat:"世界史", sub:"アジア史", q:"インドの非暴力・不服従運動を指導した人物は誰か。", choices:["ネルー","ガンディー","チャーチル","毛沢東"], a:1, e:"正解は「ガンディー」です。ガンディーは非暴力・不服従の思想でイギリスからのインド独立運動を指導した人物です。「ネルー」は誤りで、彼はガンディーとともに独立運動に関わり初代インド首相となった人物ですが、非暴力・不服従運動を主導し象徴した中心人物はガンディーです。「チャーチル」は誤りで、彼はイギリスの首相であり、インドを統治する側の人物でした。「毛沢東」は誤りで、彼は中国共産党の指導者であり、インド独立運動とは無関係です。"},
  {id:"wor33", cat:"世界史", sub:"アジア史", q:"1911年に起こり、清朝を倒すきっかけとなった革命は何か。", choices:["文化大革命","辛亥革命","五・四運動","義和団事件"], a:1, e:"正解は「辛亥革命」です。辛亥革命は1911年に起こり、翌1912年に清朝が滅亡し中華民国が成立するきっかけとなりました。「文化大革命」は誤りで、これは1960年代に毛沢東が主導した政治運動であり、時代が大きく異なります。「五・四運動」は誤りで、これは1919年に起こった反帝国主義・反封建の学生運動であり、清朝はすでに滅亡した後の出来事です。「義和団事件」は誤りで、これは1899年に起こった外国勢力排斥の民衆運動であり、辛亥革命よりも前の出来事です。"},
  {id:"wor35", cat:"世界史", sub:"両大戦期", q:"ナチス・ドイツを率いた指導者は誰か。", choices:["スターリン","ムッソリーニ","ヒトラー","チャーチル"], a:2, e:"正解は「ヒトラー」です。ヒトラーはナチス・ドイツの指導者として独裁体制を築き、反ユダヤ主義とアーリア人至上主義を掲げました。「スターリン」は誤りで、彼はソビエト連邦の指導者であり、ドイツではなくロシア（ソ連）を率いた人物です。「ムッソリーニ」は誤りで、彼はイタリアのファシスト党の指導者であり、ドイツではなくイタリアを率いた人物です。「チャーチル」は誤りで、彼はイギリスの首相としてナチス・ドイツと戦った、連合国側の指導者です。"},
  {id:"wor37", cat:"世界史", sub:"両大戦期", q:"スターリンのソビエト連邦についての説明として正しいものはどれか。", choices:["民主的な体制","独裁的な支配体制","市場経済","自由な言論が保障されていた"], a:1, e:"正解は「独裁的な支配体制」です。スターリンはソビエト連邦を極端な独裁体制に変え、反対者の粛清を行うなど強権的な統治を行いました。「民主的な体制」は誤りで、スターリン体制はむしろ民主主義とは正反対の独裁体制でした。「市場経済」は誤りで、ソビエト連邦は国が生産や分配を計画的に決定する計画経済を採用していました。「自由な言論が保障されていた」は誤りで、スターリン体制下では言論統制や情報の検閲が厳しく行われていました。"},
  {id:"wor39", cat:"世界史", sub:"現代", q:"冷戦についての説明として正しいものはどれか。", choices:["アメリカとソビエト連邦の直接戦争","意思疎通の欠如による対立","核戦争の脅威のもとでの対立","両国の経済格差による競争"], a:2, e:"正解は「核戦争の脅威のもとでの対立」です。冷戦はアメリカとソビエト連邦が直接の戦火は交えないものの、核兵器による緊張関係のもとで対立を続けた状態を指します。「アメリカとソビエト連邦の直接戦争」は誤りで、冷戦の特徴はまさに直接的な戦争（熱戦）に至らなかった点にあります。「意思疎通の欠如による対立」は誤りで、冷戦の本質はイデオロギー（資本主義と社会主義）の対立であり、単なる意思疎通の欠如ではありません。「両国の経済格差による競争」は誤りで、冷戦は経済格差というより政治体制・軍事力をめぐる対立が中心でした。"},
  /* 地理 */
  {id:"geo21", cat:"地理", sub:"日本地理", q:"日本の地形についての説明として正しいものはどれか。", choices:["平坦な地形ばかりである","山地が約75%を占める","海岸線が短い","火山は存在しない"], a:1, e:"正解は「山地が約75%を占める」です。日本は山がちな地形で、国土の約75%を山地が占め、平地は限られています。「平坦な地形ばかりである」は誤りで、事実とは正反対で日本の地形は起伏に富んでいます。「海岸線が短い」は誤りで、日本は多くの島々からなり、複雑に入り組んだ海岸線を持つため、国土面積の割に海岸線は長いことで知られています。「火山は存在しない」は誤りで、日本列島は環太平洋造山帯に位置し、多くの活火山が存在します。"},
  {id:"geo23", cat:"地理", sub:"日本地理", q:"日本の気候の特徴として正しいものはどれか。", choices:["国土全体が一年中温暖である","太平洋側は夏に雨が多く、日本海側は冬に雪が多い","全国どこでも降水量はほぼ同じである","梅雨や台風の影響を受けない"], a:1, e:"正解は「太平洋側は夏に雨が多く、日本海側は冬に雪が多い」です。日本は季節風の影響を受け、太平洋側は夏に降水量が多く、日本海側は冬に積雪が多いという対照的な気候の特徴を持ちます。「国土全体が一年中温暖である」は誤りで、北海道など冬に厳しい寒さとなる地域もあり、一律に温暖とはいえません。「全国どこでも降水量はほぼ同じである」は誤りで、実際には地域や季節によって降水量には大きな差があります。「梅雨や台風の影響を受けない」は誤りで、日本の多くの地域は梅雨や台風の影響を強く受けます。"},
  {id:"geo25", cat:"地理", sub:"日本地理", q:"現代の日本の産業構造で最も高い割合を占めるのはどれか。", choices:["農業","工業(第二次産業)","サービス業(第三次産業)","漁業"], a:2, e:"正解は「サービス業(第三次産業)」です。現代の日本ではサービス業を中心とする第三次産業が就業者数・GDPともに最も高い割合を占めています。「農業」は誤りで、農業（第一次産業）の割合は現代日本では非常に小さくなっています。「工業(第二次産業)」は誤りで、工業もかつては中心的な産業でしたが、現在はサービス業の割合の方が高くなっています。「漁業」は誤りで、漁業も第一次産業に含まれ、産業構造全体に占める割合は小さいものです。"},
  {id:"geo27", cat:"地理", sub:"世界地理", q:"オーストラリア大陸についての説明として正しいものはどれか。", choices:["世界で最も面積が大きい大陸である","6大陸の中で最も面積が小さい大陸である","人口が世界で最も多い大陸である","火山活動が非常に活発な大陸である"], a:1, e:"正解は「6大陸の中で最も面積が小さい大陸である」です。オーストラリアは6大陸（ユーラシア・アフリカ・北米・南米・オセアニア＝オーストラリア・南極）の中で最も面積が小さい大陸です。「世界で最も面積が大きい大陸である」は誤りで、これは事実と正反対であり、最大の大陸はユーラシア大陸です。「人口が世界で最も多い大陸である」は誤りで、オーストラリア大陸は人口が少ない大陸として知られ、人口最多はアジア（ユーラシアの一部）です。「火山活動が非常に活発な大陸である」は誤りで、オーストラリア大陸は地質的に安定しており、活発な火山活動は見られません。"},
  {id:"geo29", cat:"地理", sub:"世界地理", q:"北米についての説明として正しいものはどれか。", choices:["ロッキー山脈がない","アマゾン川が流れている","ナイアガラの滝がある","氷河が存在しない"], a:2, e:"正解は「ナイアガラの滝がある」です。ナイアガラの滝はアメリカとカナダの国境に位置する、北米を代表する滝です。「ロッキー山脈がない」は誤りで、ロッキー山脈は北米大陸を南北に走る主要な山脈として実際に存在します。「アマゾン川が流れている」は誤りで、アマゾン川は南米大陸を流れる川であり、北米には流れていません。「氷河が存在しない」は誤りで、北米にはアラスカやカナダなどに現在も氷河が存在します。"},
  {id:"geo31", cat:"地理", sub:"世界地理", q:"アフリカについての説明として正しいものはどれか。", choices:["砂漠がない","ナイル川が流れている","森林だけで構成されている","人口が少ない"], a:1, e:"正解は「ナイル川が流れている」です。ナイル川はアフリカ大陸を流れる世界最長級の川で、エジプトなど流域の国々の文明を支えてきました。「砂漠がない」は誤りで、アフリカにはサハラ砂漠をはじめ広大な砂漠が存在します。「森林だけで構成されている」は誤りで、アフリカには砂漠、サバナ、熱帯雨林など多様な自然環境が広がっています。「人口が少ない」は誤りで、アフリカは人口増加率が高く、人口が急速に増加している大陸です。"},
  {id:"geo33", cat:"地理", sub:"世界地理", q:"オセアニア州についての説明として正しいものはどれか。", choices:["オーストラリア大陸と太平洋の島々からなる","ヨーロッパに含まれる州である","大部分が氷に覆われている","内陸国のみで構成されている"], a:0, e:"正解は「オーストラリア大陸と太平洋の島々からなる」です。オセアニア州はオーストラリア大陸とニュージーランド、太平洋に散らばる多数の島々から構成されています。「ヨーロッパに含まれる州である」は誤りで、オセアニアはヨーロッパとは全く別の独立した州（大陸区分）です。「大部分が氷に覆われている」は誤りで、氷に覆われているのは南極大陸であり、オセアニアの多くは温暖・熱帯の気候です。「内陸国のみで構成されている」は誤りで、オセアニアの国々の多くは海に面した島国であり、内陸国はほとんど存在しません。"},
  {id:"geo35", cat:"地理", sub:"世界地理", q:"インドで夏に南西から吹き、雨季をもたらす季節風を何というか。", choices:["偏西風","モンスーン(季節風)","貿易風","極東風"], a:1, e:"正解は「モンスーン(季節風)」です。インドでは夏に南西からモンスーン（季節風）が吹き、稲作などに欠かせない雨をもたらします。「偏西風」は誤りで、これは中緯度地域で西から東へ吹く風であり、インドの夏の雨季をもたらす風とは別のものです。「貿易風」は誤りで、これは低緯度地域で東から西へ吹く風であり、モンスーンとは吹く方向や仕組みが異なります。「極東風」は誤りで、そのような一般的な気象用語は存在せず、誤った選択肢です。"},
  {id:"geo37", cat:"地理", sub:"世界地理", q:"ヨーロッパ南部を東西に走る高くけわしい山脈は何か。", choices:["ヒマラヤ山脈","アルプス山脈","ロッキー山脈","アンデス山脈"], a:1, e:"正解は「アルプス山脈」です。アルプス山脈はヨーロッパ南部を東西に走る、けわしく標高の高い山脈です。「ヒマラヤ山脈」は誤りで、これはアジアに位置する世界最高峰を含む山脈であり、ヨーロッパにはありません。「ロッキー山脈」は誤りで、これは北米大陸を南北に走る山脈です。「アンデス山脈」は誤りで、これは南米大陸を南北に走る山脈であり、いずれもヨーロッパの山脈ではありません。"},
  {id:"geo39", cat:"地理", sub:"世界地理", q:"ブラジルで大規模に生産され、輸出量が世界有数の農作物は何か。", choices:["小麦","コーヒー豆","オリーブ","ぶどう"], a:1, e:"正解は「コーヒー豆」です。ブラジルはコーヒー豆の生産・輸出量が世界有数で、南米を代表する農業国です。「小麦」は誤りで、ブラジルは小麦の大生産国としては知られていません。「オリーブ」は誤りで、オリーブは地中海性気候に適した作物であり、ブラジルの熱帯・亜熱帯気候での主要輸出品ではありません。「ぶどう」は誤りで、これも地中海式農業でよく栽培される作物であり、ブラジルの代表的な輸出農作物ではありません。"},
  /* 公民 */
  {id:"civ21", cat:"公民", sub:"政治体制", q:"民主主義についての説明として正しいものはどれか。", choices:["一人の指導者による支配","国民主権に基づく政治体制","少数者による支配","軍事力による統治"], a:1, e:"正解は「国民主権に基づく政治体制」です。民主主義は国民が主権を持ち、国民の意思にもとづいて政治が行われる体制です。「一人の指導者による支配」は誤りで、これは独裁制の説明であり、民主主義とは正反対の考え方です。「少数者による支配」は誤りで、これは寡頭制の説明であり、民主主義（多数の国民による意思決定）とは異なります。「軍事力による統治」は誤りで、これは軍事政権の説明であり、国民の意思にもとづく民主主義とは相容れません。"},
  {id:"civ23", cat:"公民", sub:"政治体制", q:"衆議院と参議院の違いについての説明として正しいものはどれか。", choices:["全く同じ機能である","衆議院の任期は4年、参議院は6年である","参議院は衆議院より力が強い","衆議院のみが法律を制定できる"], a:1, e:"正解は「衆議院の任期は4年、参議院は6年である」です。衆議院議員の任期は4年（ただし解散があり得る）、参議院議員の任期は6年（3年ごとに半数改選）と定められています。「全く同じ機能である」は誤りで、両院には任期や解散の有無、権限の強さなど明確な違いがあります。「参議院は衆議院より力が強い」は誤りで、実際には法律案の議決や予算の議決などで衆議院の方がより強い権限（衆議院の優越）を持っています。「衆議院のみが法律を制定できる」は誤りで、法律の議決には原則として衆参両院の議決が必要であり、参議院にも法律案の審議・議決権があります。"},
  {id:"civ25", cat:"公民", sub:"政治体制", q:"日本国憲法の三大原則についての説明として正しいものはどれか。", choices:["主権在民、基本的人権の尊重、平和主義","天皇主権、民族主義、軍国主義","議会主権、民族優先、帝国主義","法治国家、官僚支配、中央集権"], a:0, e:"正解は「主権在民、基本的人権の尊重、平和主義」です。日本国憲法の三大原則はこの三つであり、戦前の体制からの大きな転換を示しています。「天皇主権、民族主義、軍国主義」は誤りで、これは戦前の大日本帝国憲法下の考え方に近く、日本国憲法の原則とは正反対です。「議会主権、民族優先、帝国主義」は誤りで、これも日本国憲法の三大原則とは異なる内容です。「法治国家、官僚支配、中央集権」は誤りで、これらは日本国憲法が特に強調する三大原則とは別の一般的な統治の特徴を指す言葉であり、正確な対応ではありません。"},
  {id:"civ27", cat:"公民", sub:"法律", q:"刑法についての説明として正しいものはどれか。", choices:["犯罪と刑罰について定める","民事上の権利義務を規定する","行政手続きを規定する","商取引のみを対象とする"], a:0, e:"正解は「犯罪と刑罰について定める」です。刑法は、どのような行為が犯罪となり、それに対してどのような刑罰が科されるかを定める法律です。「民事上の権利義務を規定する」は誤りで、これは民法の役割であり、刑法とは対象が異なります。「行政手続きを規定する」は誤りで、これは行政手続法など別の法律の役割です。「商取引のみを対象とする」は誤りで、これは商法に近い内容であり、刑法の対象は商取引に限定されません。"},
  {id:"civ29", cat:"公民", sub:"法律", q:"民法についての説明として正しいものはどれか。", choices:["刑事上の罪を定める","個人や法人間の権利義務を定める","国家権力の行使を制限する","商業活動のみを規定する"], a:1, e:"正解は「個人や法人間の権利義務を定める」です。民法は個人や法人（会社など）の間の契約や財産、家族関係などに関する権利義務を定める法律です。「刑事上の罪を定める」は誤りで、これは刑法の役割であり、民法とは対象が異なります。「国家権力の行使を制限する」は誤りで、これは憲法の役割に近い内容です。「商業活動のみを規定する」は誤りで、これは商法に近く、民法はより広く個人間の一般的な法律関係を対象とします。"},
  {id:"civ31", cat:"公民", sub:"経済", q:"市場経済についての説明として正しいものはどれか。", choices:["完全に平等な経済体制","需要と供給により価格が決まる","すべての商品が政府により配分される","国家が全ての経済活動を管理する"], a:1, e:"正解は「需要と供給により価格が決まる」です。市場経済は、商品やサービスの価格が需要と供給の関係によって自律的に決まる経済体制です。「完全に平等な経済体制」は誤りで、市場経済では競争により格差が生じることもあり、平等が保障される体制ではありません。「すべての商品が政府により配分される」は誤りで、これは計画経済の特徴であり、市場経済とは正反対です。「国家が全ての経済活動を管理する」は誤りで、これも計画経済に近い説明であり、市場での自由な経済活動を基本とする市場経済とは異なります。"},
  {id:"civ33", cat:"公民", sub:"経済", q:"インフレーションについての説明として正しいものはどれか。", choices:["物価が下がり続けること","物価が上がり続けること","失業が急激に増加すること","給与が急激に増加すること"], a:1, e:"正解は「物価が上がり続けること」です。インフレーション（インフレ）は物価が継続的に上昇し、通貨の価値が相対的に下がる現象です。「物価が下がり続けること」は誤りで、これはインフレとは逆の現象であるデフレーションの説明です。「失業が急激に増加すること」は誤りで、これは景気後退（不況）に関連する現象であり、インフレそのものの定義ではありません。「給与が急激に増加すること」は誤りで、給与の増加はインフレの結果として起こることもありますが、インフレの定義そのものではありません。"},
  {id:"civ35", cat:"公民", sub:"経済", q:"雇用と労働についての説明として正しいものはどれか。", choices:["労働者は無制限に働く義務がある","労働時間や休日は法律で保護されている","賃金は完全に自由に決定される","労働災害は労働者の責任である"], a:1, e:"正解は「労働時間や休日は法律で保護されている」です。労働基準法により、労働者の労働時間や休日などの労働条件には最低限の基準が法律で定められ、保護されています。「労働者は無制限に働く義務がある」は誤りで、これは労働基準法の趣旨とは正反対であり、労働時間には法律上の上限があります。「賃金は完全に自由に決定される」は誤りで、最低賃金制度などにより、賃金には法律上の下限が設けられています。「労働災害は労働者の責任である」は誤りで、労働災害については労災保険制度などにより使用者側の責任や補償の仕組みが定められています。"},
  {id:"civ37", cat:"公民", sub:"国際関係", q:"国際連合についての説明として正しいものはどれか。", choices:["国家を廃止する機関","国際紛争の平和的解決を目的とする","全ての国が加盟している","発展途上国のためだけの組織"], a:1, e:"正解は「国際紛争の平和的解決を目的とする」です。国際連合は国際紛争を平和的に解決し、国際協力を促進することを目的とした国際機関です。「国家を廃止する機関」は誤りで、国連は加盟国という国家の存在を前提とした組織であり、国家を廃止する機関ではありません。「全ての国が加盟している」は誤りで、国連に未加盟の国や地域も存在し、「全て」というのは不正確です。「発展途上国のためだけの組織」は誤りで、国連には先進国も多数加盟しており、発展途上国限定の組織ではありません。"},
  {id:"civ39", cat:"公民", sub:"国際関係", q:"NGO（非政府組織）についての説明として正しいものはどれか。", choices:["政府機関の一部である","民間人による非営利団体である","利益追求を目的とする企業である","国連の下部組織である"], a:1, e:"正解は「民間人による非営利団体である」です。NGO（非政府組織）は政府に属さない民間の非営利団体で、人権、環境、平和など様々な活動を行っています。「政府機関の一部である」は誤りで、NGOはむしろ政府から独立した民間の団体であることが定義の核心です。「利益追求を目的とする企業である」は誤りで、NGOは非営利であり、利益追求を目的とする企業とは性質が異なります。「国連の下部組織である」は誤りで、NGOは国連とは独立した民間団体であり、国連の一部として組織されたものではありません。"},
  /* 日本史 */
  {id:"his49", cat:"日本史", sub:"古代", q:"縄文時代の生活についての説明として正しいものはどれか。", choices:["すでに稲作が行われていた","狩猟・採集を中心に生活していた","文字が使われていた","仏教が伝来していた"], a:1, e:"正解は「狩猟・採集を中心に生活していた」です。縄文時代は狩猟・採集や漁労を中心とした生活が営まれ、稲作はまだ本格化していませんでした。「すでに稲作が行われていた」は誤りで、稲作が本格的に広まったのは次の弥生時代です。「文字が使われていた」は誤りで、縄文時代にはまだ文字は存在せず、日本での文字の使用はもっと後の時代です。「仏教が伝来していた」は誤りで、仏教の公伝は6世紀とされ、縄文時代（紀元前）とは時代が大きく異なります。"},
  {id:"his51", cat:"日本史", sub:"古代", q:"弥生時代に大陸から伝わり、日本社会を大きく変えた技術は何か。", choices:["稲作","印刷技術","鉄砲","蒸気機関"], a:0, e:"正解は「稲作」です。弥生時代には稲作が大陸から伝わり、定住的な農耕社会への転換が進みました。「印刷技術」は誤りで、印刷技術が日本で発達するのはずっと後の時代です。「鉄砲」は誤りで、鉄砲が伝来したのは16世紀の戦国時代であり、弥生時代とは時代が大きく異なります。「蒸気機関」は誤りで、これは18世紀以降の産業革命期の技術であり、弥生時代とは無関係です。"},
  {id:"his53", cat:"日本史", sub:"古代", q:"遣唐使の主な目的として正しいものはどれか。", choices:["中国の制度や文化を学ぶこと","朝鮮を征服すること","キリスト教を広めること","貿易を完全に断つこと"], a:0, e:"正解は「中国の制度や文化を学ぶこと」です。遣唐使は唐（中国）の進んだ制度・文化・仏教などを学ぶために派遣されました。「朝鮮を征服すること」は誤りで、遣唐使は中国（唐）への使節であり、朝鮮征服を目的としたものではありません。「キリスト教を広めること」は誤りで、当時の日本ではキリスト教はまだ伝来しておらず、遣唐使とは無関係です。「貿易を完全に断つこと」は誤りで、遣唐使はむしろ中国との交流・交易を積極的に進める目的で派遣されました。"},
  {id:"his55", cat:"日本史", sub:"古代", q:"聖武天皇の命により、奈良に大仏が建立された寺はどこか。", choices:["法隆寺","東大寺","金閣寺","銀閣寺"], a:1, e:"正解は「東大寺」です。聖武天皇は国家の安定を願い、東大寺に大仏を建立させました。「法隆寺」は誤りで、これは聖徳太子が建立に関わったとされる寺であり、大仏で知られる寺ではありません。「金閣寺」は誤りで、これは室町時代に足利義満が建立した寺です。「銀閣寺」は誤りで、これも室町時代に足利義政が建立した寺であり、いずれも奈良時代の大仏建立とは無関係です。"},
  {id:"his57", cat:"日本史", sub:"鎌倉・室町", q:"後鳥羽上皇が幕府打倒を目指して起こした戦いは何か。", choices:["承久の乱","応仁の乱","保元の乱","壬申の乱"], a:0, e:"正解は「承久の乱」です。承久の乱（1221年）は後鳥羽上皇が鎌倉幕府打倒を目指して起こしましたが、幕府軍に敗れました。「応仁の乱」は誤りで、これは室町時代（1467年）に起こった、将軍後継ぎ問題などをめぐる争いであり、後鳥羽上皇とは無関係です。「保元の乱」は誤りで、これは平安時代末期（1156年）に起こった皇位や摂関家をめぐる争いです。「壬申の乱」は誤りで、これは飛鳥時代（672年）に起こった皇位継承をめぐる争いであり、いずれも承久の乱とは時代・当事者が異なります。"},
  {id:"his59", cat:"日本史", sub:"鎌倉・室町", q:"元寇（蒙古襲来）が起こった時代はいつか。", choices:["奈良時代","平安時代","鎌倉時代","室町時代"], a:2, e:"正解は「鎌倉時代」です。元寇は鎌倉時代の1274年（文永の役）と1281年（弘安の役）の2回起こりました。「奈良時代」「平安時代」は誤りで、いずれも鎌倉時代より前の時代であり、元（モンゴル帝国）が成立する以前です。「室町時代」は誤りで、これは鎌倉時代より後の時代であり、元寇はすでに終わっています。"},
  {id:"his61", cat:"日本史", sub:"鎌倉・室町", q:"応仁の乱についての説明として正しいものはどれか。", choices:["江戸時代に起こった","室町幕府の権威を大きく低下させた","豊臣秀吉が鎮圧した","キリスト教徒が起こした"], a:1, e:"正解は「室町幕府の権威を大きく低下させた」です。応仁の乱（1467-1477年）は室町幕府の権威を大きく低下させ、戦国時代のきっかけとなりました。「江戸時代に起こった」は誤りで、応仁の乱は室町時代の出来事であり、江戸時代（応仁の乱の約130年後に始まる）とは時代が異なります。「豊臣秀吉が鎮圧した」は誤りで、豊臣秀吉は応仁の乱よりも後の時代（安土桃山時代）に活躍した人物であり、乱の鎮圧には関わっていません。「キリスト教徒が起こした」は誤りで、応仁の乱は将軍家や有力守護大名の家督争いが原因であり、宗教とは無関係です。"},
  {id:"his63", cat:"日本史", sub:"戦国・江戸", q:"鉄砲が日本に伝来するきっかけとなった出来事は何か。", choices:["ポルトガル船の種子島漂着","スペインの琉球侵攻","オランダとの正式な貿易開始","黒船来航"], a:0, e:"正解は「ポルトガル船の種子島漂着」です。1543年、種子島に漂着したポルトガル船によって鉄砲が日本に伝えられました。「スペインの琉球侵攻」は誤りで、そのような史実はなく、鉄砲伝来とは無関係です。「オランダとの正式な貿易開始」は誤りで、オランダとの貿易は鉄砲伝来よりも後、江戸時代の鎖国政策のもとで始まったものです。「黒船来航」は誤りで、これは19世紀（1853年）の出来事であり、鉄砲伝来（16世紀）よりずっと後です。"},
  {id:"his65", cat:"日本史", sub:"戦国・江戸", q:"徳川家康が江戸幕府を開く前に勝利した天下分け目の戦いは何か。", choices:["桶狭間の戦い","関ヶ原の戦い","長篠の戦い","大坂の陣"], a:1, e:"正解は「関ヶ原の戦い」です。徳川家康は1600年の関ヶ原の戦いに勝利し、天下の実権を握りました。「桶狭間の戦い」は誤りで、これは1560年に織田信長が今川義元を破った戦いであり、家康が主役の戦いではありません。「長篠の戦い」は誤りで、これは1575年に織田・徳川連合軍が武田軍を破った戦いであり、天下分け目の戦いとは位置づけが異なります。「大坂の陣」は誤りで、これは1614〜1615年、家康がすでに幕府を開いた後に豊臣氏を滅ぼした戦いであり、幕府成立前の出来事ではありません。"},
  {id:"his67", cat:"日本史", sub:"江戸時代", q:"鎖国政策のもとで、江戸幕府がオランダ以外に貿易を認めていたヨーロッパ以外の国はどこか。", choices:["イギリス","中国（清）","スペイン","ポルトガル"], a:1, e:"正解は「中国（清）」です。鎖国下でも中国（清）とオランダとは長崎で貿易が続けられました。「イギリス」は誤りで、イギリスは江戸時代初期に一時貿易を行いましたが撤退しており、鎖国下で継続的に貿易を認められた国ではありません。「スペイン」は誤りで、スペインはキリスト教布教への警戒から早い段階で来航が禁止されました。「ポルトガル」は誤りで、ポルトガルも同様の理由で1639年に来航が禁止されています。"},
  {id:"his69", cat:"日本史", sub:"江戸時代", q:"大塩平八郎の乱についての説明として正しいものはどれか。", choices:["元役人が飢饉対策の不備に抗議して起こした","明治政府に対する反乱である","鎌倉幕府への反乱である","江戸幕府を倒すことに成功した"], a:0, e:"正解は「元役人が飢饉対策の不備に抗議して起こした」です。大塩平八郎の乱（1837年）は、元大坂町奉行所役人が天保の飢饉での幕府の対応を批判して起こしました。「明治政府に対する反乱である」は誤りで、この乱は江戸時代に起こったものであり、明治政府（明治時代以降）とは時代が異なります。「鎌倉幕府への反乱である」は誤りで、これも時代が全く異なり、江戸時代と鎌倉時代を混同した誤りです。「江戸幕府を倒すことに成功した」は誤りで、実際にはこの乱は短期間で鎮圧され、幕府を倒すには至りませんでした。"},
  {id:"his71", cat:"日本史", sub:"近代", q:"版籍奉還についての説明として正しいものはどれか。", choices:["大名が土地と人民を天皇に返還した","武士の身分を廃止した","地租改正の別名である","廃藩置県より後に行われた"], a:0, e:"正解は「大名が土地と人民を天皇に返還した」です。版籍奉還（1869年）は大名が領地（版）と領民（籍）を天皇に返還した改革です。「武士の身分を廃止した」は誤りで、これは版籍奉還ではなく、後の四民平等や秩禄処分など別の改革に関わる内容です。「地租改正の別名である」は誤りで、地租改正は1873年から行われた税制改革であり、版籍奉還とは全く別の政策です。「廃藩置県より後に行われた」は誤りで、実際には版籍奉還（1869年）の方が廃藩置県（1871年）より先に行われています。"},
  {id:"his73", cat:"日本史", sub:"近代", q:"明治政府が掲げた「富国強兵」政策の目的として正しいものはどれか。", choices:["経済力と軍事力を強化し対抗する","仏教を国教として定めること","鎖国を継続して守り抜くこと","農業だけを発展させ続けること"], a:0, e:"正解は「経済力と軍事力を強化し対抗する」です。富国強兵は経済力と軍事力を強化し、欧米列強に対抗できる国家をつくる政策でした。「仏教を国教として定めること」は誤りで、明治政府はむしろ神道を重視する政策（神仏分離など）をとり、仏教を国教としたわけではありません。「鎖国を継続して守り抜くこと」は誤りで、富国強兵はむしろ開国後の国際情勢に対応するための政策であり、鎖国継続とは正反対です。「農業だけを発展させ続けること」は誤りで、富国強兵は農業だけでなく殖産興業による工業化も重視しました。"},
  {id:"his75", cat:"日本史", sub:"近代", q:"治安維持法についての説明として正しいものはどれか。", choices:["社会主義運動などを取り締まる目的で制定された","労働者の権利を保護する法律である","女性の参政権を認めた法律である","農地改革のための法律である"], a:0, e:"正解は「社会主義運動などを取り締まる目的で制定された」です。治安維持法（1925年）は社会主義・共産主義運動などを取り締まるために制定されました。「労働者の権利を保護する法律である」は誤りで、治安維持法はむしろ労働運動や社会運動を取り締まる側の法律であり、労働者の権利保護とは逆の性質です。「女性の参政権を認めた法律である」は誤りで、女性参政権が認められたのは戦後の1945年であり、治安維持法とは全く別の法律です。「農地改革のための法律である」は誤りで、農地改革は戦後にGHQの指導で行われた別の政策です。"},
  {id:"his77", cat:"日本史", sub:"現代", q:"戦後日本で行われた農地改革の目的として正しいものはどれか。", choices:["地主制度を解体し自作農を増やすこと","大企業を解体すること","財閥を保護すること","米の輸出を促進すること"], a:0, e:"正解は「地主制度を解体し自作農を増やすこと」です。農地改革はGHQの指導のもと、地主の土地を小作農に分配し、自作農を増やすことを目的としました。「大企業を解体すること」は誤りで、これは財閥解体の目的であり、農地改革とは対象が異なります。「財閥を保護すること」は誤りで、戦後改革ではむしろ財閥は解体の対象とされ、保護されたわけではありません。「米の輸出を促進すること」は誤りで、農地改革の目的は国内の農地所有のあり方を変えることであり、米の輸出促進を直接の目的としたものではありません。"},
  /* 世界史 */
  {id:"wor43", cat:"世界史", sub:"古代・中世", q:"チグリス川・ユーフラテス川流域で栄えた古代文明はどれか。", choices:["エジプト文明","メソポタミア文明","インダス文明","黄河文明"], a:1, e:"正解は「メソポタミア文明」です。チグリス川とユーフラテス川の流域で発展したことからこの名がつき、くさび形文字などが生まれました。「エジプト文明」は誤りで、これはナイル川流域で栄えた別の文明です。「インダス文明」は誤りで、これはインダス川流域（現パキスタン付近）の文明です。「黄河文明」は誤りで、これは中国の黄河流域で栄えた文明であり、いずれもチグリス・ユーフラテスとは異なる川の流域です。"},
  {id:"wor45", cat:"世界史", sub:"古代・中世", q:"古代ギリシャで発達した都市国家を何と呼ぶか。", choices:["ポリス","コミューン","バロニー","ハンザ"], a:0, e:"正解は「ポリス」です。古代ギリシャではアテネやスパルタなどのポリス（都市国家）が各地に形成されました。「コミューン」は誤りで、これは中世ヨーロッパの自治都市などを指す言葉で、古代ギリシャの都市国家とは時代・地域が異なります。「バロニー」は誤りで、これは中世の男爵領を指す言葉です。「ハンザ」は誤りで、これは中世北ヨーロッパの都市同盟（ハンザ同盟）を指し、いずれも古代ギリシャの都市国家とは無関係です。"},
  {id:"wor47", cat:"世界史", sub:"古代・中世", q:"中世ヨーロッパで行われた十字軍の主な目的として正しいものはどれか。", choices:["聖地エルサレムの奪還","新大陸の発見","貿易路の開拓のみ","科学技術の交換"], a:0, e:"正解は「聖地エルサレムの奪還」です。十字軍はイスラム勢力から聖地エルサレムを奪還することを主な目的として派遣されました。「新大陸の発見」は誤りで、これは十字軍より後の大航海時代の出来事です。「貿易路の開拓のみ」は誤りで、結果的に東方貿易が活発化しましたが、これは目的ではなく副次的な影響です。「科学技術の交換」は誤りで、これも十字軍の主な目的ではなく、遠征の結果として生じた文化的影響の一つに過ぎません。"},
  {id:"wor49", cat:"世界史", sub:"ヨーロッパ史", q:"コロンブスが1492年に到達した場所はどこか。", choices:["アフリカ大陸","西インド諸島","オーストラリア大陸","南極大陸"], a:1, e:"正解は「西インド諸島」です。コロンブスは1492年、大西洋を横断し西インド諸島に到達しました。「アフリカ大陸」は誤りで、コロンブスの航路はアフリカではなく大西洋を西へ横断するものでした。「オーストラリア大陸」は誤りで、これはコロンブスよりずっと後にヨーロッパ人に「発見」された大陸です。「南極大陸」は誤りで、これも18世紀以降に確認された大陸であり、コロンブスの航海とは無関係です。"},
  {id:"wor51", cat:"世界史", sub:"ヨーロッパ史", q:"マルティン・ルターが宗教改革のきっかけをつくった行動は何か。", choices:["九十五か条の論題を発表した","十字軍を組織した","新大陸を発見した","ローマを征服した"], a:0, e:"正解は「九十五か条の論題を発表した」です。ルターは1517年、免罪符販売を批判する九十五か条の論題を発表し、宗教改革のきっかけを作りました。「十字軍を組織した」は誤りで、これはルターより数百年前の中世に行われた遠征であり、時代が異なります。「新大陸を発見した」は誤りで、これはコロンブスの業績であり、ルターとは無関係です。「ローマを征服した」は誤りで、ルターがローマを軍事的に征服した事実はありません。"},
  {id:"wor53", cat:"世界史", sub:"ヨーロッパ史", q:"名誉革命についての説明として正しいものはどれか。", choices:["イギリスで無血のまま起きた革命","フランスで起きた革命である","激しい内戦を伴った革命である","ロシアで起きた革命である"], a:0, e:"正解は「イギリスで無血のまま起きた革命」です。名誉革命（1688年）はイギリスで大きな戦闘を伴わずに国王が交代した革命です。「フランスで起きた革命である」は誤りで、名誉革命はイギリスの出来事であり、フランス革命（1789年）とは国も時代も異なります。「激しい内戦を伴った革命である」は誤りで、名誉革命はむしろ「無血」であったことが最大の特徴です。「ロシアで起きた革命である」は誤りで、これはロシア革命（1917年）と混同した誤りです。"},
  {id:"wor55", cat:"世界史", sub:"ヨーロッパ史", q:"権利章典（1689年）が制定された国はどこか。", choices:["フランス","イギリス","アメリカ","ドイツ"], a:1, e:"正解は「イギリス」です。権利章典はイギリスで名誉革命後に制定され、議会の権限を明確にしました。「フランス」は誤りで、フランスでは同時期に絶対王政が続いており、権利章典のような文書は制定されていません。「アメリカ」は誤りで、アメリカにはまだ独立国家が存在せず、権利章典（1689年）の時点ではイギリスの植民地でした。「ドイツ」は誤りで、当時のドイツはまだ統一国家ではなく、権利章典とは無関係です。"},
  {id:"wor57", cat:"世界史", sub:"アジア史", q:"アヘン戦争が戦われた国同士の組み合わせとして正しいものはどれか。", choices:["イギリスと清","日本と清","フランスとインド","ロシアとオスマン帝国"], a:0, e:"正解は「イギリスと清」です。アヘン戦争（1840-1842年）はイギリスと清（中国）の間で起こりました。「日本と清」は誤りで、日本と清が戦ったのは日清戦争（1894-1895年）であり、アヘン戦争とは別の戦争です。「フランスとインド」は誤りで、そのような組み合わせの戦争史実は該当しません。「ロシアとオスマン帝国」は誤りで、これは別の対立関係（露土戦争など）であり、アヘン戦争とは無関係です。"},
  {id:"wor59", cat:"世界史", sub:"ヨーロッパ史", q:"アメリカの南北戦争についての説明として正しいものはどれか。", choices:["奴隷制などをめぐる国内の内戦である","南米諸国間の戦争である","朝鮮半島で起こった戦争である","第一次世界大戦の一部である"], a:0, e:"正解は「奴隷制などをめぐる国内の内戦である」です。南北戦争（1861-1865年）は奴隷制の存廃などをめぐりアメリカの北部と南部が戦った内戦です。「南米諸国間の戦争である」は誤りで、これはアメリカ合衆国内部の内戦であり、南米諸国間の戦争ではありません。「朝鮮半島で起こった戦争である」は誤りで、これは朝鮮戦争（1950年）と混同した誤りです。「第一次世界大戦の一部である」は誤りで、南北戦争は第一次世界大戦（1914年〜）よりずっと前の出来事です。"},
  {id:"wor61", cat:"世界史", sub:"ヨーロッパ史", q:"19世紀にドイツ統一を主導した政治家は誰か。", choices:["ガリバルディ","ビスマルク","ナポレオン","ワシントン"], a:1, e:"正解は「ビスマルク」です。ビスマルクは「鉄血政策」を掲げ、プロイセンを中心にドイツ統一を実現しました。「ガリバルディ」は誤りで、彼はイタリア統一運動を主導した人物であり、ドイツではありません。「ナポレオン」は誤りで、彼はフランスの皇帝であり、ドイツ統一とは時代も国も異なります。「ワシントン」は誤りで、彼はアメリカ独立運動の指導者であり、ドイツ統一とは無関係です。"},
  {id:"wor63", cat:"世界史", sub:"両大戦期", q:"ヴェルサイユ条約が結ばれるきっかけとなった戦争はどれか。", choices:["第一次世界大戦","第二次世界大戦","南北戦争","日露戦争"], a:0, e:"正解は「第一次世界大戦」です。ヴェルサイユ条約は第一次世界大戦の講和条約として1919年に結ばれました。「第二次世界大戦」は誤りで、この講和はポツダム宣言など別の枠組みで扱われます。「南北戦争」は誤りで、これはアメリカ国内の内戦であり、講和条約はヴェルサイユ条約とは無関係です。「日露戦争」は誤りで、この講和条約はポーツマス条約であり、ヴェルサイユ条約ではありません。"},
  {id:"wor65", cat:"世界史", sub:"両大戦期", q:"世界恐慌（1929年）が始まったきっかけは何か。", choices:["ニューヨーク株式市場の大暴落","石油危機","戦争の勃発","干ばつによる飢饉"], a:0, e:"正解は「ニューヨーク株式市場の大暴落」です。世界恐慌はニューヨークの株式市場の大暴落をきっかけに世界中に広がりました。「石油危機」は誤りで、これは1973年に起こった別の経済的混乱であり、世界恐慌（1929年）とは時代が異なります。「戦争の勃発」は誤りで、世界恐慌のきっかけは戦争ではなく金融市場の暴落です。「干ばつによる飢饉」は誤りで、これは世界恐慌の直接のきっかけではありません。"},
  {id:"wor67", cat:"世界史", sub:"現代", q:"キューバ危機についての説明として正しいものはどれか。", choices:["米ソが核戦争寸前まで対立した","キューバの独立戦争である","米キューバの貿易摩擦である","第二次世界大戦中の出来事"], a:0, e:"正解は「米ソが核戦争寸前まで対立した」です。キューバ危機（1962年）はソ連のミサイル配備をめぐり、米ソが核戦争寸前まで対立した事件です。「キューバの独立戦争である」は誤りで、キューバはこの時点ですでに独立国であり、独立戦争ではありません。「米キューバの貿易摩擦である」は誤りで、対立の本質は貿易ではなく核ミサイル配備をめぐる軍事的緊張です。「第二次世界大戦中の出来事」は誤りで、キューバ危機は大戦終結（1945年）よりずっと後の冷戦期の出来事です。"},
  {id:"wor69", cat:"世界史", sub:"現代", q:"ヨーロッパ連合(EU)が目指す主な目的として正しいものはどれか。", choices:["加盟国間の経済統合を進めること","ヨーロッパの植民地を増やすこと","東西冷戦をさらに継続すること","軍事同盟のみを結成すること"], a:0, e:"正解は「加盟国間の経済統合を進めること」です。EUは加盟国間の経済統合や政治的協力を進め、平和と繁栄を目指す組織です。「ヨーロッパの植民地を増やすこと」は誤りで、EUは植民地拡大とは無関係な現代の地域統合組織です。「東西冷戦をさらに継続すること」は誤りで、EUの発展はむしろ冷戦終結後にさらに進みました。「軍事同盟のみを結成すること」は誤りで、EUは主に経済的・政治的な統合を目的とした組織であり、軍事同盟（NATOなど）とは性格が異なります。"},
  {id:"wor71", cat:"世界史", sub:"アジア史", q:"1911年に起こり清朝が倒れるきっかけとなった革命は何か。", choices:["文化大革命","辛亥革命","五・四運動","義和団事件"], a:1, e:"正解は「辛亥革命」です。辛亥革命（1911年）により清朝は倒れ、翌1912年に中華民国が成立しました。「文化大革命」は誤りで、これは1960年代に毛沢東が主導した政治運動であり、清朝打倒とは無関係です。「五・四運動」は誤りで、これは1919年の反帝国主義・反封建の学生運動であり、清朝はすでに倒れた後の出来事です。「義和団事件」は誤りで、これは1899年の外国勢力排斥運動であり、辛亥革命より前の出来事です。"},
  /* 地理 */
  {id:"geo41", cat:"地理", sub:"日本地理", q:"日本列島が位置する造山帯はどれか。", choices:["アルプス・ヒマラヤ造山帯","環太平洋造山帯","カレドニア造山帯","古期造山帯"], a:1, e:"正解は「環太平洋造山帯」です。日本列島は環太平洋造山帯に位置し、地震や火山活動が活発です。「アルプス・ヒマラヤ造山帯」は誤りで、これはヨーロッパから中央アジア・ヒマラヤにかけて連なる別の造山帯であり、日本は含まれません。「カレドニア造山帯」は誤りで、これは北欧などに見られる古い造山帯です。「古期造山帯」は誤りで、これは形成年代が古く比較的なだらかな山地を指す用語であり、活発な火山活動で知られる日本列島とは特徴が異なります。"},
  {id:"geo43", cat:"地理", sub:"日本地理", q:"日本の三大都市圏に含まれないのはどれか。", choices:["東京圏","大阪圏","名古屋圏","札幌圏"], a:3, e:"正解は「札幌圏」です。日本の三大都市圏は東京圏・大阪圏・名古屋圏で、札幌圏は含まれません。「東京圏」「大阪圏」「名古屋圏」はいずれも誤り（正しい選択、つまり実際に三大都市圏に含まれる）で、これら三つがまさに日本の三大都市圏を構成しています。"},
  {id:"geo45", cat:"地理", sub:"日本地理", q:"促成栽培についての説明として正しいものはどれか。", choices:["温暖な気候で出荷時期を早める方法","出荷時期をわざと遅らせる方法","品種改良を一切行わない方法","輸入野菜のみを取り扱う方法"], a:0, e:"正解は「温暖な気候を利用して野菜の出荷時期を早める栽培方法」です。促成栽培は温暖な気候やビニールハウスを利用して、野菜の生育・出荷を早める栽培方法です。「出荷時期を遅らせる栽培方法」は誤りで、これは促成栽培とは逆の「抑制栽培」の説明です。「品種改良をしない栽培方法」は誤りで、促成栽培は品種改良の有無を定義とする用語ではありません。「輸入野菜のみを扱う方法」は誤りで、促成栽培は国内での栽培方法を指し、輸入とは無関係です。"},
  {id:"geo47", cat:"地理", sub:"日本地理", q:"日本の食料自給率についての説明として正しいものはどれか。", choices:["先進国の中でも低い水準にある","世界一高い水準にある","100%を超えている","農業を行っていないため0%である"], a:0, e:"正解は「先進国の中でも低い水準にある」です。日本の食料自給率（カロリーベース）は先進国の中でも低い水準にあります。「世界一高い水準にある」は誤りで、事実とは正反対であり、日本は主要先進国の中でも自給率が低い部類に入ります。「100%を超えている」は誤りで、日本は多くの食料を輸入に頼っており、自給率は100%を大きく下回ります。「農業を行っていないため0%である」は誤りで、日本国内でも米などの農業生産は行われており、自給率が完全にゼロということはありません。"},
  {id:"geo49", cat:"地理", sub:"日本地理", q:"リアス海岸の特徴として正しいものはどれか。", choices:["山地が沈み出入りが多い海岸","まっすぐな砂浜が続く海岸","サンゴ礁でできている海岸","氷河が削ってできた海岸"], a:0, e:"正解は「山地が海に沈んでできた出入りの多い海岸である」です。リアス海岸は山地が海に沈み込むことでできた、複雑に入り組んだ海岸地形です。「真っ直ぐな砂浜海岸である」は誤りで、これはリアス海岸とは対照的な、単調な海岸線の特徴です。「サンゴ礁でできた海岸である」は誤りで、これはサンゴの死骸の堆積による、リアス海岸とは異なる成因の地形です。「氷河が作った海岸である」は誤りで、これはフィヨルドの成因であり、リアス海岸は氷河ではなく河川の侵食・沈降によってできます。"},
  {id:"geo51", cat:"地理", sub:"世界地理", q:"かつて中国で行われていた「一人っ子政策」の目的として正しいものはどれか。", choices:["人口の急増を抑えること","出生率を上げること","男女比を均等にすること","農業人口を増やすこと"], a:0, e:"正解は「人口の急増を抑えること」です。一人っ子政策は急激な人口増加を抑制するために導入されましたが、現在は廃止されています。「出生率を上げること」は誤りで、これは政策の目的とは正反対であり、実際には出生を制限する政策でした。「男女比を均等にすること」は誤りで、むしろこの政策の副作用として男女比の偏りが問題視されるようになりました。「農業人口を増やすこと」は誤りで、この政策は人口全体の抑制を目的としており、農業人口の増加とは無関係です。"},
  {id:"geo53", cat:"地理", sub:"世界地理", q:"ASEAN（東南アジア諸国連合）の目的として正しいものはどれか。", choices:["地域内の経済協力や政治的安定を図ること","ヨーロッパとの統合を目指すこと","軍事侵攻を行うこと","植民地を維持すること"], a:0, e:"正解は「地域内の経済協力や政治的安定を図ること」です。ASEANは東南アジア諸国間の経済協力や政治的安定を目的とした地域組織です。「ヨーロッパとの統合を目指すこと」は誤りで、ASEANは東南アジア諸国自身の地域協力機構であり、ヨーロッパとの統合を目指すものではありません。「軍事侵攻を行うこと」は誤りで、ASEANは平和的な地域協力を目的とした組織であり、軍事侵攻を目的とはしていません。「植民地を維持すること」は誤りで、ASEAN加盟国の多くはむしろ植民地支配から独立した国々であり、植民地維持とは正反対の立場です。"},
  {id:"geo55", cat:"地理", sub:"世界地理", q:"石油輸出国機構（OPEC）についての説明として正しいものはどれか。", choices:["主要な産油国が加盟する組織である","先進国のみが加盟する組織である","農業国の組織である","国連の下部組織である"], a:0, e:"正解は「主要な産油国が加盟する組織である」です。OPECは主要な産油国が加盟し、原油生産量や価格の調整を行う組織です。「先進国のみが加盟する組織である」は誤りで、OPEC加盟国の多くは中東やアフリカ、南米の発展途上の産油国であり、先進国限定の組織ではありません。「農業国の組織である」は誤りで、OPECは石油という資源に着目した組織であり、農業とは関係ありません。「国連の下部組織である」は誤りで、OPECは国連とは独立した、産油国が自主的に結成した組織です。"},
  {id:"geo57", cat:"地理", sub:"世界地理", q:"EU（ヨーロッパ連合）で導入されている共通通貨は何か。", choices:["ドル","ユーロ","ポンド","フラン"], a:1, e:"正解は「ユーロ」です。EUの多くの加盟国では共通通貨ユーロが導入されています。「ドル」は誤りで、これはアメリカなどで使われる通貨であり、EUの共通通貨ではありません。「ポンド」は誤りで、これはイギリスの通貨であり、イギリスはユーロを導入せずEUも離脱しています。「フラン」は誤りで、これはユーロ導入前のフランスやスイスなどで使われていた通貨であり、現在のEU共通通貨ではありません。"},
  {id:"geo59", cat:"地理", sub:"世界地理", q:"熱帯雨林気候の特徴として正しいものはどれか。", choices:["一年中高温で降水量が多い","一年中乾燥している","四季の変化がはっきりしている","冬に雪が多く降る"], a:0, e:"正解は「一年中高温で降水量が多い」です。熱帯雨林気候は赤道付近に分布し、一年を通して高温多雨な気候です。「一年中乾燥している」は誤りで、これは熱帯雨林気候とは正反対の砂漠気候などの特徴です。「四季の変化がはっきりしている」は誤りで、これは温帯（温暖湿潤気候など）の特徴であり、熱帯雨林気候には明瞭な四季はありません。「冬に雪が多く降る」は誤りで、熱帯雨林気候は常に高温であり、雪が降ることはありません。"},
  {id:"geo61", cat:"地理", sub:"世界地理", q:"地中海式農業の特徴として正しいものはどれか。", choices:["乾燥に強いオリーブなどを栽培する","稲作のみを中心に行っている","一年中同じ作物だけを育てる","温室でしか栽培ができない"], a:0, e:"正解は「夏の乾燥に強いオリーブやぶどうを栽培する」です。地中海式農業は夏の乾燥に耐えるオリーブやぶどう、冬の雨を利用した小麦栽培が特徴です。「稲作が中心である」は誤りで、稲作には多量の水が必要であり、夏に乾燥する地中海性気候にはあまり適していません。「一年中同じ作物のみを栽培する」は誤りで、地中海式農業は夏と冬で異なる作物を組み合わせて栽培する点が特徴です。「温室でしか栽培できない」は誤りで、地中海式農業は主に露地で行われる伝統的な農業です。"},
  {id:"geo63", cat:"地理", sub:"日本地理", q:"日本の三大工業地帯に含まれないのはどれか。", choices:["京浜工業地帯","中京工業地帯","阪神工業地帯","九州工業地帯"], a:3, e:"正解は「九州工業地帯」です。日本の三大工業地帯は京浜・中京・阪神で、九州工業地帯は含まれません。「京浜工業地帯」「中京工業地帯」「阪神工業地帯」はいずれも誤り（正しい選択、つまり実際に三大工業地帯に含まれる）で、これら三つがまさに日本の三大工業地帯を構成しています。"},
  {id:"geo65", cat:"地理", sub:"日本地理", q:"過疎化についての説明として正しいものはどれか。", choices:["人口が都市に流出し地方の人口が減少すること","都市に人口が集中しすぎること","出生率が上がりすぎること","農業人口が急増すること"], a:0, e:"正解は「人口が都市に流出し地方の人口が減少すること」です。過疎化は人口が都市部へ流出し、地方の人口が著しく減少する現象です。「都市に人口が集中しすぎること」は誤りで、これは過疎化ではなく過密の説明です。「出生率が上がりすぎること」は誤りで、過疎化は出生率の高低というより人口の地域的な偏りに関する現象です。「農業人口が急増すること」は誤りで、実際には過疎地域では農業人口も含めた人口全体が減少する傾向にあります。"},
  {id:"geo67", cat:"地理", sub:"世界地理", q:"再生可能エネルギーに含まれないものはどれか。", choices:["太陽光発電","風力発電","石炭火力発電","地熱発電"], a:2, e:"正解は「石炭火力発電」です。石炭火力発電は化石燃料を使用するため、再生可能エネルギーには含まれません。「太陽光発電」「風力発電」「地熱発電」はいずれも誤り（正しい選択、つまり実際に再生可能エネルギーに含まれる）で、これらは資源が枯渇せず繰り返し利用できるエネルギー源です。"},
  {id:"geo69", cat:"地理", sub:"世界地理", q:"排他的経済水域（EEZ）についての説明として正しいものはどれか。", choices:["沿岸国が資源を優先的に利用できる海域である","公海と同じ扱いを受ける海域である","陸地の一部として扱われる","領海と全く同じ範囲である"], a:0, e:"正解は「沿岸国が資源を優先的に利用できる海域である」です。排他的経済水域は沿岸国が漁業資源や海底資源を優先的に利用できる海域で、領海より広い範囲です。「公海と同じ扱いを受ける海域である」は誤りで、公海は特定国に属さず自由に利用できる海域であり、排他的経済水域とは法的な扱いが異なります。「陸地の一部として扱われる」は誤りで、排他的経済水域はあくまで海域であり、陸地（領土）とは区別されます。「領海と全く同じ範囲である」は誤りで、排他的経済水域は領海よりもはるかに広い範囲（通常200海里）に設定されます。"},
  /* 公民 */
  {id:"civ41", cat:"公民", sub:"政治体制", q:"三権分立の目的として正しいものはどれか。", choices:["権力の集中を防ぎ均衡を保つこと","一つの機関に権力を集中させること","国民の権利を制限すること","地方自治を廃止すること"], a:0, e:"正解は「権力の集中を防ぎ均衡を保つこと」です。三権分立は権力が一つの機関に集中することを防ぎ、相互に抑制・均衡を保つための仕組みです。「一つの機関に権力を集中させること」は誤りで、これは三権分立の目的とは正反対の考え方です。「国民の権利を制限すること」は誤りで、三権分立はむしろ権力の濫用を防ぐことで国民の権利を守る仕組みです。「地方自治を廃止すること」は誤りで、三権分立は国レベルの権力配分に関する制度であり、地方自治の存廃とは別の問題です。"},
  {id:"civ43", cat:"公民", sub:"政治体制", q:"衆議院で内閣不信任決議が可決された場合の内閣の対応として正しいものはどれか。", choices:["10日以内に解散か総辞職する","特に何もする必要はない","参議院を解散して対応する","最高裁判所に判断を仰ぐ"], a:0, e:"正解は「10日以内に衆議院を解散するか総辞職する」です。内閣不信任決議が可決されると、内閣は10日以内に衆議院を解散するか、総辞職しなければなりません。「何もする必要はない」は誤りで、不信任決議が可決された場合、内閣は憲法上一定の対応を取る義務があります。「参議院を解散する」は誤りで、解散の対象となるのは衆議院であり、参議院には解散制度自体がありません。「最高裁判所に訴える」は誤りで、これは司法手続きであり、内閣不信任決議への対応とは無関係です。"},
  {id:"civ45", cat:"公民", sub:"政治体制", q:"法律や行政処分が憲法に違反していないかを審査する権限を持つ機関はどこか。", choices:["国会","内閣","裁判所","地方自治体"], a:2, e:"正解は「裁判所」です。違憲審査権（法令審査権）は裁判所が持ち、最終的な判断は最高裁判所が行います。「国会」は誤りで、国会は法律を制定する立法機関であり、その法律が憲法に違反していないかを審査する立場ではありません。「内閣」は誤りで、内閣は行政を担う機関であり、違憲審査権を持つのは司法を担う裁判所です。「地方自治体」は誤りで、地方自治体は条例などを制定しますが、国の法律や行政処分の違憲審査を行う権限は持ちません。"},
  {id:"civ47", cat:"公民", sub:"政治体制", q:"地方自治についての説明として正しいものはどれか。", choices:["住民が自らの地域の政治に参加すること","国がすべて決定すること","選挙は行われない","中央政府の一部門である"], a:0, e:"正解は「住民が自らの地域の政治に参加すること」です。地方自治は住民が地域の政治に自ら参加し、地域の実情に応じた行政を行う仕組みです。「国がすべて決定すること」は誤りで、これは中央集権的な考え方であり、地方自治の趣旨とは正反対です。「選挙は行われない」は誤りで、地方自治体でも首長や議員を選ぶ選挙が行われています。「中央政府の一部門である」は誤りで、地方自治体は中央政府とは別に、独自の自治権を持つ組織です。"},
  {id:"civ49", cat:"公民", sub:"経済", q:"累進課税制度についての説明として正しいものはどれか。", choices:["所得が高いほど税率が高くなる仕組み","全員が同じ税率を負担する仕組み","所得が高いほど税率が低くなる仕組み","消費にのみ課される税金である"], a:0, e:"正解は「所得が高いほど税率が高くなる仕組み」です。累進課税は所得が高くなるほど税率が高くなる制度で、日本の所得税に採用されています。「全員が同じ税率を負担する仕組み」は誤りで、これは比例課税（フラットタックス）の説明であり、累進課税とは異なります。「所得が高いほど税率が低くなる仕組み」は誤りで、これは累進課税とは正反対の逆進的な仕組みです。「消費にのみ課される税金である」は誤りで、これは消費税など間接税の説明であり、累進課税（主に所得税）とは異なる税の種類です。"},
  {id:"civ51", cat:"公民", sub:"経済", q:"日本の社会保障制度の四つの柱に含まれないものはどれか。", choices:["社会保険","公的扶助","公衆衛生","関税"], a:3, e:"正解は「関税」です。社会保障制度は社会保険・公的扶助・社会福祉・公衆衛生の四つの柱からなり、関税は含まれません。「社会保険」「公的扶助」「公衆衛生」はいずれも誤り（正しい選択、つまり実際に社会保障の柱に含まれる）で、これらはまさに日本の社会保障制度を構成する四つの柱の一部です。"},
  {id:"civ53", cat:"公民", sub:"労働・法律", q:"労働三権に含まれないものはどれか。", choices:["団結権","団体交渉権","団体行動権","経営権"], a:3, e:"正解は「経営権」です。労働三権は団結権・団体交渉権・団体行動権であり、経営権は含まれません。「団結権」「団体交渉権」「団体行動権」はいずれも誤り（正しい選択、つまり実際に労働三権に含まれる）で、これらはまさに労働者に保障された三つの権利です。"},
  {id:"civ55", cat:"公民", sub:"労働・法律", q:"消費者の権利を守るために制定された法律はどれか。", choices:["消費者基本法","労働基準法","独占禁止法","地方自治法"], a:0, e:"正解は「消費者基本法」です。消費者基本法は消費者の権利を守り、安全を確保することを目的として制定されました。「労働基準法」は誤りで、これは労働条件の最低基準を定める法律であり、消費者保護を直接の目的とはしていません。「独占禁止法」は誤りで、これは企業間の公正な競争を確保する法律であり、消費者の権利保護を主目的とした法律ではありません。「地方自治法」は誤りで、これは地方自治の仕組みを定める法律であり、消費者保護とは無関係です。"},
  {id:"civ57", cat:"公民", sub:"経済", q:"ある商品の需要が供給を上回るとき、一般に価格はどうなるか。", choices:["上昇する","下落する","変化しない","ゼロになる"], a:0, e:"正解は「上昇する」です。需要が供給を上回ると品不足になり、市場メカニズムにより価格は上昇する傾向があります。「下落する」は誤りで、これは需要が供給を上回る場合とは逆の状況（供給過多）で起こる現象です。「変化しない」は誤りで、市場経済では需給バランスの変化に応じて価格は変動するのが基本的な仕組みです。「ゼロになる」は誤りで、需要が供給を上回っても価格がゼロになることはなく、むしろ品不足により価格は上がります。"},
  {id:"civ59", cat:"公民", sub:"経済", q:"直接税と間接税の違いについて正しいものはどれか。", choices:["直接税は納税者と負担者が同じである","直接税は消費税を意味する言葉である","間接税は所得税を意味する言葉である","両者にはまったく違いが存在しない"], a:0, e:"正解は「直接税は納税者と負担者が一致し、間接税は一致しない」です。直接税（所得税など）は納税者と実際に負担する人が同じですが、間接税（消費税など）は異なります。「直接税は消費税のことである」は誤りで、消費税はむしろ間接税の代表例であり、直接税ではありません。「間接税は所得税のことである」は誤りで、所得税はむしろ直接税の代表例であり、間接税ではありません。「両者に違いはない」は誤りで、納税者と負担者が一致するかどうかという明確な違いが両者にはあります。"},
  {id:"civ61", cat:"公民", sub:"国際関係", q:"地球温暖化対策のため2015年に採択された国際的な協定はどれか。", choices:["パリ協定","日米安全保障条約","サンフランシスコ平和条約","日中平和友好条約"], a:0, e:"正解は「パリ協定」です。パリ協定は2015年に採択された、地球温暖化対策のための国際的な枠組みです。「日米安全保障条約」は誤りで、これは日本とアメリカの間の軍事的な条約であり、地球温暖化対策とは無関係です。「サンフランシスコ平和条約」は誤りで、これは1951年に結ばれた、日本の独立回復に関する講和条約です。「日中平和友好条約」は誤りで、これは1978年に結ばれた日本と中国の間の条約であり、いずれも気候変動対策とは異なる分野の条約です。"},
  {id:"civ63", cat:"公民", sub:"国際関係", q:"情報化社会における課題として最も適切なものはどれか。", choices:["個人情報の保護","農業生産性の向上","河川の氾濫防止","伝統工芸の継承"], a:0, e:"正解は「個人情報の保護」です。情報化社会ではインターネットの普及に伴い、個人情報の保護が重要な課題となっています。「農業生産性の向上」は誤りで、これは情報化社会特有の課題というより、農業分野一般の課題です。「河川の氾濫防止」は誤りで、これは防災に関する課題であり、情報化社会特有のものではありません。「伝統工芸の継承」は誤りで、これは地域産業や文化継承に関する課題であり、情報化社会の課題としては直接結びつきません。"},
  {id:"civ65", cat:"公民", sub:"政治体制", q:"男女共同参画社会の実現を目指して制定された法律はどれか。", choices:["男女共同参画社会基本法","労働基準法","民法","刑法"], a:0, e:"正解は「男女共同参画社会基本法」です。男女共同参画社会基本法（1999年）は男女が対等に社会に参画できる社会の実現を目指しています。「労働基準法」は誤りで、これは労働条件全般の最低基準を定める法律であり、男女共同参画に特化した法律ではありません。「民法」は誤りで、これは個人・法人間の一般的な権利義務を定める法律です。「刑法」は誤りで、これは犯罪と刑罰について定める法律であり、いずれも男女共同参画社会の実現を直接の目的とはしていません。"},
  {id:"civ67", cat:"公民", sub:"法律", q:"裁判員制度についての説明として正しいものはどれか。", choices:["国民が刑事裁判に参加する制度である","国民がすべての民事裁判に参加する制度である","裁判官を選挙で選ぶ制度である","弁護士を養成する制度である"], a:0, e:"正解は「国民が刑事裁判に参加する制度である」です。裁判員制度は国民が刑事裁判（重大事件）に参加し、裁判官とともに判断する制度です。「国民がすべての民事裁判に参加する制度である」は誤りで、裁判員制度の対象は刑事裁判（それも重大な事件）であり、民事裁判は対象外です。「裁判官を選挙で選ぶ制度である」は誤りで、裁判官は選挙ではなく任命によって選ばれ、裁判員制度とは別の仕組みです。「弁護士を養成する制度である」は誤りで、裁判員制度は弁護士の養成とは無関係な、市民が裁判に参加する制度です。"},
  {id:"civ69", cat:"公民", sub:"法律", q:"日本の三審制の目的として正しいものはどれか。", choices:["裁判を慎重に行い誤りを防ぐこと","裁判を迅速に終わらせること","裁判官の負担を増やすこと","裁判費用を増やすこと"], a:0, e:"正解は「裁判を慎重に行い誤りを防ぐこと」です。三審制は同じ事件について3回まで裁判を受けられる制度で、慎重な審理により誤った判決を防ぐことを目的とします。「裁判を迅速に終わらせること」は誤りで、複数回の審理を認める三審制はむしろ裁判に時間がかかる面があり、迅速化とは逆の側面もあります。「裁判官の負担を増やすこと」は誤りで、これは三審制の目的ではなく、あくまで結果として生じうる副次的な事柄です。「裁判費用を増やすこと」は誤りで、これも三審制の目的ではなく、慎重な審理を実現するための制度であることが本質です。"},
  /* 日本史 */
  {id:"his79", cat:"日本史", sub:"古代", q:"大和政権（ヤマト王権）についての説明として正しいものはどれか。", choices:["奈良盆地を中心に勢力を広げた","江戸時代に成立した","仏教を国教として建国された","中国に服属していた"], a:0, e:"正解は「奈良盆地を中心に勢力を広げた」です。大和政権は3世紀後半から奈良盆地を中心に勢力を広げた豪族連合政権です。「江戸時代に成立した」は誤りで、大和政権はそれよりはるかに古い古墳時代（3〜6世紀ごろ）に成立した政権です。「仏教を国教として建国された」は誤りで、大和政権成立時にはまだ仏教は日本に伝来しておらず（伝来は6世紀）、時期が合いません。「中国に服属していた」は誤りで、大和政権は中国と外交・朝貢関係を持つことはありましたが、完全な服属関係にあったわけではありません。"},
  {id:"his81", cat:"日本史", sub:"古代", q:"中国の歴史書「魏志倭人伝」に記された、邪馬台国の女王は誰か。", choices:["卑弥呼","推古天皇","持統天皇","神功皇后"], a:0, e:"正解は「卑弥呼」です。卑弥呼は3世紀ごろの邪馬台国の女王で、まじないによって国を治めたとされています。「推古天皇」は誤りで、彼女は6〜7世紀の飛鳥時代の天皇であり、卑弥呼より数百年後の人物です。「持統天皇」は誤りで、彼女も7世紀の天皇であり、邪馬台国とは時代が異なります。「神功皇后」は誤りで、彼女は日本神話・伝承上の人物であり、魏志倭人伝に記された卑弥呼とは別の存在です。"},
  {id:"his83", cat:"日本史", sub:"古代", q:"平城京が都として置かれた時代はどれか。", choices:["飛鳥時代","奈良時代","平安時代","鎌倉時代"], a:1, e:"正解は「奈良時代」です。平城京は710年に奈良に置かれた都で、この時代を奈良時代と呼びます。「飛鳥時代」は誤りで、これは平城京遷都より前、都が飛鳥地方にあった時代です。「平安時代」は誤りで、これは794年の平安京遷都以降の時代であり、平城京より後です。「鎌倉時代」は誤りで、これは12世紀末以降の武家政権の時代であり、平城京の時代とはかけ離れています。"},
  {id:"his85", cat:"日本史", sub:"平安時代", q:"摂関政治についての説明として正しいものはどれか。", choices:["天皇の外戚である藤原氏が実権を握った政治","武士が実権を握った政治","僧侶が実権を握った政治","農民が自治を行った政治"], a:0, e:"正解は「天皇の外戚である藤原氏が実権を握った政治」です。摂関政治は藤原氏が天皇の外戚（母方の親戚）として摂政・関白の地位につき、実権を握った政治です。「武士が実権を握った政治」は誤りで、これは後の鎌倉幕府など武家政権の説明であり、摂関政治は貴族（藤原氏）による政治です。「僧侶が実権を握った政治」は誤りで、摂関政治の主体は僧侶ではなく貴族です。「農民が自治を行った政治」は誤りで、これは室町時代の惣などに近い説明であり、摂関政治とは無関係です。"},
  {id:"his87", cat:"日本史", sub:"鎌倉・室町", q:"鎌倉幕府で執権政治を行った氏族はどれか。", choices:["藤原氏","北条氏","足利氏","徳川氏"], a:1, e:"正解は「北条氏」です。北条氏は将軍を補佐する執権の地位を独占し、鎌倉幕府の実権を握りました。「藤原氏」は誤りで、これは平安時代の摂関政治を担った氏族であり、鎌倉幕府の執権とは異なります。「足利氏」は誤りで、これは室町幕府を開いた氏族であり、鎌倉幕府の執権職とは無関係です。「徳川氏」は誤りで、これは江戸幕府を開いた氏族であり、鎌倉時代の執権とは時代がかけ離れています。"},
  {id:"his89", cat:"日本史", sub:"鎌倉・室町", q:"鎌倉幕府滅亡後、建武の新政を行った天皇は誰か。", choices:["後醍醐天皇","後鳥羽天皇","桓武天皇","聖武天皇"], a:0, e:"正解は「後醍醐天皇」です。後醍醐天皇は1333年に鎌倉幕府を滅ぼし、建武の新政と呼ばれる天皇中心の政治を行いました。「後鳥羽天皇」は誤りで、彼は承久の乱（1221年）を起こした天皇であり、建武の新政（1333年以降）とは時代が異なります。「桓武天皇」は誤りで、彼は平安京遷都を行った8世紀末〜9世紀初頭の天皇です。「聖武天皇」は誤りで、彼は奈良時代に東大寺の大仏建立を命じた天皇であり、いずれも建武の新政とは無関係です。"},
  {id:"his91", cat:"日本史", sub:"戦国・江戸", q:"分国法についての説明として正しいものはどれか。", choices:["戦国大名が独自に定めた法律である","江戸幕府が定めた法律である","朝廷が定めた法律である","農民が定めた法律である"], a:0, e:"正解は「戦国大名が独自に定めた法律である」です。分国法は戦国大名が自らの領国を統治するために独自に定めた法律です。「江戸幕府が定めた法律である」は誤りで、これは時代が異なり、分国法は戦国時代の大名が定めたものです。「朝廷が定めた法律である」は誤りで、分国法はあくまで各戦国大名が独自に制定したものであり、朝廷が定めた律令などとは異なります。「農民が定めた法律である」は誤りで、分国法を制定したのは大名であり、農民ではありません。"},
  {id:"his93", cat:"日本史", sub:"戦国・江戸", q:"豊臣秀吉が行った太閤検地の目的として正しいものはどれか。", choices:["全国の田畑の面積や収穫量を調べる","各地にキリスト教を広める","海外との貿易を禁止する","各地に新しい城を築く"], a:0, e:"正解は「全国の田畑の面積や収穫量を調べること」です。太閤検地は全国の田畑の面積や収穫量（石高）を統一的な基準で調べる政策でした。「キリスト教を広めること」は誤りで、秀吉はむしろバテレン追放令などキリスト教を制限する政策もとっており、検地とは目的が異なります。「貿易を禁止すること」は誤りで、太閤検地は土地の調査であり、貿易禁止（鎖国など）とは別の政策です。「城を築くこと」は誤りで、これは検地とは無関係な、築城に関する事柄です。"},
  {id:"his95", cat:"日本史", sub:"江戸時代", q:"生類憐みの令を出した江戸幕府の将軍は誰か。", choices:["徳川家康","徳川綱吉","徳川吉宗","徳川慶喜"], a:1, e:"正解は「徳川綱吉」です。生類憐みの令は5代将軍徳川綱吉が出した、動物愛護を極端に進めた法令です。「徳川家康」は誤りで、彼は初代将軍であり、生類憐みの令を出したのは5代将軍の綱吉です。「徳川吉宗」は誤りで、彼は8代将軍で享保の改革を行った人物であり、生類憐みの令とは無関係です。「徳川慶喜」は誤りで、彼は江戸幕府最後の15代将軍であり、時代が大きく異なります。"},
  {id:"his97", cat:"日本史", sub:"江戸時代", q:"享保の改革を行った江戸幕府の将軍は誰か。", choices:["徳川家康","徳川綱吉","徳川吉宗","徳川慶喜"], a:2, e:"正解は「徳川吉宗」です。享保の改革は8代将軍徳川吉宗が行った幕政改革で、財政再建などを目指しました。「徳川家康」は誤りで、彼は初代将軍であり、享保の改革を行った8代将軍の吉宗とは異なります。「徳川綱吉」は誤りで、彼は5代将軍で生類憐みの令を出した人物であり、享保の改革とは無関係です。「徳川慶喜」は誤りで、彼は江戸幕府最後の将軍であり、享保の改革（18世紀前半）よりずっと後の人物です。"},
  {id:"his99", cat:"日本史", sub:"近代", q:"尊王攘夷運動についての説明として正しいものはどれか。", choices:["天皇を尊び外国勢力を排除する運動","江戸幕府を支持し続ける運動","積極的に開国を推進する運動","仏教をすべて廃止する運動"], a:0, e:"正解は「天皇を尊び外国勢力を排除しようとする運動」です。尊王攘夷運動は幕末に高まった、天皇を尊び外国勢力を排除しようとする思想・運動です。「幕府を支持する運動」は誤りで、尊王攘夷運動はむしろ幕府の外交姿勢を批判する側面が強く、幕府支持とは異なる立場です。「開国を推進する運動」は誤りで、「攘夷」はまさに外国勢力（開国）を排除しようとする考えであり、開国推進とは正反対です。「仏教を廃止する運動」は誤りで、これは明治維新後の廃仏毀釈と混同した誤りであり、尊王攘夷運動とは別の事柄です。"},
  {id:"his101", cat:"日本史", sub:"近代", q:"大政奉還を行った江戸幕府最後の将軍は誰か。", choices:["徳川家光","徳川吉宗","徳川慶喜","徳川家康"], a:2, e:"正解は「徳川慶喜」です。徳川慶喜は1867年に大政奉還を行い、政権を朝廷に返上しました。「徳川家光」は誤りで、彼は3代将軍であり、大政奉還を行った15代将軍の慶喜とは時代が大きく異なります。「徳川吉宗」は誤りで、彼は8代将軍で享保の改革を行った人物です。「徳川家康」は誤りで、彼は江戸幕府を開いた初代将軍であり、幕府を終わらせた大政奉還とは正反対の立場の人物です。"},
  {id:"his103", cat:"日本史", sub:"近代", q:"1918年に起こった米騒動の主な原因は何か。", choices:["米の価格が急激に上昇したこと","米が余りすぎたこと","戦争が終結したこと","農業技術が発展したこと"], a:0, e:"正解は「米の価格が急激に上昇したこと」です。米騒動は米価の急激な上昇に対する民衆の不満から全国に広がった暴動です。「米が余りすぎたこと」は誤りで、事実とは正反対であり、米不足による価格高騰が原因でした。「戦争が終結したこと」は誤りで、米騒動が起こった1918年はまだ第一次世界大戦の最中であり、戦争終結が直接の原因ではありません。「農業技術が発展したこと」は誤りで、これは米価上昇とは逆方向に働く要因であり、米騒動の原因ではありません。"},
  {id:"his105", cat:"日本史", sub:"現代", q:"55年体制についての説明として正しいものはどれか。", choices:["自民党が長期に政権を担った体制","天皇が直接政治を行う体制","軍部が政権を握り続けた体制","複数政党が頻繁に交代する体制"], a:0, e:"正解は「自由民主党が長期にわたり政権を担った政治体制」です。55年体制は1955年以降、自由民主党が長期にわたり単独で政権を担い続けた政治体制です。「天皇が直接政治を行う体制」は誤りで、55年体制は戦後の議院内閣制のもとでの政党政治であり、天皇による直接統治ではありません。「軍部が政権を握った体制」は誤りで、これは戦前・戦中の状況に近く、戦後の55年体制とは異なります。「複数の政党が頻繁に交代する体制」は誤りで、55年体制の特徴はむしろ自民党による長期の安定政権であり、政党の頻繁な交代ではありません。"},
  /* 世界史 */
  {id:"wor73", cat:"世界史", sub:"古代・中世", q:"古代エジプト文明が繁栄した川はどれか。", choices:["ナイル川","チグリス川","インダス川","黄河"], a:0, e:"正解は「ナイル川」です。古代エジプト文明はナイル川流域で、定期的な氾濫を利用した農業とともに発展しました。「チグリス川」は誤りで、これはメソポタミア文明が栄えた川であり、エジプト文明とは別の川です。「インダス川」は誤りで、これはインダス文明が栄えた川です。「黄河」は誤りで、これは中国文明が栄えた川であり、いずれも古代エジプト文明とは異なる文明・地域の川です。"},
  {id:"wor75", cat:"世界史", sub:"古代・中世", q:"ハンムラビ法典が制定された古代文明はどれか。", choices:["エジプト文明","メソポタミア文明","インダス文明","中国文明"], a:1, e:"正解は「メソポタミア文明」です。ハンムラビ法典はメソポタミア文明のバビロニアで制定された、「目には目を」で知られる法典です。「エジプト文明」は誤りで、これはナイル川流域の別の古代文明であり、ハンムラビ法典とは無関係です。「インダス文明」は誤りで、これはインダス川流域の文明です。「中国文明」は誤りで、これは黄河・長江流域で発展した文明であり、いずれもハンムラビ法典が制定されたメソポタミアとは異なります。"},
  {id:"wor77", cat:"世界史", sub:"古代・中世", q:"イスラム教を開いた人物は誰か。", choices:["ムハンマド","イエス","釈迦","孔子"], a:0, e:"正解は「ムハンマド」です。イスラム教は7世紀にムハンマドによって開かれた宗教です。「イエス」は誤りで、彼はキリスト教の中心人物であり、イスラム教の開祖ではありません。「釈迦」は誤りで、彼は仏教を開いた人物です。「孔子」は誤りで、彼は儒教（儒学）の祖とされる思想家であり、いずれもイスラム教の開祖であるムハンマドとは異なります。"},
  {id:"wor79", cat:"世界史", sub:"古代・中世", q:"史上最大級のモンゴル帝国を築いた人物は誰か。", choices:["チンギス・ハン","フビライ・ハン","始皇帝","アレクサンドロス大王"], a:0, e:"正解は「チンギス・ハン」です。チンギス・ハンは13世紀にモンゴル諸部族を統一し、史上最大級のモンゴル帝国の基礎を築きました。「フビライ・ハン」は誤りで、彼はチンギス・ハンの孫で、元を建国し中国を支配した人物ですが、モンゴル帝国の基礎を築いたのはチンギス・ハンです。「始皇帝」は誤りで、彼は中国を初めて統一した秦の皇帝であり、モンゴル帝国とは無関係です。「アレクサンドロス大王」は誤りで、彼は古代ギリシャ・マケドニアの王であり、モンゴル帝国とは時代も地域も異なります。"},
  {id:"wor81", cat:"世界史", sub:"ヨーロッパ史", q:"大航海時代にインド航路を開拓したポルトガル人は誰か。", choices:["コロンブス","バスコ・ダ・ガマ","マゼラン","マルコ・ポーロ"], a:1, e:"正解は「バスコ・ダ・ガマ」です。バスコ・ダ・ガマは1498年、アフリカ南端を回ってインドに到達する航路を開拓しました。「コロンブス」は誤りで、彼は大西洋を横断し西インド諸島に到達した人物であり、インド航路の開拓者ではありません（彼自身はインドに到達したと誤解していました）。「マゼラン」は誤りで、彼は世界周航を成し遂げた人物であり、インド航路開拓とは別の功績です。「マルコ・ポーロ」は誤りで、彼は陸路でアジアを旅した旅行家であり、海路のインド航路開拓者ではありません。"},
  {id:"wor83", cat:"世界史", sub:"ヨーロッパ史", q:"世界一周を初めて達成した艦隊を率いた人物は誰か。", choices:["コロンブス","バスコ・ダ・ガマ","マゼラン","ザビエル"], a:2, e:"正解は「マゼラン」です。マゼランの艦隊は1519年に出発し、彼の死後の1522年に世界一周を達成しました。「コロンブス」は誤りで、彼は西インド諸島に到達しましたが世界一周は行っていません。「バスコ・ダ・ガマ」は誤りで、彼はインド航路を開拓した人物であり、世界一周を成し遂げたわけではありません。「ザビエル」は誤りで、彼はキリスト教の宣教師であり、日本にも布教に訪れましたが、世界周航を行った航海者ではありません。"},
  {id:"wor85", cat:"世界史", sub:"ヨーロッパ史", q:"絶対王政のもとでフランスを統治し「太陽王」と呼ばれた国王は誰か。", choices:["ルイ14世","ルイ16世","ナポレオン","シャルル10世"], a:0, e:"正解は「ルイ14世」です。ルイ14世は強大な王権を築き、「太陽王」と呼ばれてヴェルサイユ宮殿を建設しました。「ルイ16世」は誤りで、彼はフランス革命期の国王であり、革命により処刑された人物であって「太陽王」ではありません。「ナポレオン」は誤りで、彼は革命後に皇帝となった人物であり、絶対王政期の国王ではありません。「シャルル10世」は誤りで、彼は19世紀の国王であり、七月革命で退位した人物であって「太陽王」とは異なります。"},
  {id:"wor89", cat:"世界史", sub:"ヨーロッパ史", q:"大西洋を舞台にした三角貿易で、アフリカからアメリカ大陸に運ばれた主なものは何か。", choices:["奴隷","香辛料","茶","毛皮"], a:0, e:"正解は「奴隷」です。三角貿易ではヨーロッパから武器や雑貨、アフリカから奴隷、アメリカ大陸から砂糖などが運ばれました。「香辛料」は誤りで、香辛料は主にアジア（インドや東南アジア）から運ばれた産物であり、アフリカから運ばれたものではありません。「茶」は誤りで、これも主に中国など東アジアから運ばれた産物です。「毛皮」は誤りで、これは主に北米大陸で取引された産物であり、アフリカからアメリカ大陸へ運ばれたものではありません。"},
  {id:"wor91", cat:"世界史", sub:"ヨーロッパ史", q:"19世紀後半の帝国主義時代に、アフリカ大陸の分割を進めた大陸はどこか。", choices:["ヨーロッパ","アジア","南米","オセアニア"], a:0, e:"正解は「ヨーロッパ」です。19世紀後半、ヨーロッパ諸国はアフリカ大陸のほぼ全域を植民地として分割しました。「アジア」は誤りで、アジアもヨーロッパ列強の進出を受けましたが、この設問はアフリカを分割した「主体」を問うており、答えはアフリカを分割した側のヨーロッパです。「南米」は誤りで、南米は19世紀にはすでに多くの国が独立しており、アフリカ分割の主体ではありません。「オセアニア」は誤りで、これもアフリカ分割の主体ではなく、進出を受けた側の地域の一つです。"},
  {id:"wor93", cat:"世界史", sub:"両大戦期", q:"国際連盟が設立されるきっかけとなった戦争はどれか。", choices:["第一次世界大戦","第二次世界大戦","日露戦争","南北戦争"], a:0, e:"正解は「第一次世界大戦」です。国際連盟は第一次世界大戦の反省から、1920年に平和維持のために設立されました。「第二次世界大戦」は誤りで、この大戦の反省から設立されたのは国際連盟ではなく国際連合です。「日露戦争」は誤りで、これは1904〜1905年の戦争であり、国際連盟設立（1920年）のきっかけではありません。「南北戦争」は誤りで、これはアメリカ国内の内戦であり、国際連盟設立とは無関係です。"},
  {id:"wor95", cat:"世界史", sub:"両大戦期", q:"ファシズムについての説明として正しいものはどれか。", choices:["独裁的で全体主義的な政治思想・体制である","民主主義を発展させた思想である","共産主義の別名である","自由貿易を推進する思想である"], a:0, e:"正解は「独裁的で全体主義的な政治思想・体制である」です。ファシズムはイタリアやドイツで見られた、独裁と全体主義を特徴とする政治思想・体制です。「民主主義を発展させた思想である」は誤りで、ファシズムはむしろ民主主義を否定し、独裁を志向する思想であり正反対です。「共産主義の別名である」は誤りで、共産主義とファシズムは異なる思想であり、実際には敵対する関係にありました。「自由貿易を推進する思想である」は誤りで、ファシズム体制下ではむしろ国家による経済統制が強められる傾向がありました。"},
  {id:"wor97", cat:"世界史", sub:"現代", q:"冷戦下でドイツが東西に分断されるきっかけとなった出来事は何か。", choices:["第二次世界大戦の終結","第一次世界大戦の終結","ベルリンの壁崩壊","ドイツ統一"], a:0, e:"正解は「第二次世界大戦の終結」です。第二次世界大戦終結後、ドイツは米英仏ソによって分割占領され、東西分断につながりました。「第一次世界大戦の終結」は誤りで、この時点ではまだドイツは東西に分断されておらず、分断は第二次世界大戦後の出来事です。「ベルリンの壁崩壊」は誤りで、これはドイツの東西分断がすでに固定化した後、1989年に起こった分断の終わりに向かう出来事です。「ドイツ統一」は誤りで、これも1990年の出来事であり、分断が「始まった」きっかけではなく「終わった」出来事です。"},
  {id:"wor99", cat:"世界史", sub:"現代", q:"1955年に開かれ、植民地支配から独立した国々の連帯を目指したアジア・アフリカ会議は別名何と呼ばれるか。", choices:["バンドン会議","ヤルタ会談","ポツダム会談","ウィーン会議"], a:0, e:"正解は「バンドン会議」です。バンドン会議（アジア・アフリカ会議）はインドネシアのバンドンで開かれ、新興独立国の連帯を確認しました。「ヤルタ会談」は誤りで、これは1945年に米英ソの首脳が開いた会談であり、アジア・アフリカの新興独立国の会議ではありません。「ポツダム会談」は誤りで、これも1945年の連合国首脳による会談です。「ウィーン会議」は誤りで、これは19世紀初頭のヨーロッパの秩序再編に関する会議であり、いずれもバンドン会議とは時代・主体が異なります。"},
  /* 地理 */
  {id:"geo71", cat:"地理", sub:"日本地理", q:"日本を8地方に区分したとき、東北地方に含まれない県はどれか。", choices:["青森県","秋田県","新潟県","岩手県"], a:2, e:"正解は「新潟県」です。新潟県は中部地方に区分され、東北地方には含まれません。「青森県」「秋田県」「岩手県」はいずれも誤り（正しい選択、つまり実際に東北地方に含まれる）で、これらはまさに東北地方を構成する県の一部です。"},
  {id:"geo73", cat:"地理", sub:"日本地理", q:"日本の都道府県の中で最も面積が大きいのはどこか。", choices:["北海道","岩手県","福島県","長野県"], a:0, e:"正解は「北海道」です。北海道は日本の都道府県の中で最も面積が大きく、全国の総面積の約2割を占めます。「岩手県」は誤りで、これは都道府県別では本州最大の面積ですが、北海道には遠く及びません。「福島県」「長野県」も誤りで、いずれも面積の大きい県として知られますが、北海道の面積には及びません。"},
  {id:"geo75", cat:"地理", sub:"日本地理", q:"日本の都道府県の中で最も人口が多いのはどこか。", choices:["大阪府","東京都","神奈川県","愛知県"], a:1, e:"正解は「東京都」です。東京都は日本で最も人口が多い都道府県です。「大阪府」は誤りで、これも人口の多い都市圏ですが、東京都には及びません。「神奈川県」は誤りで、これも人口が多い県ですが東京都より少ないです。「愛知県」は誤りで、これも大都市圏を含む県ですが、人口では東京都が最多です。"},
  {id:"geo77", cat:"地理", sub:"日本地理", q:"初夏に東北地方の太平洋側に吹く、冷害の原因となる冷たく湿った風を何というか。", choices:["やませ","からっ風","フェーン現象","黒潮"], a:0, e:"正解は「やませ」です。やませは初夏に東北地方の太平洋側に吹く冷たく湿った北東風で、稲などの冷害の原因となります。「からっ風」は誤りで、これは冬に関東地方などで吹く乾燥した冷たい風であり、やませとは吹く季節や地域、湿り気が異なります。「フェーン現象」は誤りで、これは山を越えた風が乾燥して高温になる現象であり、やませの冷たく湿った性質とは正反対です。「黒潮」は誤りで、これは風ではなく日本近海を流れる暖流の名称です。"},
  {id:"geo79", cat:"地理", sub:"世界地理", q:"六大陸のうち、面積が最も大きい大陸はどこか。", choices:["アジア大陸","アフリカ大陸","北アメリカ大陸","南極大陸"], a:0, e:"正解は「アジア大陸」です。アジア大陸は六大陸の中で最も面積が大きい大陸です。「アフリカ大陸」は誤りで、これは二番目に大きい大陸ですが、アジアには及びません。「北アメリカ大陸」は誤りで、これも大きな大陸ですがアジアよりは小さいです。「南極大陸」は誤りで、これも広大な大陸ですが、面積ではアジア大陸が最大です。"},
