  {id:"geo81", cat:"地理", sub:"世界地理", q:"乾燥帯の地域で、家畜とともに水や牧草を求めて移動しながら暮らす生活様式を何というか。", choices:["遊牧","定住農業","漁労","狩猟採集"], a:0, e:"正解は「遊牧」です。遊牧は乾燥帯や寒帯などで、家畜とともに水や牧草を求めて移動しながら生活する牧畜の形態です。「定住農業」は誤りで、これは同じ土地に定住して作物を栽培する農業形態であり、遊牧とは正反対の生活様式です。「漁労」は誤りで、これは魚などを捕って生活する形態であり、家畜を伴う移動生活とは異なります。「狩猟採集」は誤りで、これは野生動植物を狩ったり採ったりする生活様式であり、家畜を飼育しながら移動する遊牧とは異なります。"},
  {id:"geo83", cat:"地理", sub:"世界地理", q:"西岸海洋性気候の特徴として正しいものはどれか。", choices:["偏西風と暖流の影響で温暖湿潤","一年中高温で乾燥している","冬になると極端に寒くなる","雨がほとんど降らない気候"], a:0, e:"正解は「偏西風と暖流の影響で一年を通して温暖湿潤である」です。西岸海洋性気候は偏西風と暖流の影響を受け、年間を通して温暖で降水量も安定しています。「一年中高温で乾燥している」は誤りで、これは砂漠気候などの特徴であり、西岸海洋性気候とは異なります。「冬に極端に寒くなる」は誤りで、西岸海洋性気候は海洋の影響で冬でも比較的温和な気候となります。「雨がほとんど降らない」は誤りで、西岸海洋性気候は年間を通じて安定した降水があることが特徴です。"},
  {id:"geo85", cat:"地理", sub:"世界地理", q:"アフリカのサハラ砂漠南縁にあたるサヘル地域で、近年深刻化している環境問題は何か。", choices:["砂漠化","酸性雨","オゾン層破壊","水質汚染"], a:0, e:"正解は「砂漠化」です。サヘル地域では過放牧や気候変動により砂漠化が深刻な環境問題となっています。「酸性雨」は誤りで、これは主に工業活動による大気汚染が原因の環境問題であり、サヘル地域の主な問題ではありません。「オゾン層破壊」は誤りで、これはフロンガスなどが原因の地球規模の問題であり、サヘル地域特有の問題ではありません。「水質汚染のみ」は誤りで、サヘル地域で特に深刻とされるのは水質汚染よりも砂漠化です。"},
  {id:"geo87", cat:"地理", sub:"世界地理", q:"プランテーション農業についての説明として正しいものはどれか。", choices:["熱帯で単一の商品作物を大規模栽培","小規模で行う自給的な農業","寒冷地域で行われる牧畜","日本に特有の農業形態"], a:0, e:"正解は「熱帯地域で単一の商品作物を大規模に栽培する農業である」です。プランテーション農業は熱帯地域で天然ゴムやコーヒーなど、単一の商品作物を大規模に栽培する農業形態です。「小規模な自給的農業である」は誤りで、プランテーション農業はむしろ大規模かつ商業目的の農業であり、自給的な小規模農業とは正反対です。「寒冷地域で行われる牧畜である」は誤りで、プランテーション農業は熱帯地域で行われる耕作農業であり、牧畜や寒冷地とは無関係です。「日本特有の農業形態である」は誤りで、プランテーション農業は主に熱帯の発展途上国で見られる農業形態です。"},
  {id:"geo89", cat:"地理", sub:"世界地理", q:"1997年に採択され、先進国に温室効果ガスの削減を義務づけた国際的な取り決めを何というか。", choices:["京都議定書","パリ協定","ワシントン条約","バーゼル条約"], a:0, e:"正解は「京都議定書」です。京都議定書は先進国に温室効果ガス排出量の削減目標を義務づけた国際的な取り決めです。「パリ協定」は誤りで、これは2015年に採択された、京都議定書より後の枠組みであり、対象国も先進国に限定されていません。「ワシントン条約」は誤りで、これは絶滅危惧種の国際取引を規制する条約であり、温室効果ガスとは無関係です。「バーゼル条約」は誤りで、これは有害廃棄物の越境移動を規制する条約であり、いずれも京都議定書とは異なる分野の条約です。"},
  {id:"geo91", cat:"地理", sub:"世界地理", q:"モノカルチャー経済についての説明として正しいものはどれか。", choices:["特定の資源の輸出に依存する経済","多様な産業が発展した経済","工業製品のみを輸出する経済","自給自足のみで成り立つ経済"], a:0, e:"正解は「特定の農産物や鉱産資源の輸出に依存する経済体制である」です。モノカルチャー経済は特定の一次産品（農産物や鉱産資源）の生産・輸出に依存する経済体制で、発展途上国に多く見られます。「多様な産業がバランスよく発展した経済である」は誤りで、これはモノカルチャー経済とは正反対の、産業構造が多角化した経済のあり方です。「工業製品のみを輸出する経済である」は誤りで、モノカルチャー経済は主に農産物や鉱産資源などの一次産品に依存する経済であり、工業製品輸出とは異なります。「自給自足のみの経済である」は誤りで、モノカルチャー経済は輸出に依存する経済であり、自給自足とは対照的です。"},
  {id:"geo93", cat:"地理", sub:"日本地理", q:"日本の食料自給率が特に低い品目として知られるものはどれか。", choices:["小麦","米","日本酒","漬物"], a:0, e:"正解は「小麦」です。小麦は日本の食料自給率が特に低い品目で、多くを輸入に頼っています。「米」は誤りで、米は日本の食料自給率が比較的高い品目として知られています。「日本酒」は誤りで、日本酒は国内で製造される加工品であり、原料の米の自給率と混同すべきではありません。「漬物」も誤りで、これも国内で製造される加工食品であり、自給率の低い「品目」としての典型例ではありません。"},
  {id:"geo95", cat:"地理", sub:"日本地理", q:"現在の日本の人口ピラミッドの型に最も近いものはどれか。", choices:["つぼ型（少子高齢化型）","富士山型（多産多死型）","つりがね型（人口停滞型）","ピラミッド型（多産少死型）"], a:0, e:"正解は「つぼ型（少子高齢化型）」です。少子高齢化が進む現在の日本の人口ピラミッドは、若年層が少なく高齢層が多いつぼ型に近づいています。「富士山型（多産多死型）」は誤りで、これは出生率・死亡率がともに高い、発展途上国などに見られる型であり、現在の日本とは異なります。「つりがね型（人口停滞型）」は誤りで、これはつぼ型に至る前段階の、出生率と死亡率がともに低下し人口増加が停滞し始めた型です。「ピラミッド型（多産少死型）」は誤りで、これは出生率が高く死亡率が低下し始めた、人口が急増する社会に見られる型です。"},
  {id:"geo97", cat:"地理", sub:"世界地理", q:"排他的経済水域(EEZ)より外側で、どの国にも属さず自由に航行や漁業ができる海域を何というか。", choices:["公海","領海","接続水域","内水"], a:0, e:"正解は「公海」です。公海はどの国の主権にも属さず、航行・漁業などが自由に行える海域です。「領海」は誤りで、これは沿岸国の主権が及ぶ海域であり、排他的経済水域より内側に位置し、公海とは対照的な海域です。「接続水域」は誤りで、これは領海に隣接し、沿岸国が一定の規制権限を持つ海域であり、完全に自由な公海とは異なります。「内水」は誤りで、これは湾や河口など、陸地に囲まれた国内の水域を指し、公海とは全く異なる概念です。"},
  /* 公民 */
  {id:"civ71", cat:"公民", sub:"政治体制", q:"日本国憲法が保障する基本的人権のうち、「自由に意見を発表する権利」を何というか。", choices:["表現の自由","居住の自由","財産権","参政権"], a:0, e:"正解は「表現の自由」です。表現の自由は、自分の意見や考えを自由に発表できる権利で、精神の自由の一つです。「居住の自由」は誤りで、これは住む場所を自由に選べる権利であり、意見発表とは異なる自由権です。「財産権」は誤りで、これは自分の財産を所有・処分できる権利であり、経済的自由に分類されます。「参政権」は誤りで、これは選挙権など政治に参加する権利であり、意見を発表する自由とは異なるカテゴリーの権利です。"},
  {id:"civ73", cat:"公民", sub:"政治体制", q:"日本国憲法第9条が定めている内容として正しいものはどれか。", choices:["戦争放棄と戦力不保持","国民主権","基本的人権の尊重","地方自治"], a:0, e:"正解は「戦争放棄と戦力不保持」です。憲法第9条は戦争の放棄と戦力の不保持、交戦権の否認を定めており、平和主義の中心となっています。「国民主権」は誤りで、これは憲法前文や第1条などに関わる別の基本原則です。「基本的人権の尊重」は誤りで、これも憲法の三大原則の一つですが、第9条とは別の条文・原則です。「地方自治」は誤りで、これは憲法第8章で定められる別の制度であり、第9条の内容とは異なります。"},
  {id:"civ75", cat:"公民", sub:"政治体制", q:"選挙の四原則に含まれないものはどれか。", choices:["普通選挙","平等選挙","秘密選挙","制限選挙"], a:3, e:"正解は「制限選挙」です。選挙の四原則は普通・平等・秘密・直接選挙であり、制限選挙は含まれません。「普通選挙」「平等選挙」「秘密選挙」はいずれも誤り（正しい選択、つまり実際に選挙の四原則に含まれる）で、これらはまさに現代の民主的選挙を支える基本原則の一部です。"},
  {id:"civ77", cat:"公民", sub:"政治体制", q:"世論についての説明として正しいものはどれか。", choices:["多くの人々が共有する意見や考え","政府が発表する公式見解のみ","一人だけが持つ個人的な意見","法律で明確に定められた意見"], a:0, e:"正解は「社会の多くの人々が共有する意見や考え方である」です。世論は社会の多くの人々が共有する意見や考え方で、政治や政策に影響を与えます。「政府の公式見解のみを指す」は誤りで、世論は政府の見解ではなく、広く社会の中で形成される意見を指します。「一人の意見のことである」は誤りで、世論はあくまで多くの人々に共有される意見であり、個人の意見だけを指す言葉ではありません。「法律で定められた意見である」は誤りで、世論は法律で定義・規定される性質のものではなく、社会の中で自然に形成されるものです。"},
  {id:"civ79", cat:"公民", sub:"政治体制", q:"地方交付税交付金の目的として正しいものはどれか。", choices:["地方公共団体間の財政格差を是正すること","国の借金を返済すること","企業に補助金を与えること","地方税を廃止すること"], a:0, e:"正解は「地方公共団体間の財政格差を是正すること」です。地方交付税交付金は、地方公共団体間の財政格差を是正するために国から配分される資金です。「国の借金を返済すること」は誤りで、これは国債の償還など別の財政上の課題であり、地方交付税交付金の目的ではありません。「企業に補助金を与えること」は誤りで、地方交付税交付金の交付先は企業ではなく地方公共団体です。「地方税を廃止すること」は誤りで、地方交付税交付金は地方税を補完するものであり、地方税を廃止する制度ではありません。"},
  {id:"civ81", cat:"公民", sub:"国際関係", q:"国際司法裁判所についての説明として正しいものはどれか。", choices:["国家間の法的紛争を解決する機関","個人の犯罪を裁くための機関","貿易紛争だけを扱う機関","EUに設置されている機関"], a:0, e:"正解は「国家間の法的紛争を解決する国連の機関である」です。国際司法裁判所（ICJ）はオランダのハーグに置かれた、国家間の法的紛争を解決する国連の主要機関です。「個人の犯罪を裁く機関である」は誤りで、これは国際刑事裁判所（ICC）など別の機関の役割であり、ICJは国家間の紛争を扱います。「貿易紛争のみを扱う機関である」は誤りで、ICJは貿易に限らず幅広い国家間の法的紛争を扱う機関です。「EUの機関である」は誤りで、ICJは国連の機関であり、EU（ヨーロッパ連合）の機関ではありません。"},
  {id:"civ83", cat:"公民", sub:"国際関係", q:"発展途上国への経済援助を行う、日本の政府開発援助を表す略称はどれか。", choices:["ODA","NGO","WHO","NPO"], a:0, e:"正解は「ODA」です。ODA（政府開発援助）は、政府が発展途上国の開発のために行う資金・技術援助のことです。「NGO」は誤りで、これは非政府組織を指す略称であり、政府による援助であるODAとは主体が異なります。「WHO」は誤りで、これは世界保健機関の略称であり、健康分野の国際協力を担う機関です。「NPO」は誤りで、これは非営利団体を指す略称であり、政府開発援助を表す言葉ではありません。"},
  {id:"civ85", cat:"公民", sub:"経済", q:"為替レートについての説明として正しいものはどれか。", choices:["異なる通貨を交換する際の比率である","株式の価格のことである","税金の一種である","国の借金のことである"], a:0, e:"正解は「異なる通貨を交換する際の比率である」です。為替レートは、円とドルなど異なる通貨を交換する際の比率のことです。「株式の価格のことである」は誤りで、これは株価に関する説明であり、通貨の交換比率である為替レートとは異なる概念です。「税金の一種である」は誤りで、為替レートは税制とは無関係な、通貨間の交換比率です。「国の借金のことである」は誤りで、これは国債など財政に関する事柄であり、為替レートとは異なります。"},
  {id:"civ87", cat:"公民", sub:"経済", q:"独占禁止法の目的として正しいものはどれか。", choices:["公正な競争を確保し消費者を守る","大企業だけを手厚く保護する","中小企業の活動を規制する","海外からの輸入を制限する"], a:0, e:"正解は「公正な競争を確保し消費者の利益を守ること」です。独占禁止法は企業間の公正な競争を確保し、消費者の利益を守ることを目的とした法律です。「大企業を保護すること」は誤りで、独占禁止法はむしろ大企業による市場支配（独占・寡占）を規制する法律であり、大企業保護とは正反対です。「中小企業を規制すること」は誤りで、独占禁止法が主に規制の対象とするのは市場を支配しうる大企業の行動であり、中小企業の規制が主目的ではありません。「輸入を制限すること」は誤りで、独占禁止法は国内の競争政策に関する法律であり、輸入制限（貿易政策）とは異なる分野です。"},
  {id:"civ89", cat:"公民", sub:"経済", q:"循環型社会の実現のために推進されている「3R」に含まれないものはどれか。", choices:["リデュース","リユース","リサイクル","リムーブ"], a:3, e:"正解は「リムーブ」です。3Rはリデュース（減らす）・リユース（再使用）・リサイクル（再資源化）の3つで、「リムーブ」は含まれません。「リデュース」「リユース」「リサイクル」はいずれも誤り（正しい選択、つまり実際に3Rに含まれる）で、これらはまさに循環型社会を実現するための3つの取り組みです。"},
  {id:"civ91", cat:"公民", sub:"政治体制", q:"日本の衆議院議員選挙に採用されている選挙制度はどれか。", choices:["小選挙区比例代表並立制","完全比例代表制","大選挙区制","間接選挙制"], a:0, e:"正解は「小選挙区比例代表並立制」です。衆議院議員選挙では、小選挙区制と比例代表制を組み合わせた小選挙区比例代表並立制が採用されています。「完全比例代表制」は誤りで、これは比例代表のみで議席を配分する制度であり、衆議院選挙とは異なる仕組みです。「大選挙区制のみ」は誤りで、これは一つの選挙区から複数の当選者を出す制度であり、衆議院選挙の主要な仕組みではありません。「間接選挙制」は誤りで、これは有権者が直接候補者を選ばず選挙人を介して選出する制度であり、衆議院議員選挙は有権者が直接投票する仕組みです。"},
  {id:"civ93", cat:"公民", sub:"経済", q:"少子高齢化が社会保障制度に与える影響として正しいものはどれか。", choices:["現役世代の負担が増加する","社会保障費が減少する","労働力人口が増加する","年金制度の維持が容易になる"], a:0, e:"正解は「現役世代の負担が増加する」です。少子高齢化が進むと、年金や医療を支える現役世代の人数が減り、一人当たりの負担が増加します。「社会保障費が減少する」は誤りで、実際には高齢者の増加にともない社会保障費はむしろ増加する傾向にあります。「労働力人口が増加する」は誤りで、少子化により若年層が減少するため、労働力人口はむしろ減少傾向になります。「年金制度の維持が容易になる」は誤りで、支える世代が減り支えられる世代が増えることで、年金制度の維持はむしろ困難になります。"},
  {id:"civ95", cat:"公民", sub:"労働・法律", q:"クーリング・オフ制度についての説明として正しいものはどれか。", choices:["一定期間内に契約を解除できる制度","商品を無料で交換できる制度","納めた税金を還付する制度","選挙の投票をやり直す制度"], a:0, e:"正解は「一定期間内であれば契約を無条件で解除できる制度である」です。クーリング・オフ制度は、訪問販売などで契約した場合、一定期間内であれば無条件で契約を解除できる消費者保護の制度です。「商品を無料で交換できる制度である」は誤りで、クーリング・オフは契約の解除に関する制度であり、商品交換とは異なる仕組みです。「税金を還付する制度である」は誤りで、これは税制上の還付に関する事柄であり、消費者契約とは無関係です。「選挙の投票をやり直す制度である」は誤りで、これは選挙制度に関する事柄であり、クーリング・オフとは全く異なる分野です。"},
  {id:"civ97", cat:"公民", sub:"国際関係", q:"バリアフリーについての説明として正しいものはどれか。", choices:["高齢者や障がい者の生活障壁を除く","建物の外装デザインを整えること","都市の交通渋滞を解消すること","情報の流通を制限すること"], a:0, e:"正解は「高齢者や障がいのある人が生活しやすいように障壁を取り除くこと」です。バリアフリーは高齢者や障がいのある人が生活する上での物理的・心理的な障壁を取り除く考え方です。「建物の外装のデザインのことである」は誤りで、バリアフリーはデザイン性よりも利用のしやすさに主眼を置いた考え方です。「交通渋滞を解消することである」は誤りで、これは都市交通に関する別の課題であり、バリアフリーとは異なります。「情報を制限することである」は誤りで、バリアフリーはむしろ誰もが利用しやすくすることを目指す考え方であり、情報制限とは無関係です。"},
  /* 日本史 */
  {id:"his107", cat:"日本史", sub:"古代", q:"弥生土器の特徴として正しいものはどれか。", choices:["薄手で実用的なつくりをしている","厚手で装飾が多いつくりをしている","青銅で作られている","文字が刻まれている"], a:0, e:"正解は「薄手で実用的なつくりをしている」です。弥生土器は縄文土器と比べて薄手で、実用性を重視したシンプルなつくりが特徴です。「厚手で装飾が多いつくりをしている」は誤りで、これは弥生土器ではなく縄文土器の特徴です。「青銅で作られている」は誤りで、土器は粘土を焼いて作られるものであり、青銅（金属）で作られているわけではありません。「文字が刻まれている」は誤りで、弥生時代の日本にはまだ文字は伝わっておらず、土器に文字が刻まれることはありません。"},
  {id:"his109", cat:"日本史", sub:"古代", q:"聖徳太子が定めたとされる冠位十二階についての説明として正しいものはどれか。", choices:["家柄によらず能力で人材登用する制度","身分を完全に固定するための制度","土地の私有を禁止するための制度","仏教の信仰を弾圧するための制度"], a:0, e:"正解は「家柄によらず能力で人材登用する制度」です。冠位十二階は氏姓ではなく、個人の能力や功績に応じて役人を登用しようとした画期的な制度でした。「身分を完全に固定するための制度である」は誤りで、これは冠位十二階の趣旨とは正反対であり、むしろ身分の流動化を図るものでした。「土地の私有を禁止するための制度である」は誤りで、これは公地公民制など別の制度に関する内容です。「仏教の信仰を弾圧するための制度である」は誤りで、聖徳太子はむしろ仏教を篤く保護した人物であり、弾圧とは正反対です。"},
  {id:"his111", cat:"日本史", sub:"古代", q:"743年に出された墾田永年私財法についての説明として正しいものはどれか。", choices:["新しく開墾した土地の永久私有を認めた法令である","土地の売買を全面的に禁止した法令である","公地公民の原則をさらに強化する法令である","農民に武器の所持を禁じた法令である"], a:0, e:"正解は「新しく開墾した土地の永久私有を認めた法令である」です。墾田永年私財法は新しく開墾した土地の永久私有を認めることで開墾を奨励し、公地公民制の崩壊のきっかけとなりました。「土地の売買を全面的に禁止した法令である」は誤りで、これはこの法令の趣旨とは正反対の内容です。「公地公民の原則をさらに強化する法令である」は誤りで、実際にはこの法令は公地公民の原則を崩す方向に働きました。「農民に武器の所持を禁じた法令である」は誤りで、これは後の豊臣秀吉による刀狩と混同した内容であり、墾田永年私財法とは無関係です。"},
  {id:"his113", cat:"日本史", sub:"平安時代", q:"国風文化が発達したのはどの時代か。", choices:["平安時代","奈良時代","鎌倉時代","室町時代"], a:0, e:"正解は「平安時代」です。国風文化は遣唐使が停止された9世紀末以降の平安時代に発達した、かな文字や大和絵など日本独自の文化です。「奈良時代」は誤りで、これは国風文化より前、遣唐使が盛んに派遣されていた時代です。「鎌倉時代」は誤りで、これは国風文化より後の武家政権の時代です。「室町時代」は誤りで、これも国風文化よりさらに後の時代であり、いずれも国風文化が栄えた平安時代とは異なります。"},
  {id:"his115", cat:"日本史", sub:"平安時代", q:"院政についての説明として正しいものはどれか。", choices:["上皇が退位後も実権を握る形態","武士が政権を握る政治形態","摂政が幼い天皇を補佐する形態","将軍が政治を行う政治形態"], a:0, e:"正解は「天皇が退位した後に上皇として政治の実権を握る政治形態である」です。院政は天皇が位を退いた後も上皇として政治の実権を握り続ける政治形態で、白河上皇が始めたとされます。「武士が政権を握る政治形態である」は誤りで、これは後の鎌倉幕府などに近い説明であり、院政は上皇（元天皇）による政治です。「天皇が幼少のときに摂政が補佐する政治形態である」は誤りで、これは摂関政治における摂政の役割の説明であり、院政とは異なる仕組みです。「将軍が政治を行う政治形態である」は誤りで、これは幕府による武家政治の説明であり、院政とは無関係です。"},
  {id:"his117", cat:"日本史", sub:"鎌倉・室町", q:"1232年に鎌倉幕府が制定した御成敗式目（貞永式目）についての説明として正しいものはどれか。", choices:["武士社会の慣習をまとめた武家法","公家社会のためだけの法律","江戸幕府が定めた法律","キリスト教徒を取り締まる法律"], a:0, e:"正解は「武士社会の慣習をもとにまとめられた、初の武家法である」です。御成敗式目は武士社会の慣習・道徳をもとにまとめられた、日本初の本格的な武家法です。「公家社会のためだけに作られた法律である」は誤りで、御成敗式目はむしろ武士社会を対象とした法律であり、公家のためのものではありません。「江戸幕府が定めた法律である」は誤りで、これは鎌倉幕府が制定した法律であり、江戸幕府（御成敗式目より数百年後）とは時代が異なります。「キリスト教徒を取り締まるための法律である」は誤りで、御成敗式目が制定された13世紀の日本にはまだキリスト教は伝来しておらず、時代が合いません。"},
  {id:"his119", cat:"日本史", sub:"鎌倉・室町", q:"鎌倉時代に広まった二毛作についての説明として正しいものはどれか。", choices:["同じ耕地で一年に二種類の作物を栽培する農法である","二つの田で同じ作物を栽培する農法である","二年に一度だけ耕作する農法である","水田を二つに分割する農法である"], a:0, e:"正解は「同じ耕地で一年に二種類の作物を栽培する農法である」です。二毛作は同じ耕地で米と麦など二種類の作物を一年のうちに栽培する農法で、生産力の向上につながりました。「二つの田で同じ作物を栽培する農法である」は誤りで、二毛作の本質は「同じ土地」で「異なる作物」を作る点にあり、この説明は逆の内容です。「二年に一度だけ耕作する農法である」は誤りで、これは休耕を伴う農法に近く、二毛作（一年に二度収穫する）とは正反対です。「水田を二つに分ける農法である」は誤りで、二毛作は田を分割することではなく、時期をずらして異なる作物を栽培することを指します。"},
  {id:"his121", cat:"日本史", sub:"鎌倉・室町", q:"室町幕府が明との貿易で用いた証票を何というか。", choices:["勘合","朱印状","菱垣廻船","南蛮貿易"], a:0, e:"正解は「勘合」です。勘合貿易は明が発行した勘合という証票を用いることで、正式な貿易船と倭寇（海賊）を区別しました。「朱印状」は誤りで、これは江戸時代初期に幕府が海外渡航を許可した証書であり、勘合貿易とは時代・仕組みが異なります。「菱垣廻船」は誤りで、これは江戸時代に大坂・江戸間などで使われた輸送船の名称であり、証票ではありません。「南蛮貿易」は誤りで、これは戦国時代のポルトガル・スペインとの貿易を指す言葉であり、明との勘合貿易とは別の貿易です。"},
  {id:"his123", cat:"日本史", sub:"戦国・江戸", q:"織田信長が行った楽市・楽座についての説明として正しいものはどれか。", choices:["座の特権や関所を廃止した政策","農民の年貢を大幅に軽減した政策","キリスト教だけを保護した政策","武士の身分を固定するための政策"], a:0, e:"正解は「座の特権や関所を廃止した政策」です。楽市・楽座は座の特権を廃止し、市場での自由な商売を認めることで商工業の発展を促した政策です。「農民の年貢を大幅に軽減した政策」は誤りで、楽市・楽座は商業に関する政策であり、農民の年貢に関する政策ではありません。「キリスト教だけを保護した政策」は誤りで、楽市・楽座は商業政策であり、宗教政策とは異なります。「武士の身分を固定するための政策」は誤りで、これは江戸時代の身分制度に近い内容であり、楽市・楽座（商業自由化政策）とは無関係です。"},
  {id:"his125", cat:"日本史", sub:"江戸時代", q:"江戸幕府の三大改革に含まれないものはどれか。", choices:["享保の改革","寛政の改革","天保の改革","明治の改革"], a:3, e:"正解は「明治の改革」です。江戸幕府の三大改革は享保・寛政・天保の改革であり、「明治の改革」という呼び方は存在しません。「享保の改革」「寛政の改革」「天保の改革」はいずれも誤り（正しい選択、つまり実際に三大改革に含まれる）で、これら三つがまさに江戸幕府の三大改革です。"},
  {id:"his127", cat:"日本史", sub:"江戸時代", q:"寛政の改革を主導した老中は誰か。", choices:["松平定信","水野忠邦","田沼意次","徳川吉宗"], a:0, e:"正解は「松平定信」です。松平定信は寛政の改革を主導し、質素倹約や風紀の統制などを進めました。「水野忠邦」は誤りで、彼は天保の改革を主導した老中であり、寛政の改革とは別の時期・人物です。「田沼意次」は誤りで、彼は寛政の改革の前の時代に商業重視の政治を行った人物であり、定信の改革はむしろ田沼政治への反動という側面がありました。「徳川吉宗」は誤りで、彼は将軍であり、享保の改革を主導した人物であって寛政の改革の主導者ではありません。"},
  {id:"his129", cat:"日本史", sub:"江戸時代", q:"天保の改革を主導した老中は誰か。", choices:["松平定信","水野忠邦","田沼意次","井伊直弼"], a:1, e:"正解は「水野忠邦」です。水野忠邦は天保の改革を主導し、倹約令や株仲間の解散などの政策を進めました。「松平定信」は誤りで、彼は寛政の改革を主導した老中であり、天保の改革（松平定信より後の時代）とは別の人物です。「田沼意次」は誤りで、彼はさらに前の時代に活躍した老中であり、天保の改革とは時代が異なります。「井伊直弼」は誤りで、彼は幕末に大老として活躍した人物であり、天保の改革の主導者ではありません。"},
  {id:"his131", cat:"日本史", sub:"近代", q:"1858年に結ばれた日米修好通商条約についての説明として正しいものはどれか。", choices:["日本に関税自主権がない不平等条約","日本にとって非常に有利な条約","対等な立場で結ばれた条約","江戸幕府が締結を拒否した条約"], a:0, e:"正解は「日本に関税自主権がない不平等条約」です。日米修好通商条約は日本に関税自主権がなく、アメリカに領事裁判権を認めるなど不平等な内容を含んでいました。「日本にとって非常に有利な条約」は誤りで、事実とは正反対であり、この条約は日本にとって不利な不平等条約でした。「対等な立場で結ばれた条約」は誤りで、関税自主権の欠如や領事裁判権の承認など、対等とは言えない内容を含んでいました。「江戸幕府が締結を拒否した条約」は誤りで、実際には幕府はこの条約を（天皇の勅許を得ないまま）締結しています。"},
  {id:"his133", cat:"日本史", sub:"近代", q:"1871年に行われた廃藩置県についての説明として正しいものはどれか。", choices:["藩を廃止し府県を置く改革である","新たに藩を設置する改革である","江戸幕府が行った改革である","地方分権を強化する改革である"], a:0, e:"正解は「藩を廃止し府県を置く改革である」です。廃藩置県は藩を廃止して府県を設置し、中央政府が地方を直接統治する中央集権体制を確立した改革です。「新たに藩を設置する改革である」は誤りで、これは廃藩置県の内容とは正反対であり、実際には藩を「廃止」する改革でした。「江戸幕府が行った改革である」は誤りで、廃藩置県は明治政府による改革であり、江戸幕府（すでに廃止された旧体制）が行ったものではありません。「地方分権を強化する改革である」は誤りで、廃藩置県はむしろ中央集権体制を強化する改革であり、地方分権とは逆の方向性です。"},
  {id:"his135", cat:"日本史", sub:"近代", q:"1873年から始まった地租改正についての説明として正しいものはどれか。", choices:["地価を基準に現金で納税させる改革","米で納税する制度を維持した改革","すべての税を廃止した改革","地方ごとに税制を変えた改革"], a:0, e:"正解は「地価を基準に現金で納税させる改革」です。地租改正は土地の価格（地価）を基準に税率を定め、現金で納税させる制度に改めた改革です。「米で納税する制度を維持した改革である」は誤りで、これは地租改正以前の年貢制度の説明であり、地租改正はまさにこれを現金納税に改めた点が特徴です。「すべての税を廃止した改革である」は誤りで、地租改正は税を廃止するのではなく、課税方法を変更する改革です。「地方ごとに税制を変えた改革である」は誤りで、地租改正はむしろ全国一律の基準で地価と税率を定めようとした改革です。"},
  {id:"his137", cat:"日本史", sub:"近代", q:"明治時代に高まった自由民権運動についての説明として正しいものはどれか。", choices:["国会開設や憲法制定を求める運動","幕府の権力強化を求める運動","鎖国の継続を求め続ける運動","天皇制の廃止を求め続ける運動"], a:0, e:"正解は「国会開設や憲法制定を求める運動」です。自由民権運動は板垣退助らを中心に、国会開設や憲法制定、国民の政治参加拡大を求めて展開された運動です。「幕府の権力強化を求める運動」は誤りで、自由民権運動は明治時代（幕府はすでに廃止）の運動であり、幕府とは無関係です。「鎖国の継続を求め続ける運動」は誤りで、自由民権運動は国会開設など国内の政治制度に関する運動であり、鎖国継続とは無関係です。「天皇制の廃止を求め続ける運動」は誤りで、自由民権運動は天皇制の枠組みの中での立憲政治・議会政治の実現を求めるものでした。"},
  {id:"his139", cat:"日本史", sub:"近代", q:"日清戦争の講和条約として結ばれたのはどれか。", choices:["下関条約","ポーツマス条約","ベルサイユ条約","日米和親条約"], a:0, e:"正解は「下関条約」です。日清戦争（1894-1895年）の講和条約は下関で結ばれ、下関条約と呼ばれています。「ポーツマス条約」は誤りで、これは日露戦争の講和条約であり、日清戦争とは別の戦争の条約です。「ベルサイユ条約」は誤りで、これは第一次世界大戦の講和条約であり、日清戦争とは無関係です。「日米和親条約」は誤りで、これは1854年に結ばれた開国に関する条約であり、日清戦争の講和条約ではありません。"},
  {id:"his141", cat:"日本史", sub:"近代", q:"大正時代に高まった、民主主義的な風潮や政治運動を総称して何と呼ぶか。", choices:["大正デモクラシー","国風文化","文明開化","富国強兵"], a:0, e:"正解は「大正デモクラシー」です。大正デモクラシーは大正時代に高まった、政党政治や普通選挙、社会運動の拡大を求める民主主義的な風潮の総称です。「国風文化」は誤りで、これは平安時代の文化を指す言葉であり、大正時代の政治的風潮とは無関係です。「文明開化」は誤りで、これは明治時代初期の西洋化の風潮であり、大正時代とは時期が異なります。「富国強兵」は誤りで、これは明治政府の近代国家建設の基本方針であり、大正時代の民主主義的風潮とは性格が異なります。"},
  {id:"his143", cat:"日本史", sub:"近代", q:"1931年に関東軍が南満州鉄道の線路を爆破したことをきっかけに始まった軍事行動を何というか。", choices:["満州事変","日露戦争","日清戦争","盧溝橋事件"], a:0, e:"正解は「満州事変」です。満州事変は関東軍が南満州鉄道を爆破した柳条湖事件をきっかけに始まり、満州国建国につながりました。「日露戦争」は誤りで、これは1904〜1905年の戦争であり、満州事変（1931年）とは時代が異なります。「日清戦争」は誤りで、これは1894〜1895年の戦争であり、これも満州事変よりずっと前の出来事です。「盧溝橋事件」は誤りで、これは1937年に日中戦争のきっかけとなった別の事件であり、満州事変（柳条湖事件）とは場所も時期も異なります。"},
  {id:"his145", cat:"日本史", sub:"現代", q:"1941年、日本軍による奇襲攻撃をきっかけに太平洋戦争が始まった出来事はどれか。", choices:["ハワイの真珠湾攻撃","満州事変","日露戦争","盧溝橋事件"], a:0, e:"正解は「ハワイの真珠湾攻撃」です。1941年12月、日本海軍がハワイの真珠湾を奇襲攻撃したことをきっかけに太平洋戦争が始まりました。「満州事変」は誤りで、これは1931年の出来事であり、太平洋戦争開戦（1941年）より前です。「日露戦争」は誤りで、これは1904〜1905年の戦争であり、太平洋戦争とは全く別の時代の出来事です。「盧溝橋事件」は誤りで、これは1937年の日中戦争のきっかけとなった事件であり、太平洋戦争開戦のきっかけではありません。"},
  {id:"his147", cat:"日本史", sub:"現代", q:"1951年に結ばれ、日本が独立を回復するきっかけとなった条約はどれか。", choices:["サンフランシスコ平和条約","下関条約","ポーツマス条約","日米安全保障条約のみ"], a:0, e:"正解は「サンフランシスコ平和条約」です。サンフランシスコ平和条約は1951年に結ばれ、翌1952年の発効により日本は独立を回復しました。「下関条約」は誤りで、これは日清戦争の講和条約であり、日本の独立回復とは無関係な、19世紀末の条約です。「ポーツマス条約」は誤りで、これは日露戦争の講和条約です。「日米安全保障条約のみ」は誤りで、これはサンフランシスコ平和条約と同時期に結ばれた別の条約であり、独立回復そのものを定めた条約ではありません。"},
  {id:"his149", cat:"日本史", sub:"現代", q:"戦後、日本国憲法の制定を含む占領政策を主導した連合国の機関はどれか。", choices:["GHQ","国際連盟","国際連合","EU"], a:0, e:"正解は「GHQ」です。GHQ（連合国軍最高司令官総司令部）はマッカーサーを最高司令官として日本の占領政策を主導し、日本国憲法の制定にも大きく関わりました。「国際連盟」は誤りで、これは第一次世界大戦後に設立された組織であり、戦後の日本占領政策とは無関係です。「国際連合」は誤りで、国連は国際機関として存在していましたが、日本占領政策を直接主導したのはGHQです。「EU」は誤りで、これは1993年に発足したヨーロッパの組織であり、戦後直後の日本占領とは時代が全く異なります。"},
  {id:"his151", cat:"日本史", sub:"現代", q:"1993年に非自民連立政権が誕生し、長期にわたり続いてきた政治体制が終わったことを何というか。", choices:["55年体制の終焉","大正デモクラシー","明治維新","バブル崩壊"], a:0, e:"正解は「55年体制の終焉」です。1993年、非自民連立政権が誕生したことで、1955年以来続いた55年体制が終わりました。「大正デモクラシー」は誤りで、これは大正時代（1912〜1926年）の風潮であり、1993年の出来事とは時代が全く異なります。「明治維新」は誤りで、これは19世紀後半の一連の改革であり、1993年とは無関係です。「バブル崩壊」は誤りで、これは1990年代初めの経済的な出来事であり、政治体制の変化を指す55年体制終焉とは別の事柄です。"},
  {id:"his153", cat:"日本史", sub:"現代", q:"高度経済成長期に日本の家庭に普及した「三種の神器」に含まれないものはどれか。", choices:["白黒テレビ","洗濯機","冷蔵庫","スマートフォン"], a:3, e:"正解は「スマートフォン」です。高度経済成長期の「三種の神器」は白黒テレビ・洗濯機・冷蔵庫であり、スマートフォンはまだ存在していませんでした。「白黒テレビ」「洗濯機」「冷蔵庫」はいずれも誤り（正しい選択、つまり実際に三種の神器に含まれる）で、これらはまさに高度経済成長期に広く普及した家電製品です。"},
  {id:"his155", cat:"日本史", sub:"現代", q:"1980年代後半から1990年代初めにかけて起こったバブル経済についての説明として正しいものはどれか。", choices:["株価や地価が異常に高騰した状況","長期にわたる不況が続いた時期","戦後すぐの復興期の経済状況","第二次世界大戦前の経済状況"], a:0, e:"正解は「株価や地価が異常に高騰した状況」です。バブル経済は株価や地価が実体経済の水準を大きく超えて高騰した状態で、1990年代初めに崩壊しました。「長期にわたる不況が続いた時期」は誤りで、これはバブル崩壊「後」の状況（失われた10年など）であり、バブル経済そのものの説明ではありません。「戦後すぐの復興期の経済状況」は誤りで、これは1940年代後半の時期であり、バブル経済（1980年代後半〜1990年代初め）とは全く異なる時代です。「第二次世界大戦前の経済状況」は誤りで、これも1930年代以前の話であり、バブル経済とは時代がかけ離れています。"},
  /* 世界史 */
  {id:"wor101", cat:"世界史", sub:"古代・中世", q:"インダス文明が栄えた地域を流れる川はどれか。", choices:["インダス川","ナイル川","チグリス川","黄河"], a:0, e:"正解は「インダス川」です。インダス文明はインダス川流域で栄え、モヘンジョ・ダロなどの計画的な都市遺跡が発見されています。「ナイル川」は誤りで、これはエジプト文明が栄えた川です。「チグリス川」は誤りで、これはメソポタミア文明が栄えた川です。「黄河」は誤りで、これは中国文明が栄えた川であり、いずれもインダス文明が栄えたインダス川とは異なります。"},
  {id:"wor103", cat:"世界史", sub:"古代・中世", q:"紀元前221年、中国を初めて統一した秦の皇帝は誰か。", choices:["始皇帝","孔子","劉邦","項羽"], a:0, e:"正解は「始皇帝」です。始皇帝は紀元前221年に中国を初めて統一し、度量衡や文字の統一、万里の長城の建設などを行いました。「孔子」は誤りで、彼は儒教の祖とされる思想家であり、中国を統一した皇帝ではありません。「劉禁」は誤りで、彼は前漢を建国した人物であり、秦を統一した始皇帝より後の時代の人物です。「項羽」は誤りで、彼は秦末に活躍した武将であり、中国を統一した皇帝ではありません。"},
  {id:"wor105", cat:"世界史", sub:"古代・中世", q:"中国で万里の長城が築かれた主な目的として正しいものはどれか。", choices:["北方の遊牧民族の侵入を防ぐこと","南方との貿易を促進すること","農地の境界を区切ること","仏教を各地に広めること"], a:0, e:"正解は「北方の遊牧民族の侵入を防ぐこと」です。万里の長城は北方の遊牧民族（匈奴など）の侵入を防ぐ目的で、歴代の王朝によって築かれ増築されました。「南方との貿易を促進すること」は誤りで、万里の長城は防衛のための建造物であり、貿易促進を目的としたものではありません。「農地の境界を区切ること」は誤りで、万里の長城の規模と目的は国境防衛であり、単なる農地の区切りとは異なります。「仏教を各地に広めること」は誤りで、万里の長城は宗教とは無関係な軍事的建造物です。"},
  {id:"wor107", cat:"世界史", sub:"古代・中世", q:"古代ギリシャの哲学者で、「無知の知」を説いたことで知られる人物は誰か。", choices:["ソクラテス","アリストテレス","プラトン","ピタゴラス"], a:0, e:"正解は「ソクラテス」です。ソクラテスは自分が無知であることを自覚することの重要性、いわゆる「無知の知」を説きました。「アリストテレス」は誤りで、彼はソクラテスの孫弟子にあたる哲学者ですが、「無知の知」で特に知られるのはソクラテスです。「プラトン」は誤りで、彼はソクラテスの弟子ですが、「無知の知」の逸話で有名なのは師のソクラテスです。「ピタゴラス」は誤りで、彼は数学者・哲学者として知られますが、「無知の知」とは直接結びつきません。"},
  {id:"wor109", cat:"世界史", sub:"古代・中世", q:"アレクサンドロス大王が築いた帝国の広がりとして正しいものはどれか。", choices:["ギリシャから中央アジアまで広がった","ヨーロッパ全土にまで広がった","アメリカ大陸にまで広がった","日本列島にまで広がった"], a:0, e:"正解は「ギリシャから中央アジアまで広がった」です。アレクサンドロス大王はギリシャからペルシャ、中央アジア、インド西部にまで至る大帝国を築きました。「ヨーロッパ全土にまで広がった」は誤りで、彼の帝国はヨーロッパ全域ではなく、主に東方（アジア方面）へ拡大したものです。「アメリカ大陸にまで広がった」は誤りで、当時のヨーロッパ人はアメリカ大陸の存在自体を知りませんでした。「日本列島にまで広がった」は誤りで、アレクサンドロス大王の遠征は中央アジア・インド西部までであり、東アジアには及んでいません。"},
  {id:"wor111", cat:"世界史", sub:"古代・中世", q:"西ローマ帝国滅亡後も約1000年間存続した、コンスタンティノープルを首都とする帝国はどれか。", choices:["ビザンツ帝国（東ローマ帝国）","神聖ローマ帝国","オスマン帝国","フランク王国"], a:0, e:"正解は「ビザンツ帝国（東ローマ帝国）」です。ビザンツ帝国（東ローマ帝国）は西ローマ帝国滅亡後も1453年まで約1000年間存続しました。「神聖ローマ帝国」は誤りで、これは中世に成立したドイツを中心とする別の帝国であり、コンスタンティノープルを首都としていません。「オスマン帝国」は誤りで、これはビザンツ帝国を滅ぼしてコンスタンティノープルを占領した、別のイスラム系の帝国です。「フランク王国」は誤りで、これは西ヨーロッパに成立したゲルマン系の王国であり、コンスタンティノープルとは無関係です。"},
  {id:"wor113", cat:"世界史", sub:"ヨーロッパ史", q:"マゼランの艦隊による世界周航（1519-1522年）が実証したこととして正しいものはどれか。", choices:["地球が球体であること","地球が平らであること","太陽が地球の周りを回っていること","アメリカ大陸が存在しないこと"], a:0, e:"正解は「地球が球体であること」です。マゼラン艦隊による世界周航の成功は、地球が球体であることを実際の航海によって証明しました。「地球が平らであること」は誤りで、これは世界周航の成功が証明した内容とは正反対です。「太陽が地球の周りを回っていること」は誤りで、これは天動説の内容であり、マゼランの航海が示したこととは異なります。「アメリカ大陸が存在しないこと」は誤りで、マゼランの航海はむしろアメリカ大陸の存在を経由地として前提としており、その不存在を証明したわけではありません。"},
  {id:"wor115", cat:"世界史", sub:"ヨーロッパ史", q:"理性を重んじ、封建的な制度や旧来の考え方を批判した18世紀ヨーロッパの思想を何というか。", choices:["啓蒙思想","国風文化","封建思想","重商主義"], a:0, e:"正解は「啓蒙思想」です。啓蒙思想は理性を重視し、封建的な身分制度や絶対王政を批判した18世紀ヨーロッパの思想潮流です。「国風文化」は誤りで、これは平安時代の日本の文化を指す言葉であり、ヨーロッパの思想とは無関係です。「封建思想」は誤りで、これは啓蒙思想がまさに批判した対象であり、啓蒙思想そのものではありません。「重商主義」は誤りで、これは絶対王政期の経済政策であり、啓蒙思想（政治・社会思想）とは異なる分野です。"},
  {id:"wor117", cat:"世界史", sub:"ヨーロッパ史", q:"モンテスキューが著書「法の精神」で主張した、権力を複数の機関に分ける理論は何か。", choices:["三権分立","社会契約説","唯物史観","進化論"], a:0, e:"正解は「三権分立」です。モンテスキューは「法の精神」の中で、権力の集中を防ぐために立法・行政・司法を分ける三権分立を主張しました。「社会契約説」は誤りで、これはロックやルソーらが唱えた別の政治思想であり、モンテスキューの主張とは異なります。「唯物史観」は誤りで、これはマルクスが唱えた歴史観であり、モンテスキューとは時代も思想も異なります。「進化論」は誤りで、これはダーウィンが唱えた生物学上の理論であり、政治思想とは全く異なる分野です。"},
  {id:"wor119", cat:"世界史", sub:"ヨーロッパ史", q:"フランス人権宣言（1789年）についての説明として正しいものはどれか。", choices:["人間の自由・平等・国民主権などをうたった宣言である","絶対王政を擁護するための宣言である","身分制度の維持を主張する宣言である","植民地支配を正当化するための宣言である"], a:0, e:"正解は「人間の自由・平等・国民主権などをうたった宣言である」です。フランス人権宣言はフランス革命の際に発表され、人間の自由・平等・国民主権などの近代的な理念を示しました。「絶対王政を擁護するための宣言である」は誤りで、人権宣言はむしろ絶対王政を批判し、それを打倒する革命の中で発表されたものです。「身分制度の維持を主張する宣言である」は誤りで、人権宣言は身分制度の否定・平等の理念を掲げるものです。「植民地支配を正当化するための宣言である」は誤りで、人権宣言は国内の政治体制に関する宣言であり、植民地支配の正当化を目的としたものではありません。"},
  {id:"wor121", cat:"世界史", sub:"ヨーロッパ史", q:"1919年、第一次世界大戦後のドイツで制定された、当時としては先進的とされた憲法は何か。", choices:["ワイマール憲法","大日本帝国憲法","権利章典","マグナ・カルタ"], a:0, e:"正解は「ワイマール憲法」です。ワイマール憲法は第一次世界大戦後のドイツで制定され、社会権を保障するなど当時最も民主的な憲法とされました。「大日本帝国憲法」は誤りで、これは日本で1889年に発布された憲法であり、ドイツのワイマール憲法とは国が異なります。「権利章典」は誤りで、これは1689年にイギリスで制定された文書であり、時代も国も異なります。「マグナ・カルタ」は誤りで、これは1215年にイギリスで制定された文書であり、ワイマール憲法（1919年）とは大きく時代が異なります。"},
  {id:"wor123", cat:"世界史", sub:"両大戦期", q:"第一次世界大戦の直接のきっかけとなった、オーストリア皇太子夫妻が暗殺された事件は何か。", choices:["サラエボ事件","真珠湾攻撃","ベルリンの壁建設","キューバ危機"], a:0, e:"正解は「サラエボ事件」です。1914年に起こったサラエボ事件（オーストリア皇太子夫妻の暗殺）が第一次世界大戦の直接のきっかけとなりました。「真珠湾攻撃」は誤りで、これは1941年、太平洋戦争開戦のきっかけとなった出来事であり、第一次世界大戦とは無関係です。「ベルリンの壁建設」は誤りで、これは1961年の冷戦期の出来事です。「キューバ危機」は誤りで、これは1962年の冷戦期の出来事であり、いずれも第一次世界大戦（1914年）とは時代が大きく異なります。"},
  {id:"wor125", cat:"世界史", sub:"両大戦期", q:"第二次世界大戦中、日本・ドイツ・イタリアの間で結ばれた軍事同盟を何というか。", choices:["日独伊三国同盟","三国協商","ワルシャワ条約機構","北大西洋条約機構"], a:0, e:"正解は「日独伊三国同盟」です。日独伊三国同盟（1940年）は日本・ドイツ・イタリアの間で結ばれた軍事同盟です。「三国協商」は誤りで、これは第一次世界大戦前にイギリス・フランス・ロシアの間で結ばれた協力関係であり、日独伊三国同盟とは加盟国も時代も異なります。「ワルシャワ条約機構」は誤りで、これは冷戦下でソ連を中心とする社会主義陣営が結成した軍事同盟です。「北大西洋条約機構」は誤りで、これは冷戦下でアメリカを中心とする資本主義陣営が結成した軍事同盟であり、いずれも第二次世界大戦中の日独伊三国同盟とは異なります。"},
  {id:"wor127", cat:"世界史", sub:"両大戦期", q:"1945年、第二次世界大戦末期に連合国の首脳が戦後処理について話し合った会談は何か。", choices:["ヤルタ会談","サラエボ事件","ウィーン会議","バンドン会議"], a:0, e:"正解は「ヤルタ会談」です。ヤルタ会談（1945年）は米英ソの首脳が第二次世界大戦後の国際秩序について話し合った会談です。「サラエボ事件」は誤りで、これは1914年に第一次世界大戦のきっかけとなった暗殺事件であり、会談ではありません。「ウィーン会議」は誤りで、これは19世紀初頭のナポレオン戦争後の会議です。「バンドン会議」は誤りで、これは1955年のアジア・アフリカ諸国による会議であり、いずれもヤルタ会談（1945年）とは時代や主体が異なります。"},
  {id:"wor129", cat:"世界史", sub:"現代", q:"1950年に始まり、朝鮮半島の南北分断が固定化される契機となった戦争は何か。", choices:["朝鮮戦争","ベトナム戦争","湾岸戦争","日露戦争"], a:0, e:"正解は「朝鮮戦争」です。朝鮮戦争（1950-1953年）は南北朝鮮の分断を固定化する契機となりました。「ベトナム戦争」は誤りで、これは東南アジアのベトナムで戦われた別の戦争であり、朝鮮半島の分断とは無関係です。「湾岸戦争」は誤りで、これは1991年に中東で起こった戦争です。「日露戦争」は誤りで、これは1904〜1905年に日本とロシアの間で戦われた戦争であり、いずれも朝鮮戦争（1950年開始）とは時代や当事国が異なります。"},
  {id:"wor131", cat:"世界史", sub:"現代", q:"アメリカが介入し、南北ベトナムの間で戦われた戦争についての説明として正しいものはどれか。", choices:["冷戦下でアメリカが介入した戦争","フランスとドイツの戦争である","中東で起こった戦争である","第一次世界大戦の一部である"], a:0, e:"正解は「冷戦下でアメリカが介入した戦争である」です。ベトナム戦争は冷戦構造のもと、アメリカが南ベトナムを支援して介入した戦争です。「フランスとドイツの戦争である」は誤りで、これはベトナム戦争とは全く異なる組み合わせの戦争であり、事実に反します。「中東で起こった戦争である」は誤りで、ベトナム戦争は東南アジアのベトナムで起こった戦争であり、中東とは地域が異なります。「第一次世界大戦の一部である」は誤りで、ベトナム戦争は20世紀後半（1960〜70年代）の出来事であり、第一次世界大戦（1914〜1918年）とは時代が大きく異なります。"},
  {id:"wor133", cat:"世界史", sub:"現代", q:"南アフリカで行われていた、人種によって権利や居住地を分ける差別政策を何というか。", choices:["アパルトヘイト","ホロコースト","ジェノサイド","レジスタンス"], a:0, e:"正解は「アパルトヘイト」です。アパルトヘイトは南アフリカで長年行われていた、人種による差別・隔離政策です。「ホロコースト」は誤りで、これはナチス・ドイツによるユダヤ人大量虐殺を指す言葉であり、南アフリカの人種隔離政策とは異なる出来事です。「ジェノサイド」は誤りで、これは特定の集団の計画的な大量虐殺を指す一般的な用語であり、アパルトヘイトそのものを指す固有名詞ではありません。「レジスタンス」は誤りで、これは占領や支配に対する抵抗運動を指す言葉であり、差別政策そのものを指す言葉ではありません。"},
  {id:"wor135", cat:"世界史", sub:"現代", q:"アパルトヘイト撤廃に尽力し、南アフリカ初の黒人大統領となった人物は誰か。", choices:["ネルソン・マンデラ","マハトマ・ガンディー","マーティン・ルーサー・キング","レーニン"], a:0, e:"正解は「ネルソン・マンデラ」です。ネルソン・マンデラは長年の獄中生活の後、アパルトヘイト撤廃に尽力し、南アフリカ初の黒人大統領となりました。「マハトマ・ガンディー」は誤りで、彼はインド独立運動を指導した人物であり、南アフリカの大統領ではありません。「マーティン・ルーサー・キング」は誤りで、彼はアメリカの公民権運動を指導した人物であり、南アフリカとは別の国の運動を率いました。「レーニン」は誤りで、彼はロシア革命を指導した人物であり、アパルトヘイト撤廃とは無関係です。"},
  {id:"wor137", cat:"世界史", sub:"現代", q:"1990年、イラクによるクウェート侵攻をきっかけに翌年始まった戦争は何か。", choices:["湾岸戦争","イラン・イラク戦争","朝鮮戦争","ベトナム戦争"], a:0, e:"正解は「湾岸戦争」です。湾岸戦争（1991年）はイラクによるクウェート侵攻をきっかけに、多国籍軍がイラクを攻撃した戦争です。「イラン・イラク戦争」は誤りで、これは1980年代にイランとイラクの間で戦われた別の戦争です。「朝鮮戦争」は誤りで、これは1950年に始まった、朝鮮半島での戦争であり、湾岸戦争とは地域も時代も異なります。「ベトナム戦争」は誤りで、これも湾岸戦争とは別の地域・時代の戦争です。"},
  {id:"wor141", cat:"世界史", sub:"現代", q:"中国が経済成長を目指し、1970年代末から鄧小平のもとで進めた政策は何と呼ばれるか。", choices:["改革開放政策","文化大革命","大躍進政策","一人っ子政策"], a:0, e:"正解は「改革開放政策」です。改革開放政策は鄧小平のもとで1970年代末から進められた、市場経済の導入と対外開放を進める政策です。「文化大革命」は誤りで、これは1960年代に毛沢東が主導した政治運動であり、改革開放とは正反対の、経済発展を停滞させた出来事です。「大躍進政策」は誤りで、これも毛沢東主導の1950年代末の経済政策であり、深刻な失敗に終わりました。「一人っ子政策」は誤りで、これは人口抑制のための政策であり、経済成長を目指す改革開放政策とは目的が異なります。"},
  {id:"wor143", cat:"世界史", sub:"ヨーロッパ史", q:"産業革命期のイギリスで発明された、繊維の大量生産を可能にした機械の動力源は何か。", choices:["蒸気機関","電気モーター","水力のみ","太陽光"], a:0, e:"正解は「蒸気機関」です。ジェームズ・ワットが改良した蒸気機関は紡績機などの動力源として利用され、産業革命を大きく進展させました。「電気モーター」は誤りで、電気モーターの実用化は蒸気機関よりも後の19世紀後半以降の技術です。「水力のみ」は誤りで、水力は産業革命初期に一部利用されましたが、産業革命を象徴する動力源は蒸気機関です。「太陽光」は誤りで、太陽光発電は現代の技術であり、産業革命期には存在しません。"},
  {id:"wor145", cat:"世界史", sub:"現代", q:"東西冷戦下で、資本主義陣営の軍事同盟として1949年に結成された組織はどれか。", choices:["NATO（北大西洋条約機構）","ワルシャワ条約機構","コミンフォルム","ASEAN"], a:0, e:"正解は「NATO（北大西洋条約機構）」です。NATO（北大西洋条約機構）は冷戦下でアメリカを中心とする資本主義陣営の軍事同盟として結成されました。「ワルシャワ条約機構」は誤りで、これはNATOに対抗してソ連を中心とする社会主義陣営が結成した軍事同盟であり、陣営が逆です。「コミンフォルム」は誤りで、これは共産主義政党間の情報交換のための組織であり、軍事同盟ではありません。「ASEAN」は誤りで、これは東南アジア諸国自身による地域協力機構であり、冷戦下の資本主義陣営の軍事同盟とは性格が異なります。"},
  {id:"wor147", cat:"世界史", sub:"現代", q:"1955年にインドネシアのバンドンで開かれ、植民地支配から独立した国々の連帯を確認した会議を何というか。", choices:["バンドン会議","ヤルタ会談","ポツダム会談","ウィーン会議"], a:0, e:"正解は「バンドン会議（アジア・アフリカ会議）」です。バンドン会議はアジア・アフリカの新興独立国が集まり、平和共存や連帯を確認した会議です。「ヤルタ会談」は誤りで、これは1945年に米英ソの首脳が開いた会談であり、新興独立国の会議ではありません。「ポツダム会談」も誤りで、同様に連合国首脳による会談です。「ウィーン会議」は誤りで、これは19世紀初頭のヨーロッパの秩序再編に関する会議であり、いずれもバンドン会議（1955年）とは時代・参加国が異なります。"},
  {id:"wor149", cat:"世界史", sub:"アジア史", q:"1917年のロシア革命でソビエト政権を樹立した中心人物は誰か。", choices:["レーニン","スターリン","ニコライ2世","ゴルバチョフ"], a:0, e:"正解は「レーニン」です。レーニンはロシア革命を指導し、世界初の社会主義国家であるソビエト政権を樹立しました。「スターリン」は誤りで、彼はレーニンの後継者として権力を握った人物であり、1917年の革命そのものを指導したのはレーニンです。「ニコライ2世」は誤りで、彼はロシア革命で打倒された最後の皇帝であり、革命を指導した側ではなく倒された側の人物です。「ゴルバチョフ」は誤りで、彼は1980年代にソ連の書記長を務めた人物であり、1917年の革命とは時代が大きく異なります。"},
  /* 地理 */
  {id:"geo99", cat:"地理", sub:"日本地理", q:"川が山地から平地に出るところに土砂が堆積してできる、扇形の地形を何というか。", choices:["扇状地","三角州","カルデラ","盆地"], a:0, e:"正解は「扇状地」です。扇状地は川が山地から平地に出る場所で流れが緩やかになり、運んできた土砂が扇形に堆積してできる地形です。「三角州」は誤りで、これは川が海や湖に流れ込む河口付近にできる地形であり、山地の出口にできる扇状地とは場所が異なります。「カルデラ」は誤りで、これは火山の噴火によってできるくぼ地であり、川の堆積作用による地形ではありません。「盆地」は誤りで、これは周囲を山に囲まれた低地を指す一般的な地形の用語であり、扇形という特徴的な形を指すものではありません。"},
  {id:"geo101", cat:"地理", sub:"日本地理", q:"川が海や湖に流れ込む河口付近に、土砂が堆積してできる平らな地形を何というか。", choices:["三角州","扇状地","カルデラ","台地"], a:0, e:"正解は「三角州」です。三角州は川が海や湖に流れ込む場所で、細かい土砂が堆積してできる平らな地形です。「扇状地」は誤りで、これは川が山地から平地に出る場所にできる地形であり、河口付近の三角州とは位置が異なります。「カルデラ」は誤りで、これは火山活動による地形であり、川の堆積とは無関係です。「台地」は誤りで、これは周囲より一段高い平坦な地形を指す言葉であり、河口付近の低平な三角州とは特徴が異なります。"},
  {id:"geo103", cat:"地理", sub:"日本地理", q:"火山の大規模な噴火などによってできる、大きなくぼ地を何というか。", choices:["カルデラ","三角州","扇状地","リアス海岸"], a:0, e:"正解は「カルデラ」です。カルデラは火山の噴火によって山頂部が陥没してできる、大きなくぼ地状の地形です。「三角州」は誤りで、これは川の堆積作用による地形であり、火山活動とは無関係です。「扇状地」も誤りで、同じく川の作用による地形です。「リアス海岸」は誤りで、これは山地が海に沈み込んでできる海岸地形であり、火山の噴火によるくぼ地とは成因が異なります。"},
  {id:"geo105", cat:"地理", sub:"日本地理", q:"日本列島を東西に分ける大きな溝状の地形を何というか。", choices:["フォッサマグナ","フィヨルド","カルデラ","扇状地"], a:0, e:"正解は「フォッサマグナ」です。フォッサマグナは日本列島の中央部を南北に走る、地質構造上の大きな溝状の地形です。「フィヨルド」は誤りで、これは氷河が作る海岸地形であり、日本列島を分ける溝状の地形とは全く異なる概念です。「カルデラ」は誤りで、これは火山の噴火によるくぼ地であり、日本列島を東西に分ける地形ではありません。「扇状地」は誤りで、これは川の堆積作用による小規模な地形であり、日本列島規模の大きな溝ではありません。"},
  {id:"geo107", cat:"地理", sub:"日本地理", q:"瀬戸内海沿岸で年間降水量が少ない理由として正しいものはどれか。", choices:["山地に季節風がさえぎられるため","一年中雪が降り続けるため","台風が毎年直撃するため","冬でも高温が続くため"], a:0, e:"正解は「山地に季節風がさえぎられるため」です。瀬戸内海沿岸は中国山地と四国山地に挟まれ、南北からの季節風がさえぎられるため、年間を通じて降水量が少ない気候となっています。「一年中雪が降り続けるため」は誤りで、瀬戸内海沿岸は温暖で雪の少ない地域として知られ、事実と反します。「台風が毎年直撃するため」は誤りで、これは降水量が少ないこととは逆の状況を示す内容であり、瀬戸内海沿岸の特徴とは合いません。「冬でも高温が続くため」は誤りで、これは降水量の少なさの理由としては不適切で、気温の高さと降水量の少なさは直接の因果関係にありません。"},
  {id:"geo109", cat:"地理", sub:"日本地理", q:"三大都市圏以外で日本国内に置かれている政令指定都市の例として正しいものはどれか。", choices:["福岡市","那覇市","水戸市","甲府市"], a:0, e:"正解は「福岡市」です。福岡市は三大都市圏に含まれませんが、人口規模の大きさから政令指定都市に指定されています。「那覇市」は誤りで、那覇市は沖縄県の県庁所在地ですが、政令指定都市には指定されていません。「水戸市」は誤りで、水戸市は茨城県の県庁所在地ですが、これも政令指定都市ではありません。「甲府市」は誤りで、甲府市は山梨県の県庁所在地ですが、人口規模の関係で政令指定都市には指定されていません。"},
  {id:"geo111", cat:"地理", sub:"日本地理", q:"日本のエネルギー自給率についての説明として正しいものはどれか。", choices:["多くを輸入に頼り自給率が低い","ほぼ100%を国内でまかなう","石炭のみで自給できている","原子力のみで自給できている"], a:0, e:"正解は「多くを海外からの輸入に頼っており自給率は低い水準にある」です。日本は石油・天然ガスなど多くのエネルギー資源を輸入に頼っており、エネルギー自給率は低い水準にあります。「ほぼ100%を国内でまかなっている」は誤りで、事実とは正反対であり、日本のエネルギー自給率は主要国の中でも低い部類に入ります。「石炭のみで自給できている」は誤りで、日本国内の石炭生産はごくわずかであり、多くを輸入に頼っています。「原子力発電のみで自給できている」は誤りで、原子力発電の燃料であるウランも輸入に頼っており、「自給」とはいえません。"},
  {id:"geo113", cat:"地理", sub:"日本地理", q:"卵から稚魚まで人の手で育ててから海や川に放流し、自然の中で成長させてから漁獲する漁業を何というか。", choices:["栽培漁業","遠洋漁業","沖合漁業","沿岸漁業のみ"], a:0, e:"正解は「栽培漁業」です。栽培漁業は卵から稚魚までを人工的に育てて放流し、自然の中で成長させてから漁獲する漁業です。「遠洋漁業」は誤りで、これは遠い海域まで出て行う漁業の形態を指す言葉であり、稚魚の放流とは異なる概念です。「沖合漁業」は誤りで、これも漁を行う海域による分類であり、栽培漁業のような育成・放流の仕組みとは異なります。「沿岸漁業のみ」は誤りで、これも操業海域による分類であり、栽培漁業の定義そのものとは異なる概念です。"},
  {id:"geo115", cat:"地理", sub:"日本地理", q:"日本各地で伝統的工芸品が発達してきた背景として正しいものはどれか。", choices:["各地域の気候や原材料を生かして独自に発展してきた","すべて政府の指示で画一的に発展した","海外から輸入された技術のみで発展した","近年になって初めて生まれたものである"], a:0, e:"正解は「各地域の気候や原材料を生かして独自に発展してきた」です。日本の伝統的工芸品は、各地域の気候風土や入手できる原材料を生かして、長い年月をかけて発展してきました。「すべて政府の指示で画一的に発展した」は誤りで、伝統的工芸品は各地域が独自に育んできたものであり、政府の一律の指示によるものではありません。「海外から輸入された技術のみで発展した」は誤りで、多くの伝統的工芸品は日本国内で独自に発展した技術にもとづいています。「近年になって初めて生まれたものである」は誤りで、伝統的工芸品の多くは古くからの歴史を持ち、近年に初めて生まれたものではありません。"},
  {id:"geo117", cat:"地理", sub:"世界地理", q:"地球温暖化の主な原因として考えられているものは何か。", choices:["二酸化炭素などの温室効果ガスの増加","オゾン層の破壊のみ","火山活動の減少","太陽の活動が弱まったこと"], a:0, e:"正解は「二酸化炭素などの温室効果ガスの増加」です。化石燃料の大量消費などによる二酸化炭素をはじめとする温室効果ガスの増加が、地球温暖化の主な原因と考えられています。「オゾン層の破壊のみ」は誤りで、オゾン層破壊は別の環境問題（有害紫外線の増加など）に関連するものであり、地球温暖化の主原因とは区別されます。「火山活動の減少」は誤りで、火山活動と地球温暖化の関係は逆で、火山活動そのものが減少したことが温暖化の原因とはされていません。「太陽の活動が弱まったこと」は誤りで、これは一部の仮説にすぎず、現在では温室効果ガスの増加が主な原因と広く認識されています。"},
  {id:"geo119", cat:"地理", sub:"世界地理", q:"世界の気候帯のうち、一年を通じて気温が非常に低く、樹木がほとんど育たない気候帯はどれか。", choices:["寒帯","熱帯","温帯","乾燥帯"], a:0, e:"正解は「寒帯」です。寒帯は一年を通じて気温が非常に低く、樹木が育たないツンドラや氷雪に覆われた地域が広がっています。「熱帯」は誤りで、これは一年中高温な気候帯であり、寒帯とは正反対の特徴を持ちます。「温帯」は誤りで、これは四季の変化がある気候帯であり、一年中極寒というわけではありません。「乾燥帯」は誤りで、これは降水量の少なさが特徴の気候帯であり、気温の低さを主な特徴とする寒帯とは異なる分類軸です。"},
  {id:"geo121", cat:"地理", sub:"世界地理", q:"雨季と乾季がはっきり分かれる、熱帯地域に分布する気候を何というか。", choices:["サバナ気候","熱帯雨林気候","地中海性気候","西岸海洋性気候"], a:0, e:"正解は「サバナ気候」です。サバナ気候は雨季と乾季がはっきり分かれる熱帯の気候で、丈の長い草原にまばらな樹木が生える景観が特徴です。「熱帯雨林気候」は誤りで、これは一年中高温多雨で雨季・乾季の区別が明瞭でない気候であり、サバナ気候とは降水パターンが異なります。「地中海性気候」は誤りで、これは温帯に属し、夏に乾燥し冬に雨が多い気候であり、熱帯のサバナ気候とは緯度帯が異なります。「西岸海洋性気候」は誤りで、これも温帯の気候であり、熱帯のサバナ気候とは異なります。"},
  {id:"geo123", cat:"地理", sub:"世界地理", q:"丈の短い草原が広がる、乾燥帯に分布する気候を何というか。", choices:["ステップ気候","熱帯雨林気候","氷雪気候","地中海性気候"], a:0, e:"正解は「ステップ気候」です。ステップ気候は砂漠気候の周辺に分布し、丈の短い草原（ステップ）が広がる乾燥帯の気候です。「熱帯雨林気候」は誤りで、これは高温多雨な熱帯の気候であり、乾燥帯のステップ気候とは正反対の降水量を持ちます。「氷雪気候」は誤りで、これは一年中氷雪に覆われる寒帯の気候であり、草原が広がるステップ気候とは全く異なります。「地中海性気候」は誤りで、これは温帯に属する気候であり、乾燥帯のステップ気候とは気候帯の分類が異なります。"},
  {id:"geo125", cat:"地理", sub:"世界地理", q:"石油の産出量が特に多いことで知られる地域はどこか。", choices:["中東（ペルシャ湾岸）","北欧","南極大陸","オセアニアの島々"], a:0, e:"正解は「中東（ペルシャ湾岸）」です。中東（ペルシャ湾岸）は世界有数の石油産出地域であり、多くの産油国が集中しています。「北欧」は誤りで、北欧は石油産出よりも水産業や高福祉国家として知られ、世界的な産油地域ではありません。「南極大陸」は誤りで、南極は国際条約により資源開発が制限されており、石油産出地域ではありません。「オセアニアの島々」は誤りで、これらの地域は石油産出量が特に多いことでは知られていません。"},
  {id:"geo127", cat:"地理", sub:"世界地理", q:"埋蔵量が少なく、先端技術産業に不可欠な希少金属を総称して何というか。", choices:["レアメタル","貴金属のみ","化石燃料","バイオマス"], a:0, e:"正解は「レアメタル」です。レアメタルは埋蔵量が少なく、電子機器などの製造に不可欠な希少金属の総称です。「貴金属のみ」は誤りで、貴金属（金や銀など）はレアメタルの一部と重なることもありますが、レアメタルはより広く先端技術に使われる希少金属全般を指します。「化石燃料」は誤りで、これは石油や石炭などのエネルギー資源を指す言葉であり、金属資源であるレアメタルとは異なります。「バイオマス」は誤りで、これは生物由来の再生可能なエネルギー資源を指す言葉であり、鉱物資源であるレアメタルとは全く異なる概念です。"},
  {id:"geo129", cat:"地理", sub:"世界地理", q:"発展途上国の生産者に公正な対価を支払うことを目指す貿易の仕組みを何というか。", choices:["フェアトレード","フリートレード","プランテーション","モノカルチャー"], a:0, e:"正解は「フェアトレード」です。フェアトレードは発展途上国の生産者や労働者に公正な対価を支払うことを目指す貿易の仕組みです。「フリートレード」は誤りで、これは自由貿易を意味する言葉であり、公正な対価の支払いを目的とするフェアトレードとは異なる概念です。「プランテーション」は誤りで、これは熱帯地域での大規模な単一作物栽培の農業形態を指す言葉であり、貿易の仕組みではありません。「モノカルチャー」は誤りで、これは特定の一次産品に依存する経済構造を指す言葉であり、フェアトレードとは異なる概念です。"},
  {id:"geo131", cat:"地理", sub:"世界地理", q:"ユネスコの世界遺産の分類に含まれないものはどれか。", choices:["文化遺産","自然遺産","複合遺産","経済遺産"], a:3, e:"正解は「経済遺産」です。世界遺産は文化遺産・自然遺産・複合遺産の3つに分類され、「経済遺産」という分類は存在しません。「文化遺産」「自然遺産」「複合遺産」はいずれも誤り（正しい選択、つまり実際に世界遺産の分類に含まれる）で、これら三つがまさにユネスコの世界遺産の分類です。"},
  {id:"geo133", cat:"地理", sub:"日本地理", q:"日本の世界自然遺産に含まれないものはどれか。", choices:["屋久島","白神山地","知床","富士山"], a:3, e:"正解は「富士山」です。富士山は世界文化遺産として登録されており、世界自然遺産には登録されていません。「屋久島」「白神山地」「知床」はいずれも誤り（正しい選択、つまり実際に日本の世界自然遺産に含まれる）で、これらはまさに日本の世界自然遺産として登録されている場所です。"},
  {id:"geo135", cat:"地理", sub:"日本地理", q:"特定の地域に人口が過度に集中する現象を何というか。", choices:["過密","過疎","高齢化","少子化"], a:0, e:"正解は「過密」です。過密は都市部などの特定の地域に人口が過度に集中し、住宅不足や交通渋滞などの問題を引き起こす現象です。「過疎」は誤りで、これは過密とは逆に、人口が減少しすぎる地方の現象を指します。「高齢化」は誤りで、これは人口に占める高齢者の割合が高まる現象であり、地域への人口集中を指す過密とは異なる概念です。「少子化」は誤りで、これは出生率の低下を指す現象であり、過密とは異なる人口動態上の問題です。"},
  {id:"geo137", cat:"地理", sub:"日本地理", q:"都心部の人口が減少し、郊外の人口が増加する現象を何というか。", choices:["ドーナツ化現象","過疎化","スプロール化のみ","逆都市化のみ"], a:0, e:"正解は「ドーナツ化現象」です。ドーナツ化現象は地価の高騰などにより都心部の人口が減少し、郊外の人口が増加する現象です。「過疎化」は誤りで、これは地方全体の人口減少を指す言葉であり、都心と郊外という都市内部の人口移動を指すドーナツ化現象とは異なります。「スプロール化のみ」は誤りで、これは市街地が無秩序に拡大していく土地利用の現象であり、人口移動そのものを指すドーナツ化現象とは着目点が異なります。「逆都市化のみ」は誤りで、これはより広範囲な都市から地方への人口移動を指す概念であり、都心と郊外という狭い範囲での移動を指すドーナツ化現象とはやや異なります。"},
  {id:"geo139", cat:"地理", sub:"世界地理", q:"地下のプレートの動きによって引き起こされる自然災害はどれか。", choices:["地震","台風","豪雪","干ばつ"], a:0, e:"正解は「地震」です。地震は地下のプレートの動きによって地殻にひずみが蓄積し、それが解放されることで発生します。「台風」は誤りで、これは気象現象であり、海上の熱帯低気圧が発達したものであって、プレートの動きとは無関係です。「豪雪」も誤りで、これも気象現象であり、地下のプレートの動きとは関係ありません。「干ばつ」も誤りで、これは降水不足による気象・気候上の現象であり、地下のプレート運動とは無関係です。"},
  {id:"geo141", cat:"地理", sub:"日本地理", q:"自然災害が発生した場合の被害予測範囲や避難場所などを示した地図を何というか。", choices:["ハザードマップ","地形図のみ","路線図","気候図のみ"], a:0, e:"正解は「ハザードマップ」です。ハザードマップは洪水や地震などの自然災害が発生した場合の被害予測範囲や避難場所を示した地図です。「地形図のみ」は誤りで、地形図は土地の高低や地物を示す一般的な地図であり、災害の被害予測に特化したものではありません。「路線図」は誤りで、これは鉄道やバスなどの交通経路を示す地図であり、災害予測とは無関係です。「気候図のみ」は誤りで、これは気温や降水量など気候の特徴を示す地図であり、災害の被害予測範囲を示すハザードマップとは目的が異なります。"},
  {id:"geo143", cat:"地理", sub:"世界地理", q:"日本で近年導入が進められている、太陽光発電や風力発電などのエネルギーを総称して何というか。", choices:["再生可能エネルギー","化石燃料","原子力エネルギーのみ","バイオ燃料のみ"], a:0, e:"正解は「再生可能エネルギー」です。太陽光発電や風力発電などは、資源が枯渇せず繰り返し利用できる再生可能エネルギーに分類されます。「化石燃料」は誤りで、これは石油や石炭など、太陽光や風力とは異なる、有限で枯渇する資源を指す言葉です。「原子力エネルギーのみ」は誤りで、原子力はウランという資源を利用するものであり、太陽光や風力とは異なるエネルギー源に分類されます。「バイオ燃料のみ」は誤りで、バイオ燃料は生物由来の燃料であり、太陽光発電や風力発電とは異なる種類の再生可能エネルギーです。"},
  {id:"geo145", cat:"地理", sub:"世界地理", q:"2030年までの達成を目指し、国連が定めた17の目標からなる国際的な取り組みを何というか。", choices:["SDGs","ODA","NGO","TPP"], a:0, e:"正解は「SDGs（持続可能な開発目標）」です。SDGs（持続可能な開発目標）は貧困の解消や環境保護など、2030年までの達成を目指す国連が定めた17の目標です。「ODA」は誤りで、これは政府開発援助を指す略称であり、17の目標を定めたSDGsとは異なる概念です。「NGO」は誤りで、これは非政府組織を指す略称であり、目標の体系を示すSDGsとは異なります。「TPP」は誤りで、これは環太平洋パートナーシップ協定という貿易協定の略称であり、SDGsとは全く異なる分野の枠組みです。"},
  {id:"geo147", cat:"地理", sub:"世界地理", q:"排他的経済水域の外側に広がり、どの国の主権にも属さず航行や漁業が自由に行える海域を何というか。", choices:["公海","領海","接続水域","内水"], a:0, e:"正解は「公海」です。公海はどの国の主権にも属さず、航行や漁業などが自由に行える海域です。「領海」は誤りで、これは沿岸国の主権が及ぶ海域であり、排他的経済水域の外側に広がる公海とは正反対の性質を持ちます。「接続水域」は誤りで、これは領海に隣接する、沿岸国が一定の規制権を持つ海域であり、完全に自由な公海とは異なります。「内水」は誤りで、これは陸地に囲まれた国内の水域を指し、外洋に広がる公海とは全く異なる概念です。"},
  /* 公民 */
  {id:"civ99", cat:"公民", sub:"政治体制", q:"日本国憲法に定められた国民の三大義務に含まれないものはどれか。", choices:["納税の義務","勤労の義務","子女に普通教育を受けさせる義務","選挙に行く義務"], a:3, e:"正解は「選挙に行く義務」です。国民の三大義務は納税・勤労・子女に普通教育を受けさせる義務であり、「選挙に行く義務」は法的義務ではありません。「納税の義務」「勤労の義務」「子女に普通教育を受けさせる義務」はいずれも誤り（正しい選択、つまり実際に三大義務に含まれる）で、これら三つがまさに憲法に定められた国民の三大義務です。"},
  {id:"civ101", cat:"公民", sub:"政治体制", q:"国や地方公共団体に要望を伝える権利である請願権についての説明として正しいものはどれか。", choices:["国や地方公共団体に要望を伝える権利である","裁判を受ける権利である","財産を所有する権利である","職業を自由に選択する権利である"], a:0, e:"正解は「国や地方公共団体に要望を伝える権利である」です。請願権は国民が国や地方公共団体に対して要望や苦情を伝えることができる権利です。「裁判を受ける権利である」は誤りで、これは請願権とは別の権利（裁判を受ける権利）の説明です。「財産を所有する権利である」は誤りで、これは財産権の説明であり、請願権とは異なります。「職業を自由に選択する権利である」は誤りで、これは職業選択の自由の説明であり、請願権とは別の権利です。"},
  {id:"civ103", cat:"公民", sub:"政治体制", q:"日本国憲法が保障する生存権についての説明として正しいものはどれか。", choices:["健康で文化的な生活を営む権利","自由に意見を発表する権利","財産を自由に所有する権利","公正な裁判を受ける権利"], a:0, e:"正解は「健康で文化的な最低限度の生活を営む権利である」です。生存権は憲法第25条に定められた「健康で文化的な最低限度の生活を営む権利」で、社会権の代表的なものです。「自由に意見を発表する権利である」は誤りで、これは表現の自由の説明であり、生存権とは異なる権利です。「財産を自由に所有する権利である」は誤りで、これは財産権の説明です。「裁判を受ける権利である」は誤りで、これも生存権とは別の権利の説明です。"},
  {id:"civ105", cat:"公民", sub:"政治体制", q:"参政権に含まれないものはどれか。", choices:["選挙権","被選挙権","国民審査権","団体交渉権"], a:3, e:"正解は「団体交渉権」です。参政権には選挙権・被選挙権・国民審査権などが含まれますが、団体交渉権は労働三権の一つであり参政権には含まれません。「選挙権」「被選挙権」「最高裁判所裁判官の国民審査権」はいずれも誤り（正しい選択、つまり実際に参政権に含まれる）で、これらはまさに国民が政治に参加する権利を構成する要素です。"},
  {id:"civ107", cat:"公民", sub:"政治体制", q:"日本国憲法の改正手続きについての説明として正しいものはどれか。", choices:["国会の発議と国民投票が必要である","内閣の決定だけで改正できる","国会の過半数だけで改正できる","天皇の裁可だけで改正できる"], a:0, e:"正解は「衆参各議院の総議員の3分の2以上の賛成で国会が発議し、国民投票で過半数の賛成が必要である」です。憲法改正には衆参各議院の総議員の3分の2以上の賛成による国会の発議と、国民投票での過半数の賛成が必要です。「内閣の決定だけで改正できる」は誤りで、憲法改正は内閣だけでなく国会の発議と国民投票という厳格な手続きを要します。「国会の過半数の賛成だけで改正できる」は誤りで、通常の法律よりも厳しい3分の2以上という特別多数が必要です。「天皇の裁可だけで改正できる」は誤りで、天皇は国事行為として憲法改正を公布しますが、改正の可否を決定する権限は持ちません。"},
  {id:"civ109", cat:"公民", sub:"政治体制", q:"内閣が国会の信任にもとづいて成立し、国会に対して連帯して責任を負う仕組みを何というか。", choices:["議院内閣制","大統領制","地方自治制","三審制"], a:0, e:"正解は「議院内閣制」です。議院内閣制は内閣が国会（特に衆議院）の信任にもとづいて成立し、国会に対して連帯責任を負う仕組みです。「大統領制」は誤りで、これは国民が直接大統領を選び、大統領が行政の長となる仕組みであり、議院内閣制とは異なる統治形態です。「地方自治制」は誤りで、これは地方公共団体の自治に関する制度であり、国政における内閣と国会の関係を示す議院内閣制とは異なります。「三審制」は誤りで、これは裁判制度における審級の仕組みであり、内閣と国会の関係とは無関係です。"},
  {id:"civ111", cat:"公民", sub:"政治体制", q:"重大な問題を起こした裁判官を辞めさせるかどうかを判断するために国会に設置される機関を何というか。", choices:["弾劾裁判所","国民審査","最高裁判所","地方裁判所"], a:0, e:"正解は「弾劾裁判所」です。弾劾裁判所は国会に設置され、重大な問題を起こした裁判官を辞めさせるかどうかを審理する機関です。「国民審査」は誤りで、これは最高裁判所裁判官に限定した、国民が直接審査する別の制度です。「最高裁判所」は誤りで、これは司法権の最高機関であり、裁判官を辞めさせるかどうかを審理する弾劾裁判所（国会に設置）とは設置主体が異なります。「地方裁判所」は誤りで、これは通常の民事・刑事事件を扱う裁判所であり、裁判官の弾劾とは無関係です。"},
  {id:"civ113", cat:"公民", sub:"政治体制", q:"地方公共団体の首長（都道府県知事や市区町村長）の選出方法として正しいものはどれか。", choices:["住民の直接選挙によって選ばれる","地方議会が任命する","中央政府が任命する","国会が選出する"], a:0, e:"正解は「住民の直接選挙によって選ばれる」です。地方公共団体の首長は、その地域の住民による直接選挙によって選ばれます。「地方議会が任命する」は誤りで、首長は議会による任命ではなく、住民による直接選挙で選出されます（これは国の議院内閣制とは異なる二元代表制の特徴です）。「中央政府が任命する」は誤りで、地方自治の観点から、首長は中央政府ではなく住民自身が選ぶ仕組みです。「国会が選出する」は誤りで、国会は国政の機関であり、地方公共団体の首長選出には関与しません。"},
  {id:"civ115", cat:"公民", sub:"政治体制", q:"地域の重要な問題について、住民が直接意思を表示する制度を何というか。", choices:["住民投票","国政選挙","国民審査","弾劾裁判"], a:0, e:"正解は「住民投票」です。住民投票は原子力発電所の建設など、地域の重要な問題について住民が直接意思を示す制度です。「国政選挙」は誤りで、これは国会議員を選ぶための選挙であり、地域限定の問題について意思表示を行う住民投票とは異なります。「国民審査」は誤りで、これは最高裁判所裁判官の適否を審査する国政レベルの制度です。「弾劾裁判」は誤りで、これは裁判官を辞めさせるかどうかを審理する国会の制度であり、住民が直接意思を示す住民投票とは異なります。"},
  {id:"civ117", cat:"公民", sub:"政治体制", q:"社会全体の利益のために個人の権利が一定の制約を受けることがあるという考え方を何というか。", choices:["公共の福祉","基本的人権の制限","国家権力の絶対性","法の下の不平等"], a:0, e:"正解は「公共の福祉」です。公共の福祉は、個人の権利が他者の権利や社会全体の利益と衝突する場合に一定の制約を受けることがあるという考え方です。「基本的人権の制限」は誤りで、これは公共の福祉の考え方を単純化しすぎた表現であり、公共の福祉は人権を無条件に制限するものではなく、他者の権利との調整を図る考え方です。「国家権力の絶対性」は誤りで、これは公共の福祉とは異なる、国家権力を絶対視する考え方であり、日本国憲法の立場とは相容れません。「法の下の不平等」は誤りで、これは日本国憲法が定める「法の下の平等」とは正反対の内容です。"},
  {id:"civ119", cat:"公民", sub:"労働・法律", q:"労働者が労働条件の改善などのために組織する団体を何というか。", choices:["労働組合","株式会社","NPO法人","業界団体"], a:0, e:"正解は「労働組合」です。労働組合は労働者が労働条件の維持・改善を目的として自主的に組織する団体です。「株式会社」は誤りで、これは営利を目的とする企業形態であり、労働条件の改善を目的とする労働組合とは性質が異なります。「NPO法人」は誤りで、これは非営利の社会活動を行う団体であり、労働条件改善を目的とする労働組合とは異なる組織形態です。「業界団体」は誤りで、これは同業種の企業が集まる団体であり、労働者自身が組織する労働組合とは主体が異なります。"},
  {id:"civ121", cat:"公民", sub:"労働・法律", q:"雇用における男女の差別的な取り扱いを禁止する目的で制定された法律はどれか。", choices:["男女雇用機会均等法","労働基準法","独占禁止法","民法"], a:0, e:"正解は「男女雇用機会均等法」です。男女雇用機会均等法は募集・採用・昇進などにおける男女の差別的な取り扱いを禁止する法律です。「労働基準法」は誤りで、これは労働条件全般の最低基準を定める法律であり、男女差別の禁止に特化した法律ではありません。「独占禁止法」は誤りで、これは企業間の公正な競争を確保する法律であり、雇用における男女差別とは無関係です。「民法」は誤りで、これは個人・法人間の一般的な権利義務を定める法律であり、雇用における男女差別の禁止を直接定めたものではありません。"},
  {id:"civ123", cat:"公民", sub:"法律", q:"契約についての説明として正しいものはどれか。", choices:["当事者間の合意によって成立する法的な約束である","一方が強制的に相手に義務を負わせるものである","法律で必ず書面が必要とされるものである","口約束は一切法的効力を持たない"], a:0, e:"正解は「当事者間の合意によって成立する法的な約束である」です。契約は当事者間の合意によって成立する法的な約束であり、原則として口約束であっても法的効力を持ちます。「一方が強制的に相手に義務を負わせるものである」は誤りで、契約は双方の合意にもとづくものであり、一方的な強制とは異なります。「法律で必ず書面が必要とされるものである」は誤りで、多くの契約は口頭でも成立し、書面が必須とされるのは一部の契約に限られます。「口約束は一切法的効力を持たない」は誤りで、実際には口約束であっても契約として法的効力を持つのが原則です。"},
  {id:"civ125", cat:"公民", sub:"法律", q:"欠陥商品によって消費者が被害を受けた場合の製造者の責任を定めた法律を何というか。", choices:["製造物責任法（PL法）","消費者基本法","独占禁止法","労働基準法"], a:0, e:"正解は「製造物責任法（PL法）」です。製造物責任法（PL法）は欠陥商品によって消費者が被害を受けた場合の、製造者の損害賠償責任を定めた法律です。「消費者基本法」は誤りで、これは消費者の権利保護に関するより一般的な理念を定めた法律であり、製造者の損害賠償責任を具体的に定めるPL法とは異なります。「独占禁止法」は誤りで、これは企業間の公正な競争を確保する法律であり、欠陥商品の責任とは無関係です。「労働基準法」は誤りで、これは労働条件に関する法律であり、消費者被害とは異なる分野です。"},
  {id:"civ127", cat:"公民", sub:"政治体制", q:"最高裁判所の裁判官が適任かどうかを国民が審査する制度を何というか。", choices:["国民審査","弾劾裁判","住民投票","国政調査権"], a:0, e:"正解は「国民審査」です。国民審査は衆議院議員総選挙のときに行われ、最高裁判所の裁判官が適任かどうかを国民が審査する制度です。「弾劾裁判」は誤りで、これは国会に設置される機関が問題のある裁判官を辞めさせるかどうかを審理する制度であり、国民が直接投票する国民審査とは仕組みが異なります。「住民投票」は誤りで、これは地方自治体レベルの制度であり、最高裁判所裁判官という国のレベルの審査とは対象が異なります。「国政調査権」は誤りで、これは国会が行政を調査する権限であり、裁判官の適否を国民が審査する国民審査とは全く異なる制度です。"},
  {id:"civ129", cat:"公民", sub:"国際関係", q:"1948年に国連総会で採択された、各国が達成すべき人権保障の基準を示した宣言は何か。", choices:["世界人権宣言","国際人権規約","ワイマール憲法","マグナ・カルタ"], a:0, e:"正解は「世界人権宣言」です。世界人権宣言は1948年の国連総会で採択された、すべての人が持つべき基本的人権の基準を示した宣言です。「国際人権規約」は誤りで、これは世界人権宣言をもとに、より法的拘束力を持たせる形で1966年に採択された条約であり、世界人権宣言そのものより後のものです。「ワイマール憲法」は誤りで、これは1919年にドイツで制定された一国の憲法であり、国際的な宣言ではありません。「マグナ・カルタ」は誤りで、これは1215年にイギリスで制定された文書であり、時代も性格も大きく異なります。"},
  {id:"civ131", cat:"公民", sub:"国際関係", q:"紛争や迫害などにより自国を離れざるを得なくなった人々を何というか。", choices:["難民","移民","留学生","観光客"], a:0, e:"正解は「難民」です。難民は紛争や政治的迫害などにより、生命の危険から自国を離れざるを得なくなった人々のことです。「移民」は誤りで、これは主に経済的な理由などで自発的に他国へ移り住む人々を指し、迫害から逃れる難民とは動機が異なります。「留学生」は誤りで、これは教育を目的として他国に滞在する人々であり、難民とは全く異なる立場です。「観光客」は誤りで、これは旅行を目的として一時的に他国を訪れる人々であり、難民とは無関係です。"},
  {id:"civ133", cat:"公民", sub:"国際関係", q:"難民の保護や支援を主な役割とする国連の機関はどれか。", choices:["UNHCR（国連難民高等弁務官事務所）","WHO（世界保健機関）","WTO（世界貿易機関）","ILO（国際労働機関）"], a:0, e:"正解は「UNHCR（国連難民高等弁務官事務所）」です。UNHCR（国連難民高等弁務官事務所）は難民の保護と支援を主な役割とする国連の機関です。「WHO（世界保健機関）」は誤りで、これは健康・感染症対策を担う国連の専門機関であり、難民保護を主な役割とはしていません。「WTO（世界貿易機関）」は誤りで、これは貿易の自由化やルール整備を担う機関であり、難民問題とは異なる分野です。「ILO（国際労働機関）」は誤りで、これは労働条件の国際的な基準づくりなどを担う機関であり、難民保護を主目的とはしていません。"},
  {id:"civ135", cat:"公民", sub:"国際関係", q:"2015年に採択されたパリ協定の特徴として正しいものはどれか。", choices:["すべての参加国に削減努力を求める","先進国のみに削減義務を課す","罰則規定が非常に厳しい","参加は先進国のみに限られる"], a:0, e:"正解は「先進国だけでなく途上国を含むすべての参加国に温室効果ガス削減の努力を求めている」です。パリ協定は京都議定書と異なり、先進国・途上国を問わずすべての参加国に温室効果ガス削減の努力を求めている点が特徴です。「先進国のみに削減義務を課している」は誤りで、これはむしろ京都議定書の特徴であり、パリ協定はより幅広い国を対象としています。「罰則規定が非常に厳しい」は誤りで、パリ協定には京都議定書のような明確な罰則規定はなく、各国の自主的な取り組みに委ねる部分が大きい枠組みです。「参加は先進国のみに限定されている」は誤りで、パリ協定には先進国・途上国を問わず多数の国が参加しています。"},
  {id:"civ137", cat:"公民", sub:"国際関係", q:"事実とは異なる誤った情報が、真実であるかのように広まることを何というか。", choices:["フェイクニュース","プロパガンダのみ","世論調査","報道規制"], a:0, e:"正解は「事実とは異なる誤った情報が広まること」です。フェイクニュースは事実とは異なる誤った情報が、あたかも真実であるかのように広まる現象です。「政府が公式に発表するニュースのことである」は誤りで、フェイクニュースはむしろ公式発表とは異なる誤情報を指す言葉であり、正反対の内容です。「新聞社が発行するニュースのすべてを指す」は誤りで、新聞社の報道すべてがフェイクニュースというわけではなく、誤った情報のみを指す言葉です。「テレビでのみ発生する現象である」は誤りで、フェイクニュースは主にインターネットやSNSを通じて広まることが多く、テレビに限定される現象ではありません。"},
  {id:"civ139", cat:"公民", sub:"労働・法律", q:"医療において、患者が十分な説明を受けたうえで治療方針に同意することを何というか。", choices:["インフォームド・コンセント","クーリング・オフ","カルテ開示のみ","セカンドオピニオンのみ"], a:0, e:"正解は「医療において患者が説明を受けたうえで治療に同意することである」です。インフォームド・コンセントは、医師が十分な説明を行い、患者が納得したうえで治療に同意することです。「裁判における証言のことである」は誤りで、これは司法手続きに関する概念であり、医療分野のインフォームド・コンセントとは異なります。「選挙における投票行為のことである」は誤りで、これは政治参加に関する行為であり、医療とは無関係です。「契約における違約金のことである」は誤りで、これは経済的な契約関係に関する概念であり、患者の同意に関するインフォームド・コンセントとは異なります。"},
  {id:"civ141", cat:"公民", sub:"政治体制", q:"すべての国民が学ぶことができるよう保障された、教育を受ける権利についての説明として正しいものはどれか。", choices:["能力に応じて等しく教育を受ける権利","富裕層のみに与えられる権利","成人にのみ与えられる権利","私立学校にのみ適用される権利"], a:0, e:"正解は「すべての国民が能力に応じて等しく教育を受けられるよう保障された権利である」です。教育を受ける権利は憲法第26条に定められ、すべての国民が能力に応じて等しく教育を受けられることを保障しています。「一部の富裕層のみに与えられた権利である」は誤りで、これは教育を受ける権利の趣旨とは正反対であり、すべての国民が対象です。「成人にのみ与えられる権利である」は誤りで、教育を受ける権利は子どもを含むすべての国民が対象となる権利です。「私立学校にのみ適用される権利である」は誤りで、この権利は公立・私立を問わず、教育全般に関わる権利です。"},
  {id:"civ143", cat:"公民", sub:"国際関係", q:"将来の世代の必要を満たす能力を損なうことなく、現在の世代の必要も満たすことを目指す社会を何というか。", choices:["持続可能な社会","高度経済成長社会","モノカルチャー社会","消費社会"], a:0, e:"正解は「持続可能な社会」です。持続可能な社会とは、将来世代の生活を損なうことなく現在の世代の必要も満たしていく社会のことです。「高度経済成長社会」は誤りで、これは経済成長率の高さに着目した言葉であり、将来世代への配慮という持続可能な社会の考え方とは異なります。「モノカルチャー社会」は誤りで、これは特定の一次産品に依存する経済構造を指す言葉であり、持続可能性とは直接関係しません。「消費社会」は誤りで、これは大量消費を特徴とする社会のあり方を指す言葉であり、むしろ持続可能な社会とは対照的な側面を持つことがあります。"},
  {id:"civ145", cat:"公民", sub:"労働・法律", q:"情報を正しく活用し、氾濫する情報の中から真偽を判断する能力を何というか。", choices:["情報リテラシー","プログラミング能力のみ","情報処理速度のみ","記憶力のみ"], a:0, e:"正解は「情報リテラシー」です。情報リテラシーは、情報を正しく収集・活用し、その真偽や価値を判断する能力のことです。「プログラミング能力のみ」は誤りで、これはコンピューターに指示を与える技術的な能力であり、情報の真偽判断を含む情報リテラシーとは異なる、より限定的な能力です。「情報処理速度のみ」は誤りで、これは情報を扱う速さに関する能力であり、真偽の判断力を含む情報リテラシーとは異なります。「記憶力のみ」は誤りで、これは情報を覚える能力であり、情報を批判的に評価・活用する情報リテラシーとは異なる能力です。"},
  {id:"civ147", cat:"公民", sub:"国際関係", q:"異なる文化を持つ人々が、互いを尊重しながら共に生活していく考え方を何というか。", choices:["多文化共生","同化政策","鎖国主義","排他主義"], a:0, e:"正解は「多文化共生」です。多文化共生は、異なる文化的背景を持つ人々が互いの違いを認め合い、対等な関係で共に生活していく考え方です。「同化政策」は誤りで、これは少数派の文化を多数派の文化に一方的に合わせさせる考え方であり、互いを尊重する多文化共生とは正反対です。「鎖国主義」は誤りで、これは外部との交流自体を断つ考え方であり、異文化との共生とは相容れません。「排他主義」は誤りで、これは異なる文化や外部の人々を排除しようとする考え方であり、多文化共生とは正反対の立場です。"},
  /* 日本史 */
  {id:"his157", cat:"日本史", sub:"古代", q:"なぜ弥生時代に稲作が広まると、社会に身分の差が生まれるようになったのか、その理由として正しいものはどれか。", choices:["土地や収穫物の管理・争いが生じたため","全員が同じ量の米を分け合ったため","稲作には身分の区別が不要だったため","稲作そのものが禁止されていたため"], a:0, e:"正解は「土地や収穫物の管理・争いが生じたため」です。稲作の広まりとともに土地や収穫物の管理・争いが起こり、指導者やそれに従う者という身分の差が生まれました。「全員が同じ量の米を分け合ったため」は誤りで、これは平等な分配を意味し、身分の差が生まれる理由にはなりません。「稲作には身分の区別が不要だったため」は誤りで、実際には稲作の広まりが身分差を生む一因となったとされ、内容が逆です。「稲作そのものが禁止されていたため」は誤りで、そもそも弥生時代に稲作が禁止されていた事実はなく、むしろ稲作が広まったことが前提の問いです。"},
  {id:"his159", cat:"日本史", sub:"古代", q:"なぜ聖徳太子は遣隋使を派遣したのか、その理由として正しいものはどれか。", choices:["中国の制度や文化を学ぶため","中国を武力で征服するため","国内の仏教を禁止するため","外国との貿易を完全に断つため"], a:0, e:"正解は「中国の制度や文化を学ぶため」です。聖徳太子は隋の進んだ政治制度や文化を取り入れるため、遣隋使を派遣しました。「中国を武力で征服するため」は誤りで、遣隋使は外交・文化交流のための使節であり、軍事的な征服を目的としたものではありません。「国内の仏教を禁止するため」は誤りで、聖徳太子はむしろ仏教を篤く信仰し保護した人物であり、禁止とは正反対です。「外国との貿易を完全に断つため」は誤りで、遣隋使はむしろ中国との交流を積極的に進める目的で派遣されました。"},
  {id:"his161", cat:"日本史", sub:"鎌倉・室町", q:"なぜ鎌倉幕府の将軍は御家人と主従関係を結んだのか、その理由として正しいものはどれか。", choices:["御恩と奉公で幕府を支えさせるため","農民を幕府が直接支配するため","朝廷の権力をさらに強めるため","貿易の利益を独占させるため"], a:0, e:"正解は「御恩と奉公で幕府を支えさせるため」です。将軍は御家人に領地を保障する「御恩」を与え、御家人は戦いに参加する「奉公」で応える主従関係を結びました。「農民を幕府が直接支配するため」は誤りで、御家人との主従関係は武士同士の関係であり、農民支配とは直接関係しません。「朝廷の権力をさらに強めるため」は誤りで、鎌倉幕府はむしろ朝廷とは別の武家の権力基盤を築く目的で御家人制度を整えました。「貿易の利益を独占させるため」は誤りで、御恩と奉公の関係は土地と軍事奉仕を軸とするものであり、貿易とは直接関係しません。"},
  {id:"his163", cat:"日本史", sub:"鎌倉・室町", q:"なぜ元寇の後、御家人は鎌倉幕府への不満を強めたのか、その理由として正しいものはどれか。", choices:["十分な恩賞を得られなかったため","戦いに敗れ領地を失ったため","元と同盟を結ばされたため","朝廷に領地を奪われたため"], a:0, e:"正解は「元寇で十分な恩賞を与えられなかったため」です。防衛戦であった元寇では新たな領地を得られず、幕府は御家人に十分な恩賞を与えられませんでした。「戦いに敗れ領地を失ったため」は誤りで、元寇では日本側（幕府軍）は元軍を撃退しており、敗北したわけではありません。「元と同盟を結ばされたため」は誤りで、元寇は日本と元が戦った戦争であり、同盟を結んだ事実はありません。「朝廷に領地を奪われたため」は誤りで、御家人の不満の原因は朝廷ではなく、幕府が十分な恩賞を用意できなかったことにあります。"},
  {id:"his165", cat:"日本史", sub:"鎌倉・室町", q:"なぜ室町時代に馬借や問（問丸）などの運送業が発達したのか、その理由として正しいものはどれか。", choices:["商業と交通の発達で輸送が増えたため","戦乱により道路が新設されたため","仏教の布教が禁止されたため","鎖国政策がとられていたため"], a:0, e:"正解は「商業と交通の発達で輸送が増えたため」です。商業の発達にともない各地の物資を運ぶ需要が高まり、馬借や問丸などの運送業が発達しました。「戦乱により道路が新設されたため」は誤りで、運送業の発達は商業活動の活発化が主な要因であり、戦乱による道路新設が直接の理由ではありません。「仏教の布教が禁止されたため」は誤りで、室町時代に仏教の布教が禁止された事実はなく、運送業の発達とも無関係です。「鎖国政策がとられていたため」は誤りで、鎖国政策は江戸時代の政策であり、室町時代の運送業発達とは時代が異なります。"},
  {id:"his167", cat:"日本史", sub:"戦国・江戸", q:"なぜ豊臣秀吉は刀狩を行ったのか、その理由として正しいものはどれか。", choices:["農民から武器を取り上げ一揆を防ぐため","武士の武器をさらに強化するため","貿易をより一層促進するため","キリスト教を保護し広めるため"], a:0, e:"正解は「農民から武器を取り上げ一揆を防ぐため」です。刀狩は農民から武器を取り上げることで一揆を防ぎ、兵農分離を進めることを目的としました。「武士の武器をさらに強化するため」は誤りで、刀狩は農民から武器を取り上げる政策であり、武士の武器強化とは無関係です。「貿易をより一層促進するため」は誤りで、刀狩は国内の身分統制に関する政策であり、貿易促進とは目的が異なります。「キリスト教を保護し広めるため」は誤りで、秀吉はむしろキリスト教を制限する政策もとっており、刀狩とは別の文脈の事柄です。"},
  {id:"his169", cat:"日本史", sub:"戦国・江戸", q:"なぜ江戸幕府は鎖国政策をとったのか、その理由として正しいものはどれか。", choices:["貿易の利益と統制を独占するため","外国との交流を積極的に進めるため","農業をさらに発展させるため","武士の人数を減らすため"], a:0, e:"正解は「貿易の利益と統制を独占するため」です。鎖国はキリスト教の拡大を防ぎ、幕府が貿易の利益と統制を独占することを目的としました。「外国との交流を積極的に進めるため」は誤りで、鎖国はむしろ対外交流を制限する政策であり、積極的な交流とは正反対です。「農業をさらに発展させるため」は誤りで、鎖国の主な目的は対外関係の統制であり、農業発展を直接の目的としたものではありません。「武士の人数を減らすため」は誤りで、鎖国政策と武士の人数調整は直接関係しません。"},
  {id:"his171", cat:"日本史", sub:"江戸時代", q:"なぜ江戸時代に五街道が整備されたのか、その理由として正しいものはどれか。", choices:["参勤交代や物資輸送を円滑にするため","農地の面積を拡大するため","外国との貿易を制限するため","身分制度をさらに強化するため"], a:0, e:"正解は「参勤交代や物資輸送を円滑にするため」です。五街道は参勤交代で移動する大名や、物資を輸送する人々の往来を円滑にするために整備されました。「農地の面積を拡大するため」は誤りで、五街道の整備は交通路の整備であり、農地拡大とは直接関係しません。「外国との貿易を制限するため」は誤りで、これは鎖国政策に関する内容であり、国内の街道整備とは異なる事柄です。「身分制度をさらに強化するため」は誤りで、五街道整備の主目的は交通の円滑化であり、身分制度の強化を直接の目的としたものではありません。"},
  {id:"his173", cat:"日本史", sub:"近代", q:"なぜ黒船来航は江戸幕府に大きな衝撃を与えたのか、その理由として正しいものはどれか。", choices:["軍事力の差を見せつけられたため","黒船が日本を直接攻撃したため","幕府がすでに開国していたため","朝廷が黒船を歓迎したため"], a:0, e:"正解は「軍事力の差を見せつけられたため」です。アメリカの軍事力の圧倒的な差を見せつけられたことで、幕府は開国を余儀なくされました。「黒船が日本を直接攻撃したため」は誤りで、黒船来航自体は武力攻撃ではなく、あくまで開国を求める示威的な来航でした。「幕府がすでに開国していたため」は誤りで、黒船来航（1853年）の時点ではまだ日本は鎖国状態にあり、この来航をきっかけに開国が進みました。「朝廷が黒船を歓迎したため」は誤りで、朝廷はむしろ開国に否定的な立場をとることが多く、歓迎した事実はありません。"},
  {id:"his175", cat:"日本史", sub:"近代", q:"なぜ明治政府は学制を公布したのか、その理由として正しいものはどれか。", choices:["国民に近代的教育を広めるため","武士だけに教育を限定するため","仏教の教育を推進するため","教育制度そのものを廃止するため"], a:0, e:"正解は「国民に近代的教育を広めるため」です。学制は身分にかかわらずすべての国民に近代的な教育を広めることを目的として公布されました。「武士だけに教育を限定するため」は誤りで、学制はむしろ身分にかかわらずすべての国民を対象とした教育制度であり、武士限定とは正反対です。「仏教の教育を推進するため」は誤りで、学制は近代的な学校教育制度の整備を目的としており、仏教教育の推進を主目的としたものではありません。「教育制度そのものを廃止するため」は誤りで、学制はむしろ新たな教育制度を「創設」するものであり、廃止とは正反対です。"},
  {id:"his177", cat:"日本史", sub:"近代", q:"なぜ明治政府は徴兵令を出したのか、その理由として正しいものはどれか。", choices:["近代的な軍隊を編成するため","武士の特権を維持するため","農民の生活を保護するため","外国との貿易を制限するため"], a:0, e:"正解は「近代的な軍隊を編成するため」です。徴兵令は身分にかかわらず国民から兵を集め、欧米に対抗できる近代的な軍隊を編成するために出されました。「武士の特権を維持するため」は誤りで、徴兵令はむしろ武士だけが担ってきた軍事の役割を国民全体に広げるものであり、武士の特権とは相容れません。「農民の生活を保護するため」は誤りで、徴兵令は兵役に関する制度であり、農民の生活保護を直接の目的としたものではありません。「外国との貿易を制限するため」は誤りで、徴兵令は軍事制度に関するものであり、貿易政策とは異なる分野です。"},
  {id:"his179", cat:"日本史", sub:"近代", q:"なぜ日清戦争後に三国干渉が起こったのか、その理由として正しいものはどれか。", choices:["列強が日本の進出を警戒したため","日本が戦争に敗れたため","清が日本に味方したため","イギリスが日本を支援したため"], a:0, e:"正解は「列強が日本の進出を警戒したため」です。ロシア・フランス・ドイツは、日本の大陸進出を警戒し、遼東半島の返還を求める三国干渉を行いました。「日本が戦争に敗れたため」は誤りで、日本は日清戦争に勝利しており、敗戦が三国干渉の理由ではありません。「清が日本に味方したため」は誤りで、三国干渉を行ったのは清ではなくロシア・フランス・ドイツであり、清が日本に味方した事実もありません。「イギリスが日本を支援したため」は誤りで、三国干渉に関わったのはイギリスではなく別の三国であり、内容が事実と異なります。"},
  {id:"his181", cat:"日本史", sub:"近代", q:"なぜ日露戦争後、日本国内でポーツマス条約に対する不満が高まったのか、その理由として正しいものはどれか。", choices:["賠償金を得られなかったため","戦争に敗れてしまったため","講和が長期化しすぎたため","朝鮮が独立を果たしたため"], a:0, e:"正解は「賠償金を得られなかったため」です。多大な犠牲を払った戦争であったにもかかわらず、ポーツマス条約では賠償金を得ることができませんでした。「戦争に敗北したことへの不満のため」は誤りで、日本は日露戦争に勝利しており、敗北への不満ではありません。「講和そのものに反対する国民が多かったため」は誤りで、国民の不満の中心は講和そのものではなく、賠償金が得られなかった内容にありました。「賠償金が予想より多すぎたため」は誤りで、事実とは正反対であり、実際には賠償金がまったく得られなかったことが不満の原因でした。"},
  {id:"his183", cat:"日本史", sub:"近代", q:"なぜ第一次世界大戦は日本の経済に好景気をもたらしたのか、その理由として正しいものはどれか。", choices:["ヨーロッパへの輸出が増えたため","国内で激しい戦争が起きたため","人口が急激に減少したため","農業生産が停止したため"], a:0, e:"正解は「ヨーロッパへの輸出が増えたため」です。戦場となったヨーロッパの生産力が低下したため、日本からの輸出が増え、大戦景気と呼ばれる好況をもたらしました。「国内で激しい戦争が起きたため」は誤りで、第一次世界大戦の主戦場はヨーロッパであり、日本国内で戦闘が行われたわけではありません。「人口が急激に減少したため」は誤りで、これは好景気をもたらす要因とは考えにくく、事実とも異なります。「農業生産が停止したため」は誤りで、大戦景気は主に工業製品の輸出増加によるものであり、農業生産の停止が理由ではありません。"},
  {id:"his185", cat:"日本史", sub:"近代", q:"なぜ関東大震災の後、社会不安が広がったのか、その理由として正しいものはどれか。", choices:["経済的な被害が大きかったため","震災が事前に予測されていたため","震災直後に戦争が終結したため","震災により選挙が廃止されたため"], a:0, e:"正解は「経済的な被害が大きかったため」です。関東大震災は首都圏に甚大な経済的被害をもたらし、生活の混乱から社会不安が広がりました。「震災が事前に予測されていたため」は誤りで、事前予測の有無は社会不安拡大の直接の理由ではなく、実際の被害の大きさが不安を招きました。「震災直後に戦争が終結したため」は誤りで、関東大震災（1923年）と戦争終結（1945年）は時期も無関係な出来事です。「震災により選挙が廃止されたため」は誤りで、関東大震災によって選挙制度が廃止された事実はありません。"},
  {id:"his187", cat:"日本史", sub:"近代", q:"なぜ世界恐慌は日本経済にも深刻な影響を与えたのか、その理由として正しいものはどれか。", choices:["アメリカへの生糸輸出が激減したため","日本は世界恐慌と無関係だったため","日本だけが好景気を維持したため","すでに戦争が終結していたため"], a:0, e:"正解は「アメリカへの生糸輸出が激減したため」です。日本の重要な輸出品であった生糸のアメリカ向け輸出が激減し、日本経済も深刻な不況に陥りました。「日本は世界恐慌と無関係だったため」は誤りで、実際には日本経済も世界恐慌の影響を強く受けており、無関係ではありませんでした。「日本だけが好景気を維持したため」は誤りで、事実とは正反対であり、日本も深刻な不況（昭和恐慌）に見舞われました。「すでに戦争が終結していたため」は誤りで、世界恐慌（1929年）の時点ではまだ第二次世界大戦は始まっておらず、この選択肢は時系列が不適切です。"},
  {id:"his189", cat:"日本史", sub:"近代", q:"なぜ満州事変後、日本は国際連盟を脱退したのか、その理由として正しいものはどれか。", choices:["満州国建国を認められなかったため","国際連盟に加盟していなかったため","戦争にすでに勝利していたため","国際連盟が解散していたため"], a:0, e:"正解は「満州国建国を認められなかったため」です。国際連盟が満州国の建国を認めず撤退を勧告したため、日本は1933年に国際連盟を脱退しました。「国際連盟に加盟していなかったため」は誤りで、日本は国際連盟の常任理事国の一つであり、加盟国でした。「戦争にすでに勝利していたため」は誤りで、脱退の理由は満州国問題への対応であり、戦争の勝敗とは直接関係しません。「国際連盟が解散していたため」は誤りで、国際連盟が解散したのはこの脱退よりずっと後（実質的には第二次世界大戦後）のことです。"},
  {id:"his191", cat:"日本史", sub:"現代", q:"なぜ太平洋戦争末期、日本各地で空襲による被害が拡大したのか、その理由として正しいものはどれか。", choices:["制空権を失い防衛が困難になったため","戦争がすでに終結していたため","空襲そのものが禁止されていたため","日本軍が終始優勢だったため"], a:0, e:"正解は「制空権を失い防衛が困難になったため」です。戦況の悪化により制空権を失った日本は、本土への空襲を効果的に防ぐことができなくなりました。「戦争がすでに終結していたため」は誤りで、空襲が拡大したのはまさに戦争末期、終戦前の時期です。「空襲そのものが禁止されていたため」は誤りで、当時の国際法上も空襲を完全に禁じる実効的な取り決めはなく、実際に空襲は行われていました。「日本軍が終始優勢だったため」は誤りで、戦争末期には日本軍の劣勢が明らかになっており、優勢だったという内容は事実と異なります。"},
  {id:"his193", cat:"日本史", sub:"現代", q:"なぜ戦後の日本で財閥解体が行われたのか、その理由として正しいものはどれか。", choices:["経済の独占状態を解消するため","財閥の力をさらに強めるため","戦争を継続する資金を得るため","貿易をすべて禁止するため"], a:0, e:"正解は「経済の独占状態を解消するため」です。GHQは財閥による経済の独占状態を解消し、日本経済を民主化するために財閥解体を進めました。「財閥の力をさらに強めるため」は誤りで、財閥解体はまさに財閥の力を弱め解体することを目的としており、内容が正反対です。「戦争を継続する資金を得るため」は誤りで、財閥解体は戦後の改革であり、戦争継続のための資金調達とは無関係です。「貿易をすべて禁止するため」は誤りで、財閥解体は企業構造の改革であり、貿易全面禁止を目的としたものではありません。"},
  {id:"his195", cat:"日本史", sub:"現代", q:"なぜ日本国憲法では国民主権が採用されたのか、その理由として正しいものはどれか。", choices:["戦前の体制を見直し民主化するため","天皇の権限をより強化するため","軍部の権力を維持し続けるため","地方自治を完全に廃止するため"], a:0, e:"正解は「戦前の体制を見直し民主化するため」です。戦前の天皇主権のあり方を見直し、国民が主権者となる民主的な国家をつくるために国民主権が採用されました。「天皇の権限をより強化するため」は誤りで、国民主権の採用はむしろ天皇の政治的権限を縮小する方向の改革であり、強化とは正反対です。「軍部の権力を維持し続けるため」は誤りで、戦後改革はむしろ軍部の解体・弱体化を進めるものであり、維持とは逆の方向性です。「地方自治を完全に廃止するため」は誤りで、戦後改革ではむしろ地方自治が憲法に明記され強化されました。"},
  {id:"his197", cat:"日本史", sub:"現代", q:"なぜ高度経済成長期に公害問題が深刻化したのか、その理由として正しいものはどれか。", choices:["経済成長を優先し対策が遅れたため","工場の数が大きく減少したため","人口が急激に減少し続けたため","農業がすべて優先されたため"], a:0, e:"正解は「経済成長を優先し対策が遅れたため」です。急速な経済成長が優先され、環境対策が後回しにされたことで各地で公害問題が深刻化しました。「工場の数が大きく減少したため」は誤りで、実際には高度経済成長期には工場や生産activityが増加しており、減少とは事実が逆です。「人口が急激に減少し続けたため」は誤りで、高度経済成長期の日本は都市部を中心に人口が増加傾向にありました。「農業がすべて優先されたため」は誤りで、この時期は工業化が優先され、公害の多くも工業活動に由来するものでした。"},
  {id:"his199", cat:"日本史", sub:"現代", q:"なぜ1972年に日中共同声明が発表されたのか、その理由として正しいものはどれか。", choices:["日本と中国の国交を正常化するため","日本と中国の戦争を始めるため","両国の貿易を完全に停止するため","台湾の独立を承認するため"], a:0, e:"正解は「日本と中国の国交を正常化するため」です。日中共同声明は、それまで国交のなかった日本と中国（中華人民共和国）の国交を正常化するために発表されました。「日本と中国の戦争を始めるため」は誤りで、日中共同声明はむしろ戦争状態の終結と友好関係の構築を目指すものであり、開戦とは正反対です。「両国の貿易を完全に停止するため」は誤りで、国交正常化はむしろ両国間の交流拡大につながるものであり、貿易停止とは逆の方向です。「台湾の独立を承認するため」は誤りで、日中共同声明は日本と中華人民共和国の関係に関するものであり、台湾の独立承認とは異なる内容です。"},
  {id:"his201", cat:"日本史", sub:"現代", q:"なぜバブル経済崩壊後、日本は長期の不況に陥ったのか、その理由として正しいものはどれか。", choices:["不良債権処理が進まなかったため","好景気がそのまま継続したため","人口が急激に増加し続けたため","輸出だけが急激に増えたため"], a:0, e:"正解は「不良債権処理が進まなかったため」です。バブル崩壊後、金融機関が抱えた不良債権の処理が進まず、経済の停滞が長期化しました。「好景気がそのまま継続したため」は誤りで、バブル崩壊後は好景気ではなく長期の不況（失われた10年など）が続いた状況です。「人口が急激に増加し続けたため」は誤りで、この時期の日本はむしろ少子化が進行しており、急激な人口増加とは事実が異なります。「輸出だけが急激に増えたため」は誤りで、輸出の急増は不況の原因ではなく、不良債権問題こそが長期不況の主因とされています。"},
  {id:"his203", cat:"日本史", sub:"現代", q:"なぜ1990年代以降、日本で規制緩和が進められたのか、その理由として正しいものはどれか。", choices:["経済の活性化と競争を促すため","経済活動をすべて禁止するため","公共事業を減らさないため","海外との貿易を制限するため"], a:0, e:"正解は「経済の活性化と競争を促すため」です。規制緩和は新規参入を促し競争を活発にすることで、経済の活性化を図る目的で進められました。「経済活動をすべて禁止するため」は誤りで、規制緩和はむしろ経済活動への制約を緩めるものであり、禁止とは正反対の方向性です。「公共事業を減らさないため」は誤りで、規制緩和は公共事業の維持を直接の目的としたものではなく、民間の経済活動の自由度を高めることが主眼です。「海外との貿易を制限するため」は誤りで、規制緩和はむしろ市場開放や競争促進の方向に働くものであり、貿易制限とは逆の性質です。"},
  {id:"his205", cat:"日本史", sub:"現代", q:"なぜ現在の日本で地方創生が政策課題となっているのか、その理由として正しいものはどれか。", choices:["東京一極集中と地方の人口減少のため","地方の人口が増加しすぎたため","都市部の人口が減少しているため","地方だけが急速に発展したため"], a:0, e:"正解は「東京一極集中と地方の人口減少のため」です。東京圏への一極集中が進む一方で地方の人口減少が続いているため、地方創生が重要な政策課題となっています。「地方の人口が増加しすぎたため」は誤りで、実際には地方の人口は減少傾向にあり、増加しすぎているわけではありません。「都市部の人口が減少しているため」は誤りで、都市部（特に東京圏）はむしろ人口が集中し増加傾向にあります。「地方だけが急速に発展したため」は誤りで、地方創生が課題となる背景はむしろ地方の停滞・衰退であり、急速な発展とは事実が逆です。"},
  /* 世界史 */
  {id:"wor151", cat:"世界史", sub:"ヨーロッパ史", q:"なぜルネサンスはイタリアで最初に始まったのか、その理由として正しいものはどれか。", choices:["古代ローマの遺産と商業の富があったため","宗教改革がすでに完了していたため","産業革命が最も早く起こったため","イスラム勢力の支配下にあったため"], a:0, e:"正解は「古代ローマの遺産と商業の富があったため」です。イタリアには古代ローマの文化遺産が残り、貿易で栄えた都市には芸術を支える豊かな富がありました。「宗教改革がすでに完了していたため」は誤りで、宗教改革はルネサンスより後（16世紀）に本格化した出来事であり、時系列が逆です。「産業革命が最も早く起こったため」は誤りで、産業革命はルネサンスよりずっと後（18世紀以降）にイギリスで最初に起こった出来事であり、無関係です。「イスラム勢力の支配下にあったため」は誤りで、イタリアはルネサンス期にはイスラム勢力の支配下にはなく、キリスト教世界の一部でした。"},
  {id:"wor153", cat:"世界史", sub:"ヨーロッパ史", q:"なぜ大航海時代にヨーロッパ諸国は新航路の開拓を進めたのか、その理由として正しいものはどれか。", choices:["アジアの香辛料を直接手に入れるため","宗教改革を世界に広めるため","産業革命を成功させるため","植民地の独立を支援するため"], a:0, e:"正解は「アジアの香辛料を直接手に入れるため」です。アジア産の香辛料を仲介者を通さず直接手に入れるため、ヨーロッパ諸国は新航路の開拓を競いました。「宗教改革を世界に広めるため」は誤りで、大航海時代の主な動機は経済的な利益（香辛料貿易）であり、宗教改革（16世紀）とは時期も目的も異なります。「産業革命を成功させるため」は誤りで、産業革命は大航海時代よりずっと後の出来事であり、時系列が逆です。「植民地の独立を支援するため」は誤りで、大航海時代はむしろ植民地を「獲得」する動きであり、独立支援とは正反対です。"},
  {id:"wor155", cat:"世界史", sub:"ヨーロッパ史", q:"なぜルターの宗教改革は各地に急速に広まったのか、その理由として正しいものはどれか。", choices:["活版印刷により主張が広く伝わったため","カトリック教会が改革を歓迎したため","十字軍がすでに終結していたため","ローマ帝国が滅亡していたため"], a:0, e:"正解は「活版印刷により主張が広く伝わったため」です。活版印刷術の普及によりルターの主張が印刷物として大量に広まり、宗教改革が急速に拡大しました。「カトリック教会が改革を歓迎したため」は誤りで、カトリック教会はむしろルターの主張に反発し、彼を異端として扱いました。「十字軍がすでに終結していたため」は誤りで、十字軍の終結（13世紀）と宗教改革の拡大（16世紀）は直接の因果関係にありません。「ローマ帝国が滅亡していたため」は誤りで、西ローマ帝国の滅亡（5世紀）は宗教改革よりはるかに前の出来事であり、拡大の直接の理由ではありません。"},
  {id:"wor157", cat:"世界史", sub:"ヨーロッパ史", q:"なぜイギリスの名誉革命は「無血」で成功したのか、その理由として正しいものはどれか。", choices:["議会が新国王を平和的に迎えたため","軍隊が全面的に反乱を起こしたため","国王が独裁権をさらに強めたため","他国が軍事介入したため"], a:0, e:"正解は「議会が新国王を平和的に迎えたため」です。議会が新たな国王夫妻を招き、旧国王が抵抗せず亡命したため、大きな戦闘を伴わずに政権交代が実現しました。「軍隊が全面的に反乱を起こしたため」は誤りで、名誉革命が「無血」で成功した理由はむしろ大規模な軍事衝突が避けられたことにあり、反乱とは異なります。「国王が独裁権をさらに強めたため」は誤りで、これは名誉革命が起こった背景（国王への不満）に近い内容であり、無血で成功した理由の説明にはなりません。「他国が軍事介入したため」は誤りで、名誉革命はイギリス国内の政治的合意によって進んだものであり、他国の軍事介入が主因ではありません。"},
  {id:"wor159", cat:"世界史", sub:"ヨーロッパ史", q:"なぜアメリカ独立戦争が起こったのか、その理由として正しいものはどれか。", choices:["イギリスの重税と統制に反発したため","フランスから独立を求められたため","先住民との対立が激化したため","スペインとの戦争が始まったため"], a:0, e:"正解は「イギリスの重税と統制に反発したため」です。イギリス本国による重税や貿易統制に対する植民地側の反発が、独立戦争の主な原因となりました。「フランスから独立を求められたため」は誤りで、独立戦争はイギリスからの独立を求めた戦いであり、フランスは後に植民地側を支援した立場です。「先住民との対立が激化したため」は誤りで、独立戦争の主な対立軸はイギリス本国と植民地であり、先住民との対立が直接の開戦理由ではありません。「スペインとの戦争が始まったため」は誤りで、独立戦争の相手はイギリスであり、スペインとの戦争が直接のきっかけではありません。"},
  {id:"wor161", cat:"世界史", sub:"ヨーロッパ史", q:"なぜフランス革命が起こったのか、その理由として正しいものはどれか。", choices:["身分制社会への不満と財政難のため","植民地からの独立を求めたため","宗教改革が急速に進んだため","産業革命が急激に進んだため"], a:0, e:"正解は「身分制社会への不満と財政難のため」です。厳しい身分制社会への不満と、王室の財政難による重税が重なり、フランス革命が起こりました。「植民地からの独立を求めたため」は誤りで、フランス革命はフランス国内の体制変革を求めた革命であり、植民地の独立運動とは性質が異なります。「宗教改革が急速に進んだため」は誤りで、宗教改革（16世紀）はフランス革命（1789年）よりずっと前の出来事であり、直接の原因ではありません。「産業革命が急激に進んだため」は誤りで、フランスの産業革命はむしろフランス革命より後に本格化したものであり、時系列が合いません。"},
  {id:"wor163", cat:"世界史", sub:"ヨーロッパ史", q:"なぜ産業革命はイギリスで最初に起こったのか、その理由として正しいものはどれか。", choices:["石炭資源と資本の蓄積があったため","農業のみに力を入れていたため","植民地をすべて放棄していたため","宗教改革が起こらなかったため"], a:0, e:"正解は「石炭資源と資本の蓄積があったため」です。イギリスには豊富な石炭資源と、貿易で蓄積された資本、技術の発展があり、産業革命が最初に起こりました。「農業のみに力を入れていたため」は誤りで、産業革命はむしろ工業化の進展を指すものであり、農業のみに注力していたことは理由になりません。「植民地をすべて放棄していたため」は誤りで、イギリスはむしろ多くの植民地を保有し、そこから得た富や原料が産業革命の一因ともなりました。「宗教改革が起こらなかったため」は誤りで、イギリスでも宗教改革に類する動き（イギリス国教会の成立など）はあり、この選択肢は事実と異なります。"},
  {id:"wor165", cat:"世界史", sub:"ヨーロッパ史", q:"なぜ19世紀にヨーロッパ列強はアフリカ分割を進めたのか、その理由として正しいものはどれか。", choices:["資源や市場を求め競って進出したため","アフリカ諸国から要請されたため","宗教的な対立を解消するため","気候変動を調査するため"], a:0, e:"正解は「資源や市場を求め競って進出したため」です。帝国主義のもと、ヨーロッパ列強は原料の供給地と製品の市場を求めてアフリカへの進出を競いました。「アフリカ諸国から要請されたため」は誤りで、実際にはアフリカ側の意思に反して一方的に進出・分割が進められました。「宗教的な対立を解消するため」は誤りで、アフリカ分割の主な動機は経済的・戦略的な利益であり、宗教対立の解消が主目的ではありません。「気候変動を調査するため」は誤りで、これは現代的な関心事であり、19世紀のアフリカ分割の動機ではありません。"},
  {id:"wor167", cat:"世界史", sub:"両大戦期", q:"なぜ第一次世界大戦は長期化・大規模化したのか、その理由として正しいものはどれか。", choices:["同盟関係により多くの国が参戦したため","戦争が数日で終結したため","一つの国だけが戦ったため","武器の使用が禁止されたため"], a:0, e:"正解は「同盟関係により多くの国が参戦したため」です。三国同盟と三国協商という同盟関係により、開戦後に多くの国が次々と参戦し、戦争が長期化・大規模化しました。「戦闘が数日で終結してしまったため」は誤りで、実際には第一次世界大戦は数年にわたる長期戦となっており、事実と正反対です。「一部の限られた兵士だけで戦われたため」は誤りで、総力戦として多くの国民や資源が動員されたことが長期化・大規模化の一因です。「武器の使用が国際的に制限されていたため」は誤りで、実際にはこの大戦で毒ガスなど新兵器も使用されており、武器使用の制限が理由ではありません。"},
  {id:"wor169", cat:"世界史", sub:"両大戦期", q:"なぜロシア革命は起こったのか、その理由として正しいものはどれか。", choices:["戦争の長期化と貧困への不満のため","皇帝が改革を急速に進めたため","他国が革命を強制したため","経済が絶好調だったため"], a:0, e:"正解は「戦争の長期化と貧困への不満のため」です。第一次世界大戦の長期化による物資不足や貧困への不満が高まり、ロシア革命が起こりました。「皇帝が改革を急速に進めたため」は誤りで、実際には皇帝の改革の遅れや専制的な統治への不満が革命の一因であり、内容が逆です。「他国が革命を強制したため」は誤りで、ロシア革命はロシア国内の社会的・経済的な不満から生じた内発的な動きです。「経済が絶好調だったため」は誤りで、当時のロシア経済は戦争の影響で疲弊しており、絶好調とは正反対の状況でした。"},
  {id:"wor171", cat:"世界史", sub:"両大戦期", q:"なぜ世界恐慌は世界中に広がったのか、その理由として正しいものはどれか。", choices:["各国の経済が密接に結びついていたため","各国が独自の通貨制度を持たなかったため","戦争がすでに終結していたため","貿易が完全に停止していたため"], a:0, e:"正解は「各国の経済が密接に結びついていたため」です。世界経済がアメリカを中心に密接に結びついていたため、ニューヨークの株価暴落は瞬く間に世界中に波及しました。「各国が独自の通貨制度を持たなかったため」は誤りで、当時も各国はそれぞれ独自の通貨制度を持っており、この選択肢は事実と異なります。「戦争がすでに終結していたため」は誤りで、世界恐慌（1929年）は第一次世界大戦終結（1918年）から一定期間が経過した後の出来事であり、戦争終結自体が世界恐慌拡大の直接の理由ではありません。「貿易が完全に停止していたため」は誤りで、恐慌前はむしろ国際貿易が活発であったからこそ、経済的な影響が世界に波及しやすかったといえます。"},
  {id:"wor173", cat:"世界史", sub:"両大戦期", q:"なぜナチス・ドイツは国民の支持を集めたのか、その理由として正しいものはどれか。", choices:["不況からの経済回復を訴えたため","民主主義をさらに強化したため","他国との友好を最優先したため","軍備をすべて縮小したため"], a:0, e:"正解は「不況からの経済回復を訴えたため」です。世界恐慌後の深刻な不況の中、ナチスは経済の立て直しと失業対策を訴え、国民の支持を集めました。「民主主義をさらに強化したため」は誤りで、ナチスはむしろ独裁体制を志向しており、民主主義の強化とは正反対の方向性でした。「他国との友好を最優先したため」は誤りで、ナチスは対外的な拡張政策をとっており、他国との友好を最優先していたわけではありません。「軍備をすべて縮小したため」は誤りで、ナチス政権はむしろ再軍備を積極的に進めており、軍備縮小とは事実が逆です。"},
  {id:"wor175", cat:"世界史", sub:"現代", q:"なぜ第二次世界大戦後、国際連合が設立されたのか、その理由として正しいものはどれか。", choices:["戦争の再発を防ぎ平和を維持するため","一部の国の利益を優先するため","植民地支配を拡大するため","冷戦を激化させるため"], a:0, e:"正解は「戦争の再発を防ぎ平和を維持するため」です。二度の世界大戦の反省から、国際紛争を平和的に解決し、戦争の再発を防ぐために国際連合が設立されました。「一部の国の利益を優先するため」は誤りで、国際連合はすべての加盟国の平和と協力を目的とした組織であり、一部の国の利益優先を目的としたものではありません。「植民地支配を拡大するため」は誤りで、国際連合はむしろ植民地の独立を支援する役割も果たしており、支配拡大とは正反対の方向性です。「冷戦を激化させるため」は誤りで、国際連合はむしろ国際紛争の平和的解決を目指す組織であり、冷戦激化を目的としたものではありません。"},
  {id:"wor177", cat:"世界史", sub:"現代", q:"なぜ冷戦下で米ソは直接戦火を交えなかったのか、その理由として正しいものはどれか。", choices:["核戦争による共倒れを恐れたため","両国が同盟関係にあったため","戦争の技術がなかったため","国際連合が存在しなかったため"], a:0, e:"正解は「核戦争による共倒れを恐れたため」です。米ソともに核兵器を保有していたため、直接戦火を交えれば共倒れになる核戦争を恐れ、対立は間接的な形にとどまりました。「両国が同盟関係にあったため」は誤りで、米ソはむしろ対立する陣営の中心国であり、同盟関係にはありませんでした。「戦争の技術がなかったため」は誤りで、両国とも高度な軍事技術を持っており、技術不足が理由ではありません。「国際連合が存在しなかったため」は誤りで、国際連合は冷戦期にはすでに存在しており、この選択肢は事実と異なります。"},
  {id:"wor179", cat:"世界史", sub:"アジア史", q:"なぜインドはイギリスからの独立運動で非暴力を掲げたのか、その理由として正しいものはどれか。", choices:["武力では対抗できないと考えたため","武器をすべて保有していたため","イギリスと同盟関係にあったため","独立をあきらめていたため"], a:0, e:"正解は「武力では対抗できないと考えたため」です。ガンディーは軍事力でイギリスに対抗することは困難と考え、非暴力・不服従による抵抗運動を進めました。「武器をすべて保有していたため」は誤りで、実際にはインド側はイギリスに対して軍事力で劣勢であり、武器を十分に保有していたわけではありません。「イギリスと同盟関係にあったため」は誤りで、ガンディーの運動はイギリスからの独立を求めるものであり、同盟関係にあったわけではありません。「独立をあきらめていたため」は誤りで、ガンディーは非暴力の手段によって独立を実現しようとしたのであり、独立自体をあきらめていたわけではありません。"},
  {id:"wor181", cat:"世界史", sub:"現代", q:"なぜ朝鮮戦争後、朝鮮半島の分断が固定化されたのか、その理由として正しいものはどれか。", choices:["休戦のみで講和条約がなかったため","南北が統一に合意したため","戦争が短期間で終結したため","国連が統一を推進したため"], a:0, e:"正解は「休戦のみで講和条約がなかったため」です。朝鮮戦争は正式な講和条約ではなく休戦協定で戦闘が止まったため、南北分断の状態が現在まで固定化されています。「南北が統一に合意したため」は誤りで、事実とは正反対であり、南北は統一に合意せず休戦にとどまりました。「戦争が短期間で終結したため」は誤りで、朝鮮戦争は1950年から1953年まで約3年間続いた戦争であり、短期間とはいえません。「国連が統一を推進したため」は誤りで、国連軍は韓国側を支援して参戦しましたが、統一そのものは実現せず、分断が固定化されました。"},
  {id:"wor183", cat:"世界史", sub:"現代", q:"なぜベトナム戦争にアメリカは介入したのか、その理由として正しいものはどれか。", choices:["共産主義の拡大を防ごうとしたため","資源を独占しようとしたため","植民地を新設しようとしたため","同盟国から侵略されたため"], a:0, e:"正解は「共産主義の拡大を防ごうとしたため」です。冷戦下でアメリカは東南アジアでの共産主義の拡大を防ぐため、南ベトナムを支援してベトナム戦争に介入しました。「資源を独占しようとしたため」は誤りで、アメリカの介入の主な動機はイデオロギー上の対立（共産主義の拡大阻止）であり、資源独占が主目的ではありません。「植民地を新設しようとしたため」は誤りで、アメリカはベトナムを新たな植民地にしようとしたわけではなく、南ベトナム政府を支援する立場でした。「同盟国から侵略されたため」は誤りで、アメリカ自身が同盟国から侵略された事実はなく、これは介入の理由として不適切です。"},
  {id:"wor185", cat:"世界史", sub:"現代", q:"なぜ南アフリカのアパルトヘイトは国際的に非難されたのか、その理由として正しいものはどれか。", choices:["人種による差別を制度化していたため","経済成長を優先していたため","他国との貿易を拒否していたため","独立を宣言していなかったため"], a:0, e:"正解は「人種による差別を制度化していたため」です。アパルトヘイトは人種によって権利や居住地を分ける差別を法律で制度化していたため、国際的に強く非難されました。「経済成長を優先していたため」は誤りで、非難の主な理由は経済政策ではなく、人種差別を法制度として定めていたことにあります。「他国との貿易を拒否していたため」は誤りで、アパルトヘイトへの国際的非難の中心は貿易拒否ではなく、人種隔離政策そのものです。「独立を宣言していなかったため」は誤りで、南アフリカはすでに独立国であり、独立の有無が非難の理由ではありません。"},
  {id:"wor187", cat:"世界史", sub:"現代", q:"なぜ1991年に湾岸戦争が起こったのか、その理由として正しいものはどれか。", choices:["イラクがクウェートに侵攻したため","アメリカがイラクに侵攻したため","イランが独立を宣言したため","国連が解散を決定したため"], a:0, e:"正解は「イラクがクウェートに侵攻したため」です。1990年にイラクがクウェートに侵攻したことをきっかけに、翌1991年、多国籍軍がイラクを攻撃する湾岸戦争が起こりました。「アメリカがイラクに侵攻したため」は誤りで、最初の侵攻はイラクによるクウェート侵攻であり、アメリカによるイラク侵攻が発端ではありません。「イランが独立を宣言したため」は誤りで、イランはすでに独立国であり、この選択肢は事実と異なります。「国連が解散を決定したため」は誤りで、国連はこの時期も存続しており、湾岸戦争のきっかけとは無関係です。"},
  {id:"wor189", cat:"世界史", sub:"現代", q:"なぜソビエト連邦は1991年に解体したのか、その理由として正しいものはどれか。", choices:["経済の停滞と改革の混乱が重なったため","戦争に大勝利を収めたため","他国から侵略を受けたため","人口が急激に増加したため"], a:0, e:"正解は「経済の停滞と改革の混乱が重なったため」です。長年の経済停滞に加え、ペレストロイカなどの改革が政治的混乱を招き、ソビエト連邦は1991年に解体しました。「戦争に大勝利を収めたため」は誤りで、ソ連解体の要因はむしろ経済的な行き詰まりや政治的混乱であり、戦争の勝利とは無関係です。「他国から侵略を受けたため」は誤りで、ソ連解体は主に内部的な経済・政治要因によるものであり、他国からの侵略が直接の原因ではありません。「人口が急激に増加したため」は誤りで、人口動態の変化がソ連解体の主要因とはされていません。"},
  {id:"wor191", cat:"世界史", sub:"アジア史", q:"なぜ中国は改革開放政策を進めたのか、その理由として正しいものはどれか。", choices:["市場経済を導入し経済成長を図るため","社会主義体制を完全に放棄するため","他国との国交をすべて断つため","農業だけに力を入れるため"], a:0, e:"正解は「市場経済を導入し経済成長を図るため」です。鄧小平のもとで、中国は社会主義体制を維持しつつ市場経済を導入し、経済成長を図る改革開放政策を進めました。「社会主義体制を完全に放棄するため」は誤りで、中国は共産党一党支配という社会主義的な政治体制自体は維持しながら、経済面で市場経済の要素を取り入れました。「他国との国交をすべて断つため」は誤りで、改革開放政策はむしろ対外開放を進めるものであり、国交断絶とは正反対です。「農業だけに力を入れるため」は誤りで、改革開放政策は農業だけでなく工業やサービス業など幅広い分野の経済発展を目指すものでした。"},
  {id:"wor193", cat:"世界史", sub:"現代", q:"なぜバンドン会議にアジア・アフリカの新興国が集まったのか、その理由として正しいものはどれか。", choices:["独立国どうしの連帯を確認するため","冷戦をさらに激化させるため","旧宗主国と同盟を結ぶため","軍事同盟を新設するため"], a:0, e:"正解は「独立国どうしの連帯を確認するため」です。植民地支配から独立したばかりのアジア・アフリカ諸国は、互いの連帯を確認するためバンドン会議に集まりました。「冷戦をさらに激化させるため」は誤りで、バンドン会議はむしろ東西いずれの陣営にも属さない非同盟主義の立場を確認する場であり、冷戦激化を目的としたものではありません。「旧宗主国と同盟を結ぶため」は誤りで、参加国の多くは旧宗主国（植民地支配国）からの独立を果たした国々であり、その旧宗主国との同盟を目指したわけではありません。「軍事同盟を新設するため」は誤りで、バンドン会議は平和共存や経済協力を確認する場であり、軍事同盟の結成を目的としたものではありません。"},
  {id:"wor195", cat:"世界史", sub:"現代", q:"なぜEU加盟国の多くは共通通貨ユーロを導入したのか、その理由として正しいものはどれか。", choices:["貿易や経済活動を円滑にするため","各国の独自性を強調するため","為替変動を増やすため","戦争の資金を調達するため"], a:0, e:"正解は「為替変動のリスクをなくし域内貿易を促進すること」です。共通通貨ユーロの導入により為替変動のリスクをなくし、加盟国間の貿易や投資を円滑にすることが目指されました。「各国の物価をあえて異なるものにすること」は誤りで、共通通貨の導入はむしろ経済的な統合・安定を目指すものであり、物価の違いを助長する目的ではありません。「加盟国の経済的独自性を強めることであった」は誤りで、共通通貨はむしろ加盟国間の経済的な結びつきを強め、独自性よりも統合を重視する政策です。「域内の貿易活動を制限することであった」は誤りで、ユーロ導入の目的はむしろ域内貿易の促進であり、制限とは正反対です。"},
  {id:"wor197", cat:"世界史", sub:"ヨーロッパ史", q:"なぜ産業革命後、都市に人口が集中するようになったのか、その理由として正しいものはどれか。", choices:["工場労働を求めて農村から移動したため","農業の生産性が急激に低下したため","都市の税金がすべて廃止されたため","戦争で農村が消滅したため"], a:0, e:"正解は「工場労働を求めて農村から移動したため」です。工場での労働の機会を求め、多くの人々が農村から都市へと移り住んだことで、都市への人口集中が進みました。「農業の生産性が急激に低下したため」は誤りで、実際には農業の生産性向上によって少ない人手でも農業が維持できるようになり、余剰労働力が都市に向かった側面もあります。「都市の税金がすべて廃止されたため」は誤りで、産業革命期に都市の税制が全廃された事実はなく、都市集中の主な理由ではありません。「戦争で農村が消滅したため」は誤りで、産業革命期のイギリスでは戦争によって農村が消滅した事実はなく、都市化の主な理由ではありません。"},
  {id:"wor199", cat:"世界史", sub:"両大戦期", q:"なぜ国際連盟は第二次世界大戦を防ぐことができなかったのか、その理由として正しいものはどれか。", choices:["有力国の不参加と制裁力の弱さのため","加盟国が非常に多かったため","経済制裁が強力すぎたため","軍事力が突出していたため"], a:0, e:"正解は「有力国の不参加と経済制裁以外の強制力の弱さのため」です。アメリカの不参加や、侵略国に対する軍事的な強制手段の弱さが、国際連盟の大きな弱点となりました。「加盟国の数が非常に多かったことであった」は誤りで、加盟国数の多さ自体は問題の本質ではなく、実効性のある強制手段が乏しかったことが弱点でした。「本部が置かれた場所が適切でなかったことであった」は誤りで、本部の所在地（スイスのジュネーブ）自体が第二次世界大戦を防げなかった主な理由ではありません。「会議が開かれる回数が多すぎたことであった」は誤りで、会議の開催頻度は国際連盟の実効性の弱さの本質的な原因とはされていません。"},
  /* 地理 */
  {id:"geo149", cat:"地理", sub:"世界地理", q:"なぜ地図には縮尺が示されているのか、その理由として正しいものはどれか。", choices:["実際の距離を正しく読み取るため","土地の高さの変化を示すため","方位を分かりやすく示すため","気候の違いを表すため"], a:0, e:"正解は「実際の距離を正しく読み取るため」です。縮尺は地図上の長さと実際の距離との比率を示すもので、これにより実際の距離を正しく読み取ることができます。「土地の高さの変化を示すため」は誤りで、これは等高線など別の地図記号の役割であり、縮尺の目的ではありません。「方位を分かりやすく示すため」は誤りで、これは方位記号の役割であり、縮尺とは異なる要素です。「気候の違いを表すため」は誤りで、気候の違いは気候図など別の資料で示されるものであり、縮尺とは無関係です。"},
  {id:"geo151", cat:"地理", sub:"世界地理", q:"なぜ日本と世界各地では時差が生じるのか、その理由として正しいものはどれか。", choices:["地球の自転により時刻がずれるため","国によって時計の性能が違うため","季節によって時間の長さが違うため","地球の大きさが変化するため"], a:0, e:"正解は「地球の自転により時刻がずれるため」です。地球は自転しながら太陽の光を受けているため、経度によって太陽が南中する時刻が異なり、時差が生じます。「国によって時計の性能が違うため」は誤りで、時差は時計の精度の問題ではなく、地球の自転と経度による太陽の位置の違いによって生じる自然現象です。「季節によって時間の長さが違うため」は誤りで、1日の長さ（24時間）は季節によって変わるものではなく、時差の原因ではありません。「地球の大きさが変化するため」は誤りで、地球の大きさは基本的に一定であり、時差の原因ではありません。"},
  {id:"geo153", cat:"地理", sub:"世界地理", q:"なぜ標高の高い地域は気温が低くなるのか、その理由として正しいものはどれか。", choices:["高度が上がるほど空気が薄くなるため","太陽に近づき過ぎてしまうため","海からの距離が遠くなるため","緯度が変化してしまうため"], a:0, e:"正解は「高度が上がるほど空気が薄くなるため」です。標高が高くなるほど空気が薄くなり熱をたくわえにくくなるため、気温は低くなります。「太陽に近づき過ぎてしまうため」は誤りで、地表からの標高の違いは太陽までの距離に対してごくわずかであり、気温低下の主な理由にはなりません。「海からの距離が遠くなるため」は誤りで、これは大陸性気候などに関する要因であり、標高による気温低下の直接の理由ではありません。「緯度が変化してしまうため」は誤りで、標高が変わっても緯度（南北の位置）自体は変わらないため、これは誤った説明です。"},
  {id:"geo155", cat:"地理", sub:"日本地理", q:"なぜ川の下流域には人口が集中しやすいのか、その理由として正しいものはどれか。", choices:["平地が広く農業や交通に適するため","山地が多く農業に適しているため","常に洪水が発生し安全なため","気温が極端に低いため"], a:0, e:"正解は「平地が広く農業や交通に適するため」です。川の下流域には平野が広がり、農業や交通、生活に適しているため、多くの人口が集中しやすくなります。「山地が多く農業に適しているため」は誤りで、川の下流域はむしろ平地が多く、山地が広がるのは上流域に近い地域です。「常に洪水が発生し安全なため」は誤りで、洪水の発生と「安全」であることは矛盾しており、論理的に成り立たない説明です。「気温が極端に低いため」は誤りで、気温の低さは人口集中の理由としては不適切であり、下流域の特徴とも直接結びつきません。"},
  {id:"geo157", cat:"地理", sub:"日本地理", q:"なぜ日本では治水と利水のためにダムが建設されるのか、その理由として正しいものはどれか。", choices:["洪水を防ぎ水を有効利用するため","船の航行を妨げるため","土地の面積を減らすため","気候を人工的に変えるため"], a:0, e:"正解は「洪水を防ぎ水を有効利用するため」です。ダムは川の水量を調節して洪水を防ぐとともに、生活用水や農業用水として水を有効に利用するために建設されます。「船の航行を妨げるため」は誤りで、これはダム建設の目的ではなく、むしろ意図しない副作用として生じうる事柄です。「土地の面積を減らすため」は誤りで、ダム建設によって水没する土地が生じることはありますが、これはダムの目的ではなく結果として生じる影響です。「気候を人工的に変えるため」は誤りで、ダムの主目的は治水・利水であり、気候改変を目的としたものではありません。"},
  {id:"geo159", cat:"地理", sub:"日本地理", q:"なぜ日本の農業で酪農は北海道で特に盛んなのか、その理由として正しいものはどれか。", choices:["広い土地と冷涼な気候が適するため","人口が非常に多いため","稲作に最も適した土地のため","台風の被害が少ないため"], a:0, e:"正解は「広い土地と冷涼な気候が適するため」です。北海道は広大な土地と冷涼な気候に恵まれており、乳牛の飼育に適していることから酪農が盛んです。「人口が非常に多いため」は誤りで、北海道は他の都府県と比べて人口密度が低い地域であり、人口の多さが酪農発展の理由ではありません。「稲作に最も適した土地のため」は誤りで、北海道は冷涼な気候のため伝統的には稲作にはやや不向きとされ、酪農や畑作が発達してきました。「台風の被害が少ないため」は誤りで、これは酪農が盛んな直接の理由としては不十分であり、気候の冷涼さと広い土地の方が本質的な要因です。"},
  {id:"geo161", cat:"地理", sub:"日本地理", q:"なぜ日本の工業は太平洋ベルトに集中して発達したのか、その理由として正しいものはどれか。", choices:["港が多く原料や製品の輸送に便利なため","山地が多く工場建設に適するため","気候が最も寒冷なため","人口が最も少ないため"], a:0, e:"正解は「港が多く原料や製品の輸送に便利なため」です。太平洋ベルトには港が多く、原料の輸入や製品の輸出に便利であったため、工業地帯が集中して発達しました。「山地が多く工場建設に適するため」は誤りで、太平洋ベルトはむしろ平野部を中心に発達しており、山地の多さが工業発達の理由ではありません。「気候が最も寒冷なため」は誤りで、太平洋ベルトは比較的温暖な地域であり、気候の寒冷さは工業発達の理由として不適切です。「人口が最も少ないため」は誤りで、太平洋ベルトはむしろ日本で最も人口が集中している地域の一つです。"},
  {id:"geo163", cat:"地理", sub:"日本地理", q:"なぜ日本は加工貿易を中心に発展してきたのか、その理由として正しいものはどれか。", choices:["原料を輸入し製品を輸出するため","国内資源が非常に豊富なため","農業のみで経済を支えるため","貿易をできるだけ制限するため"], a:0, e:"正解は「原料を輸入し製品を輸出するため」です。資源に乏しい日本は、海外から原料を輸入して工業製品に加工し、それを輸出する加工貿易を中心に発展してきました。「国内資源が非常に豊富なため」は誤りで、事実とは正反対であり、日本は資源に乏しいからこそ原料を輸入する必要がありました。「農業のみで経済を支えるため」は誤りで、加工貿易は工業製品の輸出入に関するものであり、農業のみに依存する経済とは異なります。「貿易をできるだけ制限するため」は誤りで、加工貿易はむしろ活発な貿易活動を前提とした仕組みであり、貿易制限とは正反対です。"},
  {id:"geo165", cat:"地理", sub:"日本地理", q:"なぜ少子高齢化が進むと社会保障の負担が増えるのか、その理由として正しいものはどれか。", choices:["支える現役世代の人数が減少するため","高齢者の人口が減少するため","出生率が急激に上昇するため","労働力人口が増加し続けるため"], a:0, e:"正解は「支える現役世代の人数が減少するため」です。少子高齢化が進むと、年金や医療を支える現役世代の人数が減り、一人当たりの負担が増加します。「高齢者の人口が減少するため」は誤りで、少子高齢化はむしろ高齢者の割合が「増加」する現象であり、減少とは事実が逆です。「出生率が急激に上昇するため」は誤りで、少子高齢化は出生率の「低下」を伴う現象であり、上昇とは正反対です。「労働力人口が増加し続けるため」は誤りで、少子化が進むと将来の労働力人口はむしろ減少していく傾向にあります。"},
  {id:"geo167", cat:"地理", sub:"日本地理", q:"なぜ都市部では交通渋滞が発生しやすいのか、その理由として正しいものはどれか。", choices:["人口や自動車が過度に集中しているため","道路の数が非常に多いため","人口が極端に少ないため","自動車の利用が禁止されているため"], a:0, e:"正解は「人口や自動車が過度に集中しているため」です。都市部には人口と自動車が過度に集中しているため、道路の交通量が容量を超え、渋滞が発生しやすくなります。「道路の数が非常に多いため」は誤りで、道路が多いこと自体は渋滞緩和につながる場合もあり、渋滞の直接の原因とはいえません。「人口が極端に少ないため」は誤りで、これは過疎地域の特徴であり、交通渋滞が生じやすい都市部の説明とは正反対です。「自動車の利用が禁止されているため」は誤りで、むしろ都市部では自動車利用が多いことが渋滞の一因であり、禁止されているわけではありません。"},
  {id:"geo169", cat:"地理", sub:"世界地理", q:"なぜ熱帯雨林の減少が地球環境に深刻な影響を与えるのか、その理由として正しいものはどれか。", choices:["二酸化炭素の吸収量が減少するため","気温が急激に低下するため","海面が大きく下降するため","降水量が急激に増加するため"], a:0, e:"正解は「二酸化炭素を吸収する森林の機能が失われるため」です。森林は光合成により二酸化炭素を吸収する役割を持つため、熱帯雨林の減少はその吸収機能の低下につながります。「気温が急激に低下するため」は誤りで、熱帯雨林の減少はむしろ地球温暖化（気温上昇）につながるとされており、低下とは逆の内容です。「海面が大きく下降するため」は誤りで、温暖化が進むと氷河がとけるなどして海面は上昇するとされ、下降とは事実が逆です。「森林の減少は降水量にのみ影響を与えるため」は誤りで、森林減少の影響は降水量だけでなく二酸化炭素吸収量の低下など多岐にわたります。"},
  {id:"geo171", cat:"地理", sub:"世界地理", q:"なぜサヘル地域で砂漠化が進行しているのか、その理由として正しいものはどれか。", choices:["過放牧や過耕作で土地が疲弊するため","降水量が過剰に増えているため","森林が急激に増加しているため","気温が急激に低下しているため"], a:0, e:"正解は「過放牧や過耕作で土地が疲弊するため」です。サヘル地域では人口増加にともなう過放牧や過耕作により土地が疲弊し、砂漠化が進行しています。「降水量が過剰に増えているため」は誤りで、サヘル地域はむしろ降水量が不安定・少ない傾向にあり、過剰な増加が砂漠化の原因ではありません。「森林が急激に増加しているため」は誤りで、砂漠化はむしろ植生の減少を伴う現象であり、森林増加とは正反対です。「気温が急激に低下しているため」は誤りで、砂漠化の進行と気温低下は直接結びつかず、この選択肢は不適切です。"},
  {id:"geo173", cat:"地理", sub:"日本地理", q:"なぜ日本海側の地域は冬に雪が多く降るのか、その理由として正しいものはどれか。", choices:["冷たい季節風が日本海の水分を含むため","夏の台風が繰り返し来るため","赤道からの暖流が流れ込むため","山地がまったく存在しないため"], a:0, e:"正解は「冷たい季節風が日本海の水分を含むため」です。冬に大陸から吹く冷たい北西の季節風が日本海の水分を含み、山地にぶつかって日本海側に多くの雪を降らせます。「夏の台風が繰り返し来るため」は誤りで、これは夏の現象であり、冬に降る雪の説明としては時期が合いません。「赤道からの暖流が流れ込むため」は誤りで、日本海側の冬の降雪は暖流ではなく大陸からの冷たい季節風が主な要因です。「山地がまったく存在しないため」は誤りで、実際には山地が季節風をせき止めることで日本海側に大量の雪を降らせる仕組みであり、山地の存在が重要な役割を果たしています。"},
  {id:"geo175", cat:"地理", sub:"日本地理", q:"なぜ太平洋側の地域は夏に降水量が多いのか、その理由として正しいものはどれか。", choices:["南からの湿った季節風が吹くため","冬の間ずっと晴天が続くため","山地が海に面していないため","台風が一切接近しないため"], a:0, e:"正解は「南からの湿った季節風が吹くため」です。夏には南東からの湿った季節風が吹き込み、山地にぶつかって太平洋側に多くの雨を降らせます。「冬の間ずっと晴天が続くため」は誤りで、これは太平洋側の冬の特徴であり、夏の降水量の多さの説明としては不適切です。「山地が海に面していないため」は誤りで、山地の存在はむしろ季節風をせき止め降水をもたらす重要な要因であり、この選択肢の内容は事実と矛盾します。「台風が一切接近しないため」は誤りで、実際には夏から秋にかけて台風が接近することも太平洋側の降水量の多さに寄与しています。"},
  {id:"geo177", cat:"地理", sub:"世界地理", q:"なぜ世界的に都市化が進行しているのか、その理由として正しいものはどれか。", choices:["仕事や利便性を求めて人が集まるため","農業の生産性が低下し続けるため","農村の人口が急激に増えるため","都市の税金がすべて廃止されたため"], a:0, e:"正解は「仕事や利便性を求めて人が集まるため」です。仕事の機会や生活の利便性を求めて多くの人々が農村から都市へ移動するため、世界的に都市化が進んでいます。「農業の生産性が低下し続けるため」は誤りで、実際には農業の生産性向上により少ない人手で済むようになったことが余剰労働力を都市に向かわせた一因ではありますが、これは「低下」ではなく「向上」が背景です。「農村の人口が急激に増えるため」は誤りで、都市化はむしろ農村の人口が都市へ流出する現象であり、農村人口の急増とは逆です。「都市の税金がすべて廃止されたため」は誤りで、税制の変更が都市化の主な理由とはされていません。"},
  {id:"geo179", cat:"地理", sub:"世界地理", q:"なぜ発展途上国では人口爆発と呼ばれる急激な人口増加が起こりやすいのか、その理由として正しいものはどれか。", choices:["医療の発達で死亡率が下がったため","出生率が極端に低下したため","先進国からの移民が急増したため","農業生産がすべて停止したため"], a:0, e:"正解は「医療の発達で死亡率が下がったため」です。医療技術の普及により死亡率が低下する一方で出生率が高い状態が続くため、発展途上国では急激な人口増加が起こりやすくなります。「出生率が極端に低下したため」は誤りで、人口爆発が起こる社会ではむしろ出生率は高い水準を維持していることが多く、低下とは事実が逆です。「先進国からの移民が急増したため」は誤りで、人口爆発の主な要因は自然増加（出生と死亡のバランス）であり、移民の増加が主因ではありません。「農業生産がすべて停止したため」は誤りで、人口爆発と農業生産の停止は直接結びつかず、この選択肢は不適切です。"},
  {id:"geo181", cat:"地理", sub:"日本地理", q:"なぜ日本では地震や津波への備えが特に重視されているのか、その理由として正しいものはどれか。", choices:["プレート境界に位置し災害が多いため","火山がまったく存在しないため","地震が発生したことがないため","海に面していない国のため"], a:0, e:"正解は「プレート境界に位置し災害が多いため」です。日本列島は複数のプレートの境界に位置しているため地震や火山活動が活発で、津波などの災害も多く発生します。「火山がまったく存在しないため」は誤りで、日本列島には多くの活火山が存在し、この選択肢は事実と正反対です。「地震が発生したことがないため」は誤りで、日本は世界有数の地震多発地帯であり、この選択肢は明らかに事実に反します。「海に面していない国のため」は誤りで、日本は島国であり、四方を海に囲まれているため、この選択肢も事実と矛盾します。"},
  {id:"geo183", cat:"地理", sub:"世界地理", q:"なぜ再生可能エネルギーの導入が世界的に進められているのか、その理由として正しいものはどれか。", choices:["資源の枯渇や環境負荷を減らすため","化石燃料の埋蔵量を増やすため","電力の使用をすべて禁止するため","経済成長を止めるため"], a:0, e:"正解は「資源の枯渇や環境負荷を減らすため」です。化石燃料の枯渇や地球温暖化への懸念から、資源が枯渇せず環境負荷の少ない再生可能エネルギーの導入が進められています。「化石燃料の埋蔵量を増やすため」は誤りで、再生可能エネルギーの導入は化石燃料の使用を減らす方向の取り組みであり、埋蔵量を増やすこととは無関係です。「電力の使用をすべて禁止するため」は誤りで、再生可能エネルギーはむしろ電力を供給するための手段であり、電力使用の禁止とは正反対の目的です。「経済成長を止めるため」は誤りで、再生可能エネルギーの推進はむしろ持続可能な経済成長を目指す取り組みであり、成長を止めることを目的としたものではありません。"},
  {id:"geo185", cat:"地理", sub:"日本地理", q:"なぜ食料自給率の低下は安全保障上の課題とされるのか、その理由として正しいものはどれか。", choices:["輸入が止まると食料不足に陥るため","国内の農業が発展しすぎるため","輸出量が増加しすぎるため","農産物の価格が下落し続けるため"], a:0, e:"正解は「輸入が滞った場合に国内で食料不足が起こりうるため」です。食料の多くを輸入に頼っていると、何らかの事情で輸入が滞った際に、国内で深刻な食料不足が起こる危険性があります。「国内の農業が発展しすぎるため」は誤りで、これは自給率低下の逆の状況であり、安全保障上の懸念とは結びつきません。「輸出量が増加しすぎるため」は誤りで、食料自給率の低さは輸入依存に関する問題であり、輸出量の多さとは別の事柄です。「農産物の価格が下落し続けるため」は誤りで、価格下落は自給率低下の懸念とは異なる経済上の課題であり、安全保障上の課題の直接の説明にはなりません。"},
  {id:"geo187", cat:"地理", sub:"日本地理", q:"なぜ日本で過疎化が進む地域が増えているのか、その理由として正しいものはどれか。", choices:["若者が仕事を求め都市へ流出するため","高齢者が地方に移住してくるため","出生率が急激に上昇しているため","都市の人口が減少しているため"], a:0, e:"正解は「若者が仕事を求め都市へ流出するため」です。働く場を求めて若者が地方から都市へ流出することで、地方には高齢者が多く残り、過疎化が進んでいます。「高齢者が地方に移住してくるため」は誤りで、過疎化の主な要因は若年層の流出であり、高齢者の流入が主因とはされていません。「出生率が急激に上昇しているため」は誤りで、過疎地域ではむしろ出生率の低下も進んでおり、上昇とは事実が異なります。「都市の人口が減少しているため」は誤りで、実際には都市の人口はむしろ増加傾向にあり、これが地方の過疎化と対をなす現象です。"},
  {id:"geo189", cat:"地理", sub:"世界地理", q:"なぜ日本は多くの資源を輸入に頼っているのか、その理由として正しいものはどれか。", choices:["国内の資源埋蔵量が少ないため","資源を輸出する余裕があるため","輸入のほうが法律で有利なため","国内消費が極端に少ないため"], a:0, e:"正解は「国内の資源埋蔵量が少ないため」です。日本は石油や鉱物資源などの国内埋蔵量が少ないため、多くの資源を海外からの輸入に頼っています。「資源を輸出する余裕があるため」は誤りで、事実とは正反対であり、日本は資源を輸出するのではなく輸入に頼っている国です。「輸入のほうが法律で有利なため」は誤りで、資源輸入への依存は法律上の優遇措置によるものではなく、国内資源の乏しさという地理的・地質的な要因によるものです。「国内消費が極端に少ないため」は誤りで、日本のエネルギーや資源の消費量は少なくなく、輸入依存の理由としては不適切です。"},
  {id:"geo191", cat:"地理", sub:"世界地理", q:"なぜ貿易摩擦は二国間の関係を悪化させることがあるのか、その理由として正しいものはどれか。", choices:["輸出入の不均衡が経済的対立を生むため","貿易がまったく行われていないため","関税がすべて撤廃されているため","両国の言語が異なるため"], a:0, e:"正解は「輸出入の不均衡が経済的対立を生むため」です。一方的な輸出超過などにより輸出入の不均衡が生じると、経済的な対立が起こり、貿易摩擦につながることがあります。「貿易がまったく行われていないため」は誤りで、貿易摩擦はむしろ活発な貿易が行われている中で、その不均衡から生じる問題であり、貿易が行われていないこととは矛盾します。「関税がすべて撤廃されているため」は誤りで、貿易摩擦はむしろ関税や輸出入規制などをめぐる対立から生じることが多く、関税撤廃自体が原因ではありません。「両国の言語が異なるため」は誤りで、言語の違いは貿易摩擦の直接の原因ではなく、経済的な不均衡こそが本質的な要因です。"},
  {id:"geo193", cat:"地理", sub:"日本地理", q:"なぜ日本の総人口は近年減少傾向にあるのか、その理由として正しいものはどれか。", choices:["出生数が死亡数を下回っているため","海外への移住が急増しているため","平均寿命が急激に短くなったため","出生数が死亡数を上回っているため"], a:0, e:"正解は「出生数が死亡数を下回っているため」です。少子化により生まれる子どもの数が亡くなる人の数を下回る状態が続いているため、日本の総人口は減少しています。「海外への移住が急増しているため」は誤りで、日本の人口減少の主な要因は自然減（出生数と死亡数の関係）であり、海外移住の急増が主因ではありません。「平均寿命が急激に短くなったため」は誤りで、日本の平均寿命はむしろ世界的にも高い水準を維持しており、急激に短くなった事実はありません。「出生数が死亡数を上回っているため」は誤りで、これは人口が増加する場合の説明であり、実際の日本の人口減少とは正反対の内容です。"},
  {id:"geo195", cat:"地理", sub:"世界地理", q:"なぜ都市の中心部で「ヒートアイランド現象」が起こるのか、その理由として正しいものはどれか。", choices:["アスファルトや排熱が熱をため込むため","森林が都市中心部に多いため","海からの風が吹き込むため","標高が非常に高いため"], a:0, e:"正解は「アスファルトや建物からの排熱が熱をため込むため」です。アスファルトやコンクリート、建物やエアコンからの排熱が熱をため込むことで、都市中心部の気温が周辺より高くなります。「森林が都市中心部に多いため」は誤りで、実際には都市中心部は緑地が少なく、アスファルトやコンクリートに覆われていることがヒートアイランド現象の一因です。「海からの風が吹き込むため」は誤りで、海風はむしろ都市の気温を下げる方向に働くことがあり、ヒートアイランドの原因とはいえません。「標高が非常に高いため」は誤りで、標高の高さは一般に気温を下げる要因であり、ヒートアイランド現象（気温上昇）の説明としては不適切です。"},
  {id:"geo197", cat:"地理", sub:"世界地理", q:"なぜ複数の国を流れる国際河川では周辺国の協力が重要とされるのか、その理由として正しいものはどれか。", choices:["水資源の利用や管理を共有するため","国境をなくすことが目的のため","特定の国だけが独占するため","戦争を促進するため"], a:0, e:"正解は「上流国の利用が下流国の水量に直接影響するため」です。上流国での水の利用や開発は下流国の水量や水質に直接影響を与えるため、国際河川では周辺国の協力が欠かせません。「国境をなくすことが目的のため」は誤りで、国際河川の協力は国境の廃止を目的としたものではなく、水資源の適切な利用・管理を目指すものです。「特定の国だけが独占するため」は誤りで、協力が重要とされる理由はむしろ特定の国による独占的な利用を避け、公平な利用を図るためです。「戦争を促進するため」は誤りで、国際河川での協力はむしろ紛争を防ぎ、平和的な資源利用を図ることを目的としています。"},
  /* 公民 */
  {id:"civ149", cat:"公民", sub:"政治体制", q:"なぜ地方自治において住民には直接請求権が認められているのか、その理由として正しいものはどれか。", choices:["住民の意思を政治に直接反映させるため","首長の権限を無制限に強めるため","国の権限を地方に集中させるため","選挙を完全に廃止するため"], a:0, e:"正解は「住民の意思を政治に直接反映させるため」です。直接請求権は、条例の制定や首長の解職などについて、住民の意思を政治に直接反映させるために認められています。「首長の権限を無制限に強めるため」は誤りで、直接請求権はむしろ住民が首長の解職を求めることもできる制度であり、首長の権限強化とは異なる、住民主体の仕組みです。「国の権限を地方に集中させるため」は誤りで、直接請求権は住民が地方政治に参加する権利であり、国と地方の権限配分とは別の制度です。「選挙を完全に廃止するため」は誤りで、直接請求権は選挙制度を補完する仕組みであり、選挙自体を廃止するものではありません。"},
  {id:"civ151", cat:"公民", sub:"政治体制", q:"なぜ国会には国政調査権が与えられているのか、その理由として正しいものはどれか。", choices:["行政が適正に行われているか調査するため","裁判所の判決を覆すため","天皇の権限を調査するため","地方自治体を廃止するため"], a:0, e:"正解は「行政が適正に行われているか調査するため」です。国政調査権は、内閣をはじめとする行政が適正に行われているかを国会が調査できるようにするために認められています。「裁判所の判決を覆すため」は誤りで、国政調査権は行政に対する調査権限であり、裁判所の判決を覆す権限ではありません（三権分立に反します）。「天皇の権限を調査するため」は誤りで、天皇は政治的権能を持たない象徴的存在であり、国政調査権の対象として想定されていません。「地方自治体を廃止するため」は誤りで、国政調査権は国政に関する調査権限であり、地方自治体の廃止とは無関係です。"},
  {id:"civ153", cat:"公民", sub:"政治体制", q:"なぜ国の予算は国会の議決が必要とされるのか、その理由として正しいものはどれか。", choices:["税金の使い道を国民の代表が決めるため","内閣だけで自由に決めるため","天皇が最終的に決定するため","裁判所が使い道を審査するため"], a:0, e:"正解は「税金の使い道を国民の代表が決めるため」です。国民が納めた税金の使い道は、国民の代表によって構成される国会の議決によって決められる必要があります。「内閣だけで自由に決めるため」は誤りで、予算は内閣が作成しますが、最終的な議決権は国民の代表からなる国会にあり、内閣だけで自由に決められるものではありません。「天皇が最終的に決定するため」は誤りで、天皇は政治的権能を持たず、予算の決定に関与しません。「裁判所が使い道を審査するため」は誤りで、予算の議決は国会の役割であり、裁判所が直接使い道を決定する仕組みではありません。"},
