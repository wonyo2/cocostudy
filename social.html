  {id:"civ425", cat:"公民", sub:"労働・法律", q:"労働者が育児や家族の介護のために一定期間仕事を休むことを認める法律を何というか。", choices:["育児・介護休業法","男女雇用機会均等法","労働基準法","労働組合法"], a:0, e:"正解は「育児・介護休業法」です。育児・介護休業法は、労働者が子育てや家族の介護のために一定期間休業することを保障し、仕事と家庭の両立を支援する法律です。「男女雇用機会均等法」は誤りで、これは雇用における男女の差別的取り扱いを禁止する法律であり、休業取得そのものを直接定めた法律ではありません。「労働基準法」は誤りで、これは労働時間・賃金など労働条件の最低基準を定める法律です。「労働組合法」は誤りで、これは労働組合の結成や団体交渉権などを定める法律であり、いずれも育児・介護休業を直接定めた法律ではありません。"},
  {id:"civ427", cat:"公民", sub:"労働・法律", q:"労働者に支払われる賃金について、これを下回ってはならないと法律で定められた金額を何というか。", choices:["最低賃金","平均賃金","基本給のみ","年功賃金"], a:0, e:"正解は「最低賃金」です。最低賃金は最低賃金法にもとづき、都道府県や産業ごとに定められる、これを下回って賃金を支払ってはならない金額です。「平均賃金」は誤りで、これは統計上の賃金の平均値を指す言葉であり、法律上の下限を定める制度ではありません。「基本給のみ」は誤りで、これは賃金の構成要素の一部を指す言葉であり、最低賃金の概念とは異なります。「年功賃金」は誤りで、これは勤続年数に応じて賃金が上がる制度であり、最低額の保障とは異なる仕組みです。"},
  {id:"civ429", cat:"公民", sub:"経済", q:"日本の公的医療保険制度のうち、自営業者や無職の人などが加入する制度を何というか。", choices:["国民健康保険","健康保険組合","共済組合","雇用保険"], a:0, e:"正解は「国民健康保険」です。国民健康保険は主に自営業者や無職の人、年金生活者などが加入する公的医療保険で、市町村（または都道府県）が運営しています。「健康保険組合」は誤りで、これは主に大企業の従業員などが加入する被用者保険の一種です。「共済組合」は誤りで、これは公務員などが加入する保険制度です。「雇用保険」は誤りで、これは失業した場合の給付などを行う制度であり、医療保険とは目的が異なります。"},
  {id:"civ431", cat:"公民", sub:"経済", q:"40歳以上の国民が加入し、介護が必要になった場合にサービスを受けられる公的な保険制度を何というか。", choices:["介護保険制度","国民健康保険","雇用保険","労災保険"], a:0, e:"正解は「介護保険制度」です。介護保険制度は2000年に始まった制度で、40歳以上の国民が加入し、介護が必要になった際に費用の一部負担でサービスを受けられる仕組みです。「国民健康保険」は誤りで、これは医療費を保障する保険制度であり、介護サービスを主な対象としていません。「雇用保険」は誤りで、これは失業時の給付などを行う制度です。「労災保険」は誤りで、これは仕事中や通勤中の事故による負傷などを保障する制度であり、いずれも介護保険とは目的が異なります。"},
  {id:"civ433", cat:"公民", sub:"経済", q:"生活に困窮する人に対し、国が最低限度の生活を保障するために行う制度を何というか。", choices:["生活保護制度","介護保険制度","雇用保険","国民年金"], a:0, e:"正解は「生活保護制度」です。生活保護制度は憲法第25条の生存権にもとづき、生活に困窮する国民に対して国が最低限度の生活を保障するために設けられた制度です。「介護保険制度」は誤りで、これは介護が必要な人にサービスを提供する制度であり、生活困窮そのものへの対応とは異なります。「雇用保険」は誤りで、これは失業時の給付を行う制度です。「国民年金」は誤りで、これは高齢になった際などに年金を支給する制度であり、いずれも生活保護制度とは目的や対象が異なります。"},
  {id:"civ435", cat:"公民", sub:"労働・法律", q:"高齢者や障がいのある人を含め、誰もが利用しやすいように製品や施設をあらかじめ設計する考え方を何というか。", choices:["ユニバーサルデザイン","バリアフリー","フェアトレード","コンパクトシティ"], a:0, e:"正解は「ユニバーサルデザイン」です。ユニバーサルデザインは、年齢や障がいの有無にかかわらず、できるだけ多くの人が使いやすいように、あらかじめ製品や施設を設計する考え方です。「バリアフリー」は誤りで、これは既存の障壁（バリア）を後から取り除くことに重点を置く考え方であり、最初から誰もが使いやすく設計するユニバーサルデザインとはやや視点が異なります。「フェアトレード」は誤りで、これは公正な貿易の仕組みに関する用語です。「コンパクトシティ」は誤りで、これは都市機能を集約するまちづくりの考え方であり、いずれもユニバーサルデザインとは異なる概念です。"},
  {id:"civ437", cat:"公民", sub:"政治体制", q:"1999年に制定され、国や地方公共団体の事務の役割分担を見直し、地方自治体の権限を拡大した法律を何というか。", choices:["地方分権一括法","地方自治法","男女共同参画社会基本法","消費者基本法"], a:0, e:"正解は「地方分権一括法」です。地方分権一括法は1999年に制定され、国と地方の役割分担を見直し、機関委任事務の廃止など地方自治体の自主性・権限を拡大する改革を進めました。「地方自治法」は誤りで、これは地方自治の基本的な仕組みを定めるより古くからある法律です。「男女共同参画社会基本法」は誤りで、これは男女が対等に社会参画できる社会を目指す法律です。「消費者基本法」は誤りで、これは消費者の権利保護を目的とする法律であり、いずれも地方分権改革を直接の目的とはしていません。"},
  {id:"civ439", cat:"公民", sub:"経済", q:"国から地方公共団体への税財源の移譲、補助金の見直し、地方交付税の見直しをあわせて行った2000年代の改革を何というか。", choices:["三位一体の改革","地方分権一括法","平成の大合併","規制緩和"], a:0, e:"正解は「三位一体の改革」です。三位一体の改革は、国庫補助負担金の削減・税源移譲・地方交付税の見直しという三つの改革を一体的に進めた、2000年代に行われた地方財政改革です。「地方分権一括法」は誤りで、これは1999年に制定された、事務や権限の分担を見直す法律であり、財源の三位一体改革とは異なる枠組みです。「平成の大合併」は誤りで、これは市町村合併を進めた別の行政改革です。「規制緩和」は誤りで、これは経済活動への規制を緩めることを指す、より広い一般的な用語です。"},
  {id:"civ441", cat:"公民", sub:"政治体制", q:"国や地方公共団体が保有する情報を、国民や住民の請求に応じて開示することを義務づけた法律を何というか。", choices:["情報公開法","個人情報保護法","国家公務員法","地方自治法"], a:0, e:"正解は「情報公開法」です。情報公開法は1999年に制定され、行政機関が保有する情報について、国民の請求に応じて原則として開示することを義務づけています。「個人情報保護法」は誤りで、これは逆に個人情報を適切に保護し、みだりに利用されないようにするための法律です。「国家公務員法」は誤りで、これは国家公務員の任用や身分などを定める法律です。「地方自治法」は誤りで、これは地方自治の基本的な仕組みを定める法律であり、いずれも情報公開に特化した法律ではありません。"},
  {id:"civ443", cat:"公民", sub:"経済", q:"消費者の権利保護の考え方が国際的に広まったきっかけとして知られる「消費者の四つの権利」を提唱した、アメリカ大統領は誰か。", choices:["ケネディ","ルーズベルト","チャーチル","ガンディー"], a:0, e:"正解は「ケネディ」です。1962年、ケネディ大統領は「消費者の四つの権利」（安全である権利、知らされる権利、選ぶ権利、意見を聞いてもらう権利）を提唱する教書を発表し、世界の消費者保護政策の出発点の一つとされています。「ルーズベルト」は誤りで、彼は世界恐慌対策のニューディール政策で知られる、時代の異なる大統領です。「チャーチル」は誤りで、彼は第二次世界大戦期のイギリスの指導者です。「ガンディー」は誤りで、彼はインド独立運動の指導者であり、消費者権利の提唱者ではありません。"},
  {id:"civ445", cat:"公民", sub:"経済", q:"ある商品について、需要量と供給量が一致し価格が安定する点を何というか。", choices:["均衡価格","独占価格","公定価格","希望小売価格"], a:0, e:"正解は「均衡価格」です。均衡価格は市場において商品の需要量と供給量がちょうど一致し、価格が安定する点を指します。「独占価格」は誤りで、これは少数の企業が市場を支配することで人為的に決められる価格です。「公定価格」は誤りで、これは政府などが法令にもとづき定める価格です。「希望小売価格」は誤りで、これはメーカーが目安として示す小売価格であり、いずれも需要と供給の一致による価格決定とは異なる概念です。"},
  {id:"civ447", cat:"公民", sub:"経済", q:"市場において少数の企業が価格や生産量を実質的に支配している状態を何というか。", choices:["寡占","独占","自由競争","完全競争"], a:0, e:"正解は「寡占」です。寡占は少数の企業が市場の大部分を占め、価格や生産量に大きな影響力を持つ状態を指し、自動車産業など現代の多くの産業で見られます。「独占」は誤りで、これは市場をただ1社が支配する、寡占よりもさらに極端な状態を指します。「自由競争」は誤りで、これは多数の企業が対等に競争する状態であり、寡占とは逆の状況です。「完全競争」は誤りで、これは理論上想定される、無数の企業が同質の商品を扱い価格に影響を与えない市場の状態であり、いずれも寡占とは異なる概念です。"},
  /* 日本史 */
  {id:"his457", cat:"日本史", sub:"古代", q:"聖武天皇が東大寺で行った大仏開眼供養の主な目的は何か。", choices:["国家の安泰を仏の力で祈るため","外国との貿易を開始するため","武士の力を示すため","農業技術を広めるため"], a:0, e:"正解は「国家の安泰を仏の力で祈るため」です。聖武天皇は疫病や災害が相次ぐ中、仏教の力で国家を守ろうと大仏を建立し開眼供養を行いました。「外国との貿易を開始するため」は誤りで、大仏建立は宗教的・政治的な目的であり貿易とは無関係です。「武士の力を示すため」は誤りで、奈良時代にはまだ武士という存在は成立していません。「農業技術を広めるため」は誤りで、大仏建立は農業政策とは異なる分野の事業です。"},
  {id:"his461", cat:"日本史", sub:"平安時代", q:"延喜の荘園整理令が出された目的として正しいものはどれか。", choices:["国司の税収を確保し公領を守るため","荘園をすべて廃止し武士に与えるため","仏教勢力の荘園だけを保護するため","外国からの侵略に備えるためであった"], a:0, e:"正解は「国司の税収を確保し公領を守るため」です。延喜の荘園整理令は、貴族や寺社の荘園拡大により圧迫されていた公領（国有地）と国司の税収を守るために出されました。「荘園をすべて廃止し武士に与えるため」は誤りで、この時代武士はまだ荘園を広く支配する存在ではありませんでした。「仏教勢力の荘園だけを保護するため」は誤りで、この法令はむしろ荘園拡大を抑制する内容です。「外国からの侵略に備えるためであった」は誤りで、この法令は国内の土地制度に関するものです。"},
  {id:"his463", cat:"日本史", sub:"平安時代", q:"保元の乱についての説明として正しいものはどれか。", choices:["天皇家と摂関家の内部対立に武士が動員された","元との戦争で起こった対外的な争いである","江戸幕府の跡継ぎをめぐる争いであった","農民が起こした一揆である"], a:0, e:"正解は「天皇家と摂関家の内部対立に武士が動員された」です。保元の乱（1156年）は皇位や摂関家の後継をめぐる対立に、源氏・平氏などの武士が動員されて起こった争いです。「元との戦争で起こった対外的な争いである」は誤りで、これは対外戦争ではなく国内の権力争いです。「江戸幕府の跡継ぎをめぐる争いであった」は誤りで、保元の乱は平安時代末期の出来事であり、江戸幕府（17世紀以降）とは時代が全く異なります。「農民が起こした一揆である」は誤りで、この争いの主体は天皇家・摂関家と、それに動員された武士です。"},
  {id:"his465", cat:"日本史", sub:"平安時代", q:"平治の乱の結果として正しいものはどれか。", choices:["平清盛が政治的な実権を強めた","源頼朝が直ちに幕府を開いた","朝廷の権威が完全に消滅した","武士の存在自体が否定された"], a:0, e:"正解は「平清盛が政治的な実権を強めた」です。平治の乱（1159年）に勝利した平清盛は、その後太政大臣にまで昇進し政治的な実権を強めていきました。「源頼朝が直ちに幕府を開いた」は誤りで、頼朝が鎌倉幕府を開くのは平治の乱から約30年後の1185年頃です。「朝廷の権威が完全に消滅した」は誤りで、朝廷はその後も存続し続けました。「武士の存在自体が否定された」は誤りで、平治の乱はむしろ武士（平氏）の台頭を象徴する出来事です。"},
  {id:"his467", cat:"日本史", sub:"平安時代", q:"平清盛が進めた日宋貿易の目的として正しいものはどれか。", choices:["貿易の利益により経済基盤を強化すること","キリスト教を日本に広めること","中国を征服すること","農地を宋に譲渡すること"], a:0, e:"正解は「貿易の利益により経済基盤を強化すること」です。平清盛は瀬戸内海の航路を整備し、宋（中国）との貿易を積極的に進めることで、平氏の経済基盤を強化しました。「キリスト教を日本に広めること」は誤りで、この時代（12世紀）にはまだキリスト教は日本に伝来していません。「中国を征服すること」は誤りで、日宋貿易はあくまで経済的な交易であり、軍事的な征服を目的としたものではありません。「農地を宋に譲渡すること」は誤りで、そのような事実はなく、貿易とは無関係な内容です。"},
  {id:"his469", cat:"日本史", sub:"鎌倉・室町", q:"永仁の徳政令が発布された目的として正しいものはどれか。", choices:["困窮した御家人の借金を帳消しにするため","御家人の領地をすべて没収するため","元との貿易を禁止するためであった","農民の年貢を倍増させるためであった"], a:0, e:"正解は「困窮した御家人の借金を帳消しにするため」です。元寇の出費などで困窮した御家人を救うため、鎌倉幕府は永仁の徳政令（1297年）を出し、御家人の借金を帳消しにしようとしました。「御家人の領地をすべて没収するため」は誤りで、これは徳政令の目的とは正反対であり、むしろ御家人の領地保護を意図した法令です。「元との貿易を禁止するためであった」は誤りで、徳政令は借金の帳消しに関する法令であり、貿易とは異なる分野です。「農民の年貢を倍増させるためであった」は誤りで、この法令は御家人（武士）を対象としたものであり、農民の年貢とは無関係です。"},
  {id:"his473", cat:"日本史", sub:"鎌倉・室町", q:"3代将軍足利義満が南北朝の合一を実現した際に行ったこととして正しいものはどれか。", choices:["南朝の天皇に譲位を促し北朝に統一した","南朝を武力で完全に滅ぼした","北朝を廃止し南朝のみを残した","朝廷そのものを廃止した"], a:0, e:"正解は「南朝の天皇に譲位を促し北朝に統一した」です。足利義満は1392年、南朝の後亀山天皇に譲位を促す形で北朝に統一し、約60年続いた南北朝の争乱を終わらせました。「南朝を武力で完全に滅ぼした」は誤りで、実際には武力衝突ではなく交渉による合一が実現しました。「北朝を廃止し南朝のみを残した」は誤りで、統一されたのは北朝側であり、内容が逆になっています。「朝廷そのものを廃止した」は誤りで、朝廷はその後も存続しました。"},
  {id:"his475", cat:"日本史", sub:"鎌倉・室町", q:"応仁の乱で対立した二大勢力の組み合わせとして正しいものはどれか。", choices:["細川氏と山名氏","北条氏と足利氏","徳川氏と豊臣氏","源氏と平氏"], a:0, e:"正解は「細川氏と山名氏」です。応仁の乱（1467年）は将軍家の後継ぎ問題などを背景に、有力守護大名の細川勝元と山名宗全が対立し全国的な争乱に発展しました。「北条氏と足利氏」は誤りで、北条氏は鎌倉幕府、足利氏は室町幕府に関わる氏族であり、応仁の乱の対立構図とは異なります。「徳川氏と豊臣氏」は誤りで、これは応仁の乱よりずっと後、安土桃山〜江戸時代初期の対立です。「源氏と平氏」は誤りで、これは平安時代末期の対立であり、時代が異なります。"},
  {id:"his477", cat:"日本史", sub:"戦国・江戸", q:"太閤検地で用いられた、土地の生産力を米の量で表す統一基準を何というか。", choices:["石高","貫高","反別","坪数"], a:0, e:"正解は「石高」です。太閤検地では全国の土地の生産力を米の収穫量（石高）という統一基準で表し、年貢や軍役の基準としました。「貫高」は誤りで、これは室町・戦国時代に一部で用いられた、銭（貨幣）の額で土地の価値を示す基準であり、太閤検地の基準とは異なります。「反別」は誤りで、これは土地の面積の単位であり、生産力を示す基準ではありません。「坪数」も誤りで、これも面積を示す単位にすぎず、太閤検地の統一基準ではありません。"},
  {id:"his479", cat:"日本史", sub:"戦国・江戸", q:"豊臣秀吉が出したバテレン追放令の内容として正しいものはどれか。", choices:["宣教師の国外追放を命じた","仏教をすべて禁止した","貿易をすべて禁止した","武士のキリスト教入信を義務づけた"], a:0, e:"正解は「宣教師の国外追放を命じた」です。バテレン追放令（1587年）は、キリスト教の宣教師（バテレン）に対して日本からの国外追放を命じた法令です。「仏教をすべて禁止した」は誤りで、この法令はキリスト教の宣教師を対象としたものであり、仏教とは無関係です。「貿易をすべて禁止した」は誤りで、秀吉は宣教師の活動を制限した一方、南蛮貿易自体は継続されました。「武士のキリスト教入信を義務づけた」は誤りで、これはバテレン追放令の内容とは正反対の内容です。"},
  {id:"his481", cat:"日本史", sub:"戦国・江戸", q:"江戸幕府が特定の商人に海外渡航を許可して行わせた貿易を何というか。", choices:["朱印船貿易","勘合貿易","南蛮貿易","日宋貿易"], a:0, e:"正解は「朱印船貿易」です。朱印船貿易は江戸幕府初期、朱印状という許可証を与えられた商人が東南アジアなどと行った貿易です。「勘合貿易」は誤りで、これは室町幕府が明との間で行った、勘合という証票を用いた貿易であり、時代・仕組みが異なります。「南蛮貿易」は誤りで、これは戦国〜安土桃山時代のポルトガル・スペインとの貿易を指す言葉です。「日宋貿易」は誤りで、これは平安時代末期に平清盛が進めた、宋（中国）との貿易です。"},
  {id:"his483", cat:"日本史", sub:"江戸時代", q:"鎖国下で日本が対外的な窓口としていた四つの地域の組み合わせとして正しいものはどれか。", choices:["長崎・対馬・薩摩・松前","江戸・大阪・京都・堺","博多・平戸・下関・神戸","横浜・函館・新潟・神戸"], a:0, e:"正解は「長崎・対馬・薩摩・松前」です。鎖国下でも長崎（中国・オランダ）、対馬（朝鮮）、薩摩（琉球）、松前（アイヌ）の四つの窓口を通じて対外的な交流が続けられました。「江戸・大阪・京都・堺」は誤りで、これらは国内の主要都市であり、対外的な窓口ではありません。「博多・平戸・下関・神戸」は誤りで、平戸はかつて南蛮貿易の拠点でしたが、鎖国下の四つの窓口には含まれません。「横浜・函館・新潟・神戸」は誤りで、これらは幕末の開港場であり、鎖国下の四つの窓口とは異なります。"},
  {id:"his485", cat:"日本史", sub:"江戸時代", q:"元禄文化が栄えた主な地域として正しいものはどれか。", choices:["上方(京都・大阪)","江戸","蝦夷地","長崎"], a:0, e:"正解は「上方(京都・大阪)」です。元禄文化は17世紀末から18世紀初め、経済的に栄えた上方（京都・大阪）を中心に、町人文化として発展しました。「江戸」は誤りで、江戸を中心とする町人文化が栄えたのは元禄文化よりも後の化政文化です。「蝦夷地」は誤りで、これは当時アイヌの人々が暮らす地域であり、元禄文化の中心地ではありません。「長崎」は誤りで、長崎は対外貿易の窓口でしたが、元禄文化の中心地ではありません。"},
  {id:"his487", cat:"日本史", sub:"江戸時代", q:"化政文化が栄えた主な地域として正しいものはどれか。", choices:["江戸","上方(京都・大阪)","蝦夷地","九州"], a:0, e:"正解は「江戸」です。化政文化は19世紀初め、江戸を中心に発展した町人文化で、浮世絵や滑稽本などが人気を集めました。「上方(京都・大阪)」は誤りで、これは元禄文化の中心地であり、化政文化とは時期・地域が異なります。「蝦夷地」は誤りで、これは当時アイヌの人々が暮らす地域であり、化政文化の中心地ではありません。「九州」は誤りで、化政文化の中心は江戸であり、九州が中心地であった事実はありません。"},
  {id:"his489", cat:"日本史", sub:"江戸時代", q:"寛政異学の禁で行われたこととして正しいものはどれか。", choices:["朱子学以外の学問を幕府の学問所で禁じた","すべての学問を禁止した","蘭学のみを正学として奨励した","仏教を正学として定めた"], a:0, e:"正解は「朱子学以外の学問を幕府の学問所で禁じた」です。寛政異学の禁（1790年）は松平定信が、幕府の学問所において朱子学以外の学問（異学）を教えることを禁じた政策です。「すべての学問を禁止した」は誤りで、禁じられたのは幕府の学問所における朱子学以外の学問であり、学問全般の禁止ではありません。「蘭学のみを正学として奨励した」は誤りで、正学とされたのはむしろ朱子学であり、蘭学ではありません。「仏教を正学として定めた」は誤りで、正学とされたのは儒学の一派である朱子学です。"},
  {id:"his491", cat:"日本史", sub:"江戸時代", q:"蛮社の獄で幕府に処罰された、蘭学者として知られる人物の組み合わせはどれか。", choices:["渡辺崋山と高野長英","本居宣長と平田篤胤","伊能忠敬と間宮林蔵","杉田玄白と前野良沢"], a:0, e:"正解は「渡辺崋山と高野長英」です。蛮社の獄（1839年）では、幕府の対外政策を批判した蘭学者の渡辺崋山や高野長英らが処罰されました。「本居宣長と平田篤胤」は誤りで、彼らは国学者であり、蘭学者を弾圧した蛮社の獄とは無関係です。「伊能忠敬と間宮林蔵」は誤りで、彼らは測量家・探検家として知られ、蛮社の獄で処罰された人物ではありません。「杉田玄白と前野良沢」は誤りで、彼らは「解体新書」の翻訳で知られる蘭学者ですが、蛮社の獄より前の時代に活躍した人物です。"},
  {id:"his493", cat:"日本史", sub:"近代", q:"日米和親条約で開港が定められた港の組み合わせとして正しいものはどれか。", choices:["下田と函館","横浜と神戸","長崎と新潟","大阪と兵庫"], a:0, e:"正解は「下田と函館」です。1854年に結ばれた日米和親条約では、下田（静岡県）と函館（北海道）の開港が定められました。「横浜と神戸」は誤りで、これらは1858年の日米修好通商条約で開港が定められた港です。「長崎と新潟」も誤りで、新潟も日米修好通商条約で開港が定められた港であり、日米和親条約の開港地ではありません。「大阪と兵庫」も同様に誤りで、これらも日米修好通商条約による開港地です。"},
  {id:"his495", cat:"日本史", sub:"近代", q:"1862年の生麦事件をきっかけに翌年起こった戦争を何というか。", choices:["薩英戦争","戊辰戦争","日清戦争","日露戦争"], a:0, e:"正解は「薩英戦争」です。薩摩藩士がイギリス人を殺傷した生麦事件（1862年）の報復として、翌1863年にイギリス艦隊が薩摩を砲撃する薩英戦争が起こりました。「戊辰戦争」は誤りで、これは1868〜1869年に新政府軍と旧幕府軍の間で起こった内戦であり、生麦事件とは直接関係しません。「日清戦争」は誤りで、これは1894〜1895年に日本と清の間で起こった戦争です。「日露戦争」は誤りで、これは1904〜1905年の戦争であり、生麦事件とは時代が異なります。"},
  {id:"his497", cat:"日本史", sub:"近代", q:"四国艦隊下関砲撃事件が起こった背景として正しいものはどれか。", choices:["長州藩が外国船を砲撃したことへの報復であった","薩摩藩が幕府を攻撃したことへの報復であった","日本が朝鮮を攻撃したことへの報復であった","江戸が外国に占領されたことへの報復であった"], a:0, e:"正解は「長州藩が外国船を砲撃したことへの報復であった」です。攘夷を実行した長州藩が下関海峡を通る外国船を砲撃したことへの報復として、1864年に英仏米蘭の四国連合艦隊が下関を砲撃しました。「薩摩藩が幕府を攻撃したことへの報復であった」は誤りで、この事件の当事者は長州藩と外国艦隊であり、薩摩藩や幕府への攻撃が背景ではありません。「日本が朝鮮を攻撃したことへの報復であった」は誤りで、この時期に日本が朝鮮を攻撃した事実はありません。「江戸が外国に占領されたことへの報復であった」は誤りで、江戸がこの時期に外国に占領された事実はありません。"},
  {id:"his499", cat:"日本史", sub:"近代", q:"戊辰戦争についての説明として正しいものはどれか。", choices:["新政府軍と旧幕府軍との間の内戦である","日本と清との間の対外戦争である","日本とロシアとの間の対外戦争である","農民が起こした一揆である"], a:0, e:"正解は「新政府軍と旧幕府軍との間の内戦である」です。戊辰戦争（1868〜1869年）は、明治新政府軍と旧幕府勢力との間で戦われた国内の内戦です。「日本と清との間の対外戦争である」は誤りで、これは日清戦争（1894〜1895年）の説明であり、戊辰戦争とは異なる戦争です。「日本とロシアとの間の対外戦争である」は誤りで、これは日露戦争の説明であり、戊辰戦争とは無関係です。「農民が起こした一揆である」は誤りで、戊辰戦争の主体は新政府軍と旧幕府軍であり、農民一揆ではありません。"},
  {id:"his501", cat:"日本史", sub:"近代", q:"明治政府が出した廃刀令の内容として正しいものはどれか。", choices:["帯刀の慣習を禁じ武士の特権を奪った","武士に新たに刀を与える法令である","農民の武器所持を禁じた法令である","軍隊の武装を強化する法令である"], a:0, e:"正解は「帯刀の慣習を禁じ武士の特権を奪った」です。廃刀令（1876年）は軍人や警察官などを除き、帯刀（刀を身に着けること）を禁止し、武士の特権を奪う政策でした。「武士に新たに刀を与える法令である」は誤りで、内容が正反対であり、この法令はむしろ帯刀を禁止するものです。「農民の武器所持を禁じた法令である」は誤りで、これは豊臣秀吉の刀狩と混同した内容であり、廃刀令は主に武士の帯刀を対象としています。「軍隊の武装を強化する法令である」は誤りで、廃刀令は民間での帯刀を禁じる法令であり、軍隊の武装強化とは異なります。"},
  {id:"his503", cat:"日本史", sub:"近代", q:"自由民権運動の中で行われた大同団結運動の目的として正しいものはどれか。", choices:["立場の異なる民権派が団結し政府に対抗すること","政府と民権派が完全に和解すること","民権運動をすべて解散させること","天皇制を廃止することであった"], a:0, e:"正解は「立場の異なる民権派が団結し政府に対抗すること」です。大同団結運動（1886年頃）は、立場の異なる自由民権派の諸勢力が小異を捨てて団結し、政府に対抗しようとした運動です。「政府と民権派が完全に和解すること」は誤りで、この運動はむしろ政府への対抗を目的としており、和解とは異なります。「民権運動をすべて解散させること」は誤りで、これは大同団結運動の趣旨とは正反対の内容です。「天皇制を廃止することであった」は誤りで、自由民権運動の多くは天皇制の枠内での立憲政治の実現を求めるものでした。"},
  {id:"his505", cat:"日本史", sub:"近代", q:"1890年に発布された教育勅語の内容として正しいものはどれか。", choices:["忠君愛国など国民が守るべき道徳を示した","国民に自由な思想を推奨した","義務教育の無償化を定めた","学問の自由を保障した"], a:0, e:"正解は「忠君愛国など国民が守るべき道徳を示した」です。教育勅語（1890年）は天皇の名で発表され、忠君愛国など国民が守るべき道徳の基本を示したものです。「国民に自由な思想を推奨した」は誤りで、教育勅語はむしろ天皇制を支える国民道徳を強調する内容でした。「義務教育の無償化を定めた」は誤りで、これは教育制度に関する別の政策であり、教育勅語の主な内容ではありません。「学問の自由を保障した」は誤りで、教育勅語の主眼は国民道徳の教化であり、学問の自由の保障を主目的としたものではありません。"},
  {id:"his507", cat:"日本史", sub:"近代", q:"陸奥宗光が外相として実現した条約改正の内容として正しいものはどれか。", choices:["領事裁判権(治外法権)の撤廃","関税自主権の完全な回復","朝鮮の独立の承認","中国からの賠償金の獲得"], a:0, e:"正解は「領事裁判権(治外法権)の撤廃」です。陸奥宗光は外相として1894年、日英通商航海条約を結び、幕末以来の不平等条約の一つであった領事裁判権（治外法権）の撤廃を実現しました。「関税自主権の完全な回復」は誤りで、これは陸奥宗光より後、1911年に小村寿太郎が実現した改正です。「朝鮮の独立の承認」は誤りで、これは条約改正とは異なる、日清戦争の講和条約（下関条約）に関する内容です。「中国からの賠償金の獲得」も誤りで、これも下関条約に関する内容であり、条約改正とは異なる事柄です。"},
  {id:"his509", cat:"日本史", sub:"近代", q:"1915年、日本が中国に突きつけた要求を何というか。", choices:["二十一か条の要求","三国干渉","ポツダム宣言","カイロ宣言"], a:0, e:"正解は「二十一か条の要求」です。第一次世界大戦中の1915年、日本は中国に対しドイツ権益の継承などを含む二十一か条の要求を突きつけました。「三国干渉」は誤りで、これは1895年、ロシア・フランス・ドイツが日本に遼東半島の返還を求めた出来事であり、日本が中国に要求を出したものではありません。「ポツダム宣言」は誤りで、これは1945年に連合国が日本に無条件降伏を求めた宣言です。「カイロ宣言」は誤りで、これは1943年に米英中の首脳が発表した対日処理方針の宣言です。"},
  {id:"his511", cat:"日本史", sub:"近代", q:"シベリア出兵の主な目的として正しいものはどれか。", choices:["ロシア革命の拡大を警戒し干渉するため","シベリアの資源を独占するためであった","中国と同盟を結ぶためであった","朝鮮を防衛するためであった"], a:0, e:"正解は「ロシア革命の拡大を警戒し干渉するため」です。シベリア出兵（1918年）は、ロシア革命による社会主義の拡大を警戒した日本など連合国が、シベリアに軍を派遣し干渉しようとしたものです。「シベリアの資源を独占するためであった」は誤りで、これは出兵の名目とされた理由ではなく、主目的は革命への干渉です。「中国と同盟を結ぶためであった」は誤りで、シベリア出兵は中国との同盟とは無関係です。「朝鮮を防衛するためであった」は誤りで、これもシベリア出兵の主な目的とは異なります。"},
  {id:"his513", cat:"日本史", sub:"近代", q:"1921〜1922年に開かれたワシントン会議で取り決められた内容として正しいものはどれか。", choices:["海軍の主力艦の保有量を制限すること","日本の完全な軍縮を義務づけること","日本の国際連盟脱退を求めること","中国の分割統治を認めること"], a:0, e:"正解は「海軍の主力艦の保有量を制限すること」です。ワシントン会議では、日米英仏伊の主力艦の保有比率を定める海軍軍縮条約が結ばれました。「日本の完全な軍縮を義務づけること」は誤りで、日本を含む各国の保有量に一定の比率が定められたのであり、日本のみの完全軍縮ではありません。「日本の国際連盟脱退を求めること」は誤りで、これは満州事変後（1933年）の別の出来事です。「中国の分割統治を認めること」は誤りで、ワシントン会議ではむしろ中国の主権尊重や領土保全を確認する九か国条約が結ばれました。"},
  {id:"his515", cat:"日本史", sub:"現代", q:"満州国についての説明として正しいものはどれか。", choices:["日本が実権を握る傀儡国家であった","完全に独立した主権国家であった","中国が建国を主導した国家であった","国際連盟が承認した正式な国家であった"], a:0, e:"正解は「日本が実権を握る傀儡国家であった」です。満州国（1932年建国）は清朝最後の皇帝溥儀を元首としましたが、実際には日本（関東軍）が実権を握る傀儡国家でした。「完全に独立した主権国家であった」は誤りで、形式上は独立国とされましたが、実質的な支配権は日本が握っていました。「中国が建国を主導した国家であった」は誤りで、満州国の建国を主導したのは日本の関東軍です。「国際連盟が承認した正式な国家であった」は誤りで、国際連盟はむしろ満州国の建国を認めず、これが日本の国際連盟脱退につながりました。"},
  {id:"his517", cat:"日本史", sub:"現代", q:"戦後制定された教育基本法の内容として正しいものはどれか。", choices:["教育の機会均等や男女共学の原則を定めた","義務教育を廃止する内容であった","軍国主義教育を推奨する内容であった","私立学校をすべて禁止する内容であった"], a:0, e:"正解は「教育の機会均等や男女共学の原則を定めた」です。教育基本法（1947年）は戦前の軍国主義的な教育を改め、教育の機会均等や男女共学など民主的な教育の原則を定めました。「義務教育を廃止する内容であった」は誤りで、教育基本法はむしろ義務教育の考え方を明確にするものであり、廃止とは正反対です。「軍国主義教育を推奨する内容であった」は誤りで、これは戦前の教育のあり方であり、戦後の教育基本法とは正反対の内容です。「私立学校をすべて禁止する内容であった」は誤りで、私立学校は教育基本法のもとでも存続しています。"},
  {id:"his519", cat:"日本史", sub:"現代", q:"公害対策基本法が制定された背景として正しいものはどれか。", choices:["高度経済成長期に公害問題が深刻化したため","公害問題がすでに解決していたためであった","農業のみを対象とする法律であったため","戦後すぐに公害が発生したためであった"], a:0, e:"正解は「高度経済成長期に公害問題が深刻化したため」です。公害対策基本法（1967年）は、高度経済成長にともなう大気汚染や水質汚濁などの公害問題が各地で深刻化したことを背景に制定されました。「公害問題がすでに解決していたためであった」は誤りで、事実とは正反対であり、この法律はまさに深刻化する公害問題への対応として制定されました。「農業のみを対象とする法律であったため」は誤りで、この法律は工業活動などによる幅広い公害を対象としています。「戦後すぐに公害が発生したためであった」は誤りで、公害問題が特に深刻化したのは高度経済成長期（1950年代後半以降）です。"},
  {id:"his521", cat:"日本史", sub:"現代", q:"1985年のプラザ合意が日本経済にもたらした変化として正しいものはどれか。", choices:["急激な円高が進み輸出産業に打撃を与えた","急激な円安が進み輸出が拡大した","為替レートが完全に固定された","日本の貿易がすべて禁止された"], a:0, e:"正解は「急激な円高が進み輸出産業に打撃を与えた」です。プラザ合意（1985年）により主要国が協調してドル安・円高を進めることに合意し、その結果急激な円高が進み日本の輸出産業は打撃を受けました。「急激な円安が進み輸出が拡大した」は誤りで、事実とは正反対であり、プラザ合意はむしろ円高を招く内容でした。「為替レートが完全に固定された」は誤りで、日本は変動相場制のもとにあり、完全な固定化はされていません。「日本の貿易がすべて禁止された」は誤りで、プラザ合意は為替レートの調整に関する合意であり、貿易全面禁止とは異なります。"},
  {id:"his523", cat:"日本史", sub:"現代", q:"バブル崩壊後の1990年代の日本経済を指して用いられる呼び方として正しいものはどれか。", choices:["失われた10年","高度経済成長期","戦後復興期","昭和恐慌期"], a:0, e:"正解は「失われた10年」です。バブル崩壊後、長期にわたる不況が続いた1990年代の日本経済は「失われた10年」と呼ばれています。「高度経済成長期」は誤りで、これは1950年代半ばから1970年代前半の経済成長期を指し、バブル崩壊後の停滞期とは正反対の時期です。「戦後復興期」は誤りで、これは1940年代後半の時期を指し、1990年代とは時代が異なります。「昭和恐慌期」は誤りで、これは1930年前後の世界恐慌の影響を受けた時期であり、1990年代とは時代が異なります。"},
  {id:"his525", cat:"日本史", sub:"現代", q:"1970年の大阪万博が示したこととして正しいものはどれか。", choices:["高度経済成長を遂げた日本の国際的な存在感","日本経済が破綻状態にあったこと","日本が鎖国政策に戻ったこと","戦争の惨禍が続いていたこと"], a:0, e:"正解は「高度経済成長を遂げた日本の国際的な存在感」です。1970年の大阪万博（日本万国博覧会）は、高度経済成長を遂げた日本の技術力や国際的な存在感を世界に示す機会となりました。「日本経済が破綻状態にあったこと」は誤りで、事実とは正反対であり、この時期の日本経済は高度経済成長の只中にありました。「日本が鎖国政策に戻ったこと」は誤りで、万博はむしろ世界各国が参加する国際的な催しであり、鎖国とは正反対です。「戦争の惨禍が続いていたこと」は誤りで、1970年は戦後復興を経て高度経済成長を遂げた時期です。"},
  {id:"his527", cat:"日本史", sub:"現代", q:"東海道新幹線の開通が象徴した出来事として正しいものはどれか。", choices:["高度経済成長期における交通網の近代化","江戸時代における交通網の完成","戦後復興が遅れていたこと","鎖国政策がまだ続いていたこと"], a:0, e:"正解は「高度経済成長期における交通網の近代化」です。1964年に開通した東海道新幹線は、高度経済成長期における日本の交通網の近代化を象徴する出来事でした。「江戸時代の交通網の完成」は誤りで、東海道新幹線は昭和時代（20世紀）の開通であり、江戸時代とは時代が全く異なります。「戦後復興の遅れ」は誤りで、新幹線開通はむしろ戦後復興を経て高度経済成長を遂げたことを示す出来事です。「鎖国政策の継続」は誤りで、鎖国は江戸時代の政策であり、20世紀の新幹線開通とは無関係です。"},
  {id:"his529", cat:"日本史", sub:"現代", q:"石油危機後、多くの日本企業が進めた経営方針として正しいものはどれか。", choices:["省エネルギー化などの減量経営","エネルギー消費のさらなる拡大","雇用のさらなる拡大策のみ","海外進出の全面停止"], a:0, e:"正解は「省エネルギー化などの減量経営」です。石油危機（1973年）後、多くの日本企業は原油価格の高騰に対応するため、省エネルギー技術の開発やコスト削減を進める減量経営に取り組みました。「エネルギー消費のさらなる拡大」は誤りで、事実とは正反対であり、企業はむしろエネルギー消費を抑える方向に転換しました。「雇用のさらなる拡大策のみ」は誤りで、石油危機後はむしろ経営の効率化が重視され、雇用の拡大のみが進められたわけではありません。「海外進出の全面停止」は誤りで、日本企業の海外進出はその後もむしろ進展していきました。"},
  {id:"his531", cat:"日本史", sub:"現代", q:"1999年の男女雇用機会均等法改正で新たに事業主に義務づけられたこととして正しいものはどれか。", choices:["職場でのセクシュアルハラスメント防止措置","女性のみの採用枠の設置","男性社員の解雇の推進","女性の管理職就任の禁止"], a:0, e:"正解は「職場でのセクシュアルハラスメント防止措置」です。1999年の男女雇用機会均等法改正では、職場でのセクシュアルハラスメントを防止するための措置を事業主に義務づけました。「女性のみの採用枠の設置」は誤りで、この法律の趣旨は男女双方の機会均等であり、女性のみを優遇する採用枠を義務づけたものではありません。「男性社員の解雇の推進」は誤りで、これは法律の趣旨とは全く異なる内容です。「女性の管理職就任の禁止」は誤りで、これは男女雇用機会均等法の目的とは正反対の内容です。"},
  {id:"his533", cat:"日本史", sub:"現代", q:"2000年に導入された介護保険制度の背景として正しいものはどれか。", choices:["高齢化にともなう介護の社会的な支え合いの必要性","介護の必要な高齢者が急減したためであった","医療費をすべて無料化するためであった","労働力不足を解消するためであった"], a:0, e:"正解は「高齢化にともなう介護の社会的な支え合いの必要性」です。介護保険制度（2000年開始）は、高齢化の進展にともない介護を家族だけでなく社会全体で支え合う仕組みとして導入されました。「介護の必要な高齢者が急減したためであった」は誤りで、事実とは正反対であり、高齢化により介護を必要とする人はむしろ増加傾向にありました。「医療費をすべて無料化するためであった」は誤りで、介護保険は医療保険とは別の制度であり、医療費の無料化を目的としたものではありません。「労働力不足を解消するためであった」は誤りで、介護保険制度の主目的は介護の社会的な支え合いであり、労働力不足解消を直接の目的としたものではありません。"},
  {id:"his535", cat:"日本史", sub:"現代", q:"2011年の東日本大震災後に日本のエネルギー政策で特に見直されたのはどの分野か。", choices:["原子力発電のあり方","農業政策全般","教育制度全般","選挙制度全般"], a:0, e:"正解は「原子力発電のあり方」です。東日本大震災にともなう福島第一原子力発電所の事故を受け、日本では原子力発電のあり方やエネルギー政策全体が大きく見直されることになりました。「農業政策全般」は誤りで、震災の影響は一部地域の農業にも及びましたが、政策見直しの中心は原子力発電をめぐるエネルギー政策です。「教育制度全般」は誤りで、震災を機に教育制度全体が見直されたわけではありません。「選挙制度全般」は誤りで、これも震災後の政策見直しの中心的な分野ではありません。"},
  {id:"his537", cat:"日本史", sub:"現代", q:"マイナンバー制度が導入された目的として正しいものはどれか。", choices:["行政手続きの効率化と情報の一元管理","国民の税金をすべて廃止すること","選挙の投票をオンライン化することのみ","国民の海外渡航を制限すること"], a:0, e:"正解は「行政手続きの効率化と情報の一元管理」です。マイナンバー制度は国民一人一人に番号を付与することで、社会保障や税に関する行政手続きを効率化し、情報を一元的に管理することを目的として導入されました。「国民の税金をすべて廃止すること」は誤りで、マイナンバー制度は税務手続きの効率化を目的としており、税そのものの廃止とは異なります。「選挙の投票をオンライン化することのみ」は誤りで、マイナンバー制度は選挙のオンライン投票を直接の目的としたものではありません。「国民の海外渡航を制限すること」は誤りで、これはマイナンバー制度とは異なる分野の政策です。"},
  {id:"his539", cat:"日本史", sub:"現代", q:"1989年に日本で初めて導入された、消費に広く課される間接税は何か。", choices:["消費税","法人税","所得税","相続税"], a:0, e:"正解は「消費税」です。消費税は1989年に導入された、商品やサービスの消費に広く課される間接税です。「法人税」は誤りで、これは企業の利益に対して課される税であり、消費に対する間接税とは異なります。「所得税」は誤りで、これは個人の所得に対して課される直接税です。「相続税」は誤りで、これは財産の相続に対して課される税であり、消費税とは全く異なる税です。"},
  {id:"his541", cat:"日本史", sub:"現代", q:"1972年の沖縄返還後も残された、沖縄をめぐる主要な課題として正しいものはどれか。", choices:["米軍基地の集中にともなう負担","農業生産の完全な停止","独自通貨の使用継続","鎖国政策の継続"], a:0, e:"正解は「米軍基地の集中にともなう負担」です。1972年に沖縄は日本に復帰しましたが、その後も在日米軍基地が沖縄に集中していることによる住民の負担が課題として残されています。「農業生産の完全な停止」は誤りで、沖縄では復帰後もサトウキビ栽培など農業生産が続けられています。「独自通貨の使用継続」は誤りで、沖縄返還後は日本円が使用されるようになりました。「鎖国政策の継続」は誤りで、鎖国は江戸時代の政策であり、沖縄返還後の課題とは無関係です。"},
  {id:"his543", cat:"日本史", sub:"現代", q:"日本の高度経済成長を支えた要因として正しいものはどれか。", choices:["技術革新や設備投資の活発化","人口の急激な減少","農業のみに依存した経済構造","鎖国による貿易制限"], a:0, e:"正解は「技術革新や設備投資の活発化」です。高度経済成長期には、企業による積極的な設備投資や技術革新が進み、工業生産が急速に拡大しました。「人口の急激な減少」は誤りで、この時期の日本はむしろ人口が増加し、労働力も豊富な状況にありました。「農業のみに依存した経済構造」は誤りで、高度経済成長を牽引したのは主に工業（重化学工業）であり、農業のみに依存した構造ではありません。「鎖国による貿易制限」は誤りで、高度経済成長期の日本はむしろ積極的に貿易を拡大しており、鎖国とは正反対の状況です。"},
  {id:"his545", cat:"日本史", sub:"現代", q:"55年体制のもとで、与党と野党の議席差が比較的小さくなった状態を何と表現することがあるか。", choices:["与野党伯仲","一党独裁","無政府状態","天皇親政"], a:0, e:"正解は「与野党伯仲」です。55年体制下でも、時期によっては与党（自民党）と野党の議席差が小さくなることがあり、これを与野党伯仲と表現します。「一党独裁」は誤りで、これは特定の一党が独裁的に権力を握る体制を指し、複数政党が存在した55年体制の説明としては不適切です。「無政府状態」は誤りで、55年体制下でも政府は正常に機能しており、無政府状態ではありません。「天皇親政」は誤りで、戦後の天皇は政治的権能を持たない象徴的存在であり、親政（天皇自らの政治）は行われていません。"},
  {id:"his547", cat:"日本史", sub:"現代", q:"平成の大合併により全国の市町村数はどのように変化したか。", choices:["大きく減少した","大きく増加した","まったく変化しなかった","都道府県の数が変わった"], a:0, e:"正解は「大きく減少した」です。平成の大合併により、1999年に約3200あった市町村数は2010年頃には約1700にまで大きく減少しました。「大きく増加した」は誤りで、事実とは正反対であり、合併により市町村数はむしろ減少しました。「まったく変化しなかった」は誤りで、実際には多くの市町村が合併し、数は大きく変化しました。「都道府県の数が変わった」は誤りで、平成の大合併は市町村レベルの合併であり、都道府県の数（47）自体は変わっていません。"},
  {id:"his549", cat:"日本史", sub:"現代", q:"戦後の農地改革によって生まれた変化として正しいものはどれか。", choices:["自作農の割合が大きく増加した","小作農の割合が大きく増加した","地主制度がさらに強化された","農業がすべて廃止された"], a:0, e:"正解は「自作農の割合が大きく増加した」です。農地改革により地主の土地の多くが小作農に分配され、その結果、自分の土地を持って耕作する自作農の割合が大きく増加しました。「小作農の割合が大きく増加した」は誤りで、事実とは正反対であり、農地改革はむしろ小作農を減らし自作農を増やす改革でした。「地主制度がさらに強化された」は誤りで、農地改革は地主制度を解体する方向に働いた改革です。「農業がすべて廃止された」は誤りで、農地改革は土地所有のあり方を変える改革であり、農業自体を廃止するものではありません。"},
  {id:"his551", cat:"日本史", sub:"現代", q:"高度経済成長期に「三種の神器」の次に普及が進んだとされる、カー・クーラー・カラーテレビを指す略称は何か。", choices:["3C(新三種の神器)","士農工商","五街道","三大改革"], a:0, e:"正解は「3C(新三種の神器)」です。高度経済成長期後半には、カー（自動車）・クーラー・カラーテレビの頭文字をとった「3C」が新三種の神器として普及していきました。「士農工商」は誤りで、これは江戸時代の身分制度を表す言葉であり、家電製品の普及とは無関係です。「五街道」は誤りで、これは江戸時代に整備された主要な街道を指す言葉です。「三大改革」は誤りで、これは江戸幕府の享保・寛政・天保の改革を指す言葉であり、家電製品の普及とは異なる事柄です。"},
  {id:"his553", cat:"日本史", sub:"近代", q:"日露戦争前、日本国内で対露強硬論を主張する動きが強まった背景として正しいものはどれか。", choices:["ロシアの満州・朝鮮への進出への警戒感","ロシアとの友好関係のさらなる強化を望んだため","日本がすでにロシアに勝利していたためであった","ロシアが日本に領土を割譲していたためであった"], a:0, e:"正解は「ロシアの満州・朝鮮への進出への警戒感」です。満州や朝鮮半島への進出を強めるロシアに対し、日本国内では自国の安全保障上の脅威として警戒感が高まり、対露強硬論が強まりました。「ロシアとの友好関係のさらなる強化を望んだため」は誤りで、これは強硬論の背景とは正反対の内容です。「日本がすでにロシアに勝利していたためであった」は誤りで、この時点ではまだ日露戦争（1904年開戦）は始まっていません。「ロシアが日本に領土を割譲していたためであった」は誤りで、そのような事実はなく、むしろロシアの進出への警戒が背景です。"},
  {id:"his555", cat:"日本史", sub:"現代", q:"1993年の非自民連立政権誕生によって終わりを迎えた政治体制を何というか。", choices:["55年体制","大正デモクラシー","明治維新","幕藩体制"], a:0, e:"正解は「55年体制」です。1993年、非自民8党派による連立政権が誕生したことで、1955年以来続いた自民党長期政権を軸とする55年体制は終わりを迎えました。「大正デモクラシー」は誤りで、これは大正時代（1912〜1926年）の政治的風潮を指し、1993年の出来事とは時代が異なります。「明治維新」は誤りで、これは19世紀後半の一連の近代化改革であり、1993年とは無関係です。「幕藩体制」は誤りで、これは江戸時代の統治体制であり、1993年とは全く異なる時代の概念です。"},
  /* 世界史 */
  {id:"wor451", cat:"世界史", sub:"古代・中世", q:"中南米で栄えたアステカ文明・インカ文明を16世紀に征服したヨーロッパの国はどこか。", choices:["スペイン","ポルトガル","イギリス","フランス"], a:0, e:"正解は「スペイン」です。スペインは16世紀、コルテスやピサロらの征服者を送り、アステカ文明・インカ文明をそれぞれ征服し植民地としました。「ポルトガル」は誤りで、ポルトガルは主にブラジルを植民地としており、アステカ・インカを征服したのはスペインです。「イギリス」は誤りで、イギリスの中南米進出は限定的で、これらの文明征服には直接関わっていません。「フランス」も誤りで、フランスも中南米を征服したのではなく、主に北米などに進出しました。"},
  {id:"wor453", cat:"世界史", sub:"ヨーロッパ史", q:"1066年、ノルマンディー公ウィリアムがイギリスを征服した出来事を何というか。", choices:["ノルマン・コンクエスト","名誉革命","権利章典制定","マグナカルタ制定"], a:0, e:"正解は「ノルマン・コンクエスト」です。1066年、ノルマンディー公ウィリアムがイギリスに侵攻し王位を獲得したこの出来事をノルマン・コンクエスト（ノルマン征服）といいます。「名誉革命」は誤りで、これは1688年にイギリスで起こった、無血の王権交代であり、時代も内容も異なります。「権利章典制定」は誤りで、これは1689年の出来事です。「マグナカルタ制定」は誤りで、これは1215年の出来事であり、いずれもノルマン・コンクエストとは時代が異なります。"},
  {id:"wor455", cat:"世界史", sub:"古代・中世", q:"1453年、オスマン帝国によって滅ぼされたビザンツ帝国の首都はどこか。", choices:["コンスタンティノープル","ローマ","アテネ","カイロ"], a:0, e:"正解は「コンスタンティノープル」です。1453年、オスマン帝国はビザンツ帝国（東ローマ帝国）の首都コンスタンティノープルを陥落させ、同帝国を滅ぼしました。「ローマ」は誤りで、これは西ローマ帝国の首都であり、西ローマ帝国は5世紀にすでに滅亡しています。「アテネ」は誤りで、これは古代ギリシャの都市国家（ポリス）の一つであり、ビザンツ帝国の首都ではありません。「カイロ」は誤りで、これはエジプトの都市であり、ビザンツ帝国の首都ではありません。"},
  {id:"wor457", cat:"世界史", sub:"ヨーロッパ史", q:"大航海時代、スペインとポルトガルが新大陸などの勢力範囲を取り決めた条約を何というか。", choices:["トルデシリャス条約","ウェストファリア条約","ウィーン条約","ヴェルサイユ条約"], a:0, e:"正解は「トルデシリャス条約」です。トルデシリャス条約（1494年）は、スペインとポルトガルが新たに発見した地域の勢力範囲を、教皇の仲介のもとで取り決めた条約です。「ウェストファリア条約」は誤りで、これは17世紀の三十年戦争を終結させた条約であり、時代・内容が異なります。「ウィーン条約」は誤りで、そのような特定の条約名は一般に大航海時代のものとしては知られていません。「ヴェルサイユ条約」は誤りで、これは第一次世界大戦の講和条約であり、大航海時代とは全く異なる時代の条約です。"},
  {id:"wor459", cat:"世界史", sub:"ヨーロッパ史", q:"17世紀、スペインからの独立を果たし、その後貿易で栄えた国はどこか。", choices:["オランダ","イタリア","ロシア","ポーランド"], a:0, e:"正解は「オランダ」です。オランダは16世紀後半からスペインに対する独立戦争を戦い、17世紀に独立を果たすと、東インド会社を中心に貿易で大きく栄えました。「イタリア」は誤りで、イタリアの統一は19世紀の出来事であり、スペインからの独立とは異なる歴史を持ちます。「ロシア」は誤りで、ロシアはこの時期スペインからの独立とは無関係な独自の歴史をたどっています。「ポーランド」は誤りで、ポーランドもスペインからの独立という文脈には該当しません。"},
  {id:"wor461", cat:"世界史", sub:"ヨーロッパ史", q:"17世紀イギリスで、クロムウェルが指導し国王を処刑した革命を何というか。", choices:["ピューリタン革命","名誉革命","フランス革命","ロシア革命"], a:0, e:"正解は「ピューリタン革命」です。ピューリタン革命（1642〜1649年）はクロムウェルらが議会派を率いて国王軍と戦い、最終的に国王チャールズ1世を処刑した革命です。「名誉革命」は誤りで、これは1688年にイギリスで起こった、大きな戦闘を伴わない王権交代であり、国王処刑を伴うピューリタン革命とは異なります。「フランス革命」は誤りで、これは18世紀末にフランスで起こった革命です。「ロシア革命」は誤りで、これは20世紀初頭にロシアで起こった革命であり、いずれも17世紀イギリスの出来事とは異なります。"},
  {id:"wor463", cat:"世界史", sub:"ヨーロッパ史", q:"1787年に制定された、世界初の近代的な成文憲法として知られるものはどれか。", choices:["アメリカ合衆国憲法","マグナカルタ","権利章典","大日本帝国憲法"], a:0, e:"正解は「アメリカ合衆国憲法」です。1787年に制定されたアメリカ合衆国憲法は、世界で最初の近代的な成文憲法として知られています。「マグナカルタ」は誤りで、これは1215年にイギリスで制定された文書であり、近代的な成文憲法とは性質が異なります。「権利章典」は誤りで、これは1689年にイギリスで制定された文書です。「大日本帝国憲法」は誤りで、これは1889年に日本で発布された憲法であり、アメリカ合衆国憲法より100年ほど後のものです。"},
  {id:"wor465", cat:"世界史", sub:"ヨーロッパ史", q:"ナポレオンが制定した、私有財産の保障などを定めた法典を何というか。", choices:["ナポレオン法典","ワイマール憲法","権利章典","人権宣言"], a:0, e:"正解は「ナポレオン法典」です。ナポレオン法典（1804年）は、法の下の平等や私有財産の保障などを定めた民法典で、その後のヨーロッパ諸国の法律に大きな影響を与えました。「ワイマール憲法」は誤りで、これは1919年に第一次世界大戦後のドイツで制定された憲法であり、時代・国が異なります。「権利章典」は誤りで、これは1689年にイギリスで制定された文書です。「人権宣言」は誤りで、これは1789年のフランス革命で発表された宣言であり、ナポレオン法典とは別の文書です。"},
  {id:"wor467", cat:"世界史", sub:"ヨーロッパ史", q:"産業革命初期、多軸の紡績機を発明しイギリスの綿工業を発展させた人物は誰か。", choices:["ハーグリーブズ","ワット","エジソン","ニュートン"], a:0, e:"正解は「ハーグリーブズ」です。ハーグリーブズは1764年頃、一度に複数の糸を紡げる多軸紡績機（ジェニー紡績機）を発明し、綿工業の生産性を大きく向上させました。「ワット」は誤りで、彼は蒸気機関を改良した人物であり、紡績機の発明者ではありません。「エジソン」は誤りで、彼は電球などを発明した19世紀後半のアメリカの発明家であり、産業革命初期の紡績機とは時代が異なります。「ニュートン」は誤りで、彼は万有引力の法則などで知られる17世紀の科学者であり、紡績機の発明者ではありません。"},
  {id:"wor469", cat:"世界史", sub:"アジア史", q:"19世紀末、清で光緒帝のもとで行われた急進的な政治改革運動を何というか。", choices:["戊戌の変法","洋務運動","義和団事件","辛亥革命"], a:0, e:"正解は「戊戌の変法」です。戊戌の変法（1898年）は光緒帝のもとで、康有為らが政治制度も含めた急進的な改革を目指した運動でしたが、保守派のクーデターにより短期間で失敗しました。「洋務運動」は誤りで、これは政治体制を変えず西洋の技術のみを導入しようとした、より穏健な改革運動です。「義和団事件」は誤りで、これは外国勢力の排斥を掲げた民衆運動であり、政治改革運動とは性質が異なります。「辛亥革命」は誤りで、これは1911年に清朝そのものを打倒した革命であり、戊戌の変法とは規模・結果が異なります。"},
  {id:"wor471", cat:"世界史", sub:"ヨーロッパ史", q:"1898年、アメリカとスペインの間で戦われ、アメリカがフィリピンなどを獲得した戦争を何というか。", choices:["米西戦争","米英戦争","南北戦争","米墨戦争"], a:0, e:"正解は「米西戦争」です。米西戦争（1898年）はアメリカとスペインの間で戦われ、アメリカが勝利しフィリピンやプエルトリコなどを獲得しました。「米英戦争」は誤りで、これは19世紀初頭にアメリカとイギリスの間で戦われた別の戦争です。「南北戦争」は誤りで、これはアメリカ国内の内戦であり、対外戦争である米西戦争とは性質が異なります。「米墨戦争」は誤りで、これは19世紀半ばにアメリカとメキシコの間で戦われた戦争であり、米西戦争とは相手国が異なります。"},
  {id:"wor473", cat:"世界史", sub:"両大戦期", q:"1914年、第一次世界大戦のきっかけとなった国どうしの対立する同盟関係を何というか。", choices:["三国同盟と三国協商","NATOとワルシャワ条約機構","日独伊三国同盟","米ソの冷戦構造"], a:0, e:"正解は「三国同盟と三国協商」です。第一次世界大戦前のヨーロッパは、ドイツ・オーストリア・イタリアの三国同盟と、イギリス・フランス・ロシアの三国協商という対立する同盟関係に分かれていました。「NATOとワルシャワ条約機構」は誤りで、これは第二次世界大戦後の冷戦期の軍事同盟であり、第一次世界大戦前のものではありません。「日独伊三国同盟」は誤りで、これは1940年に結ばれた第二次世界大戦期の同盟です。「米ソの冷戦構造」は誤りで、これも第二次世界大戦後の対立構造であり、第一次世界大戦前とは時代が異なります。"},
  {id:"wor475", cat:"世界史", sub:"両大戦期", q:"1939年、独ソが互いに不可侵を約束し、後に破棄された条約を何というか。", choices:["独ソ不可侵条約","日ソ中立条約","ヴェルサイユ条約","ミュンヘン協定"], a:0, e:"正解は「独ソ不可侵条約」です。1939年に結ばれた独ソ不可侵条約は、ドイツとソ連が互いに不可侵を約束したものでしたが、1941年にドイツがソ連に侵攻し破棄されました。「日ソ中立条約」は誤りで、これは1941年に日本とソ連の間で結ばれた別の条約です。「ヴェルサイユ条約」は誤りで、これは第一次世界大戦の講和条約であり、時代が異なります。「ミュンヘン協定」は誤りで、これは1938年にドイツによるチェコスロバキア領の一部併合を認めた協定であり、独ソ間の条約ではありません。"},
  {id:"wor477", cat:"世界史", sub:"両大戦期", q:"1942年、日本海軍が大敗し太平洋戦争の戦局が転換した海戦を何というか。", choices:["ミッドウェー海戦","真珠湾攻撃","日本海海戦","対馬海戦"], a:0, e:"正解は「ミッドウェー海戦」です。1942年のミッドウェー海戦で日本海軍は主力空母を失う大敗を喫し、これ以降太平洋戦争の戦局はアメリカ側に有利に転換しました。「真珠湾攻撃」は誤りで、これは1941年、日本が太平洋戦争を開始した奇襲攻撃であり、ミッドウェー海戦より前の出来事です。「日本海海戦」は誤りで、これは1905年の日露戦争における海戦です。「対馬海戦」は誤りで、これも日露戦争に関わる海戦の呼び方であり、太平洋戦争とは時代が異なります。"},
  {id:"wor479", cat:"世界史", sub:"現代", q:"第二次世界大戦後、チャーチルが東西の分断を表現した演説で用いた言葉は何か。", choices:["鉄のカーテン","ベルリンの壁","冷たい戦争","代理戦争"], a:0, e:"正解は「鉄のカーテン」です。チャーチルは1946年の演説で、ヨーロッパを東西に分断する境界を「鉄のカーテン」という言葉で表現し、冷戦の始まりを象徴する言葉となりました。「ベルリンの壁」は誤りで、これは1961年に実際に建設された、東西ベルリンを分断する物理的な壁であり、比喩表現ではありません。「冷たい戦争」は誤りで、これは東西対立全体を指す一般的な訳語（冷戦）であり、チャーチルの演説での特定の表現ではありません。「代理戦争」は誤りで、これは冷戦下で米ソが直接ではなく他国を通じて争った戦争形態を指す言葉です。"},
  {id:"wor481", cat:"世界史", sub:"現代", q:"1959年、キューバで親米政権（バティスタ政権）を倒し社会主義政権を樹立した人物は誰か。", choices:["カストロ","バティスタ","レーニン","毛沢東"], a:0, e:"正解は「カストロ」です。カストロは1959年、革命によって親米派のバティスタ政権を倒し、キューバに社会主義政権を樹立しました。「バティスタ」は誤りで、彼はカストロによって倒された、革命前の親米独裁者です。「レーニン」は誤りで、彼はロシア革命を指導した人物であり、キューバ革命とは無関係です。「毛沢東」は誤りで、彼は中国共産党の指導者であり、キューバとは異なる国の人物です。"},
  {id:"wor483", cat:"世界史", sub:"現代", q:"1972年、アメリカのニクソン大統領が電撃的に訪問し国交正常化への道を開いた国はどこか。", choices:["中国","ソ連","北朝鮮","キューバ"], a:0, e:"正解は「中国」です。1972年、ニクソン大統領は電撃的に中国を訪問し、それまで国交のなかったアメリカと中国（中華人民共和国）の関係正常化への道を開きました。「ソ連」は誤りで、アメリカとソ連はすでに外交関係を持っており、1972年のニクソン訪問の対象国ではありません。「北朝鮮」は誤りで、ニクソンが訪問したのは北朝鮮ではなく中国です。「キューバ」は誤りで、これもニクソン訪問の対象国とは異なります。"},
  {id:"wor485", cat:"世界史", sub:"現代", q:"1979年、パフレビー国王を打倒しイスラム体制を樹立した出来事を何というか。", choices:["イラン革命","湾岸戦争","アラブの春","スエズ危機"], a:0, e:"正解は「イラン革命」です。イラン革命（1979年）は、親米派のパフレビー国王を打倒し、ホメイニ師を最高指導者とするイスラム体制を樹立した革命です。「湾岸戦争」は誤りで、これは1991年にイラクのクウェート侵攻をきっかけに起こった戦争です。「アラブの春」は誤りで、これは2010年代に中東・北アフリカで起こった民主化運動です。「スエズ危機」は誤りで、これは1956年、エジプトのスエズ運河国有化をめぐる中東の危機であり、いずれもイラン革命とは異なる出来事です。"},
  {id:"wor487", cat:"世界史", sub:"現代", q:"1979年、ソ連が軍事介入し長期の戦争に発展した国はどこか。", choices:["アフガニスタン","イラン","イラク","ベトナム"], a:0, e:"正解は「アフガニスタン」です。1979年、ソ連はアフガニスタンに軍事介入し、その後長期にわたる戦争に発展しました。「イラン」は誤りで、この年はイラン革命が起こった年ですが、ソ連の軍事介入の対象国ではありません。「イラク」は誤りで、ソ連が1979年に軍事介入した国はイラクではありません。「ベトナム」は誤りで、ベトナム戦争は主にアメリカが関わった戦争であり、1979年のソ連の軍事介入先とは異なります。"},
  {id:"wor489", cat:"世界史", sub:"現代", q:"1990年、東西に分断されていたドイツが再統一を果たした背景として正しいものはどれか。", choices:["東欧革命とベルリンの壁崩壊による民主化の進展","ソ連の軍事的な勝利によるものであった","国際連合の直接的な統治によるものであった","アメリカの単独占領によるものであった"], a:0, e:"正解は「東欧革命とベルリンの壁崩壊による民主化の進展」です。1989年の東欧革命とベルリンの壁崩壊を経て東ドイツで民主化が進み、1990年に東西ドイツの再統一が実現しました。「ソ連の軍事的な勝利によるものであった」は誤りで、ドイツ統一は軍事的な勝利によるものではなく、民主化の進展の結果です。「国際連合の直接的な統治によるものであった」は誤りで、統一は国連の直接統治によるものではありません。「アメリカの単独占領によるものであった」は誤りで、統一後のドイツはアメリカの単独占領下に置かれたわけではありません。"},
  {id:"wor491", cat:"世界史", sub:"現代", q:"1990年代、旧ユーゴスラビアで民族対立により起こった一連の紛争を何と総称するか。", choices:["ユーゴスラビア紛争","湾岸戦争","朝鮮戦争","スペイン内戦"], a:0, e:"正解は「ユーゴスラビア紛争」です。冷戦終結後の1990年代、旧ユーゴスラビアでは民族・宗教の違いを背景とした一連の紛争（ユーゴスラビア紛争）が起こりました。「湾岸戦争」は誤りで、これは1991年に中東で起こった別の戦争です。「朝鮮戦争」は誤りで、これは1950年に朝鮮半島で起こった戦争です。「スペイン内戦」は誤りで、これは1930年代にスペインで起こった内戦であり、いずれもユーゴスラビア紛争とは地域・時代が異なります。"},
  {id:"wor493", cat:"世界史", sub:"現代", q:"2008年、アメリカの投資銀行の経営破綻をきっかけに世界に広がった金融危機を何というか。", choices:["リーマン・ショック","ブラックマンデー","世界恐慌","アジア通貨危機"], a:0, e:"正解は「リーマン・ショック」です。2008年、アメリカの大手投資銀行リーマン・ブラザーズの経営破綻をきっかけに、世界的な金融危機（リーマン・ショック）が広がりました。「ブラックマンデー」は誤りで、これは1987年に起こった別の株価暴落を指す言葉です。「世界恐慌」は誤りで、これは1929年に始まった別の経済危機です。「アジア通貨危機」は誤りで、これは1997年にアジア各国で起こった通貨危機であり、いずれもリーマン・ショックとは時代が異なります。"},
  {id:"wor495", cat:"世界史", sub:"現代", q:"2010年代、チュニジアなど中東・北アフリカ各地で起こった民主化運動を総称して何というか。", choices:["アラブの春","東欧革命","バンドン会議","文化大革命"], a:0, e:"正解は「アラブの春」です。2010年代初め、チュニジアをはじめとする中東・北アフリカ諸国で独裁政権への抗議から広がった一連の民主化運動を「アラブの春」といいます。「東欧革命」は誤りで、これは1989年前後に東欧諸国で起こった社会主義体制の崩壊を指す言葉です。「バンドン会議」は誤りで、これは1955年にアジア・アフリカの新興独立国が開いた会議です。「文化大革命」は誤りで、これは1960年代の中国での政治運動であり、いずれもアラブの春とは地域・時代が異なります。"},
  {id:"wor497", cat:"世界史", sub:"現代", q:"2016年の国民投票でイギリスが決定した、EUからの離脱を何と呼ぶか。", choices:["ブレグジット","グレグジット","フレグジット","ジャーマンイグジット"], a:0, e:"正解は「ブレグジット」です。ブレグジット（Brexit）は、イギリス（Britain）とEU離脱（Exit）を組み合わせた言葉で、2016年の国民投票を経て2020年にイギリスはEUを離脱しました。「グレグジット」「フレグジット」「ジャーマンイグジット」はいずれも誤りで、これらは他国のEU離脱を想定した造語であり、実際に用いられているのはイギリスのブレグジットです。"},
  {id:"wor499", cat:"世界史", sub:"アジア史", q:"1966年から中国で毛沢東が主導した、伝統文化や知識人を攻撃した政治運動を何というか。", choices:["文化大革命","大躍進政策","洋務運動","義和団事件"], a:0, e:"正解は「文化大革命」です。文化大革命（1966年〜）は毛沢東が主導し、伝統文化や知識人、党内の反対派を攻撃した大規模な政治運動で、中国社会に大きな混乱をもたらしました。「大躍進政策」は誤りで、これは1958年に行われた、工業・農業の急速な発展を目指した別の政策であり、多くの餓死者を出す失敗に終わりました。「洋務運動」は誤りで、これは19世紀後半の清で行われた近代化運動です。「義和団事件」は誤りで、これは1899年の外国勢力排斥の民衆運動であり、いずれも文化大革命とは時代・内容が異なります。"},
  {id:"wor501", cat:"世界史", sub:"アジア史", q:"1958年、中国で工業・農業の急速な発展を目指し行われたが多くの餓死者を出したとされる政策を何というか。", choices:["大躍進政策","文化大革命","改革開放政策","五か年計画のみ"], a:0, e:"正解は「大躍進政策」です。大躍進政策（1958年〜）は毛沢東が主導した、工業・農業の急速な発展を目指す政策でしたが、非現実的な目標設定などにより深刻な失敗に終わり、多くの餓死者を出しました。「文化大革命」は誤りで、これは1966年から始まった、知識人などを攻撃した別の政治運動です。「改革開放政策」は誤りで、これは1970年代末以降、鄧小平のもとで市場経済を導入した政策であり、大躍進政策とは正反対の成果をあげました。「五か年計画のみ」は誤りで、これはソ連などで行われた一般的な経済計画の呼び方であり、大躍進政策そのものを指す固有名詞ではありません。"},
  {id:"wor503", cat:"世界史", sub:"古代・中世", q:"十字軍遠征の結果、ヨーロッパにもたらされた影響として正しいものはどれか。", choices:["東方との交流が進み貿易が活発化した","ヨーロッパが完全に孤立するようになった","封建制度がより一層強化された","宗教対立が完全に解消された"], a:0, e:"正解は「東方との交流が進み貿易が活発化した」です。十字軍遠征を通じてヨーロッパと東方（イスラム世界）との接触が進み、東方貿易（レヴァント貿易）が活発化するなどの影響がありました。「ヨーロッパが完全に孤立するようになった」は誤りで、事実とは正反対であり、十字軍はむしろ東方との交流を促進しました。「封建制度がより一層強化された」は誤りで、実際には十字軍の負担などにより諸侯の力が弱まり、封建制度は次第に揺らいでいきました。「宗教対立が完全に解消された」は誤りで、十字軍はむしろキリスト教とイスラム教の対立を象徴する出来事でした。"},
  {id:"wor505", cat:"世界史", sub:"古代・中世", q:"中世ヨーロッパで、キリスト教の教えに反する者をカトリック教会が裁いた仕組みを何というか。", choices:["異端審問","衆議院のみ","元老院のみ","三部会のみ"], a:0, e:"正解は「異端審問」です。異端審問は中世ヨーロッパにおいて、カトリック教会の教えに反する者（異端者）を裁くために設けられた仕組みです。「衆議院のみ」は誤りで、これは近代日本の議会の一院であり、中世ヨーロッパの宗教裁判とは全く異なります。「元老院のみ」は誤りで、これは古代ローマなどの統治機関を指す言葉です。「三部会のみ」は誤りで、これは中世フランスの身分制議会であり、宗教裁判の仕組みとは異なります。"},
  {id:"wor507", cat:"世界史", sub:"ヨーロッパ史", q:"絶対王政下のフランスで、国王・貴族・聖職者・平民の代表が集まった身分制議会を何というか。", choices:["三部会","元老院","下院","民会"], a:0, e:"正解は「三部会」です。三部会はフランスの身分制議会で、聖職者・貴族・平民の三つの身分の代表が集まる会議であり、フランス革命前に招集されたことでも知られます。「元老院」は誤りで、これは古代ローマなどで用いられた統治機関の呼び方です。「下院」は誤りで、これは近代的な二院制議会の一院を指す言葉であり、身分制の三部会とは性質が異なります。「民会」は誤りで、これは古代ギリシャの直接民主政における市民集会を指す言葉です。"},
  {id:"wor509", cat:"世界史", sub:"ヨーロッパ史", q:"産業革命期、劣悪な労働環境の中で子どもが工場で働かされた問題を受け、イギリスで制定された労働時間などを規制する法律を何というか。", choices:["工場法","権利章典","人権宣言","選挙法改正のみ"], a:0, e:"正解は「工場法」です。工場法は産業革命期のイギリスで、児童労働の制限や労働時間の規制など、労働者の保護を目的として制定された一連の法律です。「権利章典」は誤りで、これは1689年に議会の権限を明確にした文書であり、労働条件とは異なる内容です。「人権宣言」は誤りで、これは1789年のフランス革命で発表された宣言です。「選挙法改正のみ」は誤りで、これは選挙権の拡大に関する制度改正であり、工場労働の規制とは異なる分野です。"},
  {id:"wor511", cat:"世界史", sub:"ヨーロッパ史", q:"19世紀イギリスで、選挙権を持たない労働者が普通選挙などを求めて展開した運動を何というか。", choices:["チャーティスト運動","名誉革命","権利章典制定運動","産業革命のみ"], a:0, e:"正解は「チャーティスト運動」です。チャーティスト運動（1830〜40年代）は、選挙権を持たなかった労働者階級が男子普通選挙などを求めて展開した社会運動です。「名誉革命」は誤りで、これは1688年に起こった王権交代であり、時代・性質が異なります。「権利章典制定運動」は誤りで、権利章典の制定は17世紀の出来事であり、19世紀の労働者運動とは異なります。「産業革命のみ」は誤りで、産業革命は経済的な変化を指す言葉であり、選挙権を求める社会運動そのものを指すものではありません。"},
  {id:"wor513", cat:"世界史", sub:"ヨーロッパ史", q:"19世紀後半、ドイツで社会主義思想を唱え「資本論」を著した人物は誰か。", choices:["マルクス","レーニン","スターリン","毛沢東"], a:0, e:"正解は「マルクス」です。マルクスは19世紀のドイツの思想家で、資本主義を分析した「資本論」を著し、社会主義・共産主義の理論的基礎を築きました。「レーニン」は誤りで、彼はマルクスの思想を継承しロシア革命を指導した人物ですが、「資本論」の著者ではありません。「スターリン」は誤りで、彼はレーニンの後継者としてソ連の指導者となった人物です。「毛沢東」は誤りで、彼は中国共産党の指導者であり、「資本論」の著者ではありません。"},
  {id:"wor515", cat:"世界史", sub:"両大戦期", q:"第一次世界大戦後、敗戦国オーストリア＝ハンガリー帝国が解体した結果として正しいものはどれか。", choices:["複数の新しい独立国が誕生した","単一の巨大国家として存続した","イギリスの植民地となった","戦勝国として領土を拡大した"], a:0, e:"正解は「複数の新しい独立国が誕生した」です。第一次世界大戦の敗戦国であったオーストリア＝ハンガリー帝国は解体され、チェコスロバキアやハンガリーなど複数の新しい独立国が誕生しました。「単一の巨大国家として存続した」は誤りで、事実とは正反対であり、帝国は解体され複数の国に分かれました。「イギリスの植民地となった」は誤りで、そのような事実はありません。「戦勝国として領土を拡大した」は誤りで、オーストリア＝ハンガリー帝国は敗戦国であり、領土を失う立場にありました。"},
  {id:"wor517", cat:"世界史", sub:"両大戦期", q:"世界恐慌の影響を受けイタリアで軍国主義・全体主義体制を築いた指導者は誰か。", choices:["ムッソリーニ","ヒトラー","フランコ","スターリン"], a:0, e:"正解は「ムッソリーニ」です。ムッソリーニはイタリアでファシスト党を率い、世界恐慌前後の混乱の中で独裁的な全体主義体制を築きました。「ヒトラー」は誤りで、彼はドイツでナチス独裁体制を築いた指導者であり、イタリアではありません。「フランコ」は誤りで、彼はスペイン内戦後に独裁体制を築いた人物です。「スターリン」は誤りで、彼はソ連の指導者であり、イタリアとは異なる国の人物です。"},
  {id:"wor519", cat:"世界史", sub:"両大戦期", q:"スペイン内戦後、長期にわたる独裁体制を築いた人物は誰か。", choices:["フランコ","ムッソリーニ","ヒトラー","チャーチル"], a:0, e:"正解は「フランコ」です。フランコはスペイン内戦（1936〜1939年）で反乱軍を率いて勝利し、その後長期にわたる独裁体制をスペインに築きました。「ムッソリーニ」は誤りで、彼はイタリアの指導者であり、スペインではありません。「ヒトラー」は誤りで、彼はドイツの指導者であり、スペイン内戦には介入しましたが独裁体制を築いたのはスペイン国内のフランコです。「チャーチル」は誤りで、彼はイギリスの首相であり、独裁者ではありません。"},
  {id:"wor521", cat:"世界史", sub:"両大戦期", q:"第二次世界大戦中、ナチス・ドイツがユダヤ人などを組織的に迫害・殺害した政策を何というか。", choices:["ホロコースト","アパルトヘイト","ジェノサイドのみ","レジスタンスのみ"], a:0, e:"正解は「ホロコースト」です。ホロコーストは第二次世界大戦中、ナチス・ドイツがユダヤ人などを組織的に迫害し、強制収容所などで大量に殺害した政策を指します。「アパルトヘイト」は誤りで、これは南アフリカで行われた人種隔離政策であり、ナチス・ドイツの政策とは別のものです。「ジェノサイドのみ」は誤りで、これは特定の集団への計画的な大量虐殺を指す一般的な用語であり、ホロコーストという固有の出来事を指す言葉ではありません。「レジスタンスのみ」は誤りで、これは占領軍への抵抗運動を指す言葉であり、迫害・殺害政策とは正反対の意味です。"},
  {id:"wor523", cat:"世界史", sub:"現代", q:"第二次世界大戦後に設立された、貿易の自由化やルール整備を目的とする多角的な協定を何というか。", choices:["GATT(関税及び貿易に関する協定)","IMF(国際通貨基金)","世界銀行(復興開発銀行)","OECD(経済協力開発機構)"], a:0, e:"正解は「GATT(関税及び貿易に関する一般協定)」です。GATTは1948年に発効し、関税の引き下げなど貿易の自由化を進めるための多角的な協定で、後にWTO（世界貿易機関）に発展しました。「IMF」は誤りで、これは国際通貨基金の略称であり、為替の安定などを目的とする別の機関です。「世界銀行」は誤りで、これは発展途上国への融資などを行う機関であり、貿易ルールを扱うGATTとは役割が異なります。「OECDのみ」は誤りで、これは経済協力開発機構の略称であり、GATTとは異なる組織です。"},
  {id:"wor525", cat:"世界史", sub:"現代", q:"1944年、戦後の国際通貨体制を定めるために開かれた会議で設立が決まった機関の組み合わせとして正しいものはどれか。", choices:["IMFと世界銀行","WTOとILO","国連とNATO","EUとASEAN"], a:0, e:"正解は「IMFと世界銀行」です。1944年のブレトンウッズ会議では、国際通貨の安定を図るIMF（国際通貨基金）と、復興・開発のための融資を行う世界銀行の設立が決まりました。「WTOとILO」は誤りで、WTOはこの会議より後（1995年）に設立された機関であり、この会議で設立が決まったものではありません。「国連とNATO」は誤りで、国連は1945年、NATOは1949年に設立された別の組織です。「EUとASEAN」は誤りで、これらもこの会議とは異なる時期・経緯で設立された組織です。"},
  {id:"wor527", cat:"世界史", sub:"現代", q:"1955年、東側諸国が結成した、NATOに対抗する軍事同盟を何というか。", choices:["ワルシャワ条約機構","NATO","SEATO","ASEAN"], a:0, e:"正解は「ワルシャワ条約機構」です。ワルシャワ条約機構（1955年結成）は、NATOに対抗してソ連を中心とする東側（社会主義）諸国が結成した軍事同盟です。「NATO」は誤りで、これはワルシャワ条約機構が対抗した、西側（資本主義）陣営の軍事同盟です。「SEATO」は誤りで、これは東南アジアを対象としたアメリカ中心の別の軍事同盟です。「ASEAN」は誤りで、これは東南アジア諸国自身による地域協力機構であり、軍事同盟ではありません。"},
  {id:"wor529", cat:"世界史", sub:"現代", q:"アメリカの公民権運動を指導し、人種差別の撤廃を訴えた人物は誰か。", choices:["マーティン・ルーサー・キング","ネルソン・マンデラ","ガンディー","マルコムXのみ"], a:0, e:"正解は「マーティン・ルーサー・キング」です。マーティン・ルーサー・キング牧師はアメリカの公民権運動を指導し、非暴力の方法で人種差別の撤廃を訴えました。「ネルソン・マンデラ」は誤りで、彼は南アフリカでアパルトヘイト撤廃に尽力した人物であり、アメリカの公民権運動を指導したわけではありません。「ガンディー」は誤りで、彼はインド独立運動を指導した人物です。「マルコムXのみ」は誤りで、彼も公民権運動に関わった人物ですが、非暴力を掲げ運動を代表する存在として広く知られるのはキング牧師です。"},
  {id:"wor531", cat:"世界史", sub:"現代", q:"冷戦下、ソ連が人工衛星スプートニクの打ち上げに成功したことでアメリカとの間に生じた競争を何というか。", choices:["宇宙開発競争","軍拡競争のみ","経済競争のみ","文化競争のみ"], a:0, e:"正解は「宇宙開発競争」です。1957年、ソ連が人工衛星スプートニクの打ち上げに成功したことをきっかけに、米ソの間で宇宙開発をめぐる激しい競争が展開されました。「軍拡競争のみ」は誤りで、これは核兵器などの軍備拡張に関する競争を指す言葉であり、宇宙開発という特定の分野を表す言葉ではありません。「経済競争のみ」は誤りで、この設問が問うのは特に宇宙分野での競争です。「文化競争のみ」も誤りで、宇宙開発競争は科学技術分野での競争を指します。"},
  {id:"wor533", cat:"世界史", sub:"現代", q:"1962年のキューバ危機を最終的に収束させた対応として正しいものはどれか。", choices:["ソ連がミサイルを撤去し危機を回避した","アメリカがキューバに侵攻した","両国が核戦争に突入した","国連が軍事介入した"], a:0, e:"正解は「ソ連がミサイルを撤去し危機を回避した」です。キューバ危機は米ソ間の緊迫した交渉の末、ソ連がキューバに配備しようとしたミサイルを撤去することで最終的に危機は回避されました。「アメリカがキューバに侵攻した」は誤りで、実際には軍事侵攻ではなく外交交渉により危機は収束しました。「両国が核戦争に突入した」は誤りで、これはまさに回避された最悪の事態であり、実際には起こりませんでした。「国連が軍事介入した」は誤りで、この危機の収束は主に米ソ間の直接交渉によるものです。"},
  {id:"wor535", cat:"世界史", sub:"現代", q:"1975年のベトナム戦争終結後、ベトナムはどうなったか。", choices:["南北が統一され社会主義国家となった","南北分断がそのまま固定化された","アメリカの統治下に置かれた","フランスの植民地に戻った"], a:0, e:"正解は「南北が統一され社会主義国家となった」です。1975年、ベトナム戦争が終結すると、南北ベトナムは統一され、社会主義国家であるベトナム社会主義共和国が成立しました。「南北分断がそのまま固定化された」は誤りで、これはむしろ朝鮮半島の状況に近く、ベトナムでは統一が実現しました。「アメリカの統治下に置かれた」は誤りで、実際にはアメリカ軍はベトナムから撤退しており、統治下に置かれた事実はありません。「フランスの植民地に戻った」は誤りで、フランスによる植民地支配はすでに1950年代に終わっており、1975年に植民地に戻った事実はありません。"},
  {id:"wor537", cat:"世界史", sub:"現代", q:"1980年代、ソ連のゴルバチョフが進めた「情報公開」を意味する政策を何というか。", choices:["グラスノスチ","ペレストロイカ","デタントのみ","雪どけのみ"], a:0, e:"正解は「グラスノスチ」です。グラスノスチはゴルバチョフが進めた「情報公開」を意味する政策で、それまで統制されていた情報の公開を進め、言論の自由化にもつながりました。「ペレストロイカ」は誤りで、これはグラスノスチと並んでゴルバチョフが進めた政策ですが、「改革」を意味し、経済・政治体制の見直しに重点を置いた、より広い概念です。「デタントのみ」は誤りで、これは1970年代の東西緊張緩和を指す言葉であり、情報公開とは異なる概念です。「雪どけのみ」は誤りで、これは1950年代の一時的な緊張緩和を指す言葉であり、時期・内容が異なります。"},
  {id:"wor539", cat:"世界史", sub:"現代", q:"1970年代、東西冷戦の緊張が一時的に緩和した状況を何と呼ぶか。", choices:["デタント(緊張緩和)","グラスノスチ","ペレストロイカ","文化大革命のみ"], a:0, e:"正解は「デタント(緊張緩和)」です。デタントは1970年代、米ソ間の緊張が一時的に緩和した状況を指す言葉で、この時期には核軍縮交渉なども進められました。「グラスノスチ」は誤りで、これは1980年代にゴルバチョフが進めた情報公開政策であり、1970年代のデタントとは時期が異なります。「ペレストロイカ」も同様に1980年代の改革政策であり、時期が異なります。「文化大革命のみ」は誤りで、これは中国国内の政治運動であり、米ソ間の緊張緩和とは異なる出来事です。"},
  {id:"wor541", cat:"世界史", sub:"現代", q:"国際連合の専門機関のうち、労働条件の国際的な基準づくりを担う機関はどれか。", choices:["ILO(国際労働機関)","WHO","UNESCO","IMF"], a:0, e:"正解は「ILO(国際労働機関)」です。ILOは労働者の権利保護や労働条件の国際的な基準づくりを担う、国連の専門機関です。「WHO」は誤りで、これは健康・医療分野の国際協力を担う機関であり、労働条件を主な対象とはしていません。「UNESCO」は誤りで、これは教育・科学・文化分野を担当する機関です。「IMF」は誤りで、これは国際的な通貨・為替の安定を図る機関であり、労働条件とは異なる分野を扱います。"},
  {id:"wor543", cat:"世界史", sub:"現代", q:"発展途上国の債務問題に対し、IMFなどの国際機関が行う支援の一例として正しいものはどれか。", choices:["融資や財政再建に向けた支援","すべての債務の即時帳消しのみ","援助の完全停止のみ","貿易のすべての禁止のみ"], a:0, e:"正解は「融資や財政再建に向けた支援」です。IMFなどの国際機関は、深刻な債務問題を抱える発展途上国に対し、融資や財政再建に向けた助言・支援を行うことがあります。「すべての債務の即時帳消しのみ」は誤りで、実際の支援は融資や条件付きの再建支援が中心であり、無条件の即時帳消しのみが行われるわけではありません。「援助の完全停止のみ」は誤りで、これは支援とは正反対の内容です。「貿易のすべての禁止のみ」は誤りで、これも債務問題への対応としては不適切な内容です。"},
  {id:"wor545", cat:"世界史", sub:"現代", q:"オゾン層を破壊するフロンガスなどの物質の生産・使用を規制する国際的な取り決めを何というか。", choices:["モントリオール議定書","京都議定書","パリ協定","ラムサール条約"], a:0, e:"正解は「モントリオール議定書」です。モントリオール議定書（1987年採択）は、オゾン層を破壊するフロンガスなどの物質の生産・使用を規制する国際的な取り決めです。「京都議定書」は誤りで、これは地球温暖化対策（温室効果ガス削減）に関する取り決めであり、オゾン層破壊物質を主な対象とはしていません。「パリ協定」は誤りで、これも地球温暖化対策に関する枠組みです。「ラムサール条約」は誤りで、これは湿地の保全に関する条約であり、オゾン層問題とは異なる分野です。"},
  {id:"wor547", cat:"世界史", sub:"現代", q:"核実験を全面的に禁止することを目的とした条約を何というか。", choices:["包括的核実験禁止条約(CTBT)","核拡散防止条約(NPT)","中距離核戦力全廃条約","戦略兵器削減条約"], a:0, e:"正解は「包括的核実験禁止条約(CTBT)」です。CTBTはあらゆる場所でのあらゆる種類の核実験を禁止することを目的とした条約です。「核拡散防止条約(NPT)」は誤りで、これは核兵器を持つ国をこれ以上増やさないことを目的とした条約であり、核実験そのものの全面禁止を扱うCTBTとは内容が異なります。「中距離核戦力全廃条約」は誤りで、これは米ソ間で特定の射程のミサイルを対象とした条約です。「戦略兵器削減条約」は誤りで、これは米ソ（米ロ）間の戦略核兵器の削減に関する条約であり、いずれもCTBTとは異なる内容です。"},
  {id:"wor549", cat:"世界史", sub:"現代", q:"国際刑事裁判所(ICC)が扱う主な対象として正しいものはどれか。", choices:["個人による重大な国際犯罪","国家間の通商紛争のみ","労働条件の紛争のみ","特許権をめぐる紛争のみ"], a:0, e:"正解は「個人による重大な国際犯罪」です。国際刑事裁判所（ICC）はジェノサイドや戦争犯罪など、個人による重大な国際犯罪を裁くために設立された裁判所です。「国家間の通商紛争のみ」は誤りで、これはWTOの紛争解決手続きなど別の枠組みで扱われる事柄です。「労働条件の紛争のみ」は誤りで、これはILOなど別の機関が扱う分野です。「特許権をめぐる紛争のみ」は誤りで、これも知的財産に関する別の枠組みで扱われる事柄であり、ICCの主な対象ではありません。"},
  /* 日本史 */
  {id:"his557", cat:"日本史", sub:"古代", q:"次のうち、最も古い出来事はどれか。", choices:["大化の改新","平城京遷都","平安京遷都","遣唐使の停止"], a:0, e:"正解は「大化の改新」（645年）です。年代順に並べると、大化の改新(645年)→平城京遷都(710年)→平安京遷都(794年)→遣唐使の停止(894年)となります。「平城京遷都」は誤りで、これは大化の改新の65年後です。「平安京遷都」は誤りで、さらにその84年後です。「遣唐使の停止」は誤りで、この4つの中では最も新しい出来事です。"},
  {id:"his559", cat:"日本史", sub:"平安時代", q:"次のうち、最も新しい出来事はどれか。", choices:["承久の乱","保元の乱","平治の乱","壇ノ浦の戦い(平氏滅亡)"], a:0, e:"正解は「承久の乱」（1221年）です。年代順に並べると、保元の乱(1156年)→平治の乱(1159年)→壇ノ浦の戦い(1185年)→承久の乱(1221年)となります。「保元の乱」は誤りで、この4つの中で最も古い出来事です。「平治の乱」は誤りで、保元の乱の3年後です。「壇ノ浦の戦い」は誤りで、承久の乱より36年前の出来事です。"},
  {id:"his561", cat:"日本史", sub:"鎌倉・室町", q:"次のうち、鎌倉幕府成立(1185年頃)より前に起こった出来事はどれか。", choices:["平治の乱","元寇(文永の役)","建武の新政","応仁の乱"], a:0, e:"正解は「平治の乱」（1159年）です。これは鎌倉幕府成立より26年ほど前の出来事です。「元寇(文永の役)」は誤りで、これは1274年であり鎌倉幕府成立より後の出来事です。「建武の新政」は誤りで、これは1333年、鎌倉幕府が滅亡した後の出来事です。「応仁の乱」は誤りで、これは1467年で鎌倉幕府成立よりずっと後の室町時代の出来事です。"},
  {id:"his563", cat:"日本史", sub:"鎌倉・室町", q:"元寇の直接の結果として起こったことはどれか。", choices:["恩賞不足への不満から御家人の信頼が低下した","鎌倉幕府がすぐに滅亡した","日本が元の支配下に入った","貿易の利益で御家人が豊かになった"], a:0, e:"正解は「恩賞不足への不満から御家人の幕府への信頼が低下した」です。防衛戦であった元寇では新たな領地を得られず、十分な恩賞を与えられなかった御家人の不満が高まりました。「鎌倉幕府がすぐに滅亡した」は誤りで、幕府が実際に滅亡したのは元寇から約50年後の1333年です。「日本が元の支配下に入った」は誤りで、日本軍は元軍を撃退しており支配を受けていません。「貿易の利益で御家人が豊かになった」は誤りで、元寇は防衛戦であり貿易とは無関係です。"},
  {id:"his565", cat:"日本史", sub:"鎌倉・室町", q:"次のうち、応仁の乱(1467年)より後に起こった出来事はどれか。", choices:["鉄砲伝来","建武の新政","元寇","承久の乱"], a:0, e:"正解は「鉄砲伝来」（1543年）です。これは応仁の乱の76年後にあたります。「建武の新政」は誤りで、これは1333年で応仁の乱より134年前です。「元寇」は誤りで、これは1274・1281年で応仁の乱よりさらに前です。「承久の乱」は誤りで、これは1221年でこの4つの中で最も古い出来事です。"},
  {id:"his567", cat:"日本史", sub:"戦国・江戸", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["鉄砲伝来→桶狭間の戦い→本能寺の変→関ヶ原の戦い","桶狭間の戦い→鉄砲伝来→関ヶ原の戦い→本能寺の変","本能寺の変→鉄砲伝来→桶狭間の戦い→関ヶ原の戦い","関ヶ原の戦い→本能寺の変→桶狭間の戦い→鉄砲伝来"], a:0, e:"正解は「鉄砲伝来→桶狭間の戦い→本能寺の変→関ヶ原の戦い」です。年代は鉄砲伝来(1543年)→桶狭間の戦い(1560年)→本能寺の変(1582年)→関ヶ原の戦い(1600年)の順です。他の選択肢はいずれもこの順序が入れ替わっており、実際の年代とは一致しません。"},
  {id:"his569", cat:"日本史", sub:"戦国・江戸", q:"本能寺の変が起こった直接の結果として正しいものはどれか。", choices:["豊臣秀吉が信長の後継者として台頭した","織田信長が天下統一を完成させた","徳川家康が征夷大将軍に就任した","豊臣氏が完全に滅亡した"], a:0, e:"正解は「豊臣秀吉が信長の後継者として台頭した」です。本能寺の変で織田信長が明智光秀に討たれた後、いち早く光秀を討った豊臣秀吉が信長の後継者としての地位を固めていきました。「織田信長が天下統一を完成させた」は誤りで、信長は本能寺の変で自害しており、天下統一を完成させたのは秀吉です。「徳川家康が征夷大将軍に就任した」は誤りで、これは本能寺の変の21年後(1603年)の出来事です。「豊臣氏が完全に滅亡した」は誤りで、これは1615年の大坂夏の陣であり、本能寺の変の直接の結果ではありません。"},
  {id:"his573", cat:"日本史", sub:"戦国・江戸", q:"次のうち、江戸幕府成立(1603年)より前に起こった出来事はどれか。", choices:["関ヶ原の戦い","大坂夏の陣","島原の乱","鎖国の完成"], a:0, e:"正解は「関ヶ原の戦い」（1600年）です。これは江戸幕府成立の3年前の出来事です。「大坂夏の陣」は誤りで、これは1615年で江戸幕府成立より後です。「島原の乱」は誤りで、これは1637〜38年でさらに後です。「鎖国の完成」は誤りで、これは1639年で江戸幕府成立から36年後の出来事です。"},
  {id:"his577", cat:"日本史", sub:"江戸時代", q:"江戸幕府の三大改革を古い順に並べたとき、正しいものはどれか。", choices:["享保の改革→寛政の改革→天保の改革","寛政の改革→享保の改革→天保の改革","天保の改革→享保の改革→寛政の改革","寛政の改革→天保の改革→享保の改革"], a:0, e:"正解は「享保の改革→寛政の改革→天保の改革」です。享保の改革(1716年〜、徳川吉宗)→寛政の改革(1787年〜、松平定信)→天保の改革(1841年〜、水野忠邦)の順に行われました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"his579", cat:"日本史", sub:"近代", q:"ペリー来航(1853年)の直接の結果として正しいものはどれか。", choices:["翌年、日米和親条約が結ばれ開国した","江戸幕府がただちに滅亡した","日本が鎖国をさらに強化した","日本と清の戦争が始まった"], a:0, e:"正解は「翌年、日米和親条約が結ばれ開国した」です。ペリー来航の圧力を受け、幕府は翌1854年に日米和親条約を結び、下田・函館を開港しました。「江戸幕府がただちに滅亡した」は誤りで、幕府はこの後も約15年存続しました。「日本が鎖国をさらに強化した」は誤りで、事実とは正反対であり、この出来事をきっかけに開国が進みました。「日本と清の戦争が始まった」は誤りで、これはペリー来航とは無関係な、後の日清戦争(1894年)の話です。"},
  {id:"his581", cat:"日本史", sub:"近代", q:"次のうち、日米修好通商条約(1858年)より前に起こった出来事はどれか。", choices:["日米和親条約","桜田門外の変","薩長同盟","大政奉還"], a:0, e:"正解は「日米和親条約」（1854年）です。これは日米修好通商条約の4年前の出来事です。「桜田門外の変」は誤りで、これは1860年で日米修好通商条約より後です。「薩長同盟」は誤りで、これは1866年でさらに後です。「大政奉還」は誤りで、これは1867年で最も後の出来事です。"},
  {id:"his585", cat:"日本史", sub:"近代", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["大政奉還→王政復古の大号令→戊辰戦争→廃藩置県","王政復古の大号令→大政奉還→廃藩置県→戊辰戦争","戊辰戦争→大政奉還→王政復古の大号令→廃藩置県","廃藩置県→戊辰戦争→王政復古の大号令→大政奉還"], a:0, e:"正解は「大政奉還→王政復古の大号令→戊辰戦争→廃藩置県」です。大政奉還(1867年10月)→王政復古の大号令(1867年12月)→戊辰戦争(1868〜69年)→廃藩置県(1871年)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"his589", cat:"日本史", sub:"近代", q:"次のうち、大日本帝国憲法発布(1889年)より後に起こった出来事はどれか。", choices:["日清戦争","西南戦争","廃藩置県","地租改正"], a:0, e:"正解は「日清戦争」（1894年）です。これは大日本帝国憲法発布の5年後の出来事です。「西南戦争」は誤りで、これは1877年で憲法発布より前です。「廃藩置県」は誤りで、これは1871年でさらに前です。「地租改正」は誤りで、これは1873年でこの4つの中では最も古い出来事です。"},
  {id:"his591", cat:"日本史", sub:"近代", q:"日清戦争の直接の結果として正しいものはどれか。", choices:["下関条約が結ばれ賠償金と領土を得た","日本が敗北し領土を失った","日本が国際連盟を脱退した","日本が韓国を併合した"], a:0, e:"正解は「下関条約が結ばれ賠償金と領土を得た」です。日清戦争(1894〜95年)に勝利した日本は下関条約を結び、賠償金や台湾などの領土を獲得しました。「日本が敗北し領土を失った」は誤りで、事実とは正反対であり日本はこの戦争に勝利しています。「日本が国際連盟を脱退した」は誤りで、これは1933年、満州事変を背景とした全く別の出来事です。「日本が韓国を併合した」は誤りで、これは1910年の出来事であり、日清戦争の直接の結果ではありません。"},
  {id:"his593", cat:"日本史", sub:"近代", q:"三国干渉が起こった直接のきっかけとして正しいものはどれか。", choices:["下関条約で日本が遼東半島を獲得したこと","日本が国際連盟に加盟したこと","日本が韓国を併合したこと","日本がロシアに敗北したこと"], a:0, e:"正解は「下関条約で日本が遼東半島を獲得したこと」です。下関条約で日本が遼東半島を獲得したことに対し、ロシア・フランス・ドイツが警戒し、その返還を求める三国干渉を行いました。「日本が国際連盟に加盟したこと」は誤りで、国際連盟自体まだ存在しない時代の出来事です。「日本が韓国を併合したこと」は誤りで、これは三国干渉より15年後の1910年の出来事です。「日本がロシアに敗北したこと」は誤りで、日本はロシアと戦った日露戦争(1904〜05年)にむしろ勝利しています。"},
  {id:"his595", cat:"日本史", sub:"近代", q:"次のうち、日露戦争(1904〜05年)より前に起こった出来事はどれか。", choices:["日英同盟","韓国併合","第一次世界大戦参戦","二十一か条の要求"], a:0, e:"正解は「日英同盟」（1902年）です。これは日露戦争の2年前に結ばれ、ロシアの南下政策に対抗する目的がありました。「韓国併合」は誤りで、これは1910年で日露戦争より後です。「第一次世界大戦参戦」は誤りで、これは1914年でさらに後です。「二十一か条の要求」は誤りで、これは1915年でこの4つの中では最も新しい出来事です。"},
  {id:"his597", cat:"日本史", sub:"近代", q:"日露戦争後、日比谷焼き打ち事件が起こった直接の原因として正しいものはどれか。", choices:["ポーツマス条約で賠償金を得られなかったこと","日本が戦争に敗北したことへの不満","講和自体に反対する国民が多かったこと","増税がすでに撤廃されていたこと"], a:0, e:"正解は「ポーツマス条約で賠償金を得られなかったこと」です。多大な犠牲と重税に耐えたにもかかわらず賠償金を得られなかったことへの不満から、日比谷焼き打ち事件が起こりました。「日本が戦争に敗北したこと」は誤りで、日本はこの戦争に勝利しています。「講和そのものに反対する国民が多かったこと」は誤りで、不満の中心は講和自体ではなく賠償金の有無でした。「増税が撤廃されたこと」は誤りで、実際には戦費調達のための重税が国民の負担となっており、撤廃されたわけではありません。"},
  {id:"his599", cat:"日本史", sub:"近代", q:"第一次世界大戦への参戦が日本経済にもたらした直接の結果として正しいものはどれか。", choices:["ヨーロッパへの輸出が増え大戦景気となった","日本経済が深刻な不況に陥った","国内の工場がすべて閉鎖された","貿易がすべて停止した"], a:0, e:"正解は「ヨーロッパへの輸出が増え大戦景気となった」です。戦場となったヨーロッパの生産力が低下したため、日本からの輸出が増え、大戦景気と呼ばれる好況をもたらしました。「日本経済が深刻な不況に陥った」は誤りで、事実とは正反対の好景気が生まれました。「国内の工場がすべて閉鎖された」は誤りで、実際にはむしろ生産が拡大しました。「貿易がすべて停止した」は誤りで、輸出はむしろ拡大しています。"},
  {id:"his601", cat:"日本史", sub:"近代", q:"次のうち、普通選挙法(1925年)と同じ年に制定された法律はどれか。", choices:["治安維持法","国家総動員法","教育基本法","日本国憲法"], a:0, e:"正解は「治安維持法」です。普通選挙法と治安維持法はいずれも1925年に制定され、有権者拡大と社会主義運動の取り締まりが同時に進められました。「国家総動員法」は誤りで、これは1938年の制定です。「教育基本法」は誤りで、これは戦後1947年の制定です。「日本国憲法」は誤りで、これも戦後1946年公布であり、いずれも1925年とは時代が異なります。"},
  {id:"his603", cat:"日本史", sub:"現代", q:"満州事変が起こった直接のきっかけとして正しいものはどれか。", choices:["関東軍が柳条湖で南満州鉄道を爆破したこと","日本が国際連盟を脱退したこと","日中戦争が始まったこと","二・二六事件が起こったこと"], a:0, e:"正解は「関東軍が柳条湖で南満州鉄道を爆破したこと」です。関東軍は柳条湖付近で自ら鉄道を爆破し、これを中国側の仕業として軍事行動(満州事変)を起こしました。「日本が国際連盟を脱退したこと」は誤りで、これは満州事変の結果として2年後に起こった出来事であり、原因ではありません。「日中戦争が始まったこと」は誤りで、これは1937年で満州事変より後です。「二・二六事件が起こったこと」は誤りで、これも満州事変より後の1936年の出来事です。"},
  {id:"his605", cat:"日本史", sub:"現代", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["満州事変→国際連盟脱退→日中戦争→太平洋戦争開戦","国際連盟脱退→満州事変→太平洋戦争開戦→日中戦争","日中戦争→満州事変→国際連盟脱退→太平洋戦争開戦","太平洋戦争開戦→日中戦争→国際連盟脱退→満州事変"], a:0, e:"正解は「満州事変→国際連盟脱退→日中戦争→太平洋戦争開戦」です。満州事変(1931年)→国際連盟脱退(1933年)→日中戦争開始(1937年)→太平洋戦争開戦(1941年)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"his607", cat:"日本史", sub:"現代", q:"国家総動員法が制定された直接の背景として正しいものはどれか。", choices:["日中戦争が長期化し総力戦体制が必要になったため","戦争がすでに終結していたため","平和な社会を目指すためであった","地方自治を強化するためであった"], a:0, e:"正解は「日中戦争が長期化し総力戦体制が必要になったため」です。日中戦争の長期化にともない、国全体の資源や労働力を動員する必要が生じ、国家総動員法(1938年)が制定されました。「戦争がすでに終結していたため」は誤りで、この時点ではまだ戦争は続いており、終結は1945年です。「平和な社会を目指すためであった」は誤りで、これは戦争遂行のための統制強化を目的とした法律です。「地方自治を強化するためであった」は誤りで、この法律はむしろ中央政府による強い統制を可能にするものです。"},
  {id:"his609", cat:"日本史", sub:"現代", q:"ポツダム宣言受諾の直接の結果として正しいものはどれか。", choices:["日本が無条件降伏し戦争が終結した","日本がさらに戦争を継続した","日本が新たに領土を獲得した","日本が国際連盟に加盟した"], a:0, e:"正解は「日本が無条件降伏し戦争が終結した」です。1945年8月、日本はポツダム宣言を受諾し無条件降伏したことで、第二次世界大戦・太平洋戦争が終結しました。「日本がさらに戦争を継続した」は誤りで、内容が正反対です。「日本が新たに領土を獲得した」は誤りで、敗戦国となった日本はむしろ多くの領土を失いました。「日本が国際連盟に加盟した」は誤りで、国際連盟はこの時期すでに実質的に機能しておらず、戦後日本が加盟したのは国際連合(1956年)です。"},
  {id:"his611", cat:"日本史", sub:"現代", q:"次のうち、日本国憲法公布(1946年11月)より前に起こった出来事はどれか。", choices:["財閥解体の開始","日本国憲法の施行","教育基本法の制定","警察予備隊の創設"], a:0, e:"正解は「財閥解体の開始」です。財閥解体はGHQの指導のもと1945年から始まっており、日本国憲法公布(1946年11月)より前の出来事です。「日本国憲法の施行」は誤りで、これは1947年5月で公布より後です。「教育基本法の制定」は誤りで、これも1947年でさらに後です。「警察予備隊の創設」は誤りで、これは1950年で最も後の出来事です。"},
  {id:"his613", cat:"日本史", sub:"現代", q:"警察予備隊が創設された直接のきっかけとして正しいものはどれか。", choices:["朝鮮戦争が始まったこと","日本国憲法が施行されたこと","サンフランシスコ平和条約が結ばれたこと","55年体制が成立したこと"], a:0, e:"正解は「朝鮮戦争が始まったこと」です。1950年に朝鮮戦争が始まったことを背景に、GHQの指令により警察予備隊が創設されました。「日本国憲法が施行されたこと」は誤りで、これは1947年で警察予備隊創設の3年前の出来事であり、直接のきっかけではありません。「サンフランシスコ平和条約が結ばれたこと」は誤りで、これは1951年で警察予備隊創設の翌年の出来事です。「55年体制が成立したこと」は誤りで、これは1955年で警察予備隊創設より後です。"},
  {id:"his615", cat:"日本史", sub:"現代", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["サンフランシスコ平和条約→55年体制成立→日ソ共同宣言→日米安保改定","55年体制成立→サンフランシスコ平和条約→日米安保改定→日ソ共同宣言","日ソ共同宣言→日米安保改定→サンフランシスコ平和条約→55年体制成立","日米安保改定→日ソ共同宣言→55年体制成立→サンフランシスコ平和条約"], a:0, e:"正解は「サンフランシスコ平和条約→55年体制成立→日ソ共同宣言→日米安保改定」です。サンフランシスコ平和条約(1951年)→55年体制成立(1955年)→日ソ共同宣言(1956年)→日米安保改定(1960年)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"his617", cat:"日本史", sub:"現代", q:"日ソ共同宣言が結ばれた直接の結果として正しいものはどれか。", choices:["日本の国際連合加盟が実現した","日本とソ連が戦争を始めた","日本の高度経済成長が終わった","日本が沖縄を返還された"], a:0, e:"正解は「日本の国際連合加盟が実現した」です。日ソ共同宣言(1956年)により日本とソ連の国交が回復し、ソ連の反対がなくなったことで同年、日本の国際連合加盟が実現しました。「日本とソ連が戦争を始めた」は誤りで、この宣言はむしろ両国の国交を回復させるものであり、内容が正反対です。「日本の高度経済成長が終わった」は誤りで、高度経済成長はこの後の1950年代後半から本格化しました。「日本が沖縄を返還された」は誤りで、これは1972年の出来事であり、日ソ共同宣言とは無関係です。"},
  {id:"his619", cat:"日本史", sub:"現代", q:"石油危機(1973年)が日本経済にもたらした直接の結果として正しいものはどれか。", choices:["高度経済成長が終わり安定成長に移行した","高度経済成長がさらに加速した","バブル経済がすぐに崩壊した","55年体制が崩壊した"], a:0, e:"正解は「高度経済成長が終わり安定成長に移行した」です。石油危機による原油価格の急騰は日本の高度経済成長を終わらせ、安定成長への移行を促しました。「高度経済成長がさらに加速した」は誤りで、事実とは正反対です。「バブル経済がすぐに崩壊した」は誤りで、バブル経済の形成・崩壊は石油危機よりかなり後(1980年代後半〜1990年代初め)の出来事です。「55年体制が崩壊した」は誤りで、これは1993年の出来事であり、石油危機の直接の結果ではありません。"},
  {id:"his621", cat:"日本史", sub:"現代", q:"次のうち、沖縄返還(1972年5月)より前に起こった出来事はどれか。", choices:["東京オリンピック","日中共同声明","石油危機","消費税導入"], a:0, e:"正解は「東京オリンピック」（1964年）です。これは沖縄返還の8年前の出来事です。「日中共同声明」は誤りで、これは1972年9月で沖縄返還のわずか4か月後です。「石油危機」は誤りで、これは1973年でさらに後です。「消費税導入」は誤りで、これは1989年でこの4つの中では最も新しい出来事です。"},
  {id:"his623", cat:"日本史", sub:"現代", q:"バブル経済崩壊の直接の一因として最も適切なものはどれか。", choices:["日本銀行による金融引き締め政策","石油危機の発生","55年体制の成立","農地改革の実施"], a:0, e:"正解は「日本銀行による金融引き締め政策」です。地価の異常な高騰を抑えるために日本銀行が行った金融引き締めが、バブル崩壊の一因となりました。「石油危機の発生」は誤りで、これはバブル経済(1980年代後半)よりかなり前の1973年の出来事です。「55年体制の成立」は誤りで、これは1955年でバブル崩壊とは時代が離れすぎています。「農地改革の実施」は誤りで、これは戦後すぐの1940年代の出来事であり、バブル崩壊とは無関係です。"},
  {id:"his625", cat:"日本史", sub:"現代", q:"1993年の非自民連立政権誕生の直接の結果として正しいものはどれか。", choices:["55年体制が終わりを迎えた","日本国憲法が新たに制定された","バブル経済が誕生した","日本が国際連合に加盟した"], a:0, e:"正解は「55年体制が終わりを迎えた」です。1993年、非自民8党派による連立政権が誕生したことで、1955年以来続いた55年体制は終わりを迎えました。「日本国憲法が新たに制定された」は誤りで、日本国憲法はすでに1947年から施行されており、1993年に新たに制定されたものではありません。「バブル経済が誕生した」は誤りで、バブル経済はこれより前の1980年代後半に生じ、すでに崩壊していました。「日本が国際連合に加盟した」は誤りで、これは1956年の出来事です。"},
  /* 世界史 */
  {id:"wor551", cat:"世界史", sub:"古代・中世", q:"次のうち、最も古い出来事はどれか。", choices:["秦による中国統一","西ローマ帝国の滅亡","イスラム教の成立","唐の建国"], a:0, e:"正解は「秦による中国統一」（紀元前221年）です。年代順に並べると、秦の中国統一(前221年)→西ローマ帝国の滅亡(476年)→イスラム教の成立(610年頃)→唐の建国(618年)となります。「西ローマ帝国の滅亡」は誤りで、秦の統一よりおよそ700年後です。「イスラム教の成立」は誤りで、さらに後の7世紀初めです。「唐の建国」は誤りで、この4つの中では最も新しい出来事です。"},
  {id:"wor553", cat:"世界史", sub:"古代・中世", q:"次のうち、最も新しい出来事はどれか。", choices:["マグナカルタの制定","ノルマン・コンクエスト","十字軍遠征の開始","唐の建国"], a:0, e:"正解は「マグナカルタの制定」（1215年）です。年代順に並べると、唐の建国(618年)→ノルマン・コンクエスト(1066年)→十字軍遠征の開始(1096年)→マグナカルタの制定(1215年)となります。「ノルマン・コンクエスト」は誤りで、マグナカルタより149年前です。「十字軍遠征の開始」は誤りで、マグナカルタより119年前です。「唐の建国」は誤りで、この4つの中では最も古い出来事です。"},
  {id:"wor555", cat:"世界史", sub:"ヨーロッパ史", q:"コンスタンティノープル陥落(1453年)の直接の結果として正しいものはどれか。", choices:["ビザンツ帝国(東ローマ帝国)が滅亡した","西ローマ帝国が滅亡した","十字軍遠征が始まった","ルネサンスが完全に終わった"], a:0, e:"正解は「ビザンツ帝国(東ローマ帝国)が滅亡した」です。1453年、オスマン帝国がコンスタンティノープルを陥落させたことで、約1000年続いたビザンツ帝国は滅亡しました。「西ローマ帝国が滅亡した」は誤りで、西ローマ帝国はこれよりずっと前の476年にすでに滅亡しています。「十字軍遠征が始まった」は誤りで、十字軍はこれよりはるかに前の1096年に始まっています。「ルネサンスが完全に終わった」は誤りで、この出来事はむしろビザンツの学者が西欧に流入しルネサンスを刺激した一因ともされています。"},
  {id:"wor557", cat:"世界史", sub:"ヨーロッパ史", q:"次のうち、コロンブスの新大陸到達(1492年)より後に起こった出来事はどれか。", choices:["ルターの宗教改革開始","コンスタンティノープル陥落","マグナカルタの制定","十字軍遠征の開始"], a:0, e:"正解は「ルターの宗教改革開始」（1517年）です。これはコロンブスの新大陸到達の25年後の出来事です。「コンスタンティノープル陥落」は誤りで、これは1453年でコロンブスの到達より前です。「マグナカルタの制定」は誤りで、これは1215年でさらに前です。「十字軍遠征の開始」は誤りで、これは1096年でこの4つの中では最も古い出来事です。"},
  {id:"wor559", cat:"世界史", sub:"ヨーロッパ史", q:"マゼラン艦隊による世界周航の達成が示した直接の結果として正しいものはどれか。", choices:["地球が球体であることが実証された","新大陸の存在が初めて発見された","ルネサンスが始まった","宗教改革が終結した"], a:0, e:"正解は「地球が球体であることが実証された」です。マゼラン艦隊による世界周航(1519〜1522年)の成功は、実際の航海によって地球が球体であることを証明しました。「新大陸の存在が初めて発見された」は誤りで、これはマゼランより27年前、コロンブスによる到達(1492年)がきっかけです。「ルネサンスが始まった」は誤りで、ルネサンスはこれよりはるかに前の14世紀に始まっています。「宗教改革が終結した」は誤りで、宗教改革はマゼランの航海の頃(1517年〜)にむしろ始まったばかりでした。"},
  {id:"wor561", cat:"世界史", sub:"ヨーロッパ史", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["名誉革命→権利章典制定→アメリカ独立宣言→フランス革命","権利章典制定→名誉革命→フランス革命→アメリカ独立宣言","アメリカ独立宣言→フランス革命→名誉革命→権利章典制定","フランス革命→アメリカ独立宣言→権利章典制定→名誉革命"], a:0, e:"正解は「名誉革命→権利章典制定→アメリカ独立宣言→フランス革命」です。名誉革命(1688年)→権利章典制定(1689年)→アメリカ独立宣言(1776年)→フランス革命(1789年)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"wor563", cat:"世界史", sub:"ヨーロッパ史", q:"名誉革命の直接の結果として正しいものはどれか。", choices:["議会の権限を明確にした権利章典が制定された","国王が処刑される事態となった","フランス革命が新たに起こった","絶対王政がさらに強化された"], a:0, e:"正解は「議会の権限を明確にした権利章典が制定された」です。名誉革命の翌年である1689年、議会は国王に権利章典を認めさせ、議会の権限を明確にしました。「国王が処刑された」は誤りで、これは名誉革命ではなく、その前のピューリタン革命(1649年)における出来事です。「フランス革命が起こった」は誤りで、これは名誉革命の101年後の1789年の出来事であり、直接の結果とはいえません。「絶対王政がさらに強化された」は誤りで、名誉革命はむしろ絶対王政を制限する方向に働きました。"},
  {id:"wor565", cat:"世界史", sub:"ヨーロッパ史", q:"アメリカ独立戦争の直接の結果として正しいものはどれか。", choices:["アメリカ合衆国が独立を達成した","イギリスがアメリカを完全に支配した","フランス革命が終結した","アメリカが再びイギリスの植民地に戻った"], a:0, e:"正解は「アメリカ合衆国が独立を達成した」です。1775年に始まったアメリカ独立戦争は1783年のパリ条約でアメリカの独立が承認され終結しました。「イギリスがアメリカを完全に支配した」は誤りで、事実とは正反対です。「フランス革命が終結した」は誤りで、フランス革命はこの戦争の後(1789年〜)に始まったものであり、時系列が合いません。「アメリカが再びイギリスの植民地に戻った」は誤りで、独立戦争の結果アメリカは独立国となりました。"},
  {id:"wor567", cat:"世界史", sub:"ヨーロッパ史", q:"次のうち、フランス革命開始(1789年)より前に起こった出来事はどれか。", choices:["アメリカ合衆国憲法の制定","ナポレオンの皇帝即位","ウィーン会議","七月革命"], a:0, e:"正解は「アメリカ合衆国憲法の制定」（1787年）です。これはフランス革命開始の2年前の出来事です。「ナポレオンの皇帝即位」は誤りで、これは1804年でフランス革命より後です。「ウィーン会議」は誤りで、これは1814〜15年でさらに後です。「七月革命」は誤りで、これは1830年でこの4つの中では最も新しい出来事です。"},
  {id:"wor569", cat:"世界史", sub:"ヨーロッパ史", q:"ウィーン会議が開かれた直接のきっかけとして正しいものはどれか。", choices:["ナポレオン戦争が終結したこと","フランス革命が始まったこと","第一次世界大戦が終結したこと","ドイツが統一されたこと"], a:0, e:"正解は「ナポレオン戦争が終結したこと」です。ナポレオン戦争終結後の混乱したヨーロッパの秩序を再編するため、1814〜15年にウィーン会議が開かれました。「フランス革命が始まったこと」は誤りで、これはウィーン会議より25年前の出来事であり、遠因ではあっても直接のきっかけではありません。「第一次世界大戦が終結したこと」は誤りで、これは1918年でウィーン会議よりずっと後の出来事です。「ドイツが統一されたこと」は誤りで、これも1871年でウィーン会議より後です。"},
  {id:"wor571", cat:"世界史", sub:"アジア史", q:"アヘン戦争の直接の結果として正しいものはどれか。", choices:["清がイギリスに敗れ不平等条約を結ばされた","清がイギリスに勝利し領土を拡大した","日清戦争が新たに始まった","清という王朝が滅亡した"], a:0, e:"正解は「清がイギリスに敗れ不平等条約を結ばされた」です。アヘン戦争(1840〜42年)で清はイギリスに敗れ、南京条約という不平等条約を結ばされました。「清がイギリスに勝利し領土を拡大した」は誤りで、事実とは正反対です。「日清戦争が始まった」は誤りで、これはアヘン戦争の54年後、1894年の別の戦争です。「清が滅亡した」は誤りで、清が滅亡したのはアヘン戦争の69年後、1912年の辛亥革命によるものです。"},
  {id:"wor573", cat:"世界史", sub:"ヨーロッパ史", q:"次のうち、南北戦争開始(1861年)より前に起こった出来事はどれか。", choices:["インド大反乱","ドイツ帝国の成立","米西戦争","義和団事件"], a:0, e:"正解は「インド大反乱」（1857年）です。これは南北戦争開始の4年前の出来事です。「ドイツ帝国の成立」は誤りで、これは1871年で南北戦争より後です。「米西戦争」は誤りで、これは1898年でさらに後です。「義和団事件」は誤りで、これは1899〜1901年でこの4つの中では最も新しい出来事です。"},
  {id:"wor575", cat:"世界史", sub:"ヨーロッパ史", q:"南北戦争中に発表された奴隷解放宣言の直接の目的として正しいものはどれか。", choices:["南部の奴隷制を打撃し北部を優位にすること","南部を独立させること","フランスとの同盟を結ぶこと","イギリスとの貿易を拡大すること"], a:0, e:"正解は「南部の奴隷制を打撃し北部を優位にすること」です。リンカン大統領は1863年、南部の奴隷制を実質的に打撃し、戦争を北部優位に進めるため奴隷解放宣言を発表しました。「南部を独立させること」は誤りで、北部はむしろ南部の独立を認めず、国家統一を維持しようとしていました。「フランスとの同盟を結ぶこと」は誤りで、これは奴隷解放宣言の直接の目的ではありません。「イギリスとの貿易を拡大すること」も同様に、この宣言の直接の目的とは異なります。"},
  {id:"wor577", cat:"世界史", sub:"両大戦期", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["サラエボ事件→ロシア革命(十月革命)→第一次世界大戦終結→ヴェルサイユ条約","ロシア革命→サラエボ事件→ヴェルサイユ条約→第一次世界大戦終結","第一次世界大戦終結→ヴェルサイユ条約→サラエボ事件→ロシア革命","ヴェルサイユ条約→第一次世界大戦終結→ロシア革命→サラエボ事件"], a:0, e:"正解は「サラエボ事件→ロシア革命(十月革命)→第一次世界大戦終結→ヴェルサイユ条約」です。サラエボ事件(1914年6月)→ロシア十月革命(1917年10月)→第一次世界大戦終結(1918年11月)→ヴェルサイユ条約(1919年6月)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"wor579", cat:"世界史", sub:"両大戦期", q:"サラエボ事件が起こった直接の結果として正しいものはどれか。", choices:["第一次世界大戦が始まった","ロシア革命が起こった","第二次世界大戦が始まった","ドイツが統一された"], a:0, e:"正解は「第一次世界大戦が始まった」です。1914年6月に起こったサラエボ事件(オーストリア皇太子夫妻の暗殺)が直接のきっかけとなり、同年、第一次世界大戦が始まりました。「ロシア革命が起こった」は誤りで、これはサラエボ事件の3年後の出来事であり、大戦中の別の展開です。「第二次世界大戦が始まった」は誤りで、これは1939年でサラエボ事件から25年後の全く別の出来事です。「ドイツが統一された」は誤りで、これは1871年でサラエボ事件よりずっと前の出来事です。"},
  {id:"wor581", cat:"世界史", sub:"両大戦期", q:"ヴェルサイユ条約でドイツに課された過酷な賠償の直接の結果として指摘されることは何か。", choices:["ドイツ国内の経済的混乱と国民の不満が高まった","ドイツ経済がただちに安定した","国際連盟がドイツを支持した","ドイツがすぐに軍備を拡大した"], a:0, e:"正解は「ドイツ国内の経済的混乱と国民の不満が高まった」です。多額の賠償金などヴェルサイユ条約でドイツに課された過酷な条件は、経済的混乱と国民の不満を招き、後のナチス台頭の一因となりました。「ドイツ経済がただちに安定した」は誤りで、事実とは正反対です。「国際連盟がドイツを支持した」は誤りで、ヴェルサイユ体制のもとで成立した国際連盟がドイツを支持する立場にはありませんでした。「ドイツがすぐに軍備を拡大した」は誤りで、ヴェルサイユ条約はむしろドイツの軍備を制限する内容でした。"},
  {id:"wor583", cat:"世界史", sub:"現代", q:"次のうち、世界恐慌開始(1929年)より前に起こった出来事はどれか。", choices:["国際連盟の設立","ヒトラーの首相就任","満州事変","スペイン内戦"], a:0, e:"正解は「国際連盟の設立」（1920年）です。これは世界恐慌開始の9年前の出来事です。「ヒトラーの首相就任」は誤りで、これは1933年で世界恐慌より後です。「満州事変」は誤りで、これは1931年でさらに後です。「スペイン内戦」は誤りで、これは1936年でこの4つの中では最も新しい出来事です。"},
  {id:"wor585", cat:"世界史", sub:"現代", q:"世界恐慌が世界的な政治体制の変化にもたらした直接の影響として正しいものはどれか。", choices:["各国で軍国主義・全体主義が台頭する一因となったこと","各国で民主主義がただちに定着したということ","冷戦がこの時期に終結したということ","EUがこの時期に発足したということ"], a:0, e:"正解は「各国で軍国主義・全体主義が台頭する一因となった」です。世界恐慌による深刻な不況は、ドイツや日本などで軍国主義・全体主義体制が台頭する背景の一つとなりました。「各国で民主主義がただちに定着した」は誤りで、事実とは正反対の傾向がむしろ見られました。「冷戦が終結した」は誤りで、冷戦自体まだ始まっておらず、終結は1989年前後の出来事です。「EUが発足した」は誤りで、これは1993年で世界恐慌よりはるかに後の出来事です。"},
  {id:"wor587", cat:"世界史", sub:"両大戦期", q:"独ソ不可侵条約(1939年8月)の直接の結果として正しいものはどれか。", choices:["ドイツがポーランドへの侵攻に踏み切った","ドイツとソ連が永続的な同盟を築いた","第一次世界大戦が終結した","ソ連が国際連盟に復帰した"], a:0, e:"正解は「ドイツがポーランドへの侵攻に踏み切った」です。独ソ不可侵条約によって東側からの脅威を取り除いたドイツは、同年9月にポーランドへの侵攻に踏み切り、第二次世界大戦が始まりました。「ドイツとソ連が永続的な同盟を築いた」は誤りで、この条約は1941年にドイツがソ連に侵攻したことで実際には破棄されました。「第一次世界大戦が終結した」は誤りで、これは1918年でこの条約よりはるかに前の出来事です。「ソ連が国際連盟に復帰した」は誤りで、この条約とは無関係な内容です。"},
  {id:"wor589", cat:"世界史", sub:"両大戦期", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["真珠湾攻撃→ノルマンディー上陸作戦→ドイツ降伏→国際連合設立","ノルマンディー上陸作戦→真珠湾攻撃→国際連合設立→ドイツ降伏","ドイツ降伏→国際連合設立→真珠湾攻撃→ノルマンディー上陸作戦","国際連合設立→ドイツ降伏→ノルマンディー上陸作戦→真珠湾攻撃"], a:0, e:"正解は「真珠湾攻撃→ノルマンディー上陸作戦→ドイツ降伏→国際連合設立」です。真珠湾攻撃(1941年12月)→ノルマンディー上陸作戦(1944年6月)→ドイツ降伏(1945年5月)→国際連合設立(1945年10月)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"wor591", cat:"世界史", sub:"現代", q:"第二次世界大戦後、国際連合が設立された直接の目的として正しいものはどれか。", choices:["戦争の再発を防ぎ国際平和を維持すること","冷戦を激化させること","一部の国の利益のみを優先すること","植民地支配を拡大すること"], a:0, e:"正解は「戦争の再発を防ぎ国際平和を維持すること」です。二度の世界大戦の反省から、国際紛争を平和的に解決し戦争の再発を防ぐことを目的として国際連合が設立されました。「冷戦を激化させること」は誤りで、国際連合はむしろ国際協調を目的とした組織であり、冷戦激化を目的としたものではありません。「一部の国の利益のみを優先すること」は誤りで、国際連合はすべての加盟国の平和と協力を目的としています。「植民地支配を拡大すること」は誤りで、国際連合はむしろ植民地の独立を支援する役割も果たしました。"},
  {id:"wor593", cat:"世界史", sub:"現代", q:"次のうち、朝鮮戦争開始(1950年)より前に起こった出来事はどれか。", choices:["中華人民共和国の成立","朝鮮戦争の休戦","バンドン会議","スプートニクの打ち上げ"], a:0, e:"正解は「中華人民共和国の成立」（1949年）です。これは朝鮮戦争開始の1年前の出来事です。「朝鮮戦争の休戦」は誤りで、これは1953年で朝鮮戦争開始より後（開始と同じ戦争の終結時点）です。「バンドン会議」は誤りで、これは1955年でさらに後です。「スプートニクの打ち上げ」は誤りで、これは1957年でこの4つの中では最も新しい出来事です。"},
  {id:"wor595", cat:"世界史", sub:"現代", q:"朝鮮戦争が休戦にとどまり、正式な講和条約が結ばれなかった直接の結果として正しいものはどれか。", choices:["南北朝鮮の分断状態が現在まで固定化された","朝鮮半島がただちに統一された","日本と韓国の国交が断絶した","中国が朝鮮半島を統治することになった"], a:0, e:"正解は「南北朝鮮の分断状態が現在まで固定化された」です。朝鮮戦争は正式な講和条約ではなく休戦協定で戦闘が止まったため、南北分断の状態が現在まで固定化されています。「朝鮮半島がただちに統一された」は誤りで、事実とは正反対です。「日本と韓国の国交が断絶した」は誤りで、日韓の国交は1965年の日韓基本条約でむしろ正常化に向かいました。「中国が朝鮮半島を統治することになった」は誤りで、そのような事実はありません。"},
  {id:"wor597", cat:"世界史", sub:"現代", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["キューバ革命→ベルリンの壁建設→キューバ危機→ベトナム戦争(北爆開始)","ベルリンの壁建設→キューバ革命→ベトナム戦争(北爆開始)→キューバ危機","キューバ危機→ベトナム戦争(北爆開始)→キューバ革命→ベルリンの壁建設","ベトナム戦争(北爆開始)→キューバ危機→ベルリンの壁建設→キューバ革命"], a:0, e:"正解は「キューバ革命→ベルリンの壁建設→キューバ危機→ベトナム戦争(北爆開始)」です。キューバ革命(1959年)→ベルリンの壁建設(1961年)→キューバ危機(1962年)→ベトナム戦争北爆開始(1965年)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"wor601", cat:"世界史", sub:"現代", q:"次のうち、ニクソン訪中(1972年)より前に起こった出来事はどれか。", choices:["文化大革命の開始","第四次中東戦争(石油危機)","ベトナム戦争の終結","イラン革命"], a:0, e:"正解は「文化大革命の開始」（1966年）です。これはニクソン訪中の6年前の出来事です。「第四次中東戦争(石油危機)」は誤りで、これは1973年でニクソン訪中より後です。「ベトナム戦争の終結」は誤りで、これは1975年でさらに後です。「イラン革命」は誤りで、これは1979年でこの4つの中では最も新しい出来事です。"},
  {id:"wor603", cat:"世界史", sub:"現代", q:"第四次中東戦争の直接の結果として正しいものはどれか。", choices:["石油価格が急騰し世界的な石油危機を招いた","冷戦がこの時期に終結した","ベルリンの壁がこの時期に崩壊した","ソ連がこの時期に解体した"], a:0, e:"正解は「石油価格が急騰し世界的な石油危機を招いた」です。1973年の第四次中東戦争を機に産油国が原油価格を引き上げ、世界的な石油危機を招きました。「冷戦が終結した」は誤りで、これは1989年前後の出来事であり、時代が異なります。「ベルリンの壁が崩壊した」は誤りで、これも1989年の出来事です。「ソ連が解体した」は誤りで、これは1991年で第四次中東戦争よりかなり後の出来事です。"},
  {id:"wor605", cat:"世界史", sub:"現代", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["ベルリンの壁崩壊→マルタ会談→東西ドイツ統一→ソ連解体","マルタ会談→ベルリンの壁崩壊→ソ連解体→東西ドイツ統一","東西ドイツ統一→ソ連解体→ベルリンの壁崩壊→マルタ会談","ソ連解体→東西ドイツ統一→マルタ会談→ベルリンの壁崩壊"], a:0, e:"正解は「ベルリンの壁崩壊→マルタ会談→東西ドイツ統一→ソ連解体」です。ベルリンの壁崩壊(1989年11月)→マルタ会談(1989年12月)→東西ドイツ統一(1990年10月)→ソ連解体(1991年12月)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"wor607", cat:"世界史", sub:"現代", q:"ベルリンの壁崩壊が東西ドイツ統一にもたらした直接のつながりとして正しいものはどれか。", choices:["東西の分断が解消され統一への動きが加速した","東西の分断がより一層強化された","ドイツという国が完全に消滅した","冷戦が新たにここから始まった"], a:0, e:"正解は「東西の分断が解消され統一への動きが加速した」です。1989年のベルリンの壁崩壊を経て東西ドイツの分断が事実上解消され、翌1990年の統一へと動きが加速しました。「東西の分断がより一層強化された」は誤りで、事実とは正反対です。「ドイツが完全に消滅した」は誤りで、ドイツはむしろ統一され一つの国家として存続しました。「冷戦が新たに始まった」は誤りで、ベルリンの壁崩壊はむしろ冷戦終結を象徴する出来事です。"},
  {id:"wor611", cat:"世界史", sub:"現代", q:"次のうち、湾岸戦争(1991年)より前に起こった出来事はどれか。", choices:["東西ドイツの統一","ソ連という国家の解体","EUの発足(マーストリヒト条約)","香港の中国への返還"], a:0, e:"正解は「東西ドイツ統一」（1990年）です。これは湾岸戦争(1991年1〜2月)の前年の出来事です。「ソ連解体」は誤りで、これは1991年12月で湾岸戦争より後です。「EU発足(マーストリヒト条約)」は誤りで、これは1993年でさらに後です。「香港返還」は誤りで、これは1997年でこの4つの中では最も新しい出来事です。"},
  {id:"wor615", cat:"世界史", sub:"現代", q:"次のうち、EU発足(1993年、マーストリヒト条約)より後に起こった出来事はどれか。", choices:["香港返還","ベルリンの壁崩壊","湾岸戦争","ソ連解体"], a:0, e:"正解は「香港返還」（1997年）です。これはEU発足の4年後の出来事です。「ベルリンの壁崩壊」は誤りで、これは1989年でEU発足より前です。「湾岸戦争」は誤りで、これは1991年でさらに前です。「ソ連解体」は誤りで、これも1991年でこの4つの中では最も古い出来事です。"},
  {id:"wor617", cat:"世界史", sub:"現代", q:"アメリカ同時多発テロ(2001年)の直接の結果として正しいものはどれか。", choices:["アメリカがアフガニスタン等へ軍事行動を開始したこと","冷戦がこの時期に新たに始まったということ","EUがこの時期に解体したということ","ソ連がこの時期に復活したということ"], a:0, e:"正解は「アメリカがアフガニスタンなどへの軍事行動を開始した」です。2001年の同時多発テロを受け、アメリカはテロ組織を支援していたとされるアフガニスタンなどへの軍事行動を開始しました。「冷戦が新たに始まった」は誤りで、冷戦はこれよりずっと前の1989年前後にすでに終結しています。「EUが解体した」は誤りで、EUはこの後も存続し続けています。「ソ連が復活した」は誤りで、ソ連はすでに1991年に解体しており、この出来事とは無関係です。"},
  {id:"wor619", cat:"世界史", sub:"現代", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["イラン革命→ソ連のアフガニスタン侵攻→ベルリンの壁崩壊→ソ連解体","ソ連のアフガニスタン侵攻→イラン革命→ソ連解体→ベルリンの壁崩壊","ベルリンの壁崩壊→ソ連解体→イラン革命→ソ連のアフガニスタン侵攻","ソ連解体→ベルリンの壁崩壊→ソ連のアフガニスタン侵攻→イラン革命"], a:0, e:"正解は「イラン革命→ソ連のアフガニスタン侵攻→ベルリンの壁崩壊→ソ連解体」です。イラン革命(1979年2月)→ソ連のアフガニスタン侵攻(1979年12月)→ベルリンの壁崩壊(1989年)→ソ連解体(1991年)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  /* 地理 */
  {id:"geo549", cat:"地理", sub:"世界地理", q:"人口転換の一般的な段階を古い順に並べたとき、正しいものはどれか。", choices:["多産多死→多産少死→少産少死","少産少死→多産少死→多産多死","多産少死→多産多死→少産少死","少産多死→多産多死→多産少死"], a:0, e:"正解は「多産多死→多産少死→少産少死」です。一般に社会が発展するにつれ、まず医療の発達で死亡率が下がり(多産少死)、その後出生率も下がって安定します(少産少死)。他の選択肢はこの一般的な人口転換のパターンとは順序が異なります。"},
  {id:"geo551", cat:"地理", sub:"世界地理", q:"死亡率の低下が出生率の低下より先に起こることの直接の結果として正しいものはどれか。", choices:["一時的に人口が急増する人口爆発が起こる","人口がただちに減少し始めることになる","出生率と死亡率が同時に変化しなくなる","移民の動きが完全に停止することになる"], a:0, e:"正解は「一時的に人口が急増する「人口爆発」が起こる」です。医療の普及で死亡率が先に低下する一方、出生率が高いまま推移すると、その差の分だけ人口が急激に増加する人口爆発が起こります。「人口がただちに減少し始める」は誤りで、この段階ではむしろ人口は増加します。「出生率と死亡率が同時に変化しなくなる」は誤りで、両者は変化し続けており、変化しなくなるわけではありません。「移民が完全に停止する」は誤りで、人口爆発と移民の停止は直接関係しません。"},
  {id:"geo553", cat:"地理", sub:"世界地理", q:"次の環境に関する国際的な取り決めを古い順に並べたとき、正しいものはどれか。", choices:["モントリオール議定書→京都議定書→パリ協定","京都議定書→モントリオール議定書→パリ協定","パリ協定→京都議定書→モントリオール議定書","京都議定書→パリ協定→モントリオール議定書"], a:0, e:"正解は「モントリオール議定書→京都議定書→パリ協定」です。オゾン層保護のモントリオール議定書(1987年)→地球温暖化対策の京都議定書(1997年)→パリ協定(2015年)の順に採択されました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"geo555", cat:"地理", sub:"日本地理", q:"高度経済成長にともなう工業化が公害問題の深刻化に与えた因果関係として正しいものはどれか。", choices:["経済成長が優先され環境対策が後回しにされた","公害対策が先に進み経済成長が後から起こった","公害問題と経済成長には全く関係がない","環境対策が経済成長を直接引き起こした"], a:0, e:"正解は「経済成長が優先され環境対策が後回しにされた」です。高度経済成長期には急速な工業化が優先され、環境対策が後回しにされたことで各地で公害問題が深刻化しました。「公害対策が先に進み経済成長が後から起こった」は誤りで、実際の順序はこれとは逆です。「公害問題と経済成長には全く関係がない」は誤りで、両者には明確な因果関係があります。「環境対策が経済成長を直接引き起こした」は誤りで、これは因果関係の向きが逆になっています。"},
  {id:"geo559", cat:"地理", sub:"世界地理", q:"自動車の普及(モータリゼーション)が都市の拡大に与えた因果関係として正しいものはどれか。", choices:["自動車の普及により郊外への移動が容易になり都市が拡大した","自動車の普及により都市部への人口集中がさらに進んだ","自動車の普及は都市の拡大とは無関係である","自動車の普及により公共交通機関の利用が増加した"], a:0, e:"正解は「自動車の普及により郊外への移動が容易になり都市が拡大した」です。自動車の普及により長距離の移動が容易になったことで、都市が郊外へと拡大していく現象(スプロール化)が進みました。「自動車の普及により都市部への人口集中がさらに進んだ」は誤りで、実際にはむしろ郊外への分散が進む傾向にあります。「自動車の普及は都市の拡大とは無関係である」は誤りで、両者には明確な因果関係があります。「自動車の普及により公共交通機関の利用が増加した」は誤りで、一般に自動車の普及は公共交通機関の利用を減少させる方向に働きます。"},
  {id:"geo563", cat:"地理", sub:"世界地理", q:"産業構造が発展するにつれて一般的にたどるとされる変化の順序として正しいものはどれか。", choices:["第一次産業中心→第二次産業中心→第三次産業中心","第三次産業中心→第二次産業中心→第一次産業中心","第二次産業中心→第一次産業中心→第三次産業中心","第一次産業と第三次産業が同時に発展する"], a:0, e:"正解は「第一次産業中心→第二次産業中心→第三次産業中心」です。経済発展にともない、農業などの第一次産業から工業の第二次産業、そしてサービス業などの第三次産業へと産業の中心が移っていく傾向が一般に見られます(ペティ・クラークの法則)。他の選択肢はこの一般的な発展の順序とは異なります。"},
  {id:"geo565", cat:"地理", sub:"世界地理", q:"エネルギー資源の主流が歴史的にどのように変遷してきたかについて正しい順序はどれか。", choices:["石炭中心→石油中心→再生可能エネルギー重視","石油中心→石炭中心→再生可能エネルギー重視","再生可能エネルギー重視→石炭中心→石油中心","省エネ多様化→石炭中心→石油中心という順序"], a:0, e:"正解は「石炭中心→石油中心→省エネ・多様化(再生可能エネルギー重視)」です。産業革命期は石炭が、20世紀には石油がエネルギーの主流となり、石油危機以降は省エネルギー化や再生可能エネルギーの重視が進んできました。他の選択肢はこの歴史的な変遷の順序とは異なります。"},
  {id:"geo567", cat:"地理", sub:"世界地理", q:"石油危機が世界のエネルギー政策に与えた直接の結果として正しいものはどれか。", choices:["省エネルギー技術の開発とエネルギー源の多様化","石油への依存がさらに強まったこと","再生可能エネルギーの開発がすべて中止された","エネルギー消費量が急激に増加したこと"], a:0, e:"正解は「省エネルギー技術の開発とエネルギー源の多様化が進んだ」です。石油危機(1973年)による原油価格の急騰を受け、多くの国で省エネルギー技術の開発やエネルギー源の多様化が進められました。「石油への依存がさらに強まった」は誤りで、事実とは正反対です。「再生可能エネルギーの開発がすべて中止された」は誤りで、むしろ石油危機は代替エネルギーへの関心を高めるきっかけとなりました。「エネルギー消費量が急激に増加した」は誤りで、省エネルギー化により消費の抑制が図られました。"},
  {id:"geo573", cat:"地理", sub:"日本地理", q:"高度経済成長期の工業化の進展が日本の食料自給率に与えた影響として正しいものはどれか。", choices:["工業化の進展とともに食料自給率は低下傾向をたどった","工業化とともに食料自給率は上昇し続けた","食料自給率は工業化とは無関係に一定であった","食料自給率はこの時期に完全に100%となった"], a:0, e:"正解は「工業化の進展とともに食料自給率は低下傾向をたどった」です。高度経済成長期以降、工業化が進む一方で農業の比重が相対的に低下し、食料の多くを輸入に頼るようになったことで、食料自給率は低下傾向をたどりました。「工業化とともに食料自給率は上昇し続けた」は誤りで、事実とは正反対です。「食料自給率は工業化とは無関係に一定であった」は誤りで、実際には工業化の進展とともに大きく変化しました。「食料自給率はこの時期に完全に100%となった」は誤りで、日本の食料自給率はむしろ低下し、100%には遠く及びません。"},
  /* 公民 */
  {id:"civ551", cat:"公民", sub:"政治体制", q:"次の出来事を古い順に並べたとき、正しいものはどれか。", choices:["大日本帝国憲法発布→普通選挙法制定→日本国憲法施行→55年体制成立","普通選挙法制定→大日本帝国憲法発布→55年体制成立→日本国憲法施行","日本国憲法施行→55年体制成立→大日本帝国憲法発布→普通選挙法制定","55年体制成立→日本国憲法施行→普通選挙法制定→大日本帝国憲法発布"], a:0, e:"正解は「大日本帝国憲法発布→普通選挙法制定→日本国憲法施行→55年体制成立」です。大日本帝国憲法発布(1889年)→普通選挙法制定(1925年)→日本国憲法施行(1947年)→55年体制成立(1955年)の順に起こりました。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"civ553", cat:"公民", sub:"経済", q:"中央銀行が金利を引き下げた場合の直接の結果として正しいものはどれか。", choices:["企業の資金調達コストが下がり投資が促進されやすくなる","企業の資金調達コストが上がり投資が抑制される","物価がこの結果ただちに下落するということ","為替レートがこの結果即座に固定されるということ"], a:0, e:"正解は「企業の資金調達コストが下がり投資が促進されやすくなる」です。金利が引き下げられると、企業は資金を借りやすくなり、設備投資などが促進されやすくなります。「企業の資金調達コストが上がり投資が抑制される」は誤りで、これは金利を引き上げた場合の効果であり内容が逆です。「物価がただちに下落する」は誤りで、金融緩和はむしろ物価を押し上げる方向に働くことが多く、下落とは逆の効果が期待されます。「為替レートが即座に固定される」は誤りで、金利政策と為替レートの固定化は直接結びつく事柄ではありません。"},
  {id:"civ555", cat:"公民", sub:"経済", q:"需要が供給を上回っている状態が続いた場合の市場における直接の結果として正しいものはどれか。", choices:["価格が上昇する傾向が生じる","価格が下落する傾向が生じる","供給者がただちに市場から撤退する","消費者の数が急激に減少する"], a:0, e:"正解は「価格が上昇する傾向が生じる」です。需要が供給を上回ると品不足の状態になり、市場メカニズムを通じて価格は上昇する傾向が生じます。「価格が下落する傾向が生じる」は誤りで、これは供給が需要を上回る場合の変化であり内容が逆です。「供給者がただちに市場から撤退する」は誤りで、需要が旺盛な状況はむしろ供給者にとって有利な状況であり、撤退とは結びつきません。「消費者の数が急激に減少する」は誤りで、需要と供給の関係の変化が消費者数の急減を直接もたらすわけではありません。"},
  {id:"civ557", cat:"公民", sub:"経済", q:"少子高齢化が進んだ直接の結果として、社会保障制度にどのような変化が生じやすいか。", choices:["現役世代一人当たりの負担が増加しやすくなる","現役世代の負担が自動的に軽くなる","高齢者への給付がすべて廃止される","社会保障制度自体が不要になる"], a:0, e:"正解は「現役世代一人当たりの負担が増加しやすくなる」です。少子高齢化が進むと、年金や医療を支える現役世代の人数が減る一方で支えられる高齢者が増えるため、現役世代一人当たりの負担が増加しやすくなります。「現役世代の負担が自動的に軽くなる」は誤りで、事実とは正反対です。「高齢者への給付がすべて廃止される」は誤りで、少子高齢化への対応として給付の見直しは議論されますが、全廃が直接の結果というわけではありません。「社会保障制度自体が不要になる」は誤りで、高齢化が進むほどむしろ社会保障の必要性は高まります。"},
  {id:"civ559", cat:"公民", sub:"国際関係", q:"次のうち、国際連合設立(1945年)より前に起こった出来事はどれか。", choices:["国際連盟の設立","世界人権宣言の採択","日本の国際連合加盟","EUの発足"], a:0, e:"正解は「国際連盟の設立」（1920年）です。これは国際連合設立の25年前の出来事です。「世界人権宣言の採択」は誤りで、これは1948年で国際連合設立より後です。「日本の国際連合加盟」は誤りで、これは1956年でさらに後です。「EUの発足」は誤りで、これは1993年でこの4つの中では最も新しい出来事です。"},
  {id:"civ563", cat:"公民", sub:"経済", q:"円高が進んだ直接の結果として、輸入品の価格にはどのような変化が生じやすいか。", choices:["輸入品の価格が下がりやすくなる","輸入品の価格が上がりやすくなる","輸入品の価格には全く変化が生じない","輸入そのものが禁止される"], a:0, e:"正解は「輸入品の価格が下がりやすくなる」です。円高になると少ない円でより多くの外貨を得られるため、外国製品を円建てで見た際の価格が下がりやすくなります。「輸入品の価格が上がりやすくなる」は誤りで、これは円安の場合の効果であり内容が逆です。「輸入品の価格には全く変化が生じない」は誤りで、為替レートの変動は輸入品価格に直接影響を与えます。「輸入そのものが禁止される」は誤りで、円高・円安は為替レートの変動であり、輸入の可否とは無関係です。"},
  {id:"civ565", cat:"公民", sub:"政治体制", q:"衆議院解散から特別国会召集までの一般的な流れとして正しいものはどれか。", choices:["解散→総選挙→特別国会召集→内閣総理大臣指名","総選挙→解散→内閣総理大臣指名→特別国会召集","特別国会召集→解散→総選挙→内閣総理大臣指名","内閣総理大臣指名→解散→総選挙→特別国会召集"], a:0, e:"正解は「解散→総選挙→特別国会召集→内閣総理大臣指名」です。衆議院が解散されると、その後総選挙が行われ、選挙後30日以内に特別国会が召集され、そこで内閣総理大臣の指名が行われます。他の選択肢はいずれもこの順序が誤っています。"},
  {id:"civ569", cat:"公民", sub:"労働・法律", q:"労働基準法が定める最低基準を下回る労働契約を結んだ場合、直接どうなるか。", choices:["その部分は無効となり法律の基準が適用される","契約全体が自動的に無効になる","契約はそのまま有効であり続ける","使用者にのみ有利な内容として扱われる"], a:0, e:"正解は「その部分は無効となり法律の基準が適用される」です。労働基準法は労働条件の最低基準を定めており、これを下回る契約内容の部分は無効となり、法律で定める基準が適用されます。「契約全体が自動的に無効になる」は誤りで、無効となるのは基準を下回る部分のみであり、契約全体が無効になるわけではありません。「契約はそのまま有効であり続ける」は誤りで、最低基準を下回る部分は法律により無効とされます。「使用者にのみ有利な内容として扱われる」は誤りで、労働基準法はむしろ労働者を保護するための法律です。"},
  {id:"civ571", cat:"公民", sub:"政治体制", q:"直接請求権のうち、条例の制定・改廃を求める場合に必要とされる署名数の直接の基準として正しいものはどれか。", choices:["有権者の50分の1以上の署名","有権者の3分の1以上の署名","有権者の過半数の署名","署名は一切不要である"], a:0, e:"正解は「有権者の50分の1以上の署名」です。条例の制定・改廃を求める直接請求には、有権者の50分の1以上の署名を集め首長に提出することが必要です。「有権者の3分の1以上の署名」は誤りで、これは議会の解散請求や首長の解職請求など、より重大な請求に必要とされる、はるかに高いハードルの基準です。「有権者の過半数の署名」は誤りで、これは実際の基準よりもはるかに厳しい要件であり、事実と異なります。「署名は一切不要である」は誤りで、直接請求権の行使には必ず一定数の署名が必要です。"},
  {id:"civ573", cat:"公民", sub:"経済", q:"消費税のように、所得にかかわらず同じ税率が課される税が持つ直接の性質として正しいものはどれか。", choices:["所得の低い人ほど所得に占める税負担割合が高くなりやすい","所得の高い人ほど所得に占める税負担割合が高くなりやすい","すべての人の税負担額が完全に同じになること","税負担は所得と全く関係しないということ"], a:0, e:"正解は「所得の低い人ほど所得に占める税負担の割合が高くなりやすい」です。消費税のような一定税率の税は、所得の低い人ほど所得に占める税負担の割合が相対的に高くなる逆進性を持つとされています。「所得の高い人ほど所得に占める税負担の割合が高くなりやすい」は誤りで、これは累進課税の特徴であり、消費税のような一定税率の税とは性質が逆です。「すべての人の税負担額が完全に同じになる」は誤りで、税率は同じでも支出額に応じて負担額(金額)は異なります。「税負担は所得と全く関係しない」は誤りで、税負担の割合は所得水準と関係します。"},
  {id:"civ575", cat:"公民", sub:"政治体制", q:"三審制のもとで第一審の判決に不服がある場合、直接どのような手続きをとることができるか。", choices:["上級の裁判所に控訴すること","ただちに最高裁判所へ上告すること","判決を無視して従わないこと","国会に判決の見直しを求めること"], a:0, e:"正解は「上級の裁判所に控訴すること」です。第一審の判決に不服がある場合、まず上級の裁判所に控訴し、再度の審理を求めることができます。「ただちに最高裁判所へ上告すること」は誤りで、上告は控訴審の判決に対する不服申し立てであり、第一審から直接行うものではありません。「判決を無視して従わないこと」は誤りで、判決には従う必要があり、不服がある場合は正式な手続き(控訴)によって争うべきものです。「国会に判決の見直しを求めること」は誤りで、司法権は国会とは独立しており、国会が個別の判決を見直す権限は持ちません。"},
  /* 地理 */
  {id:"geo629", cat:"地理", sub:"世界地理", q:"次の雨温図が示す気候として最も適切なものはどれか。図を見て判断すること。", choices:["熱帯雨林気候","地中海性気候","冷帯(亜寒帯)気候","ステップ気候"], a:0, e:"正解は「熱帯雨林気候」です。一年を通して気温が高く(年較差が小さい)、降水量も一年中多いことが特徴です。「地中海性気候」「冷帯(亜寒帯)気候」「ステップ気候」はいずれも誤りで、それぞれ気温の年較差や降水量の季節的な分布のパターンがこの雨温図とは異なります。"},
  {id:"geo631", cat:"地理", sub:"世界地理", q:"次の雨温図が示す気候として最も適切なものはどれか。図を見て判断すること。", choices:["サバナ気候","西岸海洋性気候","ツンドラ気候","温暖湿潤気候"], a:0, e:"正解は「サバナ気候」です。一年中気温が高い点は熱帯雨林気候と似ていますが、雨季と乾季がはっきり分かれている点が特徴です。「西岸海洋性気候」「ツンドラ気候」「温暖湿潤気候」はいずれも誤りで、それぞれ気温の年較差や降水量の季節的な分布のパターンがこの雨温図とは異なります。"},
  {id:"geo633", cat:"地理", sub:"世界地理", q:"次の雨温図が示す気候として最も適切なものはどれか。図を見て判断すること。", choices:["砂漠気候","温暖湿潤気候","熱帯雨林気候","冷帯(亜寒帯)気候"], a:0, e:"正解は「砂漠気候」です。一年を通して降水量が極めて少なく、気温の年較差(夏と冬の差)が大きいことが特徴です。「温暖湿潤気候」「熱帯雨林気候」「冷帯(亜寒帯)気候」はいずれも誤りで、それぞれ気温の年較差や降水量の季節的な分布のパターンがこの雨温図とは異なります。"},
  {id:"geo635", cat:"地理", sub:"世界地理", q:"次の雨温図が示す気候として最も適切なものはどれか。図を見て判断すること。", choices:["地中海性気候","熱帯雨林気候","ステップ気候","ツンドラ気候"], a:0, e:"正解は「地中海性気候」です。夏に降水量が少なく乾燥し、冬に降水量が多くなる点が特徴です。気温は比較的温暖です。「熱帯雨林気候」「ステップ気候」「ツンドラ気候」はいずれも誤りで、それぞれ気温の年較差や降水量の季節的な分布のパターンがこの雨温図とは異なります。"},
  {id:"geo637", cat:"地理", sub:"世界地理", q:"次の雨温図が示す気候として最も適切なものはどれか。図を見て判断すること。", choices:["西岸海洋性気候","サバナ気候","砂漠気候","熱帯雨林気候"], a:0, e:"正解は「西岸海洋性気候」です。一年を通して降水量に大きな偏りがなく、気温も年間を通して比較的温和で年較差が小さいことが特徴です。「サバナ気候」「砂漠気候」「熱帯雨林気候」はいずれも誤りで、それぞれ気温の年較差や降水量の季節的な分布のパターンがこの雨温図とは異なります。"},
  {id:"geo639", cat:"地理", sub:"世界地理", q:"次の雨温図が示す気候として最も適切なものはどれか。図を見て判断すること。", choices:["温暖湿潤気候","砂漠気候","ツンドラ気候","地中海性気候"], a:0, e:"正解は「温暖湿潤気候」です。四季の変化がはっきりしており、夏は高温多雨、冬は低温で降水量がやや少なくなる点が特徴です。「砂漠気候」「ツンドラ気候」「地中海性気候」はいずれも誤りで、それぞれ気温の年較差や降水量の季節的な分布のパターンがこの雨温図とは異なります。"},
  {id:"geo641", cat:"地理", sub:"世界地理", q:"次の雨温図が示す気候として最も適切なものはどれか。図を見て判断すること。", choices:["冷帯(亜寒帯)気候","熱帯雨林気候","西岸海洋性気候","サバナ気候"], a:0, e:"正解は「冷帯(亜寒帯)気候」です。冬の気温が氷点下まで大きく下がる一方、夏は20℃前後まで上がるなど、気温の年較差が非常に大きいことが特徴です。「熱帯雨林気候」「西岸海洋性気候」「サバナ気候」はいずれも誤りで、それぞれ気温の年較差や降水量の季節的な分布のパターンがこの雨温図とは異なります。"},
  {id:"geo643", cat:"地理", sub:"世界地理", q:"次の雨温図が示す気候として最も適切なものはどれか。図を見て判断すること。", choices:["ツンドラ気候","温暖湿潤気候","地中海性気候","サバナ気候"], a:0, e:"正解は「ツンドラ気候」です。一年の大半が氷点下の厳しい寒さで、短い夏の間だけわずかに気温が上がる点が特徴です。降水量も少ないです。「温暖湿潤気候」「地中海性気候」「サバナ気候」はいずれも誤りで、それぞれ気温の年較差や降水量の季節的な分布のパターンがこの雨温図とは異なります。"},
  {id:"geo645", cat:"地理", sub:"世界地理", q:"次の雨温図が示す気候として最も適切なものはどれか。図を見て判断すること。", choices:["ステップ気候","熱帯雨林気候","西岸海洋性気候","ツンドラ気候"], a:0, e:"正解は「ステップ気候」です。砂漠気候ほどではないものの降水量が少なく、気温の年較差も大きい、乾燥帯に属する気候です。「熱帯雨林気候」「西岸海洋性気候」「ツンドラ気候」はいずれも誤りで、それぞれ気温の年較差や降水量の季節的な分布のパターンがこの雨温図とは異なります。"},
  {id:"geo651", cat:"地理", sub:"世界地理", q:"次の人口ピラミッド(模式図)が示す型として最も適切なものはどれか。図の横幅の変化を読み取って判断すること。", choices:["つぼ型(少子高齢型)","富士山型(多産多死型)","つりがね型(人口停滞型)","完全な長方形型"], a:0, e:"正解は「つぼ型(少子高齢型)」です。若年層が少なく中高年層が多い、つぼのようなくびれた形をしており、少子高齢化が進んだ社会に典型的に見られます。「富士山型(多産多死型)」「つりがね型(人口停滞型)」「完全な長方形型」はいずれも誤りで、実際の図形が示す幅の変化のパターン(若年層と高齢層の比率)とは異なります。"},
  /* 公民 */
  {id:"civ629", cat:"公民", sub:"政治体制", q:"次の三権分立の関係図で、国会から内閣に向かう矢印(強調表示)が示す内容として最も適切なものはどれか。", choices:["内閣不信任の決議","違憲審査","裁判官の任命","弾劾裁判所の設置"], a:0, e:"正解は「内閣不信任の決議」です。図で強調されている国会から内閣へ向かう矢印は、国会(衆議院)が内閣に対して不信任を決議できる権限を示しています。「違憲審査」は誤りで、これは裁判所が国会や内閣の行為を審査する権限であり、矢印の向きが異なります。「裁判官の任命」は誤りで、これは内閣が裁判所に対して持つ権限です。「弾劾裁判所の設置」は誤りで、これは国会が裁判所(裁判官)に対して持つ権限であり、内閣に向かうものではありません。"},
  {id:"civ631", cat:"公民", sub:"政治体制", q:"次の三権分立の関係図で、内閣から国会に向かう矢印(強調表示)が示す内容として最も適切なものはどれか。", choices:["衆議院の解散","違憲審査","裁判官の任命","弾劾裁判所の設置"], a:0, e:"正解は「衆議院の解散」です。図で強調されている内閣から国会へ向かう矢印は、内閣が衆議院を解散できる権限を示しています。「違憲審査」は誤りで、これは裁判所が持つ権限であり、内閣から国会への矢印とは異なります。「裁判官の任命」は誤りで、これは内閣から裁判所へ向かう権限です。「弾劾裁判所の設置」は誤りで、これは国会が裁判所に対して持つ権限であり、内閣から国会への矢印とは異なります。"},
  {id:"civ635", cat:"公民", sub:"政治体制", q:"次の三権分立の関係図で、内閣から裁判所に向かう矢印(強調表示)が示す内容として最も適切なものはどれか。", choices:["裁判官の任命","衆議院の解散","弾劾裁判所の設置","内閣不信任の決議"], a:0, e:"正解は「裁判官の任命」です。図で強調されている内閣から裁判所へ向かう矢印は、内閣が最高裁判所長官の指名や、その他の裁判官の任命を行う権限を示しています。「衆議院の解散」は誤りで、これは内閣から国会へ向かう権限です。「弾劾裁判所の設置」は誤りで、これは国会が裁判所に対して持つ権限であり、内閣から裁判所への矢印とは異なります。「内閣不信任の決議」は誤りで、これは国会が内閣に対して持つ権限です。"},
  /* 日本史 */
  {id:"nhis01", cat:"日本史", sub:"古代", q:"縄文時代の人々が食べ物の煮炊きや保存に使った、縄目の文様がついた土器を何というか。", choices:["須恵器","弥生土器","埴輪","縄文土器"], a:3, e:"正解は「縄文土器」です。縄文時代には表面に縄目の文様をつけた厚手の土器がつくられ、煮炊きや貯蔵に使われました。「弥生土器」は誤りで、これは弥生時代につくられた薄手で装飾の少ない土器です。「須恵器」は誤りで、これは古墳時代以降に大陸から伝わった技術でつくられた硬質の土器です。「埴輪」は誤りで、これは古墳の周りに並べられた素焼きの焼き物であり、日常の器ではありません。"},
  {id:"nhis03", cat:"日本史", sub:"古代", q:"弥生時代、倭(日本)にあったとされる邪馬台国を治めていた女王は誰か。", choices:["額田王","持統天皇","卑弥呼","推古天皇"], a:2, e:"正解は「卑弥呼」です。中国の歴史書『魏志』倭人伝によると、卑弥呼は邪馬台国の女王で、まじないによって国を治め、中国(魏)に使いを送ったとされています。「推古天皇」は誤りで、これは飛鳥時代に即位した日本初の女性天皇であり、邪馬台国とは時代が異なります。「持統天皇」は誤りで、これも飛鳥時代の女性天皇で、藤原京の完成に関わった人物です。「額田王」は誤りで、これは飛鳥時代の歌人であり、国を治めた女王ではありません。"},
  {id:"nhis05", cat:"日本史", sub:"古代", q:"聖徳太子が家柄によらず能力や功績によって役人を取り立てるために定めた制度を何というか。", choices:["十七条の憲法","班田収授法","大宝律令","冠位十二階"], a:3, e:"正解は「冠位十二階」です。聖徳太子は603年に冠位十二階を定め、家柄にとらわれず能力や功績に応じて役人を登用しようとしました。「十七条の憲法」は誤りで、これは役人の心構えを示した規範であり、役人の登用制度ではありません。「大宝律令」は誤りで、これは701年に制定された律令であり、聖徳太子の死後のものです。「班田収授法」は誤りで、これは人々に口分田を与える土地制度であり、役人の登用とは関係ありません。"},
  {id:"nhis07", cat:"日本史", sub:"古代", q:"645年、中大兄皇子や中臣鎌足が蘇我氏を倒して始めた政治改革の中心人物、中大兄皇子は後に何天皇として即位したか。", choices:["天武天皇","桓武天皇","天智天皇","聖武天皇"], a:2, e:"正解は「天智天皇」です。中大兄皇子は大化の改新の中心人物として活躍した後、668年に即位して天智天皇となりました。「天武天皇」は誤りで、これは天智天皇の弟で、天智天皇の死後の壬申の乱に勝利して即位した人物です。「桓武天皇」は誤りで、これは平安京に都を移した奈良時代末〜平安時代初期の天皇です。「聖武天皇」は誤りで、これは奈良時代に国分寺・大仏の建立を命じた天皇です。"},
  {id:"nhis09", cat:"日本史", sub:"古代", q:"奈良時代、聖武天皇が仏教の力で国を守ろうとして東大寺に建立を命じたものは何か。", choices:["五重塔","金閣","銀閣","大仏(盧舎那仏)"], a:3, e:"正解は「大仏(盧舎那仏)」です。聖武天皇は仏教の力で国家の安定をはかろうと、都に東大寺を建て、大仏をつくらせました。「五重塔」は誤りで、これは寺院に見られる仏塔の形式の一つで、大仏とは異なります。「金閣」は誤りで、これは室町時代に足利義満が建てた建物です。「銀閣」は誤りで、これは室町時代に足利義政が建てた建物です。"},
  {id:"nhis11", cat:"日本史", sub:"古代", q:"奈良時代、進んだ制度や文化を学ぶために日本から唐(中国)へ派遣された使節を何というか。", choices:["遣隋使","朱印船","勘合貿易船","遣唐使"], a:3, e:"正解は「遣唐使」です。遣唐使は奈良時代を中心に唐へ派遣され、政治制度や仏教、文化などを日本に持ち帰りました。「遣隋使」は誤りで、これは飛鳥時代に隋へ派遣された使節であり、時代が異なります。「勘合貿易船」は誤りで、これは室町時代に明との貿易で使われた船です。「朱印船」は誤りで、これは江戸時代初期に東南アジアなどとの貿易に使われた船です。"},
  {id:"nhis13", cat:"日本史", sub:"平安時代", q:"平安時代、藤原氏が天皇の外戚(母方の親戚)となり、摂政や関白の地位を独占して行った政治を何というか。", choices:["執権政治","院政","摂関政治","公武合体"], a:2, e:"正解は「摂関政治」です。藤原氏は娘を天皇のきさきにして生まれた子を天皇に立て、摂政・関白として政治の実権を握りました。「院政」は誤りで、これは天皇の位を譲った上皇が実権を握る政治で、摂関政治の後に始まりました。「執権政治」は誤りで、これは鎌倉幕府で北条氏が行った政治です。「公武合体」は誤りで、これは江戸時代末期に朝廷(公)と幕府(武)の結びつきを強めようとした動きです。"},
  {id:"nhis15", cat:"日本史", sub:"平安時代", q:"平安時代、『源氏物語』を書いた女性作家は誰か。", choices:["清少納言","額田王","紫式部","小野小町"], a:2, e:"正解は「紫式部」です。紫式部は平安時代中期、かな文字を使って長編物語『源氏物語』を著しました。「清少納言」は誤りで、これは同じ時代に随筆『枕草子』を書いた女性です。「小野小町」は誤りで、これは平安時代前期の歌人です。「額田王」は誤りで、これは飛鳥時代の歌人であり、時代が異なります。"},
  {id:"nhis17", cat:"日本史", sub:"平安時代", q:"894年、菅原道真の提案によって停止された、日本から唐へ派遣されていた使節は何か。", choices:["遣唐使","朝貢使","遣隋使","勘合船"], a:0, e:"正解は「遣唐使」です。894年、菅原道真の提案により、唐の衰えや航海の危険を理由に遣唐使は停止されました。「遣隋使」は誤りで、これは飛鳥時代に隋へ送られた使節であり、菅原道真の時代にはすでに存在していません。「朝貢使」は誤りで、これは一般的な貢ぎ物を持って行く使節の呼び方であり、この設問が指す固有の使節名ではありません。「勘合船」は誤りで、これは室町時代の日明貿易で使われた船です。"},
  {id:"nhis19", cat:"日本史", sub:"鎌倉・室町", q:"鎌倉幕府で、将軍を助けて政治の実権を握った北条氏の役職を何というか。", choices:["太政大臣","管領","執権","関白"], a:2, e:"正解は「執権」です。鎌倉幕府では将軍を補佐する執権の地位に北条氏が就き、実質的に幕府の政治を動かしました。「関白」は誤りで、これは平安時代以来、天皇を補佐する朝廷の役職です。「太政大臣」は誤りで、これは朝廷における最高位の官職です。「管領」は誤りで、これは室町幕府で将軍を補佐した役職です。"},
  {id:"nhis21", cat:"日本史", sub:"鎌倉・室町", q:"1221年、後鳥羽上皇が鎌倉幕府を倒そうとして兵を挙げ、幕府側に敗れた出来事を何というか。", choices:["応仁の乱","保元の乱","壬申の乱","承久の乱"], a:3, e:"正解は「承久の乱」です。1221年、後鳥羽上皇は鎌倉幕府打倒を目指して挙兵しましたが、幕府軍に敗れました。「保元の乱」は誤りで、これは平安時代末期に起こった皇位や摂関家をめぐる争乱です。「応仁の乱」は誤りで、これは室町時代に起こった大規模な戦乱です。「壬申の乱」は誤りで、これは飛鳥時代に起こった皇位継承をめぐる争乱です。"},
  {id:"nhis23", cat:"日本史", sub:"鎌倉・室町", q:"13世紀後半、フビライ・ハンが率いる元軍が2度にわたって日本に攻めてきた出来事を何というか。", choices:["応仁の乱","倭寇","文永・弘安の乱","元寇"], a:3, e:"正解は「元寇」です。元寇は文永の役(1274年)と弘安の役(1281年)の2度にわたる元軍の襲来をまとめて呼ぶ名称です。「文永・弘安の乱」は誤りで、それぞれの襲来は「役」と呼ばれ、「乱」とは呼びません。「倭寇」は誤りで、これは日本の武装商人・海賊が中国や朝鮮沿岸を襲った行為であり、元軍の襲来とは逆の立場です。「応仁の乱」は誤りで、これは室町時代の内乱であり、元寇とは無関係です。"},
