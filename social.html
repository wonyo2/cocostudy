  {id:"civ155", cat:"公民", sub:"経済", q:"なぜ円高になると輸出企業にとって不利になるのか、その理由として正しいものはどれか。", choices:["海外での販売価格が割高になるため","国内の物価が急激に下がるため","輸入品の価格が上昇するため","為替レートが固定されるため"], a:0, e:"正解は「海外での販売価格が割高になるため」です。円高になると、同じ円建ての価格の商品でも外貨に換算した際の価格が上がり、海外での競争力が低下します。「国内の物価が急激に下がるため」は誤りで、円高の影響として輸入品が安くなることはありますが、これは輸出企業への影響とは異なる話です。「輸入品の価格が上昇するため」は誤りで、実際には円高になると輸入品の価格はむしろ下がる傾向にあり、事実と逆です。「為替レートが固定されるため」は誤りで、円高はむしろ為替レートが変動した結果であり、固定されることを意味しません。"},
  {id:"civ157", cat:"公民", sub:"経済", q:"なぜ株式会社では株主総会が開かれるのか、その理由として正しいものはどれか。", choices:["株主が経営方針などを決定するため","従業員の給与を決定するため","商品の価格を決定するため","税金の金額を決定するため"], a:0, e:"正解は「株主が経営方針などを決定するため」です。株式会社の所有者である株主が集まり、経営方針や役員の選任などの重要事項を決定するために株主総会が開かれます。「従業員の給与を決定するため」は誤りで、従業員の給与は通常、経営陣や人事部門が決定するものであり、株主総会の主要な議題ではありません。「商品の価格を決定するため」は誤りで、商品価格の決定は経営判断や市場の需給に関する事柄であり、株主総会で直接決定される事項ではありません。「税金の金額を決定するため」は誤りで、税額は法律や税務当局の規定によって決まるものであり、株主総会で決定されるものではありません。"},
  {id:"civ159", cat:"公民", sub:"経済", q:"なぜ中央銀行は金融政策を通じて景気を調整するのか、その理由として正しいものはどれか。", choices:["物価や景気の安定を図るため","銀行の利益を最大化するため","政府の借金を帳消しにするため","為替レートを固定するため"], a:0, e:"正解は「物価や景気の安定を図るため」です。中央銀行は金利の調整などの金融政策を通じて通貨量をコントロールし、物価や景気の安定を図っています。「銀行の利益を最大化するため」は誤りで、中央銀行の役割は特定の銀行の利益追求ではなく、経済全体の安定を図ることにあります。「政府の借金を帳消しにするため」は誤りで、金融政策は物価や景気の調整を目的としており、政府債務の帳消しを直接の目的とするものではありません。「為替レートを固定するため」は誤りで、日本など多くの国では為替レートは市場に委ねられており、金融政策の主目的は物価の安定です。"},
  {id:"civ161", cat:"公民", sub:"政治体制", q:"なぜ日本国憲法は自由権を保障しているのか、その理由として正しいものはどれか。", choices:["国家権力から個人の自由を守るため","国家の権力を無制限に強めるため","個人の自由をすべて制限するため","地方自治を廃止するため"], a:0, e:"正解は「国家権力から個人の自由を守るため」です。自由権は、国家権力によって個人の思想や行動が不当に制限されることを防ぎ、個人の自由を守るために保障されています。「国家の権力を無制限に強めるため」は誤りで、自由権はむしろ国家権力に一定の歯止めをかける役割を持ち、権力の無制限な強化とは正反対の考え方です。「個人の自由をすべて制限するため」は誤りで、自由権はまさに個人の自由を「保障」するための権利であり、制限するためのものではありません。「地方自治を廃止するため」は誤りで、自由権は個人の権利に関するものであり、地方自治の存廃とは別の制度です。"},
  {id:"civ163", cat:"公民", sub:"政治体制", q:"なぜ平等権は日本国憲法の重要な柱の一つとされているのか、その理由として正しいものはどれか。", choices:["差別のない公正な社会を実現するため","特定の身分を優遇するため","性別による差別を推進するため","経済格差を拡大するため"], a:0, e:"正解は「差別のない公正な社会を実現するため」です。平等権は、性別や身分などによる不当な差別のない、公正な社会を実現するために保障されています。「特定の身分を優遇するため」は誤りで、平等権はむしろ特定の身分による優遇や差別を排除することを目指す権利であり、内容が正反対です。「性別による差別を推進するため」は誤りで、平等権はまさに性別による差別を「禁止」する趣旨の権利であり、差別の推進とは逆の内容です。「経済格差を拡大するため」は誤りで、平等権は不当な差別の是正を目指すものであり、経済格差の拡大を目的としたものではありません。"},
  {id:"civ165", cat:"公民", sub:"政治体制", q:"なぜ近年、プライバシーの権利が新しい人権として重視されているのか、その理由として正しいものはどれか。", choices:["情報化により個人情報保護が必要なため","個人情報を公開する義務があるため","国家が情報を独占するため","情報技術が発展していないため"], a:0, e:"正解は「情報化により個人情報保護が必要なため」です。情報化社会の進展により個人情報が広く扱われるようになったため、それを保護するプライバシーの権利が重視されています。「個人情報を公開する義務があるため」は誤りで、プライバシーの権利はむしろ個人情報を「守る」ことに主眼があり、公開義務とは正反対の考え方です。「国家が情報を独占するため」は誤りで、プライバシーの権利は個人の情報を守るための権利であり、国家による情報独占を正当化するものではありません。「情報技術が発展していないため」は誤りで、実際にはプライバシーの権利が重視される背景はむしろ情報技術の急速な発展にあり、この選択肢は事実と逆です。"},
  {id:"civ167", cat:"公民", sub:"政治体制", q:"なぜ環境権が新しい人権として主張されるようになったのか、その理由として正しいものはどれか。", choices:["開発による環境破壊が深刻化したため","環境問題が完全に解決したため","工業化がまったく進まなかったため","自然災害が発生しなくなったため"], a:0, e:"正解は「開発による環境破壊が深刻化したため」です。高度経済成長期以降、開発にともなう公害や環境破壊が深刻化したことから、良好な環境を求める環境権が主張されるようになりました。「環境問題が完全に解決したため」は誤りで、環境権が主張されるようになった背景はむしろ環境問題が「深刻化」したことであり、解決したこととは正反対です。「工業化がまったく進まなかったため」は誤りで、実際には工業化の進展にともなう公害が環境権主張の背景にあり、工業化が進まなかったという内容は事実と異なります。「自然災害が発生しなくなったため」は誤りで、自然災害の発生の有無は環境権が主張されるようになった直接の理由ではありません。"},
  {id:"civ169", cat:"公民", sub:"政治体制", q:"なぜ知る権利が新しい人権として重要視されているのか、その理由として正しいものはどれか。", choices:["国民が政治に必要な情報を得るため","国家機密をすべて公開するため","個人情報を制限なく集めるため","報道をすべて禁止するため"], a:0, e:"正解は「国民が政治に必要な情報を得るため」です。民主政治を適切に行うためには、国民が政治や行政に関する必要な情報を得られる「知る権利」が重要とされています。「国家機密をすべて公開するため」は誤りで、知る権利は無制限にすべての情報公開を求めるものではなく、国の安全保障などとのバランスも考慮される権利です。「個人情報を制限なく集めるため」は誤りで、これはむしろプライバシーの権利と対立しかねない内容であり、知る権利の趣旨とは異なります。「報道をすべて禁止するため」は誤りで、知る権利はむしろ報道の自由とも関連が深く、報道の禁止とは正反対の方向性です。"},
  {id:"civ171", cat:"公民", sub:"法律", q:"なぜ裁判には民事裁判と刑事裁判の区別があるのか、その理由として正しいものはどれか。", choices:["扱う争いの性質や目的が異なるため","裁判官の人数を増やすため","弁護士の数を制限するため","裁判の期間を統一するため"], a:0, e:"正解は「扱う争いの性質や目的が異なるため」です。個人間の権利義務をめぐる争いを扱う民事裁判と、犯罪に対する刑罰を決める刑事裁判とでは、性質や目的が異なるため区別されています。「裁判官の人数を増やすため」は誤りで、これは裁判の運営に関する事柄であり、民事・刑事という区分の理由とは異なります。「弁護士の数を制限するため」は誤りで、民事・刑事の区別は扱う事件の性質によるものであり、弁護士数の制限とは無関係です。「裁判の期間を統一するため」は誤りで、実際には民事裁判と刑事裁判で審理の進め方や期間は異なることが多く、統一を目的とした区分ではありません。"},
  {id:"civ173", cat:"公民", sub:"法律", q:"なぜ刑事裁判には検察官が関わるのか、その理由として正しいものはどれか。", choices:["被疑者を起訴し立証するため","被告人の弁護を専門に行うため","裁判の判決を直接下すため","被害者への賠償を決定するため"], a:0, e:"正解は「被疑者を起訴し立証するため」です。検察官は犯罪の疑いのある人（被疑者）を起訴し、法廷でその犯罪事実を立証する役割を担っています。「被告人の弁護を専門に行うため」は誤りで、被告人の弁護を行うのは弁護士（弁護人）の役割であり、検察官の役割とは正反対の立場です。「裁判の判決を直接下すため」は誤りで、判決を下すのは裁判官の役割であり、検察官が直接判決を下すことはありません。「被害者への賠償を決定するため」は誤りで、賠償に関する事柄は主に民事裁判で扱われるものであり、検察官の主な役割（刑事責任の追及）とは異なります。"},
  {id:"civ175", cat:"公民", sub:"国際関係", q:"なぜWTO（世界貿易機関）が設立されたのか、その理由として正しいものはどれか。", choices:["自由貿易の促進と貿易紛争の解決のため","各国の関税を引き上げるため","特定の国の貿易を禁止するため","為替レートを固定するため"], a:0, e:"正解は「自由貿易の促進と貿易紛争の解決のため」です。WTOは関税の引き下げなどにより自由貿易を促進し、加盟国間の貿易紛争を解決することを目的として設立されました。「各国の関税を引き上げるため」は誤りで、WTOはむしろ関税の引き下げなど貿易障壁の削減を推進する組織であり、関税引き上げとは正反対の方向性です。「特定の国の貿易を禁止するため」は誤りで、WTOは自由貿易の促進を目的としており、特定国の貿易禁止を目的とした組織ではありません。「為替レートを固定するため」は誤りで、為替レートの管理はWTOではなく国際通貨基金（IMF）などが関わる分野であり、WTOの主な役割とは異なります。"},
  {id:"civ177", cat:"公民", sub:"国際関係", q:"なぜ経済のグローバル化が進むと国内産業が影響を受けるのか、その理由として正しいものはどれか。", choices:["海外との競争が激しくなるため","国内市場が完全に閉鎖されるため","貿易がすべて禁止されるため","為替レートが固定されるため"], a:0, e:"正解は「海外との競争が激しくなるため」です。経済のグローバル化により海外企業との競争が激しくなり、国内産業の立場や雇用に大きな影響が及ぶことがあります。「国内市場が完全に閉鎖されるため」は誤りで、グローバル化はむしろ市場の開放が進む現象であり、市場の閉鎖とは正反対です。「貿易がすべて禁止されるため」は誤りで、グローバル化は貿易の拡大を伴う現象であり、貿易禁止とは逆の方向性です。「為替レートが固定されるため」は誤りで、グローバル化と為替レートの固定は直接結びつく事柄ではありません。"},
  {id:"civ179", cat:"公民", sub:"国際関係", q:"なぜ「フードマイレージ」という考え方が環境問題との関連で注目されているのか、その理由として正しいものはどれか。", choices:["輸送距離が長いほど負荷が増えるため","食料の価格を下げるため","農業生産量を増やすため","輸出量を増加させるため"], a:0, e:"正解は「輸送距離が長いほど負荷が増えるため」です。フードマイレージは食料の輸送距離が長いほど輸送にかかる環境負荷が大きくなるという考え方に基づいています。「食料の価格を下げるため」は誤りで、フードマイレージは価格の問題ではなく、輸送による環境負荷という観点から食料を捉える考え方です。「農業生産量を増やすため」は誤りで、これもフードマイレージの直接の目的ではなく、環境負荷の観点からの指標です。「輸出量を増加させるため」は誤りで、フードマイレージはむしろ輸送距離の短い（地産地消に近い）食料を評価する考え方であり、輸出増加を目的としたものではありません。"},
  {id:"civ181", cat:"公民", sub:"国際関係", q:"なぜ温室効果ガスの排出量取引という仕組みが導入されているのか、その理由として正しいものはどれか。", choices:["削減目標達成を経済的に促すため","排出量を無制限に増やすため","特定の国だけを優遇するため","貿易をすべて禁止するため"], a:0, e:"正解は「削減目標達成を経済的に促すため」です。排出量取引は排出枠を売買可能にすることで、経済的な仕組みを通じて温室効果ガスの削減目標の達成を促す制度です。「排出量を無制限に増やすため」は誤りで、排出量取引はむしろ排出量に上限（枠）を設け、それを取引可能にすることで削減を促す仕組みであり、無制限な増加を認めるものではありません。「特定の国だけを優遇するため」は誤りで、排出量取引は参加する主体間で公平に排出枠を取引する仕組みであり、特定国優遇を目的としたものではありません。「貿易をすべて禁止するため」は誤りで、排出量取引は温室効果ガスの排出枠に関する制度であり、貿易全般を禁止するものではありません。"},
  {id:"civ183", cat:"公民", sub:"経済", q:"なぜ日本では外国人労働者の受け入れが増えているのか、その理由として正しいものはどれか。", choices:["少子高齢化による労働力不足のため","労働力が過剰になっているため","国内の出生率が急上昇したため","海外への移住者が急減したため"], a:0, e:"正解は「少子高齢化による労働力不足のため」です。少子高齢化にともなう国内労働力の不足を補うため、日本では外国人労働者の受け入れが増加しています。「労働力が過剰になっているため」は誤りで、事実とは正反対であり、日本では労働力「不足」が課題となっており、過剰ではありません。「国内の出生率が急上昇したため」は誤りで、実際には出生率は低下傾向にあり、急上昇とは事実が異なります。「海外への移住者が急減したため」は誤りで、これは外国人労働者受け入れ増加の直接の理由とは考えにくく、国内の労働力不足がより本質的な要因です。"},
  {id:"civ185", cat:"公民", sub:"政治体制", q:"なぜ選挙において「一票の格差」が問題視されるのか、その理由として正しいものはどれか。", choices:["選挙区ごとに一票の価値が異なるため","投票率が全国で完全に同じため","候補者の数がすべて同じため","選挙が行われなくなるため"], a:0, e:"正解は「選挙区ごとに一票の価値が異なるため」です。議員一人あたりの有権者数が選挙区によって異なると一票の価値に差が生じ、法の下の平等に反すると指摘されます。「投票率が全国で完全に同じため」は誤りで、実際には投票率は選挙区ごとに異なることが多く、これは一票の格差の直接の原因ではありません。「候補者の数がすべて同じため」は誤りで、候補者数の均一性は一票の格差とは直接関係しない事柄です。「選挙が行われなくなるため」は誤りで、一票の格差問題は選挙が行われていることを前提とした問題であり、選挙が行われなくなることとは無関係です。"},
  {id:"civ187", cat:"公民", sub:"政治体制", q:"なぜ日本国憲法は個人の自己決定権を尊重する立場をとっているとされるのか、その理由として正しいものはどれか。", choices:["個人の生き方や選択を尊重するため","国家がすべてを決定するため","個人の自由を制限するため","多数決だけで物事を決めるため"], a:0, e:"正解は「個人の生き方や選択を尊重するため」です。憲法第13条の個人の尊重の考え方から、自分の生き方や重要な事柄を自分自身で決める自己決定権が尊重されるとされています。「国家がすべてを決定するため」は誤りで、自己決定権はむしろ国家による一方的な決定に対し、個人の判断を尊重する考え方であり、内容が正反対です。「個人の自由を制限するため」は誤りで、自己決定権は個人の自由を尊重するための考え方であり、制限を目的としたものではありません。「多数決だけで物事を決めるため」は誤りで、自己決定権はむしろ多数決だけでは決められない、個人固有の選択を尊重する考え方です。"},
  {id:"civ189", cat:"公民", sub:"経済", q:"なぜ日本銀行は物価の安定を目標に金融政策を行うのか、その理由として正しいものはどれか。", choices:["急激な物価変動は生活を乱すため","物価は高いほど良いとされるため","為替レートを完全に固定するため","銀行の利益を優先するため"], a:0, e:"正解は「急激な物価変動は生活を乱すため」です。急激なインフレやデフレは家計や企業の経済活動を不安定にするため、日本銀行は物価の安定を重要な目標としています。「物価は高いほど良いとされるため」は誤りで、日本銀行が目指すのは「安定」した物価であり、単に物価が高ければ良いという考え方ではありません。「為替レートを完全に固定するため」は誤りで、日本銀行の主な金融政策の目標は物価の安定であり、為替レートの固定を直接の目的とはしていません。「銀行の利益を優先するため」は誤りで、日本銀行の役割は特定の銀行の利益ではなく、経済全体の安定を図ることにあります。"},
  {id:"civ191", cat:"公民", sub:"経済", q:"なぜ税金の集め方には直接税と間接税の両方が用いられているのか、その理由として正しいものはどれか。", choices:["負担の公平性とバランスを図るため","税収をできるだけ減らすため","特定の人だけに課税するため","税金をすべて廃止するため"], a:0, e:"正解は「負担の公平性とバランスを図るため」です。所得に応じて課税される直接税と、消費に応じて広く課税される間接税を組み合わせることで、税負担の公平性とバランスが図られています。「税収をできるだけ減らすため」は誤りで、税の組み合わせの目的は公平性の確保であり、税収を減らすこと自体を目的としたものではありません。「特定の人だけに課税するため」は誤りで、直接税・間接税の組み合わせはむしろ幅広い国民に公平に負担を求めるための工夫です。「税金をすべて廃止するため」は誤りで、これは税制のあり方に関する問いであり、税自体の廃止を目指すものではありません。"},
  {id:"civ193", cat:"公民", sub:"経済", q:"なぜ日本は社会保障制度の財源確保が課題となっているのか、その理由として正しいものはどれか。", choices:["少子高齢化で支える世代が減少するため","社会保障がまったく不要なため","出生率が急激に上昇しているため","労働人口が急増しているため"], a:0, e:"正解は「少子高齢化で支える世代が減少するため」です。少子高齢化が進み、社会保障を支える現役世代の人数が減少しているため、財源の確保が大きな課題となっています。「社会保障がまったく不要なため」は誤りで、実際には高齢化にともない社会保障の必要性はむしろ高まっており、不要とは事実が逆です。「出生率が急激に上昇しているため」は誤りで、少子化の文脈では出生率はむしろ低下傾向にあり、上昇とは事実と異なります。「労働人口が急増しているため」は誤りで、少子高齢化にともない労働人口はむしろ減少傾向にあり、急増とは逆の内容です。"},
  {id:"civ195", cat:"公民", sub:"経済", q:"なぜ企業の海外進出が国内の産業空洞化を招くことがあるのか、その理由として正しいものはどれか。", choices:["生産拠点の海外移転で雇用が減るため","海外の税金が非常に高いため","国内の人件費が非常に安いため","輸出が完全に禁止されているため"], a:0, e:"正解は「生産拠点の海外移転で雇用が減るため」です。人件費の安さなどを理由に企業が生産拠点を海外に移すと、国内の雇用や技術力が失われる産業空洞化が起こることがあります。「海外の税金が非常に高いため」は誤りで、企業が海外進出する動機は多くの場合、人件費の安さなどのコスト面のメリットであり、税金の高さは進出動機とは矛盾します。「国内の人件費が非常に安いため」は誤りで、実際には国内の人件費が「高い」ことが海外移転の動機となることが多く、この選択肢は事実と逆です。「輸出が完全に禁止されているため」は誤りで、産業空洞化と輸出禁止は直接結びつかない事柄です。"},
  {id:"civ197", cat:"公民", sub:"国際関係", q:"なぜ国際連合の安全保障理事会には常任理事国の拒否権があるのか、その理由として正しいものはどれか。", choices:["大国の合意なしに強制行動を防ぐため","小国の意見を優先するため","総会の決定を無効にするため","加盟国を増やし続けるため"], a:0, e:"正解は「大国の合意なしに強制行動を防ぐため」です。拒否権は、常任理事国である大国の合意がないまま重要な決定や軍事行動が行われることを防ぐために設けられています。「小国の意見を優先するため」は誤りで、拒否権はむしろ常任理事国（大国）に与えられた特別な権限であり、小国の意見優先とは異なる仕組みです。「総会の決定を無効にするため」は誤りで、拒否権は安全保障理事会における議決に関する制度であり、総会の決定を直接無効にするものではありません。「加盟国を増やし続けるため」は誤りで、拒否権と加盟国数の拡大は直接関係のない事柄です。"},
  /* 日本史 */
  {id:"his207", cat:"日本史", sub:"古代", q:"7世紀に中大兄皇子や中臣鎌足が中心となって行った政治改革を何というか。", choices:["大化の改新","建武の新政","寛政の改革","明治維新"], a:0, e:"正解は「大化の改新」です。大化の改新は645年、中大兄皇子や中臣鎌足が蘇我氏を倒して始めた一連の政治改革です。「建武の新政」は誤りで、これは1333年、後醍醐天皇が主導した鎌倉幕府滅亡後の政治改革であり、時代が大きく異なります。「寛政の改革」は誤りで、これは江戸時代に松平定信が行った改革です。「明治維新」は誤りで、これは19世紀後半の一連の近代化改革であり、7世紀の大化の改新とは時代が全くかけ離れています。"},
  {id:"his209", cat:"日本史", sub:"古代", q:"701年に唐の律令を手本として制定された、日本の基本法典は何か。", choices:["大宝律令","御成敗式目","武家諸法度","十七条憲法"], a:0, e:"正解は「大宝律令」です。大宝律令は701年に唐の律令を手本として制定され、日本の律令国家体制の基礎となりました。「御成敗式目」は誤りで、これは1232年に鎌倉幕府が制定した武家法であり、大宝律令（律令制の基本法典）とは時代も性格も異なります。「武家諸法度」は誤りで、これは江戸幕府が大名を統制するために定めた法度です。「十七条憲法」は誤りで、これは聖徳太子が604年に定めたとされる、大宝律令より前の政治・道徳の基本原則を示す文書です。"},
  {id:"his211", cat:"日本史", sub:"平安時代", q:"藤原氏が娘を天皇のきさきとし、外戚として実権を握った政治を何というか。", choices:["摂関政治","院政","執権政治","幕藩体制"], a:0, e:"正解は「摂関政治」です。摂関政治は藤原氏が天皇の外戚として摂政・関白の地位を独占し、実権を握った政治のあり方です。「院政」は誤りで、これは天皇を退位した上皇が実権を握る政治形態であり、摂関政治とは主体（藤原氏か上皇か）が異なります。「執権政治」は誤りで、これは鎌倉幕府で北条氏が将軍を補佐して実権を握った政治形態です。「幕藩体制」は誤りで、これは江戸時代の幕府と藩による支配体制であり、平安時代の摂関政治とは時代が大きく異なります。"},
  {id:"his213", cat:"日本史", sub:"鎌倉・室町", q:"1274年と1281年の二度にわたり、元軍が日本に襲来した出来事を何というか。", choices:["元寇","応仁の乱","文禄の役","下関戦争"], a:0, e:"正解は「元寇」です。元寇（蒙古襲来）は文永の役（1274年）と弘安の役（1281年）の二度にわたり起こりました。「応仁の乱」は誤りで、これは1467年に起こった室町幕府の将軍後継ぎ争いなどを原因とする国内の争乱であり、元寇とは時代も性格も異なります。「文禄の役」は誤りで、これは豊臣秀吉による朝鮮出兵（1592年）の前半部分を指す言葉であり、元寇とは全く別の時代・出来事です。「下関戦争」は誤りで、これは幕末（1863-1864年）に長州藩と列強との間で起こった戦争であり、元寇とは時代がかけ離れています。"},
  {id:"his215", cat:"日本史", sub:"鎌倉・室町", q:"足利尊氏が京都に開いた幕府は何か。", choices:["室町幕府","鎌倉幕府","江戸幕府","建武幕府"], a:0, e:"正解は「室町幕府」です。足利尊氏は1338年、京都に室町幕府を開き、征夷大将軍に任じられました。「鎌倉幕府」は誤りで、これは源頼朝が開いた幕府であり、足利尊氏が開いた幕府ではありません。「江戸幕府」は誤りで、これは徳川家康が開いた幕府であり、足利尊氏とは無関係です。「建武幕府」は誤りで、そのような名称の幕府は存在せず、建武の新政は後醍醐天皇による天皇中心の政治であり、幕府とは異なる政治体制です。"},
  {id:"his217", cat:"日本史", sub:"戦国・江戸", q:"1575年、織田信長・徳川連合軍が鉄砲を効果的に用い、武田軍を破った戦いは何か。", choices:["長篠の戦い","桶狭間の戦い","関ヶ原の戦い","川中島の戦い"], a:0, e:"正解は「長篠の戦い」です。長篠の戦いでは織田・徳川連合軍が鉄砲を組織的に活用し、武田氏の騎馬隊を打ち破りました。「桶狭間の戦い」は誤りで、これは1560年に信長が今川義元を破った戦いであり、鉄砲の効果的な活用で知られる長篠の戦いとは異なります。「関ヶ原の戦い」は誤りで、これは1600年に徳川家康が石田三成らに勝利した戦いであり、時期も性質も異なります。「川中島の戦い」は誤りで、これは武田信玄と上杉謙信の間で繰り返された合戦であり、信長・家康連合軍による長篠の戦いとは当事者が異なります。"},
  {id:"his219", cat:"日本史", sub:"戦国・江戸", q:"豊臣秀吉が行った身分統制策で、農民と武士の身分を明確に区別した政策を何というか。", choices:["兵農分離","楽市・楽座","参勤交代","地租改正"], a:0, e:"正解は「兵農分離」です。兵農分離は刀狩や検地などを通じて、農民と武士の身分をはっきりと区別した政策です。「楽市・楽座」は誤りで、これは商業を活発にするための座の特権廃止に関する政策であり、身分統制策とは目的が異なります。「参勤交代」は誤りで、これは江戸時代に大名の力を弱めるために行われた制度であり、豊臣秀吉の身分統制策とは時代・内容が異なります。「地租改正」は誤りで、これは明治時代の税制改革であり、豊臣秀吉の時代（安土桃山時代）とは大きく時代が異なります。"},
  {id:"his221", cat:"日本史", sub:"江戸時代", q:"江戸時代、幕府の学問所で正学として奨励された儒学の一派は何か。", choices:["朱子学","蘭学","国学","陽明学"], a:0, e:"正解は「朱子学」です。朱子学は身分秩序を重んじる考え方から、江戸幕府によって正学として奨励されました。「蘭学」は誤りで、これはオランダを通じて学ばれた西洋の学問であり、幕府の正学とされた儒学（朱子学）とは異なる分野です。「国学」は誤りで、これは日本古来の精神を研究する学問であり、正学として奨励された儒学の朱子学とは異なる学問です。「陽明学」は誤りで、これも儒学の一派ですが、幕府が正学として特に奨励したのは朱子学であり、陽明学はむしろ幕府にとって警戒される思想的側面もありました。"},
  {id:"his223", cat:"日本史", sub:"江戸時代", q:"本居宣長が大成した、日本古来の精神を研究する学問を何というか。", choices:["国学","蘭学","朱子学","洋学"], a:0, e:"正解は「国学」です。国学は「古事記」などの古典を研究し、日本古来の精神を明らかにしようとした学問で、本居宣長が大成しました。「蘭学」は誤りで、これはオランダを通じて学ばれた西洋の学問であり、日本古来の精神を研究する国学とは方向性が異なります。「朱子学」は誤りで、これは中国由来の儒学の一派であり、日本古来の精神を研究する国学とは対照的な学問です。「洋学」は誤りで、これは西洋の学問全般を指す言葉であり、国学（日本の古典研究）とは異なる分野です。"},
  {id:"his225", cat:"日本史", sub:"近代", q:"1871年、明治政府が欧米の制度や文化を視察するために派遣した使節団を何というか。", choices:["岩倉使節団","遣唐使","遣隋使","朝鮮通信使"], a:0, e:"正解は「岩倉使節団」です。岩倉使節団は岩倉具視を全権大使として1871年に欧米に派遣され、条約改正の予備交渉や視察を行いました。「遣唐使」は誤りで、これは奈良・平安時代に中国（唐）に派遣された使節であり、明治時代の岩倉使節団とは時代が全く異なります。「遣隋使」は誤りで、これは飛鳥時代に隋（中国）に派遣された使節であり、これも岩倉使節団とは時代が大きく異なります。「朝鮮通信使」は誤りで、これは江戸時代に朝鮮から日本へ派遣された使節であり、方向も時代も岩倉使節団とは異なります。"},
  {id:"his227", cat:"日本史", sub:"近代", q:"1889年に発布された大日本帝国憲法で、主権者とされたのは誰か。", choices:["天皇","国民","国会","内閣総理大臣"], a:0, e:"正解は「天皇」です。大日本帝国憲法では天皇が主権者とされ、天皇が統治権を総攬する体制が定められました。「国民」は誤りで、国民主権が採用されたのは戦後の日本国憲法であり、大日本帝国憲法では主権者は天皇でした。「国会」は誤りで、大日本帝国憲法下でも帝国議会は存在しましたが、主権者とされたのは天皇です。「内閣総理大臣」は誤りで、内閣総理大臣は行政を担う立場であり、大日本帝国憲法における主権者ではありません。"},
  {id:"his229", cat:"日本史", sub:"近代", q:"1902年、ロシアの南下政策に対抗するため日本が結んだ同盟は何か。", choices:["日英同盟","日独伊三国同盟","日米安全保障条約","日ソ中立条約"], a:0, e:"正解は「日英同盟」です。日英同盟（1902年）はロシアの南下政策に対抗するため、日本とイギリスの間で結ばれました。「日独伊三国同盟」は誤りで、これは1940年に日本・ドイツ・イタリアが結んだ、全く異なる時代・目的の軍事同盟です。「日米安全保障条約」は誤りで、これは第二次世界大戦後の1951年に結ばれた条約であり、日英同盟とは時代・相手国が異なります。「日ソ中立条約」は誤りで、これは1941年に日本とソ連の間で結ばれた条約であり、日英同盟とは相手国も内容も異なります。"},
  {id:"his231", cat:"日本史", sub:"近代", q:"1910年、日本が韓国を植民地とした出来事を何というか。", choices:["韓国併合","満州事変","日韓基本条約","日露戦争"], a:0, e:"正解は「韓国併合」です。韓国併合（1910年）は日本が韓国を植民地とし、朝鮮総督府を置いて統治した出来事です。「満州事変」は誤りで、これは1931年に満州で始まった軍事行動であり、韓国併合とは対象地域・時期が異なります。「日韓基本条約」は誤りで、これは1965年に結ばれた、戦後の日本と韓国の国交正常化に関する条約であり、1910年の韓国併合とは全く異なる時代の出来事です。「日露戦争」は誤りで、これは1904〜1905年の戦争であり、韓国併合（1910年）とは異なる出来事です。"},
  {id:"his233", cat:"日本史", sub:"近代", q:"平塚らいてうが中心となり、女性の地位向上を目指して設立した団体は何か。", choices:["青鞜社","国会期成同盟","立憲政友会","労働組合期成会"], a:0, e:"正解は「青鞜社」です。青鞜社は平塚らいてうらが1911年に設立した、女性の地位向上を目指す文学団体です。「国会期成同盟」は誤りで、これは自由民権運動の中で国会開設を求めて結成された団体であり、女性の地位向上を目的とした青鞜社とは異なります。「立憲政友会」は誤りで、これは明治末期に結成された政党であり、女性団体である青鞜社とは性格が異なります。「労働組合期成会」は誤りで、これは労働組合の結成を促す目的で作られた組織であり、女性の地位向上を目指す青鞜社とは目的が異なります。"},
  {id:"his235", cat:"日本史", sub:"現代", q:"1925年、満25歳以上のすべての男子に選挙権を認めた法律は何か。", choices:["普通選挙法","治安維持法","国家総動員法","教育基本法"], a:0, e:"正解は「普通選挙法」です。普通選挙法（1925年）により、納税額に関係なく満25歳以上のすべての男子に選挙権が認められました。「治安維持法」は誤りで、これは同じ1925年に制定されましたが、社会主義運動などを取り締まる法律であり、選挙権の拡大とは正反対の性質の法律です。「国家総動員法」は誤りで、これは1938年に制定された、戦時体制のための法律であり、選挙権とは無関係です。「教育基本法」は誤りで、これは戦後に制定された教育に関する法律であり、時代も内容も異なります。"},
  {id:"his237", cat:"日本史", sub:"現代", q:"1937年、盧溝橋事件をきっかけに始まった日本と中国の全面戦争を何というか。", choices:["日中戦争","日清戦争","日露戦争","満州事変"], a:0, e:"正解は「日中戦争」です。日中戦争は1937年の盧溝橋事件をきっかけに始まった、日本と中国の全面的な戦争です。「日清戦争」は誤りで、これは1894〜1895年の戦争であり、盧溝橋事件（1937年）をきっかけとする日中戦争とは時代が異なります。「日露戦争」は誤りで、これは1904〜1905年の戦争であり、これも日中戦争とは異なる時代・相手国です。「満州事変」は誤りで、これは1931年に始まった別の軍事行動であり、盧溝橋事件がきっかけとなった日中戦争とは開始のきっかけが異なります。"},
  {id:"his239", cat:"日本史", sub:"現代", q:"1938年に制定され、政府が経済や国民生活を統制することを可能にした法律は何か。", choices:["国家総動員法","治安維持法","普通選挙法","農地改革法"], a:0, e:"正解は「国家総動員法」です。国家総動員法（1938年）は、戦争遂行のため政府が労働力や物資などを議会の承認なく統制できるようにした法律です。「治安維持法」は誤りで、これは1925年に制定された、社会主義運動などを取り締まる法律であり、経済・国民生活の統制を目的とした国家総動員法とは内容が異なります。「普通選挙法」は誤りで、これは選挙権の拡大に関する法律であり、経済統制とは無関係です。「農地改革法」は誤りで、これは戦後に地主制度を解体するために制定された法律であり、戦時中の国家総動員法とは時代・目的が異なります。"},
  {id:"his241", cat:"日本史", sub:"現代", q:"1946年に日本国憲法が公布された日は何月何日か。", choices:["11月3日","5月3日","8月15日","2月11日"], a:0, e:"正解は「11月3日」です。日本国憲法は1946年11月3日に公布され、翌1947年5月3日に施行されました。「5月3日」は誤りで、これは憲法が「施行」された日であり、「公布」された日ではありません。「8月15日」は誤りで、これは終戦（玉音放送）の日であり、憲法公布日とは異なります。「2月11日」は誤りで、これは建国記念の日として定められている日であり、憲法公布日ではありません。"},
  {id:"his243", cat:"日本史", sub:"現代", q:"戦後、GHQの指導のもとで行われた教育改革の内容として正しいものはどれか。", choices:["六・三・三・四制の導入","義務教育の廃止","女子教育の禁止","私立学校の全廃"], a:0, e:"正解は「六・三・三・四制の導入」です。戦後の教育改革により、小学校六年・中学校三年・高等学校三年・大学四年からなる六・三・三・四制が導入されました。「義務教育の廃止」は誤りで、戦後の教育改革はむしろ義務教育の年限を延長・整備する方向であり、廃止とは正反対です。「女子教育の禁止」は誤りで、戦後の教育改革はむしろ男女平等の教育を進める方向であり、女子教育の禁止とは正反対の内容です。「私立学校の全廃」は誤りで、戦後も私立学校は存続しており、全廃された事実はありません。"},
  {id:"his245", cat:"日本史", sub:"現代", q:"1950年、GHQの指令により日本に新設された組織で、後の自衛隊の前身は何か。", choices:["警察予備隊","関東軍","国民義勇隊","陸軍参謀本部"], a:0, e:"正解は「警察予備隊」です。警察予備隊は1950年、朝鮮戦争を背景にGHQの指令で新設され、後に保安隊を経て自衛隊となりました。「関東軍」は誤りで、これは戦前に満州に駐留していた日本陸軍の部隊であり、戦後の警察予備隊とは全く異なる時代・組織です。「国民義勇隊」は誤りで、これは第二次世界大戦末期に本土決戦に備えて組織された国民組織であり、警察予備隊とは異なる時代・目的の組織です。「陸軍参謀本部」は誤りで、これも戦前の日本陸軍の最高統帥機関であり、戦後に新設された警察予備隊とは異なります。"},
  {id:"his247", cat:"日本史", sub:"現代", q:"1956年、日本とソ連の国交を回復させた宣言は何か。", choices:["日ソ共同宣言","日中共同声明","サンフランシスコ平和条約","日米安全保障条約"], a:0, e:"正解は「日ソ共同宣言」です。日ソ共同宣言（1956年）により日本とソ連の国交が回復し、同年の日本の国際連合加盟にもつながりました。「日中共同声明」は誤りで、これは1972年に日本と中国の国交を正常化した宣言であり、ソ連との国交回復とは相手国が異なります。「サンフランシスコ平和条約」は誤りで、これは1951年に結ばれた、多くの連合国との講和条約ですが、ソ連はこの条約に調印しておらず、ソ連との国交回復は別途、日ソ共同宣言によって実現しました。「日米安全保障条約」は誤りで、これは日本とアメリカの間の条約であり、ソ連との国交回復とは無関係です。"},
  {id:"his249", cat:"日本史", sub:"現代", q:"1960年、日米間で改定され、大規模な反対運動（安保闘争）を招いた条約は何か。", choices:["日米安全保障条約","日米和親条約","日米修好通商条約","サンフランシスコ平和条約"], a:0, e:"正解は「日米安全保障条約」です。1960年の日米安全保障条約改定に対しては激しい反対運動（安保闘争）が全国で起こりました。「日米和親条約」は誤りで、これは1854年に結ばれた開国に関する条約であり、1960年の安保闘争とは時代が大きく異なります。「日米修好通商条約」は誤りで、これは1858年に結ばれた不平等条約であり、これも幕末の条約であって1960年の出来事ではありません。「サンフランシスコ平和条約」は誤りで、これは1951年に結ばれた講和条約であり、1960年に改定され安保闘争を招いた条約（日米安全保障条約）とは異なります。"},
  {id:"his251", cat:"日本史", sub:"現代", q:"1964年に日本で開催され、戦後復興を世界に示す機会となった国際的な催しは何か。", choices:["東京オリンピック","大阪万博","サミット","ワールドカップ"], a:0, e:"正解は「東京オリンピック」です。1964年の東京オリンピックは、日本の戦後復興と国際社会への復帰を世界に示す機会となりました。「大阪万博」は誤りで、これは1970年に大阪で開催された万国博覧会であり、1964年の東京オリンピックとは開催年・都市・内容が異なります。「サミット」は誤りで、これは主要国首脳会議を指す一般的な言葉であり、1964年の特定の国際的催しを指す固有名詞ではありません。「ワールドカップ」は誤りで、サッカーワールドカップが日本で開催されたのは2002年であり、1964年とは時期が異なります。"},
  {id:"his253", cat:"日本史", sub:"現代", q:"1973年、原油価格の急激な上昇により世界経済に混乱をもたらした出来事を何というか。", choices:["石油危機","世界恐慌","バブル崩壊","高度経済成長"], a:0, e:"正解は「石油危機」です。石油危機（オイルショック）は1973年の第四次中東戦争をきっかけに原油価格が急騰し、世界経済に大きな影響を与えました。「世界恐慌」は誤りで、これは1929年に始まった別の経済危機であり、石油危機（1973年）とは時代が大きく異なります。「バブル崩壊」は誤りで、これは1990年代初めの日本の経済的出来事であり、1973年の石油危機とは時代が異なります。「高度経済成長」は誤りで、これは石油危機によってむしろ終わりを迎えた経済状況を指す言葉であり、石油危機そのものの説明ではありません。"},
  {id:"his255", cat:"日本史", sub:"現代", q:"1995年に発生し、多くの犠牲者を出した、兵庫県南部を震源とする大地震は何か。", choices:["阪神・淡路大震災","関東大震災","東日本大震災","濃尾地震"], a:0, e:"正解は「阪神・淡路大震災」です。阪神・淡路大震災（1995年）は兵庫県南部を震源とする大地震で、都市部に甚大な被害をもたらしました。「関東大震災」は誤りで、これは1923年に関東地方で発生した地震であり、1995年の阪神・淡路大震災とは発生年・震源地が異なります。「東日本大震災」は誤りで、これは2011年に東北地方を中心に発生した地震であり、1995年より後の出来事です。「濃尾地震」は誤りで、これは1891年に発生した、岐阜県・愛知県を中心とする地震であり、時期も震源地も阪神・淡路大震災とは異なります。"},
  /* 世界史 */
  {id:"wor201", cat:"世界史", sub:"古代・中世", q:"古代中国で儒教の祖とされる思想家は誰か。", choices:["孔子","老子","始皇帝","釈迦"], a:0, e:"正解は「孔子」です。孔子は仁や礼を重んじる儒教（儒学）の祖とされる古代中国の思想家です。「老子」は誤りで、彼は道家の祖とされる思想家であり、儒教とは異なる思想潮流を代表する人物です。「始皇帝」は誤りで、彼は中国を初めて統一した皇帝であり、思想家ではなく政治的支配者です。「釈迦」は誤りで、彼は仏教を開いた人物であり、中国の思想家ではなくインドで活動した宗教家です。"},
  {id:"wor203", cat:"世界史", sub:"古代・中世", q:"仏教を開いた人物は誰か。", choices:["釈迦（ブッダ）","孔子","ムハンマド","イエス"], a:0, e:"正解は「釈迦（ブッダ）」です。仏教は紀元前5世紀ごろ、インドで釈迦（ブッダ）によって開かれました。「孔子」は誤りで、彼は儒教の祖とされる中国の思想家であり、仏教の開祖ではありません。「ムハンマド」は誤りで、彼はイスラム教を開いた人物であり、仏教とは異なる宗教の開祖です。「イエス」は誤りで、彼はキリスト教の中心人物であり、仏教とは別の宗教に関わる人物です。"},
  {id:"wor205", cat:"世界史", sub:"古代・中世", q:"キリスト教を開いたとされる人物は誰か。", choices:["イエス","釈迦","孔子","ムハンマド"], a:0, e:"正解は「イエス」です。キリスト教はイエスの教えをもとに成立した宗教で、後にローマ帝国の国教となりました。「釈迦」は誤りで、彼は仏教を開いた人物であり、キリスト教の開祖ではありません。「孔子」は誤りで、彼は儒教の祖であり、宗教というより思想・倫理体系の創始者です。「ムハンマド」は誤りで、彼はイスラム教を開いた人物であり、キリスト教とは異なる宗教の開祖です。"},
  {id:"wor207", cat:"世界史", sub:"古代・中世", q:"7世紀にアラビア半島で成立し、急速に勢力を拡大した宗教は何か。", choices:["イスラム教","キリスト教","仏教","ヒンドゥー教"], a:0, e:"正解は「イスラム教」です。イスラム教は7世紀にムハンマドによって開かれ、アラビア半島を中心に急速に勢力を拡大しました。「キリスト教」は誤りで、これはイエスを中心に成立した宗教であり、成立時期・地域（1世紀、パレスチナ周辺）が異なります。「仏教」は誤りで、これは紀元前5世紀ごろインドで成立した宗教であり、時代・地域ともに異なります。「ヒンドゥー教」は誤りで、これは特定の開祖を持たず古代インドで自然発生的に形成された宗教であり、7世紀にアラビア半島で成立したものではありません。"},
  {id:"wor209", cat:"世界史", sub:"古代・中世", q:"14世紀にヨーロッパで大流行し、人口の大幅な減少を招いた伝染病は何か。", choices:["ペスト","天然痘","コレラ","インフルエンザ"], a:0, e:"正解は「ペスト」です。ペスト（黒死病）は14世紀にヨーロッパで大流行し、人口の3分の1近くが失われたとされています。「天然痘」は誤りで、これも歴史上大きな影響を与えた感染症ですが、14世紀ヨーロッパでの大流行として特に有名なのはペストです。「コレラ」は誤りで、これは主に19世紀に世界的に流行した感染症であり、14世紀のヨーロッパの大流行とは時代が異なります。「インフルエンザ」は誤りで、代表的な大流行（スペイン風邪）は20世紀初頭のものであり、14世紀のヨーロッパでの大流行とは時代が異なります。"},
  {id:"wor211", cat:"世界史", sub:"ヨーロッパ史", q:"1215年、イギリス国王の権力を制限するために貴族が国王に認めさせた文書は何か。", choices:["マグナ・カルタ（大憲章）","権利章典","人権宣言","独立宣言"], a:0, e:"正解は「マグナ・カルタ（大憲章）」です。マグナ・カルタ（大憲章）は1215年、イギリス国王の権力を法によって制限することを定めた文書です。「権利章典」は誤りで、これは1689年に制定された、マグナ・カルタよりずっと後の文書です。「人権宣言」は誤りで、これは1789年のフランス革命で発表された宣言であり、国も時代も異なります。「独立宣言」は誤りで、これは1776年にアメリカで発表された宣言であり、マグナ・カルタとは国・時代が異なります。"},
  {id:"wor213", cat:"世界史", sub:"ヨーロッパ史", q:"16世紀、スペインの無敵艦隊を破り海上覇権を確立したヨーロッパの国はどこか。", choices:["イギリス","フランス","オランダ","ポルトガル"], a:0, e:"正解は「イギリス」です。1588年、イギリスはスペインの無敵艦隊を破り、その後の海上覇権確立への道を開きました。「フランス」は誤りで、この海戦の当事者はイギリスとスペインであり、フランスは直接の当事者ではありません。「オランダ」は誤りで、オランダも後に海上貿易で栄えましたが、無敵艦隊を破ったのはイギリスです。「ポルトガル」は誤りで、ポルトガルは大航海時代初期に活躍した国ですが、この海戦の当事者ではありません。"},
  {id:"wor215", cat:"世界史", sub:"ヨーロッパ史", q:"17世紀のオランダで、東南アジアとの貿易を独占的に行った会社は何か。", choices:["東インド会社","西インド会社","ハンザ同盟","東方植民会社"], a:0, e:"正解は「東インド会社」です。オランダ東インド会社は17世紀、東南アジアとの香辛料貿易などを独占的に行った特許会社です。「西インド会社」は誤りで、これは主に西インド諸島やアメリカ大陸方面との貿易を目的とした別の会社です。「ハンザ同盟」は誤りで、これは中世北ヨーロッパの都市による商業同盟であり、17世紀のオランダの会社とは時代・性質が異なります。「東方植民会社」は誤りで、そのような名称の主要な貿易会社は一般的に知られておらず、誤った選択肢です。"},
  {id:"wor217", cat:"世界史", sub:"ヨーロッパ史", q:"18世紀、ジェームズ・ワットが実用化に大きく貢献した動力機関は何か。", choices:["蒸気機関","内燃機関","発電機","電動モーター"], a:0, e:"正解は「蒸気機関」です。ジェームズ・ワットは蒸気機関を改良し、産業革命を大きく推し進める動力源としました。「内燃機関」は誤りで、これはガソリンエンジンなど、蒸気機関よりも後の19世紀後半に発展した技術です。「発電機」は誤りで、これも蒸気機関より後、19世紀に発展した電気関連の技術です。「電動モーター」は誤りで、これも電気の実用化以降の技術であり、18世紀のワットの蒸気機関とは時代が異なります。"},
  {id:"wor219", cat:"世界史", sub:"ヨーロッパ史", q:"1804年、フランスで皇帝に即位した人物は誰か。", choices:["ナポレオン","ルイ16世","ロベスピエール","ルイ14世"], a:0, e:"正解は「ナポレオン」です。ナポレオンは1804年、国民投票を経てフランス皇帝に即位しました。「ルイ16世」は誤りで、彼はフランス革命期の国王であり、革命により処刑された人物であって、皇帝に即位したわけではありません。「ロベスピエール」は誤りで、彼はフランス革命期にジャコバン派を率いた政治家であり、皇帝に即位した人物ではありません。「ルイ14世」は誤りで、彼は17世紀の絶対王政期の国王（太陽王）であり、1804年の皇帝即位とは時代が異なります。"},
  {id:"wor221", cat:"世界史", sub:"ヨーロッパ史", q:"1861年から1865年にかけて、アメリカで奴隷制などをめぐり起こった内戦は何か。", choices:["南北戦争","独立戦争","米西戦争","朝鮮戦争"], a:0, e:"正解は「南北戦争」です。南北戦争（1861-1865年）は奴隷制の存廃などをめぐり、アメリカの北部と南部の間で起こった内戦です。「独立戦争」は誤りで、これは1775〜1783年にアメリカがイギリスからの独立を求めて戦った戦争であり、南北戦争とは時代・対立の構図が異なります。「米西戦争」は誤りで、これは1898年にアメリカとスペインの間で戦われた戦争であり、南北戦争とは異なる時代・当事国です。「朝鮮戦争」は誤りで、これは1950年に朝鮮半島で起こった戦争であり、19世紀のアメリカの内戦である南北戦争とは全く異なります。"},
  {id:"wor223", cat:"世界史", sub:"ヨーロッパ史", q:"1863年、リンカン大統領が南北戦争中に発表した宣言は何か。", choices:["奴隷解放宣言","権利章典","人権宣言","独立宣言"], a:0, e:"正解は「奴隷解放宣言」です。奴隷解放宣言（1863年）は南北戦争中にリンカン大統領が発表し、奴隷制の廃止に向けた大きな一歩となりました。「権利章典」は誤りで、これは1689年にイギリスで制定された文書であり、時代・国・内容が異なります。「人権宣言」は誤りで、これは1789年のフランス革命で発表された宣言であり、リンカンの奴隷解放宣言とは国・時代が異なります。「独立宣言」は誤りで、これは1776年にアメリカで発表されたものであり、奴隷解放宣言（1863年）とは発表時期が異なります。"},
  {id:"wor225", cat:"世界史", sub:"ヨーロッパ史", q:"1871年、プロイセンを中心に統一され成立した国はどこか。", choices:["ドイツ帝国","イタリア王国","オーストリア帝国","ロシア帝国"], a:0, e:"正解は「ドイツ帝国」です。1871年、プロイセン王ヴィルヘルム1世が皇帝となり、ドイツ帝国の統一が達成されました。「イタリア王国」は誤りで、これはイタリアの統一によって成立した国であり、プロイセン中心のドイツ統一とは異なる国・過程です。「オーストリア帝国」は誤りで、これはドイツ統一以前から存在していた別の帝国であり、プロイセン中心の統一によって成立したものではありません。「ロシア帝国」は誤りで、これも別の歴史的経緯で成立した帝国であり、1871年のドイツ統一とは無関係です。"},
  {id:"wor227", cat:"世界史", sub:"両大戦期", q:"1919年、第一次世界大戦の講和会議として開かれたのはどこの会議か。", choices:["パリ講和会議","ウィーン会議","ヤルタ会談","バンドン会議"], a:0, e:"正解は「パリ講和会議」です。パリ講和会議（1919年）は第一次世界大戦の講和条件を協議した会議で、ヴェルサイユ条約が結ばれました。「ウィーン会議」は誤りで、これは19世紀初頭のナポレオン戦争後の会議であり、第一次世界大戦（20世紀）とは時代が異なります。「ヤルタ会談」は誤りで、これは1945年、第二次世界大戦末期に開かれた会談であり、第一次世界大戦の講和会議ではありません。「バンドン会議」は誤りで、これは1955年のアジア・アフリカ諸国による会議であり、第一次世界大戦とは無関係です。"},
  {id:"wor229", cat:"世界史", sub:"両大戦期", q:"1929年、ニューヨーク株式市場での株価暴落をきっかけに始まった経済危機を何というか。", choices:["世界恐慌","石油危機","アジア通貨危機","リーマン・ショック"], a:0, e:"正解は「世界恐慌」です。世界恐慌は1929年のニューヨーク株式市場の大暴落をきっかけに始まり、世界中に広がりました。「石油危機」は誤りで、これは1973年に原油価格の急騰で起こった経済危機であり、1929年の株価暴落とは異なる出来事です。「アジア通貨危機」は誤りで、これは1997年にアジア各国で起こった通貨・金融危機であり、1929年の世界恐慌とは時代が大きく異なります。「リーマン・ショック」は誤りで、これは2008年にアメリカの金融機関破綻をきっかけに起こった経済危機であり、1929年の世界恐慌とは別の出来事です。"},
  {id:"wor231", cat:"世界史", sub:"両大戦期", q:"1933年、ドイツで首相に就任し、後に独裁体制を築いた人物は誰か。", choices:["ヒトラー","ムッソリーニ","スターリン","チャーチル"], a:0, e:"正解は「ヒトラー」です。ヒトラーは1933年にドイツ首相に就任し、その後ナチス独裁体制を築きました。「ムッソリーニ」は誤りで、彼はイタリアのファシスト党の指導者であり、ドイツではなくイタリアの指導者です。「スターリン」は誤りで、彼はソビエト連邦の指導者であり、ドイツの首相に就任した人物ではありません。「チャーチル」は誤りで、彼はイギリスの首相であり、ナチス・ドイツと戦った連合国側の指導者です。"},
  {id:"wor233", cat:"世界史", sub:"両大戦期", q:"1939年、ドイツによる侵攻をきっかけに第二次世界大戦が始まった国はどこか。", choices:["ポーランド","フランス","イギリス","ソ連"], a:0, e:"正解は「ポーランド」です。1939年、ドイツがポーランドに侵攻したことをきっかけに第二次世界大戦が始まりました。「フランス」は誤りで、フランスもドイツの侵攻を受けましたが、それは1940年のことであり、大戦開始のきっかけとなった1939年の侵攻対象国はポーランドです。「イギリス」は誤りで、イギリスはドイツに宣戦布告した国の一つですが、ドイツによる直接の侵攻を受けて開戦したわけではありません。「ソ連」は誤りで、ソ連は当時ドイツと不可侵条約を結んでおり、1939年の開戦のきっかけとなった侵攻対象国ではありません。"},
  {id:"wor235", cat:"世界史", sub:"両大戦期", q:"1945年8月、日本に原子爆弾が投下された都市の組み合わせとして正しいものはどれか。", choices:["広島と長崎","東京と大阪","京都と奈良","横浜と神戸"], a:0, e:"正解は「広島と長崎」です。1945年8月、広島（6日）と長崎（9日）にアメリカ軍によって原子爆弾が投下されました。「東京と大阪」は誤りで、これらの都市には空襲は行われましたが、原子爆弾が投下されたのは広島と長崎です。「京都と奈良」は誤りで、これらの都市は歴史的建造物が多いことなどから原爆投下の対象とはされませんでした。「横浜と神戸」は誤りで、これらの都市も空襲の被害を受けましたが、原子爆弾が投下されたのは広島と長崎です。"},
  {id:"wor237", cat:"世界史", sub:"現代", q:"1948年に建国が宣言され、中東での対立の一因となった国はどこか。", choices:["イスラエル","エジプト","トルコ","イラン"], a:0, e:"正解は「イスラエル」です。1948年のイスラエル建国は、周辺のアラブ諸国との対立を招き、中東戦争の一因となりました。「エジプト」は誤りで、エジプトは1948年時点ですでに存在する国であり、この年に「建国」が宣言された国ではありません。「トルコ」は誤りで、トルコも既存の国であり、1948年に建国されたわけではありません。「イラン」は誤りで、これも既存の国であり、1948年の建国宣言とは無関係です。"},
  {id:"wor239", cat:"世界史", sub:"現代", q:"1949年に成立した、毛沢東を主席とする社会主義国家は何か。", choices:["中華人民共和国","中華民国","満州国","大韓民国"], a:0, e:"正解は「中華人民共和国」です。1949年、毛沢東を主席として中華人民共和国が成立しました。「中華民国」は誤りで、これは1912年に成立した、中華人民共和国とは別の政権であり、1949年以降は台湾に拠点を移しました。「満州国」は誤りで、これは1932年に日本が満州に建てた傀儡国家であり、1945年の日本敗戦とともに消滅しています。「大韓民国」は誤りで、これは1948年に朝鮮半島南部に成立した国であり、中国の政権とは異なります。"},
  {id:"wor241", cat:"世界史", sub:"現代", q:"1961年、東西ベルリンの境界に築かれた壁を何というか。", choices:["ベルリンの壁","万里の長城","ハドリアヌスの長城","マジノ線"], a:0, e:"正解は「ベルリンの壁」です。ベルリンの壁は1961年、東ドイツによって東西ベルリンの境界に築かれ、冷戦の象徴となりました。「万里の長城」は誤りで、これは古代中国で北方民族の侵入を防ぐために築かれた城壁であり、20世紀のベルリンの壁とは時代・目的が全く異なります。「ハドリアヌスの長城」は誤りで、これは古代ローマ帝国がブリテン島に築いた防壁であり、これも時代・場所が異なります。「マジノ線」は誤りで、これは第二次世界大戦前にフランスがドイツとの国境に築いた防衛線であり、ベルリンの壁とは異なる時代・目的の構造物です。"},
  {id:"wor243", cat:"世界史", sub:"現代", q:"1965年、アメリカが北爆を開始し本格的に介入した戦争は何か。", choices:["ベトナム戦争","朝鮮戦争","湾岸戦争","イラク戦争"], a:0, e:"正解は「ベトナム戦争」です。1965年、アメリカは北ベトナムへの爆撃（北爆）を開始し、ベトナム戦争への介入を本格化させました。「朝鮮戦争」は誤りで、これは1950年に始まった別の戦争であり、1965年の北爆とは時期・場所が異なります。「湾岸戦争」は誤りで、これは1991年に起こった戦争であり、1965年の出来事ではありません。「イラク戦争」は誤りで、これは2003年に始まった戦争であり、1965年とは全く異なる時代の出来事です。"},
  {id:"wor245", cat:"世界史", sub:"現代", q:"1993年に調印され、EU（ヨーロッパ連合）の発足を定めた条約は何か。", choices:["マーストリヒト条約","ローマ条約","ヴェルサイユ条約","パリ条約"], a:0, e:"正解は「マーストリヒト条約」です。マーストリヒト条約（1993年発効）により、それまでのEC（ヨーロッパ共同体）はEU（ヨーロッパ連合）へと発展しました。「ローマ条約」は誤りで、これは1957年にEC（当時のEEC）の前身を設立した条約であり、EU発足を定めたマーストリヒト条約より前のものです。「パリ条約」は誤りで、これは1951年にヨーロッパ石炭鉄鋼共同体を設立した条約であり、これもマーストリヒト条約より前の枠組みです。「ヴェルサイユ条約」は誤りで、これは第一次世界大戦の講和条約であり、EU発足とは無関係です。"},
  {id:"wor247", cat:"世界史", sub:"現代", q:"2001年、アメリカで発生した同時多発テロ事件の標的となった都市はどこか。", choices:["ニューヨーク","ワシントン","ロサンゼルス","シカゴ"], a:0, e:"正解は「ニューヨーク」です。2001年9月11日、ニューヨークの世界貿易センタービルなどが標的となる同時多発テロが発生しました。「ワシントン」は誤りで、ワシントンの国防総省（ペンタゴン）も攻撃対象となりましたが、最も象徴的な標的とされたのはニューヨークの世界貿易センタービルです。「ロサンゼルス」は誤りで、この都市は2001年の同時多発テロの直接の標的とはなっていません。「シカゴ」も誤りで、同様にこの事件の直接の標的とはなっていません。"},
  {id:"wor249", cat:"世界史", sub:"現代", q:"2020年前後に世界的に拡大し、多くの国で都市封鎖などの対策が取られた感染症は何か。", choices:["新型コロナウイルス感染症","エボラ出血熱","SARS","スペイン風邪"], a:0, e:"正解は「新型コロナウイルス感染症」です。新型コロナウイルス感染症は2020年前後に世界的に拡大し、多くの国で都市封鎖などの対策が取られました。「エボラ出血熱」は誤りで、これは主にアフリカで流行した別の感染症であり、2020年前後の世界的なパンデミックとは異なる出来事です。「SARS」は誤りで、これは2002〜2003年に流行した別の感染症であり、新型コロナウイルスとは発生時期・規模が異なります。「スペイン風邪」は誤りで、これは1918〜1920年ごろに世界的に流行したインフルエンザであり、2020年前後の出来事ではありません。"},
  /* 地理 */
  {id:"geo199", cat:"地理", sub:"日本地理", q:"日本を8地方に区分したとき、近畿地方に含まれない府県はどれか。", choices:["岡山県","滋賀県","奈良県","兵庫県"], a:0, e:"正解は「岡山県」です。岡山県は中国地方に区分され、近畿地方には含まれません。「滋賀県」「奈良県」「兵庫県」はいずれも誤り（正しい選択、つまり実際に近畿地方に含まれる）で、これらはまさに近畿地方を構成する府県の一部です。"},
  {id:"geo201", cat:"地理", sub:"日本地理", q:"日本の8地方区分のうち、中部地方をさらに三つに分けたとき含まれないものはどれか。", choices:["九州","北陸","中央高地","東海"], a:0, e:"正解は「九州」です。中部地方は北陸・中央高地・東海に分けられることがあり、九州は九州地方に属します。「北陸」「中央高地」「東海」はいずれも誤り（正しい選択、つまり実際に中部地方の区分に含まれる）で、これら三つがまさに中部地方をさらに細分化した際の区分です。"},
  {id:"geo203", cat:"地理", sub:"世界地理", q:"六大陸のうち、赤道が中央付近を通過する大陸はどこか。", choices:["アフリカ大陸","ヨーロッパ大陸","北アメリカ大陸","南極大陸"], a:0, e:"正解は「アフリカ大陸」です。アフリカ大陸は赤道がほぼ中央部を通過しており、南北にほぼ対称な形をしています。「ヨーロッパ大陸」は誤りで、赤道はヨーロッパを通過しておらず、ヨーロッパは赤道よりかなり北に位置します。「北アメリカ大陸」は誤りで、これも赤道より北側に位置し、赤道が中央付近を通過するわけではありません。「南極大陸」は誤りで、これは南極点付近に位置し、赤道からは大きく離れた場所にあります。"},
  {id:"geo205", cat:"地理", sub:"世界地理", q:"世界で最も面積が小さい国として知られるのはどこか。", choices:["バチカン市国","モナコ","シンガポール","ルクセンブルク"], a:0, e:"正解は「バチカン市国」です。バチカン市国はイタリアのローマ市内にある、世界で最も面積が小さい国です。「モナコ」は誤りで、これも小さな国として知られますが、バチカン市国よりは面積が大きいです。「シンガポール」は誤りで、これは都市国家として知られますが、バチカン市国よりはるかに面積が大きいです。「ルクセンブルク」は誤りで、これはヨーロッパの小国として知られますが、世界最小というほどの面積ではありません。"},
  {id:"geo207", cat:"地理", sub:"世界地理", q:"世界で最も人口が多い国として知られるのはどこか（近年の統計で）。", choices:["インド","中国","アメリカ","インドネシア"], a:0, e:"正解は「インド」です。近年の国連統計では、インドが中国を上回り世界で最も人口が多い国となっています。「中国」は誤りで、中国は長らく世界最大の人口を有していましたが、近年の統計ではインドに次ぐ位置となっています。「アメリカ」は誤りで、アメリカの人口はインドや中国と比べるとかなり少なく、世界最多ではありません。「インドネシア」は誤りで、これも人口の多い国として知られますが、インドや中国には及びません。"},
  {id:"geo209", cat:"地理", sub:"世界地理", q:"世界で最も標高が高い山として知られるのはどこにあるか。", choices:["ヒマラヤ山脈","アルプス山脈","ロッキー山脈","アンデス山脈"], a:0, e:"正解は「ヒマラヤ山脈」です。世界最高峰のエベレストはヒマラヤ山脈に位置し、標高は約8848メートルです。「アルプス山脈」は誤りで、これはヨーロッパに位置する山脈であり、世界最高峰を含む山脈ではありません。「ロッキー山脈」は誤りで、これは北米大陸に位置する山脈であり、これも世界最高峰を含みません。「アンデス山脈」は誤りで、これは南米大陸に位置する世界最長級の山脈ですが、世界最高峰があるのはヒマラヤ山脈です。"},
  {id:"geo211", cat:"地理", sub:"世界地理", q:"世界で最も流域面積が広い川として知られるのはどこか。", choices:["アマゾン川","ナイル川","ミシシッピ川","長江"], a:0, e:"正解は「アマゾン川」です。アマゾン川は南米を流れる川で、流域面積は世界最大とされています。「ナイル川」は誤りで、これは長さでは世界最長級とされる川ですが、流域面積ではアマゾン川に及びません。「ミシシッピ川」は誤りで、これは北米を代表する川ですが、流域面積ではアマゾン川に及びません。「長江」は誤りで、これはアジア最長級の川ですが、これも流域面積ではアマゾン川には及びません。"},
  {id:"geo213", cat:"地理", sub:"世界地理", q:"世界で最も面積が広い湖として知られるのはどこか。", choices:["カスピ海","琵琶湖","バイカル湖","五大湖のスペリオル湖"], a:0, e:"正解は「カスピ海」です。カスピ海は中央アジアに位置する塩湖で、面積は世界最大の湖として知られています。「琵琶湖」は誤りで、これは日本最大の湖ですが、世界的に見ると規模はカスピ海にはるかに及びません。「バイカル湖」は誤りで、これは世界で最も深い湖として知られますが、面積ではカスピ海に及びません。「五大湖のスペリオル湖」は誤りで、これは淡水湖としては世界最大級ですが、面積ではカスピ海（塩湖）には及びません。"},
  {id:"geo215", cat:"地理", sub:"日本地理", q:"日本で最も長い川はどれか。", choices:["信濃川","利根川","石狩川","最上川"], a:0, e:"正解は「信濃川」です。信濃川は日本で最も長い川で、長野県から新潟県を流れて日本海に注いでいます。「利根川」は誤りで、これは日本で流域面積が最も広い川として知られますが、長さでは信濃川に及びません。「石狩川」は誤りで、これは北海道を流れる主要な川ですが、日本最長というわけではありません。「最上川」は誤りで、これは山形県を流れる川であり、日本三大急流の一つとして知られますが、日本最長ではありません。"},
  {id:"geo217", cat:"地理", sub:"日本地理", q:"日本で流域面積が最も広い川はどれか。", choices:["利根川","信濃川","石狩川","淀川"], a:0, e:"正解は「利根川」です。利根川は関東地方を流れる川で、日本の川の中で流域面積が最も広いことで知られています。「信濃川」は誤りで、これは日本最長の川ですが、流域面積では利根川に及びません。「石狩川」は誤りで、これは北海道の主要な川ですが、流域面積では利根川に及びません。「淀川」は誤りで、これは近畿地方を流れる主要な川ですが、流域面積では利根川に及びません。"},
  {id:"geo219", cat:"地理", sub:"世界地理", q:"温帯の中で、夏に高温で乾燥し冬に雨が多く降る気候を何というか。", choices:["地中海性気候","温暖湿潤気候","西岸海洋性気候","冷帯気候"], a:0, e:"正解は「地中海性気候」です。地中海性気候は地中海沿岸などに見られ、夏は高温で乾燥し、冬に降水量が多くなる気候です。「温暖湿潤気候」は誤りで、これは四季の変化がはっきりし、年間を通じて一定の降水がある気候であり、夏に乾燥する地中海性気候とは降水パターンが異なります。「西岸海洋性気候」は誤りで、これは偏西風と暖流の影響で年間を通じて温暖湿潤な気候であり、夏に乾燥する地中海性気候とは異なります。「冷帯気候」は誤りで、これは寒暖の差が大きい高緯度の気候であり、地中海性気候とは緯度帯・特徴が異なります。"},
  {id:"geo221", cat:"地理", sub:"世界地理", q:"温帯の中で、日本の多くの地域が属し、四季の変化がはっきりしている気候を何というか。", choices:["温暖湿潤気候","地中海性気候","西岸海洋性気候","ステップ気候"], a:0, e:"正解は「温暖湿潤気候」です。温暖湿潤気候は四季の変化がはっきりしており、日本の多くの地域がこの気候に属しています。「地中海性気候」は誤りで、これは夏に乾燥し冬に雨が多い気候であり、日本の多くの地域の気候パターンとは異なります。「西岸海洋性気候」は誤りで、これは年間を通じて温暖で降水が安定した気候であり、四季の変化がはっきりする日本の気候とは特徴が異なります。「ステップ気候」は誤りで、これは乾燥帯に属する気候であり、温帯に属する日本の気候とは気候帯が異なります。"},
  {id:"geo223", cat:"地理", sub:"世界地理", q:"一年中気温が高く、はっきりした四季がなく、樹木が育たない寒冷な気候を氷雪気候というが、これが見られる主な地域はどこか。", choices:["南極大陸","アマゾン川流域","サハラ砂漠","地中海沿岸"], a:0, e:"正解は「南極大陸」です。氷雪気候は一年を通じて氷や雪に覆われる寒帯の気候で、南極大陸やグリーンランドの内陸部などに見られます。「アマゾン川流域」は誤りで、これは熱帯雨林気候の代表的な地域であり、氷雪気候とは正反対の高温多雨な地域です。「サハラ砂漠」は誤りで、これは乾燥帯（砂漠気候）の代表例であり、氷雪気候とは全く異なる気候帯です。「地中海沿岸」は誤りで、これは地中海性気候（温帯）の地域であり、氷雪気候（寒帯）とは気候帯が異なります。"},
  {id:"geo225", cat:"地理", sub:"世界地理", q:"世界の主な小麦の生産国に共通する農業の特徴として正しいものはどれか。", choices:["広大な土地での大規模栽培","狭い土地での集約的栽培","熱帯での多年生栽培","漁業を中心とした産業"], a:0, e:"正解は「広大な土地での大規模栽培」です。アメリカやオーストラリア、ロシアなど主な小麦生産国では、広大な土地を利用した大規模な栽培が行われています。「狭い土地での集約的栽培」は誤りで、これはむしろ日本などで見られる農業形態に近く、主な小麦生産国の大規模栽培とは正反対の特徴です。「熱帯での多年生栽培」は誤りで、小麦は主に温帯で栽培される一年生作物であり、熱帯の多年生栽培とは異なる特徴です。「漁業を中心とした産業」は誤りで、これは小麦生産とは全く異なる産業分野です。"},
  {id:"geo227", cat:"地理", sub:"世界地理", q:"稲作が盛んなアジアの地域に共通する気候の特徴として正しいものはどれか。", choices:["夏に高温多雨となる","一年中乾燥している","冬に高温多雨となる","一年中寒冷である"], a:0, e:"正解は「夏に高温多雨となる」です。アジアの稲作地帯の多くはモンスーンの影響を受け、夏に高温多雨となる気候が稲作に適しています。「一年中乾燥している」は誤りで、これは稲作に必要な水を確保しにくい気候であり、稲作が盛んな地域の特徴とは正反対です。「冬に高温多雨となる」は誤りで、モンスーンアジアでは夏に高温多雨となるのが特徴であり、冬にこの特徴が現れるわけではありません。「一年中寒冷である」は誤りで、これは稲作に不向きな気候であり、アジアの主要な稲作地帯の特徴とは異なります。"},
  {id:"geo229", cat:"地理", sub:"世界地理", q:"世界の三大穀物に含まれないものはどれか。", choices:["じゃがいも","米","小麦","とうもろこし"], a:0, e:"正解は「じゃがいも」です。世界の三大穀物は米・小麦・とうもろこしであり、じゃがいもはいも類に分類されます。「米」「小麦」「とうもろこし」はいずれも誤り（正しい選択、つまり実際に世界の三大穀物に含まれる）で、これら三つがまさに世界で最も重要とされる穀物です。"},
  {id:"geo231", cat:"地理", sub:"世界地理", q:"石炭・石油・天然ガスをまとめて何と呼ぶか。", choices:["化石燃料","再生可能エネルギー","バイオ燃料","水力資源"], a:0, e:"正解は「化石燃料」です。石炭・石油・天然ガスは大昔の生物の遺骸が変化してできたもので、まとめて化石燃料と呼ばれます。「再生可能エネルギー」は誤りで、これは太陽光や風力など、資源が枯渇しないエネルギー源を指す言葉であり、有限資源である化石燃料とは正反対の概念です。「バイオ燃料」は誤りで、これは生物由来の資源から作られる燃料であり、石炭・石油・天然ガス（化石燃料）とは成因が異なります。「水力資源」は誤りで、これは水の位置エネルギーを利用するものであり、化石燃料とは全く異なる種類のエネルギー源です。"},
  {id:"geo233", cat:"地理", sub:"日本地理", q:"日本の発電のうち、近年最も高い割合を占めているのはどれか。", choices:["火力発電","水力発電","原子力発電","地熱発電"], a:0, e:"正解は「火力発電」です。日本では東日本大震災以降、原子力発電の割合が低下し、火力発電が最も高い割合を占めています。「水力発電」は誤りで、これは日本の発電の一定割合を占めますが、最も高い割合ではありません。「原子力発電」は誤りで、東日本大震災以降、原子力発電の割合はむしろ大きく低下しました。「地熱発電」は誤りで、これは日本の発電に占める割合が小さく、最も高い割合を占めているわけではありません。"},
  {id:"geo235", cat:"地理", sub:"世界地理", q:"世界の主な工業地域が沿岸部に多く立地している理由として正しいものはどれか。", choices:["船による原料や製品の輸送に便利なため","気温が最も低いため","土地の価格が非常に高いため","農業に最も適しているため"], a:0, e:"正解は「船による原料や製品の輸送に便利なため」です。沿岸部は港を利用して原料の輸入や製品の輸出を船で行いやすいため、多くの工業地域が立地しています。「気温が最も低いため」は誤りで、気温の低さは沿岸部立地の理由として一般的ではなく、事実とも合致しません。「土地の価格が非常に高いため」は誤りで、土地価格の高さは工業立地を妨げる要因にもなりえ、立地を促す理由としては不適切です。「農業に最も適しているため」は誤りで、これは工業立地の理由としては不適切であり、農業適性と工業立地は直接結びつきません。"},
  {id:"geo237", cat:"地理", sub:"世界地理", q:"発展途上国の都市で見られる、スラムなどインフラが未整備な地域が急増する現象の背景として正しいものはどれか。", choices:["農村からの人口流入が急増したため","都市の人口が減少し続けたため","農業の生産性が向上したため","出生率が低下し続けたため"], a:0, e:"正解は「農村からの人口流入が急増したため」です。仕事を求めて農村から都市へ人口が急激に流入する一方でインフラ整備が追いつかず、スラムが形成されることがあります。「都市の人口が減少し続けたため」は誤りで、スラムの拡大はむしろ都市人口の「増加」にともなう現象であり、減少とは事実が逆です。「農業の生産性が向上したため」は誤りで、これは間接的な要因となることもありますが、直接的にはインフラ未整備の背景としては説明不足です。「出生率が低下し続けたため」は誤りで、スラム形成の主な要因は農村からの人口流入であり、出生率の低下が直接の理由ではありません。"},
  {id:"geo239", cat:"地理", sub:"世界地理", q:"先進国から発展途上国への経済格差を是正するための援助や協力を総称して何というか。", choices:["南北問題への取り組み","東西問題への対応","冷戦構造の維持","保護貿易政策"], a:0, e:"正解は「南北問題への取り組み」です。先進国（北）と発展途上国（南）の経済格差である南北問題の解消に向けて、援助や協力が行われています。「東西問題への対応」は誤りで、これは冷戦期の資本主義陣営と社会主義陣営の対立を指す言葉であり、経済格差是正のための援助とは異なる文脈です。「冷戦構造の維持」は誤りで、援助や協力はむしろ経済格差の是正を目指すものであり、冷戦構造の維持を目的としたものではありません。「保護貿易政策」は誤りで、これは自国産業を守るための貿易政策であり、南北問題解消のための援助とは異なる概念です。"},
  {id:"geo241", cat:"地理", sub:"世界地理", q:"発展途上国間での経済格差の広がりを何というか。", choices:["南南問題","南北問題","東西問題","貿易摩擦"], a:0, e:"正解は「南南問題」です。南南問題は発展途上国（南）の中でも、資源国と資源を持たない国との間で経済格差が広がっている問題です。「南北問題」は誤りで、これは先進国（北）と発展途上国（南）の間の経済格差を指す言葉であり、発展途上国間の格差を指す南南問題とは対象が異なります。「東西問題」は誤りで、これは冷戦期のイデオロギー対立を指す言葉であり、経済格差の問題とは性質が異なります。「貿易摩擦」は誤りで、これは主に先進国間などで生じる貿易上の対立を指す言葉であり、発展途上国間の経済格差を指す南南問題とは異なります。"},
  {id:"geo243", cat:"地理", sub:"日本地理", q:"都市部で子どもの数に対して保育所が不足している問題を何というか。", choices:["待機児童問題","高齢化問題","過疎化問題","少子化問題"], a:0, e:"正解は「待機児童問題」です。待機児童問題は保育所に入所を希望しても入れない子どもが多く存在する、都市部で特に深刻な問題です。「高齢化問題」は誤りで、これは高齢者の割合が増加する現象を指す言葉であり、保育所不足とは異なる問題です。「過疎化問題」は誤りで、これは地方の人口減少に関する問題であり、都市部の保育所不足を指す待機児童問題とは対象地域も内容も異なります。「少子化問題」は誤りで、これは出生率の低下そのものを指す言葉であり、既に生まれた子どもの保育所不足を指す待機児童問題とは異なる概念です。"},
  {id:"geo245", cat:"地理", sub:"日本地理", q:"地方公共団体が独自に制定する、その地域だけに適用されるきまりを何というか。", choices:["条例","法律","政令","省令"], a:0, e:"正解は「条例」です。条例は地方公共団体が地方議会の議決を経て制定する、その地域にのみ適用されるきまりです。「法律」は誤りで、これは国会が制定する、全国に適用されるきまりであり、地域限定の条例とは制定主体・適用範囲が異なります。「政令」は誤りで、これは内閣が法律を実施するために制定する命令であり、地方公共団体が制定する条例とは主体が異なります。「省令」は誤りで、これは各省の大臣が発する命令であり、これも地方公共団体が制定する条例とは異なる主体によるものです。"},
  {id:"geo247", cat:"地理", sub:"世界地理", q:"複数の国が加盟し、貿易の自由化などを進める地域的な経済統合の枠組みを何というか。", choices:["地域経済統合","南北問題","モノカルチャー経済","フェアトレード"], a:0, e:"正解は「地域経済統合」です。EUやASEANのように、複数の国が加盟して貿易の自由化などを進める枠組みを地域経済統合といいます。「南北問題」は誤りで、これは先進国と発展途上国の経済格差を指す言葉であり、地域的な経済統合の枠組みそのものを指すものではありません。「モノカルチャー経済」は誤りで、これは特定の一次産品に依存する経済構造を指す言葉であり、複数国の統合とは異なる概念です。「フェアトレード」は誤りで、これは公正な貿易の仕組みを指す言葉であり、地域経済統合とは異なる分野の取り組みです。"},
  /* 公民 */
  {id:"civ199", cat:"公民", sub:"政治体制", q:"日本国憲法が定める天皇の地位として正しいものはどれか。", choices:["日本国および国民統合の象徴","国の元首として統治権を持つ","立法権を持つ最高機関","行政権を持つ最高責任者"], a:0, e:"正解は「日本国および国民統合の象徴」です。日本国憲法第1条は、天皇を「日本国の象徴であり日本国民統合の象徴」と定めています。「国の元首として統治権を持つ」は誤りで、これは戦前の大日本帝国憲法における天皇の地位に近く、現在の日本国憲法における天皇の地位とは異なります。「立法権を持つ最高機関」は誤りで、立法権を持つのは国会であり、天皇は政治的権能を持たない象徴的存在です。「行政権を持つ最高責任者」は誤りで、行政権を担うのは内閣であり、天皇はこれも持ちません。"},
  {id:"civ201", cat:"公民", sub:"政治体制", q:"日本の国会が衆議院と参議院からなる制度を何というか。", choices:["二院制","一院制","三権分立","議院内閣制"], a:0, e:"正解は「二院制」です。日本の国会は衆議院と参議院の二つの議院からなる二院制を採用しています。「一院制」は誤りで、これは一つの議院のみで構成される制度であり、日本の国会（衆参二院）とは異なる仕組みです。「三権分立」は誤りで、これは立法・行政・司法という三つの権力の分立に関する原則であり、国会の議院の数を指す言葉ではありません。「議院内閣制」は誤りで、これは内閣が国会の信任にもとづいて成立する仕組みを指す言葉であり、議院の数（二院制）とは異なる概念です。"},
  {id:"civ203", cat:"公民", sub:"政治体制", q:"日本の内閣を構成する、各省庁の長として政策を担当する国務大臣を統括する立場にあるのは誰か。", choices:["内閣総理大臣","衆議院議長","最高裁判所長官","天皇"], a:0, e:"正解は「内閣総理大臣」です。内閣総理大臣は内閣の首長として国務大臣を任命し、内閣を統括する立場にあります。「衆議院議長」は誤りで、これは衆議院の議事を運営する立場であり、内閣を統括する立場ではありません。「最高裁判所長官」は誤りで、これは司法権を担う最高裁判所のトップであり、内閣（行政）を統括する立場ではありません。「天皇」は誤りで、天皇は政治的権能を持たない象徴的存在であり、内閣を統括する立場にはありません。"},
  {id:"civ205", cat:"公民", sub:"政治体制", q:"日本の内閣総理大臣はどのようにして指名されるか。", choices:["国会議員の中から国会の議決で指名される","国民の直接選挙で選ばれる","天皇が任意に任命する","最高裁判所が指名する"], a:0, e:"正解は「国会議員の中から国会の議決で指名される」です。内閣総理大臣は国会議員の中から、国会の議決によって指名されます。「国民の直接選挙で選ばれる」は誤りで、日本では大統領制のような国民の直接選挙による首相選出は行われておらず、国会による指名という間接的な手続きがとられます。「天皇が任意に任命する」は誤りで、天皇は国会が指名した人物を形式的に任命する国事行為を行うにとどまり、任意に選ぶ権限は持ちません。「最高裁判所が指名する」は誤りで、内閣総理大臣の指名は国会の役割であり、司法を担う最高裁判所の役割ではありません。"},
  {id:"civ207", cat:"公民", sub:"政治体制", q:"最高裁判所の長官を任命するのは誰か。", choices:["天皇","内閣総理大臣","国会","国民"], a:0, e:"正解は「天皇」です。最高裁判所長官は内閣の指名にもとづいて、天皇によって任命されます。「内閣総理大臣」は誤りで、内閣総理大臣は長官を「指名」する役割を持ちますが、最終的に「任命」するのは天皇です。「国会」は誤りで、最高裁判所長官の任命は国会の役割ではありません。「国民」は誤りで、国民が直接最高裁判所長官を選出・任命する制度は日本にはありません。"},
  {id:"civ209", cat:"公民", sub:"法律", q:"裁判は原則として何回まで受けられる仕組みになっているか。", choices:["3回","1回","2回","5回"], a:0, e:"正解は「3回」です。日本では同じ事件について3回まで裁判を受けられる三審制が採用されています。「1回」は誤りで、これでは慎重な審理による誤りの防止という三審制の趣旨が実現できません。「2回」は誤りで、日本の裁判制度は2回ではなく3回までの審理を認める仕組みです。「5回」は誤りで、日本の裁判制度でそこまで多くの審級は設けられておらず、正しくは3回までです。"},
  {id:"civ211", cat:"公民", sub:"法律", q:"第一審の判決に不服がある場合、上級の裁判所に判断を求めることを何というか。", choices:["控訴","上告","再審","起訴"], a:0, e:"正解は「控訴」です。控訴は第一審の判決に不服がある場合に、上級の裁判所に対して再度の審理を求める手続きです。「上告」は誤りで、これは控訴審（第二審）の判決にさらに不服がある場合に、最上級の裁判所に判断を求める手続きであり、第一審からの不服申し立てである控訴とは段階が異なります。「再審」は誤りで、これは確定した判決について、新たな証拠などにより裁判のやり直しを求める特別な制度であり、通常の不服申し立てである控訴とは性質が異なります。「起訴」は誤りで、これは検察官が被疑者を裁判にかける行為であり、判決への不服申し立てとは全く異なる手続きです。"},
  {id:"civ213", cat:"公民", sub:"法律", q:"控訴審の判決にさらに不服がある場合、最上級の裁判所に判断を求めることを何というか。", choices:["上告","控訴","再審","訴訟"], a:0, e:"正解は「上告」です。上告は控訴審の判決にさらに不服がある場合に、最上級の裁判所に対して審理を求める手続きです。「控訴」は誤りで、これは第一審の判決に対する不服申し立てであり、控訴審の判決に対するさらなる不服申し立てである上告とは段階が異なります。「再審」は誤りで、これは確定判決に対する特別な救済手続きであり、通常の審級を経る上告とは性質が異なります。「訴訟」は誤りで、これは裁判手続き全般を指す一般的な言葉であり、特定の不服申し立て手続きを指す上告とは異なります。"},
  {id:"civ215", cat:"公民", sub:"経済", q:"銀行が家計や企業から預かったお金を、必要とする人に貸し出すはたらきを何というか。", choices:["金融","財政","貿易","課税"], a:0, e:"正解は「金融」です。金融はお金に余裕のある人と、お金を必要とする人との間で、銀行などを通じて資金を融通するはたらきです。「財政」は誤りで、これは政府が税金を集めて公共サービスなどに支出する経済活動であり、銀行による資金の貸し借りとは異なる分野です。「貿易」は誤りで、これは国境を越えた商品やサービスの取引を指す言葉であり、資金の融通を指す金融とは異なります。「課税」は誤りで、これは税金を課すことを指す言葉であり、銀行の資金融通機能とは異なる概念です。"},
  {id:"civ217", cat:"公民", sub:"経済", q:"政府が税金を集め、それを公共サービスなどに支出する経済活動を何というか。", choices:["財政","金融","貿易","為替"], a:0, e:"正解は「財政」です。財政は政府が税金などを集め、公共サービスや社会保障などに支出する経済活動のことです。「金融」は誤りで、これは銀行などを通じた資金の貸し借りに関する経済活動であり、政府の税金・支出に関する財政とは異なる分野です。「貿易」は誤りで、これは国境を越えた商品・サービスの取引を指す言葉であり、財政とは異なります。「為替」は誤りで、これは異なる通貨間の交換に関する事柄であり、政府の税金・支出活動である財政とは異なる概念です。"},
  {id:"civ219", cat:"公民", sub:"経済", q:"景気が悪いときに政府が行う財政政策として正しいものはどれか。", choices:["公共事業を増やし減税を行う","公共事業を減らし増税を行う","税金をすべて廃止する","公共事業をすべて中止する"], a:0, e:"正解は「公共事業を増やし減税を行う」です。不況のときには公共事業を増やし減税を行うことで、需要を刺激し景気を回復させる財政政策がとられます。「公共事業を減らし増税を行う」は誤りで、これは景気が過熱しているときにとられる政策であり、不況時の対応とは逆の内容です。「税金をすべて廃止する」は誤りで、これは現実的な財政政策とはいえず、税収がなくなれば公共サービスの提供も困難になります。「公共事業をすべて中止する」は誤りで、これは不況をさらに悪化させる方向の政策であり、景気回復を目指す財政政策の趣旨とは正反対です。"},
  {id:"civ221", cat:"公民", sub:"経済", q:"景気が過熱しているときに日本銀行が行う金融政策として正しいものはどれか。", choices:["金利を引き上げる","金利を引き下げる","紙幣を大量に発行する","税金を廃止する"], a:0, e:"正解は「金利を引き上げる」です。景気が過熱しインフレの懸念があるときには、日本銀行は金利を引き上げて資金の流れを抑制します。「金利を引き下げる」は誤りで、これは不況のときに景気を刺激するためにとられる政策であり、景気過熱時の対応とは逆の内容です。「紙幣を大量に発行する」は誤りで、これは金融緩和に近い措置であり、景気の過熱を抑える目的の政策とは方向性が逆です。「税金を廃止する」は誤りで、これは財政政策に関する極端な内容であり、日本銀行が行う金融政策の手段でもありません。"},
  {id:"civ223", cat:"公民", sub:"経済", q:"商品やサービスの価格が、需要と供給の関係によって決まる仕組みを何というか。", choices:["市場メカニズム","計画経済","財政政策","金融政策"], a:0, e:"正解は「市場メカニズム」です。市場メカニズムは、商品やサービスの価格が需要と供給の関係にもとづいて自動的に決まっていく仕組みです。「計画経済」は誤りで、これは政府が生産や価格を計画的に決定する経済体制であり、市場メカニズムとは正反対の仕組みです。「財政政策」は誤りで、これは政府が税金や公共支出を通じて経済を調整する政策であり、価格決定の仕組みそのものを指す言葉ではありません。「金融政策」は誤りで、これは中央銀行が金利などを通じて経済を調整する政策であり、これも価格決定の仕組みそのものとは異なります。"},
  {id:"civ225", cat:"公民", sub:"経済", q:"少数の企業が市場を支配し、価格や生産量を協定して決めることを何というか。", choices:["カルテル","フェアトレード","独占禁止","規制緩和"], a:0, e:"正解は「カルテル」です。カルテルは少数の企業が価格や生産量について協定を結び、市場を実質的に支配する行為で、独占禁止法で規制されています。「フェアトレード」は誤りで、これは発展途上国の生産者に公正な対価を支払う貿易の仕組みであり、企業間の価格協定とは全く異なる概念です。「独占禁止」は誤りで、これはカルテルなどを規制する側の考え方・政策を指す言葉であり、カルテル行為そのものを指すものではありません。「規制緩和」は誤りで、これは政府による規制を緩めることを指す言葉であり、企業間の協定であるカルテルとは異なる概念です。"},
  {id:"civ227", cat:"公民", sub:"労働・法律", q:"労働者が使用者と労働条件について話し合うことを何というか。", choices:["団体交渉","団体行動","団結","雇用契約"], a:0, e:"正解は「団体交渉」です。団体交渉は労働組合が使用者と、賃金や労働時間などの労働条件について話し合う権利です。「団体行動」は誤りで、これはストライキなど、労働者が団結して行動する権利であり、話し合いを指す団体交渉とは異なる権利です。「団結」は誤りで、これは労働者が労働組合を結成する権利を指す言葉であり、使用者との話し合いを指す団体交渉とは異なります。「雇用契約」は誤りで、これは労働者と使用者の間の労働に関する契約そのものを指す言葉であり、話し合いの権利である団体交渉とは異なる概念です。"},
  {id:"civ229", cat:"公民", sub:"労働・法律", q:"労働者が要求実現のため業務を停止するなどして使用者に圧力をかける行為を何というか。", choices:["ストライキ","団体交渉","団結","解雇"], a:0, e:"正解は「ストライキ」です。ストライキは労働者が団結して業務を停止するなどし、要求の実現を目指す団体行動権の代表的な行使方法です。「団体交渉」は誤りで、これは労働条件について話し合う権利であり、業務を停止して圧力をかけるストライキとは異なる行為です。「団結」は誤りで、これは労働組合を結成する権利を指す言葉であり、実際の行動であるストライキとは異なります。「解雇」は誤りで、これは使用者が労働者を辞めさせる行為であり、労働者側が行うストライキとは主体・内容が全く異なります。"},
  {id:"civ231", cat:"公民", sub:"労働・法律", q:"労働時間や休日など、労働条件の最低基準を定めた法律は何か。", choices:["労働基準法","労働組合法","労働関係調整法","男女雇用機会均等法"], a:0, e:"正解は「労働基準法」です。労働基準法は労働時間・休日・賃金など、労働条件の最低基準を定めた法律です。「労働組合法」は誤りで、これは労働組合の結成や団体交渉権などを保障する法律であり、労働条件の最低基準を定める労働基準法とは内容が異なります。「労働関係調整法」は誤りで、これは労使間の紛争調整の手続きなどを定める法律であり、労働条件の最低基準そのものを定めるものではありません。「男女雇用機会均等法」は誤りで、これは雇用における男女差別の禁止に特化した法律であり、労働条件全般の最低基準を定める労働基準法とは異なります。"},
  {id:"civ233", cat:"公民", sub:"国際関係", q:"国際連合の本部が置かれている都市はどこか。", choices:["ニューヨーク","ジュネーブ","ハーグ","パリ"], a:0, e:"正解は「ニューヨーク」です。国際連合の本部はアメリカのニューヨークに置かれています。「ジュネーブ」は誤りで、これはスイスの都市であり、国連の欧州本部など一部機関は置かれていますが、国連本部そのものはニューヨークにあります。「ハーグ」は誤りで、これはオランダの都市であり、国際司法裁判所などが置かれていますが、国連本部ではありません。「パリ」は誤りで、これはユネスコ本部が置かれているフランスの都市ですが、国連本部はニューヨークです。"},
  {id:"civ235", cat:"公民", sub:"国際関係", q:"国連教育科学文化機関の略称は何か。", choices:["ユネスコ","ユニセフ","WHO","WTO"], a:0, e:"正解は「ユネスコ」です。ユネスコ（UNESCO）は教育・科学・文化の分野での国際協力を目的とする国連の専門機関です。「ユニセフ」は誤りで、これは国連児童基金の略称であり、子どもの権利や福祉を担当する別の機関です。「WHO」は誤りで、これは世界保健機関の略称であり、健康・医療分野を担当する機関です。「WTO」は誤りで、これは世界貿易機関の略称であり、貿易分野を担当する機関であって、教育・科学・文化を担当するユネスコとは分野が異なります。"},
  {id:"civ237", cat:"公民", sub:"国際関係", q:"国連児童基金の略称は何か。", choices:["ユニセフ","ユネスコ","WHO","ILO"], a:0, e:"正解は「ユニセフ」です。ユニセフ（UNICEF）は世界の子どもたちの命と健康、権利を守ることを目的とする国連の機関です。「ユネスコ」は誤りで、これは教育・科学・文化分野を担当する機関であり、子ども支援に特化したユニセフとは役割が異なります。「WHO」は誤りで、これは健康・医療分野全般を担当する機関であり、子どもに特化したユニセフとは対象が異なります。「ILO」は誤りで、これは労働分野の国際協力を担当する機関であり、子どもの権利保護を主目的とするユニセフとは異なります。"},
  {id:"civ239", cat:"公民", sub:"国際関係", q:"世界保健機関の略称は何か。", choices:["WHO","WTO","UNESCO","UNICEF"], a:0, e:"正解は「WHO」です。WHO（世界保健機関）は感染症対策や健康分野の国際協力を担う国連の専門機関です。「WTO」は誤りで、これは世界貿易機関の略称であり、貿易分野を担当する機関であって、健康分野を担当するWHOとは異なります。「UNESCO」は誤りで、これは教育・科学・文化分野を担当する機関であり、健康分野に特化したWHOとは異なります。「UNICEF」は誤りで、これは子どもの権利や福祉を担当する機関であり、健康分野全般を担当するWHOとは対象範囲が異なります。"},
  {id:"civ241", cat:"公民", sub:"国際関係", q:"発展途上国の中でも、急速に工業化を進め経済成長を遂げた国々を何というか。", choices:["新興工業経済地域","後発発展途上国","石油輸出国","先進工業国"], a:0, e:"正解は「新興工業経済地域」です。新興工業経済地域（NIES）は、韓国やシンガポールなど急速に工業化を進めた国や地域を指します。「後発発展途上国」は誤りで、これは発展途上国の中でも特に開発が遅れている国々を指す言葉であり、急速に工業化を遂げた国を指す新興工業経済地域とは正反対の性質です。「石油輸出国」は誤りで、これは石油資源の輸出に依存する国を指す言葉であり、工業化の進展度に着目した新興工業経済地域とは異なる分類軸です。「先進工業国」は誤りで、これはすでに高度な工業化を遂げた欧米や日本などの国を指し、新興工業経済地域（発展途上国から工業化を遂げた国）とは区別されます。"},
  {id:"civ243", cat:"公民", sub:"経済", q:"複数の国にまたがって生産や販売の拠点を持ち、世界的に活動する企業を何というか。", choices:["多国籍企業","中小企業","国営企業","協同組合"], a:0, e:"正解は「多国籍企業」です。多国籍企業は複数の国に生産拠点や販売網を持ち、世界規模で事業を展開する企業のことです。「中小企業」は誤りで、これは規模の小さい企業を指す言葉であり、複数国での事業展開という多国籍企業の特徴とは異なる分類軸です。「国営企業」は誤りで、これは国が所有・運営する企業を指す言葉であり、民間企業が多い多国籍企業とは所有形態が異なります。「協同組合」は誤りで、これは組合員が共同で運営する組織形態であり、株式会社形態が多い多国籍企業とは組織のあり方が異なります。"},
  {id:"civ245", cat:"公民", sub:"経済", q:"景気変動のうち、生産や消費が活発になり物価が上昇する局面を何というか。", choices:["好況","不況","恐慌","デフレーション"], a:0, e:"正解は「好況」です。好況（好景気）は生産や消費が活発になり、企業の利益や雇用が拡大し、一般に物価も上昇する局面です。「不況」は誤りで、これは好況とは逆に、生産や消費が停滞する局面を指す言葉です。「恐慌」は誤りで、これは不況が急激かつ深刻化した状態を指す言葉であり、好況とは正反対の状況です。「デフレーション」は誤りで、これは物価が継続的に下落する現象を指す言葉であり、物価上昇を伴う好況とは異なる経済状況を指します。"},
  {id:"civ247", cat:"公民", sub:"経済", q:"景気変動のうち、生産が縮小し失業者が増加する局面を何というか。", choices:["不況","好況","バブル","インフレーション"], a:0, e:"正解は「不況」です。不況（不景気）は生産や消費が停滞し、企業の利益が減少して失業者が増加する局面です。「好況」は誤りで、これは不況とは逆に、生産や消費が活発になる局面を指す言葉です。「バブル」は誤りで、これは資産価格が実体経済とかけ離れて異常に高騰する状態を指し、不況とは異なる現象です。「インフレーション」は誤りで、これは物価が継続的に上昇する現象を指す言葉であり、生産縮小・失業増加を意味する不況とは異なる概念です。"},
  /* 日本史 */
  {id:"his257", cat:"日本史", sub:"古代", q:"縄文時代の人々が食べ物の残りかすなどを捨てた跡を何というか。", choices:["貝塚","古墳","登呂遺跡","環壕集落"], a:0, e:"正解は「貝塚」です。貝塚は縄文時代の人々が貝殻や動物の骨などの生活のごみを捨てた跡で、当時の生活を知る手がかりとなります。「古墳」は誤りで、これは古墳時代（縄文時代より後）に豪族の墓として築かれたものであり、生活のごみとは無関係です。「登呂遺跡」は誤りで、これは弥生時代の水田跡などで知られる特定の遺跡の名称であり、貝塚という一般的な地形・遺構の種類を指す言葉ではありません。「環壕集落」は誤りで、これは弥生時代につくられた、溝で囲まれたムラの遺跡であり、縄文時代のごみ捨て場である貝塚とは時代・性質が異なります。"},
  {id:"his259", cat:"日本史", sub:"古代", q:"弥生時代につくられた、周囲を溝で囲んだムラの遺跡を何というか。", choices:["環壕集落","古墳","貝塚","高床倉庫"], a:0, e:"正解は「環壕集落」です。環壕集落は弥生時代につくられた、外敵から身を守るため周囲を溝で囲んだムラの跡です。「古墳」は誤りで、これは古墳時代に豪族の墓として築かれたものであり、居住のためのムラとは目的が異なります。「貝塚」は誤りで、これは縄文時代のごみ捨て場の跡であり、防御のための集落である環壕集落とは性質が異なります。「高床倉庫」は誤りで、これは湿気やねずみを防ぐために床を高くした倉庫であり、集落全体を指す環壕集落とは規模・性質が異なります。"},
  {id:"his261", cat:"日本史", sub:"古代", q:"古墳時代に各地の豪族の墓としてつくられた、鍵穴形をした古墳を何というか。", choices:["前方後円墳","円墳","方墳","貝塚"], a:0, e:"正解は「前方後円墳」です。前方後円墳は古墳時代に各地の豪族の墓として築かれた、上から見ると鍵穴のような形をした古墳です。「円墳」は誤りで、これは円形の古墳を指す言葉であり、鍵穴形をした前方後円墳とは形状が異なります。「方墳」は誤りで、これは四角形の古墳を指す言葉であり、これも鍵穴形とは異なる形状です。「貝塚」は誤りで、これは縄文時代のごみ捨て場の跡であり、古墳時代の墓である前方後円墳とは時代・性質が全く異なります。"},
  {id:"his263", cat:"日本史", sub:"平安時代", q:"平安時代に紫式部が著した長編小説は何か。", choices:["源氏物語","枕草子","万葉集","古事記"], a:0, e:"正解は「源氏物語」です。「源氏物語」は平安時代中期に紫式部によって著された、日本を代表する長編小説です。「枕草子」は誤りで、これは同じ平安時代に清少納言が著した随筆であり、紫式部の作品ではありません。「万葉集」は誤りで、これは奈良時代に成立した日本最古の和歌集であり、平安時代の紫式部の作品ではありません。「古事記」は誤りで、これは奈良時代に成立した歴史書であり、紫式部が著した小説とは時代・ジャンルが異なります。"},
  {id:"his265", cat:"日本史", sub:"平安時代", q:"平安時代に清少納言が著した随筆は何か。", choices:["枕草子","源氏物語","徒然草","方丈記"], a:0, e:"正解は「枕草子」です。「枕草子」は平安時代中期に清少納言によって著された随筆で、宮廷生活の様子が描かれています。「源氏物語」は誤りで、これは同じ平安時代に紫式部が著した長編小説であり、清少納言の作品ではありません。「徒然草」は誤りで、これは鎌倉時代末期に吉田兼好が著した随筆であり、平安時代の清少納言の作品とは時代が異なります。「方丈記」は誤りで、これは鎌倉時代に鴨長明が著した随筆であり、これも清少納言とは時代・著者が異なります。"},
  {id:"his267", cat:"日本史", sub:"鎌倉・室町", q:"鎌倉時代に運慶らによってつくられた、東大寺南大門にある力強い彫刻は何か。", choices:["金剛力士像","阿弥陀如来像","釈迦三尊像","大仏"], a:0, e:"正解は「金剛力士像」です。金剛力士像は鎌倉時代に運慶らによってつくられた、東大寺南大門に置かれた力強い彫刻です。「阿弥陀如来像」は誤りで、これは阿弥陀信仰にもとづく仏像の一種であり、運慶らによる東大寺南大門の彫刻を指すものではありません。「釈迦三尊像」は誤りで、これは釈迦を中心とした仏像群を指す一般的な言葉であり、特定の運慶作品を指すものではありません。「大仏」は誤りで、これは奈良時代に聖武天皇の命で東大寺に造られた仏像であり、鎌倉時代の運慶らによる金剛力士像とは時代が異なります。"},
  {id:"his269", cat:"日本史", sub:"鎌倉・室町", q:"室町時代に足利義満の保護のもとで大成された、能を演じる舞台芸能を何というか。", choices:["能楽","歌舞伎","狂言のみ","浄瑠璃"], a:0, e:"正解は「能楽」です。能楽は室町時代に観阿弥・世阿弥父子が大成し、足利義満の保護を受けて発展した舞台芸能です。「歌舞伎」は誤りで、これは江戸時代に発展した舞台芸能であり、室町時代の能楽とは時代が異なります。「狂言のみ」は誤りで、狂言は能楽と密接に関連する滑稽な芸能ですが、足利義満の保護のもとで大成されたのは能楽全体（観阿弥・世阿弥による）を指すのが適切です。「浄瑠璃」は誤りで、これも江戸時代に発展した語り物芸能であり、室町時代の能楽とは時代が異なります。"},
  {id:"his271", cat:"日本史", sub:"戦国・江戸", q:"1549年、日本にキリスト教を伝えた宣教師は誰か。", choices:["フランシスコ・ザビエル","マルコ・ポーロ","バスコ・ダ・ガマ","コロンブス"], a:0, e:"正解は「フランシスコ・ザビエル」です。フランシスコ・ザビエルは1549年に鹿児島に上陸し、日本にキリスト教（カトリック）を伝えました。「マルコ・ポーロ」は誤りで、彼は13世紀に活躍した旅行家であり、「東方見聞録」で知られますが、日本に直接キリスト教を伝えた人物ではありません。「バスコ・ダ・ガマ」は誤りで、彼はインド航路を開拓した航海者であり、日本へのキリスト教伝来とは無関係です。「コロンブス」は誤りで、彼は西インド諸島に到達した航海者であり、日本とは無関係です。"},
  {id:"his273", cat:"日本史", sub:"戦国・江戸", q:"1637年、キリシタンへの弾圧や重税に反発して九州で起こった一揆を何というか。", choices:["島原・天草一揆","大塩平八郎の乱","打ちこわし","米騒動"], a:0, e:"正解は「島原・天草一揆」です。島原・天草一揆（1637年）はキリシタンへの弾圧と重税に苦しんだ農民らが起こした大規模な一揆です。「大塩平八郎の乱」は誤りで、これは1837年に元大坂町奉行所役人が起こした乱であり、時期も性質も島原・天草一揆とは異なります。「打ちこわし」は誤りで、これは米価高騰などに対して都市の民衆が商家などを襲った行動を指す一般的な言葉であり、特定の1637年の一揆を指すものではありません。「米騒動」は誤りで、これは1918年に起こった、米価高騰に対する民衆運動であり、時代が大きく異なります。"},
  {id:"his275", cat:"日本史", sub:"江戸時代", q:"江戸時代、幕府の学問所として朱子学を教えた機関は何か。", choices:["昌平坂学問所","寺子屋","藩校のみ","私塾のみ"], a:0, e:"正解は「昌平坂学問所」です。昌平坂学問所は江戸幕府が設立した学問所で、正学とされた朱子学が教えられました。「寺子屋」は誤りで、これは庶民の子どもが読み書きなどを学んだ民間の教育機関であり、幕府直轄の学問所とは性質が異なります。「藩校のみ」は誤りで、藩校は各藩が設立した教育機関であり、幕府が設立した昌平坂学問所とは設立主体が異なります。「私塾のみ」は誤りで、私塾は個人が開いた学問所であり、幕府直轄の昌平坂学問所とは性質が異なります。"},
  {id:"his277", cat:"日本史", sub:"江戸時代", q:"江戸時代、町人や農民の子どもが読み書きやそろばんを学んだ民間の教育機関を何というか。", choices:["寺子屋","昌平坂学問所","藩校","国学所"], a:0, e:"正解は「寺子屋」です。寺子屋は江戸時代に町人や農民の子どもが読み書きやそろばんを学んだ、庶民のための教育機関です。「昌平坂学問所」は誤りで、これは幕府が設立した、主に武士のための学問所であり、庶民のための寺子屋とは対象・設立主体が異なります。「藩校」は誤りで、これも各藩の武士の子弟を対象とした教育機関であり、庶民を対象とする寺子屋とは異なります。「国学所」は誤りで、そのような一般的な名称の教育機関は特に確立されておらず、誤った選択肢です。"},
  {id:"his279", cat:"日本史", sub:"近代", q:"1860年、江戸城桜田門外で大老井伊直弼が暗殺された事件を何というか。", choices:["桜田門外の変","生麦事件","禁門の変","池田屋事件"], a:0, e:"正解は「桜田門外の変」です。桜田門外の変（1860年）は、日米修好通商条約の締結などに反発した水戸藩などの浪士が大老井伊直弼を暗殺した事件です。「生麦事件」は誤りで、これは1862年に薩摩藩士がイギリス人を殺傷した事件であり、井伊直弼暗殺とは当事者・内容が異なります。「禁門の変」は誤りで、これは1864年に長州藩が京都で幕府側と衝突した事件であり、井伊直弼暗殺とは異なる出来事です。「池田屋事件」は誤りで、これは1864年に新選組が尊王攘夷派を襲撃した事件であり、これも井伊直弼暗殺とは異なります。"},
  {id:"his281", cat:"日本史", sub:"近代", q:"1867年、徳川慶喜が政権を朝廷に返上した後、天皇を中心とする新政府樹立を宣言した出来事を何というか。", choices:["王政復古の大号令","大政奉還","五箇条の誓文","版籍奉還"], a:0, e:"正解は「王政復古の大号令」です。王政復古の大号令（1867年）は、大政奉還の後に天皇を中心とする新政府の樹立を宣言した出来事です。「大政奉還」は誤りで、これは徳川慶喜が政権を朝廷に返上した行為そのものを指し、王政復古の大号令はその後に行われた新政府樹立の宣言であり、両者は異なる段階の出来事です。「五箇条の誓文」は誤りで、これは1868年に明治天皇が発表した新政府の基本方針を示す文書であり、王政復古の大号令とは別の文書です。「版籍奉還」は誤りで、これは1869年に大名が土地と人民を天皇に返還した改革であり、時期も内容も異なります。"},
  {id:"his283", cat:"日本史", sub:"近代", q:"1881年、板垣退助を党首として結成された、自由民権運動の中心的な政党は何か。", choices:["自由党","立憲改進党","立憲政友会","社会党"], a:0, e:"正解は「自由党」です。自由党（1881年結成）は板垣退助を党首とする、自由民権運動を推進した政党です。「立憲改進党」は誤りで、これは1882年に大隈重信を党首として結成された、自由党とは別の政党です。「立憲政友会」は誤りで、これは1900年に伊藤博文らによって結成された、自由党よりかなり後の政党です。「社会党」は誤りで、これは戦後に結成された政党であり、1881年の自由党とは時代が大きく異なります。"},
  {id:"his285", cat:"日本史", sub:"近代", q:"1882年、大隈重信を党首として結成された政党は何か。", choices:["立憲改進党","自由党","立憲政友会","社会党"], a:0, e:"正解は「立憲改進党」です。立憲改進党（1882年結成）は大隈重信を党首とし、イギリス流の議会政治を目指した政党です。「自由党」は誤りで、これは1881年に板垣退助を党首として結成された、立憲改進党とは別の政党です。「立憲政友会」は誤りで、これは1900年に結成された、より後の時代の政党です。「社会党」は誤りで、これは戦後に結成された政党であり、明治時代の立憲改進党とは時代が大きく異なります。"},
  {id:"his287", cat:"日本史", sub:"近代", q:"1911年、条約改正の完成として日本が達成したこととして正しいものはどれか。", choices:["関税自主権の完全回復","治外法権の獲得","韓国併合","日英同盟の締結"], a:0, e:"正解は「関税自主権の完全回復」です。1911年、日本は関税自主権を完全に回復し、幕末以来の不平等条約改正が達成されました。「治外法権の獲得」は誤りで、日本はむしろ幕末の不平等条約でこれを外国に「認めさせられていた」立場であり、1911年はこれをすでに撤廃した後の段階です。「韓国併合」は誤りで、これは1910年の出来事であり、条約改正の完成とは別の歴史的事象です。「日英同盟の締結」は誤りで、これは1902年の出来事であり、1911年の条約改正完成とは異なる出来事です。"},
  {id:"his289", cat:"日本史", sub:"近代", q:"1918年、原敬が組織した、初の本格的な政党内閣を何というか。", choices:["原敬内閣","第一次伊藤内閣","桂内閣","加藤高明内閣"], a:0, e:"正解は「原敬内閣」です。原敬内閣（1918年成立）は、爵位を持たない衆議院議員を首相とする、初の本格的な政党内閣です。「第一次伊藤内閣」は誤りで、これは1885年に成立した、日本初の内閣であり、原敬内閣（1918年）とは時期も性格も異なります。「桂内閣」は誤りで、これは桂太郎を首相とする内閣であり、藩閥出身者による内閣であって、政党内閣とは性格が異なります。「加藤高明内閣」は誤りで、これは1924年に成立した内閣であり、原敬内閣より後の時期の政党内閣です。"},
  {id:"his291", cat:"日本史", sub:"現代", q:"1936年、陸軍の青年将校らが起こしたクーデター未遂事件を何というか。", choices:["二・二六事件","五・一五事件","満州事変","盧溝橋事件"], a:0, e:"正解は「二・二六事件」です。二・二六事件（1936年）は陸軍の青年将校らが大臣らを殺傷して起こしたクーデター未遂事件です。「五・一五事件」は誤りで、これは1932年に海軍の青年将校らが犬養毅首相を暗殺した事件であり、陸軍による二・二六事件とは首謀者の軍種や年が異なります。「満州事変」は誤りで、これは1931年に関東軍が起こした軍事行動であり、国内でのクーデター未遂である二・二六事件とは性質が異なります。「盧溝橋事件」は誤りで、これは1937年に日中戦争のきっかけとなった事件であり、二・二六事件とは全く別の出来事です。"},
  {id:"his293", cat:"日本史", sub:"現代", q:"1932年、海軍の青年将校らが犬養毅首相を暗殺した事件を何というか。", choices:["五・一五事件","二・二六事件","桜田門外の変","米騒動"], a:0, e:"正解は「五・一五事件」です。五・一五事件（1932年）は海軍の青年将校らが犬養毅首相を暗殺した事件で、政党政治が終わる一因となりました。「二・二六事件」は誤りで、これは1936年に陸軍の青年将校らが起こした事件であり、海軍による五・一五事件とは軍種・年が異なります。「桜田門外の変」は誤りで、これは1860年に幕末の浪士が大老井伊直弼を暗殺した事件であり、時代が大きく異なります。「米騒動」は誤りで、これは1918年に起こった民衆運動であり、暗殺事件である五・一五事件とは性質が異なります。"},
  {id:"his295", cat:"日本史", sub:"現代", q:"1945年7月、日本に無条件降伏を求めて連合国が発表した宣言を何というか。", choices:["ポツダム宣言","カイロ宣言","大西洋憲章","ヤルタ協定"], a:0, e:"正解は「ポツダム宣言」です。ポツダム宣言（1945年7月）は連合国が日本に無条件降伏を求めて発表した宣言で、日本は8月にこれを受諾しました。「カイロ宣言」は誤りで、これは1943年に発表された、日本の戦後処理方針に関する宣言であり、無条件降伏を直接求めたポツダム宣言とは異なる時期・内容の宣言です。「大西洋憲章」は誤りで、これは1941年に米英首脳が発表した、戦後の平和構想の原則を示す宣言であり、対日降伏要求とは異なります。「ヤルタ協定」は誤りで、これは1945年2月に米英ソの首脳が結んだ協定であり、7月のポツダム宣言とは時期・内容が異なります。"},
  {id:"his297", cat:"日本史", sub:"現代", q:"1972年、アメリカから日本に返還された地域はどこか。", choices:["沖縄","小笠原諸島のみ","北方領土","竹島"], a:0, e:"正解は「沖縄」です。沖縄は1972年、アメリカから日本に返還され、沖縄県として日本の施政下に復帰しました。「小笠原諸島のみ」は誤りで、小笠原諸島の返還は1968年であり、1972年の沖縄返還とは時期が異なります。「北方領土」は誤りで、これは現在もロシアとの間で帰属をめぐる問題が続いており、1972年に日本に返還された事実はありません。「竹島」は誤りで、これも現在韓国との間で帰属をめぐる問題があり、1972年にアメリカから返還された地域ではありません。"},
  {id:"his299", cat:"日本史", sub:"現代", q:"1993年、非自民8党派の連立により内閣を組織した人物は誰か。", choices:["細川護熙","小泉純一郎","田中角栄","佐藤栄作"], a:0, e:"正解は「細川護熙」です。細川護熙は1993年、非自民8党派による連立内閣を組織し、55年体制を終わらせました。「小泉純一郎」は誤りで、彼は2001年に首相となった人物であり、1993年の非自民連立政権誕生とは時期が異なります。「田中角栄」は誤りで、彼は1972年に日中共同声明に調印した首相であり、1993年の連立政権誕生とは別の時代の人物です。「佐藤栄作」は誤りで、彼は1960〜70年代に活躍した首相であり、1993年とは時代が大きく異なります。"},
  {id:"his301", cat:"日本史", sub:"現代", q:"1972年、日本の首相として日中共同声明に調印した人物は誰か。", choices:["田中角栄","佐藤栄作","池田勇人","岸信介"], a:0, e:"正解は「田中角栄」です。田中角栄首相は1972年、中国を訪問して日中共同声明に調印し、日中国交正常化を実現しました。「佐藤栄作」は誤りで、彼は田中角栄の前の首相であり、沖縄返還などに関わりましたが、日中共同声明の調印者ではありません。「池田勇人」は誤りで、彼は1960年代前半に所得倍増計画を掲げた首相であり、1972年の日中共同声明とは時期が異なります。「岸信介」は誤りで、彼は1960年の日米安全保障条約改定に関わった首相であり、日中共同声明とは異なる出来事に関わった人物です。"},
  {id:"his303", cat:"日本史", sub:"現代", q:"1951年、内閣総理大臣としてサンフランシスコ平和条約に調印した人物は誰か。", choices:["吉田茂","岸信介","佐藤栄作","池田勇人"], a:0, e:"正解は「吉田茂」です。吉田茂首相は1951年、サンフランシスコ平和条約に調印し、日本の独立回復を実現しました。「岸信介」は誤りで、彼は1960年に日米安全保障条約を改定した首相であり、1951年のサンフランシスコ平和条約調印者ではありません。「佐藤栄作」は誤りで、彼は1960〜70年代に活躍した首相であり、1951年の条約調印とは時期が異なります。「池田勇人」は誤りで、彼は1960年代前半に活躍した首相であり、1951年のサンフランシスコ平和条約調印とは時期が異なります。"},
  {id:"his305", cat:"日本史", sub:"現代", q:"1990年代後半以降、市町村の数を減らすために全国で進められた合併の動きを何というか。", choices:["平成の大合併","明治の大合併","昭和の大合併","地方創生"], a:0, e:"正解は「平成の大合併」です。平成の大合併は1990年代後半から2000年代にかけて、行政の効率化などを目的に全国で進められた市町村合併です。「明治の大合併」は誤りで、これは明治時代（19世紀末）に行われた別の時期の市町村合併であり、平成の大合併とは時代が異なります。「昭和の大合併」は誤りで、これは1950年代に行われた別の時期の市町村合併です。「地方創生」は誤りで、これは地方の人口減少などに対応する政策全般を指す言葉であり、市町村合併そのものを指す言葉ではありません。"},
  /* 世界史 */
  {id:"wor251", cat:"世界史", sub:"古代・中世", q:"メソポタミア文明で発明された、粘土板に刻まれた文字を何というか。", choices:["くさび形文字","甲骨文字","象形文字","アルファベット"], a:0, e:"正解は「くさび形文字」です。くさび形文字はメソポタミア文明で発明され、粘土板に刻まれた文字で、行政や商取引の記録に使われました。「甲骨文字」は誤りで、これは古代中国で亀の甲羅や獣骨に刻まれた文字であり、メソポタミアの粘土板文字とは地域・素材が異なります。「象形文字」は誤りで、これは主に古代エジプトで用いられたヒエログリフを指すことが多く、メソポタミアのくさび形文字とは別の文字体系です。「アルファベット」は誤りで、これはフェニキア人が考案したとされる表音文字体系であり、くさび形文字とは成立の経緯・時代が異なります。"},
  {id:"wor253", cat:"世界史", sub:"古代・中世", q:"古代エジプトで発明された、パピルスに記された文字を何というか。", choices:["象形文字（ヒエログリフ）","くさび形文字","甲骨文字","漢字"], a:0, e:"正解は「象形文字（ヒエログリフ）」です。象形文字（ヒエログリフ）は古代エジプトで用いられ、パピルスや石碑などに記されました。「くさび形文字」は誤りで、これはメソポタミア文明で発明され、粘土板に刻まれた文字であり、エジプトのパピルスに記された文字とは地域・素材が異なります。「甲骨文字」は誤りで、これは古代中国の文字であり、エジプトとは地域が異なります。「漢字」は誤りで、これは中国で発達し日本にも伝わった文字体系であり、古代エジプトのヒエログリフとは全く別の文字体系です。"},
  {id:"wor255", cat:"世界史", sub:"古代・中世", q:"古代ギリシャのアテネで発達した、市民が直接政治に参加する政治のあり方を何というか。", choices:["直接民主政","間接民主政","貴族政","君主政"], a:0, e:"正解は「直接民主政」です。古代アテネでは成年男子市民が民会に参加して政治を決定する直接民主政が行われました。「間接民主政」は誤りで、これは代表者を選挙で選んで政治を委ねる仕組みであり、市民が直接参加する古代アテネの政治のあり方とは異なります。「貴族政」は誤りで、これは少数の貴族が政治を支配する体制であり、市民全体が参加する直接民主政とは正反対の性質です。「君主政」は誤りで、これは一人の君主が支配する体制であり、市民が直接政治に参加する古代アテネの体制とは異なります。"},
  {id:"wor257", cat:"世界史", sub:"古代・中世", q:"古代ローマで、王政を廃止した後に成立した政治体制を何というか。", choices:["共和政","帝政","封建制","絶対王政"], a:0, e:"正解は「共和政」です。古代ローマは紀元前509年に王政を廃止し、元老院を中心とする共和政へと移行しました。「帝政」は誤りで、これは共和政の後、紀元前1世紀末以降に成立した皇帝による統治体制であり、王政廃止直後に成立したものではありません。「封建制」は誤りで、これは中世ヨーロッパに見られた領主と家臣の主従関係にもとづく体制であり、古代ローマの共和政とは時代・性質が異なります。「絶対王政」は誤りで、これは近世ヨーロッパに見られた強大な王権による統治体制であり、王政を廃止した古代ローマの体制とは正反対の内容です。"},
  {id:"wor259", cat:"世界史", sub:"古代・中世", q:"14世紀、天文学において地球が太陽の周りを回るとする地動説を唱えた人物は誰か。", choices:["コペルニクス","ガリレオ・ガリレイ","ニュートン","アリストテレス"], a:0, e:"正解は「コペルニクス」です。コペルニクスは16世紀に地動説を唱え、それまでの天動説を覆す考え方を示しました。「ガリレオ・ガリレイ」は誤りで、彼もコペルニクスの地動説を支持し発展させた人物ですが、地動説を最初に体系的に唱えたのはコペルニクスです。「ニュートン」は誤りで、彼は万有引力の法則などで知られる、コペルニクスより後の時代の科学者です。「アリストテレス」は誤りで、彼は古代ギリシャの哲学者であり、むしろ天動説に近い考え方の基礎を築いた人物とされています。"},
  {id:"wor261", cat:"世界史", sub:"ヨーロッパ史", q:"15世紀、フランスを救った救国の少女として知られる人物は誰か。", choices:["ジャンヌ・ダルク","エリザベス1世","マリー・アントワネット","エカチェリーナ2世"], a:0, e:"正解は「ジャンヌ・ダルク」です。ジャンヌ・ダルクは百年戦争の際、フランス軍を率いてイギリス軍からオルレアンを解放しました。「エリザベス1世」は誤りで、彼女は16世紀のイギリス女王であり、フランスを救った人物ではありません。「マリー・アントワネット」は誤りで、彼女は18世紀のフランス王妃であり、フランス革命期に処刑された人物であって、救国の少女とは異なります。「エカチェリーナ2世」は誤りで、彼女は18世紀のロシア女帝であり、フランスとは無関係な人物です。"},
  {id:"wor263", cat:"世界史", sub:"ヨーロッパ史", q:"17世紀のヨーロッパで、国が貿易を管理し輸出を奨励して国富を増やそうとした経済政策を何というか。", choices:["重商主義","重農主義","自由主義経済","社会主義経済"], a:0, e:"正解は「重商主義」です。重商主義は貿易差額により国富を増やそうとする経済政策で、絶対王政期のヨーロッパで広く採用されました。「重農主義」は誤りで、これは18世紀フランスで唱えられた、農業を富の源泉とする経済思想であり、重商主義とは異なる立場です。「自由主義経済」は誤りで、これは市場の自由な取引を重視する考え方であり、国家が貿易を管理する重商主義とは正反対の性質です。「社会主義経済」は誤りで、これは生産手段の共有を目指す経済体制であり、17世紀の重商主義とは全く異なる思想です。"},
  {id:"wor265", cat:"世界史", sub:"ヨーロッパ史", q:"アメリカ独立宣言を主に起草した人物は誰か。", choices:["トマス・ジェファーソン","ジョージ・ワシントン","リンカン","フランクリン"], a:0, e:"正解は「トマス・ジェファーソン」です。トマス・ジェファーソンはアメリカ独立宣言の起草を主導し、後に第3代大統領となりました。「ジョージ・ワシントン」は誤りで、彼は独立戦争の総司令官・初代大統領として知られますが、独立宣言の主な起草者はジェファーソンです。「リンカン」は誤りで、彼は19世紀の第16代大統領であり、南北戦争や奴隷解放宣言で知られますが、独立宣言（18世紀）の起草者ではありません。「フランクリン」は誤りで、彼は独立宣言の起草委員の一人でしたが、主な起草者とされるのはジェファーソンです。"},
  {id:"wor267", cat:"世界史", sub:"ヨーロッパ史", q:"1815年、ナポレオンが最終的に敗北した戦いを何というか。", choices:["ワーテルローの戦い","トラファルガーの海戦","アウステルリッツの戦い","レキシントンの戦い"], a:0, e:"正解は「ワーテルローの戦い」です。ワーテルローの戦い（1815年）でナポレオンはイギリス・プロイセン連合軍に敗れ、皇帝の座を失いました。「トラファルガーの海戦」は誤りで、これは1805年にイギリス海軍がフランス・スペイン連合艦隊を破った海戦であり、ナポレオンの最終的な敗北を決定づけたワーテルローの戦いとは異なる戦いです。「アウステルリッツの戦い」は誤りで、これは1805年にナポレオンが勝利した戦いであり、最終的な敗北とは逆の結果です。「レキシントンの戦い」は誤りで、これはアメリカ独立戦争の緒戦であり、ナポレオンとは無関係な戦いです。"},
  {id:"wor269", cat:"世界史", sub:"ヨーロッパ史", q:"1853年から1856年にかけて、ロシアと英仏連合軍などとの間で戦われた戦争を何というか。", choices:["クリミア戦争","日露戦争","第一次世界大戦","アヘン戦争"], a:0, e:"正解は「クリミア戦争」です。クリミア戦争（1853-1856年）はロシアの南下政策をめぐり、ロシアとイギリス・フランス・オスマン帝国などが戦った戦争です。「日露戦争」は誤りで、これは1904〜1905年に日本とロシアの間で戦われた、クリミア戦争とは異なる時代・当事国の戦争です。「第一次世界大戦」は誤りで、これは1914年に始まった、より後の時代の大規模な戦争です。「アヘン戦争」は誤りで、これは1840年にイギリスと清の間で戦われた戦争であり、クリミア戦争とは当事国が異なります。"},
  {id:"wor271", cat:"世界史", sub:"アジア史", q:"19世紀後半、清が西洋の技術を取り入れて富国強兵を図った運動を何というか。", choices:["洋務運動","義和団事件","辛亥革命","五・四運動"], a:0, e:"正解は「洋務運動」です。洋務運動は19世紀後半、清が西洋の軍事技術などを取り入れて近代化を図った運動です。「義和団事件」は誤りで、これは1899年に起こった、外国勢力の排斥を掲げた民衆運動であり、西洋技術の導入を目指した洋務運動とは方向性が異なります。「辛亥革命」は誤りで、これは1911年に清朝を打倒した革命であり、清朝の枠内での近代化を目指した洋務運動とは性質が異なります。「五・四運動」は誤りで、これは1919年に起こった反帝国主義・反封建の学生運動であり、洋務運動（19世紀後半）とは時代が異なります。"},
  {id:"wor273", cat:"世界史", sub:"アジア史", q:"1857年、イギリスの支配に対しインドで起こった大規模な反乱を何というか。", choices:["インド大反乱（セポイの反乱）","義和団事件","辛亥革命","太平天国の乱"], a:0, e:"正解は「インド大反乱（セポイの反乱）」です。インド大反乱（セポイの反乱）は1857年、イギリス東インド会社のインド人傭兵らが中心となって起こした大規模な反乱です。「義和団事件」は誤りで、これは1899年に中国（清）で起こった、外国勢力排斥の民衆運動であり、インドの反乱とは国・時代が異なります。「辛亥革命」は誤りで、これは1911年に中国で清朝を倒した革命であり、インド大反乱とは国が異なります。「太平天国の乱」は誤りで、これは19世紀半ばに中国で起こった大規模な農民反乱であり、インドの反乱とは国が異なります。"},
  {id:"wor275", cat:"世界史", sub:"アジア史", q:"1899年、清で外国勢力の排斥を掲げて起こった民衆運動を何というか。", choices:["義和団事件","辛亥革命","洋務運動","五・四運動"], a:0, e:"正解は「義和団事件」です。義和団事件（1899年）は「扶清滅洋」を掲げ、外国勢力の排斥を目指した清国内の民衆運動です。「辛亥革命」は誤りで、これは1911年に清朝を打倒した革命であり、外国勢力排斥を掲げた義和団事件とは目的・年代が異なります。「洋務運動」は誤りで、これは西洋技術の導入を目指した運動であり、外国勢力の排斥を掲げた義和団事件とは方向性が正反対です。「五・四運動」は誤りで、これは1919年に起こった学生運動であり、義和団事件（1899年）とは時代が異なります。"},
  {id:"wor277", cat:"世界史", sub:"両大戦期", q:"1917年、アメリカが第一次世界大戦に参戦するきっかけの一つとなった、ドイツによる作戦は何か。", choices:["無制限潜水艦作戦","電撃作戦","ノルマンディー上陸作戦","バルバロッサ作戦"], a:0, e:"正解は「無制限潜水艦作戦」です。ドイツの無制限潜水艦作戦はアメリカの船舶にも被害を与え、アメリカが第一次世界大戦に参戦するきっかけの一つとなりました。「電撃作戦」は誤りで、これは第二次世界大戦でドイツが用いた戦術であり、第一次世界大戦の出来事ではありません。「ノルマンディー上陸作戦」は誤りで、これは1944年、第二次世界大戦における連合国側の作戦であり、第一次世界大戦とは全く異なる時代の出来事です。「バルバロッサ作戦」は誤りで、これも第二次世界大戦でドイツがソ連に侵攻した作戦であり、第一次世界大戦とは無関係です。"},
  {id:"wor279", cat:"世界史", sub:"両大戦期", q:"世界恐慌後、アメリカのフランクリン・ルーズベルト大統領が行った、公共事業を通じて景気回復を図った政策を何というか。", choices:["ニューディール政策","マーシャル・プラン","ドッジ・ライン","五か年計画"], a:0, e:"正解は「ニューディール政策」です。ニューディール政策はルーズベルト大統領が世界恐慌からの回復を目指し、公共事業などを通じて実施した一連の政策です。「マーシャル・プラン」は誤りで、これは第二次世界大戦後、アメリカがヨーロッパ復興のために行った援助計画であり、世界恐慌対策のニューディール政策とは時代・目的が異なります。「ドッジ・ライン」は誤りで、これは戦後日本のインフレ抑制のために行われた経済政策であり、アメリカのニューディール政策とは国・時代が異なります。「五か年計画」は誤りで、これはソ連が実施した計画経済にもとづく政策であり、アメリカの政策ではありません。"},
  {id:"wor281", cat:"世界史", sub:"両大戦期", q:"1936年から1939年にかけて、フランコ将軍らの反乱軍と共和国政府軍の間で戦われた戦争を何というか。", choices:["スペイン内戦","クリミア戦争","朝鮮戦争","ベトナム戦争"], a:0, e:"正解は「スペイン内戦」です。スペイン内戦（1936-1939年）はフランコ将軍らの反乱軍が勝利し、その後フランコの独裁体制が続きました。「クリミア戦争」は誤りで、これは19世紀半ばにロシアと英仏連合軍などが戦った戦争であり、20世紀のスペイン内戦とは時代・当事国が異なります。「朝鮮戦争」は誤りで、これは1950年に朝鮮半島で始まった戦争であり、スペイン内戦とは地域・時代が異なります。「ベトナム戦争」は誤りで、これも東南アジアで起こった別の戦争であり、スペイン内戦とは異なります。"},
  {id:"wor283", cat:"世界史", sub:"両大戦期", q:"1941年、アメリカとイギリスの首脳が戦後の国際秩序の原則を示した宣言を何というか。", choices:["大西洋憲章","ポツダム宣言","カイロ宣言","ヤルタ協定"], a:0, e:"正解は「大西洋憲章」です。大西洋憲章（1941年）はアメリカとイギリスの首脳が発表した、戦後の平和構想の原則を示す宣言で、後の国際連合設立にも影響しました。「ポツダム宣言」は誤りで、これは1945年に日本に無条件降伏を求めて発表された宣言であり、大西洋憲章（1941年）とは時期・内容が異なります。「カイロ宣言」は誤りで、これは1943年に米英中の首脳が対日処理方針を示した宣言であり、大西洋憲章とは異なる時期・内容です。「ヤルタ協定」は誤りで、これは1945年に米英ソの首脳が結んだ協定であり、これも大西洋憲章とは異なる時期のものです。"},
  {id:"wor285", cat:"世界史", sub:"現代", q:"国際連合の安全保障理事会において、拒否権を持つ常任理事国に含まれない国はどこか。", choices:["ドイツ","アメリカ","中国","ロシア"], a:0, e:"正解は「ドイツ」です。安全保障理事会の常任理事国はアメリカ・イギリス・フランス・ロシア・中国の5か国であり、ドイツは含まれません。「アメリカ」「中国」「ロシア」はいずれも誤り（正しい選択、つまり実際に常任理事国に含まれる）で、これらはまさに安全保障理事会の常任理事国を構成する国の一部です。"},
  {id:"wor287", cat:"世界史", sub:"現代", q:"1953年に休戦協定が結ばれた朝鮮戦争で、南北の境界線として設定されたのはどこか。", choices:["北緯38度線","北緯30度線","北緯45度線","北緯50度線"], a:0, e:"正解は「北緯38度線」です。朝鮮戦争の休戦協定により、北緯38度線付近を軍事境界線として南北朝鮮の分断が固定化されました。「北緯30度線」は誤りで、これは実際の軍事境界線の緯度とは異なる位置です。「北緯45度線」は誤りで、これも朝鮮半島の分断線とは異なる緯度です。「北緯50度線」は誤りで、これも実際の朝鮮半島の軍事境界線の位置とは異なります。"},
  {id:"wor289", cat:"世界史", sub:"現代", q:"1954年、東南アジアにおける共産主義の拡大を防ぐことを目的にアメリカなどが結成した軍事同盟を何というか。", choices:["SEATO","ASEAN","NATO","ワルシャワ条約機構"], a:0, e:"正解は「SEATO」です。東南アジア条約機構（SEATO）は1954年、東南アジアでの共産主義の拡大を防ぐためアメリカなどが結成した軍事同盟です。「ASEAN」は誤りで、これは1967年に結成された、東南アジア諸国自身による地域協力機構であり、アメリカ主導の軍事同盟であるSEATOとは性質・結成主体が異なります。「NATO」は誤りで、これはヨーロッパを中心とする資本主義陣営の軍事同盟であり、東南アジアを対象としたSEATOとは対象地域が異なります。「ワルシャワ条約機構」は誤りで、これは社会主義陣営の軍事同盟であり、資本主義陣営が結成したSEATOとは陣営が異なります。"},
  {id:"wor291", cat:"世界史", sub:"現代", q:"1960年、多くのアフリカ諸国が独立を果たしたことから、この年は何と呼ばれるか。", choices:["アフリカの年","独立の年","南南問題の年","冷戦終結の年"], a:0, e:"正解は「アフリカの年」です。1960年には17ものアフリカ諸国が独立を果たしたことから、この年は「アフリカの年」と呼ばれています。「独立の年」は誤りで、これは1960年を指す一般的な通称ではなく、正式には「アフリカの年」という呼び方が定着しています。「南南問題の年」は誤りで、これはそのような特定の年を指す呼称ではなく、南南問題は経済格差に関する継続的な課題を指す言葉です。「冷戦終結の年」は誤りで、冷戦終結は1989年前後の出来事であり、1960年とは時代が異なります。"},
  {id:"wor293", cat:"世界史", sub:"現代", q:"1997年、イギリスから中国に返還された地域はどこか。", choices:["香港","マカオ","台湾","シンガポール"], a:0, e:"正解は「香港」です。香港は1997年、イギリスから中国に返還され、一国二制度のもとで特別行政区とされました。「マカオ」は誤りで、これは1999年にポルトガルから中国に返還された地域であり、1997年のイギリスからの返還とは宗主国・年が異なります。「台湾」は誤りで、台湾は1997年に中国に返還された地域ではなく、独自の政治体制が続いています。「シンガポール」は誤りで、これは1965年にマレーシアから独立した国であり、1997年の中国への返還とは無関係です。"},
  {id:"wor295", cat:"世界史", sub:"現代", q:"1999年、ポルトガルから中国に返還された地域はどこか。", choices:["マカオ","香港","台湾","シンガポール"], a:0, e:"正解は「マカオ」です。マカオは1999年、ポルトガルから中国に返還され、香港と同様に特別行政区とされました。「香港」は誤りで、これは1997年にイギリスから中国に返還された地域であり、1999年のポルトガルからの返還とは宗主国・年が異なります。「台湾」は誤りで、台湾は1999年に中国に返還された地域ではありません。「シンガポール」は誤りで、これは独立国であり、1999年の中国への返還とは無関係です。"},
  {id:"wor297", cat:"世界史", sub:"現代", q:"核兵器を持つ国をこれ以上増やさないことを目的とした国際条約を何というか。", choices:["核拡散防止条約（NPT）","京都議定書","パリ協定","ワシントン条約"], a:0, e:"正解は「核拡散防止条約（NPT）」です。核拡散防止条約（NPT）は核兵器を持つ国をこれ以上増やさないことなどを目的とした国際条約です。「京都議定書」は誤りで、これは地球温暖化対策に関する条約であり、核兵器の拡散防止とは全く異なる分野の条約です。「パリ協定」は誤りで、これも気候変動対策に関する国際的な枠組みであり、核兵器とは無関係です。「ワシントン条約」は誤りで、これは絶滅のおそれのある野生動植物の国際取引を規制する条約であり、核兵器の拡散防止とは異なる分野です。"},
  {id:"wor299", cat:"世界史", sub:"現代", q:"国連の枠組みのもとで、紛争地域の平和維持や復興を支援するために行われる活動を何というか。", choices:["PKO（平和維持活動）","ODA","NGO活動","WTO交渉"], a:0, e:"正解は「PKO（平和維持活動）」です。PKO（平和維持活動）は国連の枠組みのもとで、紛争地域の停戦監視や復興支援などを行う活動です。「ODA」は誤りで、これは政府開発援助を指す言葉であり、紛争地域の平和維持活動とは異なる分野の国際協力です。「NGO活動」は誤りで、これは非政府組織による民間の活動を指す言葉であり、国連の枠組みで行われるPKOとは主体が異なります。「WTO交渉」は誤りで、これは貿易に関する交渉を指す言葉であり、平和維持活動とは全く異なる分野です。"},
  /* 地理 */
  {id:"geo249", cat:"地理", sub:"世界地理", q:"地球上の位置を表すために用いられる、赤道を基準とした横方向の座標を何というか。", choices:["緯度","経度","標高","縮尺"], a:0, e:"正解は「緯度」です。緯度は赤道を基準（0度）として、南北方向の位置を角度で表す座標です。「経度」は誤りで、これは本初子午線を基準とした東西方向の座標であり、緯度（南北方向）とは基準線・方向が異なります。「標高」は誤りで、これは海面からの高さを表す指標であり、地球上の水平位置を示す緯度とは異なる種類の指標です。「縮尺」は誤りで、これは地図上の長さと実際の距離との比率を示すものであり、位置を表す座標とは異なる概念です。"},
  {id:"geo251", cat:"地理", sub:"世界地理", q:"地球上の位置を表すために用いられる、本初子午線を基準とした縦方向の座標を何というか。", choices:["経度","緯度","標高","縮尺"], a:0, e:"正解は「経度」です。経度は本初子午線（0度）を基準として、東西方向の位置を角度で表す座標です。「緯度」は誤りで、これは赤道を基準とした南北方向の座標であり、経度（東西方向）とは基準線・方向が異なります。「標高」は誤りで、これは海面からの高さを表す指標であり、水平位置を示す経度とは異なります。「縮尺」は誤りで、これは地図上の距離の比率を示すものであり、位置を表す経度とは異なる概念です。"},
  {id:"geo253", cat:"地理", sub:"世界地理", q:"経度0度の基準線で、イギリスのグリニッジ天文台を通る線を何というか。", choices:["本初子午線","赤道","回帰線","日付変更線"], a:0, e:"正解は「本初子午線」です。本初子午線はイギリスのグリニッジ天文台を通る経度0度の基準線です。「赤道」は誤りで、これは緯度0度の基準線であり、経度0度の基準線である本初子午線とは異なります。「回帰線」は誤りで、これは太陽が真上にくる限界の緯線（北回帰線・南回帰線）を指し、経度の基準線ではありません。「日付変更線」は誤りで、これは太平洋上にほぼ設定された、日付を調整するための線であり、経度0度の基準線とは別の線です。"},
  {id:"geo255", cat:"地理", sub:"世界地理", q:"太平洋上にほぼ設定されている、日付を調整するための線を何というか。", choices:["日付変更線","本初子午線","赤道","回帰線"], a:0, e:"正解は「日付変更線」です。日付変更線は太平洋上にほぼ設定された線で、この線を境に日付が1日変わります。「本初子午線」は誤りで、これはイギリスを通る経度0度の基準線であり、日付変更線（ほぼ経度180度）とは位置が異なります。「赤道」は誤りで、これは緯度0度の基準線であり、日付を調整する線ではありません。「回帰線」は誤りで、これは太陽の位置に関する緯線であり、日付調整とは無関係です。"},
  {id:"geo257", cat:"地理", sub:"世界地理", q:"世界の三大洋に含まれないものはどれか。", choices:["地中海","太平洋","大西洋","インド洋"], a:0, e:"正解は「地中海」です。世界の三大洋は太平洋・大西洋・インド洋であり、地中海はこれらに比べて小さい「海」に分類されます。「太平洋」「大西洋」「インド洋」はいずれも誤り（正しい選択、つまり実際に三大洋に含まれる）で、これら三つがまさに世界の三大洋を構成する海洋です。"},
  {id:"geo259", cat:"地理", sub:"世界地理", q:"地球の表面をおおう、複数の巨大な岩盤が動いていることを説明する理論を何というか。", choices:["プレートテクトニクス","地動説","大陸移動説の別名","造山運動"], a:0, e:"正解は「プレートテクトニクス」です。プレートテクトニクスは地球の表面が複数のプレート（岩盤）でおおわれ、それらが動いているとする理論です。「地動説」は誤りで、これは地球が太陽の周りを回っているとする天文学上の説であり、地球表面のプレートの動きを説明する理論とは全く異なる分野です。「大陸移動説の別名」は誤りで、大陸移動説はプレートテクトニクスの先駆けとなった説ですが、両者は厳密には異なる理論であり単純な別名関係ではありません。「造山運動」は誤りで、これはプレートの動きの結果として起こる山地形成の現象を指す言葉であり、プレート運動全体を説明する理論そのものではありません。"},
  {id:"geo261", cat:"地理", sub:"世界地理", q:"ヨーロッパから中央アジアにかけて連なる、比較的新しい造山帯を何というか。", choices:["アルプス・ヒマラヤ造山帯","環太平洋造山帯","カレドニア造山帯","古期造山帯"], a:0, e:"正解は「アルプス・ヒマラヤ造山帯」です。アルプス・ヒマラヤ造山帯はヨーロッパから中央アジア、ヒマラヤにかけて連なる比較的新しい造山帯です。「環太平洋造山帯」は誤りで、これは太平洋を取り囲むように連なる造山帯であり、ヨーロッパから中央アジアにかけての造山帯とは位置が異なります。「カレドニア造山帯」は誤りで、これは北欧などに見られる古い造山帯であり、比較的新しいアルプス・ヒマラヤ造山帯とは形成時期が異なります。「古期造山帯」は誤りで、これは形成年代が古い造山帯全般を指す言葉であり、比較的新しいアルプス・ヒマラヤ造山帯とは対照的な分類です。"},
  {id:"geo263", cat:"地理", sub:"世界地理", q:"暖流と寒流のうち、赤道付近から高緯度に向かって流れる、水温の高い海流を何というか。", choices:["暖流","寒流","潮流のみ","海嶺流"], a:0, e:"正解は「暖流」です。暖流は赤道付近の暖かい海域から高緯度に向かって流れる、水温の高い海流です。「寒流」は誤りで、これは高緯度から低緯度に向かって流れる、水温の低い海流であり、暖流とは流れる方向・水温が逆です。「潮流のみ」は誤りで、これは潮の満ち引きによって生じる水の流れを指す言葉であり、海洋を流れる大規模な海流である暖流とは異なる現象です。「海嶺流」は誤りで、そのような一般的な用語は存在せず、誤った選択肢です。"},
  {id:"geo265", cat:"地理", sub:"世界地理", q:"中緯度地域で西から東へ吹く、大気の大きな流れを何というか。", choices:["偏西風","貿易風","季節風","極東風"], a:0, e:"正解は「偏西風」です。偏西風は中緯度地域で西から東へ吹く風で、日本の天気が西から変わる一因となっています。「貿易風」は誤りで、これは低緯度地域で東から西へ吹く風であり、偏西風とは吹く緯度・方向が異なります。「季節風」は誤りで、これは季節によって吹く方向が変わる風（モンスーン）であり、年間を通じて同じ方向に吹く偏西風とは性質が異なります。「極東風」は誤りで、これは極地方付近で吹く風を指す言葉であり、中緯度で吹く偏西風とは異なる地域の風です。"},
  {id:"geo267", cat:"地理", sub:"世界地理", q:"低緯度地域で東から西へ吹く、赤道に向かう風を何というか。", choices:["貿易風","偏西風","季節風","極東風"], a:0, e:"正解は「貿易風」です。貿易風は低緯度地域で東から西へ吹く風で、大航海時代には帆船の航海にも利用されました。「偏西風」は誤りで、これは中緯度地域で西から東へ吹く風であり、貿易風とは吹く緯度・方向が異なります。「季節風」は誤りで、これは季節によって風向きが変わる風であり、年間を通じてほぼ一定方向に吹く貿易風とは性質が異なります。「極東風」は誤りで、これは極地方で吹く風を指す言葉であり、低緯度で吹く貿易風とは地域が異なります。"},
  {id:"geo269", cat:"地理", sub:"世界地理", q:"アジアの季節風地域を指す言葉で、稲作が盛んな地域を何と呼ぶことがあるか。", choices:["モンスーンアジア","中央アジア","西アジア","北アジア"], a:0, e:"正解は「モンスーンアジア」です。モンスーンアジアは季節風（モンスーン）の影響を強く受ける東・東南・南アジアの地域を指し、稲作が盛んです。「中央アジア」は誤りで、これは内陸に位置し乾燥した気候が特徴の地域であり、モンスーンの影響が強いモンスーンアジアとは気候特性が異なります。「西アジア」は誤りで、これも乾燥した気候が特徴の地域であり、稲作が盛んなモンスーンアジアとは農業形態が異なります。「北アジア」は誤りで、これはシベリアなど寒冷な地域を指し、稲作に適したモンスーンアジアとは気候が大きく異なります。"},
  {id:"geo271", cat:"地理", sub:"世界地理", q:"サバナ気候に広がる、丈の長い草原と点在する樹木からなる植生を何というか。", choices:["サバナ","タイガ","ツンドラ","ステップ"], a:0, e:"正解は「サバナ」です。サバナはサバナ気候に見られる、丈の長い草原に樹木がまばらに生える植生です。「タイガ」は誤りで、これは冷帯（亜寒帯）地域に広がる針葉樹林であり、熱帯のサバナ気候の植生とは気候帯・樹種が異なります。「ツンドラ」は誤りで、これは寒帯に見られる、コケ類などが主体の植生であり、熱帯のサバナとは気候帯が全く異なります。「ステップ」は誤りで、これは乾燥帯に見られる丈の短い草原であり、サバナ（熱帯の丈の長い草原）とは気候帯・植生の特徴が異なります。"},
  {id:"geo273", cat:"地理", sub:"世界地理", q:"寒帯の一種で、夏だけ地表の氷がとけコケ類などが生育する気候を何というか。", choices:["ツンドラ気候","氷雪気候","サバナ気候","ステップ気候"], a:0, e:"正解は「ツンドラ気候」です。ツンドラ気候は寒帯の一種で、短い夏の間だけ地表の氷がとけ、コケ類などが生育します。「氷雪気候」は誤りで、これは一年中氷雪に覆われ植物がほとんど育たない、ツンドラ気候よりもさらに寒冷な気候です。「サバナ気候」は誤りで、これは熱帯に属する気候であり、寒帯のツンドラ気候とは気候帯が全く異なります。「ステップ気候」は誤りで、これは乾燥帯に属する気候であり、寒帯のツンドラ気候とは気候帯の分類が異なります。"},
  {id:"geo275", cat:"地理", sub:"世界地理", q:"冷帯（亜寒帯）地域に広がる、針葉樹を中心とした森林を何というか。", choices:["タイガ","サバナ","ステップ","マングローブ"], a:0, e:"正解は「タイガ」です。タイガは冷帯（亜寒帯）地域に広がる針葉樹中心の森林で、シベリアやカナダなどに見られます。「サバナ」は誤りで、これは熱帯に見られる草原であり、冷帯の針葉樹林であるタイガとは気候帯・植生が異なります。「ステップ」は誤りで、これは乾燥帯に見られる草原であり、これもタイガとは気候帯・植生が異なります。「マングローブ」は誤りで、これは熱帯・亜熱帯の河口や海岸に生育する樹林であり、冷帯のタイガとは気候帯が全く異なります。"},
  {id:"geo277", cat:"地理", sub:"世界地理", q:"乾燥地域で、水や草を求めて家畜とともに移動しながら生活する牧畜の形態を何というか。", choices:["遊牧","酪農","混合農業","企業的牧畜"], a:0, e:"正解は「遊牧」です。遊牧は乾燥地域や寒帯などで、家畜とともに水や牧草を求めて移動しながら生活する牧畜の形態です。「酪農」は誤りで、これは主に乳牛を飼育し乳製品を生産する、定住的な牧畜形態であり、移動を伴う遊牧とは異なります。「混合農業」は誤りで、これは穀物栽培と家畜飼育を組み合わせる農業形態であり、家畜とともに移動する遊牧とは性質が異なります。「企業的牧畜」は誤りで、これは大規模かつ商業的に行われる牧畜形態であり、伝統的な移動生活を特徴とする遊牧とは異なる形態です。"},
  {id:"geo279", cat:"地理", sub:"世界地理", q:"熱帯地域で、森林を焼き払い、その灰を肥料として作物を栽培する農法を何というか。", choices:["焼畑農業","二毛作","促成栽培","混合農業"], a:0, e:"正解は「焼畑農業」です。焼畑農業は熱帯地域で森林を焼き払い、その灰を肥料として一定期間作物を栽培する伝統的な農法です。「二毛作」は誤りで、これは同じ耕地で一年に二種類の作物を栽培する農法であり、森林を焼く焼畑農業とは全く異なる方法です。「促成栽培」は誤りで、これは温暖な気候などを利用して野菜の出荷時期を早める栽培方法であり、焼畑農業とは異なる農法です。「混合農業」は誤りで、これは穀物栽培と家畜飼育を組み合わせるヨーロッパなどの農業形態であり、焼畑農業とは地域・方法が異なります。"},
  {id:"geo281", cat:"地理", sub:"世界地理", q:"原料の産地に近い場所に工場を建設する立地の考え方を何というか。", choices:["原料立地","市場立地","労働力立地","臨海立地のみ"], a:0, e:"正解は「原料立地」です。原料立地は輸送コストを抑えるため、原料の産地に近い場所に工場を建設する立地の考え方です。「市場立地」は誤りで、これは製品を消費する市場に近い場所に工場を建てる考え方であり、原料の産地に近づく原料立地とは逆の視点です。「労働力立地」は誤りで、これは労働力が豊富で人件費の安い場所に立地する考え方であり、原料立地とは着目点が異なります。「臨海立地のみ」は誤りで、これは海に面した場所への立地を指す、より限定的な概念であり、原料立地の一般的な定義とは異なります。"},
  {id:"geo283", cat:"地理", sub:"世界地理", q:"製品の消費地に近い場所に工場を建設する立地の考え方を何というか。", choices:["市場立地","原料立地","労働力立地","臨海立地のみ"], a:0, e:"正解は「市場立地」です。市場立地は製品を消費する市場に近い場所に工場を建てることで、輸送費や需要への対応を有利にする考え方です。「原料立地」は誤りで、これは原料の産地に近い場所に工場を建てる考え方であり、消費地に近づく市場立地とは着目点が逆です。「労働力立地」は誤りで、これは人件費の安い労働力が豊富な場所への立地を指し、市場立地とは異なる視点です。「臨海立地のみ」は誤りで、これは海に面した場所への立地を指す限定的な概念であり、市場立地の一般的な定義とは異なります。"},
  {id:"geo285", cat:"地理", sub:"世界地理", q:"インドのベンガルールなどで発展している、コンピューターに関連する産業を何というか。", choices:["情報通信技術（ICT）産業","繊維産業","製鉄業","造船業"], a:0, e:"正解は「情報通信技術（ICT）産業」です。インドのベンガルールなどでは、英語力や技術者の豊富さを背景に情報通信技術（ICT）産業が発展しています。「繊維産業」は誤りで、これはインドの伝統的な産業の一つですが、ベンガルールの発展を特に象徴する産業とはいえません。「製鉄業」は誤りで、これも重工業の一分野ですが、ベンガルールの発展を象徴する産業ではありません。「造船業」は誤りで、これも同様にベンガルールの主要な発展産業とはいえません。"},
  {id:"geo287", cat:"地理", sub:"世界地理", q:"自然や文化的な資源を生かし、旅行者を受け入れることで成り立つ産業を何というか。", choices:["観光産業","第一次産業","重工業","軽工業"], a:0, e:"正解は「観光産業」です。観光産業は自然景観や歴史的文化財などの資源を生かし、国内外からの旅行者を受け入れることで成り立つ産業です。「第一次産業」は誤りで、これは農業・林業・漁業など、自然から直接資源を得る産業を指す分類であり、観光産業とは異なる産業分類です。「重工業」は誤りで、これは鉄鋼や機械などを生産する工業を指し、観光産業とは全く異なる分野です。「軽工業」は誤りで、これは繊維や食品加工など比較的軽い製品を作る工業を指し、観光産業とは異なる分野です。"},
  {id:"geo289", cat:"地理", sub:"世界地理", q:"世界で信者数が最も多いとされる宗教はどれか。", choices:["キリスト教","仏教","イスラム教","ヒンドゥー教"], a:0, e:"正解は「キリスト教」です。世界の宗教人口では、キリスト教が最も信者数が多いとされています。「仏教」は誤りで、これも世界的な宗教ですが、信者数ではキリスト教やイスラム教には及びません。「イスラム教」は誤りで、これも信者数の多い宗教として知られますが、統計上キリスト教が最多とされることが一般的です。「ヒンドゥー教」は誤りで、これは主にインドを中心に信仰される宗教であり、世界全体の信者数ではキリスト教には及びません。"},
  {id:"geo291", cat:"地理", sub:"世界地理", q:"インドで多数を占める、牛を神聖視するなどの特徴を持つ宗教は何か。", choices:["ヒンドゥー教","イスラム教","仏教","キリスト教"], a:0, e:"正解は「ヒンドゥー教」です。ヒンドゥー教はインドで多数を占める宗教で、牛を神聖な動物として扱う考え方が特徴の一つです。「イスラム教」は誤りで、これもインドに一定の信者がいますが、多数派を占めるのはヒンドゥー教です。「仏教」は誤りで、これはインドで生まれた宗教ですが、現在のインドでは信者数が比較的少なく、多数派はヒンドゥー教です。「キリスト教」は誤りで、これもインドに一定の信者がいますが、多数派を占める宗教ではありません。"},
  {id:"geo293", cat:"地理", sub:"日本地理", q:"少子高齢化が進んだ社会で見られる、若年層が少なく高齢層が多い人口ピラミッドの型を何というか。", choices:["つぼ型","富士山型","つりがね型","星型"], a:0, e:"正解は「つぼ型」です。つぼ型は少子高齢化が進んだ社会に見られる人口ピラミッドの型で、若年層が少なく高齢層の割合が高いのが特徴です。「富士山型」は誤りで、これは出生率・死亡率がともに高い多産多死型の社会に見られる型であり、少子高齢化社会のつぼ型とは正反対の形状です。「つりがね型」は誤りで、これはつぼ型に至る前段階の、出生率・死亡率がともに低下し始めた型であり、より進んだ少子高齢化を示すつぼ型とは段階が異なります。「星型」は誤りで、これは都市部などで生産年齢人口の流入により特徴的な形になる型であり、少子高齢化社会全体を示すつぼ型とは異なる概念です。"},
  {id:"geo295", cat:"地理", sub:"日本地理", q:"多産多死型の社会に見られる、下の年齢層ほど幅が広い人口ピラミッドの型を何というか。", choices:["富士山型","つぼ型","つりがね型","星型"], a:0, e:"正解は「富士山型」です。富士山型は出生率・死亡率がともに高い多産多死型の社会に見られ、若年層の割合が高い人口ピラミッドです。「つぼ型」は誤りで、これは少子高齢化が進んだ社会に見られる型であり、多産多死型の富士山型とは正反対の形状です。「つりがね型」は誤りで、これは出生率・死亡率がともに低下し人口増加が停滞し始めた型であり、多産多死型の富士山型とは段階が異なります。「星型」は誤りで、これは都市部特有の型であり、社会全体の多産多死の状況を示す富士山型とは異なる概念です。"},
  {id:"geo297", cat:"地理", sub:"世界地理", q:"複数の国の間で関税を撤廃し、自由な貿易を目指す協定を何というか。", choices:["自由貿易協定（FTA）","独占禁止法","モノカルチャー","フェアトレード"], a:0, e:"正解は「自由貿易協定（FTA）」です。自由貿易協定（FTA）は複数の国や地域の間で関税などの貿易障壁を撤廃し、自由な貿易を目指す協定です。「独占禁止法」は誤りで、これは国内における企業間の公正な競争を確保するための法律であり、国家間の貿易協定であるFTAとは全く異なる分野です。「モノカルチャー」は誤りで、これは特定の一次産品に依存する経済構造を指す言葉であり、貿易協定を指すFTAとは異なる概念です。「フェアトレード」は誤りで、これは公正な対価を支払う貿易の仕組みを指す言葉であり、関税撤廃を目的とするFTAとは異なる概念です。"},
  /* 公民 */
  {id:"civ249", cat:"公民", sub:"国際関係", q:"独立した主権を持ち、国民・領域とともに国家を成り立たせる要素の一つを何というか。", choices:["主権","条例","内閣","国政調査権"], a:0, e:"正解は「主権」です。主権は国家が他国の干渉を受けずに自国のことを決定できる権限で、国民・領域とともに国家の三要素の一つです。「条例」は誤りで、これは地方公共団体が定めるきまりであり、国家の要素を指す主権とは異なる概念です。「内閣」は誤りで、これは行政を担う国の機関であり、国家の三要素の一つである主権とは異なるレベルの概念です。「国政調査権」は誤りで、これは国会が持つ特定の権限であり、国家の成立要素である主権とは異なります。"},
  {id:"civ251", cat:"公民", sub:"国際関係", q:"国家間の関係を規律する、条約や国際慣習法などからなるきまりを何というか。", choices:["国際法","国内法","条例","政令"], a:0, e:"正解は「国際法」です。国際法は国家間の関係を規律するためのきまりで、条約や国際慣習法などから成り立っています。「国内法」は誤りで、これは一国の中で適用される法であり、国家間の関係を規律する国際法とは適用範囲が異なります。「条例」は誤りで、これは地方公共団体が定める、その地域限定のきまりであり、国家間の関係を扱う国際法とは規模・性質が異なります。「政令」は誤りで、これは内閣が法律を実施するために制定する命令であり、国内の行政に関するものであって、国際法とは異なります。"},
  {id:"civ253", cat:"公民", sub:"政治体制", q:"内閣の主な仕事に含まれないものはどれか。", choices:["法律の制定","条約の締結","予算の作成","政令の制定"], a:0, e:"正解は「法律の制定」です。法律の制定は国会の仕事であり、内閣は条約の締結や予算の作成、政令の制定などを行います。「条約の締結」は誤りで、これは実際に内閣の仕事に含まれるものであり、内閣の主な仕事の一つです。「予算の作成」は誤りで、これも実際に内閣が行う仕事であり、内閣の重要な役割の一つです。「政令の制定」は誤りで、これも内閣が法律を実施するために行う仕事であり、内閣の仕事に含まれます。"},
  {id:"civ255", cat:"公民", sub:"政治体制", q:"毎年1月に召集され、主に次年度の予算などを審議する国会を何というか。", choices:["通常国会","臨時国会","特別国会","参議院の緊急集会"], a:0, e:"正解は「通常国会」です。通常国会（常会）は毎年1月に召集され、主に次年度の予算などを審議する国会です。「臨時国会」は誤りで、これは内閣が必要と認めたときなどに召集される国会であり、毎年1月に定例的に召集される通常国会とは性質が異なります。「特別国会」は誤りで、これは衆議院解散後の総選挙後に召集される国会であり、毎年定例で開かれる通常国会とは異なります。「参議院の緊急集会」は誤りで、これは衆議院解散中に緊急の必要がある場合に開かれる特別な集会であり、通常国会とは全く異なる仕組みです。"},
  {id:"civ257", cat:"公民", sub:"政治体制", q:"内閣が必要と認めたときなどに召集される、通常国会以外の国会を何というか。", choices:["臨時国会","通常国会","特別国会","参議院の緊急集会"], a:0, e:"正解は「臨時国会」です。臨時国会（臨時会）は内閣が必要と認めたときや、いずれかの議院の総議員の4分の1以上の要求があったときに召集されます。「通常国会」は誤りで、これは毎年1月に定例的に召集される国会であり、必要に応じて召集される臨時国会とは召集のタイミングが異なります。「特別国会」は誤りで、これは衆議院解散後の総選挙後に召集される国会であり、臨時国会とは召集の契機が異なります。「参議院の緊急集会」は誤りで、これは衆議院解散中に限定される特別な集会であり、臨時国会とは異なる仕組みです。"},
  {id:"civ259", cat:"公民", sub:"政治体制", q:"衆議院の解散後に行われる総選挙の日から30日以内に召集される国会を何というか。", choices:["特別国会","通常国会","臨時国会","参議院の緊急集会"], a:0, e:"正解は「特別国会」です。特別国会（特別会）は衆議院の解散にともなう総選挙後30日以内に召集され、内閣総理大臣の指名などが行われます。「通常国会」は誤りで、これは毎年1月に定例で召集される国会であり、解散総選挙後に限って召集される特別国会とは性質が異なります。「臨時国会」は誤りで、これは内閣の判断などにより随時召集される国会であり、解散総選挙後という特定の契機で召集される特別国会とは異なります。「参議院の緊急集会」は誤りで、これは衆議院解散中に緊急の必要がある場合に開かれるものであり、特別国会とは異なる仕組みです。"},
  {id:"civ261", cat:"公民", sub:"政治体制", q:"国や地方公共団体の情報を、国民や住民の請求に応じて開示する制度を何というか。", choices:["情報公開制度","知る権利のみ","秘密保持制度","国政調査権"], a:0, e:"正解は「情報公開制度」です。情報公開制度は国や地方公共団体が保有する情報を、国民や住民の請求に応じて開示する制度です。「知る権利のみ」は誤りで、知る権利は情報公開制度の背景にある理念的な権利であり、制度そのものを指す言葉ではありません。「秘密保持制度」は誤りで、これは情報公開制度とは正反対の、情報を守秘するための考え方を指す言葉です。「国政調査権」は誤りで、これは国会が行政を調査する権限であり、国民や住民が情報開示を請求する情報公開制度とは主体・仕組みが異なります。"},
  {id:"civ263", cat:"公民", sub:"政治体制", q:"行政に対する苦情を受け付け、中立的な立場から調査・改善を促す制度や役職を何というか。", choices:["オンブズマン制度","国政調査権","弾劾裁判所","国民審査"], a:0, e:"正解は「オンブズマン制度」です。オンブズマン制度は行政に対する苦情を受け付け、中立的な立場から調査し、改善を促す仕組みです。「国政調査権」は誤りで、これは国会が持つ行政調査の権限であり、独立した第三者的な立場から苦情を扱うオンブズマン制度とは主体・仕組みが異なります。「弾劾裁判所」は誤りで、これは裁判官を辞めさせるかどうかを審理する国会の機関であり、行政全般への苦情を扱うオンブズマン制度とは対象が異なります。「国民審査」は誤りで、これは最高裁判所裁判官の適否を国民が審査する制度であり、行政への苦情処理とは異なります。"},
  {id:"civ265", cat:"公民", sub:"法律", q:"消費者が事業者と結ぶ契約について、不当な勧誘による契約の取り消しなどを定めた法律は何か。", choices:["消費者契約法","製造物責任法","独占禁止法","労働基準法"], a:0, e:"正解は「消費者契約法」です。消費者契約法は事業者の不当な勧誘によって結ばれた契約を、消費者が取り消せることなどを定めた法律です。「製造物責任法」は誤りで、これは欠陥商品による被害の責任を製造者に問う法律であり、契約の取り消しを定める消費者契約法とは対象が異なります。「独占禁止法」は誤りで、これは企業間の公正な競争を確保する法律であり、消費者と事業者の契約に関する消費者契約法とは分野が異なります。「労働基準法」は誤りで、これは労働条件の最低基準を定める法律であり、消費者契約とは全く異なる分野です。"},
  {id:"civ267", cat:"公民", sub:"労働・法律", q:"仕事と私生活の調和を図るという考え方を何というか。", choices:["ワーク・ライフ・バランス","フェアトレード","バリアフリー","ユニバーサルデザイン"], a:0, e:"正解は「ワーク・ライフ・バランス」です。ワーク・ライフ・バランスは仕事と私生活（家庭生活など）の調和を図ろうとする考え方です。「フェアトレード」は誤りで、これは公正な貿易の仕組みを指す言葉であり、仕事と生活の調和とは異なる分野の概念です。「バリアフリー」は誤りで、これは高齢者や障がいのある人の生活上の障壁を取り除く考え方であり、ワーク・ライフ・バランスとは異なるテーマです。「ユニバーサルデザイン」は誤りで、これは誰もが使いやすい製品や施設の設計に関する考え方であり、仕事と生活の調和とは異なります。"},
  {id:"civ269", cat:"公民", sub:"労働・法律", q:"パートタイマーや派遣社員など、雇用期間や労働時間が正社員と異なる働き方を何というか。", choices:["非正規雇用","終身雇用","年功序列","正規雇用"], a:0, e:"正解は「非正規雇用」です。非正規雇用はパートタイマーや派遣社員、契約社員など、雇用期間や労働時間が正社員と異なる働き方の総称です。「終身雇用」は誤りで、これは一つの企業に定年まで雇用され続ける、正社員に典型的な雇用のあり方であり、非正規雇用とは対照的な形態です。「年功序列」は誤りで、これは勤続年数に応じて賃金や地位が上がる制度であり、雇用形態そのものを指す非正規雇用とは異なる概念です。「正規雇用」は誤りで、これは非正規雇用とは反対の、雇用期間の定めのない安定的な雇用形態を指します。"},
  {id:"civ271", cat:"公民", sub:"経済", q:"企業が株式や社債を発行して、貸し手から直接資金を調達する方法を何というか。", choices:["直接金融","間接金融","財政政策","金融政策"], a:0, e:"正解は「直接金融」です。直接金融は企業が株式や社債を発行し、投資家などから直接資金を調達する方法です。「間接金融」は誤りで、これは銀行などの金融機関を仲立ちとして資金を調達する方法であり、投資家から直接調達する直接金融とは仕組みが異なります。「財政政策」は誤りで、これは政府が税金や公共支出を通じて経済を調整する政策であり、企業の資金調達方法である直接金融とは異なる概念です。「金融政策」は誤りで、これは中央銀行が金利などを通じて経済を調整する政策であり、これも企業の資金調達手段とは異なります。"},
  {id:"civ273", cat:"公民", sub:"経済", q:"企業が銀行からお金を借りるなど、金融機関を仲立ちとして資金を調達する方法を何というか。", choices:["間接金融","直接金融","財政政策","金融政策"], a:0, e:"正解は「間接金融」です。間接金融は銀行などの金融機関を仲立ちとして、企業が資金を調達する方法です。「直接金融」は誤りで、これは株式や社債の発行により投資家から直接資金を調達する方法であり、金融機関を介する間接金融とは仕組みが異なります。「財政政策」は誤りで、これは政府による経済調整策であり、企業の資金調達方法である間接金融とは異なる概念です。「金融政策」は誤りで、これは中央銀行による経済調整策であり、これも間接金融とは異なります。"},
  {id:"civ275", cat:"公民", sub:"経済", q:"株式を売買する場として設けられている市場を何というか。", choices:["証券取引所","中央銀行","為替市場のみ","労働市場"], a:0, e:"正解は「証券取引所」です。証券取引所は株式や債券などを売買するための市場で、東京証券取引所などが代表例です。「中央銀行」は誤りで、これは通貨や金融政策を担う機関であり、株式売買の場である証券取引所とは役割が異なります。「為替市場のみ」は誤りで、これは通貨の売買が行われる市場であり、株式を扱う証券取引所とは対象とする商品が異なります。「労働市場」は誤りで、これは労働力の需給が調整される場を指す概念的な言葉であり、株式取引の場である証券取引所とは全く異なります。"},
  {id:"civ277", cat:"公民", sub:"経済", q:"日本銀行が持つ、政府から独立して金融政策を行うことができる性質を何というか。", choices:["中央銀行の独立性","財政の独立性","司法権の独立","地方自治の独立"], a:0, e:"正解は「中央銀行の独立性」です。中央銀行の独立性は、日本銀行が政府から一定の独立性を保ちながら金融政策を行えることを指します。「財政の独立性」は誤りで、これは財政政策に関する独立性を指す言葉として一般的ではなく、金融政策における独立性を指す本問の趣旨とは異なります。「司法権の独立」は誤りで、これは裁判所が他の権力から独立して裁判を行うことを指す原則であり、中央銀行の独立性とは対象が異なります。「地方自治の独立」は誤りで、これは地方公共団体の自治に関する概念であり、中央銀行の独立性とは異なる分野です。"},
  {id:"civ279", cat:"公民", sub:"経済", q:"為替相場を安定させるために、政府や中央銀行が外国為替市場で通貨を売買することを何というか。", choices:["為替介入","財政政策","金融緩和のみ","公開市場操作のみ"], a:0, e:"正解は「為替介入」です。為替介入は為替相場の急激な変動を抑えるため、政府や中央銀行が外国為替市場で通貨の売買を行うことです。「財政政策」は誤りで、これは政府が税金や公共支出を通じて経済を調整する政策であり、為替相場に直接働きかける為替介入とは手段が異なります。「金融緩和のみ」は誤りで、これは金利を下げるなどして通貨供給を増やす政策であり、為替市場での直接的な通貨売買を指す為替介入とは異なる手段です。「公開市場操作のみ」は誤りで、これは中央銀行が国債などを売買して金融市場を調整する手法であり、外国為替市場での介入とは対象市場が異なります。"},
  {id:"civ281", cat:"公民", sub:"経済", q:"自国の産業を守るため、輸入品に高い関税をかけるなどの貿易政策を何というか。", choices:["保護貿易","自由貿易","加工貿易","公正貿易"], a:0, e:"正解は「保護貿易」です。保護貿易は自国の産業を守るため、輸入品に高い関税を課したり、輸入量を制限したりする貿易政策です。「自由貿易」は誤りで、これは関税などの貿易障壁をできるだけなくす政策であり、保護貿易とは正反対の方向性です。「加工貿易」は誤りで、これは原料を輸入し製品に加工して輸出する貿易形態を指す言葉であり、貿易政策の方向性を示す保護貿易とは異なる概念です。「公正貿易」は誤りで、これは一般的にフェアトレードなど公正な取引条件を指す言葉として使われ、保護貿易とは異なる文脈の概念です。"},
